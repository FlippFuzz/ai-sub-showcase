  overall_summary: This video is Natsuiro Matsuri's birthday 3D live concert titled
    '#夏色FullBloom', streamed on November 1, 2024. The concert features a seasonal
    theme transitioning through Summer, Autumn/Halloween, Winter, Spring, and back
    to Summer, showcasing various musical performances, guest appearances from fellow
    Hololive members (Aki Rosenthal, Shirakami Fubuki, Momosuzu Nene, and AZKi), interactive
    MC segments, and the premiere of her new original song 'Endless Fes' produced
    by FAKE TYPE.
