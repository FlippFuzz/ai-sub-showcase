  thoughts: |+
    **A Birthday Celebration and New Merch!**

    Okay, so I was thinking, I can sneakily talk while walking, and no one will notice… but, uh, I got caught. It’s embarrassing! But as you know, I have this, tada! It's Natsuiro Matsuri's Birthday Commemoration 2021, and I'm selling a body pillow cover and an SNS-style acrylic keychain! Yay!

    Here's the whole thing, look! I want to show it off, so, the body pillow has a front and back; I'll show a bigger one later. The illustration is by Ceramic-sensei, who always helps me. This design is super cute! The front is inviting, and the back is a bit teary-eyed, so get it!

    Then, there's the acrylic keychain! It looks like you are looking at SNS. It's a dolphin, cute, right? It was supposed to be a killer whale, but they were too popular, so now it's a dolphin; Fish, Dolphin. If you go out with this, hold your smartphone up, snap a picture, it's like a date!

    There's a hashtag, "Natsuiro Date". Tweet with it, and I'll send a reply saying the date was fun! Unless your account is private. I'd love to! Voice packs are also a bonus! A perfect voice for the keychain and a birthday-ish one!

    So, the goods will be on sale from 22:00, or so. Check them out! Now, time is running out, but did you enjoy today? Later at 22:30, a premiere will be released! What video? I'm excited! The live is a bit unfortunate but, at the very end...

    Shall I sing a bit? Upsy-daisy! It's your turn, mic—ah, it's here. I'm singing a song I want you to hear! From 22:30, a short version will go up, so watch it! Follow me! Birthdays never end! So listen up, Hi-Hi, High Tension!

    Now, the song: Bloom a dazzling smile, sing and dance! Shoot the whole Earth! Let's start the ultimate festival! Hi-Hi High Tension! Always my own pace, now is when safety is the protagonist, on-site flight, transcending dimensions too. If I pile up memories with you, toward a new future. Ah, even if I can't see, it gets across. Like colorful dream fireworks shooting up, exciting! The curtain opens...


