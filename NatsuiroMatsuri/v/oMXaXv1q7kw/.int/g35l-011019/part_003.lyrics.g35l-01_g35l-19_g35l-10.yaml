  original: きっと、約束は忘れてないからね、大丈夫！
  english: Surely, we haven't forgotten the promise, it's alright!
- start: '04:26.780'
  end: '04:29.820'
  original: がっちゃんこ、明日もお殿様がせめう！
  english: Gatchanko, tomorrow too the lord will attack, Meu!
- start: '04:30.340'
  end: '04:36.140'
  original: あのね、ちくわからちくわを抜いてる人がいたんだよ！もはやただのパフェめう！むしろカニだって楽しいね！
  english: You know, there was someone pulling chikuwa out of chikuwa! At this point
    it's just a parfait, Meu! Rather, crab is fun too!
- start: '04:36.420'
  end: '04:40.400'
  original: それはレシピの聞きすぎだよ！慌てないめう！落ち着いてちくわを数えるめう！
  english: That's listening to the recipe too much! Don't panic, Meu! Calm down and
    count the chikuwa, Meu!
- start: '04:40.820'
  end: '04:52.220'
  original: ちくパちくパちくぱちくぱちくぱよちくパ！ ちくパちくパのちくぱちくぱちくぱやちくちくわ！ちくちくわ！ちくちくちくわ！ちくちくわ！ちくちくちくわ！ちくちくわ！
  english: Chikupa chikupa... (chikuwa chant continuation)
- start: '04:52.680'
  end: '04:55.200'
  original: ねう、ちくわがないめう！大丈夫だよ、さっき私がねう食べておいたんだよ！
  english: Meu, there's no chikuwa, Meu! It's alright, I ate it earlier, Meu!
- start: '04:55.200'
  end: '04:59.040'
  original: まだまだないめう！ちくわがないなら…
  english: Still none, Meu! If there's no chikuwa...
