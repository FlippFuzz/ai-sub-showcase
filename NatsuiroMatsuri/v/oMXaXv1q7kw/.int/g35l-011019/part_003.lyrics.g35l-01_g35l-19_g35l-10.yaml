  - term: E缶 (E-Can)
    meaning: Energy Tank item from the Mega Man (Rockman) series, referenced in 'Airman
      ga Taosenai' as a vital item saved for boss fights.
  - term: ぺたぺた (Peta Peta)
    meaning: Internet slang and running gag associated with flat chests or stamp motifs,
