global_summary:
  overall_summary: This video is Natsuiro Matsuri's 2026 Birthday 3D Live titled '【
    3DLIVE 】速報！夏色まつり古神曲ライブ~ktkr(ﾟ∀ﾟ)視聴キボンヌ~', celebrating her birthday with a nostalgic
    net-culture and classic legendary songs ('koshinkyoku') theme. Featuring high-energy
    denpa songs, nostalgic internet anthems, and dynamic choreography, the stream
    includes special guest performances and banter with Hololive and ReGLOSS members
    Houshou Marine, Aozora Riona, Momosuzu Nene, Shiranui Flare, and Mori Calliope,
    concluding with major birthday merchandise announcements and a new logo reveal.
