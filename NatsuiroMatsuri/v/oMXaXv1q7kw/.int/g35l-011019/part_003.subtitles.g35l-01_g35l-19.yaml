  - term: 古神曲 (Koshinkyoku)
    meaning: Classic legendary songs or nostalgic internet/vocaloid/denpa tracks from
      the early days of Japanese video sharing sites like Nico Nico Douga.
  - term: E缶 (E-Can)
    meaning: Energy Tank item from the Mega Man (Rockman) series, referenced in 'Airman
      ga Taosenai' as a vital item saved for boss fights.
  - term: ぺたぺた (Peta Peta)
    meaning: Internet slang and running gag associated with flat chests or stamp motifs,
      frequently referenced in denpa songs and Matsuri's gags.
  - term: お祭りわっしょい (Omaturi Wasshoi)
    meaning: Natsuiro Matsuri's signature catchphrase and rallying cry used to greet
      fans and close streams.
