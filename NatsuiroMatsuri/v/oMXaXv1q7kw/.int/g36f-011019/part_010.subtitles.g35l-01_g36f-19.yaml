global_summary:
  overall_summary: This YouTube livestream features Natsuiro Matsuri's 3D Birthday
    Live concert titled '古神曲ライブ' (Classic Legendary Songs Live), themed around nostalgic
    net-culture and early 2000s otaku/internet hits (Niconico-era classics). Alongside
    solo performances of her new original song 'せんしゅセンセーション' and classic internet
    anthems like 'エアーマンが倒せない', Matsuri is joined by various Hololive and guest virtual
    artists including Houshou Marine, Tokoyami Towa, Momosuzu Nene, Mori Calliope,
    Hakos Baelz, Kazama Iroha, and Riona Hibiki. The stream includes energetic dance
    numbers, MC segments, birthday merchandise announcements, and the reveal of her
    new official channel logo.
