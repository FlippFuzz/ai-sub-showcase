global_summary:
  overall_summary: This video is Natsuiro Matsuri's 3D Birthday / Anniversary live
    stream titled '【 3DLIVE 】速報！夏色まつり古神曲ライブ~ktkr(ﾟ∀ﾟ)視聴キボンヌ~', celebrating 2000s Nico
    Nico Douga and internet early-era legendary songs and memes. The stream features
    high-energy vocal and dance performances by Natsuiro Matsuri, along with guest
    appearances and duets/trios with Hololive members Houshou Marine, Asagiri Riona,
    Momosuzu Nene, Shiranui Flare, and Mori Calliope. Throughout the event, Matsuri
    engages fans with humorous MC segments, sketch comedy, birthday goods announcements,
    a new original song release, and a brand-new official logo reveal, concluding
    with her signature 'Matsuri Wasshoi' send-off.
