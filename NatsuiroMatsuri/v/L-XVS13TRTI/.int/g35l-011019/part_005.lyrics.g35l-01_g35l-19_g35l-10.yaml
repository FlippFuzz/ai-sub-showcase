    Okay, so here's what I'm piecing together. This looks like a detailed breakdown of a Natsuiro Matsuri stream, likely a birthday or anniversary event given the announcements. The initial data gives us a guest artist lineup: AZKi, Himemori Luna, and Ichijou Ririka who were on "`サクラあっぱれーしょん` / `パピプペポップ`". Then Hakui Koyori, Hakos Baelz, and Kobo Kanaeru for "`逃げない!!`".

