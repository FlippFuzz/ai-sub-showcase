    **Analyzing the Song List from Matsuri's Birthday Stream**

    Okay, let's break down this song list from the birthday stream. First, I need to verify each song and the artists.

    *   **"サクラあっぱれーしょん" (Sakura Apparation)**: The performance with Natsuiro Matsuri, AZKi, Himemori Luna, and Ririka is interesting. I know it's a cover of でんぱ組.inc (Dempagumi.inc), so I'll keep that artist as the original.
    *   **"逃げない!!" (Nigenai!!)**: Matsuri's rendition looks like it features Hakos Baelz, Kobo Kanaeru, and Hakui Koyori. A quick search should confirm that the original artist is ゆるめるモ! (Yurufuwa Mellow / Yurumerumo!).
    *   **"とくべチュ、して" (Tokubechu, Shite)**: This is straightforward; it's Natsuiro Matsuri's cover of an =LOVE song. No issues there.
    *   **"パッピプッペポー" / "パピプペポップ" (Pappipuppepo / Papipupe Pop)**: This one needs further investigation. Matsuri, AZKi, Himemori Luna, and Ririka are performing it, but I need to pinpoint the original artist. I'll search specifically for "パピプペポップ" to confirm.
    *   **"現役アイドルちゅ～" (Geneki Idol Chu~)**: I'll need to double-check this as well. Matsuri is performing this one. I'll search for this song and see who the original artist is, HoneyWorks, Shylph or Monolith or a combination perhaps.
    *   **"恋のSOS" (Koi no SOS)**: This one seems straightforward. Matsuri solo.
    *   **"夢見る空へ" / "夢見る空" / "キラめきになれ" (Yume Miru Sora)**: Need to clarify exactly which version it is, whether it's an original or cover, and verify the exact title.
    *   **"うにゃかニャニャニャン" / "ウーニャカ" (Unyaka)**: Ah, Matsuri's new original from her first album! Kairiki Bear is listed as the composer, so I can confirm that. (川井リカ美央?).

