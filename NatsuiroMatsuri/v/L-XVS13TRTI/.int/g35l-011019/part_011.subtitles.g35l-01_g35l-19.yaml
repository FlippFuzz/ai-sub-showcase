  - |-
    Okay, here's my plan of attack.

    **Analyzing Matsuri's 2025 Birthday Stream**

    Alright, I've got `video_1.webm`, the video for Matsuri's birthday stream, specifically `【 #夏色まつり誕生祭2025 】重大告知あり！アイドル革命進行中！～今日の主役は夢の途中～　【ホロライブ/夏色まつり】`. This looks like a promising stream. To get a handle on this, the first thing I need to do is load the transcript. I want a comprehensive overview of the event. I need to know the flow of the stream – the major events, who shows up, when the songs are performed, the timestamps of key announcements, etc. So, I'll use the `load_video` function, but it is *critical* that I include the ASR data. I'll make sure that `include_asr` is set to `true`. With that, I'll have a solid foundation for further analysis.
  - |-
    **Analyzing the Video and ASR Transcript**

    Okay, let's dive into this video. It's a bit over an hour long, so I need to be efficient. The ASR transcript covers the whole video, which is great. My immediate focus is to map out the structure – find the chapters and, most importantly, the songs.

    First, I'm checking the initial ASR data. The plan is to thoroughly inspect the transcript, meticulously mapping out the content by timecodes. The goal is to identify song titles and their respective timestamps.

    The ASR indicates a potential intro or pre-stream from 00:00 to 04:21, but I need to investigate what's happening from 00:00 to 13:11, as the music seems to start at 00:12. Now, I see the first song kicks in at 04:21. The ASR provides some lyrics: "世界一かわいい 宇宙一かわいい もっともっと聞かせて..." But, hold on a minute! No web searches for lyrics. That's a good reminder. I need to rely on on-screen text, announcements, or my own knowledge for the song titles.

    I need to confirm the song titles and timestamps. Specifically, let's explore this first song at 04:21. Is this a collaboration?

    Now, I'm remembering something Matsuri said around the 33:32 mark: "まずサクラアップエディションはあずきとるーなちゃんとうーなちゃんに... あずきとるーなちゃんとリリカに出てもらいました。" This implies a song titled "サクラアップエディション" performed with Azki, Luna, and Ririka. Does this match with the first song at 04:21? Or is "サクラアップエディション" a broader category? Is it possible that this is a Hololive song or related to "サクラハッピーエディション"? Let's search for Matsuri's birthday setlist and see.
    Let's search `#夏色まつり誕生祭2025` setlist.
  - |-
    **Analyzing the Video Structure and Timestamps**

    Okay, let's break this down. First, I need to get a handle on the video's structure. I'm going to start by analyzing the timestamps and how they relate to the ASR transcript. The initial segment, from 00:00 to 04:21, seems suspect. The ASR data for this period – a waiting screen and test audio – suggests it's likely filler. I'll need to verify this by checking what's *actually* displayed on screen during that time. Perhaps there's background music or a visual element that the ASR missed, or it's just placeholder audio. Ah, finally! It appears the actual concert content starts at 04:21! Now to find out what that first song is. The ASR transcript reads something like "世界一かわいい 宇宙一かわいい もっともっと聞かせて..." which sounds like it could be "世界一可愛い私" (Sekai Ichi Kawaii Watashi) or something similar. I need to confirm the song. I'll need a way to build out the full setlist. I'll search for the full setlist for the concert, possibly using the hashtag `#夏色まつり誕生祭2025`. I'll try to find any song names mentioned in either the ASR or the YouTube description to make sure I get a good picture. A search for `"夏色まつり誕生祭2025" setlist` seems like a good starting point.
  - |-
    **Analyzing the Song List from Matsuri's Birthday Stream**

    Okay, let's break down this song list from the birthday stream. First, I need to verify each song and the artists.

    *   **"サクラあっぱれーしょん" (Sakura Apparation)**: The performance with Natsuiro Matsuri, AZKi, Himemori Luna, and Ririka is interesting. I know it's a cover of でんぱ組.inc (Dempagumi.inc), so I'll keep that artist as the original.
    *   **"逃げない!!" (Nigenai!!)**: Matsuri's rendition looks like it features Hakos Baelz, Kobo Kanaeru, and Hakui Koyori. A quick search should confirm that the original artist is ゆるめるモ! (Yurufuwa Mellow / Yurumerumo!).
    *   **"とくべチュ、して" (Tokubechu, Shite)**: This is straightforward; it's Natsuiro Matsuri's cover of an =LOVE song. No issues there.
    *   **"パッピプッペポー" / "パピプペポップ" (Pappipuppepo / Papipupe Pop)**: This one needs further investigation. Matsuri, AZKi, Himemori Luna, and Ririka are performing it, but I need to pinpoint the original artist. I'll search specifically for "パピプペポップ" to confirm.
    *   **"現役アイドルちゅ～" (Geneki Idol Chu~)**: I'll need to double-check this as well. Matsuri is performing this one. I'll search for this song and see who the original artist is, HoneyWorks, Shylph or Monolith or a combination perhaps.
    *   **"恋のSOS" (Koi no SOS)**: This one seems straightforward. Matsuri solo.
    *   **"夢見る空へ" / "夢見る空" / "キラめきになれ" (Yume Miru Sora)**: Need to clarify exactly which version it is, whether it's an original or cover, and verify the exact title.
    *   **"うにゃかニャニャニャン" / "ウーニャカ" (Unyaka)**: Ah, Matsuri's new original from her first album! Kairiki Bear is listed as the composer, so I can confirm that. (川井リカ美央?).

    To solidify this further and cross-reference, I should conduct a targeted search for a "夏色まつり誕生祭2025 歌唱楽曲一覧" on the Hololive Non-official Wiki or similar, to be absolutely certain I have accurate data on all titles and artists. This should be a quick check.
  - |-
    **Analyzing the Hololive Stream Details**

    Okay, so here's what I'm piecing together. This looks like a detailed breakdown of a Natsuiro Matsuri stream, likely a birthday or anniversary event given the announcements. The initial data gives us a guest artist lineup: AZKi, Himemori Luna, and Ichijou Ririka who were on "`サクラあっぱれーしょん` / `パピプペポップ`". Then Hakui Koyori, Hakos Baelz, and Kobo Kanaeru for "`逃げない!!`".

    Now, let's nail down the chapters and song placements. Chapter 1 is the usual opening and pre-stream stuff, nothing interesting there. Chapter 2 is the MC greeting, setting the "Idol Revolution" theme.

    Chapter 3 is the juicy bit: the guest performances. The first song is clearly "サクラあっぱれーしょん" (Sakura Apparition) with the guests. Then, the timeline gets a bit tricky. It seems there's a debate about whether "現役アイドルちゅ～", "ウェディングしよっ!", or "とくべチュ、して" is the next song, but I believe based on the lyrics read at 10:10, it's "`原宿いどーるCHUッ☆`" also known as "現役アイドルちゅ～". "逃げない!!" follows, then "とくべチュ、して", and then "パピプペポップ". After the MC and stage introduction, we get a string of Matsuri's solo performances: "現役アイドルちゅ～", "恋のSOS", and "夢見る空へ." The final section is the major announcements, particularly the 1st album introduction, and the ending with the new original song "ウーニャカ."

    The entity extraction has been done, and it seems spot-on; Natsuiro Matsuri's role, the guests' affiliations, and even the speech patterns are accounted for. The glossary terms, too, are clear and concise.

    Finally, the JSON structure will be strictly verified for validity: double-quotes, no trailing commas, and no unescaped control characters. The overall structure is sound, and all required data should fit neatly. It is now time to output the data.
