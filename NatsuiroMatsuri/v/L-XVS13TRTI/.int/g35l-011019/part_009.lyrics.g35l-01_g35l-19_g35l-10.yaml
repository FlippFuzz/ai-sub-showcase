global_summary:
  overall_summary: 'This YouTube livestream titled ''【 #夏色まつり誕生祭2025 】重大告知あり！アイドル革命進行中！～今日の主役は夢の途中～''
    features Hololive 1st Generation VTuber Natsuiro Matsuri celebrating her birthday/anniversary
    3D live concert. The event centers around an ''Idol Revolution'' theme, featuring
    high-energy idol song performances both solo and in collaboration with fellow
    Hololive members (AZKi, Himemori Luna, Ichijou Ririka, Hakui Koyori, Hakos Baelz,
    and Kobo Kanaeru). Throughout the stream, Matsuri showcases various idol stages,
    announces her birthday merchandise line, reveals her 1st studio album ''Chasing
    the Dream 〜スポットライトは放課後に〜'', and premieres a brand-new original song titled ''Unyaka''
    composed by Kairiki Bear.'
