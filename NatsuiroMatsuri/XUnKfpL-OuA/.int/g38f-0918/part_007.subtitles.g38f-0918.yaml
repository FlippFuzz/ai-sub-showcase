    I'm checking the word "bika-bika" vs "pika-pika" for the context of "眩しい", the light.

    Okay, here's the next key bit to focus on: the group switches gears and the discussion revolves around the sound of a heartbeat, "doki-doki" and its stronger variations. The discussion is flowing and I'm capturing their evolving thoughts. I've noted the hint to make it "tokun, tokun" for a weaker version, and am very interested in this hint.

    So Kobo tries to work the charm, asking for a hint if she says "Matsuri-oneesan" cutely. The interaction is very Hololive-esque!

