    \ in with, \"Can I draw, right?\".\n\n*   **00:02.000 - 00:06.800:** Anya has\
    \ a pen problem: \"なんかペンがおかしいんです。私の。何で？\" (My pen is acting weird... why?). Matsuri\
    \ chimes in with \"あら？\" (Oh?), and it is, and the chicken noises start! \"Kokekokko\"\
    \ \"Kekekokokko\" \"Kekokako\".\n\n*   **00:01.200 - 00:03.000:** Kobo is set\
    \ on drawing. \"Can I draw, right?\".\n\n*   **00:03.100 - 00:06.500:** Anya's\
    \ pen issue continues, with Matsuri's concern.\n\n*   **00:06.800 - 00:08.800:**\
    \ Anya, despite pen problems, starts to draw.\n\n*   **00:09.100 - 00:11.800:**\
    \ Bae: \"Kokekokko~\".\n\n*   **00:11.900 - 00:14.200:** Kobo: \"Kekoke kokokko~\"\
    .\n\n*   **00:14.400 - 00:16.800:** Gigi: \"Kekokako kekko\"\n\n*   **00:16.800\
    \ - 00:17.800:** Matsuri: \"かわいい\" (Cute.).\n\n*   **00:17.800 - 00:20.000:**\
    \ Anya's continued struggles with pen.\n\n*   **00:19.800 - 00:21.800:** Kobo:\
    \ \"Kekoke kokokko~\".\n\n*   **00:21.100 - 00:22.500:** Iofi asks, \"描けるかな？\"\
    \ (Can I draw it?).\n\n*   **00:22.500 - 00:24.000:** Gigi: \"Kekoke kokokko~\"\
    .\n\n*   **00:23.800 - 00:26.500:** Anya is going to restart her app. Matsuri\
    \ wants to know \"Yeah, can you draw?\".\n\n*   **00:26.700 - 00:28.700:** Iofi\
    \ suggests, \"Sh- Should we draw?\".\n\n*   **00:28.800 - 00:30.300:** Gigi says\
