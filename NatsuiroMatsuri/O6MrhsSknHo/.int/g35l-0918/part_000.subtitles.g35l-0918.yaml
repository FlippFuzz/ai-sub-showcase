    \ like we were already at 530k!\n\nI was saying, \"Wait, everyone, you're so fast!\"\
    \ From 03:15.800, I thanked everyone for subscribing, watching the Super Chats,\
    \ and being with me. From 03:22.200, I remembered the script saying I'd cry at\
