    english: Please stop making me cry before I even sing! Seriously.
  - start: '00:59.250'
    end: '01:00.670'
    original: (笑)
    english: (Sighs)
  - start: '01:01.370'
    end: '01:08.570'
    original: ということで、えー、マリーちゃんからのサプライズのお手紙ありがとうございました。
    english: So, Sekretto-san, thank you for the surprise letter!
  - start: '01:09.910'
    end: '01:15.480'
    original: 坂田ま、シークレットさんに、お手紙帰ってきたんです！
    english: Sakamata has received a letter from Sekretto-san!
  - start: '01:18.570'
    end: '01:21.050'
    original: 読んでいいですか？(笑)
    english: Should I read it?
  - start: '01:23.790'
    end: '01:24.420'
    original: 読みます。
    english: I'll read it.
  - start: '01:31.060'
    end: '01:50.150'
    original: シークレットさんへ、ホロライブでは短く、中学生が高校生になってしまうような、長いような、短いような、とても濃い時間を一緒に過ごしてくれて、ありがとうございました。
    english: Dear Sekretto-san, during HoloLive, it feels like it was a short time,
      yet long—like a middle schooler turning into a high schooler. We spent a lot
      of intense time together. Thank you so much.
  - start: '01:53.640'
    end: '02:00.120'
    original: 初配信ではぽんだらけでほぼアドリブで話していたり、ライブでも生歌に緊張しすぎて声が震えたり、よだれで溺れたり
    english: During my first stream, I was all over the place and spoke almost entirely
      ad-lib. Even during lives, I was so nervous from singing live that my voice
      shook or I drowned in my own drool.
  - start: '02:10.150'
    end: '02:11.750'
    original: 笑っちゃうようなことも、悔しいこともたくさんあったね。
    english: There were things that made me laugh, and things that made me frustrated.
  - start: '02:17.840'
    end: '02:22.020'
    original: 体を壊して心配をかけていくことが増えていき、坂田自身すごく悩んだし、申し訳なさから一人で泣いている時もありました。
    english: I kept breaking my body and worrying more and more, and Sakamata herself
      was very troubled. There were times when I cried alone from sheer misery.
  - start: '02:32.410'
    end: '02:52.270'
    original: それでも、シークレットさんと過ごす日々のなかで、少しずつ成長していったり、自分を大切にしようという気持ちが強くなってきて、活動だけではなく、坂田の人生にとって大きな良い変化がたくさん起こりました。
    english: Even so, through the days spent with Sekretto-san, I grew little by little,
      and my feeling of wanting to cherish myself grew stronger. Not just in activities,
      but it brought many major, positive changes to Sakamata's life.
  - start: '02:53.370'
    end: '03:13.910'
    original: それは偶然起きたものではなくて、シークレットさんがいつも優しく愛を届け続けてくれたから。この人たちにもっと笑っていてほしい、こんな素敵な人たちの大切なものである坂田が、坂田自身を大切にしなきゃだめだと思ったからだよ。
    english: This wasn't something that just happened by chance. It's because Sekretto-san
      always gently continued to deliver love. That's why Sakamata thought that since
      Sekretto-san's precious people should smile more, Sakamata, who is precious
      to such wonderful people, must cherish herself too.
  - start: '03:15.840'
    end: '03:27.750'
    original: 気づかせてくれてありがとう。
    english: Thank you for making me notice that.
  - start: '03:21.050'
    end: '03:37.490'
    original: ホロライブで過ごして学んだことや思い出は、ずっと坂田の中に残ります。シークレットさんへの気持ちも、信頼も、絆も、何も変わることはありません。
    english: The things I experienced and learned during HoloLive will stay in Sakamata's
      heart forever. My feelings, trust, and bond with Sekretto-san will never change.
  - start: '03:37.520'
    end: '03:43.760'
    original: 大切にこの先も歩いていくので、この旅立ちを見守ってください。
    english: I will keep walking forward carefully, so please keep watching over this
      journey.
  - start: '03:44.250'
    end: '03:57.490'
    original: 本当に3年間ありがとうございました。大好きだよ！またどこかで。ありがとうございます。
    english: Thank you so much for the past three years. I love you so much! Thank
      you again, wherever we are.
  - start: '04:01.550'
    end: '04:09.950'
    original: はあー、もう気持ちぐちゃぐちゃ（笑）気持ちぐちゃぐちゃなのですが、
    english: Phew, my feelings are a total mess right now... (Laughs)
  - start: '04:11.890'
    end: '04:22.420'
    original: 次が本当に最後の曲です。みんな親ありがとうね。ありがとうございました。スタッフさんたちもありがとうございました。
    english: Next is truly the final song. Everyone, thank you, and thank you so much,
