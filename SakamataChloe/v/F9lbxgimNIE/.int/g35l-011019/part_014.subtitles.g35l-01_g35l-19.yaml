    original: 正直楽しいことばかりではなく、大変なこともたくさんあって、どうしたらいいのかと頭を悩ませたこともありました。
    english: To be honest, it wasn't all fun and games; there were plenty of tough
      times, and there were moments when I racked my brain wondering what to do.
  - start: '03:15.000'
    end: '03:25.000'
    original: でも、クロヱさんとなら大変なことは半分に、楽しいことは倍に、この3年間を乗り切れたと思ってます。
    english: But I feel like with Chloe-san, we cut the hard times in half and doubled
      the fun, getting through these three years together.
  - start: '03:26.000'
    end: '03:40.500'
    original: 気づいたら家のなかがクロヱさんのグッズでいっぱいで、仕事に行くときは娘ちゃんが「クロヱちゃんに会いに行ってくるの？」と聞いてくるようになりました。
    english: Before I knew it, my house was full of Chloe-san's merchandise, and when
      I head off to work, my daughter started asking, "Are you going to go see Chloe-chan?"
  - start: '03:41.000'
    end: '03:53.000'
    original: 嬉しい反面、今後は何て答えればいいのかと悩んでいます。この3年間、ダンスレッスンやボイトレ、収録などの仕事を真面目に一生懸命頑張っている姿を一番近くで見させてもらいました。
    english: On the happy flip side, I'm troubled over how I should answer from now
      on. Over these past three years, I've had the privilege of seeing you up close,
      working so earnestly and hard at dance lessons, vocal training, and recording
      sessions.
  - start: '03:54.000'
    end: '04:03.000'
    original: 活動に関して熱い思いを抱えているクロヱさんに追いつこうと必死で、クロヱさんの期待に応えられるよう頑張ってきましたが、並んで仕事ができていたりしたのだろうか？うーん。
    english: I tried desperately to keep up with Chloe-san, who holds such passionate
      feelings regarding her activities, and I did my best to meet Chloe-san's expectations,
      but I wonder if I was truly able to work side-by-side? Hmm.
  - start: '04:05.000'
    end: '04:23.000'
    original: 当たり前すぎ、むしろ、むしろ確かめられててめっちゃ……全然、全然逆なわけだけどな。正直とても不安でした。
    english: That's too obvious—rather, rather, seeing it confirmed made me realize...
      it was completely, completely the reverse, though. Honestly, I was very anxious.
  - start: '04:23.000'
    end: '04:31.000'
    original: 本当はもっともっと色々なことを教えていただきたかったです。言葉選びのセンス、シークインさんとの関わり方など尊敬しかないけど、
    english: Truth be told, I wanted you to teach me so much more. I have nothing
      but respect for your sense in choosing words and how you interact with Shiikuin-san,
  - start: '04:31.000'
    end: '04:40.000'
    original: クロヱさんのマネージャーになれて幸せでした。記念配信でみゆうさんと堂々と立ち上げってるクロヱさんを間近で見させて戴き、そのかっこいい姿忘れません。
    english: but I was truly happy to become Chloe-san's manager. Having the chance
      to see Chloe-san standing proudly with Miyu-san on the commemorative stream
      right up close, I will never forget that cool appearance.
  - start: '04:41.000'
    end: '04:50.000'
    original: 本当にお疲れ様でした。そして見たことのない景色をたくさん見せていただきありがとうございました。これからも応援してます、マネちゃんより。
    english: Thank you truly for your hard work. And thank you for showing me so many
      sights I'd never seen before. I'll keep cheering you on, from Manager-chan.
  - start: '04:50.000'
    end: '04:58.006'
    original: ねえ、もうずる……！あれ終わって……あれ？待って？あれ？
    english: Hey, that's so unfair...! Wait, it's over...? Huh? Wait? Huh?
