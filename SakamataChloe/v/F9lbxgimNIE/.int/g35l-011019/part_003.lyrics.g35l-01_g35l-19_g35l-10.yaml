global_summary:
  overall_summary: This video is the official graduation live stream of Sakamata Chloe,
    a member of the VTuber group Hololive (specifically from Secret Society holoX),
    titled '【 ごちそうさまでした 】沙花叉クロヱ卒業ライブ'. Throughout the 88-minute broadcast, Chloe delivers
    emotional vocal performances and covers of popular songs featuring guest appearances
    by fellow Hololive talents such as Hoshimachi Suisei, Usada Pekora, Amane Kanata,
    Himemori Luna, Murasaki Shion, and her holoX unit mates (La+ Darknesss, Takane
    Lui, Hakui Koyori, and Kazama Iroha). The stream blends emotional retrospection,
    heartfelt letters from Cover Corp CEO Motoaki Tanigo (Yagoo) and her manager,
    comedic banter, and musical milestones, culminating in a touching farewell to
    her fans (known as Shiikuin-san).
