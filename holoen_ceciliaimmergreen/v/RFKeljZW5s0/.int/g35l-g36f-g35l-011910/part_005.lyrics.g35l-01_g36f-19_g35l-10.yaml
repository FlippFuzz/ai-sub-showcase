    in jars and mind palaces, and forced through comedic trials by her mischievous
    evil counterpart, Imma Red. Along the way, she is joined in 3D sketches and musical
    performances by various hololive guests including Oozora Subaru, Ouro Kronii,
    Shirakami Fubuki, Ookami Mio, and Gigi Murin. The stream blends elaborate musical
    numbers, theatrical skits, physics-defying escape sequences, and a birthday merchandise
    presentation.
