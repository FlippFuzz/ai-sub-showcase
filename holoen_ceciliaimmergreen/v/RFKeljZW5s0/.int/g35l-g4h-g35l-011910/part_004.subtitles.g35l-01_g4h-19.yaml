    narrative plot where her rival/alter-ego 'ImmaRed' traps her across different
    theatrical worlds and dimensions. She is joined by various guest appearances from
    hololive talents including Ouro Kronii, Kobo Kanaeru, Ninomae Ina'nis, Shirakami
    Fubuki, Ookami Mio, Tsunomaki Watame, and Kazama Iroha. The stream also features
    comedy skits, interactive chat polls, a merchandise showcase, and musical performances.
