global_summary:
  overall_summary: This YouTube video features the first 3D birthday live stream of
    Hiodoshi Ao from hololive DEV_IS unit ReGLOSS, titled '【初3DLIVE】キミの王子様☆青くんのお誕生日ライブ！ゲスト盛沢山！【#火威青生誕祭2025】'.
    Set inside Ao's fictional club venue 'Club Blue Fire' (クラブブルーファイアー), the stream
    showcases solo and duet musical performances, guest chat segments with VTubers
    from various agencies (Tooko from REJECT, Konkon Aria from Neo-Porte, Meloco Kyoran
    from NIJISANJI EN, and Hololive's Houshou Marine, Ookami Mio, and Kazama Iroha),
    chaotic comedy skits, and a chaotic guest appearance by ReGLOSS members (Otonose
    Kanade, Ichijou Ririka, Juufuutei Raden, and Todoroki Hajime). The stream concludes
    with the premiere of Ao's original solo song 'Club Blue Fire' and birthday merchandise
    announcements.
