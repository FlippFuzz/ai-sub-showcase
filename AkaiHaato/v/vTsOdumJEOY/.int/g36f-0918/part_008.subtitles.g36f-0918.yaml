  thoughts: "**A Deep Dive into the World of Cursed Objects**\n\nOkay, so I need to\
    \ break down this video clip and get the subtitles right.  It looks like this\
    \ person, Tanaka-san, is into collecting cursed objects, which, frankly, is a\
    \ fascinating field from a psychological perspective. The first segment sets the\
    \ stage, with the introduction of \"Charmy,\" the doll that started it all. Apparently,\
    \ it came from a nursing home where residents who were fond of it, would meet\
    \ an untimely end. *Three days, what a specific time*. Tanaka-san, being the \"\
    exorcism expert\" the public perceives him to be, got roped into taking it. He's\
    \ clearly not thrilled, if his reaction and careful wording were anything to go\
    \ by. I’m thinking he's not very fond of this doll at all. \n\nNow, the story\
    \ takes a turn.  He takes it home, and suddenly, the lights are flickering, and\
    \ speech recognition software is hijacking his computer!  The doll had some impact,\
    \ that he knows for sure.  The immediate cessation of the phenomena upon seeing\
    \ the doll tells the tale. He knows that the doll just needs to be *out*. He sees\
    \ that she is currently enjoying her time. Then we move on to a recent acquisition\
    \ - a massive collection of dolls. The story they tell is terrifying: a sister\
    \ cursing her sibling with dolls and intense thoughts of death. Both end up in\
    \ mental institutions. *A textbook case of internalizing the curse, I’d say*.\n\
    \nIt made me think about curses myself. While I don’t believe in cursing others\
    \ myself, the concept of a ‘return’ is always there. The exchange is not worth\
    \ it, personally. Tanaka-san, however, seems more open to it, mentioning a West\
    \ African tool specifically designed for this purpose.\n\nThe search for the most\
    \ powerful cursed item in the room is interesting. There is some ambiguity there.\
    \ Then, a genuinely unsettling doll appears. The ending is hilarious... I believe\
    \ I know that character.\n\n\n"
