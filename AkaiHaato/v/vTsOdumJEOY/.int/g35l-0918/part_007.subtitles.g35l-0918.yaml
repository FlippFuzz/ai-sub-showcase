  thoughts: |+
    **My Cursed Item Adventure: A Summary**

    Okay, so I’m here, at the home of Toshiyuki Tanaka, the cursed item collector – someone I've wanted to meet for ages! The atmosphere is...intense, to say the least, especially as I approach those stairs, knowing a famous collector is waiting for me. I'm nervous, but also excited!

    [00:00.100 - 00:18.000]

    The house itself is already giving off this…bizarre vibe. I carefully make my way to what seems like the back room, hoping I’m in the right place, then hesitantly knock. There’s no nameplate, so it’s a gamble! Finally, I hear a voice, and the door opens.

    [00:20.500 - 01:09.200]

    I introduce myself as Akai Haato from Hololive, here for an interview. Tanaka-san seems a bit surprised, maybe he forgot? But he's welcoming, and I’m allowed in! I can already see a bunch of cursed items, the room is full of them. I can’t help but ask, "Are all of these cursed items?"

    [01:11.000 - 01:48.800]

    Tanaka-san confirms they are, but explains they're more accurately *cursed* items. And he, shockingly, isn’t feeling great all the time due to them! He admits there are different types of curses, and that some are even... "good" somehow! I'm curious, so I ask him to introduce himself to my viewers. He's a collector and a scary storyteller.

    [01:49.100 - 02:25.500]

    He then tells me that his back room is off limits, because the cursed items don't like visitors.

    [02:25.500 - 03:04.500]

    I'm naturally curious, and I point to a white mask next to a red one, curious as to what it does. Tanaka-san explains it’s the "Cursed Mask" – wearing it brings misfortune. Apparently, someone wore it on a TV show and got thoroughly cursed!

    [03:06.500 - 03:55.000]

    He then explains that most of the items are *not* exorcised, which he requests when taking them.

    [03:56.000 - 04:16.500]

    I'm intrigued and ask if he has any recommendations, and he heads to his back room to fetch one.

    [04:17.500 - 04:30.800]

    He comes back with a doll, which I note is in cute pajamas! It seems he was told to bring it out!
    It's wearing Gelato Pique! So cute! I ask why it's his favorite.

    [04:32.000 - 04:59.500]


...
