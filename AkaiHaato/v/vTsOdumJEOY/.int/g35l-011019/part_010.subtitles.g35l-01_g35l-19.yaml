global_summary:
  overall_summary: This YouTube video features Akai Haato's 3D birthday live stream
    for 2025, titled '【3DLIVE】夏のホラー満載‼️#赤井はあと爆誕祭2025 👻【ゲスト多数&告知あり◎】【ホロライブ/赤井はあと】'.
    The stream adopts a unique 'summer horror' theme, blending eerie psychological
    horror aesthetics, pre-recorded occult vlog segments (including a visit to famed
    cursed object collector Toshiyuki Tanaka), and musical performances and duets
    featuring prominent guests from Hololive and Nijisanji, such as Yuzuki Choco,
    Juufuutei Raden, Ninomae Ina'nis, Nerissa Ravencroft, Roboco-san, and Hyakumantenbara
    Salome. The event also includes official birthday merchandise announcements and
    original song releases.
