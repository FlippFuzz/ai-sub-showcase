- start: '01:23.256'
  end: '01:30.936'
  original: 僕ら育っていくみたい愛されるみたいあたたかな波を読む
  english: It's like we're growing up, like we're being loved, reading the warm waves.
- start: '01:31.436'
  end: '01:38.276'
  original: 顔、今を選ぶ尖った浅い色尋ねる声で何度もでも
  english: Choosing our faces now, with a sharp, shallow color, asking over and over
    with questioning voices.
- start: '01:39.116'
  end: '01:44.876'
  original: 僕らうそつきだね両思いだねかれはてるまで泣き笑い今日を
  english: We're such liars, aren't we? But we feel the same, crying and laughing
    until we're withered, accepting today...
- start: '01:49.116'
  end: '01:55.396'
  original: 受け入れていくよ喜び合った日々を忘れはしないけど
  english: '...accepting the days we rejoiced, even though we won''t forget them.'
- start: '01:59.056'
  end: '02:05.976'
  original: 知らないお互い幸せだって知れれば知れるほど
  english: The more we come to know each other's unfamiliar happiness...
- start: '02:07.756'
  end: '02:11.756'
  original: 正しくなれない霧がどこを見た
  english: The fog where we couldn't be right, where did it look?
- start: '02:11.976'
  end: '02:15.516'
  original: 片端から確かめたくて
  english: Wanting to check every single piece from the edge.
- start: '02:16.096'
  end: '02:20.596'
  original: 影を覗けたいつわりで出会えた僕らは何一つ
  english: We who met through a deceitful desire to peek at shadows...
- start: '02:21.396'
  end: '02:24.596'
  original: 奪われてないから
  english: '...haven''t had a single thing taken away.'
- start: '02:32.416'
  end: '02:40.436'
  original: 今心閉ざすように少しずつ遠くを続けようか冷きに笑顔だけ
  english: Like closing our hearts now, shall we slowly keep going further away, leaving
    only smiles on dead trees?
- start: '02:41.536'
  end: '02:44.976'
  original: 君の肉体星すべて無駄になんかさせないよ
  english: I won't let your body, your star, or anything go to waste.
- start: '02:48.876'
  end: '02:52.876'
  original: ねぇ知れれば知れるほどお互い幸せだって
  english: Hey, the more we know how happy we are...
- start: '02:53.676'
  end: '02:57.176'
  original: 辿り着いてもいい
  english: '...even if we reach it, that''s okay.'
- start: '03:00.076'
  end: '03:05.036'
  original: 君だけが見る夕立だけ鏡僕でもいつか分かる日まで
  english: Until the day even I can understand the sudden rain only you see in the
    mirror.
- start: '03:08.076'
  end: '03:12.276'
  original: 影を覗けたいつわりで出会えたしなる枝分かれよう
  english: Meeting through a deceitful desire to peek at shadows, branching out like
    we were...
- start: '03:14.376'
  end: '03:17.376'
  original: 導かれたとしてもさ
  english: Even if we were guided...
- start: '03:18.476'
  end: '03:25.076'
  original: 大したもんじゃない無駄なもんじゃない幸せノリを寛大にしとくように
  english: It's not a big deal, it's not useless, let's keep our happy stride generous.
- start: '03:25.876'
  end: '03:29.876'
  original: ずっともうずっとバカされようが
  english: No matter how much we are made fools of forever and ever...
- start: '03:30.276'
  end: '03:34.976'
  original: 折れない砂の罠可能性が
  english: The trap of unbreakable sand, if there's any possibility...
- start: '03:36.176'
  end: '03:39.976'
  original: 見逃せるならば
  english: '...of letting it slip away...'
- start: '03:40.476'
  end: '03:45.376'
  original: 可能性を諦められないから
  english: '...because I can''t give up on the possibility...'
- start: '03:52.876'
  end: '03:56.876'
  original: 正しくなれない霧がどこを見た
  english: The fog where we couldn't be right, where did it look?
- start: '03:57.276'
  end: '04:00.676'
  original: 片端から確かめたくて
  english: Wanting to check every single piece from the edge.
- start: '04:01.076'
  end: '04:05.376'
  original: 影を覗けたいつわりで出会えた僕らは何一つ
  english: We who met through a deceitful desire to peek at shadows...
- start: '04:06.076'
  end: '04:09.176'
  original: 奪われてないから
  english: '...haven''t had a single thing taken away.'
- start: '04:09.376'
  end: '04:14.176'
  original: すべて嫌われても奪われてないから
  english: Even if everyone hates us, nothing has been taken away.
- start: '04:16.156'
  end: '04:22.516'
  original: '[Text: はとちゃん 大好きだよ ずっと]'
  english: '[Text: Haato-chan I love you always]'
- start: '04:24.056'
  end: '04:30.636'
  original: '[Text: はっちゃんも... 私も大好き]'
  english: '[Text: Hatchan too... I love you too]'
- start: '04:31.556'
  end: '04:36.516'
  original: '[Text: 今まで... ごめんね ごめんなさい]'
  english: '[Text: Until now... I''m sorry, I''m so sorry]'
- start: '04:37.756'
  end: '04:43.656'
  original: '[Text: いなくなって 寂しかったよ いつもそばにいるって言ったじゃん]'
  english: '[Text: I was so lonely when you disappeared... You said you''d always
    be by my side, didn''t you?]'
- start: '04:48.856'
  end: '04:52.516'
  original: '[Text: ずっと待ってたよ]'
  english: '[Text: I''ve been waiting all this time.]'
