  thoughts: |+
    **Cursed Objects and Charmy's Mysterious Case**

    Okay, so this Tanaka-san guy...it looks like he starts collecting cursed objects and it all goes back to this doll, Charmy. The story is wild. He originally did scary story shows, so people in the audience would bring in what they thought were cursed objects and they assumed he could do something like exorcise them. Charmy apparently belonged to a nursing home in the Kansai region, and the staff had no idea where she came from. The creepy part? Certain residents would become attached to her, and they would die within days. Five people, wow. They tried hiding her in the basement, but she kept reappearing. Eventually, someone who knew about Tanaka-san decided to hand her over to him.

    I was busy, so I just took it home without opening it. Then things started getting weird. The lights were flickering, my PC kept opening voice recognition software, but I couldn't do anything else. When I finally opened the bag, Charmy was inside, and everything immediately stopped. Is it possible she was just demanding to be let out?

    Tanaka-san, although he puts her in cute clothes, he doesn't really *pamper* her. He actually shows a lot of respect. This started him down the path of thinking that spirits or souls can reside in physical objects. He also admitted he was absolutely terrified. It's not the reaction I was expecting from a guy who deals in cursed objects!

    Then he showed me a new cursed object he recently received: a large number of dolls. He said it was, essentially, a collection. The "obsession" on display was insane. Then he mentioned that this collection was not for play: a younger sister was cursing her older sister, for years, wishing death upon her with these dolls. That's a little intense. The older sister ended up in a psychiatric hospital, and eventually, the younger sister followed. So, they both went to a psychiatric hospital, ultimately.

    He then asked me if I ever felt that way, and I told him, absolutely not. If I cursed someone, I would have to pay the price.

    Apparently, I could curse people quickly. Tanaka-san, who said he curses people sometimes, just admitted he curses his haters. Then, he showed me this voodoo-looking thing from a witch doctor in West Africa. You put a name in there and insert a pin, and misfortune apparently falls upon them.

    I then asked him about the most powerful cursed object in the room. He says he has so many, that they sometimes appear, seemingly from nowhere. He mentioned this creepy doll that he has no memory of ever obtaining. He called it "incredibly creepy". It was this doll, and...wait, is that Taran-chama...?


...
