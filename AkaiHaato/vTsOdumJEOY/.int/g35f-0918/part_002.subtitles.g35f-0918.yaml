    I also noticed the guest vocalist. It was Shiori Novella! And I knew to listen for a transition to each vocalist.

    I verified the timings, checking both the video and the audio. I double-checked the Japanese lyrics and English translations. The entire second part from the video included a lot of vocals and I carefully transcribed the timing for it.

    The ending was "夏を待っている" (Natsu wo matte iru) and the video suddenly ended! I was careful to put the proper end point at 05:00.000.

    After everything, I did an English translation review. I was careful to ensure that the timing for the Japanese text was as accurate as possible, to match what I was hearing from the video.

