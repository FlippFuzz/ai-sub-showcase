  original: 君の血肉まで 骨の髄まで 入れて空っぽになる 愛のため
  english: Down to your flesh and blood, down to the marrow of your bones, filled
    until empty for the sake of love.
- start: '04:29.200'
  end: '04:34.900'
  original: 胸が苦しいね 息が詰まるのね それが恋と教えてあげる
  english: My chest hurts, my breathing is choking, let me teach you that that is
    love.
- start: '04:35.500'
  end: '04:41.800'
  original: うつろな声で ほら囁いて いい子ね 首輪付けた君はラベ
  english: Whisper with a hollow voice, there you go, good boy/girl with a collar
    on, you're rabid.
- start: '04:42.000'
  end: '04:49.000'
  original: イカれちゃったのれ 恋は真っ暗で したいよねしてあげるわ痛いよ
  english: Have you gone crazy? Love is pitch black, you want to do it, I'll do it
    for you, it hurts.
- start: '04:50.000'
  end: '04:55.900'
  original: 濡れて君の赤い席溺れるまで いたいいたいの飛んでいけ死ねばいいのに
  english: Soaking until drowning in your red seat, fly away the hurts, I wish you
    were dead.
