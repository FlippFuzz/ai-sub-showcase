  - start: '01:57.487'
    end: '02:01.817'
    original: 明日十時にホームで待ち合わせとかしよう
    english: Let's plan to meet on the platform tomorrow at 10:00.
  - start: '02:02.487'
    end: '02:07.957'
    original: 牡丹は散っても花だ夏が去っても追慕は切だ
    english: Even if the peonies fall, they're still flowers; even if summer leaves,
      mourning is still poignant.
  - start: '02:08.357'
    end: '02:14.397'
    original: 口に出して声に出して君が言って
    english: Speak it out, voice it out, and say it to me!
  - start: '02:17.067'
    end: '02:22.317'
    original: そして人生最後の日、君が見えるのなら
    english: And if I can see you on the very last day of my life...
  - start: '02:22.757'
    end: '02:27.777'
    original: きっと、人生最後の日も愛をうたうのだろう
    english: I'm sure I'll be singing about love on the last day of my life, too.
  - start: '02:27.997'
    end: '02:31.427'
    original: 全部、全部無駄じゃなかったって言うから
    english: Because I'll say that none of it was a waste at all!
  - start: '02:32.487'
    end: '02:40.487'
    original: あぁ、いつか人生最後の日君がいないことがまだ信じられないけど
    english: Ah, I still can't believe that someday, on the very last day of my life,
      you won't be here...
  - start: '02:41.347'
    end: '03:00.917'
    original: もっと、もっと、もっと、もっと、もっと、もっと、もっと、君がもっと、もっと、もっと、もっと、もっと、ちゃんと言って
    english: More, more, more, more, more, more, more, you... more, more, more, more,
      more, please tell me properly!
  - start: '03:09.124'
    end: '03:12.714'
    original: マカシ、手伝ってくれてサンキュー、ステージの準備、お疲れ様、オリー！
    english: Thanks for helping us set up the stage, Ollie!
  - start: '03:12.914'
    end: '03:16.894'
    original: いやー、さっきケーブルがぐちゃぐちゃだったけど、先輩が手伝ってくれて本当に助かった！
    english: Yeah! We had troubles with the cables, good thing you helped us untangle
      them!
  - start: '03:17.044'
    end: '03:18.674'
    original: えへへ、問題ないよ！
    english: Hehe! No problem!
  - start: '03:18.914'
    end: '03:24.784'
    original: もしかして私が一番嬉しいのは、みんなと一緒にここで……私、実は話したいことがあって……
    english: If anything, I'm really happy I got to catch you guys here! I actually
      have something on my mind recently...
  - start: '03:25.104'
    end: '03:26.604'
    original: ん？何？なになに？
    english: Oh? What's up?
  - start: '03:27.424'
    end: '03:36.004'
    original: あのね、最近、私、気になってるの。なんでゾンビになったんだろう…なんのためになったんだろうってね。
    english: Lately I've been wondering... why did I become a zombie? What was the
      reason for it?
  - start: '03:36.194'
    end: '03:39.144'
    original: もし、みんなにとって私、何でゾンビになったと思う？
    english: Why do you guys think I turned into a zombie?
  - start: '03:39.384'
    end: '03:42.504'
    original: おお、自分のことを見つけ出す時期か！
    english: Oh, you're searching for your identity!
  - start: '03:42.854'
    end: '03:52.334'
    original: うん、そうだな…もし、私、思うとね、あなたが追い求めたいと思っていることや希望がたくさんあって…
    english: Well, I think... if I think about it, you have a lot of hopes and things
      you want to pursue...
  - start: '03:52.334'
    end: '03:57.064'
    original: その思いの強さがあなたを生かし戻してゾンビになったと思う。
    english: And the strength of that will brought you back to life as a zombie.
  - start: '03:57.304'
    end: '03:59.784'
    original: おお！そうかも！
    english: Oh! That could be it!
  - start: '03:59.984'
    end: '04:09.134'
    original: もし、ゼタ、どう思う？もし、私の考えだと、先輩の体もっとたくさんの思い出を作りたくて、生き返ったのかもしれないですね！
    english: What do you think, Zeta? / Hmm, I think your body just wanted to make
      more happy memories, so it came back to life!
  - start: '04:10.104'
    end: '04:13.624'
    original: うーん、面白い！ありがとうね、インプット！
    english: Hmm, interesting! Thanks so much for the input!
  - start: '04:14.044'
    end: '04:15.524'
    original: もしかしてそれが答えかも！
    english: That might just be the answer!
  - start: '04:15.824'
    end: '04:19.464'
    original: どういたしまして！早く答えを見つかるといいね！
    english: You're welcome! Hope you find your answer soon!
  - start: '04:20.104'
    end: '04:22.424'
    original: がんばって、先輩！ありがとう！
    english: Good luck, Senpai! / Thank you!
  - start: '04:46.400'
    end: '04:52.880'
    original: わかってる ほしいんでしょ
    english: I know you want it...
  - start: '04:53.000'
    end: '04:58.000'
    original: 艶やかな この唇
    english: those glossy lips...
  - start: '04:58.200'
    end: '05:00.048'
    original: ヤワな男たち 惹き寄せる
    english: drawing in soft-hearted men.
