  overall_summary: This video is Kureiji Ollie's 3D Birthday LIVE 2024, titled 'REBIRTH,
    The True Me', streamed on her official hololive Indonesia YouTube channel on October
    13, 2024. The stream features an immersive theatrical narrative exploring Ollie's
    existential crisis as a zombie and her ultimate awakening as the 'Goddess of Death
    and Rebirth', interspersed with high-energy musical performances featuring guest
    appearances from fellow hololive ID and hololive STARS members. The latter half
    of the stream includes detailed merchandise announcements and heartfelt closing
    remarks.
