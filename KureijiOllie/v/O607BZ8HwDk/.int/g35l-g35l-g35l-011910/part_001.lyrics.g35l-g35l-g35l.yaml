- start: '03:47.795'
  end: '03:49.335'
  original: 戻ってきたら色々話してね！
  english: You better bring me a good story out of it!
- start: '03:50.075'
  end: '03:51.275'
  original: えへへ！もちろん！
  english: Hehe! I will!
- start: '04:03.111'
  end: '04:04.461'
