    And I had forgotten
- start: '04:46.851'
  end: '04:51.571'
  original: |-
    もっと頼ってもいいのに、もっと頼って生きて
    ちょうどいいの、そう、ちょうどいいの、しょうがないままじゃダメだったんだ
