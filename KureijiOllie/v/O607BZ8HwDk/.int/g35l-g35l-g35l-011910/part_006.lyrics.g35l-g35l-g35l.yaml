    original: ずるしていいよ ずるくていいよ 壊していいよ 怖くていいよ
    english: It's okay to cheat, it's okay to be sly, it's okay to break things, it's
      okay to be scared.
  - start: '03:02.040'
    end: '03:07.460'
    original: 卑怯な愛はここに埋めよう 忘れるんだこんなのもうやめよう
    english: Let's bury cowardly love right here, let's forget this and stop doing
      this already.
  - start: '03:07.460'
    end: '03:13.480'
    original: 嫌ったほうが 気楽でいい でも 想ったほうが重くていいじゃんか
    english: It's easier to just hate, but isn't it fine if caring feels heavy?
  - start: '03:13.480'
    end: '03:19.160'
    original: もう笑えない僕の アンデッドアリスへ
    english: To my Undead Alice who can no longer smile.
  - start: '03:22.240'
    end: '03:26.780'
    original: 予想通り 僕の夢が 輝くほど 君は陰っていく
    english: As expected, the more my dreams shine, the more you are overshadowed.
  - start: '03:27.020'
    end: '03:31.960'
    original: 犠牲を 我慢と呼んで 汚れた手で 撫で回した
    english: Calling sacrifice patience, I stroked you with tainted hands.
  - start: '03:32.480'
    end: '03:37.400'
    original: 悪いようにしないように それがつまり悪い形
    english: Trying not to do evil, that in short is an evil shape.
  - start: '03:37.860'
    end: '03:42.580'
    original: 保存状態 愛は冷凍で 何度も聞いた 「あたためますか？」
    english: Preserved state, love is frozen, how many times have I heard "Would you
      like that warmed up?"
  - start: '03:42.860'
    end: '03:48.360'
    original: 正しくありたい本能が 正しくないことの脂肪が 仲良くなっちゃって やっぱつらいや
    english: The instinct to want to be right and the fat of what's not right became
      friends, and it's still painful after all.
  - start: '03:48.360'
    end: '03:52.560'
    original: なあなあが癖になって 僕が僕を殺す前に 死んでやる
    english: Complacency became a habit, before I kill myself, I'll die.
