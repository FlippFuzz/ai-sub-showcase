global_summary:
  overall_summary: This video is the 3D birthday live concert 'Anison Night Fever
    2' hosted by Hololive 4th Generation virtual singer Tsunomaki Watame to celebrate
    her 2026 birthday. Because her original June 6 birthday stream encountered technical
    difficulties and was postponed, this broadcast features a hybrid of live-recorded
    footage and pre-recorded segments to ensure a smooth show. Watame performs a vibrant
    setlist of classic and modern anime theme songs, including 'Kyokumou Douchuu',
    'Catch the Moment', 'Unbalance na Kiss o Shite', 'GS Mikami', 'ANIMA', 'Idol',
    'Sweets Parade', 'Youkoso Japari Park e', and 'Night of Fire' with guest appearances
    from fellow Hololive members. The concert also features the premiere of her aggressive
    new rock original song 'Haiiro no Shoumei', produced by Kishida Kyodan & The Akeboshi
    Rockets, alongside major announcements including her upcoming anniversary book
    with Poplar-sha and birthday merchandise.
