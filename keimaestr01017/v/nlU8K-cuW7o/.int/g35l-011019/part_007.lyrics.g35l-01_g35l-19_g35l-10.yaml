    premieres. We haven't missed it yet, right?
- start: '01:20.153'
  end: '01:22.953'
  original: 是非みんなで一緒に見ましょう！
  english: Let's all check it out together!
- start: '01:22.953'
  end: '01:36.563'
  original: そして、21時から配信がありまして、23時から地下のゼロ東京でミッドナイトステラっていうクラブイベントも開催されます！色のたくさんもDJするみたいなので、ぜひ楽しんでいってください！
  english: And then, we have a stream starting at 9:00 PM, and from 11:00 PM, a club
    event called "Midnight Stella" will be held at Zero Tokyo in the basement! Iro
    and many others will be DJing, so please go and enjoy that too!
- start: '01:39.953'
  end: '01:47.363'
  original: えっとですね、実はお上のデカいビジョンあるよね？ここでMV流れます！
  english: Um, actually, there's that big screen up there, right? The MV will play
    right here!
- start: '01:50.913'
  end: '01:55.773'
  original: あのプレミア公開と一緒に見てもらえたら嬉しいんですけど、どう？
  english: I'd be so happy if you could watch it along with the premiere, what do
    you think?
- start: '01:58.263'
  end: '02:13.563'
  original: ありがとう。えー、YouTubeの方向け、えー、この配信が終了した直後に概要欄に記載のあるURLに飛んでもらえると大変嬉しいです！現地にいる皆さんはぜひ残ってここで一緒に見てください！
  english: Thank you. Um, for those watching on YouTube, I'd be really happy if you
    could click the URL in the description box right after this stream ends! Everyone
    here in person, please stay and watch it together right here!
- start: '02:15.113'
  end: '02:20.663'
  original: そして現地にいる人に、朗報！
  english: And good news for everyone here!
- start: '02:21.053'
  end: '02:29.833'
  original: 「ゾンビゾンビゾンビ」のミュージックビデオが流れ終わった後に、とある告知動画が流れます！
  english: After the "Zombie Zombie Zombie" music video finishes playing, a certain
    announcement video will play!
- start: '02:30.313'
  end: '02:36.193'
  original: ぜひそこまで見てから帰っていただけますとありがたいです！あ、そのあと、あのTwitterにも載せるから、YouTubeのみなもね、安心してね。
  english: I'd really appreciate it if you could stay and watch until then! Oh, and
    after that, I'll also post it on Twitter, so everyone on YouTube can rest easy
    too.
- start: '02:42.533'
  end: '02:43.683'
  original: うん。
  english: Yeah.
- start: '02:44.253'
  end: '02:54.603'
  original: え、名残惜しいね。もうね、もう台本にはね、それでは星街すいせいでした、バイバイって書いてあるんだよ。名残惜しいね。
  english: Ah, I'm going to miss you all. The script already says, "That was Hoshimachi
    Suisei, bye-bye!" I'm really reluctant to end this.
- start: '02:54.603'
  end: '02:57.653'
  original: 名残惜しい。え、なんか最後にさ、言ってほしい言葉とかある？
  english: I'll miss you. Hey, is there anything you want me to say at the very end?
- start: '03:00.083'
  end: '03:01.383'
  original: わかりました。
  english: Understood.
- start: '03:02.833'
  end: '03:14.653'
  original: それでは...バチコー！バチコー！
  english: Well then... Bachikoi! Bachikoi!
- start: '03:16.833'
  end: '03:18.913'
  original: あとは？あとは？
  english: What else? What else?
- start: '03:25.043'
  end: '03:29.413'
  original: ゾンビゾンビゾンビ！ゾンビゾンビゾンビ！
  english: Zombie Zombie Zombie! Zombie Zombie Zombie!
- start: '03:29.933'
  end: '03:34.503'
  original: ゾンビゾンビゾンビ！
  english: Zombie Zombie Zombie!
- start: '03:34.783'
  end: '03:41.383'
  original: まった！ゾンビゾンビゾンビ！ゾンビゾンビゾンビ！ゾンビゾンビゾンビ！
  english: Wait! Zombie Zombie Zombie! Zombie Zombie Zombie! Zombie Zombie Zombie!
- start: '03:41.693'
  end: '03:44.603'
  original: ラスト！ゾンビゾンビゾンビ！
  english: Last one! Zombie Zombie Zombie!
- start: '03:44.893'
  end: '03:55.773'
  original: ありがとう！この後もミュージックビデオ見てくださいね。それでは星街すいせいでした！バイバーイ！
  english: Thank you! Please keep watching the music video afterwards. This was Hoshimachi
