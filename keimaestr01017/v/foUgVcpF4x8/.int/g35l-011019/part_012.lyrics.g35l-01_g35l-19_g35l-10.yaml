  - term: Hello! Project (H!P)
    meaning: A prominent Japanese idol collective and talent agency under Up-Front
      Works, known for legendary groups like Morning Musume, Berryz Kobo, and ℃-ute.
  - term: Flow Glow
    meaning: A musical VTuber artist group under hololive DEV_IS consisting of Isaki
      Riona, Koganei Niko, Mizumiya Su, Rindo Chihaya, and Kikirara Vivi.
  - term: KFP
    meaning: Takanashi Kiara's official fanbase name and employee collective (Kiara
      Fried Phoenix).
  - term: Dakimakura
    meaning: A hugging pillow merchandise item featured in Kiara's 2026 birthday collection.
  - term: Ita bag
    meaning: A bag heavily decorated with badges, keychains, and merchandise displaying
      fan devotion to idols.
