global_summary:
  overall_summary: This YouTube video features Vestia Zeta's 3D Birthday Live concert
    titled 'Dance The Night Away! ♪' (#ZETA3DLIVE2026), broadcasted from the official
    Vestia Zeta Ch. hololive channel. The live-stream showcases dynamic 3D musical
    performances of her original songs ('Zero Gravity', 'CLOSE(R)', 'LOVE MISSION♡',
    'RADIO:ON', 'Ai Neko', and 'You're Mine'), guest collaborations with hololive
    talents Shirakami Fubuki, Oozora Subaru, Tsunomaki Watame, Kaela Kovalskia, and
    Kobo Kanaeru, engaging MC banter, merchandise reveals, and the announcement of
    her long-awaited 1st EP titled 'V/Z'.
