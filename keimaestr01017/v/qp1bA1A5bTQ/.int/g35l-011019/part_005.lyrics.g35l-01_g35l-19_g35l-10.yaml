global_summary:
  overall_summary: This YouTube livestream from Marine Ch. 宝鐘マリン hololive3期生 channel
    features VTuber Houshou Marine's 7th Anniversary 3D Live, titled '#宝鐘マリン7周年3DLIVE'.
    The celebration features spectacular music performances, duets and group numbers
    with special guest stars from hololive (Usada Pekora, Shiranui Flare, Shirogane
    Noel, Kobo Kanaeru, Ookami Mio, Inugami Korone), Shigure Ui, and Kaguya from the
    anime film 'Cho-Kaguya-Hime!'. A major highlight of the stream is the debut of
    Marine's brand-new 3D swimsuit outfit, accompanied by live MC segments, the debut
    performance of her new original song 'Kyapi', and announcements for 7th anniversary
    merchandise.
