global_summary:
  overall_summary: 'This video is a special streaming program titled ''Ijigen Fes
    Kaisaiginen Ongaku Bangumi MUSIC BIGBANG!'' broadcast on December 8, 2023, serving
    as the eve celebration (zenyasai) for the historic collaborative music festival
    ''Ijigen Fes IDOLM@STER★♥Love Live! Uta Gassen'' at Tokyo Dome. The program features
    four virtual personalities acting as publicity captains and ambassadors: Fuyuko
    Mayuzumi (from THE IDOLM@STER Shiny Colors), Tsushima Yoshiko/Yohane (from Love
    Live! Sunshine!!), Laplus Darknesss (from Hololive), and Dola (from NIJISANJI).
    The cast is divided into two teams (''Yohadra'' and ''Fuyurap'') for a friendly
    music battle, performing seven cross-franchise and original cover songs—including
    ''Aien Jihen'', ''SOS'', ''Wandering Dream Chaser'', ''Red Ruler'', ''in this
    unstable world'', ''Strawberry Trapper'', and the event theme song ''Ijigen★♥BIGBANG''—concluding
    with enthusiastic final remarks and hype for the main Tokyo Dome event.'
