    Live concert titled 'Hoshiakari' (星灯) streamed on her official channel. The concert
    showcases a dynamic setlist of solo and guest performances—including original
    tracks and popular covers alongside special guest appearances by Hololive members
    Ookami Mio, Sakura Miko, Tokoyami Towa, Shirogane Noel, Himemori Luna, Momosuzu
    Nene, and Tsunomaki Watame. The stream also includes merchandise and 1st album
    'Pleiades' announcements.
