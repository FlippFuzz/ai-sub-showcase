  thoughts: |+
    **Hololive Summer Festival - Subtitle Compilation**

    Okay, so I need to get these subtitles done, and quickly. This 4-way stream is a lot to juggle, but let's break it down. We've got Subaru's Cotton Candy Shop, Fubuki's Yo-yo shop, Bae's Nagashi Somen, and the Hololive Summer Festival, with all the VTubers and chat going.

    First up, it's a whirlwind of Japanese and English, so I need to be precise. Let's see... we start with the *FuwaMoco/Mio* interaction - colors, yo-yo choices. Subaru jumping in, cheerful as ever, asking what colors are left, and jumping on the discussion. Mio gives us a "grape soda" option! Someone shouts "Ketchup," must be talking about hot dogs or something. Then *FuwaMoco/Nerissa/Bae* are all over the yo-yos, talking about the lines and colors, the excitement is palpable!

    Subaru, as usual, gets right to it, asking how to *make* the cotton candy, Mio chiming in with the first steps. Someone is happy "Look, pretty!". Subaru asks what color to choose, Mio is trying to teach her how to do it "a little softer." Orange seems to be the order of the day. Subaru is getting Mio to pick an orange! Then *Fuwa/Moco* are on the same page "I know, right?" - they are doing well! Subaru is getting it prepped, and *Mio* is putting in the ingredients and going for it! "This is a great place to put the orange."

    Bae is getting in on the cotton candy, and *Nerissa* comments on the progress. Subaru's got the machine running, explaining the steps. *Mio* and *Fuwa/Moco* are all having a blast, and Nerissa is off in her own world with "pizza"! Chat is blowing up asking who is wreaking havoc with the yo-yos, and Subaru correctly identifies Mococo - she says she is not having chaos on her watch! Subaru gets back into the groove "spinning it." Nerissa makes her funny comments, "Who is that?" The chat is all about Biboo. Fuwa wants a burger!

    The yo-yo chatter resumes; so fast! They don't have scissors, they have them. Mococo is loving the apple candy. Subaru comments that we just have to wait. Now, Hakos Bae - summer memories? She's never been to a Japanese summer festival! Subaru is a little surprised - that is a point!

    Subaru says, *Mio*, stop, you're not done! Now they have the yo-yo thing down, with everyone playing along. Subaru tells *Mococo* "you're out of control!" - *Mio* is working on the exorcism of the yo-yo, I guess. *Nerissa* is going with this too - so confusing! Fuwa is asking for help - she will help. Subaru is liking the results. Nerissa is giving up and making a burger. *Nerissa* states the egg to make burgers. Mio is having so much fun, and they are all having fun!

    *Mio* and *Subaru* are discussing "is it working? "The cotton candy is coming out, and it's challenging! So far, only *Biboo* has succeeded. Subaru admits "It's seriously hard." *Biboo* states she does the trick "for children". Subaru is a big fan of the result! More talk about techniques, "the freeze change technique," *Mio* loves it! And Nerissa is trying to make something fun! "Make what makes you happy!" They are all working together. It is successful! Nerissa comments on the bun, it is logical to her. It is so fun! Subaru, "oops, sorry, got a little too close." Mio warns, "It's going to break! Stop!" The final result is a fun one! So fun, they can't get it right! *Subaru* and *Mio* say so with their own thoughts. The key is "Don't get the string wet!"

    *Bae* is getting hungry and wanting flowing somen. *Subaru* is on it, "Let's do flowing somen!" Bae is super excited, "I'm so hungry!" The team wants to chew this, not flowing! Subaru asks if she wants flowing somen. The end!


...
