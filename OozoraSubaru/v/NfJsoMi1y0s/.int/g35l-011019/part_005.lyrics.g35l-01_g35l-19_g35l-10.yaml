  overall_summary: This video is the 7th Anniversary 3D LIVE stream of Hololive 2nd-generation
    VTuber Oozora Subaru, titled '【#大空スバル7周年LIVE】大空スバル 7th 記念LIVE ラブミ❣：7th anniversary
    live'. Broadcasted on March 29, 2026, the live stream features the grand debut
    of Subaru's brand-new upgraded 3D model and costume. Subaru performs a dynamic
    setlist of original songs ('ぷ・れ・あ・で・す！', 'スターライト', 'ラブミ！') and popular covers
    ('Watch me!', 'ハイタッチ☆メモリー', 'めにしゅき♡ラッシュっしゅ！', '百花繚乱', 'こんなんじゃないっ！', 'Great Days',
    'ray', 'シルエット'), joined by various Hololive guest members (Sakura Miko, Shirakami
    Fubuki, Ookami Mio, Nekomata Okayu, Usada Pekora, Houshou Marine, Shirogane Noel,
    Tsunomaki Watame, Yukihana Lamy, and Takane Lui). The stream also includes merchandise
    announcements and heartfelt closing remarks celebrating her 7-year milestone.
