    original: そして見張りの実施が安全運行の基本です。意味は広く他の船とぶつかってしまう恐れはないと思われがちなんですけれども、見張り不十分による船同士の衝突は多くを発生しているんです。船長だけではなくミオさんのように船に乗っている人たちにも常に見張りを行って事故を防いでください。
    english: And conducting a proper lookout is the basis of safe navigation; while
