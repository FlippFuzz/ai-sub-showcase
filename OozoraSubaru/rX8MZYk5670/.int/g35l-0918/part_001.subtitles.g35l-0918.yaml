    original: 出港前点検の実施はプレジャーボートの事故では機関故障が多くを占める。二次災害に繋がる恐れがあるため必ず行おう！船が動かなくなったことによって流されて浅瀬に乗り上げてしまったり、他の船にぶつかって二次災害に繋がることもあることから出港前点検は必ず実施して船を適切に管理しましょう。
