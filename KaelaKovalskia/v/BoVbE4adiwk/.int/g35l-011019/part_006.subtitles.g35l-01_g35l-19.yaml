global_summary:
  overall_summary: 'In this 3D redebut live stream titled ''Déjà vu: its all coming
    back to me now'' (#3DJAVU), Kaela Kovalskia from hololive Indonesia Gen 3 (''holoh3ro'')
    wakes up trapped in a mysterious looping room reminiscent of an escape puzzle.
    As she solves riddles, receives Morse code clues over the phone from fellow talents,
    and navigates surreal corridors, she transitions into multiple dynamic musical
    performances featuring original songs and covers. Collaborating with special guests
    such as Ouro Kronii, Hakos Baelz, Nerissa Ravencroft, and Tokoyami Towa, Kaela
    celebrates her journey, community (''Pemaloe''), and memories before finally breaking
    the loop and concluding with heartfelt reflections.'
