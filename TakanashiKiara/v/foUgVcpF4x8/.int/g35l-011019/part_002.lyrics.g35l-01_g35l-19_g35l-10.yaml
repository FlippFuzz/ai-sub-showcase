  - term: KFP
    meaning: Takanashi Kiara's official fanbase name and employee collective (Kiara
      Fried Phoenix).
  - term: Dakimakura
    meaning: A hugging pillow merchandise item featured in Kiara's 2026 birthday collection.
  - term: Ita bag
    meaning: A bag heavily decorated with badges, keychains, and merchandise displaying
      fan devotion to idols.
