global_summary:
  overall_summary: Takanashi Kiara's 3D Birthday Concert 2026 (#KiaraBday2026) is
    a grand virtual music event themed entirely around Hello! Project (H!P) cover
    songs. Spanning multiple themed corners dedicated to legendary H!P groups such
    as Morning Musume, ℃-ute, S/mileage, Juice=Juice, and Berryz Kobo, the concert
    features high-energy choreography, costume changes, and guest appearances from
    Hololive members including Tokoyami Towa, Usada Pekora, Inugami Korone, Amelia
    Watson, hololive DEV_IS unit Flow Glow, Kobo Kanaeru, and Hololive English Justice
    members. The stream also includes merchandise announcements and celebratory closing
    remarks.
