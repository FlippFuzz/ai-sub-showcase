global_summary:
  overall_summary: 'This video features Takanashi Kiara''s 3D birthday concert titled
    ''SUPER SPECIAL SUMMER BIRTHDAY LIVE! #KiaraBDay2025'', streamed on her official
    Hololive English channel. The concert showcases high-energy solo performances,
    collaborative dance numbers and banter with special guests from Hololive JP (Momosuzu
    Nene, Kazama Iroha, Hoshimachi Suisei, La+ Darknesss, Ouro Kronii, Hololive ReGLOSS
    members Ichijo Ririka and Juufuutei Raden), Hololive ID (Airani Iofifteen, Moona
    Hoshinova, Kureiji Ollie, Vestia Zeta, Anya Melfissa), and indie guest Mint Fantome.
    Kiara performs a dynamic setlist of original songs and covers, announces birthday
    merchandise, and debuts her brand-new original song ''Tasty'' along with its music
    video premiere.'
