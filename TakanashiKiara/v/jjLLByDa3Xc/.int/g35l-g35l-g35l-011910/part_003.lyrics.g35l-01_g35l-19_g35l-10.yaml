global_summary:
  overall_summary: 'This video is a 3D concert hosted by Takanashi Kiara of Hololive
    English Myth, titled ''KIARA & FRIENDS: H!P Cover Song Spring Concert #HPmeetsHoloEN''.
    The concert is a dedicated tribute to Hello! Project (H!P), featuring numerous
    iconic J-pop idol songs from groups such as Morning Musume, Berryz Kobo, °C-ute,
    S/mileage, and Buono!. Kiara is joined by various Hololive English members across
    Myth, Promise, Advent, and Justice as guest performers in 3D, including Watson
    Amelia, Ninomae Ina''nis, Nerissa Ravencroft, Fuwawa & Mococo Abyssgard, Ouro
    Kronii, Shiori Novella, Mori Calliope, IRyS, Elizabeth Rose Blood Flame, Gigi
    Murin, Cecilia Immergreen, and Raora Panthera. The stream includes energetic dance
    performances, comedic MC banter about idol fandom and independence, interaction
    with cardboard cutout guest segments, and the live premiere performance of Kiara''s
    new original song ''PERFUME''.'
