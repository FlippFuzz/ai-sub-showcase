  overall_summary: This video captures Takanashi Kiara's 4th Anniversary 3D Live concert
    titled "MIRAGE", streamed on her official YouTube channel under hololive English.
    The event features high-energy musical performances, intricate choreography, and
    guest appearances by fellow hololive talents across EN, ID, and JP branches (including
    IRyS, Nerissa Ravencroft, Kazama Iroha, Ninomae Ina'nis, Roboco, AZKi, Ayunda
    Risu, Pavolia Reine, and Moona Hoshinova). Throughout the concert, Kiara performs
    a mix of her original tracks and popular covers, culminating in the debut performance
    and announcement of her new original song "MIRAGE" along with merchandise reveals.
