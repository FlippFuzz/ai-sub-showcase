global_summary:
  overall_summary: This is Gawr Gura's 2024 3D birthday celebration stream titled
    'SHARK CITY' on the hololive-EN channel. Emulating a retro 1980s Japanese City
    Pop aesthetic, Gura hosts a dazzling concert featuring a star-studded lineup of
    guest VTubers from hololive and hololive EN. Accompanied by backing animations
    and stylized stage setups, Gura performs a series of iconic city pop and idol
    covers and original tracks alongside guests including Houshou Marine, Nekomata
    Okayu, Sakura Miko, Shiranui Flare, Inugami Korone, La+ Darknesss, Murasaki Shion,
    Tokoyami Towa, Ouro Kronii, Minato Aqua, and Ninomae Ina'nis. The stream concludes
    with a special birthday merchandise announcement and closing remarks.
