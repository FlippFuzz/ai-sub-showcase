  overall_summary: This video is the official 'Graduation 3D Mini Live' broadcast
    for Gawr Gura from Hololive English, marking her final 3D concert and farewell
    performance after nearly five years as a VTuber. The stream features a diverse
    setlist of iconic cover songs and original tracks, including 'RIDE ON TIME', 'REFLECT',
    'Tokyo Wabi-Sabi Lullaby', 'SHINKIRO', 'Myth or Treat', 'Our Bright Parade', and
    'Ash Again'. Following the musical performances, Gura delivers an emotional farewell
    speech from the bottom of her shark heart, thanking her fans (Chumbies), Hololive
    Myth members, and staff. The video concludes with a touching animated segment
    of Gura packing up her room and trident before walking into the ocean sunset.
