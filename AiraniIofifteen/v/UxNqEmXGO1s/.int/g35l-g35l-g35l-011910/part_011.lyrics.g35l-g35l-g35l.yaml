global_summary:
  overall_summary: This video captures the 2024 birthday 3D live concert of Airani
    Iofifteen from hololive Indonesia, titled 'Galaxy Ticket'. The stream features
    vibrant stage performances, colorful paint-themed visuals, guest appearances by
    hololive and HOLOSTARS members (Tokino Sora, Kageyama Shien, Aragami Oga, Omaru
    Polka, Hakos Baelz, and Vestia Zeta), an entertaining food review hospitality
    corner involving unusual snacks, merchandise announcements, and the grand premiere
    of her second original song 'Here I am'.
