    english: JAPAN's Art History! (Test is also a breeze!)
  - start: '01:05.770'
    end: '01:08.570'
    original: お・ぼ・え・ま・SHOW！ありがとう！
    english: O-bo-e-ma-SHOW! Thank you!
  - start: '01:21.080'
    end: '01:23.500'
    original: ライブをご覧になっている皆様、こんばんは。
    english: To everyone watching the live stream, welcome.
  - start: '01:25.550'
    end: '01:31.750'
    original: ライブの途中ではございますが、ここでらでんのこぼなし美術解説の時間です！
    english: It's time for Raden's story art history lecture!
  - start: '01:32.750'
    end: '01:35.080'
    original: なんと今回ご紹介するのは…
    english: And what we're introducing today is...
  - start: '01:36.550'
    end: '01:44.250'
    original: こちらでん！じゃじゃーん！国宝「八橋蒔絵螺鈿硯箱」ということで、
    english: this! Tada! National Treasure, "Yatsuhashi Maki-e Raden Suzuri-bako"!
  - start: '01:45.350'
    end: '01:52.550'
    original: 今回特別に東京国立博物館さんから3Dモデルをお借りしましたー！
    english: We have specially borrowed a 3D model from the Tokyo National Museum!
  - start: '01:53.380'
    end: '02:03.080'
    original: ゆほ、みんなにもよく見てもらいましょう、こちらでございます！こちらがバーチャル八橋蒔絵螺鈿硯箱です。
    english: Let's take a closer look, everyone. Here it is! This is the Virtual Yatsuhashi
      Maki-e Raden Suzuri-bako.
  - start: '02:03.350'
    end: '02:11.250'
    original: らでんってなんかどっかで聞いたことがありますね、なんかそんな名前のバーチャルユーチューバーがいるような、いないような。
    english: '"Raden"... Have I heard that name somewhere before? Like, a virtual
      YouTuber with that name... wait, no.'
  - start: '02:12.180'
    end: '02:18.380'
    original: こちらは私のオリジナル曲「JAPANの美術史おぼえまSHOW」にも登場する作品です。
    english: This is a work that also appears in my original song, "JAPAN's Art History
      Oboemashou."
  - start: '02:18.980'
    end: '02:33.780'
    original: どうですか皆さんこの輝きとデザイン！大胆かつ花びらの装飾の細かい部分も美しいこちらの作品。作ったのは尾形光琳という人です。
    english: What do you think of this radiance and design, everyone? The fine details
      of the blooming and scattering iris petals are so gorgeous. This work was created
      by Ogata Korin.
  - start: '02:33.480'
    end: '02:39.180'
    original: これがこの硯箱を作ったのは江戸時代なんですが、どこかモダンな要素も感じることができます。
    english: He created this suzuri-bako in the Edo period, but you can feel some
      modern elements in it too.
  - start: '02:39.380'
    end: '02:45.980'
    original: さて、工芸品を見るとき様々な見方がありますが、手助けになるのは作品名です。
    english: Now, when looking at crafts, there are various ways to appreciate them,
      but what will help is the title of the work.
  - start: '02:45.880'
    end: '02:46.980'
    original: ではスライドいきます。
    english: So let's go to the slide.
  - start: '02:48.880'
    end: '02:59.080'
    original: この工芸品の名前復習しましょう。「八橋蒔絵螺鈿硯箱」。漢字がたくさん入っていますが、1つ1つ紐解いていきます。
    english: 'Let''s review the name of this craft: "Yatsuhashi Maki-e Raden Suzuri-bako."
      It has a lot of kanji, so let''s break it down one by one.'
  - start: '02:59.180'
    end: '03:09.980'
    original: まずは「八橋」。日本美術史における工芸品は物語の1場面や和歌、歌ですね、がテーマになっていることが少なくありません。
    english: First is "Yatsuhashi." In Japanese art, crafts often take scenes from
      stories like "The Tale of Ise" or waka poetry as their theme.
  - start: '03:10.280'
    end: '03:19.480'
    original: そしてこの硯箱もその1つ。『伊勢物語』第九段三河国八橋の場面が主題になっているんですよ。
    english: 'And this suzuri-bako is one of them. It''s based on "The Tale of Ise,
      9th Section: Mikawa Province Yatsuhashi."'
  - start: '03:19.480'
    end: '03:22.080'
    original: なのでこれは橋ですね。
    english: So this is a "hashi" (bridge).
  - start: '03:22.180'
    end: '03:29.080'
    original: 八橋、この場面に出てくる八つの橋のこと、つまりは何を描いたかを表しています。
    english: '"Yatsuhashi" refers to the eight-plank bridge appearing in this scene,
      and it expresses what is being depicted.'
  - start: '03:29.680'
    end: '03:38.280'
    original: では何をえがいたかが分かったら次ににどんな技法が使われたかそれを表すのが蒔絵そしてらでんです。
    english: So, once we know what is depicted, next we look at what technique was
      used. That's expressed by "maki-e" and "raden."
  - start: '03:38.880'
    end: '03:52.080'
    original: 蒔絵とは簡単に言うと、金の粉を漆という接着剤を用いて貼り付けたもの。ここで言うと、かきつばたの葉の部分ですね、ピュンピュンてなってる部分です。
    english: Simply put, "maki-e" is a lacquer craft technique where gold or silver
      powder is adhered using urushi as an adhesive. Here, it's used for the leaves
      of the irises.
  - start: '03:53.080'
    end: '04:12.380'
    original: 次に螺鈿とは貝の光沢を持つ部分を薄くして貼り付ける加飾法。「螺」は巻き貝をさし、「鈿」にはかざるという意味がある。この作品に使われているのはアワビ貝で、花びらを表現するためにあえて穴の開いた貝を使用しているのが分かります。
    english: Next, "raden" is a technique where the lustrous part of a shell is thinned
      and pasted on. Here, it's used for the iris flowers, and they deliberately used
      pierced shells to represent the petals.
  - start: '04:16.480'
    end: '04:22.080'
    original: そして最後にそもそもこれは何か？それを表すのが硯箱です。
    english: And finally, what is this in the first place? That's expressed by "suzuri-bako"
      (inkstone box).
  - start: '04:22.080'
    end: '04:35.080'
    original: え、真ん中ご覧ください。こちら、え、墨汁を作る硯入れが上の段にあり、それにその下の、え、下の段は用紙紙入れになっています。
    english: Take a look at the middle. Here, the inkstone tray for making ink is
      on the upper tier, and below that is the paper storage area.
  - start: '04:34.980'
    end: '04:41.980'
    original: さあこれで「八橋蒔絵螺鈿硯箱」の言葉の紐解きが完了しましたね。
    english: So now the tracing of the words for "Yatsuhashi Maki-e Raden Suzuri-bako"
      is complete.
  - start: '04:42.080'
    end: '04:52.080'
    original: かきつばたが咲く川にかかる橋のダイナミックな魅力にも大注目なのがこの硯箱。パカッと開けると、波が描かれています。
    english: The dynamic appeal of the bridge over the irises—opening this suzuri-bako
      reveals waves painted inside.
  - start: '04:52.680'
    end: '05:02.080'
    original: もうここまで聞いたらなぜそこに波の意匠を施したのか皆さんならお分かりですね。上の段にある橋の下の
    english: By now, you probably all understand why waves are applied on the lower
      tier beneath the bridge!
  thoughts: null
