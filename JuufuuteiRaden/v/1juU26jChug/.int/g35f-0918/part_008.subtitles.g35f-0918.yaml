    original: クロード・モネ『睡蓮の池』
    english: Claude Monet, "The Water-Lily Pond"
  - start: '00:03.000'
    end: '00:11.000'
    original: 今回なんと！ロンドンのナショナル・ギャラリーさんより画像をお借りしております！本当にありがとうございます！
    english: This time, we actually borrowed the image from The National Gallery in
      London! Thank you so very much!
  - start: '00:11.000'
    end: '00:13.500'
    original: 皆さん、どうですか？
    english: Everyone, what do you think?
  - start: '00:13.500'
    end: '00:17.500'
    original: 私、モネの描く世界が大好きなんです。
    english: I absolutely love the world that Monet paints.
  - start: '00:17.500'
    end: '00:21.500'
    original: モネと言えば、日本でもとても人気の高い画家ですが
    english: Speaking of Monet, he is a highly popular painter in Japan as well,
  - start: '00:21.500'
    end: '00:24.800'
    original: 彼の絵画の魅力はどのようなところにあるのでしょうか？
    english: but what is the charm of his paintings?
  - start: '00:24.800'
    end: '00:30.800'
    original: 今回は、彼の絵画に内在する魅力を言語化していきましょう！
    english: This time, let's put the inherent charm of his paintings into words!
  - start: '00:31.000'
    end: '00:35.800'
    original: この作品は、1899年頃描かれました。
    english: This piece was painted around 1899.
  - start: '00:35.800'
    end: '00:45.500'
    original: 緑色の光が溢れる睡蓮の池には、大きな橋が架かり、橋の奥には柳が描かれています。
    english: Over the water-lily pond filled with green light, a large bridge is built,
      and behind the bridge, willows are painted.
  - start: '00:45.500'
    end: '00:50.500'
    original: 実はこの場所、モネの自宅に作った池なんです。
    english: Actually, this place is a pond that Monet built at his own home.
  - start: '00:50.500'
    end: '00:59.800'
    original: フランスのジヴェルニーという町に家を購入した彼は、近隣の川から水を引いて、自分の理想とする庭を作りました。
    english: He purchased a house in Giverny, France, drew water from a nearby river,
      and created his ideal garden.
  - start: '01:00.500'
    end: '01:08.500'
    original: アーチ状の大きな橋。これはいわゆる「太鼓橋」と呼ばれる橋と、柳。
    english: A large arched bridge. This is a so-called "taiko-bashi" (drum bridge),
      and willows.
  - start: '01:08.500'
    end: '01:13.500'
    original: あれ、なんだか日本っぽさを感じませんか？
    english: Wait, doesn't it feel somewhat Japanese-like?
  - start: '01:13.500'
    end: '01:18.500'
    original: それもそのはず。彼は日本の浮世絵に強く影響を受けた画家でした。
    english: That makes sense. He was a painter heavily influenced by Japanese ukiyo-e.
  - start: '01:18.500'
    end: '01:26.500'
    original: 彼の描く絵は光に溢れていて、目の前で風が吹いて、水面が揺れているようにも見えます。
    english: The paintings he creates are overflowing with light, making it look as
      though wind is blowing right before your eyes and the water's surface is swaying.
  - start: '01:26.500'
    end: '01:34.500'
    original: じーっと見てると、水も、花も、木も、橋も、空気でさえも溶けていくようです。
    english: Staring closely, the water, the flowers, the trees, the bridge, even
      the air seems to melt away.
  - start: '01:34.500'
    end: '01:38.500'
    original: 見ていて落ち着く絵画だと思いませんか？
    english: Don't you think it's a painting that feels peaceful to look at?
  - start: '01:38.500'
    end: '01:49.000'
    original: モネは絵を描くとき、色を混ぜて塗るのではなく、純粋な、何も混ざっていない色を「置く」ように塗りました。
    english: When Monet painted, instead of mixing colors to apply them, he applied
      pure, unmixed colors as if "placing" them.
  - start: '01:49.000'
    end: '01:55.500'
    original: 色は混ぜれば混ぜるほど、塗り重ねれば重ねるほど、暗くなっていきます。
    english: The more you mix colors and the more layers you apply, the darker they
      become.
  - start: '01:55.500'
    end: '02:04.500'
    original: 彼はこの課題を「色を置く」ことによって解決し、光に溢れた絵画の表現に成功したんです。
    english: He solved this issue by "placing colors," successfully expressing a painting
      overflowing with light.
  - start: '02:04.500'
    end: '02:09.500'
    original: この絵画に近づいてみると、筆跡がしっかり残っています。
    english: If you look closer at this painting, the brushstrokes remain clearly
      visible.
  - start: '02:09.500'
    end: '02:24.000'
    original: 隣り合った絵の具一つ一つの相乗効果を計算し、絵の具の塊から温度感や湿度感を感じることができる風景へと変貌する表現は、モネが生涯かけて研究していたものです。
    english: Calculating the synergetic effect of each neighboring paint, turning
      a clump of paint into a landscape where you can feel warmth and humidity, is
      the expression Monet researched throughout his life.
  - start: '02:24.000'
    end: '02:31.500'
    original: 光を求めたモネが、陰影のない日本の浮世絵に強く惹かれたのも理解できますね。
    english: It makes sense why Monet, in his pursuit of light, was strongly drawn
      to shadowless Japanese ukiyo-e.
  - start: '02:31.500'
    end: '02:40.500'
    original: 彼の絵画の明るさは、画家としての研究の成果であり、情熱さえ感じられるそんな作品だと私は感じます。
    english: The brightness of his paintings is the result of his research as an artist,
      and I feel it is a work where you can even sense his passion.
  - start: '02:40.500'
    end: '02:44.200'
    original: みんなはこの絵画、どう読んだかな？
    english: How did everyone interpret this painting?
  - start: '02:44.200'
    end: '02:54.000'
    original: 実はモネは「印象派」の画家と呼ばれるきっかけを作った人でもあるんですが、それはまた別のお話。
    english: Actually, Monet was also the one who created the catalyst to be called
      an "Impressionist" painter, but that is a story for another time.
  - start: '02:54.000'
