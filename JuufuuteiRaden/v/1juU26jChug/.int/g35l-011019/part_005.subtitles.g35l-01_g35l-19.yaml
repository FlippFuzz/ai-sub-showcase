      he composed a poem about his wife using the five syllables of "kakitsubata,"
      and was so moved he wept buckets without finishing his bento. So this is the
      bridge.
  - start: '03:26.100'
    end: '03:36.500'
    original: 八橋、この場面に出てくる八つの橋のこと、つまりは何を描いたかを表しています。では、何を描いたかが分かったら次にどんな技法が使われたか。
    english: Yatsuhashi refers to the eight bridges that appear in this scene—in other
      words, what is depicted. Now, once you know what is depicted, next is what technique
      was used.
  - start: '03:36.600'
    end: '03:38.900'
    original: それを表すのが「蒔絵」、そして「螺鈿」です。
    english: Expressing that are "makie" and "raden."
  - start: '03:39.000'
    end: '03:52.500'
    original: 蒔絵とは簡単に言うと金の粉を漆という接着剤を用いて貼り付けたもの。ここで言うと、かきつばたの葉の部分ですね、ピョンピョンってなってる部分です。
    english: Makie, simply put, is attaching gold powder using lacquer as an adhesive.
      Speaking of here, it's the iris leaves—the parts sticking up like this.
  - start: '03:52.600'
    end: '04:09.500'
    original: 次に「螺鈿」とは、貝の光沢を持つ部分を薄くして貼り付ける加技法。「螺」は巻き貝をさし、「鈿」にはかざるという意味がある。この作品に使われているのはアワビ貝で、
    english: Next, "raden" is a technique where the lustrous part of a shell is thinned
      and pasted on. "Ra" refers to conch shells, and "den" means to decorate. The
      shell used in this work is abalone,
  - start: '04:09.600'
    end: '04:16.800'
    original: 花びらを表現するために、あえて穴の開いた貝を使用しているのが分かります。
    english: and you can see that shell with intentional holes is used to represent
      the petals.
  - start: '04:16.900'
    end: '04:22.000'
    original: そして最後に、そもそもこれは何か？それを表すのが「硯箱」です。
    english: And finally, what on earth is this? What expresses that is "suzuribako."
  - start: '04:22.100'
    end: '04:35.000'
    original: え、真ん中ご覧ください、こちら。え、牧童を作る硯入れが上の段にあり、さらにその段の下、え、下の段は漁師紙入れになっています。
    english: Um, please look at the center, here. Um, the inkstone holder for making
      ink is on the upper tier, and below that tier, um, the lower tier is a paper
      holder.
  - start: '04:35.100'
    end: '04:42.000'
    original: さあ、これで八橋蒔絵螺鈿硯箱の言葉の紐解きが完了しましたね。
    english: Now, with this, the breakdown of the words for the Yatsuhashi Makie Raden
      Suzuribako is complete.
  - start: '04:42.100'
    end: '04:59.000'
    original: かきつばたが咲く川にかかる橋のダイナミックな魅力にも大注目なこの硯箱、パカッと開くと波が描かれてもうここまで聞いたらなぜそこに波の意匠を施したのか皆さんならお分かりですね。
    english: This suzuribako, which also draws major attention for the dynamic appeal
      of the bridge spanning the iris-blooming river, opens up to reveal waves painted
      inside. Once you've heard this much, you all understand why the wave design
      was applied there, right?
  - start: '04:59.100'
    end: '05:03.000'
    original: 上の段にある橋の、下の
    english: Below the bridge on the upper tier...
