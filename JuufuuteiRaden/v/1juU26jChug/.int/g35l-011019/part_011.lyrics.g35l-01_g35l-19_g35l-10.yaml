user_context: 'This is a YouTube video from Raden Ch. 儒烏風亭らでん ‐ ReGLOSS channel. The
  video title is ''【 #らでん新衣装お披露目3Dライブ 】歌って踊ってミラクル重大発表祭り！【儒烏風亭らでん #ReGLOSS 】''.'
