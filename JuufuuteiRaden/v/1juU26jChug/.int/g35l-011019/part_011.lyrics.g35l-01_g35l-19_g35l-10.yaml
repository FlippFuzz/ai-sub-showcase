  - start: '00:31.505'
    end: '00:39.795'
    original: どこにも同じものはないの ほら 生きてる証
    english: There's nothing identical anywhere, look, proof that we're alive.
  - start: '00:42.500'
    end: '00:48.500'
    original: 風は歌い 雨は語り たどり着くよ
    english: The wind sings, the rain tells a tale, and we will reach it.
  - start: '00:49.000'
    end: '00:54.800'
    original: 光のすみかへ 幾重にも重なってるこの星の偶然
    english: To the dwelling place of light, the coincidence of this star overlapping
      layers and layers.
  - start: '00:58.000'
    end: '01:05.500'
    original: 影の向こう 真実の色見つけ出すよ
    english: Beyond the shadows, I'll find the true color.
  - start: '01:06.000'
    end: '01:12.000'
    original: 光のすみかを 一つでも欠けていたら きっと
    english: If even a single piece of the dwelling place of light were missing, surely...
  - start: '01:13.000'
    end: '01:19.000'
    original: 出会えてなかったね
    english: '...we wouldn''t have met.'
  - start: '01:54.100'
    end: '01:57.450'
    original: ライブをご覧になっている皆様、こんばんは。
    english: Good evening, everyone watching the live stream.
  - start: '01:57.900'
    end: '02:04.200'
    original: ライブの途中ではございますが、ここでらでんの小話美術解説の時間です！
    english: Although we are in the middle of the live stream, it's time for Raden's
      short art commentary!
  - start: '02:04.600'
    end: '02:15.550'
    original: 今回ご紹介するのは、こちらじゃん！ フィンセント・ファン・ゴッホ「ひまわり」。
    english: What I'm introducing this time is, ta-da! Vincent van Gogh's "Sunflowers".
  - start: '02:15.950'
    end: '02:26.500'
    original: 今回、ナショナル・ギャラリーさんより画像をお借りしております！ありがとうございます。
    english: This time, we have borrowed images from The National Gallery! Thank you
      very much.
  - start: '02:26.700'
    end: '02:37.800'
    original: ゴッホといえば「ひまわり」というイメージを持っている方も少なくないのではないでしょうか。それもそのはず、実はゴッホの描いた「ひまわり」は一つだけじゃないんです。
    english: Many of you probably have the image of "Sunflowers" when you think of
      Van Gogh. And for good reason—actually, Van Gogh didn't just paint one "Sunflowers".
  - start: '02:38.000'
    end: '02:43.050'
    original: この世界に失われたものも含めて、7つの「ひまわり」があったんですよ。
    english: Including the ones lost to this world, there were seven "Sunflowers".
  - start: '02:43.200'
    end: '02:51.600'
    original: さて、では実際に作品をじっくり見てみましょう。みんなはどんな感想を持ったかな？
    english: Now, let's actually take a close look at the artwork. What impressions
      did everyone have?
  - start: '02:51.700'
    end: '03:00.650'
    original: 改めて見ると、いろんなことが見えてきます。よく見ると、ひまわりの向きはバラバラで、花びらも不揃いですね。
    english: Looking at it again, various things become apparent. If you look closely,
      the directions of the sunflowers are all scattered, and the petals are uneven.
  - start: '03:00.750'
    end: '03:07.700'
    original: しかし、温かな黄色が画面全体を包み込むことで、どこか生命力が溢れているようにも見えませんか？
    english: However, doesn't the warm yellow enveloping the whole screen somehow
      make it look full of vitality?
  - start: '03:08.000'
    end: '03:14.600'
    original: ここからはゴッホと黄色、そしてゴッホと「ひまわり」について紐解いていきましょう。
    english: From here, let's unravel the connection between Van Gogh and yellow,
      and Van Gogh and "Sunflowers".
  - start: '03:15.000'
    end: '03:24.700'
    original: 太陽は淡い硫黄の輝きを伝達するのだ、という言葉を残しているゴッホは、太陽の光を黄色で表現しました。
    english: Leaving behind the words "The sun transmits a pale sulfur radiance,"
      Van Gogh expressed the light of the sun in yellow.
  - start: '03:24.900'
    end: '03:29.800'
    original: そして黄色はゴッホにとって生命力の象徴でもあります。
    english: And yellow is also a symbol of vitality for Van Gogh.
  - start: '03:30.000'
    end: '03:43.400'
    original: この絵を描いた時、彼はフランス南部のアールルという街で新天地、画家として仲間と頑張っていこうと意気込んでいました。そんな気持ちを黄色に託したのかも知れません。
    english: When he painted this picture, he was enthusiastic about working hard
      with friends as a painter in a new place called Arles in southern France. Perhaps
      he entrusted such feelings to yellow.
  - start: '03:43.700'
    end: '03:49.000'
    original: 一方で、この絵のモチーフになっている「ひまわり」について見てみましょう。
    english: On the other hand, let's look at "Sunflowers," which is the motif of
      this painting.
  - start: '03:49.100'
    end: '03:56.250'
    original: ひまわりは太陽に向かって咲きます。太陽は西洋美術史において神を象徴します。
    english: Sunflowers bloom facing the sun. The sun symbolizes God in Western art
      history.
  - start: '03:56.500'
    end: '04:07.100'
    original: それに向かって咲くひまわりは、崇拝、従順、忠実、そして信仰心や愛を象徴します。
    english: Sunflowers blooming toward it symbolize worship, obedience, loyalty,
      and faith or love.
  - start: '04:07.300'
    end: '04:12.750'
    original: ここでさらに遠回りして、彼の過去について知っていきましょう。
    english: Let's take a further detour here and learn about his past.
  - start: '04:12.900'
    end: '04:20.150'
    original: 先ほどゴッホがアールルでの生活を始めた時、私は「新天地！」という表現をしました。
    english: Earlier, when Van Gogh started his life in Arles, I used the expression
      "A new realm!"
  - start: '04:20.300'
    end: '04:25.100'
    original: 実は彼、元々は牧師さんになりたかったんです。
    english: Actually, he originally wanted to become a pastor.
