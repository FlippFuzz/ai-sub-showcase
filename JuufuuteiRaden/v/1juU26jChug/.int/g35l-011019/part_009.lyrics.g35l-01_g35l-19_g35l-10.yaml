global_summary:
  overall_summary: 'This YouTube livestream from Raden Ch. 儒烏風亭らでん ‐ ReGLOSS features
    the 3D new costume reveal live and subscriber milestone celebration titled ''Miracle
    Major Announcement Festival''. Juufuutei Raden performs a vibrant set of live
    songs and dance numbers, interspersed with educational art history commentary
    segments covering masterpieces like the National Treasure Yatsuhashi Makie Raden
    Suzuribako, Claude Monet''s ''Water Lily Pond'', and Vincent van Gogh''s ''Sunflowers''.
    The stream is highlighted by three major announcements: a collaboration with the
    Tokyo National Museum (including Genji Monogatari exhibition audio guides), a
    major international collaboration with The National Gallery, London (featuring
    original collaboration goods, audio guides, and a ReGLOSS London location shoot),
    and the announcement of the ''Pixel Museum: Hakone Tanbo Edition'' DLC alongside
    100M/1M subscriber anniversary goods.'
