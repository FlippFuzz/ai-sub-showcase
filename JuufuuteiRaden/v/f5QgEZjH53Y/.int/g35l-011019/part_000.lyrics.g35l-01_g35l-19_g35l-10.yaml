    Rin, HIMEHINA, and her ReGLOSS bandmates (Hiwasa Ao, Otonose Kanade, Ichijo Ririka,
    Todoroki Hajime), alongside solo performances and real-time audience polls determining
    song selections. The stream celebrates her first solo birthday live, highlighting
    her passion for art, traditional culture, and community connections.'
