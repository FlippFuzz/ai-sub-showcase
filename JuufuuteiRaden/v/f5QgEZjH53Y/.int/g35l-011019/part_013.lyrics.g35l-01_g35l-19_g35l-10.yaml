  original: 3つ目は、こちら！ででーん！らでんのラジオ風ポーチ！アンティークなラジオ風のデザインポーチとなっております。中身が見えるクリア窓となっておりまして、ホロライブフレンド2号儒烏風亭らでんをこう縦に入れてね、あの、いい感じに入るくらいのサイズ感となっております。
  english: 'Third is this! Ta-da! Raden''s Radio-style Pouch! It''s an antique radio-style
    design pouch. It features a clear window where you can see inside, sized just
    right to vertically fit Hololive Friend #2 Juufuutei Raden.'
- start: '03:51.500'
  end: '04:15.500'
  original: そしてお次はこちら！ででーん！印籠風キーホルダー！はーい、印籠風キーホルダーでございます。皆さんあの印籠をご存知でしょうか？えー、蓋がね、パカッと開閉可能なやつで、あのあれ、あの、この紋所がぁ！のやつです！えー、蓋が開閉可能でございます。中は空洞ですよ。ぜひ皆さんもね、この印籠風キーホルダーでこの紋所が目に留まらぬぁごっこに使ってください！
  english: And next is this! Ta-da! Inro-style Keychain! Yes, it's an Inro-style keychain.
    Do you all know about 'inro'? It's one where the lid pops open and closed—you
    know, the 'Look upon this crest!' kind of thing! The lid can be opened and closed.
    The inside is hollow. Please use this Inro-style keychain to play house and shout,
    'Behold the sight of this family crest!'
- start: '04:16.000'
  end: '04:26.000'
  original: お次はこちら！ででーん！はい、今回ボイスASMRとなっております。タイトルは散歩のすすめボイス、台本は自分で考えましたー！
  english: Next is this! Ta-da! Yes, this time the voice is ASMR. The title is 'Recommendation
    for a Walk Voice', and I wrote the script myself!
- start: '04:26.000'
  end: '04:50.000'
  original: そしてフルセットの購入特典があります！フルセット購入特典は、こちら！ででーん！直筆サイン入りポストカードでございます！それから特典のASMRボイス散歩のすすめボイスが入っております。今回サインに関しては無制限でございます！えー焦らずにご購入いただければと思います、頑張って書きますよ！頑張りまーす！
  english: And there's a purchase bonus for the full set! The full set purchase bonus
    is this! Ta-da! It's a postcard with a handwritten signature! Plus, the bonus
    ASMR voice 'Recommendation for a Walk Voice' is included. This time, autographs
    are unlimited! Uh, please don't rush and purchase at your leisure, I'll write
    them hard! I'll do my best!
- start: '04:51.000'
  end: '05:02.000'
  original: さらに、えーフルセット特典がまだあります、うん。えーさらにフルセット特典として、えー昨年の9月から販売されましたホロライブオフィシャルカードゲームで使用できるカードが1枚...
  english: Plus, uh, there's still more full set bonuses, yep. Uh, plus, as a full-set
    bonus, uh, one card that can be used in the Hololive Official Card Game released
    last September...
