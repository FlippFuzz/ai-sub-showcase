      easel so you can display it at home! The size is about 15cm x 22cm!
  - start: '03:14.000'
    end: '03:32.000'
    original: '2つ目は、こちら！ででーん！SNS風アクリルキーホルダー！イラストはきのこシリーズの動画でお馴染みばかくんさんせい先生に描いていただきました！お出かけに行った際に一緒にね、これとね、一緒に写真撮って貰って、ぜひハッシュタグ
