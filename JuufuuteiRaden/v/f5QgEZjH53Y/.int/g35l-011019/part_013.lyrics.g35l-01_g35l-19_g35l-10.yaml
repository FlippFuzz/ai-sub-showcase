  - start: '02:56.000'
    end: '03:13.000'
    original: ね、このレトロな雰囲気いいでしょー！すごくいいよね！この立ててるやつ、これね、こういうの、イーゼルっていうんですが、この立ててるやつイーゼルもついてて、お家で飾れます！サイズは15センチ×22センチくらいです！
