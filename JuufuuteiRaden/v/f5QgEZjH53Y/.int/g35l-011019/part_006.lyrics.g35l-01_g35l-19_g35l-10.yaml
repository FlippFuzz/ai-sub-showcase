  original: でも一緒に歌えて楽しくて嬉しいです。ありがとうございます！
  english: But it was fun and happy singing together. Thank you!
- start: '02:40.000'
  end: '02:41.500'
  original: おじゃましました。ありがとうございます。
  english: Thanks for having us. Thank you.
- start: '02:43.500'
  end: '02:50.000'
  original: で、この「鎌倉STYLE」って曲もすごくノリの良い曲で、二人で歌うのもいいけどちょっと「なんか二人と一緒に歌いたいな！」みたいなところがあって
  english: And this song "Kamakura Style" has a great groove. Singing it just between
    the two of us is nice, but I thought, "I'd love to sing it together with the two
    of them!" and had that feeling...
- start: '02:50.000'
  end: '02:59.000'
  original: ちょっとドキドキしながらお声がけさせていただいたんですけれど、心良く来ていただきました！本当にありがとうございます！楽しかった！楽しくて止まんねえ！ありがとうございます！
  english: '...so I reached out with a fluttering heart, and you gladly came! Thank
    you so much! It was so fun! I couldn''t stop having fun! Thank you!'
- start: '02:59.500'
  end: '03:00.500'
  original: めっちゃ楽しかった。
  english: It was super fun.
- start: '03:01.000'
  end: '03:08.000'
  original: とりあえずリハでね、間奏の部分でぐるぐる回るのをやってたんですけど、らでんさんが死んでしまうということで、本番はやめようと。
  english: We practiced spinning around during the instrumental break, but since Raden-san
    almost died, we decided to stop for the real thing.
- start: '03:09.000'
  end: '03:14.500'
  original: 息が上がって上がってね、らでんの。ずっと楽しそうだから。
  english: Raden's breath kept getting higher and higher. She looked like she was
    having fun the whole time.
- start: '03:15.000'
  end: '03:19.500'
  original: 楽しかったし、なんかあの、リハの最中にこうさかさんが私に「あれ？そんなキャラだっけ？」って
  english: It was fun, and also, during rehearsal, Kousaka-san asked me, "Huh? Is
    that your character?"
- start: '03:20.000'
  end: '03:24.000'
  original: 「あれ？なんかラディッチ、そんなキャラだっけ？」って。
  english: '"Huh? Is Ladich such a character?"'
- start: '03:24.500'
  end: '03:29.000'
  original: 初めて会った時さ、ほら、あ、なんて聡明な方なんだろうか
  english: When we first met, you know, I thought, "My, what a brilliant person she
    is."
- start: '03:29.500'
  end: '03:34.000'
  original: 「こうさか君にお前と背あんだいだな」って言われたのめっちゃ覚えてる。
  english: I remember very well you saying, "Kousaka-kun, you and I are on the same
    wavelength."
- start: '03:34.500'
  end: '03:40.000'
  original: 今日めちゃくちゃエンジンかかってるわ、ほら。フェーリ、僕よりマジ元気！
  english: Today your engine is running like crazy, look. Ferri, you're seriously
    more energetic than me!
- start: '03:40.500'
  end: '03:46.500'
  original: びっくりしちゃった。でもおかげさまでリハーサルからずっと楽しくて、ステージの上でも楽しかっためちゃくちゃ。
  english: I was surprised. But thanks to that, ever since rehearsal it's been so
    fun, and on stage it was super fun too.
- start: '03:46.800'
  end: '03:49.000'
  original: いや嬉しい、ありがとうございます！
  english: I'm so glad, thank you!
- start: '03:50.000'
  end: '03:56.500'
  original: なんか、宣伝していきますか？雑！急に雑！
  english: Shall we do some promotions? So abrupt! Suddenly abrupt!
- start: '03:56.500'
  end: '04:05.000'
  original: まあ、我々もね活動してるんですけど、ま、なんかXなりYouTubeチャンネルなり見ていただければ。今日はもうらでんさんおめでとうございますと。
  english: Well, we're active too, so please check our X or YouTube channels. Today,
    congratulations to Raden-san.
- start: '04:05.000'
  end: '04:15.000'
  original: ライブもまだまだ続くので、まあ、僕らから言う出汁もありませんが、最後までぜひ皆さん盛り上がっていっていただければと思います。改めて、らでんさん誕生日おめでとうございます！
  english: The live will keep going, so we don't have much else to say, but I hope
    everyone stays hyped till the end. Once again, Happy Birthday, Raden-san!
- start: '04:15.000'
  end: '04:19.500'
  original: ありがとうございます！こうさかさん、りゅがさきさん、今日は本当にありがとうございました！ありがとうございました！
  english: Thank you! Kousaka-san, Ryugasaki-san, thank you so much today! Thank you!
- start: '04:20.000'
  end: '04:25.000'
  original: 引き続き楽しんでください！がんばります！バイバイ！お二人ともありがとうございました！
  english: Please keep enjoying! We'll do our best! Bye-bye! Thank you both so much!
- start: '04:26.000'
  end: '04:28.000'
  original: お二人ともありがとうございました！
  english: Thank you both!
- start: '04:28.500'
  end: '04:45.000'
  original: 次の曲もなんと！ゲストがゲストの方がいらっしゃいます！それではどうぞ！
  english: And what's more, for the next song, we have a guest! A guest is here! Here
    they come!
