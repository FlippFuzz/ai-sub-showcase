    **My Thoughts on Juufubuki Raden's Birthday Goods Presentation**

    Okay, so I need to make some subtitles. I just finished listening and transcribing. It looks like Juufubuki Raden is showing off her 2025 birthday merchandise.

    First, there's a card. It's usable in the hololive OFFICIAL CARD GAME. It's a bonus for purchases made starting in September. It's a key card, or "Oshi Holomem Card." You have to buy from the hololive OFFICIAL SHOP to get the card. The card details are on the website. Note, the card is in Japanese only.

    Next up, the birthday goods, two options! The first option is the full set of Jufubuki Raden's Mushroom Dance goods.

    First, the Plush Keychain (Maitake Dance ver.). It has Baka-kun III's illustration from the mushroom series. It's a spinning maitake mushroom.

    Then, there are the can badges with Baka-kun III's artwork. These are not random. The artwork features different mushroom dance short video illustrations. There are five types to collect.

    There are masking tapes. Two types, inspired by the Maitake dance animation. It's helpful when you're packing boxes.

    There's a full-set bonus! It's a sticker with a spinning Baka-kun III illustration. Two sets of goods at once! That's cool. I hope everyone had fun deciding. Choose the one you love the most, or buy both! Thanks for the support!

    I had so much fun preparing for Raden's Birthday Festival 2025. I really practiced my singing and dancing! If you want, use the hashtag #RadenBirthday2025. I'd love to hear your thoughts.

    And now, the membership-exclusive encore live is coming at 21:30! I'll perform songs that weren't selected in the survey.

    The shop opens at 21:10. Then the encore live at 21:30. Oh, the shop looks open! Sorry! Members, see you at 21:30! Thank you all for watching!

    Thanks so much to everyone today! Goodbye!



