  - start: '02:52.373'
    end: '03:04.993'
    original: あ、待ってくださいね！重大発表、まだあるんです！まだあるんです、これで終わりじゃないんですよ！しかもライブもまだまだ続きますので、みなさんチャンネルはそのままだよ！
    english: Oh, wait a minute, our major announcements aren't over yet! There's still
