  - start: '03:05.773'
    end: '03:16.813'
    original: では、次の曲に行きたいと思います！それでは、だざ！
    english: Now then, let's move on to the next song! Here we go!
  - start: '03:30.934'
    end: '03:34.904'
    original: 水面に映った藍 眩しく揺れる
