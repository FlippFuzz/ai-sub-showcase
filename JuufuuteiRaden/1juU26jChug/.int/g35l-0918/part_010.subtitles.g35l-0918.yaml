  - start: '02:27.273'
    end: '02:35.313'
    original: 大丈夫かな？トレンドに入った理由がらでんちゃんの体力手配で心配で、めっちゃ入ってたらどうしようかなって。でへへ。
    english: I hope I'm doing okay... The reason I joined the trending topics is because
