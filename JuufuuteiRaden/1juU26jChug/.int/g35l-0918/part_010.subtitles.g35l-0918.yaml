  - start: '02:43.343'
    end: '02:51.633'
    original: だから今日はみんなもね、いっぱいいっぱい楽しんでほしいです。どうですか皆さん、ついてこれてますかー？
    english: So today, I want everyone to have as much fun as possible, too! How is
