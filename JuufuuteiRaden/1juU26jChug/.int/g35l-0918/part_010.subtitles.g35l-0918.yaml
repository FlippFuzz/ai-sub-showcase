  - start: '02:14.393'
    end: '02:25.593'
    original: そしていま、スタッフさんの方から、どうやらいまXで、これXですか？Xでトレンド2位だそうです！すごい、みんなありがとーー！
    english: And now, it looks like staff are saying... X is trending second! Amazing,
