  - start: '00:00.123'
    end: '00:04.143'
    original: ファッション性と実用性を兼ね備えたデザインスカーフでございます。
    english: Featuring a design that balances fashion and practicality, it's a designer
      scarf!
  - start: '00:05.343'
    end: '00:11.833'
    original: そしてじゃあその隣りが、え、アクリルスタンド！ホコラボならではの新規描きおろしアクリルスタンドでございます。
    english: Next to that is the acrylic stand, featuring a brand-new illustration
      exclusive to Honkoro!
  - start: '00:12.723'
    end: '00:18.973'
    original: え、じゃあ右上行きましょう！キャンバスアート！描き下ろしイラストを使用されるキャンバスアートでございます。
    english: Going up to the top right, we have canvas art, featuring newly drawn
      illustrations!
  - start: '00:19.463'
    end: '00:30.403'
    original: その下はトートバッグ！表面にはホコラボのために描き下ろされたイラスト、裏面には3点の絵画のディテールをあしらったデザインの両面仕様となっています。
    english: Below that is the tote bag, featuring a newly drawn illustration on the
      front and details of three masterpieces on the back.
  - start: '00:31.253'
    end: '00:44.803'
    original: そして最後、ランダムクリアカードになります！全6種のランダムクリアカードで、一部のカードには箔押しデジタルサインと特別メッセージが入っていますよ。
    english: And finally, we have the random clear cards, featuring all six designs,
      some of which include foil-stamped digital signatures and special messages!
  - start: '00:45.023'
    end: '00:47.113'
    original: グッズいいでしょう？どれも素敵でしょ！
    english: Aren't the goods lovely? All of them are so nice!
  - start: '00:48.433'
    end: '00:51.373'
    original: そしてさらに、グッズだけではございません！
    english: And that's not all for the goods.
  - start: '00:51.903'
    end: '00:57.653'
    original: ロンドン・ナショナル・ギャラリーさんとのコラボで、音声ガイドも収録させていただきましたー！すごい！
    english: We've also recorded an audio guide in collaboration with The National
      Gallery in London! Amazing!
  - start: '01:01.073'
    end: '01:13.253'
    original: しかもこちらね、なんとラデンの公式チャンネルにてアップする予定でございますが、詳細は後日公開予定となりますので、続報をお待ちくださーい！
    english: And what's more, this is scheduled to be uploaded to Raden's official
      channel, with details to be announced at a later date, so please look forward
      to it!
  - start: '01:15.543'
    end: '01:18.663'
    original: と、グッズとガイドと盛りだくさんなんですが、みんな、ロンドンのナショナル・ギャラリー、どんなとこからか、ぶ、ぶ、ごめんなさい！
    english: That's a lot of goods and guides, but do you all know what kind of place
      the National Gallery in London...
  - start: '01:29.833'
    end: '01:33.483'
    original: ロンドンのナショナル・ギャラリーどんなところか、気になりませんか？ロンドンの街並み、見てみたくないですか？
    english: Doesn't it make you curious about what the cityscape of London looks
      like?
  - start: '01:40.403'
    end: '01:41.363'
    original: ということで、なんと実・は！
    english: So, actually...
  - start: '01:44.413'
    end: '01:51.653'
    original: ReGLOSSメンバーでロンドンロケに行ってきましたーー！うおーー！
    english: We went on a ReGLOSS location shoot in London! Woohoo!
  - start: '01:52.413'
    end: '02:02.393'
    original: そのロケの様子はReGLOSSチャンネルなどで後日公開予定となっておりますので、こちらもぜひお楽しみにー！
    english: Footage of the shoot will be released on the ReGLOSS channel at a later
