  - start: '02:03.493'
    end: '02:13.563'
    original: ということで、重大告知その2は、儒烏風亭らでんとロンドンのナショナル・ギャラリーさんとのコラボでございました！ありがとーー！
    english: 'And with that, that''s our second major announcement: a collaboration
