  - start: '02:35.783'
    end: '02:43.723'
    original: でも今日は、今日はもう体力がもうすっかりかになって、次の日動けなくなるまで頑張るってらでんは決めたんです。
    english: But today, today I decided I'm going to give it my all until I'm totally
