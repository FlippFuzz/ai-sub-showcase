    original: 真実の色
    english: The true colors
  - start: '01:03.800'
    end: '01:05.800'
    original: 見つけ出すよ
    english: I will find
  - start: '01:06.000'
    end: '01:08.500'
    original: 光のすみかを
    english: The dwelling of light
  - start: '01:08.500'
    end: '01:11.800'
    original: 一つでも欠けていたら
    english: If even one thing had been missing
  - start: '01:12.500'
    end: '01:17.500'
    original: きっと出会えてなかったね
    english: We surely would never have met
  - start: '01:54.436'
    end: '01:57.656'
    original: ライブをご覧になっている皆様、こんばんは。
    english: Good evening, everyone watching the live stream.
  - start: '01:57.876'
    end: '02:04.286'
    original: ライブの途中ではございますが、ここでラデンの小話美術解説の時間です！
    english: Mid-way through the live stream, it's time for Raden's short art commentary!
  - start: '02:05.216'
    end: '02:13.236'
    original: 今回ご紹介するのは、こちらジャン！フィンセント・ファン・ゴッホ「ひまわり」。
    english: Today we are introducing this—ta-da! Vincent van Gogh's "Sunflowers".
  - start: '02:15.536'
    end: '02:19.466'
    original: 今回ナショナルギャラリーさんより画像をお借りしております。ありがとうございます。
    english: We have borrowed images from the National Gallery for this. Thank you
      very much.
  - start: '02:20.156'
    end: '02:26.156'
    original: ゴッホといえば「ひまわり」というイメージを持っている方も少なくないのではないでしょうか。
    english: When it comes to Van Gogh, many people probably associate him with "Sunflowers".
  - start: '02:26.546'
    end: '02:37.496'
    original: それもそのはず、実はゴッホの描いた「ひまわり」は1つだけじゃないんです。この世界に失われたものも含めて7つの「ひまわり」があったんですよ。
    english: And for good reason—in fact, Van Gogh didn't just paint one "Sunflowers".
      Including lost ones, there were seven "Sunflowers" in this world.
  - start: '02:38.216'
    end: '02:42.506'
    original: さて、では実際に作品をじっくり見てみましょう。
    english: Now then, let's take a close look at the actual work.
  - start: '02:43.606'
    end: '02:47.366'
    original: みんなはどんな感想を持ったかな？
    english: What kind of impressions did everyone have?
  - start: '02:47.666'
    end: '02:51.696'
    original: 改めて見るといろんなことが見えてきます。
    english: Looking at it again, various things become visible.
  - start: '02:51.986'
    end: '02:58.756'
    original: よく見るとひまわりの花の向きはバラバラで花びらも不揃いですね。
    english: If you look closely, the directions of the sunflower flowers are all
      scattered and the petals are uneven.
  - start: '02:58.986'
    end: '03:07.416'
    original: しかし、温かな黄色が画面全体を包み込むことでどこか生命力が溢れているようにも見えませんか？
    english: However, doesn't the warm yellow enveloping the whole screen make it
      look somehow full of vitality?
  - start: '03:07.976'
    end: '03:14.396'
    original: ここからはゴッホと黄色、そしてゴッホとひまわりについて紐解いていきましょう。
    english: From here, let's unravel Van Gogh and yellow, as well as Van Gogh and
      sunflowers.
  - start: '03:15.116'
    end: '03:24.646'
    original: 太陽は淡い耀きを伝達するもの、という言葉を残しているゴッホは、太陽の光を黄色で表現しました。
    english: Van Gogh, who left behind the words that the sun transmits a faint radiance,
      expressed sunlight in yellow.
  - start: '03:24.966'
    end: '03:29.806'
    original: そして黄色はゴッホにとって生命力の象徴でもあります。
    english: And yellow is also a symbol of vitality for Van Gogh.
  - start: '03:33.566'
    end: '03:39.116'
    original: この絵を描いた時、彼はフランス南部のアールルという町で新天地、画家として仲間と頑張っていこうと意気込んでいました。
    english: When he painted this, in the town of Arles in southern France, he was
      determined to work hard as a painter in a new place with friends.
  - start: '03:39.596'
    end: '03:43.086'
    original: そんな気持ちを黄色に託したのかもしれません。
    english: Perhaps he entrusted such feelings to yellow.
  - start: '03:43.916'
    end: '03:49.036'
    original: 一方でこの絵のモチーフになっているひまわりについて見てみましょう。
    english: On the other hand, let's look at the sunflowers which are the motif of
      this painting.
  - start: '03:49.276'
    end: '03:56.556'
    original: ひまわりは太陽に向かって咲きます。太陽は西洋美術史において神を象徴します。
    english: Sunflowers bloom facing the sun. The sun symbolizes God in Western art
      history.
  - start: '03:57.176'
    end: '04:06.916'
    original: それに向かって咲くひまわりは崇拝、従順、忠実、そして信仰心や愛を象徴します。
    english: Sunflowers blooming toward it symbolize worship, obedience, loyalty,
      and religious devotion or love.
  - start: '04:07.426'
    end: '04:12.726'
    original: ここでさらに遠回りして、彼の過去について知っていきましょう。
    english: Here, let's make a further detour to learn about his past.
  - start: '04:13.066'
    end: '04:20.146'
    original: 先ほどゴッホがアールルでの生活を始めた時、私は新天地！という表現をしました。
    english: Earlier, when Van Gogh started his life in Arles, I used the expression
      "a new place!".
  - start: '04:20.356'
    end: '04:24.846'
    original: 実は彼、元々は牧師さんになりたかったんです。
    english: Actually, he originally wanted to become a pastor.
  - start: '04:25.026'
    end: '04:30.936'
    original: 彼は頑張って勉強や奉仕活動に尽力しますが、うまくいきませんでした。
    english: He tried hard and devoted himself to study and volunteer work, but it
      didn't go well.
  - start: '04:31.256'
    end: '04:36.466'
    original: 画家への転身は牧師さんへの道を断たれた後のことだったんですね。
    english: His transition to becoming a painter was something that happened after
      the path to becoming a pastor was cut off.
  - start: '04:36.966'
    end: '04:44.826'
    original: そんな彼が描く信仰の象徴であるひまわり、皆様はどう読み解きますか？
    english: How do you interpret sunflowers, the symbol of faith painted by such
      a man?
  - start: '04:45.026'
    end: '04:54.606'
    original: 未来への希望の光？それとも自分への失望？ゴッホの見た光のすみかはひまわりにあったのかもしれませんね。
    english: A light of hope for the future? Or disappointment in himself? The dwelling
      of light that Van Gogh saw might have been in the sunflowers.
  - start: '04:54.896'
    end: '05:00.676'
    original: という感じでございまして、こちらもロンドンのナショナルギャラリーさんにて見ることができます。
    english: With that said, this can also be seen at the National Gallery in London.
