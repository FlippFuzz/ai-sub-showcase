  - start: '00:00.000'
    end: '00:04.900'
    original: ファッション性と実用性を兼ね備えたデザインのスカーフでございます！
    english: It is a scarf designed to be both fashionable and practical!
  - start: '00:05.000'
    end: '00:12.000'
    original: え、そしてじゃあ、そのお隣が、アクリルスタンド！本コラボならではの新衣装に身をまとうアクリルスタンドでございます！
    english: And next to it is the acrylic stand! An acrylic stand featuring the new
      outfit exclusive to this collaboration!
  - start: '00:12.100'
    end: '00:18.800'
    original: えー、じゃあ、右上行きましょう！キャンバスアート！描き下ろしイラストを使用されるキャンバスアートでございます！
    english: Let's move to the top right! Canvas art! It features our newly drawn
      illustration!
  - start: '00:18.900'
    end: '00:30.900'
    original: その下はトートバッグ！表面には本コラボのために描き下ろされたイラスト、裏面には３点の絵画のディティールをあしらったデザインの両面仕様となっています！
    english: Below that is the tote bag! It's double-sided, with the newly drawn illustration
      on the front and details of three paintings on the back!
  - start: '00:31.000'
    end: '00:44.500'
    original: そして最後、ランダムクリアカードになります！全６種のランダムクリアカードで、一部のカードには箔押しデジタルサインと特別なメッセージが入っていますよ！
    english: And finally, the random clear cards! Six types in total, and some contain
      a foil-stamped digital signature and a special message!
  - start: '00:44.500'
    end: '00:48.000'
    original: グッズいいでしょう？どれも素敵でしょう？
    english: Great merchandise, right? Aren't they all wonderful?
  - start: '00:48.100'
    end: '00:59.000'
    original: そして、さらに！グッズだけではございません！ロンドン・ナショナル・ギャラリーさんとのコラボで、音声ガイドも収録させていただきました！すごい！
    english: And what's more, it's not just merchandise! We also recorded an audio
      guide in collaboration with the London National Gallery! Awesome!
  - start: '00:59.100'
    end: '01:14.000'
    original: しかもこちらね、なんと、らでんの公式チャンネルにてアップする予定でございますが、詳細は後日公開予定となりますので、続報をお待ちください！
    english: What's more, we plan to upload this on Raden's official channel, with
      details coming soon, so please stay tuned for more information!
  - start: '01:14.100'
    end: '01:24.300'
    original: と、グッズとガイドと盛りだくさんなんですが、みんなロンドンのナショナルギャラリー、どんなとこか…ごめんなさい、ふふ。ちょっと待って。
    english: We have plenty of goods and the guide, but do you know what the National
      Gallery... sorry, haha. Hold on.
  - start: '01:24.300'
    end: '01:34.500'
    original: ロンドンのナショナルギャラリー、どんなとこか気になりませんか？
    english: Aren't you curious about what the National Gallery in London is like?
  - start: '01:34.500'
    end: '01:40.000'
    original: ロンドンの街並み、見てみたくないですか？
    english: Don't you want to see the streets of London?
  - start: '01:40.000'
    end: '01:52.000'
    original: ということで、なんと、実は！ReGLOSSメンバーで、ロンドンロケに行ってきましたー！
    english: So, actually, the members of ReGLOSS went on a location shoot in London!
  - start: '01:52.100'
    end: '02:02.000'
    original: そのロケの様子は、ReGLOSSチャンネルなどで後日公開予定となっておりますので、こちらもぜひお楽しみに！
    english: The footage from the shoot will be uploaded on the ReGLOSS channel at
      a later date, so please look forward to it!
  - start: '02:02.100'
    end: '02:14.200'
    original: ということで、重大告知その２は、重風亭らでんとロンドンのナショナル・ギャラリーさんとのコラボでございました！ありがとう！
    english: 'So, Major Announcement #2 was my collaboration with the National Gallery
      in London! Thank you!'
  - start: '02:14.300'
    end: '02:28.000'
    original: そして今、スタッフさんの方から、どうやら今、Xで、これXですか？Xでトレンド2位だそうです！すごい！みんなありがとう！
    english: 'And just now, the staff told me we are currently trending #2 on X! Is
      it X? That''s amazing! Thank you, everyone!'
  - start: '02:28.100'
    end: '02:35.500'
    original: 大丈夫かな？トレンド2位に入った理由が「らでんちゃんの体力が心配です」でめっちゃ入ってたらどうしようかな。
    english: I hope it's okay. What if we trended because everyone was tweeting, 'I'm
      worried about Raden's stamina'?
  - start: '02:35.600'
    end: '02:51.500'
    original: でも今日は！今日はもう体力がもうすっからかんになって、次の日動けなくなるまで頑張るってらでんは決めたんです！だから今日は、みんなもね、いっぱい、いっぱい楽しんでほしいです！どうですか、皆さん、ついてこれてますかー？
    english: But today, Raden decided to push myself until my stamina is completely
      drained and I can't move tomorrow! So I want everyone to enjoy yourselves to
      the fullest today! Are you keeping up, everyone?
  - start: '02:51.600'
    end: '03:06.000'
    original: あ、待ってくださいね。重大発表、まだあるんです！まだあるんです！これで終わりじゃないんですよ！しかも、ライブもまだまだ続きますので、皆さんチャンネルはそのままでございますよ！
    english: Ah, wait a moment. There are still more major announcements! This isn't
      the end! And the concert will continue, so please stay tuned!
  - start: '03:06.100'
    end: '03:21.000'
    original: では、次の曲に行きたいと思います！それでは、どうぞ！
