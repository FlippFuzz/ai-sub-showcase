  thoughts: |+
    **My Thoughts on the Video Segment**

    Okay, so here's the deal. I need to get a handle on this video segment. It's Jufutei Raden, and it's starting off with a promise of excitement, a "look forward to it!" kind of vibe. Then boom, there's a big reveal: a bonus for purchasing the full set. It's a Morikura En-sensei illustrated postcard, autographed by none other than yours truly, Raden! I'm signing every single one personally, so you know, there's some extra care and attention in this gift. And not just that - there's a bonus voice track too, written by me, which I am very excited about.

    I was feeling really packed today, quite a lot, actually. I'm a little shocked at the number of announcements! Seriously, are you all keeping up? I made so many big announcements today! Tokyo National Museum collaboration! The National Gallery in London is also collaborating! And, most importantly, I'm guiding a Pixel Museum DLC, it's finally going to be released! I know, it's a lot to take in, so I'm suggesting you guys check the archive stream as well. After this, there's a members-only encore live show. I'll take my time showing off my outfit in detail then.

    If you haven't already, please subscribe to the channel, and if you're feeling curious, come join the membership, and let's meet at the encore live! Don't forget that right after this, the new song's MV is going to premiere! We poured so much effort into it, so I really want you all to watch it.

    Honestly, it's all thanks to everyone who's been supporting me, and the listeners who are watching and listening! Because of your support, I was able to hold this live stream today. I'm really happy and so grateful! From here on, I'll keep pushing myself with singing, dancing, and everything I want to do, so please keep supporting me!

    Well, that's everything! Hope to see you guys in the members-only encore live! This has been your host, Jufutei Raden! With that said, have a wonderful night everyone! Sayona-Raden!


