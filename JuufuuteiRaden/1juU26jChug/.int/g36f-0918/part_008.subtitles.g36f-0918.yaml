    english: Claude Monet, "Water Lily Pond"
  - start: '00:03.500'
    end: '00:11.200'
    original: 今回なんとロンドンのナショナル・ギャラリーさんより画像をお借りしております！本当にありがとうございます！
    english: This time, we have borrowed this image from The National Gallery in London!
