  - start: '00:11.200'
    end: '00:17.500'
    original: 皆さんどうですか？私モネの描く世界が大好きなんです。
    english: Everyone, how do you like it? I absolutely love the world Monet paints.
  - start: '00:17.500'
    end: '00:25.000'
    original: まぁモネと言えば日本でもとても人気の高い画家ですが、彼の絵画の魅力はどのようなところにあるのでしょうか？
    english: Monet is a very popular painter in Japan as well, but what makes his
      paintings so captivating?
  - start: '00:25.000'
    end: '00:31.000'
    original: 今回は彼の絵画に内在する魅力を言語化していきましょー！
    english: Today, let's put into words the inherent charm of his paintings!
  - start: '00:31.000'
    end: '00:36.000'
    original: この作品は1899年頃描かれました。
    english: This work was painted around 1899.
  - start: '00:36.000'
    end: '00:46.500'
    original: 緑色の光があふれる睡蓮の池には大きな橋がかかり、橋の奥には柳が描かれています。
    english: In the water lily pond overflowing with green light, a large bridge spans
      across, and behind the bridge, willows are depicted.
  - start: '00:46.500'
    end: '00:51.000'
    original: 実はこの場所、モネの自宅に作った池なんです。
    english: Actually, this place is a pond that Monet built at his own home.
  - start: '00:51.000'
    end: '00:58.500'
    original: フランスのジヴェルニーという町に家を購入した彼は、近隣の川から水を引いて...
    english: After buying a house in the town of Giverny, France, he diverted water
      from a nearby river...
  - start: '00:58.500'
    end: '01:00.800'
    original: '...自分の理想とする庭を作りました。'
    english: '...to create his ideal garden.'
  - start: '01:01.000'
    end: '01:08.500'
    original: アーチ状の大きな橋、これいわゆる太鼓橋と呼ばれる橋と、柳。
    english: A large arched bridge—what is known as a drum bridge—and willows.
  - start: '01:08.500'
    end: '01:13.200'
    original: あれ？なんだか日本っぽさを感じませんか？
    english: Wait, doesn't it feel somehow Japanese?
  - start: '01:13.200'
    end: '01:18.500'
    original: それもそのはず。彼は日本の浮世絵に強く影響を受けた画家でした。
    english: And for good reason. He was a painter heavily influenced by Japanese
      ukiyo-e prints.
  - start: '01:18.500'
    end: '01:26.500'
    original: 彼の描く絵は光にあふれていて、目の前で風が吹いて水面が揺れているようにも見えます。
    english: His paintings are filled with light, making it look as if the wind is
      blowing and the water's surface is rippling right before your eyes.
  - start: '01:26.500'
    end: '01:38.000'
    original: じーっと見ていると、水も花も木も橋も空気でさえも溶けていくようです。見ていて落ち着く絵画だと思いませんか？
    english: As you stare closely, everything seems to melt together. Don't you think
      it's a soothing painting to look at?
  - start: '01:38.000'
    end: '01:49.000'
    original: モネは絵を描くとき、色を混ぜて塗るのではなく、純粋な何にも混ざっていない色を置くように塗りました。
    english: When Monet painted, instead of mixing colors, he applied pure, unmixed
      colors side by side.
  - start: '01:49.000'
    end: '02:04.000'
    original: 色は混ぜれば混ぜるほど、塗り重ねれば重ねるほど暗くなっていきます。彼はこの課題を「色を置く」ことによって解決し、光であふれた絵画の表現に成功したんです。
    english: The more you mix colors, the darker they become. He solved this by placing
      colors side by side, succeeding in creating paintings full of light.
  - start: '02:04.000'
    end: '02:10.000'
    original: この絵画に近づいてみると、筆跡がしっかり残っています。
    english: If you step closer to this painting, the brushstrokes remain clearly
      visible.
  - start: '02:10.000'
    end: '02:24.500'
    original: 隣り合った絵の具一つ一つの相乗効果を計算し、絵の具の塊から温度感や湿度感を感じることができる風景へと変貌する表現は、モネが生涯かけて研究していたものです。
    english: By calculating the synergy of adjacent colors, he turned paint into landscapes
      that evoke temperature and humidity—a technique he researched all his life.
  - start: '02:24.500'
    end: '02:32.000'
    original: 光を求めたモネが、陰影のない日本の浮世絵に強く引かれたのも理解できますね。
    english: It's easy to understand why Monet, who sought light, was so strongly
      drawn to shadowless Japanese ukiyo-e prints.
  - start: '02:32.000'
    end: '02:41.000'
    original: 彼の絵画の明るさは画家としての研究の成果であり、情熱すら感じられる作品だと私は感じます。
    english: The brightness of his paintings is the fruit of his research as an artist,
      emanating true passion.
  - start: '02:41.000'
    end: '02:45.000'
    original: みんなはこの絵画、どう読んだかな？
    english: How did all of you interpret this painting?
  - start: '02:45.000'
    end: '02:54.000'
    original: 実はモネは「印象派」の画家と呼ばれるきっかけを作った人でもあるんですが、それはまた別のお話。
    english: In fact, Monet was also the person who triggered Impressionism, but that's
      a story for another time.
  - start: '02:54.000'
    end: '03:04.500'
    original: と言った感じでございまして、こちらはロンドンのナショナル・ギャラリーさんにて見ることができます！ぜひ行ってみてください！また次回！
    english: And that's the story! You can view this work at The National Gallery
