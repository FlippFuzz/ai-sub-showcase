        *   There's a lot of outrage about the price hikes (00:53.076 - 01:04.666). I can hear the exasperation.
        *   An "expert" chimes in with sound advice (01:09.586 - 01:22.046). They're right, this resale market is wild.
        *   Coco reiterates the original price, and scolds the practice of scalping (01:23.006 - 02:00.616).
        *   She urges caution and patience and says that buying from scalpers is a no-go. (01:44.206 - 02:00.616)
    *   **Part 2: Dakuten Disaster (02:07 - 05:00)**

        Okay, now we're onto a new topic. She's talking about giving her voice to the fans.

        *   Now she's talking about a voice pack (02:07.816 - 02:20.256) distributed to the membership, apparently in response to fans.
        *   The contents were rather bare-bones: just hiragana and numbers (02:20.916 - 03:15.536). I understand why fans might be confused, and this is funny.
        *   It seems the issue? The lack of dakuten (03:22.396 - 04:09.136). The fans are complaining because the recordings are useless for their projects if you cannot voice the "dakuon" sounds, like "ga."
