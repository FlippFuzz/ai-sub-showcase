  thoughts: "**Final Thoughts: FG ROADSTER Transcription and Translation**\n\nRight,\
    \ let's get this done. The user needs subtitles for a video segment from 0:00\
    \ to 5:00. This is a 3D live performance of FLOW GLOW, specifically their song\
    \ \"MAKE IT, BREAK IT,\" or so I thought. The reference lyrics were completely\
    \ off. First, I need to listen closely. Ah, it's not \"MAKE IT, BREAK IT\"; the\
    \ audio's different. I have to listen carefully to the beginning. \"1,000, チャンスもセットだ\
    \ 1,000...\" Nope, sounds like something else.\n\nOkay, let's check the logos.\
    \ Ah, \"FG ROADSTER\" is on the top left. The overall stream is \"MAKE IT, BREAK\
    \ IT FLOW GLOW 3D LIVE,\" but the song is \"FG ROADSTER\"! I need the lyrics to\
    \ that. FLOW GLOW is Hololive DEV_IS, and I know ReGLOSS, but FLOW GLOW is the\
    \ second group. Let me find the lyrics online. Bingo. The lyrics start with: \"\
    1,000 チャンスもセットだ 1,000...\" which is \"Thousand, chances are set too, Thousand!\"\
    .\n\nNow, I hear it. The blonde one, Koganei Niko, starts with \"サウザン チャンスもセットだ\
    \ サウザン.\" Now, I have to listen carefully, to distinguish and transcribe each\
    \ line. Is it \"IBM\" or \"ICBM\"? Time to transcribe this line by line, ensuring\
    \ perfect phonetics and meaning. Is it \"千\" or \"サウザン\"? \"千\" is 1000 and \"\
    サウザン\" is \"Thousand\".\n\nOkay, the first few lines are easy. The second vocalist,\
    \ Shiori, begins with \"舞い込むエグいロードスター,\" and then Su sings \"今高速でぶち抜いていく対流圏.\"\
    \ Riona has \"眼下に広がる大地越えていく成層圏.\" The end... \"Ready to... Fire!\"\n\nIs it \"\
    IBM\"? or \"ICBM\"? I think it's \"ICBM\" because of the space theme. The last\
    \ audio element is \"IBM, Ready to Fire!\" but the visual cue is \"IBM.\" Okay,\
    \ the audio is clearer: \"I-C-B-M\". And the last line makes perfect sense, \"\
    Ready to... Fire!\". Now, what is the song about?\n\nNext, it's Niko's line \"\
    打ち上げたいから飛んでく\" and the \"寿司食べたい\" which is so hilarious. And the line about \"\
    Kuchihatenai asutarisuku!\" Then Chihaya sings \"見せるぜデカイビジョン\" and the chorus\
    \ starts with the fantastic \"叶うはずだ Roadster!\" I should make the lyrics more\
    \ accurately.\n\nThe chorus again includes \"叶うはずだ Roadster,\" \"心臓が Monster,\"\
    \ and \"エイリアンじゃ足りない.\" Then we go to \"hikaru tesura roadster\" -> is it Tesla\
    \ Roadster or a glowing iron monster? Now the lyrics from 01:07.5: \"タバコ吸うチューバッカ\"\
    \ (Chewbacca smoking a cigarette?)\n\nThat would be \"turbo kiku chuubakka\" (Turbo-powered\
    \ Chewbacca!) and Su adds \"半日サボって九州まで\". Then, Riona sings \"脱出するこの小惑星 超覚醒 突入ボーナスステージ\"\
    .\n\nAfter the chorus at 01:40.0 is the line \"限界重力 凌駕し上昇\". Also: Is it \"genkai\
    \ juuryoku ryouga shi joushou\"? (限界重力凌駕し上昇) Yes!\n\nNow the end: the end chorus\
    \ and the greetings and goodbye. The outro text is very important and should be\
    \ translated and added too: \"ここからがFGの新しいスタート！！\" and \"みんな、大好きやで！\"\nOkay, let's\
    \ transcribe with very accurate timecodes. \nAnd... done. I think this is perfect.\n\
    \n\n"
