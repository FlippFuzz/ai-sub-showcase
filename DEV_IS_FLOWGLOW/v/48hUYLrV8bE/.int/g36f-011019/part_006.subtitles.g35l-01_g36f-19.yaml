    original: メイク担当なのでまつ毛を生やしたり、ヴィヴィをイメージして作った！
    english: Since I'm in charge of makeup, I gave it eyelashes, and I designed it
      with Vivi in mind!
  - start: '03:19.000'
    end: '03:21.000'
    original: いいね！
    english: Nice!
  - start: '03:21.500'
    end: '03:26.000'
    original: すぅのシーサーはこちらです！名前決めてなかった
    english: Su's Shisa is right here! I haven't decided on a name.
  - start: '03:26.000'
    end: '03:32.000'
    original: マシュマロシーサー！マシュサー！
    english: Marshmallow Shisa! Mashu-sa!
  - start: '03:32.000'
    end: '03:37.000'
    original: すぅのこだわりポイント、チークを入れました
    english: Su's special touch—I actually added blush!
  - start: '03:37.000'
    end: '03:40.000'
    original: 笑虎いこうかな。名前は「反転サー」です
    english: I guess Niko will go next. Its name is "Inversion-sa".
  - start: '03:40.000'
    end: '03:49.000'
    original: スマホで撮って色彩反転したら赤いシーサーになると思います
    english: If you take a picture of this with your phone and invert the colors,
      I think it turns into a red Shisa.
  - start: '03:56.000'
    end: '04:02.000'
    original: リオナのシーサーは「みんなで見た沖縄の空シーサー」です！
    english: Riona's Shisa is the "Okinawa Sky Shisa We All Saw Together"!
  - start: '04:02.500'
    end: '04:05.500'
    original: 雲とか下手くそすぎて…
    english: The clouds look so terrible...
  - start: '04:05.500'
    end: '04:15.000'
    original: 空、雲を描きました。みんなで見た沖縄の空、キレイだったよ
    english: I painted the sky and clouds. The Okinawa sky we saw together was beautiful.
  - start: '04:16.000'
    end: '04:20.000'
    original: 千速が作ったシーサーはこちらです
    english: Here is the Shisa that Chihaya made.
  - start: '04:21.000'
    end: '04:30.000'
    original: ちはシーサーです。千速のカラーをメインに作って塗ってたはずなのに、どんどん暗くなっていっちゃった
    english: It's Chiha Shisa. I was supposed to paint it mainly with my color, but
      it kept getting darker and darker...
  - start: '04:30.000'
    end: '04:37.000'
    original: 闇堕ちちはサー！
    english: Darkened Chiha-sa!
  - start: '04:53.000'
    end: '04:55.000'
    original: 夕日です
    english: It's the sunset.
