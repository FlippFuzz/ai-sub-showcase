  - start: '04:20.600'
    end: '04:24.400'
    original: なんで人のせいにしてんだよ！ だって楽しんだんだよ！
    english: Why are you blaming someone else?! But I was having fun!
  - start: '04:24.500'
    end: '04:28.500'
    original: 終わった後に全部終わった時に「あれ？なんか携帯入ってた！」って。
