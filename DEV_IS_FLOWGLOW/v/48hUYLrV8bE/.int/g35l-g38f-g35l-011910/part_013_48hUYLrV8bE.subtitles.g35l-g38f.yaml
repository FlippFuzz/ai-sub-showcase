global_summary:
  overall_summary: This 2nd-anniversary celebration video features the hololive DEV_IS
    musical unit FLOW GLOW (Isaki Riona, Koganei Niko, Mizumiya Su, Rindo Chihaya,
    and Kikirara Vivi). The first half of the video showcases a fun-filled, chaotic
    reward trip to Okinawa, including marine sports (flyboarding, parasailing), a
    virtual tour of the Okinawa Churaumi Aquarium, a high-end teppanyaki dinner, morning
    wake-up pranks, a buggy adventure in Yambaru, and Shisa statue painting. After
    reflecting on their trip and sharing humorous behind-the-scenes stories, the members
    announce various upcoming collaborations, merchandise, and an Unreal Engine 3D
    live concert. The video concludes with an electrifying live music performance
    featuring their anniversary single 'BOUNCE BACK！' and 'マジックサマー'.
