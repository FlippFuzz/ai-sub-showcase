global_summary:
  overall_summary: 'This YouTube livestream video celebrates the 2nd anniversary of
    hololive DEV_IS music group FLOW GLOW (#FG2周年), featuring all five members: Isaki
    Riona, Koganei Niko, Mizumiya Su, Rindo Chihaya, and Kikirara Vivi. The first
    half showcases a recorded Okinawa reward trip filled with marine activities like
    flyboarding and parasailing, a visit to Okinawa Churaumi Aquarium, a luxurious
    teppanyaki dinner, morning prank room raids, buggy rides at Yanbaru LUNCHER, and
    Shisa statue painting. The middle section announces major 2nd anniversary collaborations,
    merchandise, manga, and an upcoming Unreal Engine 3D live concert titled ''ノーボーダー''
    in March 2027, along with their new single ''BOUNCE BACK！''. The second half features
    an electrifying studio live concert performing their hit tracks, concluding with
    celebratory messages and group sign-offs.'
