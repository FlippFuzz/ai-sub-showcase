    'MAKE IT, BREAK IT' by hololive DEV_IS unit FLOW GLOW, held on November 23, 2025.
    The concert showcases high-energy group medleys, individual solo performances
    by all five members (Isaki Riona, Koganei Niko, Mizumiya Su, Rindo Chihaya, and
    Kikirara Vivi), a model reveal, major announcements regarding upcoming music albums,
    merchandise, card game collaborations, and an encore performance.
