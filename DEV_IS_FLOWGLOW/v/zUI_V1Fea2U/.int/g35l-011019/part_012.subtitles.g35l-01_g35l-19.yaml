  - start: '03:03.200'
    end: '03:32.500'
    original: このあとFLOW GLOW公式チャンネルのメンバーシップにてアフタートークライブがあります！そっちにも足を運びたいなというそこのアナタ、ぜひ今のうちにメンバーシップの登録をお願いします！そのアフタートークライブはここではなく別のステージからお届けします！そこでしか聞けないライブの裏話とか、あとはファーストアルバムに収録されている曲の中からあの曲を披露したいと思います！どう？ますます気になってきたんじゃない？
    english: After this, there will be an after-talk live on the FLOW GLOW official
      channel's membership! If you out there want to head over there as well, please
      be sure to register for membership right now! That after-talk live will be delivered
      from a different stage, not here! We want to perform behind-the-scenes stories
      of the live that you can only hear there, plus that song from the songs recorded
      on the first album! How's that? Aren't you getting even more curious?
  - start: '03:32.500'
    end: '03:42.500'
    original: 待ってるからね！また私たち一人一人のチャンネルのメンバーシップでも押しカメラ配信もあります！ぜひそちらも覗きに来てね！
    english: We'll be waiting! Also, there will be member-only push-camera streams
      on each of our individual channels! Be sure to come peek at those too!
  - start: '03:42.500'
    end: '03:54.000'
    original: そして12月19日からの定期配信は3Dとなります！お楽しみに！やった！やった！やった！
    english: And starting December 19, regular streams will be in 3D! Look forward
      to it! Yay! Yay! Yay!
  - start: '03:54.000'
    end: '04:12.500'
    original: はい！楽しい時間はあっと言う間ですね！そう！そろそろライブも終了となります！おかしーそーんな！まだまだ遊び足りないぞ！やめて！せっかくだからね、写真に…
    english: Yes! Fun times really fly by! Yeah! The live is almost ending! No way,
      really?! We still haven't played enough! Stop it! Since we have the chance,
      let's take a photo...
  - start: '04:12.500'
    end: '04:15.000'
    original: 写真撮ろう！
    english: Let's take a picture!
  - start: '04:15.000'
    end: '04:20.000'
    original: みんな並んで！オッケー！
    english: Everyone line up! Okay!
  - start: '04:20.000'
    end: '04:30.000'
    original: じゃあいくよ！はい、チーズ！パシャパシャパシャ！撮れた？みんな撮れたかな？
    english: Alright, here we go! Ready, cheese! Snap, snap, snap! Did we get it?
      Did everyone get it?
  - start: '04:30.500'
    end: '04:48.000'
    original: よし、ありがとう！ありがとうございました！さあみんな、本当にお疲れ様でした！素敵な思い出も撮れたところで、ここでメンバー一人一人からファンの皆さんにメッセージをお届けしたいと思います！まずはスーちゃんから！
    english: Alright, thank you! Thank you very much! Everyone, thank you so much
      for your hard work! Now that we've captured wonderful memories, we'd like each
      member to deliver a message to everyone here! First is Su-chan!
  - start: '04:49.500'
    end: '05:03.308'
    original: はい！FLOW GLOWそしてFlowmy、ここまで一緒に走ってきてくれてありがとうございます！みんなのおかげで3Dになれたよ！ここからもいろんな思い出をみんなと一緒に作っていきたいです！よろしくお願いします！
    english: Yes! FLOW GLOW and Flowmy, thank you so much for running alongside us
      this far! Thanks to everyone, we were able to become 3D! From here on, we want
      to create various memories together with everyone! Thank you very much!
