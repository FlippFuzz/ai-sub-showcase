    reference_lyrics_og: |-
      追いかけても 追いかけても 届かない雲のような
      言葉で表せない感情 見つけたよ
      胸の中でざわめいてる 波の本当の意味を
      日差しに遮られて わたしはまだ知らない
      あの頃描いた 絵日記みたい
      すべてが色付き始める、ほら
      真夏の空と海の青さに 眩しくて目を閉じても
      わたしの心の端っこを 掴んで放さない 君の声は
      これが「恋」かな
      自転車 押し 歩く 君の 隣 で その 横顔
      そっと 見つめ ている と 呼吸 を 忘れ てしまう
      子供 の 頃 見 た 万華鏡 の よう
      明日 が くるくる 変わっ て く 、 ほら
      真夏の太陽に 照らされて 焼けつくような痛みも
      うれしさも切なさも全部 初めて出会う大切な気持ち
      無くしたくない
      どうしてだろう もっと知りたくなる
      君のことも自分のことも
      真夏の空と海の青さに 眩しくて目を閉じても
      わたしの心の端っこを 掴んで放さない 君の声は
      優しく 響く
      そして、 恋 が 始まる
    reference_lyrics_en: |-
      Chasing, chasing, like a cloud that can't be reached
      I found feelings that cannot be expressed in words
      Inside my chest, the true meaning of the stirring waves
      Obscured by the sunlight, I still don't know
      Like a picture diary I drew back then
      Everything begins to color, look
      Even if I close my eyes, dazzled by the blue of the midsummer sky and sea
      Your voice, which grabs and won't let go of the corner of my heart
      I wonder if this is "love"
      Walking alongside you as you push your bicycle
      When I softly gaze at your profile
      I forget to breathe
      Like a kaleidoscope I saw when I was a child
      Tomorrow keeps changing and spinning, look
      Illuminated by the midsummer sun
      The burning pain, the happiness, and the sadness
      All of these precious feelings I encounter for the first time
      I don't want to lose them
      Why is it? I want to know more
      About you and about myself
      Even if I close my eyes, dazzled by the blue of the midsummer sky and sea
      Your voice, which grabs and won't let go of the corner of my heart
      Resounds gently
      And then, love begins
