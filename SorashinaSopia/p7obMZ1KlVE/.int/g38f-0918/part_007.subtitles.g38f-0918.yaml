    **A Deep Dive into the Science of Smooching**

    Alright, let's get down to brass tacks. We've got a fascinating clip here, and I've been diligently listening and transcribing, ensuring we capture every nuance of the discussion. My focus has been on providing you with an accurate, expert-level summary, complete with precise timestamps (s, e, og, en).

    First, we started with a casual chat, just a bit early for the deep dive. But we quickly dove into something intriguing: the definition of a kiss. Apparently, some researchers went to great lengths to formulate a comprehensive definition. Why? Well, it turns out they wanted to study kissing behavior in primates. This required a definition that extended beyond human interaction – one that encompassed chimpanzees and other primates too. The goal was to build a solid foundation for research, not just on humans, but also other animals.

    To be truly scientific, we need a universal definition. It can't be just about *our* definition of kissing. So, to ensure a comparable, valid definition, one that could be used universally in science, they created this very specific criteria. They had to exclude behaviours like mouth-to-mouth feeding, and ensure their definition was intentionally and communicative. This allowed them to scientifically validate, through a more robust comparative definition.

    We then learned that by doing this, it showed that kissing is observed in most extant great apes! And this is important: even our extinct relatives, the Neanderthals, likely engaged in kissing, according to this new definition. This really shows how long kissing has been around.

    The conversation then took an interesting turn towards the "why" of kissing, with some discussion on the original intent, such as platonic versus non-platonic kisses. There's even a whole paper out there that dives into these categories. I found that so incredibly fascinating, that I've even linked the research article.

    So, from now on, instead of saying, "Let's smooch," let's be accurate, and say, "Let's engage in non-aggressive, directed, conspecific contact involving manipulation of lips or mouthparts without food transfer!"

    Finally, we moved to the next segment where they were playing a quiz game. The second question was from the Ig Nobel Ecology Prize! The question was about a study that won the 2016 Ig Nobel Chemistry Prize, which revealed that crystals of a certain creature's "milk" contain three times more energy than the same mass of cow's milk. Everyone was trying to guess what creature's milk it was, and the fact that the answer was related to crystals threw us all off!


