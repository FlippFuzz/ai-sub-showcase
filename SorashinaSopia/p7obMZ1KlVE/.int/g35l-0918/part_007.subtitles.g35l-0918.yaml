    **A Deep Dive into the Science of Kisses and Ig Nobel Milk**

    Okay, so we're starting this segment with a bit of a laugh, talking about why we decided to delve into the rather complex definition of a kiss. It turns out, some researchers thought it necessary to clearly define what a kiss *is* to study it across primates. This definition, it's not just a casual thing; it's designed to bring it to the research table, including a clear distinction from animals that mouth-feed. The definition has us exploring kisses among humans, chimpanzees, and other primates to get a clear line of what's what. It's a non-hostile, directional interaction, performed mouth-to-mouth, moving lips/oral cavity to some degree without food transfer, this is what we're going with! Whoa, it's deep! And by the way, this definition is actually important because, comparing, for example, Neanderthals (who were around before us) and today's primates, it shows that kissing may have been around for quite a while. We even have research papers on the subject (which are linked in the description below), with interesting tidbits like platonic versus non-platonic kisses.

    Then we move onto question 2, it was a Nobel Prize question! We're doing great!

    Now we move on to question 3. We're getting close.

    The third question involves an Ig Nobel Chemistry Prize winner: a certain creature's "milk" crystals that have three times the energy of cow's milk! We're curious to know what creature that is! We had to ask a hint or two. We'll have to come back to that one.


