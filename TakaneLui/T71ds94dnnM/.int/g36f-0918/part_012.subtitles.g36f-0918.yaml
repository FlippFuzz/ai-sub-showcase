    original: キービジュアルはですね、
    english: The key visual is...
  - start: '00:02.000'
    end: '00:07.800'
    original: 今回お披露目させていただいた新衣装を着て、ケーキを食べている鷹嶺ルイです。
    english: Takane Lui wearing the new outfit unveiled today, eating cake.
  - start: '00:08.500'
    end: '00:12.700'
    original: 久乃のらり先生に写真を撮っていただきました。可愛いでしょ？
    english: Illustrated by Kuno Norari-sensei. Isn't it cute?
  - start: '00:13.200'
    end: '00:15.200'
    original: それでは1つずつ見ていきましょう！
    english: Now then, let's take a look at each item!
  - start: '00:16.800'
    end: '00:20.000'
    original: 1つ目はこちら、アクリルジオラマスタンドになっております。
    english: 'First up is this: the Acrylic Diorama Stand.'
  - start: '00:20.100'
    end: '00:23.600'
    original: キービジュアルを使用したアクリルジオラマになっております。
    english: It's an acrylic diorama featuring the key visual.
  - start: '00:24.000'
    end: '00:28.800'
    original: ルイ友さんとですね、がんもも可愛く執事風におめかしをしてます。可愛い！
    english: Lui-tomo and Ganmo are also cutely dressed up like butler/maid! Cute!
  - start: '00:30.500'
    end: '00:31.700'
    original: 続いてはこちら！
    english: Next up is this!
  - start: '00:32.000'
    end: '00:42.500'
    original: 新衣装のこちらとかについている、2種類のエンブレムをモチーフにしたピンバッジでございます！
    english: A set of pin badges based on the two emblems on my new outfit!
  - start: '00:43.500'
    end: '00:48.000'
    original: いろんなところにつけて密かにルイ友アピールをしてください。おしゃれでしょ？
    english: Attach them to various places to subtly show you're a Lui-tomo. Stylish,
      right?
  - start: '00:50.000'
    end: '00:51.000'
    original: 続いてはこちら！
    english: Next up is this!
  - start: '00:52.000'
    end: '00:55.700'
    original: 新衣装をモチーフにしたポーチになってます。おしゃれ！
    english: It's a pouch inspired by the new outfit. Stylish!
  - start: '00:55.800'
    end: '00:58.200'
    original: 裏面はですね、メッシュポケットになっているので、
    english: The back side has a mesh pocket,
  - start: '00:58.300'
    end: '01:05.600'
    original: 缶バッジはもちろん、今回一緒に販売するピンバッジもつけやすいデザインになっております！
    english: so it's designed to easily attach tin badges and the pin badges sold
      today!
  - start: '01:06.600'
    end: '01:09.500'
    original: 最後はー、これ欲しかったんじゃないかな？こちら！
    english: Lastly, you probably wanted this, right? This!
  - start: '01:09.800'
    end: '01:17.500'
    original: 新衣装のショートパンツバージョンのホロフレと同じくらいのサイズのぬいぐるみです！可愛い！
    english: A plushie of the short pants version of the new outfit, about HoloFriends
      size! Cute!
  - start: '01:18.000'
    end: '01:23.200'
    original: ぜひこの機会にお迎えしていただけたら嬉しいです。よろしくお願いします！
    english: I'd be happy if you could take this opportunity to welcome it home. Thank
      you!
  - start: '01:24.000'
    end: '01:27.500'
    original: フルセット購入特典はこちら！
    english: The full set purchase bonus is this!
  - start: '01:27.800'
    end: '01:32.000'
    original: ポストカードになっておりまして、数量限定版と通常版がございます。
    english: It's a postcard, available in limited and regular editions.
  - start: '01:32.100'
    end: '01:39.800'
    original: 数量限定版は直筆サインがつきます！たくさん用意しておるので、ゆっくり選んでください！
    english: The limited edition comes with a handwritten autograph! Take your time
      choosing!
  - start: '01:40.000'
    end: '01:46.800'
    original: 販売時間はですね、少し余裕を持たせて21時15分からカートオープンです！
    english: As for sales timing, giving a bit of extra time, the cart opens at 21:15!
  - start: '01:46.900'
    end: '01:48.800'
    original: 以上、グッズ紹介でした！
    english: That was the merch introduction!
  - start: '01:49.500'
    end: '01:53.300'
    original: そしてもう1つ、重大告知です！こちら！
    english: And one more thing, an important announcement! This!
  - start: '01:53.500'
    end: '02:00.800'
    original: なんと！私が夢見ていました、BAYFM78にてレギュラー番組決定しましたー！
    english: Guess what! My dream of a regular radio program on BAYFM78 is official!
  - start: '02:01.000'
    end: '02:10.200'
    original: 放送日はですね、毎週金曜日24時30分から24時57分、初回放送日は7月3日金曜日となっております！
    english: It airs every Friday from 24:30 to 24:57, starting Friday, July 3rd!
  - start: '02:10.500'
    end: '02:21.800'
    original: Xでも初回配信用のお便りを募集するので、メールアドレスも公開しますので、Xのフォローをよろしくお願いいたします！楽しみにしててねー！
    english: We'll accept messages for episode 1 on X and post the email address,
      so follow us!
  - start: '02:22.500'
    end: '02:25.000'
    original: はい！次の曲が最後の曲になります。
    english: Alright! The next song will be the last song.
  - start: '02:25.200'
    end: '02:29.800'
    original: 先ほども紹介させていただきました新曲になっておりまして、名前は「Soar」と言います！
    english: It's the new song I introduced earlier, titled "Soar"!
  - start: '02:31.000'
    end: '02:37.600'
    original: ソロライブでもみんなと一緒に歌いたいなと思って、みんなが声出しできる新曲を作ってきました！
    english: Wanting to sing together at the solo live, I made a new song where everyone
      can cheer!
  - start: '02:37.800'
    end: '02:42.000'
    original: ナナホシさんに書き下ろしていただいた爽やかな楽曲になっております。
    english: It's a refreshing song written for me by Nanahoshi-san.
  - start: '02:42.200'
    end: '02:49.200'
    original: このあと21時から、ミュージックビデオのプレミア公開もあります！
    english: After this from 21:00, there will also be a Music Video premiere!
  - start: '02:49.800'
    end: '02:53.600'
    original: 楽曲は本日24時にリリースです！
    english: The track releases at 24:00 today!
  - start: '02:53.800'
    end: '02:58.800'
    original: この曲はですね、コーラスはホロメンが歌ってくれております！
    english: For this song, the chorus is sung by Holo members!
  - start: '02:58.900'
    end: '03:01.800'
    original: ライブまでにたくさん聞いて覚えてくれたら嬉しいです！
    english: I'd be happy if you listen to it a lot and learn it before the concert!
  - start: '03:02.000'
    end: '03:05.000'
    original: では早速聴いていただきましょう！
    english: So without further ado, please listen to it!
  - start: '03:05.500'
    end: '03:09.500'
    original: 皆さんと一緒に歌いたい曲、「Soar」です。どうぞ！
    english: The song I want to sing with everyone, "Soar". Here you go!
  - start: '03:13.800'
    end: '03:20.500'
    original: 何度でも君を呼んで　また歩いてゆく
    english: No matter how many times, I call out to you and keep walking on
  - start: '03:32.800'
    end: '03:36.500'
    original: 一歩　踏み出したらもう未来さ
    english: Take one step forward and it's already the future
  - start: '03:36.600'
    end: '03:42.000'
    original: 昨日つまずいた道も　今日からは近道だ
    english: Even the path I stumbled on yesterday becomes a shortcut from today
  - start: '03:42.500'
    end: '03:48.000'
    original: 息をするたびに広がる景色
    english: The scenery that expands every time I breathe
  - start: '03:48.200'
    end: '03:52.500'
    original: 私を信じていいと言って
    english: Tell me it's okay to believe in myself
  - start: '03:53.500'
    end: '03:56.000'
    original: つぶやきも希望になって
    english: Even a whisper turns into hope
  - start: '03:56.100'
    end: '03:58.800'
    original: あふれては声になって
    english: Overflowing and turning into a voice
  - start: '03:58.900'
    end: '04:05.000'
    original: 何度目を閉じても消せないな
    english: No matter how many times I close my eyes, I can't erase it
  - start: '04:06.500'
    end: '04:11.500'
    original: 高く飛べるよ　そうだろう　抑えられない
    english: I can fly high, right? I can't hold it back
  - start: '04:11.800'
    end: '04:17.800'
    original: 羽ばたく理由を誰かに許されなくても
    english: Even if no one gives permission for my reason to spread my wings
  - start: '04:18.000'
    end: '04:20.800'
    original: もう決めたよ　迷わない
    english: I've already decided, I won't hesitate
  - start: '04:20.900'
    end: '04:27.600'
    original: 向かい風も　きっと進んでる証拠だって
    english: Even the headwind is surely proof that I'm moving forward
  - start: '04:28.000'
    end: '04:33.000'
    original: 君に伝えるんだ
    english: I will convey it to you
  - start: '04:39.000'
    end: '04:44.000'
    original: どんな重力も心までは
    english: No gravity can reach my heart to
  - start: '04:44.100'
    end: '04:46.000'
    original: 縛れない　曲げられない
    english: Bind it or bend it
  - start: '04:46.100'
    end: '04:48.800'
    original: この手で確かめたい
    english: I want to make sure with these hands
  - start: '04:49.000'
    end: '04:51.800'
    original: 胸焦がした思いで
    english: With my heart burning with passion
  - start: '04:51.900'
    end: '04:54.800'
    original: 爪痕をさぁ刻んで
    english: Come on, engrave your mark
  - start: '04:54.900'
    end: '05:00.000'
    original: 嵐の空模様切り裂いて
    english: Tear through the stormy sky
