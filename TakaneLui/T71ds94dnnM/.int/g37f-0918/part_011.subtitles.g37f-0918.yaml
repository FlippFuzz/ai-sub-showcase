  thoughts: |+
    **A New Chapter: Lui's Reflections and Aspirations**

    Okay, here's the rundown of my thoughts, as they unfolded. I'm excited – it's all coming together!

    First, the announcement: The venue for my 1st live is officially Kanadevia Hall! (Formerly Osaka Castle Hall).

    It started with a look at what's coming up; holoX Live at the end of April, NePox in September, and then, finally, my solo live in December! So excited for a whole year of fun with Louis-tomo!

    I've been envisioning this for a while, really, drawing inspiration from all the senpais who've paved the way in music. Seeing Sora-senpai, Suisei, AZKi, Watame, and Calli-senpai, each building their musical journey, step by step, has always been my goal. To go from a small stage to eventually an arena… that has always been the dream.

    I've been working hard to make regular solo lives a reality. I'm thrilled to be able to make this a reality; despite my worries that Hololive has been leaning towards larger venues, everyone understood my dream! This is the start of that new chapter.

    This first live, at Kanadevia Hall, is the first step towards that vision. I've always wanted to move up from venue to venue - 1st, 2nd, 3rd, 4th, working towards an arena. I hope everyone will be excited with me about this dream, and I'm pushing for it!

    And, speaking of the first live, it's called "REBELLION!" A symbol of my anxiety, the voices of doubt, my internal conflicts — I'm going to rebel against those with my music. I'm pouring my heart into it, and I'm really looking forward to putting on the best show possible.

    And, of course, the birthday live, "LUMINOUS STAIRS" is the first step up that radiant stairs. I would like everyone who's even a little interested to get their tickets and look forward to that journey with me!

    To commemorate this new beginning, there's a new artist photo, which is super cool, and the "REBELLION" hashtag!

    To celebrate, I've got a mini-album, "The LEGENDARY," dropping right after the live! It includes four new tracks, including the new song I'll be performing. You can get the Limited Complete Edition with my signature, but there's also an affordable Standard Edition. It's time to get ready to post with the hashtag "#鷹嶺ルイの反逆" so you all can share.

    There's still more! Coming up next: the merch reveal!


