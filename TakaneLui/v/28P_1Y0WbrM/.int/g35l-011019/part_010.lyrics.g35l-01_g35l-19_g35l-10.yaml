  - start: '00:15.200'
    end: '00:20.400'
    original: 等身大 音をたてて 僕の顔 造ってゆく
    english: Making noise lifesize, building my own face.
  - start: '00:21.200'
    end: '00:24.400'
    original: キレイに、片方だけ
    english: Neatly, only on one side...
  - start: '00:44.200'
    end: '00:50.500'
    original: 行けどもけものみち 獅子よ虎よと吠え 茜射す空の 彼方にまほろば
    english: Though we walk the beast's path, roaring like lions and tigers, toward
