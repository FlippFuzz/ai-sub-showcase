    original: 私、甘え上手に成れなかった 可愛げとかが足りなかった
    english: I couldn't be good at being spoiled... I lacked cuteness and things like
      that.
  - start: '00:09.100'
    end: '00:12.800'
    original: 後悔が煩い夜だ
    english: It's a night where regret is so noisy.
  - start: '00:13.100'
    end: '00:20.500'
    original: 過去は過去だと割り切っちゃえば？ きっといいコトあるさ とか それくらい 百も承知だ ラッタッタ
    english: '"Just write off the past as the past?" "There''s bound to be good things
      coming!" I know that a hundred times over, rattatta!'
  - start: '00:21.000'
    end: '00:29.500'
    original: 願う事も 祈る事も 許されないから黒く染めた
    english: Since neither wishing nor praying was allowed, I dyed it all black.
  - start: '00:30.000'
    end: '00:40.500'
    original: 元の色も思い出せない 絡んだ運命の 糸 糸 糸 糸
    english: I can't even remember the original color—tangled threads of fate, thread,
      thread, thread...
  - start: '00:41.000'
    end: '00:49.000'
    original: やだ 痛い痛い痛い痛いな 悲劇のヒロイン気取っちゃって もう 嫌 嫌 嫌 嫌 嫌！諦めちゃえば？
    english: No, it hurts, hurts, hurts, playing the tragic heroine. Just give up
