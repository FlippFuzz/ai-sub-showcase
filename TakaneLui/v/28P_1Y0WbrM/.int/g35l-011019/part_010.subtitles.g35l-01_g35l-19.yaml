    original: 乾いた日々の 空色・手の中
    english: Within the dry days, in the sky-blue hands...
  - start: '00:05.100'
    end: '00:08.200'
    original: 等間隔 音の中で 試行錯誤
    english: Trial and error amidst evenly spaced sounds,
  - start: '00:09.100'
    end: '00:14.200'
    original: 時間・間隔の無い空間 ah
    english: In a space without time or intervals, ah...
  - start: '00:15.200'
    end: '00:20.400'
    original: 等身大 音をたてて 僕の顔 造ってゆく
    english: Making noise lifesize, building my own face.
  - start: '00:21.200'
    end: '00:24.400'
    original: キレイに、片方だけ
    english: Neatly, only on one side...
  - start: '00:44.200'
    end: '00:50.500'
    original: 行けどもけものみち 獅子よ虎よと吠え 赤ねさす空の 彼方にまほろば
    english: Though we walk the beast's path, roaring like lions and tigers, toward
      the far-off blessed land under the red-tinted sky.
  - start: '00:51.200'
    end: '00:58.200'
    original: 幽囚の孤島に さまよう青春は 弱さと怒りが むき出しだけでいい
    english: Youth wandering on an isolated island of captivity... raw weakness and
      anger are enough.
  - start: '00:59.200'
    end: '01:04.500'
    original: 父よ 未だ我は 己を知がたし
    english: Father, I still do not yet truly know myself.
  - start: '01:07.100'
    end: '01:14.400'
    original: 先立つ兄らの 見えない背中を追えば 迷いの夜に明星は誘う
    english: Chasing the unseen backs of the older brothers who went before me, the
      morning star invites me into the bewildered night.
  - start: '01:21.800'
    end: '01:28.400'
    original: 死して終わらぬ 夢を焦がれとも
    english: Even yearning for a dream that doesn't end in death...
  - start: '01:29.200'
    end: '01:36.500'
    original: 確かな君こそ 我が命
    english: You, who are certain, are my very life.
  - start: '01:37.200'
    end: '01:44.500'
    original: 烈風の荒野で 蝶よ花よと生き とこしえの春に 咲き添うまほろば
    english: Living delicately like flowers and butterflies in a gale-swept wilderness,
      a blessed land blossoming alongside eternal spring.
  - start: '01:45.100'
    end: '01:52.400'
    original: 混濁の純潔 この身は汚れても 心の錦を 信じていてください
    english: Even if this body is tainted in turbid purity, please believe in the
      brocade of my heart.
  - start: '01:53.100'
    end: '02:02.300'
    original: 母よ 決して我は 涙を見せねども 足下の草に露は消えませで
    english: Mother, though I never show my tears, let the dew on the grass beneath
      my feet not vanish.
  - start: '02:30.100'
    end: '02:35.200'
    original: 交わらない キミとボク 今ゆくよ ボクは流れ星
    english: You and I, who never intersect... Now I'm going, I am a shooting star.
  - start: '02:47.200'
    end: '02:52.500'
    original: 世界が朽ち果てても 変ることのないものがある
    english: Even if the world rots and decays, there are things that will never change.
  - start: '02:53.100'
    end: '02:58.500'
    original: 涙をこらえてても 守るべきものが僕らにはある
    english: Even holding back our tears, we have things we must protect.
  - start: '02:59.200'
    end: '03:03.400'
    original: 何万年何億年前からのメッセージが 体内でうずだき 鳴り響く
    english: A message from tens of millions or hundreds of millions of years ago
      surges within our bodies and resounds.
  - start: '03:04.200'
    end: '03:09.500'
    original: しゃがれた声で 明日を呼ぶ 傷だらけの手で 君守る
    english: Calling out for tomorrow with a raspy voice, protecting you with scar-covered
      hands.
  - start: '03:17.100'
    end: '03:24.500'
    original: 見つめ合い 手と手を重ねて ガラス越しのキミとボク
    english: Gazing at each other, overlapping hands, you and I across the glass.
