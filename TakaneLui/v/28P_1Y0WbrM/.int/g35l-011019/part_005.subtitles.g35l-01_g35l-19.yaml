  - start: '02:54.000'
    end: '02:59.000'
    original: 続いてはミオルイです。よろしくお願いいします。
    english: Next up is MioLui. Please treat us well!
  - start: '02:59.500'
    end: '03:03.500'
    original: 大神、このふたりっていうのは珍しいよね。
    english: Ookami, these two together is pretty rare, isn't it?
  - start: '03:04.000'
    end: '03:11.000'
    original: そうね、ディープに、お話はしたり仲いいんですよ。はい、そうなんです。
    english: That's right, we talk deeply and get along well. Yes, that's right.
  - start: '03:12.000'
    end: '03:15.000'
    original: うん、何について話してるの?
    english: Yeah, what do you guys talk about?
  - start: '03:16.000'
    end: '03:28.000'
    original: ええと、主に、ま、私がそもそもミオシャの歌が本当に大好きで。よく歌のお話をしたりとか、あとは個人的に私の悩みを聞いてもらったりとかとかしていますね。
    english: Um, mainly... well, first of all, I really love Mio-sha's singing. We
      often talk about singing, and she also listens to my personal worries and stuff
      like that.
  - start: '03:29.000'
    end: '03:32.000'
    original: 頼りがいがあるからね。じゃそのなんか特別なエピソードとかあったりする?
    english: Because she's reliable. So, do you have any special episodes or anything?
  - start: '03:36.000'
    end: '04:06.000'
    original: 特別なエピソードって言うと、私がちょっとショボーンとした時があったんですけど、その時にパーティーを開いてくれまして、その時にミオシャが花束をプレゼントしてくれたんですよ。覚えてる?
      ルイの色のお花束をね。からあの花束をプレゼントしてくれて、それががすごいい綺麗で曇ってた心が一瞬にしてして晴れましたね。
    english: Speaking of special episodes, there was a time when I was feeling a bit
      down, and she threw a party for me. At that time, Mio-sha gave me a bouquet
      of flowers as a present. Do you remember? A bouquet in Lui's color. She gave
      me that bouquet, and it was so beautiful that my cloudy heart cleared up in
      an instant.
  - start: '04:08.000'
    end: '04:13.000'
    original: 素敵だね。大神さんはよく花とか買うの?
    english: That's wonderful. Does Ookami-san often buy flowers or anything?
  - start: '04:14.000'
    end: '04:16.000'
    original: あ、はい。あの花すごい大好きで
    english: Ah, yes. I really love flowers...
  - start: '04:17.000'
    end: '04:25.000'
    original: あの、うちも落ち込んだ時とかね、あの花を買う時結構あるんですけど、猫が食べちゃうんでね、まああんまり買えないんですけどね、猫ね。
    english: Um, our place also has times when we feel down and buy flowers quite
      a bit, but cats eat them, so well, we can't buy them very often, cats, you know.
  - start: '04:26.000'
    end: '04:27.000'
    original: そうだね、猫ね。
    english: That's true, cats, yeah.
  - start: '04:27.500'
    end: '04:34.500'
    original: さっき聞き逃がしてたけど、君たちもよくパーティーするんだね。あ、そうですね。お粥と同一パーティーですね。
    english: I missed it earlier, but you guys also often throw parties, huh? Ah,
      that's right. It's the same party as Okayu.
  - start: '04:35.000'
    end: '04:37.000'
    original: あ、ですね。あの私もよく実は参加させていただいております。
    english: Ah, that's right. I actually often participate in them as well.
  - start: '04:38.000'
    end: '04:41.000'
    original: さっき隠してたのって、白上っ君も参加してるってこと?
    english: Eh, what you were hiding earlier means Shirakami-kun participates too?
  - start: '04:42.000'
    end: '04:47.000'
    original: あ、そうですね。あの、みおさんのオムライスとかポテトサラダのポテトサラダはもう本当にめちゃめちゃ絶品なんですよ。本当におめでとうございます。
    english: Ah, that's right. Mio-san's omurice and potato salad... the potato salad
      is truly absolute perfection. Congratulations!
  - start: '04:48.000'
    end: '04:52.000'
    original: いや、ちょっと収集つかなくなれそうなので、スタンバイお願いします。
    english: Well, it looks like we're losing control here, so please stand by.
  - start: '04:52.500'
    end: '04:54.500'
    original: はい、よろしくおねがいします。またパーティーしようね。
    english: Yes, please. Let's have a party again.
