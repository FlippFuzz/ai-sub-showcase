global_summary:
  overall_summary: This YouTube 3D LIVE stream titled '【3DLIVE】重大告知あり‼パワーアップして帰ってきた音楽番組『MUSIC
    GARDEN』🎤✨【#鷹嶺ルイ生誕祭2025】' celebrates the 2025 birthday of Hololive 6th Generation
    (holoX) member Takane Lui. Hosted in the style of a music TV show called 'MUSIC
    GARDEN' (M-Gade) alongside co-host Omaru Polka, the stream features stunning musical
    performances, banter, and comedy sketches with guest appearances from fellow Hololive
    members Otonose Kanade, Nekomata Okayu, Ookami Mio, Nakiri Ayame, and Shirakami
    Fubuki. The stream culminates in major announcements, notably Takane Lui's official
    appointment as PR Ambassador for the anime franchise 'Code Geass' featuring a
    special voice message from Jun Fukuyama (Lelouch Lamperouge), followed by a Code
    Geass theme medley and the premiere of her new original song 'ZIG-ZAG'.
