- subtitles:
  - start: '00:00.000'
    end: '00:01.800'
    original: というわけでですね、
    english: And so,
  - start: '00:01.800'
    end: '00:03.500'
    original: あ、復活。おめでたいね。
    english: Oh, the revival! Congratulations!
  - start: '00:03.500'
    end: '00:05.000'
    original: そうですね。
    english: Yes, indeed.
  - start: '00:05.000'
    end: '00:06.000'
    original: 髪切った？
    english: Did you cut your hair?
  - start: '00:06.000'
    end: '00:09.000'
    original: あ、切ってないんですけど。ルイ姉様もそんなこと言ってましたね。
    english: Ah, I didn't. But Lui-nesama was saying that too!
  - start: '00:09.000'
    end: '00:10.500'
    original: そうだっけ？
    english: Did she really?
  - start: '00:10.500'
    end: '00:13.500'
    original: そうですよ！ポルカさんもお変わりなく...
    english: Yes, she did! And you haven't changed either, Polka-san...
  - start: '00:13.800'
    end: '00:16.500'
    original: まあ、はい。元気でやってるわ。
    english: Well, yes. I'm doing great.
  - start: '00:16.500'
    end: '00:22.500'
    original: それはよかったです。ポルカさんの元気にも負けないくらい、今回元気なゲストさんもいますので。
    english: That's good to hear. We have some very energetic guests today who won't
      lose to your energy!
  - start: '00:22.500'
    end: '00:24.500'
    original: うん、それは楽しみだね。
    english: Yeah, I'm looking forward to that.
  - start: '00:25.000'
    end: '00:29.000'
    original: はい。では早速紹介していきましょう。本日のゲストの登場です！
    english: Alright, let's introduce them right away. Here come today's guests!
  - start: '00:36.000'
    end: '00:38.500'
    original: 音乃瀬奏！
    english: Otonose Kanade!
  - start: '00:53.000'
    end: '00:56.000'
    original: 猫又おかゆ！
    english: Nekomata Okayu!
  - start: '01:08.500'
    end: '01:11.000'
    original: 大神ミオ！
    english: Ookami Mio!
  - start: '01:25.500'
    end: '01:28.500'
    original: 百鬼あやめ！
    english: Nakiri Ayame!
  - start: '01:43.000'
    end: '01:46.000'
    original: 鷹嶺ルイ！
    english: Takane Lui!
  - start: '01:56.000'
    end: '02:01.000'
    original: 今夜も豪華ゲストでお送りするミュージックガーデン。なんと今夜は、
    english: Tonight's Music Garden features a gorgeous guest lineup! And tonight...
  - start: '02:01.000'
    end: '02:06.000'
    original: あっと驚くような仕掛けいっぱいでお送りするみたいですよ。最後まで見逃せません！
    english: '...it seems we have lots of surprising gimmicks in store. Don''t miss
      it till the very end!'
  - start: '02:06.500'
    end: '02:11.500'
    original: ああー、どんな仕掛けなんだろうね。鷹嶺ルイくん。
    english: Oh, I wonder what kind of gimmicks those are. Takane Lui-kun?
  - start: '02:11.500'
    end: '02:12.500'
    original: はい。
    english: Yes?
  - start: '02:12.500'
    end: '02:17.500'
    original: ミュージックガーデンと言えば鷹嶺ルイくんだから。今日は誕生日ということで。
    english: Speaking of Music Garden, it has to be you. And since today is your birthday...
  - start: '02:17.500'
    end: '02:20.500'
    original: はい、ありがとうございます。そうなんです、今日誕生日なんですよ。
    english: Yes, thank you! That's right, today is my birthday!
  - start: '02:21.000'
    end: '02:26.500'
    original: ２年ぶりに復活したけど、どう？緊張してる？
    english: We're back after two years! How are you feeling? Nervous?
  - start: '02:26.500'
    end: '02:32.500'
    original: はい、緊張してます。でも復活にふさわしい場にできるんじゃないかなと思っているので、楽しみにしていてください。
    english: Yes, I'm nervous. But I think I can make this stage worthy of the revival,
      so please look forward to it!
  - start: '02:33.500'
    end: '02:35.500'
    original: なんか匂いますね。
    english: I smell something...
  - start: '02:36.000'
    end: '02:38.000'
    original: え？ちゃんとお風呂入ってきた？
    english: Eh? Did you take a proper bath?
  - start: '02:38.500'
    end: '02:42.500'
    original: その匂いじゃないです！それじゃないですよ。
    english: Not that kind of smell! That's not what I meant!
  - start: '02:42.500'
    end: '02:43.500'
    original: あ、そっかそっか。
    english: Ah, right, right.
  - start: '02:43.800'
    end: '02:46.000'
    original: 今日は一曲目の披露だよね？
    english: Today you'll perform your first song, right?
  - start: '02:46.200'
    end: '02:48.500'
    original: はい、このあとすぐに披露させていただきます。
    english: Yes, I'll be performing it right after this.
  - start: '02:49.000'
    end: '02:55.500'
    original: はい、一曲目は鷹嶺ルイさんに、アニメの主題歌でも話題でした「BOW AND ARROW」を披露していただきます。
    english: Alright! For the first song, Takane Lui-san will perform "BOW AND ARROW",
      which became a hot topic as an anime theme song!
  - start: '02:56.000'
    end: '02:58.500'
    original: ほう。あのフィギュアスケートの？
    english: Oh, the one associated with figure skating?
  - start: '02:58.500'
    end: '03:06.500'
    original: はい。今回は特別にフィギュアスケート風のダンスを踊ってくださるダンサーさんと一緒にパフォーマンスをさせていただきます。
    english: Yes. This time, I will perform with a dancer who will specially perform
      a figure skating-style dance!
  - start: '03:07.000'
    end: '03:09.500'
    original: ほう、それは楽しみだな。
    english: Oh, I look forward to that.
  - start: '03:09.500'
    end: '03:13.000'
    original: そうですね。それではスタンバイの方よろしくお願いします。
    english: Indeed. Well then, please get on standby.
  - start: '03:13.000'
    end: '03:15.000'
    original: はい、よろしくお願いします。
    english: Yes, thank you.
  - start: '03:18.000'
    end: '03:22.500'
    original: ねえ、あれ猫又くんと音乃瀬くんと大神くん、あ、初登場だっけ？
    english: Hey, are Nekomata-kun, Otonose-kun, and Ookami-kun making their first
      appearance?
  - start: '03:24.000'
    end: '03:26.500'
    original: そうですよ！
    english: That's right!
  - start: '03:27.500'
    end: '03:30.000'
    original: 音乃瀬くん、緊張してるんじゃない？
    english: Otonose-kun, aren't you nervous?
  - start: '03:30.200'
    end: '03:34.000'
    original: もう、全然大丈夫ですよ！いけます！
    english: I'm completely fine! I can do this!
  - start: '03:34.500'
    end: '03:38.000'
    original: 元気だね。
    english: So energetic!
  - start: '03:38.000'
    end: '03:40.000'
    original: 元気ですね。
    english: She's so lively.
  - start: '03:40.000'
    end: '03:42.500'
    original: そして二回目の登場が百鬼くん。
    english: And making her second appearance is Nakiri-kun.
  - start: '03:42.500'
    end: '03:44.500'
    original: はい、お久しぶりです！
    english: Yes, it's been a while!
  - start: '03:44.500'
    end: '03:45.500'
    original: そういえば、シュークリーム食べた？
    english: By the way, did you eat cream puffs?
  - start: '03:45.800'
    end: '03:48.500'
    original: え、ちょっと今日、まだ... まだ今日食べてないんです。
    english: Eh? Actually, today, I... I hasn't eaten them yet today.
  - start: '03:49.000'
    end: '03:54.000'
    original: あ、そっかそっか。まあ後でね、ゆっくりね、食べてね。
    english: Ah, I see, I see. Well, you can eat them slowly later.
  - start: '03:54.000'
    end: '03:55.800'
    original: はい、いっぱい食べます！
    english: Yes, I'll eat a lot of them!
  - start: '03:56.000'
    end: '04:00.000'
    original: のちほど皆様ともゆっくりお話しさせていただこうと思います。
    english: We'll have a chance to chat slowly with everyone later.
  - start: '04:00.000'
    end: '04:03.000'
    original: さて、スタンバイができたみたいですね。
    english: Now, it looks like she is on standby.
  - start: '04:03.000'
    end: '04:05.500'
    original: アニメをリスペクトしたダンスにもご注目ください。
    english: Please pay attention to the dance that respects the anime.
  - start: '04:05.800'
    end: '04:09.500'
    original: 鷹嶺ルイで、「BOW AND ARROW」。
    english: Here is Takane Lui with "BOW AND ARROW"!
  - start: '04:33.200'
    end: '04:38.200'
    original: 気づけば靴は汚れ 錆びついた諸刃を伝う雨
    english: Before I knew it, my shoes were soiled, and rain dripped down the rusted
      double-edged blade.
  - start: '04:38.500'
    end: '04:43.700'
    original: 憧れはそのままで 夢から目覚めた先には夢
    english: With my yearnings left as they are, waking up from a dream only led to
      another dream.
  - start: '04:44.000'
    end: '04:49.200'
    original: 聞こえたその泣き声 消え入る手前のノブレスオブリージュ
    english: I heard that crying voice, a noblesse oblige right on the verge of fading
      away.
  - start: '04:49.500'
    end: '04:54.500'
    original: 憧れのその先へ うずくまる君を見つける為
    english: Beyond that yearning, in order to find you crouching there.
  - start: '04:54.800'
    end: '05:00.000'
    original: 行け 行け 追いつけない速度で 飛べ インパルス加速して
    english: Go, go, at an unreachable speed; fly, accelerating your impulses.
