  - start: '00:13.200'
    end: '00:15.500'
    original: それでは一つずつ見ていきましょう。
    english: Now let's take a look at them one by one.
  - start: '00:16.300'
    end: '00:23.900'
    original: '[Sign: アクリルジオラマスタンド] はい、一つ目はこちら。アクリルジオラマスタンドになっております。'
    english: '[Sign: Acrylic Diorama Stand] First up is this. It''s an acrylic diorama
      stand.'
  - start: '00:24.000'
    end: '00:28.900'
    original: 類ともさんとですね、ガンモも可愛く羊風におめかしをしてます。可愛い。
    english: It features Luitemo and Ganmo dressed up adorably like little sheep.
      So cute.
  - start: '00:29.800'
    end: '00:48.500'
    original: '[Sign: ピンバッジ2個セット] 新衣装にね、こちら新衣装の、はい、こちらとかについている、え、2種類のエンブレムをモチーフにしたピンバッチでございます。いろんなところにつけてひそかに類ともアピールをしてください。おしゃれでしょ？'
    english: '[Sign: Pin Badge Set of 2] These are pin badges modeled after the two
      emblems attached to the new outfit. Attach them in various places to subtly
      show your Luitemo pride. Stylish, right?'
  - start: '00:49.000'
    end: '01:05.500'
    original: '[Sign: ポーチ] 新衣装をモチーフにしたポーチになっております。おしゃれ。裏面はですね、メッシュポケットになっているので、缶バッチはもちろんなんですけど、今回一緒にね、販売するピンバッチもつけやすいデザインになっております。'
    english: '[Sign: Pouch] It''s a pouch featuring the new outfit motif. Stylish.
      The back has a mesh pocket, so not only can you put button badges, but it''s
      designed so you can easily attach the pin badges we''re selling this time too.'
  - start: '01:06.000'
    end: '01:23.000'
    original: '[Sign: ぬいぐるみ ダークローズ衣装ver.] 最後はこれ欲しかったんじゃないかな？こちら。はい、新衣装のショートパンツバージョンのホロフレと
      同じくらいのサイズのぬいぐるみです。可愛い。ぜひこの機会にお迎えしていただけたら嬉しいです。よろしくお願いします。'
    english: '[Sign: Plushie Dark Rose Outfit Ver.] Last is something you probably
      wanted, right? This one. Yes, it''s a plushie about the same size as the holo-friend
      in the short pants version of the new outfit. Cute. I''d be so happy if you
      could welcome one home this time. Please look forward to it.'
  - start: '01:23.500'
    end: '01:47.000'
    original: '[Sign: フルセット購入特典] ポストカードになっておりまして、数量限定版と通常版がございます。数量限定版は、え、直筆サインが付きます。たくさん用意しておるので、ま、ゆっくり選んでください。販売時間はですね、少し余裕を持たせて21時15分からカートオープンです。以上グッズ紹介でした。'
    english: '[Sign: Full Set Purchase Bonus] It''s a postcard, available in a quantity-limited
      version and a regular version. The quantity-limited version comes with a handwritten
      signature. We''ve prepared plenty, so take your time and choose. Sales will
      open with a bit of leeway starting at 21:15. That concludes the goods introduction.'
  - start: '01:48.500'
    end: '02:21.500'
    original: '[Sign: BAYFM78にてレギュラー番組決定！] なんと私が夢見ていまして、BAYFM78にてレギュラーラジオの番組が決定しました！放送日はですね、毎週金曜日24時30分から24時57分、初回放送日は7月3日金曜日となっております！Xでも初回配信向けのお便りを募集するので、メールアドレスも公開しますので、Xのフォローをよろしくお願いいたします。楽しみにしててね！'
    english: '[Sign: Regular show confirmed on BAYFM78!] I''ve been dreaming of this,
      but it''s been decided that I''ll have a regular radio program on BAYFM78! Broadcast
      days will be every Friday from 24:30 to 24:57, with the first broadcast on Friday,
      July 3! We''ll be soliciting messages for the first broadcast on X too, and
      we''ll be publicizing the email address, so please follow X as well. Look forward
      to it!'
  - start: '02:22.500'
    end: '03:09.000'
    original: はい、次の曲が最後の曲になります。先ほども紹介させていただきました新曲になりまして、名前は「Soar」と言います。そのライブでもみんなと一緒に歌いたいなと思って、みんなが声出しできる新曲を作ってきました。七星さんに書き下ろしていただいた爽やかな楽曲になっております。このあと21時から、ミュージックビデオのプレミア公開もあります！楽曲は本日24時にリリースです。この曲はですね、コーラスはホロメンが歌ってくれております！ライブまでにたくさん聴いて覚えてくれたら嬉しいです。では、早速聴いていただきましょう。皆さんと一緒に歌いたい曲「Soar」です。どうぞ。
    english: Yes, the next song will be our final song. As introduced earlier, it's
      a new song called 'Soar'. I wanted to sing it together with everyone at the
      live, so I created a new song where everyone can use their voices. It's a refreshing
      track written for us by Nanahoshi-san. Starting at 21:00, there will also be
      a music video premiere! The song will be released digitally today at 24:00.
      For this song, the chorus is sung by hololive members! I'd be so happy if you
      listen to it a lot and learn it by the live. Now, let's listen to it right away.
      The song I want to sing with everyone, 'Soar'. Here it is.
  - start: '03:14.200'
    end: '03:20.500'
    original: 何度でも君を呼んで また歩いてゆく
    english: Calling out to you time and time again, I'll walk once more.
