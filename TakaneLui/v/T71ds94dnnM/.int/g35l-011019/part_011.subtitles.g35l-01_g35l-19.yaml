  - start: '01:28.800'
    end: '01:43.000'
    original: こうやって私の夢を理解してくださり、叶えて、えー叶えるべく、まずは私の希望だったカナデビアホールにてファーストライブをやらせていただくことになりました。おめでとう、ありがとう！
