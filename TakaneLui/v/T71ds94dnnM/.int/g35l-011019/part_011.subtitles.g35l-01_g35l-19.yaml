    end: '03:43.000'
    original: そして、ここまでファースト、セカンド、アコースティックとアルバムを作ってきましたが、今回ライブ、えーライブを盛り上げるために4曲、はい、えー新しく作りまして、録音させていただいたミニアルバムも本日ライブ終了後に予約開始です。
