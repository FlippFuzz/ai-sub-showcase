  - start: '02:34.000'
    end: '02:53.000'
    original: はい、反逆という意味でございます。私がいつも抱えている不安や、そして色々な否定の声、そして私自身の葛藤、えーこれからも私は、えーそれを私の歌で反逆していきたい、そんな気持ちで込めさせて、えー込めてつけさせていただきました。
    english: It means "rebellion." The anxieties I always carry, the various voices
      of denial, and my own inner struggles—I want to continue rebelling against all
      of that through my songs, and that's the feeling I poured into naming it.
  - start: '02:53.500'
    end: '03:00.000'
    original: 最高のリライブになるようにたくさん準備をしていますので、ぜひ楽しみに待っていてください。
