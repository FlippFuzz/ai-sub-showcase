global_summary:
  overall_summary: This YouTube livestream features Takane Lui's 2026 birthday 3D
    live concert titled 'Luminous Stairs' (#鷹嶺ルイ超重大生誕LIVE) with a ballroom theme.
    The stream features dynamic musical performances of cover songs and originals
    including 'Elf', 'IRIS OUT', 'Mugen', 'ZIG-ZAG', 'U.M.A. NEW WORLD!!', and 'Requiem
    for the Defiant', a comedy skit featuring Nico-tan, and major announcements such
    as her 1st Solo Live 'REBELLION' at Kanadevia Hall, a new mini-album titled 'The
    LEGENDARY', birthday merchandise, a regular radio show on BAYFM78, and the premiere
    performance of her new original song 'Soar'.
