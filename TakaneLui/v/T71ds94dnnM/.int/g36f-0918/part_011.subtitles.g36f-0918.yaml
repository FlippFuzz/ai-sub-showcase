    *   **2:07-2:27**: A call to action. She hopes everyone who is interested comes to see her live, because it's important to keep the story alive. The importance of the live and fan support for further events.
    *   **2:27-2:40**: The live's title: "Rebellion". It's about her inner struggles, any negativity, and her desire to express her feelings through her music. Gotta translate the nuance of the title here.
    *   **2:40-3:00**: She emphasizes the hard work and preparation for an amazing show. This is what I have to capture, in the most authentic way.
