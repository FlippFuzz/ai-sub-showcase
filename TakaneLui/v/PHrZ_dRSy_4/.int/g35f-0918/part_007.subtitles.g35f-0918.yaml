  thoughts: |+
    **My Thoughts on the New Album and Merch!**

    Okay, so there's this new song. It's
    included! Also, I wanted to say so
    much, but time is short. The 10th
    track, "Requiem for You Who Resist,"
    is the image song for an anime. More
    info is coming, so look forward to it!
    And, the Complete Limited Edition is
    like this! Check it out! It's a slide
    box, allowing you to slide the two
    Takane Luis together or apart.
    Stylish, right? SOLANI-san, who did
    'Liberty', drew this too! Isn't it
    super cool? Have fun separating and
    combining them!

    We have other merch like this. The
    Complete Limited Edition also features
    a jacket art book of my previous songs!
    I requested this myself, and was pretty
    insistent! They made it happen. So,
    all the jackets are in one book! I
    think you all wanted this too, right?
    I figured you all would want this, so
    I kind of forced them to make it.
    Thank you to the staff! It comes with
    two original tin badges, and also for
    the Complete Limited Edition buyers,
    you'll get a hand-signed jacket card!
    I'll sign them all myself! Please
    get the Complete Limited Edition!

    The Standard Edition has a random
    alternate jacket, one out of five.
    Also, there will be a limited random
    bonus! A hand-signed signature with
    a comment, too! I hope you all get
    one! Please consider the Standard
    Edition too!

    Here are the store-specific bonuses!
    If there's something you like, I'd be
    happy if you reserve it there. Check
    for details later!

    Also, at Akihabara Gamers on
    December 7th, a mini-live will be
    held! Buy the album at Gamers to
    enter the lottery and get an invite!
    I hope you buy it there!

    The button on the bottom left will
    take you to the official site to pre-
    order. Details for other stores
    will be on X and in the description!
    Oh, and Lapis Lazuli... September and
    December are the birthstone months.
    I announced this in September, and it
    releases in December! I planned it,
    not a coincidence. It's my dream!


