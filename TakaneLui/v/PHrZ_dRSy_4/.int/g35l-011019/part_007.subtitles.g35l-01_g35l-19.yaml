    titled 'Lapis Lazuli / Major Announcement!'. The stream serves as a celebratory
    and announcement-driven music event where Lui reveals the release of her highly
    anticipated 2nd album titled 'Lapis Lazuli', which is her first-ever nationwide
    retail release (set for December 3, 2025). The stream features dynamic 3D musical
    performances of tracks themed around 'VS (Combat)', including collaborations with
    special guest Houshou Marine (singing 'Overd') and Hoshimachi Suisei (singing
    'ZIG-ZAG'), as well as solo performances of 'Magnum Wing', 'Fools Fools Fools',
    and her new digital single 'Dare?'. Lui shares her heartfelt gratitude to her
    fans ('Lui-tomo') and discusses her future dreams, including aiming for a solo
    live concert.
