    For the song, "Himitsu no Oshigoto" (02:30 - 05:00), it's a matter of meticulous transcription. Every lyric has to be accurate, and the timing has to be precise. The FAKE TYPE. vibe is unique, and that energy needs to be reflected in the subtitles. I need to get the tone of the song, while getting the lyrics verbatim.

