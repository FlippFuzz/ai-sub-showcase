global_summary:
  overall_summary: 'This video is Ayunda Risu''s 3D Birthday Performance for 2025
    titled ''Risu''s Isekai Express : Special Performance Delivery'' (#RiSekaiExpress)
    on the Ayunda Risu Ch. hololive-ID channel. The stream features Risu as an isekai
    truck driver navigating through diverse virtual worlds—from coastal scenic routes
    and post-apocalyptic ruins to neon cityscapes and amusement park fun zones—where
    her custom truck transforms into a live concert stage. Throughout the journey,
    Risu performs an eclectic setlist of cover songs and original tracks, joined by
    special guest appearances from Kobo Kanaeru, Aragami Oga, Moona Hoshinova, and
    Airani Iofifteen. She also debuts her new original song ''Metropolis'' and showcases
    her 2025 birthday merchandise collection.'
