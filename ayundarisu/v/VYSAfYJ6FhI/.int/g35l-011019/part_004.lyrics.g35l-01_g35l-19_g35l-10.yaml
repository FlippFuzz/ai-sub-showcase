global_summary:
  overall_summary: This YouTube livestream from Ayunda Risu Ch. of hololive Indonesia
    titled '【Ayunda Risu 3D Birthday】The Rise of the NUT Warrior 【#TheNutWarrior】'
    features Ayunda Risu's 3D birthday celebration concert wrapped in an epic RPG
    storyline. Risu plays the 'NUT Warrior', embarking on a quest across a fantasy
    world to save the 'Nyut-Nyuts' from a destructive giant pink monster. Throughout
    her journey, she performs a dynamic setlist of anime covers and original songs—featuring
    guest appearances by hololive English members Nerissa Ravencroft and Elizabeth
    Rose Bloodflame. The stream concludes with birthday merchandise showcases, the
    announcement of her new original song 'Hoshi ga Furu', and an exclusive membership
    3D performance.
