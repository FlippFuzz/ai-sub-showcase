    end: '01:52.121'
    original: はい、今年も出ます！白銀ノエル誕生日記念2025のグッズはーい！えー、生誕グッズまずはこちら！
    english: Yes, they're coming out this year too! The goods for Shirogane Noel's
      Birthday Celebration 2025—yay! Um, first of the birthday goods is this!
  - start: '01:53.054'
    end: '02:24.784'
    original: はい、睡夢の世界へ！キラキラLEDアートパネルー！えー、イラストはMyungYi先生が、はい、描いてくれました。ありがとうございます！いつもお世話になってます。らぶちゅラブチー。えー今回のね、生誕ライブのステージと新衣装が、えーテーマになっております。LEDということで、こちら光る！ということでね、あの、お部屋に飾って、あの今回のライブを思い出して、その思い出にしてくださーい！
    english: Yes, "Into the Dreamworld! Sparkling LED Art Panel"! Um, the illustration
      was drawn for us by MyungYi-sensei. Thank you very much! I'm always in your
      care. Love ya, love ya. Um, the stage and new outfit from this birthday live
      serve as the theme. Since it's LED, it lights up! So please decorate your room
      with it, remember this live, and make it a cherished memory!
  - start: '02:27.464'
    end: '02:57.694'
    original: はい、そして次はこちら！色んなノエルちゃんランダムマルチバンドということで、まりえり先生が描いてくれました。ありがとうございます！いや、いろんなね、ノエルちゃんがいますので、まあちょっと、どのノエルちゃんがね、おうちにくるかなってちょっと楽しみにしつつ届いたらね、マルチバンドのこちら、あの、お片付けの必需品となってます。え、ノエルちゃんも使っておりますので、あの、ぜひね、あの、コードをまとめるときとか、はい、で日常性に飛んでますので、使ってみてくださいー！
    english: Yes, and next is this! The "Various Noel-chan Random Multi-Band", drawn
      for us by Marieri-sensei. Thank you very much! Since there are various Noel-chan
      designs, you can look forward to which Noel-chan will come to your house, and
      when it arrives, this multi-band is an essential item for tidying up! Noel-chan
      uses it too, so please use it when organizing cords and for everyday use!
  - start: '03:01.354'
    end: '03:27.974'
    original: 次は、こちら！姫騎士ノエルぬいぐるみキーホルダーということで、えー、昨年はね、あのサンタさんのノエルちゃんがぬいぐるみとして、はい、キーホルダーに出たんですが、今回はせっかく新衣装が出たので、えーこちらでぬいぐるみキーホルダーを、えー作りました！あの姫騎士として難所を守りますので、ぜひ肌身離さず、えー持ってくださーい！
    english: Next is this! The "Princess Knight Noel Plushie Keychain". Last year,
      Santa Noel came out as a plushie keychain, but since we finally got a new outfit
      this time, we made a plushie keychain of it! It will guard your difficult spots
      as a princess knight, so please keep it close to you at all times!
  - start: '03:30.344'
    end: '03:59.784'
    original: 次は、こちら！わんちょむ2wayネックピローということで、ま、安眠にね、最適なネックピローなんですけれど、今回は、なんとひっくり返すと、わんちょむになっているということで、ま、わんちょむはね、あの今年から団長のおうちにお迎えしたわんちょむのことなんですけど、えーグッズにしちゃいました。えーちょっとね、あのノエルちゃんの、あい、あの、市場が入ってまーすということで、ぜひ団長のおうちにも迎えてくださーい！
    english: Next is this! The "Wanchomu 2-way Neck Pillow". It's the optimal neck
      pillow for restful sleep, but this time, amazingly, if you flip it over, it
      turns into Wanchomu! Wanchomu is the dog I welcomed to the danchou's house starting
      this year, and we turned it into merchandise! It's infused with Noel-chan's
      love, so please welcome it into your house too!
  - start: '04:00.674'
    end: '04:15.204'
    original: 最後にフルセットを見てみましょう。こちら！今年もいっぱい、いっぱいグッズが出ました。いや本当ぜひぜひ、あのゲットしてみてね。
