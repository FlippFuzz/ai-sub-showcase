  - start: '03:50.000'
    end: '04:02.500'
    original: そして、次はこちら！ノエちゃんランダム缶バッジということでね、いっぱいあるんですけれど、あの、団長ね、缶バッジってあんまりなんか、出したことないよね。
    english: And next is this! Noe-chan Random Can Badge, there are a lot of them,
      but Danchou hasn't really released can badges before, right?
  - start: '04:02.500'
    end: '04:48.500'
    original: でもね、いろいろ憧れてたんです。あの他のね、ホロメンとかがさ、こういう誕生日とか周年とかに缶バッジ出してそれを、あの、団員さんとかが、あの、集めてね、くれると、あの、なんだ、祭壇とか作っていのを見て、団員さんもぜひノエちゃんの祭壇とか作ってほしいなっていう。ほかの女の子の缶バッジ買っちゃだめだからね、ちょっと言葉間違えちゃいました。こちらはイラストレーター鍬田ない先生に描いていただきました。色々な衣装のノエちゃん、ぜひぜひ単品でも売ってますので、集めてください。
    english: But I've always admired it. Seeing other holomembers release can badges
      for birthdays or anniversaries, and having Danin collect them and build altars...
      I wanted Danin to build altars for Noe-chan too. You mustn't buy other girls'
      can badges though! Ah, I misspoke. These were illustrated by Kuwata Nai-sensei.
      Noe-chan in various outfits is sold individually as well, so please collect
      them!
