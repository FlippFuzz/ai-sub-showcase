  - start: '03:19.000'
    end: '03:26.500'
    original: はい、え、ノエサンタがお届け、アクリルジオラマスタンドということで、あのイラストレーターさんは、あのMyungYiさんに、あの描き下ろしていただきました。ありがとうございます！
    english: Yes, eh, "Delivered by Noe-Santa! Acrylic Diorama Stand," drawn by illustrator
      MyungYi-san. Thank you very much!
  - start: '03:27.000'
    end: '03:48.000'
    original: いやこれね、かわいい、あのノエサンタですね。多分団員さんにプレゼントをこもって行こうとしてるところなんじゃないかなって感じなんですけど、いやめちゃかわいい！いや本物のサンタはもしかしてノエちゃんだったのかなと思いつつ、いやこちらもね、おうちにぜひぜひ飾ってみてください。
    english: This is so cute, that Noe-Santa. It feels like she's sneaking off to
      deliver presents to the Danin, so cute! While thinking maybe the real Santa
      was Noel-chan all along, please do decorate your homes with this.
  - start: '03:49.500'
