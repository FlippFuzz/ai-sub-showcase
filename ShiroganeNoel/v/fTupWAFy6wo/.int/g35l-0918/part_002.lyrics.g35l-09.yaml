    reference_lyrics_en: |-
      The first kiss tasted like tears.
      It was like the love in dramas.
      As if waiting for the right moment, the departure bell rang.
      A winter wind brushes my cheek.
      So I blew on my hands and rubbed them together.
      The city is lighted by an illumination, as if magically casted,
      And made the naked trees sparkle.
      I just couldn't say it, my feelings I kept inside.
      This is what I've decided to do, it's alright, I won't look back so...
      Thank you, goodbye. A bittersweet unrequited love.
      If I stopped moving now, I might think back to our past, so...
      Thank you, goodbye. I won't cry at all.
      The moment I thought that, softly, the snow began to fall, so flowingly.
      When I touched it, it dissolved and disappeared.
      As I continue to the station, a couple close by appears happy.
      "Hey, it's the first snow of the season!"
      I wanted to be like that with you.
      I had a hand-knitted muffler I made for the first time.
      How could I give it to you? I'm a coward, I'm too scared.
      Is it okay to let go if it'd only be a memory? I ask myself if this was true.
      Thank you, goodbye. I knew that someday a time like this would come, yet...
      Thank you, goodbye. My body is trembling.
      The train will come at any minute. It's troubling me now.
      I want us together. I want you so much. My hand is empty.
      But hey, this is what we call a goodbye, right?
      I know I have to go. I know that you are sweet too.
      So... "Please, let go of this hand."
      I am happy that we met. I love you.
      Thank you, goodbye. I can't say a single word.
      Just for a moment, give me the courage to speak.
      "Hey..."
      The lips we were about to speak... The distance to you became zero.
      Can I cry, just for this moment?
      There is no need for words, just keep holding me tightly.
      By this time next year,
      I wonder what I will be like...
      What you will be like...
