  - start: '02:19.460'
    end: '02:24.060'
    original: 染めは忘れちゃったけど、ステキだったんじゃない？おしゃれだったじゃん！
    english: I forgot the dye part, but wasn't it wonderful? It was stylish!
  - start: '02:24.180'
    end: '02:30.220'
    original: やっぱ、サンタさんしたくなっちゃう、サンタ3本ということで、や、二人も本当いい思い出をありがとうございます！
    english: You end up wanting to play Santa, three Santas... anyway, thank you two
      so much for the wonderful memories!
  - start: '02:30.400'
    end: '02:33.420'
    original: いい思い出！はい！
    english: Great memories! Yes!
  - start: '02:33.600'
    end: '02:44.520'
    original: いや、でもこれからもね、まだまだ、あの、クリスマスライブを続いていくので、ちょっとお二人には、ちょっとね、ここで…なんになっちゃうんですが、
    english: But you know, we're going to keep going with this Christmas live stream,
      so we'd like to ask you two to... wait, what's going to happen here?
