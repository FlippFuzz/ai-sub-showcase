    english: Could we ask you to jump up specially and decorate this huge Christmas
      tree?
  - start: '03:10.740'
    end: '03:13.200'
    original: もちろん！やったー！
    english: Of course! Yay!
  - start: '03:13.440'
    end: '03:18.060'
    original: よし、じゃあ一緒に飾り付けしましょう！はい！いくぞー！
    english: Alright, then let's decorate it together! Yes! Here we go!
  - start: '03:18.060'
    end: '03:20.240'
    original: 行くよー！
    english: Let's go!
  - start: '03:32.000'
    end: '03:39.500'
    original: わーい！飾り付けするぞー！おー！
    english: Yay! We're gonna decorate! Woohoo!
  - start: '03:40.860'
    end: '03:46.860'
    original: じゃあ、まずはかなでちゃんから、オーナメント飾り付けをしよう！
    english: Alright, first up, let's have Kanade-chan decorate with an ornament!
  - start: '03:47.040'
    end: '03:49.880'
    original: かなでちゃん！はい！じゃあもう行く？
    english: Kanade-chan! Yes! Are we going already?
  - start: '03:50.000'
    end: '03:53.200'
    original: なぎちょー！なぎちょー！
    english: Nagichou! Nagichou!
  - start: '03:53.440'
    end: '04:00.320'
    original: おっ、やったー！やったー！いいえー、いいえー！すごい！わーい！
    english: Oh, yay! Yay! Woohoo! Amazing! Yay!
  - start: '04:04.360'
    end: '04:08.820'
    original: 次次つける！はい、リリカつけます！
    english: Next, attaching! Yes, Lirika is attaching!
  - start: '04:08.940'
    end: '04:12.600'
    original: どこにつけるんだ？どうしようかな？
    english: Where should I put it? What should I do?
  - start: '04:12.720'
    end: '04:14.680'
    original: あ、でもここらへんとか良さそうかも。
    english: Ah, but somewhere around here might be good.
  - start: '04:15.720'
    end: '04:20.580'
    original: じゃあ華麗に、華麗に…ボーリングな。
    english: Then gracefully, gracefully... bowling style.
  - start: '04:20.580'
    end: '04:23.700'
    original: うつぶき！やったー！やったー！ありがとう！
    english: Lying down! Yay! Yay! Thank you!
  - start: '04:25.860'
    end: '04:30.860'
    original: 完璧、完璧！ありがとう、お二人とも！やったー！
    english: Perfect, perfect! Thank you, both of you! Yay!
  - start: '04:31.040'
    end: '04:33.480'
    original: ありがとうございます！ありがとうございます！
    english: Thank you very much! Thank you!
  - start: '04:33.480'
    end: '04:39.800'
    original: ありがとう！引き続き頑張ってくださいね！あ、頑張る！がんばるぞー！
    english: Thank you! Keep up the good work! Ah, I'll do my best! Let's do our best!
