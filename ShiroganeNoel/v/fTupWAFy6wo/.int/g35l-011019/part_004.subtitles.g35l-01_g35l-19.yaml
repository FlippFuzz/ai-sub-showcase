    english: Yes! Oh, I do!
  - start: '01:19.640'
    end: '01:29.980'
    original: なんでしょう？やっぱりクリスマスといえばケーキじゃないですか？だから、クリスマスが終わった翌日に安くなったケーキをいっぱい食べることです！
    english: What is it? Speaking of Christmas, it's gotta be cake, right? So, eating
      lots of discounted cake the day after Christmas!
  - start: '01:30.180'
    end: '01:32.480'
    original: 最高！いい思い出！
    english: The best! Such a good memory!
  - start: '01:32.600'
    end: '01:35.700'
    original: ま、でもね、やっぱ味は変わんないしね。
    english: Well, I mean, the taste doesn't change, right?
  - start: '01:35.820'
    end: '01:38.920'
    original: そうそう、でも安くなってる、やったね！おいしさ2倍！
    english: Exactly, but it's cheaper, yay! Twice as delicious!
  - start: '01:39.100'
    end: '01:42.180'
    original: かなえちゃんらしき限界を感じますけれど、
    english: I feel like we're reaching Kanade-chan's limits here, but...
  - start: '01:42.360'
    end: '01:46.060'
    original: かなでちゃんはなんですか？あっ、かなでも思い出あります！
    english: What about Kanade-chan? Ah, Kanade has memories too!
  - start: '01:46.300'
    end: '01:48.880'
    original: ある！いいね！
    english: I do! Awesome!
  - start: '01:48.940'
    end: '01:54.600'
    original: ちょっとよい子のみなさんはちょっとだけお耳を閉じて、いや、そんなことないでいこう。
    english: Kids, close your ears for just a second... no, wait, let's not say that.
  - start: '01:54.720'
    end: '02:00.620'
    original: え、ちょっとクリスマスの時に、あの幼稚園の時の話なんですけどね、
    english: Um, when it was Christmas, back when I was in kindergarten,
  - start: '02:00.620'
    end: '02:07.820'
    original: 幼稚園のところで、あの来た、あのサンタのコスプレをしたおじさん…おじさんじゃなくて、サンタさんでしょ、それ！
    english: at kindergarten, that Santa cosplay guy who came... not a guy, it was
      Santa, right?
  - start: '02:07.940'
    end: '02:11.700'
    original: 白いカツラの下に…カツラって言わないで！
    english: Underneath his white wig... don't call it a wig!
  - start: '02:11.780'
    end: '02:15.340'
    original: 言ってたことが甘いでしゅ、ぜひ！
    english: He said things were a bit naive, please!
  - start: '02:15.580'
    end: '02:19.460'
    original: なんか現実が違うよね。染めは連れちゃった。
