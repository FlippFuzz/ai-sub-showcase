      I whisper it in your ear and avert my eyes; only you can hear
      You’re my knight of the night and the silver moon above
      I grasp your shaking hand, hot to the touch
      Until you go, close and hold me tight
      You’re the one - my love, my miracle, just for tonight

      Come on in! Come on in! Hey, won’t you dance with me again?
      Dusk to dawn, let’s just pretend that this night will never end
      Afraid, I hesitate, but this energy’s grown stronger now, tempting me
      Come and dance! Come and dance, to this beat that never ends!
      Join me if you know the steps - all night, we’ll be at the dance
      The stars above connect in a discotheque;
      Won’t you make me feel like that?
      I don’t care if it’s all gone when I open my eyes,
      For now I’ll make my vows on the starry sky
      Tomorrow’s on its own -
      I’ll be here one more night
      I’m the princess of roses, this moment fades to black
      Embrace me now, but darling, don’t look back
      I can see it in your eyes -
      The reflections of what you’ve tried to hide
      You’re my knight of the night and the starless sky above
      I smile again, but still, you’re burning up
      Until I go, close and hold me tight
      You can be my love, my miracle just for tonight

