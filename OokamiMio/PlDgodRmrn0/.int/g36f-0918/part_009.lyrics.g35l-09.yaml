    reference_lyrics_en: |-
      Return to me, tracing your memory, back to the source of gentleness and dreams, in order to be born again led by the star.
      It's soul's refrain.

      The bare skin is covered by blue shade.
      It is trembling quietly in the passage of time.
      As if asking where the life has gone, your fingertips seek for me.
      I've been hugging you as my destiny, but you're just like a fleeting flower blooming in the season.
      Leaving the smell of hope on my breast, you rush to fall with your vivid shape.

      Return to me. Before your birth, you had been on this earth.
      Return into my arms in order to meet them.
      The miracle happens again and again.
      It's soul's refrain.

      When I close my eyes like praying, the world just vanishes into the depths of darkness.
      The heartbeat, however, starts to move again, searching for the limited eternity.

      Return to me, tracing your memory, back to the source of gentleness and dreams.
      You too must return in order to love each other.
      Minds and bodies are repeated.
      It's soul's refrain.

      Return to me. Before your birth, you had been on this earth.
      Return into my arms in order to meet them.
      The miracle happens again and again.
      It's soul's refrain.
