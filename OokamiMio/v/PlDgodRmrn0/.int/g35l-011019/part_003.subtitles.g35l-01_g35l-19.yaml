  overall_summary: This video is the inaugural 3D Acoustic Live concert titled '【
    3D LIVE 】RosaMiAによる、初めてのアコースティックライブ【生歌唱】' hosted on Ookami Mio's YouTube channel.
    The concert features RosaMiA, a Hololive unit composed of Aki Rosenthal, Ookami
    Mio, and AZKi. Throughout the 59-minute stream, the trio delivers stunning acoustic
    arrangements of both group anthems and duo/trio covers, culminating in the surprise
    live debut announcement and performance of their 1st digital single 'Blossom Sinfonia'.
