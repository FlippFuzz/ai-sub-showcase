  overall_summary: This video is the 2024 birthday 3D live concert of Hololive Gamers
    member Ookami Mio, titled '晴れ時々にわかミオ' (#大神ミオ生誕ライブ2024). Featuring a stunning outdoor
    park and city stage that transitions between sunny and rainy weather, Mio performs
    a diverse setlist of original songs and popular J-pop/vocaloid covers. She is
    joined by numerous Hololive guest stars including Shirakami Fubuki, Nekomata Okayu,
    Inugami Korone, Tokoyami Towa, Houshou Marine, Usada Pekora, Tsunomaki Watame,
    and AZKi. The stream also includes a special merchandise showcase designed by
    Mio and her illustrator, 泉彩 (Izumi Aya).
