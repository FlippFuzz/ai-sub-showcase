  english: Wow everyone, um, how do you like my solo live outfit?
- start: '04:33.408'
  end: '04:35.398'
  original: かわいい！嬉しい！
  english: Cute! I'm so happy!
- start: '04:36.758'
  end: '04:53.308'
  original: なんとなんと今回、あの6年と、まあもうちょっとで7年活動してきて、尻尾が解放されてるんです！
  english: Believe it or not, this time, having been active for 6 years, and almost
