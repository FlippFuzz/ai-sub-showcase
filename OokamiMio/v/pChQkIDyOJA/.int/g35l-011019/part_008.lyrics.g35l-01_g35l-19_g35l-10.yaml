- start: '03:53.648'
  end: '03:55.708'
  original: 言ってもらってもいいですか？
  english: Would you mind saying it for me?
- start: '03:59.758'
  end: '04:03.358'
  original: それじゃあ、いきますよ！ うち、うち、うちだよー！
  english: Well then, here we go! It's me, me, it's me!
- start: '04:04.148'
  end: '04:05.148'
  original: おーー！
  english: Ooh!
- start: '04:07.828'
  end: '04:15.548'
  original: 本日は大神ミオのソロライブ開催おめでとうございます！
  english: Congratulations on holding Ookami Mio's solo live today!
- start: '04:21.038'
  end: '04:24.718'
