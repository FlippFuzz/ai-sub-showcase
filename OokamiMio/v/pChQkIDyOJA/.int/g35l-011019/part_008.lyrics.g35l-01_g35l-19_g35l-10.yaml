  english: Surely the future overflows with color, dyeing the unseen world in vibrant
    hues
- start: '00:32.415'
  end: '00:38.315'
  original: もっと自由に飛び立ちたいから ずっとずっとずっと夢見てるの
  english: Because I want to take flight more freely, I'm always, always, always dreaming
- start: '00:51.685'
  end: '00:57.985'
  original: 空に光る星のように 輝きたいと願う夜
  english: On nights when I wish to shine like a star glittering in the sky
- start: '00:58.785'
  end: '01:04.385'
  original: 広い世界に存在を証明したくて
  english: Wanting to prove my existence to the vast world
- start: '01:04.885'
  end: '01:09.585'
  original: できないことばかり数えても 胸が苦しくなるだけでしょ
  english: Even if I just count what I can't do, it only makes my chest ache
- start: '01:11.785'
  end: '01:17.385'
  original: 私だって絶対 あの日の夢のようになれるはず
  english: I'm sure I too can become just like that dream of that day
- start: '01:19.485'
  end: '01:27.785'
  original: 響くメロディーの中 ほら見知らぬ景色 ときめいてたのに 近づいたら消えていったんだ
  english: Inside the echoing melody, look—an unfamiliar scenery was making my heart
    flutter, but when I got close, it vanished
- start: '01:31.285'
  end: '01:36.585'
  original: そっと伸ばしたこの手の先 願いが虹そうぞうを超えるとき見つける私の色
  english: At the tip of this hand I softly extended, when the ideal I envisioned
    surpasses imagination, I find my color
- start: '01:42.285'
  end: '01:46.485'
  original: ずっとずっとずっと追いかけるの
  english: Always, always, always chasing after it
- start: '01:52.485'
  end: '01:56.585'
  original: 限りないことおねがいだ 瞳に映るすべて
  english: There are no limits, please—everything reflected in my eyes
- start: '01:59.814'
  end: '02:04.634'
  original: 変わりゆく世界の リズム乗って モノクロ染めてゆく
  english: Riding the rhythm of a changing world, dyeing the monochrome away
- start: '02:19.514'
  end: '02:27.564'
  original: 閉じ込めなくてもいいの 不安を感じても 私だけの色で描こう
  english: It's okay if you keep it locked away, even if you feel uneasy, let's paint
    it in my own color
- start: '02:33.404'
  end: '02:37.234'
  original: きっと未来は色に溢れ まだ見ぬ世界をカラフルに染める
  english: Surely the future overflows with color, dyeing the unseen world in vibrant
    hues
- start: '02:40.384'
  end: '02:45.544'
  original: もっと自由に羽ばたこうから ずっと あの日感じたままに
  english: Because I'll soar more freely, always just as I felt that day
- start: '02:48.814'
  end: '02:56.124'
  original: そっと伸ばした この手の先 描いていた理想が 想像を超えるとき やっと見つけた 私の色
  english: At the tip of this hand I softly extended, when the ideal I envisioned
    surpasses imagination, I finally found my color
- start: '02:59.784'
  end: '03:04.854'
  original: 描き続けるの
  english: I will keep painting it
- start: '03:24.498'
  end: '03:27.028'
  original: ありがとうございます！
  english: Thank you very much!
- start: '03:30.438'
  end: '03:36.858'
  original: というわけで、まずは自己紹介からしたいと思うんですけど
  english: So first, I'd like to do a self-introduction, but...
- start: '03:38.168'
  end: '03:40.238'
  original: あのー
  english: Um...
- start: '03:40.858'
  end: '03:45.308'
  original: みんな、分かってる人と分かってない人いるかもしれないから一応説明するんですが
  english: Some of you might know, and some might not, so I'll explain just in case.
- start: '03:45.308'
  end: '03:52.928'
  original: 「うち、うち、うちだよ！」って言ったら、みんな「大神ミオだよ！」って言ってもらったら、うちの自己紹介が完成するので
  english: If I say "Uchi, uchi, uchi da yo!" ("It's me, me, it's me!"), and you all
