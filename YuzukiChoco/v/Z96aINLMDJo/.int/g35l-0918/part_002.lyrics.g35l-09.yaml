      Acting like an adult for you, I bear a secret class.
      To the difficult question of "Do you love me?", I can only respond with a smile.
      As if teased by a demon, you are waiting for my answer.
      It would be better to put it in an album as a faint love affair.
      I am terribly scared of when the chime signaling the end will ring.
      Surely that girl suits you better,
      monkey uniform and swaying white coat.
      Even casual words end up hurting.
      Don't torment me with innocent eyes that have nothing to lose.
      Even adults can't answer your test, stumbling for words.
      Even though I want to throw everything away and pull you into a embrace saying "I love you".
