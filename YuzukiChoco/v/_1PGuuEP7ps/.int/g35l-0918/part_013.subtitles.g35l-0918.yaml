  thoughts: |+
    **My Thoughts on Choco's Announcements**

    Okay, so I've been reviewing
    the audio for Yuzuki Choco's
    video. How did everyone like it?
    My new song, "Kimi no Byoushin"
    features lyrics by Shido
    Mao-sama, and composition and
    arrangement by Mimegumi Aki-sama.
    For the arrangement, Kato
    Takayuki-sama also joined in!

    Man, this time, it's the first
    part of our voice drama tie-in
    project. It's shaped up into a
    cool song that carries the
    theme song of the whole story!
    Pay close attention to the
    metaphor of the 'second hand,'
    which is key to the drama!
    Not just Shido-san, but lots
    of gorgeous artists are
    participating, so look forward!

    "Kimi no Byoushin" will be on
    music streaming sites starting
    March 15th at midnight, though
    there's a bit of a wait! Please
    rewatch the stream and listen
    closely until the release!
    The MV will be released at a
    later date, so look forward to
    that too!

    With that said, how was Choco's
    birthday live today?
    Right after this, we announced
    it at the beginning, the MV
    release of Noe-chan, Rami-tan,
    and my 'First Love Great War'
    trio song.
    After that, for members only,
    we'll have more of the live,
    the photoshoot continuation,
    and situational dramas that
    you can only see for members.
    So definitely check it out if
    you're interested!
    Well then, let's meet again
    later! Good work!


