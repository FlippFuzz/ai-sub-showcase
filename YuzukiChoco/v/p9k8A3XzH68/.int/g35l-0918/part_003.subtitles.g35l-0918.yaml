    *   **Segment 26-37:** The fourth gesture involves more acting out, in which Choco is doing the actions of a bird. Both Subaru and Choco are playing off of each other, and it's my job to take the action and transcribe it as the dialogue. At one point, Choco calls out to the viewer, asking to give the answer, and Subaru finally comes to the correct conclusion of "duck."

