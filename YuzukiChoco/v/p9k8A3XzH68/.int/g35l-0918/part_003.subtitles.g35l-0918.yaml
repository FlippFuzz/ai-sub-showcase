    *   **Segment 10-15:** Subaru is now expressing concern regarding the remaining three gestures in the game. He jokes that if he doesn't get the next few right, the children watching will start to cry. His language becomes more direct and he expresses strong opinions on the nature of the game and Choco's difficult guess. I need to make sure to convey the nuances of their banter in the subtitles as accurately as possible.

