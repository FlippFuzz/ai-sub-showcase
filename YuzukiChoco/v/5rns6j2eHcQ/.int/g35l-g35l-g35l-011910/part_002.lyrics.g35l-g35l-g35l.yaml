global_summary:
  overall_summary: This video is the 2024 3D Birthday Live stream of Hololive 2nd
    Generation member Yuzuki Choco, titled '【#癒月ちょこ生誕祭2024】‐ GotCheat‐コラボ者多数！重大告知あり！3DBirthdayLIVE!!!'.
    The live concert features a 'Forbidden Fruit' (禁断の果実) theme, showcasing solo performances,
    duet collaborations with various Hololive and Nijisanji guests (Oozora Subaru,
    Himemori Luna, Shishiro Botan, Nekomata Okayu, Aki Rosenthal, Houshou Marine,
    Amane Kanata, and Shirayuki Tomoe), birthday merchandise and voice pack announcements,
    a traditional red carpet segment, and the premiere of her new original song 'Got
    Cheat'.
