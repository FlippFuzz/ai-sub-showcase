    birthday live while dealing with her mischievous mirror-self/rival, Emma Red (Immered),
    who repeatedly traps and sabotages her. Along the way, Cecilia is joined by various
    hololive guests including Ouro Kronii, Nanashi Mumei, Kobo Kanaeru, Ninomae Ina'nis,
    Shirakami Fubuki, Ookami Mio, Himemori Luna, and Juufuutei Raden for musical performances,
    comedic skits, therapy sessions, physics-based escape sequences, a merchandise
    showcase, and final closing remarks.
