  original: 1回きりはごめん。足りないだから、足りないだから
  english: Ikkai kiri wa gomen. Tarinai dakara, tarinai dakara
- start: '02:30.300'
  end: '02:35.400'
  original: 何回しても、またよ。好きを知らない、好きを知らないからね
  english: Nankai shitemo, mata yo. Suki o shiranai, suki o shiranai kara ne
- start: '02:35.500'
  end: '02:37.500'
  original: そのまんまでいてね
  english: Sono mama de ite ne
- start: '02:38.200'
  end: '02:41.600'
  original: 仮面、エルミタージュ、確定的
  english: Kamen, hermitage, kakuteiteki
- start: '02:41.700'
  end: '02:46.900'
  original: 深淵、簡単、勝ちだ、そこが好きだ
  english: Shin'en, kantan, kachida, soko ga sukida
- start: '02:48.000'
  end: '02:51.600'
  original: 仮面、エルミタージュ、確定的
  english: Kamen, hermitage, kakuteiteki
- start: '02:51.700'
  end: '02:59.800'
  original: 深淵、簡単、勝ちだ、そこが好きだ
  english: Shin'en, kantan, kachida, soko ga sukida
- start: '03:03.210'
  end: '03:05.150'
  original: ありがとう！バイバイ！
  english: Thank you! Bye-bye!
- start: '03:07.890'
  end: '03:10.190'
  original: 待ってジジ！こっち来なさい！
  english: Wait, Jiji! Come over here!
- start: '03:11.450'
  end: '03:14.650'
  original: 待って！来い！来い！私と約束したでしょ！
  english: Wait! Come back! Come back! You promised me!
- start: '03:16.350'
  end: '03:18.490'
  original: 予定に入れていたのを忘れていました
  english: Oh yes, I forgot that I scheduled that into my calendar.
- start: '03:19.490'
  end: '03:20.590'
  original: お座りください
  english: Why don't you sit down?
- start: '03:20.650'
  end: '03:21.850'
  original: 何その喋り方…
  english: Why are you talking like that?
- start: '03:22.090'
  end: '03:24.370'
  original: Okay. やっとセラピーを受けられる！
  english: Okay. My promised therapy session can finally happen!
- start: '03:27.270'
  end: '03:29.350'
  original: リラックスできてますか、セシリアさん？
  english: Are you relaxed, Cecilia Immergreen?
- start: '03:30.150'
  end: '03:31.730'
  original: いや、ええ、まあ、そう…
  english: Yeah, yeah, I guess so...
- start: '03:32.210'
  end: '03:33.250'
  original: お隣に失礼します
  english: Let me sit down next to you.
- start: '03:33.430'
  end: '03:36.570'
  original: 全ての始まりはあの時… 今の気分は？
  english: So it all started back then... How do you feel right now?
- start: '03:37.350'
  end: '03:42.930'
  original: 楽しく踊っていい気分だけど… イマーレッドが生誕ライブを邪魔してきてイラつく！
  english: I mean, I'm okay, I had fun dancing, but I'm frustrated because Immered
    is ruining my birthday live!
- start: '03:43.250'
  end: '03:44.330'
  original: それはお気の毒に
  english: Oh no, I'm sorry you feel that way.
- start: '03:45.050'
  end: '03:47.450'
  original: なぜイマーレッドさんは邪魔してくるのでしょう？
  english: Why do you feel that Immered is ruining your birthday live?
- start: '03:48.330'
  end: '03:50.410'
  original: アイツのことはよく知らないし…
  english: I don't know, I don't even really know her to be honest.
- start: '03:51.130'
  end: '03:52.550'
  original: ほう、なぜです？
  english: Oh. Why not?
- start: '03:53.470'
  end: '03:56.490'
  original: だって、もう２年ぐらい会ってないし！
  english: Because I haven't seen her in like two years!
- start: '03:57.370'
  end: '03:59.790'
  original: その間彼女はどうしてました？
  english: Well, what has she been doing in these two years?
- start: '04:00.070'
  end: '04:05.130'
  original: いや、彼女は比如に閉じ込めて… 棚に置きっぱなしに…？暖房器具の隣に？
  english: I think she was like in a jar or something? I trapped her and put her on
    my shelf? Next to a heater?
- start: '04:06.130'
  end: '04:08.530'
  original: 出してあげては？
  english: Let's unpack that.
- start: '04:08.850'
  end: '04:15.550'
  original: でも邪魔される筋合いはありません。ピンに詰められたからって誕生日を台無しにするなんて…
  english: Well, I feel like it's really unfair that she's doing this, just because
    she was in there doesn't really matter, and she shouldn't ruin my birthday.
- start: '04:16.490'
  end: '04:24.470'
  original: I see. では、もし確定申告をする場合… イマーレッドは別扱いになるので課される税金は２倍ということに…
  english: I see. Well, if you would like to file taxes... Immered would count as
    another person, so you might have to file double taxes...
- start: '04:24.950'
  end: '04:29.690'
  original: は？何の話し？
  english: What? What are you talking about?
- start: '04:30.130'
  end: '04:31.250'
  original: 失礼しました
  english: Oh, I'm sorry.
- start: '04:31.950'
  end: '04:36.570'
  original: その喋り方は何？本当にジジ？セラピー中に、税金の話をするつもりはありませんでした
  english: Why are you talking like that? Are you really Jiji? I did not mean to talk
    about taxes during your therapy session.
- start: '04:36.750'
  end: '04:43.730'
  original: 話を逸らしてばっかり！誤解させたなら、すみません。苛立つ気持ちは分かります、そうするようにプログラムされています
  english: You're derailing us like crazy! I did not mean to derail you. I understand
    your frustrations. It is in my code, I am-
- start: '04:44.250'
  end: '04:46.910'
  original: 何言ってるの！？こんな時間の無駄！
  english: What are you talking about?! You're wasting my time!
- start: '04:47.370'
  end: '04:50.510'
  original: なぜそう感じるのですか？あなたが脱線ばかりするからよ！
  english: Why do you feel that way? Because you are derailing our conversation!
- start: '04:50.830'
  end: '04:53.070'
  original: すみません、脱線させるつもりは…
  english: I'm so sorry, I did not mean to derail our conversation...
- start: '04:53.390'
  end: '04:57.910'
  original: お前ジジじゃないな！お前は偽物のジジだ！
  english: You're not Jiji! You're not even the real Jiji Morin!
- start: '04:58.330'
  end: '05:00.190'
  original: 本物のジジがやりそうなことやってみなさい！
  english: You know what, do something only the real Jiji would do!
