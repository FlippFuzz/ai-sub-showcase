  - start: '03:09.305'
    end: '03:10.595'
    original: 見ろ 血肉が花火の様だ
    english: Look right down here upon, the dazzling blood and bodies.
  - start: '03:13.565'
    end: '03:14.655'
    original: 撒き散らす 撒き散らす
    english: Scattered all around, scattered all around.
  - start: '03:16.595'
    end: '03:18.065'
    original: 千の傷跡 忘れちゃいけないさ
    english: I cannot forget my scars, a thousand drawn from years of war.
  - start: '03:21.035'
    end: '03:22.585'
    original: 炎の熱も 零れた内臓も
    english: The heat of fire, the burns it gave,
  - start: '03:25.045'
    end: '03:26.545'
    original: 最後の呻きも 濁った瞳も
