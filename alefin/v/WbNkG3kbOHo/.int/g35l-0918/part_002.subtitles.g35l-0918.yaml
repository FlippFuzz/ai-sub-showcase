  - start: '03:29.075'
    end: '03:30.295'
    original: ああ それこそを求めるのだ！
    english: Ah yes all of these memories! I’ll seek them out again!
  - start: '03:35.325'
    end: '03:37.405'
    original: 安寧も平穏も増して和解なんて気の沙汰は
