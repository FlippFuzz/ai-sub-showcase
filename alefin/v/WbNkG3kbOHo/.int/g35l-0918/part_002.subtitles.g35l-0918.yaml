  - start: '01:48.152'
    end: '01:48.882'
    original: 戦場へ！前線へ！そして死の淵まで！
    english: To the battle! To the frontlines! To the brink of death!
  - start: '01:50.012'
    end: '01:51.692'
    original: 命捨てたその覚悟を示せ！
    english: Show them the firm resolve of those who will cast their lives away!
  - start: '01:55.272'
    end: '01:55.772'
    original: Feuer! Sperrfeuer! Los!
    english: Feuer! Sperrfeuer! Los!
  - start: '01:57.482'
    end: '01:57.652'
    original: Achtung! Deckung! Hinlegen! Halt!
    english: Achtung! Deckung! Hinlegen! Halt!
  - start: '02:00.082'
    end: '02:01.372'
    original: 聴こえるだろう あの砲声が
    english: Oh can you hear the roar of the ringing cannon?
  - start: '02:03.222'
    end: '02:04.142'
    original: 抵抗する蛆の声音だ
    english: And down beneath it all, cries of struggling maggots.
  - start: '02:06.182'
    end: '02:07.162'
    original: 踏み潰せ！踏み潰せ！
    english: Crush them under foot! Crush them under foot!
  - start: '02:11.662'
    end: '02:11.962'
    original: 諸君 我々の任務は何だ
    english: 'Unit, I ask you: what is our mission?'
  - start: '02:13.842'
    end: '02:14.392'
    original: 殲滅だ！一機残らずの殲滅だ！
    english: Annihilate all! Eliminate them all!
  - start: '02:16.482'
    end: '02:17.372'
    original: 為すべきことは唯一つ 地獄を創れ！
    english: We’re here for just one reason, to make hell on earth!
  - start: '02:20.932'
    end: '02:22.422'
    original: 何故炎の中進んで行くのか
    english: Why do we march through flame and fire?
  - start: '02:24.162'
    end: '02:25.752'
    original: 弾丸の雨に打たれに行くのか
    english: Do we march just to be gunned down?
  - start: '02:26.542'
    end: '02:28.912'
    original: 笑止千万！帝国(くに)の為だ！
    english: A foolish idea of the weak. We march for the fatherland!
  - start: '02:29.822'
    end: '02:30.342'
    original: 戦場へ！前線へ！そして死の淵まで！
    english: To the battle! To the frontlines! To the brink of death!
  - start: '02:31.952'
    end: '02:33.712'
    original: 命捨てた覚悟を示せよ！
    english: Show them the firm resolve of one who has cast away their life now.
  - start: '02:35.882'
    end: '02:37.602'
    original: 忠誠を！従順を！そしてその魂を！
    english: Your loyalty! Your servitude! Even your very soul!
  - start: '02:40.852'
    end: '02:42.272'
    original: 全て捧げ勝鬨を上げよ！
    english: Give them all up and cry out for our grand victory!
  - start: '02:45.392'
    end: '02:46.422'
    original: さあ此処に築いてみせろ！
    english: Come let us build a tower into the sky!
  - start: '02:48.062'
    end: '02:50.812'
    original: 天に届く死体(ひと)の山を！
    english: A mountain of dead men, reaching the high heavens!
