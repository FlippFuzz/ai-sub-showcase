- subtitles:
  - start: '00:00.085'
    end: '00:01.325'
    original: え なんか おばけ 感じ？
    english: Um, like a ghost?
  - start: '00:02.055'
    end: '00:09.135'
    original: いや 今日はハロウィンだから まあおばけたちを おかし いっぱいもらいに行けないといけないんです！
    english: Yeah, today is Halloween, so we can't go ghost-hunting, right?
  - start: '00:09.685'
    end: '00:10.125'
    original: えっ ちょっと待って、当たってるわ。
    english: Wait, wait!
  - start: '00:14.075'
    end: '00:14.375'
    original: あーわかる！トリックオアトリート！
    english: I know! Trick or treat!
  - start: '00:16.275'
    end: '00:16.895'
    original: 食べに行っちゃう？食べに行っちゃう？
    english: Trick or treat! Trick or treat!
  - start: '00:17.855'
    end: '00:19.455'
    original: ちょっと待って！めると行きたい！ねえ、ねえ！
    english: Wait, wait! Mel wants to go too!
  - start: '00:22.955'
    end: '00:23.775'
    original: 行こうってよ！
    english: Let's go together!
  - start: '00:24.085'
    end: '00:26.545'
    original: ねえ！ずるい！やだ！先に行かないで！待って！
    english: Hey, don't leave me behind! Wait!
  - start: '00:27.205'
    end: '00:29.845'
    original: 待ってよ！待って！
    english: Wait for me!
  - start: '00:30.595'
    end: '00:31.065'
    original: がんばってね！
    english: Do your best, okay?
  - start: '00:33.915'
    end: '00:36.565'
    original: めい ちょっとよ。がんばってねって。
    english: Mel, do your best, okay?
  - start: '00:38.285'
    end: '00:41.345'
    original: へえ 本当に寂しいじゃん……。
    english: Geez, I'm so lonely...
  - start: '00:42.945'
    end: '00:45.395'
    original: あっ でも今日はね、Cubsのみんなが居るよね！
    english: But today, all the Cubs are here, right?
  - start: '00:46.335'
    end: '00:49.325'
    original: よし！改めてみんな、コンカプー！
    english: All right! Everyone, Con-Cub!
  - start: '00:50.045'
    end: '00:53.305'
    original: 魔界の天才ヴァンパイア、夜空メルです！
    english: It's Yozora Mel, the genius vampire of ghosts!
  - start: '00:54.195'
    end: '00:56.545'
    original: 今日は最後まで楽しんでってください！
    english: Today, please enjoy it until the very end!
  - start: '01:03.205'
    end: '01:03.975'
    original: そしてそして、ハッシュタグ夜空メル誕生2022でいっぱいツイートしてね！
    english: 'And then, let''s tweet a lot with the hashtag #YozoraMelBirthday2022!'
  - start: '01:04.285'
    end: '01:05.975'
    original: 写真もバシャバシャ撮ってください！
    english: Take lots of photos too!
  - start: '01:06.665'
    end: '01:11.195'
    original: あとでメル見に行くからな。約束だよ！
    english: I'm going to see Mel later, so it's a promise!
  - start: '01:12.335'
    end: '01:18.065'
    original: この後もまだまだコラボとかソロ曲とかたくさん続くので、ぜひぜひ最後まで楽しんでってください！
    english: There will still be lots of collabs and solo tracks coming up, so please
      enjoy it until the very end!
  - start: '01:20.105'
    end: '01:25.865'
    original: よし、それじゃあこの後も一緒に楽しんでいくぞ！
    english: Well then, let's enjoy the rest together!
  - start: '01:39.542'
    end: '01:39.992'
    original: Feuer! Sperrfeuer! Los!
    english: Feuer! Sperrfeuer! Los!
  - start: '01:41.972'
    end: '01:42.142'
    original: Achtung! Deckung! Hinlegen! Halt!
    english: Achtung! Deckung! Hinlegen! Halt!
  - start: '01:43.762'
    end: '01:44.202'
