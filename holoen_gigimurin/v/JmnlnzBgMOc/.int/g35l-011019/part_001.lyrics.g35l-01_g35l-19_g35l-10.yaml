    vintage-style TV broadcast network featuring comedy sketches, product commercials,
    musical dance covers, and a parody physical game show. Throughout the show, the
    duo brainstorms failing TV concepts, dives into Gigi's mind, performs energetic
    renditions of anime and game songs like 'Motteke! Sailor Fuku' and 'Baka Mitai',
    hosts an obstacle course competition, and enjoys a disastrous tea party before
    winding down for bed.
