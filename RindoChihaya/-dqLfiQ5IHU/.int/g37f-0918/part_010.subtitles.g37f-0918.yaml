  thoughts: |+
    **A Deep Dive into Rindo Chihaya's Birthday Celebration and Merch**

    Alright, let's break this down. First, the clip starts with that familiar, powerful "Finding Dreamer" finish – a perfect way to kick things off! I wanted a high-energy start, so I selected a super hype song to blast into the live, you know? The senpais’ electric energy really fired me up, and I really hope you enjoyed it!

    Then, we had "Karma" with Towa-sama! Her deep, low tones are just irresistible, and I might have, *ahem*, made a small request for her to sing it in the original key, which is ridiculously low! Towa-sama, thank you, that was amazing!

    Next up: "Jibun ROCK" with Lui-senpai! Seriously, Lui-senpai's awesome, *absolutely* killer. I chose that track because I wanted to sing with her super cool, raspy vocals – the whole performance was just insane, right?!

    After that, let's see... we had "If I Could Be a Constellation" – the super fun and lively version I did with Fuu-chan and the gang! So much fun! Then came the 7th song, the super emotional "Uchiage Hanabi" with Nyan-chan and Okayu-senpai! Honestly, it was a little embarrassing, but in that moment, I kind of got lost and acted as though I was Okayu-senpai's boyfriend! Haha, apologies to all the Onigiryaa, but it was just so incredibly fun! The emotional part went from the cool performance to emotional, and it was so much fun!

    Let me check the comments... Ah, "Too emotional", "I cried". I get it! It was so emotional! I was like, “This is *way* too emotional” while singing!

    Okay, alright, let's talk about the important part... Next up, the exciting announcements! The Rindo Chihaya Birthday Celebration 2026 Merchandise Sale! Birthday merch is *here*! And we have a ton of cool things!

    First up, the Chihaya BD Fes T-shirt 2026! It’s this cool, cute shirt featuring the full key visual illustration. I wanted it to have a band tee feel, so I made it feel a little tough with a rugged vibe. I’d love to see you all wearing this to concerts or your daily lives!

    Next is the Pick Case Keychain – a way to stylishly carry your favorite guitar picks. It comes with the keychain, and it also comes with three picks! One pick fits in the pick case! It also comes with my signature and the "FlatOut" logo, since that is also the title of the live.

    Then we have "Going Out with Chiha" Bag – so functional, right? A crossbody bag with a pouch on the front that flips over to show the contents, perfect as an ita-bag!

    And, of course, the "Anywhere Fugutaro" Tissue Cover! So cute! You can bring Fugutaro with you everywhere, at home, the car, or work.

    Also, we have a situation voice! It’s titled "Rehearsal Voice" – a nervous Chiha getting ready for the live! Let's listen!

    Oh, don't forget the Full Set Purchase Bonus! It's a bromide card with my handwritten signature and a foil-stamped message! I'm signing all of them by hand, so I'm hoping everyone buys the full set! The bonus voice is titled "With You, After the Live". So, I recommend listening to it together!

    Basically, get the full set, so you can rock the t-shirt, carry the bag, and attach the keychain. This will create a "Chiha Set" that will let you go anywhere!

    The cart opens at 9:00 PM (that's right after this!). And there's no limited quantity, so I hope you all take your time to get yours!


