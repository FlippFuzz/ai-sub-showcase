    My thought process began by establishing a firm framework, I quickly segmented the content. I took the audio details, and made sure each part was properly understood, making it easier to analyze the segments.

    First, I had the introductory dialogue – a chance to capture the opening remarks, which were as expected: gratitude and a build-up for the last song. Then the song lyrics, which I transcribed directly from the video because visual on-screen lyrics are an invaluable, and primary reference to ensure accuracy here! This will take the majority of the time, and requires a careful, almost musical, ear, because I have to accurately transcribe from audio the on-screen displayed text.  Finally, I have the outro dialogue and visual message on screen.

