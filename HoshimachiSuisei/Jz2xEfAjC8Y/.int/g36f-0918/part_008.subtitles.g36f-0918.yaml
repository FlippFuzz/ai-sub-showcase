- subtitles:
  - start: '00:04.900'
    end: '00:11.200'
    original: 改めて6周年記念生誕配信を見てくれて本当にありがとうございます。
    english: Once again, thank you so much for watching my 6th anniversary birthday
      stream.
  - start: '00:12.300'
    end: '00:18.500'
    original: 今日は私星街すいせいから皆さんに重大な発表があります。
    english: Today, I, Hoshimachi Suisei, have a major announcement for all of you.
  - start: '00:19.400'
    end: '00:27.400'
    original: これまで長年、カバーさん、そしてホロライブプロダクションには本当にお世話になってきました。
    english: Over the years, Cover and Hololive Production have truly taken great
      care of me.
  - start: '00:28.100'
    end: '00:37.000'
    original: 長年の夢だった日本武道館など、たくさんの支えのおかげで夢をひとつひとつ叶えていくことができました。
    english: Thanks to so much support, I was able to fulfill my dreams one by one,
      including Nippon Budokan.
  - start: '00:38.200'
    end: '00:42.500'
    original: 感謝の気持ちを伝えられる機会がこれまであまりなかったのですが、
    english: I haven't had many opportunities to express my gratitude until now,
  - start: '00:43.000'
    end: '00:54.000'
    original: 谷郷さんをはじめ、ホロライブのタレントのみんな、スタッフの皆さん、関係してくださった皆さんに心からの感謝をしています。ありがとうございます。
    english: but I am deeply grateful from the bottom of my heart to Mr. Tanigo, the
      Hololive talents, staff, and everyone involved.
  - start: '00:55.200'
    end: '01:04.500'
    original: その上で、東京ドームという次の目標に到達するためには、これからどうすればいいのかを考えてきました。
    english: 'With that in mind, I''ve been thinking about what I need to do next
      to reach my next goal: Tokyo Dome.'
  - start: '01:05.100'
    end: '01:09.800'
    original: 昔に比べるとたくさんの方を見ていただけるようになりましたが、
    english: Compared to the past, so many more people are watching me now,
  - start: '01:10.200'
    end: '01:15.100'
    original: それでもまだまだ越えなければいけない壁がたくさんあります。
    english: but there are still many hurdles I need to overcome.
  - start: '01:16.600'
    end: '01:25.500'
    original: いろんなものと真剣に向き合い、そして考え抜いた結果、ひとつの大きな決断を下しました。
    english: After facing various challenges seriously and giving it much thought,
      I have made one big decision.
  - start: '01:26.100'
    end: '01:31.900'
    original: びっくりさせてちゃうかもしれませんが、その発表を今日この場所でさせてください。
    english: This might surprise you, but please allow me to make that announcement
      right here today.
  - start: '01:48.800'
    end: '01:56.000'
    original: 個人事務所設立
    english: '[Establishing Personal Agency]'
  - start: '01:58.500'
    end: '02:05.800'
    original: ということで、この度、星街すいせいは個人事務所を設立することになりました！
    english: So, I, Hoshimachi Suisei, have established my own personal agency!
  - start: '02:06.100'
    end: '02:09.500'
    original: 名称は「STUDIO STELLAR」！
    english: Its name is "STUDIO STELLAR"!
  - start: '02:10.000'
    end: '02:23.000'
    original: 今後の私個人の活動、日頃の配信、音楽活動、メディア出演、タイアップ、グッズ展開などなど、全てこのSTUDIO STELLARを拠点に行なっていくことになります！
    english: All of my future individual activities—daily streams, music, media appearances,
      tie-ups, merchandise, and more—will be based out of STUDIO STELLAR!
  - start: '02:24.800'
    end: '02:27.500'
    original: と、こんな真面目なトーンで話すと...
    english: Now, speaking in such a serious tone...
  - start: '02:28.000'
    end: '02:35.000'
    original: 「えぇ〜！？すいちゃんホロライブ卒業！？」なんてね、思っちゃう人もいるんじゃないでしょうか！
    english: '"Ehh?! Suichan is graduating from Hololive?!" ...Some of you might be
      thinking that!'
  - start: '02:35.300'
    end: '02:43.900'
    original: 安心してください！ホロライブプロダクションとしての星街すいせいの活動もこれまで通り継続していきます！
    english: Please rest assured! My activities as Hoshimachi Suisei of Hololive Production
      will continue as always!
  - start: '02:44.200'
    end: '02:55.300'
    original: ホロライブの大好きなみんなとの活動は引き続き思いっきり楽しみつつ、個人としてのさらなる高みを目指す場所がSTUDIO STELLARというすみ分けです。
    english: While continuing to enjoy my activities with everyone in Hololive to
      the fullest, STUDIO STELLAR will be where I aim for even greater heights individually.
  - start: '02:55.700'
    end: '03:05.100'
    original: もっともっと大きなステージに立つための前向きで大きな決断なので、ぜひこれからも応援してもらえるとすごくすごく嬉しいです！
    english: It's a positive and big step toward standing on even bigger stages, so
      I'd be super happy if you keep supporting me!
  - start: '03:07.500'
    end: '03:15.900'
    original: ちなみに、事務所の公式SNSもできましたので、今すぐフォローしてください！
    english: By the way, the agency's official social media accounts are now live,
      so please go follow them right away!
  - start: '03:16.100'
    end: '03:24.500'
    original: IDは @ST_STELLAR_INFO です！
    english: The handle is @ST_STELLAR_INFO!
  - start: '03:25.800'
    end: '03:33.200'
    original: この個人事務所設立をきっかけに、星街すいせいを構成するあらゆるクリエイティブをリニューアルしていきます。
    english: With the establishment of this personal agency, we will be renewing all
      the creative elements that make up Hoshimachi Suisei.
  - start: '03:33.500'
    end: '03:37.000'
    original: どんどん発表していきますよ！準備はいいですかー？
    english: I'll be announcing them one after another! Are you ready?
  - start: '03:38.000'
    end: '03:45.300'
    original: それでは1つ目！長年愛用してきた星街すいせいのロゴをリニューアルさせていただきました！
    english: First up! We have renewed the Hoshimachi Suisei logo that I've been using
      for years!
  - start: '03:45.500'
    end: '03:47.300'
    original: こちら！
    english: Here it is!
  - start: '03:48.500'
    end: '03:58.200'
    original: これまでのね、歴史とトーンはしっかり踏襲しつつ、今の時代に、そして今の私に一番フィットする形にデザインし直しました！
    english: While honoring its history and tone, it has been redesigned into a form
      that best fits the current era and who I am today!
  - start: '03:59.000'
    end: '04:05.500'
    original: さらに！ずっと欲しかった私のシンボルマークも、なんと新しく誕生しましたよ！
    english: Furthermore! A symbol mark for me, which I've wanted for so long, has
      also been newly created!
  - start: '04:06.000'
    end: '04:07.500'
    original: こちら！
    english: Here it is!
  - start: '04:08.000'
    end: '04:11.800'
    original: いかがですか？可愛いね、王冠マークになっております！
    english: How do you like it? It's a cute crown mark!
  - start: '04:12.800'
    end: '04:16.900'
    original: お次はアーティスト写真です！どうぞ！
    english: Next up is my artist photo! Here you go!
  - start: '04:19.000'
    end: '04:28.500'
    original: はい！今回は夜の海で撮影してもらいました！これからの果てしない旅を感じさせるお気に入りの1枚になっております！
    english: Yes! This time, it was shot by the sea at night! It's one of my favorite
      photos, giving a sense of the endless journey ahead!
  - start: '04:30.000'
    end: '04:37.800'
    original: まだまだありますよ！実はこれまでずっと無かったすいちゃんの公式ウェブサイトが、ついにオープンします！
    english: There's still more! Suichan's official website, which didn't exist until
      now, is finally opening!
  - start: '04:40.000'
    end: '04:46.500'
    original: 最新情報だったり、随時アップデートしていくので、毎日チェックしてくださいね！
    english: Latest information and updates will be posted regularly, so please check
      it every day!
  - start: '04:47.200'
    end: '05:00.000'
    original: そしてそして、皆さんきっと待望であろう、公式ファンクラブも設立が決定しました！名前は「星詠み」！
    english: 'And next, something you''ve all been eagerly waiting for: the official
      fan club is set to open! The name is "Hoshiyomi"!'
  thoughts: "```json\n{\n  \"summary\": \"**My Thoughts on a Major Announcement**\n\
    \nOkay, here's how I'm thinking about this.  First off, massive thanks to everyone\
    \ who tuned into the 6th anniversary stream!  It's been an incredible journey.\
    \  I've got a really big announcement to make today, something I've been working\
    \ on for a while. \n\nI’m deeply grateful to Cover and Hololive Production. They've\
    \ supported me so much over these years. They helped me achieve so many of my\
    \ goals – like performing at the Nippon Budokan, which was a dream come true.\
    \  I haven't always had the chance to express my gratitude as directly as I’d\
    \ like, so I want to say how incredibly thankful I am to Tanigo-san, the other\
    \ Hololive talents, the entire staff, and everyone who's been involved. You've\
    \ all been amazing.  \n\nMy next big goal is the Tokyo Dome. I've been thinking\
    \ hard about what it takes to get there, and how to reach that next level.  Even\
    \ though I've seen so much support grow, there are still plenty of challenges\
    \ ahead. I've been giving it a lot of thought – really weighing my options.  After\
    \ all that, I've made a pretty big decision. \n\nSo, here it is: I am establishing\
    \ my own personal agency!  It’s called “STUDIO STELLAR”!  This means all my future\
    \ individual activities, like streams, music, media appearances, collaborations,\
    \ merchandise—everything—will be based out of STUDIO STELLAR.  I know some of\
    \ you might be thinking, \\\"Wait, is Suichan leaving Hololive?!\\\"  Don't worry!\
    \ My activities as Hoshimachi Suisei within Hololive Production will continue\
    \ just like before.  Think of it as setting up a separate space, where I can focus\
    \ on personal growth while continuing to enjoy all the fun with my Hololive friends.\
    \  This is a positive step toward bigger stages, so I'd appreciate all your continued\
    \ support!  \n\nI've also launched official SNS accounts! Please follow @ST_STELLAR_INFO!\
    \ With the establishment of the personal agency, I'm going to refresh my whole\
    \ creative brand: a new logo, symbol mark, artist photo, and my own official website\
    \ is opening soon, and finally, my official fan club will be 'Hoshiyomi.' \n\n\
    The new logo honors the history and tone but is refreshed for now, and a crown-shaped\
    \ symbol mark has been added. The new artist photo was shot at the beach at night,\
    \ reflecting my infinite journey. I've also opened my official website, and I'll\
    \ keep it updated. Please check it every day!\n\nFinally, the moment we’ve all\
    \ been waiting for: my official fan club is here! It's called \\\"Hoshiyomi.\\\
    \" I'm really looking forward to sharing this next phase with everyone.  Let's\
    \ do this!\",\n  \"timecodes\": [\n    \"00:00 - 05:01\"\n  ]\n}\n```\n\n"
