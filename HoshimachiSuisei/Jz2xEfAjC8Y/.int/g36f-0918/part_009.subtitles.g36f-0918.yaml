name: part_009
total_attempts: 1
video_duration_ms: 303008
subtitles_prompt_version: 18
responses:
- subtitles:
  - start: '00:00.000'
    end: '00:02.800'
    original: '...をファンクラブの名前にさせていただきました。'
    english: '...and made that the name of our fan club.'
  - start: '00:02.800'
    end: '00:08.500'
    original: これからももっとみんなの近くで、いろんなことを発信していきたいと思っております。
    english: From now on, I want to share even more things with everyone from a closer
      distance.
  - start: '00:08.700'
    end: '00:13.500'
    original: ファンクラブ限定グッズが買えたり、チケットの先行申し込みができたり、
    english: You can buy fan club exclusive merch, apply for early ticket presales,
  - start: '00:13.500'
    end: '00:22.500'
    original: 会報誌、ラジオコンテンツなどなど、ファンクラブのために色々準備しているので、入会をお待ちしております！
    english: access newsletters, radio content, and more. We're preparing lots of
      things for the fan club, so I look forward to your enrollment!
  - start: '00:22.500'
    end: '00:27.500'
    original: 入会はこの配信終了後、21時からね。
    english: Enrollment opens after this stream ends, at 9 PM!
  - start: '00:28.000'
    end: '00:35.000'
    original: ファンクラブができたということは、次に何が来るか、お分かりですよね？
    english: And since a fan club has been launched, you know what comes next, right?
  - start: '00:35.000'
    end: '00:39.000'
    original: それでは、VTRどうぞー！
    english: Without further ado, please watch this VTR!
  - start: '00:43.800'
    end: '00:48.800'
    original: HOSHIMACHI SUISEI ARENA TOUR 2026 "Once Upon a Stellar"
    english: '[HOSHIMACHI SUISEI ARENA TOUR 2026 "Once Upon a Stellar"]'
  - start: '00:48.800'
    end: '00:58.500'
    original: 横浜 Kアリーナ横浜 / 神戸 GLION ARENA KOBE / 愛知 IGアリーナ / 福岡 マリンメッセ福岡A館
    english: '[Tour Venues: Yokohama, Kobe, Aichi, Fukuoka]'
  - start: '01:04.000'
    end: '01:10.500'
    original: 本日3月22日 21:00〜 ファンクラブ最速先行抽選受付開始
    english: '[Fan Club Presale Lottery Starts Today, March 22 at 21:00]'
  - start: '01:11.600'
    end: '01:19.500'
    original: なんと！星街すいせい アリーナツアー、またしても開催決定！ありがとうございます！ドドン！
    english: What a surprise! A Hoshimachi Suisei Arena Tour is officially happening
      once again! Thank you so much! Ta-da!
  - start: '01:21.000'
    end: '01:27.500'
    original: タイトルは「Once Upon a Stellar」！今回は4会場5公演でお届けします！
    english: The title is "Once Upon a Stellar"! This time, we will bring you 5 performances
      across 4 venues!
  - start: '01:28.000'
    end: '01:33.000'
    original: 9月8日、9月9日のKアリーナ横浜 2DAYSを皮切りに、
    english: Starting with two days at K-Arena Yokohama on September 8th and 9th,
  - start: '01:33.000'
    end: '01:37.000'
    original: 10月21日に GLION ARENA KOBE、
    english: October 21st at GLION ARENA KOBE,
  - start: '01:37.000'
    end: '01:41.000'
    original: 11月7日に名古屋 IGアリーナ、
    english: November 7th at IG Arena Nagoya,
  - start: '01:41.000'
    end: '01:45.000'
    original: そして11月12日にマリンメッセ福岡 A館！
    english: and November 12th at Marine Messe Fukuoka Hall A!
  - start: '01:45.000'
    end: '01:52.000'
    original: 星街すいせい初となる4都市アリーナツアー、ぜひ遊びに来てください！
    english: This will be Hoshimachi Suisei's very first 4-city arena tour, so please
      come see it!
  - start: '01:52.500'
    end: '01:58.500'
    original: お気づきの方もね、いると思うんですけれど、今回のライブキービジュアルも...
    english: As some of you might have noticed, the key visual for this live tour
      is...
  - start: '01:59.000'
    end: '02:01.800'
    original: '...カット！'
    english: '...Cut!'
  - start: '02:02.000'
    end: '02:12.000'
    original: お気づきの方もいるかもしれませんが、今回のライブキービジュアルは Mika Pikazo先生に描き下ろしていただきました！Mika先生本当にありがとうございます！
    english: Some of you may have noticed, but the key visual for this tour was illustrated
      by Mika Pikazo-sensei! Thank you so much, Mika-sensei!
  - start: '02:13.000'
    end: '02:18.000'
    original: 今回も本当に素敵なキービジュアルでね、ぜひたくさん見てください！
    english: It's such a wonderful key visual again, so please check it out a lot!
  - start: '02:18.000'
    end: '02:27.500'
    original: チケットはなんと、本日の配信終了後から早速ファンクラブ先行申し込みがスタートします！絶対絶対チェックしてくださいね！
    english: As for tickets, fan club presales will start right after today's stream
      ends! Be sure to check it out!
  - start: '02:28.500'
    end: '02:37.500'
    original: はい！次！実は、もう一つ騒がれていたあの大きなプロジェクトが動き出します。
    english: Alright! Next! Actually, that big project everyone's been talking about
      is starting to move forward.
  - start: '02:38.000'
    end: '02:40.000'
    original: それでは、VTRをどうぞ！
    english: Here is the VTR!
  - start: '03:02.000'
    end: '03:04.000'
    original: 再起動 Restart
    english: '[Restart]'
  - start: '03:04.200'
    end: '03:07.500'
    original: 切り裂く静寂 全速前進
    english: Cutting through silence, full speed forward,
  - start: '03:07.500'
    end: '03:10.800'
    original: 生み出す引力で 光速のパッセージ
    english: with generated gravity, a light-speed passage.
  - start: '03:10.800'
    end: '03:14.500'
    original: アレグロで今日も舞って
    english: Dancing today in allegro as well.
  - start: '03:15.500'
    end: '03:22.000'
    original: 消えない一拍を もっと紡いで
    english: Spinning more of this everlasting beat,
  - start: '03:22.000'
    end: '03:28.000'
    original: 打ち鳴らせ今日も万全で
    english: sound it loud, fully prepared today as well.
  - start: '03:35.500'
    end: '03:43.500'
    original: しばらく眠っていたあのプロジェクト、Midnight Grand Orchestraも活動を改めて本格化していきます！
    english: That project that was dormant for a while, Midnight Grand Orchestra,
      is resuming full-scale activities!
  - start: '03:44.000'
    end: '03:53.800'
    original: 'タイトルは「(2ND LIVE) PROJECT: ALLEGRO」。日程は2027年2月11日、場所は幕張メッセにてライブを行います！'
    english: 'The title is "(2ND LIVE) PROJECT: ALLEGRO". It will take place on February
      11, 2027, at Makuhari Messe!'
  - start: '03:54.000'
    end: '04:00.000'
    original: こちらも本日からファンクラブで先行申し込みができるので、ぜひぜひ遊びに来てください！
    english: Fan club presales for this also begin today, so please do come along!
  - start: '04:00.500'
    end: '04:13.500'
    original: リリースだったり、タイアップなど、すでに色々決まっているものもありますので、星街すいせい、そしてMidnight Grand Orchestraのこれからを楽しみに待っていてくれると嬉しいです！
    english: There are already various releases and tie-ins decided, so I hope you'll
      look forward to what's next for Hoshimachi Suisei and Midnight Grand Orchestra!
  - start: '04:14.500'
    end: '04:23.500'
    original: さて、すごい勢いで情報を出していきましたが、皆さんついて来れておりますでしょうか？
    english: Well, I've dumped a lot of information at a crazy pace, but were you
      all able to keep up?
  - start: '04:24.000'
    end: '04:34.500'
    original: 今日発表したことは全部ね、次の大きな目標に向けて、私が本当に頑張りたいと思って、たくさん悩んだ末に決断をしたことです。
    english: Everything announced today consists of decisions I made after much agonizing,
      all aimed at working really hard toward my next major goal.
  - start: '04:35.000'
    end: '04:44.000'
    original: 環境は少し変わるかもしれないんですが、星街すいせいはもちろんこれからもずっと私らしくあり続けます。
    english: My environment may change a bit, but Hoshimachi Suisei will naturally
      continue being true to myself forever.
  - start: '04:44.000'
    end: '04:50.000'
    original: これからもどうか一緒に夢を追いかけてくれると嬉しいです。よろしくお願いします！
    english: I'd be so happy if you keep chasing dreams together with me. Thank you
      for your support!
  - start: '04:52.500'
    end: '05:03.500'
    original: さて、それでは最後に、3つ...まだ3つもある！3つだけお知らせをして今日の配信を終わりたいと思います。
    english: Now then, lastly, 3 more... there are still 3 more! I'll make just 3
      quick announcements and wrap up today's stream.
