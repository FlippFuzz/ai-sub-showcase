  thoughts: |+
    **My Thoughts on the Announcements**

    Okay, here's what I'm thinking, going through this video...

    First, I know some of you might already be up to speed, but this is new! It starts with some fresh information I need to convey.

    I'm excited to announce that my past albums are getting analog record releases!

    If you're wondering what that means, it's those old records you know, like from movies or anime. The kind where you drop the needle, hear that classic sound. My first album, "Still Still Stellar" will be released on vinyl first!

    It goes on sale May 22nd. Reservations begin at various CD shops at 21:00 today, so check the description.

    The jacket will be HUGE, super photogenic. Even if you don't have a record player, get it as a collectible.

    Records, however, apparently take a long time to manufacture and supplies are limited, so get your pre-orders in early!

    Also, please look forward to further news about "Spector" as well.

    And now, there is extremely good news!

    Look at this! There's a Hoshimachi Suisei collaboration with Kanahei!

    Wow! Yay! I'm so happy! I can't believe I can collaborate with the incredible Kanahei-san. Thank you all!

    Kanahei-san drew a new illustration just for this collab! Thank you!

    My love for Kanahei's rabbit should be apparent on my streams and Twitter. I'm so thrilled!

    They've even drawn more illustrations. Merchandise is also in the works. More details will come later, so please look forward to it!

    And now for birthday & 6th anniversary goods! Yes, here's the line-up.

    This time, the merchandise is based on "Oshikatsu." Let's start with the full set, and see...

    It looks like this. The full set gets you everything. And, individually, here's the B2 tapestry.

    This is it, Suichan doing "oshikatsu."

    And random heart can badges. I'm sorry they're random! It's random! And the key visuals from previous anniversary goods have been turned into badges. I'm so happy.

    And next! An "Odekake Suichan" plushie! You wanted this, right? She's 150mm! So cute! Take her with you!

    And! A 2WAY ita-bag for Hoshiyomi!

    It looks familiar, right? This is similar to Sakura Miko's bag. You can make it match, with a clear front pocket for badges, so please use it!

    For full set buyers, a foil-stamped replica signed cheki-style bromide card. This is not limited and comes with everyone who buys the full set!

    Okay, so I just rattled off a bunch of announcements, but hopefully everyone is keeping up, right? You're keeping up? Good! War avoidance. War avoidance!

    And with that, amazingly...


