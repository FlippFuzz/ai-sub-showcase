    musical numbers, including cover songs, original hits, a special duet with guest
    Takagaki Kaede from The Idolmaster Cinderella Girls, and the premiere of her new
    hit single 'ビビデバ'. Throughout the stream, Suisei announces major projects and
    merchandise collaborations, including a game collaboration with Deresute, vinyl
    record releases, Zozotown apparel, and official anniversary goods.
