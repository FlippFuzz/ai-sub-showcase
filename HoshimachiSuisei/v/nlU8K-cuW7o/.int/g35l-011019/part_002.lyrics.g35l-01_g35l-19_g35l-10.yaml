  overall_summary: This video captures Hololive Virtual Idol Hoshimachi Suisei's surprise
    Halloween guerrilla street live performance titled 'Hoshimachi Suisei HALLOWEEN
    LIVE "ZOMBIE! ZOMBIE!! ZOMBIE!!!"' held at Shinjuku Kabukicho Cine City Square
    on October 24. Performing before a massive crowd of fans (Hoshiyomi) and passersby,
    Suisei delivers a dynamic 5-song set including 'TEMPLATE', 'BIBBIDIBA (Halloween
    Remix)', her newly released single 'Zombie Zombie Zombie', 'GHOST', and 'Soiree'.
    Interspersed with enthusiastic MC segments, audience call-and-responses, and event
    announcements, the stream concludes with premiere details for the new music video
    and a lively farewell.
