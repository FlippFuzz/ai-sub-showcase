global_summary:
  overall_summary: This video captures virtual idol Hoshimachi Suisei's surprise guerrilla
    street live performance titled 'Hoshimachi Suisei HALLOWEEN LIVE "ZOMBIE! ZOMBIE!!
    ZOMBIE!!!"', held on October 24, at Cine City Plaza in front of Tokyu Kabukicho
    Tower in Shinjuku, Tokyo. Wearing a special black Halloween-themed variation of
    her tour outfit, Suisei performs hit songs and new releases including 'BIBBIDIBA
    (Halloween Remix)', 'GUM&DROP', her brand-new single 'ゾンビゾンビゾンビ' (produced by
    natori), 'テンプレート', and '大脱走'. Between performances, she interacts with the excited
    crowd of fans ('Hoshiyomi') and casual passersby, promotes her upcoming music
    video premieres, and celebrates the Halloween season.
