  original: 決めた孤独すこしずつに響き渡って あなたの足跡へと帰っていきたい
  english: Resonating little by little with the chosen solitude, I want to return
    to your footsteps.
- start: '00:41.950'
  end: '00:45.910'
  original: 止まった止まった聞かせてください
  english: Please stop, stop, and let me hear it.
- start: '00:49.830'
  end: '00:57.190'
  original: 消え去った街ように見かされてずっと縛り付けられている この上
  english: Being stared at like a vanished town, I've been bound here all this time,
    up above this place...
- start: '00:59.950'
  end: '01:07.410'
  original: 誰かがしたって焦った街のベッドを漂っていく
  english: Drifting through the bed of a town where someone hurried and panicked.
- start: '01:08.270'
  end: '01:17.510'
  original: きっと誰もただ一人で口を突く見ながら泣きながら鳴いてるんだ
  english: Surely everyone is crying and weeping all alone, muttering to themselves.
- start: '01:18.230'
  end: '01:25.870'
  original: ねえ今夜愛してる大嫌い大好きたぶん想うくらいの想いが溢れる
  english: Hey, tonight, I love you, I hate you, I adore you—probably enough feelings
    to overwhelm my thoughts.
- start: '01:27.410'
  end: '01:32.410'
  original: 強制して去っていくこの感情は
  english: This emotion that forces its way out and leaves...
- start: '01:32.730'
  end: '01:42.110'
  original: 音の中で初めて光り合うんだね 歌の中で初めて響き鳴すんだ
  english: We finally shine together within the sound, and resonate for the first
    time within a song.
- start: '01:46.330'
  end: '01:54.510'
  original: 責めぎったダイヤモンド 並んだ表情に臆病になっていたこの上
  english: Pushing and pulling diamonds, becoming cowardly before the lined-up expressions,
    up above this place...
- start: '01:55.330'
  end: '02:05.110'
  original: 叶わない暴力と血潮まれの重力に名前も居場所も埋め付けられている
  english: My name and place are buried under unrelenting violence and blood-soaked
    gravity.
- start: '02:05.950'
  end: '02:11.610'
  original: なんてどこかで吐きたい言い訳が声を奪ったまま
  english: Excuses I wanted to vent somewhere end up robbing me of my voice...
- start: '02:12.330'
  end: '02:16.270'
  original: 遠いみたいになってるんだ今さら
  english: It feels so far away now, after all this time.
- start: '02:17.410'
  end: '02:24.470'
  original: 笑えない風体を信じてそっと月夜になるくらいの想いがうずまく
  english: Believing in a countenance that cannot smile, feelings as deep as a moonlit
    night swirl softly within.
- start: '02:26.550'
  end: '02:33.270'
  original: 今日も街は去っていく猛り足が飛び上がる準備をしている
  english: Today too, the town moves on, and ferocious feet prepare to leap into the
    air.
- start: '02:37.810'
  end: '02:45.310'
  original: 何もかも半端で起こして沈んでいく
  english: Leaving everything half-done, waking up and sinking down.
- start: '02:56.270'
  end: '03:01.270'
  original: 頭まっかっか
  english: My head is burning red.
- start: '03:07.110'
  end: '03:11.950'
  original: 信じたい信じたいそうだよそうだよ
  english: I want to believe, I want to believe—that's right, that's right.
- start: '03:12.070'
  end: '03:18.410'
  original: 嫌いじゃない好きじゃない全部が一つになりたい離れたい
  english: I don't hate it, I don't love it; I want everything to become one, yet
    I want to pull away.
- start: '03:18.890'
  end: '03:25.550'
  original: どうしたいどうしての聞かされない聞かせて
  english: What do I want? Why is that? I can't hear it—let me hear it.
- start: '03:26.710'
  end: '03:32.410'
  original: 伝えたい愛してる大嫌い大好き
  english: 'I want to convey it: I love you, I hate you, I adore you—'
- start: '03:32.890'
  end: '03:40.110'
  original: たぶん想うくらいの想いのサイズまで今日もまた大好きなこの感情が
  english: Until it reaches the size of feelings I can barely hold, today once again,
    this beloved emotion...
- start: '03:40.910'
  end: '03:49.110'
  original: 音の中で初めて光り合うまで あなたのその骨で響き出すまで
  english: '...shines together within the sound for the very first time, echoing right
    down to your bones.'
- start: '03:58.670'
  end: '04:08.510'
  original: 愛してる大嫌い大好き嘘だよ大好き
  english: I love you, I hate you, I adore you—just kidding, I love you so much!
- start: '04:36.810'
  end: '04:40.090'
  original: 蹴りな！
  english: Kick it!
- start: '04:40.430'
  end: '04:43.790'
  original: 盛り上がってますね！
  english: You guys are getting so hyped!
- start: '04:44.330'
  end: '04:49.950'
  original: 'ということで星街すいせいライブ『SuperNova: REBOOT』、いよいよ始まりましたー！'
  english: 'With that, Hoshimachi Suisei Live "SuperNova: REBOOT" has officially begun!'
- start: '04:54.670'
  end: '04:58.310'
  original: 皆さんびっくりしたんじゃないですか？冒頭ね？
  english: I bet you guys were surprised by the opening, right?
detected_performances:
- title: 夜に咲く
  artist: 星街すいせい
  start: 00:00
  end: 04:36
