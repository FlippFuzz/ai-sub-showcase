    reference_lyrics_en: |-
      just like the shooting star i have become stellar stellar
      i’m sure that you’ve already seen through it all
      this script hidden deep down in my heart
      that i will now read out, acting the part
      a clichéd monologue
      there are so many things i could not say out loud
      so many walls i could never climb beyond
      sensing the scent of morning wafting in the air
