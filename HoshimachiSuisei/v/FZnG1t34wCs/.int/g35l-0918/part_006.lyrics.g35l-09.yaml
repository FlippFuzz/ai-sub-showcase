      i sat in a corner and cried into my knees, trembling all the while
      i don’t need the sunshine, don’t want it in my life
      can dawn please stay away?
      hold your hand out all the way
      reach out and make someone feel
      we’re very alike, indeed, both you and me
      you’re not special, neither am i, no, not at all
      so i sing now through this night so stellar stellar
      shining as bright as any eye can take
      the music will never, ever be stopped tonight
      so i say, what i wanted to be
      was never a cinderella who waits forever
      but the prince who goes and gets things done
      just like the shooting star i have become

      such a common story
      just a scene lying dormant in a notebook i’ve been scribbling my ideals in
      that star must be crying too
      i pray that tomorrow won’t come
      hold your hand out all the way
      reach out and make someone feel
      the truly important things in life seem to be invisible to the naked eye
      so i sing now through this night so stellar stellar
      don’t think of things as they are
      the music surely, surely won’t stop tonight
      so i say, what i wanted to be
      was not a delicate heroine
      but a hero on his way to save her
      a dreamy fairytale

      so i sing now through this night so stellar stellar
      shining as bright as any eye can take
      the music will never, ever be stopped tonight
      so i sing now through my love so stellar stellar
      in the midst of this world, the universe
      the music won’t stop tonight
      so i say, what i wanted to be
      was never a cinderella who waits forever
      but the prince who goes and gets things done
      just like the shooting star i have become
      that’s right, i’m a star
      stellar stellar
