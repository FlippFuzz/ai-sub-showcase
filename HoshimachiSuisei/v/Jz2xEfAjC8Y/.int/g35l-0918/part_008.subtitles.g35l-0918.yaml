total_attempts: 1
video_duration_ms: 300375
subtitles_prompt_version: 18
responses:
- subtitles:
  - start: '00:04.997'
    end: '00:11.237'
    original: 改めて、配信記念生配信を見てくれて本当にありがとうございます。
    english: Thank you so much for watching the live stream celebrating our 5th anniversary
      today.
  - start: '00:12.197'
    end: '00:18.177'
    original: 今日は、私星街すいせいから、皆さんに重大な発表があります。
    english: Today, I, Hoshimachi Suisei, have a major announcement for you all.
  - start: '00:19.867'
    end: '00:27.427'
    original: これまで長年、カバーさん、そしてホロライブプロダクションには本当にお世話になってきました。
    english: I've been truly indebted to Cover Corp and Hololive Production for many
      years.
  - start: '00:27.837'
    end: '00:37.497'
    original: 長年の夢だった日本武道館などたくさんの支えのおかげで、夢を一つ一つ叶えていくことができました。
    english: With the incredible support of the Nippon Budokan and so many others,
      I've been able to achieve my dreams one by one.
  - start: '00:38.217'
    end: '00:54.107'
    original: 感謝の気持ちを伝えられる機会がこれまであまりなかったのですが、たにかおさんをはじめ、ホロライブのタレントのみんな、スタッフの皆さん、関係してくださった皆さんに心から感謝をしています。ありがとうございます。
    english: I don't often get the chance to express my gratitude, but from the bottom
      of my heart, thank you so much to everyone—Taniago-san, all the Hololive talent,
      and the staff who made this possible.
  - start: '00:55.337'
    end: '01:04.597'
    original: その上で、東京ドームという次の目標に到達するためには、これからどうすればいいのかを考えてきました。
    english: To reach my next goal of the Tokyo Dome, I've been thinking about what
      I need to do moving forward.
  - start: '01:05.417'
    end: '01:15.357'
    original: 昔に比べると、たくさんの方に見ていただけるようになりましたが、それでもまだまだ越えなければいけない壁がたくさんあります。
    english: Compared to the past, I'm able to reach so many more people, but I still
      have many walls to climb.
  - start: '01:16.897'
    end: '01:25.137'
    original: いろんなものと真剣に向き合い、そして考え抜いた結果、一つの大きな決断を下しました。
    english: After facing many things earnestly and thinking deeply, I've made a major
      decision.
  - start: '01:26.547'
    end: '01:31.977'
    original: びっくりさせてしまうかもしれませんが、その発表を今日、この場でさせてください。
    english: I will be making that announcement right here, right now.
  - start: '01:58.828'
    end: '02:05.658'
    original: ということで、この度、星街すいせいは個人事務所を設立することになりました！
    english: And so, this time, Hoshimachi Suisei is establishing a personal office!
  - start: '02:06.338'
    end: '02:09.918'
    original: 名称は「STUDIO STELLAR」。
    english: Its name is "STUDIO STELLAR."
  - start: '02:10.058'
    end: '02:23.758'
    original: 今後の私個人の活動、日々の配信、音楽活動、メディア出演、タイアップ、グッズ展開などなど、すべてこの「STUDIO STELLAR」を拠点に行っていくことになります。
    english: My future activities, daily streams, musical endeavors, media appearances,
      tie-ups, merchandise rollouts, and more will all be based out of this STUDIO
      STELLAR.
  - start: '02:25.268'
    end: '02:34.938'
    original: と、こんな真面目なトーンで話すと「えっ、すいちゃん、ホロライブ卒業！？」なんてね、おもっちゃう人もいるんじゃないでしょうか？安心してください！
    english: If you're talking in such a serious tone and thinking, "Suichan, did
      you graduate from Hololive?!" please rest assured!
  - start: '02:36.198'
    end: '02:44.208'
    original: ホロライブプロダクションとしての星街すいせいの活動も、これまで通り継続していきます。
    english: Hoshimachi Suisei's activities as a Hololive Production talent will continue
      just as before.
  - start: '02:44.478'
    end: '02:55.518'
    original: ホロライブの大好きなみんなとの活動は引き続き思い切り楽しみつつ、個人としてのさらなる高みを目指す場所が「STUDIO STELLAR」という住み分けです。
    english: I will continue to wholeheartedly enjoy my activities with my beloved
      Hololive port, while STUDIO STELLAR will be the place where I aim for even greater
      heights as an individual.
  - start: '02:56.098'
    end: '03:04.918'
    original: もっともっと大きなステージに立つための前向きで大きな決断なので、ぜひこれからも応援してもらえるとすごく、すごく嬉しいです！
    english: It's a forward-looking, major decision to stand on an even bigger stage,
      so I'd be so, so happy if you continue to support me from now on!
  - start: '03:07.728'
    end: '03:24.788'
    original: ちなみに、事務所の公式SNSもできましたので、今すぐフォローしてください！IDは@st_stellar_infoです。
    english: By the way, the office's official social media is now up, so please follow
      it right away! The ID is @st_stellar_info.
  - start: '03:25.568'
    end: '03:36.578'
    original: この個人事務所設立をキッカケに、星街すいせいを構成するあらゆるクリエイティブをリニューアルしていきます。どんどん発表していきますよ！準備はいいですか？
    english: Triggered by the establishment of this personal office, I will be renewing
      everything that makes up Hoshimachi Suisei creatively. I'll be announcing more
      soon, so is everyone ready?
  - start: '03:38.258'
    end: '03:45.378'
    original: それでは、1つ目、長年愛してきた星街すいせいのロゴをリニューアルさせていただきました！こちら！
    english: First, the logo for Hoshimachi Suisei, whom you've loved for so many
      years, has been renewed. Here it is!
  - start: '03:48.568'
    end: '04:12.188'
    original: これまでの歴史とトーンはしっかり踏襲しつつ、今の時代に、そして今の私に一番フィットする形にデザインし直しました。さらに、ずっと欲しかった私のシンボルマークもなんと新しく誕生しましたよ！こちら。いかがですか？可愛いね、王冠マークになっております。
    english: It's been redesigned to carry on my history and tone while fitting the
      current era and who I am today. And my symbol mark, which I've always wanted,
      has finally been born too! Here it is. Isn't it a cute crown mark?
  - start: '04:13.128'
    end: '04:16.828'
    original: お次はアーティスト写真です。どうぞ！
    english: Next is the artist photo. Go ahead!
  - start: '04:18.848'
    end: '04:28.988'
    original: はい、今回は夜の海で撮影してもらいました。これからの果てしない旅を感じさせるお気に入りの1枚になっております。
    english: Yes, this time it was shot at night by the sea. It has become one of
      my favorite photos, giving a sense of endless travel.
  - start: '04:30.348'
    end: '04:46.548'
    original: まだまだありますよ！実は、これまでずっとなかったすいちゃんの公式ウェブサイトがとうとうオープンします！最新情報だったり随時アップデートしていくので、毎日チェックしてくださいね。
    english: There's still more! Actually, Suichan's official website has finally
      opened! It will be updated with the latest information, so be sure to check
      it daily, okay?
  - start: '04:47.478'
    end: '05:00.000'
    original: そしてそして、皆さんきっと待ち望んであろう、公式ファンクラブも設立が決定しました！名前は「星詠み」。
    english: And finally, everyone, the official fan club you've all been waiting
      for has been decided! Its name is "Hoshiyomi."
  thoughts: null
