- start: '02:43.500'
  end: '02:57.500'
  original: ここからは、いのたくさんにも入ってもらって、さらなる特別編成で何曲か続けてお届けしていきますよ。いのたくさん、準備はいいですか？
  english: From here on, Taku-san will also join us, and we'll deliver a few more
