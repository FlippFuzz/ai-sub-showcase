  english: Tell me about the endless seeds of worry, let me hear your stories
- start: '00:53.000'
  end: '00:58.000'
  original: 私とあなただけの世界で
  english: In a world belonging only to you and me
- start: '00:58.000'
  end: '01:04.500'
  original: あの糸線になって 街をハイジャックしようぜ
  english: Let's become that thread and hijack the city
- start: '01:05.000'
  end: '01:11.000'
