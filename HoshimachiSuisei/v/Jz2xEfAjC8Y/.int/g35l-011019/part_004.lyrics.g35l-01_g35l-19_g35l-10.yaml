- start: '01:31.000'
  end: '01:36.000'
  original: 街灯りを待って 月で待ち合わせ
  english: Waiting by the streetlights, meeting under the moon
- start: '01:36.000'
  end: '01:43.000'
  original: 届きそうで届かない あなたはムーンライト
