  original: 古くなってく記憶を越えて 眠りはいらない
  english: Crossing memories that grow old, I don't need sleep
- start: '00:26.500'
  end: '00:30.400'
  original: 暇潰しなんだから やんちゃで行こう
  english: Since it's just to pass the time, let's go wild
- start: '00:30.500'
  end: '00:36.000'
  original: 不幸事すらも笑ってやんちゃで行こう まだやる事ばっかで忙しいけど
  english: Laughing off even misfortunes and going wild, even though I'm still busy
