  english: Holding only you, on a night when sleep feels so close yet out of reach
- start: '01:21.000'
  end: '01:25.000'
  original: 私と踊ってよ ムーンライト こっちで遊ぼうよ
  english: Dance with me in the moonlight, come play over here
- start: '01:25.500'
  end: '01:30.500'
