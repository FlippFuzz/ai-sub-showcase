- start: '00:36.000'
  end: '00:41.500'
  original: 休もうか あの日の光の方へ どこか遠い方へ
  english: Shall we rest, toward the light of that day, somewhere far away?
- start: '00:42.000'
  end: '00:47.000'
  original: このメロンな今日もずっと歩いていこう
  english: Let's keep walking through this melon-like today forever
- start: '00:47.500'
  end: '00:52.500'
