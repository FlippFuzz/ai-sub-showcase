  original: ずっとさ 凍てついた狭間の匂いか どうしようもなく苦しくて
  english: All this time... The scent of the frozen interstice was unbearably painful,
- start: '03:20.303'
  end: '03:29.153'
  original: 部屋の隅で膝を抱えて 震えていた
  english: And I sat in the corner of the room hugging my knees, trembling.
- start: '03:29.403'
  end: '03:38.503'
  original: 太陽なんていらないから 負けないでいて その手を伸ばして
  english: I don't need a sun, so don't give in. Extend your hand
- start: '03:38.653'
  end: '03:42.503'
  original: 誰かに届くように
  english: So it reaches someone...
- start: '03:49.803'
  end: '03:55.503'
  original: ぼくだってきみと同じ 特別なんかじゃないから
  english: Even I am not someone special, just like you.
- start: '04:03.503'
  end: '04:09.503'
  original: そうさぼくは夜を統べる Stellar Stellar
  english: That's right, I rule the night, Stellar Stellar.
- start: '04:09.653'
  end: '04:15.503'
  original: あいだぎけの輝きで 夜空の音楽はずっと鳴りやまない
  english: With that transient radiance, the music of the night sky never stops playing.
- start: '04:16.803'
  end: '04:24.503'
  original: そうさぼくはずっと泣いたかったのさ もうって死んでねらじゃないさ
  english: That's right, I had always wanted to cry—not just dying away,
- start: '04:24.653'
  end: '04:28.503'
  original: 向かい行くおじさんまだ
  english: But facing forward, going to meet them still...
- start: '04:31.000'
  end: '04:37.500'
  original: だってぼくは星だから
  english: Because I am a star...
- start: '04:46.500'
  end: '04:51.500'
  original: なんてありふれた話なんだ リソウだけが掻きむねっていた
  english: What a commonplace story. Only ideals were scratching at my chest,
- start: '04:51.650'
  end: '04:57.500'
  original: ノートの隅に眠る本能の ワンシーンだ
  english: Instincts sleeping in the corner of a notebook, a single scene.
- start: '04:58.000'
  end: '05:02.500'
  original: きっとあの星も泣いてるんだ あしたな
  english: Surely that star is crying too, tomorrow...
