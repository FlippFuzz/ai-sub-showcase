global_summary:
  overall_summary: This YouTube livestream from Hoshimachi Suisei's official channel
    celebrates her 8th anniversary with a full acoustic live concert and major announcements.
    Accompanied by live band musicians and special guest Taku Inoue, Suisei performs
    an intimate acoustic setlist featuring hits like 'Mou Dou Nattemo Ii Ya', 'BIBBIDIBA',
    'Tsuki ni Mukatte Ute', 'Kireigoto', 'Moonlight', 'Yoru o Matsu yo', 'Stellar
    Stellar', and 'Soirée'. Following the musical performances, Suisei delivers monumental
    career announcements, including the establishment of her personal agency 'Studio
    STELLAR', her upcoming 2026 4-city arena tour 'Once Upon a Stellar', the Midnight
    Grand Orchestra 2nd live 'Project Allegro' in 2027, her official fan club 'Hoshiyomi',
    and her new single 'Prima Donna'.
