- start: '02:14.480'
  end: '02:26.580'
  original: さあ、みんなね、武道館ライブで出したあの重大発表のティザー、あの内容が気に気になっている頃なのではないでしょうか？
  english: Now, everyone, you must be wondering about the teaser for that major announcement
    we made at the Budokan live, right?
- start: '02:27.420'
  end: '02:49.880'
  original: それからみんな、もちろん見つけてくれましたよね？先週の月曜日から、ある場所で屋外広告も出ていたりして、きっと今頃何が起きるんだって、ただならぬ空気を皆さん感じてドキドキしているんじゃないかなと思うんですけれど、
  english: And of course, everyone found it, right? Starting last Monday, outdoor
    advertisements were put up in certain places, and I'm sure you're all feeling
    the unusual tension and getting excited wondering what's about to happen,
- start: '02:52.320'
  end: '03:06.000'
  original: まずはね、えー言葉じゃなくて今日の告知に向けて、音楽に込めてみんなに伝えたいなと思い、こういう編成で今回やらせてもらっております。
  english: but first, uh, rather than with words, to lead up to today's announcement,
    I wanted to convey my feelings through music to everyone, which is why we are
    performing with this arrangement today.
- start: '03:07.560'
  end: '03:30.400'
  original: アコースティックってさ、なんかエモくて今までのことをこう思い出させるような、なんかノスタルジックな気持ちになったりしますよね？
  english: Acoustic music has this emotional feel to it, making you reminisce about
    the past and feel sort of nostalgic, doesn't it?
- start: '03:30.700'
  end: '03:59.100'
  original: いつとはテンションを上げてくれるようなあの曲が、今日はね、また違った形でみんなに響いたらいいなと思って歌わせていただいております。曲のアレンジもそうだし、この生配信自体もそうだし、新しい一面を見せながらも、何よりこの8年間みんなでね、一緒にやってきた、紡いできた絆みたいなものがしっかり感じられるライブにできたら嬉しいです。
  english: I'm singing hoping that song that usually raises your tension will resonate
    with everyone in a different way today. The song arrangements are like this, this
    live stream itself is like this, and while showing a new side of me, above all,
    I'd be happy if we could make this a live concert where you can truly feel the
    bonds we've spun and built together over these past 8 years.
- start: '03:59.200'
  end: '04:00.600'
  original: それでは、次の曲にいきましょう。
  english: Well then, let's move on to the next song.
- start: '04:00.600'
  end: '04:01.300'
  original: ムーンライト。
  english: Moonlight.
- start: '04:08.760'
  end: '04:16.100'
  original: 遠くまで歩こうよ裸足で小さな幸せを見つけて閉まった月が窓の追記
  english: Let's walk far away barefoot, finding little happiness, the locked moon
    added to the window...
- start: '04:16.500'
  end: '04:22.000'
  original: 頭どうしなんだよね案外分かり合えない部分も案外
  english: We're head-to-head, aren't we? Even the parts we can't quite understand
    each other...
- start: '04:22.500'
  end: '04:29.200'
  original: 月明かりをめくった残像誰かにとっての普通をしよう
  english: The afterimage of turning page by page in the moonlight, let's act normal
    for someone's sake...
- start: '04:29.800'
  end: '04:36.500'
  original: 私と踊ってよムーンライトねえこっちで遊ぼうさいざ隠しごとばっかのいざ
  english: Dance with me, moonlight, hey let's play over here, come on, it's all about
    secrets...
- start: '04:36.900'
  end: '04:40.300'
  original: ねこっちで遊ぼうよみんな
  english: Hey let's play over here, everyone...
- start: '04:40.800'
  end: '04:45.000'
  original: もったいカーテンを開けて嘘みたいな夜を抜け出すんだ
  english: Opening the wasteful curtain, slipping out into a night that feels like
    a lie...
- start: '04:45.300'
  end: '04:50.500'
  original: まだやる事ばっかで忙しいけどやすみ
  english: We're still busy with just things to do, but let's rest...
- start: '04:50.800'
  end: '04:59.800'
  original: あの糸線になって街をハイジャックしようぜこのメロンな今日をずっと
  english: Let's hijack the town into that single thread, continuing this melon-like
    today forever...
