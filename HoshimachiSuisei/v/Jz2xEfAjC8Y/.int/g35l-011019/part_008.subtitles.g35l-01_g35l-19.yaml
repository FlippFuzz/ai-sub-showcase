    original: 改めて、8周年記念生配信を見てくれて本当にありがとうございます。
    english: First of all, thank you so much for watching the 8th anniversary commemorative
      livestream.
  - start: '00:12.130'
    end: '00:18.250'
    original: 今日は私、星街すいせいから皆さんに重大な発表があります。
    english: Today, I, Hoshimachi Suisei, have a major announcement to make to everyone.
  - start: '00:19.890'
    end: '00:27.130'
    original: これまで長年、カバーさん、そしてホロライブプロダクションには本当にお世話になってきました。
    english: For many years now, I've been truly indebted to Cover Corp and Hololive
      Production.
  - start: '00:27.790'
    end: '00:37.310'
    original: 長年の夢だった日本武道館などたくさんの支えのおかげで、夢をひとつひとつ叶えていくことができました。
    english: Thanks to a lot of support, including my long-held dream of performing
      at the Nippon Budokan, I've been able to make my dreams come true one by one.
  - start: '00:38.250'
    end: '00:53.690'
    original: 感謝の気持ちを伝えられる機会がこれまであまりなかったので、たねごうさんをはじめ、ホロライブのタレントのみんな、スタッフの皆さん、関係してくださった皆さんに心から感謝をしています。ありがとうございます。
    english: I haven't had many opportunities to express my gratitude until now, so
      from the bottom of my heart, I want to thank Tanigou-san, all the Hololive talents,
      the staff, and everyone involved. Thank you very much.
  - start: '00:55.330'
    end: '01:04.430'
    original: その上で、東京ドームという次の目標に到達するためには、これからどうすればいいのかを考えてきました。
    english: On top of that, in order to reach our next goal of the Tokyo Dome, I've
      been thinking about what I should do from now on.
  - start: '01:05.190'
    end: '01:15.110'
    original: 昔に比べるとたくさんの方に見ていただけるようになりましたが、それでもまだまだ越えなければいけない壁がたくさんあります。
    english: Compared to the past, many more people are able to watch me, but still,
      there are many walls I have to overcome.
  - start: '01:16.290'
    end: '01:31.790'
    original: いろんなものと真摯に向き合い、そして考え抜いた結果、ひとつの大きな決断を下しました。びっくりさせちゃうかもしれませんが、その発表を今日、この場でさせてください。
    english: After earnestly facing various things and thinking it through, I made
      one big decision. It might surprise you, but please let me make that announcement
      here today.
  - start: '01:49.200'
    end: '01:55.000'
    original: '[Text: 星街すいせい 個人事務所設立]'
    english: '[Text: Hoshimachi Suisei Establishing Personal Agency]'
  - start: '01:58.730'
    end: '02:06.330'
    original: ということで、この度、星街すいせいは個人事務所を設立することになりました。
    english: And with that, Hoshimachi Suisei will be establishing a personal agency!
  - start: '02:06.670'
    end: '02:24.030'
    original: 名称は「スタジオステラ」。今後の私個人の活動、日々の配信、音楽活動、メディア出演、タイアップ、グッズ展開などなど、全てこの「スタジオステラ」を拠点に行っていくことになります。
    english: The name is 'Studio STELLAR'. From now on, my personal activities, daily
      streams, music activities, media appearances, tie-ups, merchandise rollouts,
      and everything else will be based out of this 'Studio STELLAR'.
  - start: '02:24.890'
    end: '02:35.310'
    original: と、こんな真面目なトーンで話すと、「すいちゃん、ホロライブ卒業！？」なんてね、思っちゃう人もいるんではないでしょうか。
    english: And if I talk in such a serious tone, some of you might be thinking,
      'Suisan, are you graduating from Hololive!?' or something.
  - start: '02:35.430'
    end: '02:44.250'
    original: 安心してください！ホロライブプロダクションとしての星街すいせいの活動もこれまで通り継続していきます。
    english: Rest assured! Hoshimachi Suisei's activities as part of Hololive Production
      will continue just as before.
  - start: '02:44.250'
    end: '02:55.330'
    original: ホロライブの大好きなみんなとの活動は引き続き思い切り楽しみつつ、個人としてのさらなる高みを目指す場所が「スタジオステラ」という棲み分けです。
    english: While continuing to thoroughly enjoy my activities with everyone I love
      in Hololive, 'Studio STELLAR' is the separation of space where I aim for even
      greater heights as an individual.
  - start: '02:55.770'
    end: '03:04.790'
    original: もっともっと大きなステージに立つための前向きで大きな決断なので、ぜひこれからも応援してもらえるとすごく、すごく嬉しいです。
    english: It's a positive and major decision in order to stand on an even bigger
      stage, so I'd be super, super happy if you could continue to cheer me on.
  - start: '03:07.390'
    end: '03:24.630'
    original: ちなみに事務所の公式SNSもできましたので、今すぐフォローしてください！IDは @st_stellar_info です。
    english: By the way, the agency's official SNS has also been created, so please
      follow it right now! The ID is @st_stellar_info.
  - start: '03:25.430'
    end: '03:37.490'
    original: この個人事務所設立をきかっけに、星街すいせいを構成するあらゆるクリエイティブをリニューアルしていきます。どんどん発表していきますよ。準備はいいですか？
    english: Taking the establishment of this personal agency as an opportunity, I
      will be renewing all the creatives that make up Hoshimachi Suisei. I'll be announcing
      them one after another. Are you ready?
  - start: '03:38.070'
    end: '03:45.330'
    original: それでは1つ目、長年愛してきた星街すいせいのロゴをリニューアルさせていただきました！こちら！
    english: 'So, number one: I''ve had Hoshimachi Suisei''s logo, which I''ve loved
      for many years, renewed! Here it is!'
  - start: '03:46.200'
    end: '04:11.830'
    original: これまでのね、歴史とトーンはしっかりと踏襲しつつ、今の時代に、そして今の私に一番フィットする形にデザインし直ししました。さらに、ずっと欲しかった私のシンボルマークもなんと新しく誕生しましたよ。こちら！いかがですか？可愛いね、王冠マークになっております。
    english: While carefully inheriting the history and tone up to now, I redesigned
      it into a shape that best fits the current era and current me. Furthermore,
      my symbol mark that I've always wanted was also newly born! Here it is! What
      do you think? It's cute, right? It's a crown mark.
  - start: '04:12.750'
    end: '04:16.890'
    original: お次はアーティスト写真です。どうぞ！
    english: Next is the artist photo. Here you go!
  - start: '04:18.450'
    end: '04:30.270'
    original: はい、今回は夜の海で撮影してもらいこれからの果てしない旅を感じさせるお気に入りの1枚になっております。
    english: Yes, this time we had it shot at night by the sea, making it one of my
      favorites that makes you feel the endless journey ahead.
  - start: '04:30.330'
    end: '04:34.930'
    original: まだまだありますよ。実はこれまでずっとなかったすいちゃんの公式ウェブサイトが！ついにオープンします！
    english: There's still more. Actually, Suichan's official website, which hasn't
      existed until now, is finally opening!
  - start: '04:37.330'
    end: '04:47.010'
    original: 最新情報だったり随時アップデートしていくので、毎日チェックしてくださいね。
    english: Since latest information and such will be updated at any time, please
      check it every day.
  - start: '04:47.550'
    end: '05:00.375'
    original: そしてそして、皆さんきっと待望であろう公式ファンクラブも設立が決定しました！名前は「星詠み」。みんなのね、名前...
    english: And last but not least, the official fan club, which I'm sure you've
