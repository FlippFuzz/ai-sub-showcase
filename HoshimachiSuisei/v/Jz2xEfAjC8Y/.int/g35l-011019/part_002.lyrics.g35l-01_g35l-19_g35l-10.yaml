  english: Hello, if life is only ten minutes long, then upon this landing after walking
    seven steps...
- start: '01:43.059'
  end: '01:48.339'
  original: 胸躍るようなアートリアクションでタッチだんだん
  english: With a heart-pounding art reaction, touch it step by step...
- start: '01:48.339'
  end: '01:59.459'
  original: 臆病をも好きに燃やして行けスナイパー まだ見るワールドは君次第 夢も連れ立って機能上
  english: Burn your cowardice however you like, sniper! The world we've yet to see
    depends on you. Taking our dreams along functionally...
- start: '01:59.459'
  end: '02:06.659'
  original: 吸い込んで一息吐いてないパーセント 甘く見てないで
  english: Inhale and let out a breath—no percent! Don't underestimate me.
- start: '02:06.659'
  end: '02:15.539'
  original: 本当はどうしたいんだっけ
  english: What was it I really wanted to do again?
- start: '02:16.819'
  end: '02:22.139'
  original: 証明しよう届くように
  english: Let's prove it so it reaches you...
- start: '02:23.519'
  end: '02:33.399'
  original: 情熱は月に向かって撃てスナイパー 未来を今日も僕らしたい だから笑ってよ
  english: Shoot your passion at the moon, sniper! Today too, we want our future to
    be ours. So please, smile!
- start: '02:33.399'
  end: '02:44.479'
  original: 擦り剥き埋めるのナイト＆デイパーセント 小指にはショットガン 本当はどうしたいんだっけ
  english: Patching up the scrapes night and day... percent? A shotgun on my pinky
    finger... What was it I really wanted to do again?
- start: '02:45.059'
  end: '02:54.679'
  original: ああ アリスタニアズーア 自分の足で踏み刻もう
  english: Ah, Aristani Azur... Let's carve it out with our own feet!
- start: '02:54.679'
  end: '03:07.419'
  original: ああ アリスタニアズーア あなただけに踏み刻もう
  english: Ah, Aristani Azur... Let's carve it out for you alone!
- start: '03:24.000'
  end: '03:27.000'
  original: '[Title: 綺麗事]'
  english: '[Title: Kireigoto]'
- start: '03:24.279'
  end: '03:32.479'
  original: 綺麗ごと吐くその口が 君のこと苦しめるから
  english: Because that mouth speaking pious platitudes is only torturing you...
- start: '03:39.999'
  end: '03:53.479'
  original: 同じことばかりの日々にさ 君を求めて寄り添い合うの 締めきり合うからフィルターを通して
  english: In these repetitive days, we seek each other out and snuggle close. Looking
    through a filter as we lock deadlines together...
- start: '03:55.239'
  end: '04:09.399'
  original: 散々占ったこうかつのさかいま 自分なりの生き方なのに 偏屈な思考に縛られたまま
  english: At the boundaries of fortune-telling we relied on so much... Even though
    it's my own way of living, bound by stubborn thoughts...
- start: '04:10.999'
  end: '04:27.079'
  original: 尖るガラスに唇を噛む 分かってない ああ 存分をしてみてばっかり
  english: Biting my lip on jagged glass. You don't understand... Ah, doing it to
    your heart's content over and over.
- start: '04:27.879'
  end: '04:42.599'
  original: 綺麗ごと吐くその口が 嫌いだから痛みを歌うの 気絶しているその顔が僕のこと曇らせる
  english: Because I hate that mouth speaking platitudes, I sing of pain. That fainting
    face of yours clouds my mind.
- start: '04:43.719'
  end: '05:02.337'
  original: こんな声だって 伝わらなくて もっと完璧な言葉を紡ぎたくて ずっと欲張って今日も泥げぼを汁 不完全
  english: Even a voice like this doesn't get across. I want to weave more perfect
    words, always greedy, vomiting mud again today... Imperfect.
