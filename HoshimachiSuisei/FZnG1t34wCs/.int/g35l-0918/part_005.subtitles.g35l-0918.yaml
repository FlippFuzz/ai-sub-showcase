    **A Deep Dive into My 3D Live Stream: Hoshimachi Suisei's Reflections**

    Okay, so here's the rundown of how things went in that 3D live stream... It all starts with the usual greetings: "Ah, hello everyone!" I'm always curious to get the read from my audience, so I ask, "Um, how, how is it?" Man, the nerves hit *hard* beforehand. "How is it? Man, I was so nervous!" I just needed the affirmation, "how was it?" Seeing the reactions, "It's cool, and a cute badge. Ah, badge badge, thank you! Portori, thank you! Ah, superchat too, thank you! Big, ah, yes, big chhh-an! Right."

    The setlist for this stream had: "Um, 2nd song is 'Neo Stream', 3rd song is 'Absolute 5', 4th song was 'Iza, gokugokuji, doobin reidishita—!'" I decided to make it a Macross medley, "Um, it was a Macross medley, but nobody guessed this, right? Probably, probably nobody did." It was all part of the plan, "Like, with the Macross medley, I thought I'd get hyped and fly away, um, all really high songs, and I wondered why I chose this setlist, thinking just before singing, it was almost painfully tough, but, you got hyped! How was it? Yeah! Thank you, wan!"

    Then comes the real moment of levity... "Ah, then excuse me, um, c-can I drink apple juice? Apple juice. Apple juice, ah, excuse me, excuse me." A moment of air-based refreshment! "This is, air apple juice. Air apple juice. You probably can't see it, it's apple juice that barely only I can see. Ah, e-everyone, thanks for the apple juice! Thanks for the apple juice!"

    Preparation is key, of course, "Yeah, today too, um, like seriously, seriously, I gotta make my throat absolutely perfect, I thought, so I sucked on throat lozenges, um, drank apple juice, and did a lot, though, well, I was a little nervous, n-nervous, y'know, but I think I gave a good performance."

    This stream was a special one for me: I got a new mic and I had to gush over it, "Ah, also, um, there's one more thing I want to say, mic, please give me the mic, mic, mic, ah, mic, ah, mic! Ah, I got it! Yes, yes. Ah, it came out! Please look at this, the mic! How is it?" I had to encourage everyone to take it in: "Look at it from 360 degrees without any gaps! Look at it without any gaps! How is it?" It was love at first sight, "Isn't it cute? Here, here, it has star candies attached and stuff. And see, here, um, this mic part is, see, like a planet, like a celestial body. When I announced my 1st anniversary, I said there was probably a trace of my friend, right?" The mic has real significance, it's a testament to the community, "This is it! This is, um, Lupinus Nightly-chan, who was close friends with me since my indie days, designed the mic, and Kuunran-chan is the one who shaped it! How is it? Y'know, when Suisan said she wanted a mic like a shoujo anime, she prepared such a cute one. Thank you so much! Thank you, Lupinus Nightly-chan!"

    We've got so much to do, "So, um, um, we still have plenty of time, um, we still have more songs, so I'd like to move on to the next song. So next, um, quite a bit, um, incorporating dancing too, we'll do it more intensely, so let's get even more hyped! Now then, let's go to the next song!"

    And then came *that* song, *Kowarekake no Radio*. "I don't hear a thing. You won't let me hear a thing. Is it because my body's more grown up now than it was way back then? A black radio — the first one I ever bought — sat on my bed. All the melodies from it created so many eras. In adolescence you change from being a boy to a man. I searched for roads to take, still yet to be sullied."



