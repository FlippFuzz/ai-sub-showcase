  - start: '03:29.616'
    end: '03:38.256'
    original: え、まだまだ一緒に盛り上がりたい！みんなは概要欄から配信サイトへ飛んでくださいね。こっちか？こっちか？こっちか？
    english: We still want to get hyped up together! Everyone, please head over to
