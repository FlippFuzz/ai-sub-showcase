  - start: '03:40.426'
    end: '03:41.976'
    original: はあー。
    english: Whew.
  - start: '04:00.086'
    end: '04:09.846'
    original: ということでね、あの、もう、さっきも言ったんですけど、冒頭からね、クライマックスみたいなあの、セトリをしているんですが、私がこのセトリ考えて、あの、バンドリはなったときに、これ、ずっとクライマックスだなって。
    english: Right, as I mentioned earlier, we're maintaining this climax from the
      very beginning. When I thought about this setlist and we got busy with the band,
      I kept thinking, "Wait, is it a climax the whole time?"
  - start: '04:09.846'
    end: '04:13.336'
    original: いや、本当にずっとクライマックスなんですよ。だからもうね、皆さんも感情がもうこんな、こんな、こんな、こんな状態にこうなっちゃうから、あの、ね、あの、水分補給しつつ楽しんでいただければなと思います。
    english: And it really is a climax the whole time, so everyone's emotions are
      going to get super high like this, so please make sure to stay hydrated while
