    english: Oh, I want to see yourうちわ (fans) too! I want to see your うちわ!
  - start: '04:32.086'
    end: '04:34.226'
    original: おー、おー、ありがとう、ありがとう、ありがとう！
    english: Oh! Oh, thank you, thank you, thank you!
  - start: '04:35.316'
    end: '04:40.456'
    original: お、見える、見える、見える見える！うれし！キャラのダメにみんな作ってくれたもんね、いつも。
    english: Oh, I see them, I see them, I see them! They're so happy! You all made
