- subtitles:
  - start: '00:04.606'
    end: '00:06.126'
    original: いいですね 武道館！
    english: Good to see you, Budokan!
  - start: '00:09.656'
    end: '00:10.516'
    original: 水飲みます。失礼します。
    english: Water, please. Excuse me.
  - start: '00:18.666'
    end: '00:23.236'
    original: まあね、え、しょっぱなからクライマックスみたいな感じになってるんですけれどもしゃ、
    english: Well, it's pretty much all climax right from the start, but...
  - start: '00:23.596'
    end: '00:29.356'
    original: 武道館ライブ「Supernova」いよいよ始まりました！
    english: Hoshimachi Suisei Nippon Budokan Live "Supernova" has finally begun!
  - start: '00:32.416'
    end: '00:36.786'
    original: うわー、すごい！ついにこの日がやってきたんだが、ね！感慨深いよね、みんな。
    english: Wow, it's finally here. Everyone, it's so moving, right?
  - start: '00:41.806'
    end: '00:53.646'
    original: はい、え、もうみんな知ってると思うんですけど、え、デビュー当初からね、ずっと、あの、武道館で、ライブをするぞというのを目標にしてやってきたんですけども、
    english: Well, as you all probably know, my goal since debut has been to hold
      a live concert at Budokan, and I've been working toward it...
  - start: '00:54.496'
    end: '01:03.496'
    original: ついにね、叶えたということで、あの、本日はサードアルバムの曲をいっぱいやる予定ですので、みんな聴いてきたかな？サードアルバムちゃんと。
    english: and I've finally achieved it! Today, we're going to play lots of songs
      from my 3rd album. Everyone, have you listened to it properly?
  - start: '01:07.416'
    end: '01:09.116'
    original: えー！そりゃそうだよね。あ、みんなサードアルバムの中でどれが楽しみ？
    english: Of course you have! Everyone, which song from the 3rd album is your favorite?
  - start: '01:15.546'
    end: '01:17.926'
    original: わかんない。
    english: I have no idea.
  - start: '01:19.496'
    end: '01:23.006'
    original: はい、え、今回もツアーと同じくバンドさんを引き連れております。
    english: Right, this time too, we are joined by the same band!
  - start: '01:28.026'
    end: '01:30.016'
    original: さらに、え、皆さん気付かれたでしょうか？
    english: And everyone, have you noticed?
  - start: '01:32.486'
    end: '01:35.336'
    original: お、そう、今回はブラス隊もいるんです！
    english: Yes, this time we have a brass section too!
  - start: '01:41.486'
    end: '01:46.686'
    original: いや、はい、今日しか聴けないようなね、ライブアレンジをバンドさんと一緒にいっぱい作って決めたので、
    english: Yeah, we worked together with the band to create some incredible live
      arrangements you've never heard before, so I hope you're all looking forward
      to it.
  - start: '01:49.036'
    end: '01:53.116'
    original: お、あ、ハードル上げちゃった。
    english: Oh, the bar is set high!
  - start: '01:53.486'
    end: '01:57.196'
    original: いや、本当にね、いい感じにアレンジされてるので、全部楽しみにしていてください。
    english: Seriously, the arrangements are amazing, so please look forward to all
      of them!
  - start: '02:01.996'
    end: '02:06.016'
    original: えー、では、これが押しカメラです。
    english: Well then, this is the "Push Camera."
  - start: '02:09.436'
    end: '02:12.726'
    original: イェーイ！やったー！
    english: Yay!
  - start: '02:14.616'
    end: '02:22.566'
    original: え、みんなさ、気づいた？あの、ツアー下はツアーと一緒で、あの、上だけちょっとアタッチメント変わってみたいな衣装なんですよ、今回は。
    english: Everyone, did you notice that for this tour, only the top part of the
      outfit is different from the previous tour?
  - start: '02:26.546'
    end: '02:28.326'
    original: わかる！さすがにねって。
    english: Well, obviously!
  - start: '02:28.536'
    end: '02:40.856'
    original: え、そうなんだよね。そうなんです。あの、ツアーで、ツアーでもう実を切れる、切れたんですけど、この服、もう出来上がってたから。でもちょっと出し惜しみしとこうかな、武道館にとと思って出し惜しみしときました。
    english: Right, it's true! We actually could have finished this outfit for the
      tour since it was already ready, but I thought it would be a nice surprise for
      the Budokan, so I saved it.
  - start: '02:41.876'
    end: '02:44.256'
    original: イェーイ！
    english: Yay!
  - start: '02:44.756'
    end: '02:46.336'
    original: たくさんスクショしてください！わーい！
    english: Take lots of screenshots! Yay!
  - start: '02:48.886'
    end: '02:51.106'
    original: 可愛い。ピース。
    english: Peace!
  - start: '02:51.276'
    end: '02:53.176'
    original: なんかこれピースみたいな格好じゃないような。
    english: Wait, isn't this pose a bit un-peace-like?
  - start: '02:59.766'
    end: '03:01.376'
    original: おー、かっこいい。
    english: Ooh, cool.
  - start: '03:04.096'
    end: '03:09.186'
    original: はい、え、ライブの感想はハッシュタグをかけめぐる星街でたくさんツイートしてください！
    english: Alright, please tweet lots of your live impressions using the hashtags!
  - start: '03:12.186'
    end: '03:13.796'
    original: スクショOK。
