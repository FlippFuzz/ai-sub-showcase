    So, here's how my mind's working: I hear Koyori starting with "かと思いますけれども" (00:00.000 - 00:01.700), and then it's straight into "まずは AZKiと『赤い車』！" (00:01.700 - 00:04.100). AZKi chimes in with "いや、素晴らしかったですね！" (00:04.100 - 00:06.000). I have to re-listen a few times just to be sure I'm capturing the nuances and the correct speaker. I need to get this right.

