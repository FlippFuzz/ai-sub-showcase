    channel. Set in a tropical island adventure theme (''Konkoyo Island''), Koyori
    performs numerous popular songs and anime themes, features guest appearances by
    fellow Hololive members (Shishiro Botan, Akai Haato, Momosuzu Nene, Houshou Marine,
    Shirakami Fubuki, Ookami Mio, Omaru Polka, La+ Darknesss, Takane Lui, Sakamata
    Chloe, Kazama Iroha), her AI counterpart AI Koyori, and legendary voice actress/singer
