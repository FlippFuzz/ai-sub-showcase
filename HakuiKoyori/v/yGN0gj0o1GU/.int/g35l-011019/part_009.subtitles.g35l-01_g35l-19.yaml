    performs a carefully curated setlist of iconic video game songs spanning Pokémon,
    Chrono Trigger, Final Fantasy IX, Utawarerumono, and more. A major highlight of
    the stream is a special duet performance with guest artist Suara, who sang theme
    songs from the Utawarerumono series. The stream also features the debut of Koyori's
    upgraded 3D model with interactive animal ears, the announcement and preview of
    her new original song 'Kanseito yori' (written and composed by Shota Horie) along
    with a full-animation MV release, and merchandise announcements for her 2026 birthday
    celebration.
