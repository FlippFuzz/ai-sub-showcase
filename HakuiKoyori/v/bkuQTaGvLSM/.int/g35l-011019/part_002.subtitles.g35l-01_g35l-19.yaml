global_summary:
  overall_summary: In this 3D live stream hosted by Hakui Koyori of Hololive holoX,
    she is joined by guests Houshou Marine, Omaru Polka, and Laplus Darknesss for
    the 'Koyori Wakarite Senshuken' (Koyori Understanding Championship), where guests
    compete to prove how well they know Koyori through trivia and physical challenges.
    Reaching the points threshold unlocks Koyori's brand-new 3D ponytail outfit live.
    Following Omaru Polka's victory, Koyori makes major announcements including her
    1st solo live 'Hakui Koyori 1st Live ‘Dream Spark’' at Tokyo Garden Theater on
    December 22, 2026, her 2nd album 'Chemical Spark', and the digital release of
    her new song 'Rising Sun' with a premiere music video, concluding with a live
    musical performance.
