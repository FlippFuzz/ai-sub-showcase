    judges Houshou Marine, Omaru Polka, and Laplus Darknesss. Across trivia, special
    knowledge, and physical challenges, the participants compete to prove how well
    they know Koyori. When Omaru Polka reaches 50 points, Koyori unveils her brand-new
    3D outfit on stream. Following the game show, Koyori makes major announcements
    regarding her upcoming 1st live concert ('Hakui Koyori 1st Live “Dream Spark”')
    and her 2nd album ('Chemical Spark'). The stream concludes with a performance
    of her new chemistry-themed song.
