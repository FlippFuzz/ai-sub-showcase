    from Hololive''s 6th-generation group holoX. Celebrating her birthday and the
    release of her 1st solo album ''FIRST STEP'', Koyori delivers an energetic 3D
    concert featuring solo performances, live band and piano accompaniment, and guest
    collaborations with Shigure Ui, Pmaru-sama, Ookami Mio, Houshou Marine, and Yukihana
    Lamy. The stream also includes major merchandise announcements, Hololive Official
    Card Game card reveals, and an emotional closing letter to her fans (''Joshi-kun'').'
