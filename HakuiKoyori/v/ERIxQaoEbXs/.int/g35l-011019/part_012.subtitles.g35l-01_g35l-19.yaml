  - start: '00:43.806'
    end: '01:05.106'
    original: ももこもも先生に描いていただきました、え、オリジナルのライブ衣装みたいなすごい可愛いやつ！これあのもう角なんですけど、二重に、身を包んだこよりがライブをしてるよというね、素敵な二層アクリルパネル！
    english: drawn by Momoko Momoco-sensei, a super cute one resembling my original
      live outfit! This is, well, a wonderful two-layer acrylic panel showing Koyori
      wrapped up, performing live!
  - start: '01:06.146'
    end: '01:13.506'
    original: はい、フェスで欲しくなったよね、みんな！こよ推しはっぴー！
    english: Yes, everyone wanted one for the fes, right? The Koyori-Oshi Happi!
  - start: '01:13.926'
    end: '01:27.166'
    original: ま、ちょっとフェス衣装は1週間前に終わっちゃいましたけれどもち、え、次回があるのかも知れませんけれどもなんかあるでしょう！はい、次回のためにもね、ぜひゲットしておいて、次の時に着れるように備えてください。これ法被っぽい柄になってて、めちゃくちゃ可愛いです。
    english: Well, the fes outfit ended a week ago, but um, there might be a next
      time, but there'll probably be something! So please get it for next time so
      you're ready to wear it. It has a happi-like pattern and is super cute.
  - start: '01:27.706'
    end: '01:39.186'
    original: そして次！はい、去年出した制服衣装のとっても可愛いぬいぐるみバッチ！こちら今までのサイズ感と同じサイズ感になってますよ、くっそ可愛いのでゲットしてください。
    english: And next! Yes, the super cute plushie badge of the school uniform outfit
      I released last year! It's the same size as before, so please get it because
      it's insanely cute.
  - start: '01:39.986'
    end: '01:53.646'
    original: 次！はい、最近ね、あの、ホロカやってる人も増えてきたので、こんこよカードケース作ってみました！はい、ホロカって結構デッキ枚数が多いので、あのデッキ全部入るように、あのサイズ大きめに作っております。
    english: Next! Yes, lately, um, more people have been playing Holoca, so I made
      a Konkoyo card case! Yes, Holoca decks have quite a lot of cards, so I made
      it larger in size so that the whole deck fits.
  - start: '01:53.846'
    end: '02:08.826'
    original: カードやってないよっていう人もですね、こちら、え、あの開いて縫いばを挿しとくとか、小物入れとかいろいろ使えます。なんかね、豪華なね、なんかあの合皮なのかな？みたいな感じになってますのでゲットしてください。
    english: Even if you don't play cards, you can use this for opening and putting
      needles, as an accessory case, and various other things. It has a luxurious,
      faux-leather-like feel, so please get it.
  - start: '02:09.906'
    end: '02:24.426'
    original: そして、フルセット特典はこちら！はい、え、限定です！で、直筆サイン、そして白衣推しサインとメッセージ入りの、え、ものが、え、ついています。
    english: And, the full-set bonus is right here! Yes, it's limited! And it comes
      with an item featuring a hand-signed autograph, plus a Hakui-Osh-signed autograph
      and message.
  - start: '02:24.866'
    end: '02:44.746'
    original: そして毎年これ大好評！キミの誕生日を逆に御祝いするよというASMRボイスがついてきます！あ、こちら本当に大好評でね、あのゲットしてなかった人だいたい後悔してますんで、自分の誕生日に聞くようにダウンロードしてずっと我慢して自分の誕生日で聞いてください。3月14日の人は1年我慢してくださいよろしくお願いします。
    english: And every year this is a huge hit! An ASMR voice where I celebrate your
      birthday in reverse is included! Ah, this is really popular, and people who
      didn't get it usually regret it, so download it to listen to on your birthday,
      hold out, and listen to it on your birthday. If your birthday is March 14th,
      please hold out for a year, thank you.
  - start: '02:45.926'
    end: '03:02.146'
    original: さらに今回フルセットこちら！ホロカもついてきまーす！かわいー！今回のイラスト可愛すぎてホロカになるの最高すぎないか？おしカードついてきますよ、おしほろめカードぜひゲットしてくださいね、ホロカ好きな皆さんもよろしくお願いします。
