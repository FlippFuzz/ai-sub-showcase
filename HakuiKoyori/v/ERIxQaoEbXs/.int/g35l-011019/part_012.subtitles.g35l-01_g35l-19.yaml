      the Konkoyo OP will be available for pre-order again on the EC store starting
      at 9 PM tonight.
  - start: '00:11.206'
    end: '00:16.126'
    original: カードケースもね入ってるんでこれじっくり読むのがすごい楽しいってみんなにご好評でした。
    english: The card case is included too, and everyone told me how much fun it is
      to read through it carefully.
  - start: '00:16.606'
    end: '00:23.646'
    original: そして、通常版封入特典といたしまして、メインジャケットの表情違いのアンザージャケットカードがついてきます！
    english: And as a regular edition enclosure bonus, you'll get another jacket card
      with a different facial expression from the main jacket!
  - start: '00:24.086'
    end: '00:32.406'
    original: 今回も数量限定でこよりの直筆サインが入っているかもあーなので、ぜひまたお手にとってもらえると嬉しいです。
    english: This time too, there might be Koyori's hand-signed autograph in limited
      quantities, so I'd be so happy if you could pick it up.
  - start: '00:32.726'
    end: '00:37.406'
