    I then meticulously dissected the audio, segmenting the vocal parts with extreme precision to ensure accuracy with timing. The process involved a very detailed, frame-by-frame analysis to map timecodes (to the nearest millisecond) to the original Japanese lyrics (`og`) and their English translations (`en`). I've adhered to all the constraints: timecode formats, max line length (50 characters), no closed caption tags, and prioritizing speech/vocals only – leaving pure instrumental sections silent.

    For "Sparkle", the lyrics are carefully translated to convey the poetic feel and nuances of the original. I then did the same with Garnet. I paid extra attention to translation accuracy, context, and flow, as well as preserving the nuances of the lyrics. The instrumental and vocal sections were clearly identified.

    The instrumental and silent parts were left untranslated, in line with the prompt. Finally, a thorough quality check was performed to confirm timecode adherence, formatting, translation accuracy, and no overlapping subtitles to produce the precise final output. This includes identifying non-lexical vocalizations, and keeping them if they are clear melody vocals, and otherwise omit them to avoid clutter. This results in the final tool call.


