  english: La la la...
- start: '04:12.800'
  end: '04:20.000'
  original: '[Title: 花に亡霊]'
  english: '[Title: Ghost in a Flower]'
- start: '04:12.800'
  end: '04:20.000'
  original: '[Text: 作詞・作曲:n-buna]'
  english: '[Text: Lyrics & Music: n-buna]'
- start: '04:10.000'
  end: '04:21.000'
  original: もう忘れてしまったかな 夏の木陰に座ったまま アイスを口にほり込んで 風を待っていた
  english: Have I already forgotten? Sitting in the summer shade, tossing ice cream
    into my mouth, waiting for the wind.
- start: '04:21.500'
  end: '04:31.500'
  original: もう忘れてしまったかな 世の中の全部嘘だらけ 本当の価値を二人で探しに行こうって笑ったこと
  english: Have I already forgotten? That everything in this world is full of lies,
    and us smiling as we set out to find true value together.
- start: '04:36.000'
  end: '04:46.000'
  original: 忘れないように 色褪せないように 形に残るものが全てじゃないように
  english: So we wouldn't forget, so it wouldn't fade away, so that things left in
    physical form aren't everything...
- start: '04:49.000'
  end: '05:00.032'
  original: 言葉をもっと教えて 夏が狂って教えて ぼくは描いている 目に映ったのは夏の亡霊だ
  english: Teach me more words, let summer go mad and teach me. I am sketching it—what
    was reflected in my eyes was a summer ghost.
