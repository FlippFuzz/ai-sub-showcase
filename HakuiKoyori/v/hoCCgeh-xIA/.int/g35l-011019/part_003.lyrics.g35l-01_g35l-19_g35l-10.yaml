  english: Walking on and on, just how far will we go?
- start: '00:05.100'
  end: '00:09.500'
  original: 風と一緒に また歩きだそう
  english: Walking together with the wind once more...
- start: '00:11.200'
  end: '00:17.000'
  original: 大地を踏みしめ どこまででもゆくよ
  english: Treading firmly on the earth, going on no matter how far...
