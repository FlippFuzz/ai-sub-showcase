  english: Treading firmly on the earth, going on no matter how far...
- start: '00:45.500'
  end: '00:50.500'
  original: めざした 一つの
  english: A single dream we aimed for...
- start: '00:51.000'
  end: '00:55.000'
  original: ふるさと旅立った 今も
  english: Even now, having set out from my hometown...
- start: '00:55.500'
  end: '01:05.500'
  original: 何かを求めて 大きな瞳が輝いて
  english: Seeking something still, with big, shining eyes...
- start: '01:06.000'
  end: '01:14.500'
  original: 君のポケットの中には 君じゃない誰かとの
  english: Inside your pocket is someone other than you...
- start: '01:17.000'
  end: '01:22.000'
  original: いくつものなかで
  english: Among so many things...
- start: '01:22.500'
  end: '01:27.500'
  original: いくつものなかから
  english: From among so many...
- start: '01:28.000'
  end: '01:36.500'
  original: まぼろしのような 思い出を少しずつ
  english: Little by little, illusory memories...
- start: '01:40.500'
  end: '01:50.500'
  original: 歩き続けて どこまでゆくの 風にたずねられた 空を見る
  english: Walking on and on, just how far will we go? Asking the wind, I look up
    at the sky.
- start: '02:01.000'
  end: '02:10.000'
  original: 歩き続けて どこまでゆこうか
  english: Walking on and on, just how far shall we go?
- start: '02:11.000'
  end: '02:20.000'
