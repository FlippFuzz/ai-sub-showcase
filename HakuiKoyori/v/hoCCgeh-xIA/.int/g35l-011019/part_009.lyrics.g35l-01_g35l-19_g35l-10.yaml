  original: あの日見わたした渚を 今も思い出すんだ
  english: I still remember the beach we looked out over that day.
- start: '01:29.112'
  end: '01:38.502'
  original: 砂の上に刻んだ言葉 君の白い姿
  english: The words carved into the sand, and your white silhouette.
- start: '01:40.112'
  end: '01:49.002'
  original: 寄り返す波が 足元をよぎり 何かをさらう
