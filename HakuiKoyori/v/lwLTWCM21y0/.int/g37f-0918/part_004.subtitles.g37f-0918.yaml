  thoughts: |+
    **My Thoughts on "Frog Phenomenon" and Dirty Jokes**

    Alright, so I was watching this clip featuring Lamy, Noel, and Koyori discussing the "frog phenomenon" – that icky feeling you get about someone. It made me think about my own experiences. Honestly, the biggest turn-off for me? Lies. Not just any lies, but the ones that are trying too hard to impress. The "I have 500 billion yen annual income" type. It's a joke, of course, but that kind of obvious flexing? Nope. I prefer to see someone's vulnerable side; I want genuine connection.

    We were also on the subject of lies. A white lie is okay. I want to know someone's authentic self, even if they're a bit silly or awkward sometimes. I'd rather see someone just be themselves, even if they have to be "infantilized" and ask for a candy bar. I want them to be able to be cared for, because that's the care-taking type of person I am.

    Then we got to this question: "Do guys who tell dirty jokes actually get popular?" The others agreed that it really depends on the context of the relationship. It's not a question of simply doing it; it's a matter of relationship dynamic. If someone's comfortable telling those jokes, they're already in a good spot. Telling a dirty joke in front of a girl for the first time is actually really off-putting. Telling those types of jokes, however, does not make you popular. If you're comfortable enough to be telling those jokes, you've already made it.

    So, in the end, authenticity and genuine connection are far more appealing than any attempt to appear impressive or edgy.


