  thoughts: |+
    **A Deep Dive into Beauty, Budget-Friendly Finds, and...Fetishes?**

    Okay, so I was watching this clip featuring Lamy, Noel, and Koyori, and it got me thinking. It started with a comment about how neat their makeup was, specifically focusing on their eyebrows. You know, as someone in the field, I understand the importance. Eyebrows can really change a face's entire impression!

    It made me think about affordable makeup and how it can be just as good. I was thinking of CANMAKE, that budget brand. I still use them. The packaging is cute, the price is right, and the quality is surprisingly high. Their blush, for example, is fantastic. And hey, I even have a friend who's a makeup expert, and she loves CANMAKE, too. I really wanted to share that you don't need to splurge to get a great look.

    Then the conversation shifted to 100-yen store makeup. I hadn’t really thought about it before, but hey, those can be surprisingly usable too! I mean, I've heard good things about the eyeliners. They have good color payoff and don't smudge easily. I mean, they’re a lifesaver, especially for students on a budget. And they're a great way to experiment without breaking the bank.

    Then, things got a bit…personal. Someone asked about our "fetishes." Right, so I was thinking about it. For Lamy, it might be the smell of sweat. I mean, you know, with the summer heat, everyone's showing a bit more skin. But no, no, I don't want anyone to smell my sweat! Koyori? Definitely voice. I've always been drawn to voice actors. I tend to focus on the sound of someone's voice. And for Noel? It was about hands. I have to admit, I'm drawn to chubby, plump hands, almost like baby hands! And I admire hands that look like cream buns. It's just a visual preference. It's interesting how hand shape may be influenced by bone structure. I'm a bit self-conscious because my hands are angular. Someone in the comments even mentioned "Yoshikage Kira" from *JoJo's Bizarre Adventure*, which is…well, let's just say I pay attention to hands, but I'm not *that* obsessed. That's my fetish.


