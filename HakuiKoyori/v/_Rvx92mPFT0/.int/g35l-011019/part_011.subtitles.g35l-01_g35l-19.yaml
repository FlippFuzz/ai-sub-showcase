global_summary:
  overall_summary: This YouTube video features the 3D acoustic live stream hosted
    by Hakui Koyori from Hololive titled '#holoAcousticLive' in Autumn 2026. Joined
    by guest performers AZKi, Tokoyami Towa, Kobo Kanaeru, and Koganei Niko (FLOW
    GLOW), Koyori presents a full-length live acoustic concert featuring intimate
    piano arrangements of popular covers and original songs. The stream includes emotional
    duets, chat segments reflecting on the performances, a special original song medley
    ending with the premiere of Koyori's new single 'Pink ni Nacchae!', and major
    career announcements including her 1st solo live concert 'Dream Spark' at Tokyo
    Garden Theater and her 2nd album 'Chemical Spark'.
