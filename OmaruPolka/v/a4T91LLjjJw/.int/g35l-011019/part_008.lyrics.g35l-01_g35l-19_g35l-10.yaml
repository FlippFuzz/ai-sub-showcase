    but...
- start: '04:01.022'
  end: '04:04.122'
  original: こちらで、まあいつもおなじみここあの喋りと言ったら……
  english: as for our usual familiar Polka talk here...
- start: '04:04.522'
  end: '04:11.122'
  original: 告知タイムがあります！グッズ告知今回も出ます！こちら！
  english: it's time for announcements! Merchandise announcements are coming this
    time too! Here!
- start: '04:12.000'
  end: '04:17.522'
  original: '[Sign: 誕生記念フルセット 2025]'
  english: '[Sign: Birthday Celebration Full Set 2025]'
- start: '04:12.422'
  end: '04:24.322'
  original: はい、おわりポルカ誕生日記念2025、こちら！あー、なんてかわいいんだ！今回はホテルマンコンセプトになっております！
  english: Yes, Omaru Polka Birthday Celebration 2025, right here! Ah, how cute! This
