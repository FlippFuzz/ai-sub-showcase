- start: '04:24.722'
  end: '04:26.522'
  original: え、ではではグッズを見ていきましょう！
  english: Well then, let's take a look at the merchandise!
- start: '04:26.000'
  end: '04:42.000'
  original: '[Sign: 「いらっしゃいませ、ようこそお客様！」B2タペストリー グラフ ほか]'
  english: '[Sign: "Welcome, right this way, customer!" B2 Tapestry, Illustrated by
    Haru Ibaraki, and more]'
- start: '04:26.922'
  end: '04:35.322'
  original: あー、こちら！はい、えーとこちらですね、B2タペストリー『いらっしゃいませ、ようこそお客様！』
  english: Ah, here! Yes, uh, this right here is the B2 Tapestry titled "Welcome,
