- start: '04:35.322'
  end: '04:42.522'
  original: で、ホテルマンの格好したおまるポルカになっております。こちらイラストは茨木春先生に描いていただきました。
  english: Featuring Omaru Polka dressed as a hotelman. This illustration was drawn
