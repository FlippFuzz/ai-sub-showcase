- start: '04:43.022'
  end: '04:53.322'
  original: ちょっとね、いつもと違って、なんかおまるポルカもこれパンツスタイルなんでね、あの、どう、どうですか？ちょっとすっきり見えますか？
  english: Y'know, unlike usual, Omaru Polka is wearing a pants style here, so, y'know,
