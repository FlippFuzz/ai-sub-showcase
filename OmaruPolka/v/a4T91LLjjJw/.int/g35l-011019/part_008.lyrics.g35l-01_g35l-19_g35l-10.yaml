- start: '00:29.832'
  end: '00:33.222'
  original: 残酷の中で、おどけてみせて
  english: Clowning around in the midst of cruelty—
- start: '00:33.722'
  end: '00:35.802'
  original: おどけてみせたよ
  english: yes, I clowned around.
- start: '00:36.002'
  end: '00:42.502'
  original: アタシの世界はぐるぐるぐるぐるぐるぐるぐる回って
  english: My world spins round and round and round and round...
- start: '00:43.342'
  end: '00:47.342'
  original: 幕が開けた　そのお・ま・ま・と・せ群がる人形は
  english: The curtain rises on this... puppet show, with throngs of dolls
- start: '00:48.342'
  end: '00:50.842'
  original: ダリアの花束をランダム選んで
  english: randomly choosing a bouquet of dahlias,
- start: '00:51.342'
  end: '00:53.642'
  original: 不恰好な服を着て踊りましょう
  english: wearing clumsy clothes and dancing away.
- start: '00:54.042'
  end: '00:57.902'
  original: 騙されてくれるあなた達と、いいよもうこれじゃ
  english: With all of you who let yourselves be deceived—fine, if it's like this,
- start: '01:00.042'
  end: '01:02.822'
  original: 好きだっただけなんだろ？
  english: you just loved it all along, didn't you?
- start: '01:12.752'
  end: '01:15.512'
  original: 振り落とせペルソナを
  english: Shake off your persona!
- start: '01:34.902'
  end: '01:42.122'
  original: とっくに終わった喜劇は悲劇と化してなお（今日も普通に楽しかったよ）
  english: A comedy long since ended turned into a tragedy ("Today was normally fun,
    too").
- start: '01:45.342'
  end: '01:47.882'
  original: 刮目してくれよ
  english: Open your eyes wide and look!
- start: '01:48.382'
  end: '01:54.622'
  original: 本当の僕はアタシじゃないから
  english: Because the true me is not "me".
- start: '01:56.022'
  end: '01:58.742'
  original: （今日も普通に楽しかったよ）　なぜ？
  english: ("Today was normally fun, too") Why?
- start: '02:05.422'
  end: '02:11.752'
  original: 幕が閉じた　そのお・ま・ま・と・せ着せ替え人形と輪廻のアンコール
  english: The curtain closes on this... puppet show, an encore of dress-up dolls
    and reincarnation.
- start: '02:12.232'
  end: '02:15.222'
  original: 本日大団円　脚本が笑う
  english: A grand finale today, the script laughs.
- start: '02:15.422'
  end: '02:18.522'
  original: どうしようもないよな
  english: There's really nothing we can do, is there?
- start: '02:19.422'
  end: '02:22.522'
  original: どこの誰でもいい調子に乗るなよと
  english: Don't get full of yourself no matter who you are.
- start: '02:22.922'
  end: '02:25.722'
  original: 最低一回言ってくれ　そういや
  english: Say it at least once—come to think of it,
- start: '02:26.122'
  end: '02:31.722'
  original: 愚痴も散々言ってたな　もう後戻りは叶わないと
  english: we complained enough already, saying "There's no turning back now."
- start: '02:32.122'
  end: '02:35.322'
  original: 気づけばそこには一人で
  english: Before you know it, you're all alone there.
- start: '02:37.422'
  end: '02:44.722'
  original: ぬらりぬらりぬらりぬらりぬらりくらりな　色眼鏡に映り出すバラバラな
  english: Slithering and sliding, reflected through colored glasses, falling apart.
- start: '02:45.122'
  end: '02:50.022'
  original: ハイ&ハイ&バーウララララララノリユレラ
  english: High & High & Bar, la-la-la-la-la riding the rhythm!
- start: '03:14.922'
  end: '03:18.422'
  original: 戯曲の物語
  english: The story of the play.
- start: '03:32.122'
  end: '03:42.522'
  original: という訳で！いつものおなじみの、え、ペルソナで、今、えー、ここまで来ましたが、
  english: And with that! We've made it this far with our usual familiar persona,
- start: '03:42.922'
  end: '03:48.322'
  original: まずゲストたくさん来てくれて、ありがとうございます！
  english: first of all, thank you so much to all the guests who came!
- start: '03:49.222'
  end: '03:59.822'
  original: なんかね、今回は本当にね、ここまで駆け抜けたから、ま、本当に、あの、ゼミカツの子たちも来てくれたし、もうこちらとしては、もう満腹満腹なのですが……
  english: Y'know, this time we really raced through everything, and y'know, the Aikatsu
