global_summary:
  overall_summary: This video is the 3D birthday celebration live stream of Hololive
    5th Generation VTuber Omaru Polka, titled '【#尾丸ポルカ生誕祭2025】PuPPet~ポルカのおもちゃ箱~',
    broadcast on January 30, 2025. The live features a toy box and hotelman theme,
    opening with a high-energy medley of cover songs and Aikatsu franchise hits performed
    alongside special guests from the Aikatsu Academy Streaming Department (Himeno
    Mieru, Mamimu Mee, Waō Palin, and Rindō Taimu). Throughout the stream, Polka performs
    solo tracks including 'POLKATIC' and her new original song 'PuPPet' composed by
    cosMo@BousouP. The event culminates in major announcements, including her hotelman-themed
    birthday merchandise and the release of her highly anticipated 1st solo album
    'Filmy Funny', before closing with 'Hologram Circus'.
