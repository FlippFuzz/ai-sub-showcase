global_summary:
  overall_summary: This video is Omaru Polka's official Birthday 3D Live 2026 titled
    'Glitter of Love' streamed on her YouTube channel under hololive production. Featuring
    her largest number of guest hololive members to date (including NePoLaBo, AZKi,
    Nakiri Ayame, Ookami Mio, Shiranui Flare, Houshou Marine, Takane Lui, and Kazama
    Iroha), Polka delivers an energetic and emotional lineup of powerful anisong covers
    and original tracks, showcases her 2026 birthday merchandise, and closes with
    a grand group performance.
