- start: '01:28.100'
  end: '01:31.250'
  original: ここまで本当にありがとうございます！
  english: Thank you all so much for everything up to this point!
- start: '01:32.700'
  end: '01:37.600'
  original: 十分伝えられたと思うけど でもまだ伝えきれてないんだ
  english: I feel like I've conveyed enough, but... I still haven't fully expressed
