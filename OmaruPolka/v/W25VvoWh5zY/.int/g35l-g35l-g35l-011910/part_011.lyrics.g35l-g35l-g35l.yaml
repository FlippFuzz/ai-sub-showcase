- start: '01:39.100'
  end: '01:44.200'
  original: だからね、言いたいわけですよ 僕は。世界はそれを愛と呼ぶんだぜ
  english: That's why I want to say it. The world calls that "love".
- start: '01:45.350'
  end: '01:51.450'
  original: 涙の中に微かな明かりが灯ったら
  english: When a faint light kindles within your tears,
- start: '01:52.250'
  end: '01:58.750'
  original: 君の目の前で温めてたこと話すのさ
  english: I'll talk about the warmth I've kept close before your eyes.
- start: '01:59.250'
  end: '02:05.450'
  original: それでも僕らの声が乾いていくだけなら
  english: Even so, if our voices are just drying up,
- start: '02:06.050'
  end: '02:12.650'
  original: 朝が来なくたって せめて誰かと歌いたいんだ
  english: Even if morning never comes, I want to sing with someone at least.
- start: '02:13.250'
  end: '02:19.750'
  original: 昨日のあなたが嘘だと言うなら
  english: If you say yesterday was a lie,
- start: '02:20.050'
  end: '02:26.250'
  original: 昨日の景色を捨てちまうだけさ
  english: I'll just throw away yesterday's scenery.
- start: '02:26.850'
  end: '02:37.650'
  original: 新しい君と僕なのだ ぼくらは確かめ合う 世界じゃそれを愛と呼ぶんだぜ
  english: It's you and me in a new way. We confirm it with each other—the world calls
    that "love"!
- start: '02:40.850'
  end: '02:56.150'
  original: 心の声を繋ぐのが これほど怖いものだとは 君と僕が声を交わす 今までの過去なんてなかったかのように歌い出すんだ
  english: Who knew connecting our hearts with our voices could be this terrifying?
    As you and me exchange voices, I start to sing as if our pasts up until now never
    existed.
- start: '02:59.150'
  end: '03:15.150'
  original: 僕らはいつでも誰かを疑っちまうから せめて今だけ美しい歌を歌うのさ 悲しい言葉では
  english: Because we're always doubting someone, at least for now, I'll sing a beautiful
    song. With sad words,
- start: '03:16.750'
  end: '03:22.450'
  original: おーい！ 何も変わらないんだぜ
  english: Hey! Nothing changes at all!
- start: '03:22.950'
  end: '03:39.050'
  original: 奴らが何を言ったってさ 昨日のあなたが孕む日の出なら 昨日の景色を忘れちまうだけさ
  english: No matter what those guys say, if yesterday's sunrise is what you bear,
    I'll just forget yesterday's scenery.
- start: '03:40.050'
  end: '03:56.450'
  original: 新しい日々を変えるのは 一日らしいほどの間のさ 僕らそれを確かめ合う 世界じゃそれも愛と呼ぶんだぜ
  english: What changes new days is just about a day's worth of time. We confirm it
    with each other—the world calls that "love" too!
- start: '03:57.050'
  end: '04:13.150'
  original: 心の声を繋ぐのが これほど怖いものだとは 君と僕が声を合わせ 今までの過去なんてなかったかのように歌い出すんだ
  english: Who knew connecting our hearts with our voices could be this terrifying?
    As you and me harmonize our voices, I start to sing as if our pasts up until now
    never existed.
- start: '04:21.050'
  end: '04:34.450'
  original: 僕らが 僕らが新しい日々を想う時に 僕らはどうしても愛という言葉を口に出してしまうわけですよ 心の声と あなたの憎しみと裏切りを 愛と言いたいわけですよ！
  english: When we, when we think of new days, we somehow end up uttering the word
    "love"! With the voice of our hearts, your hatred and betrayal, we want to call
    it "love"!
- start: '04:41.050'
  end: '04:50.750'
  original: 愛と平和を！愛と平和を！愛と平和を！
  english: Love and peace! Love and peace! Love and peace!
- start: '04:51.050'
  end: '05:05.000'
  original: 悲しみで花が咲くものか 新しい日々の僕たちは 確かめ合うのさ 君と僕が夢を叫ぶ
  english: As if flowers could bloom from sorrow! We of the new days confirm it with
    each other—you and me shouting our dreams!
