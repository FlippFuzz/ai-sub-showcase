global_summary:
  overall_summary: This video is the 2024 birthday 3D live concert of Hololive 5th
    Generation VTuber Omaru Polka, titled 'POL ROCK 2024'. Set against an open-air
    rock festival stage with a live band aesthetic, Polka delivers a high-energy setlist
    featuring various rock and pop-rock covers and original songs. She is joined by
    several guest performers from Hololive English and Indonesia, including Hakos
    Baelz, Kureiji Ollie, Mori Calliope, and Ouro Kronii. The stream also features
    a merchandise showcase segment and concludes with an enthusiastic encore performance.
