- subtitles:
  - start: '00:00.000'
    end: '00:02.100'
    original: いつかに繋がる わたしのはじまり 信じて歩き出そう
    english: Let's believe in my new beginning, connected to someday, and step forward.
  - start: '00:02.100'
    end: '00:09.000'
    original: 再び幕は上がる
    english: Once again, the curtain rises.
  - start: '00:25.300'
    end: '00:30.000'
    original: 聴いていただいたのは新曲の「STARTING OVER」でしたー！
    english: That was my new song, "STARTING OVER"!
  - start: '00:31.000'
    end: '00:36.700'
    original: はい！新年一発目、新曲の初披露というわけで、ぬるっとね、新曲をやってしまったんですが...
    english: Yes! As the very first song of the new year, it was a premiere performance
      of my new song... though I kind of slipped right into it...
  - start: '00:36.700'
    end: '00:44.800'
    original: 平成感のある、えー、懐かしみの感じの楽曲を、こちらですね、歌わせていただいたんです...
    english: I got to sing a song with a Heisei-era vibe and a sense of nostalgia...
  - start: '00:44.800'
    end: '00:51.300'
    original: '...けれどーも！このあと、この曲が、えーっと、24時から...'
    english: '...however! Right after this, starting from 24:00...'
  - start: '00:51.300'
    end: '00:56.500'
    original: 1月30日の24時から配信リリースされます！たくさん聴いてください！
    english: On January 30th at midnight, it will be released digitally! Please listen
      to it a lot!
  - start: '00:57.000'
    end: '01:00.600'
    original: 今年もね、たくさんオリ曲出していきたいです！
    english: I want to release lots of original songs this year too!
  - start: '01:01.000'
    end: '01:04.200'
    original: そしてそして、もうMCがね、実は最後なのでね。
    english: And also, this is actually the final talk segment.
  - start: '01:04.200'
    end: '01:10.800'
    original: えーっと、この配信のあとには、メンバー限定の配信もあるので、よろしくお願いします！
    english: So after this stream, there'll be a members-only stream as well, so please
      stay tuned!
  - start: '01:11.100'
    end: '01:14.300'
    original: よし、よし、よし！グッズ紹介ー！
    english: Alright, alright, alright! Merch introduction!
  - start: '01:14.300'
    end: '01:21.000'
    original: えー、ここには同期のねポラボを大集合ということで、ねー、らー、ぼー、集まれー！
    english: Here we have a big gathering of my genmates, NePolabo! Nene, Lamy, Botan,
      assemble!
  - start: '01:21.000'
    end: '01:27.200'
    original: イエーイ！
    english: Yay!
  - start: '01:27.200'
    end: '01:30.000'
    original: はい、ちゃっちゃっちゃっちゃー、初めて呼ばれました、どうも〜
    english: Ta-da! We were called here for the first time, hello~
  - start: '01:30.000'
    end: '01:33.000'
    original: え？初だっけ？ポルカチャンネル初でーす！
    english: Huh? Was this the first time? First time on Polka's channel!
  - start: '01:33.000'
    end: '01:38.900'
    original: 誕生日おめでとうー！ありがとうー！
    english: Happy birthday! Thank you~!
  - start: '01:39.000'
    end: '01:42.500'
    original: ここまでが流れでございます（笑）はい。
    english: That was all scripted/according to plan (laughs). Yes.
  - start: '01:42.500'
    end: '01:46.000'
    original: グッズをね、紹介させていただきたいと思います！
    english: I'd like to introduce the merchandise!
  - start: '01:46.000'
    end: '01:51.800'
    original: 出演しながらね、リアクションなどを各々取っていただけたら嬉しいです！
    english: I'd be happy if you all could react while participating!
  - start: '01:51.800'
    end: '01:56.800'
    original: 尾丸ポルカ誕生日記念グッズ2026、ラインナップはこちら！
    english: Omaru Polka Birthday Celebration Merch 2026, here is the lineup!
  - start: '01:57.000'
    end: '02:02.800'
    original: ドーン！というわけで、素晴らしい、今回もラインナップが揃っております！
    english: Ta-da! So, we have an amazing lineup gathered once again!
  - start: '02:02.800'
    end: '02:10.000'
    original: え、なんか...あれ？すごいけど...あれ？ちょっとあれが...
    english: Wait, something... Huh? It's awesome, but... Wait, isn't that a bit...?
  - start: '02:10.000'
    end: '02:14.300'
    original: ちょっと、なんか盛ってません？盛ってませんよ！
    english: Wait, aren't you embellishing a bit? No, I'm not!
  - start: '02:14.300'
    end: '02:17.800'
    original: というわけで、まず一つ一つ紐解いていきましょう！
    english: So let's look into each item one by one!
  - start: '02:18.000'
    end: '02:25.000'
    original: まずはこちら！はい！ポルカのはじめての抱き枕カバーとなっております！
    english: First up, this! Yes! It's "Polka's First Body Pillow Cover"!
  - start: '02:25.000'
    end: '02:29.800'
    original: すごい！可愛い！え、ちょっとポルカさん、パンツ履いてません？
    english: Amazing! Cute! Wait, Polka, aren't you not wearing pants?
  - start: '02:29.800'
    end: '02:32.500'
    original: あれ？丸出しじゃないですか？部屋着だよ〜！
    english: Huh? Aren't you totally exposed? It's roomwear~!
  - start: '02:32.500'
    end: '02:40.000'
    original: 部屋着？だってねねとかだってこういう部屋着...
    english: Roomwear? But even Nene has roomwear like this...
  - start: '02:40.000'
    end: '02:45.000'
    original: 待って待って、人のチャンネルだからってやりたい放題チャンネルして...
    english: Wait, wait, just because it's someone else's channel, doing whatever
      you want...
  - start: '02:45.000'
    end: '02:50.000'
    original: 写真撮影用かもしれないですよ！なるほどね。
    english: Maybe it's for a photo shoot! I see.
  - start: '02:50.000'
    end: '02:56.500'
    original: というわけで、初めての抱き枕カバー出します。表が通常衣装で、裏は彼氏シャツになってます！
    english: So, I'm releasing my first body pillow cover. The front is my normal
      outfit, and the back is a boyfriend shirt!
  - start: '02:56.500'
    end: '03:02.500'
    original: 彼氏シャツいただきました！ありがとねー！
    english: Boyfriend shirt acquired! Thank you~!
  - start: '03:03.000'
    end: '03:09.000'
    original: 続きまして、ドン！こちら！歴代衣装のポルカ ランダムラバーストラップです！
    english: Next up, boom! This! "Polka's Past Outfits Random Rubber Strap"!
  - start: '03:09.000'
    end: '03:15.500'
    original: これまでの衣装のラバーストラップ、こちら「いぬいみ」先生に書いていただきました！
    english: Rubber straps of my past outfits, illustrated by Inuimi-sensei!
  - start: '03:15.500'
    end: '03:20.500'
    original: どの衣装が出るかお楽しみです。ありがとね、みんなリアクション本当に100点満点です！
    english: Look forward to seeing which outfit you get! Thanks everyone, your reactions
      are 100 points!
  - start: '03:21.000'
    end: '03:27.500'
    original: はい、続きまして、こちらー！「どれもこれも宝物！思い出バインダー」！
    english: Yes, next is this! "Each and Every One is a Treasure! Memory Binder"!
  - start: '03:28.000'
    end: '03:34.000'
    original: 最近みんなも特典でチェキ風のブロマイドカード出したりしてるから、そういうの入れられたり...
    english: Everyone's been releasing cheki-style bromide cards as bonuses lately,
      so you can put those in...
  - start: '03:34.000'
    end: '03:41.000'
    original: あとはホロカも入るサイズになっていますので、ぜひぜひいろんな思い出しまってください！
    english: It's also sized to fit HoloCa cards, so please store all kinds of memories
      in it!
  - start: '03:41.500'
    end: '03:47.000'
    original: はい！そして続きましては、こちら！ポルカのしっぽキーホルダー！
    english: Yes! And next is this! "Polka's Tail Keychain"!
  - start: '03:47.000'
    end: '03:53.000'
    original: 一周して流行ってるからね！ポルカのしっぽ型のキーホルダーです！
    english: It's coming back into trend after coming full circle! It's a keychain
      shaped like Polka's tail!
  - start: '03:53.000'
    end: '03:59.000'
    original: 平成レトロみたいな感じでございます！こちらも付けてください！
    english: It has a Heisei retro vibe! Please wear this too!
  - start: '03:59.500'
    end: '04:04.500'
    original: そしてボイスも出ます！ボイスはこちら、ジャーン！ASMRボイスです！
    english: And we also have a voice pack! The voice pack is this, ta-da! An ASMR
      voice pack!
  - start: '04:04.500'
    end: '04:11.000'
    original: 『彼シャツポルカの、ただいまの距離。』
    english: '"Boyfriend-Shirt Polka''s ''I''m Home'' Distance."'
  - start: '04:11.000'
    end: '04:16.000'
    original: ちょっとタイトルもなんか狙ってる...エチコンの天下！やめてー！
    english: The title is kinda deliberate... Erotic content dominance! Stop it~!
  - start: '04:16.000'
    end: '04:23.000'
    original: なんで今日同期呼んじゃったんだろうっていうのを一瞬思った、今恥ずかしくなってきた...
    english: I suddenly wondered why I invited my genmates today, now I'm feeling
      embarrassed...
  - start: '04:24.000'
    end: '04:33.000'
    original: 添い寝ASMRということで、抱き枕カバーとイラストの関係があるシナリオになってます！
    english: It's a sleeping-together ASMR, with a scenario connected to the body
      pillow cover illustration!
  - start: '04:34.000'
    end: '04:41.000'
    original: そしてお待たせしました！フルセット購入特典になっております！こちら！チェキ風ブロマイドカード！
    english: And thank you for waiting! Here is the full set purchase bonus! This
      cheki-style bromide card!
  - start: '04:41.000'
    end: '04:46.000'
    original: 数量限定が直筆メッセージ、箔押し複製サインになっております！
    english: The limited-quantity version comes with a handwritten message and foil-stamped
      duplicated signature!
  - start: '04:46.000'
    end: '04:51.500'
    original: 通常が箔押し複製サインとメッセージ入りでございます！
    english: The regular version includes a foil-stamped duplicated signature and
      message!
  - start: '04:51.500'
    end: '04:59.500'
    original: フルセットぜひぜひ買っていただいた方には、特典ボイスとして「すやすやポルカの、いちばん広い約束。」
    english: 'For those who buy the full set, you get the bonus voice: "Sleeping Polka''s
      Broadest Promise."'
