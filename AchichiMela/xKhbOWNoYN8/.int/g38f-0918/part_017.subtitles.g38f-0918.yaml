  thoughts: |+
    **A Deep Dive into Chaotic Co-op and Questionable Acoustics**

    Alright, let's break this down. First, it's that familiar buzz, the anticipation of a VTuber co-op, most likely something like "Lethal Company" but this indie extraction horror game has a style like "Pilgrim" and a few other similar games. The UI is pretty close to "Content Warning" or something like that. I'm focusing on the dialogue for subtitles and a good transcription. I need to identify the members. It's tough, though. At first glance, I thought I heard Ryushen, then Amamiya Kokoro...but wait, the cyan-haired character isn't any of them. Bottom right, let's see. Kaida Haru? No. Amamiya Kokoro? Nope, not Lain or Yuuhi Riri either. Let's look at those tiny avatars! Orange hair, Ratna Petit? Sophia Valentine is there! Who is this cyan-haired character? Ryushen? No, it looks like Sasaki Saku, maybe? Shiina? Nope! That's it! Wait...I hear "わし" ("washi")? That means I need to adjust my thinking, 400 years old? Is this someone from Nijisanji? Hakase Fuyuki? No, it's not. Let's dig deeper: "わし" and "のじゃ" (noja)... I have to remember this is Nijisanji... Sophia Valentine is here from Idios! Kyoko? Or maybe Meruto from Idios? Is that even Kyoko? Wait, it says "KYOKO" on the screen! Meruto is here too, "メラちゃん" ("Mera-chan")! Ok, so we have Kyoko, Sophia and Mera. But that other voice...Who is this Cyan Haired Girl?

    Okay, the goal is transcribing audio.

    First, "て？" and "そう", and "強っ!" It's like, "What? Yeah!" "So strong!"

    Then there's a super deep voice. "え、超持って" and someone says "それで持って叩きつけて倒すとかができるようになるっぽい じゃん". It sounds like "You can grab it and smash it to defeat them!" followed by "かっけー!" and "すごーい!" "So cool!" "Amazing!" and someone wants to try it, "やりたー".

    Next, a purple orb... "え、何これ？" / "何これ？" / "何これ？" Then, "え、ヘリ動かす？" "Is there a helicopter?" and "ヘリウムガス？" Then it's like, "Helium?" Then "今ヘリウム高いですからねー" "Helium is expensive right now." Then the game has high stakes with "高価なんじゃない?" and "うそーん!"

    Then there is a question of whether it should be put into the storage, "え、入れとく？" and then "入れていいよって". Now "え、誰のこっちの声?" and now multiple "入れて、入れて". Then another "あ、入れて"

    Now, "おおー！ お、よしよし" then "え、超良いんだけど!" "ね!" and "これ多分元の価格も高いんじゃない？じゃあ" "It may also have an expensive price point" and "高くなる" "It gets higher". Then it's Kyoko's turn, "今日子、そっち側で", it must be "Kyoko, over there," but I can't quite get who Kyoko is. "え？" then, "パトロール開始！" "Start the Patrol!" Then "あ、こっち回りたい!" and "最強タッグのヒーローポーズ!"

    "背後すごい抜けるな" someone says, "They get behind us quick" then "なんかみんな居残って感じ" "Feels like they are staying",

    Next "え、ソフィアもうやばいんじゃない？ めっちゃ高いんじゃない、これ" Sounds like "Oh Sophia, you got crazy high, this thing is pricey"

