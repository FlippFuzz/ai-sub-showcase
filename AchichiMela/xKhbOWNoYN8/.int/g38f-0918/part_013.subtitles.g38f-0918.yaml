    **A Chaotic Extraction: My Thoughts**

    Alright, let's see, we're diving into this *REPO* extraction game with some Japanese VTubers. My initial thought? Subtitles are a must. The screen shows the objective: "FOCUS: Fill the extraction point with valuables." Got it. We're hauling some alien samples, dodging "THE BROKEN ONES" in the "DISPOSAL ARENA," and aiming to be "KING OF THE LOSERS!"

    First, we hear "Ah, this way?" and then "Looks good, right?" Yellow thing is spotted. “Whoa! Isn't there something? Ah!” We come across an item, someone is asking, “So there’s this kind of item this time? Is this it?” It's worth 20,000, so help me out! A big one! Let's go together! Got it. There's a big one, you know. Someone agrees, “Yeah." It's arcade cabinet sized. Tough to carry, this. Maybe two people will do.

    "Oh no, oh no, oh no!" "Let's haul this out before it comes out!" “Hauled it. Like an alien sample or something…”. Okay, question: will this fit on the cart? “Impossible--no, wait, we might be able to put it on! Wouldn't it be better to load it onto the cart?” After some struggling, success. "Oh, it went on! Didn't it work?" "But something's coming!" "Something's coming! Something's coming!" "Behind you! Eh, this? What is this?" A face-bug appears! “Is this harmful? I don't know this character, so I'm not sure.” "Oh no, it's flying! Oh no!" “Ah, but maybe it's harmless. It might just be cute. Maybe it's just cute.” Since I don't know, it's fine for now.

    Then, “Wait, hold on! No, no!" "There's something weird in the other room. Something weird is in the other room." "Wait, it sucked so much out of me! Sucked so much!" "Ah, did your HP get drained, perhaps?”" I'm thinking, "Hey, maybe we should bring it along. Because in the other room, there was a weird, big-eyed enemy!" "When carrying this you can't see ahead, it's bad." Should we head back towards everyone for now? "Ah, oh no, oh no, oh no!" I’m going the other way, "Ah, an enemy's there! Something, there are so many!" "Ahhh! Wait!" “Isn't there something huge? Isn't there something huge?” "Everyone, run away quickly!" "No, something's... no!" "Wait, oh no, oh no! Should I close the door? W-Wait!" Green explosion!

