  thoughts: |+
    **A Deep Dive into Duolingo and Verb Conjugation with a Japanese VTuber**

    Okay, so I was watching this clip – it's Amamya Kokoro, or maybe it's Achichi Mela? No, it's Mela! – doing some Duolingo lessons.  I decided, I'll provide subtitles, naturally! First things first, get those timestamps down *precisely*. I transcribed everything the best I could, and here are my thoughts, as the clip went on:

    Right from the beginning, she's talking about kicking chairs in theaters – "Kicking is not allowed," so rude! I transcribed that, made sure the English was natural. I saw a comment in chat saying “I'll push your chair.” That’s not cool either! I’m going to make sure to transcribe “Throw the ball” and the like, as well.

    I heard her, or the Duolingo TTS, that the start of sentence, with a verb and a “!” means “imperative.” Interesting. She then does some examples. Then, I heard "Max can't swim." Ok, here it comes, the trick. "He can't... play" or "plays" and suddenly the grammar became clear! No “s” after “can’t”! I was on the right path! After "can", it's *no* "s"!

    I was feeling pretty smart, I'd get the "s" thing, or not get it! I remember now, it's the “auxiliary verb” rule. "Can't" and "will" are auxiliary verbs. I get it!  I'm basically understanding grammar without even knowing I knew it! I must be really good at this.

    I'm thinking I understand mahjong, a bit, maybe. Then, she has some more duolingo lessons: "She can throw and catch very well." And "She can't throw a ball." She is really talking about "s" or no "s". That is why! This lesson is all about "can" with verb conjugations.  "She throws the ball" vs "She can throw the ball." Then the ball, being thrown far. Then, there it is! "Lisa can throw" - no "s"! The Duolingo lesson is showing me the *when* to use, or not use, the 's'. I get it, I get it!

    Then Duolingo asks "Can you kick this ball?" And "Is Tom good at football?" I get all of it! This is good stuff. No, great!


