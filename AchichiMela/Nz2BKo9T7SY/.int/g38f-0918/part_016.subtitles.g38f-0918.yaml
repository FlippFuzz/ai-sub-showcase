  thoughts: |+
    **My Culinary Musings and Preferences**

    Okay, so the temperature is just super high, like, my fire is so intense, it would just burn everything away! If I were to cook with my flames, *poof*, it would disappear, yeah, just like that. It's blue fire, super hot!

    What about donuts? Yes, I *love* donuts! If I cook them, they become charcoal but I still love donuts. But let's talk about more than that! Tomato? No! Ketchup? Yes! I *can* eat ketchup, but definitely *can't* eat tomato. So carbs and meat only? Yes! I do like rice. But no tomatoes, no vegetables! Ketchup, though, is okay.

    Someone asked, "Melachi, do you like fish dishes?" Uhm... a little. I like salmon! I like salmon a lot! Ketchup or tomato in pasta? Ketchup! I really like ketchup. Salmon is kinda scary, but I like salmon anyway! Back in Edo, what did I eat? Fish! Fish and rice!

    Pizza? Do I like pizza? "Melachi like pizza?" Yes! I love pepperoni pizza! It's because pepperoni pizza doesn't have vegetables! Pizza in general is good but pepperoni specifically doesn't have those veggies, right? Margheritas sometimes have tomatoes. But pepperoni pizza? No veggies! So, I can eat it! No onions either. Yeah, pepperoni pizza doesn't have them, so I can eat it!

    So, yes, margherita pizza has tomatoes which are a no-go. Onions, are you sure those aren't in the pizza? The tomato on pepperoni pizza is ketchup! Pineapple is a no-go, because it's a fruit and I can't eat fruits or vegetables. I don't like fruit, no fruits! But I can tolerate strawberries on cake barely. I don't have allergies. I'm a picky eater. I don't like strawberries at all!


