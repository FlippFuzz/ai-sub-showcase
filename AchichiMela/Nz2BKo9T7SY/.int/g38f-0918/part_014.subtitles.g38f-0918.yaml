    First, I heard a Duolingo chime, a bit of silence, and some music. Then, the VTuber says “よし,” which I would translate as "All right" or "Okay." Next, the Duolingo voice asks, "Where can we do yoga?" I transcribe that, too.

    The VTuber then has a longer section, a monologue, so to speak. I need to be extra careful there, break it down: "でも思うけど、子供は気配りなんて使わなくていいのじゃ、本当は。" It is roughly, "But you know, honestly, kids shouldn't have to walk on eggshells." I am trying to capture the nuance. I will translate "本来ね。" to be "In an ideal world, anyway." Then, "本来 子供は気を使わずに やりたいことを主張していくべきなのじゃ" is the main point: Ideally, children should assert what they want to do without worrying about others. It will be helpful later to include the tone and mannerisms, using something like "のじゃ."

