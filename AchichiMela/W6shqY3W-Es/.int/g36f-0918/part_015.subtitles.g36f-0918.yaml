  thoughts: "**My Thoughts on Humanity, Time, and Language**\n\nOkay, so I'm watching\
    \ this video and, well, my mind is wandering, as it does. The VTuber, she's talking\
    \ about humans, and it's got me thinking. It's cute, you know? And kind of… foolish,\
    \ in a way. But that's part of what makes them interesting, I suppose. It's that\
    \ they worry so much.\n\n`00:00.000` - `00:06.200`\nI wonder why? Then it hits\
    \ me, this feeling I often have, that it's probably because they have so little\
    \ time, it’s like, `00:07.100` - `00:29.800`\n\nI mean, `00:32.400` - `00:44.800`\
    \ They're only around for maybe eighty years, and they age, and there are things\
    \ they can only do when they're young. Their time is finite. That's probably it.\
    \ That's why humans are always worrying. They're afraid of losing time. If they\
    \ had infinite time, they probably wouldn't worry.\n\n`00:45.800` - `00:59.800`\
    \ \nI just sit and watch them, and I think that’s why they worry so much. And\
    \ then I started to wonder, like, how long do *I* have? I don't know, since I've\
    \ never met another salamander before, and I don't know how long I can live, but\
    \ it feels like there is more time for me. I can keep going for much longer than\
    \ most humans, `01:07.200` - `01:12.800`.\n\nThen, I was asked to discuss about\
    \ a net meme. So, I saw the VTuber mentions \"Kami-gatou\" [God-thanks]. It makes\
    \ me laugh, to hear the words and how it sounds so silly. \"Kami-gatou\".\n`01:19.200`\
    \ - `01:35.500`\n\nIf there's a \"Kami-gatou\" comment on Niconico, there’s a\
    \ chance it’s me. It's so silly, but it's an amusing, cheap, and stupid way to\
    \ say it. And the contrast, like that's so ridiculous. That's what I love about\
    \ it, `02:00.500` - `02:11.500`\n`02:15.500` - `02:29.200`\nYou know, words used\
    \ in daily conversation have a charm in being slightly corrupted or broken, and\
    \ that makes them funny. I just think that's funny, and this low-IQ vibe is really\
    \ great.\n\nThen there was this question. Someone wanted to know how to express\
    \ positive feelings toward your favorite. And I got to thinking about this obsession\
    \ with \"verbalization\" nowadays.\n\n`02:55.300` - `03:00.800`\nThis kind of\
    \ expectation to verbalize, to articulate everything… It's like, it has that feeling\
    \ that \"it's amazing\", or \"putting things into words is cool,\" you know? But\
    \ I don't think it's always the best thing.\n\n`03:27.200` - `03:30.800`\nI don't\
    \ think verbalization is always superior. When you put emotions into words, you\
    \ kind of… define them. `03:40.000` - `03:54.800`\n\nI feel like you lose something.\
    \ There's this sense that you have all these complex feelings, and when you try\
    \ to explain them, a lot of information gets stripped away, and it's bittersweet.\
    \ You're trying to share, trying to record it so you can remember it. But that\
    \ raw excitement… that feeling that makes you want to cry, or give you goosebumps,\
    \ all that passion, the nuance gets fixed, and is lost `04:38.200` - `04:47.000`.\
    \ And I think it's impossible to express an emotion 100% accurately with words,\
    \ so the feelings, the nuance gets lost. Words are good, sometimes but. `04:47.500`\
    \ - `04:59.000`\n\n\n"
