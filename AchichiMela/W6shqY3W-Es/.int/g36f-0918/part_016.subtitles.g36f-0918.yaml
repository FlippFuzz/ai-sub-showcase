  thoughts: "**Marshmallow Messages & My Musings**\n\nOkay, here’s how I'm thinking\
    \ about this, as a fellow expert. I’ve got to get those subtitles right, Japanese\
    \ transcription, English translation, timecodes - precise and clean.\n\nFirst,\
    \ it’s about those marshmallow messages, and this VTuber's thoughts.  \"I don't\
    \ necessarily think it's a good thing, because I don't.\" But, if you *feel* like\
    \ you must express something, then do it. If you want to say someone is cute,\
    \ do it. I think those feelings that you *don't* say, can be very precious. Sometimes\
    \ expressing yourself is a personal need. I do feel like I'm compelled to share.\
    \ However, if it's not absolutely necessary, let them be unsaid. Even though,\
    \ it's really nice to hear kind words and compliments.  Of course, it's better\
    \ to do them only if you want to. And I don’t think you *have* to, if you don't\
    \ *need* to. Sometimes sharing is better, but there's no need to force it. It\
    \ is exhausting.  \n\nThen, there was the discussion on 'Salamander' (so sad -\
    \ must protect!) and the discussion on the Kamen Rider shows (like, *W*, *Decade*,\
    \ *OOO*, *Fourze*, and *Wizard*).\n\nFor the Duolingo streams: I’m *definitely*\
    \ making a conscious choice to wake up early for these. I usually wake up around\
    \ 10, but I'm up at 6 for these streams. \n\nAnd, then the 'Mera-gumi' question.\
    \ I really want to be some kind of a catalyst. I want to be someone's spark. I\
    \ want them to look at me and be like, \"I can do my best because you're here.\"\
    \ I want to assist them with their lives. I want people to get positive feelings\
    \ out of it. However, if people become *overly* obsessed, that's sad. I'm hoping\
    \ to be *your* blessing, and that good things start happening because of me!\n\
    \nFinally, for the voice work question. The goal is no stress. The audio is the\
    \ same as the audition. I think this way about *everything* I make, including\
    \ my art. \n\n\n"
