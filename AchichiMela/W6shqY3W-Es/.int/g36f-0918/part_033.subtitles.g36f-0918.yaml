  thoughts: |+
    **My Thoughts on Recent Events**

    Okay, here's what's been going through my head recently. First, that "festival is impossible." Then the video starts! I am now thinking back on my recent experiences as a VTuber. I remember not having any obvious strengths when I started. I got a little panicked, "Oh no! If I don't do something, I'll get buried!" I thought to myself "Then I'll just acquire new skills!". If I could master those skills before my debut, I'd be irreplaceable. When the fans saw it they would surely think I'm amazing, so that was my plan. I've got to tell you, constant drawing was tough - always wondering when it would end - and I questioned, "Am I really a VTuber?" I also thought, "Isn't this just being an animator?" But, looking back, it was fun, so much fun.

    I realized I just love making things. I am one that enjoys creating things and the sense of accomplishment is really awesome when things are done, which makes it fun. To top it off, I got way more praise than I expected. I was really praised! I mean, there are lots of senior VTubers that draw a lot, and nowadays so many VTubers do animation, so I kind of went in thinking it was not that rare, but then I got so much praise I was laughing on the inside - I mean, thank you so much! It felt amazing! Being praised, it was great! Thank you so much!

    Because of that I worked hard drawing for about ten hours a day for two weeks. It's like 70 hours in one week and 140 hours in two weeks. Okay, no, I didn't literally draw for 10 hours a day every day, but it feels like it was that much.

    Sometimes people ask me, "Honestly, do you regret adding a sentence-ending particle, or do you think you will?" But I don't really get what "adding" means. As I said at the beginning, the first human I talked to used that kind of speech, so I've been doing it from the start. Just so you know, I have zero regrets about it at all. I don't really get "adding it" since it was like that from the start. I've never disliked my own way of speaking. I love it! Since I love it, I'll keep doing it forever!

    Someone wrote, "I'm a father with an only daughter who just got a job. I get the impression your father is happily watching over you, but also worried. It's been 2 weeks since your debut, have you spoken to them?" Oh, we talk all the time! We talk a lot and meet up a lot! I've seen my parents about three times in those two weeks. My mom cooks food for me and delivers it! My dad is really good with PCs, so he sets up my computer and does all sorts of stuff for me. He does! I feel like my dad is not worried that much. My mom seemed a little worried, but my dad seems really to be enjoying it!

    He seems to enjoy watching my streams. Ever since I moved out and became independent, my parents lost their hobbies and seemed lonely, but since I started streaming, they've been watching my streams together! They cast YouTube onto the living room TV and watch my streams! Apparently, they eat dinner according to my stream schedule, so it seems like they really look forward to watching. And my dad...


