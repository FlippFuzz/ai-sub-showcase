  thoughts: |+
    **My Thoughts on Marshmallow Questions**

    Alright, let's break down these thoughts. First, there's a certain... reluctance to reveal personal academic performance. It's a bit embarrassing to admit that my average scores on a 100-point test were somewhere between 20 and 40. Clearly, I wasn't exactly a model student, I didn't study very well. Definitely, failing grades, right around that level. And yeah, I was at the very bottom of my class. Although, since class rankings weren't posted, I couldn't be sure of the exact lowest ranking. But I think I was probably at the very bottom.

    As for practical advice, when it comes to phone usage I’ve considered some options. When I end up playing on my phone, I recommend that they put themselves under surveillance. That is, have a friend or family member phone call you, or do a study session. It is good to have someone keep an eye on you. You do your best, work hard on your studies.

    Now, about "gachikoi" fans. Humans developing romantic feelings... it's not something I see as controllable. I don't really mind it, but I’ve been thinking about romance, and it's a powerful emotion that makes emotions swing up and down wildly. Based on my studies, I've heard stories that humans get their emotions completely ruined and lose their minds because of romance. If it's in moderation, that's fine, but if it goes too far, they might deify me and lose sight of their surroundings, or reject others of the same bias or become hostile.

    People can get irrational from romance, so I don't recommend it. It's painful because people get consumed by their emotions and lash out. I'm not saying it's intentional. I've also heard that losing control of your emotions and attacking other humans isn't good. I don't recommend that kind of behavior, if you've become that way, I hope you can live without suffering as much as possible.

    Regarding lurkers, I get a lot of satisfaction from people who appreciate my streams. If someone tells me they fell in love instantly, that’s great, but that the person is a lurker, I'm happy about it. And regarding lurkers, I don't think lurking is bad, I think it is the default. Since I’ve never commented on the streams of streamers I like, lurking is the default. In terms of internet literacy, lurking is actually pretty proper. On forums and such, it's generally better not to post. Basically, I consider that to be the default, so I'm really happy. Rather, thank you for supporting me. I'm thinking its personal preference, and I'm grateful to both sides!

    As for, "A salamander who says 'I love humans!'" "What part of humans makes you feel most passionate? Conversely, what moment makes you think 'This isn't very human'?" I've never thought of a human as not being human-like. That's because I'm not a human myself...


