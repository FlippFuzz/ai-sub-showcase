  thoughts: |+
    **A Deep Dive into Self and Connections**

    Okay, here's what's been running through my mind. I'm looking at this drawing, and it's me, my core, my inner self. If this is truly *me*, this central part, my core, is the essence that doesn't change no matter what. The squiggly bits around it? Those are the external things—horns, a tail, how cute I am—the superficial stuff. This outer layer is physical appearance. The round part? That's more like personality. What's central, that's what's core, and that's the part that is similar between Kyoko and me.

    Kyoko and I, even though our circumstances are different, our souls have a similar shape. I feel like we connect on a fundamental level. Talking with her before my debut, she was the person I felt was the most like me, out of everyone I've met. After 400 years, she's the first person I've met that's so similar. It's like we might be long-lost sisters, or maybe, she's a salamander too. I don't know, but at least that is what I think. I think she feels the same. I like Kyoko. We're similar.

    And the rest of the Asobi Mawaritai members? It's like I didn't have anyone like them during my student days. If I had met these people back then, my life could have been different. If I had met Kyoko then, I might not have even joined Hololive. She has the potential to be a key person in my life.

    I was supposed to read 100 marshmallows! But oh well, talking about Asobi Mawaritai is good. That's what I like about them.

    Now, someone asked whether I identify more with salamander life or human life. I've prepared a timeline for that, though the age calculations are a bit off. In my mind, I identify with human life, but strictly speaking, I am a salamander. I lived as a salamander, but then I touched a smartphone in 2006 (or so I recall), coming down from the mountain, and decided to live in the human world. I was living alone in the mountain, fighting bears. So for about 20 years I've blended into human society. Body is a salamander, but my heart is human.

    So, if asked which it is, it's both. If this is salamander life (from 0 years old to 415), the last 20 years are my human life. So, the answer is both salamander life and human life are contained within the whole. Either is fine.


