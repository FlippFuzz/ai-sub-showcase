    **My Thoughts on the VTuber's Conversation**

    Okay, here's how I see this: I need to get accurate subtitles for this Japanese video. Let's break it down into manageable segments and translate them. The first part is pretty straightforward; the VTuber starts by acknowledging the viewer and their question about music. The viewer likes band music but is new to Vocaloid, and wants some beginner recommendations.

    The VTuber, in answering the question, thinks aloud, clearly leaning towards Vocarock. They mention if the person likes SAKKAC CRAFT by Tsumiki, there are similar songs. They then consider recent, mainstream artists like LiSA, and suggest songs such as “Shadow” that she provided, which they think the viewer might like. Then they shift back to Tsumiki, remembering other provided works such as “Misconduct” and “Idolaholic” by Kiika-show.

    Going further, the discussion flows to Vocaloid artists and they land on kemu, or rather Jin and kemu (I agree that those are classic Vocarock). They're reminiscing about the early 2010s Vocarock era as being the best. The mention of “Invisible” by Riria also comes up, which would be good suggestions in that style.

    Then there's a quick shift because the VTuber is getting towards the end of their stream, noting they only have a few questions left and it's getting late.

    A new question comes in about making self-made anime. They reveal that it took about two weeks. They consider showing the process, starting with the storyboards (drawing some examples), then talk about writing the script. They describe figuring out the overall flow and how many cuts there are in total (around 40-50). They reflect that they were drawing about 4-5 cuts a day. The VTuber recounts how it was like being completely absorbed in art during those two weeks; not just for work, but questioning their very profession.

    Reflecting on those intense two weeks, the VTuber says they were drawing for more than 10 hours daily. In doing that, they'd complete 4-5 scenes on some days, maybe more if they were shorter. They mentioned it was their first time doing animation, so learning how to depict movement took lots of trial and error.

    The summary of the work concludes, they essentially had no life outside drawing, even meals. They mention it was scary because it seemed like there was no end. The person also mentions they were inspired by others with obvious talents to try it.

