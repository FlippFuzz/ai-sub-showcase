  thoughts: "**Meracchan's Thoughts on Communication and Self-Disclosure**\n\nOkay,\
    \ here's the deal, I'm thinking about how people think, not just skills, but more\
    \ fundamental concepts. I'm Meracchan, and here's my mindset:\n\n\"Washi\" and\
    \ \"noja\"? Yeah, it's about the people you're around. I picked it up from someone\
    \ who influenced me way back when I was a salamander. If your parents talk like\
    \ that, you probably will too. It's just how it goes.\n\nThis mask I'm wearing?\
    \ A gift from a human I saved from a fire. We were close, real good friends. \n\
    \nBeing a salamander wasn't always easy. Like, I can't sit comfortably on the\
    \ train because of my tail! If I put my tail to the side on the train, I might\
    \ bother people, so I stand. I hate it.\n\nBeing a VTuber is great! I get attention\
    \ from humans! I am not alone anymore! It's satisfying to be part of Asobitai\
    \ because I have friends now, and I love talking, especially in a one-on-one way.\
    \ I love self-disclosure! It's my hobby. In streams, I can open up without any\
    \ worries. Meragumi loves that. It's a win-win, you know?\n\nInterviews are amazing\
    \ because I get to talk about myself.\n\nGundam? I am not up on the classics.\
    \ I did watch *Gundam Build Fighters* and *Build Fighters Try*! I enjoyed watching\
    \ those, they were really fun. Beargguy-san was so cute! I even made a Beargguy\
    \ plastic model kit. I bought the Qubeley Papillon, but I don't remember building\
    \ it.\n\n\n"
