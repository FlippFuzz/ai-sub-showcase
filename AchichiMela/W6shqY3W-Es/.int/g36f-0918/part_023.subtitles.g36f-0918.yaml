  thoughts: |+
    **My Thoughts on Connection and VTubing**

    Okay, so I've been thinking about this. When you're watching something, if you don't like it, you can just stop watching. Easy peasy. But it's not like that with friends, or even coworkers. You can't just cut them off if you don't mesh well, right? There are so many obligations and reasons why you can't just shut someone out. Even if you don't like someone.

    But VTubers, streamers, entertainment... that's different. If it's not working, you can just *stop*. You can even filter it out of your life. It's low-pressure, a low barrier to entry. This is why I think the VTuber culture is so great. It's a safe space with a good sense of distance. If you like it, you can stay. If not, peace out.

    I was thinking about how I want to "give back" to humans. It's really hard to create a truly healthy and satisfying life for everyone. There's a lot of luck involved. The environment, what you had available in your upbringing, personal effort, all these factors come into play. It's difficult to manage for others, and I can't really control anyone's lives. I'm just streaming. But I realized that *the existence* of a VTuber with this mindset might be important. Just knowing that there's someone out there who cares, who wants you to be happy, even if you're struggling, could be a source of hope.

    If things aren't working out, at school or work, if you don't feel like you have a safe space, I want you to know: there's a salamander out there who cares about humans. I love you, and I want you to live as happily as possible, and I really hope I can be a catalyst for happiness. That's why I wanted to become a VTuber.

    It's long, but in the end, I love humanity and I am here to help.


