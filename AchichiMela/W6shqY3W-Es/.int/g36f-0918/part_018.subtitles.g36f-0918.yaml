    Now about me making art! "You've shown self-made videos and art since your debut... What made you start drawing? Please tell us!" I think a lot of people will relate to this... Um, I wanted a profile icon. Yeah, I wanted a Twitter icon. Don't you want an original profile icon? Don't you want an original Twitter icon? I really wanted one... but commissioning someone costs money, right? I had an allowance, but commissions were expensive... It was too expensive, so I started drawing them myself. I started drawing simply because I wanted an icon.

