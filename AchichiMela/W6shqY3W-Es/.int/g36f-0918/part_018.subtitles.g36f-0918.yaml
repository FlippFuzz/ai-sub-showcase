    If a scandal did erupt, I would sincerely apologize in pure polite language. I mean, in ultra, ultra-formal Japanese. In fact, I'd speak only in formal Japanese for a while after that... For a serious apology, I wouldn't say things like "noja". It's like using formal language in a job interview or speaking politely in an official setting.

