    Next up, someone’s asking about my English streams.  I *want* to do English-only streams. I'm building up my confidence in English, and I practice with Duolingo every Wednesday. I want to do it, but I want to be *good* at it first. It might take some time, but I really intend to do it eventually. Kyoko is so impressive, streaming *only* in English!

