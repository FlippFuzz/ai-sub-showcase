responses:
- subtitles:
  - start: '00:00.080'
    end: '00:01.300'
    original: 長命種にとっても憧れています。
    english: I admire long-lived creatures.
  - start: '00:01.400'
    end: '00:04.530'
    original: めらちゃんから見た人類ってどう見えているんですか？
    english: Humans look to us, from my perspective? Hmm.
  - start: '00:04.530'
    end: '00:06.180'
    original: 人間ってさ、寿命短いからさ？
    english: Humans are so short-lived, right?
  - start: '00:08.060'
    end: '00:08.560'
    original: 人間って...
    english: Humans...
  - start: '00:09.680'
    end: '00:10.530'
    original: よく悩んでる。
    english: Well, do they worry a lot?
  - start: '00:11.230'
    end: '00:12.750'
    original: 人間ってよく悩んでる。
    english: Humans worry a lot.
  - start: '00:13.920'
    end: '00:17.380'
    original: なんで悩んでるのかなって思ったことがあったんじゃが。
    english: Why do they worry so much? I've wondered that before, though.
  - start: '00:18.840'
    end: '00:20.310'
    original: 多分人間はさ、
    english: Maybe humans...
  - start: '00:20.310'
    end: '00:22.310'
    original: 残された時間が少ないから？
    english: have so little time left?
  - start: '00:23.630'
    end: '00:26.500'
    original: 人間って寿命が短いからさ。
    english: Since humans have short lifespans...
  - start: '00:28.010'
    end: '00:30.820'
    original: 80年ぐらいしか生きないんじゃろ？
    english: They can probably only live about 80 years.
  - start: '00:32.480'
    end: '00:36.570'
    original: で、その、でしかも老いるからさ、
    english: And because they age and die...
  - start: '00:36.770'
    end: '00:39.940'
    original: 若い頃しかできないこととかもきっとあって。
    english: There are things you can only do when you're young, for sure.
  - start: '00:40.910'
    end: '00:44.250'
    original: なんか多分有限だから悩むのかな、人間って。
    english: I guess humans worry because their time is finite, huh?
  - start: '00:47.380'
    end: '00:52.260'
    original: 時間が無限にあれば基本的に悩むことってなくなる気がするのじゃ。
    english: If you had infinite time, you probably wouldn't have much to worry about,
      I feel.
  - start: '00:53.690'
    end: '00:59.080'
    original: だから、なんか人間はよく悩んでるなって、見てて思うな。
    english: So, I look at humans and think, "Man, they worry a lot."
  - start: '01:01.320'
    end: '01:03.410'
    original: え、わしどれぐらい生きるんじゃろ？それはわかんない。
    english: I wonder how long I'll live? I have no idea.
  - start: '01:04.420'
    end: '01:07.130'
    original: 他のサンショウウオ会ったことないし。
    english: I don't know other salamanders, and I've never met any.
  - start: '01:07.130'
    end: '01:10.530'
    original: どれぐらい生きるかわかんないけど、でもまだまだいけそう。
    english: I don't know how long I'll live, but I think I can still go on for a
      while.
  - start: '01:10.630'
    end: '01:14.390'
    original: まだまだいけそうではあるのじゃ。
    english: I still have quite a bit of life left in me, you know.
  - start: '01:15.530'
    end: '01:17.370'
    original: めらちゃん、こんばんわなじゃ！！
    english: '"Mera-chan, good evening!!'
  - start: '01:16.490'
    end: '01:21.090'
    original: 最近知って気に入ったネットミームを教えてくだいなのは！！まずは、神がとう！
    english: Please tell me your favorite recent internet meme. First is Kamigatou!"
  - start: '01:21.390'
    end: '01:21.940'
    original: (笑)
    english: '*Laughs*'
  - start: '01:24.360'
    end: '01:25.790'
    original: 神がとう、神がとうめっちゃ好きなんだ。
    english: I really love Kamigatou, but...
  - start: '01:26.540'
    end: '01:32.490'
    original: あのさ、あり、あり、ありがとうのさ、ありの部分を神にすり替える。
    english: You know how Arigatou has "ari"? Well, they replace that with "kami"!
  - start: '01:32.490'
    end: '01:34.900'
    original: 神がとう、神がとうめっちゃ好きなんだ。
    english: Kamigatou! I just love Kamigatou!
  - start: '01:37.470'
    end: '01:42.020'
    original: ニコニコ動画で神がとうってコメントがあったらわしの中の推せあり。
    english: Like, if someone comments "Kamigatou" on a NicoNico video, that's hilarious,
      no questions asked.
  - start: '01:43.910'
    end: '01:49.030'
    original: かみ、神がとう。あの神、神がとう知らない？
    english: Kamigatou... I wonder if people don't know Kamigatou?
  - start: '01:50.010'
    end: '01:54.670'
    original: あれめっちゃ好きなんだよね。神がとうって言葉はめっちゃ好き。なんかバカっぽくてさ。
    english: I just love Kamigatou so much! It's so silly.
  - start: '01:58.330'
    end: '02:04.990'
    original: すごい、すごいなんか、なんだろう、チープ、チープさ？チープさとアホっぽさがすごいね、好き。
    english: It's got this super cheap, goofy vibe that I really, really love!
  - start: '02:06.960'
    end: '02:11.530'
    original: なんか、なんだろ、そう、ならんだろ、みたいな。あの言葉のありえなさ？
    english: It's like, "So-wa, Naranda-rou," that kind of absurdity in words.
  - start: '02:11.530'
    end: '02:22.020'
    original: なんか基本的に言葉って美しければ美しいほどいいけど、あの、日常使いする言葉って、そのなんか...
    english: Normally, you want your words to be as beautiful as possible, but...
  - start: '02:18.910'
    end: '02:29.620'
    original: 崩れてるところも含めて面白いみたいなところがあって、それが面白い。ちょ、そうそうそうそう、IQ低い感じがすごくいい。好きなのじゃ、神がとう。神がとうガチでおもろい。
    english: '...its brokenness makes it kind of funny, and I really like that low-IQ
      vibe of Kamigatou.'
  - start: '02:30.340'
    end: '02:32.180'
    original: やばい、まだ半分いってない。
    english: Wait, I'm only halfway through!
  - start: '02:31.960'
    end: '02:38.860'
    original: イラストも上手いし動画も作れる所謂マルチクリエーターじゃが、独学かの？独学なのだじゃ。
    english: '"You make illustrations and videos, so you''re a multi-creator, but
      are you self-taught?" "I''m self-taught!"'
  - start: '02:39.920'
    end: '02:49.770'
    original: 友達にVtuberを勧められた日に探してたらめらの初配信があってそこから推させていただいてます。自分は皆様みたいに推しの事可愛い！とか好き！ってなる気持ちが分からず言語化がなかなか出来ません。
    english: '"I want to tell a Vtuber I found recently that she''s cute and I like
      her, but I can''t put those feelings into words.'
  - start: '02:49.770'
    end: '02:55.330'
    original: 可愛いって言ってあげたい気持ちとなんか恥ずかしいなの気持ちで揺れています。こういう時はどうしたらいいでしょうか？教えてめらっち！
    english: I want to call her cute, but I'm also embarrassed. What should I do in
      times like this? Teach me, Mera!"
  - start: '02:55.200'
    end: '02:56.270'
    original: あ、これね、これ話したかった。
    english: Oh, I actually wanted to talk about this.
  - start: '02:57.260'
    end: '03:07.130'
    original: あのさ、なんか今のインターネットって、今のインターネットと今のなんか社会の風潮というか、って、なんかやたらと言語化が持ち上げられておりませんか？
    english: Nowadays, on the internet and in modern culture, it feels like everything
      is put into words right away.
  - start: '03:11.380'
    end: '03:19.460'
    original: なんか、すごい！みたいな。言語化かっこいい！みたいな、その、言語化って言葉もちょっと、ま、なんかミーム的な意味でわしゃ捉えてるけど。
    english: It's like, "That's amazing!" or "Verbalization is so cool!"—well, I'm
      using "verbalization" in a meme sense here, but...
  - start: '03:22.140'
    end: '03:25.810'
    original: うん。けど、わしゃ別にいいと思ってない！
    english: Even so, I don't really think it's necessary.
  - start: '03:26.540'
    end: '03:30.820'
    original: 必ずしも言語化が優れているとわしゃ思わないのじゃ。
    english: Just because something can be put into words doesn't mean it's superior.
  - start: '03:31.390'
    end: '03:41.370'
    original: え、なんでかっていうと、言葉って、言葉って、なんか...
    english: Because once you put a feeling into words...
  - start: '03:41.770'
    end: '03:55.270'
    original: で、感情を言葉にするってさ、必ずしもいいことだと思ってなくて、しないほうがいいものも絶対あると思ってて、言葉にしちゃった瞬間に情報がそぎ落とされるのじゃ。なんか、いろんな感情を持ってるはずだろ？
    english: Just because you turn an emotion into words doesn't mean it's a good
      thing; sometimes keeping it unsaid is better because putting it into words strips
      away other information.
  - start: '03:56.120'
    end: '04:10.510'
    original: いろんな感情を持ってるのに、感想とかにした瞬間、その言葉で書いた以外の情報が自分の中 からどんどん抜け落ちていく感覚があって、それがすごい切ないなって思う。
    english: Even though you have all these feelings, the moment you summarize them
      into a conclusion, you feel like everything else inside you slips away, which
      feels so heartbreaking.
  - start: '04:11.850'
    end: '04:26.790'
    original: ま、言葉にしたら記録に残せるから、いつまでも覚えていられるけど、いつまでも覚えていられるけど、その自分が体で感じた、そのすごい興奮したとか
    english: Putting things into words leaves a record so you can remember them forever,
      but...
  - start: '04:26.790'
    end: '04:38.830'
    original: すごい熱狂的にね、この自分の体の中からのそのじわっとね、なんか思わず涙が出ちゃうような、なんだろう、その鳥肌が立つような
    english: '...that burning, heartfelt emotion welling up from deep inside your
      body—'
  - start: '04:38.250'
    end: '04:54.340'
    original: なんか感動とか、そういうのってあるだろ？そういうのを言葉にした瞬間にそこがそぎ落とされちゃう気がしてて、そのニュアンスが固定されちゃう。
    english: —when you try to put those kinds of touching moments into words, you
      feel like the essence gets lost, and the nuance becomes fixed.
  thoughts: null
