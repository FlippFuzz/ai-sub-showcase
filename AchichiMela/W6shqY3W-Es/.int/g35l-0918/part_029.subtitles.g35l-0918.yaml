    **My Thoughts on Marshmallow Messages and Proseka Preferences**

    Okay, so looking back at that video, I was thinking about how I might have come across the whole Hololive thing. It was probably a teaser that got my attention originally, I think. And yeah, "Our Bright Parade" was the catalyst, that's what made me audition. Without that spark, I still think I would've aimed for Hololive eventually, but it wouldn't have been now, and it wouldn't have been with the "playing around" mindset that I have now. My debut was really about wanting to have fun. It's a matter of timing, not if. Being happy and super thankful for having been able to debut and I love how it happened. That said, I'm not the one who decides my generation mates or how my debut will go; that's just a random, fun element. I'm glad Ushi feels that way.

    Then there was that random question about repeating myself. It's a habit, totally unconscious! I didn't even realize I did it, you know? When I was looking through clips, I was like "oh, I say that a lot", but I don't realize it while I'm talking. So it's not intentional, and it's not important. It's just a tic I can't control. I'm not sure why my brain does it, but I only notice when I watch the recordings later.

    And as for Proseka, someone wanted to know which character's event I was running. It was Mafuyu! And that prompted some thinking about my favorite songs. Picking favorites is difficult, you know? There are songs you like as Vocaloid tracks, songs you like when sung by a vocal synth, and then songs when the voice actors sing it. In Proseka, the one that stands out to me is "Stage of Sekai", especially when the voice actors are singing it. It just *fits*. I also like "Stella". The Vocaloid versions, that's difficult.



