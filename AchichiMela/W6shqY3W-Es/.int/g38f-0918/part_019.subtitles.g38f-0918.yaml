  thoughts: |+
    **A Deep Dive into a Streamer's Thoughts**

    Alright, let's get this done right. So, I'm watching this clip – it looks like it's from Achichi Mera, a VTuber, from looking at the visuals. The whole “honoo no kakurega” vibe is pretty clear. Now, where were we? First marshmallow pops up and someone wants encouragement for their middle school exams. Interesting.

    I’m thinking, “小学6年生！？中受じゃ、中受！” (A 6th grader?! Junior high exams, junior high exams!) – wow, that's intense. I guess it’s a lot of pressure, especially when you think about expectations, and… well, I didn’t really apply myself with exams myself. I did try to get into college, and wanted to get that done, but "コロナ入るまで" (until Covid hit), the world stopped, and it was hard. All those pressures of "受験" (exams) got to me. It's a lot, and completing it is amazing. I’d love to know what it’s like. I definitely admire people who can push through it.

    Then, there’s this other marshmallow asking, “When do you want the members of Mera-gumi to remember you?” That’s a good question. I hope people will remember the fun times they had. Like, I hope my fans still look back and think of me fondly, no matter what happens in the future. I want to be like something that becomes a part of their identity. Even if they move on, and are not watching me regularly, I hope that the experience was fun. It’s okay if people get busy with things, like exams, or middle school, or work.

    I keep my streams short because I think they are easy to watch, easy to catch up on, and I hope it helps. Although, who knows today might be different. Haha! I am at 56 marshmallows today. Yay! Someone asked about voices I like, a voice fetish. I love girls' voices – cute girls' voices especially. I tend to go for cute voices. So, yeah, that’s my preference.



