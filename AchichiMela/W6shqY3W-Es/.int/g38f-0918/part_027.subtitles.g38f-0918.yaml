  thoughts: |+
    **My Thoughts on Transcribing & Translating**

    Okay, here's how I'd approach transcribing and translating this Achichi Meia (めらちゃん) video, since she's answering questions sent to her. I need to make sure I get the timestamps *exactly* right.

    First, the initial question: How did I get into Hololive? Rather than really paying attention to the streams or clips, it was more like I found out about her from her songs or character designs. Yeah, I think I learned about them through creators who made related content.

    Next, a viewer asks if it's okay to post the results of the daily fortune-telling shorts on Twitter. Definitely! They can post the results. No need for tags, but if they want to, maybe `#achichimeia` would be a good one. It makes me really happy that people are doing them every day. I made those fortune-telling Shorts, wanting people to do it every day, so I'd love for them to test their luck.

    Then, there's a message from someone apologizing for mocking me in the past on drama threads. Seriously?! Oh, you really did that! That caused me to be traumatized, and it's your fault I'm traumatized! But it's okay, because, going through painful times has helped me to get to the point I am today. But still, it would be cool if beginners would be gentle with beginners.

    Now, someone who wants to be a freelance illustrator asks about getting commissioned. I'm so happy someone wants to work with me someday! They wonder if they should focus on a portfolio or drawing a lot of fan art. You're asking about my criteria for choosing creators! I should keep in mind that I'm talking about myself. I don't look at past work *that* much. I mean, I check a bit, but just doing a particular type of work isn't a huge deciding factor. Unless it's something special, like when I needed a design for a salamander's horns. In that case, I might look at previous works, but I would not avoid commissioning someone if they don't have a lot of previous work.

    I see pretty much all the fan art if it isn't shadowbanned. It's more about "compatibility". If I want something cute, I ask people who specialize in cute designs, or something cool, I ask people who are good at cool design. It's really useful for me if you have a distinct style or individuality.

    Okay, let's see. Someone is asking for an "intimate crush distance" smug face! Sure! I was going to tease them, but now's not the time! Oh, that marshmallow box is in the way. Maybe I can make it smaller? Hmm? Too close! Is this way too close?! Isn't this what "intimate crush distance" means? Oh nojaa! Ngh! Is it too close? Wait, what do I do?! I can't shrink back! Aaaah! I'm off-screen! Nojaaa...


