  thoughts: "**A VTuber's \"Exit 8\" Playthrough**\n\nRight, let me see... I'm thinking\
    \ I'll start with this \"Exit 8\" game today. The fans want to see the gameplay,\
    \ as well as my unmasked face. So, if you want me to take off the mask, I'm going\
    \ to need you all to give me a high-five! Grow the salamander with your love,\
    \ everyone!\n\nDid you all hit the like button? An odd number is what I need!\
    \ Even numbers won't work, they cancel out, alright good. Okay, with the support,\
    \ I think we're ready to begin! Yoisho! Okay, here we are! Noja! Right!\n\nWait\
    \ a sec, the sound... Is the audio coming through? Hm? I wonder if you can hear\
    \ that buzzing sound? A buzzing sound, right? Can anyone hear it? Some can, some\
    \ can't... Is this another anomaly? Hm, right. I wonder what the volume is. Like\
    \ the sound of the footsteps. I'll need to walk around to be sure. I'll have to\
    \ try and decide. \n\nAlright, did you hear that buzzing sound? Um, which way\
    \ is forward? This way, obviously. Is the sound quiet? This much? Loud? Okay,\
    \ try walking. Like this, yes? How's the sound? Is the first lap a reference?\
    \ Understood. Then I'll leave the volume around here. All right, let's begin!\n\
    \nThe rules are... Um, it seems like a memorization game. A memorization game,\
    \ a weakness of mine. You look at all these posters and things like Eight Dental\
    \ Clinic, the ceiling and the floor, you've got to look at everything and spot\
    \ the anomalies. Eyes. Security cameras. Gotta memorize... memorize what?\n\n\
    Wait, should I be trying harder? Employees only, Employees only. Electrical Room,\
    \ Electrical Room, Janitor Room, Fire Hydrant. Beware of fire! And? Memorize the\
    \ posters, too. \"Security camera in operation!\" What's this? \"MOVE FES,\" a\
    \ music fest. Um, \"MAKEUP\". Judicial Scrivener. Consultation? Uh, this is a\
    \ \"DOG SALON\". A dog? \"Now Hiring Part-Timers!\" The hourly wage is? 1,000\
    \ yen.\n\nHmm... Where exactly am I? Is 1,000 yen per hour fine? Is that acceptable\
    \ in this world? Eight Dental Clinic. There are more dentists than convenience\
    \ stores! Okay, let's go. Looks like I can run, too. I need to memorize the pictures?\
    \ Hmm, probably good! Let's just keep going for now!\n\n\"No Smoking\", Tobacco.\
    \ Tactile paving, ah yes. It says \"Keep Left\", got it, Keep Left! Let's see!\
    \ Heave-ho, heave-ho, heave-ho, heave-ho. Heave-ho, heave-ho, heave-ho. Noja.\
    \ There's a surveillance camera, too! Heave-ho, heave-ho, heave-ho.\n\n\n"
