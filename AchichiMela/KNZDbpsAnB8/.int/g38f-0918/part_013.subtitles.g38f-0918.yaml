  thoughts: |+
    **Alright, let's get this done!** I'm diving into this "The Exit 8" stream with the goal of creating some top-notch subtitles. Gotta nail those timestamps and translations, especially for this Japanese VTuber. I've memorized the basics after playing the game so many times already! "I won't miss anything now, I've memorized it!" I'm sure I can remember the rules. "Anyone would memorize it after doing this much". Even if I, as a salamander, am not so good at this, "I can totally do this!". Alright, ready to get started.

    *Peek*, *peek*, *peek*, *peek*. Floor's OK, right? "Floor OK, floor OK." And no smoking, right? "No smoking OK." Now, I need to check the mister's face. "Let me inspect mister's face, Show me~, show me." "Face OK!". It's fine, "Face is fine." Okay, now the back? "Back too?" Good! "Fine, he has his phone too". Alright. Let's move!

    "Eight Dental Clinic." Seen this many times. "Seen that lots of times". OK. "Part-time job recruitment!" "Seen it many times." Hourly wage is 1,000 yen, alright. "Ah!" Wait... "There's a face!" Hey guys, "Hey guys, there's a face!" I've totally seen this before! "I've seen this one before! There's a face--! There's a face, there's a face--!" "8--! 8, 8! Eight--!" Whew, time flies! Is it Exit 8? "We've arrived at number 8." Well then, I shall proceed forward. "I shall proceed forward." "It's a memory game after all." If there's no anomaly here... If there's no anomaly here... No smoking OK?

    Floor isn't shiny, right? Checking mister's face. "Check mister's face." "Mister's face looks fine." He's not looking at me. "He has his phone too". Back is OK. Good, good, good. August 8th OK? Part-time job recruitment OK? And... NEW OPEN OK? "NEW OPEN OK." Distribution board room OK? "Since it's the last one today, let's look carefully." Judicial scrivener OK? Yep. Makeup OK? "MOVE FES OK?" "Security camera OK." Since it's the last one, let me check carefully again. "Fire hydrant, yep." Janitor room, there are 3 doors, right? There are 3, right? "Staff Only, second room." There's one above too, nothing on the ceiling, nothing on the ceiling, "distribution board room is there", "it says Concourse", "Eight Dental is there", "closed on Thurs... Thursday and Sunday", "it's Eight Dental". Um... Part-time job... Hm?

    Aren't the posters kind of huge? Is that not a thing? Were they this huge? Was the balance like this? Hm? Was the balance like this? Isn't the spacing used differently? Was the layout like this? Aren't they the exact same size as the door? Just my imagination? Still, "But I feel like they weren't this big.". The proportions feel off somehow. "The display proportions are weird." Were they in this ratio? Isn't this an anomaly? Were they this huge? I feel like they were around 75% of this size. They weren't this big... Hm? Turn back! "Going back, going back, going back, going back!" "Going back--! 8--! 8! It's 8!"

    Eh? Hm? So having 8 means... what? Hm? Is this... "Is it 8 because I wasn't wrong?" Another round to play, don! See! They weren't this huge! Look! They definitely weren't this big! They weren't this huge at all! Hm? Mister... Hm? Is it still going? Look at mister. Mister isn't looking? "Holding his phone?" Back OK? "Back OK. 8."


