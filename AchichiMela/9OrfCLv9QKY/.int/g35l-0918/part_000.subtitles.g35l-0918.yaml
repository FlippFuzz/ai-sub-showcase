    First, from 02:10.400 to 02:13.500, she says: "のっじゃーー！" - "Nojjaa!"

    Repeating the same phrase from 02:17.300 to 02:20.200: 「のっじゃーー！」 -> "Nojjaa!"

    Then, between 02:22.400 and 02:25.500: 「あちちめらー！」 - "Achichi Mela!"

    And from 02:26.115 to 02:33.400, she says: 「アホライブ遊び回りたいゴリ押し担当のヒャシヤサラマンダー、あちちめらなんだのっじゃー！」 - "As the salamander in charge of pushing through whatever games we play in Aho Live, I'm Achichi Mela, nojjaa!"

    From 02:33.800 to 02:37.000: 「本日2回行動ですのっじゃー！」 - "Today I'm taking action twice, nojjaa!"

    Now, looking deeper into the stream:

    02:39.500-02:42.000: 「のっじゃ。」 - "Nojja."

    02:44.700-02:53.000: 「のじゃばんわー、のじゃばんわー……」 - "Nojabanwa, nojabanwa..."

