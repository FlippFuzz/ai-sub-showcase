  thoughts: |+
    **My Thoughts on Growth and Kindness**

    Okay, so I'm thinking about this video clip, right? It's Aochi Himeia, speaking Japanese. I'm going through it meticulously, making sure to capture every nuance. *Toka*, *chuunibyou*, you know? Honestly, reflecting on it, it brings up some deep thoughts for me.

    Everyone goes through phases, you know, those times where we're, shall we say, a bit... dramatic. I recognize that. I'm not denying those phases. But the real growth comes from looking back, from *reflecting*, you know? Thinking "Ah, that was cringe," or "that wasn't great." If you can *feel* that, that's real progress.

    I mean, everyone has those periods. It's okay to have those thoughts, but it's about not *projecting* them, right? Being cynical, going against the grain – it's not bad in itself. It's when you force it on others, when you mock, that's the issue. Keeping it internal? Perfectly fine.

    And, you know, I think this contrarianism, this cynicism... a lot of times, I think, it's about protecting ourselves, protecting our own hearts. It's like, you weren't invited to Starbucks, and you felt lonely, so you put up a wall, building up defenses, making excuses. "I don't care anyway!" you tell yourself. I've been there, I've *totally* done that. I'm reflecting on my own behavior.

    But, you know, don't hurt others, don't show it! Be kind to people going through it for the first time because you used to have that phase as well. Oh, it's such a great realization. Think, "Oh, I used to be there." And you can accept them with kindness.

    This applies to newer people in the community, when they say things like, "Oh, this is my first time watching VTubers". Be kind to them! Be kind to them. Think, "I used to be like that, too." Then, gently educate them as much as you can. By doing so, the person who was treated kindly will likely be kind to the next newcomer. It's a circle of kindness. I'm a newcomer too, you know! I want you to be kind to me too!

    Wait, you are kind. You already are kind. Thank you.

    And on a lighter note, it's almost time to end the stream. I have upcoming streams. Tomorrow from 8:00, I'll be playing Clubhouse Games with Sopia. Then, on the 9th, there's a quiz stream with Asobimawaritai. On the 10th at 19:00, there will be "Spaghet," seems like a spaghetti game. I'm not sure what it is, but Fubuki-senpai gave it to me. On the 11th, Rhythm Heaven. Please look forward to it. Bye-bye. Wait, not bye-bye. It's "Saraba Ja" now. Farewell!


