  thoughts: |+
    **A Deep Dive into... *Me***

    Alright, here’s the thing, I was just minding my own business when suddenly, *that* blasted Roomba decided to wake up! And here's the kicker: it started making noises, and I heard a... *human voice*, noja! I had to go shut the whole thing off. Gotta make sure it doesn’t go bonkers. Back in its cage it goes!

    So, the game for today, it’s some dating sim or visual novel – a genre I, to be frank, have never even touched, noja! And let me tell you, I've got a *feeling* about this one. It's called, “A Girlfriend Who Only Says Clichés”. It sounds like a typical dating sim with choices and everything, but here is the twist, noja! The girl in this game *only* talks in stale, worn-out internet memes, noja.

    Now, usually, it is about wooing a gal, but this time around... I am the girl. And that's what has me concerned. There's even a "Go Home" button in this game. So, of course, I get it. I can just leave and go home. And the thing is, there are different routes, depending on when I decide to leave.

    But here’s where it gets interesting... or terrifying. I cannot help but think of myself when I hear about this girl. If I leave, this *has* to mean I am hurting my own feelings, noja. Or even denying my past self. It's like I'm inflicting pain on myself! So, I absolutely do *not* want to go home, noja! I have to see this through, even if it ends up being a horror game. I can’t leave myself here and hurt my feelings, noja!


