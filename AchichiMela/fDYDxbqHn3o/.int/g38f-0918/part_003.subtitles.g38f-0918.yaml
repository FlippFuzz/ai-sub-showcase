    **A Deep Dive into Mela's Duolingo Session**

    Okay, so I was watching Mela tackle some English on Duolingo, and, well, let's just say it was a journey. The first thing I noticed was her strong aversion to anything involving balls, starting with "ボールの" and extending to "ボールを使うスポーツは嫌いなのじゃ" – sports with balls? Hard pass, noja! I'm already thinking about subtitles, so I'm paying close attention to these timestamps.

    There's this Duolingo audio saying "This tennis racket is nice," which Mela repeats, and then follows up with "テニスもボール使わん？" - doesn't tennis use a ball? I'm already on the same page, but the app audio volume is a little low, so I need to turn it up. The Duolingo app then declares "Tennis is a sport with balls", and I'm totally with it when she says, "Yeah, that's right, isn't it?"

    Then there was this funny exchange where Duolingo tells her Junior wants to swim, and she goes: "Swim? 球じゃないの！" - wait, she misheard that as "球" (ball), not 球技 (ball game)! I hear her say "球じゃないの" a few times, which means, "It's not a ball game!" She corrects herself right away, saying "泳ぎ、確かにボールいらない" – swimming doesn’t need a ball, but for a second, I thought she was going to insist swimming had balls! She later corrects, "ノーボールのじゃ" - "No ball, noja!" She misheard the app and thought swimming involved a ball, but was reminded it did not! She misheard the word!

    But then Junior's dad asks her what she wants to do, and she initially mis-hear swim as "球", so she thinks swimming uses balls, and has to correct herself!

    Later, the chat reminds her that swimming does not use balls.

    Later in the video, I can tell she really hates sports - she is no power and wants to be at home. She talks to her friend Sophia - who she says has less stamina than her. She hates sitting on the train - because of her tail.


