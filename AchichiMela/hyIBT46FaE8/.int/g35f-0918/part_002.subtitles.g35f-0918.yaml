      初めてインターネット触ったのに書き込めたよ？書き込めたのに、ダメだった。
    english: I was able to post even though it was my first time using the internet!
      I posted, and yet, it was a disaster.
  - start: '03:36.000'
    end: '03:42.500'
    original: |
      もっとさ、ルールとか書いて欲しいよね。「〇〇はこうしてください！こういうことはしちゃいけません！」みたいなの全部書いて欲しいのじゃ！
    english: I wish they would write down the rules more clearly. I want them to write
      down everything, like "Do this!" or "Don't do that!"
  - start: '03:42.500'
    end: '03:47.000'
    original: |
      だからすっごい気をつけようと思うのじゃ。火消し屋じゃし。
    english: So, I'm going to be extremely careful. Since I'm a firefighter.
  - start: '03:47.000'
    end: '03:52.800'
    original: |
      わしの夢！わしの夢は、人間に恩返しをすることなのじゃ。
    english: My dream! My dream is to give back to humans.
  - start: '03:52.800'
    end: '03:58.200'
    original: |
      人間として20年間生きてきて、仲間に入れてもらえたのがめちゃくちゃ嬉しかったのじゃ。
    english: Living as a human for 20 years, I was so incredibly happy to be accepted
      as one of you.
  - start: '03:58.200'
    end: '04:02.000'
    original: |
      200年くらいずっとひとりぼっちじゃたし、ずっと寂しかったから、
    english: I had been all alone for about 200 years, and I was always lonely...
  - start: '04:02.000'
    end: '04:06.000'
    original: |
      構ってもらえたのがすごく嬉しくて、人間好きなのじゃ。
    english: '...so I was really happy that people paid attention to me. I love humans.'
  - start: '04:06.000'
    end: '04:14.000'
    original: |
      わしも、かつてのわしみたいに、今居場所がなくて一人で寂しいって思ってる人間が、もしかしたらいるかもしれないと思って、
    english: I thought there might be humans out there who, like I used to be, have
      no place to belong and feel lonely and alone right now...
  - start: '04:14.000'
    end: '04:17.500'
    original: |
      わしはそんな人間の居場所になりたいのじゃ。
    english: '...and I want to become a place of belonging for those people.'
  - start: '04:17.500'
    end: '04:23.500'
    original: |
      次はわしが居場所になることによって、人間に恩を返していくという作戦なのじゃ。
    english: The plan is for me to give back to humans by becoming a place of belonging
      next.
  - start: '04:23.500'
    end: '04:28.000'
    original: |
      そしてインターネットで、やっぱ、わしかつて痛い目に遭いましたから、
    english: And on the internet, since I once learned my lesson the hard way...
  - start: '04:28.000'
    end: '04:34.000'
    original: |
      どんな人間にも優しい、インターネット1年生でも、初心者の人々でも入りやすい、そんな配信や動画を作りたいのじゃ。
    english: '...I want to create streams and videos that are kind to everyone, and
      easy to join even for internet beginners and newcomers.'
  - start: '04:34.000'
    end: '04:38.200'
    original: |
      あったかい居場所にしたいのじゃ。
    english: I want to make it a warm place to belong.
  - start: '04:38.200'
    end: '04:43.000'
    original: |
      お主ら協力してくれるかの？協力して欲しいのじゃ。
    english: Will you all cooperate with me? I'd love for you to cooperate.
  - start: '04:43.000'
    end: '04:47.000'
    original: |
      いかがでしたでしょうか。わしの自己紹介動画見て、
    english: How was it? After watching my self-introduction video...
  - start: '04:47.000'
    end: '04:53.000'
    original: |
      熱干めらというサラマンダーがどんな子なのか、ちょっとは分かってくれたかの？
    english: '...did you understand a little bit about what kind of girl the salamander
      Mera Atsui is?'
  - start: '04:53.000'
    end: '05:00.000'
    original: |
      これから、配信とか動画とか見て、もっと色んなわしのことを知っていって欲しいなとは思いつつ、
    english: While hoping you'll watch my streams and videos and get to know more
      about me from now on...
