  - start: '00:55.700'
    end: '01:02.800'
    original: そして「めら」 メメラメラの「めら」なのじゃ！ 火が燃えてる時の オノマトペ？ 擬音？ みたいのなやつなのじゃ！
    english: And "Mera" comes from "mera-mera" (flaming)! It's like an onomatopoeia
      or sound effect for fire burning!
  - start: '01:02.800'
    end: '01:06.800'
    original: 漢字がちょっと分かりづらいのと あと辞書で一発で出てこないので
    english: Since the kanji is a bit confusing and doesn't pop up right away in dictionaries...
  - start: '01:06.800'
    end: '01:18.000'
    original: めら組のお主らは 熱千（あちち）を辞書登録して いつでも熱千（あちち）を呼び出せるようにするのじゃ！
    english: Everyone in Mera-gumi, please add "Atsuchi" (熱千) to your dictionary so
      you can type it anytime!
  - start: '01:18.000'
    end: '01:23.700'
    original: そして お主らが気になってるであろう種族！ わしは サラマンダーなのじゃ！
    english: And now, the species you're probably curious about! I am a salamander!
  - start: '01:23.700'
    end: '01:30.000'
    original: 見て このツノ ツノ！ あと 尻尾なのじゃ～！ どうかのぉ？ 可愛いかのぉ？
    english: Look at these horns! Horns! And my tail~! How is it? Cute, right?
  - start: '01:30.000'
    end: '01:33.800'
    original: サラマンダーとは 火を司る精霊らしいのじゃ！
    english: A salamander is said to be a spirit that governs fire!
  - start: '01:33.800'
    end: '01:37.700'
    original: わしの髪の毛からもね こうやって炎が出とおるじゃろ
    english: That's why flames are coming out of my hair like this, right?
  - start: '01:37.700'
    end: '01:46.500'
    original: これは 体内の熱を どこかから出さないと わしが火を吹いちゃって 周りを火だらけにしちゃう
    english: If I don't release internal heat, I'll breathe fire and set everything
      around me ablaze.
  - start: '01:46.500'
    end: '01:51.000'
    original: 髪から火を出すことで、火を暴発しないようにしている。
    english: Releasing fire from my hair prevents accidental outbursts.
  - start: '01:51.000'
    end: '01:54.800'
    original: わしてきには 正直人間と変わらんくね？ と思ってるところがあって
    english: Honestly, to me, I feel like I'm not that different from a human.
  - start: '01:54.800'
    end: '01:58.200'
    original: 火に強いとは言いつつも 火傷はするのじゃ
    english: Even though I'm strong against fire, I still get burned.
  - start: '01:58.200'
    end: '02:03.200'
    original: 手とか指とかは火傷しないが、粘膜は火傷する。
    english: My hands and fingers don't burn, but my mucous membranes do.
  - start: '02:03.200'
    end: '02:10.500'
    original: それこそベロとか あったかいココアとか飲む時は ベロ火傷しちゃう
    english: Especially my tongue. When I drink warm cocoa, I burn my tongue.
  - start: '02:10.500'
    end: '02:15.500'
    original: あと 炎属性なんじゃが 夏はめちゃくちゃ暑いのじゃ！
    english: Also, even though I'm fire-elemental, summer is super hot!
  - start: '02:15.500'
    end: '02:22.000'
    original: 本当にサラマンダー？ 湿度とかもあるからな？ ヤバいから 熱中症になる サラマンダーなのに！
    english: Are you really a salamander? Maybe because of humidity, it's so bad I
