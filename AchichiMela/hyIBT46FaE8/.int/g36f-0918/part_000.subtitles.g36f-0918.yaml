  - start: '00:27.700'
    end: '00:37.700'
    original: 「どんな子かな～？」とか気になってたり 「人間じゃないの？」「なんで髪の毛燃えてるの？」とか 「ホロライブのオーディションを受けた時の話」とかもしようかなって思ってるので
    english: I'm planning to talk about things like "What kind of girl is she?", "Isn't
