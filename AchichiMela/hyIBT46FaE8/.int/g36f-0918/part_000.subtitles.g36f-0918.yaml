  - start: '04:16.000'
    end: '04:28.000'
    original: 山に籠ってる間にしていたこと 寝て 起きて 食べて 寝てたのじゃ 食っちゃ寝サラマンダー？ ずっと寝て起きて食べて寝ての生活をしてたのじゃ
