  - start: '00:46.000'
    end: '00:51.500'
    original: 名前は 熱千めら！ 「ねっせん」じゃないのじゃ！ 「あちち」って読むのじゃ！
    english: My name is Atsuchimera! It's not read "Nessen"! It's read "Atsuchi"!
  - start: '00:51.500'
    end: '00:55.700'
    original: 「千度の熱」と書いて 「熱千（あちち）」 良い名前なのじゃ！
    english: Written as "Heat of a thousand degrees", it's "Atsuchi"! It's a great
