  - start: '04:38.500'
    end: '04:47.000'
    original: なんで わしが人間と暮らし始めたか？ という話なんじゃが わしが山で生活していた時にの 山にスマホが捨ててあったんじゃよ 「スマホおもれ～！」と思って
    english: Why did I start living with humans? When living in the mountains, I found
