  - start: '04:04.500'
    end: '04:16.000'
    original: 当然 人間の寿命よりも わしの寿命の方が長いから 仲良かった人間たちが みんななくなっちゃって しばらく1人でいるか～と思って その後は山に籠ってたのじゃ
