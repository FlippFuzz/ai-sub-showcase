  - start: '04:28.000'
    end: '04:38.500'
    original: 山から降りて 人間と一緒に暮らし始めてから 今まで20年くらい 人間と共に生活をしてきたのじゃ 約200年間、山に籠り食っちゃ寝サラマンダーとして過ごしていた。山から降り、人間と暮らし始めてからは約20年。
    english: After coming down, I've lived with humans for ~20 years. 200 years in
