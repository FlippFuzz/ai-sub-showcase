  - start: '03:43.435'
    end: '03:59.785'
    original: はい、ええと、オリジナル曲「騒げ！ぐるぐるタイム」遊びたい公式チャンネルにて公開中です！さっきの曲聴いて、うわ、また聴きたいなって思ったら、ぜひ何度もMVと合わせて聴いてください！
    english: Our original song 'Sawage! Guruguru Time' is public on the official Asobi
      Mawaritai channel! If you wanna hear it again, please listen along with the
      MV!
  - start: '03:59.925'
    end: '04:09.975'
    original: 次、え、スターティングボイスが、私たち初の発売中ですのでのじゃー！英語と日本語両方ともあるのでかなりグローバルなボイスになってるんじゃないかなと思います。
    english: Next, our first Starting Voices are on sale! Since there are both English
      and Japanese versions, it's a pretty global voice pack.
  - start: '04:10.515'
    end: '04:18.735'
    original: おはようボイス、おやすみボイス、その他たくさんいろんなバリエーションのボイスが楽しめますのでぜひお手手に取ってください！
    english: You can enjoy Good Morning, Good Night voices, and many more variations,
      so please pick it up!
  - start: '04:20.195'
    end: '04:39.115'
    original: そして動く壁紙！動く壁紙、早速もう壁紙にしてくれてるよって人もいっぱいいると思うんじゃが、我々のライブ2DPVのね、イラストをね、壁紙にしましたのでこちらもぜひ合わせてお手手に取っていただけると嬉しいですのじゃー！
    english: And moving wallpapers! Many of you have already set it as wallpaper,
      but since we made our live 2DPV illustrations into wallpapers, we'd be happy
      if you pick those up too!
  - start: '04:40.105'
    end: '04:59.805'
    original: そして次こちら、レギュラーアウトフィットグッズですのじゃー！缶バッジとアクリルスタンド、私たち初期印象のね、初期、初期っぽいです？あの1番スタンダードなお顔のね、書かれてる缶バッジとアクリルスタンドが発売中ですのでのじゃー！常設グッズっぽいのですが見、まあ今のうちにね、早めに手に入れて
    english: And next is Regular Outfit goods! Badges and acrylic stands featuring
      our standard faces are on sale! They seem permanent, but get them early,
