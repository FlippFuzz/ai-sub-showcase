    Okay, here's what I've got so far.  I'm dealing with a video of a conversation among VTubers, and my primary goal is creating clean, accurate subtitles.  The instructions were clear: zero ghost subs, audio fidelity is key, and the translation needs to be natural and contextually sound. The maximum character count per line is 50.

