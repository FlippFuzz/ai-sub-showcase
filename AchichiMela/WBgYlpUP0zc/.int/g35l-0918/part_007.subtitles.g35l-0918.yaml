    *   00:10.960 - 00:14.340 | 座れる座れる。ソフィアが1位さんになって、チームにょろはカンヤダ！ | We can sit! Sofia took 1st place, so Team Nyoro is on top!
    *   00:15.100 - 00:18.400 | これちょっともう今日歌枠でもうね、完全に | Since today is a singing stream, completely...
    *   00:18.400 - 00:19.460 | ウマピョイ頑張ったもんね。 | Umapyoi worked hard, right?
    *   00:19.540 - 00:22.360 | そうだよ！頑張ったのすごかったもん。そこでカツレツすいません、 | That's right! You worked so hard, it was amazing. And cutlet... excuse me,
    *   00:22.360 - 00:24.000 | 使い終わりました。 | I've used up my usage.
    *   00:24.160 - 00:28.980 | ソフィア、相当カツレツのね、必要な曲をね、いっぱい歌ったもんね。韓国曲ね。 | Sofia, you sang a lot of songs that needed cutlet energy, right? Korean songs.
