    Then, the chat helpfully says, "'s' is only for 'he', 'she', 'it'." Aahh! Okay! I just didn't get that part. Okay, okay, okay, I understand now! Except for "he", "she", and "it"... "He", "she", and "it" are... Others besides yourself, other things take an "s", but... The moment those things become plural, it stops taking it! Okay, okay, okay, I understand.

