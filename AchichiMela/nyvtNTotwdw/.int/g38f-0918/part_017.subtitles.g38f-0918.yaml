    First, I heard her say “I picked ‘I can’... I’m pretty sure.”, which lead into a request to join yoga? Alright! Cool. Then, Duolingo pops up: "I can't kick the ball far today." and the stream continues to explore this topic.

    She's learning English it seems and so starts playing along with the program... "When can we play the next game?" and clicks the words, "When, can, we, play, the, next, game," yeah! Alright!

    Then, Duolingo: "David never catches the ball." Wait, "never" - what's the difference between "never" and "not at all"? Never... I'm thinking, "David can never catch the ball.” And "not at all"… is it interchangable? I see now that it depends on the context, so that's helpful. Hmm.

    "Baseball players catch the ball well". Ah, and that leads me to something interesting because I'm thinking, "Ah, since 'players' has an 's', it doesn't take 'the'?" Baseball players catch... Is it 'catch' because it's plural? Hm? Hm? Wait, I don't get it...

    Then, I'm thinking, "Hey, if it were like 'he' or 'she', wouldn't it take an 's'? Wouldn't it be 'catches'?" Hm? Why is there no "s"?

