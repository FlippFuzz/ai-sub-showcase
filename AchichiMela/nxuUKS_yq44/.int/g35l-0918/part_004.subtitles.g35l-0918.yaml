    The first major shift occurs with the "Anomaly in Progress" message.  The VTuber expresses concern about the anomaly, and I try to find out the location, and what it does. This seems critical to the gameplay, and this is where the fear level picks up. The VTuber's vocalizations shift from being curious to frightened, as the environment's unsettling nature is revealed.

