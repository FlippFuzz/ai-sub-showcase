  thoughts: |+
    **My Thoughts on This Stream Clip**

    Alright, so I was watching this clip back, thinking about what was said. First, I was just reminiscing a bit, thinking, "Let's head back," you know? Then, I was like "All righty," because it's always fun to be back. And, "Noja~!" That's just me, I guess. I had so much fun playing GeoGuessr! It's been a while, and it was super fun. So fun, in fact, that I want to play a lot! Yep, a whole bunch!

    I actually had planned on playing Rhythm Heaven today, but... the capture board? It was acting up so I couldn't stream. There was some gear trouble, you know? But I'd love to try that again sometime. Anyways, I did my best!

    So, I was wondering, do *you* guys play GeoGuessr? Usually? Not on your own? I play it all the time by myself! It's really fun. Like, when I want to empty my mind, I look at the scenery and play GeoGuessr. Seriously, you should try it! You don't have a PC? You can play GeoGuessr on your phone too. Even on your phone, there's an app, so you can play it.

    You like watching? The world tournaments are amazing, right? Like, I can't do it myself, but watching people zoom in and pinpoint locations, isn't it incredible? So impressive.

    By the way, did any of you manage to get Meia-chan's merch today? Ah! The merch! I kept trying to promote it on previous streams, but I couldn't! If you have it, awesome! Did you guys get some? Is there anyone? Like... what was it again? I heard, on the official site, people already bought up all the can badges and acrylic stands. That's what I heard. I'm honored!

    I also heard rumors people have been buying them up at physical stores too. Speaking of that, the acrylic stands and badges, aren't they like, permanently available? The "Regular Outfit" merch, it'll probably get restocked, right? Wait, I am so sorry, but please take this with a grain of salt. The only limited-edition items are Asobimawaritai items? I can't talk about things when I don't know the full details, I will look it up.

    So, how can I search for this? Umm... Maybe I'll check Asobimawaritai's X or something. I said "X"! It feels like a loss when I say that. It feels like a defeat! Does that happen to you guys too? Heave-ho, Heave-ho. Looking for merch info.

    Umm... Starting Voice. The Starting Voice is always available! No matter when someone comes to like me, what they can always get is the Starting Voice. "In the event this product goes out of stock, there is a possibility of restocking." Ah, so the Regular Outfit stuff, the acrylic stands and can badges, probably will get restocked, is my prediction. But I won't say for certain, because that's scary. And as for the Asobimawaritai debut commemorative merch... were there details on this? Like, was there a date or anything? Was there? Was something like that mentioned?

    Like, I don't really think the debut commemorative merch would still be on sale five years from now, but what do you think? Surely five years from now there'll be other merch, not debut merch, right? I wonder. I'm going to check the official...


