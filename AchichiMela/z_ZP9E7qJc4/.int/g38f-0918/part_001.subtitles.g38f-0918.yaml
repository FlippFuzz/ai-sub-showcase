  thoughts: |+
    **GeoGuessr Time!**

    Alright, let's get down to business. I'm excited to dive into a GeoGuessr session today. First off, I need to make sure the audio is all set; it's the little things that cause technical issues, and I need to avoid that. It's been a while since I've played, partly because of the busy debut preparations. But also, I've had so many equipment hiccups recently. I want to become a veteran VTuber and avoid these problems!

    I've been thinking about getting into the game: it's that game where you're plopped down somewhere random in the world, and you have to use your wits to figure out your location. I love it! Especially seeing AZKi-senpai playing it. I'd love to play with her sometime!

    I think I'll focus on the Japan map today! I will be dropped somewhere in Japan, and then I'll look around, assess the situation, and try to make an educated guess. I'm debating the rules: NMPZ is brutal! No Move, No Zoom, No Pan—it's practically pure luck. It's the equivalent of "Hardcore" mode.

    I'm getting ready, so let's start the game. Today, I was lagging yesterday, but hopefully, everything is running smoothly. Oh, and I forgot to change the title, but that's alright. Time to choose a mode and set some rules. There are so many modes, like No Move, Move, and the time limit. What's a good starting point? Maybe a standard 5 minutes with Move mode. I'm not a huge fan of Move mode, as I get motion sick. But, if I don't use a time limit, I might get stuck in some mountain pass for an hour! Let's get going! Japan map, here we come!


