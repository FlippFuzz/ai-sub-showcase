    **A Dragon's GeoGuessr Musings**

    Right, let's see, where are we now? *Dei tai no ja*, I want out of this place! Big, enormous structures all around... *Mago, mago, mago* – I'm lost! This path seems blocked, *yoisho, yoisho...* Ah, a railway! Perhaps it's a hint; it runs north. *Ah, chotto anshin suru!* A little relief! I've arrived on a somewhat wider street. Kugayama Inari! It seems to be Kugayama, after all. There's Kugayama Station, right there, perhaps that's the best place to start. *Hmm, hmmm*, there it is, Kugayama Station! Found it! It was right there! And Kugayama Inari Shrine as well. *Shitsurei itashimashita no ja.* Excuse me!

    Hmm, maybe there's a river nearby, too? Couldn't we find the river as well? What river was I on? I've forgotten... I've moved around quite a bit, haven't I? *Ah, chigau!* No! Wait, there was something about a parking lot, a hint, maybe? *Yoisho, yoisho...* Suginami, Miyamae... um, 5-chome. Okay, the plan is to find Miyamae 5-chome. Let's find this parking lot! I'd like to look for it, but... or perhaps the names of the buildings around here. The title, I want to know the building names. Eh, but there aren't any buildings with titles. Just single-family homes. The ones with names are apartment complexes, so, Miyamae Third Parking Lot. No name.

    Hmmmm? Hmm? I want to find it! Load it up! Hmm hmm hmm, Miyamae 5-8! Miyamae 5-8! It's Miyamae, not Kugayama, *ja no ja* (I see!). Let's look for Miyamae. It has to be around here somewhere... Building or apartment names are the title, *na no ja* (It is!). Miyamae, Miyamae... nothing... *nai no ja?* (Not here?). I got to Kugayama, at least. I'm bad with big cities. Too much information, I don't know where to look... Miyamae, Miyamae... Nishimiya! Nishimiya! West... means we're further east. Miyamae! *Miyamae atta no ja* (Miyamae is there!). It took a while to get here. Let me look again. *Yoisho*. *Yoisho*. *Yoisho!* Miyamae 5-chome!

    5-chome... Um, 1, 2... Where is 5-chome? 4... No 5-chome. 5-chome... Aren't there a lot of parking lots? There are so many parking lots! Miyamae 4... Miyamae 4-chome is here. So many parking lots. Looking for 5-chome now. 5-chome is here! *Kore ga Miyamae 5-chome no yokan!* I feel this is Miyamae 5-chome! Feeling it's 5-chome... but, Miyamae 4-chome... 5-chome... Daigo? It says Daigo! It says Daigo! Too many, I don't know which one is Daigo. Wait, I found an address earlier, let's go back. Heading north... *Yoisho*. There was an address written. Miyamae 5-8. 5... 8. This? 5-8?


