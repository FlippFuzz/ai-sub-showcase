  thoughts: |+
    **Holoserver Hide-and-Seek and a Rookie's Fears**

    Okay, so yesterday I played Minecraft and participated in the Holoserver Hide-and-Seek! It was my first collaboration with senpais, and I was so nervous! I couldn't even sleep after the stream; I kept wondering if I was okay. I also worried that maybe I said something rude. Those senpais are amazing, and I even accidentally called them "omae"! It was so hard, but of course I really respect them. I guess I get this 'Go get 'em!' mindset, even though bantering and kayfabe can be tricky.
     It was our first time meeting, so it should be fun to see how things evolve.

    Apparently, I got turned into 'the side chick,' and I was made to eat poison, and almost got killed, too, so it was quite difficult! The event itself involved senpais giving us crazy demands on the spot, you know, because we're new. Just reading the phrase sounded pretty wild: 'Crazy demands for the rookies?!' And I was pretty scared, but the senpais were really supportive.

    And yes, they said my impressions were good?! I seriously practiced! Ririka-senpai hit me with a challenge to do five impressions in a row! She has been saying on stream that she'd make any new kouhai do five impressions, so I prepared a bunch of notes beforehand so I'd be ready when she asked, although I don't have so much confidence in impressions.

    I prepared countermeasures for any senpai, as Ririka-senpai is the best. Anyway, the senpais were the best, but apparently this was my baptism. I'm most confident in the impression I did of Achichi Mela-sensei.

    I had been checking the Hololyzer and schedules to see who was going to join, but when I saw that Miko-senpai was going to be there, I thought that she'd definitely try to drown in magma. So, beforehand, I went into the Minecraft server, and asked management, "Um, could I please just have a water bucket?" Because I was sure the chance to put out a fire would come! I am a sharp salamander! I am a sharp rookie salamander! Before the stream, I got a bucket of water and said "As a firefighter, I'd never carry something dangerous like magma!" I made sure to deliver the punchline properly!



