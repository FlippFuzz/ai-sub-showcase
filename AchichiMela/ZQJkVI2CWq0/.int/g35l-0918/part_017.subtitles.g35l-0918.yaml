    **A Deep Dive into VTuber Horror: My Reactions**

    Okay, so, here's what was going through my head while watching this clip: Initially, it was all pure, unadulterated terror. "Takuya, protect me!" I was screaming internally (and probably externally too). "Save me, Takuya Knight!" The shaking was intense, and I was so disoriented. "Hey, don't look this way!" I didn't want whatever was happening to notice me. "Takuya help me!"

    Then, there's that title card, a brief moment of calm before the fear starts to creep back in, and I began to wonder what I should do. "What was that just now?" I was so jumpy! I was just really worried, I won't be able to buy snacks at the store if there are deaths! "What a nightmare, was it all just a dream?" A dream ending, *seriously*?! That's the *worst*! "I was so worried about you!" I was so invested in the scare! I was actually happy that no one had died. It's sad when people die, after all. "But I was scared, being locked up." "Isn't that not good?"

    I was so scared, I almost wet myself. "Can I go to the bathroom?" I was so surprised! "Can I go to the restroom for just a second?" I was scared for real, watching my horns for a sec! Then came the settings menu.

    "Coltopi is taking so long! He's not dead!" I came back alive! I had to go to the bathroom, and being alone, in the dark, was terrifying. "I couldn't close the door to use the toilet." What if I was trapped and I couldn't stream? And, I didn't have my phone with me! I was scared. The thought of my toilet magically opening, the sheer terror, was just intense! "I've played this game before, right?" "There wasn't a scene like this." "Was it added in an update?" "I don't know." And, it's not even raining, making it all the more mysterious.


