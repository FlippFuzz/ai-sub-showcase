  thoughts: |+
    **A VTuber's Frustrating Driving Lesson**

    Okay, so here's how this is going down. I'm trying to teach this in-game character, who sounds like a little sister, how to drive. My goal is to get her to follow my instructions so that she can drive safely and get through this. It's a comedy bit, right? I'm using this old man persona, this "わし" and "お主" thing, to make it fun, but man, she is not cooperating.

    First, I tell her to U-turn, which is usually a simple task. She just keeps going straight. It's so frustrating because I know the way. I'm telling her to make a U-turn to the left and she's not getting it. "She won't U-turn at all, this little sister..." I ask, "Do you want to hear what I have to say?"

    Then it's an endless exchange of safety checks and minimal movements. I have to repeatedly say to move a little left, move way left, stop, and so on. It's "Move to the left!" "More to the left!" "Way to the left!" Over and over, and she just won't do it.

    At some point, it's getting dangerous, I yell, "We're gonna die!" and then we crash! "Failed again... I couldn't save her again."

    I try again, but it's the same routine. "You know, I love you." I tell the character I'm trying to assist. And then it's back to, "4 km/h, right" over and over again. "Left!" "More Left!" "I will save you!" But, ultimately, we crash and die again, and I sigh. It's a sad scene, but I'll save her next time!


