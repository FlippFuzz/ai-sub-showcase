    *   00:36 - 00:41: Sophia is supportive, says even "Luck Facilitators" have bad days. I need to capture all these nuances.
    *   00:41 - 00:50: Meloco is still saying "Noja" a lot. Now it looks like she is ready to keep fighting! Meloco is saying "Mada maeru! Mada maemasu noja!"
