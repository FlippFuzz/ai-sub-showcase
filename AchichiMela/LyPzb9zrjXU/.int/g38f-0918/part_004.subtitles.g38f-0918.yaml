    First, the opening banter: We were bantering about Reversi. Then, we moved onto the game at hand and began trying to figure out the double down rule, trying to decide to hit or stand. We decided on some betting.

    I was feeling confident initially. However, it seems that there's not a lot to rely on with Blackjack. So I thought it's best to put my faith in luck! There was a lot of back and forth, double-downs, Hits...It's a rollercoaster ride. I figured that, even though there's an element of strategy, luck can quickly take the upper hand, and ultimately I wasn't as smart as I thought I was! It's a humbling lesson!


