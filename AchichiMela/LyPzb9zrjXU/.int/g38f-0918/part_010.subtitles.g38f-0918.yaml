  thoughts: |+
    **A VTuber's Ramblings on Clubhouse Games**

    Okay, so I'm watching this clip of Sopia and Mera playing "Clubhouse Games: 51 Worldwide Classics." I see Mera, the one with the blue/black hair and that "washi" speech style, getting flustered right away. She's playing "Pig's Tail" and, *noja!*, losing! It seems she's playing "Kirby" against Sophea, and she's not happy about it. She even exclaims that she must *relinquish her title* of being in charge of blessings, maybe a bit dramatic but understandable.

    Sophea teases her a bit, saying things like, "Things happen, even to the blessings specialist!" and it's quite funny seeing Mera keep saying *noja* in response. Then it's on to Yacht, where she's determined to make a comeback, but she keeps *raising flags* and getting nervous and is certain she's going to lose.

    I keep thinking, *I need to just calm my mind,* but she worries that she'll make some flag and fail. It seems she's called the "Instant Flag Architect" by chat, which I'm sure is a little annoying. The best solution? She thinks it's a *poker face!* It's good to keep my feelings hidden. She even says she's been losing because Sophea can see that she's flustered.

    Then it's Yacht time! She declares she will win, *but...* flag! *Null and void!* I should probably calm down and be "seiseidoudou" (fair and square). She asks Sophea if she knows the rules. She seems confident that she can calculate Yacht probabilities... it does seem like it's a piece of cake to calculate Yacht probabilities... right? Maybe it's not a requirement! *He who plays not Yacht is not human*, she says. We play, she says, let's play, then it's her turn and she's really thinking about the dice!


...
