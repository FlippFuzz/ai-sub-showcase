    *Ippai kore toreru n ja nai?* (Can't I take a lot here?). Three! *Mittsu tte sugoi yo, mittsu!* (Three is amazing!). Okay, not yet... Wait, *hora mou, kore hobo kado yan!* (Look, this is basically a corner!). Oh no, *kore kado torarechau yo?* (my corner is gonna get taken?). *Doushitara ii no?* (What should I do?), *Dousureba ii no ka na?* (What should I do?). *Mada, mada wakannai kedo ne.* (I don't know yet). *Mada, betsu no kado toreta ra wakannai kedo ne.* (If I can get another corner, then I don't know...). *Noja!*

    *E, uun, kore doushitara ii n darou?* (What should I do here?). But, I have the black pieces now. More black... Hmm, true, true. *Kore kangaete mo wakannakute kusa.* (I am thinking, but I don't get it, lol). *Nojaa! Noja!* I have a lot, I think? *Kanari kuroi n ja nai?* (Aren't they black?). *Katten n ja nai?* (Am I winning?). Sopia can only flip one piece. *Kita!* (Here it comes!). The era of *noja*?

