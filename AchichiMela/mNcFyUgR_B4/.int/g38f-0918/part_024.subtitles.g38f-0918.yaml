  thoughts: |+
    **Aochichi Mela's Mind in a Clip**

    Alright, let's break this down. First, this viewer wants subtitles for a clip, a *Mela* clip, of course! It's a short one, only five minutes. Time to get to work!

    Okay, so the stream starts at zero, and first thing I say is "I don't read those." I'm getting a little annoyed at the amount of chats. Oh, and right after that I'm asking "Can I have support messages sent?" But... *no* not there, but through Twitter! Twitter is much easier to catch. I prefer those posted to Twitter, or YouTube comments, because I *don't* look at the Marshmallow submissions after that day's stream is over, you know? Those submissions are only for that *stream*. But, send me letters! Yes! The address is in the video description. Actually, I ask where the Marshmallow submissions are to people in chat, *because* I want them on Twitter! Anyway, I always check YouTube for the comments, and also the archive comments, I *do* look at those.

    I don't "like" a lot on YouTube or Twitter, unless it's fan art, 'cause I just can't "like" them all, you know? But I'm *always* looking at Twitter whenever I'm not streaming, and that includes those clip comments. Some of those comments can be a little mean, though! It can sting! I'm *always* reading the comments on my YouTube channel. Those are usually so kind and it makes me happy!

    Each morning, I wake up, and I do a search for "Melachi" and "Mela-chan" and "Aochichi Mela" on Twitter, go through the hashtags, then check YouTube for newest comments! That's how my day begins! Please, *write* me a lot of comments, it helps the video get recommended! Yes, I get happy when I read comments. You know, when I do read archived comments, I'm thinking “Thank you!”

    Basically, I'm *always* watching YouTube, except when I'm streaming or working, but even then I try to sneak in a peek! It's my hobby, now. I check so often, basically. It's almost all the time!

    Now, *sometimes* I run out of stuff to look at, like, completely exhausted the feeds! So, when that happens, and I'm all out of stuff to read, I search my *fire extinguisher* emoji, my *oshi mark*, and then I find posts from the "Mela-gumi"! That's a fun bonus. I look at those, too. And I'm always looking.


