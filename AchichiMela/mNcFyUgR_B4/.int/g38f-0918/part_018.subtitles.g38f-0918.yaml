  thoughts: |+
    **Alright, let's get this done. I need to make some subtitles for this VTuber's "Rhythm Tengoku" clip, specifically the "Hurdle" stage.** This is a GBA game running through an emulator, or it could be Rhythm Heaven. Let's make sure everything is spot on.

    First, the opening screen with that message from Miho-chan. Even though it's UI, since it's a message, it has to be subtitled, so: [From Miho-chan] Your jumping and sliding was amazing! [Pretty Good]. Then, she says "Yoisho" a few times, and some *sprout* sounds. She is back and says: I'm back! And another "Yoisho". The screen says: "Play again?". The game and VTuber say "Play again" a couple of times.

    Now, she's starting the stage. She's got this, and getting back into it and adjusting her volume. And she is saying that she is going in. Title card up: [Hurdle] - yeah, she's doing it again. The game says "This game is..." then she starts talking and says I love this song!

    Right, here's where it gets interesting: the gameplay section. The game is saying the vocal cues: "Step in, two!" - "Hop, step, jump!". We need to be careful, because even though it's repetitive, it has to be noted. I see what's happening - there are huge gaps in the timecodes. I got it: at 01:53 - 01:54, the game says "Step in, two!" and she says "Jump!" with the game sound. The voice in the game *is* a vocal cue, and is part of the music, so every cue has to be transcribed: “Hop, step, jump!”… “Step in, two!”… "Jump!". And she starts to say and shout some things: "Here it comes!". "Seriously so cool!". "It's seriously so cool!", "I only want to listen to songs like this!"

    Then the glitch section hits. The music is crazy, and the game sounds are glitching. We must not miss any of the vocal prompts, because they are clearly vocal, even if repeated. Glitch music! "Hop, step, jump!" *glitched*. "Hop, step, jump!". She is saying all of the vocal cues and the music is sped up. So, make sure every cue is transcribed. "I'm getting the hang of it!", "I'm getting it!", "I've got it!", "I've gotten better!".

    Results time! The game voice says: "Your jumping and sliding was amazing, and what's more, super fast speed!". While the VTuber is screaming, "I did it~~!". And now the game says "Pretty good!". VTuber is like "No ja~~", and now I'm getting the hang of it. [Play again?] - Yeah. Ok, she's getting better, finally! Yeah, yeah, yeah. Again: I did it! "This song might be my favorite so far! It's seriously so cool! I just love this kind of stuff."

    And now to do the final part. Let's see... a moment... Wait, something happened. And the video is going black - oh no! Let's get the sounds transcribed: "No... hm?".  "No... No ja~~!" and all of the sounds. Now she's like "Wait...", the screen is back. "It's back.".

    I've checked every single timing and there are no gaps. Done.


