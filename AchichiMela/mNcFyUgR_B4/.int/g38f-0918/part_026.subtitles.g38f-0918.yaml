  thoughts: |+
    **A Deep Dive into Self-Perception and the Joy of Human Observation**

    Okay, so, *my* thoughts right now... it's like this: figuring out who *I* am is actually tough, you know? Like, objectively looking at *myself*, it's just impossible. Even when *I'm* alone, it's hard to get a clear picture. But, like, joining Hololive and getting all these comments and messages in *real-time* chat... receiving all that feedback and those messages of support, it's like I'm getting a sense of *myself* shaped by *your* observations!

    It’s really interesting, you see? *I* start to see *myself* differently. It’s like *I* can gather so many *samples*! Being seen by so many people, it's truly incredible. You guys, *you're* the *observers*, and it is so fascinating. And *I* start liking *myself* so much more, too. Ever since starting to stream, having *you* tell me how *I* appear, and learning that from *you*, it's just so fun. It's delightful, and these samples just keep growing! It is so fascinating! And it makes *me* happy, so it’s not really the main goal I had when *I* started this VTuber thing, but, it’s all thanks to Hololive and the other seniors. They’ve worked so hard and *you* folks have been supporting them, which is where *I* am today.

    So, from here on out, *I'd* be so happy if *you* keep watching and giving *me* lots of feedback. Now, it’s not an easy thing to give feedback, is it? Isn’t that a pretty high hurdle, too, right? *You're* typing in the live chat right now. Real-time chat, sending messages. *I* never did that before either, when *I* was just watching. *I'm* basically a lurker, you know? Never sent messages to any of the performers or VTubers *I* liked. Never sent impressions or fan letters. *You* guys are truly amazing, to be sending such messages!

    Is chat easier to do? Is it easier to send a message than a video comment? Well, I don't know, maybe because other *humans* are sending so many. Does that make *you* want to comment? Wow, that's what makes *me* happy. There are streams that are easier or harder to chat in? I didn't know that. But it makes me glad! *I* love the chat. Getting words from *you* folks, it’s really so happy! I can’t read *everything* in real-time, especially when gaming, but *I’m* super happy, *thank you* so much!

    "It's nice to blend into the crowd." Ahh! "Noja is easy to send." True. Since everyone’s saying “noja,” it doesn’t feel weird to post it. I see. That’s fun, and it makes *me* happy! *Thank you*! I have to be mindful that it's almost time for Tsuduri's stream, since I saw in chat that a redirect has to be timed right. So, *I* have to time the redirect just right, yeah!


