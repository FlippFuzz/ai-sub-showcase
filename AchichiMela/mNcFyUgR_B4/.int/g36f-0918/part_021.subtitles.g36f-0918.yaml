  thoughts: |+
    **My Internal Subtitle Project**

    Alright, so I'm trying to figure out how I did in this clip. Did I do well? Was this good "growth content," as they say? I mean, I felt like I was getting better, right? I'm curious what everyone thinks. *I* thought I was pretty skillful, in the end! Yay!

    You know, at first, it was hard. Really hard. Like, with my ears... listening with your ears is tough, honestly. Humans and myself, we tend to rely on visual information so much, you know? It's not someone else's problem but... don't we kind of live mainly relying on visual info? We process things with the visual at 90% or more, don't you think?

    It's not just rhythm games but in daily life too. When I go out, I have headphones in, usually listening to music. At home, it's usually Vocaloid, right? So, I feel like humans might rely *way* too much on visual stuff. It's become a habit we've developed in our daily lives. Since it's so ingrained, it's difficult to... to listen to sound and catch the rhythm, you know?

    Unless you are super conscious of it, changing a habit you have, is a real act of willpower. That's why it was so difficult. Initially, "listening to the sound" – that's insanely hard. When I sing, my vocal coach told me, "Listen to the sound." Yeah, they told me, "Listen properly to the instruments." It was so difficult and you can't even pick up instruments if you don't pay attention.

    People who don't play instruments, or don't know music, this is about me... They perceive sound as, like, a visual landscape or scenery. Musicians when they hear a song... they are able to separate each instrument out, right? Like illustrators when they see a great piece, they think, "Ah, they probably did this using these layers," and can see the layer structure immediately. That's how it feels... a musician can distinguish this.

    The musician can say, "Ah, here the drums are like this, here the bass." But I don't do music, I tried taking lessons but stopped. I can't do that! I don't know it! Even listening to music... I only perceive it as a vibe, whether it feels good or not.

    So when someone in music says, "Ah, this sound is so cool," I'm like, "Eh? Was that even playing?" Then I listen and *then* I can hear it! You know? Don't you all experience that too? People who don't play instruments... well, for us, you can hear a guitar solo. "Ah, the guitar's playing," that much we get.

    When there's vocals, you *don't* think, "Ah, the guitar is on the right." It's just a mash of sound, right? All blended together. That's why... in rhythm games... even though it sounds mashed together, you can't easily catch the rhythm. You end up like, "Where am I supposed to listen?" But I'm so used to just the general vibe... I can roughly ride the rhythm doing "Hey! Hey!" hype calls, but that is it. I can handle live concert calls, but I can't catch the *finer* details, right? That is so true! With rhythm games, "Where is the sound?" you're just not gonna be able to pick it out even if you try.


