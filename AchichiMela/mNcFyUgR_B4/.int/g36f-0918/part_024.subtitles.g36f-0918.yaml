  thoughts: |+
    **A Day in the Life of a Vtuber: My Perspective**

    Okay, so the fans are asking if they can send supportive messages. Of course! I was hoping for some buzz, so yes, please, feel free to send them. I'm hoping to find them via egosearch, especially. Supportive messages are great... something like, "Achichi Meira-san, you're the best!" I'd love to see these on Twitter, or even YouTube comments. The reason is, once tomorrow's stream is over, I won't be looking at Marshmallow submissions anymore since it's meant for stream topics, you know?

    If you prefer to send a letter, that's fine too! Check the description box; the address should be listed there. If you want to send a message, letters are perfectly fine. By the way, Marshmallow submissions? I take those on Twitter! Wait... are there people who don't follow my Twitter? Please follow me, everyone! You can also find a link in the description of my Marshmallow streams – it *should* be there, yep.

    Leaving comments on archives is cool too. I read those, seriously! I don't really like "liking" things much on Twitter or YouTube, not unless it's fan art, basically. I can't like everything, you see. But even if I can't like, I *am* watching! I'm on Twitter constantly when I'm not streaming, practically all day.

    As for clips' comments... well, I do look, but sometimes people write mean things. It's like I take damage! (laughs) I *do* look at them, but it’s a little… ugh. What was I saying? Oh yeah! So, priority-wise, I'm checking comments on my own Twitter and YouTube channel. Those are my main focus, you know? It's fine to see clips, but most people assume that the person they are talking about isn't watching, so I try not to. My own YT comments have the sweetest people. I read the kind ones, yep!

    So, please, it makes me really happy when you leave YouTube comments! I wake up in the morning, do a quick search on Twitter for "Merachi," "Mera-chan," and "Achichi Meira," then I look at the hashtags, and lastly, I check the newest YouTube comments. That's how my day begins!

    So write a lot! It makes me really happy, mmm. Apparently, a lot of comments make it easier to get recommended! So people who watch archives and then comment... People who say, "I watched live, but then I also saw the archive and commented"? I'm so happy! I always feel "Thank you!"

    How many hours do I watch? Pretty much all the time, except when I'm streaming or working, I'm always watching. It's like a hobby, honestly. Basically, I feel like I'm watching with pretty high frequency, pretty much the whole time I'm awake. Yep, I *am* watching. I'm happy! And, always, always watching!

    Do I ever run out of things to look at? Yeah, eventually! Like, when I refresh everything, check all the egosearch results and all the YouTube comments… After I look at everything and I'm like "I'm out of content to see," I look for my fan mark. I'll search on my own fanmark, my fan name and things, and then there are tweets from my fans that pop up. So I check those sometimes, too. But that's just a fun bonus, a bonus element, you know?


...
