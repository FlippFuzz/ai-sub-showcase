  thoughts: |+
    **My Thoughts on the Stream**

    Okay, here's what I'm thinking about this VTuber stream clip. First, it seems like the content is pretty standard stuff. I was thinking that seeing someone less energetic than me or someone more scared helps me feel calmer. It's like when a baby stops crying when another one cries. Then Tsuzuri was freaking out over a ringtone. I just thought "hmm" and went to sleep.

    I've also been thinking about these horror games I've been playing lately. I get this strange muscle soreness whenever I play, especially in my legs and calves. I guess I unconsciously tense up, but even though I get scared, horror games are actually fun! Even though there are jump scares I'm getting used to them and I find them a bit manageable.

    Mela-Gumi is so kind, always making sure I'm okay and that I can stop if it's too much, but honestly, I can handle it surprisingly well. I feel like the horror games I'm playing now are on the mild side. I feel so confident with what I've been playing. So, I will do more, I'm thinking of doing more next week. And I posted the schedule in the community tab!

    I worry about the post-stream heart-pounding, too, even though it's fun. It's like a roller coaster! Scared, but still fun. Speaking of next week, wait, there are going to be two horror games? I was thinking about doing "Platform 8" but what is this "Tanpopo"? Is that a horror game? I wasn't expecting REPO to be a horror game either, I thought it was a treasure-collecting game. But I will be fine, I will play.

    Today is Rhythm Tengoku! I wanted to play this for my debut game stream, but there was a equipment issue. I'm really happy to play it today. I haven't played too many rhythm games before, though. This is my first time with Rhythm Tengoku, and even my first time playing any in the series.


