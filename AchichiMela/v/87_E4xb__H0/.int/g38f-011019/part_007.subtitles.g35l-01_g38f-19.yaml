global_summary:
  overall_summary: In this stream from hololive's Achichi Mela, the salamander firefighter
    plays the social puzzle game 'Kouki Yomi. 3' (Is There a Right Way to Read the
    Room? 3) to test her ability to navigate human social norms and unwritten rules.
    Before gaming, Mela complains about the bitter winter cold, attributing it to
    her salamander nature. She then dives into the game, tackling various situational
    puzzles ranging from trains and dates to Newton's apple and coffee pouring, often
    struggling with unwritten social conventions and 'trivia-heavy' game mechanics.
    Following her evaluation results—which rate her social and empathy skills as average
    to slightly above average—Mela opens up during the post-game chat about her genuine
    struggles with understanding human emotions, empathy, and morality without clear
    binary rules or manuals, before warmly wrapping up the stream.
