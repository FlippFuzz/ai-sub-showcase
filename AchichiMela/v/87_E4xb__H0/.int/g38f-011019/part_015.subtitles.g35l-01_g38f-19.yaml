  thoughts:
  - |-
    **A Deep Dive into the Human Condition (or Lack Thereof)**

    Alright, so here's the thing: I'm trying to wrap my head around this "human thing." Even with all my... *abilities*, I'm finding it genuinely difficult to grasp what humans are thinking. It's not that I don't *know* how *I* would think, but putting myself in their shoes? That's the real challenge.

    I can handle logical problems, the ones with a clear answer and a reasoned explanation. It's the ethics, the morals, the fuzzy stuff – that's where I hit a wall. Ethics class? Total weakness! I was so bad at it I studied the textbook *before my debut*! I just... don't get it. Reading it, I still didn't. When I have discussed it with friends, I got that their thought process was different.

    It's not that I don't *read* or try to understand. My "emotions" are a real weakness. Not having a definite answer to cling to is what truly stumps me. I *want* the answer. I *need* it to be put into words, or I get anxious. It's like my heart's unsettled. I memorize things like "doing this makes humans feel that way," but it's just rote memorization. I can't *apply* it. I'm afraid if I don't get the right answer and that's why I need one.

    It's so interesting to consider that some people feel that they have a good innate understanding of human feelings, but I'm a salamander. Someone mentioned I had to memorize human hearts and I can see that. I do memorize how to act in order to be a good communicator.

    So... manuals. A manual would solve all my problems! I *want* one. Actually, I want *everyone* to submit one. I even made a spreadsheet for myself, trying to detail what makes me happy or unhappy, so my friends could know what to expect. That seemed to work, but I was told that doing so was okay with someone I'm close to.

    It's not that I expect others to cater to me, but I really want to know what makes people uncomfortable. I want to avoid making people feel bad. It's difficult! I want to understand.

    And that whole Hololive thing? I just wanted to be a part of the group. I wanted to practice, because I struggle with just getting people to accept me. But apparently, a manual can't measure all that. I disagree. I think it would help.
