    \ starting at local time 00:00.000 to 04:55.855. I'm aiming for these subtitles!\n\
    \nRight, so, things start off subtle, this \"You seem to vaguely... read the room\"\
    . True enough! It's difficult though, so hard! Then, *achoo!* Oh no, a sneeze.\
    \ No, no, it wasn't on purpose! I didn't mean to sneeze like that! I don't want\
    \ to sneeze! I was startled, you see! \n\nOh! Sparklers... I want to try them!\
    \ But where? It's not like there are many places to do it... I'd really like to\
