    \ at all.\" Oh, is that it? Cha, cha, cha! (He is dancing/posing in the game).\
    \ He can't just stay quiet! Oh, roasted. And \"Today is remote work.\" Here it\
    \ comes!\n\nHmm... humans, they stay in bed during remote work, right? I know!\
    \ During remote work, you don't even... Ah, no! I'm, oh, I'm peeing! This is bad!\
    \ It's a bird! I thought it was a human! I thought a human was going to pee, but\
    \ it was a bird! That's what? What's \"Heh\"? What's \"Heh\"? \n\nOh! They ask\
    \ me about how I'll do with my birthday! They want to give me a surprise! Don't\
    \ you pretend you didn't hear! You endure it by pretending you can't hear, right?\
    \ Oh, the game is also displaying \"Perfume.\"\n\nHmm? Hmm? Oh, perfume... someone\
    \ sprayed it on their face, you see? \"Progress Check: The last 5 questions...\"\
    \ You seem to be casually... watching! I said \"I messed up!\" Wait... it was\
