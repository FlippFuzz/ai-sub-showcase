  thoughts:
  - |-
    **My Thoughts on the Human Condition: A Data-Driven Approach**

    Okay, so like... it's true, even when I seriously try to use all my abilities, I just *really* can't figure out what humans are thinking. It's tough! I can understand "I would think like this," but it's that whole "standing in someone else's shoes" thing that gets me. I was terrible at those "How does the author feel?" questions in Japanese class; luckily, I understand that in those cases the answers were literally in the text. I just... I don't know, really.

    See, when it comes to school-level reading comprehension, there's a *method* to solve it, and I can follow that. But real life isn't like that. There's no fixed answer, and I can't handle things unless the answer is logically explained. I'm seriously terrible at ethics/moral studies! Really bad! I'm so bad that I read ethics textbooks before my debut, but I still didn't get it. Even when Kyoko and others explained it, their ideas were things I'd never think of. I couldn't understand.

    I can't understand what they are thinking. I'm seriously terrible with emotions. I genuinely lack a sense of ethics. I really struggle with things that don't have a clear answer; I *need* answers! If the answer isn't in words, I get really anxious. That absence of a clear answer makes it super difficult. So, do I even have a favorite subject? Maybe English, since I was a returnee, I might have been better at it than people around me.

    It's like, "Do you lack a human heart?" I probably *don't* have a human heart. I don't get it! This is my recent challenge. Don't you just "sort of" understand? That "sort of understanding" is what I really don't get! When someone tells me *after* the fact, I don't necessarily agree, but I memorize it. "Ah, when humans do this, they feel like this." I memorize it like flashcards/Q&A! But since I only memorize it as Q&A flashcards, I can't apply it in other situations! I don't get it; it's hard.

    Why am I trying to find the correct answer? Because I'm anxious! If I don't know the right answer, I get anxious. Not knowing makes me really anxious; my heart feels uneasy and restless. That's why I want to know. It's incredible that some people understand human hearts, but aren't humans often oblivious, too? I'm not. You're a robot? Wait, am I a salamander? I don't know! Is human feeling just memorization? Human feelings aren't memorization, but through communication, I memorize, like "Saying this will make them feel uncomfortable, so let's stop!" I can only resolve issues when a trouble actually happens.

    I learn, through Q&A, that "this is bad," but it's hard. Do I feel relieved if there's a manual? Yes, absolutely! I seriously want everyone to submit their manual to me! I think if we gave each other instruction manuals when interacting, communication would be smoother. I even made my own! Like "This makes me happy; I dislike this," I put it in a spreadsheet and tried to give it to a friend, but someone scolded me. "You shouldn't do this with people you aren't close to." But I want theirs! I don't have to show mine, I want theirs! I want to be given one!

    It's not like I'm showing mine expecting the other person to fulfill all my preferences. I just want to know everything that the other person dislikes! I want them to tell me, because I want to avoid making them feel bad as much as possible. I really want one. But, it's difficult. Why did you choose Hololive when you worry so much about this? I wanted to be included as a comrade; I wanted a place to belong. I'm not good at joining groups, so I wanted to practice. Yeah, but it's hard. Can't measure it with a manual? Is that so? I feel like having a manual would definitely be better, though.
