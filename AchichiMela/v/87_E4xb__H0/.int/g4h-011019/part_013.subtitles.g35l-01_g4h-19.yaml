    original: え！何か過去作の話と繋がってるのじゃ！
    english: Whoa! It's connected to the stories from the previous games!
  - start: '03:46.850'
    end: '03:49.550'
    original: この子もいつか空気を読む日が来るのかな。
    english: I wonder if the day will come when you read the room too.
  - start: '03:52.750'
    end: '03:56.050'
    original: けれど、今「空気読み」って言葉が悪口としても使…
    english: Though, nowadays 'reading the room' is also used as an insul—
  - start: '03:56.100'
    end: '03:57.850'
    original: そうなの！？わしそれ知らない！
    english: Really?! I didn't know that!
  - start: '03:58.650'
    end: '04:03.500'
    original: みんなと違えば「空気を読め」。頼みを聞けなきゃ「空気が読めない」って。
    english: If you're different from everyone else, 'read the room.' If you can't
      do a favor, 'you can't read the room.'
  - start: '04:03.550'
    end: '04:04.800'
    original: あ、たまに言われる。
    english: Oh, people tell me that sometimes.
  - start: '04:05.000'
    end: '04:07.600'
    original: そりゃ、空気を読むってのは大事なことよ？
    english: Of course, reading the room is an important thing.
  - start: '04:07.800'
    end: '04:08.550'
    original: うん。
    english: Yeah.
  - start: '04:11.000'
    end: '04:15.300'
    original: でもそれって、人から強要されてしかたなくやることじゃないと思うの。
    english: But I don't think it's something you should be forced into doing reluctantly
      by others.
  - start: '04:16.500'
    end: '04:17.750'
    original: めくんなきゃいけないのか。
    english: Wait, do I have to flip the pages?
  - start: '04:17.900'
    end: '04:20.300'
    original: 大切なのは…そう、「思いやり」ね。
    english: What's important is... yes, 'thoughtfulness.'
  - start: '04:23.000'
    end: '04:27.450'
    original: 周りに流されるのではなく、周りの人を思いやって空気が読める…
    english: Not just going with the crowd, but reading the room out of care for those
      around you...
  - start: '04:29.500'
    end: '04:32.750'
    original: 芯のある、やさしい強い子に育ってほしいな。
    english: I hope you grow up to be a gentle, strong child with a firm core.
  - start: '04:35.000'
    end: '04:37.900'
    original: 思いやりをもって読んだ空気は…
    english: When you read the room with thoughtfulness...
  - start: '04:41.600'
    end: '04:46.200'
    original: いつかあなたが幸せを掴むとき、あなたの背中を押してくれるはずだから。
    english: One day, when you reach for happiness, it's sure to give you that push
      forward.
  - start: '04:47.550'
    end: '04:49.000'
    original: 幸せになりなさい。
    english: Be happy.
  - start: '04:49.550'
    end: '04:50.550'
    original: 切ない。
    english: So poignant.
  - start: '04:52.100'
    end: '04:53.500'
    original: 愛情でワロタ。
    english: The pure love, lol.
  - start: '04:53.900'
    end: '04:56.000'
    original: なれるわ、あなたなら。
    english: You can do it, if it's you.
  - start: '04:57.100'
    end: '04:58.650'
    original: 愛情や…
    english: So much love...
  - start: '04:58.800'
    end: '05:00.000'
    original: '[Text: 私の、自慢の息子ですもの。]'
    english: '[Text: Because you''re my pride and joy, my son.]'
