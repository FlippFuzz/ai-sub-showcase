  thoughts:
  - |-
    **A Deep Dive into the Human Experience**

    Okay, here's what's been running through my mind. It seems like humans, well, they're not so keen on being given instruction manuals or having themselves explained, which is why that idea got shelved. It just didn't click. It's difficult, you know? There's just so much about people that... well, it defies explanation. I don't understand humans, and I don't want to hurt them, and I really want them to enjoy things, so I want to be close to them, but it's hard.

    I feel like I'm trying, but maybe I'm not focusing my efforts in the right direction. Maybe I'm even doing that to myself. It's frustrating! I want to get used to it, bit by bit. Someone asked, "Don't you think not knowing is fun?" And I'm like... no, actually, it's anxiety-inducing. I want to know everything. The uncertainty makes me restless. But I'll keep trying! I really want to know about humans. Someone asked, "Aren't you happy when you can learn something?" Oh, absolutely! It's pure dopamine! Learning is a dopamine rush for me.

    I want to get used to it. The idea of knowing everything is impossible. There's just too much I don't know, so isn't it better to just accept that? Maybe I worry too much about getting hurt? I don't want to get hurt, and I don't want to hurt anyone else. I need to be more resolved. I don't know if I have the resolve. But I'll keep pushing, little by little. I want to improve my communication skills; it's a recent challenge for me. I want to build up my experience, I want to master 'reading the air'.

    It looks like there's more of that coming, so I want to get to that eventually. Someone said, "You must have been really resolved to come to Hololive," and yes, I have! It was a big decision. But the resolve I had was about being seen by many people, and I don't know if I had enough resolve to actually interact with humans, so that's something I want to work on. First, I'll study the patterns of society with "reading the air" – it's like a beginner course! I'll learn the basics, and then I can apply it through the streams. I will work hard.

    And then, today's stream is finished! I'll see you tomorrow! It looks like there's a collab tomorrow! Tomorrow, it's a horror game, I think. With Kyoko. I'm excited. We'll be doing horror games once a week, so please look forward to it. Farewell! [Sign: Thank you for watching noja!]
