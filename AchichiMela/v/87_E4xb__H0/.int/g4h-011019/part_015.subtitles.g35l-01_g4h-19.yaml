  - |-
    **A Deep Dive into the Human Experience (or Lack Thereof)**

    Alright, so here's the thing... you know. I find myself constantly grappling with humans. Seriously, I pour all my abilities into it, but I just can't grasp what they're *thinking*. It's tough, you know? I can understand *how I* would think, but putting myself in someone else's shoes... that's the hard part.

    I wonder, am I bad at those "what is the author feeling?" questions in class? Not really, when it comes to the author's feelings, the answer is in the text, so it's not hard. It's real-life interactions that throw me. School taught me methods for problem-solving; follow the formula, and you're good. But real life doesn't work that way.

    Like, if there's a fixed answer with a logical explanation, I can handle it. Ethics, though? *Seriously* bad at ethics. Seriously. I studied the textbook before my debut – really studied it. Still didn't get it. Kyoko, even, she would read it and explain it to me, but she kept coming up with ideas that I'd never have thought of. I just didn't understand. I'm *really* bad at ethics class. No idea what they're thinking. Emotions are my weakness. I really have no… no sense of ethics.

    See, I struggle when there's no *clear* answer. I want an answer, a defined answer, you know? If there's no answer put into words, it makes me so anxious. It’s super hard. I'm not good at math subjects, though. And I'm not sure if I was good at any other subjects. I was good at English because I lived abroad, perhaps. But really, maybe I don't have a human heart. I probably don't have a human heart. I don't get it.

    My current challenge? This "don't you kind of just get it?" business. That "kind of just getting it" is what I don't understand. I memorize things afterward. Like, "if you do this, they will feel this way," so I use this in communication. But since I only memorize this as one-to-one Q&A, I can't apply this to new situations. It’s hard.

    Why am I trying to figure out the right answer, anyway? Because I'm anxious. I get anxious if I don't know the right answer. Not knowing makes me really anxious, my heart feels restless. That's why I want to know. It is scary to understand humans hearts. I don't get it. "Are you a robot?" Hey, I'm a salamander. I don't get it.

    So, am I memorizing how people feel? Well, not memorizing how people feel, but in communication, I memorize things like "Apparently saying this or phrasing it like that makes people uncomfortable, so I shouldn't do it." I can only figure it out *after* trouble happens. It's difficult.

    "Would a manual make me feel relieved?" YES. Yes, yes, yes! I want everyone to submit a manual. I once made a manual for myself when I was trying to interact with humans. Things like "this makes me happy and I dislike this." I put it in a spreadsheet and tried to give it to a friend, but they scolded me for trying to hand it to someone I'm not super close to. Yeah, but I still want one.

    I don't have to show mine, I don't have to put mine out in public, I want one. I *want* to be handed one. It's not like I need to show mine and have the other person accommodate it, I don't need that. I just want to know everything about what the other person dislikes having done to them. I want them to tell me, because I don't want to make them feel bad if I can help it. I want one! It’s hard.

    "Why Hololive, if you struggle with this so much?" I wanted to be part of a group of friends. I wanted a place where I belonged too. I’m bad at getting into groups, so I thought I wanted to practice. Yeah, it's hard. Can't measure it with a manual? Really? I feel like having a manual would definitely be better, though.
