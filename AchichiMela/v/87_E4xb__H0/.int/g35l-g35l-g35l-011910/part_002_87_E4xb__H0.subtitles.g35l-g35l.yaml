    to historical references and quirky mini-games—while reflecting on her struggles
    with human social cues, emotional intuition, and reading the room as a firefighter
    salamander from the Edo period. Following the gameplay, she engages in a heartfelt
    zatsudan (chatting) session discussing the difficulties of human psychology, morality,
    and the desire for social connection and instruction manuals.
