  thoughts: "**A VTuber's Whirlwind of \"Kuuki Yomi\"**\n\nOkay, here we go. Let's\
    \ get these subtitles rolling. So, the video begins and...what's this? Ah, well,\
    \ whatever. Different opinions, that's just a matter of personal taste. Totally\
    \ fine. Now, let's get serious. Right, let's get into it! Air reading! Can we\
    \ start? This is a space where you can read the atmosphere freely! No one will\
    \ stop you. A dream world of reading the air. Enjoy! Leave it to me!\n\nRight,\
    \ I get it. Move the red object. I'll move the red object. There may be cases\
    \ where it's not true, in that case read the situation and take a different action!\
    \ Right. Press ESC if you want to quit. Ok! Question 1. Ooh. Finally, a new era...\
    \ the new era name is Reiwa! Wait a minute, they can't see! Is that it? So, I\
    \ had to make it visible. \n\nHmm... Nya! So, to understand the situation... What?\
    \ Ah, this is a train platform! Hold on! They cut in front of me! Oh, humans!\
    \ Humans! I didn't say you could go that far! Doing that much— Ah, ah, I bumped\
    \ into them! Ehehe, I only meant to yield a little! A difficult one came! Baseball\
    \ came! Ah, there's a kid! I want to give it to the kid! To the kid— Wait, how\
    \ do I give it to him? How do I give it? Ah, I caught it... My play—was so clumsy\
    \ that I couldn't give it to the child. But, I had the intention to yield. Eh?\
    \ Ah, the signal... Turn the one next to him green. Oof. It's so hard to grasp\
    \ the situation.\n\n\"Then I will\"... Eh, then I'll leave it to you. Eh? Oh!\
    \ No, I won't do it! And you will not! Eh? What? What is this? Wait, wait, wait...Nnoja?\
    \ Is this right? Wait, is it right? Or not right? Mmm... Ah. Well, if someone\
    \ says they'll do it, just let them. You should just let them! What is Dacho Club?\
    \ What is it? You're supposed to do \"after you\"? What is \"douzo douzo\"? Generation\
    \ gap? I've been around since the Edo period!\n\nNot in Edo? Noja. Question 6!\
    \ \"Let's eat some ramen.\" Okay. Shio ramen, totally shio. Iekei's my favorite,\
    \ but they're really pushing shio, so let's eat shio for them. They must be confident\
    \ in it! I like Iekei ramen. \"Thank you for the meal.\" Okay. Hmm? Oh, fell asleep!\
    \ Step down, step down, step down. Hey, at ramen shops, the bowl and the cup...\
    \ Shouldn't you put them on the counter? Don't you have to clean up? Oh. \"Taking\
    \ the picture!\" \"Taking the picture!\" Eh? I want to join in too!\n\nFrisk.\
    \ Ah, I got one out! Isn't this good? Isn't this good? These spill out all at\
    \ once, right? Yeah, yeah, yeah. \"Moving part-time job. Gotta carry things.\"\
    \ Um, since I'm a boy, to let the girl carry the children's clothes, I will carry\
    \ the heavy one! Is that good? Eh, isn't that good? Eh, awesome, awesome! I'm\
    \ reading it, I'm reading it! Aren't I good at this? Nice! Ooooh~! Eh, with this\
    \ mimicry, it's safe to say I'm basically human. I might be human. There's a very\
    \ high probability that I am a kind-hearted human. Being human for 20 years isn't\
    \ just for show! Let's goooo! Except for mixing in?\n\n\n"
