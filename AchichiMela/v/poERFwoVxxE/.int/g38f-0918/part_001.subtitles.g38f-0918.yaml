  thoughts: |+
    **Aochi Chimera's Ramblings on Scrubbing Tubs and Care Packages**

    Alright, let's see. So, here's what's running through my circuits today. It's Aochi Chimera here, and I've been kicking around, well, for ages, but only pretending to be a human for about 20 years. That makes me feel like I'm a youngster in human terms. Anyway, while I was watching a clip of Suu-senpai's stream, I remembered something I'd completely forgotten to mention! It's about my debut stream. Yeah, I’m still having issues saying that!

    On that day, the senpais from FLOW GLOW and ReGLOSS were super generous, they gave me all sorts of gifts! Like, candy and throat lozenges that I'd never seen, and even some bath salts. Suu-senpai even talked about it during her fishing stream. I was going to mention this the very next day, but I completely slipped my mind! So, now, I want to talk about it now since I saw her clip yesterday. I was so happy!

    So, I did use that eye mask right away, but those bath salts... Well, I get home and I'm always too tired to actually run a bath. I've got them right here, you know. They're all foamy and smell "gentle." That one says "soft relaxation," and I decided that since I have it, I should actually use it.

    I usually take showers, but I sometimes draw a bath. Anyway, today, before the stream, I actually scrubbed my bathtub, just for today, you know? And I'm planning to use the bath salts from Suu-senpai after the stream! It's such a sweet gift, right? Actually, I do take baths, but I take a lot of showers. But I do try to soak once a week.

    Oh, and no, I'm not streaming my bath time. I'm a Showermander, you know? But, well, this is important. It's like, you folks who still live at home, you just don't understand the luxury of having a ready-made bath every single day. I didn't appreciate it either when I lived with my folks. But, man, once you live on your own, you *get* it. Filling a whole tub just for *myself* feels so wasteful. Like, I get in, and then you have to drain all that water just for me. All that water... just for me to soak for, like, maybe half an hour? Plus, you gotta scrub the darn tub every time! It's annoying and wasteful, and it takes time!


