  thoughts: |+
    **A Deep Dive into the Human Condition (and a Visual Novel)**

    Alright, so here's the deal. I was watching this clip from Aochichi Mela, and it really got me thinking. It started with this "matching profile pic" thing – you know, back when I first started using the internet, I had a tough time, but there are always newbies out there, right? Especially online. I was like, wait a sec, let's just clear the "Mushroom vs. Bamboo shoot" debate from the chat, at least for now! Encourage people to leave a like instead, that's more useful.

    And then, I totally forgot something... I was so engrossed in the story that I blanked out. Completely. Terrifying, noja? I'm not touching the Mushroom route, not now, no way. And since we're covering this on stream... I'm not answering any questions about it, noja! Silence! I'm exercising my right to remain silent, noja! It's scary!

    Speaking of which, we were talking about that this morning on "Noja English," it felt like it was foreshadowing all coming together. And as a VTuber who belongs to hololive, it's safer for me to hold back on giving my opinion as Aochichi Mela. It might be different with my friends, but as a VTuber, it can get tricky!

    But, I digress. This visual novel was fun! It was my first one, and now I get the general vibe. Is this the right way to experience them? It feels like you're usually not allowed to just leave, and branching is controlled by dialogue choices, right? That's how it felt to me, noja. But, leaving is the worst, noja. Going home like that is the absolute worst. It hurts! You invited them, why would you be so rude as to go home? I mean, don't you think "Then don't invite her in the first place!"?

    You probably thought "She's cute," so you invited her just thinking that, and then, "Oh, she's only cute?" Is that seriously trash, total scumbag behavior? Isn't that way too much of a scumbag? And that's just not right, noja. You have to take responsibility for your decisions, noja.

    I saw a comment saying "Ouishi-san (or Wiishi) had her feelings hurt." Exactly! You shouldn't invite someone unless you're ready to embrace everything about them! If you can't, don't invite someone you barely know, noja.

    It was so pitiful. That's why otaku guys... No-noja! But honestly, watching that beginning was pretty rough to sit through. My own dark history... well, not dark history, but I was thinking, "This is me!" It was bittersweet, noja. The damage... it just kept hitting me right where it hurts, noja. I had a phase like that too... I thought to myself, "Yeah, I went through that too."

    Sneering and cynicism aren't good. When someone finds something fun, mocking them and laughing isn't okay. Naturally. It's not right, noja. But, to be honest, youth is like that. Honestly, that kind of... what is it, adolescence and...


