  - term: 共感性羞恥
    meaning: Second-hand embarrassment or empathy-induced shame felt when witnessing
      cringeworthy or overly familiar social awkwardness.
  - term: 逆写真詐欺
    meaning: A Japanese internet slang term referring to restaurants (like Komeda
      Coffee) where actual food portions far exceed the menu photos.
  - term: キノコたけのこ戦争
    meaning: The legendary Japanese confectionery rivalry between Meiji's Mushroom
      Mountain and Bamboo Shoot Village snacks.
  - term: サラマンダー
    meaning: Mythological fire lizard and salamander species; Mela's mythological
      background as a firefighter deity.
