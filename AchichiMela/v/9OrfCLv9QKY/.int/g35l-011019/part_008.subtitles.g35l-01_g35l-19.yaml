  overall_summary: 'In this 1-hour 45-minute stream, Hololive Asobi-Mawaritai member
    Hotchi Mela plays the indie visual novel dating game ''Teakano: The Girlfriend
    Who Only Says Cliché Things'' (てあカノ 手垢のついたことしか言わない彼女). Mela experiences deep second-hand
    embarrassment (kyokansei shuchi) as the heroine Moka Moka unironically speaks
    entirely in internet-scraped clichés and trite memes, reflecting Mela''s own past
    awkwardness. The stream features emotional playthroughs of all game endings, discussions
    on internet culture, second-hand embarrassment, and a warm community sign-off.'
