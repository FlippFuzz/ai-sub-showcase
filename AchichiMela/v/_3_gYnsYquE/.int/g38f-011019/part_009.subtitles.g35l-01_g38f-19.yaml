global_summary:
  overall_summary: In this stream from Hololive's的热千めら (Netsuchi Mela), she participates
    in the official Hololive 'Jump King' beginner tournament (#holorace2026) hosted
    by Mori Calliope. Having practiced for only a short time, Mela streams her 1-hour
    race attempt to climb as high up the notorious tower as possible. Despite early
    nerves, unexpected senior VC interruptions, and the steep difficulty of Jump King,
    Mela delivers consistent focus, pushes past her practice limits to reach the sewer
    area, and secures an impressive 2nd place finish overall—earning a luxury massage
    gift card and celebrating with her unit members and fans.
  chapters:
  - start: 00:00
    end: 06:00
    title: Stream Setup & Opening Ceremony Watch Party
    description: Mela starts her stream, deals with minor browser/ad difficulties
      in secret mode, and tunes into the opening ceremony of the Hololive Jump King
      beginner race.
    song_title: null
    song_artist: null
  - start: 06:00
    end: '19:00'
    title: Tournament Opening & Rules Briefing
    description: Host Mori Calliope and co-host review the rules of the 1-hour Jump
      King race, followed by a special encouraging message from the 'Jump King'.
    song_title: null
    song_artist: null
  - start: '19:00'
    end: '47:00'
    title: Race Start & Early-Game Ascent
    description: The 1-hour timer begins. Mela gets startled by a senior's sudden
      voice chat visit, then settles into her jumps, working through early obstacles
      with her signature commentary.
    song_title: null
    song_artist: null
  - start: '47:00'
    end: 01:21:00
    title: Mid-Game Push & Reaching New Heights
    description: Mela surpasses her previous practice records, reaches the sewer area
      (下水道), deliberates on whether to risk further jumps, and successfully locks
      in her 1-hour final position screenshot.
    song_title: null
    song_artist: null
  - start: 01:21:00
    end: 01:43:00
    title: Results Announcement & Winner Interviews
    description: Mela joins the main relay stream to watch the final standings, celebrating
      her 2nd place finish and receiving a special massage gift card alongside 1st-place
      winner Momohi Kyoko.
    song_title: null
    song_artist: null
  - start: 01:43:00
    end: 01:53:16
    title: Stream Reflection & Wrap-up
    description: Mela returns to her own stream to reflect on her unexpected success,
      promotes her upcoming cover song 'Undead', and wraps up with her viewers.
    song_title: null
    song_artist: null
