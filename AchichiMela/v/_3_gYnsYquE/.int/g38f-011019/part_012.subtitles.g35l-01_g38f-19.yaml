global_summary:
  overall_summary: In this stream from Hololive's的热千めら (Netsuchi Mela), she participates
    in the official Hololive 'Jump King' beginner tournament (#holorace2026) hosted
    by Mori Calliope. Having practiced for only a short time, Mela streams her 1-hour
    race attempt to climb as high up the notorious tower as possible. Despite early
    nerves, unexpected senior VC interruptions, and the steep difficulty of Jump King,
    Mela delivers consistent focus, pushes past her practice limits to reach the sewer
    area, and secures an impressive 2nd place finish overall—earning a luxury massage
    gift card and celebrating with her unit members and fans.
  chapters:
  - start: 00:00
    end: 06:00
    title: Stream Setup & Opening Ceremony Watch Party
    description: Mela starts her stream, deals with minor browser/ad difficulties
      in secret mode, and tunes into the opening ceremony of the Hololive Jump King
      beginner race.
    song_title: null
    song_artist: null
  - start: 06:00
    end: '19:00'
