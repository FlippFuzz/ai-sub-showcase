      King race, followed by a special encouraging message from the 'Jump King'.
    song_title: null
    song_artist: null
  - start: '19:00'
    end: '47:00'
    title: Race Start & Early-Game Ascent
    description: The 1-hour timer begins. Mela gets startled by a senior's sudden
      voice chat visit, then settles into her jumps, working through early obstacles
      with her signature commentary.
    song_title: null
    song_artist: null
  - start: '47:00'
    end: 01:21:00
    title: Mid-Game Push & Reaching New Heights
    description: Mela surpasses her previous practice records, reaches the sewer area
      (下水道), deliberates on whether to risk further jumps, and successfully locks
      in her 1-hour final position screenshot.
    song_title: null
    song_artist: null
  - start: 01:21:00
    end: 01:43:00
    title: Results Announcement & Winner Interviews
    description: Mela joins the main relay stream to watch the final standings, celebrating
      her 2nd place finish and receiving a special massage gift card alongside 1st-place
      winner Momohi Kyoko.
    song_title: null
    song_artist: null
  - start: 01:43:00
    end: 01:53:16
    title: Stream Reflection & Wrap-up
    description: Mela returns to her own stream to reflect on her unexpected success,
      promotes her upcoming cover song 'Undead', and wraps up with her viewers.
    song_title: null
    song_artist: null
