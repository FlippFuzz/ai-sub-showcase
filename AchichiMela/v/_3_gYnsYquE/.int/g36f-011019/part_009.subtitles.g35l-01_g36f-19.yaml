    end: 06:15
    title: Stream Setup & Technical Struggles
    description: Mela opens her stream, struggles with browser ads in secret mode,
      and wrestles with mirror/relay stream settings while expressing nervousness
      ahead of the tournament.
    song_title: null
    song_artist: null
  - start: 06:15
    end: '19:50'
    title: Opening Ceremony & Rules Explanation
    description: Hosts Mori Calliope and Hoshifuru Diona introduce the Jump King Newbie
      Race 2026, explain the 1-hour time limit and gameplay rules, and share a special
      opening message from 'Jump King'.
    song_title: null
    song_artist: null
  - start: '19:50'
    end: '47:20'
    title: 'Jump King Race: First Half'
    description: The race officially starts at 19:20 on the game timer. Mela tackles
      the early tower sections while dealing with unexpected voice chat appearances
      and playful distractions from Kobo Kanaeru.
    song_title: null
    song_artist: null
  - start: '47:20'
    end: '74:50'
    title: 'Jump King Race: Second Half & Strategic Play'
    description: Mela navigates trickier mid-game platforming, debates whether to
      keep pushing or play it safe as the 1-hour limit approaches, and ultimately
      surpasses her personal practice record.
    song_title: null
    song_artist: null
  - start: '74:50'
    end: '94:00'
    title: Race Conclusion & Post-Race Chatting
    description: Mela locks in her final position at the 1-hour mark, submits her
      screenshot, celebrates her performance, and chats with viewers about gaming
      mindset and checking competitors' progress.
    song_title: null
    song_artist: null
  - start: '94:00'
    end: '13:16'
    title: Results Announcement & Closing Ceremony
    description: Mela joins the main broadcast for the award ceremony. Hyakuto Kyoko
      wins 1st place and Mela secures an impressive 2nd place finish, winning a luxury
      massage gift card. The stream concludes with group farewells.
    song_title: null
    song_artist: null
