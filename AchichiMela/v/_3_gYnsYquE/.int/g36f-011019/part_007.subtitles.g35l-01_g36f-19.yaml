global_summary:
  overall_summary: In this 1-hour and 53-minute stream, hololive VTuber Atsumi Mela
    from the unit 'Asobi☆Mawaritai!' participates in the official 'Jump King' Newbie
    Holorace tournament hosted by Mori Calliope and Hoshifuru Diona. After overcoming
    initial technical difficulties and a surprise mental attack/distraction from Kobo
    Kanaeru, Mela plays through the notoriously difficult 2D platformer. Using her
    custom jumping rhythm ('achimera'), she pushes past her previous practice limits
    and reaches a personal best just before the 1-hour timer expires. Submitting her
    screenshot, she later joins the main broadcast for the results ceremony, where
    she proudly places 2nd overall, winning a luxury massage gift card, while fellow
    unit member Hyakuto Kyoko secures 1st place.
