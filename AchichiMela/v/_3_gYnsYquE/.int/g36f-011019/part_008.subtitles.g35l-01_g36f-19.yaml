  domain_glossary:
  - term: Jump King
    meaning: A notoriously difficult 2D platformer video game where players climb
      a high vertical tower, infamous for its unforgiving physics where jump trajectory
      cannot be altered mid-air.
  - term: アソビ☆まわり隊！ (Asobi☆Mawaritai!)
    meaning: A hololive VTuber unit/generation consisting of Atsumi Mela, Hyakuto
      Kyoko, Sorashina Sopia, and Suzuna Tsuzuri.
  - term: -のじゃ (Noja)
    meaning: A archaic/fantasy-sounding speech tick (語尾) used by Atsumi Mela at the
      end of her sentences.
  - term: あっちめら (Achimera) / あっちちめら
    meaning: Mela's signature rhythmic vocalization and countdown used while timing
      her Jump King jumps.
  - term: どパる (Doparu)
    meaning: Slang used by Mela representing a rush of dopamine upon successfully
      clearing a difficult jump.
  - term: 下水 (Gesui / Sewers)
    meaning: A notorious underground zone in Jump King; reaching it qualifies participants
      for special consolation prizes such as American barbecue gift cards.
  - term: 二窓 (Nimado)
    meaning: Dual-window viewing, where viewers watch both the participant's independent
      POV stream and the main tournament broadcast simultaneously.
