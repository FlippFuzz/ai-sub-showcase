    end: 06:15
    title: Stream Setup & Technical Struggles
    description: Mela opens her stream, struggles with browser ads in secret mode,
      and wrestles with mirror/relay stream settings while expressing nervousness
      ahead of the tournament.
    song_title: null
    song_artist: null
  - start: 06:15
    end: '19:50'
    title: Opening Ceremony & Rules Explanation
