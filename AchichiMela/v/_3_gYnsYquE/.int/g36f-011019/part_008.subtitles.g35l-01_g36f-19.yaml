      and playful distractions from Kobo Kanaeru.
    song_title: null
    song_artist: null
  - start: '47:20'
    end: '74:50'
    title: 'Jump King Race: Second Half & Strategic Play'
    description: Mela navigates trickier mid-game platforming, debates whether to
      keep pushing or play it safe as the 1-hour limit approaches, and ultimately
      surpasses her personal practice record.
    song_title: null
    song_artist: null
  - start: '74:50'
