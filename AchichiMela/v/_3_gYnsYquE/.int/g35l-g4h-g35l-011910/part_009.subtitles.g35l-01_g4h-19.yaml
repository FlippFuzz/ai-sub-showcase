global_summary:
  overall_summary: This video is a livestream archive from Hololive's Achichi Mela
    (熱千めら) participating in the 'Jump King HoloRace 2026' 1-hour beginner tournament
    hosted by Mori Calliope and Isaki Riona. After overcoming initial technical difficulties
    and pre-race nerves, Mela plays the notoriously difficult 2D platformer 'Jump
    King' for one hour. Despite being a beginner, she exceeds her own expectations,
    reaches new personal heights, strategically locks in her position at the 1-hour
    mark, and achieves an impressive 2nd place finish overall—earning a luxury massage
    gift card and celebrating her success alongside fellow Asobi Mawaritai member
    Hyakuto Kyoko.
