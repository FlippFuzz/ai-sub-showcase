    Okay, so I've got this video archive here: Netsuchi Mela, *that* distinctive name, playing Jump King. It's from a beginner tournament, a whole hour of gameplay, and she snagged second place! My mind immediately starts cataloging the key entities. Netsuchi Mela is the participant, and the channel is *Mela Ch. 熱千めら‐ アソビ★まわり隊!* I should make sure that's correct, and cross-reference. I see Mori Calliope mentioned – she's hosting the race, part of HoloMyth, Hololive English.

    Now, Isozaki Riona... that name rings a bell. Nijisanji? Let me double-check that. Is it *磯崎ひよな*? There's a chance it's another Riona, of course. I need to verify all the participants and their affiliations. Okay, the ASR is saying *“にじさんじののリーダー磯崎ひよなです”*, so, Nijisanji it is.

