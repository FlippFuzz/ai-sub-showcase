  thoughts: |+
    **Reversi Rage and Alien Antics**

    Okay, here's the deal. I was really hyped to subtitle this VTuber clip. Sophia Valentine, the one with the purple hair and the Kirby icon, was playing Reversi with Mela. Or was it Yashiro? No, wait, that blue-haired demon-looking character! Okay, it's Mela, @Achichii_mela. Time to dig in!

    Right from the start, I could tell this was going to be fun. Mela was all "Take this!" and then immediately "Wait, does this corner even mean anything?" Sophia, all casual, grabs the corner and it was off to the races. Mela's constantly shouting 'noja', but getting frustrated with the game, which is tough. And then Mela is losing and doesn't get why, and asks if there is an "alien" in her team (Aries Smart, etc).

    It was a total landslide, a "crushed defeat," as Mela kept shouting, then begging for a skill to change colors in the board. It's like, "Whoa, chill, it's just Reversi!" The chat was calling Sophia's victory "astoundingly white," I thought, it was funny. Sophia was just like, "I'm human!" but Mela still kept wondering how someone could lose so badly in the game if they were also human, then it got hilarious. It reminded me how even the simplest games can get intense with the right personalities.


...
