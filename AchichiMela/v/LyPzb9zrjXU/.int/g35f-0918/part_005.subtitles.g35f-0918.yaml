    \ hear Mell's initial reaction. \"Eh?\" 0:00\n\nWait, did she say \"Shakkin ga\
    \ sugoi!\"? \"Our debt is insane. It's crazy!\" Uh oh, Mell's already in trouble,\
    \ 0:01\n\n\"Huh? Mell-san?\" Did she call out to Sopia? I think she did. Something\
    \ feels off...\n\n\"Something... about the way things are going feels fishy.\"\
    \ Yeah, I get that. 0:07\n\nI can hear Mell asking if she is okay, she seems to\
    \ be saying \"Oh dear.\" She sounds... exasperated. 0:13\n\n\"They're totally\
    \ mocking us.\" I can relate. They're definitely feeling the pressure, and 0:19\n\
    \n\"I will win it back!\" I feel that fighting spirit! Time to turn things around!\
    \ \"Win it back!\" 0:22\n\nOh, here we go. I am now translating. \"Hit! Come on!\"\
