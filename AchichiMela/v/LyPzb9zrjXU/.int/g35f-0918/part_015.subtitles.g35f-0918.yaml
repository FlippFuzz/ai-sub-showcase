responses:
- subtitles:
  - start: '00:00.000'
    end: '00:01.300'
    original: な、なんじゃこれ！
    english: W-What on earth is this?!
  - start: '00:01.300'
    end: '00:03.400'
    original: ふふ、3対3になっちゃった。
    english: Hehe, it ended up 3 to 3.
  - start: '00:03.400'
    end: '00:06.000'
    original: 引き分けになっちゃった。
    english: It ended in a tie.
  - start: '00:06.000'
    end: '00:08.500'
    original: 引き分けで、一騎打ちの勝負は…
    english: So with a tie, the one-on-one showdown is...
  - start: '00:08.500'
    end: '00:12.300'
    original: 引き分け。引き分けかー！
    english: A tie! A tie, huh?!
  - start: '00:12.300'
    end: '00:15.800'
    original: まだね、運と知、どっちが強いかはね
    english: We still don't know which is stronger, luck or intellect.
  - start: '00:15.800'
    end: '00:19.400'
    original: ちょ、分かんなかったってことにする？
    english: Should we just pretend we didn't figure it out?
  - start: '00:19.400'
    end: '00:21.000'
    original: あー
    english: Ah...
  - start: '00:21.000'
    end: '00:24.400'
    original: ちょ、じゃあ一旦、雑談のお部屋戻る？
    english: Should we head back to the chatting room for a bit?
  - start: '00:24.400'
    end: '00:26.500'
    original: 戻るか？
    english: Go back?
  - start: '00:26.500'
    end: '00:28.000'
    original: 戻るか。
    english: Shall we?
  - start: '00:28.000'
    end: '00:32.400'
    original: 戻るのじゃー！
    english: Let's head back!
  - start: '00:32.400'
    end: '00:35.000'
    original: よいしょ。
    english: Alrighty.
  - start: '00:35.000'
    end: '00:38.200'
    original: ふう、戦いが終わったから、お面を外すか。
    english: Phew, now that the battle is over, I'll take off the mask.
  - start: '00:38.200'
    end: '00:41.500'
    original: ふぅ、熱い戦いじゃった。うーん。
    english: Phew, that was a heated battle.
  - start: '00:41.500'
    end: '00:45.300'
    original: もう最後のボクシングで息切れしそうになった。
    english: I almost ran out of breath during that final boxing match.
  - start: '00:45.300'
    end: '00:47.800'
    original: もう連打連打連打！
    english: I was just like, button mash, button mash!
  - start: '00:47.800'
    end: '00:50.100'
    original: おせおせおせ！
    english: Push, push, push!
  - start: '00:50.100'
    end: '00:52.500'
    original: 戦略とかねえ！
    english: No strategy at all!
  - start: '00:52.500'
    end: '00:58.500'
    original: もう考える…『俺はデータを捨てる！』
    english: No time to think... "I'm throwing away my data!"
  - start: '01:05.000'
    end: '01:08.000'
    original: 結局、運も科学もないんじゃ。
    english: In the end, there is neither luck nor science.
  - start: '01:08.000'
    end: '01:12.800'
    original: この世界にあるのはただ一つ。パワーなんじゃ。
    english: 'In this world, there is only one thing: power.'
  - start: '01:12.800'
    end: '01:14.500'
    original: パワー！
    english: Power!
  - start: '01:14.500'
    end: '01:18.000'
    original: 力こそパワーですのじゃ。
    english: Might is right, it's all about power.
  - start: '01:18.000'
    end: '01:21.000'
    original: 最後はパワーが勝つ！
    english: In the end, power wins!
  - start: '01:21.000'
    end: '01:25.500'
    original: あそびまわりたいは、パワー系ユニットじゃ。
    english: Asobimawaritai is a power-based unit.
  - start: '01:25.500'
    end: '01:29.500'
    original: そういうこと？うちらパワーだなって思って集められたの？
    english: Is that so? We were brought together because we're power-types?
  - start: '01:29.500'
    end: '01:38.000'
    original: アソビ大全のボクシングで絶対ガードしなさそうだなって思われて採用されてるのじゃ。
    english: We were probably recruited because they thought we'd never guard in boxing.
  - start: '01:38.000'
    end: '01:40.800'
    original: そこが採用基準だったんだ！
    english: So that was the recruiting criteria!
  - start: '01:40.800'
    end: '01:47.000'
    original: ネオポルテオーディションの採用基準、大事な時にガードするような臆病さがないか。
    english: 'The Neo-Porte audition criteria: "Do they lack the cowardice to guard
      when it matters?"'
  - start: '01:52.000'
    end: '01:55.200'
    original: でも確かに4人ともそんな感じはする。
    english: But indeed, all four of us feel like that.
  - start: '01:55.200'
    end: '02:00.000'
    original: うん。なんかきゅーこもガードとかしなさそう。あ、でもきゅーことはかはゲーム上手いから、しそうか。どうだろう？
    english: Yeah, like, Kyuko doesn't seem like she would guard either. But she's
      good at games, so maybe she would? Who knows.
  - start: '02:00.000'
    end: '02:01.800'
    original: 私、戦略で。
    english: For me, it's about strategy.
  - start: '02:01.800'
    end: '02:06.500'
    original: でもなんかそのパッション的にはもうね、ガードせずに、うおー！って感じで、もありよね。
    english: But in terms of passion, not guarding and just going "Whoa!" also works,
      right?
  - start: '02:06.500'
    end: '02:11.800'
    original: だから、やっぱそのアソビマワリタイらしさが今回見せられたんじゃなかろうか。
    english: So, I think we were able to show what Asobimawaritai is all about this
      time.
  - start: '02:11.800'
    end: '02:16.200'
    original: みなさん、これがアソビマワリタイです。これがアソビマワリタイ、寒色チームなのじゃ。どうじゃかった？
    english: Everyone, this is Asobimawaritai. This is the Asobimawaritai, Cool-Color
      Team. How was it?
  - start: '02:16.200'
    end: '02:22.500'
    original: お主らは、1時間くらい私たちがアソビ大全するの見てて、メラとソピアをどういう二人だと思った？
    english: You guys watched us play Clubhouse Games for about an hour. What kind
      of people did you think Mela and Sopia were?
  - start: '02:22.500'
    end: '02:25.800'
    original: 気にならない？気になる、気になる。
    english: Aren't you curious? I'm curious, I'm curious.
  - start: '02:25.800'
    end: '02:28.000'
    original: 印象変わった？
    english: Did your impression of us change?
  - start: '02:28.000'
    end: '02:30.800'
    original: 始まる前とあとで変わったことあった？
    english: Did anything change from before we started to after?
  - start: '02:30.800'
    end: '02:34.500'
    original: どうじゃ？脳筋じゃねえ？って言われてる。
    english: How is it? They're saying, "Aren't you muscle-brains?"
  - start: '02:34.500'
    end: '02:40.000'
    original: 実際、脳筋。なんかソピアは脳筋じゃと思う、正直。
    english: In reality, muscle-brains. To be honest, I think Sopia is a muscle-brain.
  - start: '02:40.000'
    end: '02:44.200'
    original: ええー？いやいやいや、もうデータキャラですけどね。
    english: Eh? No, no, no, I'm a data character, you know.
  - start: '02:44.200'
    end: '02:49.000'
    original: なんかデータキャラの見た目しながら、『いや、最後はいったれー！』っつって
    english: You have the look of a data character, but then you're like, "No, let's
      just go for it in the end!"
  - start: '02:49.000'
    end: '02:51.500'
    original: やってる、脳筋姉妹って言われてる。
    english: '...and doing that. They''re calling us the muscle-brain sisters.'
  - start: '02:51.500'
    end: '02:57.000'
    original: 脳筋姉妹って言われてる。
    english: They're calling us the muscle-brain sisters.
  - start: '02:57.000'
    end: '03:00.800'
    original: 見た目はね、クールなね、寒色チームなんですけどね。
    english: Though we look like a cool, cool-color team on the outside, you know.
  - start: '03:00.800'
    end: '03:05.000'
    original: うん、いや、やっぱね、青系の色って、やっぱリラックスとかできちゃったり
    english: Yeah. Well, blue colors are supposed to make people relax...
  - start: '03:05.000'
    end: '03:09.500'
    original: なんか静かな、自然とかね、なんかそういうのを想像する落ち着く色じゃない？
    english: '...and imagine quiet nature and stuff, like calming colors, right?'
  - start: '03:09.500'
    end: '03:11.200'
    original: そうじゃよね。あれ？
    english: Right. Huh?
  - start: '03:11.200'
    end: '03:15.800'
    original: うん。なんか脳筋姉妹って言われてる。やっぱ脳筋姉妹しか言われてない。
    english: Yeah. But they're calling us the muscle-brain sisters. They're only calling
      us muscle-brain sisters.
  - start: '03:15.800'
    end: '03:19.500'
    original: おかしいな。ブラックジャックで100しか賭けられないの脳筋じゃって。
    english: That's weird. They're saying only a muscle-brain would only bet 100 in
      Blackjack.
  - start: '03:19.500'
    end: '03:21.000'
    original: あれ100以外にあったの？
    english: Was there any other option besides 100?
  - start: '03:21.000'
    end: '03:26.500'
    original: いや、ないでしょう！あれはもうね、勝負かけるしかねえでしょう。もう人生は、もう最後は勝負。
    english: No, there isn't! In that situation, you just have to bet it all. Life
      is a gamble in the end.
  - start: '03:26.500'
    end: '03:31.500'
    original: うん。そう、アソビマワリタイのクール系でやらせていただいてますけど、やっぱ賭ける時はね。
    english: Yeah. We play the cool roles in Asobimawaritai, but when it's time to
      bet, well...
  - start: '03:31.500'
    end: '03:37.200'
    original: なんか元々ポンと思われてたっぽい。ポンと思われてたっぽいけど、なんか印象が脳筋になったらしい。
    english: Apparently, we were thought of as clumsy before. But now our impression
      has become muscle-brain.
  - start: '03:37.200'
    end: '03:41.500'
    original: これは、なんかどうなんだ？
    english: What is up with this?
  - start: '03:41.500'
    end: '03:47.000'
    original: でもなんか、脳筋だからポンするみたいなとこあるよね。
    english: But you know, being a muscle-brain is kind of why we make clumsy mistakes.
  - start: '03:47.000'
    end: '03:51.500'
    original: あ、確かに。考えないから、で、『いったれー！』っつって
    english: Ah, indeed. Because we don't think, we're just like, "Let's go!"
  - start: '03:51.500'
    end: '03:55.800'
    original: 行くから、よく分かんないけど、とりあえずやってみよう！みたいな感じでやるから
    english: '...and charge. Like, "I don''t really get it, but let''s just try it!"
      That''s how we do it...'
  - start: '03:55.800'
    end: '03:58.500'
    original: ポンしちゃうみたいなところあると思う。
    english: '...so we end up making clumsy mistakes.'
  - start: '03:58.500'
    end: '04:01.000'
    original: あるある、あると思います。
    english: Yeah, totally, I think that's true.
  - start: '04:01.000'
    end: '04:06.500'
    original: え、でもさ、ソピア最初さ、あの、リバーシ、全部真っ白にしてたしさ、あれだいぶ知力なんじゃない？
    english: But look, Sopia made the Reversi board completely white at first. Isn't
      that high-intellect?
  - start: '04:06.500'
    end: '04:10.500'
    original: そう、なんか、ああいうタイプのは、ある程度はできるんだけど
    english: Yeah, I can do those types of games to some extent...
  - start: '04:10.500'
    end: '04:15.500'
    original: やっぱ、あれはさ、もうなんかないじゃん。そういうアクションとかもさ。
    english: But those games don't have any of that, right? Like, action elements.
  - start: '04:15.500'
    end: '04:18.000'
    original: あと、考える時間ももらえるし。
    english: And you also get time to think.
  - start: '04:18.000'
    end: '04:20.500'
    original: あ、確かに、確かに。
    english: Ah, indeed, indeed.
  - start: '04:20.500'
    end: '04:23.500'
    original: そうそう。なんか焦るとソピアは脳筋が出ちゃうから。
    english: Right, right. When I panic, my muscle-brain comes out.
  - start: '04:23.500'
    end: '04:28.000'
    original: あー、なるほどね。パニックになって、『もういいのじゃー！』っつって
    english: Ah, I see. You panic and go, "Whatever, who cares!"
  - start: '04:28.000'
    end: '04:31.500'
    original: そうそう。なんで無限に思考時間もらえたら、ソピア強いかも。
    english: Exactly. So if I had infinite thinking time, Sopia might be strong.
  - start: '04:31.500'
    end: '04:36.000'
    original: あー、なんかソピア思ってるより強かったな。
    english: Ah, Sopia was stronger than I thought.
  - start: '04:36.000'
    end: '04:41.200'
    original: ちょっとソピアをなめてた。え、なんか卑下するじゃん。いや、そんな、ゲームはそんなって。
    english: I underestimated Sopia a bit. Since you always downplay yourself like,
      "Oh, I'm not that good at games."
  - start: '04:41.200'
    end: '04:44.000'
    original: ゲームそんなって。
    english: '"I''m not that good..."'
  - start: '04:44.000'
    end: '04:48.000'
    original: そ、そんな。本当じゃよ。本当じゃよ。
    english: N-No, really. It's true, it's true.
  - start: '04:48.000'
    end: '04:54.000'
    original: ね。だからちょっとね、あの、ソピアはゲームそんなに得意じゃないのかなって思ってたら…
    english: Right. So, I thought Sopia wasn't that good at games, but...
  - start: '04:54.000'
    end: '04:58.000'
    original: 普通に、普通に上手かった。
    english: You were actually really good.
  - start: '04:58.000'
    end: '05:00.000'
    original: ふふん。
    english: Heh.
