global_summary:
  overall_summary: In this video, Hololive's Achichi Mela streams the psychological
    indie RPG 'Too Much Imagination RPG' (気のせいすぎるRPG) by KSB Games. Initially expecting
    a lighthearted comedy adventure, Mela navigates a surreal fantasy world where
    every character and event is wrapped in vague uncertainty and 'feelings' (気がする).
    As the narrative progresses, the game transitions into a psychological horror
    experience revealing that the fantasy world is a delusion of a hospitalized student
    named Hiroshi recovering from trauma, isolation, and an accident. Mela faces intense
    bullet-hell boss battles representing inner mental collapse, successfully finishes
    the game, and concludes with a heartfelt reflection on introspection and mental
    health.
  chapters:
  - start: 00:00
    end: 06:40
    title: Introduction & Game Selection
    description: Mela opens the stream, reads chat, and introduces her first-ever
      RPG stream featuring the newly released indie game 'Too Much Imagination RPG',
      naming her protagonist 'Dopamanda'.
    song_title: null
    song_artist: null
  - start: 06:40
    end: '22:00'
    title: Audience with the King & Castle Exploration
    description: Mela enters the castle where the King declares that a Demon King
      has 'arguably awakened', joined by party members Marsha and Therese who question
      the King's vague reasoning.
    song_title: null
    song_artist: null
  - start: '22:00'
    end: '43:00'
    title: Village Exploration & Encountering Lucius
    description: Mela explores the village, interacts with eccentric villagers and
      a fortune teller predicting world doom, and recruits the self-proclaimed invincible
      companion Lucius, who mysteriously fades from memory.
    song_title: null
    song_artist: null
  - start: '43:00'
    end: '66:00'
    title: Demon King Confrontation & World Breakdown
    description: The party confronts the Demon King, who reveals his sealing was also
      'just a feeling', triggering psychological gaslighting, mental collapse, and
      the dissolution of the fantasy world.
    song_title: null
    song_artist: null
  - start: '66:00'
