    title: Real World Hospital & Psychological Boss Battles
    description: The perspective shifts to reality where the protagonist Hiroshi is
      hospitalized after being hit by a car, leading to intense bullet-hell boss battles
      representing inner psychological trauma and coping mechanisms.
    song_title: null
    song_artist: null
