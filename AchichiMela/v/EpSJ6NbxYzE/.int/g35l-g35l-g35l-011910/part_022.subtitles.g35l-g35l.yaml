  thoughts:
  - |-
    **My Thoughts on Introspection and Self-Reflection**

    Okay, here's what I'm thinking about this video segment, and it's all rather precise, as it must be. I've got a window of time to subtitle, from 00:00.000 to 05:00.008 relative to the video clip. The audio starts off with some considerations on the timing of introspection.  Basically, I'm hearing that it's best *not* to engage in self-reflection when I'm under pressure. It's almost an experience-based observation, which rings true to me. When I'm not in a good place, it's smarter to take notes, revisit them later when I'm more clear-headed, and then I can actually process things constructively.

    Now, as I listen, I'm getting deeper into my own mental model. I start considering if this is actually what I'd consider introspection, versus just getting hung up on negativity. I make a distinction, which is what I always do, between introspection (which has a *goal* - a plan for change, some *direction*), and just going down a rabbit hole of overthinking (which is usually a waste of time.) I think about the way I need to assess what is going on, as opposed to subjective opinion, and it goes a bit further as I consider a full-fledged method.  "How do you want to change?" is the basic question, from *all* angles. Introspection, in my view, is about *countermeasures*. Identify the sadness, separate it, assess. Make a plan.

    I realize that it's best to introspect when I'm mentally sharp, not when I'm already in a bad place.  If I can just *avoid* the negativity, I should. The ideal situation is when you can deal without worrying. But then I get into the question of who introspection is *for*. I conclude that it's for people who want to be *professionals* at something, *the best* at something, to grow, to become athletes. Those are the ones who can benefit from it. For everyone else, it’s not recommended.

