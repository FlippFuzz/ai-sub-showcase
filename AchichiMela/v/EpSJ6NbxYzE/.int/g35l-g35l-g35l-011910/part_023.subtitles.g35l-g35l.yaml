global_summary:
  overall_summary: In this video, Hololive's Achichi Mela streams the psychological
    indie RPG 'Too Much Imagination RPG' (気のせいすぎるRPG) by KSB Games. Initially expecting
    a lighthearted comedy adventure, Mela navigates a surreal fantasy world where
    every character and event is wrapped in vague uncertainty and 'feelings' (気がする).
    As the narrative progresses, the game transitions into a psychological horror
    experience revealing that the fantasy world is a delusion of a hospitalized student
    named Hiroshi recovering from trauma, isolation, and an accident. Mela faces intense
    bullet-hell boss battles representing inner mental collapse, successfully finishes
    the game, and concludes with a heartfelt reflection on introspection and mental
    health.
