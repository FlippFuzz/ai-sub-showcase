    english: Eh, "Dopamanda..." It came! Me, me... who am I again? What am I?
  - start: '03:28.842'
    end: '03:40.042'
    original: 俺の周りに強力なモンスターたちがいる気がしないか？ やっぱ、やっぱ魔王さ、洗脳系の能力者でさ、そう思わせるのが上手いんじゃない？
    english: '"Don''t you feel like there are powerful monsters around me?" I knew
