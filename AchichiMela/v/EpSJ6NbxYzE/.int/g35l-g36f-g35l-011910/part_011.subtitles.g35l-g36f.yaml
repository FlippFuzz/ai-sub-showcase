global_summary:
  overall_summary: In this stream, Hololive VTuber Mela Netsuchi plays the free indie
    psychological horror RPG '気のせいすぎるRPG' (Too Much Imagination RPG) for her very
    first RPG streaming experience. Initially expecting a lighthearted fantasy adventure
    with her protagonist named 'Dopamanda', she navigates a world where every plot
    point, quest, and battle outcome is wrapped in uncertainty ('気がする' / 'it feels
    like'). As the story progresses from a comical fantasy kingdom to a dark psychological
    exploration, it is revealed that the fantasy world is actually the feverish delusion
    of a hospitalized young boy named Hiroshi recovering from a traffic accident and
    injury. Mela navigates the intense action boss fights and emotionally heavy revelations,
    followed by an extensive post-game discussion on self-reflection, mental health,
    and the importance of supportive environments.
