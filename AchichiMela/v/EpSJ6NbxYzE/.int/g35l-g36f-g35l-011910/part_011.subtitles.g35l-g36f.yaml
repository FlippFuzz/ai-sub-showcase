      people believe it!'
  - start: '03:40.312'
    end: '03:43.912'
    original: うわー！強いモンスターがいっぱいなのじゃー！まさか……
    english: Woah! There are so many powerful monsters! "No way..."
  - start: '03:45.312'
    end: '03:46.542'
    original: どうだ勇者よ……
    english: How about it, Hero...?
  - start: '03:47.742'
    end: '03:50.342'
    original: お前はもう負けている気がしないか……？
    english: Don't you feel like you've already lost...?
  - start: '03:52.142'
    end: '03:55.772'
    original: もう降参した方がいい気がするがなぁ……？
    english: Doesn't it feel like it's better to surrender already...?
  - start: '03:56.242'
    end: '04:11.472'
    original: ええ、結構そういう精神攻撃ってさ、しんどいかもなのじゃ。実際に痛みはなくともね、やっぱ精神的な不安定ね、しっかりとね、わしたちを惑わしてきますからね。言霊ってあるのじゃ。
    english: Yeah, that kind of psychological attack can be pretty tough. Even without
      physical pain, psychological instability will definitely throw us off. Words
      carry power.
  - start: '04:13.142'
    end: '04:14.272'
    original: ハロルド……
    english: Harold...
  - start: '04:14.812'
    end: '04:20.912'
    original: いや…… 確かに僕は悪い状況に身を置いている気がする……
    english: '"No... Indeed, I feel like I''m in a bad situation..."'
  - start: '04:22.042'
    end: '04:34.912'
    original: でも…… でも何？そんな中…… そんな中何？マーシャが僕に救いの手を差し伸べてくれる…… そんな気がするんだ…… えー！！
    english: '"But..." But what? "In the midst of that..." In the midst of what? "Marsha
      is reaching out her hand to save me... That''s what I feel..." EH--!!'
  - start: '04:36.542'
    end: '04:54.142'
    original: もしかしてこの世界の勇者と魔王ってさ、両方とも同じ能力を持っていたりしませんか？魔王も洗脳系の能力を持ってるし、勇者も同様の洗脳系の能力を持っていて……
    english: Could it be that the Hero and Demon King of this world both have the
