  - start: '03:37.000'
    end: '03:39.500'
    original: もう、もうこのゲーム終わったけどね。
    english: Geez, this game is practically over then.
  - start: '03:41.000'
    end: '03:44.200'
    original: 終わったけどね。家とか入ってみる？左上から。
    english: Over already. Shall we check out the houses? Starting from the top left.
  - start: '03:45.000'
    end: '03:46.000'
    original: いっぱい人いる。
    english: There are lots of people.
  - start: '03:46.800'
    end: '03:49.800'
    original: 今日はまだご飯を食べてない気がするねぇ……
    english: I feel like I haven't eaten a meal yet today...
  - start: '03:50.000'
    end: '03:55.500'
    original: あ、これわし。これわしね、ちな。ご飯食べたか食べてないか思い出せないわしね。
    english: Ah, that's me. That's me, by the way. Me being unable to remember if
      I've eaten or not.
  - start: '03:56.500'
    end: '03:57.600'
    original: まあ分かる。
    english: Well, relatable.
  - start: '03:58.000'
    end: '04:00.900'
    original: きいてくれハロルド！この前大変なことがあったんじゃ！
    english: Listen to this, Harold! Something terrible happened the other day!
  - start: '04:01.000'
    end: '04:02.000'
    original: なんじゃなんじゃ？
    english: What is it, what is it?
  - start: '04:02.300'
    end: '04:05.800'
    original: 昨日かおとといか……もしかしたら先週だったかもしれないんじゃが……
    english: Yesterday, or the day before... or maybe it was last week...
  - start: '04:06.000'
    end: '04:10.800'
    original: あ、これわし。お主のこと分かるよ、じいさん。わしもね、毎日これ。「いつだっけこれ？」
    english: Ah, that's me. I understand you, Gramps. That's me every single day.
      "Wait, when was this?"
  - start: '04:12.300'
    end: '04:15.500'
    original: ワシが、あの……あれをあれしてたときじゃったんじゃがな……
    english: It was when I was, um... doing that thing with that thing...
  - start: '04:15.800'
    end: '04:18.000'
    original: 分かるよ。じいさん分かる。わしもそんな感じ。
    english: I get it. I get it, Gramps. I'm like that too.
  - start: '04:18.800'
    end: '04:21.000'
    original: 急にグワッと、あれがあれしてきてな……
    english: Suddenly whoosh, that thing started doing that...
  - start: '04:21.300'
    end: '04:25.500'
    original: そしたらワシもウワーッとなって、ダダダダッとなってしまったんじゃ……
    english: Then I also went whoa, and it went rat-a-tat-tat...
  - start: '04:25.800'
    end: '04:29.800'
    original: もう配信者の才能が無さすぎる！説明が下手すぎる！
    english: You have zero talent for streaming! You're so terrible at explaining
      things!
  - start: '04:31.000'
    end: '04:34.500'
    original: ダメだ！お主は、お主は配信者になれない、じいさん。
    english: No good! You, you could never become a streamer, Gramps.
  - start: '04:35.500'
    end: '04:38.800'
    original: そしたら信じられないことにあいつがドガガガガッとあれしてきてな……
    english: Then, unbelievably, that guy came at me going boom-boom-boom with that...
  - start: '04:39.100'
    end: '04:43.800'
    original: いくらなんでもそれはあれじゃろうと思ってな！ワシもあれをこんな感じでこうしてやったんじゃ！
    english: I thought, no matter what, that's going too far! So I took that thing
      and did this to it like this!
  - start: '04:44.200'
    end: '04:46.000'
    original: そしたら突然あれがビシャーッとなってな！
    english: Then suddenly that thing splashed all over!
  - start: '04:46.100'
    end: '04:47.300'
    original: わかった、わかった。
    english: Alright, alright.
  - start: '04:47.400'
    end: '04:48.800'
    original: ワシも水浸しじゃ！水浸しになったことはわかったよ。
    english: I'm soaking wet too! I get that you got soaked, at least.
  - start: '04:49.000'
    end: '04:49.800'
    original: ……で！
    english: '...And then!'
  - start: '04:49.900'
    end: '04:53.000'
    original: 目覚めたらお漏らしした気がしたんじゃ！！
    english: When I woke up, I felt like I'd wet the bed!!
  - start: '04:53.600'
    end: '04:54.600'
    original: 終わってる。
    english: He's hopeless.
  - start: '04:55.000'
    end: '04:59.800'
    original: 終わっ…いや、終わってるとか言うのよくないか。やはり人間はね、あの成長につれて…
    english: Hope... No, maybe I shouldn't say hopeless. As humans grow older, after
      all...
