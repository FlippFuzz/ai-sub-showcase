    original: 気が強くなくていいの？「気のせいかぁ」で諦める性格のやつが勇者パーティーにいていいのか？
    english: Don't you have any backbone? Should someone who gives up with a "just
      my imagination" really be in the hero's party?
  - start: '03:21.400'
    end: '03:26.500'
    original: 勇者パーティーって結構もっとさ、こうオラオラしてない？ギラギラしててさ。
    english: Aren't hero parties usually way more aggressive? Like full of fiery ambition?
  - start: '03:26.800'
    end: '03:31.900'
    original: 「気のせいってのは何のことなんですか！」つって、「おう！」つって。
    english: Demanding, "What do you mean, just our imagination?!" and shouting, "Yeah!"
  - start: '03:32.000'
    end: '03:34.900'
    original: そういうの……じゃないの？
    english: Shouldn't it be like that?
  - start: '03:35.000'
    end: '03:39.500'
    original: いいのか？国民はこの勇者パーティーとこの国王に委ねていいのか？
    english: Is this really okay? Can the citizens really leave their fate to this
      hero party and this king?!
  - start: '03:41.100'
    end: '03:44.200'
    original: 「さあ、勇者ハロルドたちよ！」
    english: '"Now, Hero Harold and companions!"'
  - start: '03:44.300'
    end: '03:47.500'
    original: なんか急に、急に語気がそれっぽくなった。
    english: Suddenly his tone sounds all authoritative.
  - start: '03:48.000'
    end: '03:49.700'
    original: 一貫性がない。
    english: There's zero consistency.
  - start: '03:51.500'
    end: '03:57.000'
    original: 「ワシは、封印を解いた気がする魔王を倒しに行った方がいい気がするのだ！！」
    english: '"I feel it might be best if you went to defeat the Demon King, who I
      feel has broken the seal!!"'
  - start: '03:57.300'
    end: '03:59.000'
    original: ほう。ほう。
    english: Hoh. Hoh.
  - start: '04:00.800'
    end: '04:04.900'
    original: 「Xキーを押せばメニュー画面が開ける気がする……」
    english: '"Pressing the [X] key feels like it would open the menu screen..."'
  - start: '04:05.300'
    end: '04:06.400'
    original: オッケー？
    english: Okay?
  - start: '04:06.800'
    end: '04:09.500'
    original: 「……と思ったが、それは気のせいだった。」
    english: '"...Or so you thought, but it was just your imagination."'
  - start: '04:09.600'
    end: '04:14.200'
    original: ゲームシステムにも馬鹿にされてます！何なのじゃ！？このゲーム何！？
    english: Even the game system is mocking us! What is this, noja?! What even is
      this game?!
  - start: '04:15.500'
    end: '04:18.000'
    original: そ、え？嘘やろ？
    english: Wh—eh? You're kidding, right?
  - start: '04:18.300'
    end: '04:27.500'
    original: こんな、こんなゲームの中じゃなくて、ゲームの外側のUIの部分で「気のせい」出してくることある？
    english: Can they really pull "just your imagination" on us, not even inside the
      game world, but in the external UI?!
  - start: '04:27.700'
    end: '04:29.800'
    original: 何なのじゃ！？
    english: What is this, noja?!
  - start: '04:30.000'
    end: '04:35.500'
    original: え？じゃ、じゃあどうやって出すん？じゃあどうやって出すん、メニュー？
    english: Eh? Then, then how do you open it? How do you open the menu then?!
  - start: '04:35.600'
    end: '04:39.000'
    original: ちょ、話しかけるか。話しかけとかできない感じか？
    english: Wait, let me talk to him. Wait, can I not talk to him?
  - start: '04:39.000'
    end: '04:41.500'
    original: 「頼みたい気がするぞ！！勇敢な者たちよ！」
    english: '"I feel like I want to count on you!! Brave heroes!"'
  - start: '04:42.000'
    end: '04:44.800'
    original: え、奥さんはどう思っとるん、この夫のこと？
    english: Wait, what does the wife think of this husband of hers?
  - start: '04:46.000'
    end: '04:49.500'
    original: 「私からも魔王討伐をお願いしたい気がするわ。」
    english: '"I, too, feel like asking you to subjugate the Demon King."'
  - start: '04:49.600'
    end: '04:51.500'
    original: ああ、王妃終わった！
    english: Ah, the Queen is hopeless too!
  - start: '04:51.600'
    end: '04:54.000'
    original: 王妃もふんわりしてた！王妃もふんわりしてた！
    english: The Queen was wishy-washy too! The Queen was also wishy-washy!
  - start: '04:54.100'
    end: '04:56.500'
    original: もうこの国終わりなのじゃ。
    english: This country is completely doomed, noja.
  - start: '04:56.600'
    end: '04:58.200'
    original: まともな従者とかいないの？
    english: Aren't there any sensible retainers or guards?
  - start: '04:58.300'
    end: '05:00.000'
    original: 従者お前、いいの？こんな……
    english: Retainer, are you seriously okay with this kind of...
