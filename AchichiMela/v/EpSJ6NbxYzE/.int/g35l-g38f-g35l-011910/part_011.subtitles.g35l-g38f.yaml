  - start: '03:43.500'
    end: '03:45.000'
    original: まさか……
    english: It can't be...
  - start: '03:45.500'
    end: '03:47.500'
    original: どうだ勇者よ……
    english: How about it, Hero...?
  - start: '03:47.800'
    end: '03:51.500'
    original: お前はもう負けている気がしないか……？
    english: Don't you feel like you've already lost...?
  - start: '03:52.000'
    end: '03:56.000'
    original: もう降参した方がいい気がするがなぁ……？
    english: I feel like you'd better surrender already...?
  - start: '03:56.500'
    end: '04:02.000'
    original: いい、結構そういう精神攻撃ってさ、しんどいかもなのじゃ。
    english: Ugh, those mental attacks can actually be really rough.
  - start: '04:02.000'
    end: '04:09.500'
    original: 実際に痛みはなくともね、やっぱ精神的な不安ってね、しっかりとね、わしたちを惑わしてきますから。
    english: Even if there's no actual physical pain, mental anxiety really throws
      us off completely.
  - start: '04:10.000'
    end: '04:12.000'
    original: 言霊ってあるのじゃ。
    english: Words have power, after all.
  - start: '04:13.000'
    end: '04:15.000'
    original: うぅ、ハロルド……
    english: Ugh, Harold...
  - start: '04:15.500'
    end: '04:17.000'
    original: いや……
    english: No...
  - start: '04:17.500'
    end: '04:21.500'
    original: 確かに僕は悪い状況に身を置いている気がする……
    english: Certainly, I feel like I've put myself in a terrible situation...
  - start: '04:22.500'
    end: '04:24.000'
    original: でも……
    english: But...
  - start: '04:23.500'
    end: '04:24.800'
    original: でも何？
    english: But what?
  - start: '04:25.000'
    end: '04:27.000'
    original: そんな中……
    english: In the midst of all this...
  - start: '04:26.500'
    end: '04:27.800'
    original: そんな中何？
    english: In the midst of what?!
  - start: '04:28.500'
    end: '04:32.500'
    original: マーシャが僕に救いの手を差し伸べてくれる……
    english: Marsha will reach out a helping hand to me...
  - start: '04:33.000'
    end: '04:35.500'
    original: そんな気がするんだ……
    english: That's what it feels like...
  - start: '04:35.500'
    end: '04:37.000'
    original: ええええ！？
    english: Ehhhh?!
  - start: '04:37.500'
    end: '04:43.500'
    original: もしかしてこの世界の勇者と魔王ってさ、両方とも同じ能力を持っていたりしませんか？
    english: Could it be that in this world, both the Hero and the Demon King have
      the exact same ability?
  - start: '04:43.800'
    end: '04:53.000'
    original: 魔王も洗脳系の能力を持ってるし、勇者も同様の洗脳系の能力を持っていて……
    english: The Demon King has brainwashing abilities, and the Hero also has similar
      brainwashing abilities...
  - start: '04:55.000'
    end: '04:56.000'
    original: お？
    english: Oh?
  - start: '04:56.000'
    end: '04:58.500'
    original: 私が……？
    english: That I...?
  - start: '04:59.000'
    end: '05:00.000'
    original: どうだマーシャ……
    english: What do you say, Marsha...?
