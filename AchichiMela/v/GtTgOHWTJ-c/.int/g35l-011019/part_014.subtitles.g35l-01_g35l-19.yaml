global_summary:
  overall_summary: In this 74-minute YouTube live stream on her channel Mela Ch.,
    Hololive VTuber Netsuchi Mera (熱千めら) hosts her very first all-Vocaloid and synthetic
    voice song-limited karaoke stream (ボカロ歌枠). Mera performs an energetic 8-song setlist
    featuring popular tracks including Junky's 'Happy Halloween', Namiguro's 'Zunda
    Party Night' (complete with a Zundamon costume reveal), ryo's 'Melt', DECO*27's
    'Cherry Pop', Omoi's 'In Case You're Gonna Jump', Iyowa's 'Kyūkurarin' (accompanied
    by manual multi-avatar layer toggling), PinocchioP's 'Tensei Ringo', and DECO*27's
    'Hibana'. Between songs, she shares her passion for high-speed, high-difficulty
    Vocaloid music, interacts with fans, and closes with upcoming schedule announcements.
