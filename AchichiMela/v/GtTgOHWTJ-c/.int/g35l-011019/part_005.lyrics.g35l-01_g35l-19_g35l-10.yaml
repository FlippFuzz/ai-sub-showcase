  - start: '00:00.220'
    end: '00:04.160'
    original: うん、ボカロしって…で、まだしりたての頃とかじゃったから、
    english: Yeah, Vocaloid was... well, back when I had just learned about it,
  - start: '00:06.180'
    end: '00:10.500'
    original: だから、ボカロしりたての頃って、
    english: So, back when I had just discovered Vocaloid,
  - start: '00:11.120'
    end: '00:15.540'
    original: 歌詞聞き取れなくない？ なんなら今でも聞き取れないけどね、わし。
    english: couldn't you catch the lyrics? Honestly, I still can't catch them, you
      know.
  - start: '00:15.540'
    end: '00:17.480'
    original: わしボカロめっちゃ聴くけど、
    english: I listen to a ton of Vocaloid, but...
  - start: '00:17.920'
    end: '00:24.420'
    original: あの、歌詞聞き取れないし、誰が歌ってるかとかも調整によっては全然判断つかない時あるのじゃ。
    english: like, I can't catch the lyrics, and depending on the tuning, sometimes
      I can't tell who's singing at all.
  - start: '00:26.960'
    end: '00:33.940'
    original: メルトの歌詞が「メルト溶けてしまいそう」なんじゃけど、メルトだから溶けるんだけどさ。
    english: The lyrics for Melt go "Melt, I feel like I'm melting," well, it's Melt
      so she melts, but...
  - start: '00:34.020'
    end: '00:39.980'
    original: わし初めてメルト聴いた時、「メルトはわたしの理想」に聞こえた。
    english: when I listened to Melt for the very first time, I misheard it as "Melt
      is my ideal."
  - start: '00:41.040'
    end: '00:44.740'
    original: 超すごい覚えてる。全然聞き取れないの、ボカロって。
    english: I remember that super well. You just can't catch the words in Vocaloid
      at all.
  - start: '00:45.080'
    end: '00:50.040'
    original: それもまた合成音声のいいところであるのじゃ。
    english: That's also part of the charm of synthesized voices.
  - start: '00:51.040'
    end: '00:52.540'
    original: いや、音なんだよね、そうなの。
    english: No, it's about the sound, right, exactly.
  - start: '00:53.040'
    end: '00:56.540'
    original: そうなの、わかんないよね。そう、「理想」に聞こえたの。
    english: Exactly, you don't know, right? Yeah, it sounded like "ideal."
  - start: '00:59.860'
    end: '01:03.960'
    original: それでは、メルト…
    english: Well then, Melt...
  - start: '01:03.960'
    end: '01:08.960'
    original: メルトどこがにゃ、これか？ これか？ これか？
    english: Where's Melt... is this it? Is this it? Is this it?
  - start: '01:12.780'
    end: '01:18.080'
    original: 頑張っちゃうよ！メルト歌うのじゃー！よいしょ！
    english: I'll do my best! I'm gonna sing Melt! Here we go!
  - start: '01:41.120'
    end: '01:45.320'
    original: 朝 目が覚めて 真っ先に思い浮かぶ 君のこと
    english: The very first thing that comes to mind when I wake up in the morning
      is you.
  - start: '01:45.320'
    end: '01:53.860'
    original: 思い切って 前髪を切った 「どうしたの？」って 聞かれたくて
    english: I made up my mind and cut my bangs, hoping you'd ask, "What's wrong?"
  - start: '01:53.860'
    end: '02:04.920'
    original: ピンクのスカート お花の髪飾り さして 出かけるの 今日の私は かわいいのよ！
    english: A pink skirt and a floral hair ornament, stepping out today, I'm so cute!
  - start: '02:21.080'
    end: '02:32.480'
    original: メルト 溶けてしまいそう 好きだなんて 絶対にいえない… だけど
    english: Melt, I feel like I'm melting. I could never say I love you... but
  - start: '02:32.480'
    end: '02:44.740'
    original: メルト 目も合わせられない 恋に恋なんてしないわ わたし
    english: Melt, I can't even meet your eyes. I don't just fall in love with love,
      me.
  - start: '02:44.740'
    end: '02:49.980'
    original: だって 君のことが… 好きなの
    english: Because I... I love you.
  - start: '03:01.000'
    end: '03:12.300'
    original: 天気予報が ウソをついた 土砂降りの雨が降る カバンに入れたままの オリタタミ傘 うれしくない
    english: The weather forecast lied, a downpour of rain is falling. My folding
      umbrella stays inside my bag, not happy at all.
  - start: '03:12.300'
    end: '03:22.560'
    original: ためいきを ついた そんなとき 「しょうがないから入ってやる」なんて
    english: I let out a sigh. At a time like that, you said, "Well, can't be helped,
      I'll share mine,"
  - start: '03:22.560'
    end: '03:33.480'
    original: 隣にいる きみが笑う 恋に落ちる音がした
    english: and the you beside me smiled. I heard the sound of falling in love.
  - start: '03:36.140'
    end: '03:41.780'
    original: メルト 息がつまりそう 君に触れてる右手が 震える
    english: Melt, I feel like I'm running out of breath. My right hand touching you
      is trembling.
  - start: '03:41.780'
    end: '03:52.740'
    original: 高鳴る胸 はんぶんこの傘 手を伸ばせば届く距離 どうしよう…！
    english: My pounding heart, sharing the umbrella. If I reach out our hands will
      touch, what should I do...?!
  - start: '03:57.640'
    end: '04:05.900'
    original: 想いよ届け 君に お願い 時間をとめて
    english: Reach him, my feelings. Please, stop time.
  - start: '04:05.900'
    end: '04:17.340'
    original: 泣きそうなの でも嬉しくて 死んでしまうわ！
    english: I feel like crying, but I'm so happy I could die!
  - start: '04:51.500'
    end: '04:59.000'
    original: メルト 駅に着いてしまう… もう会えない
    english: Melt, we're arriving at the station... we won't be able to meet anymore.
