global_summary:
  overall_summary: 本動画は、ホロライブプロダクション所属の新ユニット「アソビ★まわり隊！」のメンバーである火消し屋のサラマンダー・熱千めらによる、自身初となるボカロ縛り歌枠配信である。X（旧Twitter）で募集した1000件以上のリクエストから厳選されたボカロおよび合成音声の人気楽曲全8曲（「ハッピーハロウィン」「ずんだパーリナイ」「メルト」「チェリーポップ」「君が飛び降りるのならば」「きゅうくらりん」「転生林檎」「ヒバナ」）を熱唱した。楽曲の合間には、ボカロ曲の人間離れした難易度や魅力について語る軽妙な雑談や、手動での分身レイヤー演出など、ユーモアに満ちた楽しい配信となっている。
