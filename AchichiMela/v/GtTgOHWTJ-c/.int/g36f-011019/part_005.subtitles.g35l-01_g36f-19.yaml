    persona_lore: 「火の用心じゃ〜！わしが火消しのサラマンダーじゃ！」が口癖の元気な火消し屋のサラマンダー（火蜥蜴）。ホロライブプロダクション所属の新ユニット【アソビ★まわり隊！】の「ご利益」担当。江戸っ子からも可愛がられていた過去を持ち、人間からもらった愛情の恩返しのために防火に励んでいる。
    speech_patterns_or_ticks: 語尾に「〜のじゃ」「〜じゃ」、一人称は「わし」。挨拶や相槌に「あらあら〜、めらめら〜、あちち〜めらー！」「のあちゃん」「おぬしら」などを使用する。
    visual_cues: 赤やオレンジの炎をモチーフにしたサラマンダーの少女アバター。頭部にお面をつけている。
  domain_glossary:
  - term: ボカロ縛り歌枠
    meaning: ボーカロイドおよび音声合成ソフトを使用した楽曲のみを歌う音楽配信企画。
  - term: アソビ★まわり隊！
    meaning: 熱千めらが所属するホロライブの新ユニット。メンバーは熱千めら、百灯キョーコ、鈴鳴つづり、宙科そぴあ。
  - term: ずんだもん
    meaning: 東北ずん子の関連キャラクターであり、音声合成ソフトVOICEVOX等で人気のキャラクター。本配信では仮装のモチーフや楽曲の題材として登場。
  - term: PNG
    meaning: セットリストを表示するために使用している透過画像ファイル形式。配信上ではテキストファイルをPNGに変換してトリミングしながら表示している。
  - term: サラマンダー
    meaning: 熱千めらの種族である伝説上の火蜥蜴。火消し屋として人間社会で活動している設定。
  - term: めら組
    meaning: 熱千めらのファンの総称。生配信タグやファンアートタグ(#めら組出動中、#めら組絵図)などで使用される。
