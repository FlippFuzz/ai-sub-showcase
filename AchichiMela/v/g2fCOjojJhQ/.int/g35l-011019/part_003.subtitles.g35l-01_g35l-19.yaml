global_summary:
  overall_summary: 'In this stream from Mela Ch. 熱千めら‐ アソビ★まわり隊!, Hololive VTuber
    Achichi Mela plays the game ''Tanpopo wa Taeru'' (given to her by Okayu-senpai)
    under a comedic roleplay premise: she has been parasitized by a dandelion, turning
    her signature ''noja'' speech tick into ''popo'' (making her a ''Popomander'').
    To reclaim her true identity, she must nurture the dandelion through years of
    simulation and successfully master rhythm-parry challenges against obstacles like
    babies, cats, and drunkards. After conquering the boss rush, she breaks free from
    the parasite, returns to her normal ''noja'' persona, and concludes the stream
    by announcing her upcoming weekly schedule.'
