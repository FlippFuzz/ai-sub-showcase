    original: こうやってタンポポの人生を体験することでタンポポの気持ちになれるぽぽね。
    english: By experiencing a dandelion's life like this, we can understand how a
      dandelion feels, popo.
  - start: '00:08.352'
    end: '00:13.452'
    original: やはり人間やサラマンダーというのは自分勝手ぽぽ。自分の見える範囲のことで精いっぱいぽぽね。
    english: Indeed, humans and salamanders are selfish, popo. They only care about
      what's in their own field of vision.
  - start: '00:18.000'
    end: '00:25.000'
    original: 人間とかサラマンダーとかその他の生き物は自分の視点ばっかで精いっぱいじゃから、その他のことをあまり気にする余裕がないですぽぽ。
    english: Humans, salamanders, and other creatures are so focused on their own
      perspectives that they don't have the luxury to care about anything else, popo.
  - start: '00:31.000'
    end: '00:35.000'
    original: ないけど、こうやってゲームとかをすることによって、いろんなものの視点に立つことができるかもしれないぽぽね。
    english: That may be true, but by playing games like this, perhaps we can stand
      from the perspective of various things, popo.
  - start: '00:37.000'
    end: '01:25.000'
    original: |-
      [Title: -Tips-
      タンポポの花は、実は100～200の小さな花が集まって一つの花のように見えている。また、セイヨウタンポポとニホンタンポポの違いとして、花の付け根にある総苞片の形がある。セイヨウタンポポは外側の総苞片が下に反り返り、ニホンタンポポは上向きで内側に付いている。]
    english: |-
      [Title: -Tips-
      Dandelions are actually made of 100 to 200 small flowers gathered together to look like one. Also, the difference between Western and Japanese dandelions lies in the shape of the involucre at the base of the flower. In Western dandelions, the outer involucre curls downward, while in Japanese dandelions, it points upward and inward.]
  - start: '01:27.500'
    end: '01:32.500'
    original: あっ、もう白蝶！春が来たぽぽ！春が来たぽぽね！
    english: Ah, a cabbage white butterfly! Spring has come, popo! Spring has arrived,
      popo!
  - start: '01:33.000'
    end: '01:46.000'
    original: 桜が咲いてますぽぽ、4月5日 清明 桜雲と赤子。そろそろ花も咲いてくるんじゃないぽぽ？どうぽぽか？セイヨウタンポポ、はっ、355日！花が咲いてますぽぽ！
    english: 'Cherry blossoms are blooming, popo. April 5th, Qingming: Cherry Blossom
      Clouds and Baby. Won''t the flowers be blooming soon, popo? How is it, popo?
      Western dandelion, ha, 355 days! The flower is blooming, popo!'
  - start: '01:48.000'
    end: '02:13.000'
    original: うん、すごい！花が咲いているし、やっぱ春じゃから栄養も豊富！光合成し放題ですぽぽ！ちょっと水がね、H2Oが足りないぽぽがお、よいしょ。それ以外の要素は、あ、あの人が上げた水を拝借していただきますぽぽね。
    english: Yeah, amazing! The flower is blooming, and since it's spring, there's
      plenty of nutrition! Unlimited photosynthesis, popo! We're a bit short on water,
      H2O, popo, but... heave-ho. As for the other elements, ah, we'll borrow the
      water that person gave, popo.
  - start: '02:14.000'
    end: '02:21.000'
    original: よいしょ。細胞分裂、うんうんうん、5倍にしますぽぽ。ドッパンダーですぽぽ！
    english: Heave-ho. Cell division, yep yep yep, we'll make it 5x, popo. It's doppander,
      popo!
  - start: '02:21.000'
    end: '02:55.000'
    original: いっぱいの栄養！たくさんの桜！日本の春ですぽぽ！いっぱい育って、いい子ぽぽね！大きくなったぽぽね！これどうしたら耐えることになるぽぽ？あの、まだ耐える要素が1個も表れてませんぽぽ。じゃからわしのが、じゃが、あの変、変動されませんぽぽ、いっしょう。わし、ぽぽマンダーぽぽ、タンポポに
    english: Plenty of nutrition! Lots of cherry blossoms! It's Japanese spring, popo!
      Growing up a lot, what a good kid, popo! You've grown big, popo! How is this
      going to result in enduring, popo? Uh, not a single enduring element has appeared
      yet, popo. So my... wait, it doesn't fluctuate, popo, forever. I am Popomander,
      popo, to the dandelion...
  - start: '02:56.000'
    end: '03:40.000'
    original: タンポポに規制された状態のまま1年が経ってしまいますぽぽ！耐える要素がない！いつまで耐えるぽぽ？育成、何年育成できるか的な、そういう感じぽぽか？まだわし、何も、何も耐えてないし何も守ってないぽぽ。細胞分裂、ええ、速度5倍ぽぽ！はいはいはいはい、拝借、拝借。いただきますぽぽ！うんうん、あ、もう死にんできるけになった。H2Oをいただくか。春だからね、うんうん。
    english: Remaining under the dandelion's control for a whole year, popo! There's
      no enduring element! How long will we endure, popo? Cultivation, how many years
      can we cultivate, something like that, popo? I still haven't endured anything
      or protected anything, popo. Cell division, uh, 5x speed, popo! Yes yes yes,
      borrow, borrow. Thanks for the meal, popo! Yep yep, ah, I can finally die-in...
      get H2O. Because it's spring, yeah yeah.
  - start: '03:42.000'
    end: '03:52.000'
    original: んっ？あっ！オープニングで見たベビーカーの赤ちゃん！あっ、必死型的に東京か？赤ちゃんがおばあちゃんと会話をしていますぽ！
    english: Hmm? Ah! The baby in the stroller we saw in the opening! Ah, is this
      Tokyo in a desperate sense? The baby is having a conversation with grandma,
      popo!
  - start: '03:56.000'
    end: '03:59.000'
    original: はあ！？耐えるってそういうことぽか！？
    english: Huh?! So that's what 'enduring' means, popo!?
  - start: '04:00.000'
    end: '04:03.000'
    original: 耐えるってそういうこと？
    english: Enduring means that?
  - start: '04:05.000'
    end: '04:10.000'
    original: ぽぽーーっ！泣いている！赤子が泣いてるぽぽ！
    english: Popooo! It's crying! The baby is crying, popo!
  - start: '04:11.000'
    end: '04:14.000'
    original: あ、なんかBGMの感じが変わった！えっ！？
    english: Ah, the BGM's vibe changed! Eh?!
  - start: '04:15.000'
    end: '04:19.000'
    original: えっ！？はっ！本編始まったぽぽね！
    english: Eh?! Ah! The main game has started, popo!
  - start: '04:19.470'
    end: '04:26.970'
    original: お主ら、わしがタンポポからの、タンポポの規制から解き放たれるために、耐えさせていただきますぽぽ！
    english: Everyone, in order for me to break free from the dandelion's control,
      I shall endure, popo!
  - start: '04:27.130'
    end: '04:31.000'
    original: 遊び方！ええ、左クリックを押している間は「耐える」ことができる。
    english: How to play! Uh, while holding left click, you can 'Endure'.
  - start: '04:31.500'
    end: '04:37.000'
    original: ええ、耐えていないときは相手の攻撃を受けてしまうと大ダメージ！おっ！そういうことぽか！？
    english: Ugh, if you're not enduring and get hit by the opponent's attack, it's
      massive damage! Oh! Is that what it means, popo!?
  - start: '04:38.000'
    end: '04:44.000'
    original: パリーって！攻撃に合わせてタイミングよく「耐える」とパリーすることができる。
    english: A parry! If you time your 'Endure' with the attack, you can parry.
  - start: '04:44.500'
    end: '04:52.000'
    original: ファンタジーぽか！？ファンタジーの技構築でしか効かないパリーというものがでてきましたぽぽ！なるほど！
    english: Is this fantasy, popo!? A parry that only works with a fantasy skill
      build has appeared, popo! I see!
  - start: '04:42.000'
    end: '04:58.000'
    original: 攻撃に合わせタイミングよく左クリックを……押すことで！
    english: By pressing left-click with good timing to match the attacks...
