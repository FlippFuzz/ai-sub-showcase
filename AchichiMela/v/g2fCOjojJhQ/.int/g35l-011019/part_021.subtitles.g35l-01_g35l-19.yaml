    original: なんか、あの、8番出口ライくなゲームと聞いていて、8番出口ライかな、しらすあとーのゲームだと聞いております。楽しみですのじゃ。異変を見つける感じかな。頑張って異変見つけていこうと思うますのじゃー！
    english: I heard it's a game like Platform 8, or rather, a game like Shiraz Art.
