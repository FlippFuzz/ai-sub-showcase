  - start: '03:08.575'
    end: '03:22.465'
    original: ジャンプキング初めてなんじゃけど、なんか初心者ばかりの大会らしいから頑張りますのじゃ。むずいらしいけど頑張ります。ちょっと練習もしたい気持ちあり。
    english: It's my first time playing Jump King, but it seems to be a tournament
      for beginners only, so I'll do my best, noja! It looks tough, but I'll do my
      best. I also feel like practicing a bit.
  - start: '03:23.465'
    end: '03:35.435'
    original: そして31日ハロウィンの日は遊び回りたいでハロウィンコラボのじゃ、マシュマロ読みをしますのじゃ、京子のチャンネルで行いますのじゃ！
