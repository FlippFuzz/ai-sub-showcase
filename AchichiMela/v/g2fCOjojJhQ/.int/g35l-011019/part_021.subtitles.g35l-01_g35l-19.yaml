  - start: '03:36.325'
    end: '03:50.045'
    original: そしてつい日、11月になっちゃう。11月の1日は、え、新幹線0号、こちらホロゲームでございます、お姉さん。ホロゲームで遊ばせていただきますのじゃ！
    english: And then the next day, it becomes November! November 1st is Shinkansen
