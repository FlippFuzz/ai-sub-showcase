  - start: '04:44.295'
    end: '05:00.000'
    original: 今日の配信はじゃあこれででおしまい様にしようかな。おしまいにします。頑張った！タンポポ頑張った！乗っ取られながらね、タンポポに寄生されながら頑張りましたのじゃー！たくさんの応援ありがとうございました！
    english: Today's stream will end here, I guess. I'll wrap it up. I did my best!
      The dandelion did my best! While being taken over, while parasitized by the
      dandelion, I worked hard, noja! Thank you very much for all the support!
  thoughts:
  - |-
    **Weekly Schedule & Stream Wrap-up**

    Okay, here's the deal, breaking down my thoughts as I went through the schedule announcement. First, gotta make sure we've got the timestamp right for Mela's announcement. Let's make sure the audio and video align for accurate transcription. Alright, here's what I'm thinking: "And one more thing! Um, I'm going to announce next week's schedule, noja!" is the starting point. Monday will be GeoGuessr! It's been a while since I played after my debut and since I’ve been thinking about getting back into it so I'll be playing Geoguessr. I’ll make sure it's a fun one. The 27th is a day off. Wednesday the 28th, Noja English in the morning, and a themed singing stream at night! I'm planning on a Vocaloid-only singing stream! I'm going to sing lots of Vocaloid songs because I'm finally dedicating a stream to it. And I'm currently taking song requests on Twitter! If you have a request, send me a reply and I might check it out, noja! Thursday the 29th, at 8:00 PM, I get to collab with a senior! And it's AZKi-senpai! I've been wanting to play GeoGuessr with her for ages, and after hearing her talk about it, the plan is to get to know each other through chat before we jump into the game. Friday the 30th, I'm joining the Hololive Jump King Beginner Tournament! I'm a newbie at Jump King, but it sounds like a beginner-friendly tournament. I’ll be with Calliope-senpai and Riona-senpai! And finally, October 31st, Halloween day, I'm doing a Halloween collab, reading marshmallows at Kyo's channel! November 1st, it's Shinkansen 0, a horror game that I heard is like Platform 8 or Shiraz Art. As usual, once a week—not that it's mandatory, but not mandatory—I have been putting in a horror game and I'm looking forward to finding anomalies. So that's the schedule, everyone should look forward to it. And now, that's a wrap on the stream.
