response:
  subtitles:
  - start: '00:01.385'
    end: '00:05.965'
    original: わしが、お主らといつものように、おしゃべりをできるようにするために、努力は欠かしませぬぽぽね。
    english: To make sure I can chat with you all just like usual, I'll keep doing
      my absolute best, popo!
  - start: '00:10.033'
    end: '00:19.493'
    original: あ、細胞分裂きたぽぽ。えっと、死ねるCO2、死ねる、は！光合成のスピードが3倍ぽぽね！ぽぽぽぽぽぽぽ！
    english: Ah, cell division is here, popo. Let's see, CO2 that can kill, that can—
      Ha! Photosynthesis speed is three times faster, popo! Popopopopopo!
  - start: '00:19.493'
    end: '00:26.543'
    original: ばくそくにしていきますぽぽ！どっぱマンダリスぽぽー！
    english: I'll make it super fast, popo! Total mandalish, popo!
  - start: '00:30.983'
    end: '00:33.223'
    original: いけるか？3倍ってすごいいんじゃない？
    english: Can I make it? Three times is amazing, right?
  - start: '00:33.223'
    end: '00:46.063'
    original: '[Title: -Tips-] タンポポは晴れた日に花を開き、曇りや雨の日は花を開かない。光の量に応じで開閉運動をおこなうためである。この性質は花粉を雨粒から守ることに貢献しているぽぽ。'
    english: '[Title: -Tips-] Dandelions open their flowers on sunny days and keep
      them closed on cloudy or rainy days. This is to perform opening and closing
      movements according to the amount of light. This property contributes to protecting
      pollen from raindrops, popo.'
  - start: '00:46.063'
    end: '00:52.543'
    original: なるほど。花粉が雨に濡れちゃったら、その花粉はダメになっちゃうぽぽか？
    english: I see. If the pollen gets wet in the rain, does that pollen become useless,
      popo?
  - start: '00:54.673'
    end: '00:59.083'
    original: あ、雨降った。6月4日 芒種、走り梅雨。やっぱ6月はね梅雨がなかなか降りやすいですぽぽ。
    english: Ah, it started raining. June 4th, Bōshu, early rainy season. June really
      tends to have a lot of rain, popo.
  - start: '01:00.273'
    end: '01:06.013'
    original: セイヨウタンポポ50日目。大きくなったぽぽ！
    english: Common dandelion, day 50. It got big, popo!
  - start: '01:06.773'
    end: '01:21.433'
    original: 雨の日じゃから開かんけど、育てる分には、雨じゃからあれじゃね、H2Oのゲージがたくさんたまっていきますぽぽ。水集めやすい。
    english: It won't open since it's a rainy day, but for raising it, since it's
      rain, you know, H2O gauges keep building up a lot, popo. Water is easy to collect.
  - start: '01:22.503'
    end: '01:34.253'
    original: なんか、最初はさ、わし、規制されてさ、いつも通り自由にしゃべれなくなってさ、すごい悲しかったぽぽ。
    english: At first, you know, I was parasited, and couldn't speak freely like I
      always do, and it was super sad, popo.
  - start: '01:34.873'
    end: '02:04.283'
    original: でもなんかこうやってさ、手間暇かけてさ、お世話をしてるとさ、愛着が湧いてくるぽぽ。どんなに規制されたり、自我を奪われたり、憎いなって、時には思っちゃうこともあって、それでも、自分の子ってどうしてこんなに愛おしいぽぽ？
    english: But you know, when you put time and effort into taking care of it like
      this, you start to feel attached, popo. No matter how much it's restricted,
      or how much its ego is stolen away, sometimes I think it's hateful, but even
      so, why is my own child so precious, popo?
  - start: '02:07.453'
    end: '02:16.273'
    original: わし、耐え切ったあと、このこと決別できるんじゃろうか。
    english: After I endure all this, I wonder if I'll be able to part ways with this
      thing.
  - start: '02:16.273'
    end: '02:22.423'
    original: 明日になっても、ぽぽじゃったら、どうしよう。
    english: What should I do if I'm still 'popo' tomorrow?
  - start: '02:23.273'
    end: '02:35.853'
    original: 確かに侵食が進んでいる。やばい！心までもお、頭と、身体だけで無く、脳内にも、タンポポに犯され始めているぽぽ。まずい。
    english: Indeed, the erosion is progressing. Oh no! Even my heart, not just my
      head and body, but even my brain is starting to be invaded by the dandelion,
      popo. This is bad.
  - start: '02:35.853'
    end: '02:43.743'
    original: 精神、攻撃してくるタイプのタンポポぽぽか、これ？やばい、洗脳ぽぽこれ。まずい。
    english: Is this a dandelion type that attacks your mind, popo? This is bad, it's
      brainwashing, popo. Oh no.
  - start: '02:44.203'
    end: '02:59.033'
    original: そうやって、そうやってさ、規制させてさ、あの、一方的な搾取なのにさ、搾取なのにもう構わず、いやでも、あの人はそんな人じゃないとか、いや、このタンポポはいいタンポポぽぽとか、思いちゃうぽぽ。
    english: Doing that, doing that, getting it regulated, even though it's one-sided
      exploitation, exploitation, yet despite that, no, that person isn't like that,
      or no, this dandelion is a good dandelion, popo, I start thinking like that,
      popo.
  - start: '02:59.033'
    end: '03:05.123'
    original: 恐ろしい。環境の力って恐ろしいぽぽ。
    english: Terrifying. The power of the environment is terrifying, popo.
  - start: '03:05.123'
    end: '03:15.823'
    original: 毒の愛着ぽぽ。細胞分裂。同時に回収できる分子や光の量が10に増える。これぽぽ！
    english: Toxic attachment, popo. Cell division. The amount of molecules and light
      that can be collected simultaneously increases by 10. This one, popo!
  - start: '03:16.823'
    end: '03:22.503'
    original: どっぱらせていただきますぽぽ！たくさん回収するぽぽね！ぽぽぽぽぽぽぽ！
    english: I'll let it splurge, popo! I'll collect a lot, popo! Popopopopopo!
  - start: '03:29.873'
    end: '03:33.913'
    original: なんか、今ここで配信をしてるわしは本当にわしなんだろうか。
    english: Terrifying, popo. Like, is the me streaming right now really me?
  - start: '03:34.333'
    end: '03:44.243'
    original: どうする？もうわしの自我はとっくのとうになくなっていてさ、気づいたらもう完全にタンポポになってたらどうするぽぽ？
    english: What should I do? What if my ego is already long gone, and before I know
      it, I've completely turned into a dandelion, popo?
  - start: '03:44.243'
    end: '03:54.673'
    original: 心はまだ自分のものだって思い込んでたけど、心までもが、もう昨日のあいつじゃえないのかも知れないぽぽ。
    english: I was convinced my heart was still my own, but even my heart... Maybe
      it's no longer yesterday's me, popo.
  - start: '03:58.263'
    end: '04:04.913'
    original: 認めて、タンポポをっす、タンポポになっても推してくれるぽぽか？
    english: Accept it, make it a dandelion, will you still support me even if I become
      a dandelion, popo?
  - start: '04:04.913'
    end: '04:17.073'
    original: あついにみ、あ、クリック時の円の範囲が2倍。これいいんじゃない？範囲2倍熱いぽぽ。
    english: Finally, oh, the circle radius on click is doubled. Isn't this good?
      Doubled radius is hot, popo.
  - start: '04:17.073'
    end: '04:29.073'
    original: やっぱ、あの、どれだけの円を、円の使い手かみたいなところ大事ですぽぽ。わしの円は3センチ、3センチ持ちますぽぽ。
    english: After all, you know, how big of a circle, what kind of circle user you
      are, that kind of thing is important, popo. My circle is 3 centimeters, it lasts
      3 centimeters, popo.
  - start: '04:29.433'
    end: '04:37.343'
    original: ポポライブのポポメア、もう事務所も違うぽぽね。事務所までもが変わってしまいましたぽぽ。
    english: Popo Live's Popomea, even the agency is different now, popo. Even the
      agency has changed, popo.
  - start: '04:37.343'
    end: '04:44.203'
    original: ポロライブになっちまうぽぽ。おまったぽぽね。どうしよう。いっぱい集められてるんじゃない？
    english: I'm turning into Polo Live, popo. Oh man, popo. What should I do? Aren't
      I gathering a ton?
  - start: '04:44.593'
    end: '04:48.883'
    original: CO2が全く集められてないぽぽ。
    english: CO2 isn't being gathered at all, popo.
  - start: '04:48.883'
    end: '04:59.453'
    original: H2Oとかはいっぱい来てるんだけど。ちょっと緑色のを優先的に拾ってあげたほうがいい感じぽぽかな。
    english: H2O and stuff are coming in a lot though. I feel like it'd be better
      to prioritize picking up the green ones, popo.
