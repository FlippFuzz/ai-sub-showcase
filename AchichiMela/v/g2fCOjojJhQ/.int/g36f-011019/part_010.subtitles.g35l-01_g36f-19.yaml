global_summary:
  overall_summary: In this livestream, Hololive VTuber Mela Netsuchi plays the cozy
    yet punishing indie game 'Tanpopo wa Taeru' (Dandelions Endure), gifted to her
    by Okayu-senpai. Roleplaying that she has been parasitized by a dandelion that
    forced her signature 'Noja' speech tic to become 'Popo', Mela embarks on an emotional
    and grueling journey across seasons to nurture the dandelion, master rhythm-parry
    mechanics against urban hazards (such as trains, cats, and dancing drunkards),
    and ultimately conquer the boss rush to reclaim her true firefighting salamander
    identity.
