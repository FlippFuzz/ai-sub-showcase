  - start: '00:20.173'
    end: '00:22.063'
    original: のじゃ捨てないポポ！
    english: Don't abandon Noja, popo!
  - start: '00:22.653'
    end: '00:26.543'
    original: 本当はわし、本当はわし普通に喋りたい！
    english: Honestly, I... honestly I just want to speak normally!
  - start: '00:28.183'
    end: '00:30.293'
    original: 本当はわし普通に喋りたいのに！
    english: Even though I honestly just want to speak normally!
  - start: '00:31.433'
    end: '00:36.563'
    original: 頭のタンポポが、そうさせてくれないです、ポポ！
    english: The dandelion on my head won't let me, popo!
  - start: '00:37.473'
    end: '00:39.953'
    original: ちょっと待って！
    english: Wait a minute!
  - start: '00:38.253'
    end: '00:41.973'
    original: いや待て、のじゃの言い分じゃ……
    english: No wait, that's Noja's side of the story...
  - start: '00:42.233'
    end: '00:46.423'
    original: でも、今日の配信前、とある天啓が……
    english: But, before today's stream, a certain divine revelation...
  - start: '00:48.333'
    end: '00:55.723'
    original: わしの頭に降りてきまして、あちちめらよ。
    english: descended upon my head, Achichimela.
  - start: '01:00.673'
    end: '01:07.563'
    original: おかゆ先達にいただいた、「タンポポは耐える」というゲームをやるのです。
    english: We're going to play a game gifted by Okayu-sentatsu called "Dandelions
