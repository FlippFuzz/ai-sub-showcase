  - start: '01:22.383'
    end: '01:26.793'
    original: タンポポの天啓を受けました、ポポ！
    english: I have received the dandelion's divine revelation, popo!
  - start: '01:29.473'
    end: '01:45.023'
    original: だから、せっかくの機会だと思って、今日は、おかゆ先達からいただいた、「タンポポは耐える」というゲームをプレイしていきたいと思います、ポポ。
    english: So, thinking this is a great opportunity, today I'd like to play the
      game "Dandelions Endure" that I received from Okayu-sentatsu, popo.
  - start: '01:49.033'
    end: '01:52.273'
    original: 神様は滅めをしているのじゃ、ポポ。
    english: God is destroying me, popo.
  - start: '01:54.683'
