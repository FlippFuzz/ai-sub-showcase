  thoughts:
  - |-
    **My Thoughts on Rhythm Games and Hololive**

    Okay, so, here's what's running through my mind. I'm excited to dive into this. I'm Achichi Mela, and I need subtitles for the segment of this video from 05:00.008 to 10:00.016, so let's start with the part before that.

    It all started with "Our Bright Parade." *That* song, you know? It really resonated with me. I thought, "This is it!" So, I took the Hololive audition. It's funny because I was totally clueless about Hololive back then. I was so touched by the song, and it made me curious about the girls singing it. The power of music, right? It's amazing.

    Since I got into Hololive through this song, I'm probably missing a lot of the in-jokes and trivia. That's where you all come in! I'm hoping you, the chat, can help me learn. If you've got niche trivia or references, please share them! Don't write too much, just something like, "That's a [senpai] reference!" I'd love to learn from you all.

    I'm thinking, "Let's all become Hololive trivia masters together!" If you're here because of me, let's learn about Hololive together.

    Now, about me and rhythm games... I don't have a huge history, really. Do you all play rhythm games? I bet most of you have played Holodri. I was planning to play it after I debuted. It's probably been a while since it came out, but I'm excited to try it.

    People in the chat are saying they are just starting to play too! I've been playing rhythm games on mobile for a while. I have played, *Sukufesu*, *Deresute*, and I think I've messed around with *Bandori* a little bit too. I played *Proseka* the most. I really love Vocaloid music. I got a little too into the gacha in that game, and I have had to stop, because I am spending so much money. It's been fun, but...

    About those levels... My player rank? Maybe I haven't reached the end, since I was playing before the level cap was removed. My song skill level is so-so. On Master for "Hitorinbo Envy", if I'm lucky, I can Full Combo, but I still miss sometimes. So I think that's around 26-27. Not great, not terrible. On Expert, maybe I can clear level 28, and sometimes Full Combo.

    So, I'm not some All Perfect, top-tier player, just average. But, the way I used to enjoy rhythm games was Event Tiering! Skill doesn't matter as much, right? I used to grind for points. My skill at rhythm games? I'm not confident at all. Not confident!

