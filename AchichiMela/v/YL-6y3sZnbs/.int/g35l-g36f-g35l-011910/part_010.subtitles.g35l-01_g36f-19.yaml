global_summary:
  overall_summary: In this stream, hot-headed salamander firefighter and Hololive
    Asobi Mawaritai unit member Achichi Mela plays Hololive's official rhythm and
    RPG smartphone game hololive Dreams (Holodori) for the very first time. She shares
    her deep passion for Hololive music, tracing back to how she discovered Hololive
    through Shota Horie's song Our Bright Parade. Mela explores the game's 3D open-world
    island and prologue story, sets up her broadcaster mode options, and embarks on
    an intensive rhythm game marathon playing various fan-favorite tracks like Shiny
    Smily Story, Our Bright Parade, KINGWORLD, Vivideba, and Mogu Mogu Yum!. Along
    the way, she pulls gacha banners, geeks out over VOCALOID producers and song compositions,
    and loses track of time before wrapping up the stream to raid snow-elf Lamy's
    broadcast.
