global_summary:
  overall_summary: In this stream from Mela Ch. 熱千めら‐ アソビ★まわり隊!, Hololive member Achuchi
    Mela plays Hololive's official rhythm and RPG game 'hololive Dreams' (affectionately
    known as 'HoloDori') for the very first time. She shares her personal history
    with rhythm games and how hearing the Hololive song 'Our Bright Parade' inspired
    her audition. What starts as a casual exploration of the game's prologue and theme
    park island quickly turns into an enthusiastic deep-dive into playing fan-favorite
    Hololive original songs on Expert difficulty, culminating in gacha pulls and a
    last-minute rush before a raid to Yukihana Lamy's stream.
  chapters:
  - start: 00:00
    end: '13:30'
    title: Opening Chat and Rhythm Game History
    description: Atsuchi Mela opens the stream, discusses how she discovered Hololive
      through the song Our Bright Parade composed by Shota Horie, and talks about
      her past experience playing mobile rhythm games like Project Sekai.
    song_title: null
    song_artist: null
  - start: '13:30'
    end: '40:00'
    title: Starting HoloDori and Exploring the Island
    description: Mela launches the Hololive smartphone game 'hololive Dreams', selects
      AZKi as her starting partner, watches the prologue story where Hololive members
      dream of creating a theme park island, and explores the 3D world.
    song_title: オープニングテーマ
    song_artist: hololive IDOL PROJECT
  - start: '40:00'
    end: '58:00'
    title: First Rhythm Game Playthrough and Setup
    description: Mela adjusts her game settings, enables streamer mode, and tries
      her first rhythm game stage on Hard difficulty to learn the mechanics.
    song_title: Shiny Smily Story
    song_artist: hololive IDOL PROJECT
  - start: '58:00'
    end: '75:00'
    title: 'Rhythm Game Session: Expert Mode Trials'
    description: Mela transitions into playing higher-difficulty Expert charts, tackling
      songs like Our Bright Parade and King while reacting to the complex charting.
    song_title: アワーブライトパレード
    song_artist: hololive IDOL PROJECT
  - start: '75:00'
    end: '90:00'
    title: 'Rhythm Game Session: Bibideba and Song Discussions'
    description: Mela continues playing challenging charts, including Hoshimachi Suisei's
      Bibideba, while passionately geeking out over Hololive music creators and voice
      work.
    song_title: ビビデバ
    song_artist: 星街すいせい
  - start: '90:00'
    end: '10:00'
    title: 'Rhythm Game Session: Mogu Mogu Yummy and Houshou Marine''s Song'
    description: Mela plays Nekomata Okayu's Mogu Mogu Yummy and Houshou Marine's
