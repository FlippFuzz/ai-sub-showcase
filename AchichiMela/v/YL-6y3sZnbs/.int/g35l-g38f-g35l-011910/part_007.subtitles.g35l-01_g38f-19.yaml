    First card - Roboco-san.  Ooh, she appears on stage!  Ah, Roboco-senpai! You know, back when Holodri first released, the designers were sharing their portfolio work on... on Holodri...

    02:26 - 02:41 *Second draw: Koyori-senpai!*
    Second card is Koyori-senpai! Koyori-senpai is so cute! I love her design, especially those stream graphics... the original ones.  I really love those graphics...

