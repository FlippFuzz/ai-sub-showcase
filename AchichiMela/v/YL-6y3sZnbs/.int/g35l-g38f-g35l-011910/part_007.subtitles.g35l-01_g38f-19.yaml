    00:50 - 01:00 *Here it is, time to start a draw*
    I can see Hololive live performance scenes flashing. Neat! The visual effects are great. A very nice animation showing off past performances.  I'm getting that dopamine rush!  The camera work is impressive, just like during a real live.

    01:01 - 01:21 *I'm in gacha mode!*
    I can feel that dopamine rush!  And here we go. It's that feeling, the build-up... that "dokan" sound is addictive, you know?

