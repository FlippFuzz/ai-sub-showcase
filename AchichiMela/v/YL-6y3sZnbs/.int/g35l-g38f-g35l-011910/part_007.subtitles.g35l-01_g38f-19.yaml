    The third one, Oh! AZKi-senpai!  Is this a guaranteed rare? *Noja!*  Awesome!  Wow, you get the 3D cut-in when you pull a rare one! It's like a real gacha game!  I see a signature!  Haha, it's straight-up a gacha game! 5-star! That's so cute!

    AZKi says: "Together with everyone, we can reach anywhere. Because I'm not alone anymore."

    Wow, this really is a legit gacha game. Holodri is incredible!

