global_summary:
  overall_summary: In this livestream video from the YouTube channel 'Mela Ch. 熱千めら‐
    アソビ★まわり隊!', Hololive's newly debuted VTuber Achichi Mela (熱千めら) from the unit
    'Asobi Mawaritai!' (アソビ★まわり隊！) plays the official Hololive rhythm and RPG smartphone/PC
    game 'hololive Dreams' (commonly known as 'Holodri' / ホロドリ) for the first time.
    Mela shares her personal connection to Hololive—having discovered the agency through
    the song 'Our Bright Parade' composed by Shota Horie—and reflects on her past
    rhythm game experience. She navigates the tutorial, explores the theme park island,
    sets up streaming options, and dives enthusiastically into playing several iconic
    Hololive original songs including 'Shiny Smily Story', 'Our Bright Parade', 'ぺこらんだむぶれいん!',
    'ビビデバ', 'もぐもぐYummy!', 'シミュラクル', and 'Ahoy!! 我ら宝鐘海賊団☆'. Throughout the stream,
    Mela fan-girds over music composers and voice performances, conducts a gacha pull
    session using beginner jewels, and ultimately wraps up to raid Snow Flower Lamy's
    livestream.
