  domain_glossary:
  - term: ホロドリ
    meaning: Official abbreviation for 'hololive Dreams' (ホロライブドリームズ), Hololive's
      official rhythm & RPG smartphone game developed by QualiArts and Cover.
  - term: イベラン
    meaning: Event running; playing rhythm games intensively during limited-time events
      to secure high event rankings.
  - term: 縦連
    meaning: Vertical consecutive notes in rhythm games where multiple notes appear
      in rapid succession on the exact same lane.
  - term: トリル
    meaning: A rhythm game pattern involving alternating taps between two notes or
      lanes.
  - term: サラマンダー
    meaning: A mythical fire spirit or creature; Achuchi Mela's mythological species
      as a firefighter salamander.
  - term: アソビ★まわり隊！
    meaning: Hololive generation/unit consisting of Kyoko Hyakuto, Mela Achishi, Tsuzuri
      Suzuna, and Sopia Sorashina.
  - term: 配信者モード
    meaning: Streamer mode in games designed to hide sensitive personal information
      or enable broadcast-friendly options.
