  overall_summary: In this stream from hololive's newcomer Netchi Mela (from unit
    'Asobi Mawaritai!'), she plays Hololive's in-house rhythm game 'Hololive Dreams'
    (Holodori) for the first time. Mela discusses how she originally discovered Hololive
    through the song 'Our Bright Parade' composed by Shota Horie, shares her rhythm
    game background (such as playing Project SEKAI), explores the game's rich 3D island
    hub and story mode featuring Hololive members, and dives passionately into playing
    various famous Hololive songs on Expert and Hard difficulties. She also pulls
    gacha and concludes by preparing to raid Lamy's stream.
