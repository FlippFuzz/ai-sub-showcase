    \ Now, let's get into the nitty-gritty, line by line.\n\nWe kick things off with\
    \ some game dialogue. Then, it's gacha time!  \"ライブするメンバーを決めないとね！\"  Sora's voice...\
    \  This is where the real fun begins. I'm already feeling the pull. It’s a rush\
    \ of dopamine, right? I'm getting a \"ドパ度高い\" feeling – that gacha euphoria. \"\
    TAP TO START,\" the text just flickering there...  I'm getting that \"ドパる\" feeling,\
    \ that's what chat is saying! The animation is pure magic. That camera work, the\
    \ way it swoops in – it's like a live performance drop. Pure gacha goodness. \
    \ The sound design?  It just adds to that dopamine rush!  \n\nHere it comes! Roboco-senpai!\
    \ I'm already familiar with their artwork! I know what's up in terms of Hololive\
    \ 3-star card art! Koyori-senpai! I love her original stream overlays. And here,\
    \ we get that AZKi signature! \"みんなとなら、どこへでも辿り着ける。私はもうひとりじゃないから\"  and it's a\
    \ 5-star! This is like a proper mobile game gacha!  A 5-star! So cute.  The illustrations\
    \ are fantastic. I'm loving the art design here!  The stage we're looking at looks\
    \ good!  The outfit is cute too.  It's just the aesthetic I'm after, all that\
    \ creativity that's got my attention! I was also thinking about how the poses\
    \ in mobile game card illustrations are awesome.  I can totally use them for reference.\n\
    \nThere's even a redraw gacha! But, I'm not going to redraw. I don't wanna risk\
    \ losing AZKi, she was my first pull. But this is where the real exploration begins.\
    \ \"エリアクエスト\". The game's like \"Let's sing a special first song on stage worthy\
    \ of the park's opening!\" Whoa, it’s cute! AZKi's in-game voice saying \"ジャンプ！\"\
    \ I’m just like \"Whoa, cute!\" Different ways to jump?  This is crazy impressive.\
    \ The devs must have put in a ton of time on this. All of this for every single\
