    english: Wait, this is basically an Asobi Mawaritai collab now!
  - start: '02:36.800'
    end: '02:37.800'
    original: コラボなのじゃ！
    english: It's a collab, noja!
  - start: '02:37.700'
    end: '02:40.600'
    original: お酒に夢中で気づかなかったけど、来てくれて...
    english: I was so focused on drinking that I didn't notice, but thanks for coming...
  - start: '02:40.400'
    end: '02:42.200'
    original: ね、実質コラボだよ、これ！
    english: Yeah, this is virtually a collab!
  - start: '02:41.800'
    end: '02:42.900'
    original: のじゃ！
    english: Noja!
  - start: '02:43.700'
    end: '02:45.300'
    original: やっぱメラチもそうなんだ？
    english: So you feel that way too, Melachi?
  - start: '02:45.300'
    end: '02:47.300'
    original: そうだよ。なんか...
    english: Yeah. Like...
  - start: '02:47.300'
    end: '02:49.100'
    original: 1ヶ月ではないじゃろう？
    english: It definitely doesn't feel like just one month, right?
  - start: '02:48.900'
    end: '02:49.600'
    original: うん。
    english: Yeah.
  - start: '02:49.800'
    end: '02:53.200'
    original: 2ヶ月... いや、もっと経ってる。
    english: Two months... No, even more time has passed.
  - start: '02:53.100'
    end: '03:01.000'
    original: なんかもうだいぶ、だいぶ個人的にかなり、なんじゃろう、「ああ、もうホロライブ入って結構経ったな」みたいな感じの顔できる。
    english: Like, personally, I feel I can totally make a face like, "Ah, it's been
      quite a while since I joined Hololive."
  - start: '03:00.500'
    end: '03:02.100'
    original: できるできるできる！
    english: You can, you can!
  - start: '03:02.100'
    end: '03:04.500'
    original: なんか毎日がさ、濃密すぎてさ！
    english: Every single day has just been so dense!
  - start: '03:04.300'
    end: '03:09.400'
    original: そうそうそうそう！なんなら、あの、今もう後輩来ったって可笑しくないかも。
    english: Right, right, right! Honestly, it wouldn't even be weird if our juniors
      debuted right now.
  - start: '03:09.100'
    end: '03:10.500'
    original: わかるー！
    english: I know, right?!
  - start: '03:10.000'
    end: '03:17.500'
    original: てぐらいの、け、経験値じゃないけど、なんだろう、密度というか、そう、は、もう知っちゃってるかもしれないのじゃ。
    english: To the point where—maybe not our experience level, but the sheer density
      of it—we might already know what it feels like, noja.
  - start: '03:17.500'
    end: '03:23.000'
    original: ねえ、ほんとありがたいよね！デビューしてまださ、1ヶ月ちょっとでここまで経験させていただいてさ。
    english: Right, we're really so grateful! It's only been a little over a month
      since debut, and we've already gotten to experience all this.
  - start: '03:18.900'
    end: '03:23.300'
    original: ねえ。そうそうそうそう！そう！
    english: Yeah. Right, right, right! Exactly!
  - start: '03:23.700'
    end: '03:28.900'
    original: まだお話しできてない先輩とかさ、もういっぱいいるしさ、まだコラボもそんなにできてないけどさ。
    english: There are still so many senpais we haven't spoken to yet, and we haven't
      done that many collabs, but...
  - start: '03:28.900'
    end: '03:29.900'
    original: にしても...
    english: Even so...
  - start: '03:29.800'
    end: '03:31.000'
    original: にしても！
    english: Even so!
  - start: '03:30.800'
    end: '03:32.300'
    original: にしてもよ！うん。
    english: Even so! Yeah.
  - start: '03:32.200'
    end: '03:33.200'
    original: 長い！
    english: It feels long!
  - start: '03:33.000'
    end: '03:34.500'
    original: 長い！感じる！
    english: Long! It really feels that way!
  - start: '03:33.400'
    end: '03:34.500'
    original: ながいのじゃ。
    english: Long, noja.
  - start: '03:34.700'
    end: '03:36.300'
    original: ありがたいよね、ほんとね！
    english: We're really so grateful, honestly!
  - start: '03:35.800'
    end: '03:36.900'
    original: ありがたい...
    english: Grateful...
  - start: '03:36.700'
    end: '03:41.100'
    original: ここまで素晴らしい日々をさ、過ごさせていただいて。
    english: To be allowed to spend such wonderful days up to now.
  - start: '03:41.200'
    end: '03:45.900'
    original: あとなんか、デビュー前に心配したことが全然そうでもないことが多い。
    english: Also, so many things I worried about before debut turned out not to be
      issues at all.
  - start: '03:45.900'
    end: '03:48.200'
    original: あ、どんなこと心配してたの？ちなみに。
    english: Oh, what kind of things were you worried about, by the way?
  - start: '03:48.200'
    end: '03:53.900'
    original: え、なんか、その配信毎日してたら、やることなくなっちゃうかな、とか...
    english: Like, if I stream every day, will I run out of things to do? Or...
  - start: '03:53.700'
    end: '03:55.100'
    original: ああー！
    english: Ahhh!
  - start: '03:54.900'
    end: '04:02.800'
    original: その、いわゆる配信ネタみたいなのがネタ切れとかしちゃうのかな、とか思っとったんじゃけど、やりたいことが無限でワロタ。
    english: Like running out of stream topics or content, I was worried about that,
      but lol there's an endless amount of things I want to do.
  - start: '04:02.800'
    end: '04:06.200'
    original: そうなんだよ！どんどん湧いてきちゃうんだよね！そうそうそう！
    english: Exactly! They just keep welling up endlessly! Exactly!
  - start: '04:05.300'
    end: '04:06.000'
    original: ねえ！
    english: Right!
  - start: '04:06.200'
    end: '04:15.800'
    original: なんかこの配信やって、やっぱ視聴者の方がさ、たくさんリアクションくださるから、「じゃあこのリアクションくれるんだったら、これもできそうじゃん」みたいな、思いついちゃうんだよね！
    english: Like, doing streams, the viewers give us so many reactions, so you think,
      "Well if they react like this, we could probably do this too!" and ideas pop
      up!
  - start: '04:10.500'
    end: '04:11.300'
    original: そうそう！
    english: Right, right!
  - start: '04:13.900'
    end: '04:14.900'
    original: そうそうそう！
    english: Exactly!
  - start: '04:15.700'
    end: '04:22.400'
    original: とか、なんか「こういうの見たい」とかもさ、いっぱい教えてくれるからさ、「あ、それもいいかも」とかさ。
    english: And they also tell us lots of things like, "I want to see this!", so
      we think, "Oh, that might be good too."
  - start: '04:19.800'
    end: '04:20.900'
    original: そうそうそうそう！
    english: Yeah, yeah, yeah, yeah!
  - start: '04:22.400'
    end: '04:24.900'
    original: あとコラボもわしたちでできるようになってきたじゃろ？
    english: And we've also become able to do collabs ourselves now, right?
  - start: '04:24.400'
    end: '04:25.600'
    original: そうそうそう！
    english: Yeah, yeah, yeah!
  - start: '04:25.500'
    end: '04:36.000'
    original: じゃから、なんか「この先輩とコラボしてみたい」とか、あと、もちろんアソビまわり隊でもね、こういうゲームしたいな、とかさ、いっぱいあってさ、すごいワクワクがね、いっぱいあるのじゃ。
    english: So there's like, "I want to collab with this senpai," and of course within
      Asobi Mawaritai too, like, "I want to play this kind of game," there are so
      many things, so there's really a ton of excitement, noja.
  - start: '04:36.000'
    end: '04:41.100'
    original: いや、そうなんだよね！だから本当に心配いらないよね、まったくね！ネタ切れとかに関してはさ。
    english: No, exactly! That's why there's really no need to worry at all! Regarding
      running out of stream ideas, that is.
  - start: '04:41.100'
    end: '04:42.900'
    original: 今んとこ皆無。
    english: Right now, none at all.
  - start: '04:42.900'
    end: '04:45.900'
    original: 無限に湧いてくるし、なんなら「時間足りない！」って...
    english: They well up endlessly, and if anything, it's like "There's not enough
      time!"...
  - start: '04:45.700'
    end: '04:46.900'
    original: 足りない！
    english: Not enough!
  - start: '04:46.600'
    end: '04:47.700'
    original: なっちゃってる。
    english: '...is what''s happening.'
  - start: '04:47.500'
    end: '04:48.900'
    original: 足りない... 困った。
    english: Not enough... It's a problem.
  - start: '04:48.700'
    end: '04:49.900'
    original: 困った！
    english: A problem!
  - start: '04:49.700'
    end: '04:56.500'
    original: え、そう、なんかコラボもしたいし、一人でも配信もしたいから、スケジュールをさ、組むじゃろ、一週間の。組む時に...
    english: Right, like, we want to collab, and we also want to do solo streams,
      so when you make the weekly schedule... when planning it...
  - start: '04:56.200'
    end: '04:59.900'
    original: 組む時に「おや？コラボがこんなにいっぱいいあって、一人で...」
    english: When planning, it's like, "Wait? We have so many collabs, how about solo...?"
