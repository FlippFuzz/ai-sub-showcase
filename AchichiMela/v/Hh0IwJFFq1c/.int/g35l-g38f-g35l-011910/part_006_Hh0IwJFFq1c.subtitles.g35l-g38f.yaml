  thoughts:
  - |-
    **A Deep Dive into Kyoko and Mela's Bond**

    Right, let me see... Okay, so, it's about a 5-minute chunk, let's start with the first part of our conversation!

    Ah, so, Kyoko was saying that she stays the course because she has a way of fixing little issues. And since she doesn't get discouraged, that must be it. So smart! I see... she really is controlling things with experience, right. Yeah, she is so logical... Like, I find it funny how this energetic, strong person is also a theorist, you know?

    Her voice is so loud, and yet, she's a hardcore theorist. Like when she adjusts her glasses and says, "hardcore theorist!" I'm starting to think, her strength as a person, the thing that makes her strongest...is that she has this vitality, with her strong body and mind, but she has this meticulous side that makes her want to control it all herself, and she manages that with logic. That's why she is the strongest.

    And yes, it is all balance. And it's what makes Kyoko so strong. I just think that's why she is a super-person. That's why at first, during our initial meeting, we probably thought, "We're so similar" to each other! I felt it too, but we didn't communicate a lot before our debuts, you know. We were thinking "Ah, are we alike?" but we were cautious, sizing each other up.

    Like, there are people who get annoyed with that. So we both played a game of chicken, asking deeper questions. We were asking really deep questions, little by little. Like when we're talking with the others, we'd go into deeper conversations. And because we are speaking straight from our souls, when we had private conversations, it got super intense! It's like we are sisters, or like we're long-lost sisters, you know? I was thinking that Kyoko might be a salamander, with how much we're alike. It is pretty amazing!

    Ah, it is a Dragon Ball thing. She might have had a tail but cut it off! I think so too. And I'm recently really impressed because we were on a HoloCa show together. We did a show like that, and you've got to consider what the other person's going to say, and I did my best to think about that, but Melachi just answered exactly as I expected! I was like, I can stop thinking. It was super effortless.

    I mean, it's true, because I was new to HoloCa and card games, but Kyoko is a pro, and so a card gamer would get it, but I didn't want the first-timers to get lost, so I tried to explain everything.
    I guess that's why!

