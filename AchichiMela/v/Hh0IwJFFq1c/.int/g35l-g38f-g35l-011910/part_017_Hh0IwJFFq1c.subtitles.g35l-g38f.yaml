    original: まあでも、そう、なんか私はさ、めらちと同じタイプだから、「あ、めらちはこれが愛でやってるんだろうな」ってことは分かるけど、さっきもね同じこと言っちゃうけど、やっぱ人間って自分がどう受け取るかの方が大事？
