  - start: '04:44.800'
    end: '04:45.600'
    original: うん。
    english: Yeah.
  - start: '04:45.200'
    end: '04:52.500'
    original: え、なんかさ、わしさ、ファンの方からのさ、今までのめらちゃんを見てきた印象みたいなのでさ、
    english: Like, from the impressions fans have shared of watching Mela-chan up
      until now...
  - start: '04:51.800'
    end: '04:55.500'
    original: なんか、なぜかちょっと「炎上したそう」っていう...
    english: for some reason, they think I look like I've been flamed before...
  - start: '04:55.200'
    end: '04:57.000'
    original: なんでだよ！
    english: Why would they think that?!
  - start: '04:56.000'
    end: '04:57.200'
    original: 分かんない！
    english: I don't know!
  - start: '04:56.800'
    end: '04:58.500'
    original: そんなことないよ！
    english: That's not true at all!
  - start: '04:58.200'
    end: '05:00.000'
    original: なんでだよ！
    english: Why?!
  - start: '04:58.500'
    end: '05:00.000'
    original: 分かんないよ！
