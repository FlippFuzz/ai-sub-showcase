  - start: '04:31.800'
    end: '04:33.000'
    original: 確かに。
    english: That's true.
  - start: '04:32.800'
    end: '04:36.500'
    original: そうそうそう。だから1年間はちょっと火消...謹慎でね。
    english: Right, right. So for one year, the fire's ex... probation, you know.
  - start: '04:36.500'
    end: '04:41.200'
    original: ていうかさ、あの、これ言っていいか悪いかちょっと分かんないんじゃけどさ。
    english: By the way, I'm not really sure if it's okay to mention this or not,
      but...
  - start: '04:40.000'
    end: '04:42.500'
    original: じゃあやめとくか？大丈夫か？大丈夫かそれ？
    english: Then should we skip it? Is it okay? Is that safe?
  - start: '04:42.000'
    end: '04:45.000'
    original: え、そんな、そんなヤバいことじゃない。流石に流石に。流石に熱千めら...
