  - start: '02:25.500'
    end: '02:28.000'
    original: そう、そう、そう、そう！
    english: Exactly, exactly!
  - start: '02:28.000'
    end: '02:32.400'
    original: その時はもちろん、あの、かっちりと、もう「です・ます」、もう「のじゃ」の「の」の字も出ない...
    english: At that time, of course, strictly, totally in 'desu/masu', not even a
      single hint of 'noja' will slip out...
  - start: '02:32.000'
    end: '02:34.200'
    original: 「の」の字も！
    english: Not even the 'no'!
  - start: '02:33.800'
    end: '02:36.400'
    original: で、「わし」じゃなくて「私」っていうの？
    english: And instead of 'washi', would you say 'watashi'?
  - start: '02:35.800'
    end: '02:38.200'
    original: いや、もう、ちゃうちゃうちゃう。「わたくし」ですよ。
    english: No, wait, no no no. It's 'watakushi'!
  - start: '02:37.600'
    end: '02:40.400'
    original: 「わたくし」までいく？！それ、ガチすぎる！
    english: You'd go as far as 'watakushi'?! That's way too serious!
  - start: '02:40.400'
    end: '02:44.200'
    original: 「わたくしがこの度...」みたいな言い方するよ、もちろん！そらそうじゃろ。
    english: '''I, watakushi, on this occasion...'' That''s how I''d say it, of course!
      Obviously!'
  - start: '02:44.100'
    end: '02:46.000'
    original: で、「ワロタ」も言わない？
    english: And you wouldn't say 'warota' either?
  - start: '02:45.300'
    end: '02:47.800'
    original: そ、もう言うわけない！言うわけない！
    english: N-No way I'd say that! No way!
  - start: '02:47.400'
    end: '02:51.400'
    original: そんな、そんな、もう、もう、もう、火に油ですよ！
    english: That would just, just, just be pouring fuel on the fire!
  - start: '02:50.800'
    end: '02:55.200'
    original: 「わたくし、火消し担当なのに、炎上しててワロタ」
    english: '''Even though I, watakushi, am in charge of firefighting, getting flamed
      is warota.'''
  - start: '02:55.000'
    end: '02:58.200'
    original: 終わった！終わった！終わった！
    english: It's over! It's so over! It's finished!
  - start: '02:58.000'
    end: '03:02.000'
    original: いや、そういうのはね、そういうのは本人が言っちゃ駄目なやつ。外部が、あの...
    english: No, that kind of thing is what the person themselves can never say. It's
      what outsiders...
  - start: '03:02.000'
    end: '03:07.400'
    original: しかもファンの人とか、ファンの人やっぱさ、めらちゃん心配とかが勝っちゃうから、
    english: And plus fans... fans would be overwhelmed with worry about Mela-chan,
  - start: '03:07.400'
    end: '03:10.000'
    original: ファンの人も言えないから、もう本当に、あの...
    english: so fans couldn't say it either. So really, uh...
  - start: '03:09.800'
    end: '03:16.800'
    original: ガチでめらのキャラ設定と名前を知ってるぐらいの距離感の人が言うセリフじゃろ、それ。
    english: that's a line that can only be said by someone whose distance is just
      knowing Mela's character profile and name!
  - start: '03:16.400'
    end: '03:18.900'
    original: そう、自分で言ったらとんでもないことだ！
    english: Yeah, if you said it yourself, it'd be an absolute disaster!
  - start: '03:18.200'
    end: '03:20.500'
    original: だめ、だめ、だめ、だめ！
    english: No, no, no, no!
  - start: '03:20.000'
    end: '03:25.000'
    original: あの炎上はね、あの、初手はもう、しゃあないとして、どうしようもないとして、
    english: With flame wars, even if the first incident is unavoidable and can't
      be helped,
  - start: '03:25.000'
    end: '03:29.400'
    original: あの、2手目、3手目がね、結構命運をね...
    english: it's your second and third moves that really decide your fate...
  - start: '03:28.800'
    end: '03:30.800'
    original: ガチ大事！
    english: Seriously crucial!
  - start: '03:30.000'
    end: '03:30.800'
    original: そう。
    english: Right.
  - start: '03:30.600'
    end: '03:32.400'
    original: ガチ大事、うん。
    english: Seriously crucial, yeah.
  - start: '03:32.400'
    end: '03:37.000'
    original: そうなんじゃ。その、その後次第でも、どう、どうにでもなるから。
