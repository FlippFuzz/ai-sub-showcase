  thoughts:
  - |-
    **A Deep Dive into "Heavy" Emotions and Communication**

    Okay, so here's the thing: we were doing this offline drinking stream, and we were talking about our bond, you know, our "heavy" emotions. It's like, this temporary, overwhelming feeling... it can’t ruin our four-person group. And it's true! We have to be mindful. When it’s just the four of us, it's all fun and games, but when we’re alone… it's different.

    We have this unspoken agreement, kind of a "one-way street" with our intense feelings – or at least, that's what we *pretend*. We don't want to make things weird, you know? It's so awkward to try and navigate the space! So we do our deep conversations when the others aren't around, like we are trying to be discrete; we're just mindful of time and place!

    We try to keep things… controlled. We're compatible, *very* compatible, but to go any further would be dangerous! That's just our nature. We need to maintain our relationships, to keep things fun. That we are working to keep things as a "one-way street" is for everyone's sake; and the ones we're close to.

    Seriously, we could easily become… circle crushers! The fact that one of us is literally a hero police officer makes it *even worse*! But we keep trying. I mean, we're working so hard to hold back our urge to get closer. But maybe today we wanted to show a little more than usual!

    It's not that we haven't given you glimpses of this before. We've talked about it, but now you have some reality. You may think we're, like, precious, you know? But if it goes too far… "creepy" would take over. And that's what we're working to avoid! Because we're streamers, we have to try. So we file down the rough edges, and smooth it out. We even show our "true colors" over drinks!

    You know, everyone's probably spooked because of our close relationship. But no, we're not like that. We really don’t want to freak anyone out. We understand if you think our conversations are “precious”. But we're also making sure you have it on the edge.

    It's like, as streamers, it's something we build together, right? If we enter our own little world, it's over! No one can see. We would start talking in tones nobody's ever heard before.

    Okay, here is the thing: it's not like an exchange of opinions... it's like absorbing each other's ideas, spitting them out, absorbing... It's like a debate! I mean, our manager was worried! I mean, we were flirting, thinking, "Oh, we get along so well, having conversations like this feels amazing!" We really thought it felt amazing! But because we talk in rapid-fire low tones that sound like a debate, it ends up sounding like a fight...

    Is it really just an argument? You know, the way we speak, it sounds like we’re arguing! No wonder they thought we were breaking up. And to dive into deep topics with each other, to expand the discussion further, the opposite...
