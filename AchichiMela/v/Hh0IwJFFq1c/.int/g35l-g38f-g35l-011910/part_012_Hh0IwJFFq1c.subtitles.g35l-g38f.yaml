    original: てか、1時でも相談聞いてくれる人なんだって思ってもらえるのが
    english: Or rather, having you think of me as someone who'd listen to your troubles
      even at 1 AM.
  - start: '02:50.400'
    end: '02:51.900'
    original: ああ、確かに！
    english: Ah, that's true!
  - start: '02:52.500'
    end: '02:56.800'
    original: やっぱそこってさ、よっぽどの関係値がないと、ちょっと一歩引いちゃうところじゃん
    english: You know, unless you have a really close relationship, that's the kind
      of thing where you'd hesitate a bit.
  - start: '02:57.000'
    end: '02:59.000'
    original: ま、確かに、正直
    english: Well, that's true, honestly.
  - start: '02:58.200'
    end: '02:59.500'
    original: 「やめとこうかな」って
    english: Like, "Maybe I shouldn't."
  - start: '02:59.200'
    end: '03:02.500'
    original: ね。なんか申し訳なさとか勝っちゃうよね
    english: Right. Guilt usually wins out.
  - start: '03:01.300'
    end: '03:02.500'
    original: そう！
    english: Exactly!
  - start: '03:02.200'
    end: '03:03.400'
    original: 分かる、分かる
    english: I get it, I get it.
  - start: '03:03.100'
    end: '03:08.800'
    original: でもそれよりも頼りたいっていう感情のがでかいんだなって思ったから、私も嬉しかったから「行くねー！」
    english: But seeing that your feeling of wanting to rely on me was bigger than
      that made me happy too, so I was like, "I'm coming over!"
  - start: '03:09.100'
    end: '03:10.200'
    original: その「行くね」なのよ
    english: That's what that "I'm coming over" meant.
  - start: '03:10.000'
    end: '03:11.200'
    original: 嬉しいのじゃ
    english: I was so happy, noja.
  - start: '03:10.900'
    end: '03:11.800'
    original: そうそうそう
    english: Yeah, yeah, yeah.
  - start: '03:11.900'
    end: '03:16.800'
    original: そう、やっぱさ、あの、話したいけど大丈夫かなっていうのと、でも...
    english: Right, you know, part of me wondered, "I want to talk, but will it be
      okay?", but...
  - start: '03:16.700'
    end: '03:24.400'
    original: 今話したくてへこんでるのに、あの、一人でへこんでる方が今日子は寂しがるなと思って
    english: '...I felt that if I was feeling down and wanted to talk right then,
      Kyoko would feel lonelier if I just stayed depressed by myself.'
  - start: '03:24.700'
    end: '03:26.500'
    original: あ、よく分かるね！
    english: Ah, you know me so well!
  - start: '03:26.700'
    end: '03:30.100'
    original: よく分かってんね、やっぱね！分かり手だ、私の！うん、絶対そう、うん
    english: You really do get me! You totally understand me! Yeah, absolutely.
  - start: '03:30.300'
    end: '03:35.100'
    original: だから、で、後日「実はへこんでてさ」って言ったら、「行ったのに！」ってなるじゃん、きっと
    english: So I figured if I told you later, "Actually, I was feeling down then,"
      you'd definitely say, "I would've come over!"
  - start: '03:34.200'
    end: '03:35.800'
    original: なる、なる、うん
    english: Totally, I would, yeah.
  - start: '03:35.600'
    end: '03:41.800'
    original: と思ったから、あの、すごい信頼してね、今日子を信頼して、ちょっとお話聞いてもらおうかなって思ったの
    english: That's what I thought, so I really trusted you, Kyoko, and thought I'd
      ask you to listen to me for a bit.
  - start: '03:41.700'
    end: '03:45.400'
    original: いや、まさか電話でね、電話で聞いてもらおうかなって思ったのじゃ、わし
    english: I mean, I just thought I'd ask you to listen over the phone, noja!
  - start: '03:45.800'
    end: '03:49.000'
    original: そしたらね、私もだから、お互いに気持ちが分かり合ってんだよ
    english: And then, see, because of that, we totally understand how the other feels!
  - start: '03:49.800'
    end: '03:55.700'
    original: これ多分直接行った方が多分安心できて、てか多分悩みってさ、1個じゃないんだよ、基本的に
    english: I felt you'd feel more at ease if I went in person, and besides, when
      you're troubled, it's rarely just one thing.
  - start: '03:55.300'
    end: '03:56.800'
    original: 確かに、確かに
    english: True, true.
  - start: '03:56.700'
    end: '04:04.000'
    original: 悩んでて誰かに話したい時って1個じゃないはずなのに、通話とかだとさ、そのメインのやつを消化しようとするじゃん
    english: When you're troubled and want to talk to someone, it's never just one
      thing, but over a call, people just try to address the main issue, right?
  - start: '04:03.400'
    end: '04:04.600'
    original: 確かに
    english: That's true.
  - start: '04:04.300'
    end: '04:07.400'
    original: でも会いにいくとさ、ついでにで色んな話できんじゃん
    english: But if you go see each other in person, you end up talking about all
      sorts of other things while you're at it.
  - start: '04:07.200'
    end: '04:09.300'
    original: 「せっかく来てくれたし」って言ってね
    english: Like, "Since you came all the way here anyway..."
  - start: '04:08.700'
    end: '04:10.000'
    original: そうそうそうそう
    english: Exactly, exactly.
  - start: '04:09.400'
    end: '04:10.600'
    original: 確かに、確かに
    english: Indeed, indeed.
  - start: '04:09.900'
    end: '04:11.400'
    original: だから行きたかったのよね
    english: That's why I wanted to go.
  - start: '04:11.200'
    end: '04:21.000'
    original: なるほどー！いや、でも実際すごいありがたかったな。あれでさ、あんでさ、なんかあの日話したから、あの、またなんか頑張ろうって思えた
    english: I see! Man, but seriously, I was so grateful. Because we talked that
      day, it made me feel like, "All right, I can keep giving it my all again."
  - start: '04:21.200'
    end: '04:24.400'
    original: あ、本当？そこまで思ってもらえたんだったら良かったわ、本当に
    english: Ah, really? If it made you feel that way, then I'm really glad.
  - start: '04:24.200'
    end: '04:30.900'
    original: かなりね、わし的にね、悩んでたことが、やっぱ人に話すと整理されるし
    english: Pretty much, for me, talking it out with someone helped sort through
      what was bothering me...
  - start: '04:30.200'
    end: '04:31.400'
    original: うん
    english: Yeah.
  - start: '04:30.900'
    end: '04:42.000'
    original: だし、あの、今日子が言うことって結構、なんかアドバイスとしても、相談相手としてもすごいあったかいし、パッションでね、包み込んでくれる感じもある上に、そのアドバイスもね、的確なんだよな
    english: And what you say, Kyoko, both as advice and just as someone to talk to,
      is so warm, and on top of wrapping me up in your passion, your advice is actually
      spot-on.
  - start: '04:42.100'
    end: '04:44.200'
    original: あ、そう？じゃあ良かったわ
    english: Oh, really? Well, that's good then!
  - start: '04:44.800'
    end: '04:48.500'
    original: だからね、すごいね、嬉しかった。嬉しかったし
    english: So I was really happy. I was so happy, and...
  - start: '04:47.300'
    end: '04:48.500'
    original: 良かった
    english: I'm glad.
  - start: '04:48.700'
    end: '04:52.500'
    original: あの、それでさ、今日もオフコラボさ、元々する予定なかったけどさ
    english: And because of that, even though we originally had no plans to do an
      offline collab today...
  - start: '04:52.600'
    end: '04:53.600'
    original: そう！
    english: Right!
  - start: '04:53.400'
    end: '04:55.200'
    original: ハードル下がったよね、オフコラボの
    english: The hurdle for offline collabs went way down, didn't it?
  - start: '04:54.900'
    end: '04:57.900'
    original: あ、そう！全く下がったね、これでね。「あ、じゃあまたやろうよ」ってなってさ
    english: Ah, yeah! It totally lowered the bar, for sure. We were like, "Oh, let's
      totally do it again!"
  - start: '04:57.500'
    end: '05:00.000'
    original: そうそうそう。なんかお家に初めて呼ぶって結構...
    english: Yeah, yeah, yeah. Inviting someone over to your house for the first time
      is pretty...
