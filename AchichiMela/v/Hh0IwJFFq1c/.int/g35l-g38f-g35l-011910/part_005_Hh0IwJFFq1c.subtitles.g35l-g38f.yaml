  - start: '04:12.700'
    end: '04:14.000'
    original: そうそうそうそう。
    english: Exactly, exactly.
  - start: '04:13.600'
    end: '04:23.700'
    original: あの、救いたくても自分がままならなかったり、それが認識できないと、なんか自分が苦しむだけになっちゃうんだよな。
