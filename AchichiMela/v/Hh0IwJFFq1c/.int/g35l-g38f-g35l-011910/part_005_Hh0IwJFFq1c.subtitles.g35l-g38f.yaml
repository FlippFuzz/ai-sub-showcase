  - start: '03:43.000'
    end: '03:52.600'
    original: でもメラちはそのバランスを良く知ってるし、自分が削れてしまったとしてもその修復の仕方がしっかりと分かってるなっていうところも、私は感じ取れるから、全く心配しないのね。
