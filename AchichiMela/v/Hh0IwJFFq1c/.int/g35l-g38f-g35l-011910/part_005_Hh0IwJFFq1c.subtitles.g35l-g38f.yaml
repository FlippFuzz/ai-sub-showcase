  - start: '03:56.500'
    end: '04:09.200'
    original: 確かに。なんか、そういうさ、その、なんじゃろ、ヒーローじゃん？キョーコって。「ヒーローになりたいです」とか「誰かを救いたいです」ってのって、すごい美しいことだし立派なことじゃけど、難しいんだよな。
