  thoughts:
  - |-
    **Reflecting on Childhood and Human Nature**

    Okay, here’s where my thoughts are at. The focus is on this segment from the video. It begins with a shared observation about how people, sometimes, might be misunderstood in their actions and a reflection on past social experiences. I recall not enjoying school, especially during club activities, preferring my own company and the internet. It was easier to be by myself, but this led to feeling a certain distance, feeling as though I was struggling to connect with my peers.

    There's a specific memory: being called names as a child, feeling excluded, and really not understanding why people behaved that way. It's a key point. At this point, the story progresses into a conversation with another person. They noted a significant level of empathy and an intent to give back to people, despite the difficult experiences. It feels that the connection in the conversation is that others can relate to having felt similar experiences. The shared thought is that it's important to not categorize all people based on negative experiences, and that people should be evaluated on an individual basis.

    A realization then came in high school. People became more accepting. This was a turning point. It's because of these good experiences that I feel I can not hate humans, but rather want to understand them and give back to them. I have the sense that I experienced this shift of perception because of one particular teacher, a dependable adult I could look up to. In reflecting on this, a clear path starts to open up on where the sense of giving back and making a difference comes from.

    Then, there’s another layer. There's also the notion that these so-called “nasty” people are, in fact, a minority. This leads to a strong consideration of childhood. The idea, then, is that childhood experiences and environment play a huge role in shaping a person's behaviour. It's not a question of simply labeling a child as “bad.” It's more about acknowledging that their actions are often a result of their circumstances. If the goal is to love others, then it also means caring about those who, at one point, caused pain or harm.
