    original: あ、そうそうそう！あっちちめらに、あっちちめらの大好物である唐揚げを食べさせることができて。
    english: Ah, exactly, exactly! Being able to feed Acchichi Mela her favorite food,
      karaage.
  - start: '03:58.212'
    end: '04:09.952'
    original: 普通はさ、だってあず色食堂に招きされたって、私も行きたいよ。だからめちゃくちゃさ、喜ばしいことで、そっちにいいなって思って、てかそっちのいいなが客観
      だとするじゃん。
    english: Normally, right, like, being invited to Azuiro Shokudo—I'd want to go
      too. So it's super joyful, and you think "how nice," and let's say that "how
      nice" is the objective reaction.
  - start: '04:10.132'
    end: '04:19.992'
    original: あったのよそこに確実に。そしたらその上にさらに150くらいの、あ、めらっちに唐揚げ作れていいなが、あることに気づいて、言いながらキモい。
    english: That was definitely there. And then on top of that, there was another
      150 points like, "Ah, it's so nice that I can make karaage for Meracchi," and
      realizing that made me think, as I was saying it, "I'm creepy."
  - start: '04:22.012'
    end: '04:36.432'
    original: えでも今キョーコそれキモいって言ったけど、正直さ、あの、全然こういう内容の話するしさと、で、それをさ普通に直接言うじゃんキョーコ。
    english: Eh, but Kyoko, you said that was creepy just now, but honestly, you know,
      you always talk about this kind of stuff, and you say it directly to me like
      that, Kyoko.
  - start: '04:36.572'
    end: '04:47.312'
    original: 言うし、わしもキョーコに対して、あの、キョーコ好きだし、なんかキョーコはさ、わしにさすごい激情も感情が一方通行でみたいなの言うけどさ。
    english: You say it, and I feel the same way toward Kyoko—I like Kyoko, and you
      say things like your intense emotions and feelings toward me are one-sided,
      but...
  - start: '04:47.452'
    end: '05:00.080'
    original: わしもキョーコのことすごい好きなんだよ。だってさ、あの、コラボ配信、デビューのさ次の日にさ、ユニットコラボやったじゃん。あんな時にさ、書いたじゃん、キョーコに今思ってることのところにさ。
    english: I love Kyoko just as much, you know. Because, like, on the very next
      day after our debut collab stream, we did a unit collab, right? Back then, I
      wrote down what I was feeling right then to you, Kyoko...
