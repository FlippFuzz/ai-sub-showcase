  - start: '03:48.280'
    end: '03:51.680'
    original: なんじゃったか忘れだけど、なんか
    english: I forgot what it was, but...
  - start: '03:51.680'
    end: '03:55.720'
    original: 私に相談してほしかったみたいな言われたことある気。
    english: I feel like you told me once you wanted me to consult with you more.
  - start: '03:55.720'
    end: '03:56.540'
    original: あった！
    english: That's right!
  - start: '03:56.540'
    end: '03:57.380'
    original: なんだったっけあれ？
    english: What was that again?
  - start: '03:57.380'
    end: '04:01.380'
    original: あのね、私のマネージャーさん... なんだったっけあれ？
    english: Um, my manager... what was that story again?
  - start: '04:01.380'
    end: '04:02.160'
    original: なんの話じゃっけ？
    english: What were we talking about?
  - start: '04:02.160'
    end: '04:05.460'
    original: えっと、これ大丈夫かな一体？なんか、なんかやばいとこぼして？
    english: Um... is this okay? Did I spill something dangerous?
  - start: '04:05.460'
    end: '04:15.860'
    original: えっと、まあ、そのさ、我々って先輩だけじゃなくて、カバーのいろんな方とも関わる機会があるじゃない？だからカバーの方々とお話する時にこう、あんまりこう硬く行き過ぎるとみたいな。
    english: Well, you know, we interact not just with our seniors, but with various
      people at Cover Corp too. So when we talk with people at Cover, if we're too
      stiff about it...
  - start: '04:15.860'
    end: '04:18.960'
    original: ああ！そうそうそうそう。
    english: Ah! Exactly, exactly.
  - start: '04:18.960'
    end: '04:24.460'
    original: はいの文章がなんか毎回硬いんだよね。なんかお世話になっております、まるまるまるまるですみたいな。
    english: Mela's messages are always so stiff. Like, "Thank you for your continued
      support, I am so-and-so."
  - start: '04:24.460'
    end: '04:36.880'
    original: 外部に送るビジネスメールみたいな文章を、あの、送ってたんじゃけど、そうじゃなくてもうちょいフランクに行った方がなんかいいんだよね。
    english: I used to send messages structured like business emails meant for external
      clients, but I was told it's better to be a bit more casual.
  - start: '04:36.880'
    end: '04:40.460'
    original: そうそう、やっぱタレントだからさ我々。そこまで気使う存在だからね。
    english: Right, because we're talents after all. We're people who have to watch
      our manners.
  - start: '04:40.460'
    end: '04:47.160'
    original: 人間として正しい振る舞いはもうちょいフランク目みたいなことを教えてもらったんだよね。教えてもらった時に、なんじゃっけ？
    english: I was taught that proper human behavior can be a bit more casual. When
      I was taught that, what was it again?
  - start: '04:47.160'
    end: '04:57.180'
    original: え、それで、ええ、これでいいんですかみたいなことをまた相談したくって、その相手が私じゃなかったっていうことに嫉妬してました。
    english: And then, you consulted someone else asking, "Is this really okay?" and
      I was jealous that the person you asked wasn't me!
  - start: '04:57.180'
    end: '05:00.088'
    original: 私に聞いてくれればよかったのに！
    english: You should have asked me instead!
