    original: マジで全部埋めんだ、ほんと。
    english: It really soaked up all the flavor, seriously!
  - start: '03:31.960'
    end: '03:34.020'
    original: え、じゃあわしねの母すごいのかも。
    english: Oh, then my mom might actually be amazing!
  - start: '03:34.020'
    end: '03:36.960'
    original: わしが当たり前に食べていた料理、いつもありがとうございます、お母様。
    english: Thank you always for the dishes I took for granted, Mother.
  - start: '03:36.960'
    end: '03:38.220'
    original: ガチで美味しいです。
    english: It's seriously delicious.
  - start: '03:38.220'
    end: '03:41.720'
    original: きょうこも喜んでおります。おかあみです、ありがとうございます。ごちそうさまでした！
