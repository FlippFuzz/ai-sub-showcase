  - start: '02:55.500'
    end: '02:58.500'
    original: 終わった！終わった！
    english: It's over! Done for!
  - start: '02:58.200'
    end: '03:04.200'
    original: いや、そういうのはね、そういうのは本人が言っちゃダメなのじゃ。外部が、あの…しかもファンの人とか、
    english: No, that's—that's something the person themselves can't say! Outsiders...
      actually, even fans...
  - start: '03:04.200'
    end: '03:09.100'
    original: ファンの人やっぱさ、あの、めらちゃん心配とか勝っちゃうからファンの人も言えないから、もうほんとにあの
    english: '...fans would be too worried about me to make that joke, so really it''s
      something...'
  - start: '03:09.100'
    end: '03:16.200'
    original: めらのキャラ設定と名前を知ってるぐらいの距離感の人が言うセリフじゃろ、それ
    english: '...that only someone who barely knows Mela''s character lore and name
      from a distance would say!'
  - start: '03:16.000'
    end: '03:19.100'
    original: そうそう、自分で言ったらとんでもないことだよ
    english: Yeah, yeah, saying it yourself would be insane.
  - start: '03:18.600'
    end: '03:25.200'
    original: ダメダメダメダメ！あの、炎上はね、あの、初手はもうしゃあないとしてどうしようもないとして
    english: No, no, no, no! With a controversy, the initial spark might be unavoidable
