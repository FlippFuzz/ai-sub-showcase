  - start: '03:25.200'
    end: '03:29.500'
    original: あの、二手目、三手目がね、結構明運をね…
    english: '...but your second and third moves are really what decide your fate...'
  - start: '03:29.100'
    end: '03:32.300'
    original: ガチ大事！ほんと、ガチ大事。うん
    english: Super important! Seriously, super important. Yeah.
  - start: '03:32.100'
    end: '03:37.200'
    original: そうなのじゃ。その後次第でもうどうにでもなるから
