  - start: '04:09.000'
    end: '04:11.600'
    original: そっか、そういう禊も
    english: I see, that kind of penance too...
  - start: '04:10.300'
    end: '04:15.700'
    original: 禊あるよ。せっかくのね、キャラとしての特徴1個奪うっていうね
    english: There's that penance! Taking away one of your defining character traits,
      haha.
  - start: '04:15.700'
    end: '04:20.400'
    original: わしすごい気に入ってるのにな。なんか人間はさ、髪の毛燃えてないじゃん
    english: Even though I really like it! Humans don't have their hair on fire, right?
  - start: '04:20.200'
    end: '04:21.000'
    original: そうね
    english: True.
  - start: '04:20.900'
    end: '04:24.000'
    original: でもわし髪の毛燃えてるの気に入ってるのじゃ
    english: But I really like having my hair on fire, ja.
  - start: '04:23.800'
    end: '04:25.300'
    original: いや可愛いよね、めっちゃね
    english: Yeah, it's super cute!
  - start: '04:25.100'
    end: '04:26.200'
    original: うん、可愛い
    english: Yeah, cute.
  - start: '04:25.700'
    end: '04:29.800'
    original: あ、でもさすがにちょっと炎上した後にそれが目に入るのは悲しい事件がね
    english: Oh, but seeing flames after actually going up in flames online would
      be a sad reminder...
  - start: '04:29.800'
    end: '04:32.300'
    original: 思い返されちゃうから
    english: '...because it''d bring back the memory.'
  - start: '04:30.600'
    end: '04:32.300'
    original: 確かに
    english: True.
  - start: '04:32.100'
    end: '04:36.200'
    original: そうそうそう、だから1年間はちょっと火け…謹慎でね。うん
    english: Yeah, yeah, so for one year it'd be a fire-ban suspension. Mm-hm.
  - start: '04:36.200'
    end: '04:40.400'
    original: てかさ、これ言っていいんか悪いかちょっとわかんないんじゃけどさ…
    english: Wait, I'm not really sure if I should say this or not, but...
  - start: '04:40.200'
    end: '04:42.500'
    original: あ、ちょやめとくか！大丈夫？大丈夫？それ
    english: Oh, maybe hold off?! Is it okay? Is it safe?
  - start: '04:42.200'
    end: '04:45.600'
    original: いや、そんなヤバいことじゃない！さすがに、さすがに、さすがにわしめら…
    english: No, it's nothing that bad! Come on, give me some credit...
  - start: '04:45.400'
    end: '04:54.500'
    original: え、なんかさ、わしさ、なんかさ、ファンの人からのさ、あの今までめらちゃんを見てきた印象みたいなのでさ、なんかなぜかちょっと炎上しそうっていう…
    english: Um, well, from the impression fans have gotten watching me up until now...
      for some reason people say I seem like I might get into a controversy...
  - start: '04:54.500'
    end: '04:56.800'
    original: なんでだよ！そんなことないよ！
    english: Why?! That's not true at all!
  - start: '04:56.700'
    end: '04:59.000'
    original: なんでだよ！
    english: Why would they think that?!
  - start: '04:57.000'
    end: '05:00.064'
    original: わかんない！わかんない！わかんない！
    english: I don't know! I don't know! I don't know!
