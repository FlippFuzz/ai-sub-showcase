    original: そん時はもちろん、あの、きっちりともう「ですます」、もう「のじゃ」の「の」の字も出ない
    english: So in that case, of course, I'd stick strictly to 'desu/masu'—not even
      a single 'no' from 'no ja' would slip out.
  - start: '02:33.500'
    end: '02:36.000'
    original: で、「わし」じゃなくて「私」ってね
    english: And instead of 'washi,' you'd say 'watashi'!
  - start: '02:35.800'
    end: '02:38.200'
    original: いやもう、ちゃうちゃうちゃう、「わたくし」ですよ
    english: No, no, no, it'd be 'watakushi'!
  - start: '02:37.500'
    end: '02:40.200'
    original: 「わたくし」まで行く！？すげえ！ガチすぎ！
    english: You'd go all the way to 'watakushi'?! Amazing! So serious!
  - start: '02:40.200'
    end: '02:44.400'
    original: いや「わたくしがこの度」みたいな言い方するよ、もちろん。そうなるじゃん
    english: Well, I'd say things like 'Watakushi ga kono tabi...' ('I, on this occasion...'),
      of course. That's how it goes.
  - start: '02:44.200'
    end: '02:45.600'
    original: で、「ワロタ」も言わない
    english: And you wouldn't say 'lol' either.
  - start: '02:45.500'
    end: '02:51.400'
    original: ちょ、言うわけない、言うわけない！そんな、そんなもう、もうもう火に油ですよ！ほんとに
    english: Hey, of course I wouldn't say that! That would just be pouring oil on
      the fire, seriously!
  - start: '02:51.000'
    end: '02:55.500'
    original: 「わたくし火消し担当なのに、炎上しててワロタ」
    english: '''Even though I am in charge of firefighting, I am the one catching
