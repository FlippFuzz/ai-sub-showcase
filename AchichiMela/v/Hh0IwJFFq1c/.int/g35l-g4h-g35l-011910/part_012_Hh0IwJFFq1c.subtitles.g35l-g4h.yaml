    end: '02:51.950'
    original: あー、確かに！
    english: Ah, true!
  - start: '02:51.950'
    end: '02:56.850'
    original: やっぱそこってさ、よっぽどの関係値がないと、ちょっと一歩引いちゃうところじゃん
