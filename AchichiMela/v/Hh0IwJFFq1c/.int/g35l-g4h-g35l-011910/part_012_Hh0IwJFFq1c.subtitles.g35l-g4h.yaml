  - start: '04:30.200'
    end: '04:39.800'
    original: なし、あのキョーコが言うことって結構、なんかアドバイスとしても相談相手としてもすごいあったかいし、パッションでね、こう包み込んでくれる感じもある上に
    english: and besides, what Kyoko says—both as advice and as someone to confide
