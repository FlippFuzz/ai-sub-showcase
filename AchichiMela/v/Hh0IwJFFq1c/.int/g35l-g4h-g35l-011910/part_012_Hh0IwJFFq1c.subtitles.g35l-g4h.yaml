  - start: '02:56.850'
    end: '03:02.050'
    original: ま、確かに正直ね。「申し訳なさ」とか勝っちゃうよね
    english: Well, honestly, yeah. You start feeling bad about bothering them.
  - start: '03:02.050'
    end: '03:08.550'
    original: 分かる分かる。でもそれよりも頼りたいっていう感情の方がでかいんだなって思ったから、私も嬉しかったから「行くね！」
