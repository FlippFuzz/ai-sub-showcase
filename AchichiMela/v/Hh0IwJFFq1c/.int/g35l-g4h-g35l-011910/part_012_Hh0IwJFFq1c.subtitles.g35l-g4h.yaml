  - start: '04:42.550'
    end: '04:44.550'
    original: あ、そう？じゃあよかったわ
    english: Oh, yeah? Well, I'm glad then.
  - start: '04:44.550'
    end: '04:48.500'
    original: うん。だからね、すごいね、嬉しかった。嬉しかったし
    english: Yeah. So I was really, really happy about it.
  - start: '04:48.500'
    end: '04:53.050'
    original: それでさ、今日もオフコラボさ、元々する予定なかったけどさ
