    **(00:00.000 - 05:00.000)**

    Okay, here's what happened:
    It's an off-collab stream with Kyoko! We start off with introductions, a lot of enthusiasm, and the fact that this is a *first* for both of us! It's our first time doing an off-collab at my place, and our first time drinking on-stream!

    We're going to dive right in and open up our drinks! I'm opening up the Horoyoi Cassis Orange, because I can't drink that much, especially when it's our first time drinking on stream. Kyoko is drinking the Kodawari Sakaba no Lemon Sour, which she's really into!

    We've been working outside today, so we're both excited to relax and have a drink!

    Kyoko requested that my mom make her Chikuzen-ni, and it's here! She's complimenting my mom's *rangiri* (irregular chopping) on the vegetables. I'm going to have some too, it looks delicious. She really enjoyed it!

    We're getting comfortable, and I'm asking Kyoko if I can "borrow" some stuff for the stream. Since it's our first time, and I'm using whatever I have. She is fine with it! We have not done this before, so I'm hoping I can get this off-collab done to match those of more experienced off-collab streamers. I didn't realize how much thought went into this, but Kyoko says that it feels really comfortable! The chair I got for her is a new one since my old one was squeaky.
