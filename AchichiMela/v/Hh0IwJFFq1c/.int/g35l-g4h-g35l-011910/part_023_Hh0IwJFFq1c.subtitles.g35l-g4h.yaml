  - start: '02:47.100'
    end: '02:57.950'
    original: 何か本当に友達が思い詰めてて、何かお酒の力でこう何か元気になりたいみたいな時に付き合うとかはあるんじゃけど
    english: Like, when a friend is really brooding over something and wants to cheer
      up a bit with the help of alcohol, I'll keep them company sometimes, though.
  - start: '02:57.700'
    end: '02:59.050'
    original: あー、なるほどね、うん
    english: Ahh, I gotcha, yeah.
  - start: '02:59.050'
    end: '03:07.000'
    original: そう、何か自主的に1人で飲みたいとかもあんまなんないし、あの、わしがお酒飲まないから、お酒飲まない友達が多い
    english: Yeah, I don't really feel like drinking alone on my own either, and since
      I don't drink, most of my friends don't drink too.
  - start: '03:07.000'
    end: '03:09.100'
    original: あー、まあそうなるよね！うん
    english: Ahh, well, that makes sense! Yeah.
  - start: '03:09.100'
    end: '03:13.600'
    original: そう、じゃから、あの、すごいレア飲酒だったかも
    english: Yeah, so this might've been a super rare drinking session.
  - start: '03:13.600'
    end: '03:16.900'
    original: お、え、じゃ今日は何でそもそも飲もうかなって思ったの？
    english: Oh, wait, then why did you decide to drink today in the first place?
  - start: '03:16.900'
    end: '03:22.200'
    original: え、何かね、あの…何かね、あんまりね…
    english: Uh, well, you know... not really...
  - start: '03:22.200'
    end: '03:28.200'
    original: 左上にタイトル書いてあると思うんじゃけど、あちちめらは飲酒で素を見せたいオフコラボなんだけど一応
    english: It's written in the title on the top left, 'Achichi Mela wants to show
      her true self through drinking' off-collab, technically.
  - start: '03:28.000'
    end: '03:29.000'
    original: うんうんうん
    english: Yeah, yeah, yeah.
  - start: '03:28.800'
    end: '03:37.300'
    original: 何でかって、何かね、あの…どうしてもね、わしの一番の思われたいやつが、人間に可愛いって思われたいの
    english: As for why... the biggest thing I want from humans is for them to think
      I'm cute.
  - start: '03:37.300'
    end: '03:38.000'
    original: うん
    english: Mhm.
  - start: '03:37.800'
    end: '03:41.200'
    original: で、人間に愛されたいが結構欲望の中で強くて
    english: And wanting to be loved by humans is pretty strong among my desires.
  - start: '03:41.200'
    end: '03:42.100'
    original: はいはいはいはい
    english: Right, right, right.
  - start: '03:42.000'
    end: '03:44.000'
    original: だからどうしても可愛くぶっちゃうんだよね
    english: So I inevitably end up trying to act cute.
  - start: '03:44.000'
    end: '03:45.200'
    original: なるほどね！
    english: I see!
  - start: '03:45.000'
    end: '03:49.500'
    original: そう、わし可愛くぶっちゃって、だから多分素が見えづらいのじゃ
    english: Yeah, I try to act cute, so my real self is probably hard to see.
  - start: '03:49.500'
    end: '03:54.300'
    original: あ、でもお酒の力を借りたらそこが取っ払えるかなってことで！
    english: Oh, so you thought borrowing the power of alcohol might help tear down
      that wall!
  - start: '03:54.000'
    end: '04:01.700'
    original: そう！でも1人だとやっぱ心配だから、し、あのキョーコと2人でオフコラボとかなったら行けるかなと思って
    english: Yes! Though I'd be worried doing it alone, and I figured if it's an off-collab
      with just me and Kyoko, I could pull it off.
  - start: '04:01.700'
    end: '04:03.050'
    original: なるほどね！
    english: Gotcha!
  - start: '04:03.050'
    end: '04:11.100'
    original: そうだから、あの、人間たちにね、ちょっとね、あの、取り繕わない必死な姿をホラゲー以外でも見せたかったの
    english: So yeah, I wanted to show the humans my unpolished, earnest side outside
      of just horror games too.
  - start: '04:11.100'
    end: '04:16.400'
    original: あー、なるほど！そっか今までは可愛いってお面を結構ね、維持しようと頑張ってたんだ
    english: Ahh, I see! So up until now, you were working hard to keep up that 'cute'
      mask.
  - start: '04:16.400'
    end: '04:19.000'
    original: そうなのじゃ。あんま変わんない？そんな
    english: That's right. Did I not change that much?
  - start: '04:19.850'
    end: '04:22.250'
    original: でも結構素の部分も今回見えたよな
    english: No, I think we got to see quite a bit of your true self this time.
  - start: '04:22.250'
    end: '04:23.300'
    original: どうじゃった、わしら
    english: How were we?
  - start: '04:22.900'
    end: '04:24.400'
    original: うん、今まで語んない部分もな
    english: Yeah, parts you don't usually talk about too.
  - start: '04:24.400'
    end: '04:26.400'
    original: どうだった、どうだった？素っぽかった？
    english: How was it, how was it? Did I seem genuine?
  - start: '04:26.400'
    end: '04:27.500'
    original: 素っぽく…いや
    english: Genuine... well...
  - start: '04:27.700'
    end: '04:32.300'
    original: わしは正直、あの、てぇてぇの下りガチ記憶ないから
    english: Honestly, I have zero memory of that whole wholesome bonding bit.
  - start: '04:33.350'
    end: '04:36.850'
    original: てぇてぇの下りの記憶がないから何言ったか分かんないんじゃけど
    english: I have no memory of that wholesome part, so I don't even know what I
      said.
  - start: '04:36.850'
    end: '04:42.200'
    original: でもてぇてぇで埋まったぞ、マジで！うわーって！上から下までてぇてぇしかなかったよ
    english: But chat was totally flooded with 'teetee' comments, seriously! From
      top to bottom, nothing but wholesome!
  - start: '04:42.200'
    end: '04:46.800'
    original: え、でも、ちょっと、でもあれかも。素が結構重いのがバレてしまった可能性…
    english: Eh, wait, maybe... there's a chance I exposed how emotionally heavy my
      true self is...
  - start: '04:46.800'
    end: '04:48.600'
    original: お互いだよそれは！
    english: That goes for both of us!
  - start: '04:48.600'
    end: '04:55.500'
    original: あのね、違う、あのな、何かねめらちは結構さ、自己開示するからいいじゃん。私多分こんなに重いって思ってる人いなくって！
    english: Wait, no, listen! You already open up about yourself a lot, Mela-chi,
      so it's fine. Nobody probably expected ME to be this heavy!
  - start: '04:55.900'
    end: '04:59.500'
    original: 今日多分私の方が多分素を見せたいになってるのよ
    english: Today, I think I'm the one who ended up 'showing my true self' more!
