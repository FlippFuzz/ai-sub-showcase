    end: '02:20.000'
    original: 話せない、絶対無理！
    english: You couldn't, no way!
  - start: '02:20.000'
    end: '02:22.200'
    original: 少なくともその初期段階では無理だよな。
    english: At least not in the early stages.
  - start: '02:22.200'
    end: '02:26.000'
    original: あの、私も絶対にこの明るいパッションの部分しか出さないから。
    english: Like, I'd definitely only show this bright, passionate side of myself
      too.
  - start: '02:26.000'
    end: '02:26.900'
    original: そうかもね。
    english: Maybe so.
  - start: '02:26.900'
    end: '02:30.200'
    original: わ、今あれだ！明るいパッションの部分以外があるんだって思わ…
    english: Whoa, wait! Now everyone's gonna think I have sides other than bright
      passion...
  - start: '02:30.200'
    end: '02:34.600'
    original: いやまあ、お酒飲んでるから多少はね、多少はね、多少はね。
    english: Well, I mean, we're drinking alcohol, so a little bit, a little bit.
  - start: '02:34.600'
    end: '02:37.300'
    original: いやでもロジックの部分があるって説明はした！
    english: Well, I did already explain that I have a logical side!
  - start: '02:37.300'
    end: '02:40.700'
    original: あの、ディベートし…あの棒読みでディベートしちゃうよって。
    english: Like, how I end up debating in a monotone voice.
  - start: '02:40.700'
    end: '02:42.800'
    original: いやそれやんないから絶対に！
    english: I'm definitely never doing that!
  - start: '02:44.000'
    end: '02:47.300'
    original: ただお互いに意見を言い合うだけのディベート会。
    english: Just a debate session where we share our opinions back and forth.
  - start: '02:47.300'
    end: '02:49.500'
    original: 「あれってもし…え、それってことはそういうことなんですか？」
    english: '"Wait, if that''s... huh, does that mean this?"'
  - start: '02:49.500'
    end: '02:53.000'
    original: 「いやそれは違います。あの、私の認識としてはこちらはこうなのですが」
    english: '"No, that''s incorrect. In my understanding, this part works like this..."'
  - start: '02:53.000'
    end: '02:55.100'
    original: 「いやでもそれは違って、私としてはこう思うんですが」
    english: '"No, that''s not quite right—personally, I think it''s like this..."'
  - start: '02:55.100'
    end: '02:58.400'
    original: 「あ、確かにその解釈もありえますね」「うん、それいいですね」
    english: '"Oh, that interpretation is certainly possible too." "Mm, that''s a
      good point."'
  - start: '02:58.400'
    end: '03:00.000'
    original: みたいなことをしてるんだよな！
    english: That's the kind of thing we do!
  - start: '03:01.100'
    end: '03:04.700'
    original: こういうのを楽屋とかでしてたら心配されるんだよな！
    english: When we do this in the green room, people get worried about us!
  - start: '03:04.700'
    end: '03:05.700'
    original: 心配されるんだよ！
    english: They really do get worried!
  - start: '03:05.700'
    end: '03:09.700'
    original: しかもね、仮定の話とかもするから。「こうだったら」みたいな話とかもして…
    english: Plus, we talk in hypotheticals too, like "What if it were like this?"
      and stuff...
  - start: '03:09.700'
    end: '03:14.700'
    original: それをやっぱさ、途中から聞く人は仮定の話だと聞こえないときもあるから…
    english: And for someone tuning in partway through, sometimes it doesn't sound
      like a hypothetical...
  - start: '03:14.700'
    end: '03:18.600'
    original: 本当にそういう危険な思想とか持ってるのかなって思われちゃって。
    english: So they end up thinking we actually hold some kind of dangerous ideology.
  - start: '03:18.600'
    end: '03:20.700'
    original: そう、余計心配になるよね！
    english: Yeah, it just makes them worry even more!
  - start: '03:20.700'
    end: '03:26.500'
    original: いやでもやっぱ、あの…仮定は多ければ多いほど、その結論の質が良くなるからやってるだけなのに…
    english: I mean, we only do it because the more hypotheticals you consider, the
      better the quality of your conclusion...
  - start: '03:26.500'
    end: '03:29.500'
    original: そう！色んな仮定をね、あるのよ、そう。
    english: Right! There are all kinds of hypotheticals, yeah.
  - start: '03:29.500'
    end: '03:32.300'
    original: そんなの極端な仮定とかも出すもんな！
    english: We throw out super extreme hypotheticals too!
  - start: '03:32.300'
    end: '03:34.200'
    original: ガチで議論楽しんでんの、うちら。
    english: We genuinely enjoy debating.
  - start: '03:34.200'
    end: '03:36.100'
    original: そう、生き生きとね！うん。
    english: Yeah, so lively! Mm.
  - start: '03:36.100'
    end: '03:37.500'
    original: ヤバいよなマジでな！
    english: We're seriously crazy!
  - start: '03:37.500'
    end: '03:38.500'
    original: そうなのじゃ！
    english: We really are!
  - start: '03:38.500'
    end: '03:40.000'
    original: 楽屋でしてんのかよ、だから！
    english: Why are we doing it in the green room, though?!
  - start: '03:40.000'
    end: '03:41.200'
    original: そう、楽屋でしてんの！
    english: Yeah, we do it in the green room!
  - start: '03:41.200'
    end: '03:43.800'
    original: え、だって…ねえ。
    english: Well, I mean... you know.
  - start: '03:43.800'
    end: '03:45.700'
    original: ちょうどこないだもしたね。
    english: We just did it the other day too.
  - start: '03:45.700'
    end: '03:49.500'
    original: 何の話をしたか忘れるぐらい色々な話をしておりますが…
    english: We talk about so many things we forget what we even discussed, though...
  - start: '03:49.500'
    end: '03:53.500'
    original: マジでそうそう。もうつーちゃんとそぴあ慣れちゃったんじゃない？
    english: Seriously, yeah. Haven't Tsuu-chan and Sopia gotten used to it by now?
  - start: '03:53.500'
    end: '03:58.000'
    original: うん、なんか綴理とそぴあは「二人が話してんな」ってので見守ってくれてるよな、優しくな。
    english: Yeah, Tsuzuri and Sopia just watch over us kindly like, "Oh, those two
      are talking again."
  - start: '03:58.000'
    end: '03:59.500'
    original: そうそうそうそう、うん。
    english: Yeah, yeah, yeah.
  - start: '03:59.500'
    end: '04:01.700'
    original: いつもありがとう！ありがとう、本当にありがとう！
    english: Thank you always! Thank you, really, thank you!
  - start: '04:01.700'
    end: '04:03.200'
    original: いつもありがとうなのじゃ！
    english: Thank you always!
  - start: '04:03.200'
    end: '04:05.300'
    original: 本当に。いや、この4人で良かったです！
    english: Really. I'm so glad it's the four of us!
  - start: '04:05.300'
    end: '04:06.600'
    original: いや、本当に思う！
    english: Yeah, I truly feel that way!
  - start: '04:05.800'
    end: '04:06.800'
    original: 我々幸せです！
    english: We're so happy!
  - start: '04:06.800'
    end: '04:11.600'
    original: いやとても幸せなのじゃ。幸せだし、なんか…奇跡みたいだなって思うな。
    english: I'm super happy. I'm happy, and it kinda feels like a miracle.
  - start: '04:11.600'
    end: '04:15.300'
    original: だって、この時期じゃなかったらワシ、アソビ★まわり隊！に入ってないのじゃ。
    english: Because if it hadn't been at this exact time, I wouldn't have joined
      Asobi Mawaritai!
  - start: '04:15.300'
    end: '04:19.200'
    original: そうなんだよ。本当ちょっとのズレでさ、この4人って多分揃わなかったから…
    english: That's so true. If things had shifted even slightly, the four of us probably
      wouldn't have come together...
  - start: '04:19.200'
    end: '04:20.400'
    original: うん、揃わなかった！
    english: Yeah, we wouldn't have!
  - start: '04:20.400'
    end: '04:22.400'
    original: マジで奇跡だよなー！
    english: It really is a miracle!
  - start: '04:22.400'
    end: '04:25.300'
    original: ねえ！だからすごい嬉しいのじゃ！
    english: Right?! That's why I'm so happy!
  - start: '04:25.300'
    end: '04:27.400'
    original: ね、嬉しいね。幸せだよね、本当ね！
    english: Yeah, it makes me happy. We're really lucky, aren't we!
  - start: '04:27.400'
    end: '04:29.400'
    original: いや幸せだなー。ありがたいなー。
    english: Yeah, I'm so happy. So grateful.
  - start: '04:29.400'
    end: '04:34.200'
    original: だしさ、うちらがこんなとんでもない会話をしてるのを「てぇてぇ」って言って聞いてくれてる…
    english: And on top of that, people are listening to us having these outrageous
      conversations and calling it "wholesome"...
  - start: '04:34.200'
    end: '04:36.200'
    original: いや、ありえない！すごい！
    english: Yeah, it's unbelievable! Amazing!
  - start: '04:36.200'
    end: '04:38.500'
    original: これも奇跡だと思うの、正直ね。
    english: Honestly, I think this is a miracle too.
  - start: '04:38.500'
    end: '04:39.800'
    original: いや奇跡なのじゃ！こんな…
    english: It really is a miracle! Like...
  - start: '04:39.800'
    end: '04:47.500'
    original: だって、あの…俺たちはこの気持ちの悪いブツブツトークをしているだけだというのに…
    english: I mean, all we're doing is having this weird, creepy mumbling talk, and
      yet...
  - start: '04:47.500'
    end: '04:51.000'
    original: しているだけだというのに、なんかこれを「てぇてぇ」としてくれている！
    english: All we're doing is that, and somehow they treat it as "wholesome"!
  - start: '04:51.000'
    end: '04:53.000'
    original: すごい、てぇてぇ当たり判定広いのじゃ！
    english: Man, their hitbox for "wholesome" is huge!
  - start: '04:53.000'
    end: '04:56.000'
    original: 当たり判定広すぎる！すごすぎる！めら組すごすぎる！
    english: The hitbox is way too huge! You're amazing! Meragumi is amazing!
  - start: '04:56.000'
    end: '05:00.000'
    original: ありがとうなのじゃ！全員のファンの皆様！
    english: Thank you so much! To all of our fans!
  - start: '04:56.200'
    end: '04:58.000'
    original: ありがとう本当に！
    english: Thank you, truly!
