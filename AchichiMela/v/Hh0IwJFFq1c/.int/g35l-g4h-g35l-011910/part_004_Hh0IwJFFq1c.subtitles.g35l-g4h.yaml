  thoughts:
  - |-
    **A Deep Dive into Resonance and Shared Values**

    Okay, so I've been reflecting on this conversation with Kyoko recently, and it really struck me. Initially, I was thinking about the initial awkwardness of getting to know someone, like building that shared atmosphere. I thought I might need to work on it, but then, I realized, there was no need! Kyoko had this innate ability to connect with people, and I saw her applying it right from the start. We were talking about how she connected with others and it dawned on me.

    It got me remembering a time when Tsuzuri and I were watching Kyoko and Sopia talking. We were saying how Kyoko had such a powerful voice and energetic personality. Tsuzuri then said how she used to be the loudest person in every group, but now, with Kyoko, it was different. And honestly, I felt the same way! Wherever I went, I was usually the loudest, the one setting the tone, you know? But Kyoko? She had a presence that was on another level. I was genuinely taken aback by how much louder she was, but also, in a good way. That made me realize things were going to be okay. It was a relief, because it felt like we weren't going to have to do all that awkward, "feeling out the group" kind of stuff. Kyoko just jumped right in!

    Then, we started talking about our goals and why we were in Hololive. I remember Kyoko being the first to share, and as I listened, I was totally blown away. Like, she expressed her ambitions and passions for her Hololive activities. I was shocked, thinking, "Wait, is this me?!" I've never resonated with someone so much, right at that moment I thought, "We have the same core of our souls."

    We've talked about this on stream before, and I think that, even though we are clearly individuals, like our voices or how we express ourselves may be different, we had the same soul. What Kyoko was saying really was like listening to my own personal dreams for Hololive being spoken. I remembered sharing that I love humans and wanted to bring them hope. I felt that Kyoko and I were so alike. Kyoko has this powerful, energetic presentation, but when she started talking about her dreams, there was so much nuance. It wasn't just energy; there was a deep-seated value system at play. It was like listening to someone who had such a clear vision of the world they wanted to build, it was her entire life experience.

    I also recall that I, at that point, started to feel that I was really "getting" her. I remember, Kyoko was talking about visualizing everyone's time, like in a horizontal schedule, and that she wanted to "paint over" it with fun, like playing fun Splatoon, with her goal being to paint all the time in the world with joy. I vividly remember yelling, "I get it!" Then I thought: we share the same values. We were really on the same wavelength.
