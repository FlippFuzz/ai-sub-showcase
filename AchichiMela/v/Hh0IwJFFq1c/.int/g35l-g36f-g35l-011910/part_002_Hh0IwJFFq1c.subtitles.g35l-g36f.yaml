    original: 分かる！
    english: I know, right!
  - start: '03:09.920'
    end: '03:17.600'
    original: ってぐらいの、経験値じゃないけど、なんだろう、密度というか...は、もう知っちゃってるかもしれないのじゃ。
    english: That's how much... well, not experience, but density of time we've already
      tasted.
  - start: '03:17.600'
    end: '03:22.560'
    original: ね！本当ありがたいよね。デビューしてまださ、1ヶ月ちょっとでここまで経験させていただけてさ。
    english: Right! It's truly something to be grateful for. Just a little over a
      month since debut, and we've experienced so much.
  - start: '03:21.840'
    end: '03:28.800'
    original: そう！まだお話できてない先輩とかさ、もういっぱいいるし、まだコラボもそんなにできてないけどさ。
    english: Yeah! There are still so many seniors we haven't talked to yet, and we
      haven't done that many collabs yet either.
  - start: '03:29.280'
    end: '03:31.760'
    original: にしても！にしてもよ！
    english: Even so! Even so!
  - start: '03:31.760'
    end: '03:33.680'
    original: 長い！
    english: It feels long!
  - start: '03:33.200'
    end: '03:34.240'
    original: 長い！
    english: Long!
  - start: '03:34.000'
    end: '03:35.440'
    original: 長いのじゃ。
    english: It feels long.
  - start: '03:35.040'
    end: '03:36.560'
    original: ありがたいよね、本当ね。
    english: We're really grateful, honestly.
  - start: '03:36.240'
    end: '03:37.360'
    original: ありがたい。
    english: Grateful.
  - start: '03:37.040'
    end: '03:40.080'
    original: ここまで素晴らしい日々をさ、過ごさせていただいて。
    english: Getting to spend such wonderful days up until now.
  - start: '03:41.200'
    end: '03:46.000'
    original: あとなんかデビュー前に心配したことが全然そうでもないことが多い。
    english: Also, many things I worried about before debut turned out not to be an
      issue at all.
  - start: '03:46.000'
    end: '03:47.600'
    original: あ、どんなこと心配してたの？ちなみに。
    english: Oh, what kind of things were you worried about, by the way?
  - start: '03:47.600'
    end: '04:00.640'
    original: え、なんか、配信毎日してたら、やる事なくなっちゃうかなとか。いわゆる配信ネタみたいなのが、ネタ切れとかしちゃうのかなとか思っとったんじゃけど。
    english: Well, like, if I stream every day, will I run out of things to do? I
      wondered if I'd run out of content ideas, but...
  - start: '04:00.640'
    end: '04:03.360'
    original: やりたいことが無限であろった。
    english: It turns out the things I want to do are infinite.
  - start: '04:03.000'
    end: '04:03.920'
    original: そうなんだよ！
    english: Exactly!
  - start: '04:03.360'
    end: '04:05.520'
    original: どんどん湧いてきちゃうんだよね！
    english: Ideas just keep popping up endlessly!
  - start: '04:05.520'
    end: '04:06.400'
    original: ね！
    english: Right!
  - start: '04:05.840'
    end: '04:14.480'
    original: そうそうそう！配信やって、視聴者の方がさ、たくさんリアクションくださるから、じゃあこのリアクションくれるんだったら、これもできそうじゃん！みたいに思いついちゃうんだよね！
    english: Yeah, exactly! Doing streams, the viewers give us so many reactions,
      so we think, 'Oh, if they react like this, we could probably do this too!' and
      we come up with ideas!
  - start: '04:14.480'
    end: '04:15.680'
    original: そう、そう、そう！
    english: Yeah, exactly!
  - start: '04:16.080'
    end: '04:35.840'
    original: とか、なんか「こういうの見てみたい」とかもさ、いっぱい教えてくれるからさ。あ、それもいいかもとかさ。あとコラボもわしたちできるようになったじゃろ？だから「この先輩とコラボしてみたい」とか「こういうゲームしたいな」とかさ、いっぱいあって、すごいワクワクがいっぱいあるのじゃ。
    english: Or they tell us lots of things like 'I want to see this kind of stream,'
      so we think 'Oh, that might be good too!' And we can do collabs now too, right?
      So we get ideas like 'I want to collab with this senior,' or 'I want to play
      this game.' There's so much, it's super exciting!
  - start: '04:36.000'
    end: '04:37.600'
    original: いや、そうなんだよね！
    english: Yeah, exactly!
  - start: '04:37.280'
    end: '04:41.360'
    original: だから、本当に心配いらないよね、全くね！ネタ切れとかに関してはさ！
    english: So really, there's no need to worry at all about running out of content!
  - start: '04:41.360'
    end: '04:42.880'
    original: 今んとこ皆無。
    english: Right now, zero worries.
  - start: '04:43.120'
    end: '04:46.000'
    original: 無限に湧いてくるし、なんなら「え、時間足りない！」ってなっちゃってる！
    english: Ideas keep coming endlessly, if anything, it's like 'Wait, there's not
      enough time!'
  - start: '04:46.000'
    end: '04:46.960'
    original: 足りない！
    english: Not enough!
  - start: '04:48.000'
    end: '04:49.040'
    original: 足りない！
    english: Not enough!
  - start: '04:49.040'
    end: '04:49.840'
    original: うん。
    english: Yeah.
  - start: '04:49.840'
    end: '04:50.880'
    original: 困った！
    english: It's a problem!
  - start: '04:50.560'
    end: '04:51.680'
    original: 困った！
    english: A problem!
  - start: '04:51.200'
    end: '05:00.000'
    original: え、そう、なんかコラボもしたいし、1人でも配信もしたいから、スケジュールをさ、組むじゃろ、1週間の。組むときに「おや？コラボがこんなにいっぱあって、1人で...」
    english: Yeah, like, I want to do collabs, and I also want to stream solo, so
      when I make my weekly schedule... when I build it, I go, 'Oh? There are so many
      collabs, how about solo...?'
