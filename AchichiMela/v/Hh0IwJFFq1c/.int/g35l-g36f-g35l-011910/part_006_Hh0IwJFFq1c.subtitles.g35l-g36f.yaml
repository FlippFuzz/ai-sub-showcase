    english: Never, so... Could it be... Kyoko, are you a salamander...?
  - start: '03:29.000'
    end: '03:33.500'
    original: ちょっと尻尾、もしかしたら昔、なんか子供のころに切ってしまっただけで...
    english: Maybe my tail was just cut off when I was a kid...
  - start: '03:33.500'
    end: '03:34.800'
    original: あー、なるほどね！
    english: Ah, I see!
  - start: '03:34.800'
    end: '03:38.500'
    original: そう、何かが起こって切ってしまっただけで、実は生えてたのかも知れない。
    english: Yeah, something happened and it was cut off, but maybe I actually had
      one growing.
  - start: '03:38.500'
    end: '03:41.000'
    original: え、ドラゴンボールの話です、ちなみにこれ。
    english: By the way, this is a Dragon Ball reference.
  - start: '03:41.000'
    end: '03:45.000'
    original: ドラゴンボール。「僕、昔、実は尻尾生えてて... 切っちゃったから無いんだけど...」
    english: Dragon Ball! "Actually, I used to have a tail back in the day, but I
      cut it off so I don't have it anymore..."
  - start: '03:45.000'
    end: '03:46.500'
    original: あ、そうなんだ。
    english: Ah, is that so?
  - start: '03:46.500'
    end: '03:49.000'
    original: 私もそうかもしれない、もしかしたら。
    english: Maybe I am too, perhaps.
  - start: '03:49.000'
    end: '03:51.500'
    original: え、そう！ってね、思ってるんだよね。
    english: Yeah, right! That's what I was thinking.
  - start: '03:51.500'
    end: '03:56.500'
    original: いや、私もね、そう、最近すごい感動したのが、あのホロカの公式番組にさ、ふたりで出たじゃん？
    english: No, for me too, recently I was super impressed... We appeared together
      on HoloCa's official stream, right?
  - start: '03:56.500'
    end: '03:57.800'
    original: 出た！
    english: We did!
  - start: '03:57.800'
    end: '04:05.500'
    original: で、やっぱあーゆー番組やるときって、相手がどうリアクションするかなっていうことも、しっかりと想定しながら自分の発言をしなきゃいけないじゃん？
    english: And when doing a show like that, you have to make your remarks while
      carefully predicting how your partner will react, right?
  - start: '04:05.500'
    end: '04:06.500'
    original: ほう...
    english: Hmm...
  - start: '04:06.500'
    end: '04:08.000'
    original: あ、考えてなかった、そこまで！
    english: Ah, I didn't think that far ahead!
  - start: '04:08.000'
    end: '04:09.000'
    original: え、わし、そこまで考えてない。
    english: Eh, I didn't think that far either!
  - start: '04:09.000'
    end: '04:17.000'
    original: ていうのをめちゃくちゃ考えてやろうと思ったんだけど、メラッチがあまりにもこう... 私の想定通りの回答しかくれないから...
    english: I intended to think about that very carefully, but Melatch gave answers
      so perfectly in line with my expectations...
  - start: '04:17.000'
    end: '04:21.000'
    original: もう途中で考えるのやめた！ 考えるなくてもいいや、ってなって。
    english: '...that halfway through, I stopped thinking! I was like, "I don''t even
      need to think about it!"'
  - start: '04:21.000'
    end: '04:24.000'
    original: なるほど。じゃあ、あちちメラの返答が想像つく？
    english: I see. So you can easily imagine Achichi Mela's responses?
  - start: '04:24.000'
    end: '04:33.000'
    original: うん。てか、なんかね、私が考えてることと一緒すぎちゃって... 同じすぎちゃって、あんなに楽だったことない、会話が。
    english: Yeah. Or rather, it was so identical to what I was thinking... so identical
      that conversations have never been this easy.
  - start: '04:33.000'
    end: '04:43.000'
    original: え、なんか、でも確かに、あの、わしはホロカとか、カードゲーム初めてなんじゃよ。ホロカが初めてで、で、キョーコはもうカードゲームの猛者じゃろ？
    english: Well, but certainly, I'm new to HoloCa and card games in general. HoloCa
      is my first, while Kyoko is already a card game veteran, right?
  - start: '04:43.000'
    end: '04:59.000'
    original: そう。だからカードゲーマー的にはこの言い回しわかるけど、わしは本当にミリ知らじゃから「これってなんじゃろうな」とか、その、初めての人がこの動画とか配信を見たときに分かんないだろうな、みたいなところは意識的に補足するようにしたから、そこかな？
    english: Right. So while card gamers would understand these terms, I'm a complete
      beginner, so I consciously tried to explain things like "What does this mean?"
      for first-time viewers who might not understand. Maybe it's that?
