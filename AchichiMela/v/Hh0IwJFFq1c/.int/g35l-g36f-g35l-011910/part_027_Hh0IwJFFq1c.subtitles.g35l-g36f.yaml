global_summary:
  overall_summary: This is an off-collab drinking stream hosted on Mela Netchi's channel,
    featuring Hololive 'Asobi Mawari-tai!' members Mela Netchi and Kyoko Momohi. Mela,
    trying alcohol on stream for the first time, is looked after by Kyoko, who acts
    as her sober guardian. Over drinks and homemade chikuzenni cooked by Mela's mother,
    the two share deep, humorous, and surprisingly profound conversations about their
    debut two months ago, their instant connection and shared 'soulmate' bond even
    prior to debut, their unique perspectives on human communication and social adaptation,
    and their immense affection for their unit members and fans.
