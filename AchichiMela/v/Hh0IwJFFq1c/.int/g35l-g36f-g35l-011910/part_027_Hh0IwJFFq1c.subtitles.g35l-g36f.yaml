    english: Exactly, it really does!
  - start: '02:42.200'
    end: '02:43.200'
    original: どうしてもな！
    english: Inevitably!
  - start: '02:43.200'
    end: '02:45.000'
    original: ね、聞き上手がいっぱいなのじゃ。
    english: Yeah, there are so many good listeners.
  - start: '02:44.800'
    end: '02:47.800'
    original: そうなんだよ！1万人以上いるからさ！
    english: Exactly! Because there are over 10,000 of them here!
  - start: '02:47.500'
    end: '02:49.800'
    original: そう！ありがとう1万人の聞き上手！
    english: Yes! Thank you to the 10,000 good listeners!
  - start: '02:49.500'
    end: '02:50.400'
    original: ありがとう！
    english: Thank you!
  - start: '02:50.400'
    end: '02:53.000'
    original: そしてキョーコもとても聞き上手なのじゃ。
    english: And Kyoko is also a fantastic listener.
  - start: '02:51.800'
    end: '02:53.200'
    original: あ、よかった！ありがとう！
    english: Ah, glad to hear that! Thank you!
  - start: '02:53.200'
    end: '03:00.000'
    original: いつもお話を…てか、キョーコはね、2人の時も面白いんじゃけど、アソビまわり隊4人でコラボをする時とかもすごいね、回しが上手い。
    english: You always listen to... I mean, Kyoko is funny when it's just the two
      of us, but when the four of us in Asobi Mawari-tai do a collab, you're amazing
      at facilitating the conversation.
  - start: '03:00.000'
    end: '03:00.800'
    original: 本当！？
    english: Really?!
  - start: '03:00.800'
    end: '03:03.000'
    original: 回し聞きがすごい上手いからありがたいのじゃ。
    english: You're so good at steering the chat and making rounds, it's really helpful.
  - start: '03:02.800'
    end: '03:07.500'
    original: いやなんかね、みんなのことが好きすぎて、もっと話を聞きたいぞって思う結果なんだよね、結局。
    english: Well, it's just because I love everyone so much that I want to hear more
      of what they have to say, in the end.
  - start: '03:07.000'
    end: '03:08.200'
    original: えー、愛情！
    english: Aww, that's love!
  - start: '03:08.000'
    end: '03:09.000'
    original: 愛なんです！
    english: It is love!
  - start: '03:09.000'
    end: '03:11.200'
    original: 愛情からいくのいいなー！
    english: I love that it comes from affection!
  - start: '03:10.800'
    end: '03:12.500'
    original: そう、全部愛です！
    english: Yes, it's all love!
  - start: '03:12.200'
    end: '03:18.800'
    original: でもわしもキョーコもだし…なんか根源愛だよな。
    english: But both I and Kyoko... at our core, it's all love, right?
  - start: '03:18.500'
    end: '03:21.800'
    original: そうなんだよ！なんかみんな愛なんだよ、本当！
    english: That's it! Everyone is filled with love, really!
  - start: '03:21.200'
    end: '03:23.800'
    original: てか配信とかしてる人ってそういう人が多いんじゃないか？
    english: I feel like a lot of people who stream are like that, aren't they?
  - start: '03:23.500'
    end: '03:27.800'
    original: じゃないとできないと思う、大変だから。うん！
    english: I don't think you could do it otherwise, because it's tough work. Yeah!
  - start: '03:26.500'
    end: '03:28.000'
    original: そういう気もするのじゃー。
    english: I feel that way too.
  - start: '03:28.000'
    end: '03:29.500'
    original: だから嬉しいなー。
    english: So I'm really happy.
  - start: '03:29.200'
    end: '03:30.000'
    original: ねー！
    english: Yeah!
  - start: '03:30.000'
    end: '03:32.200'
    original: 幸せなのじゃ、そんな人間に囲まれてね。
    english: I'm so blessed to be surrounded by such people.
  - start: '03:32.000'
    end: '03:36.000'
    original: ね！うちの本当、天職だしさ、もう最高の環境だよね、ここね！
    english: Right! This is truly our dream job, and this place is the absolute best
      environment!
  - start: '03:35.800'
    end: '03:42.500'
    original: いや、ありがとうございますのじゃ。おぬしらもね、そんな最高の環境を作り上げるお手伝いをしてくれてありがとなのじゃ！
    english: Truly, thank you so much. And thank you all for helping us build such
      a supreme environment!
  - start: '03:42.200'
    end: '03:44.500'
    original: マジでみんながいてこそだから！
    english: It really only exists because all of you are here!
  - start: '03:44.200'
    end: '03:45.500'
    original: ね、本当だよねー！
    english: Yeah, that's so true!
  - start: '03:44.800'
    end: '03:46.000'
    original: 本当にそう！
    english: Absolutely!
  - start: '03:46.000'
    end: '03:51.000'
    original: ねー、こんな人間の激重会話を見てくれるわけ無くてよかった…
    english: Right? I'm so glad we have people willing to watch our super heavy human
      chats...
  - start: '03:50.800'
    end: '03:53.200'
    original: あ、ちょっとごめん！1個だけ自己開示していい？
    english: Ah, wait, sorry! Can I share one more thing about myself?
  - start: '03:52.800'
    end: '03:54.000'
    original: あ、いいよ、どうぞどうぞ！
    english: Ah, sure, go ahead, go ahead!
  - start: '03:54.000'
    end: '03:59.000'
    original: だから、みんなが…本当みんなが最高だからね。なんか私さ、配信めっちゃしてて、もうすぐ100枠行きそうなのね、合計。
    english: So, everyone... because everyone is truly the best. You see, I've been
      streaming like crazy, and I'm almost at 100 streams total!
  - start: '03:59.000'
    end: '04:03.500'
    original: デビューして2ヶ月経ってないのに、あの、100配信行きそうなの！
    english: Even though it hasn't even been two months since debut, I'm already about
      to hit 100 streams!
  - start: '04:01.000'
    end: '04:03.000'
    original: あれ、1ヶ月って何日…？
    english: Wait, how many days are in a month...?
  - start: '04:03.500'
    end: '04:12.000'
    original: なんでそんなにやっちゃうかっていうと、違うの！あのね、もう見てくれるみんなのこと好きすぎて、帰ってきたくなっちゃうから！
    english: And as for why I stream so much, no, listen! It's because I love everyone
      who watches me so much that I just keep wanting to come back here!
  - start: '04:10.000'
    end: '04:12.500'
    original: ああー！なるほどね！
    english: Ah! I see!
  - start: '04:12.200'
    end: '04:14.200'
    original: 愛なの、これも！
    english: This is love too!
  - start: '04:13.200'
    end: '04:14.200'
    original: はいはいはい。
    english: Right, right, right.
  - start: '04:14.200'
    end: '04:15.800'
    original: 会いたくなっちゃうから！
    english: Because I miss you and want to see you!
  - start: '04:15.500'
    end: '04:17.800'
    original: 居場所なんだね！
    english: So it's your home base!
  - start: '04:16.800'
    end: '04:18.200'
    original: 居場所なの、マジで！
    english: It really is my home base!
  - start: '04:18.000'
    end: '04:19.200'
    original: なるほどなー。
    english: I get it now.
  - start: '04:19.000'
    end: '04:20.500'
    original: だからもうね、やらせてくれ、ずっと。
    english: So please, let me keep doing this forever.
  - start: '04:20.800'
    end: '04:31.500'
    original: いやー、居場所をお互いがね、ファンのおぬしらもだし、もちろんわしたちもだしね、それぞれが居場所とする居場所を作っていこうという気持ちで…
    english: Yeah... with the mindset of creating a home base where everyone—the fans,
      and of course us too—feels like they belong...
  - start: '04:31.500'
    end: '04:32.800'
    original: そう！
    english: Right!
  - start: '04:32.500'
    end: '04:47.800'
    original: あ、もちろんあの気軽に見たい方はね、「あーこいつやってるやん、見るか」くらいで…そうそう、もちろんいいけど、より「応援したいぜ」って方はね、いい場所になるといいなみたいな、そういう願いをね持ってね見てくれるとすっごい励みになるよね！
    english: Ah, of course, if you just want to watch casually like "Oh, they're streaming,
      let's watch", that's totally fine too, but if you want to support us even more,
      we hope this becomes a great space for you, and having you watch with those
      feelings gives us so much encouragement!
  - start: '04:48.000'
    end: '04:52.000'
    original: お互いがお互いの居場所でありたいよね！それが最高だと思うからさ！
    english: We want to be each other's safe space! Because I think that's the best!
  - start: '04:51.800'
    end: '04:56.500'
    original: わしもそう思うのじゃ！その通りなのじゃ！わしの夢なのじゃ！
    english: I think so too! Exactly! That's my dream!
  - start: '04:56.200'
    end: '04:58.200'
    original: ね！夢だよ、私も本当に！そうでありたい！
    english: Right! It's my dream too, truly! I want it to be like that!
  - start: '04:57.800'
    end: '04:59.800'
    original: ねー！なんかすごい素敵に…
    english: Yeah! Wow, this turned out so nice...
