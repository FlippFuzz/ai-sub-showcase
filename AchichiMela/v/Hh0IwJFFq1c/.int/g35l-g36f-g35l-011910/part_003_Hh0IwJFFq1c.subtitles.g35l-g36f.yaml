    end: '03:38.200'
    original: あ、そう！ 一番最初にお部屋にいて、私が全員を迎え入れるみたいな感じだったのよ！
    english: Ah, right! I was in the room first, so it felt like I was welcoming everyone
      in!
  - start: '03:38.200'
    end: '03:40.500'
    original: そうそうそう！
    english: Right, right, right!
  - start: '03:40.500'
    end: '03:49.000'
    original: で、わしは割とコミュニケーションというか、人間と初対面の人間と結構自信を持って話せるタイプ、緊張あんまりしないタイプじゃから...
    english: And for me, when it comes to communication, I'm the type who can talk
      to people I meet for the first time with quite a lot of confidence without getting
      nervous...
  - start: '03:49.000'
    end: '04:02.800'
    original: 「よし！ このユニット内で、あの、盛り上げというかリーダーポジションじゃないけどさ、わしがみんなに元気に話しかけて空気を作るぞ！」みたいな気持ちで部屋に入ったわけ！
    english: So I entered the room thinking, "Alright! Within this unit, even if I'm
      not the leader, I'm gonna liven things up, greet everyone energetically, and
      set the vibe!"
  - start: '04:02.800'
    end: '04:03.900'
    original: うん。
    english: Yeah.
  - start: '04:03.900'
    end: '04:06.000'
    original: そしたら食われた！
    english: And then I got totally devoured!
  - start: '04:07.000'
    end: '04:16.800'
    original: マジでね、私が座って待ってたのよ。誰かが入ってくるたびにスカッと立ち上がって、「いらっしゃいませー！」って言って！ 「百灯キョーコです！
      よろしくお願いします！」って。
    english: Seriously, I was sitting and waiting. Every time someone walked in, I'd
      spring right up and go, "Welcome!" "I'm Kyoko Momohi! Nice to meet you!"
  - start: '04:16.800'
    end: '04:18.000'
    original: そう！
    english: Exactly!
  - start: '04:18.000'
    end: '04:28.000'
    original: なんか、ま、わしもやっぱ最初じゃから気合入れようと思って、「熱千めらです、よろしくお願いします」みたいな感じで行こうと思ったら、もうスピードでも負けちゃって。
    english: So, since it was my first time too, I was determined to get pumped up
      and enter like "I'm Mela Netchi, nice to meet you!" But I even lost in terms
      of speed!
  - start: '04:28.800'
    end: '04:53.000'
    original: そう、「行くぞ行くぞ行くぞ」ドアを開ける。「さて」って、スタッフさんとかもいっぱいおらっしゃったから、「さて、行くぞ」って。わしたち、どんな見た目かも知らなかったの、見た目も名前も何も知らない状態で部屋に入れられたから、「どなただ？」と思って見ていたら、スカーッと立ち上がって...
    english: Yeah, I was like "Here we go, here we go, here we go," opening the door.
      "Alright," there were lots of staff members there too, so I thought "Alright,
      let's do this." We didn't even know what each other looked like or what our
      names were, we were put in the room knowing nothing! So I was looking over thinking
      "Who could it be?" and then you sprang right up...
  - start: '04:51.500'
    end: '04:53.500'
    original: サッて立ったね！
    english: Sprang right up!
  - start: '04:53.500'
    end: '04:55.200'
    original: で、もう音圧が来たよね！
    english: And the sound pressure hit you right away!
  - start: '04:55.200'
    end: '05:00.000'
    original: 「あ、負けた」って。
    english: I was like, "Ah, I lost."
