global_summary:
  overall_summary: 'In this livestream, Hololive VTuber Achichi Mela (熱千めら) from the
    unit ASOBI★MAWARI-TAI! plays the Chilla''s Art horror game ''Shinkansen 0 Kou''
    (新幹線0号 - Shinkansen 0: Train No. 0). The stream begins with an opening chat where
    Mela talks about her recent song cover release ("Undead"), receiving her own cards
    from the Hololive Official Card Game (hololive OCG) starting deck, and playing
    card games by herself. She then transitions into playing ''Shinkansen 0 Kou'',
    an anomaly-hunting horror game set on a supernatural train. Throughout the gameplay,
    Mela navigates the carriages, encounters eerie anomalies and recurring characters,
    and attempts to reach car 0 to stop the train. Due to time constraints before
    a senpai''s 3D live broadcast, she wraps up the stream after reaching the ending
    and preparing to redirect viewers.'
