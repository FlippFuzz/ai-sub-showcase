    song_title: null
    song_artist: null
  - start: '56:00'
    end: '70:00'
    title: 最終局面・運転室へ向かう緊張の終盤
    description: 終盤の車両を進み、赤信号・青信号のギミックや不気味な追跡演出を潜り抜け、ついに最前方の運転室・出口に到達してエンド1をクリア。
    song_title: null
    song_artist: null
  - start: '70:00'
