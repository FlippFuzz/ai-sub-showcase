    song_artist: null
  - start: 07:14
    end: '17:21'
    title: ゲーム開始＆チュートリアル：新幹線0号のルール把握
    description: チラズアートのホラーゲーム『新幹線0号』を初見プレイ開始。車両内で少年NPCと出会い、異変があれば引き返し、なければ進んで0号車を目指すゲームルールを教わる。
