    The game starts and I immediately realize something's off: the kid isn't there! "Huh? Looks like the kid isn't here?" I'm thrown. Is this an anomaly? Or was the *missing* kid the anomaly? "The first one was an anomaly?" I need to re-evaluate things. I didn't fully grasp the rules, but I'm learning. Maybe the kid was just a dream?

