    title: オープニング雑談：ホロカのデッキ対戦について
    description: 日曜日の雑談からスタート。ホロライブオフィシャルカードゲーム（ホロカ）の自身のスタートデッキ「あちちメラスタートデッキ」を2個もらって一人で対戦して遊んだエピソードを語る。
