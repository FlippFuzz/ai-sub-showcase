global_summary:
  overall_summary: In this 73-minute YouTube stream, Hololive 'Asobi-mawari-tai!'
    member Netsuchi Mela plays Chilla's Art psychological horror indie game 'Shinkansen
    0' (新幹線0号) for the first time. The stream opens with a casual Sunday chat where
    Mela discusses her Hololive Official Card Game (Holoka) starter deck and how she
    played against herself. She then dives into 'Shinkansen 0', tackling the anomaly-hunting
    loop mechanics aboard a supernatural train. Despite initial panic, graphic setting
    adjustments, and eerie jump scares involving glowing-eyed passengers and sudden
    environmental shifts, she successfully navigates through the normal and green
    car sections, reaching the driver's cab to achieve Ending 1. The stream concludes
    with closing thoughts, a schedule announcement, and a redirect to a senior member's
    3D live stream.
