    decks for the Hololive Official Card Game. She then dives into 'Shinkansen 0',
    explaining the anomaly-finding mechanics similar to 'The Exit 8'. Throughout the
    gameplay, she navigates through ordinary and green passenger cars, encountering
    various eerie anomalies, surreal passengers, and jump scares. The stream concludes
    with closing remarks, a schedule preview, and preparation to redirect viewers
    to an upcoming Hololive 3D live stream.
