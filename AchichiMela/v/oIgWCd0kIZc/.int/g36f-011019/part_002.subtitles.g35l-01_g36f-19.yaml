      attire.
  domain_glossary:
  - term: 新幹線0号
    meaning: An anomaly-finding psychological horror game developed by Chilla's Art,
      heavily inspired by 'The Exit 8'.
  - term: ホロカ
    meaning: Abbreviation for 'hololive OFFICIAL CARD GAME', a trading card game featuring
      Hololive talents.
  - term: アソビ☆まわり隊！
    meaning: A Hololive VTuber unit focused on playful content, consisting of Hyakuto
      Kyoko, Atsuchi Mela, Suzuna Tsuzuri, and Sorashina Sopia.
  - term: 異変探しゲーム
    meaning: A genre of puzzle horror games where players must observe looping environments
      and decide whether to proceed or turn back based on spotted anomalies.
