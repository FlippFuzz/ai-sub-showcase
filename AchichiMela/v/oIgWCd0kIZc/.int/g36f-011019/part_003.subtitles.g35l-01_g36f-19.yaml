global_summary:
  overall_summary: In this stream, Hololive talent Atsuchi Mela chats about her Sunday
    morning and opening her own 'Hololive Official Card Game' starting deck, before
    diving into a first-time playthrough of Chilla's Art anomaly-finding horror game
    'Shinkansen 0'. She navigates the eerie train carriages, encounters mysterious
    passengers and bizarre anomalies, and successfully completes the game before concluding
    with a schedule review and redirecting viewers to Natsuiro Matsuri's 3D live stream.
  chapters:
  - start: 00:00
    end: 07:19
    title: オープニング雑談・ホロカ開封トーク
    description: Mela chats about her Sunday morning, getting an early wake-up to
      read comments on her cover song 'Undead', and unboxing her own 'hololive OFFICIAL
      CARD GAME' starting deck ('Asobi-mawaritai! Atsuchi Mela').
    song_title: null
    song_artist: null
  - start: 07:19
    end: '33:40'
    title: ホラーゲーム『新幹線0号』初見プレイ 前半
    description: Mela starts playing the Chilla's Art horror game 'Shinkansen 0',
      learning the rules of the Exit-8-like anomaly-finding train simulator, meeting
      the mysterious recurring boy, and navigating the initial car loops.
    song_title: null
    song_artist: null
  - start: '33:40'
    end: '73:23'
    title: ホラーゲーム『新幹線0号』初見プレイ 後半・エンディング
    description: After a brief stream reboot to fix lag, Mela continues through the
      Green Car section of 'Shinkansen 0', encounters bizarre anomalies, reaches the
      ending, and wraps up with weekly schedule announcements before redirecting to
      Natsuiro Matsuri's 3D live.
    song_title: null
    song_artist: null
