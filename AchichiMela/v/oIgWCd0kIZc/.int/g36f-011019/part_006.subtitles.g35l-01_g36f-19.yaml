    description: Mela starts playing the Chilla's Art horror game 'Shinkansen 0',
      learning the rules of the Exit-8-like anomaly-finding train simulator, meeting
      the mysterious recurring boy, and navigating the initial car loops.
    song_title: null
    song_artist: null
