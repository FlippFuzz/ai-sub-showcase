global_summary:
  overall_summary: In this stream, Hololive talent Atsuchi Mela chats about her Sunday
    morning and opening her own 'Hololive Official Card Game' starting deck, before
    diving into a first-time playthrough of Chilla's Art anomaly-finding horror game
    'Shinkansen 0'. She navigates the eerie train carriages, encounters mysterious
    passengers and bizarre anomalies, and successfully completes the game before concluding
    with a schedule review and redirecting viewers to Natsuiro Matsuri's 3D live stream.
