- start: '03:32.153'
  end: '03:42.553'
  original: 同じでいられないんじゃないかしら、わし。
  english: maybe I just can't stay the same, ya see.
- start: '03:34.400'
  end: '03:41.200'
  original: 成長にたとえると……「順調に育っているネ！」
