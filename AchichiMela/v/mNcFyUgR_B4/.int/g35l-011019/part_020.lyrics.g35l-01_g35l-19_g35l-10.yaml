- start: '04:02.153'
  end: '04:08.553'
  original: 結構上手にできた！結構上手にできたんじゃない？
  english: Did a pretty good job! Didn't we do a pretty good job?
- start: '04:08.553'
  end: '04:13.553'
  original: フリスビー取るのは、遅い曲いける？
