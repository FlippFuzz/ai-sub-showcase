- start: '03:41.200'
  end: '03:42.200'
  original: いいんじゃない？
  english: Isn't that good?
- start: '03:43.000'
  end: '03:50.000'
  original: やっぱあの、ホロドリのテーマ曲みたいな曲ばっか聞いてるからかな？
