  original: 謎のリズム組織より、テクニカルなとこ、いいカンジ！そしてキメどころ、バッチリおさえてた！
  english: 'From the mysterious rhythm organization: Technical parts were good! And
    you nailed the key moments perfectly!'
- start: '03:03.253'
  end: '03:09.153'
  original: かなりいい感じ！やったのじゃ！結構頑張れたんじゃない？
