- start: '03:09.653'
  end: '03:19.153'
  original: なんか、ゆっくりめだから難しいかなって思ったんだけど、遅い曲よりも連続して同じリズムが来るのが苦手、なるほど？
  english: I thought it might be hard because it's kinda slow, but I'm bad at getting
    the same rhythm continuously rather than slow songs. I see?
- start: '03:20.153'
  end: '03:26.153'
  original: あれなのかな？同じでいられないのかな？
  english: I wonder why? Is it hard to stay the same?
- start: '03:26.153'
  end: '03:32.153'
  original: いつも変拍子とかそういう曲ばっか聞いてるから、
