  thoughts: |+
    **My Thoughts on Rhythm Games, Horror, and My Schedule**

    Okay, so I'm thinking about making subtitles for this clip, and my mind keeps going back to that Rhythm Heaven discussion. That first Rhythm Heaven game... it was really tricky at first, you know? You have to pay *such* close attention or you can't hear the cues and then you can't *understand* the rhythms, making it super hard, but... even without that deep consideration, somehow, you can just *do* it. The design is genius – it's all about making the music fun, enjoyable! The goal is to get that joy from the music, which, what an amazing game!

    I was saying about not relying on visuals, at first, I tried visual timing, and I failed *miserably*. It was so fun, but I think it would be tough unless I got used to the rhythm. I want to play it again! I have so many games I want to play right now, so it might take a while, but still... I want to play it again, even if I end up back at square one.

    Oh, and then there are the horror games... If you ask, sure, I want to play them! I'm not playing them *against* my will, haha. But as for 'PIZZA TOWER' or 'The PASTA' which, wasn't originally supposed to be horror, was I not prepared for that. I'm not exceptionally cowardly when it comes to horror, though! If it's something easy, it's totally fine. And with Pasta, once I got used to it, it was fun. And with 'Exit 8' had that speedrunner-like fun toward the end... Once you get used to it, it's fun!

    Tsuzuri gave me 'The Night Shift', so I'm considering it. First playthroughs are scary – it's the unknown that's scary.

    Speaking of plans... I *should* show you my schedule for next week! Tomorrow, I'm doing a Marshmallow chat stream! I'm collecting 100 Marshmallows, planning to read them all! Thank you to everyone who sent one!

    Then Tuesday is off, because 'Noja English' is early! When I stream, I want to sleep 8 hours. 'Noja English' is at 7 am, and I'd like to wake up around 6 am, so I have to be asleep by 10 pm. So Tuesday is my rest day.

    Then after 'Noja English', it's 'R.E.P.O.' in the evening! Playing REPO with the Asobi Mamire group! On the 15th, I'm playing a bomb defusal game with Kyoko. I've never played it, but it sounds like one person instructs, and the other does the actions. Sounds like a co-op game. And on the 16th, horror game 'Platform 8'! The sequel to 'Exit 8'. And on the 17th, 'Kuukiyomi 2'!


