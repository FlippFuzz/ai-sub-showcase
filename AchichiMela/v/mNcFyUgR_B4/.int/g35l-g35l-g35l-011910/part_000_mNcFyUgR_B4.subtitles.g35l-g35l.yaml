global_summary:
  overall_summary: In this stream from Hololive's Asobi Mawaritai! member Netsuchi
    Mela, she plays the popular Nintendo rhythm game 'Rhythm Heaven' (リズム天国) for the
    very first time. Throughout the 2-hour-plus broadcast, Mela shares personal anecdotes
    about playing horror games, talking on the phone with unit member Suzuri Tsuzuri,
    and learning how rhythm games are structured around audio cues rather than visual
    cue-mashing ('目押し'). She tackles various quirky minigames such as Wakuguri, Parasol,
    Flying Disc, Dragon Feeding, Car Action, Hurdles, and Bubble Wrap Lab, experiencing
    both initial struggles with tempo and moments of triumph. The stream concludes
    with an extensive chat segment reflecting on human perception, viewer commentary,
    and a preview of her upcoming weekly schedule.
