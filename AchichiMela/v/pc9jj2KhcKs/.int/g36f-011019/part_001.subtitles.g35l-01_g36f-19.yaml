  - |-
    **Achichi Mela's Duolingo English Study Session**

    Okay, so I'm catching up with Mela's English study stream. It looks like we're just past the start of the session. It's interesting to hear her speaking about her "grandma" in English – trying to explain the concept, clarifying that it means her caretakers' parents. She's also very excited about her pajama, a Gelato Pique fluffy set that her grandma gave her. She's got a playful energy, calling out to her viewers and even playfully doubting the greeting of "good morning" due to the late hour.

    She's reminiscing about previous sessions and mentioning how she's aiming for a more focused study session today, less chatter, more learning. The discussion shifts to the cost and quality of the Gelato Pique pajama, admitting it's a bit of a luxury, but incredibly soft, cute, and warm. She then mentions a shared experience she had with a fellow streamer.

    She's then making sure her audience has "liked" the video, playfully encouraging viewers to show their support with a "noja~!" (a stylistic verbal tick, a bit like a verbal "nya" sound) and requesting they watch the start of the study session.

    She's about to dive into Duolingo. Seems like the app is going to start a listening exercise. The app introduces the session with a radio-like vibe, using phrases like "welcome to the listening corner." I'm also getting the idea that we will be learning vocabulary, with a segment being introduced as "listening."
    The app gives vocabulary words, Mela repeats them in Japanese (Porch, Car, Clean, Water).
    And now the audio is different, not the usual sister. She seems to know the app well enough to follow along with the lesson.
