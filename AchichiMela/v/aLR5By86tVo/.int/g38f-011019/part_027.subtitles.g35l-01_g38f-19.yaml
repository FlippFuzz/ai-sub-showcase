    **ARK Gameplay Transcription and Translation: Hololive Collab**

    Okay, here's the breakdown of that ARK gameplay segment.  I've got the transcription, translation, and timestamps down to the millisecond. Let's get this right for the subs.

    From the start, it's pretty clear Sopia and Mera are getting things going with navigation. I can see from 00:00 to 00:07, they're working out the map view while flying. Mera, at 00:02, points out that Tsuzuri is in control of the vehicle, so I need to pay attention to where Tsuzuri needs to be looking and what Tsuzuri needs to do. Sopia at 00:09 confirms that they can indeed see the map since they are in a tribe. Sopia and Kyoko (00:14) confirm that things are okay. Sopia takes charge at 00:18, sounding confident, like she's got a plan. Mera and Kyoko (00:20-22) are right there with her. At 00:26, she's really taking control and making sure the group is working well.

    At 00:27, Kyoko is waving for Tsuzuri, and Sopia picks up on it quickly. Mera, at 00:36, points out that they're surrounded by dinos, haha! Tsuzuri at 00:38 asks if they are both still flying, which Kyoko confirms at 00:40. Sopia is coordinating. She asks where they should go at 00:43, with Kyoko feeling confident around 00:45. From 00:52 to 01:05, Mera's the one who's struggling with navigation. That's understandable; she can't read maps. Mera notes that it is easier for her when she's the one driving.

    Sopia, at 01:10, seems pretty impressed that Mera got them there in a straight line, which Tsuzuri confirms is by using the coordinates. Sopia then has to pause, 01:18, to regain stamina. From 01:25, at 01:31, Kyoko notices Tsuzuri and Sopia are having some trouble seeing each other. Tsuzuri is down below, flapping away. Sopia's following, and then Tsuzuri explains at 01:43 that as long as they aren't driving a car, she's confident that she can do it. From 01:53, Sopia's noticing that things are getting heavy in that area of the map. Kyoko figures that it's a loading issue at 01:59. At 02:03, Kyoko spots Tsuzuri! At 02:04, Mera sees Tsuzuri. Sopia has some trouble figuring out which direction at 02:05-02:11, but Kyoko directs the team towards the sea. 02:20, the seniors have arrived!

    From 02:26-02:34, Sopia apologizes for the delay. Mera says thank you at 02:30. At 02:33, they are putting their dino back. At 02:45, Kyoko's getting worried, because YouTube might have crashed. Sopia is confident at 02:51, which is good. From 02:54-03:04, there's some talk about doing a one-hit gag. After, Kyoko says that they will go back where they were to start. Tsuzuri is cold. At 03:16, the girls are willing to share their clothes. At 03:26, Kyoko says thank you for coming, with Tsuzuri pointing out that she's there to take photos at 03:31. Then, at 03:34, Kyoko explains that Tsuzuri's YouTube is still having problems. They reassure her that everything will be okay. From 03:47, they realize that Sopia may have gotten lost as well. At 03:59, Tsuzuri is not there anymore. From 04:06, Kyoko asks if Sopia is okay, with Tsuzuri returning. At 04:14, Tsuzuri has to change their voice chat. At 04:20, Kyoko eats some food. At 04:25, Mera needs some water. At 04:27, Noel has to restart ARK because
