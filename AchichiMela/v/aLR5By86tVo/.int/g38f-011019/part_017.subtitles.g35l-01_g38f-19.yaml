  thoughts:
  - |-
    **ARK Adventure with Sopia and Noel!**

    Okay, so I need to get some subtitles and musical performance detection for this video segment. This is from the stream titled "Mela Ch. 熱千めら - アソビ★まわり隊!" but I'm playing ARK on the Hololive server! Let's see: My name in the game is "achichimela", so that's *me*, Netsuchi Mera. The avatar is Sorashina Sopia, but the title has Hyakuto Kyoko and Suzuna Tsuzuri, so this is with Sopia and Shirogane Noel.

    I'm playing ARK with Sopia and Noel. The first few minutes are spent trying to navigate. I'm telling Sopia about a path (the railway tracks). At one point, I get super excited because I finally see Sopia. I call out to her, she is right over there! Then Noel says "Kore wa sutamina" but she then said "Watashi wa Sutamina Toka mo Chotto Ageteiru kedo..." but that is ok. So, we're trying to figure out the game's mechanics, and also learning that seawater is drinkable! We discuss salt levels and how my salamander body is not really built for too much salt in the water. We are super confused about some technical game mechanic stuff.

    We are just looking around and exploring! We find some graves and I'm like, "This is kinda sad". Then a red Ornithoid comes along and we get scared! Then we are super scared. Noel is like "It's a thieving bird!". I also want to make an axe, and we are working hard.

    Then we go to the woods, I try to punch a tree and Noel, in her usual, loud and energetic way is super helpful. I'm all about that "science punch", you know? Noel is saying "Show 'em Sopia and Mera's guts!" and I'm super hyped. Then Noel gives the advice "just double-click!", and I'm crafting a pickaxe. Now I'm hitting some rocks! I have no stamina, ugh! But Noel tells me to collect some stone, so I'm doing that too. Then I am gonna be level 9, *noija!* I can't wait!
