    Okay, here's the rundown of my thoughts on this segment: We're on a mission to generate synchronized subtitles and music detection for this part of the stream. Looks like Noel-senpai is giving out these super cute otter outfits to Sopia, Tsuzuri, Kyoko, and Mera. I can see the excitement; the girls are loving them! It's like, they're so cute, and the dye job on my outfit is a win! Then, we got this Pegomastax that Noel has to deal with.

    So Sopia's poop gag. I didn't see that coming! Wow, that was really unexpected. Noel seemed surprised too, but of course found it awesome. Mera, on the other hand, is a bit of a stickler for the human's perfect girl and would rather not do that! I get that, but in the end Noel-senpai seemed to love it. But overall, it's just pure Hololive chaos and cuteness, with a side of poop jokes and dino-fighting. And no music, not in this clip. Done!
