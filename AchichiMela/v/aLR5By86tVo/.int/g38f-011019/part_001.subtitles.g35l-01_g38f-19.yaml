    end: '03:02.900'
    original: なんか、操作方法だけ調べてきた。グダると良くないかなと思って。
    english: I looked up the controls beforehand. I didn't want to drag things out.
  - start: '03:02.900'
    end: '03:06.000'
    original: お、えらい！もう玄人、だいぶ玄人っすこれ。
    english: Oh, good girl! Already a pro, you're pretty much a veteran at this point.
  - start: '03:06.000'
    end: '03:08.600'
    original: あー！いたいた！めらちゃーん！再会！
    english: Ah! There you are! Mera-chaaan! Reunited!
  - start: '03:08.600'
    end: '03:13.000'
    original: ちょ、なんかさ、いるからさ...いや、うわ、うわ、うわ！ちょっと待って！なんで、なんで、なんで、なんで、なんで？！
    english: Wait, there's something over there... Wait, whoa, whoa, whoa! Hold on!
      Why, why, why, why, why?!
  - start: '03:13.000'
    end: '03:15.000'
    original: なになに？追われた？
    english: What, what? Being chased?
  - start: '03:15.500'
    end: '03:20.900'
    original: ど、どうすればいいのじゃ？なんか、え、あの恐竜倒せる？わしじゃ無理？
    english: Wh-What should we do? Can we take that dinosaur down? Is it impossible
      for me?
  - start: '03:20.900'
    end: '03:22.900'
    original: やめたほうがいい。あの、やめたほうがいい。オッケー。
    english: You shouldn't. Um, you'd better not. Okay.
  - start: '03:22.900'
    end: '03:25.400'
    original: 武器ないから。丸腰だから。
    english: You don't have weapons. You're completely bare-handed.
  - start: '03:25.400'
    end: '03:27.700'
    original: ちょ、弱そうなやつとか倒そう。
    english: Let's take down something that looks weak.
  - start: '03:27.700'
    end: '03:32.400'
    original: え、危ない危ない！ちょ、安全地帯ってないんですか？ここのARKに。アンチ、アンチとかさ、アンチ。ないの？
    english: Whoa, watch out! Wait, aren't there safe zones in this ARK? Like a sanctuary,
      safe haven? None?
  - start: '03:32.400'
    end: '03:35.800'
    original: あんち？あの、どこにでもいるよ、恐竜は。
    english: Safe havens? Dinosaurs are pretty much everywhere.
  - start: '03:35.800'
    end: '03:38.800'
    original: そんなぁ！ちょ、洞窟とか、洞窟とか...
    english: No way! What about caves, like caves...
  - start: '03:38.800'
    end: '03:41.200'
    original: あ、一番危ないよ、洞窟なんか！
    english: Ah, caves are the most dangerous!
  - start: '03:40.500'
    end: '03:42.000'
    original: そうなんだ？！あ、だめだよ。
    english: Really?! Ah, stay away from those.
  - start: '03:42.000'
    end: '03:45.300'
    original: 先輩が作った家とかに行けばいいんじゃない？
    english: Shouldn't we just head to a house built by our seniors?
  - start: '03:45.300'
    end: '03:48.000'
    original: あ、そうそう！あればね。後でも...
    english: Ah, exactly! If there is one. We can do that later...
  - start: '03:48.000'
    end: '03:53.200'
    original: ねえ、弱そうなのいる！弱そうなのいる！わしでも倒せそうなのいる！こいつ弱くない？
    english: Hey, there's a weak-looking one! A weak-looking one! One even I can beat!
      Isn't this guy weak?
  - start: '03:53.200'
    end: '03:55.700'
    original: 不気味な体勢...何それ？
    english: What a creepy posture... What is that?
  - start: '03:55.700'
    end: '03:57.700'
    original: え、オスドードー弱そうじゃない？
    english: Doesn't a male Dodo look pretty weak?
  - start: '03:57.700'
    end: '04:02.800'
    original: えい！えい！えい！えい！えい！えい！あ、なんか...倒せた！
    english: Take that! Take that! Take that! Take that! Take that! Ah, wait... I
      beat it!
  - start: '04:02.800'
    end: '04:04.900'
    original: かわいそう...
    english: Poor thing...
  - start: '04:04.900'
    end: '04:06.500'
    original: 倒せたが...
    english: I beat it, but...
  - start: '04:06.500'
    end: '04:11.800'
    original: それはね、ソピアね、大丈夫。あの、自分のなんか...なんだろう？なんて言うんだろう？
    english: That's, Sopia, it's fine. Um, your own... What is it? What do you call
      it?
  - start: '04:11.800'
    end: '04:15.500'
    original: え、これなんかさ、手懐けたりできないの？自分の、自分の...
    english: Hey, can't we tame this somehow? Make it your own...
  - start: '04:15.500'
    end: '04:17.400'
    original: あの、殺したら無理ね。
    english: Well, you can't if you killed it.
  - start: '04:17.400'
    end: '04:19.400'
    original: え、でも気絶だよ、気絶！
    english: Wait, but it's just knocked out, knocked out!
  - start: '04:19.400'
    end: '04:21.400'
    original: あ、気絶なんだ！あ、じゃあ行ける！
    english: Oh, it's knocked out! Then you can do it!
  - start: '04:21.000'
    end: '04:23.000'
    original: 食料...何ボタン押せばいい？「E」？
    english: Food... What button do I press? 'E'?
  - start: '04:23.000'
    end: '04:27.500'
    original: インベントリ、インベントリボタン押して...「I」かな？「I」かな？うん、「I」。
    english: Open the inventory, press the inventory key... Is it 'I'? Maybe 'I'?
      Yeah, 'I'.
  - start: '04:28.000'
    end: '04:35.000'
    original: そいつのインベントリを開いてあげるの。その鳥のインベントリ開いてあげて...ほう。
    english: You open its inventory. Open that bird's inventory... Okay.
  - start: '04:35.500'
    end: '04:38.200'
    original: で、そいつが好きな食べ物を入れてあげる。
    english: And then put the food it likes inside.
  - start: '04:38.200'
    end: '04:40.500'
    original: 「E」インベントリ...あ、「E」だね。「E」でインベントリ、うん。
    english: '''E'' is inventory... Ah, it''s ''E''. ''E'' opens inventory, yeah.'
  - start: '04:40.500'
    end: '04:43.000'
    original: これか！そこにこういうのあげればいいんじゃない？
    english: Here it is! Should I just put something like this in there?
  - start: '04:44.000'
    end: '04:48.500'
    original: ど、どうかな？好き？お主好き？お主好き？
    english: H-How about this? Do you like it? Do you like this? Do you like it?
  - start: '04:49.000'
    end: '04:52.500'
    original: あ！なんか、仲間にな...仲間になった！
    english: Ah! It beca... It became our ally!
  - start: '04:52.500'
    end: '04:56.500'
    original: すごーい！あ、めらちのドードーになった！すごい、これがテイム？
    english: Awesome! Ah, it's Merachi's Dodo now! Incredible, is this taming?
  - start: '04:56.500'
    end: '04:58.200'
    original: テイムになった！えー！
    english: We tamed it! Whoa!
  - start: '04:58.200'
    end: '05:00.000'
    original: え、すごい！このドードーちゃん...
    english: Whoa, amazing! This little Dodo...
