global_summary:
  overall_summary: 'In this livestream video from Mela Ch., Achichi Mela embarks on
    her first-ever ARK: Survival Evolved adventure on the Hololive server (#ホロ鯖ARK)
    alongside fellow ASOBI★MAWARI-TAI! members Oozora Sophia and Suzunami Tsuzuri,
    with senior members like Shirakami Fubuki and Shirogane Noel providing remote
    guidance and support due to patch download delays. The members learn survival
    basics, craft tools, tame dinosaurs including dodos and pteranodons, battle freezing
    temperatures and hostile creatures, and ultimately achieve their goal of group
    flight and commemorative photography at the senior base.'
