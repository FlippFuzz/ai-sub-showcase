  domain_glossary:
  - term: '#ホロ鯖ARK'
    meaning: The dedicated multiplayer ARK server event hosted by Hololive production
      talents.
  - term: アソビ★まわり隊！
    meaning: Hololive VTuber unit consisting of Hyakuto Kyoko, Suzunami Tsuzuri, Oozora
      Sophia, and Achichi Mela.
  - term: テイム
    meaning: The gameplay mechanic of knocking out and feeding wild dinosaurs to befriend
      and tame them.
  - term: プテラノドン
    meaning: A flying reptile dinosaur sought after by the group for aerial mobility.
  - term: ボーラ
    meaning: A throwable weapon used to immobilize small and medium dinosaurs or flying
