  - start: '04:24.900'
    end: '04:26.300'
    original: ベッドを押して
    english: Press the bed.
  - start: '04:25.800'
    end: '04:27.000'
    original: はい、押します
    english: Yes, I'll press it.
  - start: '04:27.050'
    end: '04:31.500'
    original: で…あーっ！殴っちゃった！どうしよう！先輩のベッド殴っちゃった！はっ！？
    english: And... Aah! I punched it! What do I do! I punched senpai's bed! Huh?!
  - start: '04:31.200'
    end: '04:32.700'
    original: あ、大丈夫、大丈夫、大丈夫
    english: Ah, it's fine, fine, fine.
  - start: '04:33.500'
    end: '04:38.200'
    original: え、待って、めらのピンのところ来たけどめらがいなくて
    english: Wait, I came to Mela's pin, but Mela isn't here.
  - start: '04:38.250'
    end: '04:40.400'
    original: ファストトラベル、これか。中にいるんだよね
    english: Fast travel, this one? You're inside, right?
  - start: '04:41.100'
    end: '04:43.500'
    original: はい！ファストトラベルどこ行けばいいんですか？
    english: Yes! Where should I fast travel to?
  - start: '04:43.550'
    end: '04:46.900'
    original: あ、あー、ちょっとズレてる。これで、さっきの拠点…ムキムキ…
    english: Ah, aah, it's slightly off. With this, the previous base... Mukimuki...
  - start: '04:45.600'
    end: '04:48.000'
    original: さっきの拠点まで行くと、たぶん…
    english: If you go to the previous base, probably...
  - start: '04:48.050'
    end: '04:48.800'
    original: ん？
    english: Hm?
  - start: '04:50.100'
    end: '04:53.500'
    original: さっきの拠点まで行くと、たぶんつーちゃんたちがいる…わため先輩がいる！
    english: If you go to the previous base, Tsu-chan and the others are probably...
      Watame-senpai is here!
  - start: '04:53.550'
    end: '04:54.300'
    original: これ…
    english: This...
  - start: '04:55.300'
    end: '04:59.950'
    original: えっ！みこ先輩のとこ辿り着いたけどめらの姿見えんぞ？
    english: Huh! I arrived at Miko-senpai's place, but I don't see Mela?
  - start: '05:00.000'
    end: '05:02.100'
