  - start: '03:53.850'
    end: '03:57.600'
    original: 分かんない。一番…にょ…
    english: I don't know. The top... nyo...
  - start: '03:58.200'
    end: '04:02.100'
    original: あ、でも、たぶんみこ先輩の家とまた近いとこだよね。あ、ありがとう、キョーコちゃん
    english: Ah, but it's probably close to Miko-senpai's house again. Ah, thanks,
      Kyoko-chan.
  - start: '04:02.150'
    end: '04:05.300'
    original: 前回死亡のとこで湧いていい？前回死亡のとこで湧いていい？
    english: Can I spawn at previous death? Can I spawn at previous death?
  - start: '04:05.350'
    end: '04:06.600'
