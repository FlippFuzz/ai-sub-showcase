    end: '02:25.950'
    original: 今、みこ先輩の拠点に来ちゃった、なんか
    english: Right now, I somehow ended up at Miko-senpai's base.
  - start: '02:26.000'
    end: '02:29.500'
    original: みこ先輩の拠点どこだろ？あ、そしたらまたあのベッド触って
    english: Where's Miko-senpai's base? Ah, then touch that bed again...
  - start: '02:29.600'
    end: '02:30.500'
    original: うん
    english: Yeah.
  - start: '02:30.600'
    end: '02:33.000'
    original: で、別の所に来たらいいよ
    english: '...and come to a different place.'
  - start: '02:33.050'
    end: '02:34.150'
    original: なにそれ？
    english: What's that?
  - start: '02:34.300'
    end: '02:36.250'
    original: あれ、行けるか。助けて、助けて！
    english: Wait, can I make it? Help, help!
  - start: '02:36.800'
    end: '02:39.400'
    original: そぴあ、一旦頼む。めらを迎えに行ってくるわ
    english: Sopia, handle things for a sec. I'll go pick up Mela.
  - start: '02:39.450'
    end: '02:41.900'
    original: ああ、あ、起き上がれない！助けて！
    english: Aah, ah, I can't get up! Help!
  - start: '02:42.400'
    end: '02:43.800'
    original: え、起き上がれない？
    english: Huh, you can't get up?
  - start: '02:43.850'
    end: '02:47.100'
    original: なんか水に溺れた。助けて、助けて、助けて！
    english: I'm drowning in the water or something. Help, help, help!
  - start: '02:47.150'
    end: '02:49.000'
    original: マップとアップがどうやって…
    english: How do I zoom the map...
  - start: '02:48.800'
    end: '02:51.800'
    original: やばい、スタミナがなくなる。わし死ぬ！わし死ぬ！
    english: Oh no, I'm running out of stamina. I'm gonna die! I'm gonna die!
  - start: '02:52.000'
    end: '02:54.350'
    original: M、M長押し。M長押し、オッケー
    english: Hold M. Hold M, okay.
  - start: '02:54.400'
    end: '02:57.000'
    original: で、ホイール。じゃ、これわしじゃない。にょほー
    english: And the scroll wheel. Then this isn't me! Nyohooo!
  - start: '02:57.050'
    end: '02:58.700'
    original: あ、ごめん、つーちゃんね。やばい、死ぬ死ぬ死ぬ
    english: Ah, sorry, that's Tsu-chan. Oh no, I'm gonna die, die, die!
  - start: '02:58.800'
    end: '03:02.000'
    original: めら、生きろ！死ぬ死ぬ死ぬ、にょにょ
    english: Mela, live! I'm gonna die, die, die, nyo-nyo!
  - start: '03:02.050'
    end: '03:03.600'
    original: にょ！にょ！
    english: Nyo! Nyo!
  - start: '03:04.200'
    end: '03:05.300'
    original: にょーん
    english: Nyoon.
  - start: '03:05.400'
    end: '03:06.800'
    original: あ、肉ありがとう
    english: Ah, thanks for the meat.
  - start: '03:06.600'
    end: '03:08.600'
    original: 行けるか？人間の体は脆い
    english: Can I make it? The human body is fragile.
  - start: '03:08.800'
    end: '03:12.000'
    original: 私、3人用のプテラも肉がなくて
    english: My three-seater Pteranodon doesn't have any meat either.
  - start: '03:12.050'
    end: '03:14.700'
    original: あ、ないんか。ちょっと待ってね、そしたら今あげてる…
    english: Ah, none? Hold on, then from the one I'm feeding now...
  - start: '03:14.800'
    end: '03:16.700'
    original: 行けるか？ここ陸か？さすがに
    english: Can I make it? Is this land? Surely.
  - start: '03:16.750'
    end: '03:19.200'
    original: テイム中のやつから、半分もらうから
    english: I'll take half from the one being tamed.
  - start: '03:18.900'
    end: '03:20.400'
    original: ふう、耐えた
    english: Phew, I survived.
  - start: '03:20.900'
    end: '03:22.400'
    original: ふう、耐えた
    english: Phew, I survived.
  - start: '03:22.900'
    end: '03:24.800'
    original: ほんで、マップ見て…
    english: And then, check the map...
  - start: '03:24.850'
    end: '03:28.400'
    original: おお、お前！お前！お前攻撃してくるんかい！はっ！？
    english: Whoa, you! You! You're attacking me?! Huh?!
  - start: '03:28.800'
    end: '03:31.400'
    original: あー！嘘やろお前！野郎だろ！アロサウルスじゃん
    english: Aah! No way! You bastard! It's an Allosaurus!
  - start: '03:31.500'
    end: '03:34.200'
    original: 肉食、肉食！
    english: Carnivore, carnivore!
  - start: '03:35.200'
    end: '03:37.500'
    original: 頼んだキョーコ。ちょっと待ってね
    english: I'm counting on you, Kyoko. Hold on a sec.
  - start: '03:37.600'
    end: '03:41.500'
    original: インベントリ…わしはどこでリスポーンすればいいか
    english: Inventory... Where should I respawn?
  - start: '03:41.800'
    end: '03:45.600'
