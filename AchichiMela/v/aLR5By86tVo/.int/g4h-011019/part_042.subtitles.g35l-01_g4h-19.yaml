  - start: '04:06.650'
    end: '04:07.800'
    original: のじゃ！
    english: Noja!
  - start: '04:07.500'
    end: '04:08.500'
    original: うん
    english: Yeah.
  - start: '04:09.800'
    end: '04:11.600'
    original: また同じとこだ！
    english: Same place again!
  - start: '04:12.600'
    end: '04:14.000'
    original: 同じとこ湧いちゃった？
    english: Did you spawn in the same place?
  - start: '04:13.800'
    end: '04:19.600'
