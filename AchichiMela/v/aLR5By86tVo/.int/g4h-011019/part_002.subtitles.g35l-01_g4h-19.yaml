  thoughts:
  - |-
    **Initial Tame and Adventures**

    Alright, let's get down to business. First things first: audio synced subtitles, and making sure we're getting it right. No musical performances, so we can skip that.

    So, let's start segmenting and transcribing. It begins with a thought about naming the new creature. "First Tame" it is! It just pooped - well, now that I'm the owner, I have to deal with that, right? Wait, how do I pick it up? E? Nope, that's just fertilizing the ground. Anyway, its colors *are* cute. Perhaps I should have named it after looking at its face! Reminds me of the Dodo bird, extinct now, but what *was* a Dodo?

    Oh, something got picked up! Not sure I want it. But it's our first... Well, *mine*. Sopia seems to have a different opinion. How do I put this thing down? Oh, I see, F2 to drop it! Okay, how to give it a command, it's mine now! Wait! Wait! Wait! It's mine. Okay. Ahhh, no, let's tame it, don't use violence! The controls are still a little tricky. Hmm, do I name it again or do I just keep it?

    So it will be my pet? Sopia says I should not. Hey, I want to use that command wheel thingy. I pressed "T" so it will follow me. So adorable, my first love! Wait, it is following! Starting to like it; like a little family of ducks.

    Hmm, maybe I should try my hand at crafting. Let's punch some trees! Sounds rather loud. I wonder if Sopia wants a Dodo too? Okay! What's this? I was expecting to get a message from Noel-Senpai? What! Iroha-senpai too! "If you need help, feel free to ask." I want to ask! But how do I send a chat message?
