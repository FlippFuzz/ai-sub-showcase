    A dramatic cry from Sopia (00:46.300 - 00:51.600) and then Fubuki (00:53.500) speaks of no deaths (生死) or is it 静止? (static). Mela tries to reassure herself, and then is confused. Wait: is it Kyoko saying `せいし`? No: Fubuki says it at 00:53.5 (`生死` for life/death)!. Sopia has an outburst, then Mela is grateful at 01:06.100. Then at 01:07.7 she's confused.

