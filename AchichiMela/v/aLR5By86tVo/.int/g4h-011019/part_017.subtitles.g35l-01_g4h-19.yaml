  thoughts:
  - |-
    **ARK: Survival Evolved - Early Game Musings**

    Okay, so here's the deal: I'm diving into this ARK world, and the first thing I'm doing is carefully transcribing what's going on. We're keeping it pure gameplay talk, no singing allowed (good, good). The important thing is capturing the timing and context precisely, and the goal is to fully translate the natural context-aware English translation.

    First, I need to get oriented. We're following some tracks, a bit past the ocean. The goal is clear, the objective in mind. Let's make our way there. Finding someone nearby, Tsuzurin, and now we're starting to understand the basics. Stamina: it's important. When that lightning bolt turns red, it's time to slow down, or we might have a bad time. Then, there's water. Running low, huh? Okay, I've got it - gotta get my character wet! Splash, and suddenly the water's back up. Apparently, swimming in the ocean is a viable drinking solution. Now I am pondering about how that works. But I'm starting to worry, saltwater: what is the long term effect?

    Speaking of which, someone told me that the people in this world have a 3% physiological saline level. Well, I decide to get better equipped to deal with the world! Should I level it up in the short-term? I put some points into weight. Good instincts on Mela-chi-san. That should help me with carrying stuff! Got it. I'm still only level 1, so let's hit 'I' and see what we can do. I've got 9 points, and weight seems like the way to go right now.

    I want to make a pickaxe, but I can't yet. There are stones, so now it's a wood hunt! Let's head over to those trees. Heading that way, it should work. Now, time for logging! It worked, so let's pick everything up.

    Hey, found some graves! That's sad, aren't the players dying? And now we know: we died. I'll catch that killer, for sure! But look - a red Ptera, looks like an Ichthyornis (the thief bird). We better not get close to it! Thief birds are not fun. Thought it was a Dodo, but it's an Ichthyornis, now we are wary of this bird. Now let's try to get taming, and get the wood! So happy! Let's get to it!

    I've got a hatchet now. Now, I'm gonna hit some trees. Time to punch some trees, this is Science Punch! Science Punch is like, guts and determination, the Sopia-certified guts. Okay, the hatchet is working, time to craft some! Ahh! It's here! Now I made the pickaxe! And now I can hit those big rocks. Gotta get more stone, and that's the way. Noja! Noja! Noja! Wow, I'm hitting a rock! Okay! Hmm hmm hmm!

    Okay, let's look at the engrams. How do I unlock stuff? Double-click! There we go! This should be good. Time to see what we can make! And so that we are happy today, level 9 will be an amazing objective for today!
