  thoughts:
  - "**ARK Troubleshooting and Dinosaur Discourse**\n\nOkay, here's what I'm thinking\
    \ as I go through this audio. First, gotta make sure the transcriptions are spot-on,\
    \ especially with those pesky overlapping voices and Japanese pronouns. I need\
    \ to get this right - \"のじゃ\" and \"わし\" from Mela, そぴあ for Sorashina Sopia, つづり\
    \ for Suzuna Tsuzuri, and キョーコ for Hyakuto Kyoko. No music here, just ARK BGM\
    \ and chatter.\n\nRight, so it starts with Mela, noticing ARK. Then, some connection\
    \ issues. It seems I'm having trouble getting a good connection. Dropping and\
    \ restarting ARK apparently cleared up the voice chat with Discord. That's a weird\
    \ one! Voice chat's suddenly crystal clear after restarting.\n\nMela's getting\
    \ the impression that something in ARK is making it impossible to join the voice\
    \ chat, it's making her late to join it. Kyoko and Sopia are in the chat, saying\
    \ hi! After some initial ARK-induced lag, it's resolved. Now to get back into\
    \ ARK. Tsuzuri is still loading the game, she's almost done at 7%, but is experiencing\
    \ a slow load. Sopia and Kyoko are being supportive. There's 64GB left, Tsuzuri\
    \ is going to continue. \n\nSopia's saying that they have a borrowed flying dinosaur\
    \ that can carry three, to pick up Tsuzuri. Kyoko wonders if this is a Quetzalcoatlus.\
    \ It sounds like they're discussing a very large dino. Mela is starting up the\
    \ game, Sopia asks what kind of dino it is. I'm thinking, \"Did I see it when\
    \ the command line was loading? Okay, I'll go check.\"\n\nI'm starting to think\
    \ I might have to go through the settings. \"What settings can I adjust to make\
    \ the game lighter?\" Kyoko suggests Frame Rate, so let's see, it's at 60. Alright,\
    \ let's try 30. If I can, that's fine. It looks like I've already adjusted it\
    \ to be more optimal, but I'll try lowering it. Then, I need to try to lower the\
    \ graphics from \"low\". I should try \"low\". Kyoko is excited about the idea!\
    \ It seems that I was already on \"low\" for the graphics settings. I'll test\
    \ it out. Now I'm saving the settings.\n\nOkay, now to go back in. Trying to figure\
    \ out the \"Draw Distance\", where do I find that? Huh? Where *is* Draw Distance?\
    \ Found it, I think.\n\nMeanwhile, Tsuzuri says Kyoko is looking at a bird, and\
    \ she thinks it's a red bird. Kyoko explains it's a red-winged Pterodactyl. Sopia\
    \ points out how cool that it's possible to find colored dinosaurs. That's probably\
    \ just a quirk with the game. Kyoko says \"yup!\" Sopia: it's possible such a\
    \ colorful pterodactyl could have existed. They were real, just like the Phoenix.\
    \ Mela is going to load into the game and check. Sopia says, \"There's a red bird!\"\
    \ Kyoko praises Sopia's resourcefulness, mentioning her dinosaur encyclopedia.\
    \ They decide to check their dinos there. If they get stuck, they'll ask Sopia\
    \ about the food needed for taming.\n\nSopia says it's super useful and fun. Tsuzuri\
    \ agrees. And then, me, Mela: \"Oh yeah, the view distance is already on 'low'.\""
