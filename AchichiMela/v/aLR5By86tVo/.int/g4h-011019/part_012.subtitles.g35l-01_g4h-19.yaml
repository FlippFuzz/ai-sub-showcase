    I hear Sopia or Tsuzuri say 「ありがとうございます！うわあ！」 ("Thank you very much! Whoa!") at the very beginning. Then, Kyoko/Noel suggests, 「たぶん一旦入り直すのもありかも。ね、入り直すときも… はい！」 ("Maybe re-entering once is an option. Hey, when re-entering... Yes!"). They're thinking it might be better to close the game completely before restarting. There's some overlapping audio here. Background voices are saying 「ありがとうございます！お腹ぺこぺこかもしれない」 ("Thank you! I might be starving"). I hear myself say, 「わかりましたのじゃ！」 ("Understood!") and later 「わかりましたのじゃ。ちょっとじゃあ、入り直してみますのじゃ！」 ("Understood. Well then, I'll try rejoining!"). Noel adds, 「1回落として、最初から起動し直すと直るかも。」 ("If you close it once and restart it from scratch, it might fix it.").

    I decide to rejoin, 「よし。」 ("Alright."), Noel says, 「いってらっしゃい！」 ("See you in a bit!"), and someone says 「待ってるー！」 ("We'll be waiting!"). I'm saying, 「それでは…」 ("Well then..."). Noel is also telling me, 「ARKはね、重いからね。落とすこともあるからね。」 ("ARK is heavy, you know. Sometimes you just have to close it."). I'm explaining, 「このラグを解消するために一旦入り直しをさせていただくか。」 ("In order to fix this lag, I'll go ahead and rejoin for a bit."). I say 「んで」 ("And then,"), then I say 「入り直しをするから」 ("Since I'm going to rejoin...") followed by 「よいしょ。」 ("Heave-ho.").

    I'm thinking I'll switch audio so I can hear Kyoko and the others. I’m thinking "Discordも入り直すか。" ("I'll rejoin Discord too."). Oh, someone, before Discord disconnected, said "え、すご..." ("Whoa, amaz—"). Then it's crashing. Oh no, it's lagging so badly I can't even close Discord. I think it might be my fault. Wait wait wait, I say, 「ちょ待ってね。」 ("Hold on a sec."). 「ゆっくり待ってね。」 ("Wait patiently, okay?"). I am going to try and 「タスクマネージャーから全て落とすか。」 ("close everything from Task Manager."). 「よいしょ。」 ("Alright."). I say to not close the apps that I should not be closing.  I need to close things like this one.  I check again: it's Wi-Fi causing the problems. My signal at my place is bad. I say 「よいしょ。」 ("There we go."), 「えーっと、入るのじゃ。」 ("Um, let's get in.") and 「のじゃ！いけるかな？」 ("Noja! Will it work?"). Then I'm back, saying 「ただいま！」 ("I'm back!").

