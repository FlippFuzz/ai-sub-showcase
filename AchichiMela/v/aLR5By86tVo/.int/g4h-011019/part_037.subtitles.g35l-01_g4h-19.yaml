  domain_glossary:
  - term: '#ホロ鯖ARK'
    meaning: The private multiplayer ARK server hosted for Hololive members.
  - term: アソビ★まわり隊！
    meaning: Hololive's play-supremacy VTuber unit consisting of Kyoko, Mela, Tsuzuri,
      and Sopia.
  - term: テイム (Taming)
    meaning: The game mechanic of subduing and feeding wild dinosaurs to recruit them
      as loyal mounts or pets.
  - term: プテラノドン (Pteranodon)
    meaning: A popular flying reptile species tamed early on for aerial mobility across
      the map.
  - term: ボーラ (Bola)
    meaning: A throwable weapon used to tie down and immobilize small running creatures
      or flying dinosaurs.
  - term: エングラム (Engram)
    meaning: The skill point system used to unlock crafting recipes for tools, structures,
      and weapons as player levels increase.
  - term: クライオポット (Cryopod)
    meaning: A high-tech capsule device used to store, transport, and deploy tamed
      dinosaurs.
  - term: イクチオルニス (Ichthyornis)
    meaning: A wild bird species in ARK notorious for snatching items from players'
      inventories ('thief bird').
