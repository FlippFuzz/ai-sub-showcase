global_summary:
  overall_summary: 'This video is a livestream broadcast from Mela Ch. 熱千めら‐ アソビ★まわり隊!
    featuring hololive''s newly debuted unit ''アソビ★まわり隊！'' (Achichi Mela, Sorashina
    Sopia, Suzuna Tsuzuri, and Hyakuto Kyoko) playing ARK: Survival Evolved on the
    Hololive multiplayer server (#ホロ鯖ARK) for the first time. The members experience
    hilarious early-game panics, encounter fierce wildlife, struggle with severe network
    lag and technical troubleshooting, and receive generous guidance and material
    support from senior hololive members (such as Shirogane Noel, Shirakami Fubuki,
    and Laplus Darknesss). After mastering basic resource gathering, crafting, and
    pet taming, the group successfully tames Pteranodons, takes flight together across
    the map, and finishes with a heartwarming photo session and tour of senior bases.'
