  - start: '02:36.200'
    end: '02:37.650'
    original: ほー、のじゃ！
    english: Whoa, noja!
  - start: '02:37.650'
    end: '02:41.500'
    original: オッケー、よかったよかった。そう！オッケーイ！
    english: Okay, good, good. Yeah! Okay!
  - start: '02:41.500'
    end: '02:45.650'
    original: ちょっと今のがやらないと恐竜がね、おねんねしちゃうんだよね。
    english: If you don't do that, the dinosaur will fall asleep, you know.
  - start: '02:45.800'
    end: '02:46.900'
    original: ほー。
    english: Ohh.
  - start: '02:47.100'
    end: '02:53.050'
    original: そうそう。でもこれでオッケー。恐竜の出し入れもできたので、今度はじゃあこいつに乗ってみよう！
    english: Yeah, yeah. But now we're good. Since you can take the dinosaur in and
      out, next let's try riding this guy!
  - start: '02:53.100'
    end: '02:54.350'
    original: はい！はい！
    english: Yes! Yes!
  - start: '02:54.400'
    end: '02:56.800'
    original: はい。ほい！お、乗れた！おお、乗れた！
    english: Okay. Hop! Oh, I'm on! Oh, I got on!
  - start: '02:56.800'
    end: '03:03.250'
    original: 一番最初に乗ったのが、そぴあが騎乗者…操縦者だね。この恐竜を操縦できます。WASDで動きます。
    english: Since Sopia got on first, she's the rider... the pilot, right? She can
      steer this dinosaur. You move with WASD.
  - start: '03:03.300'
    end: '03:05.300'
    original: 大丈夫かしらー。
    english: I wonder if we'll be okay.
  - start: '03:05.350'
    end: '03:07.100'
    original: 任せてくださいよ！
    english: Leave it to me!
  - start: '03:07.100'
    end: '03:08.500'
    original: ほら、まずは歩いてみよう！
    english: Come on, try walking first!
  - start: '03:07.700'
    end: '03:08.600'
    original: あ、落ちた！
    english: Ah, I fell!
  - start: '03:08.650'
    end: '03:12.100'
    original: ら、落下しましたのじゃ！
    english: I-I fell off-noja!
  - start: '03:12.100'
    end: '03:13.500'
    original: 方向転換と…
    english: Turning and...
  - start: '03:13.550'
    end: '03:15.050'
    original: もう1回乗るのじゃ！
    english: Getting back on-noja!
  - start: '03:15.100'
    end: '03:16.500'
    original: はっ！はっ！
    english: Hup! Hup!
  - start: '03:17.800'
    end: '03:22.450'
    original: 乗った状態でまたEを押しちゃうと降りちゃうから、乗ったら何もできないです。何も押さない方がいいと思う。
    english: If you press E again while riding, you'll dismount, so once you're on
      you can't do anything. I think it's best not to press anything.
  - start: '03:22.500'
    end: '03:26.100'
    original: ふん？のじゃ？のじゃ？
    english: Hmm? Noja? Noja?
  - start: '03:26.700'
    end: '03:27.550'
    original: キョーコ乗れてる？
    english: Kyoko, are you on?
  - start: '03:27.300'
    end: '03:28.300'
    original: 乗れてるよ。あ、乗れた！
    english: I'm on. Ah, got on!
  - start: '03:28.300'
    end: '03:29.400'
    original: あ、いいじゃん！きたきたきた！
    english: Oh, nice! There you go!
  - start: '03:29.500'
    end: '03:33.500'
    original: で、後ろに…多分Sを押すと後ろにバックしてくれるはず恐竜。
    english: And backwards... if you press S, the dinosaur should back up for you.
  - start: '03:33.550'
    end: '03:36.850'
    original: あれ？しません、この恐竜ちゃん。
    english: Huh? This little dino isn't doing it.
