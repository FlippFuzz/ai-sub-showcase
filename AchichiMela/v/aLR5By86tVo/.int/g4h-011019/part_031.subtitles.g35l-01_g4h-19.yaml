  - start: '03:10.300'
    end: '03:15.200'
    original: あ、そう！投げる感じの罠だね。グルグルグルグルーってやって、絡みつけて相手が動けなくなるっていう感じ。
    english: Yeah, right! It's a throwing trap. You spin it round and round, entangle
      them, and they can't move.
  - start: '03:15.200'
    end: '03:19.000'
    original: オッケ。ついでにじゃあ探しながらちょっと石とか拾ったりするわ。
