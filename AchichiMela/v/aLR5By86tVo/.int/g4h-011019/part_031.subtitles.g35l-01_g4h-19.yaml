  - start: '03:01.500'
    end: '03:03.600'
    original: だからそこそこやったら行ける。
    english: So if we try a bit, we can manage.
  - start: '03:03.600'
    end: '03:05.300'
    original: ボーラも武器になるの？
    english: Are bolas weapons too?
  - start: '03:05.300'
    end: '03:07.300'
    original: ボーラはね、足止めって感じ。
    english: Bolas are more for immobilizing.
