  - start: '04:27.400'
    end: '04:31.500'
    original: 小さいドードー探そう。どこにいるのかなー。
    english: Let's look for a small Dodo. Where could they be?
  - start: '04:31.500'
    end: '04:32.800'
    original: ねー。
    english: Yeah...
  - start: '04:33.300'
    end: '04:35.000'
    original: のちゃーん。
    english: No-chaaan.
  - start: '04:35.500'
    end: '04:37.300'
    original: ご飯食べなきゃ。
    english: Gotta eat some food.
  - start: '04:37.300'
    end: '04:40.100'
    original: ちょっと木取ってから次行くわ。
    english: I'll gather some wood and then head on.
  - start: '04:40.100'
    end: '04:42.400'
    original: あ、大丈夫よ。この辺いっぱいあるから。
