    end: '02:55.100'
    original: いる？1個。
    english: Do you want one?
  - start: '02:55.100'
    end: '02:57.600'
    original: うん、いいよいいよ、大丈夫よ。
    english: Nah, I'm good, I'm fine.
  - start: '02:58.600'
    end: '03:00.200'
    original: うちら手にしてんのよ、もう。
