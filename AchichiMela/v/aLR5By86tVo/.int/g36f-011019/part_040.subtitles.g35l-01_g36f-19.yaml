    original: ちっちゃい子いるよ。狩りたいんだけどな。
    english: There's a little one. I want to hunt it though.
  - start: '03:04.100'
    end: '03:07.500'
    original: これ何個はげればいいとかあるのかな？
    english: Is there a specific amount we need to harvest from it?
  - start: '03:07.600'
    end: '03:10.500'
    original: とりあえず持っているの全部入れちゃって大丈夫かな。
    english: For now, putting everything you have in should be fine.
  - start: '03:10.600'
    end: '03:13.800'
    original: オッケー。え、キョーコさ...
    english: Okay. Eh, Kyoko...
  - start: '03:14.000'
    end: '03:17.800'
    original: このちっちゃい子もさ、テイムできるの？赤ちゃんだったら。
    english: Can we tame this little one too if it's a baby?
  - start: '03:18.000'
    end: '03:21.000'
    original: 赤ちゃんは親をちょっと...
    english: For babies, the parents...
  - start: '03:22.500'
    end: '03:26.000'
    original: あ、羊テイム出来たのってそういうこと？はい。
    english: Ah, is that how you were able to tame the sheep? Yes.
  - start: '03:28.500'
    end: '03:32.500'
    original: 欲しいんじゃけど。
    english: I want one though.
  - start: '03:33.000'
    end: '03:35.800'
    original: 馬は馬。馬ダメ？
    english: A horse is a horse. Is a horse no good?
  - start: '03:36.500'
    end: '03:38.500'
    original: あいつダメ？
    english: Is that guy no good?
  - start: '03:39.000'
    end: '03:41.000'
    original: 馬やるの？うん。
    english: Are you going for the horse? Yeah.
  - start: '03:41.100'
    end: '03:44.200'
    original: まあ、しゃーなし。馬肉。
    english: Well, can't be helped. Horse meat.
  - start: '03:44.500'
    end: '03:46.500'
    original: しゃーなし？こいついけんじゃね？
    english: Can't be helped? Can't we take this one?
  - start: '03:46.600'
    end: '03:48.500'
    original: ありがと、肉。
    english: Thanks, meat.
  - start: '03:49.500'
    end: '03:52.200'
    original: こいつ... こいつで...
    english: This guy... with this guy...
  - start: '03:55.800'
    end: '03:58.200'
    original: どうやって攻撃するんだろう？
    english: How do you attack?
  - start: '04:00.000'
    end: '04:03.500'
    original: あれか、サドルないから中立...
    english: Ah, because there's no saddle, set to neutral...
  - start: '04:03.500'
    end: '04:05.000'
    original: 攻撃！
    english: Attack!
  - start: '04:05.100'
    end: '04:08.500'
    original: こいつ攻撃！攻撃どうやってやるの？
    english: Attack this guy! How do you attack?
  - start: '04:08.600'
    end: '04:13.200'
    original: 攻撃はね、えっと... 武器持ってクリック。
    english: To attack, um... hold a weapon and click.
  - start: '04:13.500'
    end: '04:16.000'
    original: え！あ、本当だ。もうやばい。
    english: Eh! Ah, it's true. It's bad already.
  - start: '04:16.100'
    end: '04:18.000'
    original: あの、乗りながら？
    english: Um, while riding?
  - start: '04:18.100'
    end: '04:21.000'
    original: あー！えっとね、あ、プテラノドンでやってるのか。
    english: Ah! Um, ah, are you attacking on the Pteranodon?
  - start: '04:21.100'
    end: '04:24.000'
    original: うん。えっとクリック... あ、左クリックで？
    english: Yeah. Um, click... Ah, left-click?
  - start: '04:24.100'
    end: '04:27.500'
    original: うん。オッケー、じゃあちょっとスタミナ回復させたら行くか。
    english: Yeah. Okay, then I'll go once I restore my stamina.
  - start: '04:28.100'
    end: '04:30.000'
    original: あ、間違えた！間違えた！
    english: Ah, my bad! My bad!
  - start: '04:32.000'
    end: '04:36.500'
    original: え、25！レベル低！こいつやれるやん！こいつやれるやん！
    english: Eh, level 25! That's low! We can take this guy! We can take this guy!
  - start: '04:36.500'
    end: '04:41.000'
    original: あ！腐っていく！あげる前に腐っていく！
    english: Ah! It's spoiling! It's spoiling before I can give it!
  - start: '04:41.500'
    end: '04:45.000'
    original: わしのエイムが... わしのエイムが...
    english: My aim... My aim...
  - start: '04:45.500'
    end: '04:49.000'
    original: えっと、でもサドル見つけるの時間かかるって言っていた、みんな。
    english: Um, but everyone said it takes time to find a saddle.
  - start: '04:49.000'
    end: '04:52.000'
    original: え、ナイス！あ、攻撃当たっている、大丈夫。
    english: Eh, nice! Ah, the attacks are landing, it's fine.
  - start: '04:52.000'
    end: '04:56.000'
    original: こいつ倒したんだけど、どうやって剥ぎ取れる？肉とか。
    english: I defeated this guy, but how do I harvest it? Like meat?
  - start: '04:56.000'
    end: '04:58.000'
    original: もっと攻撃！もっと攻撃か。
    english: Attack it more! Attack it more?
  - start: '04:58.100'
    end: '04:59.800'
    original: うん。
    english: Yeah.
