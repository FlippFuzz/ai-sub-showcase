  - start: '04:43.000'
    end: '04:47.500'
    original: ずっと、ずっと寒くて... あっためて... この中にいないと...
    english: Always, always cold... Warm me up... Got to stay inside here...
  - start: '04:47.600'
    end: '04:51.200'
    original: 誰がわしをあっためてくれる... うちのあまりものいります？
    english: Who will warm me up... Want our extra stuff?
  - start: '04:51.300'
    end: '04:56.000'
    original: この、こいつ？こいつの近くにいったら暖とれる？
    english: This, this guy? Can I get warm near this guy?
  - start: '04:56.100'
    end: '04:59.500'
    original: ズボンとか全くなくだって... 寒っ...
    english: No pants at all... Cold...
