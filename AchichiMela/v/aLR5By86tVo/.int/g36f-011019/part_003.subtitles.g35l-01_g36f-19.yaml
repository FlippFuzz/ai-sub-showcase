  - start: '02:53.800'
    end: '02:57.000'
    original: そうそう、お水はね、水の中入ると勝手に飲むから
    english: Right right, as for water, if you enter the water you drink automatically.
  - start: '02:57.000'
    end: '02:58.500'
    original: にょ〜ん
    english: Nyon~
  - start: '02:58.500'
    end: '03:00.800'
    original: じゃあなんか... てか墓！ 墓落ちてる、墓！
    english: Then... wait, a tombstone! A tombstone is lying here!
  - start: '03:00.800'
    end: '03:04.200'
    original: '[Text: 不気味な堆積] この墓何なんだ？'
    english: '[Text: Eerie Pile] What is this tombstone?'
  - start: '03:04.200'
    end: '03:07.500'
    original: 何これ？ 「不気味な... インベントリを開く」
    english: What's this? "Eerie... Open inventory"
  - start: '03:10.500'
    end: '03:13.200'
    original: 骨落ちてるよ、骨
    english: There are bones lying here, bones!
  - start: '03:13.200'
    end: '03:15.500'
    original: 奪おう？
    english: Shall we take them?
  - start: '03:15.500'
    end: '03:18.500'
    original: 敗者しか使えそうよね。敗者
    english: Seems like only the defeated can use it. Defeated.
  - start: '03:18.500'
    end: '03:22.500'
    original: とりあえず今は木を殴って... 木が倒れてすごいのじゃ！
    english: For now, let's punch trees... The tree fell down, it's amazing!
  - start: '03:22.500'
    end: '03:26.500'
    original: すごいでしょ！ これを先輩にあげたら喜ぶんじゃないの？
    english: Isn't it cool! Wouldn't senpais be happy if we gave this to them?
  - start: '03:26.500'
    end: '03:28.000'
    original: 大木？
    english: Big tree?
  - start: '03:28.000'
    end: '03:32.000'
    original: わしもさ、先輩に助けてもらってばっかじゃあれじゃからさ...
    english: I mean, always being helped by senpais isn't great, so...
  - start: '03:32.000'
    end: '03:36.000'
    original: お礼したい！ お礼したい！
    english: I want to thank them! I want to thank them!
  - start: '03:36.000'
    end: '03:40.000'
    original: いっぱいなんか良いものないかな？ 木を倒してもさ...
    english: Is there anything good? Even if we fell trees...
  - start: '03:40.000'
    end: '03:42.500'
    original: プレゼントしたいのじゃ
    english: I want to give them a present.
  - start: '03:42.500'
    end: '03:46.500'
    original: 木を倒してもなんか、何も得られない... え、何も得られないの？
    english: Even if we fell trees, we don't get anything... Eh, we get nothing?
  - start: '03:46.500'
    end: '03:49.000'
    original: 分かんない、なんかインベントリ開けたり...
    english: I don't know, like opening inventory...
  - start: '03:49.000'
    end: '03:52.000'
    original: わら！ わらがもらえるのじゃ、木は確か
    english: Thatch! We get thatch from trees, for sure.
  - start: '03:52.000'
    end: '03:56.000'
    original: わらとかがもらえて、それで何か作れた気がするんだよな
    english: We get thatch and stuff, and I feel like we could craft something with
      it.
  - start: '03:56.000'
    end: '03:59.800'
    original: あのねそぴあね、勝手に入っていくのよ。拾うんじゃなくて勝手に入っていってるから
    english: You know, Sopia, it enters automatically. Not picking up, it goes in
      automatically.
  - start: '03:59.800'
    end: '04:04.000'
    original: あ！ 拾ったものってどこで見れるんですか？
    english: Ah! Where can we see the items we picked up?
  - start: '04:04.000'
    end: '04:06.500'
    original: 「I」 「I」ボタン
    english: '"I", the "I" button.'
  - start: '04:06.500'
    end: '04:08.000'
    original: 「I」
    english: '"I"'
  - start: '04:08.000'
    end: '04:11.000'
    original: 本当だ！ なんか貯まっていってる！ やったー！
    english: It's true! Things are accumulating! Yay!
  - start: '04:11.000'
    end: '04:13.000'
    original: でしょう？
    english: Right?
  - start: '04:13.000'
    end: '04:17.500'
    original: 拾えるアイテムは、攻撃してるじゃん？ その時に左の真ん中らへんに...
    english: The collectable items, when you attack, near the middle left...
  - start: '04:17.500'
    end: '04:22.500'
    original: ちょっと小さく絵のアイコンが出て、それに数字が出てくるの
    english: A small picture icon appears with numbers next to it.
  - start: '04:22.500'
    end: '04:27.500'
    original: だからそれがわらのマークだったらわら何個みたいな感じで書いてあるから...
    english: So if that's the thatch mark, it shows how many thatch you got...
  - start: '04:27.500'
    end: '04:30.000'
    original: それで何が手に入ってるかってのが見れる
    english: So you can see what you've obtained that way.
  - start: '04:30.000'
    end: '04:33.800'
    original: なるほど、ありがとう！ プラス何個って書いてある？
    english: I see, thank you! Does it say plus how many?
  - start: '04:33.800'
    end: '04:35.000'
    original: それね
    english: That's it.
  - start: '04:35.000'
    end: '04:37.500'
    original: なるほど！ 倒さなくてももらえてるんだ
    english: I see! So we get items even without chopping it completely down.
  - start: '04:37.500'
    end: '04:41.000'
    original: 何持ってったら喜ばれるかな？
    english: What can I bring that they'll be happy with?
  - start: '04:41.000'
    end: '04:43.000'
    original: なんかね... え！ なんかいる！
    english: Like... Eh! Something is there!
  - start: '04:43.000'
    end: '04:44.200'
    original: お前やめろ！
    english: Stop it, you!
  - start: '04:44.200'
    end: '04:47.000'
    original: え、大丈夫？ お前やめろ！ お前やめろ！
    english: Eh, are you okay? Stop it! Stop it!
  - start: '04:47.000'
    end: '04:48.500'
    original: え、大丈夫？
    english: Eh, are you okay?
  - start: '04:48.500'
    end: '04:52.500'
    original: え、なんか武器とか持っておいた方がいいのかな？ 大丈夫かな？
    english: Eh, should we hold a weapon or something? Will it be fine?
  - start: '04:52.500'
    end: '04:54.000'
    original: 武器我々持てるかな？
    english: Can we equip weapons?
  - start: '04:54.000'
    end: '04:56.500'
    original: ドードーどこ？ 無くした？
    english: Where is Dodo? Did we lose it?
  - start: '04:56.500'
    end: '05:00.000'
    original: お前バカかよ！ やばい！ こいつ攻撃...
    english: You idiot! Oh crap! This guy... this guy is attacking...
