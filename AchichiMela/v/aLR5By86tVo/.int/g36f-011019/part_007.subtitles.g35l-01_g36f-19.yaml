    original: オッケー、よかったよかった。そう！
    english: Okay, good good. Yeah!
  - start: '02:45.000'
    end: '02:46.000'
    original: オッケー！
    english: Okay!
  - start: '02:46.400'
    end: '02:50.400'
    original: ちょっと今のをやらないと恐竜がね、おねんねしちゃうんだよね。
    english: If you don't do that step, the dino will fall asleep when spawned.
  - start: '02:50.400'
    end: '02:51.200'
    original: ふーん。
    english: Ah, I see.
  - start: '02:51.500'
    end: '02:57.600'
    original: そうそう。でもこれでオッケー、恐竜の出し入れもできたので、今度はじゃあこいつに乗ってみよう！
    english: Right. But now you're all set! Since you can spawn and recall it, let's
      try riding it now!
  - start: '02:57.600'
    end: '03:00.000'
    original: はい！はい！はい！
    english: Yes! Yes! Yes!
  - start: '03:00.400'
    end: '03:02.400'
    original: あ、乗れた！
    english: Ah, we got on!
  - start: '03:02.400'
    end: '03:08.000'
    original: 一番最初に乗ったのでソピアが騎乗者というか操縦者ね。この恐竜を操縦できます。WASDで動きます。
    english: Sopia mounted first, so she's the pilot. You can steer this dino using
      WASD.
  - start: '03:08.000'
    end: '03:09.400'
    original: やば、難し…
    english: Oh man, this looks hard...
  - start: '03:09.500'
    end: '03:12.400'
    original: 任せてください！任せてください！
    english: Leave it to me! Leave it to me!
  - start: '03:12.400'
    end: '03:14.200'
    original: ほら、歩いてみよう。歩いて…
    english: Look, try walking. Walk...
  - start: '03:14.200'
    end: '03:15.000'
    original: 落ちた！
    english: I fell off!
  - start: '03:15.000'
    end: '03:17.300'
    original: 落下しました、のじゃ！
    english: I fell off, noja!
  - start: '03:17.300'
    end: '03:18.400'
    original: 方向転換…
    english: Changing direction...
  - start: '03:18.400'
    end: '03:20.000'
    original: もう一回乗るのじゃ！
    english: I'll get back on, noja!
  - start: '03:20.000'
    end: '03:21.800'
    original: はっ！はっ！
    english: Ha! Ha!
  - start: '03:22.000'
    end: '03:27.700'
    original: 乗った、乗った状態でまたEを押すと降りちゃうから、乗ったら何もできないです。何も押さない方がいい、一旦は。
    english: Once you're mounted, pressing 'E' again will dismount you, so passengers
      shouldn't press anything for now.
  - start: '03:28.000'
    end: '03:31.000'
    original: のじゃ！のじゃ！
    english: Noja! Noja!
  - start: '03:31.000'
    end: '03:33.000'
    original: キョーコ乗れてる？
    english: Kyoko, are you on?
  - start: '03:33.000'
    end: '03:34.000'
    original: あ、乗れました！
    english: Ah, I got on!
  - start: '03:34.000'
    end: '03:37.700'
    original: あ、乗れた。で、後ろに多分Sを押すと後ろにバックしてくれるはず、恐竜。
    english: Ah, nice. Now pressing 'S' should make the dino back up.
  - start: '03:38.000'
    end: '03:41.200'
    original: あれ？しません、この恐竜！
    english: Huh? This dino isn't backing up!
  - start: '03:41.200'
    end: '03:47.000'
    original: しなかったら、WとかDとかで、ちょっと前に進みつつ横に…
    english: If it won't, try pressing W or D to move forward a bit while turning
      sideways...
  - start: '03:47.000'
    end: '03:52.500'
    original: 横に、横に！頑張れ頑張れ！行ける行ける！あ、行けました！視点を変えたら行けました！
    english: Sideways, sideways! Hang in there! You can do it! Ah, we did it! Changing
      the camera view worked!
  - start: '03:53.000'
    end: '03:55.200'
    original: あ、いいよいいよ、上手いよ！
    english: Ah, nice, nice! You're doing great!
  - start: '03:55.200'
    end: '03:56.000'
    original: のじゃー！
    english: Noja~!
  - start: '03:56.500'
    end: '03:58.000'
    original: で、じゃあ次飛んでみよう！
    english: Now, let's try flying next!
  - start: '03:58.000'
    end: '03:59.800'
    original: はい！はい！
    english: Yes! Yes!
  - start: '03:59.800'
    end: '04:02.000'
    original: スペースでまず浮きます。
    english: Press space to take off first.
  - start: '04:02.000'
    end: '04:05.000'
    original: スペースで浮く…浮く…おおー！
    english: Space to float... float... Woah~!
  - start: '04:07.000'
    end: '04:08.500'
    original: 着地した？そう！
    english: Did you land? Right!
  - start: '04:08.500'
    end: '04:14.600'
    original: 行ける行ける！飛んでる飛んでる！飛んでるよ！おおー！飛んでる飛んでる！
    english: You can do it! We're flying! We're in the air! Woah~! We're flying!
  - start: '04:15.000'
    end: '04:18.500'
    original: 飛んでますよ！のじゃー！
    english: We're flying! Noja~!
  - start: '04:19.000'
    end: '04:20.000'
    original: いいね！
    english: Nice!
  - start: '04:20.000'
    end: '04:21.000'
    original: いいね！
    english: Nice!
  - start: '04:22.000'
    end: '04:23.000'
    original: 行けました！
    english: We did it!
  - start: '04:23.000'
    end: '04:24.000'
    original: ナイス！
    english: Nice!
  - start: '04:24.000'
    end: '04:25.000'
    original: やったー！
    english: Yay!
  - start: '04:25.500'
    end: '04:28.500'
    original: で、恐竜にもスタミナってものが存在しまして…
    english: Now, dinosaurs also have a stamina bar...
  - start: '04:29.000'
    end: '04:29.800'
    original: ふむふむ。
    english: Mm-hmm.
  - start: '04:30.000'
    end: '04:33.200'
    original: 右上のほうに雷マークみたいなのが出てると思うんだけど…
    english: I think there's a lightning bolt icon at the top right...
  - start: '04:32.400'
    end: '04:34.000'
    original: やばい、寒い寒い寒い！
    english: Oh no, it's so cold, cold, cold!
  - start: '04:34.000'
    end: '04:35.500'
    original: あ、あります！
    english: Ah, I see it!
  - start: '04:35.500'
    end: '04:38.200'
    original: 飛んだり…え、なんか命が少なくなってます！
    english: Flying... Wait, my health is dropping!
  - start: '04:39.000'
    end: '04:40.000'
    original: HP減ってる？
    english: Is your HP going down?
  - start: '04:40.000'
    end: '04:42.000'
    original: あのね、寒いの寒いの、ここ。
    english: Well, it's really cold around here.
  - start: '04:42.000'
    end: '04:45.500'
    original: プラス…寒くてプラス赤十字マークが…
    english: Plus... it's cold, and the red cross icon is...
  - start: '04:46.000'
    end: '04:48.800'
    original: ドクドク言って下になってて…
    english: '...pulsing and going down...'
  - start: '04:48.800'
    end: '04:51.000'
    original: もうなくなっちゃいます、のじゃ！
    english: It's about to run out, noja!
  - start: '04:51.000'
    end: '04:54.800'
    original: ごはんとお水マークがもし減ってるなら…
    english: If the food and water icons are decreasing...
  - start: '04:54.800'
    end: '05:00.000'
    original: ごはんとお水は平気で、あー！赤い十字がダメです、のじゃ！
    english: Food and water are fine, ahhh! The red cross is the problem, noja!
