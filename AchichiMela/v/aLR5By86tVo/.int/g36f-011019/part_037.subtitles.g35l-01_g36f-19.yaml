    original: じゃあ、つっちゃん、うちらのほう行くぞ。
    english: Alright, Tsu-chan, let's head towards our place.
  - start: '02:59.000'
    end: '03:00.000'
    original: のえるちゃん！
    english: Noel-chan!
  - start: '03:00.000'
    end: '03:03.500'
    original: ねぇ、これどうしよう、この子。
    english: Hey, what should we do with this little one?
  - start: '03:03.500'
    end: '03:05.000'
    original: どうしたい？
    english: What do you want to do?
  - start: '03:05.000'
    end: '03:08.500'
    original: 持っていくのにさ、この子持てないの？手持ちに。
    english: Can't we carry this little one in our hands when moving?
  - start: '03:09.000'
    end: '03:12.000'
    original: あ、運ぶのは... ちょっと待ってね。
    english: Ah, carrying it is... hold on a sec.
  - start: '03:13.000'
    end: '03:17.000'
    original: 荷物も持たせられるよ、この子。持たせられるよ。でも、重さはそっち行っちゃうから。
    english: You can make it carry items too. Yeah, it can. But the weight will count
      towards you.
  - start: '03:19.500'
    end: '03:22.000'
    original: こいつが乗ってるのおもしろいよね。
    english: It's funny seeing this guy riding it.
  - start: '03:23.000'
    end: '03:28.000'
    original: カワウソがさ、恐竜に乗ってるのおもしろいよね、絵面が。
    english: An otter riding a dinosaur is hilarious to look at.
  - start: '03:30.000'
    end: '03:32.000'
    original: 普段絶対起こらないよね。
    english: That would never happen normally.
  - start: '03:32.100'
    end: '03:33.000'
    original: ね、起こらない。
    english: Yeah, never.
  - start: '03:34.000'
    end: '03:38.000'
    original: すごい！テイムできるのってすごいんじゃない？なかなか。
    english: Wow! Isn't taming impressive? Quite a feat.
  - start: '03:38.000'
    end: '03:41.000'
    original: すごいよ。一日目でね、プテラはめちゃくちゃすごいよ。
    english: It is. Taming a Ptera on the first day is super awesome.
  - start: '03:41.000'
    end: '03:45.000'
    original: 嬉しい、のえるちゃん！やったー！ARK大成功なんじゃない？わしたち。
    english: I'm so happy, Noel-chan! Yay! Isn't our ARK run a huge success?
  - start: '03:45.500'
    end: '03:48.500'
    original: いや、大成功だよ、本当。 / ねー。 / やっのーちゃん！
    english: Yeah, it really is a huge success. / Right? / Yay, Noel-chan!
  - start: '03:50.000'
    end: '03:54.000'
    original: あれ？ソピア乗ったんだっけ？乗る？ / うん、乗ったよ。
    english: Huh? Did Sopia ride it yet? Want to ride? / Yeah, I rode it.
  - start: '03:56.000'
    end: '03:59.000'
    original: じゃ、じゃあ、うちらのほうも行く？ / 行っちゃうかー。
    english: So, shall we head over to our side too? / Should we go?
  - start: '04:00.000'
    end: '04:03.000'
    original: あ、ちょっと待ってね、あのテイム用のね、生肉がないから...
    english: Ah, hold on a sec. I don't have raw meat for taming, so...
  - start: '04:04.000'
    end: '04:08.000'
    original: 生肉めっちゃある。これ、霜降り持ってる？もしや。
    english: I have a ton of raw meat. Wait, do you have raw prime meat by any chance?
  - start: '04:09.000'
    end: '04:12.000'
    original: え、これ霜降りなんか？羊肉。
    english: Eh, is this prime meat? Mutton.
  - start: '04:12.500'
    end: '04:15.500'
    original: あ、霜降りじゃないか。羊肉か。ラムのほうがいいや。
    english: Ah, not prime meat? Mutton? Mutton is even better.
  - start: '04:17.000'
    end: '04:22.000'
    original: なんかまとまらないの、この肉。全部インベントリを支配してて。
    english: Somehow this meat won't stack. It's taking over my whole inventory.
  - start: '04:24.000'
    end: '04:26.500'
    original: 種類違うのかな。
    english: Are they different types, I wonder?
  - start: '04:27.000'
    end: '04:30.000'
    original: オッケー、ありがとう。じゃ、これで探しに行こうか。
    english: Okay, thank you. Well then, shall we go search with this?
  - start: '04:30.500'
    end: '04:34.000'
    original: え、羊ここに沸いてたの、頼りに行ける？
    english: Eh, sheep spawned here, can we rely on that and go?
  - start: '04:38.000'
    end: '04:42.000'
    original: うん、あいつ追従してるんだよね。キョーコについてきてるよ。
    english: Yeah, that guy is following. It's following Kyoko.
  - start: '04:43.000'
    end: '04:46.000'
    original: あのね、追従もし嫌だったら停止とかもできるよ。
    english: You know, if you don't want it following, you can command it to stop.
  - start: '04:46.500'
    end: '04:51.000'
    original: 死なないなら全然いいんだけどさ。いいか、じゃあ。
    english: As long as it doesn't die, it's totally fine. Oh well, never mind then.
  - start: '04:51.000'
    end: '04:52.000'
    original: うん。
    english: Yeah.
  - start: '04:52.100'
    end: '04:53.000'
    original: のえるちゃん！
    english: Noel-chan!
  - start: '04:53.100'
    end: '04:57.000'
    original: あいつらも強いやつだろう。あ、出た！トリ！
    english: Those guys must be pretty strong too. Ah, there! A bird!
  - start: '04:57.500'
    end: '04:59.000'
    original: これ無視でいい？ / これ無視。
    english: Should we ignore this? / Ignore it.
