  thoughts:
  - |-
    **Segment Summary: Hololive ARK Stream - 30:00.048-35:00.056**

    Okay, here's what I've got, as I remember it.  Mela starts by asking a question "ん？"  and Sopia follows with "はいはいはい".  Fubuki (or Sopia) then clarifies some game/controller settings, mentioning the player's device being the default, and I chime in with, "こいつ何？" looking at a scarecrow. Fubuki then offers a possible tweak to input device settings on Windows, leading me to wonder if the scarecrow is a sacrifice, "生贄か？" . Sopia agrees with an "なるほど". I observe it's a scarecrow, and wonder if it serves as a target.

    After this we have a bit of local chat issues, with me reading chat and mentioning that Sopia's chat might be local. Sopia asks if messages won't reach everyone then, and I clarify that I'm just reading what's in the comment section. There's a moment of relief when Mela says that I can hear Sopia's voice.  Fubuki then comes in with a "Iroha-senpai, welcome!"

    The scene shifts to a flying creature heading towards us. I quickly note it, questioning if it's an ally, enemy, or both with "あ、もしや、わしたちの方に向かってきてる！敵じゃなくて味方か？それとも敵か？". Sopia wonders if it's a senpai, but I don't know, and am still confused. Finally, I note that there is a person riding it. I suggest it might be an ally, "あれもしや...味方なのでは？". Then I announce Noel-chan, "のえるちゃー！" which is greeted with a "こんにちはー！".

    Noel lands and drops Fubuki, and Fubuki invites everyone to the tribe by tapping on Shirakami's avatar. Noel says thank you. Sopia then apologizes when I accidentally punch Noel-senpai. Fubuki explains a wheel will pop up, which will allow us to join, and also adds Kyoko in. Kyoko announces her arrival, and Fubuki suggests going into the rabbit hole. It seems like it worked. I get us to press "Base" so we can go to our base.

    We enter this thing. "We're inside something so sparkly!"
