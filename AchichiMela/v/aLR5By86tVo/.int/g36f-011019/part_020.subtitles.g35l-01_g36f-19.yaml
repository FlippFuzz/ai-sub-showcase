global_summary:
  overall_summary: 'This video is a beginner ARK: Survival Evolved stream on the Hololive
    server (''#ホロ鯖ARK'') featuring Hololive''s newly debuted ''Asobi Mawaritai!''
    unit member, Achishi Mela, along with her unit mates Sopia Sorashina and Tsuzuri
    Suzuna. Navigating the challenging Ragnarok map as complete beginners (''完全初見''),
    Mela and her peers encounter harsh survival mechanics, severe update patches,
    and network lag. With the generous guidance, gear, and rescue operations of senior
    Hololive members such as Fubuki Shirakami, Noel Shirogane, and Choco Yuzuki, the
    rookies successfully tame dodos and Pteranodons, build a base, and eventually
    take to the skies together, concluding with commemorative photo shoots and celebration.'
