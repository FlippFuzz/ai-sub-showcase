  - term: 完全初見
    meaning: Playing a game for the absolute first time with zero prior experience.
  - term: テイム (Tame)
    meaning: The game mechanic of subduing and befriending wild dinosaurs or creatures.
  - term: ポッド / クライオポッド (Cryopod)
    meaning: A technological capsule item used to store and deploy tamed dinosaurs
      instantly.
  - term: ボーラ (Bola)
