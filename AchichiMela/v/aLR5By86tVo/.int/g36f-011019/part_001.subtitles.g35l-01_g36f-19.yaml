  - term: 完全初見
    meaning: Playing a game for the absolute first time with zero prior experience.
  - term: テイム (Tame)
    meaning: The game mechanic of subduing and befriending wild dinosaurs or creatures.
  - term: ポッド / クライオポッド (Cryopod)
    meaning: A technological capsule item used to store and deploy tamed dinosaurs
      instantly.
  - term: ボーラ (Bola)
    meaning: A throwable weapon used to immobilize small to medium dinosaurs and creatures.
  - term: エングラム (Engram)
    meaning: Unlocks for crafting recipes purchased using points gained upon leveling
      up.
  - term: ポン (Pon)
    meaning: Slang term in VTuber fandom referring to cute clumsiness, blunders, or
      airheaded moments.
  - term: ラグ (Lag)
    meaning: Network latency or performance stuttering experienced during the massive
      server session.
