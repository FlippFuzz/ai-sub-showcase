  - term: アソビ★まわり隊！
    meaning: ASOBI★MAWARI-TAI!, a four-member VTuber unit in Hololive debuting in
      September 2026, comprising Hyakuto Kyoko, Achichi Mela, Suzuna Tsuzuri, and
      Sorashina Sopia.
  - term: のじゃばんは
    meaning: Nojabanha, Mela's unique evening greeting combining her signature speech
      tick 'Noja' and 'Konbanwa'.
  - term: あちち見て
    meaning: Achichi Mite, the official hashtag decided during the stream for fans
      to share merchandise and voice pack photos, fan art, and feedback.
  - term: キャプチャーボード
    meaning: Capture board / capture card, hardware used to transfer console gameplay
