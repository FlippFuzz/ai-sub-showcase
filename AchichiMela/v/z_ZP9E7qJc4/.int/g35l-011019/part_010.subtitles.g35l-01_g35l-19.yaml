global_summary:
  overall_summary: In this livestream on her official YouTube channel, Hololive's
    ASOBI★MAWARI-TAI! member Achichi Mela plays the geography game GeoGuessr on the
    Japan map. Due to unexpected technical difficulties with her capture board preventing
    her from playing Rhythm Heaven, she pivots to GeoGuessr. Throughout the stream,
    Mela tackles various locations across Japan—ranging from rural mountain roads
    in Tokyo and Tottori to urban areas in Tokyo and Hokkaido—struggling with map
    reading and directional awareness while chatting with viewers. After completing
    several intense rounds and scoring over 20,000 points, she transitions to a post-stream
    chat where she discusses debut merchandise, decides on the fan hashtag 'あちち見て'
    for merchandise and voice posts, and shares announcements for upcoming streams.
