    There is a quick Duolingo lesson ("truck") as well, which is an excuse to study.

    A key phrase emerges: "I would like to..." I can use this. "If you're definitely going, it's 'will.' If you're definitely going, it's 'will.'" I think that phrase is a way to try to do something I want to do.

    I start reflecting on English grammar. "Do you like" and "Are you" is an interesting concept. I keep struggling with the idea that I still don't completely understand parts of speech.

    So, I was right to say, "I would like to..." It sounds like a "want to go but..." It sounds like an excuse and it is correct, even! "I would like to, but..." It's how I express my feeling, maybe. I said that to my father.

    It's about having that sentiment, you know? "Yeah, sounding a bit full of excuses... like, 'Well, I do want to go, you know, even I want to!' I said that to my father." I do want to be doing something. I used to go do something every single day before my debut! But now... I'd like to, but...

