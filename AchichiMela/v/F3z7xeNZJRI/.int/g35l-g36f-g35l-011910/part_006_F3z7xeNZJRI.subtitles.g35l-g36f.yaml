    English') using Duolingo with extensive, rambling free-talk sessions. Throughout
    the stream, Mela works through Duolingo Unit 2 grammar exercises (focusing on
    modal verbs like could/would, house vocabulary, and polite requests), interspersed
    with humorous tangents about eating homemade brownies from her parents, Japanese
    slang such as 'warota' and 'doparu', her obsession with GeoGuessr and geography
    study, and her thoughts on school days and adulting. The stream concludes with
    an announcement for her upcoming evening Vocaloid cover singing stream.
