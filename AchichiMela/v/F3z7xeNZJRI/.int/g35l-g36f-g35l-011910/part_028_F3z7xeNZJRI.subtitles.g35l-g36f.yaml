  thoughts:
  - |-
    **My GeoGuessr Journey and Geography Awakening**

    Okay, so I need to create subtitles, right? For this segment, from 140:01.155 to 145:05.176, which is local time 00:00.000. Alright, let's dive in and see what's what.

    I wasn't always a geography whiz, let me tell you. In fact, I never really cared for guide videos for GeoGuessr at first because my aim wasn't really high scores, but just to enjoy the game. It was just for fun, a dopamine hit really. Sure, I probably know more than the average person, but compared to the hardcore GeoGuessr players? Not *that* much. I am getting better now that I'm streaming it, and even have more motivation to learn those prefectures.

    You know, people always assume I've loved geography forever, but nope! I *hated* it in school, I was seriously awful at it! I didn't even know the 47 prefectures a year before starting GeoGuessr. Seriously, Tokyo and the nearby prefectures were all I knew, I couldn't tell you where anything was actually located. I knew Okinawa and Hokkaido, barely Aomori. That was about it! Seriously, I didn't even know the prefectural capitals.

    But, I've gotten better. Like, I only knew *that* much. I was terrible at it, but... wait, I *did* know Tottori and Shimane! Because of "Eagle Talon"! There was that bit where they said "Shimane is to the left of Tottori." Didn't they have something like that? I'm almost certain there was, it's the only reason I knew that much!

    Even "Momotetsu," I didn't really try to memorize anything from it. It's still fun even if you don't know the geography.

    So, I was terrible at geography. I knew absolutely nothing, but I didn't start GeoGuessr because I loved geography... no, I *liked* GeoGuessr! I got hooked on it, and for the sake of GeoGuessr, *I* started to learn! I knew the names of Chiba, Shiga, and Saga, but I only knew where Chiba was. The location of Shiga and Saga, I had no clue. Yeah, I knew the names, but not their locations. That was the past. I know them now!

    So, I'm someone who learned geography for GeoGuessr, so I don't have deep general knowledge... maybe. But, from GeoGuessr, I got hooked. I started to think, "Geography is actually interesting," and I re-took actual geography lessons. Do you know "Study Sapuri"? Like that app where you can take video lessons? You know, the one students use, that supplement to school classes?

    I subscribed to that! I relearned middle school geography! And it was paid! It cost quite a bit per year! I remember thinking "That's pretty expensive," but I was curious, so I went back to the basics.

    So I am learning the stuff, like "There's an industrial zone here..." and stuff like that. That actually really helps with GeoGuessr, you know? Because it's useful! Now, I haven't memorized everything completely - like regional specialties, I haven't memorized those at all yet—but like, the things for elementary/middle school, the stuff you learn in 4th grade of elementary school, like Japan's mountain ranges...
