    original: なんか、うちらさ、今までちゃんと裁はんとかできてたじゃん。
    english: Somehow, we were able to properly hold trials and stuff until now, right?
  - start: '03:26.780'
    end: '03:31.060'
    original: なんで急に暴力行使し始めたの？
    english: Why did you suddenly start resorting to violence?
  - start: '03:31.060'
    end: '03:32.480'
    original: え、結局それが一番強いからだよ。
    english: Well, because in the end that's the strongest.
  - start: '03:32.480'
    end: '03:40.160'
    original: それはさ、もう絶対にさ、あの論理的に自分たちが間違ってて、絶対に勝てないって分かってるからさ、暴力を行使したわけじゃん。
    english: That's because you knew logically you were in the wrong and couldn't
      possibly win, so you resorted to violence, right?
  - start: '03:40.160'
    end: '03:41.740'
    original: あ、そう、あ、それね、さっきソピアに説明したの。
    english: Ah, right, ah, I explained that to Sopia earlier.
  - start: '03:41.740'
    end: '03:43.080'
    original: 終わってるわ。
    english: It's over.
  - start: '03:43.340'
    end: '03:50.060'
    original: あの、それに対してソピアが聞いたことに対して明確な回答がなかったから、もう暴力でしか勝てないなって判断しました。
    english: Um, since Sopia didn't give a clear answer to what was asked, I judged
      that we could only win through violence.
  - start: '03:50.280'
    end: '03:52.540'
    original: 勝つ勝つじゃないじゃん！
    english: Winning or not winning isn't the point!
  - start: '03:52.680'
    end: '03:54.260'
    original: そうならじゃあ！
    english: If that's the case then!
  - start: '03:54.260'
    end: '03:56.560'
    original: そういうことじゃないんだよ！違うよ！
    english: That's not what this is about! That's wrong!
  - start: '03:56.560'
    end: '04:00.660'
    original: まずはごめんなさいしたら、あの時点でごめんなさいしたらソピア許してやるじゃん。
    english: First, if you apologized, if you apologized at that point, Sopia would've
      forgiven you, right?
  - start: '04:00.900'
    end: '04:05.740'
    original: そう、つっちゃん！でもさ、「ごめんなさい」してほしい、まっ、スライムボールも…
    english: That's right, Tsuchan! But you know, I want you to say "I'm sorry," well,
      the slimeball too...
  - start: '04:05.740'
    end: '04:10.740'
    original: お使いして来たからさ。あ、じゃあわかった、これ曲げる？はい、キノコ。
    english: I went running errands for it. Ah, then I got it, should I bend this?
      Here, a mushroom.
  - start: '04:10.820'
    end: '04:15.540'
    original: いや、その、そのキノコをさ、わしがと、あのキノコを取ってきて、
    english: No, that mushroom... I went and fetched that mushroom,
  - start: '04:15.540'
    end: '04:18.520'
    original: わしがキノコを上げて、あの主にご飯をあげようとしたじゃろ？
    english: and I gave the mushroom, trying to feed the master, right?
  - start: '04:18.520'
    end: '04:23.700'
    original: その相手にキノコをあげるのはだいぶ、だいぶちょっと主として残酷なんじゃないかなと私は思うんだけど。
    english: I think giving mushrooms to that person is pretty... pretty cruel as
      a master, you know.
  - start: '04:23.700'
    end: '04:28.160'
    original: お主がキノコで料理したのを上げたのを食べなかったじゃろ、お主？
    english: You didn't eat what I cooked with mushrooms, did you, master?
  - start: '04:28.160'
    end: '04:31.060'
    original: いや、食べたたかったんですけど、
    english: Well, I wanted to eat it, but...
  - start: '04:31.060'
    end: '04:34.900'
    original: 食べたかったんですけど、たまたまちょっと、ちょっと、ちょっと、ちょっと、待って待って待って。
    english: I wanted to eat it, but just happened to... wait, wait, wait, wait, wait.
  - start: '04:35.080'
    end: '04:38.380'
    original: 私、そのキノコ本当に、つづりの？わしが取ってきたやつじゃない？
    english: Me, is that mushroom really Tsuzuri's? Isn't it the one I fetched?
  - start: '04:38.380'
    end: '04:42.520'
    original: なんか、わしが取ってきたキノコをさ、拾って、死んだあとに拾ったやつだから、
    english: Like, the mushroom I fetched, picked up, the one we picked up after dying,
  - start: '04:42.520'
    end: '04:44.820'
    original: そうだよね？え、それをさ、なんか若い主の印にさ、
    english: right? Eh, and then, as a token for the young master,
  - start: '04:44.820'
    end: '04:52.540'
    original: わしがさ、あの、お主らのためにさ、取ってきたのをさ、つっちゃん？つっちゃん？
    english: I fetched it for you guys, Tsuchan? Tsuchan?
  - start: '04:52.540'
    end: '04:54.620'
    original: バケツしか持ってないよ、つっちゃん今。
    english: You only have a bucket, Tsuchan right now.
  - start: '04:54.820'
    end: '04:59.380'
    original: さっきからさ、悪い選択肢しかさ、その自己処理の対応が…
    english: From earlier, only giving bad choices, how to handle things yourself...
