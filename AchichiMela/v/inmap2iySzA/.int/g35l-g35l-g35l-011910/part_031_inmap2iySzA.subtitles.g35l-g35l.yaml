      this.
  - start: '03:59.200'
    end: '04:03.200'
    original: すごく便利にしてくれてる、つづいとキョーコがお家を。
    english: Tsuzuri and Kyoko are making the house super convenient.
  - start: '04:04.220'
    end: '04:06.000'
    original: あ、チェストとベッドどっちがいいかな？
    english: Ah, which is better, chest or bed?
  - start: '04:06.000'
    end: '04:09.420'
    original: 便利さと言うより、え、何？あの階段...
    english: Rather than convenience, eh, what? That stair...
  - start: '04:10.020'
    end: '04:13.200'
    original: マグマ、マグマなの？お疲れだったってる。
    english: Lava, is it lava? You were tired.
  - start: '04:13.200'
    end: '04:15.980'
    original: よいしょ、よいしょ、よいしょ、よいしょ。
    english: Heave-ho, heave-ho, heave-ho, heave-ho.
  - start: '04:26.540'
    end: '04:30.220'
    original: 割れなきゃいいって言った。うん、何もないよ。ソフィア何したの？何も言ってないよ。
    english: You said as long as it doesn't break it's fine. Yeah, there's nothing.
      What did you do, Sopia? You didn't say anything.
  - start: '04:31.420'
    end: '04:35.800'
    original: ハーフブロックで？あ、階段っていうか階段で...
    english: With half blocks? Ah, stairs or rather stairs...
  - start: '04:35.800'
    end: '04:37.980'
    original: 敷き詰めるのどっちがいいかな？
    english: Which is better to pave with?
  - start: '04:39.920'
    end: '04:43.760'
    original: 割れなきゃいいってどうやって付けるんだろうって言ってる。なんかしちゃったのかな？
    english: Saying 'how do you attach it if it shouldn't break?' Wonder if she messed
      something up?
  - start: '04:43.760'
    end: '04:45.760'
    original: でもソフィア頑張ってるからきっと大丈夫か。
    english: But Sopia is trying her best so she'll surely be fine.
  - start: '04:49.200'
    end: '04:51.340'
    original: できた！きれいなんじゃない、おにしら。
    english: Done! Isn't it pretty, Onishira?
