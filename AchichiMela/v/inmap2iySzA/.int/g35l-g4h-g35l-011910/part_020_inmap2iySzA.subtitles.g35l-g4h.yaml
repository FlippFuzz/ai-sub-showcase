    original: はいはい！今わし鉄持ってるから作ってみたいが…なんか…待てね、探すね！うん！
    english: Oh, right! I have iron right now, so I want to try making it... Hang
      on, let me look for it! Yeah!
  - start: '03:44.000'
    end: '03:50.000'
    original: 何ページ目だ？検索…なるほど？何ページ目だ？
    english: Which page is it? Search... I see? Which page is it?
  - start: '03:50.050'
    end: '03:56.000'
    original: 丸石を焼かなきゃいけないらしい！なんだって？丸石を焼くらしい！
    english: Apparently we have to smelt cobblestone! Say what? We have to smelt cobblestone!
  - start: '03:56.050'
    end: '04:01.000'
    original: 石…あ、来た！あ、やばい無理なんだから…
    english: Stone... Oh, got it! Oh no, it's impossible...
  - start: '04:01.500'
    end: '04:07.500'
    original: へー！丸石を焼けば石が出てくる！これ焼いたら怒られる？よいしょ。
    english: Whoa! Smelting cobblestone gives you stone! Will anyone get mad if I
      smelt this? Here goes.
  - start: '04:07.550'
    end: '04:12.000'
    original: ええーすごい！丸石焼いたらツルツルになったのじゃ！知らなかった！
    english: Whoa, amazing! Smelting cobblestone made it all smooth! I didn't know
      that!
  - start: '04:12.050'
    end: '04:17.000'
    original: えっ、すげえ！今石焼いてるから待っててね、お主ら！はーい！
    english: Whoa, awesome! I'm smelting stone right now, so wait up, everyone! Okay!
  - start: '04:17.500'
    end: '04:27.000'
    original: これで作れるっぽい！すごい！知らなかった！これでいいんじゃない？
    english: Looks like I can craft it with this! Amazing! I didn't know! This should
      work, right?
  - start: '04:28.000'
    end: '04:36.500'
    original: これで…てれてれてってー！できた！石切台！石切！
    english: With this... Ta-da! I made it! A stonecutter! Stonecutter!
  - start: '04:36.550'
    end: '04:45.000'
    original: ねえねえねえ、なんかさ、工場作る？家の外にさ…家の中に置く、こういうの？どうする？
    english: Hey, hey, hey, should we make a workshop? Outside the house, or... do
      we put this kind of thing inside the house? What should we do?
  - start: '04:45.050'
    end: '04:53.000'
    original: 一旦外に置いて、内装は後でとかにするか。床とかもおしゃれにしたいから。一旦ここ置くね！
    english: Let's put it outside for now and do the interior later. We want to make
      the floor look stylish too. I'll place it here for now!
  - start: '04:53.050'
    end: '05:00.000'
    original: これどうやって使うんだ？あ、すごい！危ない！刃が回転している！あ、すごい！左になんか置いたら…
    english: How do you use this? Oh, awesome! Watch out! The blade is spinning! Oh,
      cool! If you put something on the left...
