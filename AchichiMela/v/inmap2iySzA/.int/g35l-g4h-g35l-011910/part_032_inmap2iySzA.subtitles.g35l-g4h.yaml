    original: やめてください！あっちいけ！
    english: Stop it! Go away!
  - start: '03:53.400'
    end: '03:56.800'
    original: 消火して！消火して！はい！あれ？消火したのに！
    english: Put out the fire! Put out the fire! Here! Huh? I put it out, didn't I?!
  - start: '03:56.800'
    end: '04:01.200'
    original: 水がどっか行った！水消えた！水消えた？水消えた！
    english: The water went somewhere! The water disappeared! It disappeared? The
      water disappeared!
  - start: '04:02.500'
    end: '04:05.000'
    original: えっ、消火できなかった上手に
    english: Huh, I couldn't put it out properly.
  - start: '04:07.000'
    end: '04:08.900'
    original: 私の熱さが勝っちまったか
    english: Guess my fiery passion won out.
  - start: '04:08.900'
    end: '04:10.300'
    original: バケツはもう作ってるの？
    english: Did you already make a bucket?
  - start: '04:10.300'
    end: '04:11.600'
    original: バケツある！
    english: I have a bucket!
  - start: '04:11.600'
    end: '04:12.900'
    original: うんうんうん
    english: Mm-hmm.
  - start: '04:13.000'
    end: '04:18.500'
    original: あのねそぴあね、次にやることをお願いしていいなら頼みたいことがあるのじゃ
    english: Hey Sopia, if I can ask you what to do next, there's something I want
      to ask of you.
  - start: '04:18.500'
    end: '04:19.800'
    original: 何々何？
    english: What, what is it?
  - start: '04:19.800'
    end: '04:22.800'
    original: 今ここさ、土でさ、我々やってるじゃん？
    english: Right now we're doing this part with dirt, right?
  - start: '04:22.800'
    end: '04:27.200'
    original: ここ土じゃなくて、さっきあげたさ、これでやったらおしゃれじゃない？
    english: Instead of dirt here, wouldn't it be stylish if we used this stuff I
      gave you earlier?
  - start: '04:27.200'
    end: '04:30.800'
    original: あっ、確かに！こっちも同じようにするか！
    english: Oh, true! Should I do this side the same way?
  - start: '04:30.800'
    end: '04:33.400'
    original: 任せた！どのくらい持ってる、方解石？
    english: I'll leave it to you! How much calcite do you have?
  - start: '04:33.400'
    end: '04:39.200'
    original: えっとね、あとね、方解石…あ、でもまだ84個ぐらいある
    english: Let's see, I still have... oh, I still have about 84 calcite left.
  - start: '04:39.200'
    end: '04:42.800'
    original: ホント？じゃ一応もう1スタックあげる
    english: Really? Here, I'll give you another stack just in case.
  - start: '04:42.800'
    end: '04:45.400'
    original: あ、ありがとう！これでやろう！
    english: Oh, thanks! Let's use this!
  - start: '04:45.400'
    end: '04:47.000'
    original: うん、ほんならまた一周する
    english: Yeah, I'll go around again then.
  - start: '04:47.000'
    end: '04:48.600'
    original: あああ、水が！
    english: Aaaah, the water!
  - start: '04:48.600'
    end: '04:51.600'
    original: あ、大丈夫！あの、置いたらまた戻るから
    english: Oh, it's okay! If you place the block, it'll go back to normal.
  - start: '04:51.600'
    end: '04:52.800'
    original: あまり気にせず
    english: Don't worry too much about it.
  - start: '04:52.800'
    end: '04:56.000'
    original: 決壊した…あ、でもすげえ掘りづれえ
    english: It breached... ah, man, this is super hard to dig.
  - start: '04:56.800'
    end: '04:59.600'
    original: 掘りづれえ、順番ミスったか、よいしょ
    english: Hard to dig, huh. Guess we messed up the order. There.
