  - start: '02:59.800'
    end: '03:04.050'
    original: 頑張ってさ、あのキノコのとこまでさ、行ってさ、
    english: So I worked hard going all the way over to where the mushrooms were...
  - start: '03:04.100'
    end: '03:08.550'
    original: あの、喜んでくれるかなと思ってさ、帰ってきたんだけどさ、
    english: And I came back hoping it'd make you guys happy, and yet...
  - start: '03:08.600'
    end: '03:11.600'
    original: なんでさ、持ってるのに食べてくれないのじゃ？
    english: Why aren't you eating it even though you're holding it?
  - start: '03:11.600'
    end: '03:13.800'
    original: つづちゃん私も限界だよこれ…！
    english: Tsuzu-chan, I'm at my limit here...!
  - start: '03:13.800'
    end: '03:14.700'
    original: え？ あ、え？
    english: Huh? Wha, huh?
  - start: '03:14.700'
    end: '03:17.200'
    original: つづりも心が痛い…！
    english: My heart hurts too...!
  - start: '03:17.200'
    end: '03:18.350'
    original: え、そうだよね…
    english: Yeah, right...
  - start: '03:18.400'
    end: '03:19.800'
    original: わし… え？ えっ！？
    english: I... huh? Whaaat!?
  - start: '03:19.600'
    end: '03:24.300'
    original: ごめんね言おっか！ そぴあを見ながら優越しながらお肉食べちゃった！
    english: I'm sorry, let's confess! While watching Sopia, we felt superior and
      ate meat!
  - start: '03:24.300'
    end: '03:26.500'
    original: 先輩からもらったお肉食べました！
    english: We ate the meat our senpai gave us!
  - start: '03:26.500'
    end: '03:27.450'
    original: ええ！？
    english: WHAAAT!?
  - start: '03:27.500'
    end: '03:32.350'
    original: 最初に食べ…みんなで自給自足頑張ろうって今日、今日…
    english: Eating right off the... We said we'd all work hard to be self-sufficient
      today, today...
  - start: '03:32.500'
    end: '03:33.750'
    original: のじゃ？
    english: '...didn''t we?'
  - start: '03:33.800'
    end: '03:35.000'
    original: ごめんなさい！
    english: We're sorry!
  - start: '03:34.200'
    end: '03:37.500'
    original: 魔が、魔が差したっていうか…
    english: A moment of weakness just got to us...
  - start: '03:37.500'
    end: '03:39.200'
    original: のじゃ〜！
    english: Noja~!
  - start: '03:39.200'
    end: '03:40.300'
    original: お腹が空きすぎてて…
    english: We were just so hungry...
  - start: '03:40.300'
    end: '03:42.500'
    original: ごめんなさい！
    english: I'm so sorry!
  - start: '03:42.600'
    end: '03:45.200'
    original: え、そぴあはどうしてるの今？
    english: Wait, what is Sopia doing right now?
  - start: '03:45.200'
    end: '03:47.250'
    original: え、ずっとあそこで頑張ってる一人で。
    english: She's been working hard over there all by herself.
  - start: '03:47.300'
    end: '03:50.850'
    original: そぴあ、ご飯食べた？ お腹空いてない？
    english: Sopia, did you eat? Aren't you hungry?
  - start: '03:51.000'
    end: '03:53.200'
    original: あ、一応まだ焼き豚ある！
    english: Oh, I still have some cooked porkchops left!
  - start: '03:53.200'
    end: '03:54.800'
    original: あ、ほんとよかった〜！
    english: Oh, thank goodness~!
  - start: '03:54.800'
    end: '03:59.500'
    original: めらだけじゃん…めらがお腹空かせて…走れない！ 走れない！
    english: Then it was just me... I was starving and couldn't sprint! I couldn't
      sprint!
  - start: '03:59.500'
    end: '04:01.300'
    original: 食べなそれ食べて！
    english: Go eat! Eat that!
  - start: '04:00.200'
    end: '04:03.250'
    original: って言いながらさ…わしが作ったやつ…
    english: Saying that while I went and made this...
  - start: '04:03.300'
    end: '04:07.800'
    original: 正直、そん時うちらは落下しすぎてて…
    english: Honestly, at that moment we were taking way too much fall damage...
  - start: '04:09.000'
    end: '04:12.000'
    original: わし、腐った肉まで食べたよ！？
    english: I even ate rotten flesh, you know!?
  - start: '04:12.000'
    end: '04:15.500'
    original: 腐った肉まで食べて、もう走れないな、腐った肉も全部食べて、
    english: I ate rotten flesh and couldn't run anymore, ate every bit of rotten
      flesh...
  - start: '04:15.500'
    end: '04:18.350'
    original: でもみんなが食べ物…聞いてそぴあ！
    english: And still, for everyone's food... Listen, Sopia!
  - start: '04:18.400'
    end: '04:19.000'
    original: うん。
    english: Yeah.
  - start: '04:19.100'
    end: '04:24.300'
    original: あのね、わしが二人がお腹空いたっつったからね、遠くまで頑張って冒険してね、
    english: You see, because those two said they were hungry, I adventured far away
      and worked hard,
  - start: '04:24.400'
    end: '04:27.750'
    original: キノコを頑張っていっぱい探してね、キノコシチュー作ったの。
    english: searched everywhere for tons of mushrooms, and made mushroom stew.
  - start: '04:27.800'
    end: '04:29.000'
    original: うんうん。
    english: Uh-huh.
  - start: '04:29.100'
    end: '04:31.200'
    original: 渡したの。食べてくれないのじゃ！
    english: I gave it to them. And they won't eat it!
  - start: '04:31.200'
    end: '04:32.300'
    original: なんで！？
    english: Why!?
  - start: '04:32.300'
    end: '04:34.200'
    original: なんでだと思う！？
    english: Why do you think!?
  - start: '04:34.200'
    end: '04:36.800'
    original: 謎謎…謎謎なのじゃ…
    english: What a mystery... Truly a mystery...
  - start: '04:36.900'
    end: '04:38.800'
    original: おかしいのじゃねぇ…
    english: How strange...
  - start: '04:38.800'
    end: '04:41.050'
    original: マイクラの謎謎なのじゃ！
    english: It's one of Minecraft's great mysteries!
  - start: '04:41.100'
    end: '04:42.400'
    original: なんでのじゃかね？
    english: Why could it be?
  - start: '04:42.400'
    end: '04:48.000'
    original: 待ってあのさ、キノコってさ、必ずしもね、いいキノコだけじゃないんだよめらっち。
    english: Wait, you know, mushrooms aren't always good mushrooms, Mela-cchi.
  - start: '04:48.000'
    end: '04:50.250'
    original: え、でもこれは食べれるキノコシチューなんだけど…
    english: Huh, but this is edible mushroom stew...
  - start: '04:49.800'
    end: '04:51.800'
    original: よかった、そぴあそぴあ、こっち側だ。よし。
    english: Nice, Sopia's on our side. Alright!
  - start: '04:51.800'
    end: '04:53.100'
    original: こっち側、そっち側！
    english: On our side, on your side!
  - start: '04:53.100'
    end: '04:58.250'
    original: でもわしは自分で食べて安全を確認した上で、お腹空いてるだろうと思ってあげたの！
    english: But I ate some myself first to make sure it was safe, and gave it to
      you thinking you were hungry!
  - start: '04:58.300'
    end: '05:00.000'
    original: ほんならいいか。いや毒キノコか…
    english: Then it's fine, right? Wait, or is it a poisonous mushroom...
