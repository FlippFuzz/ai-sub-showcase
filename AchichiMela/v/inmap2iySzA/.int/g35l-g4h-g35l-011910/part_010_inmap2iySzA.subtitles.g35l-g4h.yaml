  thoughts:
  - |-
    {
      "summary": "**Focusing on the Stream and Gameplay**\n\nAlright, let's get this stream rolling! Thinking through the audio setup, deciding between in-game voice chat or Discord... Discord? I was considering which to use today. I'd been waffling on whether to stream using Discord's voice chat today, because when we're far apart, if we split up two-and-two, our conversations might get all mixed up, so today, I intentionally set it up like this. Now, let's dive into this Minecraft session and our goal today: Building a base, adventure! Looks like we are out of wood already! As expected, when it comes to wood, perhaps I should go chop down a bunch of trees then? I want to go chop a ton of trees, but honestly, in this nighttime darkness, I wonder how wise it is to go logging. Should I sleep for a bit? If I get in bed, will someone else sleep too? Nobody's sleeping? So we're not sleeping then. Got it. So, what should I do for now? Hmm... Maybe I'll make a chest or something. I don't really want to go somewhere too dark... I don't wanna go into the dark because it's scary. Ah, see? There are spiders and stuff out there. It's fine, though. What's missing? Everything. We seriously have nothing. I used it all up making coal. Made some charcoal instead. Ahh! Sopia got sniped! Hey, won't you guys sleep? Are you not sleeping? Oh, we can skip the night! What's a Bogged? What is a Bogged? What even is a Bogged? True, I could just go kill spiders. Still, will I run into enough spiders to collect string and craft wool? Anyway, I realized we need a ton of wood, so I'm thinking of gathering a bunch... Wasn't there a spider? There it is. Take that! And that! Hup! Hup! Hup! Hup! Spider string. Whenever I get the chance. First, I want to do some hyper axe time, so I need wood for axe time. Looks like I have some coal. And magma blocks! What is this place? A lot of coal! We didn't need to craft so much charcoal after all! It turns out Tsuzuri has 0 deaths, while Sopia died! That's really great, not that I'm glad Sopia died, but it's nice that Tsuzuri is doing well, because he's a reliable strong guy. I'm going to give some stuff to Kyoko later. Got a lot of coal! And now, time to return home.\n\nAfter looking at the chat I will check that magma block... Wait, moving on 1 heart is amazing!\n\nIt seems there were no sheep around. So, let's head back.",
      "detected_musical_performances": []
    }
