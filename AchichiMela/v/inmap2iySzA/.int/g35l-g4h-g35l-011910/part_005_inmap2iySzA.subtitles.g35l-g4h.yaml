  - start: '03:02.600'
    end: '03:04.200'
    original: 目合わせたら追いかけてくる
    english: If you make eye contact, it'll chase you.
  - start: '03:04.200'
    end: '03:06.200'
    original: え、なんかあった？石！
    english: Huh, did you find something? Stone!
  - start: '03:06.200'
    end: '03:09.600'
    original: あ、そう！さっきさツルハシ作った、キョーコ？
    english: Oh, right! Did you make a pickaxe earlier, Kyoko?
  - start: '03:09.600'
    end: '03:11.000'
    original: 作ったよ！
    english: I did!
  - start: '03:11.000'
    end: '03:18.500'
    original: そのツルハシで石を取ると、石のツルハシとか石の〇〇みたいなのを作れるようになるから
    english: If you mine stone with that pickaxe, you'll be able to craft stone pickaxes
      and other stone tools.
  - start: '03:18.500'
    end: '03:20.800'
    original: 石、得。文明が発展する！
    english: Stone is great. Civilization advances!
  - start: '03:20.800'
    end: '03:22.400'
    original: え、じゃあいっぱい取ろう！
    english: Oh, then let's mine a bunch!
  - start: '03:22.400'
    end: '03:26.800'
    original: え、これ何、シャベルやっけ、ツルハシやっけ？ツルハシ！
    english: Wait, which one is this, a shovel or a pickaxe? A pickaxe!
  - start: '03:26.800'
    end: '03:31.200'
    original: え、この辺の石でさ、お家作ったら可愛いんじゃない？お城
    english: Hey, wouldn't it be cute if we built a house out of this stone? A castle.
  - start: '03:31.200'
    end: '03:38.200'
    original: このさ、白っぽいやつでさ、アジト作ったらさ、泥で作るよりもさ、可愛いんじゃない？
    english: If we built our hideout out of this whitish stuff, wouldn't it be cuter
      than building it out of dirt?
  - start: '03:38.200'
    end: '03:42.500'
    original: なんかちょっと鉄筋コンクリート製的な感じで。そうそうそうそう
    english: Kind of like reinforced concrete. Yeah, yeah, yeah!
  - start: '03:42.500'
    end: '03:45.600'
    original: へー。なんかカラフルにしたいな
    english: Ooh. I kind of want to make it colorful.
  - start: '03:45.600'
    end: '03:48.300'
    original: たしかに。あ、たしかにカラフルにしたい
    english: True. Oh yeah, I want to make it colorful too.
  - start: '03:48.300'
    end: '03:51.000'
    original: 柱がこうネズミ色でみたいな。はいはいはい！
    english: With the pillars in gray like this. Yeah, yeah, yeah!
  - start: '03:51.000'
    end: '03:58.200'
    original: で、屋根がその白の...まぁなんか大理石みたいな感じのやつでみたいな。うーん、なるほどね
    english: And the roof made of that white... kind of marble-looking stuff. Mmm,
      I see.
  - start: '03:58.200'
    end: '04:03.200'
    original: さっきのさ、ヒツジをさ、倒すとさ羊毛がドロップするんじゃけど
    english: Earlier, when you defeat a sheep, it drops wool,
  - start: '04:03.200'
    end: '04:08.000'
    original: あの、まあ羊毛で家作ると燃えちゃうんだけど火事の時
    english: and, well, if you build a house out of wool, it'll burn down in a fire,
  - start: '04:08.000'
    end: '04:10.000'
    original: え、そうなんだ
    english: Oh, really?
  - start: '04:10.000'
    end: '04:19.000'
    original: でも、あの、カラフルになるよ！いろんなカラフルなヒツジを集めて、いろんなカラフルなヒツジの箱を組み合わせてくとカラフルな家になるのじゃ
    english: but it'll be colorful! If you gather all sorts of colorful sheep and
      combine the different colorful blocks from them, it'll become a colorful house!
  - start: '04:19.000'
    end: '04:21.500'
    original: えー、超おしゃれじゃん！
    english: Whoa, that's super stylish!
  - start: '04:21.500'
    end: '04:24.300'
    original: え、なんかうちらの色のさ、なんか家にしない？
    english: Hey, why don't we make a house in our colors?
  - start: '04:24.300'
    end: '04:27.500'
    original: したーい！わーい！したいなぁ
    english: I want to! Yay! That sounds fun.
  - start: '04:27.500'
    end: '04:31.800'
    original: あとなんかコンクリートみたいなのも確か作れて、それで
    english: Also, I'm pretty sure you can make something like concrete, and with
      that...
  - start: '04:31.800'
    end: '04:36.200'
    original: お花、お花から着色料みたいなの取って、うん
    english: Flowers... you get like coloring from flowers, yeah.
  - start: '04:36.200'
    end: '04:43.000'
    original: 染料かな？それでお花の色に染められるから、我々の色のコンクリートとか作ったりもできるはずなのじゃ
    english: Dye, I think? You can dye it the color of the flowers, so we should be
      able to make concrete in our colors too.
  - start: '04:43.000'
    end: '04:45.000'
    original: おお、なんかねー。作りたい！
    english: Ooh, nice. I want to make that!
  - start: '04:45.000'
    end: '04:47.500'
    original: 粘土でもカラフルなブロック作れるらしい。いっぱい掘ってるよ！
    english: Apparently you can make colorful blocks from clay too. I'm digging a
      ton!
  - start: '04:47.500'
    end: '04:55.500'
    original: そう粘土とかあと、なんかちょっとバイオームのこの辺ではないけど、あるか分かんないけど、テラコッタみたいなのも...
    english: Yeah, clay, and also—it's not in this biome around here, or I don't know
      if there is any, but—stuff like terracotta too...
  - start: '04:55.500'
    end: '04:57.400'
    original: 石のツルハシにする
    english: I'm making a stone pickaxe.
  - start: '04:57.400'
    end: '05:00.000'
    original: うおー、文明進んだ！いいな文明
    english: Whoa, civilization has advanced! Gotta love civilization.
