    (00:07.180 - 00:37.250) Sopia and I are wondering where the warm-color team went. We decide that we also want an adventure. Then, we spot something, and Sopia gets all excited about it, even though she can't quite articulate exactly *what* she wants to find!  Ah, Team Warm Colors is back! Sopia then asks me what we should do about the magma.  I'm pondering about laying the magma down... should we make a separate little space for it, or just dig down a bit and pour it in?

    (00:37.000 - 01:17.200) I’m bouncing ideas off Sopia! Should we put a divider, like where I’m standing?  Or maybe a fence? She likes the fence idea but then I suggest lowering the ground a level and pouring magma in there... Ooh, she's into the idea of making it look like stairs!

    (01:17.500 - 01:51.050) Perfect! I think making this a stair situation, and making the stairs match the new magma, that's what makes sense. Then, should we change the flowers? It looks like we'll be changing those flowers.

    (01:51.500 - 02:04.450) Then, Sopia and I are thinking about magma hunting!

    (02:04.800 - 02:37.250) Magma is in the Nether, right? Kyoko wants to make stairs, too.  We're deciding if we can get magma to create them, but it's a big expedition.  So we need to work together. And that means a team discussion! We are still figuring out the look.

    (02:38.200 - 03:20.450) We're working on the stairs! Kyoko's leading the charge, but Sopia and I are chiming in.  It's a group effort!  We are starting to figure out what type of stairs will look the best.

    (03:20.500 - 03:55.900) Hm, this design feels more rich. Should we go with the more exciting stairs or something simpler?  We try a few things! We will try it this way. Then, magma is in the plan!  Sopia wants to go on a magma hunt!

    (03:56.000 - 04:58.450) Yes, magma-hunting is the name of the game! We start picturing the place, all sparkly and eye-catching with this magma. It would look amazing at night, too. We even get this idea to drip magma and water from the roof!  I'm picturing water and magma, cool and warm!  We're all so excited! We're thinking that this is a great way to represent the cool colors and warm colors.

