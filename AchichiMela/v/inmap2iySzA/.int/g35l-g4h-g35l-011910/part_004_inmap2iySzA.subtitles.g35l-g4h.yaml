  - start: '04:43.850'
    end: '04:46.750'
    original: そっちにもいるんだ。火いっぱいあるのにね。ね。
    english: They're over there too. Even though there are tons of torches. Right.
  - start: '04:46.750'
    end: '04:53.500'
    original: 今日はね、やっぱホロ鯖はかなりもう、なんじゃろ、文明が進んでいて…
