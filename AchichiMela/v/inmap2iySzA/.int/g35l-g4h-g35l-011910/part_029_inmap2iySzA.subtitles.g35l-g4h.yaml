  - start: '04:25.200'
    end: '04:26.100'
    original: あ、終わった！
    english: Oh, I'm done!
  - start: '04:26.150'
    end: '04:29.400'
    original: わかった、やりたいことが理解したのじゃ。
    english: Got it, I understand what I want to do now!
  - start: '04:29.500'
    end: '04:43.700'
    original: こうして、えーっと...こう？こう？磨かれた閃緑岩作り、石で、切り...
