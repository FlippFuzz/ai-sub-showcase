  - start: '04:19.200'
    end: '04:20.600'
    original: あ、本当だ、見える！
    english: Oh, you're right, I can see it!
  - start: '04:20.650'
    end: '04:21.700'
    original: こうして...
    english: Like this...
  - start: '04:21.750'
    end: '04:23.600'
    original: しゃがんで...オッケー！
    english: Crouch... okay!
  - start: '04:24.800'
    end: '04:25.800'
