  - start: '04:45.200'
    end: '04:46.500'
    original: こうして...
    english: Like this...
  - start: '04:48.550'
    end: '04:49.800'
    original: 閃緑岩...
    english: Diorite...
  - start: '04:49.900'
    end: '04:51.500'
    original: めらちん、寝ようぜ！
    english: Mela-chin, let's sleep!
  - start: '04:51.550'
    end: '04:54.300'
    original: あ、寝たい！寝るのじゃ！よいしょ。
    english: Oh, I wanna sleep! Time for bed! Ups-a-daisy.
  - start: '04:54.350'
    end: '04:55.500'
