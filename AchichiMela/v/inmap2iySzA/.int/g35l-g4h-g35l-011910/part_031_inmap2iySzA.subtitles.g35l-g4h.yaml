    *   **03:00.000 - 03:50.500:** The interior design discussion begins, with a little banter about calling each other "san." It gets turned into a joke! The others are planning a storage room or something. I'm like a construction supervisor! It's satisfying to watch the base get built. Tsuzuri and Kyoko are making things easier. They are making all of the necessary things in the base, while I worry about the Magma!

