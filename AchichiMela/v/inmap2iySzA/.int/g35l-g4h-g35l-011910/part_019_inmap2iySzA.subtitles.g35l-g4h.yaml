    Hololive server by the newly debuted unit 'Asobi★Mawari-tai', consisting of Achichi
    Mela, Sorashina Sopia, Suzuna Tsuzuri, and Hyakuto Kyoko. The group gathers in-game
    for the first time to explore, gather resources, discover a rare amethyst geode,
    and build a luxurious base/abyss-themed headquarters together. Along the way,
    they engage in comedic roleplay, land-leveling (seichi), branch mining, and playful
    group bickering over food and building materials.
