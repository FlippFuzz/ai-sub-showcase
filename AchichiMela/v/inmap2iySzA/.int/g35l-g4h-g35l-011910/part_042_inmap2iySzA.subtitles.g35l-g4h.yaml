    original: わしサラマンダーじゃけどマイクラの世界じゃ関係ないからな、そんなの
    english: I'm a salamander, though in Minecraft's world that doesn't matter at
      all.
  - start: '03:48.600'
    end: '03:50.600'
    original: ね、エンチャントされてるね
    english: Look, they're enchanted.
  - start: '03:51.400'
    end: '03:53.800'
    original: バケツもっと作った方が効率よくない？
    english: Wouldn't it be more efficient to make more buckets?
  - start: '03:53.900'
    end: '03:57.600'
    original: なんかね、鉄があんまないんだよね！あんまないのと…
    english: Well, we don't really have much iron! We don't have much, and...
  - start: '03:58.800'
    end: '04:04.200'
    original: 今ある分使っちゃっていいのかな、ダイヤとか掘りに行くなら残しといた方がいいだろうし、と思って
    english: I wondered if it's okay to use up what we have now, since we should probably
      save some if we're going mining for diamonds and stuff.
  - start: '04:05.800'
    end: '04:08.800'
    original: そう、あんまないんだよね、そもそもがね
    english: Yeah, we don't have much in the first place.
  - start: '04:16.000'
    end: '04:17.200'
    original: ご飯食べたい
    english: I want to eat food.
  - start: '04:17.250'
    end: '04:18.500'
    original: あるかな？
    english: Is there any?
  - start: '04:18.550'
    end: '04:20.200'
    original: ね！ご飯ないよねー
    english: Right! There's no food!
  - start: '04:20.250'
    end: '04:22.000'
    original: そう、全然なくてさ、やばいんだよね
    english: Yeah, there's none at all, it's really bad.
  - start: '04:22.200'
    end: '04:23.600'
    original: 腐った肉しかない
    english: There's only rotten flesh.
  - start: '04:23.800'
    end: '04:25.100'
    original: いやそうなんだよ、うちも
    english: Yeah, same here.
  - start: '04:25.150'
    end: '04:29.800'
    original: でもそぴあがキノコ作ってくれてる。でなんかその途中でさ、ご飯いたら捕まえてこようと思いつつ…
    english: But Sopia is growing mushrooms for us. And on the way, I was thinking
      if I saw any food I'd catch it...
  - start: '04:31.500'
    end: '04:32.800'
    original: ちょっと探してみるわ
    english: I'll go look around a bit.
  - start: '04:33.200'
    end: '04:35.300'
    original: あれ？めらっちなんかズボン履いてる？
    english: Huh? Mela-cchi, are you wearing pants?
  - start: '04:35.350'
    end: '04:39.200'
    original: そう、奪ってきた、さっき倒したやつから
    english: Yeah, I looted them from the guy I beat up earlier.
  - start: '04:41.000'
    end: '04:44.000'
    original: そんなことできんだ。え、キノコシチューってどうやってたら食べれるんだっけ？
    english: You can do that? Hey, how do you make mushroom stew so we can eat it?
  - start: '04:44.500'
    end: '04:45.600'
    original: キノコシチュー？
    english: Mushroom stew?
  - start: '04:45.800'
    end: '04:46.800'
    original: わからないなあ
    english: I don't know.
  - start: '04:46.900'
    end: '04:49.900'
    original: なんかさ、スープみたいなのが作れるはずでさ
    english: Like, you're supposed to be able to make some kind of soup...
  - start: '04:50.500'
    end: '04:51.600'
    original: うんうんうん
    english: Yeah, yeah, yeah.
  - start: '04:52.400'
    end: '04:53.300'
    original: あぶな！
    english: Whoa, close!
  - start: '04:53.400'
    end: '04:55.500'
    original: え、なんかキッチンとかあんのかな
    english: Huh, is there like a kitchen or something?
  - start: '04:57.000'
    end: '04:57.900'
    original: あぶな！
    english: Whoa, close!
  thoughts:
  - "Here's my summary, as though I were thinking it:\n\n**Summary of My Thoughts\
    \ on the Minecraft Project**\n\nOkay, so we're building this base, right? I'm\
    \ assessing the situation.  First, this magma perimeter... is it really a good\
    \ idea?  I mean, if someone falls in, it's game over. There's no way to climb\
    \ out.  I'm worried about getting trapped in there.  I actually think not surrounding\
    \ it would be safer, if you fall in you might have a chance to get out. But it's\
    \ decided!\n\nAnd then, Kyoko brings up how the interior's taking a backseat because\
    \ we were too picky. Mela's right, though, it's dangerous, but it's okay because\
    \ it's for the warm and cool colours! Is it really me that came up with the magma\
    \ idea? I can't quite remember if it was Sopia or not... Even if I did, it's not\
    \ a crazy idea.\n\nOh well, let's get some sleep. The rain is gone! Now Kyoko\
    \ chimes in - is it \"noja?\" Let's work on this perimeter! Magma for the base,\
    \ dangerous maybe but it makes sense because of the colour choices! I want to\
    \ get some more magma... oh right, that looks like it might be edible. Is that\
    \ a food source? Nope. I'm hungry. Only got rotten flesh. Need to find real food\
    \ ASAP!\n\nI'm starving!  I really need to eat.  No, I need to find something!\
    \ No point in fighting now, it's fine. Oops, it's receding. Almost done... so\
    \ hungry, I want to eat!  Need food! It'd be nice if there were sheep or something.\
    \  I can use these leggings I looted from that guy... oh, it's hot! I'm a salamander,\
    \ so it doesn't matter!  Oh, they're enchanted! \n\nKyoko's right, we should make\
    \ more buckets, but we don't have much iron! Should we use what we have? Got to\
    \ save some!  I'm really hungry. There's no food around?  I only have rotten flesh.\
    \ Kyoko's the same! But Sopia's making mushrooms, so I'll go and look for something\
    \ to eat.  Wow, am I wearing pants? Yeah, looted them. So, how do you make mushroom\
    \ stew? There should be some kind of soup. Oops, careful! Is there a kitchen?\
    \ Careful!"
