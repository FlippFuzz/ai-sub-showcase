    original: うん、そぴあが。
    english: Yeah, Sopia did.
  - start: '03:11.200'
    end: '03:15.500'
    original: あれ？なんかつづり... さっきさ、投げてくれたやつさ、受け取れなかったのじゃ。
    english: Huh? Wait, Suzuri... I couldn't pick up the thing you threw earlier.
  - start: '03:15.500'
    end: '03:16.400'
    original: あ、本当だ。はい。
    english: Ah, you're right. Here.
  - start: '03:17.800'
    end: '03:19.800'
    original: あ、もらえた！ありがとうなのじゃ！
    english: Ah, got it! Thank you!
  - start: '03:19.800'
    end: '03:20.900'
    original: はい、そぴあ。
    english: Here, Sopia.
  - start: '03:21.000'
    end: '03:22.000'
    original: あ、やったー！
    english: Ah, yay!
  - start: '03:23.900'
    end: '03:25.000'
    original: あ、ありがとう。
    english: Ah, thank you.
  - start: '03:25.100'
    end: '03:25.900'
    original: うん。
    english: Uh-huh.
  - start: '03:27.200'
    end: '03:38.200'
    original: え、なんかに、なんかに、つづりがね、全然ね、なんかに、倒そうとしないの。そぴあにだって手を汚させようとするの。だからそぴああんな死んでたの？
    english: Wait, for some reason, Suzuri wouldn't try to kill anything at all. She
      was trying to get Sopia to dirty her hands! Is that why Sopia died so much?
  - start: '03:38.300'
    end: '03:41.700'
    original: そういうことか！つづりだけ死ななかったのはそぴあが先に行ったからってこと？
    english: Is that what happened?! So Suzuri didn't die only because Sopia went
      in first?
  - start: '03:41.800'
    end: '03:45.300'
    original: 違う違う、牛とかに襲われてないでしょ、そぴあ！
    english: No, no, it's not like Sopia was getting attacked by cows!
  - start: '03:45.300'
    end: '03:48.300'
    original: それはそう！それはそう！
    english: That's true! That's true!
  - start: '03:48.300'
    end: '03:52.700'
    original: え、でもなんかずるいよね！なんかそぴあにだけ手を血で染めさせてね！
    english: But still, that's kind of unfair! Making only Sopia stain her hands with
      blood!
  - start: '03:53.500'
    end: '04:00.600'
    original: え、わかんない。わしその場を見てないから、あの、正しい判断をしてあげられないかも。
    english: Well, I don't know. I didn't see it happen, so I might not be able to
      make a fair judgment.
  - start: '04:00.600'
    end: '04:01.800'
    original: あ、すごい！ちゃんとした判事だ！
    english: Wow, incredible! She's like a proper judge!
  - start: '04:02.000'
    end: '04:08.800'
    original: その場をわしちょっと見てないから、あんまり無責任なことは言えないんじゃけど...
    english: Since I didn't see what happened, I can't say anything irresponsible,
      but...
  - start: '04:08.800'
    end: '04:09.900'
    original: めらちー！
    english: Mela-chi!
  - start: '04:10.000'
    end: '04:11.800'
    original: あ！みんな帰ってきたよ！
    english: Ah! Everyone's back!
  - start: '04:11.900'
    end: '04:16.100'
    original: あ、アメジスト！え！見つけた、もしかして？
    english: Ah, amethyst! Wait, did you find one?!
  - start: '04:16.200'
    end: '04:19.400'
    original: 行こう！見に行こう、見に行こう！アメジストの鉱脈見つけたの？
    english: Let me go check, let me go check! You found an amethyst vein?!
  - start: '04:19.500'
    end: '04:21.800'
    original: あ、待って！危ない！危ないから気をつけて！
    english: Ah, wait! It's dangerous! Be careful!
  - start: '04:21.800'
    end: '04:22.500'
    original: はい！
    english: Okay!
  - start: '04:22.500'
    end: '04:26.000'
    original: あのね、私落ちたの！落ちたの！笑った。
    english: You see, I fell down! I fell! LOL.
  - start: '04:26.100'
    end: '04:29.600'
    original: 落ちて、あの垂直にブロックを立てながら帰ってきたの。
    english: I fell down, and then built blocks vertically straight up to get back.
  - start: '04:29.600'
    end: '04:30.400'
    original: なるほど。
    english: I see.
  - start: '04:30.500'
    end: '04:31.900'
    original: そう、だから気をつけて！
    english: Yeah, so be careful!
  - start: '04:33.000'
    end: '04:34.000'
    original: ああ、なるほど！
    english: Ah, I see!
  - start: '04:34.200'
    end: '04:39.900'
    original: いや、そうなんだよね！アメジストのところってね... え、でもね、この周りのね、やつ綺麗だよ！
    english: Yeah, that's true! Amethyst spots are like that... But hey, the blocks
      around it look so pretty!
  - start: '04:40.000'
    end: '04:43.000'
    original: これツブツブ、これツブツブ見っけだ！
    english: I found grainy ones, grainy ones!
  - start: '04:43.000'
    end: '04:44.000'
    original: ツブツブって何？
    english: What do you mean by grainy?
  - start: '04:44.000'
    end: '04:45.000'
    original: 石炭でしょ？
    english: You mean coal?
  - start: '04:45.000'
    end: '04:46.800'
    original: あ、そう石炭！そうそうそう！
    english: Ah, yeah, coal! Right, right, right!
  - start: '04:47.000'
    end: '04:48.300'
    original: これも取っていこう！
    english: Let me mine this too!
  - start: '04:48.500'
    end: '04:50.800'
    original: アメジストブロックは... 多分...
    english: The amethyst blocks... probably...
  - start: '04:50.800'
    end: '04:51.900'
    original: こ、この辺危ないよ！
    english: Th-This area is dangerous!
  - start: '04:51.900'
    end: '04:59.800'
    original: うん、危ない、危ないんだけど、白いとこ... 白の層の中にアメジストがあったから、紫のを掘らなきゃ大丈夫！
    english: Yeah, it's dangerous, but inside the white layer... the amethyst was
      inside the white layer, so as long as we don't mine the purple blocks, we'll
      be fine!
