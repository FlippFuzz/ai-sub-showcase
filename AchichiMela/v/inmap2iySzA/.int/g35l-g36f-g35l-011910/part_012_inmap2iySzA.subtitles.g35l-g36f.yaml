      this early on.
  - start: '03:46.000'
    end: '03:49.000'
    original: えーすごい！鉄より先に見つかっちゃったよ。
    english: Woah, awesome! We found it even before finding iron!
  - start: '03:49.000'
    end: '03:53.000'
    original: 鉄より先に見つけるはあんまりないかも。
    english: Finding it before iron might be pretty rare.
  - start: '03:54.000'
    end: '03:58.000'
    original: ご利益担当だった？キョーコ、もしかして。
    english: Were you in charge of good fortune? Kyoko, maybe?
  - start: '03:58.000'
    end: '04:02.000'
    original: キョーコご利益担当の可能性ある。
    english: Kyoko might be in charge of bringing good fortune.
  - start: '04:02.000'
    end: '04:06.500'
    original: メラチのご利益あずかってここまで来たかも、もしかしたら。確かにその可能性だってある。
    english: Maybe I absorbed Melachi's blessing and made it this far. Indeed, that
      possibility exists too.
  - start: '04:06.500'
    end: '04:11.500'
    original: メラチやっぱバフタイプ。バフタイプの…
    english: Melachi is definitely a buff type. A buff-type blessing...
  - start: '04:12.000'
    end: '04:18.000'
    original: え、めっちゃ綺麗な石がいっぱい集まる。え、すごい！タワマンみたいな家作れるよ、おもしろ。
    english: Eh, so many pretty stones are gathering. Woah, awesome! We can build
      a house like a high-rise tower, funny.
  - start: '04:19.000'
    end: '04:22.000'
    original: 大丈夫？痛かった？大丈夫？
    english: Are you okay? Did that hurt? Are you okay?
  - start: '04:23.000'
    end: '04:27.000'
    original: 暗い、暗い。すごい暗いの。なんか安全に横に掘っていける場所ないかな？
    english: It's dark, dark. It's super dark. Isn't there anywhere we can safely
      mine sideways?
  - start: '04:27.000'
    end: '04:31.000'
    original: ここにしよ。あ、でもメラチがいるから…
    english: Let's do here. Ah, but since Melachi is here...
  - start: '04:31.000'
    end: '04:38.000'
    original: あ、でもここアレだ、アビスに繋がってるか？アビス！アビスに繋がってるの…
    english: Ah, but wait, is this connected to the abyss? Abyss! It's connected to
      the abyss...
  - start: '04:38.000'
    end: '04:44.000'
    original: え、アビスもさ、装備揃えて行きたいね。鉄とかでさ、防具とか作ってさ。
    english: Eh, we'll want to go to the abyss after gearing up, right? Making armor
      from iron and stuff.
  - start: '04:44.000'
    end: '04:50.000'
    original: 鉄の剣とかもわしらで作ってさ、そのあと行きたいな。
    english: Making iron swords ourselves and going after that.
  - start: '04:50.000'
    end: '04:53.000'
    original: ここで鉄の剣作れるもんね。鉄見つけた、鉄見つけた！やった！
    english: We can make iron swords here. Found iron, found iron! Yay!
  - start: '04:53.000'
    end: '04:57.000'
    original: ナイスナイス！ナイス！全部とって！
    english: Nice, nice! Nice! Take all of it!
  - start: '04:57.000'
    end: '05:00.000'
    original: すごーい！え、超順調…
    english: Awesome! Woah, super smooth...
