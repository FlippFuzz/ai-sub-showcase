    Super vast nature! And tons of mushrooms. Awesome! This area is looking super nice. Okay, nobody owns this place yet, it's free real estate! And it's pretty flat, too! That is super helpful. No need to level the land too much. I love land leveling! Oh, nice! Let's clear the grass! If we fill in these holes, we can make it into a super flat space. Ah, that's great! Let's make it flat with dirt first! Okay, got it! We dig some dirt up. But this place is wet, a swamp apparently. That might be bad for equipment. So we should not bring equipment here. Is the ground foundation bad too? What's up with the ground, I wonder?

