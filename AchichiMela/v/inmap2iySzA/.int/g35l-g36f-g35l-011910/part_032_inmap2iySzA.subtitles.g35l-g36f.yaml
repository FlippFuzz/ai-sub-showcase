    original: 消火できなかった、上手〜に。
    english: I couldn't extinguish it properly.
  - start: '04:06.000'
    end: '04:08.500'
    original: 私の熱さが勝ってしまったか。
    english: Did my heat win out?
  - start: '04:08.500'
    end: '04:10.500'
    original: バケツある。おお。
    english: I have a bucket. Oh.
  - start: '04:13.500'
    end: '04:19.000'
    original: あのね、ソピアね、もしついでにさ、やることをお願いしていいなら、頼みたいことがあるのじゃ。
    english: You know, Sopia, if you could do one more thing while you're at it, there's
      something I'd like to ask of you.
  - start: '04:19.000'
    end: '04:24.000'
    original: 今ここさ、土でさ、我々やってるジャン？
    english: Right now, we're doing this area with dirt, right?
  - start: '04:24.000'
    end: '04:27.500'
    original: ここ土じゃなくてさっきあげたさ、これでやったらオシャレじゃない？
    english: Instead of dirt, wouldn't it be stylish if we used what I just gave you?
  - start: '04:27.500'
    end: '04:30.500'
    original: 確か！こっちも同じようにするか。
    english: Indeed! Should I do the same over here?
  - start: '04:30.500'
    end: '04:33.500'
    original: どれだけ持ってる？方解石。
    english: How much calcite do you have?
  - start: '04:33.500'
    end: '04:39.000'
    original: えーっとね、あとね、方解石、あ、でも、まだ84個ぐらいある。
    english: Umm, calcite, ah but, I still have about 84 left.
  - start: '04:39.000'
    end: '04:42.500'
    original: ほんと？じゃあ1スタックあげる。
    english: Really? Then I'll give you one stack.
  - start: '04:42.500'
    end: '04:44.500'
    original: あ、ありがとう！これでやろう。
    english: Ah, thank you! Let me do it with this.
  - start: '04:44.500'
    end: '04:47.500'
    original: うん、ほなまた移転する。あー！水が！
    english: Yeah, then I'll move it again. Ah! Water!
  - start: '04:47.500'
    end: '04:51.500'
    original: あ、大丈夫。置いたらまた戻るから。あまり気にせず...
    english: Ah, it's fine. If you place it, it'll revert. Don't worry too much...
  - start: '04:51.500'
    end: '04:56.500'
    original: 決壊した。あ、でも、すげえ掘りすれ...
    english: It burst! Ah, but it's super easy to dig...
  - start: '04:57.000'
    end: '05:00.000'
    original: 順番ミスったか？よいしょ。
    english: Did I mess up the order? Yoisho.
