  - start: '03:21.000'
    end: '03:24.400'
    original: その前、でも今日の昼にもう羊探しに行きたくない？
    english: Before that, don't you want to go look for sheep this afternoon?
  - start: '03:24.500'
    end: '03:27.900'
    original: 明るいうちにさ...
    english: While it's still bright...
  - start: '03:28.000'
    end: '03:30.900'
    original: 羊を...ちなみにみんなお腹空いてない？今。
    english: The sheep... by the way, is anyone hungry right now?
  - start: '03:31.000'
    end: '03:34.000'
    original: あ、でも大丈夫。ご飯はいっぱい先輩たちにもらったんだ！
    english: Ah, but I'm fine. I got plenty of food from our seniors!
  - start: '03:34.100'
    end: '03:39.900'
    original: 今日ね、先輩たちにもらったものを全部持たない縛りでやってた、実は。
    english: Actually, today I was playing with a self-imposed restriction not to
      carry anything given by seniors.
  - start: '03:40.000'
    end: '03:43.000'
    original: あ、ごめん、ずっと食ってるわ！
    english: Ah, sorry, I've been eating non-stop!
  - start: '03:43.100'
    end: '03:46.500'
    original: ご飯を持っていた、さすがに。
    english: I did carry food, of course.
  - start: '03:46.600'
    end: '03:51.500'
    original: 最初に作ったのに全部預けちゃったのじゃ。
    english: Even though I made some first, I put it all in storage.
  - start: '03:51.600'
    end: '03:54.000'
    original: はい、これ。
    english: Here, take this.
  - start: '03:54.100'
    end: '03:57.000'
    original: え、じゃあ預けとく？どうする？悩む...
    english: Eh, so should we store it? What should we do? I'm torn...
  - start: '03:57.100'
    end: '04:00.600'
    original: 預けちゃう？我々で食料の調達もするか。
    english: Store it? Shall we procure our own food ourselves?
  - start: '04:00.700'
    end: '04:04.900'
    original: うん、そっちの方が楽しいっちゃ楽しいよね！
    english: Yeah, that's definitely more fun!
  - start: '04:05.000'
    end: '04:08.000'
    original: 先輩からのご飯、ごめんなさいするのじゃ。
    english: We'll apologize to our seniors for their food.
  - start: '04:08.100'
    end: '04:10.900'
    original: チェストに入れておいたの？
    english: Did you put it in the chest?
  - start: '04:11.000'
    end: '04:16.800'
    original: チェスト作れるくらいさ、我々今もう一旦持ってると思うから、一旦拠点戻って我々の...
    english: Since we have enough materials to make a chest now, let me head back
      to our base...
  - start: '04:16.900'
    end: '04:22.000'
    original: キョーコが作業台を置いてくれた場所に戻って...
    english: Let's return to where Kyoko placed the crafting table...
  - start: '04:22.100'
    end: '04:25.500'
    original: ゾンビが一緒に泳いでる！
    english: A zombie is swimming with us!
  - start: '04:25.600'
    end: '04:28.000'
    original: ゾンビ？うん！ゾンビも泳ぐの？
    english: A zombie? Yeah! Do zombies swim too?
  - start: '04:28.100'
    end: '04:31.000'
    original: イカじゃない？
    english: Isn't it a squid?
  - start: '04:31.100'
    end: '04:34.800'
    original: イカだった今？黒いやつイカじゃない？
    english: Was it a squid just now? Isn't the black thing a squid?
  - start: '04:34.900'
    end: '04:37.000'
    original: なんか緑っぽかったよ？
    english: It looked kind of greenish?
  - start: '04:37.100'
    end: '04:40.000'
    original: じゃあゾンビかも。でもいるよね、水の中ゾンビ。
    english: Then it might be a zombie. But underwater zombies exist, right?
  - start: '04:40.100'
    end: '04:44.900'
    original: こんな街にもいるんだ。
    english: So they exist even in a town like this.
  - start: '04:45.000'
    end: '04:47.800'
    original: 燈火いっぱいあるのにね。ね。
    english: Even though there are so many lights. Right.
  - start: '04:47.900'
    end: '04:59.000'
    original: 今日はお腹いっぱい。ホロサバはかなりもう何だろう、文明が進んでいて、いろんな自動機械とかがあるのは分かっていつつも、やはり初めてのマイクラじゃから...
    english: Today, we know the HoloServer is already quite... advanced in terms of
      civilization, with all sorts of automated machinery, but since it's our first
      time playing Minecraft...
