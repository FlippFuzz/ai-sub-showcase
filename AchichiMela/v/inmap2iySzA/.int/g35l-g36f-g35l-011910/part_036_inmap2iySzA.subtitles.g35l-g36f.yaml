  - start: '03:33.200'
    end: '03:36.000'
    original: え、すごい！勝手に...
    english: Eh, awesome! Automatically...
  - start: '03:35.500'
    end: '03:42.000'
    original: そう、勝手にこの水が流れたところのアイテムがポロッて取れるのよ。
    english: Yeah, all the items where the water flowed automatically pop off!
  - start: '03:42.000'
    end: '03:44.000'
    original: おー！便利！
    english: Ooh! Convenient!
  - start: '03:44.000'
    end: '03:47.000'
    original: だから草むしりとかが楽にちょっとできるかも。
    english: So clearing grass might be a bit easier.
  - start: '03:47.000'
    end: '03:53.000'
    original: でも代わりにたいまつが飛んでっちゃうから、また置き直さなきゃいけないんじゃけど。
    english: Though the downside is torches pop off too, so you have to place them
      again.
  - start: '03:53.000'
    end: '03:54.200'
    original: なるほど。
    english: I see.
  - start: '03:54.200'
    end: '03:59.000'
    original: で、また水源を回収したら戻るのじゃ。
    english: And when you collect the water source again, it stops.
  - start: '03:59.500'
    end: '04:02.500'
    original: おー、便利！
    english: Ooh, convenient!
  - start: '04:00.800'
    end: '04:04.500'
    original: 流れたところだけ雑草ないじゃろ？
    english: See how there's no weeds only where the water flowed?
  - start: '04:04.500'
    end: '04:08.500'
    original: 本当だ！え、便利だね！除草的な感じに...
    english: It's true! Wow, that's handy! Like a weeding effect...
  - start: '04:08.500'
    end: '04:09.500'
    original: そうそうそうそう！
    english: Right, right, right, right!
  - start: '04:09.500'
    end: '04:10.500'
    original: へー！
    english: Whoa!
  - start: '04:10.500'
    end: '04:15.000'
    original: みたいな感じでね、水攻めのご飯いっぱい作ってほしい。
    english: So using water tactics like that, I want you to make plenty of food.
  - start: '04:15.000'
    end: '04:16.200'
    original: 任せろー！
    english: Leave it to me!
  - start: '04:16.200'
    end: '04:17.800'
    original: お願いしましたのじゃ。
    english: I'll leave it in your hands then.
  - start: '04:17.500'
    end: '04:19.000'
    original: そぴ農場ー！
    english: Sopi Farm!
  - start: '04:19.000'
    end: '04:21.500'
    original: じゃあ「そぴ農場」なのじゃ！
    english: Then it's 'Sopi Farm'!
  - start: '04:22.000'
    end: '04:24.500'
    original: そして、木を取りに行くか。
    english: And now, shall I go collect wood?
  - start: '04:26.000'
    end: '04:28.000'
    original: これは何？石か。
    english: What's this? Is it stone?
  - start: '04:28.000'
    end: '04:30.000'
    original: 家から考えたいよね。
    english: I want to check on the house first.
  - start: '04:30.000'
    end: '04:32.500'
    original: え、すごい！めっちゃ綺麗になってる！
    english: Whoa, awesome! It's gotten super clean!
  - start: '04:32.500'
    end: '04:35.000'
    original: すごい、でかいよ、家もう！
    english: Amazing, the house is already huge!
  - start: '04:35.000'
    end: '04:36.500'
    original: あ！キョーコ！
    english: Ah! Kyoko!
  - start: '04:36.500'
    end: '04:38.000'
    original: キョーコ！
    english: Kyoko!
  - start: '04:38.000'
    end: '04:42.000'
    original: 待って！キョーコ！スポーン地点ここになってない？
    english: Wait! Kyoko! Isn't your spawn point set here?
  - start: '04:40.000'
    end: '04:42.000'
    original: キョーコ？
    english: Kyoko?
  - start: '04:43.000'
    end: '04:45.000'
    original: キョーコの残骸！
    english: Kyoko's remains!
  - start: '04:46.000'
    end: '04:50.000'
    original: キョーコまずいな... ちょっと一旦物を回収して...
    english: Kyoko is in trouble... Let me gather her items first...
  - start: '04:51.500'
    end: '04:53.500'
    original: え、キョーコ何でリスボーンして...
    english: Eh, why did Kyoko respawn...
  - start: '04:53.500'
    end: '04:57.800'
    original: あの、多分ベッドが違う位置... いや、違う。多分レスポーン地点をちゃんと設定してない...
    english: Um, maybe her bed was somewhere else... No, wait. She probably didn't
      set her respawn point properly...
  - start: '04:58.000'
    end: '05:00.000'
    original: あ、ベッド近くに！
    english: Ah, near the bed!
