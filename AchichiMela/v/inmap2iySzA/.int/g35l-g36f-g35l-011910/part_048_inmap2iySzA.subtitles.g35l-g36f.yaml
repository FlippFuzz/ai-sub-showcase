    Suzuri Suzuna, and Kyoko Hyakuto. The four members embark on their first joint
    Minecraft adventure on the HoloServer to build their shared hideout. Throughout
    the 4-hour stream, they navigate introductory greetings, land leveling, exploring
    a magnificent underground amethyst geode cave, gathering ores and building materials,
    constructing a multi-level stone and glass base with defensive moats, and engaging
    in lighthearted banter and food-related antics.
