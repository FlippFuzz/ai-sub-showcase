  domain_glossary:
  - term: JSP (日本事故物件監視協会)
    meaning: An anomaly-finding horror simulation game (Japan Stigmatized Property)
      where players monitor security camera feeds of stigmatized properties from midnight
      to 5:00 AM and report anomalies.
  - term: 異変 (In-hen)
    meaning: An anomaly, deviation, or supernatural occurrence in the monitored property
      that the player must detect and report.
  - term: ジャンプスケア (Jump Scare)
    meaning: A horror trope or game mechanic featuring sudden terrifying visual or
      auditory shocks designed to startle the player.
  - term: アソビ★まわり隊！ (Asobi Mawari-tai!)
    meaning: 'A Hololive VTuber unit consisting of four members: Hyakuto Kyoko, Achichi
      Mela, Suzuna Tsuzuri, and Sorashina Sopia.'
  - term: めら組 (Meragumi)
    meaning: The official fan name and community for Achichi Mela.
