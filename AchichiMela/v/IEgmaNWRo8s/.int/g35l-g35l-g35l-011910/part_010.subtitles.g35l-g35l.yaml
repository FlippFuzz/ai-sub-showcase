  overall_summary: In this stream from the Mela Ch. channel, Hololive's 'Asobi Mawari-tai!'
    member Achichi Mela takes on the anomaly-finding horror simulation game 'Japan
    Stigmatized Property' (JSP). Throughout the nearly two-hour stream, Mela progresses
    through multiple terrifying stages including an Akita Prefecture house, a Nara
    Prefecture shrine, a hot spring ryokan, and a complex final stage. Despite initial
    extreme nervousness, a funny accidental stream shutdown due to a jump scare, and
    short-term memory challenges, Mela successfully identifies anomalies across all
    properties with impressive zero-miss runs, culminating in a triumphant celebration
    and an announcement for her upcoming 2-month debut anniversary stream.
