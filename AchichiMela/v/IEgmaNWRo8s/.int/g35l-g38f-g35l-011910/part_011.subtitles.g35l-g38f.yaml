global_summary:
  overall_summary: In this livestream, Hololive VTuber Achichi Mela from the unit
    'Asobi Mawaritai!' plays the indie surveillance horror game 'Japan Stigmatized
    Property' (JSP). Initially nervous and intimidated by the realistic setting of
    stigmatized properties and jumpscares, Mela takes on the role of a midnight CCTV
    monitor across four challenging stages—ranging from an Akita house to a Nara shrine,
    a ryokan, and a cursed final stage. Through a mix of panic, memory challenges,
    and humorous reactions, she successfully completes the anomaly-detection shifts
    while interacting with her viewers.
