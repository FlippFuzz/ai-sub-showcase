    Then, there's a shuffling sound. "Wait, was it torn away like this before? It looks like it wasn't torn before. Wait, I might be incredible. Wait, I might be awesome," I suddenly realize, and start thinking I'm doing quite well. "Wait, I might remember this pretty well. Wait, aren't I amazing?" I start to consider myself a "goddess of memory" or maybe the "goddess of medium-term memory." Yes! I think that's right!

    I shift slightly, and a thought interrupts me. I don't want to be a full-timer, it is scary! I note the number of items around. "Hey, were there this many items here? Looks like they were lying there." I become unsettled. "30 minutes left..." and I decide to "browse Twitter for 30 minutes to wrap this up." but I quickly realize "if I spend 30 minutes looking at Twitter, my shift ends."

    I notice a slight change and wonder "While wondering if it was flickering this much before... it's pretty much just like that,". "I can tell. I know it. Yeah." I am feeling quite attuned. Then, I notice creaking. "I keep hearing creaking around here. Around here... outside, because of that creaking sound... I hate it," I think. I start to find it terrifying. "I-I hate it. It's so scary. Huh? Was it like this? I feel like it was different."

