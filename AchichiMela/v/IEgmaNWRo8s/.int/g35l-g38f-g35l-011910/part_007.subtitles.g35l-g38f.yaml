  domain_glossary:
  - term: JSP (日本事故物件監視協会)
    meaning: Japan Stigmatized Property, an indie surveillance horror simulation game
      where players monitor CCTV feeds of real-life stigmatized properties from midnight
      to 5 AM to report anomalies.
  - term: 事故物件
    meaning: A stigmatized property where a tragic death, accident, or incident occurred,
      serving as the settings for the monitoring shifts in JSP.
  - term: 異変
    meaning: Anomalies or unnatural changes in room items, furniture, or environment
      that players must detect and report through the CCTV system.
  - term: アソビ★まわり隊！
    meaning: A Hololive VTuber unit consisting of four members, with Achichi Mela
      representing the 'blessings' (ご利益) role.
  - term: 火の用心じゃ〜！
    meaning: Achichi Mela's signature catchphrase meaning 'Beware of fire!', reflecting
      her firefighter salamander background.
