global_summary:
  overall_summary: In this livestream video, Hololive's 'Asobi-Mawaritai!' member
    Netsuchi Mela takes on her first 'gachi' horror game, JSP (Japanese Scary Places
    anomaly surveillance horror game). Throughout the stream, she navigates four intense
    stages—starting from an accident property in Akita Prefecture, a shrine in Nara
    Prefecture, a traditional Japanese ryokan, and a final haunted estate. Despite
    experiencing intense scares, jumpscares (which briefly caused her to accidentally
    cut her stream in Stage 1), and short-term memory struggles with spotting subtle
    anomalies, Mela successfully clears all stages with high precision, maintaining
    her signature energetic and humorous commentary with her 'noja' speech pattern.
