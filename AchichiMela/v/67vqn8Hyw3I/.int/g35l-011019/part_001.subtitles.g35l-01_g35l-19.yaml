global_summary:
  overall_summary: In this 67-minute stream from her channel 'Mela Ch. 熱千めら‐ アソビ★まわり隊!',
    hololive VTuber Netsuchi Mela holds a pre-practice session for the upcoming beginner
    'Jump King' tournament hosted by Calliope and Niona. Despite practicing solo the
    night before with much frustration, Mela experiences a 'stream buff' where she
    successfully navigates early obstacles using her self-invented rhythmic jumping
    chant ('achichi mela'). She learns max-jump shortcuts from chat, chats about her
    streaming persona and desire to entertain fans without getting excessively angry,
    and concludes the session by announcing her upcoming Halloween undead cover song
    release.
