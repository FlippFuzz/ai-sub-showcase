        "header": "**Initial Thoughts and Gameplay Preparation**",
        "content": "Okay, so, I heard about this tournament where even newbies can participate, which got me thinking, 'Hey, maybe *I* can actually do this!' I've never really played this game before, but the concept seemed welcoming.  I decided to give it a go!  [Title: レッドクラウンの森] \n\nI thought it might be a bit unwise to jump in completely blind for the tournament, so I've been practicing a little bit off-stream.  Although I haven't shown it on stream yet, I've been playing it alone, going 'ngyaa!' while getting the hang of things.  Let's just say I'm probably still a beginner, or almost a total beginner.  If you consider me as nearly a beginner player, that's accurate.  I figure this should turn out like a beginner-level tournament, no?  Well, let's get started. I'm aiming to keep this stream around an hour because the actual tournament is later. Let's get going, I'll start the stream. \n\nOh, can you guys hear the game sound? Is it coming through alright? I'm playing a new game.  There's apparently a hot gal at the top! It's a tournament where we're going to search for a hot gal, so here we go.  So, shall we play now? Let's begin, eh? I'll explain the rules briefly for anyone new.  It's just a simple jump and horizontal control.  That's all the controls there are: jump or move horizontally. You use this to try to go up.  \n\nThere are times when you try to jump, but you hit something and can't go up.  The jump's length and height determine where you go. It relies a lot on skill.  I've looked at the map a little, but, just a little.  I tried it by myself and, well, I kept falling. It's difficult and frustrating; I almost quit, you know? I thought it wouldn't be good to just give up, so I was listening to vocaloid music. I was playing while listening to Vocaloid songs so I wouldn't get too angry, but, you know, when the BPM changes, I lose concentration. It's tough, eh?  Oh, this part is difficult for me! Jump, jump, jump! You see, I'm going to teach you my 'Jump King' strategy!  \n\nIt's my strongest strategy! Here we go. The strategy is: when you jump, you jump using, 'A-chi-chi Me-la!'  Yeah! And that means, varying the height. I'll use the A-chi-chi Me-la strategy.  A-chi-chi Me-la!  The 'no ja' has a long sound, so it's a bit tough to time the jumps."
