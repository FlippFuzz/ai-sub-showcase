      a firefighter due to heat resistance and later lived quietly in the mountains.
    song_title: null
    song_artist: null
  - start: 00:23
    end: 01:27
    title: Smartphone Discovery and Message Board Trolling
    description: The salamander finds a smartphone, visits an online message board
      claiming to be a 400-year-old firefighter, and faces amusing skepticism and
      internet banter.
    song_title: null
