global_summary:
  overall_summary: This self-produced animated video tells the backstory of Hololive
    VTuber Achichi Mela, chronicling her origins as an Edo-period salamander firefighter,
    her humorous encounters on internet message boards after discovering a smartphone,
    her 20 years living among humans, and her ultimate discovery of Hololive and VTubers
    which inspires her to apply for auditions to bring warmth and community to others.
