  - start: '03:10.000'
    end: '03:13.200'
    original: 全然七夕とは関係ない時期だったんだけど…
    english: It was at a completely unrelated time of year from Tanabata, but...
  - start: '03:15.500'
    end: '03:28.000'
    original: なんか、物欲もなくて、あと何じゃろな、物欲以外にもあんまりその願い？叶えたい願いみたいなのもあんまりなかったから、それがちょっとコンプレックスじゃったの、わし。
    english: Like, I had no material desires, and beyond that, I didn't really have
