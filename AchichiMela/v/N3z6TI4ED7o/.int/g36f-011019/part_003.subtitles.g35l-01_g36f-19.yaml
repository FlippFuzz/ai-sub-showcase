    original: ホロライブに入りましたってなって
    english: When it was decided that I'd be joining Hololive...
  - start: '00:02.800'
    end: '00:05.500'
    original: 新生活を始めますってなるじゃろ？
    english: '...and I''d be starting a new life, right?'
  - start: '00:07.100'
    end: '00:09.800'
    original: やっぱお仕事をね、始めたりすると
