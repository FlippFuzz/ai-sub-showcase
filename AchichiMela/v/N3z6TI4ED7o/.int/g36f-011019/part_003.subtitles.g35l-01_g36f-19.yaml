  - start: '00:10.800'
    end: '00:15.500'
    original: さあ、配信ができそうなお部屋とかさ、引っ越したりするじゃろ？
    english: you move to a place where you can stream and work, right?
  - start: '00:16.800'
    end: '00:20.900'
    original: 引っ越して、新居に友達を呼んだの。
    english: So I moved, and I invited a friend over to my new place.
  - start: '00:22.000'
    end: '00:28.800'
    original: そしたら、わしてきにはすっごい可愛い、いい感じのお部屋ができたなと思ったんだけど、
    english: Then, while I personally thought I had set up a super cute and nice room...
  - start: '00:29.800'
    end: '00:37.700'
    original: 友達に「何の面白みもない、ドラマに出てくる女の子のモデルルームみたいな部屋だね」みたいなことを言われたのじゃん。
    english: '...my friend told me, "This room has no personality at all. It looks
