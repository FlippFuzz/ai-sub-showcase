  - start: '00:38.900'
    end: '00:40.000'
    original: はい。
    english: Yes.
  - start: '00:41.100'
    end: '00:45.500'
    original: 分かる？おぬしら。ドラマに出てくるさ、架空の女の子の部屋あるじゃろ？
    english: Do you guys get it? You know those rooms for fictional girls in TV dramas,
      right?
  - start: '00:46.500'
    end: '00:53.900'
    original: 生活感がまるで無いさ、「こんな部屋に女の子住んでるわけないだろ！」みたいな、
    english: Where there's zero sign of anyone actually living there, like "No girl
      would actually live in a room like this!"
  - start: '00:54.200'
    end: '00:59.800'
    original: あるじゃろ？我々が想像する女の子の部屋みたいな、無機質なね。
    english: You know what I mean? That lifeless, inorganic vibe of what people imagine
      a girl's room is like.
  - start: '01:03.000'
    end: '01:08.800'
    original: わし、あんまりその、なんじゃろ、趣味とかもそんなにないから、
    english: I don't really have many hobbies or anything, so...
  - start: '01:09.900'
    end: '01:12.700'
    original: 物が多くないの、部屋に。
    english: I don't have many belongings in my room.
  - start: '01:14.000'
    end: '01:18.900'
    original: ウォーターサーバーと、家電と、椅子と机、みたいな。
    english: It was just a water dispenser, home appliances, a desk, and a chair.
  - start: '01:20.900'
    end: '01:26.000'
    original: 本当に、ただ生活をするためだけの場所、みたいな。
    english: Literally just a space strictly meant for living.
  - start: '01:28.900'
    end: '01:32.000'
    original: そんな部屋なの、本来のわしの部屋は。
    english: That's what my actual room is normally like.
  - start: '01:33.900'
    end: '01:36.100'
    original: そう、あとルンバもいるね。ルンバもいるのじゃん。
    english: Oh, and I have a Roomba too. I have a Roomba.
  - start: '01:37.200'
    end: '01:40.800'
    original: ミニマリストってわけじゃないんじゃけど…
    english: It's not that I'm trying to be a minimalist...
  - start: '01:42.000'
    end: '01:44.800'
    original: なんか、単に物欲がなくて。
    english: I just simply don't have much desire for material things.
  - start: '01:46.000'
    end: '01:50.800'
    original: あんまりなんか、物が欲しくなくて、ないだけなのじゃん。
    english: I don't really crave having lots of stuff, so I just don't have much.
  - start: '01:55.200'
    end: '02:00.000'
    original: でも結構家具はね、可愛い家具で揃えてたの。
    english: But I had furnished it with pretty cute furniture!
  - start: '02:00.100'
    end: '02:05.000'
    original: 可愛い家具で揃えてたんじゃが、「面白みのない部屋」って言われて引きずったの、わし。
    english: I decorated it with cute furniture, but when she called it a room with
