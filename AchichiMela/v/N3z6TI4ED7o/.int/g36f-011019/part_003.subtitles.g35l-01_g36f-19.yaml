  - start: '02:05.500'
    end: '02:07.500'
    original: 根に持ってるの、今でも。
    english: I'm still holding a grudge about it even now!
  - start: '02:09.500'
    end: '02:11.800'
    original: 今でも根に持ってるのじゃ！
    english: I'm holding a grudge to this day!
  - start: '02:13.200'
    end: '02:20.000'
    original: で、それがすごい嫌だったから、「面白みのない部屋だって！？」と思って、
    english: And because that really irked me, I was like, "A room with no personality?!"
  - start: '02:20.800'
    end: '02:22.500'
    original: ちょっとむかついて、
    english: I got a little annoyed...
  - start: '02:24.000'
    end: '02:29.800'
    original: むかついたから… 仲良しなんだよ？仲良しの子だから、すごい仲良しの子なのよ？だから…
    english: I was annoyed, but we're really good friends, okay? She's a very close
      friend of mine, so...
  - start: '02:30.500'
    end: '02:35.800'
    original: 嫌いになったりはしてないし、確かにその子が言うならそうなのかなと思って…
    english: '...it''s not like I hate her, and I thought, "Well, if she says so,
      maybe she''s right..."'
  - start: '02:38.200'
    end: '02:46.500'
    original: あのお… 次その子が家に来たら、あっ！と驚くような部屋にしてやろうと思って！
    english: So I thought, the next time she comes over, I'll turn it into a room
      that'll make her gasp in surprise!
  - start: '02:51.000'
    end: '02:54.000'
    original: そう、考え抜いたのじゃ。
    english: Yeah... so I thought long and hard about it.
  - start: '02:55.000'
    end: '02:59.000'
    original: 考えに考えて… つづりおめでとうありがとうなのじゃ！
    english: I kept thinking and thinking... Thanks for the Super Chat!
  - start: '03:00.000'
    end: '03:07.800'
    original: んで、いっぱい考えた結果購入したのが… 短冊ですのじゃ！
