  thoughts:
  - "**A Deep Dive into My Unproductive Passions**\n\nOkay, here's what I'm thinking,\
    \ as I delve into this, first, I remember I *do* have a signature! I wonder if\
    \ it's been posted somewhere? I think it probably is out there. It reminds me,\
    \ I really love writing characters, like with those kanji drills back in school.\
    \ Remember how they'd make you write the same kanji hundreds of times for no reason?\
    \ Well, I actually kind of *liked* doing that! It was like a way to empty my head.\
    \ I find I feel the same when drawing. The feeling is the same as when I'm doing\
    \ kanji drill workbooks. I'm not even trying to memorize it! I'm just emptying\
    \ my head and writing nonstop. Yeah, I just love simple, repetitive tasks so much,\
    \ right? They're kinda pointless, right? I guess I really love doing things with\
    \ zero productivity... I like spending time that produces absolutely nothing.\
    \ \n\nI just love mindlessly doing something over and over. I could literally\
    \ dig a hole and fill it back in forever. I can do meaningless things endlessly.\
    \ Huh. Is that why I forget things so fast? Maybe that's it! Maybe I'm suited\
    \ for Minecraft? Hmm, I'd probably really love flattening terrain and stuff. I'd\
    \ love clearing land. I could flatten terrain for dozens of hours, and also branch\
    \ mine. You know, thinking is tiring, so I don't like it. I don't like thinking.\
    \ I like things I can do without thinking, with my head completely empty. I just\
    \ keep doing the same thing. I get super focused, like I enter the zone. So even\
    \ when I'm writing thank-yous for Super Chats, I just do it straight through.\
    \ Like, for my monetization stream, it probably took around four or five hours...\
    \ I was focused the entire time and enjoyed that.\n\n\"Don't you use your brain\
    \ in GeoGuessr?\" No, GeoGuessr definitely uses your brain! GeoGuessr is tough.\
    \ I do like it! I *really* love GeoGuessr, but it's a different kind of thing.\
    \ It hits totally differently. There are times when I want to empty my head and\
    \ zone out... with GeoGuessr, you get a dopamine rush when you guess right, so,\
    \ depending on whether I want that dopamine rush or not, I switch it up. \"Do\
    \ you put on anime while working?\" Oh, I can't multitask. Since I can't multitask,\
    \ I can't work while watching anime. If I try to work while watching anime, I\
    \ can't follow the story at all. Recently, I was working while watching *Madoka\
    \ Magica*, and... I just wouldn't remember whatever happened during the parts\
    \ I was focused on work. So I don't work while watching anime. I do listen to\
    \ Vocaloid songs, though! I work while listening to Vocaloid songs all the time.\
    \ But, you might be thinking, \"Wait, isn't that multitasking too?\" Well, to\
    \ me, working while playing Vocaloid songs isn't multitasking. \n\nWhy? Because\
    \ if I were playing random tracks shuffled from a playlist of hundreds of songs,\
    \ maybe that'd be multitasking, but... I'm the type who repeats one single song\
    \ over and over. I'm the type who can listen to the exact same song for 24 hours\
    \ a day. There are others like that sometimes. Every now and then I meet someone\
    \ like me. I'll repeat the exact same song every single day for a whole month.\
    \ I never get tired of it! When I work, I play the same song on loop. The reason\
    \ I do that is because there's a sense of comfort in knowing what's coming next.\
    \ When different songs suddenly play and change over and over, my concentration\
    \ breaks right there, like, \"Oh, the song changed.\""
