  thoughts:
  - |-
    **My Thoughts on This Segment**

    Okay, so I'm thinking, "Hm, maybe I should write 'Goriyaku' on a cue card to have in the studio. Yeah, I should get them to put up a huge one!" I need a reminder because, you know, I get a little too comfortable, and I slip up on the habit of the saying that. Speaking of, I need to be careful of that. I'm also really bad at reading Kanji, especially the difficult ones. It's pretty obvious if you've seen my GeoGuessr streams – I can get the regions, but the readings… not so much. Maybe because I don't read books much.

    And that reminded me, since it is a month since my debut, I thought I'd talk about my life from the Edo period! It's kind of fitting, right? I've got to talk about some pre-debut stories too, just to commemorate the moment. I keep on saying "one-year anniversary" though, it's just a slip-up, I'm bad at this.

