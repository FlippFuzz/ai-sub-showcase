    english: Quite risky content...
  - start: '03:40.200'
    end: '03:45.300'
    original: と思ったので、限定公開にさせていただきましたのじゃ。
    english: '...so that''s why I made it members-only.'
  - start: '03:50.100'
    end: '03:52.000'
    original: 結構見る人いると思う。
    english: I think a lot of people would watch it.
  - start: '03:52.000'
    end: '03:55.700'
    original: でもなんかニッチな感じかなと思って。
    english: But I felt it was kind of a niche thing.
  - start: '03:58.700'
    end: '04:00.000'
    original: のじゃ。
    english: Yeah.
  - start: '04:02.500'
    end: '04:06.900'
    original: キュートアグレッションって知ってる？メラッチ。知っておりますのじゃ。
    english: '"Do you know what cute aggression is, Melacchi?" Yes, I do know about
      it.'
  - start: '04:07.400'
    end: '04:15.500'
    original: もちろん、ホロライブに入る前に人間が何を好むかについて徹底的に勉強させていただきましたのじゃ。その中にあった
    english: Of course, before joining Hololive, I thoroughly studied what humans
      like. Among those...
  - start: '04:16.800'
    end: '04:19.400'
    original: キュートアグレッションという概念。
    english: '...was the concept of cute aggression.'
  - start: '04:21.000'
    end: '04:23.000'
    original: 存じ上げておりますのじゃ。
    english: I am aware of it.
  - start: '04:23.000'
    end: '04:28.000'
    original: 人間は可哀想を可愛いと思うらしいとの噂。
    english: Rumor has it that humans find pitiful things cute.
  - start: '04:32.000'
    end: '04:44.200'
    original: でもね、おぬしら勘違いしないでほしいんだけど、わしね、「よし、人間が好きなキュートアグレッションってやつをやってみよう！でんぐり返しするのじゃ〜！」って言ったわけじゃないからね、おぬしら。
    english: But hey, I don't want you guys to get the wrong idea. It's not like I
      said, "Alright, let's try that cute aggression thing humans love! Time to do
      forward rolls~!"
  - start: '04:44.900'
    end: '04:52.600'
    original: 知ってはいるけどさ、結果的に「まあ、供養しとくか」みたいな感じで上げているだけで…
    english: Even though I know about it, it ended up being just a "Well, might as
      well share it" kind of thing...
  - start: '04:53.000'
    end: '04:59.000'
    original: 目的が「よし、人間キュートアグレッションを提供するのじゃー！」じゃないからね、ちなみに。
    english: Just so you know, my goal wasn't "Alright, time to offer cute aggression
      to humans!"
