global_summary:
  overall_summary: This video is a YouTube live stream titled '【#アソビまわり隊歌枠リレー】4人コラボで歌うのじゃ！！！'
    featuring all four members of the hololive unit 'アソビ☆まわり隊！' (Hyakuto Kyoko, Achichi
    Mela, Suzuna Tsuzuri, and Sorashina Sopia). The stream celebrates their debut
    relay singing stream with an offline 4-member collab where they perform in duos
    (Warm Team singing 'HUNTING FOR YOUR DREAM' and Cool Team singing 'うまぴょい伝説') and
    as a full group performing their original song '騒げ☆ぐるぐるTIME！'. Alongside powerful
    musical performances, the members chat about their recent Akihabara pop-up event
    ('アキバ☆かくれんぼ！'), host a live viewer poll to decide their official unit abbreviation
    ('遊びたい'), and announce upcoming goods and collaboration schedules.
