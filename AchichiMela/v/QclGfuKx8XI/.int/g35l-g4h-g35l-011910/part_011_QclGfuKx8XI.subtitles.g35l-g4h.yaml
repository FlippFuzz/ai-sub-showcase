  thoughts:
  - |-
    **Analysis of Video Segment: Voice Modulation and Language**

    Okay, so I've been tasked with meticulously processing this video segment. My main goal is to accurately transcribe both the Japanese and English speech, with precise timestamps for each word. The first thing I've done is confirm that there's no singing or musical performance here, just some casual chatting and Duolingo study in the background.

    Now, let's dive into the audio. The initial snippet is a continuation from a previous segment about what address is on the package, which is nothing of interest, really. The next chunk delves into this fascinating topic of how my voice changes depending on the language I'm speaking. In Japanese, my vocal cords seem to sit higher, resulting in a higher tone. But when I switch to English, my voice drops. It's almost as if I have a different register for each language. I wonder if it's because the placement of my throat changes as I speak.

    I notice myself reflecting on how people in chat appreciate my "lower deeper voice" in English, which is interesting since it is not my intent. I find that when I try to do a "cute" voice in English, it just doesn't come out as naturally as it does in Japanese. It's almost like the tonal qualities I've absorbed for the Japanese cute voice aren't there for English. I'm sort of jealous of how effortlessly some English speakers can pull off a cute voice. It may be due to the fact that I learned English later in life. Perhaps my English "tone" is stuck in the setting I had when I learned it. It's almost as if my English voice is more like my natural, unedited speaking voice, whereas my Japanese voice can become a bit more malleable.

    Someone in the chat mentions Biboo, a fellow streamer, and how her English voice is so cute. I can relate. Perhaps it's something I'll practice more in the future.

    Next, I hear the Duolingo app audio. This makes me consider if I would be able to speak in my "natural" voice on today's drinking stream. Then I realize, drinking changes everything! My breath gets shallower when I drink, which in turn alters my vocal tone. People's voices tend to emphasize "high" tones when they're drinking, and I even recall a humorous misunderstanding once when someone was referring to "high" in a vocal sense, and it somehow got translated as the "lungs" in a cut-up video. So, any kind of drinking stream will not be the time to hear my regular voice, alas!
