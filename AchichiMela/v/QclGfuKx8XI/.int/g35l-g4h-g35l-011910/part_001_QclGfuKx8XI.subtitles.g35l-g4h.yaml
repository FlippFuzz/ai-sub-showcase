  thoughts:
  - |-
    **A Morning of Dreams and Delicious Cookies**

    Right, let me walk you through my thoughts this morning. First off, I had this absolutely dreadful dream – a real nightmare! I was stuck outside after the last train, couldn't get a taxi, and was going to be late for my morning stream. Terrifying, you know? The worst part was not making it to Noja English, it was a real stressful dream!

    It's strange, but I often have dreams where I'm late. Before field trips as a kid, or even now, I dream that I can't wake up on a day when I *need* to wake up early. Or that I'm oversleeping when I have work. I had one just recently, and I woke up with a jolt! Normally, I'll wake up at a normal time, but the scary dream wakes me up. Other times, I just forget the dream. I remember most of my dreams. I think maybe my sleep isn't so good, hmm?

    Even now, even though I'm not a student, I'll still have these dreams where I forget my homework, or that I'm late for elementary school! I'll dream that I miss exams or deadlines and I'll wake up really scared. It's odd that even things that happened years ago, I still dream about! But, I'm just happy I woke up, and in time!

    Then, I had a lovely morning. After waking up, I ate some prefecture-shaped cookies that Iroha-senpai made! They were so delicious. I couldn't tell which prefecture the cookie was that I was eating. Hmm, I felt like there was something like Tochigi but I couldn't recognize the rest of the shape. Maybe it's a joke or the cookies are shaped like prefectures! I was like, “I'm gonna move there!” They're so delicious, and I'm very grateful that Iroha-senpai made them. Anyway, I think I'm going to have another one, itadakimasu! Mmm, mmm, mmm!
