global_summary:
  overall_summary: In this collaborative stream titled 'ついに頂上へ！ENGLISH PEAK STREAMのじゃ！',
    Hololive's Achichi Mela teams up with fellow Asobi Mawari-tai member Hyakuto Kyoko,
    along with senior guests Koseki Bijou and Kaela Kovalskia, to conquer the co-op
    mountaineering survival game 'PEAK' entirely using English and their signature
    'Noja English'. Over the course of nearly three hours, the quartet navigates treacherous
    jungles, strong mountain winds, desert heat with capybaras and cacti, and dangerous
    gloom swamps. Despite numerous falls, hunger crises, and chaotic comedic moments—including
    a brilliant food duplication strategy—the team successfully reaches the mountain
    peak, captures celebratory photos, and achieves a triumphant milestone.
