  - |-
    **Hololive PEAK Gaming Stream - Subtitle Summary (25:00.040 - 30:00.048)**

    Okay, here's my read on this segment. Right off the bat, I need to get subtitles running for this clip, so let's get down to the details. The segment begins with a quick "Ha?" from Mela, and it sounds like Kaela is giving out a rope, while Mela exclaims "Thank you noja, I'm waiting now." Kaela-senpai is handing off a rope, and I am noting the use of *heave-ho* as she grabs them. Kyoko-senpai says that Bijou-senpai is heading our way, with berries! Mela is very appreciative, and there's a lot of gratitude going around.

    The amount of rope is incredible! Bijou is really surprised, and rightfully so. "So many ropes now." There's some grunting sounds, then a pain sound, and Mela saying "Oh, yummy yummy!". "Too many ropes!" and "Heave-ho, heave-ho." The focus is on the ropes now. It seems that now she's going to use the ropes to climb. "I can maybe I can climb."

    Bijou asks if Kaela is hungry, while Mela calls out "Noja". Kaela finds a nice vine, while Mela lets out another "Heave-ho". Kaela is remembering the blowgun. Maybe it's too late. I think they are going to go up. "Thank you, thank you noja!" and "Nice!" There's a coconut nearby. 2 suitcases. They need a medkit! Kaela is going to get the coconut. Mela is a bit hasty, but she's healed now!

    Oh! It's a rocket pack. "Heave-ho, heave-ho." Piton! Another item they have. Hungry. Okay! Mela is very appreciative. Piton... it looks like everyone needs these things, here. I can tell Kaela has the food items. It looks like it's a jetpack.

    They are all good on food now. Yellow berry. "Good berry noja?". Right now they are following a good path. Almost there! Hill climb. And a fungus.
