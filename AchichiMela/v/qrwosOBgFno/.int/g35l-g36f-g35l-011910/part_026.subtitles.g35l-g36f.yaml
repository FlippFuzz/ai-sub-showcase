  overall_summary: This video is a YouTube live stream titled 'ついに頂上へ！ENGLISH PEAK
    STREAMのじゃ！【ホロライブ/アソビ★まわり隊！/熱千めら】' hosted by Achichi Mela from hololive's ASOBI★MAWARI-TAI!
    unit. Joined by unitmate Hyakuto Kyoko and senior hololive members Kaela Kovalskia
    and Koseki Bijou, Mela undertakes a challenging English-only speaking challenge
    ('English Peak Stream') while playing the physics-based mountain climbing game
    Peaks of Yore. Overcoming severe internet issues at the start, technical navigation,
    windstorms, traps, hunger, and numerous falls, the group works together to successfully
    reach the mountain summit and achieve the true ending.
