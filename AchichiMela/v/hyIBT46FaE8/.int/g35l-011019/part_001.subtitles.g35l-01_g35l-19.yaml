global_summary:
  overall_summary: In this self-introduction video, hololive's newly debuted talent
    Achichi Mela shares her background as a 415-year-old salamander firefighter. She
    explains the origin of her name, her biology and heat-venting hair, her past as
    an Edo-period firefighter, her humorous internet-trauma backstory, her personality,
    her favorite things (humans, Vocaloid, Narou-kei novels), her quirky fears (salmon,
    toasters, internet flaming), and her heartwarming dream to create a welcoming
    sanctuary for her fans.
