    song_title: null
    song_artist: null
  - start: '13:49'
    end: '16:25'
    title: Dreams and Conclusion
    description: Shares her dream of giving back to humanity by creating a warm, safe
      sanctuary for anyone feeling lonely or lost, and concludes with final remarks
      and calls to subscribe.
    song_title: null
    song_artist: null
  entities:
  - name: Achichi Mela
    original_name: 熱千めら
    role_or_affiliation: hololive (ASOBI☆MAWARI-TAI!)
    persona_lore: A lively 415-year-old salamander firefighter belonging to hololive's
      unit ASOBI☆MAWARI-TAI!. Originally an Edo-period firefighter and matoi bearer
      who spent 200 years sleeping in the mountains before accidentally stumbling
      onto internet forums, getting flamed, and being adopted into human society.
    speech_patterns_or_ticks: Uses the sentence-ending particle '-noja' (~のじゃ) and
      an energetic speech register.
    visual_cues: Horns, tail, flaming hair, bright orange and red color motif.
  domain_glossary:
  - term: アソビ☆まわり隊！
    meaning: hololive VTuber unit debuted in September 2026, featuring Achichi Mela,
      Sorashina Sopia, Suzuna Tsuzuri, and Hyakuto Kyoko.
  - term: サラマンダー
    meaning: Mythological fire-controlling spirit and lizard species that Achichi
      Mela belongs to.
  - term: マトイ
    meaning: A large standard or pole used by traditional Japanese Edo-period firefighters
      (Matoi-mochi).
  - term: メラ組
    meaning: The official fan fandom and community name for Achichi Mela's supporters.
  - term: なろう系
    meaning: A genre of Japanese web novels and media originating from Shosetsuka
      ni Narou featuring uplifting, triumphant underdog growth and power fantasies.
  - term: ツミキ
    meaning: A popular Japanese Vocaloid producer whose album 'Sakkaku Craft' (錯覚クラフト)
      Mela deeply admires.
