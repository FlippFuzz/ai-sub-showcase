    title: Salamander Biology
    description: Discusses her species as a fire-controlling salamander, explaining
      her horns, tail, hair flames used to vent excess body heat, and her ironic vulnerability
      to summer heat and heatstroke.
    song_title: null
    song_artist: null
  - start: 02:41
    end: 04:36
    title: Age and Firefighter Past
    description: Reveals her age as 415 years old (born April 16, 1611) and recounts
