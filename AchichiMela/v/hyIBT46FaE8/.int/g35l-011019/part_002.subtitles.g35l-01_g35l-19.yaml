    end: 06:33
    title: Transition to Human Society
    description: Recounts living in the mountains for 200 years, accidentally discovering
      an anonymous internet board, getting flamed for a self-reply incident, and subsequently
      being adopted and raised by human parents in modern society.
    song_title: null
    song_artist: null
