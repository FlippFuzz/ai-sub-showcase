response:
  subtitles:
  - start: '00:00.250'
    end: '00:03.530'
    original: もし「SAKKAC CRAFT」っていうアルバムがガチで大好きなのじゃ。
    english: If I had to say, I genuinely love the album "SAKKAC CRAFT."
  - start: '00:03.950'
    end: '00:14.670'
    original: オーディションの書類審査の時に、なんかあなたの好きなものについて語ってくださいみたいな質問があって、そこでわしが書いた文章を今日はそのまま貼って良いって言われたから、貼っちゃうのじゃ。
    english: During the application screening for the audition, there was a question
      like "Please talk about something you love." They told me I could just paste
      what I wrote back then, so I'm going to paste it here!
  - start: '00:15.020'
    end: '00:23.510'
    original: さっきのツミキさんが書いた、あれボカロック曲じゃないんだけど、「トウキョウ・シャンディ・ランデヴ」っていう曲がめちゃくちゃ好きで、その曲について書いてみたのじゃ。
    english: As I mentioned earlier, Tsumiki wrote... well, it's not a Vocaloid song
      per se, but I love the song "Tokyo Shandy Rendezvous" so much, so I wrote about
      that track.
  - start: '00:23.770'
    end: '00:44.920'
    original: わしのオーディションの時に送った文章を見て欲しいのじゃ。ドーン！こういう書類はですね、ですます口調で喋ってるのじゃ。さすがにここでね、タメ口ってやって喋るとね、常識が無い奴と思われるからのじゃ、のじゃ略でお送りさせていただいておるのですが、こんな感じで書いて送ったのじゃ！これくらいわしはボカロック曲、そしてボカロPさんが作詞した曲が大好きなのじゃ！
    english: I want you to take a look at the text I submitted for my audition. Ta-da!
      Documents like this are written in polite desu-masu form. Naturally, if I used
      casual speech here, people would think I have no common sense, so I sent it
      using my usual "-noja" abbreviation style! This is how I wrote and submitted
      it! That's how much I love Vocaro-rock songs and songs composed by Vocaloid
      producers!
  - start: '00:45.330'
    end: '00:49.690'
    original: そして好きなもの丸３！なろう系！
    english: 'And favorite thing #3! Narou-kei light novels!'
  - start: '00:49.690'
    end: '01:14.280'
    original: なろう系めっちゃ好きなのじゃ！味方が誰も死ない、あんまり苦しいハラハラが無いというか、結構ずっと気持ち良く勝ち続けるみたいな、成り上がりって感じじゃから、見ててずっと気持ちいいのじゃ！不安な気持ちにならない内容が多いから、元気ない時とかに、今日は元気ないからお布団で１日ぐーたらしてようかなって日とかに、ずっとなろう系ばっかり読んでるのじゃ！ずっとのじゃえばっか読んでんのじゃ！
    english: I love Narou-kei web novels so much! The allies never die, there's not
      too much painful suspense, and it's like an ongoing triumphant rise where they
      keep winning comfortably, so it feels great to watch the whole time! Since there
      are many stories that don't make you feel anxious, whenever I'm feeling down
      and think, "I have no energy today, so I'll just laze around in my futon all
      day," I just read Narou-kei novels the whole time! I just read noja-stuff all
      day long!
  - start: '01:15.300'
    end: '01:23.630'
    original: なろう系以外にも漫画自体が好きで、なんか少年ジャンプの作品とかも好きなのじゃ。
    english: Besides Narou-kei, I love manga in general, and I'm quite fond of Weekly
      Shonen Jump works too.
  - start: '01:20.150'
    end: '01:23.630'
    original: '[Text: 熱千めらの好きな漫画 転生した大聖女は、聖女であることをひたすら隠す ヘルモード 最強陰陽師の異世界転生記 お気楽領主の領地防衛
      追放された転生重騎士はゲーム知識で無双する 雑用付与術師が自分の最強に気づくまで 町人Aは悪役令嬢をどうしても救いたい ふつつかな悪役ではございますが
      悪役令嬢の中の人 HUNTER×HUNTER ワールドトリガー 【推しの子】 呪術廻戦 約束のネバーランド 暗殺教室 メダリスト バクマン]'
    english: '[Text: Achichi Mela''s Favorite Manga: The Reincarnated Great Saint
      Hides That She Is a Saint, Hell Mode, The Reincarnation of the Strongest Onmyoji,
      Easygoing Lord''s Territory Defense, The Exiled Heavy Knight Reincarnated in
      Game Knowledge, Until the Odd-Job Enchanter Realizes His True Strength, Commoner
      A Wants to Save the Villainess at All Costs, Even Though I''m a Dimwitted Villainess,
      Inside the Villainess, HUNTER×HUNTER, WORLD TRIGGER, Oshi no Ko, Jujutsu Kaisen,
      The Promised Neverland, Assassination Classroom, Medalist, Bakuman]'
  - start: '01:24.080'
    end: '01:29.610'
    original: 怖いもの発表しようかな！怖いもの①サーモン！サーモンって怖くないですか？
    english: 'Shall we announce my fears? Scary thing #1: Salmon! Isn''t salmon terrifying?'
  - start: '01:30.070'
    end: '01:42.590'
    original: なんかわし、ちっちゃい頃はね、焼き魚を結構食べてたんだよ。で焼き魚大好きで、初めて回転寿司に行った時に、わしは英語をちょっと分かってたから、あのサーモンって文字を見て、あ、これは鮭だと思って、
    english: When I was little, you see, I ate grilled fish quite a bit. I loved grilled
      fish so much, and when I went to a conveyor-belt sushi restaurant for the first
      time, since I knew a bit of English, I saw the word "salmon" and thought, "Ah,
      this is chum salmon!"
  - start: '01:43.120'
    end: '02:03.040'
    original: 鮭大好きじゃから、この回転寿司でも、あのサーモンとやらを食べてみようではないかと思ってね、こうお皿を取るじゃないですか。焼き魚だと思って、サーモン食べるじゃないですか。頭がバグって、なんじゃと思って、わしが今まで食べてたあの魚は何処へと思って！そこからずっと怖いのじゃ。
    english: Because I love salmon so much, I thought, "Why don't I try eating this
      'salmon' thing at the conveyor-belt sushi too?" So I picked up a plate, right?
      Thinking it was grilled fish, I ate the salmon, right? My brain completely bugged
      out, thinking "What is this?!", and wondering where on earth the fish I'd been
      eating until now went! Ever since then, I've been terrified of it.
  - start: '02:03.950'
    end: '02:12.720'
    original: 何が起きてるか分かんなくて、なんかこれが来る！これが来る！と思って、食べてみたら全然違う。しかも、しかもなんか濡れてた。しっとりしてる。
    english: I didn't know what was happening, thinking "It's coming! It's coming!",
      and when I ate it, it was completely different. Plus, plus it was wet. It was
      moist.
  - start: '02:12.980'
    end: '02:20.440'
    original: しばらくはそっからサーモンが食べられなかったのじゃ。怖すぎて。もう最初から別物だと思って食べれば怖くないと思ってそっからは普通に食べれるのじゃ。
    english: For a while after that, I couldn't eat salmon. It was too scary. I figured
      if I just think of it as a completely different thing from the start, it won't
      be scary, and ever since then, I've been able to eat it normally.
  - start: '02:21.200'
    end: '02:29.600'
    original: '[Text: MEMO 今では毎回サーモンを食べるぐらい好きだが、小さい頃に焼き魚と勘違いして食べて恐怖を感じていた。]'
    english: '[Text: MEMO: Nowadays I love it enough to eat salmon every time, but
      when I was little, I mistook it for grilled fish and felt terrified.]'
  - start: '02:20.780'
    end: '02:30.120'
    original: 毎回お寿司屋さんに行ったらサーモン食べるぐらい好きではあるんだよ。好きなんじゃよ。でも好きだけど怖くて、なんじゃと思いながらいつも食べてるのじゃ。
    english: Nowadays I like it enough to eat salmon every time I go to a sushi restaurant.
      I do love it. But even though I love it, it's scary, and I always eat it while
      wondering "What in the world is this?"
  - start: '02:30.500'
    end: '02:35.840'
    original: 怖いもの②トースター！これはもう説明不要な気がするのじゃ。トースターって怖くない？
    english: 'Scary thing #2: Toasters! I feel like this needs no explanation anymore.
      Aren''t toasters scary?'
  - start: '02:37.330'
    end: '02:49.770'
    original: わしパン好きなんだが、トースターって急に出てきて怖い。はわわってなるのじゃ。焼き上がりました！ヌルヌル〜って出てきてくれたら、わしだって、あ、焼き上がったなって思うんじゃが、なんかピュンって出てくるから、はわわってなるのじゃ。
    english: I like bread, but toasters pop out out of nowhere and scare me. I go
      "Hawa-wa!" If they slid out smoothly and slimily, I'd be like, "Ah, it's done
      baking," but because they shoot out like *pyun*, I go "Hawa-wa!"
  - start: '02:50.000'
    end: '02:53.300'
    original: '[Text: MEMO パンを食べることが好きだが、トースターで焼くといきなり飛び出してきて怖い。]'
    english: '[Text: MEMO: I love eating bread, but when I toast it, it suddenly leaps
      out and scares me.]'
  - start: '02:50.060'
    end: '02:55.700'
    original: やめてほしい。びっくりさせるのずるいんなのじゃ。
    english: I wish they'd stop. It's unfair to startle me like that.
  - start: '02:56.020'
    end: '03:01.400'
    original: 怖いもの丸３！炎上なのじゃ…炎上ガチで怖いのじゃ。やめてほしいのじゃ…
    english: 'Scary thing #3! Flaming/controversy... I am seriously terrified of online
      controversies. I want people to stop...'
  - start: '03:02.040'
    end: '03:11.750'
    original: 人生で初めて触ったインターネットで叩かれを経験してるから、めっちゃ過剰に恐れてる気がするのじゃ。
    english: Because my very first encounter with the internet in my life involved
      getting flamed and bashed, I feel like I'm excessively terrified of it.
  - start: '03:12.110'
    end: '03:19.460'
    original: 初手で山特定されてますからね、「お前住んでる山ここだろ」言われてますからね、ガチ怖かったよアレ。外出れんよ。
    english: My mountain was pinned down right from the very start, you know! People
      were telling me, "The mountain you live on is right here, isn't it?" That was
      genuinely terrifying. I couldn't even go outside.
  - start: '03:20.100'
    end: '03:43.600'
    original: インターネットってルールとか空気感とかあるじゃろ？あれ初見殺しだと思うのじゃ。アクセスする難易度って低いじゃろ？見るのも楽しく見れるじゃろ？書き込むも簡単じゃろ？初めてインターネット触ったのに書き込めたよ？書き込めたのにダメだった…もっとルールとか書いて欲しいよね。「〇〇はしてください！」「〇〇はしちゃいけません！」みたいなの全部書いて欲しいのじゃ！
    english: The internet has rules and vibes, right? I think that's a beginner trap.
      The barrier to entry for accessing it is low, right? Viewing is fun, right?
      Posting is easy, right? Even though it was my very first time touching the internet,
      I was able to post! Even though I posted, it was no good... I wish they would
      write out the rules more! Like "Please do X!" and "You must not do Y!" I want
      them to write everything out!
  - start: '03:43.800'
    end: '03:46.450'
    original: '[Text: MEMO 匿名掲示板で炎上経験ありのため、炎上には敏感。インターネットは初見殺しだと感じている。]'
    english: '[Text: MEMO: Having experienced online flaming on an anonymous message
      board, I am sensitive to controversies. I feel the internet is a beginner trap.]'
  - start: '03:47.160'
    end: '03:52.420'
    original: わしの夢！わしの夢は人間に恩返しをすることなのじゃ。
    english: My dream! My dream is to repay my debt of gratitude to humanity.
  - start: '03:53.030'
    end: '04:05.860'
    original: 人間として20年間生きてきて、仲間に入れてもらえたのがめちゃくちゃ嬉しかったのじゃ。200年ぐらいずっとひとりぼっちだったし、ずっと寂しかったから、構ってもらえたのがすごく嬉しくて、人間好きなのじゃ。
    english: Having lived as a human for 20 years, I was so overwhelmingly happy to
      be welcomed into a group. I had been all alone for about 200 years and felt
      constantly lonely, so having people pay attention to me made me so happy, and
      I love humans.
  - start: '04:06.310'
    end: '04:23.970'
    original: わしもかつてのわしみたいに、今居場所がなくて1人で寂しいって思ってる人間がもしかしたらいるかもしれないと思って、わしはそんな人間の居場所になりたいのじゃ。次はわしが居場所になることによって、人間に恩を返していくという作戦なのじゃ。
    english: I thought that there might be humans out there right now who, just like
      my former self, don't have a place to belong and feel lonely all by themselves,
      and I want to become a sanctuary for such humans. My strategy is to repay humanity
      by becoming that place of belonging myself next.
  - start: '04:24.360'
    end: '04:39.140'
    original: そしてインターネットでやっぱわしあのかつて痛い目に合いましたから、どんな人間にも優しいインターネット1年生でもね、初心者の方でもね入りやすいそんな配信や動画を作りたいのじゃ。あったかい居場所にしたいのじゃ。
    english: And since I had a painful experience on the internet before, I want to
      create streams and videos that are kind to any human, where even internet freshmen
      and beginners can easily join. I want to make it a warm, cozy sanctuary.
  - start: '04:39.300'
    end: '04:42.500'
    original: '[Text: MEMO 1人で寂しかった自分を受け入れてくれた人間に恩返しをしたい。同じような人間の居場所を作りたい。]'
    english: '[Text: MEMO: I want to repay humanity, which accepted my lonely self.
      I want to create a place of belonging for humans feeling the same way.]'
  - start: '04:43.720'
