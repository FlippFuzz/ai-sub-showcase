    original: いかがだったでしょうか？わしの自己紹介動画見て、熱千めらというサラマンダーがどんな子なのかちょっとは分かってくれたかのお？これから配信とか動画とか見て、もっといろんなわしのことを知っていって欲しいなとは思いつつ、
