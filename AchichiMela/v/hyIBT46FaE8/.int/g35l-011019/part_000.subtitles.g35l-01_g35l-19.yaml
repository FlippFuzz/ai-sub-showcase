  - start: '02:27.248'
    end: '02:29.478'
    original: わしはあと火を吹いたりできるのじゃ！
    english: And I can breathe fire and stuff noja!
  - start: '02:29.838'
    end: '02:41.798'
    original: 火を吹くとこはね、デビューした時、あの情報解禁の時に上げてる映像に火を吹いてるねアニメーションがあってね、それを見てほしいのじゃ！わしのかっこいいところが見れるかもしれないのじゃ！
    english: The part where I breathe fire, you see, when I debuted, in the info-release
