      to put them out! Whoosh whoosh.
  - start: '03:47.412'
    end: '03:51.102'
    original: そしてわしは纏（まとい）持ちというものをやっていたのだ！
    english: And I used to do something called a "matoi-mochi"!
  - start: '03:51.342'
    end: '03:55.222'
    original: なんか火消しで、火を消す人たちがいるじゃろ？
    english: You know how there are firefighters who put out fires?
  - start: '03:55.562'
    end: '04:04.752'
    original: その中でもその纏っていうね、でっかいね、棒にね、なんか付いててね、古い古い奴があるのだ！それをね、持ってね、担うのじゃ！
    english: Among them, there's this big stick with a thing attached to it called
      a matoi, an old-old thing! You hold that and carry it!
  - start: '04:05.102'
    end: '04:15.402'
    original: 当然人間の寿命よりもわしの寿命の方が長いから、仲良かった人間たちがみんないなくなっちゃって、しばらく1人いるか～と思って、その後山に籠ってたのだ！
    english: Naturally, since my lifespan is longer than humans', the humans I was
