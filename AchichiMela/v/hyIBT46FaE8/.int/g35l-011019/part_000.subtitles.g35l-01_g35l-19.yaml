  - term: メラ組
    meaning: The official fan fandom and community name for Achichi Mela's supporters.
  - term: なろう系
    meaning: A genre of Japanese web novels and media originating from Shosetsuka
      ni Narou featuring uplifting, triumphant underdog growth and power fantasies.
  - term: ツミキ
    meaning: A popular Japanese Vocaloid producer whose album 'Sakkaku Craft' (錯覚クラフト)
      Mela deeply admires.
