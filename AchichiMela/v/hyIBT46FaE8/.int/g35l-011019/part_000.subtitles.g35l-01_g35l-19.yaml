  - start: '04:15.652'
    end: '04:16.882'
    original: 200年ぐらい。
    english: For about 200 years.
  - start: '04:17.062'
    end: '04:21.432'
    original: 山に籠ってる間にしてたこと、寝て、起きて、食べて、寝てたのだ！
    english: 'What I did while holed up in the mountains: slept, woke up, ate, and
