  - start: '04:38.832'
    end: '04:42.532'
    original: なんでわしが人間と暮らし始めたかという話なんじゃが
    english: As for why I started living with humans,
  - start: '04:42.752'
    end: '04:46.802'
    original: わしが山で生活していた時にの、山にスマホが捨ててあったんじゃよ。
