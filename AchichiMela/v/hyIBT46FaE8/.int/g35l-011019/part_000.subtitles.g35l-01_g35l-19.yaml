  - start: '03:01.032'
    end: '03:09.912'
    original: あとわしは良い子だから、415（よいこ）歳ってことにしようと思って、415歳ってことにしよと思って
    english: And since I'm a good girl, I thought I'd make my age 415 (yoiko), so
      I decided to make it 415 years old
  - start: '03:10.372'
    end: '03:15.932'
    original: そっから逆算することによって、1611年生まれになったということじゃ。そういうことじゃ。
    english: And by working backwards from there, I ended up being born in 1611. That's
      how it is.
  - start: '03:16.272'
    end: '03:20.942'
    original: 全部うろ覚えなのだ！そんな何百年も前のことを覚えてる訳ないのだ！
    english: It's all vague in my memory! There's no way I remember things from hundreds
      of years ago!
  - start: '03:21.152'
    end: '03:24.522'
    original: ま、わしは400歳ぐらいだと思って頂ければ良いのかなと思うのじゃ。
    english: Well, if you just think of me as around 400 years old, that should be
      fine.
  - start: '03:24.962'
    end: '03:34.902'
    original: そして400年前わしが生まれたての頃何をしていたかと言うと、火消しという職業をしていたのだ！火消しってのは現代で言うところの消防団みたいな
    english: And 400 years ago when I was just born, what was I doing? I had a job
      called a firefighter! Firefighters are like modern-day volunteer fire brigades
  - start: '03:35.152'
    end: '03:47.162'
    original: 文字通り火を消すのじゃ！わしはサラマンダーだからある程度火には強くて、だからあの火事がね、大変になってるところにも行って、わしがこう率先してね、こう火を消していくのじゃ！しゃーしゃーしゃーしゃって。
    english: Literally putting out fires! Since I'm a salamander I'm somewhat strong
