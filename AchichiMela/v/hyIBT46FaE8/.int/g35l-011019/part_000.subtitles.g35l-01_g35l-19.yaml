  - start: '01:23.948'
    end: '01:29.818'
    original: 見てこのツノ！あと尻尾なのだ！どうかのお？可愛いかのう？
    english: Look at these horns! And the tail noja! How is it? Is it cute?
  - start: '01:30.408'
    end: '01:33.888'
    original: サラマンダーとは火を司る精霊らしいのじゃ！
    english: A salamander is apparently a spirit that governs fire!
  - start: '01:34.208'
    end: '01:46.778'
    original: わしの髪の毛からもね、こうやって炎が出ておるじゃろ？これはね、体内の熱をどこかから出さないと、わしが火を吹いちゃって、周りを火だらけにしちゃうから
    english: Flames come out of my hair like this, right? That's because if I don't
      let out the heat inside my body from somewhere, I'll breathe fire and set everything
      around me ablaze!
  - start: '01:47.168'
    end: '01:50.848'
    original: こうやって髪から出すことで、火を暴発しないようにしているんじゃ。
    english: So by letting it out through my hair, I make sure the fire doesn't erupt
      out of control.
  - start: '01:51.278'
    end: '01:54.678'
    original: わし的には正直人間と変わらんくね？と思っているところがあって
    english: Personally, I honestly think I'm no different from humans in some ways,
  - start: '01:55.038'
    end: '01:57.658'
    original: ま、火に強いとは言いつつも、火傷はするのじゃ！
    english: Well, even though I say I'm strong against fire, I do get burns!
  - start: '01:57.918'
    end: '02:10.518'
    original: 手とか指とかは火傷しないんだけど、あの粘膜、粘膜は結構火傷しちゃうから、それこそベロとかあったかいさ、ココアとか飲む時はベロ火傷しちゃって熱くなるのじゃ！
    english: My hands and fingers don't get burned, but mucous membranes, mucous membranes
      get burned quite easily, so when I drink something warm like cocoa, my tongue
      gets burned and hurts!
  - start: '02:11.008'
    end: '02:14.658'
    original: あと、炎属性なんじゃが、夏はめちゃくちゃ暑いのじゃ！
    english: Also, though I have the fire attribute, summer is insanely hot noja!
  - start: '02:15.118'
    end: '02:26.748'
    original: 日本の夏やばいのじゃ！湿度とかもあるからかな？やばいから、熱中症になるのじゃ熱中症！サラマンダーなのに！熱中症とか火傷とかそういうのならないようにすればいいのにね！
    english: Japanese summers are brutal noja! Is it because of the humidity? It's
