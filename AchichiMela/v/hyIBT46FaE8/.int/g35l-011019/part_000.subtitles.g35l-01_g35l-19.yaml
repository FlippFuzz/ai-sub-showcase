  - start: '02:42.502'
    end: '02:47.332'
    original: わしの年齢は415歳！長生きなのだ～！
    english: My age is 415 years old! Long-lived noja~!
  - start: '02:47.802'
    end: '02:52.792'
    original: 生年月日と言うと、1611年4月16日生まれなのだ。
    english: Speaking of my birth date, I was born on April 16, 1611.
  - start: '02:53.222'
    end: '03:00.672'
    original: 何年何月何日とか言ったんじゃが、厳密には覚えてなくて、大体江戸時代だった気がするのじゃ！
    english: I mentioned a specific year, month, and day, but strictly speaking I
