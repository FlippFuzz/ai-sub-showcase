          "header": "**Initial Situation and Early Internet Interactions**",
          "text": "It all started when I was still new to the internet, right after I got my hands on it, without really understanding the unwritten rules of the online world. I was completely clueless about the atmosphere and what was acceptable. So, I was a total beginner, using the internet constantly, and that was in an anonymous message board – a super dangerous place. I started posting comments under fake accounts to protect myself, but it turned out the board was one where sockpuppetry got you outed quickly. Since I also wrote on other threads, they cross-referenced them, using things like IPs, and they figured out I was the same person. And... I got bashed, terribly."
        },
        {
          "header": "**The Impact and Motivation to Understand Humans**",
          "text": "It was scary; truly terrifying. People kept saying things like, 'W-Why are they saying that?' Because I didn't know much about humans, I didn't understand why it was bad, which led me to come down from the mountains to learn about humans. I was taken in by a human father and mother who raised me as a human. I went to school, starting from kindergarten, and learned what it means to be human in human society. I'm a 20-year-old human! And now, whenever I use words like 'father' or 'mother,' I'm referring to the human parents who raised me. I've also put together an 'episode 0' video about my life up until joining Hololive, my salamander life. If you're curious, please watch it!"
        },
        {
          "header": "**Self-Assessment and a Personal Reflection**",
          "text": "Now, let's talk about my personality. I see myself as an honest, kind, and very good girl, or at least, that's my self-assessment. When I met my manager, we had an introductory meeting. During that, I was giving an introduction, and I said, 'I think I'm a kind and good girl!' But then I realized, people who call themselves kind to a stranger probably aren't all that kind. I'm the type who reflects on my day in the shower, and I deeply regretted it. It was a slip of the tongue. I didn't need to say it out loud. Being a 'good girl' is something others find in you. It wasn't something to reveal myself. I didn't need to share it that way. I was washing my hair, thinking about this... What if I ask my manager, 'How do you view me now?' and they say, 'Well, a good... a good girl? I wonder. Isn't that something you tell about yourself?'"
        },
