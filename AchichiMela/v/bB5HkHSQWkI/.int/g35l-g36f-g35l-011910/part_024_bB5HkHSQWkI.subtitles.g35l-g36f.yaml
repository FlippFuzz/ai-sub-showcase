  - start: '01:59.800'
    end: '02:03.600'
    original: はい！9周年だから9個の宝を集めてホロライブを作るのじゃー！
    english: Yes! Since it's the 9th anniversary, let's collect 9 treasures and build
      Hololive!
  - start: '02:05.500'
    end: '02:07.400'
    original: のじゃー！
    english: Noja~!
  - start: '02:07.800'
    end: '02:10.000'
    original: 少年漫画 全部集めだ
    english: That's a total shonen manga trope. Collecting them all.
  - start: '02:09.600'
    end: '02:11.800'
    original: そう 全部乗せなのじゃー！
    english: Yeah, we're putting everything into it!
  - start: '02:12.600'
    end: '02:14.300'
    original: のじゃー！
    english: Noja~!
  - start: '02:13.500'
    end: '02:15.000'
    original: また遊ぼうね
    english: Let me play again.
  - start: '02:14.800'
    end: '02:15.800'
    original: うん！
    english: Yeah!
  - start: '02:15.800'
    end: '02:17.600'
    original: じゃあ おしまい
    english: Okay, then that's the end...
  - start: '02:17.600'
    end: '02:20.500'
    original: おっ手々... ゲームを落とす？
    english: Hands... Close the game?
  - start: '02:18.300'
    end: '02:19.500'
    original: おしまいでしょうか
    english: Are we finishing up?
  - start: '02:21.000'
    end: '02:22.000'
    original: うん
    english: Yeah.
  - start: '02:22.000'
    end: '02:26.200'
    original: 分かった じゃあ挨拶？次も遊び回りたいな挨拶しようか
    english: Got it. Then the sign-off? Let's do our 'Asobi Mawaritai' closing greeting.
  - start: '02:26.500'
    end: '02:27.400'
    original: オッケー！
    english: Okay!
  - start: '02:27.500'
    end: '02:32.400'
    original: じゃあ行くのじゃ！次も〜 遊び〜 回り〜
    english: Alright, here we go! Next time too~ let's play~ around~
  - start: '02:32.500'
    end: '02:35.300'
    original: 隊ー！
    english: Asobi Mawaritai!
  - start: '02:35.500'
    end: '02:38.200'
    original: バイバイー！
    english: Bye-bye~!
  - start: '02:39.200'
    end: '02:40.800'
    original: これで...
    english: With this...
  - start: '02:40.800'
    end: '02:42.500'
    original: よいしょ
    english: Heave-ho...
  - start: '02:43.000'
    end: '02:44.800'
    original: これでえんじゃない？
    english: Isn't this good now?
  - start: '02:46.500'
    end: '02:48.000'
    original: よし
    english: Alright.
  - start: '02:49.800'
    end: '02:54.600'
    original: 出来たのじゃー！お主らー！
    english: I did it! Everyone~!
  - start: '02:54.800'
    end: '02:58.500'
    original: マイクラで遊んだ！いっぱい遊んだ！
    english: We played Minecraft! We played so much!
  - start: '02:58.500'
    end: '03:04.600'
    original: ね！いっぱいの先輩と会ったよ お主らー！いっぱいの先輩と会えて面白かったなー！
    english: Hey! We met so many seniors, everyone! It was so much fun meeting so
      many seniors!
  - start: '03:04.600'
    end: '03:06.500'
    original: ただいまのじゃー！
    english: I'm back!
  - start: '03:07.000'
    end: '03:13.500'
    original: え？なんかすごい あの... 無茶振りどんなの来るかなと思ってたけど 思ったより命が必要なやつだった
    english: Huh? I was wondering what kind of crazy demands would come up, but they
      were way more life-threatening than I expected.
  - start: '03:15.500'
    end: '03:20.500'
    original: 命を求められる サバイバルなお願いがあったりしたね
    english: There were some hardcore survival requests where my life was demanded!
  - start: '03:20.800'
    end: '03:25.000'
    original: 楽しかったのじゃー！面白かったー！
    english: That was so much fun! It was hilarious!
  - start: '03:26.500'
    end: '03:29.800'
    original: え、後でもう一回配信見ちゃおう
    english: Heh, I'm gonna rewatch the stream again later.
  - start: '03:29.800'
    end: '03:36.500'
    original: だってね わし あの先輩とさ 話せるのさ びっくりしてさ
    english: Because, you know, I was so amazed that I could talk to those seniors...
  - start: '03:36.500'
    end: '03:42.000'
    original: 普段さ あの話したことない先輩ともさ 話したりしちゃってさ
    english: I got to talk to seniors I'd never spoken to before...
  - start: '03:42.000'
    end: '03:45.500'
    original: で、声で話すの初めてじゃったからさ
    english: And it was my first time speaking with them via voice chat...
  - start: '03:45.500'
    end: '03:49.800'
    original: すごい不思議な気持ちだった
    english: It felt so surreal.
  - start: '03:49.800'
    end: '03:51.500'
    original: 不思議な気持ちだったのじゃー！
    english: It was such a surreal feeling!
  - start: '03:52.000'
    end: '03:57.000'
    original: え、今度からもっともっと コラボがいっぱい出来ちゃうんじゃない？
    english: Eh, doesn't this mean we can do way more collabs from now on?
  - start: '03:57.000'
    end: '03:59.200'
    original: コラボ解禁が今日じゃから
    english: Since collabs are officially unlocked today!
  - start: '03:59.200'
    end: '04:05.500'
    original: 今回は あの... 偶然エンカウントして お話しするって感じじゃったけど
    english: This time it was more like encountering them by chance and talking...
  - start: '04:05.500'
    end: '04:14.500'
    original: これからはさ もうっとさ 事前にさ「コラボしませんか？」みたいに言って コラボも出来ちゃうってことじゃろ？
    english: But from now on, we can ask them in advance like 'Would you like to collab?'
      and actually set up proper collabs, right?
  - start: '04:14.800'
    end: '04:19.800'
    original: 楽しみがいっぱいなのじゃー！面白かったー！
    english: There's so much to look forward to! It was so fun!
  - start: '04:19.800'
    end: '04:24.000'
    original: メンバーシップ入ってくれた人もありがとうのじゃー！
    english: Thank you to everyone who joined the membership as well!
  - start: '04:24.000'
    end: '04:30.000'
    original: え、そうそう リポとかさ マイクラ文字さ いろんなゲームでさ
    english: Yeah, like Repo or Minecraft, in all kinds of games...
  - start: '04:30.000'
    end: '04:33.200'
    original: 遊べたらいいの 楽しみじゃのう！ありがとうなのじゃー！
    english: If we can play together, how wonderful! I'm so excited! Thank you so
      much!
  - start: '04:33.800'
    end: '04:37.000'
    original: 楽しみがいっぱい... ホロライブに入った実感？
    english: So much to look forward to... Realizing I'm actually in Hololive?
  - start: '04:39.800'
    end: '04:42.000'
    original: 分かんない
    english: I don't know.
  - start: '04:42.000'
    end: '04:46.000'
    original: 分かんない 配信で聞こえてた声が目の前にいてワロタ
    english: I don't know. The voices I used to hear on streams were right in front
      of me, it was hilarious.
  - start: '04:46.000'
    end: '04:49.000'
    original: 本物... 本物いっぱいいてワロタ
    english: The real ones... There were so many real ones, lol.
  - start: '04:49.000'
    end: '04:53.000'
    original: ね、本物いっぱいいた 本物の先輩じゃった 不思議...
    english: Yeah, there were so many real ones. They were the actual seniors. Surreal...
  - start: '04:55.200'
    end: '04:57.800'
    original: 不思議な気持ちだったのじゃー！
    english: It was such a surreal feeling!
  - start: '04:58.000'
    end: '05:00.000'
    original: まあでも ちょっと実感沸いたかも！
    english: Well, but maybe it's starting to sink in a little!
