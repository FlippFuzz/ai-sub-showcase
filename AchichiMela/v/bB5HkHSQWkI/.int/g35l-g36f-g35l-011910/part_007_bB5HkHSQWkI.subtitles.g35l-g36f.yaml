  - start: '02:49.800'
    end: '02:50.800'
    original: じゃあ？
    english: Well then?
  - start: '02:50.800'
    end: '02:52.500'
    original: めら、信じてるぞ。
    english: Mela, I believe in you.
  - start: '02:52.500'
    end: '02:53.300'
    original: はい！
    english: Yes!
  - start: '02:53.300'
    end: '02:55.700'
    original: のじゃー！
    english: Noja~!
  - start: '02:55.700'
    end: '03:01.800'
    original: いつでも消させていただいておりますのじゃ！
    english: I'm ready to douse it anytime, noja!
  - start: '03:01.800'
    end: '03:04.400'
    original: 消したのじゃ！
    english: You put it out, noja!
  - start: '03:04.400'
    end: '03:05.900'
    original: 一瞬ですのじゃー！
