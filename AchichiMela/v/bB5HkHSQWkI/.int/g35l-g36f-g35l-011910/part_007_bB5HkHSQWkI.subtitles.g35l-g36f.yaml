  - start: '04:50.000'
    end: '04:53.300'
    original: 誰が燃やしてるんだー！え、待って待って待って！
    english: Who is setting this on fire?! Wait wait wait!
  - start: '04:53.300'
    end: '04:56.500'
    original: な、何ですか？これは何なのじゃ？
    english: W-What is this? What is happening, noja?
  - start: '04:56.500'
    end: '05:00.000'
