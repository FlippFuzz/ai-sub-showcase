  - start: '02:22.000'
    end: '02:26.500'
    original: これの…今、右手には…見てくれ。
    english: In this... right hand right now... look.
  - start: '02:26.500'
    end: '02:27.500'
    original: なんじゃろ？
    english: What could it be?
  - start: '02:27.500'
    end: '02:30.500'
    original: あらゆるホロメンの頭が…
    english: Head of all Hololive members...
  - start: '02:30.500'
    end: '02:33.200'
    original: 魂を… 魂を携えてるのじゃ。
    english: The souls... carrying their souls, noja.
  - start: '02:33.200'
    end: '02:35.000'
    original: 見てくれ、ほら。
    english: Look here.
  - start: '02:35.000'
    end: '02:37.400'
    original: 本当じゃ！フブミよ…フブミよじゃろ、これ？
    english: It really is! It's Fubumiyo... Fubumiyo, right?
  - start: '02:37.400'
    end: '02:41.500'
    original: 魂を今、持っていらっしゃるのじゃ。命なのじゃ！
    english: You're holding their souls right now, noja. Their lives, noja!
  - start: '02:41.500'
    end: '02:47.300'
    original: そう。これは、今日は来てないけど、この人たちの魂なのじゃな。
    english: Right. These are souls of people who aren't here today, noja.
  - start: '02:47.300'
    end: '02:48.300'
    original: はい。
    english: Yes.
  - start: '02:48.300'
    end: '02:49.800'
    original: じゃあ…
