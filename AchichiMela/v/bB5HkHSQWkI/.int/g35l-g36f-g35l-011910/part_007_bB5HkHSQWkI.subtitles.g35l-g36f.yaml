  - start: '03:05.900'
    end: '03:08.500'
    original: 一瞬なのかー！
    english: That was instant?!
  - start: '03:08.500'
    end: '03:14.300'
    original: 本当に…本当にめらはみこのことを助けに来てくれたのじゃな、これ。
    english: Really... Mela really came to save Mico, noja, didn't you?
  - start: '03:14.300'
    end: '03:18.000'
