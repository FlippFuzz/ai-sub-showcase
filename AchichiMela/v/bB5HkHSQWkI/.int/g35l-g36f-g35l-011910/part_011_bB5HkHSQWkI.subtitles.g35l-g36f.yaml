    original: どうしよう？ モンスターどこにいるの？
    english: What should I do? Where is the monster?
  - start: '02:39.800'
    end: '02:42.500'
    original: え？ 襲撃の１匹捕まってる！
    english: Eh? One of the raid mobs is trapped!
  - start: '02:42.600'
    end: '02:47.300'
    original: 待って、わし寝たいのに！ ちょ、わし寝たいのに！
    english: Wait, I want to sleep! Wait, I want to sleep!
  - start: '02:48.000'
    end: '02:49.000'
    original: あ、これいいんじゃない？
    english: Ah, isn't this fine?
  - start: '02:49.000'
    end: '02:51.200'
    original: 寝れたのじゃー！
    english: I managed to sleep!
  - start: '02:53.600'
    end: '02:57.800'
    original: あ、わしが最後の人だったっぽい。責任感！
    english: Ah, looks like I was the last person needed to sleep. Sense of responsibility!
  - start: '02:58.200'
    end: '03:01.000'
    original: ちょっとじゃあ... え、この人倒していいかな？
    english: Wait then... Eh, is it okay to kill this guy?
  - start: '03:01.600'
    end: '03:05.400'
    original: やばい！ 行けるかな、わし？ 倒せるかな？
    english: Oh no! Can I do this? Can I beat him?
  - start: '03:05.400'
    end: '03:06.300'
    original: 倒していい？
    english: Can I kill him?
  - start: '03:07.000'
    end: '03:10.000'
    original: 行けるか？ やろうと思えば倒せるか？
    english: Can I do it? Can I defeat you bare-handed?
  - start: '03:10.800'
    end: '03:13.600'
    original: 行くよ！ これでダメになったら先輩に助けてもらおう！
    english: Here I go! If this goes badly, I'll ask a senior to help me!
  - start: '03:14.300'
    end: '03:18.900'
    original: えい！ えい！ えい！ 余裕で爆笑！ 重輪のじゃ！
    english: Ei! Ei! Ei! That was unexpectedly easy! Stomping him!
  - start: '03:19.400'
    end: '03:22.500'
    original: のじゃー！ 体力多、こいつ！
    english: Noja~! This guy has so much health!
  - start: '03:22.600'
    end: '03:24.400'
    original: こいつ体力多いな！
    english: This guy has a lot of health!
  - start: '03:24.400'
    end: '03:28.000'
    original: のじゃー！ 死ねのじゃー！
    english: Noja~! Die!
  - start: '03:28.400'
    end: '03:32.700'
    original: あ、死ねはダメなのかな。引け、引け！ のじゃー！
    english: Ah, maybe saying "die" is bad. Retreat, retreat! Noja~!
  - start: '03:32.800'
    end: '03:34.000'
    original: 死んだ！
    english: He died!
  - start: '03:34.300'
    end: '03:37.000'
    original: あ、殺せましたのじゃ。素手で！
    english: Ah, I managed to kill him! Bare-handed!
  - start: '03:37.000'
    end: '03:38.200'
    original: 天才なのじゃ。
    english: You're a genius.
  - start: '03:38.200'
    end: '03:39.600'
    original: やったのじゃー！
    english: I did it!
  - start: '03:39.600'
    end: '03:42.500'
    original: いいよ、先輩と絡みに行ってきたら？
    english: Nice, why don't you go interact with the seniors?
  - start: '03:42.500'
    end: '03:44.200'
    original: ありがとうなのじゃ！
    english: Thank you so much!
  - start: '03:44.300'
    end: '03:46.400'
    original: こっち側から来てたってことは...
    english: If he came from this direction, does that mean...
  - start: '03:46.500'
    end: '03:49.000'
    original: なんかここに挟まっていましたのじゃ、ボートに。
    english: He was stuck right here in the boat.
  - start: '03:49.600'
    end: '03:51.200'
    original: ねー、すごいな。
    english: Yeah, that's amazing.
  - start: '03:51.800'
    end: '03:55.700'
    original: よし！ 先輩を探しに行くのじゃ。
    english: Alright! I'm going to look for the seniors.
  - start: '03:56.000'
    end: '03:57.600'
    original: もうすぐ８時になっちゃう。
    english: It's almost gonna be 8 o'clock.
  - start: '03:59.000'
    end: '04:01.800'
    original: 先輩いるかな...？
    english: Are any seniors around...?
  - start: '04:02.000'
    end: '04:05.100'
    original: さっきさ... さっきさ...
    english: Earlier... Earlier...
  - start: '04:05.400'
    end: '04:11.400'
    original: 近くにいたけどさ、おしゃべりできなかった先輩もさ、いた気がするからの？
    english: I feel like there were seniors nearby earlier who I didn't get to talk
      to.
  - start: '04:12.300'
    end: '04:14.300'
    original: 会いたいのじゃ。
    english: I want to meet them.
  - start: '04:15.300'
    end: '04:17.600'
    original: どこかなー？ 先輩！
    english: Where are they? Senior!
  - start: '04:18.800'
    end: '04:21.000'
    original: 一生みこ先輩に会うのじゃ。
    english: I keep bumping into Mico-senpai.
  - start: '04:21.400'
    end: '04:23.600'
    original: こんにちはー！ こんにちはなのじゃ！
    english: Hello~! Hello!
  - start: '04:23.700'
    end: '04:25.100'
    original: 先輩！
    english: Senior!
  - start: '04:25.200'
    end: '04:26.500'
    original: あ！ 穴開いてる！
    english: Ah! There's a hole open!
  - start: '04:26.600'
    end: '04:29.800'
    original: さすがに穴の中にいたら見つけてもらえないか。
    english: As expected, if I'm inside a hole, no one can find me.
  - start: '04:30.000'
    end: '04:41.200'
    original: やはり助けを... 助けというか、見つけてもらいたい者としては、見つけてもらいたいという顔つきをしていないと...
    english: After all, as someone who wants to be saved... or rather found, if I
      don't look like I want to be found...
  - start: '04:41.300'
    end: '04:44.800'
    original: 見つける側も見つけられ... のじゃ！ 痛い！
    english: The finder can't... Noja! Ouch!
  - start: '04:43.000'
    end: '04:44.800'
    original: ポテト食べよ。
    english: Let me eat a potato.
  - start: '04:45.300'
    end: '04:48.800'
    original: から、見つけててもらいたいのー！
    english: '...so I want to be found!'
  - start: '04:49.000'
    end: '04:51.500'
    original: 先輩ー！
    english: Senior~!
  - start: '04:51.600'
    end: '04:54.000'
    original: あれ誰？ あれ先輩かな？
    english: Who's that? Is that a senior?
  - start: '04:54.000'
    end: '04:57.500'
    original: ちょっと見えないんだよな、目が... 目がちょっと見えなくて。
    english: I can't really see, my eyes... my vision isn't great.
  - start: '04:57.600'
    end: '05:00.000'
    original: 先輩ー！
    english: Senior~!
