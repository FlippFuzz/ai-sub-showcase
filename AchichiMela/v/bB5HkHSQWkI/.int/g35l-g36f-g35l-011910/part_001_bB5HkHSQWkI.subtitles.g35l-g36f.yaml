global_summary:
  overall_summary: In this stream from the channel 'Mela Ch. 熱千めら‐ アソビ★まわり隊!', Hololive's
    newly debuted unit 'Asobi★Mawaritai!' member Achichi Mela embarks on her very
    first senior collaboration event on the official Hololive Minecraft server ('Holosaba').
    Titled '#ホロ鯖かくれんぼ', the unit members explore the vast server, tour various senior-built
    landmarks, and encounter senior members including Tokino Sora, Sakura Mico, Hoshimachi
    Suisei, Natsuiro Matsuri, Houshou Marine, and English branch members. Along the
    way, Mela faces hilarious 'muchaburi' (unreasonable demands), fake confessions,
    accidental arson, and even a mock courtroom trial over Sakura Mico's fiery antics,
    culminating in group photos and heartwarming reflections.
