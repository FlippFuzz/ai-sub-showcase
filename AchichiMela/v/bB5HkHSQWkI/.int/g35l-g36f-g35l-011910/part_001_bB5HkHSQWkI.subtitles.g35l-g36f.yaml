  - start: '03:54.200'
    end: '04:10.000'
    original: ではね、ルールを説明していきたいと思いますけれど... 私達アソビ★まわり隊の4人は、それぞれ自由にいホロ鯖を観光します。 And 先輩タレントの皆様には、20時55分までの時間で私達を探していただきます！
    english: Now, I'd like to explain the rules... The four of us in Asobi★Mawaritai
      will freely tour the Holosaba. And our senior talents will have until 20:55
      to search for us!
  - start: '04:10.500'
    end: '04:21.500'
    original: そしてそして！先輩に見つかってしまったら... いただいた無茶振りに私達は全て全力で答えてやり切ります！
    english: And, and! If we get found by our seniors... we will respond with all
      our might to any improvisational demands they give us!
  - start: '04:22.000'
    end: '04:28.000'
    original: 無茶振ってどういうあれ...？ / 分かんない... / えぐいこと言われる？ / 何言っても違うよね、きっとね。
