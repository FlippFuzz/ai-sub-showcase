    english: Right! Our seniors are definitely kind people, so... they'll be considerate...
      Maybe it'll be super kind demands? I don't know though!
  - start: '04:38.500'
    end: '04:41.500'
    original: どうかな、どうかな... なるほどなのじゃ。
    english: I wonder... I see.
  - start: '04:42.000'
    end: '04:47.500'
    original: あ、ウチら別に隠れるっていうよりは、観光しつつ先輩に会ったら無茶振りに答えるって感じ。 / はい。
    english: Ah, rather than hiding, we're basically touring around and answering
