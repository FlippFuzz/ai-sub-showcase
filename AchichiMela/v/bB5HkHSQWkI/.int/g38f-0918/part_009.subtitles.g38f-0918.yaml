  thoughts: |+
    **A Day in the Life of a Hololive Gamer: The Chimera Incident!**

    Alright, let's break this down. It's me, Su from FLOW GLOW, and it's another wild day in the Hololive Minecraft server. First things first: I'm just cruising, minding my own business, maybe summoning something... and boom! Suddenly, I'm almost a crispy critter. "Almost burned to death", I tell ya! Even a firefighter like me can have a rough day. Wait a sec, what's with that icon in the top right? Is something happening? A raid, maybe?

    And who do I see now? Kyoko, caught by someone. “Nyahallo~~~”! Oh, it's Niko. I'm Miko, but Miko da nye~? This is where the game begins! But this is not the real deal! I was asked to say three cute things about Miko-senpai, but why are you staring at me? I received a face from her but the skin was so wrong! Niko asks me "Will we try it on together?" “Can we really do that?!” Yeah, I'm just here to borrow it. No! I already returned it! It was just a mask, though!

    I was told there's a place to return stuff?! Ah, yeah, I shoulda known, I just thought it was important. Wait, Miko-senpai BURNED me earlier! Thank goodness I had a bucket! I almost died! She made me real hot! Well, since I'm 'Asobi Mawaritai' I was the only one who could hold a bucket, so I endured it, but if I hadn't had it, I would have died! I can't believe I almost became a spirit that's not cared for! "See ya, Kyoko", I thought it was pretty good but oh well! Kyoko, she's like family, so it's a sisterly thing. Ah, the taste? Oh well, I don't know if that potato is real so... I just hope Miko-senpai isn't tricking me. She said it was tasty, but I checked the poisonousness!

    Suddenly, what's this?! Is it time for another raid? What's going on?! I'm turning red?! Am I dying?? WAIT, AM I ON FIRE?! Isn't this bad? Wait, something is coming out of my body? What is this?! I'm wearing Miko-senpai's head, so... huh?! Is this a trap? Is it something Miko-senpai did? I'm gonna run to Tsuzuri now. I’ve drank the potion! Hey Tsuzuri, help me, a raid started. I don't know what's happening. I need milk! Need milk to cure this!

    And now there’s a senpai, wait there's so many of them now, 3 at once, I need help! Suddenly, I get jumped again! Is it a rap battle?! Wait, more people are coming! It's Miko!! “Miyachi!” or "I'm a chimera!"

    I'm being called "Chimera" and I'm answering in English. Why are we doing this right now? It's fine! Let Mikochi deal with it, it's all good, I can rely on them! I'll do anything for them. How about I do an impression? Something other than "Asobi Mawaritai"! Alright! I got the best thing. Nyaaa~~ It's Sakura Miko da nyaaa~?

    Mikochi, how are you doing? I’m doing great-noja-nya~~!


