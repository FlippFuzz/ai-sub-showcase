global_summary:
  overall_summary: This video features a special Minecraft collaboration stream titled
    '#ホロ鯖かくれんぼ' (Holoserve Hide-and-Seek) hosted by Achichi Mela, a member of Hololive's
    newly debuted unit 'アソビ☆まわり隊！' (Asobi Mawari-tai!). Marking their first-ever official
    collaboration with senior Hololive talents approximately one month after debut,
    Mela and her unit mates (Sorashina Sopia, Suzuna Tsuzuri, and Hyakuto Kyoko) explore
    the expansive Hololive Minecraft server while encountering various senior members
    (such as Natsuiro Matsuri, Sakura Miko, Himemori Luna, Takane Lui, and others).
    Along the way, the seniors put the rookies through hilarious 'muchaburi' (unreasonable
    requests/challenges) and playful pranks, leading to chaotic comedic moments, a
    mock courtroom trial over server arson pranks, and commemorative group photos.
