  - start: '04:16.897'
    end: '04:22.377'
    original: えーっと、先輩たちどこいるか探しに行くか。
    english: Let's go look for where the senpais are.
  - start: '04:22.577'
    end: '04:29.817'
    original: のじゃー！こっちから渡る？なんか。みぃ、あ、こっちから行こっか。よし、じゃあついていきますのじゃー！
