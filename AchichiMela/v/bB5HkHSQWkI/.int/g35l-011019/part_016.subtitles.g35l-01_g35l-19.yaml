  - start: '02:44.477'
    end: '02:55.777'
    original: え、違うよ？全員ではないよ。やっぱり人を選んで。人間には、ただの人間には興味ない？やっぱしっぽ生えてたりしなきゃダメ？
    english: Eh, really? Not everyone. Naturally, you pick people. Ordinary humans
