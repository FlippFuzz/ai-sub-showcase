  - start: '01:36.725'
    end: '01:37.945'
    original: 冒険したいのじゃ！
    english: I want to go on an adventure!
  - start: '01:38.865'
    end: '01:40.455'
    original: え、連れてってくれる？冒険。
    english: Eh, will you take us? On an adventure.
  - start: '01:41.725'
    end: '01:43.765'
    original: え、しようしようしたー。
    english: Eh, let's do it!
  - start: '01:44.205'
    end: '01:45.005'
    original: 誰かに任せよう。
    english: Let's leave it to someone.
  - start: '01:45.315'
    end: '01:46.365'
    original: 頑張れ！
    english: Do your best!
  - start: '01:48.015'
    end: '01:50.055'
    original: 任せるのじゃーん！
    english: Leave it to us, ta-da!
  - start: '01:50.395'
    end: '01:55.035'
    original: 連れてってあげるのじゃ、この世の全てにね！
    english: I'll take you to everything in this world!
  - start: '01:55.775'
    end: '02:03.585'
    original: 手に入れるんだ、ワンピースは！宝を全て手に入れて、ホロライブを作るのじゃ！
    english: Get your hands on it, One Piece! Gather all the treasures and build Hololive!
  - start: '02:04.535'
    end: '02:06.605'
    original: そんなにして待ったんだ！
    english: We waited so much for that!
  - start: '02:06.915'
    end: '02:07.815'
    original: 全部集めた！
    english: We collected everything!
  - start: '02:09.185'
    end: '02:12.195'
    original: そう、全部のセナのじゃーん！
    english: Yes, all of them, ta-da!
  - start: '02:15.525'
    end: '02:22.065'
    original: じゃあ、おしまいおでと、ゲームを落とす？うん、分かった。
    english: Well, shall we wrap up and close the game? Yeah, understood.
  - start: '02:22.615'
    end: '02:26.545'
    original: じゃあ挨拶、次も遊び回りたいなの挨拶しよっか。
    english: Well, let's do our greetings, the greeting for the next Asobi Mawari-tai.
  - start: '02:26.975'
    end: '02:36.195'
    original: オッケー！じゃあ行くのじゃーん！次も遊び回りたーい！バイバイン！
    english: Okay! Then here we go, ta-da! Asobi Mawari-tai next time too! Bye-bye-in!
  - start: '02:49.032'
    end: '02:54.122'
    original: できたたのじゃーん、おぬしら！
    english: We made it, ta-da, you guys!
  - start: '02:54.882'
    end: '03:04.702'
    original: マイクラで遊んだ！いっぱい遊んだ！ね、いっぱいの先輩と会ったよ、おぬしら！いっぱいのお先輩と会って面白かったなあ。
    english: We played Minecraft! We played a lot! Hey, we met so many seniors, you
      guys! It was so much fun meeting so many seniors.
  - start: '03:04.812'
    end: '03:06.592'
    original: ただいまのじゃー！
    english: I'm back, ta-da!
  - start: '03:07.412'
    end: '03:13.912'
    original: え、なんかすごい、あの無茶ぶりどんなの来るかなと思ってたけど、思ったより命が必要なやつだった。
    english: Eh, like, wow, I wondered what kind of unreasonable requests would come,
      but it turned out to be something that required more lives than I thought.
  - start: '03:15.092'
    end: '03:25.042'
    original: 命を求められる、サバイバルなお願いがあったりしたね。楽しかったのじゃ、面白かったあ！
    english: There were survival-style requests where our lives were demanded, you
      know. It was fun, so funny!
  - start: '03:27.872'
    end: '03:30.152'
    original: え、あとでもっかい配信見ちゃおう。
    english: Eh, I'll watch the stream again later.
  - start: '03:30.292'
    end: '03:47.342'
    original: ってね、わし、あの先輩とさ、話せるのさ、びっくりしてさ、あの、普段さ、あの話したことない先輩ともさ、話したりしちゃってさ、で、声で話すの初めてじゃったからさ、すごい不思議な気持ちだった。
    english: You know, for me, being able to talk with those seniors was so surprising,
      and I even ended up talking with seniors I'd never talked to before, and since
      it was the first time talking with them by voice, it was such a strange feeling.
  - start: '03:48.332'
    end: '03:51.272'
    original: 不思議な気持ちだったのじゃー！
    english: It was such a strange feeling, ta-da!
  - start: '03:51.962'
    end: '03:59.072'
    original: え、今度からもっともっとコラボいっぱいできちゃうんじゃない？コラボ解禁が今日だからさ。
    english: Eh, won't we be able to do lots and lots of collabs from now on? Because
      today is the collab ban lift, you see.
  - start: '03:59.392'
    end: '04:14.392'
    original: 今回はあの偶然エンカウントしてお話しするって感じだったけど、これからはさ、もっとさ、事前にさ、コラボしませんか？みたいな言ってコラボもできちゃうってことじゃろ？
    english: This time it was like we accidentally encountered each other and chatted,
      but from now on, doesn't it mean we can do collabs by saying beforehand 'Won't
      you collaborate with us?' or something?
  - start: '04:15.062'
    end: '04:23.492'
    original: 楽しみがいっぱいなのじゃー！面白かったあ！見に来てくれた人もうありがとなのじゃー！
    english: There's so much to look forward to, ta-da! It was so fun! Thank you to
      everyone who came to watch, ta-da!
  - start: '04:24.162'
    end: '04:34.022'
    original: え、そうそうレポとかさ、マイクラもじゃしさ、いろんなゲームでさ遊べたらいいの、楽しみじゃの！ありがとうなのじゃー！
    english: Eh, yeah, like reports and Minecraft too, you know, hoping we can play
      in various games, I'm looking forward to it! Thank you, ta-da!
  - start: '04:34.202'
    end: '04:38.252'
    original: 楽しみがいっぱい。ホロライブに入った実感……
    english: Full of anticipation. The realization of having joined Hololive...
  - start: '04:39.462'
    end: '04:46.062'
    original: わかんない。わかんない。配信で聞こえてた声が目の前にいてワロタ。
    english: I don't know. I don't know. Laughing at how the voices I heard on stream
      were right in front of me.
  - start: '04:46.402'
    end: '04:52.272'
    original: 本物、本物いっぱいてワロタ。ね、本物いっぱいいた。本物の先輩じゃった。不思議ー！
    english: Real ones, laughing at how there were so many real ones. Hey, there were
      so many real ones. They were real seniors. So mysterious!
  - start: '04:53.902'
    end: '04:57.652'
    original: 不思議な気持ちだったのじゃー！
    english: It was such a strange feeling, ta-da!
  - start: '04:58.202'
    end: '05:00.822'
    original: までもちょっと実感湧いたかも。
    english: Well, but maybe it started to feel real.
