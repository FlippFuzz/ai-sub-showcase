  thoughts:
  - |-
    **A Salamander's Reflections on Mortality and "Shinkansen 0"**

    Okay, so here's what I'm thinking right now, or rather, what I *was* thinking... Let's see... *sigh*. Right, so I've got this segment, from 90:04.675 to 95:00.656, that is, around 4 minutes and 55 seconds, of this game, "Shinkansen 0," by Chilla's Art. It's a bit heavy, you know?

    Hmm, I was just watching this segment, and it's got me feeling a bit melancholy. I was really getting into this "Shinkansen 0" and the ending really made me think... I mean, the credits started rolling, and I was wondering, "Was it intentional, I wonder?" But really, watching these stories... "Thinking about things like that makes me feel so lonely..." You know? "Yeah... It makes me so sad to think about stuff like that."

