user_context: This is a YouTube video from Mela Ch. 熱千めら‐ アソビ★まわり隊! channel. The video
  title is '一配信で喜怒哀楽が全部見れるホラゲ「新幹線０号」【ホロライブ/アソビ★まわり隊！/熱千めら】'.
