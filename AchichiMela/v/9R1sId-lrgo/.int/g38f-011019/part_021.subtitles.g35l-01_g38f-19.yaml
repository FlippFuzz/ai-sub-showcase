  - start: '03:46.800'
    end: '03:53.300'
    original: 自分の選択だとしてもそうじゃなくてもつらい。追ってきてるやつって主人公をあの世に引っ張ろうとしてる存在、あ！そういうこと？！
    english: Whether it's by their own choice or not, it's painful. The thing chasing
      after you is trying to drag the protagonist to the afterlife... Ah! Is that
      what that is?!
  - start: '03:53.700'
    end: '04:02.500'
    original: じゃあ主人公は結構死の、死の狭間で、死の狭間で「やばい、死ぬ！生きる！死ぬ！生きる！」って選択してる時に…
    english: So while the protagonist is hovering on the verge of death, going back
      and forth like, "Oh no, I'm dying! Live! Die! Live!"...
  - start: '04:02.500'
    end: '04:13.500'
    original: 「えい、死ねい！」つってあの化け物が追いかけてきて、あの、わしのことを最後のひと押ししようとしたってこと？死神的な？！そういうことか！
    english: That monster chased after me like, "Take that, die!" trying to give me
      the final push into death? Like a Grim Reaper?! That's what it was?!
  - start: '04:14.300'
    end: '04:23.700'
    original: え、じゃあワンチャン生き残れるかもぐらいのパーセントであったものを、あの死神が意識して…意識してわしを引きずり込んでたってこと？
    english: So even if there was a slim percentage of surviving, that Grim Reaper
      was deliberately... deliberately trying to drag me down?
  - start: '04:23.800'
    end: '04:27.700'
    original: え、怖い！やめてよー！やめてほしいのじゃ。
    english: Whoa, that's creepy! Cut it out! I want it to stop, noja.
  - start: '04:27.900'
    end: '04:30.000'
    original: 誰も来ないでほしいね、こんなところに。
    english: I hope nobody ever ends up in a place like this.
  - start: '04:30.300'
    end: '04:33.200'
    original: そんなことになったら可哀想です。
    english: That would be so tragic if someone did.
  - start: '04:32.700'
    end: '04:33.800'
    original: 可哀想。
    english: Tragic indeed.
  - start: '04:33.800'
    end: '04:36.500'
    original: この列車をどうにかした方がいいんじゃないですか？
    english: Shouldn't we do something about this train?
  - start: '04:36.300'
    end: '04:40.000'
    original: うん。この列車をどうにかしないと。
    english: Yeah. We need to do something about this train.
  - start: '04:40.000'
    end: '04:46.500'
    original: でもこの列車をどうにかした場合即死か生還かの2択でワロタ。良くない、どちらも…どちらもだな。
    english: But doing something about this train giving you a binary choice between
      instant death or survival is hilarious. Neither is good... neither choice is,
      really.
  - start: '04:46.600'
    end: '04:47.800'
    original: うーん…
    english: Hmm...
  - start: '04:47.400'
    end: '04:48.400'
    original: はいはい。
    english: Right, right.
  - start: '04:48.300'
    end: '04:50.000'
    original: ループする列車…
    english: A looping train...
  - start: '04:49.900'
    end: '04:52.900'
    original: アニメか何かで見た気がする…
    english: I feel like I saw one in an anime or something...
  - start: '04:50.200'
    end: '04:51.900'
    original: あ、出た。アニメくだり。
    english: Ah, there it is. The anime reference.
  - start: '04:52.900'
    end: '04:54.600'
    original: あ！思い出しました！
    english: Ah! I remember now!
  - start: '04:54.200'
    end: '04:54.800'
    original: それ系？
    english: That sort of thing?
  - start: '04:54.900'
    end: '04:56.400'
    original: 何かの番組で…
    english: On some TV show...
