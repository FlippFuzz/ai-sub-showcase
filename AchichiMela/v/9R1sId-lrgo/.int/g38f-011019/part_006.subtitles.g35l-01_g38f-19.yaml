  thoughts:
  - |-
    **A Salamander's Train of Thought**

    Alright, let's see, where were we? Right, subtitles. *Washi* just got tricked by this *wappa* kid, who somehow implied that reaching Car 0 would lead to my salvation! Turns out, it's just the driver's cab… or *so* I thought!  That little rascal then hits me with the "Green Car" bombshell.  *Washi* rarely rides those, but alright, alright, apparently that's the next stage. Should have been told about that from the start!

    So, the rules are: if something's off, I move forward, otherwise turn back. Three mistakes and a ghost arrives, *noja*! This kid, now playing the victim, then asks the most existential question: "why are we here?!" Honestly, what is with this kid?  Anyway, let's just finish this segment, okay?

    The game's a bit laggy, *washi* needs to restart the app, it was stuttering with the text and seems to have issues with the train stage loading, but I should be using a decent computer. Maybe it is the Green Car loading or something. Going to the Green Car section.

    Ah, much smoother now! The setting has changed, the seats are fancier, and it’s a bit dark.  *Washi* likes it brighter, okay? There’s a lady working, and… oh! That green-eyed guy is here again. Still creepy! Right, memorizing this…  That's from the normal car stage. If something is different, go forward, and if not, go back. But… wait… is that… a glowing thing? Is that an anomaly?
