  domain_glossary:
  - term: 新幹線0号
    meaning: Shinkansen 0 (Shinkansen Zero-gou), an anomaly-spotting psychological
      horror walking simulator game developed by Chilla's Art, similar in mechanics
      to 'The Exit 8'.
  - term: アソビ★まわり隊！
    meaning: Asobi☆Mawaritai!, a Hololive sub-unit/generation featuring Netsuchi Mela,
      Sorashina Sopia, Suzuna Tsuzuri, and Hyakuto Kyoko.
  - term: のじゃ
    meaning: Noja, an archaic speech suffix / copula historically associated with
      wise elders or fantasy creatures, used characteristically by Mela.
  - term: 異変
    meaning: Anomaly, unusual or abnormal occurrences in the Shinkansen cars that
      players must spot to progress or trigger correct paths.
  - term: エコノミー症候群
    meaning: Economy class syndrome (deep vein thrombosis), the medical condition
      the protagonist suffered from after being motionless on the train, discovered
      upon waking up in the hospital.
