    Then there's the internal monologue: *I know it's gonna be terrifying. I'm bracing myself.* I'm recalling the blind playthrough, and how I totally panicked, getting that feeling - like *I was way too scared to even try it the first time.* I ran. *Like I was being chased, and I got so scared I ran so fast!*

