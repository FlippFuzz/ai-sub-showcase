global_summary:
  overall_summary: In this YouTube stream, Hololive talent Atsuchi Mela (熱千めら) from
    the unit 'Asobi Mawaritai!' plays the psychological horror indie game 'Shinkansen
    0-gou' (新幹線０号) by Chilla's Art for a second time, aiming to discover more anomalies
    and experience the true ending. After chatting about her favorite music playlist
    and starting the game, Mela navigates through both the regular and Green Car stages
    while dodging anomalies and scary entities. Despite initial frights, chasing sequences,
    and emotional weight surrounding the tragic backstory of the sibling characters
    involved in a train accident, she successfully reaches the true ending and reflects
    on the moving narrative before wrapping up with her upcoming schedule.
