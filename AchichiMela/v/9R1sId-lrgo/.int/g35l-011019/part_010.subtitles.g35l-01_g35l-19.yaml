global_summary:
  overall_summary: In this livestream, hololive VTuber Achichi Mela plays Chilla's
    Art's psychological horror anomaly-spotting game 'Shinkansen 0' (新幹線0号) with the
    goal of discovering the true ending and spotting various anomalies she missed
    previously. She navigates the normal car and green car stages, manages anomaly
    checks, encounters eerie passengers and chase sequences, and ultimately uncovers
    the tragic narrative regarding a train accident and the spirits of two siblings
    caught in a time loop.
