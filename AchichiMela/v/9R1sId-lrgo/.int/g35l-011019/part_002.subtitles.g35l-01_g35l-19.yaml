  domain_glossary:
  - term: 新幹線0号 (Shinkansen 0)
    meaning: A first-person psychological horror and anomaly-spotting game developed
      by Chilla's Art set inside a Japanese Shinkansen bullet train.
  - term: 8番出口ライク (Exit 8-like)
    meaning: A game genre inspired by 'The Exit 8' where players walk through linear
      environments, observe details, and turn back or advance depending on whether
      anomalies are present.
  - term: アソビ★まわり隊！ (ASOBI★MAWARI-TAI)
    meaning: A VTuber unit under hololive featuring members such as Achichi Mela,
      Sorashina Sopia, and Suzuna Tsuzuri.
  - term: エコノミー症候群 (Economy Class Syndrome)
    meaning: Deep vein thrombosis caused by prolonged immobility in a fixed seated
      position, which plays a crucial plot point in the game's framing device.
  - term: のじゃ (Noja)
    meaning: An archaic speech suffix and verbal tick associated with elderly or ancient
      characters, frequently used by Mela.
