global_summary:
  overall_summary: In this livestream, Hololive's Achichi Mela plays Chilla's Art
    psychological horror game 'Shinkansen 0' for a second time, aiming to find remaining
    anomalies and reach the true ending. The stream begins with casual chatting about
    music tastes before diving into the looping bullet train anomaly-spotting gameplay.
    After successfully navigating the normal and green car sections and experiencing
    terrifying chase sequences, Mela uncovers the tragic backstory of the children
    trapped in the train loop, culminating in an emotional true ending and closing
    out with future stream schedules.
