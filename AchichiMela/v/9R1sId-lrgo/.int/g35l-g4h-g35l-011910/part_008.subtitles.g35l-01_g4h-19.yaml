  - start: '04:35.900'
    end: '04:41.950'
    original: ヤバい。ヤバいぜ。あと2回、あと2回で真エンディング行かなきゃいけないのに、わし。
    english: Oh no. This is bad. I only have two more chances to reach the true ending.
  - start: '04:43.000'
    end: '04:48.550'
    original: え、このゲームの必勝法あったのになあ。無かったっぽい、必勝法なんて。
    english: Huh, I thought I had a foolproof strategy for this game. Guess there's
      no such thing.
  - start: '04:49.500'
    end: '04:55.950'
    original: え、ちょっと待って。ちゃんと見よう、ちゃんと見よう。お姉さんも見て。はい、はい、はい。オッケー？後ろ姿オッケー？
    english: Wait a second. Let me look carefully, look carefully. Check the attendant
      too. Yeah, yeah, yeah. Okay? Back view okay?
  - start: '04:56.800'
