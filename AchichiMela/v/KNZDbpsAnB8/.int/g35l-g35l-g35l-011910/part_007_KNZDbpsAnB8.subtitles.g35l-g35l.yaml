global_summary:
  overall_summary: In this stream from Hololive's Asobi★Mawari-tai! member Achichi
    Mela, she plays the indie psychological horror and anomaly-spotting game 'The
    Exit 8' (8番出口) for the first time. Beginning with an opening chat where she discusses
    her memory and announces upcoming Halloween voice packs, Mela dives into the eerie
    underground walkway. Despite initial confidence and claims that memory-based puzzle
    games should be easy, she is repeatedly startled by jump scares, unexpected anomaly
    encounters, and creepy chasers, leading to hilarious and panicked reactions while
    trying to maintain her cute persona. After successfully clearing the game and
    unlocking the true exit, she embarks on an achievement/anomaly collection run
    to hunt down remaining secrets before closing the stream with event promotions
    and her signature farewell.
