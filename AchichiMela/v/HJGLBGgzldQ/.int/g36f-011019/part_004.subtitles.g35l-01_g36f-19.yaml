    original: カン！
    english: Kan!
  - start: '03:51.500'
    end: '03:57.900'
    original: え、これあと1回で終わっちゃうってこと？逆に試合流したいって思ったらあと1回カンしたらいい！
    english: Wait, so one more Kan ends the round? So if I want to force an abortive
      draw, I just need one more Kan!
  - start: '04:01.500'
    end: '04:05.800'
    original: '[Title: 四槓流れ]'
    english: '[Title: Four Quads Abortive Draw]'
  - start: '04:02.100'
    end: '04:05.600'
    original: ええーっ！流れたー！すごーい！
    english: Ehhhh?! It really triggered a draw! Amazing!
  - start: '04:06.000'
    end: '04:10.000'
    original: できたから！できたからちょっと見たいなと思って！
    english: Because I could! I could do it, so I wanted to see it happen!
  - start: '04:10.100'
    end: '04:11.200'
    original: 流しちゃった！
    english: She actually aborted the hand!
  - start: '04:11.300'
    end: '04:14.000'
    original: こういうことね！こういうことが起こる！
    english: So that's how it works! This is what happens!
  - start: '04:14.100'
    end: '04:23.900'
    original: もしくは、キョーコが今2回カンしたけど、キョーコだけが4回カンしたらそれはまた役満なのじゃ！めっちゃ高い点数！
    english: Alternatively, Kyoko called two Kans just now, but if a single player
      calls all four Kans, that becomes a Yakuman! A super high-scoring hand!
  - start: '04:24.000'
    end: '04:28.000'
    original: 1人で4回カン！すごいよね、めっちゃね！
    english: Calling four Kans all by yourself! That's so crazy!
  - start: '04:29.000'
    end: '04:32.400'
    original: 滅多に来ないよね！滅多に来ない！見たことないもん、わし。
    english: It almost never happens! Rarely ever! Even I've never seen it in person.
  - start: '04:33.000'
    end: '04:37.900'
    original: 四暗刻ですらさ、めちゃくちゃすごいじゃん！四暗刻ってことじゃん、ほぼ。
    english: Even Four Concealed Triples (Suuankou) is super rare! It's basically
      like getting Suuankou!
  - start: '04:38.000'
    end: '04:47.900'
    original: 四暗刻は自分の山札からツモって引きだけで全部揃える。鳴かないで3枚揃える。
    english: For Suuankou, you have to draw everything yourself from the wall without
      calling any tiles. You form four concealed triples.
  - start: '04:48.000'
    end: '04:53.000'
    original: 3枚の揃えが4つ？そうそうそう。それが四暗刻なんじゃけど。
    english: Four sets of three matching tiles? Yeah yeah yeah. That's what Suuankou
      is.
  - start: '04:54.000'
    end: '04:59.000'
    original: えー、でも本当に滅多に起きないらしいね、カンめちゃくちゃ。
    english: Ehh, but it really seems super rare to see multiple Kans like that.
