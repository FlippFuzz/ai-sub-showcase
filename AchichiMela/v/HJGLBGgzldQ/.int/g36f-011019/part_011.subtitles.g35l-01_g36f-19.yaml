    original: 便利だねー！めちゃくちゃ賢いよね！
    english: So convenient! And super smart!
  - start: '03:47.000'
    end: '03:51.500'
    original: 分かりやすいし、今待ってる牌も分かるし...
    english: It's easy to understand, and shows which tiles you're waiting on...
  - start: '03:51.500'
    end: '03:55.000'
    original: 「この役で行けそうですよ」みたいな！
    english: Like "You can go for this yaku"!
  - start: '03:55.000'
    end: '03:57.000'
    original: そうそうそう！
    english: Exactly!
  - start: '03:57.000'
    end: '04:03.000'
    original: それも教えてくれるから、今上がっていいのか本当に...みたいな。役ついてねえかそれ、みたいな。
    english: It tells you that, so you know if you can actually win or if you're missing
      a yaku.
  - start: '04:03.500'
    end: '04:08.500'
    original: すごい勉強になった。これやり続けてたら麻雀本当に強くなれそう。
    english: I learned so much. If I keep playing this, I feel like I'll actually
      get really good at mahjong.
  - start: '04:08.500'
    end: '04:10.500'
    original: 詳しくなれそうじゃの！
    english: Looks like you'll become knowledgeable!
  - start: '04:10.500'
    end: '04:12.500'
    original: うん。
    english: Yeah.
  - start: '04:12.500'
    end: '04:19.500'
    original: 面白かったな。アシスト機能がかなり充実してる上に...
    english: That was fun. On top of having robust assistant features...
  - start: '04:19.500'
    end: '04:26.500'
    original: ホロライブ好きな人も楽しめるし、麻雀初心者の方も楽しめそうな感じのアプリじゃったの。
    english: It feels like an app that Hololive fans and mahjong beginners alike can
      enjoy.
  - start: '04:26.800'
    end: '04:32.000'
    original: マジでこれホロライブ大好きの人、超楽しめるぜ！超楽しい！
    english: Seriously, Hololive fans are gonna enjoy this so much! It's super fun!
  - start: '04:33.000'
    end: '04:38.500'
    original: そして、なんと！本日この後、そんなホロじゃんのリリース日が発表されるとか...！
    english: And guess what! Word has it that Holo-jan's release date will be announced
      later today...!
  - start: '04:39.000'
    end: '04:41.500'
    original: 公式の番組で？
    english: On an official program?
  - start: '04:41.500'
    end: '04:45.500'
    original: そう、公式の番組でリリース日が発表されるとの噂！
    english: Yes, rumor has it that the release date will be announced on the official
      broadcast!
  - start: '04:45.800'
    end: '04:47.500'
    original: おー！
    english: Oh!
  - start: '04:48.000'
    end: '04:51.000'
    original: あと1分で始まっちゃう！
    english: It starts in just 1 minute!
  - start: '04:51.200'
    end: '04:54.000'
    original: 8時から！ホロじゃん公式チャンネルにて！
    english: Starting at 8:00 on the official Holo-jan channel!
  - start: '04:55.000'
    end: '04:57.500'
    original: 同時視聴いこう！
    english: Let's go watch it together!
  - start: '04:57.800'
    end: '04:59.800'
    original: 視聴に行こうじゃ！はい！
    english: Let's go watch it! Yes!
