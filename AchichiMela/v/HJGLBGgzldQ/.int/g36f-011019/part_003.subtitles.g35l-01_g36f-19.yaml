global_summary:
  overall_summary: In this YouTube livestream, Netsuchi Mela and her fellow members
    of the Hololive unit 'Asobi Mawari-tai!' (consisting of Hyakudo Kyoko, Suzuna
    Tsuzuri, and Sorashina Sopia) play an early preview version of Hololive's first
    official online mahjong app, 'Holo-jan'. Despite most members being mahjong novices
    ('milisira'), they utilize the app's beginner-friendly support functions, customizable
    rules, and custom voice/visual elements to enjoy fast-paced matches, comical tile
    calls, and friendly banter while promoting the game's upcoming official release.
