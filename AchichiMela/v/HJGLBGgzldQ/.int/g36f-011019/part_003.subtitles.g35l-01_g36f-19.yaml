  domain_glossary:
  - term: ホロじゃん (Holo-jan)
    meaning: Hololive's first official online mahjong game app featuring beginner
      support functions, custom rules, customized tables/riichi sticks/BGM, and 37
      participating Hololive talents.
  - term: アソビ★まわり隊！ (Asobi Mawari-tai!)
    meaning: Hololive's virtual YouTuber unit consisting of Hyakudo Kyoko, Netsuchi
      Mela, Suzuna Tsuzuri, and Sorashina Sopia.
  - term: 聴牌 (Tenpai)
    meaning: A mahjong term meaning being one tile away from completing a winning
      hand.
  - term: 立直 / リーチ (Riichi)
    meaning: A declared ready-hand status in mahjong made when a player is in tenpai.
  - term: 鳴き (Naki)
    meaning: Calling tiles (such as Pon, Chi, or Kan) from other players' discards.
  - term: ドラ (Dora)
    meaning: Bonus indicator tiles that increase point value when held or won with.
  - term: 国士無双 (Kokushi Musou)
    meaning: A rare Yakuman hand composed of all thirteen orphan tiles (terminals
      and honors) plus any matching duplicate.
  - term: オーラス (Ourasu)
    meaning: The final round of a mahjong game.
  - term: カン (Kan)
    meaning: Declaring a quad (four matching tiles) in mahjong, which flips an additional
      dora indicator tile.
