global_summary:
  overall_summary: In this stream, Hololive's 'play supremacy' unit 'Asobi Mawaritai!'
    (comprising Hyakuto Kyoko, Nekketsu Mela, Suzuna Tsuzuri, and Sorashina Sopia)
    plays an early access session of Hololive's new mobile mahjong app, 'Holo Jan'.
    Since most members are mahjong beginners, they rely heavily on the app's beginner-friendly
    assistant features, such as tile recommendations, danger tile warnings, and tutorial
    prompts. Throughout the matches, they experience the highs and lows of calling
    tiles, declaring riichi, managing strict time limits, and figuring out game rules.
    They wrap up by praising the app's customization and learning tools, and remind
    viewers to check out the upcoming official release date announcement stream.
