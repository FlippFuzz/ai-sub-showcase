  domain_glossary:
  - term: ホロじゃん
    meaning: Hololive's official mahjong mobile app featuring Hololive talents, custom
      rules, and beginner support features.
  - term: アソビ★まわり隊！
    meaning: Hololive's 'play supremacy' VTuber unit consisting of Hyakuto Kyoko,
      Nekketsu Mela, Suzuna Tsuzuri, and Sorashina Sopia.
  - term: ドラ
    meaning: Bonus tiles in mahjong that increase hand value when held or won with.
  - term: リーチ
    meaning: A declaration in mahjong that a player is one tile away from winning
      (tenpai), wagering 1,000 points for extra bonuses.
  - term: ポン / チー / カン
    meaning: Tile-calling mechanics used to claim other players' discarded tiles to
      form triplets (pon), sequences (chi), or quads (kan).
  - term: 親 (オヤ)
    meaning: The East position player in a mahjong round who earns higher payouts
      on wins but also pays heavier penalties on losses.
  - term: 国士無双
    meaning: A rare and prestigious yakuman hand (Thirteen Orphans) consisting of
      single 1s, 9s, and all seven honor tiles.
