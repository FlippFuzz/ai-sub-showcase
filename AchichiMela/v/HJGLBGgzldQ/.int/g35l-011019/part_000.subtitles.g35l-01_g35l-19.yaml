  - term: カン
    meaning: A mahjong mechanic where a player gathers four identical tiles, adding
      a new dora indicator and increasing potential points.
  - term: 国士無双
    meaning: A rare yakuman mahjong hand composed of one of each terminal and honor
      tile plus a duplicate of any one of them.
  - term: ドラ
    meaning: Bonus tile indicators in mahjong that grant extra points when held by
      a winning player.
  - term: リーチ
    meaning: A declaration in mahjong that a player is one tile away from winning
      (tenpai), locking their hand to earn extra bonus points.
