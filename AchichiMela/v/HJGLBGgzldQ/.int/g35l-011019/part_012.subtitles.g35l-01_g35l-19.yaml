global_summary:
  overall_summary: In this stream, Neten Mela alongside her fellow Hololive 'Asobi☆Mawaritai!'
    unit members (Sorashina Sopia, Suzuna Tsuzuri, and Hyakuto Kyoko) tries out Hololive's
    new mahjong app, 'Holojan', in an early preview session. Since most members are
    mahjong beginners ('mirishira'), they rely heavily on the app's beginner-friendly
    assist features, such as discard recommendations and tenpai guidance. Throughout
    multiple matches—ranging from standard time settings to ultra-fast 5+5 second
    pacing—the members joke, chase high-value hands like Kokushi Musou, and test out
    customizable reach effects and voice lines, concluding with anticipation for the
    official app release broadcast.
