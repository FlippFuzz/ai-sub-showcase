    Then, there's a comment about a possible misplay, but it seems there was a great draw, the voice of the game announces a riichi, tanyao, red dora. Oh, a Mangan! Nice, good, solid. Then another person gets a super rich, and I'm jealous with 45,000 points...

    Now, the dealer system gets explained. The East player is the dealer and that's who I am now. The player can win or lose big, and the dealer role passes counterclockwise. So if I keep winning, I'm the boss. Forever, basically. It's a death game... with points. If it hits zero, you're out.

