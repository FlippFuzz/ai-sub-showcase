  domain_glossary:
  - term: ホロじゃん (HoloJan)
    meaning: Hololive's official mahjong app featuring 37 talents, custom BGM, stamps,
      and beginner-friendly assist features.
  - term: アソビ★まわり隊！ (Asobi Mawaritai)
    meaning: Hololive VTuber unit consisting of Hyakuto Kyoko, Achichi Mela, Suzuna
      Tsuzuri, and Sorashina Sopia.
  - term: 国士無双 (Kokushi Musou)
    meaning: A prestigious high-tier yakuman mahjong hand composed of 1s, 9s, honor
      tiles, and one matching pair.
  - term: ポン (Pon)
    meaning: A call made in mahjong to claim a discarded tile and form a triplet.
  - term: チー (Chi)
    meaning: A call made in mahjong to claim a discarded tile from the player immediately
      to the left to form a sequence.
  - term: カン (Kan)
    meaning: A call made in mahjong to declare a quad (four matching tiles) and flip
      a new dora indicator.
  - term: リーチ (Riichi)
    meaning: A formal declaration that a player's hand is one tile away from winning
      (tenpai).
  - term: ドラ (Dora)
    meaning: Bonus indicator tiles that increase a hand's point value when held or
      won with.
