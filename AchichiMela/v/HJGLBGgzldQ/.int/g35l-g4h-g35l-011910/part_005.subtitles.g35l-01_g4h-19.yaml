    I'm starting to consider the possibilities. Should I go for something here? I'm trying to decide what to do! I'm trying to figure out what others are going for. Am I doing it wrong? Wait, what's going on here? Am I completely off-base? But, it's okay to make mistakes. If you listen to the advice, you won't make the wrong calls. Plus, the great thing about mahjong is you can beat the super strong players through luck!

