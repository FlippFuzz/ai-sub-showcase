  domain_glossary:
  - term: Phasmophobia
    meaning: A cooperative psychological horror game where players investigate haunted
      environments using investigative tools to identify ghost types.
  - term: デカマンダー (Dekamandar)
    meaning: The unit nickname coined by Kyoko and Mela during the stream, combining
      'Deka' (Detective/Police) and 'Salamander'.
  - term: 義務きゃー (Gimukyā)
