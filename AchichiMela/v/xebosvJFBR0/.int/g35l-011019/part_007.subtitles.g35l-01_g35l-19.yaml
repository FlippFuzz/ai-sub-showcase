  domain_glossary:
  - term: Phasmophobia
    meaning: A cooperative psychological horror game where players investigate haunted
      environments using investigative tools to identify ghost types.
  - term: デカマンダー (Dekamandar)
    meaning: The unit nickname coined by Kyoko and Mela during the stream, combining
      'Deka' (Detective/Police) and 'Salamander'.
  - term: 義務きゃー (Gimukyā)
    meaning: A running joke/stream slang about screaming during horror games not out
      of raw terror, but as a natural social reaction or 'duty'.
  - term: 正気度 (Sanity / 産地)
    meaning: A player sanity meter in Phasmophobia that decreases over time in dark
      areas or near paranormal activity, triggering ghost hunts when depleted.
  - term: EMFリーダー (EMF Reader)
    meaning: A device used to measure electromagnetic field levels (1 to 5) to detect
