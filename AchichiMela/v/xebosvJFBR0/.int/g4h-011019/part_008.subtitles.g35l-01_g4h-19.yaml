  thoughts:
  - |-
    **My Phasmophobia Investigation**

    Alright, let's break down this Phasmophobia gameplay segment featuring Atsuchi Mela and Hyakudo Kyoko. No musical performances here, so that's easy. I need to make sure I transcribe everything precisely, and accurately time each spoken word or action.

    First, I heard "ね？ えいっ," though I think the "ね" might be cut off at the beginning. Then, "あ、ありがとう！" from Kyoko. Mela quickly follows up with "よし、じゃあバイバイ," and Kyoko replies with "バイバイ、ゆっくり帰ってきてね." Wait, there's some overlap! Mela says "あ、こ…" and Kyoko finishes with "バイバイ," but Mela also throws in "閉めてく系か" - I'll need to confirm that. After a "のじゃー," Kyoko says "待ってるからねー," and I think, "Alright." "うちらいつでもいいから交換日記戻すの" - "We can bring back the exchange diary anytime." And I said "Yeah, I'll write anytime." Then, "Let me watch..." and "Let me watch over it for a bit."

    "ちょっと見ててあげよ、これで ... 書いてくれるかなーって" Then I thought: "Even so, there's nothing here... I can't narrow it down..." – and Kyoko's "ねっ." Hmm, "Well, it's down to two choices though." I'm thinking... "Hmm..." and then, "Huh, it looks like I placed the notebook wrong." Wait, did I throw it? "It seems I kind of threw it away, and throwing it down doesn't work." I need to remember F to place it! Kyoko says, "You place it with F, I'll go do it then." I tell her "Thanks, then I'll watch that from behind." I should check sanity. Oh, wow, Atsuchi-san's is lower. "Then I'll just keep some distance from a bit further back and watch." "Looks like Kyoko is placing the notebook for me. And I'm watching it from afar..." Kyoko mentions "Lol you threw so many things in here." "I'm watching~" and then, "Let's go-noja!" It looks like, "Alright!" "Going!" "Indeed." "Mela-chi, you just tossed all kinds of things in there, huh?" "Eh, yeah, I had too many items..." "I had too many items and they were in the way." But Kyoko is, "Oh, it's totally fine." "I threw them away. Oh, is that why it threw things? Anger like 'Don't litter'?" "I wonder if it'll write..." "Will it work?"

    "There's nothing~" "Will it do it?" Then I said, "Wait, it's not mov—huh? Where's Kyoko? Oh, there you are. Scared me." "Yeah, I'm right next to you." "It's not really a jumpscare kind of game, less than I thought." "Might depend on the ghost that shows up." I think, "Oh, I see." "Yeah, there are definitely ones that jump out at you like 'Wah!'" "Oh, so that just means we haven't met one of those yet." I thought, "Hmm, hmm, hmm." "Because those times happen too." "I don't understand anything..." "How long should we wait for this?" "How long should we wait, huh? Hormos..." Kyoko says, "Right, it's tough." Then, "Tough."

    I wonder "In the end, it didn't reach freezing temperatures, right?" "Right, well, it only goes between 5 and 0 degrees." Oh, so, is this Banshee or Hormos? "So it's either Banshee or Hormos?" I'm checking the journal on-screen, but I can't be sure if it's "Banshee" or "Banji" on the screen. Let's see... Wait, is it the official Phasmophobia? Is it an updated or custom map? "Banshee" or "Hormos?" or "Banji" and "Korumos?" Okay, the gameplay title says "Phasmophobia", let's be sure to go with the English name for "Banshee" and for "Hormos". So, "But the Spirit Box didn't react at all." "Right, no Box, right?" "But the D.O.T.S. Projector..." Maybe, "Do I feel like we have to try the Spirit Box one more time?" "
