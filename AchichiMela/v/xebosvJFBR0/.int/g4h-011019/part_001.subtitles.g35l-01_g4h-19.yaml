  thoughts:
  - "**Phasmophobia Prep: A First-Timer's Perspective**\n\nAlright, let's get down\
    \ to business. First, I'm noting the introductions – making sure we're called\
    \ \"Deka Manda.\" It's important to set the stage, you know?\n\nSo, we're diving\
    \ into *Phasmophobia* today. I've heard it's a horror game where you investigate\
    \ haunted locations and figure out which ghost is present. It’s a first for me\
    \ to collab on a horror game, though I've solo'd many before. It appears Kyoko's\
    \ the experienced one, having played this with a *senpai* before, so she'll be\
    \ our guide. I'll get carried and learn the ropes.\n\nIt's a job, after all; we\
    \ gotta earn those wages! We select a mission... and immediately, things get interesting.\
    \ I'm trying to select, and nothing is happening. We are suddenly in \"Ready\"\
    \ state. It looks like it's a 5-minute timer, that this is going to be rushed!\
    \ Apparently, after 5 minutes, things get real bad. We're talking horror game,\
    \ so it's a given that a ghost will show up, right? One of our missions is to\
    \ record a video of the ghost. So, it looks like we need to gear up with cameras\
    \ and other equipment, maybe a sound recorder. \n\nWe are checking the gear, we\
    \ have a little less than 3 things to take. So, now we are equipping - and I want\
    \ the sound recorder. So, I see this instrument, but it's a spirit box? Fake out!\
    \ I want that sound recorder, and a camera, so we grab that! But, wait, Kyoko's\
    \ camera isn't working! The F key isn't working, and the camera isn't starting!\
    \ Is there a problem?! It's a bummer, it's her first job on this equipment, and\
    \ I think I'm the only person ready to work? Looks like I'll be handling everything\
    \ else. I'm going to grab a thermometer and EMF reader – to start! I hear that\
    \ one is supposed to be good, and reacts to ghosts. So, Kyoko wants to grab the\
    \ notepad. A notepad... sounds like a ghost exchange diary to me! How cute, to\
    \ write a diary with a ghost, right? EMF reader! Ok, that was a thing. Hopefully\
    \ it's level 5."
