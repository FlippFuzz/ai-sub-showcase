  thoughts:
  - |-
    **Phasmophobia Investigation - Atsuchi Mela and Hyakudo Kyoko**

    Alright, let's get down to business. I'm reviewing this Phasmophobia gameplay segment featuring Atsuchi Mela and Hyakudo Kyoko, and I'm treating this as a proper investigation in itself.  We need to establish a clear timeline, and accurate transcription is paramount, so I'm laser-focused on the audio and timing.

    We're starting in a bit of a pickle – darkness seems to be key, according to Mela.  Kyoko's got the camera rolling, which is good.  Mela's lending me an EMF reader – a nice, efficient teammate, I'll give her that!  We quickly establish a baseline; we're in a house, and we're looking for evidence.  I'm getting us back in – gotta get that evidence.  Mela's gonna try and "appeal", meaning we hope for a ghost interaction with the Spirit Box (which Mela's holding, so that's the plan).  I’m watching to make sure she keeps her sanity intact, it’s low already!

    Freezing temperatures!  There it is, a great first sign!  A good start on evidence to build our profile.  I'm marking it down - gotta get everything down accurately.  Kyoko is trying to get some photos for cash, though, smart!  Then... a door slams! Now things get interesting.  Mela thinks it was a Spirit Box response - an "appeal". The sliding door won't open, and Kyoko is stuck!  The ghost sounds like it might be the Onryo, but then Kyoko points out we have orbs, freezing temps and the Spirit Box, so we settle on the Onryo. It's time to check the evidence and start to figure out our best strategy.

    Then, there's that freaky sound of the breaker, and the EMF readings get wild!  We have to get all the data to deduce the ghost!  The EMF is reading high, so there's a good chance of it going to level 5... fingers crossed.  Oh, it's cold – I'm looking for evidence... and a mirror... but it's just dirt... grime, nothing!  Frustrating. Then we hear a sound, we see the ghost, and we take off... and Kyoko is down!  Oh no!  Kyoko is dead, and my Sanity is at 14%. I need to figure out how to get out of the house, and deduce who this ghost is!  I gotta keep a level head and check the evidence - the freezing temps and ghost orbs... Time to do some deductive reasoning and try to save myself!
