  - |-
    **A Ghost's Post-Mortem of a Ghost Hunt**

    Okay, here we go. The audio's rolling, and it's time to meticulously synchronize every vocal phrase down to the millisecond. Let's make sure we've got our speakers straight: Atsuchi Mela, orange hair, salamander firefighter, and using "わし," and "〜のじゃ." And Hyakudo Kyoko, blue hair, policewoman. Gotta keep track of those in-game voice cues too, like "Welcome back" around 03:45.

    Right, so we're diving into this transcription chronologically. First off, Mela is giggling, "ひひひ" then Kyoko jumps in with, "紫外線ね" - UV light, got it. Hold up, Kyoko's UV light? Okay, so Mela says, "ご、ごめんごめんごめん！" Acknowledging the confusion. Questionable, should I add in a laugh, or is it already covered by the transcript? What to do with "ひひひ"? OK, let's transcribe. Is this spoken dialogue or laughter? Okay, let's keep going.

    Then Mela wonders if they should leave "D.O.T.S." behind. And where did the camera go? Oh, it was on the floor and the bag was dropped there. Then Kyoko confirms where things were located. Then all of a sudden Mela drops something! Mela's heart starts pounding. What's going on?! Is Mela going to run? "きゃー!" Okay, that sounds like a joke. Then Kyoko says that "kyaa" sounded forced. Mela doesn't understand what's happening and that Kyoko went somewhere. Then Mela wonders if she's died. Yep, looks like it. Humans are so fragile. Then Mela realizes, oh, she's dead. "Wait, what am I?" It's like "Wait, what am I?" But... I'm a ghost?

    She then asks if Kyoko can see her. The UV light wasn't the cause. No freezing temps either. Kyoko probably can't. She says, "Kyoko…oh, looks like I died." OK so Mela says, it's Ghost Writing, and she can't hold this anymore. Then Mela realizes it must've been ghost writing. Feels like she's a ghost now, but I didn't even realize! A smack sound. Huh, that wasn't Mela's sound. So Mela wonders if she can still be killed even as a ghost? It doesn't look like that on the D.O.T.S., so maybe it's not D.O.T.S. Mela's dead, and Kyoko's working hard on figuring out what did it. Maybe it was a Goryo? "Goryo" Mela's heard something. It might be a Goryo, but maybe not? Mela's starting to lose track. Wait, is Melachi saying something? Ok, Mela wants to find Melachi.

    Ok, Kyoko's working hard. "Umm, Goryo throws things, right? Throws things." Since there's nothing on camera, that's not it. Then they eliminate Goryo. What about Dildagast? Kyoko's working hard. They're looking for things that might throw things. Jinn? "Jinn...Said to attack from afar, extremely fast movement speed." That's it! Maybe Oni? Definitely possible. Mela asks if there's no UV, and no D.O.T.S. It might be Oni. Maybe the ghost is Myling? "Myling, Oni" Sounds like her. "Plays with its target." Looks like Kyoko can't hear Mela's voice. That means Mela can't do anything to help. So Mela can just look at Mela's own corpse. Bummer. Can't see anything. No ghosts here.

    Then Mela realizes that because she was killed, Kyoko can't hear. Okay, so Kyoko is working hard for Mela. Is it Myling? How did she die? It's so fast. Can Mela pick too? Mela asks, wait, I can pick? Mela didn't know that. Also, no ambient temp. Well, Mela will take a look. Let's go with Goryo. Mela agrees: "I'll go with Goryo!" Then Mela says: "Goryo is my final answer!" So, Goryo it is! Then Kyoko says: "Melachi! I'm coming right back!" Mela starts to get back home
