    original: あまりなさそう。D.O.T.S.なさそうな予感。
    english: Doesn't seem likely. I have a feeling it's not D.O.T.S.
  - start: '03:41.000'
    end: '03:45.100'
    original: え、これどう？あれD.O.T.S.に入んないよね？なんか画像が乱れたけどさ。
    english: Hey, what do you think? That doesn't count as D.O.T.S., right? The video
      feed got distorted though.
  - start: '03:45.100'
    end: '03:46.700'
    original: はいはいはいはい。
    english: Yeah, yeah, yeah, yeah.
  - start: '03:47.100'
    end: '03:49.500'
    original: あれD.O.T.S.に入んないよね、多分。
    english: That probably doesn't count as D.O.T.S., right?
  - start: '03:50.100'
    end: '03:51.400'
    original: 微妙かな。
    english: Hard to say.
  - start: '03:50.800'
    end: '03:55.100'
    original: チャットの人も見てたんだけどさ、乱れる瞬間、映像が。
    english: Chat saw it too, the moment the footage got distorted.
  - start: '03:52.200'
    end: '03:52.800'
    original: うんうん。
    english: Yeah, yeah.
  - start: '03:55.500'
    end: '03:57.500'
    original: じゃあ、ちょっと見るか。
    english: Well, let's take a look then.
  - start: '03:59.000'
    end: '04:00.200'
    original: そうだよね、入ってないよね！
    english: Right? It doesn't count!
  - start: '03:59.400'
    end: '04:05.700'
    original: で、D.O.T.S.じゃなかったとしたら、EMFか、ちょっとスピリットボックスか...
    english: And if it's not D.O.T.S., then maybe EMF, or Spirit Box...
  - start: '04:03.600'
    end: '04:05.500'
    original: あ、でもD.O.T.S.も意外そう。
    english: Oh, D.O.T.S. seems unlikely too.
  - start: '04:06.600'
    end: '04:08.900'
    original: ま、可能性としてはあり得るよね。
    english: Well, as a possibility, it could still happen.
  - start: '04:08.900'
    end: '04:11.300'
    original: 紫外線もちゃんと見れなかったなあ。
    english: We couldn't check UV properly either.
  - start: '04:11.900'
    end: '04:13.900'
    original: 紫外線も可能性あるか。
    english: UV is a possibility too, huh.
  - start: '04:14.100'
    end: '04:16.200'
    original: 部屋広いからね、なにしろ。
    english: The house is huge, after all.
  - start: '04:17.500'
    end: '04:19.000'
    original: ジン。
    english: Jinn.
  - start: '04:18.900'
    end: '04:20.000'
    original: これむずいな。
    english: This is tough.
  - start: '04:19.800'
    end: '04:21.500'
    original: 襲いかかってくる。うん、うん、うん。
    english: It attacks. Mhm, mhm, mhm.
  - start: '04:22.100'
    end: '04:27.500'
    original: そうだね、追いかけてったから。待って、ジンかミミックかツインズでしょ？
    english: Yeah, since it chased after you. Wait, it's either Jinn, Mimic, or Twins,
      right?
  - start: '04:27.500'
    end: '04:31.000'
    original: ジンか、ミミックか...
    english: Jinn, or Mimic...
  - start: '04:30.600'
    end: '04:31.600'
    original: うん。
    english: Yeah.
  - start: '04:32.200'
    end: '04:33.700'
    original: でもオーブなかった？
    english: Wait, wasn't there an Orb?
  - start: '04:34.700'
    end: '04:35.600'
    original: オーブなかった。
    english: There was no Orb.
  - start: '04:35.500'
    end: '04:38.200'
    original: オーブ、ここまでカメラやってて映んないから。
    english: We've had the camera up this whole time and no Orb showed up.
  - start: '04:36.200'
    end: '04:38.200'
    original: じゃあミミックじゃないじゃん！
    english: Then it's not a Mimic!
  - start: '04:38.900'
    end: '04:40.200'
    original: え、ミミック、オーブ？
    english: Wait, Mimic has Orbs?
  - start: '04:40.200'
    end: '04:44.900'
    original: このゴーストの付近にはゴーストオーブに似た現象が発生するとされている、って書いてない？
    english: Doesn't it say, "A phenomenon similar to Ghost Orbs occurs near this
      ghost"?
  - start: '04:44.800'
    end: '04:45.800'
    original: あぁ〜！
    english: Aaaah~!
  - start: '04:46.100'
    end: '04:48.800'
    original: 似た現象か、なるほどね！
    english: A similar phenomenon, I see!
  - start: '04:48.800'
    end: '04:50.300'
    original: から、ミミックじゃないか。
    english: So it's not a Mimic, then.
  - start: '04:50.300'
    end: '04:51.600'
    original: じゃあ大丈夫か。
    english: Then we're good on that.
  - start: '04:53.000'
    end: '04:57.900'
    original: 「2体のうちどちらかのゴーストを挑発するとハントを誘発することが可能」
    english: '"Provoking either of the two ghosts can trigger a hunt."'
  - start: '04:58.200'
    end: '04:59.500'
    original: ジンか...
    english: Jinn, or...
