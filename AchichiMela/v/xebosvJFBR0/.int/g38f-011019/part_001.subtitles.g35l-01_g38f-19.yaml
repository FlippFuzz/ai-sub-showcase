  domain_glossary:
  - term: Phasmophobia
    meaning: A cooperative ghost-hunting psychological horror video game where players
      investigate haunted locations to gather evidence.
  - term: でかマンダー (Dekamander)
    meaning: An impromptu collab unit name coined by Mela and Kyoko, combining 'Deka'
      (Detective) and 'Manda' (Salamander).
  - term: EMFリーダー (EMF Reader)
    meaning: Equipment used to detect electromagnetic field levels caused by paranormal
      activity, scaling up to Level 5.
  - term: サンチ (Sanity)
    meaning: Player sanity meter that decreases in dark or eerie environments, triggering
      ghost hunts when depleted.
  - term: ゴーストオーブ (Ghost Orb)
    meaning: Floating paranormal orb phenomenon visible through video cameras as evidence
      of a ghost.
  - term: 氷点下 (Freezing Temperatures)
    meaning: Evidence indicated when room temperatures drop below 0°C.
  - term: 紫外線 (Ultraviolet / Fingerprints)
    meaning: Evidence revealed using UV lights on doors, windows, and light switches
      touched by ghosts.
  - term: ゴーストライティング (Ghost Writing)
    meaning: Evidence written by ghosts inside a placed notebook.
  - term: スピリットボックス (Spirit Box)
    meaning: Radio equipment used to speak aloud and receive voice responses from
      ghosts.
  - term: 義務きゃー (Gimu Kyā)
    meaning: Mandatory scream; humorous VTuber slang for putting on an appropriate
      surprised reaction when startled during streams.
