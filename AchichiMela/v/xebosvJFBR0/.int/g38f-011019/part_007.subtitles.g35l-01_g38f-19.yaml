  - |-
    **Phasmophobia Investigation - Netsuchi Mela & Hyakuto Kyoko**

    Alright, let's get this summary going. I'm taking on a new Phasmophobia investigation, and this time, I'm with Hyakuto Kyoko. The time window to zero in on is from 35:00.056 to 40:00.064 of the stream. Our local start time is 00:00.000, so I'll be referencing that. My name is Netsuchi Mela, and I use 'washi' and 'noja', and Kyoko's the energetic type, all hero cop vibes. She's got a higher pitch and calls out items and such.

    We are hunting down the ghost in the house.

    Here's the breakdown of what went down.

    Kyoko kicks things off by spotting UV handprints, real enthusiastic about it. I give a "Nice!" and Kyoko echoes the enthusiasm. She spots the UV and the EMF goes off but only to level 2, so it's not a real indicator. She notes how we have to be careful since we are here, and sanity might be affected. I then try my go-to line, asking for a sign. A few repeated requests follow. It's radio silence, so it seems like we got nothing. Time to think. I wonder if I can head back to the truck. Kyoko is keen on checking the ghost writing, so I decide to do that too.

    Then I get thinking, it has to be pitch black for the ghost to interact, and Kyoko is gone. I then close the door. I try for a sign, and it seems this one is locked.

    I then keep requesting the ghost to give a sign and make my voice louder. I then get locked in and Kyoko's out, and I panic and request for help. Then I note the ghost is a writing ghost, I pick up the items, and somehow, the door opens, and I am freed.

    The key to it is now the writing. We try the notebook, the newspaper, and Kyoko spots how the ghost can read. So, it's a reading ghost.

    Then we try to figure out the last evidence. The temperature dropped down to 5, but not below freezing, and then we notice the orbs. We get excited that there's an orb and a thrown object. We decide we might be hunting a Banshee, Hantu, or Goryo. Kyoko points out we have a combo, Banshee, Hantu... We then wonder about it and notice how the ghost can sing but we didn't notice any singing. This rules out Banshee, so we're leaning toward Hantu. She asks me to confirm if it has gone below freezing again. Our sanity is at 65% so we should be good to confirm. We bring the notebook again and close the door, and that's it!
