    english: Oh, let's do that! Let's go with that then!
  - start: '02:44.800'
    end: '02:46.800'
    original: うん そっちにしよう
    english: Yeah, let's do that.
  - start: '02:45.300'
    end: '02:47.000'
    original: そっちのが楽しいや！
    english: That's way more fun!
  - start: '02:46.400'
    end: '02:50.000'
    original: テーマパークさん 案件お待ちしておりますのじゃ
    english: Theme park sponsors, we're eagerly waiting for your offers!
  - start: '02:50.000'
    end: '02:51.600'
    original: お待ちしております！
    english: We're waiting for your inquiries!
  - start: '02:51.600'
    end: '02:56.000'
    original: 後でマネージャーさんに相談しようっと 「ウチラ テーマパーク調査したいです」って言って
    english: I'll consult our manager later and say, "We want to do theme park investigations!"
  - start: '02:55.000'
    end: '02:56.500'
    original: したいかも
    english: I'd really love to.
  - start: '02:57.300'
    end: '02:58.700'
    original: やろう やろう！
    english: Let's do it, let's do it!
  - start: '02:58.500'
    end: '03:00.000'
    original: のじゃー！
    english: Noja-!
  - start: '02:59.800'
    end: '03:02.100'
    original: のじゃ！のじゃ のじゃ！
    english: Noja! Noja, noja!
  - start: '03:03.200'
    end: '03:04.600'
    original: え 今日楽しかったね！
    english: Man, today was really fun!
  - start: '03:04.300'
    end: '03:10.500'
    original: 楽しかった なんか 簡単かも え 怖くなかったんだけど わし 叫ばなかったけど何これガチ
    english: It was fun. It felt pretty easy, honestly. Like, I wasn't even scared.
      I didn't scream at all, seriously.
  - start: '03:10.800'
    end: '03:12.600'
    original: なんで...確かに 「きゃー！」
    english: Why though... True. Just "Kyaah!"
  - start: '03:13.200'
    end: '03:15.500'
    original: 「きゃー！」しか言ってないや
    english: We only ever said "Kyaah!"
  - start: '03:15.900'
    end: '03:17.800'
    original: 「きゃー！」しか言ってないよ わし
    english: I only said "Kyaah!"
  - start: '03:17.700'
    end: '03:20.500'
    original: なんかさ...
    english: Like...
  - start: '03:18.500'
    end: '03:20.000'
    original: 「きゃー」「きゃー」しか うん
    english: Just "Kyaah," "Kyaah." Yeah.
  - start: '03:20.200'
    end: '03:24.400'
    original: わし ジャンプスケアが苦手なんじゃけど ジャンプスケアなかったよ
    english: I'm really bad with jumpscares, but there weren't any jumpscares!
  - start: '03:24.700'
    end: '03:27.700'
    original: おかしいな あるはずなんだけどな...
    english: That's weird, there should definitely be some...
  - start: '03:27.300'
    end: '03:29.600'
    original: え 今日これまでやった時あった？
    english: Wait, were there any during our runs earlier today?
  - start: '03:30.000'
    end: '03:33.000'
    original: え てか死ぬ時ジャンプスケアじゃなかった？
    english: Wait, wasn't dying a jumpscare?
  - start: '03:33.000'
    end: '03:36.500'
    original: え なんか気付か...自分が死んだこと気付かなかったの まず
    english: Well, first of all, I didn't even notice I had died.
  - start: '03:38.200'
    end: '03:42.900'
    original: 自分の死体を見て 「え 何これ？幽霊？」と思ったら自分じゃった みたいな
    english: I looked down at my corpse and thought, "Wait, what's this? A ghost?"
      only for it to be me.
  - start: '03:43.700'
    end: '03:47.400'
    original: 強すぎる！ホラゲに向きすぎている！
    english: You're built different! You're way too suited for horror games!
  - start: '03:48.500'
    end: '03:57.800'
    original: わし...わし もしかしてあれかもね 1人でホラゲやると怖いけど 喋りながらじゃったら意外とできちゃうんじゃない？もしかして
    english: I... Maybe, you know, horror games are scary alone, but when I'm chatting
      like this, I can surprisingly handle them.
  - start: '03:58.700'
    end: '03:59.800'
    original: 運が良かったのか...
    english: Or maybe we were just lucky...
  - start: '03:59.500'
    end: '04:03.500'
    original: 確かに ロジックに...すごいロジカルになれるからなのかな？
    english: True. Maybe because you can think logically... really rationally?
  - start: '04:04.100'
    end: '04:08.500'
    original: え それか単に気付かなかった可能性があって
    english: Or there's a chance I just completely missed it.
  - start: '04:08.500'
    end: '04:15.500'
    original: なんか 一応明るさを一番明るくしてはいるものの 家具が飛び交ってるのとかを理解できてなかった
    english: Like, even though I turned the brightness all the way up, I didn't even
      register that furniture was flying around.
  - start: '04:16.100'
    end: '04:17.800'
    original: あ なるほどね！
    english: Ah, that makes sense!
  - start: '04:17.300'
    end: '04:20.500'
    original: 気付かなかったの わし
    english: I just didn't notice it.
  - start: '04:19.500'
    end: '04:25.000'
    original: なんか キョーコが「飛んでる！」みたいなのを言うたびに 「え どこどこどこ？何 どれが飛んでるん？」
    english: Every time you shouted "It's flying!", I was like, "Wait, where, where,
      where? What? What's flying?"
  - start: '04:26.800'
    end: '04:29.500'
    original: 鈍感だっただけかも...
    english: Maybe I'm just oblivious...
  - start: '04:28.700'
    end: '04:31.500'
    original: 鈍感系 鈍感系だ！
    english: Oblivious! You're the oblivious type!
  - start: '04:31.400'
    end: '04:33.000'
    original: 気づいてなかった
    english: I just had no idea.
  - start: '04:32.400'
    end: '04:35.000'
    original: え 今度つーちゃんとやってみてほしいわ
    english: Man, I want you to play this with Tsuu-chan next time.
  - start: '04:35.000'
    end: '04:37.300'
    original: 気づ...確かに！
    english: Realize... True!
  - start: '04:36.300'
    end: '04:37.800'
    original: つーも ね？
    english: Tsuu-chan too, right?
  - start: '04:38.000'
    end: '04:39.900'
    original: ね？鈍感系だから
    english: Right? She's the oblivious type too.
  - start: '04:39.800'
    end: '04:45.000'
    original: 確かに！両方とも鈍感系じゃから 2人とも何が怖いのかわかんないまま終わっちゃうかも
    english: Totally! We're both oblivious, so the game would probably just end without
