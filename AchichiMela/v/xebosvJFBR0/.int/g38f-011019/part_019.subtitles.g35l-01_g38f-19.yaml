  - start: '04:43.900'
    end: '04:47.300'
    original: そうそうそう！わかんない可能性がね ちょっと
    english: Exactly! There's a real possibility neither of you would understand.
  - start: '04:47.200'
    end: '04:50.400'
    original: しかもこれ 人数もっと増やしてできるんじゃろ？確か
    english: Plus, we can play this with more people, right? If I remember right.
  - start: '04:50.400'
    end: '04:52.500'
    original: あ 4人まで行けるはずだよ これ
    english: Ah, this game can go up to four players!
  - start: '04:52.300'
    end: '04:55.100'
