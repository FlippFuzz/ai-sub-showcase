  - start: '04:31.900'
    end: '04:33.200'
    original: うん。
    english: Yeah.
  - start: '04:32.700'
    end: '04:34.900'
    original: 何？新しいお家って。
    english: What do you mean, new houses?
  - start: '04:35.300'
    end: '04:37.300'
    original: てか、いっぱいあるんだ？
    english: Wait, there are so many of them?
  - start: '04:37.000'
    end: '04:39.200'
    original: ステージがいっぱいあるんだ！あ、本当だ！
    english: There are lots of stages! Oh, you're right!
  - start: '04:39.200'
    end: '04:40.400'
    original: うん。
    english: Yeah.
  - start: '04:40.800'
    end: '04:44.200'
    original: はいはいはい。え、わし選べるのかな？
    english: Right, right. Can I pick one?
  - start: '04:44.200'
    end: '04:46.400'
    original: わしの画面で選べるのかな？
    english: Can I select from my screen?
  - start: '04:45.900'
    end: '04:47.300'
    original: 選べそうね？
    english: Looks like you can, right?
  - start: '04:47.000'
    end: '04:49.700'
    original: 6、42、10。うん。
    english: 6, 42, 10. Yeah.
  - start: '04:47.800'
    end: '04:49.000'
    original: 当たんない、私が...
    english: It won't let me...
  - start: '04:49.800'
    end: '04:52.000'
    original: シール貼れるの、こうやって？
    english: You can stick a photo on it like this?
  - start: '04:51.600'
    end: '04:53.300'
    original: シール？ほう。
    english: A sticker? Oho.
  - start: '04:53.300'
    end: '04:55.200'
    original: うん、「ここがいいよ」みたいな。
    english: Yeah, like 'I vote for this one'.
  - start: '04:55.100'
    end: '04:58.200'
    original: ほーん。どこで貼るのじゃ？
    english: Ooh. How do you stick it?
  - start: '04:58.100'
    end: '05:00.000'
    original: クリックすると...
    english: When you click it...
