  - start: '04:18.600'
    end: '04:23.700'
    original: そう、幽霊に好かれちまうから、わし、いいハンターすぎて殺された、初手で。
    english: Right, because ghosts love them, I was too good of a hunter and got killed
      right off the bat.
  - start: '04:26.200'
    end: '04:28.000'
    original: ジンだった。ジンって...
    english: It was a Jinn. What is a Jinn...
  - start: '04:26.900'
    end: '04:28.500'
    original: えっとな、ちなみにさ...
    english: Um, by the way...
  - start: '04:28.300'
    end: '04:29.500'
    original: うん、何何？
    english: Yeah, what?
  - start: '04:29.500'
    end: '04:32.400'
    original: 今、今ので新しいお家とかさ、出てきた？
