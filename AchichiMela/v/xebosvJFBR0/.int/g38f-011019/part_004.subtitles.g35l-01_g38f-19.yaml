  - start: '03:56.500'
    end: '03:59.300'
    original: 大いにな。ひひひひ...
    english: To the fullest, huh? Tee-hee-hee...
  - start: '03:59.000'
    end: '04:02.500'
    original: 違う、作品が違うのじゃ！作品が全然違う！
