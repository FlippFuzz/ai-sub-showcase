  - start: '03:42.300'
    end: '03:44.700'
    original: え、いけるか？当たるかなあ？
    english: Did we get it? Will it be right?
  - start: '03:44.700'
    end: '03:45.900'
    original: Welcome back.
    english: Welcome back.
  - start: '03:45.300'
    end: '03:46.400'
    original: Welcome back.
    english: Welcome back.
  - start: '03:46.000'
    end: '03:48.300'
