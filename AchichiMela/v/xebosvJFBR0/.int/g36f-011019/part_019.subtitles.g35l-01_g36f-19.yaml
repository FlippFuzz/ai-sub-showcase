  - start: '03:17.700'
    end: '03:24.400'
    original: なんかさ、わしジャンプスケアが苦手なんじゃけど、ジャンプスケアなかったよ。
    english: You know, I'm bad with jump scares, but there weren't any jump scares.
  - start: '03:24.400'
    end: '03:27.400'
    original: おかしいな。あるはずなんだけどな…
    english: Strange. There should be jump scares...
  - start: '03:27.400'
    end: '03:29.800'
    original: え、今日キョーコ前やった時あった？
    english: Wait, did you have them when you played before, Kyoko?
  - start: '03:29.900'
    end: '03:32.600'
    original: えっ、てか死ぬ時ジャンプスケアじゃなかった？
    english: Wait, wasn't it a jump scare when dying?
  - start: '03:32.600'
    end: '03:36.600'
    original: え、なんか気づか…自分が死んだこと気づかなかったのまず。
    english: Wait, I didn't even notice... First off, I didn't notice that I died.
  - start: '03:37.700'
    end: '03:43.000'
    original: 自分の死体を見て「え、何これ？幽霊？」と思ったら自分じゃったみたいな。
    english: I looked at my own corpse and thought 'Eh, what's this? A ghost?', and
      it turned out to be me.
  - start: '03:43.000'
    end: '03:47.300'
    original: つ、強すぎる！ホラゲに向きすぎている！
    english: So, so strong! You're way too suited for horror games!
  - start: '03:48.300'
    end: '03:57.600'
    original: わし、わしもしかしてあれかもね、1人でホラゲやると怖いけど、喋りながらじゃったら意外と出来ちゃうんじゃない？もしかして。
    english: Maybe... when I play horror games alone it's scary, but while talking,
      I can unexpectedly handle it?
  - start: '03:58.200'
    end: '04:03.400'
    original: ロジックに…すごくロジカルになれるからなのかな？
    english: Because you can... become really logical?
  - start: '04:03.400'
    end: '04:15.900'
    original: それか、単に気づかなかった可能性があって。明るさを一番明るくしてはいるものの、影が飛び交ってるのとかを理解できてなかった。
    english: Or there's a possibility I simply didn't notice. Even though I maxed
      out the brightness, I couldn't comprehend things like shadows flying around.
  - start: '04:15.900'
    end: '04:17.300'
    original: あ、なるほどね！
    english: Ah, I see!
  - start: '04:16.800'
    end: '04:27.600'
    original: 気づかなかったの、わし。なんかキョーコが「飛んでるー！」みたいなのを言う度に「え、どこどこどこ？どれが飛んでるんじゃ？」って。
    english: I just didn't notice. Every time Kyoko was like 'It's flying!', I was
      like 'Eh, where, where? Which one is flying?'
  - start: '04:27.600'
    end: '04:31.700'
    original: 鈍感だっただけ？鈍感系？鈍感系だ！
    english: You were just dense? Dense-type? A dense type!
  - start: '04:31.300'
    end: '04:34.000'
    original: 今度、つーちゃんとやってみてほしいわ。
    english: I want you to try playing with Tsu-chan next time.
  - start: '04:33.600'
    end: '04:36.700'
    original: 気づ…確かにな。
    english: Didn't notice... That's true.
  - start: '04:36.500'
    end: '04:39.900'
    original: 多分ね、鈍感系だから。
    english: Probably, because you're a dense type.
  - start: '04:39.600'
    end: '04:46.300'
    original: ふたりとも鈍感系じゃから、ふたりとも何が怖いのか分からないまま終わっちゃうかも。
    english: Since both of us are dense types, we might both end up finishing without
      ever realizing what was scary.
  - start: '04:45.000'
    end: '04:47.300'
    original: 分からない可能性がね、ちょっと…
    english: There's a chance you won't know...
  - start: '04:46.900'
    end: '04:49.800'
    original: しかもこれ人数もっと増やしてできるんじゃろ、確か。
    english: And I think we can play this with more people.
  - start: '04:49.800'
    end: '04:52.000'
    original: あ、4人までいけるはずだよ、これ。
    english: Ah, this should go up to 4 players.
  - start: '04:51.600'
    end: '04:54.600'
    original: え、じゃあアソビまわり隊でもできそうじゃん。
    english: Eh, then Asobi Mawari-tai could play together too.
  - start: '04:54.600'
    end: '04:57.900'
    original: あ！やろう！いけるかも！
    english: Oh! Let's do it! We might be able to!
  - start: '04:57.300'
    end: '05:00.000'
    original: そっちの方がね、遊びまわり…
    english: That way...
