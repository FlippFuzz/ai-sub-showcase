global_summary:
  overall_summary: This livestream features Hololive members Netsuchi Mela and Hyakuto
    Kyoko from the unit 'アソビ☆まわり隊！' (Asobi Mawari-tai!), affectionately dubbed 'デカマンダ',
    playing the cooperative psychological horror game Phasmophobia. Across multiple
    spooky investigations, the duo methodically sets up investigative equipment—such
    as EMF readers, thermometers, D.O.T.S. projectors, and spirit boxes—to track down
    ghosts, gather evidence, and correctly identify entities while reacting with deadpan
    composure and humorous banter. Following the main collaboration, Mela transitions
    into her solo ending segment ('C-part'), interacting with chat, discussing potential
    future horror game challenges, and sharing announcements regarding merchandise
    and voice packs before signing off.
