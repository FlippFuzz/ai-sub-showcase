  - |-
    **Phasmophobia Prep: A Quick Run-Down**

    Okay, so here's the deal. I'm taking the timestamps from the video segment (between `05:00.008` and `10:00.016`, converted to local time starting at `00:00.000`), to set up a Phasmophobia session. The clip runs for about 5 minutes.

    First off, I'm setting the scene. We're in this truck. My partner, Kyoko, and I are chatting. It starts with greetings, "Deka Manda de yoroshikuuu!" I'm trying to make sure everyone knows that it's "Deka" as in Katakana. Noja? We establish that we're doing a horror game. "ホラーゲームー!" (Horror game!) It seems like we are working on a ghost hunting investigation.

    I'm playing Phasmophobia for the first time with a partner, while Kyoko has experience. She claims she can "carry" me, so that's what we're going with!  I'm basically letting Kyoko be the "hime-pu" (hime pu) and she's "キャリー" (kyarii) me. It's ghost investigation, and the goal is to capture footage of a ghost.  So, we gotta gather the right gear.  I think we are going to be in a house where we have 5 minutes to survive the "yabai" (scary) ghost situation. The mission is to capture footage of the ghost using cameras and get some sound recording.

    Kyoko is experienced and in charge, so I'm asking for instructions. I start by trying to select something, but apparently I can't.  "何も選べない" (Nan mo erabenai!) I am a bit slow to get things started, but I finally get to "スタンバイ" (standby). Things get going and Kyoko points out we have five minutes before things get "ヤバい" (yabai).

    We start to gear up! We can only hold 3 items. I figure we definitely need a camera for video and a sound recorder for audio. I see some equipment in a wall, so I try to select what I think is a "サウンドレコーダー" (sound recorder), but then, Kyoko tells me it's actually some kind of "ゴーストボックス" (ghost box)! So that's not what I need. Then it's like, uh oh, the camera won't turn on! Kyoko is stuck, "詰んだかも" (tsunda kamo). She claims her F button doesn't work, so it looks like I need to pick up the slack.

    I'm going to take the gear. Kyoko recommends some kind of EMF meter that reacts to ghosts, so I will take that! She will keep a "交換日記" (exchange diary). I'm a little weirded out, but hey, if we are going to communicate with ghosts in the house, that sounds like a plan! Let's get to work!
