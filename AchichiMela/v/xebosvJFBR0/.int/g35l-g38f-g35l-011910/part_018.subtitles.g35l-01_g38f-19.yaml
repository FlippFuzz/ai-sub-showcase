    Netsuchi Mela and Hyakuto Kyoko teaming up for their first-ever horror game collaboration
    in Phasmophobia. Throughout the nearly two-hour session, the duo investigates
    multiple haunted houses, successfully identifying various ghosts while cracking
    jokes, coining their impromptu unit name 'Dekamander', discussing photography
    strategies for supernatural evidence, and casually chatting about future horror
    game challenges and merchandise restocks.
