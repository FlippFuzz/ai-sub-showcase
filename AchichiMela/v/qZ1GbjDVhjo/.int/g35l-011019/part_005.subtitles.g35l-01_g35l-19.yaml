global_summary:
  overall_summary: In this livestream from Mela Ch. 熱千めら‐ アソビ★まわり隊!, Hololive VTuber
    Achichi Mela plays the simulation game 'My Voice Zoo' (自分の声「のじゃ」だけで動物園を作るゲーム)
    where every animal's voice line must be recorded using her signature catchphrase
    '-noja'. Throughout the nearly two-hour stream, Mela humorously assigns various
    emotional nuances and witty sub-tags (such as corporate overtime for reindeer,
    black company jokes, and self-referential chat banter) to each animal, creating
    a chaotic and entertaining 'Noja Zoo' before reviewing her creation and closing
    with upcoming schedule announcements.
