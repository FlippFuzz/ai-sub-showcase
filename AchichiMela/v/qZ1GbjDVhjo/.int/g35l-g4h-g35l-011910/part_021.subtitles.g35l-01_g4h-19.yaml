  overall_summary: In this livestream, hololive talent Achichi Mela plays the idle
    simulation game 'My Voice Zoo', where players build and manage a zoo using their
    own microphone recordings for animal cries. With a self-imposed chaotic twist,
    Mela records every single animal voice using her signature 'noja' speech suffix
    combined with hilarious, cynical, and absurd corporate/internet slang captions.
    Throughout the chill stream, Mela interacts with her chat ('onshura'), makes self-deprecating
    jokes about her unit 'Asobi Mawaritai', and creates a hilariously chaotic sanctuary
    known as the 'Noja Zoo'.
