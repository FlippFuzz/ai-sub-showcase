    {
      "summary": "**Alright, let's break down this 5-minute segment. We've got Kaela, Netsuchi Mela (me!), Hyakuto Kyoko, and Koseki Bijou joining in. The first few minutes were definitely a warm-up. We were figuring out how to navigate and coordinate, with a few missteps but a lot of laughs. I was trying to get a feel for the terrain, we considered a bridge, then realized maybe there was a better route, but kept running into closed paths! I think we were also trying to figure out how to get Biboo to join the game with us. We restarted, that was just a warm-up. And we have to invite Biboo again! Luckily we warmed up! After a quick restart and tutorial, we got back to the airport. I was practicing some moves. Then, Kyoko wanted to teach me this backflip technique, which was a bit tricky! Kyoko started teaching the technique. She told me to hit R, the arrow button, and then Banzai and at the peak of the backflip, jump! But, I couldn't see the wave from my own screen. I'm working with mirrors! Then Bijou had to start their stream; they were stuck in the ward office for hours. We were glad to be warmed up by then, since we waited a bit for them. And then we started again. Now we're finally in the real game! Time to play! Kyoko showed me how to get past a wall. And we're ready to get to work!**"
    }
