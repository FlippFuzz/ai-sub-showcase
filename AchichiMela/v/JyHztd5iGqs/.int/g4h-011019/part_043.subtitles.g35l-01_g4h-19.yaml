  - term: サラマンダー (Salamander)
    meaning: Mela's mythical creature species; she is a fire-fighting salamander (火消し屋サラマンダー)
      representing good fortune.
  - term: 爆発キノコ (Explosive Fungus)
    meaning: Hazardous environmental mushrooms in PEAK that explode upon contact,
      launching or damaging nearby players.
  - term: 毒ナナ (Toxic Berry)
    meaning: Poisonous green or pink berries that inflict negative status conditions
      unless cooked or treated.
  - term: チェインランチャー / レスキュークロー (Chain Launcher / Rescue Claw)
    meaning: Mobility and utility tools found in luggage to assist with climbing and
      player rescue.
  - term: ブリザード (Blizzard)
