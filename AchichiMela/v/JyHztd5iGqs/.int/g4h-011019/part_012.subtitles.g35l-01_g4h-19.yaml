    The interplay between Mela, Biboo, and Kaela is pretty interesting – particularly with Biboo taking on the role of senpai (senior) and Kaela becoming the kohai (junior).

    The repeated "のじゃ" ("noja") is definitely cute but I am also aware that it is a conversational marker. Is it "のじゃ" or "にょじゃ"? In this case, it is a cute thing. The need for precise transcription is extremely important because every "hup" or "noja" may be a key clue. I am trying to figure out what's really happening.

