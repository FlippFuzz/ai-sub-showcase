global_summary:
  overall_summary: In this livestream on her channel 'Mela Ch. 熱千めら‐ アソビ★まわり隊!', Hololive
    VTuber Achichi Mela teams up with Hololive English seniors Kaela Kovalskia and
    Koseki Bijou, along with fellow generation member Hyakuto Kyoko, to play the harsh
    mountain climbing game 'PEAK' using English and Japanese roleplay ('ja English').
    Throughout the endurance stream, the team tackles multiple climbing attempts to
    reach the summit, facing obstacles like harsh weather, poison plants, and explosive
    mushrooms while sharing hilarious interactions and mutual support.
