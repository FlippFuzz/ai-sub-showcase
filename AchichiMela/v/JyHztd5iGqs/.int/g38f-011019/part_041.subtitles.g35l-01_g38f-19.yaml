global_summary:
  overall_summary: In this livestream from Mela Ch. 熱千めら‐ アソビ★まわり隊!, Hololive VTuber
    Netsu Mera teams up with fellow unit member Hyakuto Kyoko and senior guides Kaela
    Kovalskia and Koseki Bijou to tackle the challenging co-op mountain climbing survival
    game 'PEAK'. Throughout the nearly four-hour stream, the group navigates treacherous
    biomes filled with rainstorms, toxic plants, explosive mushrooms, and freezing
    blizzards. Despite numerous dramatic falls, comical accidents, and near-death
    experiences, the team supports each other through cooperative survival mechanics,
    cooking food at campsites, mastering climbing techniques like backflips, and sharing
    heartwarming 'tete' moments as they push toward the mountain peak.
  chapters:
  - start: 00:00
    end: '16:15'
    title: Warm-up & Tutorial Climb
    description: Mela, Kyoko, and Kaela start an initial warm-up run in PEAK to learn
      basic climbing mechanics, gathering food and backpacks while testing out movement
      controls.
    song_title: null
    song_artist: null
  - start: '16:15'
    end: '42:20'
    title: 'Stage 1 Official Run: Reaching the First Peak'
    description: With Bijou (Biboo) joining the session after work, the group restarts
      the official run, cooks coconuts for energy, manages inventory, and successfully
      ascends to reach the first milestone.
    song_title: null
    song_artist: null
  - start: '42:20'
    end: '1:16:30'
    title: 'Stage 2 Jungle Ascent: Rain, Poison & Backflips'
    description: The team ventures into the jungle biome facing sudden rainstorms,
      poisonous berries, and explosive mushrooms. They practice advanced climbing
      moves like backflips and revive fallen members using medical kits.
    song_title: null
    song_artist: null
  - start: '1:16:30'
    end: '2:03:00'
    title: 'Stage 3 High Altitude: Freezing Cold & Blizzards'
    description: Ascending higher into cold, foggy mountain terrain, the group battles
      freezing temperatures and blizzards. They rely heavily on team coordination,
      warm body-hug mechanics ('tete'), and rescue items to survive.
    song_title: null
    song_artist: null
  - start: '2:03:00'
    end: '2:24:55'
    title: Final Push & Capybara Encounter
    description: The climbers tackle the final treacherous slopes near the peak, encountering
      wild capybaras and pushing through extreme stamina and health exhaustion before
      concluding the climb.
    song_title: null
    song_artist: null
  - start: '2:24:55'
