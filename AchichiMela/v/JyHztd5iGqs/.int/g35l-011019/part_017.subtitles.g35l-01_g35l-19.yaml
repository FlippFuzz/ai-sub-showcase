  overall_summary: In this stream, hot-headed salamander firefighter Mela Achichi
    from hololive's unit 'Asobi Mawaritai!' teams up with fellow unit member Kyoko
    Hyakuto, hololive ID's Kaela Kovalskia, and hololive EN's Koseki Bijou (Biboo)
    to tackle the notoriously brutal co-op mountain-climbing game 'PEAK'. Communicating
    in a hilarious mix of English and Japanese ('Noja English'), the group navigates
    treacherous biomes filled with explosive mushrooms, poisonous berries, unpredictable
    weather, and steep cliffs. Despite numerous comedic falls, dramatic deaths, sacrifices,
    and late arrivals, the quartet relies on teamwork, pro-gamer guidance from Kaela
    and Kyoko, and plenty of banter to conquer the heights.
