  thoughts: |+
    **A Salamander's Digital Dilemma**

    Ah, let me tell you, I was hoping to quickly provide subtitles here for this VTuber clip. I see a VTuber with blue and pink hair, horns, in a kimono saying "無病息災" – very interesting, no? Oh, let's start with a precise transcription. Alright, here we go, noja.

    I don't know those Nico Nico memes, not from that era, no. Why? Well, it's 'cause something unfortunate happened. My address was identified, you see. I was found, you see, by my mother and father. Back then, they didn’t want me looking at message boards or risky sites.

    They put strict parental controls on me - a kids' filter. Back then, I couldn’t watch Nico Nico Douga or YouTube. All the fun sites were filtered. Twitter and YouTube were also blocked, right. That’s how dangerous I was.

    I never grew up with old Nico Nico, but I do watch it for VOCALOID Collection to listen to Vocaloid songs. Because Vocaloid producers upload to Nico Nico Douga first. I get there ASAP.

    Someone asks, "How is Nico Nico these days?" Oh, I only know Vocacolle, nothing else. I don't really know other categories. "Didn't they take your smartphone?" They took it, no joke! A kids' cell phone! It's finally started, right?

    Even though I'm 400 years old, they gave me a kids' phone! Pretty much just a personal alarm buzzer on it. They even gave me an iPhone with no SIM card, only Wi-Fi! I was pretty much a Tamagotchi, no different from a flip phone.

    They were worried, because I did dangerous stuff online, right? I was banned until the salamander learned media literacy and matured, then, no more phones! And the rebound is strong. Now, I'm a Dopamander! A total rebound, you see.

    I'm jealous of those who know about old Nico Nico stuff! I couldn't touch the internet at that time, you see. A rebound comes for everyone. Someone asks, "Didn't you become unable to relate to your friends?" Ehhh...? Friends...? Well now... Uh, what... like... Well...


...
