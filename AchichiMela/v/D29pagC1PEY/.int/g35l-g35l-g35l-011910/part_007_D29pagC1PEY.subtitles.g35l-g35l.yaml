    game. Throughout the stream, Mela shares humorous anecdotes about her upbringing
    under strict human internet filters, panics and screams at the terrifying jump
    scares and entities ('Mama', 'Baby') while trying to keep her spaghetti warm,
    and eventually reflects on the 'harsh reality' of senior prank gifts during the
    closing chat before announcing her upcoming schedule.
