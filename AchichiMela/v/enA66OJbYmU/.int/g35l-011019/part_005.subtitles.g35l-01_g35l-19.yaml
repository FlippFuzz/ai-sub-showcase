  - start: '02:59.396'
    end: '03:12.756'
    original: お主らのこと、見ているのじゃ！ちょ、これは危ないな、とか、危ないな、とか、ちょ、言い過ぎじゃな、とか、見ているのじゃ！危ないのじゃ！
