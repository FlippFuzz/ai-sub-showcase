    Hololive's newly debuted 'Asobi Mawaritai!' member and fire-prevention salamander
    VTuber, Netsuchi Mela, hosts an educational 'Internet Disaster Prevention Drill'
    stream. Drawing from her own notorious 400-year-old past experience with online
    infamy, self-doxxing, and flaming, Mela educates her viewers (known as 'Mela-gumi')
    on internet literacy and security. She walks through five realistic scary scenarios—ranging
    from over-sharing personal life details on Twitter leading to class doxxing, alt-account
    risk blindspots, account takeovers due to weak passwords and missing 2FA, dangerous
    online friend meetings (off-kai risks), to fake mutual friends and impersonation
    on Instagram. Throughout the stream, she emphasizes the importance of vigilance,
    strong passwords, 2FA, and critical awareness of online risks while maintaining
    her signature playful 'no-ja' speech tic and warm, interactive tone.
