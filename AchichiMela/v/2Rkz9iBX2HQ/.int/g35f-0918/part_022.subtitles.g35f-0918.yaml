  thoughts: |+
    **My Thoughts on That Driving Game... Noja!**

    Okay, so I was watching this VTuber, right? And she's playing this driving game. The game voice is pretty chill, but the VTuber, she's all "デンジャーなのじゃ!" It's like, "Go right!" "Stop! Stop, noja!" and the game keeps saying, "Oh dear! I can't U-turn. Big brother, what do I do?" It was a total disaster! I mean, I can relate to the frustration. "I couldn't even make it to the truck, noja." It's that kind of game, really. And the VTuber sounds super disappointed. She was asking, "This is, isn't it?" "This is what I think." She kept saying, “That was so hard, noja!” “High difficulty.” "What is this?" "Isn't it more than just play skill?"

    I'm thinking, "No, it's not JUST skill." It's gotta be more. It's so difficult. I wondered what was going wrong! Was it just play skill? I mean, was I so mad that I would make mistakes? I tried to resist. I did try hard! It wasn't the play, right? A few Hololive members have cleared it, so I am still a long way to go, though! I thought I did a good job! It's difficult.

    And that's when it hit me. Maybe I should have been giving instructions more gently, one at a time. I was rushing, and I'd get too forceful. It's like, teaching someone something, it can wear on both the teacher and the learner. The VTuber’s sister stopped saying the “noja” style. When you're in a hurry, you get bossy. And AI! Even an AI needs a soft touch! Maybe it's "AI rebellious phase," I felt.


...
