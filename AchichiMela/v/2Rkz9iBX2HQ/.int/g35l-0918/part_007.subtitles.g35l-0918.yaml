    The indecisiveness is palpable (00:22 - 00:29). Should they go left? No, let's keep on course (00:39 - 00:41). There's a moment of accomplishment (00:44 - 00:54), but it's followed by a reality check "Well done, now enter the road" (00:54.817 - 00:57.777). We're getting there!

