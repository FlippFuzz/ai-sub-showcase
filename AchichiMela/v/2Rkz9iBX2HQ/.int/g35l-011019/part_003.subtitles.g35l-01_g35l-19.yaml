      hair and clothing.
  domain_glossary:
  - term: 妹に運転を教える
    meaning: A driving instruction simulation game powered by AI where players use
      voice microphone input to teach an AI-controlled younger sister how to drive.
  - term: のじゃ口調
    meaning: An archaic Japanese speech dialect typically used by elderly or wise
      characters (ending sentences with '-noja', referring to oneself as 'washi').
  - term: アンガーマネジメント
    meaning: Anger management techniques; in this stream, Mela humorously counts from
      1 to 6 to calm down her 400-year-old temper when the AI sister causes crashes.
  - term: アソビ☆まわり隊！
    meaning: Hololive's official unit / sub-group that Netsuchi Mela belongs to.
  - term: 火の用心じゃ〜！
    meaning: Mela's signature greeting and catchphrase meaning 'Watch out for fires!'.
