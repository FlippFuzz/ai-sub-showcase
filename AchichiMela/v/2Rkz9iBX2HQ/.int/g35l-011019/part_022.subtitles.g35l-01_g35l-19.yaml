global_summary:
  overall_summary: In this live stream on the Mela Ch. channel, Hololive's 'Asobi☆Mawaritai!'
    VTuber Netsuchi Mela plays the AI-powered driving simulation game Teaching My
    Little Sister How to Drive (『妹に運転を教える』). Lacking a real-life driver's license
    and adopting her characteristic 'noja' speech dialect as a 400-year-old salamander
    firefighter, Mela attempts to guide her AI younger sister through tutorials, parking
    lots, and hazardous city streets. Throughout the 2-hour stream, Mela experiences
    mounting frustration as the AI misunderstands instructions or causes chaotic accidents,
    leading her to perform hilarious 400-year-old anger management counts (1, 2, 3,
    4, 5, 6) and share elaborate lore about isekai reincarnation.
