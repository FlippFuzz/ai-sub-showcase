  thoughts:
  - |-
    **A Creator's Inner Thoughts: A Glimpse into My Mind**

    Alright, let's dive into this. I've been reflecting, writing about my thoughts—around five thousand characters worth, actually. I've poured my heart into a blog post, a behind-the-scenes look that I plan to release after my "utaite" cover is published. I reckon it'll be a fun read when paired with the song.

    It's really a creator's perspective, not some deep, narrative analysis or intellectual ponderings. No, this is all about sharing how I, as a creator, approach my work and what goes on in my mind as I offer my work to you all. It's like a little peek behind the curtain, you see.

    Some folks are amazed by 5000 characters. Someone even said it was like thirteen pages! But, you know, this isn't some liner note. Liner notes are what the artist themselves put out there. This is different! It wasn't about forcing it or squeezing thoughts out of nowhere. It's just the things I absolutely had to say, the things I just *had* to share!

    I got a lot to say! I have a lot of thoughts to share! Speaking of which, the first impression I got from AZKi-senpai? She was so kind! We chatted a lot after the stream. We even talked on the phone! It felt like such a wonderful encounter! A true meeting of kindred spirits. I still have so much to learn, so many questions! I was too nervous to barrage her with questions right away, but she took the initiative! I was so grateful! I still have so many questions for her!

    Was writing fun? Absolutely! It's the most enjoyable thing! Talking about what I'm thinking, expressing myself through words or a tweet... It's the best feeling in the world! You all have those moments, right? Those times when you do something, and you just get this incredible feeling? The thing that gives me that feeling is self-disclosure, when I share my true thoughts and feelings, arranging them. It's the best! I can't express how good it makes me feel! I think it's nice to see thoughts that were just vague ideas turn into something concrete. *Dopadopa*!

    Thanks for the "400k congratulations and dopa support!" *Thank you noja~!* Trick or Dopa? Trick or Dopa? What is it, trick or dopamine? *Dopamine*, one choice. Give me the sweets or I'll *spray*! Is it bad to *spray*? Is it bad to burn out my fire? If I'm sprayed I’ll turn into this “Noja~”! The fire would go out! Please don't spray me!

    It's a dry season, so it might be important to have some humidity! I'm running the humidifier right now! "What happens if the fire goes out?" I won't get weak from it, but I use fire to prevent the excess heat buildup from escaping my body. If I stop the fire, it's dangerous! Danger, noja! "Are you putting water in it?" Yes, I am. I added some before the stream! "Is your hair burning?" Yes, my hair...my hair is burning. Just the tips. It is burning at the tips.

    As for late-night streams... I haven't really thought about it. It depends on the concept. It might work for something like a "bedtime" or "chill" type of stream, but otherwise, I'd like to stick with a fixed time, about 7 PM.

    Birthdays and such? Oh, right, that's possible too for something like a countdown. "You are subscribed, thank you!" Thank you *noja*! So happy!

    Did I watch Hololive before my debut? Yes, I did. But I don't know...
