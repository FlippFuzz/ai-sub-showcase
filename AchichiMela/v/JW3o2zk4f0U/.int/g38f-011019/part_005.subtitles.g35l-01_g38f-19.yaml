    I remember reading *Nisekoi* too. And *Food Wars: Shokugeki no Soma*! Oh man, people might think it's just fanservice, but the story is actually fantastic. It's actually really entertaining, you guys! "Order up!" That's what they say.

    I'm also thinking about Shaft anime because I'm reminded of the *Monogatari Series*. I'm like "What is your favorite Shaft anime?" Well, of course, *Monogatari Series*! If you would please look at the bottom right... and wait for the premiere coming up! It’s *Monogatari Series*!

    Someone asked me what other music do I enjoy besides Vocaloid, which I pretty much only listen to. It's character songs, anime songs... What was that again? *Sket Dance*! Oh yeah, that was being serialized back then. And then they asked, "Who is your oshi in *Monogatari Series*?" Wow, tough question.

    Hmm. I can't quite pick! I recall in my student days, during morning reading, I just kept reading *Otori... Otorimonogatari*, Nadeko's story, over and over.

    Someone said they didn't know I liked *Sket Dance*! I do love that, I love it. I almost slipped up, it's just my human side leaking out. I really like that one episode. What was it? Yeah, that one about the student council breaking a car and getting a replacement. I loved that one! I love speaking to you all, but it is just my human side.

    Someone asked if I was nervous, but no, not at all! It just shows my human self! Then they ask me, “Hunter X Hunter... who is your favorite character?” Tough question! I think, like... seeing kids who are straightforward and honest gives me energy. Ah, yeah, super cliché, but I truly love the relationship between Gon and Killua. It's not like I'm obsessed with character dynamics in a shipping way or anything, but I just want to watch over them with warmth, it just has a gentle wholesome bond there and it moves my heart. I wish I had friends like that when I was little.

    "Who's your favorite character in *Re:Zero*?" I've answered this before! It's Beatrice. I love Beatrice. "Do you not watch *Tensura*?" I do. I’m more of a manga reader, but I've read the manga. Also, wasn't there a *Tensura* game? Wasn't there a mobile game? I remember playing that. What was it called? Also, speaking of mobile games, wasn't there like *Monogatari Series PucPuc* back in the day? I remember playing that one too!

    Then they ask me, “What do you like about *World Trigger*?” Well... It's really...
