  thoughts:
  - |-
    **My Creative Eye and the Art of the Ask**

    Alright, let's break this down. As I was watching, I wasn't just a casual observer, not in the slightest. I was seeing things from the creator's perspective. It's like my brain was hardwired to analyze. I was thinking, "Oh, they're using *this* person for commissions?" Or, "Wow, they're really clever with how they present things." The creative process, that's what really sparked my interest. It wasn't just about enjoying it; it was about understanding the trends and techniques.

    I was locked into that creator's mindset. "Is this style trending?" or "Is this MV direction in style right now?" I was approaching everything through that lens, all the time. It's almost...yeah, it's an otaku perspective, I guess. In a way, I am an otaku, at least when it comes to creative work.

    A few questions came up about a recent commission: I'm always indebted to Achichi Mela-sensei. I rely on them for all sorts of work, including this stream's thumbnail. And well, I have a bit of a *reputation*. It's always a scramble. I'll send a message, "Mela-sensei, I'm streaming in an hour, can I get a thumbnail *now*?" and then, always with the "is it ok if there's no payment?" They get furious, and justifiably so! "Tell me sooner!" they'll yell. "I have a schedule too!" And Mela-sensei makes them, but you can see them huffing and puffing.

    I'm apparently a *very* black client. For a recent karaoke stream, I wanted a wooden clapper emoji. I'd forgotten about it! "Mela-sensei, the stream starts at 7 pm, can you make it in time?" I always get her to work with impossible deadlines. Bless her heart; she's always pulling through for me.

    Someone asked me about my thumbnails. I did study a lot for them before Hololive! I didn't study so much as just *looked* at other people's work, a lot. Thumbnail design is difficult. But creative work is all about input. And you need to look to other sources for inspiration. Miko-senpai, for instance, is brilliant with thumbnails.

    I did have a long-time interest in fonts - it's a hobby! I love finding cute fonts. I watch Morisawa and keep track of new fonts. My hobby is looking at cute designs. I even have a Morisawa subscription. The thumbnails I use - the font I used in my thumbnail today, I think it was *Fu Picnic*. Yeah, it should be Morisawa. I already knew about the fundamentals of fonts, but the skills for thumbnails are separate - so I went out and studied by looking at other peoples thumbnails.

    Someone asked if I like making things. Yes! I love making things, with all my heart. That's probably why my debut stream had me making an animation. I really appreciate Mela-sensei, and thank you all for the support! I want to draw membership emojis for my stream. I'll fit it in somehow. And that animation? That was cutting it close!
