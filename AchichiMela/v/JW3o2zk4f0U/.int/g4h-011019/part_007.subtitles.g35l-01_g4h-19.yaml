  thoughts:
  - |-
    **A Deep Dive into Chocolate Cravings, Weight Gain, and Social Media Strategies**

    Okay, here's what I'm thinking, based on what I just said: I need to be precise, I'll start with a reply comment and some emojis. I should be specific.

    I was asked about my favorite chocolate snack and, without a second thought, I replied that I'd send a reply comment with emojis! My favourite chocolate snack? Well, I do love chocolates, what am I in the mood for? Ah yes, Meltykiss! I love it, the Meiji milk chocolate, too. I'm telling you, I love it so much. How much do I love Meiji Milk Chocolate?

    Let me tell you about that. You know those big boxes, the ones with like 24 individually wrapped little chocolates? I could eat three of those boxes *a day*. Seriously. I'm not kidding! Meiji Milk Chocolate is seriously amazing. However, I did that for a month or two, and I gained a lot of weight so I stopped, I was shocked, so I just stopped, because I never knew eating so much chocolate made you gain weight.

    I'm not really knowledgeable about these things, like fats or proteins or whatever, so I just ate how I wanted and then, suddenly, I realised that my weight increased. I was like, “What?!”. I was panicked at first, I felt I was doing something wrong, and I thought hard, and realized that it might be all this chocolate. I quit right away. So it seems that there were no other changes, besides gaining weight. I didn't know I didn't know. “Did you get pimples?” Oh no, so other than that, no other changes to my body.

    Anyway, it's so good and I've also been told I shouldn't ask a woman's weight! Especially as a maiden, because I'm not supposed to! Besides, if I say my weight, then my tail's weight would be found out.

    Also, I'm so happy to be at 400,000 subscribers, thank you! It's gone by so fast. I'm very happy and grateful. I have already gained 300 more subscribers. Thank you to everyone who subscribed! I'm so happy!

    And, no, having a heavy tail would be embarrassing. It's top secret! Also, people are joining Anzen Chitai! So, I'll tell you about Twitter, HoloPlus, and memberships: I had to differentiate my use, the other day, I was using Twitter, and I posted, without thinking, and I almost got into a controversial tweet, I had to stop myself. I was shocked and started acting. That was a bad situation, and I was so scared. I decided to not post everyday tweets and edgy tweets on Twitter.

    So, since then, I decided to reform how I use Twitter. Anything that might be a bit risky to say on Twitter, I post on HoloPlus, I have the app, the official Hololive app.

    Sub-account type thoughts, just random stuff, I post them there, but only late at night, a bit by bit. And then, anything more deep, I will probably not talk about it publicly, but I still want to talk about it! For various reasons, you maybe can't see this publicly, but I just want to say this. So, the membership-only posts, I can also post text and post it there.

    And then, after this...everyone please look at the bottom right. The behind-the-scenes for the "UNDEAD" cover song that's premiering at 19:00, last night late at night.
