global_summary:
  overall_summary: In this morning stream titled '【のじゃEnglish】のじゃが「knoja」な理由のじゃ！',
    Netisen Mela of Hololive's ASOBI☆MAWARI-TAI! unit chats with her viewers about
    her recent English global collaboration playing the mountain-climbing game 'PEAK'
    alongside Kaela, Koseki Bijou, and Hyakuto Kyoko (forming the '4K' / 'Knoja' group).
    She reflects on her English learning, sleep-talking in English, childhood memories
    of isolation and kindergarten, and her struggles with Japanese social communication.
    The stream then transitions into an interactive English study and listening session
    ('Noja English' using Duolingo-style lessons), followed by closing remarks and
    an announcement of an upcoming off-collab with AZKi.
