  thoughts:
  - |-
    **My Thoughts on Communication**

    Okay, here's what's going through my mind right now. I need to get subtitles for this video segment, and it's got me reflecting on... well, my entire life, really. I'm focusing on the bit from 40:00.064 to 45:00.072 because it's where I'm at right now.

    I realize I've always struggled with fitting in, with understanding the unwritten rules of social interaction. Back in school, I could never fit into circles. I didn't think it was a big deal then, so I just went with it. But now, being in Hololive, I really regret not gaining that kind of experience earlier. Now, I regret it. I can't believe how much I'm struggling with this after becoming an adult!

    It wasn't that being alone was *bad* in my student days, not at all, it was fine then. It's just that I didn't anticipate how difficult navigating adult interactions would become.

    I'm so much better in English! I can communicate in English. I can be around other people in English, even in English collaborations, but... Japanese communication? That's really where I struggle. Honestly, I can't do it.

    It's like... I know Japanese *too* well, if that makes sense? I'm overthinking it. It's all the unsaid cultural stuff. The shared understandings, the nuances... I don't get them. There's no "bubu-zuke" in English, you know? No Kyoto dialect subtlety! I'm *born* in Japan, but I don't know Japanese culture!

    I need to *practice* reading between the lines. I don't get it. Seriously. Even if someone says "that wasn't good," I can't figure out where it went wrong!

    I just don't understand communication, I really don't. It's so hard! That's why I'm practicing a lot in Hololive. I'll do my best. I've slacked off in the past, and this is the result.

    I just *missed* all those normal social experiences that other people get in elementary, middle, and high school. I skipped the whole "communication" class because it was a hassle. So, here I am, trying to make up for lost time! This is the result of that slacking. From kindergarten, I've pretty much been out of human society! I wasn't even allowed to play house and I was always the dog.

    But I know I *need* these communication skills, especially with collab streams!
