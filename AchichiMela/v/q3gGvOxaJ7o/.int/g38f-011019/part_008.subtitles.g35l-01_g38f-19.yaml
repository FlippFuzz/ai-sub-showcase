  thoughts:
  - |-
    **A Deep Dive into My Communication Struggles**

    Okay, here's the thing. I've been reflecting on my communication skills, and honestly, it's a bit of a mess. From my school days, I've always been someone who stayed on the periphery of social groups. I didn't see it as a problem then – I was fine being alone. In fact, I sort of *let* it be. Now, looking back, I realize that I missed out on building up those crucial experiences. This is especially poignant now that I'm part of Hololive. I'm kicking myself for not having developed those skills back then.

    I can't say being a loner was inherently bad, but it has definitely caught up with me. I just didn't anticipate how this would impact me as an adult. Interestingly, I find it so much easier to communicate in English. I can handle multiple people in English! "You did well during Peak, I think," that's easy! But in Japanese? *Forget it.* Japanese communication is a whole different beast. I can handle it in English, but not in Japanese.

    The problem is, I'm just not good at Japanese communication, noja. I really struggle with it. It's like, I know *too* much Japanese, and that paradoxically makes it harder. I don't get the nuances, the shared understandings, the unspoken context that's so prevalent in Japanese culture.

    It's just the Japanese context that I don't get. "In English you can handle timers and huge desyncs" — *that* I can handle! I can do that, but Japanese communication is just so difficult. Things like bubuzuke or 京言葉 or other subtleties just fly right over my head. I'm Japanese, I was born in Japan, but I don't know Japanese culture, noja. I don't get it at all.

    This is why I need to practice! Reading between the lines in Japanese is incredibly challenging. If someone directly points out what I did wrong, I can usually understand and adjust. But on my own, I can't even tell *what* I did wrong. I just don't get it! Truly, I don't understand communication.

    So, I'm working on it. I’m practicing a lot in Hololive and just trying to get better. I'll do my best, noja. I've slacked off on this for so long. During all those formative years of elementary, middle, and high school, I skipped all the opportunities for group interaction. I just thought, "whatever," and stayed on my own, noja.

    I even didn't want to switch rooms, because it was too much hassle. But, look where this has gotten me! Communication is just really hard for me, noja. And it goes back even further, actually. I feel like I've been dropping out of human society since kindergarten. They wouldn’t let me join in playing house! I'm just not good at communication!

    But since communication skills are so essential for collab streams, I'm really trying to do my best, noja. I wasn't even allowed to have a human role in playing house. They'd always just say, "Mela, Mela-chan, you're the dog," and that was the role I was stuck with. And now that I think of it, most of the girls wanted to be the mom!
