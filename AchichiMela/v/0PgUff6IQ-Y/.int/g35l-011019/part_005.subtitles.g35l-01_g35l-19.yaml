  domain_glossary:
  - term: GeoGuessr
    meaning: A web-based geography game where players are dropped into Google Street
      View locations and must guess where they are on a map.
  - term: No-Move
    meaning: A GeoGuessr gameplay rule mode where players are prohibited from moving
      or walking from their initial drop location.
  - term: Utility Pole Sommelier
    meaning: Mela's humorous self-styled expertise in identifying Japanese regions,
      prefectures, and power company jurisdictions using utility pole plates and configurations.
  - term: Area Code
    meaning: Telephone prefix numbers (e.g., 03 for Tokyo, 01 for Hokkaido regions)
      found on local advertisements and signs used to narrow down GeoGuessr locations.
  - term: Low-voltage Spacer
    meaning: Specialized equipment spacers attached to utility poles in snowy regions
      to prevent power lines from clashing during heavy snowfall.
  - term: ASOBI★MAWARI-TAI!
    meaning: Hololive VTuber unit/generation to which Atsuchi Mela belongs.
