  - |-
    **A GeoGuessr Enthusiast's Thoughts**

    Alright, let's dive into this audio and map out what's on my mind, millisecond by millisecond. First things first, it seems there's no music, just background noise, and talking. Good, good, we can proceed.

    Right, so as I was saying, it is a bit of a risk to start, but I am doing well, and if I just play and narrow the field of view... it's fast, really fast. It can be done quickly. I usually play this way. I play alone, doing "no move" mode for like a minute. I just tap tap tap tap tap, and get it done. It's so easy and so much fun. It is very fun. You get results fast from studying! If I remember the utility poles, then, if I see one, and remember, I can answer the question! You can narrow down the region. It's a blast, really.

    I can play on my phone too, but it's a little tricky, a bigger screen on the computer is best. That's better. Sometimes, if the internet isn't great, it takes forever to load. It can be tricky. But it's still pretty easy to play! I can play with my friends in bed, or when I'm on a call with my friends. It is fine on the phone. But if I really want to focus and have a good experience, then I use my computer. It's really fun!

    If you pay for a plan, you can play without limits. If you're free, there is some kind of limitation. Or, if you have a friend who pays, you can play in their room for free, which is nice. Computers don't have to be super powerful... internet is more important. If your Wi-Fi is weak, it might be tough. I recommend it!

    I love GeoGuessr so much! But I can't find people at my level to play with me! My friends are like... "Utility poles? What are those?" They probably know their prefectures, maybe? See what I mean? So, I have been wanting to find people to play with me for a long time. I wanted to stream with them and find a friend. I did not have any. So! I am so happy to be in Hololive! AZKi-senpai does a lot of GeoGuessr!

    I have wanted to play with AZKi-senpai since before I even joined Hololive. I love GeoGuessr, and I have not met a streamer who has my same level of passion for it. Not even one. But, in Hololive, AZKi-senpai is here. So! I really, really like GeoGuessr, it is my favorite game. So I'm so happy. And AZKi-senpai's playstyle is different! I think I can learn a lot from her! There's so much I want to talk about! I can't wait!

    By the way, let's look at the schedule for this week: Monday the 26th, there will be GeoGuessr at 8PM, Tuesday will be a break, Wednesday is "Noja English" at 7 AM, and then a Vocaloid singing stream at 7 PM. And the most important thing! Thursday the 29th, I'm going to do my first collab with AZKi-senpai! It's our first collab! I have barely talked to her, like, we have just talked about the collab but not anything else. So, I am really looking forward to it. There's so much I want to ask her, like "What do you like about GeoGuessr?" and "When did you get into geography?" I am sure we have a lot to talk about.

    I know some people have said, "Are you *not* going to play GeoGuessr for the collab?" You're just thrill-hungry brats. You guys are way too dopamine-brained. As AZKi-senpai says, "You save the otoro for later." Like, we've only just met, and you want to jump right into GeoGuessr? It is too soon! We finally found each other! I haven't met a VTuber who plays GeoGuessr with me. I've lived for 400 years and I haven't met anyone. So I finally met one!

    Man, playing... I have so much I want to...
