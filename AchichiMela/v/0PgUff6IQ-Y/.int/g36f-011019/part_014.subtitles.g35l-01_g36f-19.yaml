  domain_glossary:
  - term: ジオゲッサー (GeoGuessr)
    meaning: A browser-based geography game where players are dropped into Google
      Street View panoramas and must pinpoint their location on a map.
  - term: ノー・ムーブ (No-Move)
    meaning: A GeoGuessr gameplay rule/mode where players are not allowed to move
      from their starting spot, relying entirely on static visual clues.
  - term: 電柱ソムリエ (Utility Pole Sommelier)
    meaning: A playful nickname given to Mela for her specialized knowledge in identifying
      Japanese regions and power companies through utility pole plates and wiring.
  - term: 市外局番 (Area Code)
    meaning: Regional telephone prefix numbers used by Mela and players to narrow
      down prefectures from local commercial signs.
  - term: 低圧スペーサー (Low-voltage spacer)
    meaning: Pole hardware spacers used on utility poles in snowy regions like Hokkaido
      to prevent electrical wires from touching during heavy snowfall.
  - term: アソビ★まわり隊！ (Asobi Mawaritai!)
    meaning: Hololive unit or sub-group to which Hotchizumi Mela belongs, where she
      serves as the 'good fortune/blessing' (ご利益) representative.
