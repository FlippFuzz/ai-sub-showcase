  domain_glossary:
  - term: ジオゲッサー
    meaning: GeoGuessr, a geography browser game where players are dropped into Google
      Street View locations and must guess where they are on a map.
  - term: ノームーブ
    meaning: No-Move mode in GeoGuessr where players cannot move, walk, or pan away
      from their initial spawn point.
  - term: 電柱ソムリエ
    meaning: A nickname or slang for someone who identifies geographic locations based
      on utility pole plates, wiring, and hardware.
  - term: 市外局番
    meaning: Japanese telephone area codes (e.g., 03 for Tokyo, 01 for Hokkaido) used
      to narrow down regions in GeoGuessr.
  - term: 低圧スペーサー
    meaning: Low-voltage utility pole fittings commonly found on Hokkaido Electric
      Power poles.
  - term: 東電 / 中電 / 北電
    meaning: Regional electric power companies (TEPCO, Chubu Electric, Hokkaido Electric)
      whose pole plates and structural designs vary across Japan.
  - term: どぱる
    meaning: Mela's coined slang for getting extremely excited or thrilled when successfully
