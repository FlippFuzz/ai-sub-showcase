global_summary:
  overall_summary: In this livestream from Hololive's 'Asobi★Mawaritai!' unit member
    Netsuchi Mela (熱千めら), she plays GeoGuessr in 'no-move' mode while sharing her
    extensive knowledge and strategies for identifying Japanese locations using utility
    pole plates, regional electric companies (such as TEPCO, Chubu Electric, and Hokkaido
    Electric), area codes, asphalt markings, housing styles, and regional topography.
    Throughout the stream, Mela combines quirky commentary and interactive banter
    with her chat ('dopari-listeners') with humorous insights into why humans don't
    normally memorize telephone area codes or utility plate numbers.
