    She emphasizes the phrase, "I can kick a ball very far," to make it make sense. It’s like she’s trying to connect her responses to Duolingo. This is so… Duolingo. I think she is just taking the answers too literally. The weird questions she is reading do seem weird, and the chat agrees. I'm taking the timestamps as accurately as possible.

