    Okay, here's my breakdown of this video section. The VTuber starts off by questioning the concept of throwing in American football. She seems a bit confused by the Duolingo questions, and it takes her a moment to connect "football" with "American football." She gets it, though, after a few repetitions! "Noja" is her catchphrase - she adds it a lot.

