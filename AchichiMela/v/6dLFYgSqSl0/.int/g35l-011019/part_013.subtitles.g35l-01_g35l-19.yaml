    kicks off her brand-new weekly Wednesday morning English study series using Duolingo,
    titled 'のじゃEnglish'. Broadcasting at 7:00 AM JST in a sleepy morning voice, Mela
    tackles beginner-level lessons under the 'Buying Groceries' and shopping units,
    covering basic vocabulary, store statuses, pricing, and plural/singular grammar
    rules. Amidst humorous struggles with grammar terms and a bizarre Duolingo story
    about searching for a nameless girlfriend at an airport, Mela interacts warmly
    with her chat ('Mela-gumi'), reviews her progress, and concludes with weekly schedule
    announcements before signing off with her signature catchphrase.
