  thoughts:
  - |-
    **A Deep Dive into GeoGuessr: My Unexpected Obsession**

    Alright, let's break this down. It all started when we (Mela and AZKi) decided to play GeoGuessr, a game where you guess the location of a Street View image. We thought it'd be a fun way to collaborate. We weren't aiming for a typical viewer-participation stream, but rather something where everyone could help us out. It's a fun concept! The idea of this "GeoGuessr Club" is exciting!

    I started by explaining what I really love about GeoGuessr. It's really neat to feel the knowledge you learn get used immediately. When I learn something like a specific type of utility pole, it clicks right away in the game! Going from getting a poor score to suddenly reaching a high score is insanely satisfying. That quick hit of dopamine, or whatever it is, is just awesome! It's that immediate payoff that gets you feeling good.

    And that leads me to something else: GeoGuessr is amazing as a starting point. I wasn't really interested in travel and I wasn't a very curious person. I was a huge indoor person, even. Until I started playing this game, I didn't even know all 47 prefectures of Japan. I didn't care about the world. It was a recent change. Now, in one year, I've memorized everything I'm able to. It's almost embarrassing, like I'm a total newbie.

    You know, in school, I didn't care much for geography. I wasn't really that interested. But after I started playing GeoGuessr, it was like a whole new world opened up. Because the knowledge I was gaining felt immediately useful, it was so much fun! It made me realize how incredible the experience of learning is. I feel like it really boosted my motivation to study. If only I knew about GeoGuessr back in school, I would've been so on top of geography.

    That's the crazy thing about this game. This game has a tremendous power to instill interest in things you once had zero interest in! It's wild that it got me to want to learn, and to memorize things. You might not believe it, but I became so driven by playing this game that I actually subscribed to a junior high geography app! I paid for it, and learned everything from scratch. It's incredible to feel so passionate about this game.

    I'm having a lot of fun because I have a fun method for memorizing. So experiencing how fun it is to memorize things after your school days are over is extremely valuable. It's incredible to have a friend in AZKi who enjoys it too. Finding something that you can get so into is such a wonderful thing. And that is what I love about it! Now we know each other a bit better!
