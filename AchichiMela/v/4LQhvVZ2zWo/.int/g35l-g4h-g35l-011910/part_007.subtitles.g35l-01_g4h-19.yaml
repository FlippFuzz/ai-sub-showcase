  domain_glossary:
  - term: ジオゲッサー (GeoGuessr)
    meaning: A popular browser-based geography exploration game using Google Street
      View where players guess their exact location on a map.
  - term: ノームーブ (No Move)
    meaning: A strict GeoGuessr playstyle rule where players cannot move from their
      starting spot, relying entirely on 360-degree rotation and zooming.
  - term: 電柱ソムリエ (Utility Pole Sommelier)
    meaning: A community/streamer title referring to Netchi Mela's expert knowledge
      in identifying regional locations based on utility poles, transformers, and
      company markings.
  - term: アソビ★まわり隊！ (Asobi Mawaritai!)
    meaning: Hololive's play-supremacy VTuber unit consisting of Hyakutyo Kyoko, Netchi
      Mela, Suzuna Tuzuri, and Sorashina Sopia.
  - term: 青看板 (Blue Sign)
    meaning: Blue Japanese road guide signs that provide crucial regional, town, and
      route information for GeoGuessr players.
  - term: 国道トレカ (National Highway Trading Cards)
    meaning: Collectible trading cards featuring data and specifications of Japanese
      National Highways (Kokudo).
  - term: 中国電力 (Chugoku Electric Power)
    meaning: An electric power company operating in the Chugoku region, noted by Mela
      for its tricky mixed-parts utility poles and Sekishu red roof tiles.
  - term: お見合い (Omiai)
    meaning: A traditional matchmaking meeting; used metaphorically here because AZKi
      and Mela had never interacted before this stream and were meeting blind.
  - term: '#アズメラ (#Azumera)'
    meaning: The temporary combined unit hashtag created by AZKi and Mela for viewers
      to tweet stream feedback.
