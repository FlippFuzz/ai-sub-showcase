    english: Right, and that's what got me started cross-referencing things with maps.
  - start: '03:10.900'
    end: '03:13.060'
    original: え、今大丈夫？楽しい？楽しい？
    english: Wait, are you okay now? Are you having fun? Is it fun?
  - start: '03:13.060'
    end: '03:26.400'
    original: 楽しいっすよ！楽しいですよ！あの、すごいあのなんじゃろ、わしが怖いなって思ってやってたことが、あの点数につながることになったので、とても楽しくやらせていただいておりますのじゃ、ジオゲッサー。
    english: It's fun! It really is fun! Like, how should I put it, something I used
      to do out of fear ended up translating into points, so I'm having a blast playing
      GeoGuessr.
  - start: '03:26.400'
    end: '03:28.100'
    original: 助けられてるならよかった！
    english: If it's helping you out, I'm glad!
  - start: '03:28.100'
    end: '03:28.760'
    original: はい。
    english: Yes.
  - start: '03:29.500'
    end: '03:33.580'
    original: え、なんかところで世界史、世界史はどんなところが好きなんですか？
    english: Um, by the way, what do you like about World History?
  - start: '03:33.680'
    end: '03:40.280'
    original: えっと、なんか絶対につながってる、結構...
    english: Well, how everything is definitely connected, pretty much...
  - start: '03:40.280'
    end: '03:41.940'
    original: 絶対につながってる。
    english: Definitely connected.
  - start: '03:42.200'
    end: '03:46.300'
    original: やっぱ一問一答で暗記もできるし...
    english: You can memorize facts through Q&A flashcards too, and...
  - start: '03:46.300'
    end: '03:47.100'
    original: ああー。
    english: Ahh.
  - start: '03:47.100'
    end: '03:54.180'
    original: それも楽しいけど、なんか誰かが何かをしたから何か事件が起こったり、おや？
    english: That's fun too, but like how because someone did something, a certain
      incident happens—whoa?
  - start: '03:54.500'
    end: '03:55.340'
    original: おや？
    english: Whoa?
  - start: '03:55.800'
    end: '03:57.900'
    original: おや？あ、おや？
    english: Whoa? Oh, whoa?
  - start: '03:58.200'
    end: '03:59.560'
    original: 霊圧が...あ、復活！
    english: My spiritual pressure... Oh, I'm back!
  - start: '03:59.560'
    end: '04:01.700'
    original: 霊圧が復活してきた！おかえりなさい！
    english: Your spiritual pressure came back! Welcome back!
  - start: '04:00.700'
    end: '04:02.180'
    original: ただいま、ただいま！
    english: I'm back, I'm back!
  - start: '04:02.980'
    end: '04:18.300'
    original: そう、そうなのじゃ。なんか何かきっかけがあって、その事件が発生したりとか、あの理由がちゃんとある、あってなんかその物語的な感じでつながってるのがすごい面白いなって思って。
    english: Yeah, yeah. Like how there's a trigger that causes an incident to happen,
      and there's a proper reason behind it all, connecting together like a story—I
      think that's super interesting.
  - start: '04:18.300'
    end: '04:23.020'
    original: ああー、すごい、じゃちゃんとこう歴史というか、そういうのも好きなんだ。
    english: Ahh, that's awesome, so you really appreciate history itself and all
      that.
  - start: '04:23.020'
    end: '04:33.180'
    original: はい、面白いなって思って。そんなめちゃくちゃ詳しいわけでも、その勉強真面目にやっていたわけでもないんじゃが、なんか授業聞いてて面白いなっては思っておりましたのじゃ。
    english: Yes, I found it interesting. Not that I'm super knowledgeable about it
      or studied all that diligently, but I always thought listening to the lectures
      was fun.
  - start: '04:34.800'
    end: '04:38.200'
    original: それはなんかジオゲッサーにつながっている？
    english: Does that connect to GeoGuessr in any way?
  - start: '04:38.200'
    end: '04:55.540'
    original: ええー、でも世界じゃから、なんか日本史とかだったらそれこそ旧国名とかでそのゲスする時に結構役立つなとは思うんじゃが、世界じゃからわしがよくプレイするのが日本マップなので、今のとこあんまりかな。
    english: Hmm, well it's the world, so with Japanese History, old province names
      and stuff are actually pretty useful when guessing, but since it's World History
      and I mostly play the Japan map, not really so far.
  - start: '04:54.600'
    end: '04:55.840'
    original: まあそうだよね。
    english: Well, that makes sense.
  - start: '04:55.840'
    end: '04:59.220'
    original: うんふんふんふん、なるほどなるほど。ちょっとだけ...
    english: Uh-huh, I see, I see. Just a little bit...
  - start: '04:59.050'
    end: '04:59.750'
    original: はい。
    english: Yes.
  - start: '05:00.800'
    end: '05:03.940'
    original: ちょっとずつめらちゃんのことが...
    english: Little by little, I'm learning about Mela-chan...
  - start: '05:01.300'
    end: '05:03.940'
    original: ちょっとずつ、ちょっとずつ...
    english: Little by little, little by little...
