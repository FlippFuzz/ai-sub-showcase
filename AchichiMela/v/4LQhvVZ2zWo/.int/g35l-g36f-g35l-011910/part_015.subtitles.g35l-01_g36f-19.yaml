  - term: ジオゲッサー
    meaning: A browser-based geographic discovery game where players guess their location
      on a map using Google Street View clues.
  - term: ノームーブ
    meaning: A strict GeoGuessr playstyle where players cannot move along the street
      view and must make their guess from their starting 360-degree view.
  - term: 電柱ソムリエ
    meaning: A nickname for someone who analyzes utility poles, transformers, and
      regional power company markers to determine their exact geographical location.
  - term: 国道トレカ
    meaning: Collectible trading cards featuring information on Japan's national highways,
