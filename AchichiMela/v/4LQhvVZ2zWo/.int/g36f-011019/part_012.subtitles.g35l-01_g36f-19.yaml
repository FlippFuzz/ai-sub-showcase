      on a map using Google Street View clues.
  - term: ノームーブ
    meaning: A strict GeoGuessr playstyle where players cannot move along the street
      view and must make their guess from their starting 360-degree view.
  - term: 電柱ソムリエ
    meaning: A nickname for someone who analyzes utility poles, transformers, and
