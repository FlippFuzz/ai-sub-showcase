  domain_glossary:
  - term: ジオゲッサー
    meaning: GeoGuessr, a popular geography browser game where players are dropped
      into a Google Street View panorama and must guess their location on a world
      or country map.
  - term: ノームーブ
    meaning: No-Move, a challenging GeoGuessr game mode where players are not allowed
      to move along roads or travel, relying strictly on 360-degree panning, zoom,
      and local environmental clues.
  - term: 電柱ソムリエ
    meaning: Utility pole sommelier, a tongue-in-cheek term for someone who specializes
      in identifying regions and power companies based on utility pole types, wiring,
      and markings.
  - term: 国道トレカ
    meaning: National highway trading cards, collectible cards featuring Japanese
      national highways, popular among road and geography enthusiasts.
  - term: アソビ☆まわり隊！
    meaning: ASOBI☆MAWARI-TAI!, a Hololive VTuber unit dedicated to the pursuit of
      fun and play, of which Nechika Mela is a member.
  - term: のじゃ
    meaning: Noja, an archaic speech suffix and verbal tick associated with elderly,
      divine, or mythical character archetypes.
  - term: あずめら
    meaning: AzuMela, the provisional ship name and hashtag for the collaboration
      stream between AZKi and Nechika Mela.
  - term: ジオゲブ
    meaning: Geo-bu / Geo-club, the proposed club name for AZKi and Mela's geography
      and GeoGuessr study activities.
