global_summary:
  overall_summary: This YouTube livestream features a blind collaboration between
    Hololive virtual diva AZKi and newcomer Nechika Mela from the unit 'ASOBI☆MAWARI-TAI!'.
    Despite having never spoken before this broadcast outside of business communications,
    both VTubers quickly bond over their intense, shared passion for the geography
    browser game GeoGuessr. Throughout the stream, they compare their contrasting
    playstyles (AZKi's moving/information-gathering approach versus Mela's stationary
    No-Move approach), discuss their fascination with maps, national highways, utility
    poles, and regional geography, and enthusiastically brainstorm future club activities,
    real-life fieldwork, and collaborative music projects.
  chapters:
  - start: 00:00
    end: 02:40
    title: Introduction and Nerves
    description: The stream opens with introductory banter, setting up the blind collaboration
      where AZKi and Mela have intentionally avoided chatting beforehand to maximize
      genuine first-time reactions.
    song_title: null
    song_artist: null
  - start: 02:40
    end: '12:00'
    title: Mutual Self-Introductions and Profile Sheet Review
    description: Both participants review their profile sheets, sharing initial fan-girl
      excitement, awkward nervousness, and official self-introductions as senpai AZKi
      and newcomer Mela.
    song_title: null
    song_artist: null
  - start: '12:00'
    end: '23:30'
    title: Favorite Games and GeoGuessr Playstyles
    description: 'They discover that GeoGuessr is their absolute favorite game and
      contrast their playstyles: AZKi moves around actively to gather road signs for
      5K scores, while Mela specializes in stationary No-Move guesses using visual
      details.'
    song_title: null
    song_artist: null
  - start: '23:30'
    end: '31:00'
    title: School Days, History, and Geography
    description: They discuss their favorite school subjects (Japanese/World History)
      and Mela shares her humorous backstory of learning map-reading after accidentally
      doxxing her mountain home in the past.
    song_title: null
    song_artist: null
  - start: '31:00'
    end: '44:00'
    title: The Joy of GeoGuessr and Forming a Club
    description: They discuss why GeoGuessr is so addicting due to its immediate feedback
      and practical application of knowledge, officially proposing the creation of
      a GeoGuessr club ('Geo-bu').
    song_title: null
    song_artist: null
  - start: '44:00'
    end: '58:00'
    title: 'Future Collab Ideas: National Highways, Utility Poles, and Dams'
    description: The conversation escalates into niche geography topics, discussing
      national highway trading cards, Chugoku Electric Power utility poles, regional
      roofing tiles, and dam visits.
    song_title: null
    song_artist: null
  - start: '58:00'
    end: '69:00'
    title: Real-Life Fieldwork and 100 Questions Teaser
    description: They brainstorm real-life GeoGuessr fieldwork where they visit mystery
      locations on foot, and Mela teases an Excel sheet containing 100 prepared interview
      questions.
    song_title: null
    song_artist: null
  - start: '69:00'
    end: '47:50'
    title: Hololive Music, Closing, and Goodbyes
    description: They discuss how music brought them into Hololive, brainstorm a potential
      47-prefectures educational song project, and close the stream with their signature
      sign-offs.
    song_title: null
    song_artist: null
