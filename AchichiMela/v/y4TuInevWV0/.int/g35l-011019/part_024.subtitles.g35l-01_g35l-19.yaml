  domain_glossary:
  - term: ホロメンMAP
    meaning: A custom GeoGuessr map created by AZKi featuring locations associated
      with Hololive members, lore, and trivia across Japan.
  - term: ノームーブ
    meaning: A GeoGuessr game rule where players are not allowed to move or walk around,
      forcing them to deduce locations purely from their initial spawn point using
      street signs, poles, and landmarks.
  - term: アソビ☆まわり隊！
    meaning: Hololive unit/generation group that Netsuchi Mela belongs to.
  - term: サラマンダー
