    in No-Move mode using the custom 'Holomen Map' created by AZKi. Across over two
    hours of gameplay, Mela navigates various Japanese locations ranging from Tochigi
    and Akita to Nagasaki and Tokyo, deducing regions through telephone poles, signage,
    and regional landmarks while sharing humorous commentary about her recent ARK
    survival struggles and interacting with chat.
