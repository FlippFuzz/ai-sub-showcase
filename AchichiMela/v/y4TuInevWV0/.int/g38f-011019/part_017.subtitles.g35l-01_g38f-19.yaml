  domain_glossary:
  - term: ジオゲッサー
    meaning: GeoGuessr, a geography browser game where players guess their location
      on a map using Google Street View panoramas.
  - term: ホロメンマップ
    meaning: A custom GeoGuessr map created by AZKi featuring locations in Japan with
      names or features related to Hololive members.
  - term: ノームーブ
    meaning: No-Move mode in GeoGuessr, where players are prohibited from moving along
      the road and must guess from their initial drop location.
  - term: 電柱プレート
    meaning: Utility pole identification plates showing electric company markings
      (e.g., Tokyo Electric Power, Tohoku Electric Power) used as regional clues.
  - term: 市外局番
    meaning: Telephone area codes used to identify regional locations in Japan.
