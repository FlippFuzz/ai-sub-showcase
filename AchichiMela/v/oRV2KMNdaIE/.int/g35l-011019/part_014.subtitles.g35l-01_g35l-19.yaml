    original: あ、でもそれで言うと結構みんなは決めててたと思うよ。そぴあも決めてるんだよな。
    english: Ah, but speaking of that, I think everyone decided firmly. Sopia decides
      too.
  - start: '03:19.798'
    end: '03:22.598'
    original: うんうん、だけどまあ、たまにはお姉さんか？
    english: Yeah yeah, but well, sometimes an older sister?
  - start: '03:25.598'
    end: '03:29.858'
    original: でもたまには優しくしてあげてもいいんじゃないかなって。
    english: But I thought maybe it's okay to be gentle sometimes.
  - start: '03:30.138'
    end: '03:32.418'
    original: まあそっか。はい。
    english: Well, I guess so. Yes.
  - start: '03:33.178'
    end: '03:34.998'
    original: どうだった？そぴあは？
    english: How was it, Sopia?
  - start: '03:35.378'
    end: '03:41.878'
    original: いや、これ、そぴあがね、もうかなりお姉さん常識人なところみんなに見せれたんじゃないでしょうか。
    english: Well, this, Sopia, right, was able to show everyone that she's a pretty
      sensible older sister-type person.
  - start: '03:42.278'
    end: '03:46.758'
    original: 確かに、そぴあ結構常識的だったな。なんか変なのあんまりなかったか。
    english: True, Sopia was quite sensible. There weren't really any weird things.
  - start: '03:46.758'
    end: '03:49.698'
    original: 今回はね。そう、今回はなかったね。
    english: This time. Yeah, this time there wasn't.
  - start: '03:49.858'
    end: '03:52.578'
    original: 今回はなかったね。私たぶん忘れちゃったんだけど、前回何があったんだっけ、そぴあ？
    english: This time there wasn't. I probably forgot, but what happened last time,
      Sopia?
  - start: '03:54.218'
    end: '03:57.178'
    original: えっとね、ハサミを使う職業とえば...
    english: Let's see, a profession that uses scissors...
  - start: '03:57.378'
    end: '04:01.378'
    original: あ、ちょっとコメント欄でも考えてもらおう。ハサミを使う職業といえば何だと思う？お前ら。
    english: Ah, let's have the chat think about it too. What do you guys think is
      a profession that uses scissors?
  - start: '04:01.378'
    end: '04:05.638'
    original: ハサミ使う職業... ハサミといえば...
    english: Professions that use scissors... speaking of scissors...
  - start: '04:05.638'
    end: '04:10.998'
    original: まあ、メインで使うね、職業といえばあれですよね。え、じゃあ、せーので、その時の回答よ。
    english: Well, mainly used, when you think of the profession, that's it. Eh, then,
      on the count of three, your answer from back then.
  - start: '04:10.998'
    end: '04:15.018'
