    english: Eh, wait, what did I say? Tsuzuri now thinks...
  - start: '04:18.998'
    end: '04:22.398'
    original: せーの！ 美容師！
    english: Ready, go! Hairdresser!
  - start: '04:22.398'
    end: '04:28.198'
    original: ちょっと長いのおったな。なんだ？なんだ？あ、つづりは花屋さんって言ったんだよね。
    english: There was a pretty long one. What was it? What was it? Ah, Tsuzuri said
      florist, right?
  - start: '04:28.198'
    end: '04:35.398'
    original: うん、お花屋さん。わかりよね。ハサミ使うよね、お花ちょきちょきするよね。
    english: Yeah, florist. You know it. You use scissors, you trim flowers.
  - start: '04:35.398'
    end: '04:42.318'
    original: えと、そぴあさん？ 髪切り師？
    english: Um, Sopia-san? Kami-kirishi (paper-cutting artist)?
  - start: '04:42.518'
    end: '04:50.098'
    original: え、なんかさ、ハサミでさ、紙切ってさ、すげえ絵にする人いるじゃん。いるいる。
    english: Eh, like, someone cuts paper with scissors and makes amazing art, right?
      Yeah, there are.
  - start: '04:50.098'
    end: '04:59.398'
    original: 美容師さんとかお花屋さんとかさ、ハサミ以外のものも使うけど、髪切り師はハサミ1本で！
    english: Hairdressers, florists, etc. use things other than scissors, but a paper-cutting
      artist uses just 1 pair of scissors!
  - start: '04:59.398'
    end: '05:00.120'
    original: ハサミ1本で！？
    english: With just 1 pair of scissors!?
