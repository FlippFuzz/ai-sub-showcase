  thoughts: |+
    **Content Warning Collab - Laplus's Perspective**

    Okay, here's what's happening. I'm Laplus Darknesss, and I'm playing *Content Warning*. It's a VTuber collab with Todoroki Kyoko and Sophia Valentine, and I think one other player but I don't know who. This is my perspective.

    At the beginning, Kyoko and I are trying to figure out where to go. It's some kind of maze and we are confused. I'm shouting "Noja!" a lot, which is my way of saying things. I'm also saying "Washi ga hikiukereba iika" which means "I guess I'll just take it all". I have my cart and I say "Yoisho" a lot.

    I can see some scary things, so I start panicking and shout "Yabee no iru!" over and over (There's a bad one!), but then I calm down a bit. I picked up this head and I'm yelling "heavy head, heavy head!" I'm trying to figure out what to do with this giant head. It has to go in the drop-off. Oh, and I said "Irechau ne, onushi. Iiko ni dekiru?" which means "In you go. Can you be a good boy?" to this head.

    Then, there's a Cosmo Stick! I'm confused about what it is, and then someone says "skiing". We also meet a "fake Sophia". I am the one carrying this green head.

    After a lot of "Yoisho!", I say "Topi, topi! Topii!", then "To all of you, here's some excitement!", I'm playing around.

    Then, I'm yelling for Kyoko, to help me carry this giant green thing. I also had to keep shouting for Kyoko to help with heavy things. There was a fake Sophia and another player named Tsuzuri.

    I can hear Kyoko shouting from the other player's POV "Decca! Nan ja kora!" ("It's huge! What the heck is this?!") and "Omotta! Yabba kore!" ("So heavy! This is insane!"). I think that's Kyoko because I'm telling her what to grab. The red team is doing their best! Then we hit our quota, everyone is going home. I'm now verifying the other players.

