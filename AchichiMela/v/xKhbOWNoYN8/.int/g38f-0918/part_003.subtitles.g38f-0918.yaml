  thoughts: |+
    **A Chaotic Run in a Horror Extraction Game**

    Alright, let's see, the goal here is to get subtitles for this clip of VTubers playing... looks like *REPO Man* or *Content Warning* or maybe *Lethal Company* or something similar. Ah, yes, the cart with the money, the extraction point - *Content Warning* it is, or something in that vein. "FOCUS: Fill the extraction point with valuables." Got it. The streamer... looks like one of the Nijisanji folks, maybe Yashiro? No, blue hair, twin tails, horns... Ah, she has three chibi heads - Kyoko, Sophia, Tsuzuri. Wait, the main streamer is Michiru, she has cyan hair, red horns, ghost accessories and talks with "noja"!

    Okay, here we go, transcription time!

