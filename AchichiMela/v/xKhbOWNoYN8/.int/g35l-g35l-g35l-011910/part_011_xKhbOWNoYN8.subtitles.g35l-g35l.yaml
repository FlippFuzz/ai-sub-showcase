global_summary:
  overall_summary: In this livestream video, the Hololive rookie unit 'Asobi Mawaritai!'
    (composed of Achichi Mela, Hyakuto Kyoko, Suzuna Tsuzuri, and Sorashina Sopia)
    plays the co-op horror and loot extraction game 'R.E.P.O.'. Throughout the video,
    the four members navigate eerie museum maps and houses, loot valuable items while
    hauling them in a cart, panic and scream when encountering various bizarre monsters,
    make humorous team-kill blunders, shop for stat upgrades and gear between runs,
    and wrap up with upcoming stream announcements.
