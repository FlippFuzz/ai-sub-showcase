  - start: '04:32.000'
    end: '04:35.000'
    original: 頑張れ、頑張れ！
    english: Go for it, go for it!
  - start: '04:35.000'
    end: '04:37.000'
    original: ソピア頑張って！
    english: Sopia, hang in there!
  - start: '04:36.000'
    end: '04:38.000'
    original: 壊したー！
