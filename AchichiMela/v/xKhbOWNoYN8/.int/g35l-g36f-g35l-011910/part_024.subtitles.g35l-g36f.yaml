  - start: '04:50.000'
    end: '04:53.500'
    original: あの浮かすやつに巻き込まれて...
    english: got caught in that floaty thing...
  - start: '04:53.000'
    end: '04:55.000'
    original: ソピアだけ...
    english: Only Sopia...
  - start: '04:55.000'
    end: '04:58.000'
    original: 頑張ってソピア！
    english: Hang in there, Sopia!
  - start: '04:55.500'
    end: '04:58.500'
