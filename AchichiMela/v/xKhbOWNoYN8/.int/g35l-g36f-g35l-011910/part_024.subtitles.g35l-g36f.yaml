    english: After all, to be saved, you gotta be in an easy-to-rescue spot...
  - start: '03:41.000'
    end: '03:45.000'
    original: と言う意味で、ソピアはすごい救いづらいところに居た。
    english: In that sense, Sopia was in a super hard-to-rescue spot.
  - start: '03:45.000'
    end: '03:48.000'
    original: で、ソピア以外が死んでいる。
    english: And everyone except Sopia is dead.
  - start: '03:46.500'
    end: '03:48.000'
    original: 生き残った...
    english: I survived...
  - start: '03:48.000'
    end: '03:50.000'
