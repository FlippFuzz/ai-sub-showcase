    english: Ended up with the worst combination!
  - start: '03:21.000'
    end: '03:26.500'
    original: ばれて... お、ばれてない！ばれてない！
    english: Was it spotted... Oh, it's not spotted! Not spotted!
  - start: '03:26.500'
    end: '03:30.000'
    original: あ！ばれている！そして、また... また分かりづらいところ！
    english: Ah! It IS spotted! And again... In a hard-to-see spot again!
  - start: '03:30.000'
    end: '03:33.500'
    original: 救いづらいところで！救いづらいところで助けを求めているソピア！
    english: In a hard-to-rescue spot! Sopia seeking help from a hard-to-rescue spot!
  - start: '03:34.000'
    end: '03:37.000'
    original: ダメなのじゃ... ダメなのじゃ...
    english: That's no good... That's no good...
  - start: '03:38.000'
    end: '03:41.000'
