    english: That red sphere is money!
  - start: '04:24.000'
    end: '04:27.500'
    original: え、何を拾え？あの、私のとこにあったやつ？
    english: Eh, pick up what? The one at my place?
  - start: '04:26.500'
    end: '04:28.000'
    original: 廊下にあるやつ！
    english: The one in the hallway!
  - start: '04:28.000'
    end: '04:32.000'
    original: あれすぐ取らないと無くなっちゃうかもだから、拾って！
