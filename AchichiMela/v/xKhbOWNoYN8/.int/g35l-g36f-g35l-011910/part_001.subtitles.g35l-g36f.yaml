global_summary:
  overall_summary: This video features the four members of the Hololive newcomer unit
    'Asobi Mawaritai!'—Achichi Mela, Hyakuto Kyoko, Suzuna Tsuzuri, and Sorashina
    Sopia—playing the cooperative physics-based horror extraction game 'R.E.P.O.'.
    Across multiple terrifying yet hilarious expeditions into museums, houses, and
    academy maps, the group attempts to loot valuable items, manage physics-based
    carts and fragile objects, avoid bizarre monsters, and survive sudden deaths and
    revivals. Alongside chaotic team banter, friendly bickering, and shop upgrades,
    the members showcase their distinct personalities while striving for financial
    success.
