    original: それ幻、幻。86%でつづり行った。
    english: That was an illusion, an illusion. Tsuzuri hit 86%.
  - start: '04:07.100'
    end: '04:17.000'
    original: またやろう！そちら、アリエンスワード組で... よろしければ、アーカイブご覧ください。のじゃ！
    english: Let's do it again! Over there on the Alien Swarm team... If you'd like,
      please check the archives, noja!
  - start: '04:17.000'
    end: '04:18.500'
    original: ご覧ください！
    english: Please check them out!
  - start: '04:18.500'
    end: '04:28.800'
    original: これからもいっぱいわしたちコラボしていくから、全員のチャンネル登録と、高評価と、Twitterのフォローと、んー、全部！全部してほしいのじゃ！
    english: We'll keep collaborating a lot from now on, so please subscribe to everyone's
      channels, like the videos, follow our Twitters, and... everything! We want you
      to do everything, noja!
  - start: '04:28.800'
    end: '04:33.400'
    original: 全部！お願いしますのじゃ！
    english: Everything! Please, noja!
  - start: '04:33.400'
    end: '04:36.500'
    original: のじゃー！今日はおしまい。
    english: Noja~! That's all for today.
  - start: '04:36.500'
    end: '04:40.500'
    original: なんじゃっけ？終わりのご挨拶って。
    english: What was it again? Our closing greeting.
  - start: '04:40.500'
    end: '04:47.800'
    original: 次もー！お遊びー！まわりー！隊ー！
    english: Until next time~! Asobi~! Mawari~! Tai~!
  - start: '04:47.800'
    end: '04:52.000'
    original: え、これで合ってたっけ？ごめん！合ってた今？
    english: Wait, was that right? Sorry! Was that right just now?
  - start: '04:52.000'
    end: '04:56.500'
    original: もう一回やる？もう一回いける？じゃあもう一回やってこの配信を...
    english: Wanna do it again? Can we go one more time? Then let's do it again and
      end this stream...
