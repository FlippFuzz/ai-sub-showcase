    \ \"That stance makes it look like we'll be able to grab, smash, and defeat enemies!\"\
    \ Her words are followed by excited reactions of “Cool!\", \"Amazing!\", and \"\
    I wanna try!\".\n\nTheir exploration is interrupted as they move on to more urgent\
    \ tasks, with one character mentioning they are trying to explore, though... The\
