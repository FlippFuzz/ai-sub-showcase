global_summary:
  overall_summary: In this stream from Mela Ch. 熱千めら, Hololive's Asobi Mawaritai member
    Achichi Mela chats with her viewers ("meragumi") about recent PC troubleshooting,
    bath-time habits, and running gags about her face-reveal mask. She then spends
    the majority of the broadcast designing a custom Yes/No flowchart to help fans
    find their preferred member in the unit, carefully mapping out questions for Kyouko,
    Tsuzuri, Sopia, and herself. Afterward, she reflects fondly on the kindness and
    emotional support of her unitmates, particularly praising Sopia's gentle communication
    style, and concludes by deciding on her official stream greetings ('Konnoja' and
    'Sarabaja').
