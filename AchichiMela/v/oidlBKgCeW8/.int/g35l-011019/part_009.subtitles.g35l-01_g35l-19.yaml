global_summary:
  overall_summary: In this stream from the Hololive VTuber unit 'Asobi Mawaritai!',
    member Achichi Mela engages with her viewers while working on creating a custom
    Yes/No recommendation flowchart on Twitter to help fans discover their preferred
    unit member. Throughout the broadcast, Mela discusses her unit mates—Hyakuto Kyoko,
    Suzuna Tsuzuri, and Sorashina Sopia—sharing anecdotes, brainstorming flowchart
    questions, expressing gratitude for their kindness, and deciding on stream greeting
    catchphrases like 'Kon-noja' and 'Saraba-ja' before closing out ahead of her upcoming
    Rhythm Heaven gaming stream.
