    **A Quick Thought Dump (And a Little Bit of Oops!)**

    Okay, so I just watched that video of Aochi Chimi, and as a subtitler, let me break it down for you. First off, I'm thinking, "Noja, yeah, yeah, right, so we're keeping in touch via messages." That's the baseline, the groundwork. Then, "Alright, isn't around 30 minutes a good length? The archive should be really easy to watch, right? And, I covered everything I wanted to say!" I mean, I got to speak my piece, and the time feels just right, you know?

    But then, it hits me: "In the end, I just ended up exposing my d-dad's weakness." Oops. Did I need to go there? I'm thinking, "I mean... I ended up exposing the weakness of my dad who kindly supports my activities." This is where the self-reflection hits. "Wait, should I go learn some morals or something?" Maybe I should be thinking about the implications. "My sincere apologies," I tell myself.

    Now, I understand Dad is often making self-deprecating jokes, but it's different when someone else is pointing it out, "But making fun of yourself and having someone else do it are totally different!" That's where I go: "That's totally true. My sincere apologies." I was going to change the subject, and I figured, let's show them the schedule, "Alright! Let me show you the schedule!"

    At this point, I'm thinking about future activities and schedules: I say, "Next on the agenda, starting at 20:00, the Asobimawaritai will be playing R.E.P.O.!" I know it, "Dad watches my streams!" Apparently if he gets a little break during work, he watches. Yeah, he goes to work after watching "Noja English." "He said he watches halfway, heads to work and catches bits and pieces during his break time."
    Yep, we'll be playing R.E.P.O., so please tune in at 20:00! And Achichimeira will do three streams today, so get ready! And, tomorrow, Keep Talking and Nobody Explodes collab with Kyoko, on the 16th, there is the horror game "Platform 8", on the 17th, "Kuukiyomi 2" and on the 18th "Dandelion Will Endure"!

    Let's not forget to look forward to this! But then, I'm thinking, "this stream, wasn't it so unnecessary..." I reflect, "Yeah, a stream that wasn't necessary because I threw a fit on Twitter, and I'm cleaning up after myself." I'm doing the things!

    In other words, "This is not great and I'll learn from this." Next, I'm telling myself, "I'll be more careful going forward," with things like this: From now on, I'm hoping to do some planned, non-sudden internet disaster drills. It's safe to say: "I never want to do a sudden internet disaster drill again!" That's what I'm hoping and promising, to make sure it doesn't happen again. And that's all! So, that's the end of the stream, and let's meet again at 20:00! Well then, everybody, farewell! Thank you for watching!


