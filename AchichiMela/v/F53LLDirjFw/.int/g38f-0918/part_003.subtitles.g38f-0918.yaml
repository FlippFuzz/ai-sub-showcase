  thoughts: "**My Reflection on a Twitter Incident**\n\nOkay, so, here's the thing.\
    \ I was going through Twitter, saw something that made me think, \"Oh no, this\
    \ is not good.\" It was a misunderstanding, a potential issue, and my immediate\
    \ reaction was \"Shoot!\" \"Indeed, they might actually be right!\" Then, deep\
    \ self-reflection set in. I realized I caused people to lose trust in me as a\
    \ corporate affiliate because of my information security, which is a major no-no.\
    \ Yeah, it wasn't good.\n\nMy first thought, and I mean right away, was \"Write\
    \ 'I have no sister' in your bio?\" But the thing is, most people don't go that\
    \ far. Like, only a tiny minority checks profiles, and anyone who checks profiles\
    \ is probably looking at quote retweets too. So, they could tell from the quote\
    \ retweets that it was a sockpuppet attempt. Yeah.\n\nFortunately, Achichi Mela\
    \ sensed the situation early on and explained in a thread that she has no sister,\
    \ preventing a major incident, which, is the one and only good thing Achichi Mela\
    \ did this time. Everything else was awful! The only reason this didn't blow up\
    \ into a bigger disaster was that thread. I seriously didn't need to quote retweet.\
    \ I did, but yeah, it ended as a near-miss here. \n\nOkay, let's call that \"\
    Initial fire extinguishing?\". Seeing someone say, \"Indeed, there's a chance\
    \ people might think she's a real sister,\" I thought, \"You're right!\" So I\
    \ put \"I have no sister\" in a very visible place. So, getting overly misunderstood\
    \ in a weird way didn't happen, I believe. Only this part was good. Everything\
    \ else was the absolute worst. Yeah.\n\nSo, let's talk about the issues, and what\
    \ I should have done. First, I didn't think deeply enough about what happens if\
    \ it is communicated poorly, and, \"not thinking deeply\" is a crime in itself!\
    \ Not thinking is truly unacceptable. Getting carried away is really bad. I tweeted\
    \ with wording where it was hard to tell it was a joke, which, is hard to do!\n\
    \nThe thing is, getting people to recognize a joke is a joke is hard! This recent\
    \ thumbnail where I said \\\"Amateurs, shut up,\\\" you can tell that's a joke\
    \ to those who know my content, but to someone else, they'd think, \\\"Why use\
    \ such harsh words?\\\" right? There are so many things where people can't tell\
    \ it's a joke, and that misunderstanding is super dangerous, so I need to be better\
    \ at this.\n\nAnd, second, pulling a sockpuppet stunt in the first place, is a\
    \ total no-no. Zero defense! \\\"What did I do that internet disaster drill for\
    \ two weeks ago?\\\" That is just the worst part!\n\nSo, what should I have done?\
    \ I should not make edgy tweets in the first place, as this is synonymous with\
    \ \"don't get carried away.\" Getting carried away isn't good. I will be careful.\
    \ Yes. Instead, I should \"Post on HoloPlus, etc., closed spaces where jokes are\
    \ understood.\"\n\nYou see, if I had said it on stream, it would have been different.\
    \ If I were on a stream, it would only be seen by people who follow me, but Twitter\
    \ gets into the For You tab and spreads further and further endlessly! People\
    \ who only know a little bit about me or people who have zero interest, they see\
    \ this. So, when posting an edgy tweet, let's do it on HoloPlus. I'll do it on\
    \ HoloPlus. Are you guys on HoloPlus? You can do a lot of things on it. You can\
    \ see Holo members' messages, check their posts, and make posts yourself. I'm\
    \ thinking of using HoloPlus as a sub-account might actually be a great idea.\
    \ Yeah. Mhm. Indeed.\n\nI should also be mindful of my role as a corporate affiliate.\
    \ That's true. And, I should have stopped slacking on thinking when getting carried\
    \ away. I really realized getting carried away is truly bad! I thought it was\
    \ fun, but it's really not okay. Inadvertently, without thinking, you know. Plus,\
    \ when streaming, I'm broadcasting, so I'm careful with my words, but Twitter,\
    \ I'm just so fun, it's so fun that I end up doing it naturally, just like breathing.\
    \ And I should have just gone to sleep without vanity searching.\n\n\n"
