  thoughts: |+
    **My Post-Mortem of the Twitter Fiasco**

    Okay, so I observed the situation unfold, and in that moment, I thought, "This is bad!" Yep, right then, "This is bad!" It's true, I thought, "That's true, maybe so." Already, I was filled with regret. I caused distrust in my ability to manage information as a corporate affiliate.

    I wrote in my bio, "There is no older sister." But, in reality, people who read tweets rarely ever check the bio. Even if they *did* look at my bio, they probably would have looked at the hidden info as well. I think they would have seen the "self-staged" stuff in that section and understood.

    Fortunately, at an early stage, Achichimera figured it out and explained in a thread that there is no older sister, so it didn't blow up. This was the *only* good thing about the whole Achichimera incident, really. Aside from this, it was just the worst! There was no need to seriously ignore it, but the fact that we got off with a near-miss here is probably right here.

    Today's firefighting: initial containment. It's true. Seeing the possibility that she might really be taken as a serious sister, I thought, "True," and I put "There is no older sister" in a quite easy-to-understand place. I put it right where everyone could see it. So, I feel like we avoided falling into overly bizarre misunderstandings. Yeah, only here was good. Everywhere else was the worst.

    Now, let's examine the *problems* and what *should* have been done. Failing to think deeply about what if it wasn't conveyed correctly, and tweeting in a hard-to-read joke format. Not thinking deeply about it is a crime in itself. Not thinking is *really* bad. Seriously, getting carried away is the *worst*. Tweeting with expressions that made it hard to tell it was a joke...it is really difficult to make people understand that a joke is actually a joke.

    To someone who doesn't know, they might think, "Why use such strong words?" right? There are so many things where you can't tell if it's a joke, and whether people share that common understanding completely alters their impression, which is super dangerous. And, as for the second point, *staging* it in the first place? That's totally indefensible. What was the point of doing that internet disaster prevention drill two weeks ago? Seriously.

    Yeah, this is the worst one. Absolutely the worst. What *should* have been done? First of all, just don't tweet at all! It's a matter of principle not to get carried away. Yeah, getting carried away is bad. I'll be careful.

    Instead, I could have shared it in closed spaces where jokes land, like Holoplus. If I had talked about it on stream, the story would have been different, I think. On stream, it would only reach people already following me. But Twitter just gets recommended endlessly and reaches even people who know little about me or don't care.

    So, at least when tweeting, use Holoplus. Do it on Holoplus! I wonder if people even *use* Holoplus? It's the official Hololive SNS. You can do all sorts of things! It has poll functionality, voice clip uploads, and you can see Holomen's messages, plus, you can post yourself, so I think using Holoplus as a sub-account is a viable option. Having self-awareness as a corporate affiliate. Exactly as you say.

    I should have stopped getting carried away and slacking off in thought. Man, getting carried away is *really* bad. I thought it was fun, but nope. Unintentionally. Plus, during streams, I broadcast with a strong awareness that I'm putting content out, so I'm generally careful, but Twitter is so fun that it makes me breathe too easily and let my guard down. I should have just gone to sleep without ego-searching.



