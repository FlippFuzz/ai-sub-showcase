    end: '04:10.000'
    original: うん、なんか「人間たちを抱きしめられるフリをしつつ...」
    english: Yeah, like, while pretending to embrace all of humanity...
  - start: '04:10.100'
    end: '04:14.500'
    original: 「本当抱きしめたいのは... 一人ぼっちだった過去の自分」
    english: '...the one I really want to hold close... is my lonely past self.'
  - start: '04:15.000'
    end: '04:18.000'
    original: 「こんな人に助けてほしかった」という...
    english: Thinking, "I wish someone like this had saved me..."
  - start: '04:19.000'
    end: '04:23.000'
    original: こんな人に助けてほしかったけど... こんな人がいなかった...
    english: I wished so badly for someone like that, but nobody was there...
  - start: '04:23.100'
    end: '04:30.000'
    original: から、それが悲しかったから、わしがその人になることで過去の自分を救っているの…のでエゴです！という話を...
    english: '...and because that was so painful, by becoming that person myself,
      I am saving my past self... So it''s purely my own egoism! That''s the story...'
  - start: '04:30.100'
    end: '04:33.500'
    original: Twitterでしたの。したのじゃ。
    english: '...I was trying to tell on Twitter.'
  - start: '04:34.000'
    end: '04:37.000'
    original: そう、自己投影してるの。自己投影してるの。
    english: Right, I'm projecting onto myself. It's self-projection.
  - start: '04:37.100'
    end: '04:40.000'
    original: そう、救うことでね...
    english: Yeah, by saving others...
  - start: '04:40.100'
    end: '04:45.000'
    original: よく言うじゃろ？あの... 人間の相談に乗るとか、人間を助けるのが好きな人って...
    english: '...you know how people often say? People who like listening to others''
      troubles or helping people...'
  - start: '04:45.100'
    end: '04:49.000'
    original: 自分が助かりたくて... 人を助けてる...
    english: '...are actually helping people because they want to save themselves...'
  - start: '04:49.100'
    end: '04:54.000'
    original: 助けようとしてる時に、その... 助けられてる相手に自己投影しているみたいなのと同じですのじゃ。
    english: '...and while trying to help, they project themselves onto the person
      being saved. It''s the exact same thing.'
  - start: '04:55.000'
    end: '04:59.000'
    original: 他者を救うことで自分を救おうとしていますのじゃ、わしは。
    english: By saving others, I am attempting to save myself.
  - start: '04:59.100'
    end: '05:01.521'
    original: はい。しているよ、という話...
    english: Yes. That's what I'm doing...
