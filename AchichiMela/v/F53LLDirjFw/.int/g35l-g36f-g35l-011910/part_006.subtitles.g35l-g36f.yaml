    **A Deep Dive into Mela-Papa's Reactions & Generational Tech Gaps**

    Okay, here's the lowdown on what I was thinking and transcribing from that video segment (30:02.094 to 35:06.102). I needed to get these synchronized subtitles *just* right. It's *me*, Achichi Mela, speaking here, using "washi" and "noja" like usual.

    So, in this segment, I'm continuing to tell the story about a chat I had with Mela-papa, my dad. He was *totally* fangirling after Momosuzu Nene-senpai responded to something he posted. He's not on SNS/LINE at all. The poor guy uses iMessage because he *literally* has no friends to exchange LINE IDs with. I'm telling you, I have to translate his clunky messages into English and (naturally) flowing Japanese for the viewers!

    I'm thinking about how my dad reacted to Nene-senpai. It started with, "I can't believe Nene-senpai noticed me!" He realized he should have been careful about what he says online. He even says he needs to review that internet disaster prevention drill. He's *so* pleased that Nene-senpai noticed his tweet about how much he enjoys talking about his "oshi" (favorite).

    Then, I was like, what's with the "noja" at the end? I need to clarify that with you guys. I had to show you the screenshot of his message. Then, I had to translate his message that he had, "No real meaning, I was just shocked..." That's what I said when I asked him what he meant! I told him, "You were just shocked to see a clip of your own comment?" "Yeah," he said, "I was shocked to be clipped and shocked Nene-chi reacted."

    You know, it's just a little bit weird to hear him calling her "Nene-chi." I'm also saying that people who are not on social media are *amazed* at how quickly things get a reaction. My dad doesn't have an SNS account, so he was *so* surprised.

    I thought, "Good for you!" (to my dad). His next message says that when special events happen on SNS, he tends to get carried away. He doesn't have an account, but maybe he prefers maintaining silence.

    He was *so* happy that Nene-senpai had given that tweet with the guidelines. He even felt flustered. "I feel like wanting to react in all kinds of ways, good or bad." Then he says "maybe it's a stance of maintaining silence." He was reflecting, just sitting there, all by himself.

    I just wanted to talk about it since I have a terrible memory. I had to discuss it quickly before it was a long time. My dad has strong "disaster awareness."

    I start thinking about how my audience's parents' generation. Do they even *have* internet literacy? Does it depend on the person? My dad and mom are pretty high on internet literacy. They don't use SNS, and that's probably the *highest* level of literacy. They have no friends and don't even have people to talk with!

    I then had to explain that we use iMessage because he has no LINE friends! No one to add! So, he is stuck with it! "You could say that's high literacy too," I thought. I then made sure to conclude that fact.
