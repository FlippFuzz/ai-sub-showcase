  thoughts:
  - |-
    **My Analysis of a Recent Twitter Incident**

    Okay, here’s the breakdown of my thinking regarding that recent… *situation*. It started with me thinking "Yeah, that *could* be true" and a moment of reflection, realizing I caused a problem, namely mistrust around information management as a corporate VTuber. I'm *so* sorry!

    I considered posting in my profile that I don't have a sister, but that's a small audience. Ultimately, people who engage with my content will likely see the quote tweets, where others' comments would make it clear that the whole thing was a joke. Thankfully, Achichi Mela noticed something early on and addressed it in a thread. Everything except that was the worst.

    I got carried away, I *really* did. There was no need for that quote tweet. And it was pure luck that things didn’t escalate further, thanks to the quick action. It was a close call, and that quick work was the *only* good thing. So, I took action, I put a statement in an easy-to-spot location and thankfully that prevented the misunderstanding from growing. Only that one part was good.

    I need to analyze this further. *Problems*: I didn’t think deeply enough about misinterpretation. No, I am seriously wrong for that! I wasn't being careful! I shouldn’t let myself get carried away. Thinking is key; not thinking is *bad*! And Tweeting with ambiguous phrasing that it could be perceived as a joke or not, that was a mistake.

    Making it obvious that it was a joke is hard! Depending on shared knowledge, a tweet can be seen differently. But I have to remember that things like this can be *dangerous* if it's not well understood. The second problem is the sockpuppeting. I have no excuse. Why did I even participate in the Internet Disaster Prevention Drill two weeks ago? Seriously.

    What *should* I have done? I shouldn’t have made edgy tweets! That's the same as, "don't get carried away". No more being careless! I must be mindful! If I am going to make those sorts of tweets, I need to post on HoloPlus, or other closed platforms. I really think I should've said something on a stream. If I had, only people who follow Achichi Mela would see it. But Twitter? It goes everywhere. People who don’t follow me, they may see it. *That's* why, stick to HoloPlus! Have you even installed it? I think it is an official SNS by Hololive.

    You can post things, post messages. I'm seriously thinking of using it as my sub-account. Now, it is important to remember I work for a company. I need to be more professional, and not carelessly slack off. I was just having fun! That's not okay! I need to be aware of what I am posting, but Twitter is so fun. It is like breathing. I should have gone to sleep without checking to see what people were saying.
