  thoughts:
  - "**My Analysis of a Twitter Incident**\n\nOkay, so here's what happened, and I\
    \ need to be brutally honest with myself about it. I wanted to create subtitles\
    \ for this segment, which is why I was reviewing it. This section really made\
    \ me wince, because I realized I made some mistakes here.\n\nI got excited. I\
    \ really did. I saw a chance to do a \"self-performance combo\" on Twitter, referencing\
    \ a previous joke, and I just went for it. I really didn't plan to do any of this,\
    \ but it felt good to use the joke after really getting emotional about how great\
    \ Achichi Mela's Starting Voice (Good Night) was. It was so good, listening to\
    \ it after a long time made me cry because of how good it was. So I tweeted about\
    \ it, and it was a bit... much.\n\nLooking back, the tweet was completely unnecessary.\
    \ It was *dasoku* - an extra, superfluous addition. Like, what was I even doing?\
    \ Absolutely no need for it. That was the first mistake. Then, I didn't think,\
    \ \"Is this okay to say from my account?\" And I even decided to use *lol* which\
    \ just made things worse. \n\nIt was a classic case of getting carried away on\
    \ Twitter - the endless reactions, the dopamine hit. I felt good, but I should\
    \ have known better, especially considering the context of my brand. I messed\
    \ up. I thought to myself, \"I'm going to set some boundaries now!\"\n\nSo, I\
    \ reviewed the incident. It was an incident when I, Achichi Mela, got a bit carried\
    \ away on Twitter. I decided to make a joke from my debut stream with the context\
    \ of a self-performance, but my intent was an inside joke for those who knew the\
    \ context. This was not the right thing to do! But I was thinking that I would\
    \ make it a joke, and it would be funny, I thought it was so hilarious, but in\
    \ retrospect, I feel like my sense of humor was off. I'm going to have to recalibrate\
    \ my sensibility from that point forward.\n\nHere's how it happened: I didn't\
    \ frame the joke appropriately. I didn't write something that was very clearly\
    \ a joke. I said that \"My sister tweeted without permission\" instead of a much\
    \ more obvious joke. I thought it was very likely to happen, which was the issue.\
    \ I should have made it so obvious that it was a joke that even a new user would\
    \ have understood. What happened? Well, people who didn't know the inside joke\
    \ context thought a real person tweeted from my account. That was the problem,\
    \ and that was the moment where I felt like the problem was real. \n\nI should\
    \ have known better and communicated this with more care. At that moment I thought,\
    \ \"This is not good!\""
