global_summary:
  overall_summary: In this livestream video, Hololive vtuber Achichi Mela (熱千めら) from
    the unit 'Asobi Mawaritai!' plays the psychological horror anomaly-hunting game
    'Platform 8' (8番のりば), the sequel to 'The Exit 8'. Throughout the stream, she chats
    about her PC setup, encounters various eerie train anomalies and jump scares while
    trying to maintain her cute character, gets sent back to the start a few times
    due to failed mechanics, successfully solves the station puzzles to reach the
    final exit, and wraps up with post-game reflections and scheduling announcements.
  chapters:
  - start: 00:00
    end: 05:00
    title: Opening Chat and PC Troubleshooting
    description: Mela opens the stream, discusses her PC performance and OBS settings
      adjustments after previous stream archive issues, and greets her viewers.
    song_title: null
    song_artist: null
  - start: 05:00
    end: '17:40'
    title: Game Introduction and Station 0 (Reizen)
    description: Mela introduces the horror game 'Platform 8' (8番のりば), explains her
      past experience with 'The Exit 8', and inspects the train ads at Station 0 (零山).
    song_title: null
    song_artist: null
  - start: '17:40'
    end: '35:00'
    title: Navigating Stations and Anomalies
    description: Mela progresses through early stations (Ichiagasaki, Ninozuka, Sanza,
      Shirakawa), encountering anomalies, creepy posters, light/dark movement mechanics,
      and jumpscares.
    song_title: null
    song_artist: null
  - start: '35:00'
    end: '49:20'
    title: First Run Reset and Mechanics Mastery
    description: After getting caught by a monster and being reset back to Station
      0, Mela adjusts her strategy, speeds through the stations, and tackles various
      vehicle anomalies.
    song_title: null
    song_artist: null
  - start: '49:20'
    end: '73:40'
    title: Second Run, Station Puzzle, and Final Escape
    description: Mela pushes through to Station 8, solves the 894 station puzzle,
      handles final anomaly encounters, and successfully reaches the ending exit and
      credits.
    song_title: null
    song_artist: null
  - start: '73:40'
