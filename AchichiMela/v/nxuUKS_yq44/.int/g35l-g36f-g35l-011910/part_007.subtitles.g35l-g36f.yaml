  - |-
    **A VTuber's Train of Thought: Navigating Platform 8 (8番のりば)**

    Right, so I'm playing *Platform 8*, and it seems I'm either stuck, just got reset, or am moving through train cars. Let's see... currently, the modality is video and audio, and I'm using my VTuber avatar, Achichi Mela. I just got through a scary car, I kept thinking I would be attacked, like in those panic stories, but thankfully, nothing. I made it to level 6! I'm doing well, right? Maybe this stream will only be an hour? *Muge*? What does that even mean? Oh, it says *Muge* (infinite)! Noja~!

    Oh, right, I'm starting to get that pain. The other AsoMawa members are probably feeling it too. Dance practice yesterday really did a number on my muscles, so I don't really want to use them too much. Eh? What was that?! Kyaa! Hey, stop it! Don't mess with me! What is your problem!? Seriously!

    Wait, 0... hm? Okay, wait, wait, wait. Reizen is here! What is this?! Did I get caught? Oh no! Why did I get caught? Did I die and reset? Oh, this stream might not end. Five hours, maybe? But I thought it would be only one hour. Eh? Ah, right, rewind... rewind... Okay, I have to explain myself. I need you all to listen, alright?

    Okay, so I got this game. In *Exit 8*, you look for anomalies and turn back. With this game, *Platform 8*, you don't need to turn back, you just go forward. No problem, just go forward! Easy, right? And there's some kind of spot-the-difference thing, right? And if there isn't an anomaly, it tells you there is with a yellow paper, right? So if there isn't yellow paper, I thought I could go on. Ok, let's keep going.

    Okay, 0... Reizen. The electronic sign... was it there? Uwa! I didn't check! Huh? I did. It said 'Muge'. Did it say more? Hmm... I see, okay, okay. Time to go again. Reizen zero. Right! Yes, I got it. Let's do this! *Noja~!*

    Right, Reizen Zero. Hm, hm, hm. Tutorial time! Okay, let's keep moving. Yoisho, yoisho, yoisho... Ah! Ugh... What do I do? Does it disappear if I look? Kyaa! No, no, it's getting closer! Look at the electronic sign! Give me some guidance!
