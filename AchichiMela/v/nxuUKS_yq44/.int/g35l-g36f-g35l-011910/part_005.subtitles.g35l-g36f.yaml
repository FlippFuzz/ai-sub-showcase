    the unit 'Asobi Mawaritai!' plays the psychological horror anomaly-hunting game
    'Platform 8' (8番のりば), the sequel to 'The Exit 8'. Throughout the stream, she chats
    about her PC setup, encounters various eerie train anomalies and jump scares while
    trying to maintain her cute character, gets sent back to the start a few times
    due to failed mechanics, successfully solves the station puzzles to reach the
    final exit, and wraps up with post-game reflections and scheduling announcements.
