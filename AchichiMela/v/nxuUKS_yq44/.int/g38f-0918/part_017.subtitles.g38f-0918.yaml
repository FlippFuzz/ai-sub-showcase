  thoughts: |+
    **Aochi Chia's Minecraft Misadventures and Future Gaming Plans**

    Okay, here's the deal: I was thinking about this clip from Aochichi Meia's stream – and I've got a lot of thoughts. I wanted to make some subtitles. First, I had to figure out who she was!  At first I thought maybe a Hololive DEV_IS member, but then I remembered it's Meia, @aochichimeia. Wait, I see her, she has ghost flames, horns, and a talisman! That confirms it!

    So, the clip started with her recounting a gaming session with a friend. Apparently, I was absolutely terrible at whatever game they were playing - so bad that they jokingly said they would knock me out before the enemies could!  I was so campy! It was Minecraft, by the way. And I was really bad at that game.

    Even now, I'm working on getting better. I mean, I practiced with GeoGuessr before I debuted, so maybe that helped a little? Lately I have been more successful when I'm playing games, I hope I have.

    Someone mentioned that, I'm kind of hesitant in most games. Before I'd be scared, camp, and never advance. But now, it's getting better! But it was always a matter of, "Is there an enemy? Is there an enemy?" But now I'm playing better! And I'm getting more skilled. So, eventually, I will be able to try more controls!

    I remember someone in chat, Kyoko, said she never played Minecraft. I do wonder if Kyoko from Asobimawaritai played Minecraft yet? I'm gonna ask her to play together! But I'll need to double check with her about that. She's played so many games! I really want to try Minecraft!

    In the future, I plan to get the next week's schedule for everyone. Make sure to come see me! I also saw someone mention Minecraft. Maybe I'll play again. Maybe I will play it sometime! And if you are watching the archive, thank you as always! I'll see you next time! By the way, tomorrow I'll be playing Kuukiyomi 2!


