    and heartfelt gratitude to her fan community ('メラ組') for their superchats and
    support, playfully teases a face reveal/mask removal, and delivers energetic karaoke
    performances of 'め組のひと', *Luna's 'アトラクトライト', the Re:Zero character song 'Wishing',
    and Hololive's anthem 'Shiny Smily Story', while reflecting on her VTuber journey.
