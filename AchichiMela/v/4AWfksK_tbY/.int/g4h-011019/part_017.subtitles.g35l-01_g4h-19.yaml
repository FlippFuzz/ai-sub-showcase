  thoughts:
  - |-
    **A Lucky Streak and Celebrations**

    Okay, so let's break this down. First, I'm analyzing this video segment, taking a good look at what's happening with Mela and the others – Sorashina Sopia, Suzuna Tsuzuri, Anya Melfissa, Kaela Kovalskia, Hyakuto Kyoko, Oozora Subaru, everyone. No singing here, just good old conversation, so that musical performance thing is empty, as expected.

    I hear something about "Quinella Place?", then some numbers, "1 and 8." "Did I win?" I ask, not sure if I actually won or not, let's see. "I don't know which ones won, so let's put them in and check, everyone," I say. Alright, let's go. "Here we go."  I am clicking buttons. Zero yen on the first try. "This one is 0 yen. It says it lost." "This one lost." How about this one? "This one lost too!" "How about this?" "This one..." This one's looking good, maybe? "Is this a winner?" "So the Win bet hit!" I got one! And then... this Win bet isn't so good. "...not a winner." And then...Wait, I think something hit! "Huh? Wait, didn't something hit on this?" "The Quinella Place won!" Oh yeah, this one too! "That Quinella Place won, and..." "This Quinella Place too..." "Oh, awesome! I think I won a bunch of them!" I am excited and keep getting it. "Didn't we win a whole lot, everyone?!"  Wow! Whoa! "Wait, I got 580,000 yen!" "Isn't that pretty amazing?!"  I have to find everyone. "Where is everyone?" "Hey, Tsuzuri, Tsuzuri listen! Oh, Tsuzuri, did you win?" I'm looking for Tsuzuri. "Tsuzuri, did you win?" "I'm up to 580,000!" "How about you?" "How about you?" "You, you, how about you?" Tsuzuri's not responding. "Huh?" She's got skewers in her mouth! "You've got it in your mouth! Tsuzuri, did you win?"  "Tsuzuri with skewers in your mouth, did you win?" "Did you win with that in your mouth?" "How'd it go, how'd it go?"  She didn't win, I think. Tsuzuri said she didn't win. I did though! "Nojaa! Wait, isn't this super amazing?!" "Sopia, I came to flex on you!" She's saying she won too! "Whoa! 340,000?!" "Sopia came here to flex!" Mela says "Wait, I won 580,000 yen!" "Huh, well Sopia got 340,000 back too, you know?" "Yeah, I got 580,000 back."  I'm excited! "As expected, the good-fortune rep is strong after all." "Hey, but Sopia got 340,000 back too, y'know?" "Yeah, I got 580,000 back." "Anya-senpai!" I have yakitori for Anya. "I bought yakitori for you, Anya-senpai!" "Anya-senpai!" "Probably that's what Melacchi... Melacchi..." "Noja! Did you pick it up?" "Oh, really, did I?" I can't drop this! "How do you drop it? How do you drop it?" Q, Q, Q, Q! "Where are you doing it?" "Noja!" "By the way, here you go, Anya." "Don't do that to your kouhai!"  What?! "Why you hitting your kouhai?!" "Because I'm sad!" "What?!" "Did you lose, Anya-san?" Anya says, "I'm sad!" Kaela says, "Then lost you, then lost?" "Total loss?!" "Nojaa!" "Sorry about the total loss, nojaa!" "As expected, the good-fortune rep won it all! A dead-serious good-fortune rep!" "Wait, Mela, did you win big?" "I won 580,000, you know." "Nojaa!" "Hey, Sopia..." "Nojaa!" "Nojaa!" "How much did you win?" "Hey, look, I won! 340,000!"
