  domain_glossary:
  - term: ホロ1GP (#ホロ1GP)
    meaning: Hololive's official Minecraft horse racing tournament organized and hosted
      by Takane Lui.
  - term: ドパマンダー
    meaning: Mela Atsuchi's self-proclaimed nickname during the gambling event, combining
      'dopamine' and 'Salamander'.
  - term: パドック
    meaning: Pre-race exhibition area where horses walk so players can inspect their
      physical condition and coat shininess.
  - term: 単勝
    meaning: 'Win bet: wagering on a specific horse to finish 1st.'
  - term: 複勝
    meaning: 'Place bet: wagering on a horse to finish within the top 3.'
  - term: ワイド
    meaning: 'Quinella Place: wagering on two horses that will both finish within
      the top 3 (order independent).'
  - term: 馬連
    meaning: 'Quinella: wagering on the two horses that will finish 1st and 2nd (order
      independent).'
  - term: 3連複
    meaning: 'Trio: wagering on three horses that will finish in the top 3 (order
      independent).'
  - term: 3連単
    meaning: 'Trifecta: wagering on the exact 1st, 2nd, and 3rd place finishers in
      exact order.'
  - term: オッズ
    meaning: Odds / payout multipliers determined partly by viewer polls on Holoplus.
  - term: アソビ☆まわり隊！
    meaning: Hololive talent unit/sub-brand featuring Mela Atsuchi and other members.
