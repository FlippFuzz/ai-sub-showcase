    title: Award Ceremony & Closing Reflections
    description: 'Announcement of #ホロ1GP award winners, including accuracy awards,
      top payout ''Dopa'' awards, carrot collection awards, and overall champion Sorashina
      Sopia. Mela shares her humorous reflections on the agony of gambling.'
