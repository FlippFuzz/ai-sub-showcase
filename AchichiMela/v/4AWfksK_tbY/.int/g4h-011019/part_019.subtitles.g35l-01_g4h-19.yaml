    title: 'Race 2: Long-Distance Strategy & Paddock Analysis'
    description: Participants prepare for the 3000m long-distance second race by consulting
      prediction guests, analyzing stamina requirements, placing bets, and watching
      the race unfold with dramatic financial swings.
    song_title: null
    song_artist: null
  - start: '92:00'
    end: 01:00
    title: 'Minigame: Golden Carrot Collection'
    description: Between races, participants take part in a carrot-collecting minigame
      where they gather golden and green carrots while avoiding exploding red carrots
      to earn bonus funds.
    song_title: null
    song_artist: null
  - start: 01:00
    end: '24:00'
    title: 'Race 3: Expert Predictions & High-Risk Betting'
    description: Tsunomaki Watame acts as the race predictor for Race 3. Mela struggles
      with her betting choices, goes for high-risk trifecta/wide bets, and suffers
      heavy losses after a tense race.
    song_title: null
    song_artist: null
  - start: '24:00'
    end: '82:00'
    title: 'Race 4: Technical Hurdles, Final All-In & Climax'
    description: Ahead of the final 3000m race, Mela suffers temporary technical disconnection
      issues, rushes to place all-in bets, and watches in despair as most participants
      lose everything in a chaotic finish.
    song_title: null
    song_artist: null
  - start: '82:00'
