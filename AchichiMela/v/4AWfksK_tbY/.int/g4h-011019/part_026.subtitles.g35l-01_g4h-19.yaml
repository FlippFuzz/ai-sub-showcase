    song_artist: null
  - start: '92:00'
    end: 01:00
    title: 'Minigame: Golden Carrot Collection'
    description: Between races, participants take part in a carrot-collecting minigame
      where they gather golden and green carrots while avoiding exploding red carrots
      to earn bonus funds.
    song_title: null
    song_artist: null
  - start: 01:00
