    end: '52:00'
    title: 'Race 1: Paddock Inspection, Betting & First Race'
    description: Mela purchases race newspapers, explores the venue, checks out the
      paddock horses, places her initial bets, and watches the thrilling first race
      with professional commentary, securing a modest payout.
    song_title: null
    song_artist: null
  - start: '52:00'
