    end: 05:00
    title: Stream Introduction & Arrival at the Racecourse
    description: 'Mela starts her stream with her signature ''noja'' greeting, arrives
      at the custom Minecraft horse racing track created in cooperation with Duzuru-sha
      for #ホロ1GP, and greets fellow Hololive members.'
    song_title: null
    song_artist: null
  - start: 05:00
    end: '16:30'
    title: Rules Briefing & Event Overview
    description: 'Host Takane Lui explains the rules of #ホロ1GP: four races (two turf,
      two dirt), 100,000 yen starting funds per race, six betting types, viewer-voted
      odds via Holoplus, and guest professional race commentator Suzuki Tsutomu.'
    song_title: null
    song_artist: null
  - start: '16:30'
    end: '52:00'
    title: 'Race 1: Paddock Inspection, Betting & First Race'
    description: Mela purchases race newspapers, explores the venue, checks out the
      paddock horses, places her initial bets, and watches the thrilling first race
      with professional commentary, securing a modest payout.
    song_title: null
    song_artist: null
  - start: '52:00'
