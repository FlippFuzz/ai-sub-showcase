    original: 20円しかない...
    english: I only have 20 yen left...
  - start: '02:45.000'
    end: '02:46.800'
    original: 20円あれば十分じゃろ！
    english: 20 yen is plenty!
  - start: '02:48.500'
    end: '02:50.250'
    original: のじゃー！
    english: Nojaaa!
  - start: '02:51.000'
    end: '02:54.900'
    original: もう...もう無理だ。
    english: I... I can't anymore.
  - start: '02:56.800'
    end: '02:58.200'
    original: 引退だ。
    english: I'm retiring.
  - start: '02:58.300'
    end: '02:59.750'
    original: ご利益どうだった？
    english: How was your good fortune?
  - start: '02:59.750'
    end: '03:02.650'
    original: もう引退...いやもうないです。ご利益なんてないです、この世に。
    english: I'm retiring... No, there's none left. There's no such thing as good
      fortune in this world.
  - start: '03:03.200'
    end: '03:05.700'
    original: それお前が一番言っちゃダメだろ！
    english: You're the last person who should be saying that!
  - start: '03:05.750'
    end: '03:07.800'
    original: もう、0円ですのじゃ。
    english: I'm at 0 yen now.
  - start: '03:08.650'
    end: '03:10.500'
    original: もう、競馬向いてないのじゃ。
    english: I'm just not cut out for horse racing.
  - start: '03:11.000'
    end: '03:15.400'
    original: やっぱさ、信じるはご利益じゃなくて、そぴあのように数字なんじゃないか？
    english: Maybe what we should believe in isn't good fortune, but numbers like
      Sopia?
  - start: '03:15.450'
    end: '03:17.250'
    original: え、そぴあそれで勝ったんですか？
    english: Wait, did Sopia win with that?
  - start: '03:17.300'
    end: '03:19.850'
    original: いやなんか分かんないけど、そぴあむっちゃ勝ってそうだったよ。
    english: Well, I don't know for sure, but Sopia looked like she was winning big.
  - start: '03:19.900'
    end: '03:20.450'
    original: え？！
    english: Huh?!
  - start: '03:20.600'
    end: '03:21.500'
    original: 聞いてみ。
    english: Go ask her.
  - start: '03:21.300'
    end: '03:22.250'
    original: 聞いてみるか。
    english: Let's ask her.
  - start: '03:22.400'
    end: '03:25.900'
    original: そぴあー！そぴあいる？そぴあー！
    english: Sopiaaa! Is Sopia here? Sopiaaa!
  - start: '03:27.500'
    end: '03:29.850'
    original: そぴあー！いくら勝った？
    english: Sopiaaa! How much did you win?
  - start: '03:29.900'
    end: '03:31.200'
    original: 70万！
    english: 700,000!
  - start: '03:31.250'
    end: '03:33.300'
    original: はあ？！70万？！
    english: Huh?! 700,000?!
  - start: '03:33.350'
    end: '03:35.300'
    original: そぴあめっちゃ勝ってるやん！
    english: Sopia, you're winning huge!
  - start: '03:39.000'
    end: '03:41.900'
    original: そぴあ！サイエンスメソッド買えばよかった！
    english: Sopia! I should've bought into the Science Method!
  - start: '03:42.500'
    end: '03:43.800'
    original: でしょ？
    english: Right?
  - start: '03:43.900'
    end: '03:46.350'
    original: サイエンスメソッド買えばよかった...
    english: I should've bought into the Science Method...
  - start: '03:49.500'
    end: '03:51.950'
    original: 馬とどっちが早いかやのじゃ。
    english: It's a race against the horse.
  - start: '03:52.000'
    end: '03:55.500'
    original: ごめんね。サイエンスメソッド冷笑してごめんね。
    english: I'm sorry. I'm sorry for scoffing at the Science Method.
  - start: '03:56.800'
    end: '03:58.650'
    original: 信じなくてごめんのじゃ。
    english: I'm sorry for not believing in it.
  - start: '03:58.700'
    end: '03:59.950'
    original: いいよー。
    english: It's okay!
  - start: '04:01.700'
    end: '04:05.350'
    original: いつでもご利益とサイエンスで組んで...
    english: Anytime, if good fortune and science team up...
  - start: '04:05.350'
    end: '04:06.800'
    original: のじゃー！
    english: Nojaaa!
  - start: '04:06.900'
    end: '04:09.100'
    original: 2人が組めば最強やから！
    english: If the two of us team up, we'll be unstoppable!
  - start: '04:09.150'
    end: '04:10.300'
    original: 確かに！
    english: True!
  - start: '04:10.900'
    end: '04:14.700'
    original: いやー最後、最後持ってくのすごいなー。
    english: Man, taking it all at the very end like that is amazing.
  - start: '04:16.800'
    end: '04:19.000'
    original: すごいのじゃー！
    english: That's amazing!
  - start: '04:20.450'
    end: '04:24.300'
    original: いやー、なんかそぴあのサイエンスメソッドを信じてなかった、正直。
    english: Honestly, I didn't really believe in Sopia's Science Method.
  - start: '04:24.400'
    end: '04:29.100'
    original: だってなんか、あの、言ってさ、言ってさ...
    english: Because, well, you know, even if she talked about it...
  - start: '04:29.500'
    end: '04:33.250'
    original: それでお金を稼ぐだけだと思ってたけど...
    english: I thought that was just how it went, but...
  - start: '04:33.300'
    end: '04:35.950'
    original: そぴあ稼いでんのか。
    english: Sopia really made bank, huh.
  - start: '04:37.550'
    end: '04:38.900'
    original: あー...
    english: Ahh...
  - start: '04:40.500'
    end: '04:44.450'
    original: 過程なんてどうでもいいのじゃ。途中でいくら稼いだって意味ねえのじゃ。
    english: The process doesn't matter at all. No matter how much you make along
      the way, it means nothing.
  - start: '04:44.550'
    end: '04:49.550'
    original: いくら稼いだって、最後に0円だったら0円なのじゃ。
    english: No matter how much you earn, if you end up with 0 yen at the end, it's
      0 yen.
  - start: '04:50.900'
    end: '04:54.750'
    original: マウントとか取らない方がいいのじゃ。最後に負ける可能性があるから。
    english: It's better not to brag or gloat. Because there's always a chance you'll
      lose at the end.
  - start: '04:54.850'
    end: '05:01.050'
    original: 最後に負けた人がマウンティングしてるなんて、なんて恥ずかしい話。情けないのじゃ。
    english: Someone who loses at the end after bragging... how embarrassing. How
      pathetic.
  - start: '05:01.100'
    end: '05:04.800'
    original: それなら最初から慎ましく生きていればよかったもの...
    english: If that's how it ends, it would've been better to live modestly from
      the start...
