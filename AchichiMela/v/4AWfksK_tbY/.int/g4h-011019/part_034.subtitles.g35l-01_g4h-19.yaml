global_summary:
  overall_summary: 'In this 3.25-hour stream, Hololive talent Mela Atsuchi participates
    in the massive Minecraft horse racing tournament #ホロ1GP organized by Takane Lui.
    Playing as her self-proclaimed ''Dopamander'' persona, Mela experiences the intense
    emotional rollercoaster of sports betting, navigating four races (two turf, two
    dirt) with varying distances, paddock inspections, expert predictions, and a carrot-collecting
    minigame. Despite starting with high enthusiasm and occasional big wins, she ultimately
    falls victim to high-risk betting strategies and heavy losses, reflecting hilariously
    on the dangers of gambling while fellow participant Sorashina Sopia claims overall
    victory using a scientific betting method.'
  chapters:
  - start: 00:00
    end: 05:00
    title: Stream Introduction & Arrival at the Racecourse
    description: 'Mela starts her stream with her signature ''noja'' greeting, arrives
      at the custom Minecraft horse racing track created in cooperation with Duzuru-sha
      for #ホロ1GP, and greets fellow Hololive members.'
    song_title: null
    song_artist: null
  - start: 05:00
    end: '16:30'
    title: Rules Briefing & Event Overview
    description: 'Host Takane Lui explains the rules of #ホロ1GP: four races (two turf,
      two dirt), 100,000 yen starting funds per race, six betting types, viewer-voted
      odds via Holoplus, and guest professional race commentator Suzuki Tsutomu.'
    song_title: null
    song_artist: null
  - start: '16:30'
    end: '52:00'
    title: 'Race 1: Paddock Inspection, Betting & First Race'
    description: Mela purchases race newspapers, explores the venue, checks out the
      paddock horses, places her initial bets, and watches the thrilling first race
      with professional commentary, securing a modest payout.
    song_title: null
    song_artist: null
  - start: '52:00'
    end: '92:00'
    title: 'Race 2: Long-Distance Strategy & Paddock Analysis'
    description: Participants prepare for the 3000m long-distance second race by consulting
      prediction guests, analyzing stamina requirements, placing bets, and watching
      the race unfold with dramatic financial swings.
    song_title: null
    song_artist: null
  - start: '92:00'
    end: 01:00
    title: 'Minigame: Golden Carrot Collection'
    description: Between races, participants take part in a carrot-collecting minigame
      where they gather golden and green carrots while avoiding exploding red carrots
      to earn bonus funds.
    song_title: null
    song_artist: null
  - start: 01:00
    end: '24:00'
    title: 'Race 3: Expert Predictions & High-Risk Betting'
    description: Tsunomaki Watame acts as the race predictor for Race 3. Mela struggles
      with her betting choices, goes for high-risk trifecta/wide bets, and suffers
      heavy losses after a tense race.
    song_title: null
    song_artist: null
  - start: '24:00'
    end: '82:00'
    title: 'Race 4: Technical Hurdles, Final All-In & Climax'
    description: Ahead of the final 3000m race, Mela suffers temporary technical disconnection
      issues, rushes to place all-in bets, and watches in despair as most participants
      lose everything in a chaotic finish.
    song_title: null
    song_artist: null
  - start: '82:00'
    end: '96:00'
    title: Award Ceremony & Closing Reflections
    description: 'Announcement of #ホロ1GP award winners, including accuracy awards,
      top payout ''Dopa'' awards, carrot collection awards, and overall champion Sorashina
      Sopia. Mela shares her humorous reflections on the agony of gambling.'
