  - start: '04:31.500'
    end: '04:35.500'
    original: ちょパドック見る前はこれ。うん。見る前はこれじゃけど。
    english: That's my pick before seeing the paddock. Yeah. Before seeing it, anyway,
      noja.
  - start: '04:35.500'
    end: '04:41.500'
    original: ちょパドック見に行くか。なんかさっきの、ちょぼたん先輩の盗み聞きしてた…
    english: Let's go check out the paddock. From eavesdropping on Botan-senpai earlier...
  - start: '04:41.500'
    end: '04:49.500'
    original: さっき3連単当てたぼたん先輩を盗み聞きしてる感じ、やっぱパドックが大事らしいから、それを見て…
