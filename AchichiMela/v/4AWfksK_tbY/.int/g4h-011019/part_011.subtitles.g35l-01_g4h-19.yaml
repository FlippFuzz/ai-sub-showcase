  - start: '03:37.000'
    end: '03:39.200'
    original: それはちょっとわかんないかなあ！
    english: I'm not too sure about that one!
  - start: '03:39.000'
    end: '03:41.200'
    original: もじゃあー！またねー！
    english: Mojaaa! See ya!
  - start: '03:41.500'
    end: '03:44.800'
    original: 都合悪くなるとわーって逃げるんだよな、そぴあ。なるほど。
