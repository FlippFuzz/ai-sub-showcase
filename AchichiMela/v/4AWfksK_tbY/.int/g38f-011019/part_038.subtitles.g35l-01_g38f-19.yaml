    \ 00:20.500 - 00:27.500.\n\nEven in a virtual environment, the stress was real.\
    \  00:23.200 - 00:32.000. I was questioning everything, 00:38.200 - 00:44.800,\
    \ and it became evident, this experience was enough to tell me something important.\
    \ 00:46.000 - 00:55.700.\n\nI genuinely enjoyed the stream and the event itself,\
    \ and of course, I can see how winning would be a blast, 00:49.000 - 01:03.500.\
    \ However, the feeling of losing was just too painful. 00:56.000 - 01:03.500 It\
    \ was a visceral reaction, my body was giving me very clear signals: this isn't\
    \ for me, especially if it was real money. 01:03.800 - 01:11.800\n\nMy role is\
    \ supposed to be about, you know, blessings. 01:12.500 - 01:28.500 I don't provide\
    \ that kind of blessing. 01:25.800 - 01:30.800. I can't be getting involved in\
    \ anything that is so directly the opposite of that. \n\nDreams, for me, aren't\
