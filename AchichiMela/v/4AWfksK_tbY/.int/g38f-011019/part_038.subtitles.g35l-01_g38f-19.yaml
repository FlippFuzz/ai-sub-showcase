    \ scheme. 01:46.000 - 01:58.800.\n\nWhile the experience was enjoyable, 02:05.500\
    \ - 02:18.500 I can see the downside. 02:19.300 - 02:24.000.  I would have probably\
    \ said something very different if I won. 02:26.500 - 02:37.000.\n\nI did start\
