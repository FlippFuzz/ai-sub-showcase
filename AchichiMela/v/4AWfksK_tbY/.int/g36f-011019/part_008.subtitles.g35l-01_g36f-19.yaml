      six betting types, and the professional live commentary by Suzuki Tsutomu.
    song_title: null
    song_artist: null
  - start: 00:16:15
    end: 00:48:00
    title: 'Race 1: Preparation, Betting & Inaugural Race'
    description: Mela explores the racecourse facilities, buys race newspapers, chats
