      paddock, places her bets, and watches the thrilling first race.
    song_title: null
    song_artist: null
  - start: 00:48:00
    end: 01:24:00
    title: 'Race 2: Paddock Inspection & Second Race'
    description: Preparation for the second race includes consulting tipsters like
      Omaru Polka, inspecting horse conditions in the paddock, experimenting with
      different betting combinations, and experiencing moderate success.
    song_title: null
    song_artist: null
  - start: 01:24:00
    end: 01:50:00
    title: 'Minigame & Race 3: Golden Carrot Catching & Third Race'
    description: Participants play a minigame catching golden carrots to earn extra
      funds. Mela prepares for the third race, consults Tsunomaki Watame's predictions,
      and experiences severe gambling anxiety.
    song_title: null
    song_artist: null
  - start: 01:50:00
    end: 02:11:42
    title: Race 4, Awards Ceremony & Sign-off
    description: The final race features an all-in gamble that results in a tragic
      zero-yen outcome. The stream concludes with awards for top accuracy, biggest
      payouts, and overall champion Sorashina Sopia, followed by group photos and
      closing remarks.
    song_title: null
    song_artist: null
