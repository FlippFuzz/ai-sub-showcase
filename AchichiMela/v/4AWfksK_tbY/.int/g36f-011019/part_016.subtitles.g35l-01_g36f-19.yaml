  - term: パドック (Paddock)
    meaning: The enclosure where horses are paraded before a race for participants
      to inspect their physical condition and visual cues.
  - term: 単勝 (Tanshō)
    meaning: Win bet; predicting the single horse that will finish 1st.
  - term: 複勝 (Fukushō)
    meaning: Place bet; predicting if a chosen horse finishes within the top 3.
  - term: ワイド (Wide)
    meaning: Quinella place bet; predicting two horses that both finish within the
      top 3 regardless of order.
  - term: 馬連 (Umalen)
    meaning: Quinella; predicting the exact two horses that finish 1st and 2nd regardless
      of order.
  - term: 3連複 (Sanrenpuku)
    meaning: Trio; predicting the three horses that finish 1st, 2nd, and 3rd regardless
      of order.
  - term: 3連単 (Sanrentan)
    meaning: Trifecta; predicting the exact 1st, 2nd, and 3rd place horses in exact
      order.
  - term: ドズル社 (Duzuru-sha)
    meaning: Minecraft creator group that designed and built the professional racecourse
      venue.
  - term: ホロプラス (HoloPlus)
    meaning: Official Hololive fan community app used in the event for viewer surveys
      to determine race odds.
