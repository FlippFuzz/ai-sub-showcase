  - term: パドック
    meaning: The pre-race inspection area where participants examine horse conditions,
      coat sheen, and motivation.
  - term: 単勝
    meaning: A bet predicting the exact 1st place horse.
  - term: 複勝
    meaning: A bet predicting a horse will finish in the top 3.
  - term: ワイド
    meaning: A bet predicting two horses that both finish in the top 3 (any order).
  - term: 馬連
    meaning: A bet predicting two horses that finish 1st and 2nd (any order).
  - term: 三連複
    meaning: A bet predicting three horses that finish in the top 3 (any order).
  - term: 三連単
    meaning: A bet predicting the exact 1st, 2nd, and 3rd place horses in exact order.
  - term: ドパる / ドパマンダー
    meaning: Slang for experiencing a massive dopamine rush from gambling thrills
      or big wins.
