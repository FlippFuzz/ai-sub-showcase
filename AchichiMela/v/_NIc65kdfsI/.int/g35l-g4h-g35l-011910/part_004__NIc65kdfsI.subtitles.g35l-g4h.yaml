global_summary:
  overall_summary: In this livestream on the Mela Ch. channel, Hololive VTuber Netsuchi
    Mela hosts a music-focused singing stream ('song geek's singing stream') featuring
    a carefully curated setlist of anime theme songs, character songs, and high-energy
    Vocaloid tracks. Between performances, Mela shares lighthearted personal anecdotes—such
    as recovering from her very first hangover after drinking 1.5 cans of Horoyoi—and
    dives deep into her extensive music otaku lore, discussing her admiration for
    composers like ZAQ and Nilfruits, her passion for character songs, and her future
    dreams of commissioning custom original tracks from her favorite music creators.
