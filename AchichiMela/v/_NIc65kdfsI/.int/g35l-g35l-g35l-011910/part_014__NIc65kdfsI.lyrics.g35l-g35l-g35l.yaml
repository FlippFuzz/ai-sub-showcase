    tracks, anime songs, and character songs, while also amusingly recounting her
    first experience with a drinking stream the day before and dealing with a mild
    hangover. Throughout the stream, she performs a curated setlist of energetic and
    beloved tracks including Minami's '空気をめくって', PinocchioP's 'サイバーパンクデッドボーイ', Maaya
    Uchida's 'Across the Line', n-buna's 'メリュー', Nilfruits' 'アノニマスファンファーレ', Symphogear's
    '殲琴・ダウルダブラ', Valkyrie Drive's 'スーパーウルトラハイパーミラクルロマンチック', and 164's '天ノ弱', sharing
    her deep music otaku insights and behind-the-scenes thoughts on composers and
    anime.
