global_summary:
  overall_summary: 'In this karaoke live stream titled ''楽曲オタクの歌枠なのじゃ！'', hololive
    talent Achichi Mela shares her passion for vocaloid tracks, anime character songs,
    and high-energy music. Opening with a humorous recounting of her mild hangover
    after drinking 1.5 cans of Horoyoi on a previous stream, Mela dives into a carefully
    curated setlist of beloved tracks. Her setlist includes ''Kawaki o Ameku'' by
    Minami, ''Cyberpunk Dead Boy'' by Maiki-P, ''-Across the line-'' by Rikka Takanashi
    (CV: Maaya Uchida), ''Meryu'' by Nuyuri, ''Anonymous Fanfare'' by Tsumiki, ''Zankyou
    Daurdaebra'' by Carol Malus Dienheim (CV: Inori Minase), ''Super Ultra Hyper Miracle
    Romantic'' by Karasuya Sabou, and ''Amanojaku'' by 164. Throughout the stream,
    she enthusiastically shares her music otaku background, how she discovers anime
    through songs, and her future dreams of commissioning original music from her
    favorite creators.'
