loid lately. My bad! 'Cyberpunk Dead Boy', I suppose that is... I apologize. So I thought I will prepare to sing n-buna-san's 'Meryuu'. n-buna-san is the one who makes the songs for Yorushika, right? The artist behind the Vocaloid songs, before Yorushika. So yeah. I'm going to sing it!  Are you not familiar with this one? This singing stream, I usually prepare a setlist with songs that everyone would know, but today I put together a list. I was going to say 'leak'... It's like I'm having a leak. Oh, right! *I* just really wanted to sing, so I put together a list that's mostly for *me*. And then... I really love singing this."
