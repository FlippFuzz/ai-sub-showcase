  thoughts:
  - |-
    **Segment Analysis: Karaoke Night with "Cyberpunk Dead Boy"**

    Okay, so here's the deal: I was planning a fun karaoke session, you know? Just vibing, trying to make the setlist perfect. Got this whole "singing part clipping is prohibited" thing going on, which, whatever. Trying to adjust the text on screen, changing fonts and colors… then I'm thinking, hey, why not make this Cyberpunk Dead Boy work? It's マイキP, right? I am a master of Project Sekai, so no big deal. The screen pops up with the robotic intro… “Your music is not currently in use. Please rewrite it once more." Seriously?! "What the hell does that even mean?!" The track starts and I realize I'm supposed to be singing this song I hadn’t planned to sing... I start doing the karaoke, but I am in a pickle!

    I managed to sort the setlist, matching colors and all, right? So, I get started. I got my game face on but I am a bit off the rails, singing and laughing. I was hoping to cut all of the chit-chatting out of the clip, I think… I turn off the BGM, add some echo to the mic. Okay, okay, no, no, I am not drunk. I keep saying it. I am not drunk! Usually, I'd be three or four songs in by now. This is a mess!

    So, the song kicks in. The robot voice, the lyrics: "The music you have composed is not currently in use. Please rewrite it once more." Damn, I’m just singing. "Makes no damn sense!" The song kicks in, and I start singing: it’s all just fashion, right? No one’s ejected from the game. I film some TikTok, posing like an amateur. I guess I’m singing. What a jam, good night. No matter what, it's jammed full of lost souls. Gen Z wants it too. So what about a panty shot? Who cares about the meaning either way? I want a beat I can vibe to. Come on, let’s all laugh together! Numbers over art, is that it? A terrible price to pay for going viral. What am I even doing? Was that really fine? My head spins in circles, rotting away. Don't mess with me, bye-bye viral melody. Doubt it, it’s mostly full of lies anyway. Don't disguise yourself, whether an illusion or an ideal, it’s fine. What happened to what I really wanted to sing? Even if it's unsightly, that's alright, it's no lie. Okay, okay, just sing it. I sing.

    "Help, help... okay, I think I got it. You see, this part is the best part of the song! The ‘te-te’ part! Seriously cool! Oh, thank you!" Chorus goes, "Your music is not currently in use. Please listen to pop songs and hit songs, and rewrite it once more." Ugh, those smug highbrow faces are so annoying! Makes no damn sense! No matter what or how you look at it, it’s jammed full of lost souls. Gen Z wants it too. Let’s get a panty shot; who cares about the meaning either way? Give me something that goes viral. Come on, exorcise it! It’s all about numbers over art, is that it? What am I even doing? My head spins in circles, rotting away.

    Ok, now, I get into the real verses. The robot's back, "Your music is not currently in use. Please listen to pop songs and hit songs, and rewrite it once more." Now for chorus number 2. The music starts, and I start screaming "Don't mess with me, bye-bye viral melody. Doubt it, it's mostly full of lies anyway. Don't disguise yourself, whether an illusion or an ideal, it’s fine. What happened to what you really wanted to sing? There's no way it can end like this. What I want definitely isn't money. Don't give up! Wake up, children! There's definitely a song that you wanted to sing! Don't mess with me!" The song ends at 05:00. Makes no damn sense!
