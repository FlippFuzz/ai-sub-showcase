global_summary:
  overall_summary: This is a karaoke and chat stream by hololive VTuber Achichi Mela
    (熱千めら) titled '楽曲オタクの歌枠なのじゃ！'. Mela starts the stream recovering from a hangover
    after her first drinking stream with Hyakuto Kyoko. Throughout the 96-minute broadcast,
    she performs a curated setlist of songs focusing heavily on Vocaloid, anime songs,
    and character songs, while passionately nerding out about her favorite composers,
    music discovery origins (such as ZAQ and Maaya Uchida), and her dreams of commissioning
    original songs. Songs performed include 'Kyu-kurarin', 'Cyberpunk Dead Boy', 'Across
    The Line', 'Mayday', 'Anonymous Fanfare', 'Senkin Daur da Bláo', 'Super Ultra
    Hyper Miracle Romantic', and 'Amanojaku'.
