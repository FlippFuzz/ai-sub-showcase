    *   **Chapter 5: (35:50 - 46:46)** A detailed discussion about the opening animation. Apparently, it took her two weeks to create the opening in Ibispaint. Mela expresses some insecurities, feeling that the others in ASOBI★MAWARI-TAI are very talented (Sopia, Tsuduri, etc.).

