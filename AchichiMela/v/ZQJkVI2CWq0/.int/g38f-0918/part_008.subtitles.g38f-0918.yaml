  thoughts: |+
    **A Deep Dive into the Convenience Store's Dark Side**

    Okay, here's the deal, I'm watching this VTuber stream, and it looks like *another* Chilla's Art game. Let's start with the immediate scene: "Nanka bideo...bideo ga arimasu no ja." ...It's a videotape. "Terebi miru kanji ka?" ...Should I watch it? Then, *bam*, a loud noise! "Nan no oto?!" ...What was *that*?! Okay, okay, probably a mistake. This sound... is it clipping? No, this room is dark! I'm already getting scared! "Cho, kowaku natte kita, ku... heya kurai no ja." It's almost too dark. Let's see... let's brighten the screen... or... well... I’ll avert my eyes for a moment. Right, let's calm down, drink some water. Jump scares, ugh, so unfair. "Bikkuri shita no ja." ...Yeah, I jumped. "Fuu..." I need to breathe. Hmm... "Are? Ima atatemeteta yo ne?" ...Wait, did I heat up some food? Where did the food go? "Kieta gohan!" It's gone! *I* didn't eat it, did I? Wait, I heard the microwave beep. "Yoku miru? A," It says "take a closer look"? Right! I put the video in and now I *have* to watch it. I *know* this video is gonna jumpscare me. "Cho, kowakunai you ni akaruku sa, makkusu ni shite kara yarou ka na." Okay, maybe brightening the scene will help the viewers, it's not about *me* being afraid, it's about the stream, the viewers! Here we go. "Yoshi, ikimasu no ja." Okay, here we go, what now? Wait, "kore konbini no ura no are jan!" It's the back of the convenience store! It's that security camera footage! "Iya, garese?" ...Harassment? This video was sent *to* me, right? What is this?! Harassment, lol. Is it because Achichimera is working part-time or something? I quit! Okay, okay. "Baito mata ikanakya ikenai kanji ka?"... Do I have to go to work again? Fine, I'll go... but... I want to quit! *BAM*! The screen is now showing "First Night". "Stop with the loud noises!" Okay, this is the First Night?! Were the previous levels *all* tutorials? Oh, come on, really?! "Uso yaro?" ...You're kidding, right? It was just a tutorial, it seems. "Which way's the path?" Static noises... it's gonna startle me. Where did I come down from? Isn't it dark?! Is it darker than yesterday? "Nee, nushira, kinou yori gamen kuraku natteru!" Hey! It's darker than yesterday! "Ijiwaru saretemasu no ja." This is mean! Is this harassment? "Yesterday, I wasn't scared"... I've played this before. Why is it darker than yesterday?! "昨日もっと街明... 明るかったよね？" Wait! Did I pass this spot? "Machizentai?" Is this project "Scare Me"? "Ah, suicide bridge"... "Ugh, suicide bridge." I hate this. I wonder if the guy is there today? "Ah, ojisan inakunatteru." ...He's gone. He was probably satisfied with the bento.



...
