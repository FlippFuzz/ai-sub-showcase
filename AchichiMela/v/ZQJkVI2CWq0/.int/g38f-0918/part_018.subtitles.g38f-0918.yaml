    **A Salamander's Shifting Reality**

    Okay, here's what's running through my mind as I watch this stream clip. First off, is this even real? *Which part is a dream, and which is reality?* Ughhh... This definitely isn't the *Yakin Jiken* (The Convenience Store) I remember. *I'm trapped again.* And the harassment starts anew... *Is it because I'm a salamander?* Maybe the humans figured out a non-human creature's living around here, and now I'm being persecuted. Ah. They want me to watch a video, but ughhh, not until I watch it, I guess. What if opening that video shows the continuation of yesterday's event? Ah! That sound is so loud! That's scary! I need to *look closely*. What is this...? What could it be...? *What?* *The shrine I was trapped in yesterday!* Oh no... *It's getting closer and closer...* What is it? What? Hey, can they seriously stop teasing us by showing tiny little glimpses bit by bit like that? Put up a warning like "Scary part incoming!" in a cute, bouncy font or something. I really wish they'd stop scaring me. Oh, and it opened. It was because I wasn't watching? The brightness is at max, yet it's so dark. It should be maxed out, so why is it this dark? Ughhh... Before starting the game, I thought I'd be fine since I played *The Convenience Store* once before, but there's a major update, with all these unfamiliar scenes. It's heading in directions I don't know at all... *It's so scary...* Wait, but I really thought I had played this version... Hmm... Ughhh... *I'll check later.* I'll look at the update history section on Steam later. *It's so scary...* Ughhh... Drawn to the convenience store... like a moth to a flame... (or: like a bug to the light...) *It's so scary...* Wait, is Takuya alive, right? *Wait, Takuya?* Did Takuya die?! Takuya? *Takuya?* And the restroom door is left open again. *Takuyaaa!* *Takuya?* It's open... and trashed... *Huh?* *Wait, Takuya?* *Are you in the locker again?* *I'm not forgiving you for that, you know.* I definitely won't let it slide a second time. Wait, but he's definitely in the locker, right? Look! Look, you guys! This part of the locker is shaking! Ah, it's not shaking. It was just my imagination. It's gonna jump out at me! It's gonna go "Boo!" Ready? Here I go! Boo! ...Nothing! Huh? Wait, wait, wait! There's no time card! Hey, there's no time card, you guys! Where is the time card? Wait, does that mean today wasn't even my shift then? Huh, should I check the surveillance cameras? Wait, isn't it really bad that there's no time card? *What on earth is happening?* Hey, seriously... Wait, should I just go home? Um, you know... *I just thought of the worst-case scenario.*


