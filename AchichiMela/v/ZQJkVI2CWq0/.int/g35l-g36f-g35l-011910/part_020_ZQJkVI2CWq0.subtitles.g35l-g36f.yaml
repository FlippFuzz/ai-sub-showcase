global_summary:
  overall_summary: In this video stream from the Hololive channel 'Mela Ch. 熱千めら‐
    アソビ★まわり隊!', VTuber Netsuchi Mela plays the popular Japanese psychological horror
    game 'The Convenience Store' (夜勤事件) by Chilla's Art. Despite claiming she has
    played it before, she quickly finds herself terrified by updated scenes, eerie
    coworker interactions, creepy video tapes, and a difficult security monitor puzzle.
    The stream opens with pre-stream chatting about membership perks and a recent
    Minecraft collab with Hololive seniors, proceeds through the tense multi-night
    convenience store shifts and a bathroom break, and concludes with a post-game
    chat celebrating her upcoming 1-month anniversary stream.
