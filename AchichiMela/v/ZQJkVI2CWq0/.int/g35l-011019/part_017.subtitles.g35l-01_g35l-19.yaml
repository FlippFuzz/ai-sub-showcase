  overall_summary: In this stream from Mela Ch. 熱千めら‐ アソビ★まわり隊!, Hololive VTuber Achichi
    Mela plays the indie horror game 'The Convenience Store' (夜勤事件). Although she
    confidently claims to have played it before and boasts that she won't scream,
    she quickly finds herself spooked by atmospheric tension, jump scares, and unexpected
    new updates. Throughout her playthrough, she manages eerie convenience store night
    shifts, deals with bizarre customers and her troublesome coworker Takuya Funabashi,
    and reacts with her signature cute commentary while wearing her streaming mask.
    After surviving the harrowing shifts and reaching the unsettling conclusion, she
    winds down by chatting with viewers about her upcoming 1-month anniversary stream
    and future content plans.
