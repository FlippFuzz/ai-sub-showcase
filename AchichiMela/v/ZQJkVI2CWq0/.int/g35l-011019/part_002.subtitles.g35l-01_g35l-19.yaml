  - start: '02:41.220'
    end: '02:45.720'
    original: あのね、わしなんと夜勤事件やったことあります！
    english: You know what? I have actually played The Convenience Store before!
  - start: '02:47.380'
    end: '02:59.020'
    original: わしね、実は過去に夜勤事件をプレイしたことがありますのじゃ！はい、すでにありますと。
    english: I actually, once in the past, have played The Convenience Store, you
      see! Yes, I already have, it says.
  - start: '03:00.040'
    end: '03:15.340'
    original: まやったのは、結構何年前とか、結構前じゃから、あの、こと細かに全てを覚えているかと言われると、まあ、そのお約束はできない。うん。
    english: Well, as for when I did it, it was quite a few years ago, quite a while
      ago, so if you ask me if I remember everything in detail, well, I can't promise
      that. Yeah.
  - start: '03:16.820'
    end: '03:23.240'
    original: はい、3ヶ月前の記憶がなくなるタイプのサラマンダーじゃから、ま、こと細かには覚えてはいませんが、
    english: Yes, I'm a salamander whose memory of 3 months ago disappears, so while
      I don't remember it in detail,
  - start: '03:24.060'
    end: '03:30.340'
    original: しかし、あの1回もやったことないよりはわかるじゃろうと。
    english: however, I should understand it better than having never played it once.
  - start: '03:30.560'
    end: '03:41.380'
    original: そじゃからに、お主ら今日ね、絶叫聞けない。ごめんね！あの、左手や右手にワインを持っているお主ら、残念でしたと。
    english: Therefore, you guys won't get to hear screams today. Sorry! Those of
      you holding wine in your left or right hands, too bad.
  - start: '03:41.820'
    end: '03:53.300'
    original: 金曜日の夜1週間お疲れさまでした。1週間の疲れを癒やすためにめらちゃんの悲鳴でも聞こうとおもいの速攻のあなた、残念でした。
    english: Friday night, thank you for your hard work this week. To those of you
      who thought you'd listen to Mela-chan's screams to heal your weekly fatigue,
      too bad.
  - start: '03:54.680'
    end: '04:14.280'
    original: 本日あぢちめら余裕でございますのじゃ。もうなんならRTA勢並みにね、さくさくさくとプレイして、かっこいい初めてでホラーゲームでかっこいいところを見せちゃおうかと思っておりますのじゃ。
    english: Today Achichi Mela is completely relaxed, you see. If anything, playing
      smoothly like an RTA speedrunner, showing off a cool side in a horror game for
      the first time, I'm thinking of showing you that, you see.
  - start: '04:16.200'
    end: '04:29.360'
    original: 悲鳴聞けないなら解散、え、やめていかないでほしいのじゃ！悲鳴聞けなくても好きでいてほしいのじゃ！あの、あの、わからんよ、まだわかんない、まだわかんないけどね！のじゃ！
    english: If I can't hear screams, disband, eh, please don't quit! Even if you
      can't hear screams, I want you to keep loving me! Um, um, I don't know yet,
      I still don't know, still don't know, but! You see!
  - start: '04:31.020'
    end: '04:37.380'
    original: ので、まあ、あの、そんなにビビらないかなとは思いますのじゃ。ご容赦ください。
    english: So, well, um, I don't think I'll be that scared. Please forgive me.
  - start: '04:38.280'
    end: '04:47.920'
    original: ご容赦くださいのじゃ。いつものホラーよりはね、お主らワイン持ってないかもね。のじゃ！
    english: Please forgive me, you see. Compared to usual horror, you guys might
      not have wine. You see!
  - start: '04:49.640'
    end: '04:57.100'
    original: そうかも、今日休館日になる可能性金曜日だけどお主らお酒飲めない日になるかもしれませんのじゃー！
    english: It might be, today might become a closed day even though it's Friday,
      but you guys might not be able to drink alcohol, you see!
