  - start: '01:52.288'
    end: '02:04.048'
    original: アルバイトの経験はあるのじゃ。保育所とか、子どもを守る、子どもを守る！保育所とか学童とか、そういう系はったことあるけど、接客も…
    english: I do have part-time job experience. Daycare centers, protecting children,
      protecting children! Daycare centers, after-school clubs, I've done stuff like
      that, but customer service too...
  - start: '02:04.288'
    end: '02:09.108'
    original: でもコンビニみたいなのはやったことないのじゃ。うん。
    english: But I haven't done anything like a convenience store. Yeah.
  - start: '02:11.168'
    end: '02:22.568'
    original: 引き継ぎは無賃・無給。あの個人で好き勝ってやって現れて消えてたから、引き継ぎはお金もらってないのじゃ。野良の引き継ぎですのじゃ。うん。
    english: The handover was unpaid and uncompensated. Since they just did whatever
      they wanted individually and disappeared, I didn't get paid for the handover.
      It's a stray handover. Yeah.
  - start: '02:26.548'
    end: '02:40.480'
    original: で、お主ら今日、あの、手にワインを持っているお主らもいると思うんじゃが、ワインやら水色のシャンパンやらを持っているお主らも見受けられますが、ジャガーだよ、ジャガー！
    english: And, you guys, some of you might be holding wine today, and some of you
