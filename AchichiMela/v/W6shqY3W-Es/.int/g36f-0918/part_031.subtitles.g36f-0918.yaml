    **My Thoughts on Moral Sensibility and Fire Safety**

    Okay, so, here's the thing... I'm thinking about this dish, you know? The one that's supposed to be made with eggs. I want to try it; I wonder if it's tasty. Where can I find it? It's Chinese cuisine, apparently. You make it by lightly patting eggs in a frying pan to create this smooth, glossy, round dish. Yeah, I definitely want to try eating that.

    But that reminds me... I saw a message in my stream. It was from a viewer saying "I love the moral-like analytical discussions that pop up on your stream, Mera-chan." And they asked when I developed that kind of sensibility.

    Morals? What do they mean? Like, "what does it mean to be human," that kind of thing? That's when I realized, actually, I *do* know. I know why I started thinking that way. It wasn't from books or movies or any artistic thing. The thing is... it came from a Twitter follower.

    See, around the time I was released from social media parental controls and could use Twitter... well, in human years, it would be around 9th grade, maybe even 8th grade. When I was about that age, someone I was following, they seemed to really like those kinds of philosophical discussions. I don't keep in touch with them now, but that follower, back then, was constantly tweeting stuff like that. I just watched them and thought, "Oh, that's interesting," and that really influenced me. I was influenced, like "Ah, so there's that kind of perspective!"

    Because back then I didn't really have very close friends at school, you know. I didn't, and the internet was much more fun. So my life was pretty much online, or rather my heart lived on the net. I remember being heavily influenced. Yup, so it's all thanks to the influence of that Twitter follower. The thing is, I didn't even know how old they were or what their gender was, because they had high internet literacy. I couldn't tell if they were working or a student. They never revealed a single detail about their personal life. So I was influenced by reading tweets from a total stranger whose face, name, gender, and age were completely unknown to me. Indeed.

    Then, there was this other message from a viewer: "You had Tuesday off again recently. Could it be that Tuesdays are off so you can do 'fire prevention' (Hinoyoujin)??? If so, good luck!" I got a few messages like this. "A philosophy account?" No, that wasn't it at all. It was more like... they just posted meme tweets and things like that. Well, maybe a mix of both. Internet humor. They just posted internet memes. Just when you thought they only talked about internet memes, they'd randomly drop tweets like that. It was like an everyday life account, kind of like "doing XX right now," that sort of thing.

    Oh, and about Tuesdays! The real reason Tuesday is off is because of Noja English. I want to go to bed early for Noja English. So it's my day off.

    But since they put it so cleverly, maybe I should use the excuse. Because Tuesdays are for fire prevention! It's for good fortune/symbolism, after all. As a firefighter, as a firefighter shop, I take the day off, bang my wooden clappers, and do night watch! Beware of fire! Clack! Clack!

    Oh! I got sound effects! Can you hear it? Is it working? Is it on stream? Hey, can you hear it? Is it working? Is it there? Is it on? Can you hear it? Oh, you can hear it? Okay, listen. Beware of fire! Is it a bit quiet? I have clappers! I have wooden clappers! Yep. So that's how it is. So that's how it's gonna be from now on.


