  thoughts: |+
    **A Deep Dive into the Merachi Cover Song Selection**

    Okay, here's a breakdown of my thought process regarding that cover song selection and some related musings, as if they are my own thoughts:

    First, let's establish the context of the Merachi cover of "I Like Myself." The user is interested in the reasons and some background of its creation. The genesis of that project got me thinking. I had originally planned to debut with "Salamander." It aligns with my essence, as I am a salamander myself. I thought it would be a smart move to select something, to help people remember my species. I'm a massive DECO*27 and Vocaloid fan. The problem was, as I considered, that "Salamander" is difficult! The chorus... that "Ah ah ah" section? Forget it, hard! I figured this was my first cover, and I needed to show my strengths, right? Debut, that is.

    VTuber debuts garner a lot of attention, and I realized, "You only get one shot to make a great first impression," so to speak. I want people to enjoy me, and I wanted to be remembered. So, I aimed to show my best, and I wanted to deliver the best. I wanted my viewers to see the best of me.

    My strengths lean towards cute character songs; I'm pretty good at that. So that brought me to "WataWata", I'm a huge fan of "WataWata." I have such great memories of it. When I first saw "Kaguya-hime" I saw "WataWata", what a great character song!

    HoneyWorks is divine. And Kaguya's singing style, that voice actress is so distinctive, it really had a big impact on me. She does that, it's very unique, even for a character song, it's unique, and so I loved it. I love how it's quirky, which I found to be both good and cute. I thought I really want to sing this, it's what I want to sing. The "WataWata" MV also uses a profile sheet, right?

    I thought, the perfect song for self-introduction, this is it! During the recording, it was right when I was starting to receive singing lessons, and, in truth, I thought I sang my best at that moment, as best as I could back then. Even then it was tough, but I gave it my best shot.

    However, the original song is sung by a human voice, and I tend to listen to Vocaloid; as a result, I compared myself to her and found that she's a super-good singer. I worked really hard, listened to it over and over, because, when you compare the human vocals, it is difficult. I gave the recording my all. And that's pretty much that.

    By the way, I was asked something. And, since it is a frequently asked question, I'm not a salamander amphibian, but a mythical elemental salamander. I'm not a protected natural monument!


