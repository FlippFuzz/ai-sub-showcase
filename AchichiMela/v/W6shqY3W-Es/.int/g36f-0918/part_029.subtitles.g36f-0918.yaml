  - start: '03:57.800'
    end: '04:02.900'
    original: 「プロセカでイベラン勢と聞きましたが、どのキャラクターのイベントを周回していたか知りたいです！」
    english: '"I heard you were an event ranker in Project SEKAI! I''d like to know
      which character''s events you grinded for!"'
  - start: '04:03.900'
    end: '04:06.000'
    original: まふゆか...まふゆなのじゃ
    english: Mafuyu... It was Mafuyu.
  - start: '04:06.800'
    end: '04:11.200'
    original: 「またプロセカの書き下ろし曲の中で好きな曲とかあれば教えてください！！」
    english: '"Also, if there are any original commissioned songs in Project SEKAI
      that you like, please tell us!!"'
  - start: '04:11.300'
    end: '04:14.600'
    original: いや、書き下ろしのなかで好きな曲むずいんだよなー
    english: Man, choosing a favorite commissioned song is really tough...
  - start: '04:15.100'
    end: '04:18.200'
    original: なんかそのボカロとして好きな曲とさ...
    english: Like, between songs I like as Vocaloid songs...
  - start: '04:20.100'
    end: '04:26.500'
    original: 合成音声が歌唱する曲として好きな曲と、その声優さんが歌唱する曲として好きな曲って違うじゃろ？
    english: The song you like when sung by a vocal synthesizer vs. when sung by the
      voice actors are different, right?
  - start: '04:28.700'
    end: '04:34.900'
    original: ちなみに、プロセカのその声優さんが歌唱している...
    english: By the way, among the Project SEKAI songs sung by the voice actors...
  - start: '04:35.300'
    end: '04:38.200'
    original: もちろんど合成音声も一緒に歌ってるんですけど
    english: Of course, the synth voices sing along too, but...
  - start: '04:38.300'
    end: '04:44.200'
    original: あの、ボカロ版じゃなくて、声優さんも歌唱してる版で好きなのは『ステラ』...『ステージオブセカイ』
    english: Um, not the Vocaloid version, but the version with voice actors, my favorite
