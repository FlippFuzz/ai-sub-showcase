  - start: '00:00.600'
    end: '00:03.800'
    original: なんか宣伝用のティザーとかだったのかな？
    english: I wonder if it was like a teaser for promotional purposes?
  - start: '00:04.800'
    end: '00:05.600'
    original: うん
    english: Yeah.
  - start: '00:05.900'
    end: '00:06.700'
    original: そう
    english: Right.
  - start: '00:07.100'
    end: '00:11.200'
    original: 多分それ用のティザーかが流れてたっぽい気がする
    english: I feel like a teaser for that was being shown or something.
  - start: '00:12.300'
    end: '00:13.600'
    original: そう、それで知ったのじゃ
    english: Yeah, that's how I found out about it.
  - start: '00:17.500'
    end: '00:18.200'
    original: はい
    english: Alright.
  - start: '00:18.600'
    end: '00:30.800'
    original: えー、「Our Bright Parade」に出会わなかったらどうなっていたと思う？ ホロライブを目指していなかった？ VTuberになっていなかった？
      別の職に就いていた？ それとも運命の収束力で結局ホロライブに辿り着いていた？ どうなっていたと思う？
    english: '"If you hadn''t encountered ''Our Bright Parade,'' what do you think
      would have happened? Would you not have aimed for Hololive? Would you not have
      become a VTuber? Would you have taken a different job? Or would the force of
      fate have brought you to Hololive anyway? What do you think?"'
  - start: '00:31.900'
    end: '00:33.200'
    original: うーん...
    english: Hmm...
  - start: '00:37.400'
    end: '00:39.400'
    original: タイミングな気がするのじゃ
    english: I feel like it's a matter of timing.
  - start: '00:40.900'
    end: '00:41.800'
    original: なんか...
    english: Like...
  - start: '00:44.200'
    end: '00:59.800'
    original: 今回、今わしがあそび同盟としてユニットデビューしたときのオーディションを受けたきっかけは、「Our Bright Parade」だった
    english: This time, the trigger for me taking the audition when I debuted as part
      of Asobi Doumei was "Our Bright Parade."
  - start: '01:00.800'
    end: '01:01.700'
    original: うん
    english: Yeah.
  - start: '01:03.200'
    end: '01:10.800'
    original: 今回、わしが新人としてデビューしたきっかけはそれじゃった
    english: So the trigger for me debuting as a newcomer this time was that.
  - start: '01:10.800'
    end: '01:11.800'
    original: から...
    english: So...
  - start: '01:12.400'
    end: '01:15.500'
    original: ホロライブを目指していなかったに関しては「ノー」な気がする
    english: As for "not aiming for Hololive," I feel like the answer is no.
  - start: '01:15.800'
    end: '01:19.400'
    original: ホロライブにはいずれ辿り着いていた気がしますのじゃ
    english: I feel like I would have eventually reached Hololive anyway.
  - start: '01:20.200'
    end: '01:21.000'
    original: うん
    english: Yeah.
  - start: '01:24.400'
    end: '01:28.800'
    original: ホロライブには入ってたし、受けてたと思うけど...
    english: I think I would've applied for and joined Hololive, but...
  - start: '01:30.500'
    end: '01:33.500'
    original: でも「あそび同盟」としてじゃなかったかも
    english: But maybe it wouldn't have been as Asobi Doumei.
  - start: '01:33.700'
    end: '01:42.000'
    original: うん、もっと後の...もっともっと後の新人としてデビューしてたかも
    english: Yeah, I might have debuted as a newcomer much, much later instead.
  - start: '01:43.900'
    end: '01:44.800'
    original: うん
    english: Yeah.
  - start: '01:44.800'
    end: '01:47.400'
    original: だから辿り着いてはいると思いますのじゃ
    english: So I do think I would have reached here eventually.
  - start: '01:47.800'
    end: '01:52.200'
    original: うん、でも今じゃなかったと思う、タイミングが違かったと思う、あんとき...
    english: Yeah, but I don't think it would've been right now. The timing would've
      been different back then...
  - start: '01:52.700'
    end: '01:56.500'
    original: わしがKemuさんの曲を聞こうっつって見てなかったら...
    english: If I hadn't checked out Kemu-san's songs back then...
  - start: '01:57.100'
    end: '01:58.000'
    original: うん
    english: Yeah.
  - start: '01:58.600'
    end: '02:00.000'
    original: タイミングな気がする
    english: I feel like it was all about timing.
  - start: '02:04.900'
    end: '02:11.200'
    original: あそび同盟でデビューできたのすごい嬉しい、すごい嬉しい！
    english: I'm super happy that I was able to debut with Asobi Doumei, super happy!
  - start: '02:11.200'
    end: '02:19.800'
    original: これはなんかさ、同期が誰で、どういうデビューをするかっていうのはさ、わしが決められることじゃないからさ
    english: Because, you know, who your genmates are or how you debut aren't things
      I can decide.
  - start: '02:21.900'
    end: '02:24.700'
    original: ランダム要素、お楽しみ要素じゃけど...
    english: It's kind of a random, fun element, but...
  - start: '02:24.800'
    end: '02:28.100'
    original: わし「あそび同盟で良かった」ってすごい思うの
    english: I really think "I'm so glad it was Asobi Doumei."
  - start: '02:28.300'
    end: '02:33.400'
    original: すごい思う、し、すごい好きだから「良かったー！」って思う
    english: I really do, and because I love it so much, I think, "I'm so glad!"
  - start: '02:34.800'
    end: '02:35.800'
    original: のじゃ
    english: Indeed.
  - start: '02:37.400'
    end: '02:39.400'
    original: あ、これも言いたい
    english: Ah, I want to answer this one too.
  - start: '02:40.400'
    end: '02:46.800'
    original: はい、「『〇〇は△△なのじゃ』『〇〇は△△なのじゃ』と2回同じことを繰り返して発言することが多いですが、口癖ですか？それともそんなに重要なんですか？」
    english: 'Okay: "''XX is YY, no ja. XX is YY, no ja.'' You often repeat the exact
      same statement twice. Is it a habit, or is it really that important?"'
  - start: '02:47.300'
    end: '02:48.800'
    original: え、これ癖なのじゃ
    english: Huh, this is just a habit of mine.
  - start: '02:48.900'
    end: '02:50.000'
    original: 気づかなかった？
    english: I didn't even realize it!
  - start: '02:50.400'
    end: '02:56.200'
    original: てかなんかさ、エゴサしてったらさ、見つけたの、こう言うのよく見るの
    english: I mean, when I was ego-searching, I found people talking about this a
      lot!
  - start: '02:56.500'
    end: '02:59.800'
    original: 気づかなかった！知らなかったのじゃ！
    english: I didn't notice at all! I didn't know!
  - start: '03:00.800'
    end: '03:04.200'
    original: え、なんかね、繰り返す癖があるの、わし
    english: Yeah, like, I apparently have a habit of repeating myself.
  - start: '03:04.700'
    end: '03:07.100'
    original: 無自覚！ちなみに無自覚なのじゃ！
    english: Unconsciously! By the way, I do it completely unconsciously!
  - start: '03:08.200'
    end: '03:14.300'
    original: なんか配信の切り抜きとかを見てて、「あ、めっちゃ繰り返すやん、この女！」って思うんじゃけど...
    english: When I watch stream clips, I'm like, "Ah, this girl repeats herself so
      much!"
  - start: '03:14.700'
    end: '03:16.200'
    original: わしは気づいてない
    english: But I'm not aware of it at the time.
  - start: '03:17.800'
    end: '03:18.400'
    original: 癖
    english: It's a habit.
  - start: '03:18.500'
    end: '03:19.400'
    original: 意味ない
    english: There's no meaning behind it.
  - start: '03:19.800'
    end: '03:21.000'
    original: 重要じゃない
    english: It's not important.
  - start: '03:22.700'
    end: '03:24.000'
    original: 癖なのじゃ
    english: It's just a habit.
  - start: '03:26.300'
    end: '03:27.700'
    original: 意図的じゃない
    english: It's not intentional.
  - start: '03:28.300'
    end: '03:31.500'
    original: 意図的じゃないからコントロールもできない
    english: Since it's not intentional, I can't even control it.
  - start: '03:37.800'
    end: '03:39.700'
    original: 「あと17個」
    english: '"17 times left."'
  - start: '03:40.800'
    end: '03:44.200'
    original: 「その時間に考えてたりする？」あー、それもあるかも？
    english: '"Are you thinking during that time?" Ah, that might be part of it too?'
  - start: '03:45.800'
    end: '03:46.800'
    original: わかんない
    english: I don't know.
  - start: '03:47.300'
    end: '03:48.700'
    original: なんで言ってるかわかんない
    english: I don't know why I say it.
  - start: '03:48.800'
    end: '03:55.300'
    original: なんで言ってるかわかんないし、言ってる自覚もないから、後でアーカイブを見て気づくことしかできないのじゃ
