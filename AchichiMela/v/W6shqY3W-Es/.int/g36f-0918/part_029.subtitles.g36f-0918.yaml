  - start: '04:44.700'
    end: '04:46.700'
    original: 『ステージオブセカイ』はいいね、合うのじゃ
    english: '"Stage of Sekai" is really good. It suits them.'
  - start: '04:48.800'
    end: '04:51.100'
    original: 『ステラ』とかも好き
    english: I also like "Stella" and such.
  - start: '04:54.200'
    end: '04:59.200'
    original: ボカロ版...だとむずいな！ボカロ版だとむずいなのじゃ！
    english: For Vocaloid versions... that's hard! It's so hard for Vocaloid versions!
