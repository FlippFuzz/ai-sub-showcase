  thoughts: |+
    **A Whirlwind of Newness**

    Okay, so, here's the thing. I'm Aohina Miel (青日ナミエル). I've got this video to work through, and let's face it, things are a little... overwhelming right now. First, I was messing with my model, and suddenly I was *huge* – "ちっちゃくなれなくなった" ("I can't shrink back down anymore!") It was a total mess, making myself too big and then trying to fix it. "いいんじゃない？" ("Isn't this good?") I'm back to normal... sort of.

    Then it's onto the comments. People are saying "神がとう" ("Kamigatou" - a pun meaning "kami + arigatou" -  Thank you, the gods!"). 21 more. I'm happy people are liking the stream. But... it's just... so surreal.  "ホロライブに入った実感はありますか？" ("Do you feel like you've really joined Hololive?")  "ありません！" ("I don't!") I keep thinking, "What is going on?"  Receiving messages from *senpais* whose streams I used to watch... it's a huge shift from what I was expecting.  It's just too unreal. People whose names I *know* are DMing me! "わけわからん！" ("Makes no sense!") "夢か？！" ("Is this a dream?!") It's all a little confusing, and the feeling is yet to truly set in.

    And then there's the Q&A. Someone asks about my… let's say, *direct* style of communication. "すぐ煽ったり、お口が汚くなるのは、そちらが素だからでしょうか？" ("When you tease people right away or get a potty mouth, is that because it's your true self?") I’m being honest, though. "そうですのじゃ" ("That's right-noja.") I am doing my best to adapt to humans to be loved by them. It's just... an act, sometimes. When I mess up, it comes out.  "ごめんのじゃ。" ("Sorry-noja.")

    And then, "What was your first encounter with Vocaloid?" - "「Tell Your World」". I was at this general store, and they had these small monitors that played this live concert. I remember the colorful MV. Then, this song kept playing... Then I thought, there's such a thing as Vocaloid? It wasn't mainstream yet back then. It was "Tell Your World". I knew it wasn't the Google CM, but it was from some CD or album with Tell Your World in it.


...
