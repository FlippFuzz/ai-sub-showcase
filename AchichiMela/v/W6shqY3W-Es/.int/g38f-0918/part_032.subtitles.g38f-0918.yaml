  thoughts: |+
    **My Thoughts on the Clip**

    Alright, let's break this down. A viewer is asking for beginner recommendations since they're new to Vocaloid, having previously been into band music. They specifically enjoyed "SAKKAC CRAFT" and are looking to dive deeper.

    My immediate thought is, if they liked "SAKKAC CRAFT," and we're talking about recommendations for beginners, it seems like the obvious path would be Voca-rock! Since they seem to be familiar with *SAKKAC CRAFT* by Tsumiki, I went through some potential related tracks. I considered the music Tsumiki has composed for others, like "Shadow" that he provided for LiSA-san, they might enjoy that as it has similarities to the composition for Mera-chan. From Tsumiki, I would recommend "Misconductor" (sung by Kii), and possibly "Idola Holic."

    If they're looking for classics in general, then it has to be Jin and kemu-san. Specifically tracks from around 2010. Those tunes are quintessential Voca-rock. Stuff from then is totally recommended! Songs like "Suicide Parade" by Tsumiki are totally cool. And, of course, wowaka-san is Voca-rock too. Like "Invisible."

    Then, shifting gears, the clip then moved to a viewer asking about the self-produced anime. I immediately had the thought, "It only took me about two weeks," I said. It was crazy, though. I spent those two weeks drawing non-stop, only stopping to sleep or eat. It was all about the storyboards and the script. The first few days involved around 40 or 50 cuts, and I'd get about 4 or 5 done a day. It was like I was drawing for ten or more hours a day, so, I was drawing for ten-ish hours, and trying to get about 4-5 scenes done. I didn't know how to do animation at all, so it was all trial and error. Drawing for 2 weeks straight was intense!

    And then it hit me, it was my first time! I felt like, all my Asobimawaritai comrades have, like, clear strengths, right? Like, "game skill!"


