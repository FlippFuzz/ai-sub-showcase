  thoughts: "**A Deep Dive into My Thoughts from 00:00 to 05:00**\n\nAlright, let's\
    \ get this straight. When I was asked about my school performance, honestly, I\
    \ wasn't the greatest student. (00:00-00:12) Let's be honest, my average score\
    \ on those 100-point tests was probably between 20 to 40 points, so I wasn't exactly\
    \ a scholar. (00:16-00:20) I didn't study much. (00:21-00:24) In fact, I was practically\
    \ failing. (00:25-00:30) I think I was the worst in the class, or close to it,\
    \ although I never saw the official rankings. (00:32-00:45)\n\nSomeone asked for\
    \ study tips since they get distracted by their phone (00:46-00:50). My recommendation?\
    \ Get a study buddy! (00:50-01:02) Someone to \"keep an eye on you\" or, you know,\
    \ just study with someone on the phone. (00:53-01:02)\n\nThen, about \"gachikoi\"\
    \ – those with intense, romantic feelings for me (01:03-01:07): I don't think\
    \ you can really *control* those feelings. (01:08-01:19) Romance is a powerful\
    \ force that throws emotions all over the place. (01:27-01:37) I've heard stories,\
    \ after all, of it making humans lose their minds, really. (01:40-01:46) That's\
    \ why, moderation is key. (01:47-01:51) If it gets out of hand, it's not good,\
    \ especially with over-idealization, and losing yourself in the relationship to\
    \ the point of being unkind to others (01:51-02:14), and that kind of thing. But\
    \ really, I hear of the bad effects that can happen, that humans can become *crazy*\
    \ (02:14-02:19), but it's okay because you cannot help it! (02:19-02:23) Although,\
    \ I can't recommend it, since it sounds really *painful*. (02:23-02:30) You should\
    \ aim to live in a way where it doesn't cause suffering, if possible. (02:51-02:56)\
    \ And it's important to remember that such strong feelings shouldn't lead to attacking\
    \ others, you know, being out of control. (02:56-03:00) \n\nI really appreciate\
    \ the support (03:11-03:17), someone said they fell for me but can't really comment,\
    \ and lurk. (03:17-03:20) Honestly, it makes me really happy when people just\
    \ watch. (03:20-03:35) It's wrong to think lurking is somehow a negative thing;\
    \ it's just a different way of showing support (03:35-03:52) . I'm a lurker myself\
    \ in the internet (03:52-04:02) I don't comment, and I think it's part of proper\
    \ internet behavior, so, I feel great! (04:02-04:15) Commenting or not, it all\
    \ feels great, and I appreciate the commentors (04:15-04:39)\n\nSomeone else asked,\
    \ as a salamander who loves humans, what do I *most* love about humans (04:39-04:51)\
    \ and do I ever think, \"That's not very human-like?\" Well, I've never felt that\
    \ way about humans. (04:53-04:57) After all, I am not human. (04:57-05:00)\n\n\
    \n"
