  - start: '01:04.811'
    end: '01:10.741'
    original: ハッシュタグ、「#FBキングダムに納税」をつけて、“フブキングダム”を布教しよう！フブキングダム王国（白上フブキ）ってどんな人？あなたが考える王国のフブキングダムの設定とはなど、テキストコメント、ファンアート、動画投稿などなんでも大歓迎です！
    english: Use the hashtag "#FBKINGDOMダムに納税" to spread the word about FBKINGDOM
      and show your support across social media!
  - start: '01:11.191'
    end: '01:21.391'
    original: 優れた納税者には国王からお言葉の言をいただけるかも…？対象プラットフォーム：X、TikTok、YouTubeショート、これ納税とありますけども、ま、お、いつものね、応援コメントですとか、ファンアート、動画投稿などなんでも、こちらハッシュタグフブキングダムに納税をつけて投稿をお願いします！
    english: '"Tax payments" can be anything—like your usual cheering comments, fan
      art, video posts, whatever you like! Just add the hashtag and share!'
