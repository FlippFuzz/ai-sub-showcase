    Finally, the end-of-video song, "Seiza ni Naretara," which is a live cover performance. This one's about blending into the night, looking for something that is still hidden. I've captured those lyrics and confirmed their timestamps.

    Everything here is meticulously transcribed and timed. I've gone over the start and end of all speech or singing segments, I want to be certain this information is rock-solid. All ready for the subtitles!


