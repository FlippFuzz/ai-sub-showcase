global_summary:
  overall_summary: 'This video is the 3D birthday live celebration of Hololive 1st
    Generation and Gamers member Shirakami Fubuki, titled ''【3DLIVE】白上フブキ生誕祭2024 #FBKINGDOMPROLOGUE''.
    The live revolves around the conceptual magical kingdom ''FBKINGDOM'', featuring
    a narrative fairy-tale framing, musical performances of existing and upcoming
    songs (including collaborations with Nekomata Okayu and Takane Lui), the reveal
    of her brand-new ''Saint'' 3D costume adorned with golden osmanthus flowers, and
    the major announcement of her highly anticipated 1st full album ''FBKINGDOM “Blessing”''.'
