    Fubuki 1st LIVE FBKINGDOM “ANTHEM”', capturing the opening portion of hololive
    VTuber Shirakami Fubuki's historic first solo concert held at Pia Arena MM in
    Yokohama on February 13, 2025. The broadcast includes pre-show venue notices,
    venue announcements by Fubuki, energetic live performances of her original tracks
    ('Hi Fine FOX!!', '闪光のように', and 'キミノスキピ'), an interactive MC segment welcoming
    her fans ('citizens' of FBKINGDOM), and the transition concluding the free YouTube
    broadcast.
