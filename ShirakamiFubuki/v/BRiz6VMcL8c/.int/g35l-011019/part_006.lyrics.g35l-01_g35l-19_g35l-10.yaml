  original: おっとっと期待しちゃってさ
  english: Oops, getting my hopes up...
- start: '02:50.050'
  end: '02:52.470'
  original: いつもの場所から 元気にせーのでご挨拶！
  english: Saying a cheerful hello from our usual spot, ready, set, go!
- start: '02:56.170'
  end: '03:02.130'
  original: はじめましては おしゃべりにはそして慣れてきて すんなり毎日が愛おしくて
  english: Meeting for the first time, getting used to chatting, smoothly making every
    single day so dear.
- start: '03:03.450'
  end: '03:08.730'
  original: あれもこれも手を出し たくなりがちです
  english: I tend to want to get my hands on this and that too.
- start: '03:09.650'
  end: '03:15.110'
  original: スタートか ステージは まだまだはずかしいけど
  english: Starting off, the stage is still a bit embarrassing, but...
- start: '03:16.490'
  end: '03:20.350'
  original: 支え合ってほら 届けますよ この声は
  english: Supporting each other, look, I'll deliver this voice to you!
- start: '03:22.090'
  end: '03:28.170'
  original: せい！ほら顔を上げて みんなで手を挙げればほら最高！
  english: Hey! Come on, look up, and if everyone raises their hands together, it's
    the best!
- start: '03:28.870'
  end: '03:32.790'
  original: まだまだ見たことない 世界を越えよう
  english: Let's cross over to a world we haven't seen yet!
- start: '03:33.250'
  end: '03:38.290'
  original: せい！ほら押し寄せても 止まらない電力だから
  english: Hey! Come on, even if it rushes in, it's an unstoppable power!
- start: '03:39.510'
  end: '03:44.750'
  original: 夢を書き換えたら 追いかけ続けよう
  english: Once you rewrite your dream, let's keep chasing after it!
- start: '03:44.890'
  end: '03:47.330'
  original: 止まりに狂うファンファーレ行こう！
  english: Let's go with the nonstop crazy fanfare!
- start: '03:48.330'
  end: '03:52.430'
  original: イェーイ！ はい！はい！うーこん！ふー！
  english: Yeah! Hai! Hai! Uu, Kon! Foo!
- start: '03:52.530'
  end: '03:57.430'
  original: せーの、Go! Go! Let's go!
  english: Ready, set, Go! Go! Let's go!
- start: '03:59.030'
  end: '04:04.690'
  original: ちょっとやらかした時でも 気持ち切り替えて ぼーっとしちゃう昼下がりは
  english: Even when I mess up a bit, switching my mood, a dazed afternoon...
- start: '04:09.110'
  end: '04:12.430'
  original: 手のびをして お腹減ったらすぐもぐもぐだ
  english: Stretching my arms, when I get hungry, it's time to munch right away!
- start: '04:13.250'
  end: '04:16.890'
  original: お茶の時間はそんなおやつで
  english: Tea time is with treats like that.
- start: '04:17.030'
  end: '04:21.490'
  original: 黒いあの子にはナイショにしてほしいです
  english: I want you to keep it a secret from that dark child.
- start: '04:22.130'
  end: '04:27.750'
  original: 仲間の力とお友達のみんなさと
  english: With the power of my friends and all my companions...
- start: '04:28.450'
  end: '04:33.390'
  original: 叶えたい思いを 言葉にしてひとつひとつ
  english: Turning the feelings we want to fulfill into words, one by one.
- start: '04:35.310'
  end: '04:40.850'
  original: せい！ほらその手を上げて みんなでファンになれば最高！
  english: Hey! Come on, raise your hands, and if everyone becomes fans together,
    it's the best!
- start: '04:41.350'
  end: '04:45.370'
  original: まだまだ成長中 問題ないでしょ！
  english: Still growing up, there's no problem at all!
- start: '04:46.410'
  end: '04:51.650'
  original: せい！ほら明るく元気な 心がとりえですから
  english: Hey! Come on, because a bright and cheerful heart is my strong suit!
- start: '04:52.330'
  end: '04:54.500'
  original: へこみがちな時も
  english: Even in times when I feel down...
