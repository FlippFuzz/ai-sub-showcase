  subtitles:
  - start: '00:08.520'
    end: '00:13.150'
    original: 白肌の娘が咳をした。「この身体貴方に捧げるわ」
    english: The pale-skinned maiden coughed. "I offer this body to you."
  - start: '00:13.520'
    end: '00:17.020'
    original: 白服の医者が囁いた。「迎えに行くよ」
    english: The doctor in white robes whispered, "I'm coming to get you."
  - start: '00:17.520'
    end: '00:21.820'
    original: 白肌の娘は朽ち果てた。世界のだれにも見捨てられ
    english: The pale-skinned maiden withered away, forsaken by everyone in the world.
  - start: '00:22.020'
    end: '00:27.820'
    original: 白服の医者は憐れんで、誰も知らない隠し場所で眠らせた
    english: The doctor in white robes took pity and let her sleep in a hidden place
      known to no one.
  - start: '00:28.120'
    end: '00:34.420'
    original: 朽ちてなお美しく蒼い硝子、ふたりきりの霊廟で
    english: Still beautiful even in decay, in an azure glass, in a solitary mausoleum
      for just the two of us...
  - start: '00:34.620'
    end: '00:37.720'
    original: 医者は恋をした
    english: The doctor fell in love.
  - start: '00:38.020'
    end: '00:43.420'
    original: それは永遠の恋か。禁断の行為か。
    english: Is this eternal love? Is it a forbidden act?
  - start: '00:43.920'
    end: '00:49.720'
    original: また逢いたいと願うだけ。それが罪なのでしょうか。
    english: Wishing only to meet again... is that a sin?
  - start: '00:50.020'
    end: '00:55.520'
    original: 物謂わぬ口唇に生気を吹き込んで、
    english: Breathing life into those silent lips...
  - start: '00:55.820'
    end: '01:01.020'
    original: 今宵ふたりは結ばれる。祝福もされずに。
    english: Tonight the two shall be joined, without even a blessing.
  - start: '01:13.020'
    end: '01:18.720'
    original: 拘束衣を纏い蒼い硝子を、破りかけた腕に刻む傷を
    english: Clad in a straitjacket, slicing wounds into the azure glass of her trembling
      arms...
  - start: '01:19.020'
    end: '01:24.520'
    original: 犯された内臓に縫うガーゼを、宝飾で飾った白いドレスを
    english: Gauze sewing into violated innards, a white dress adorned with jewels...
  - start: '01:24.820'
    end: '01:30.820'
    original: 朽ちゆくたび取り繕って、恋を謳って、また医者は
    english: Patching her up each time she decays, singing of love, the doctor...
  - start: '01:31.020'
    end: '01:36.520'
    original: 手を染め続けた
    english: Continued to stain his hands.
  - start: '02:00.020'
    end: '02:05.520'
    original: やがて暴かれたのは醜い怪物で、それを創り上げた医者は弁駁を叫んだ
    english: What was eventually exposed was an ugly monster, and the doctor who created
      it cried out in protest...
  - start: '02:13.020'
    end: '02:18.520'
    original: 「これは永遠の恋だ。彼女の願望だ。」
    english: '"This is eternal love. It is her desire."'
  - start: '02:18.820'
    end: '02:24.520'
    original: 死にゆくと決めたお前らが、見棄てた女じゃないか
    english: '"Isn''t she the woman you abandoned, you who chose to die?"'
  - start: '02:24.820'
    end: '02:30.420'
    original: 嗚呼……哀しき花嫁。物言えぬままで、
    english: Ah... sorrowful bride. Remaining unable to speak,
  - start: '02:30.820'
    end: '02:36.520'
    original: 今宵ふたりは裁かれる。彼女を見棄てた人たちの正義で
    english: Tonight the two are judged, by the justice of the people who abandoned
      her.
  - start: '02:36.820'
    end: '02:42.520'
    original: 正しいのはだれ？
    english: Who is in the right?
  - start: '03:21.820'
    end: '03:26.420'
    original: さて、ハロウィンパーティもついにフィナーレ！
    english: Now, the Halloween party has finally reached its finale!
  - start: '03:26.520'
    end: '03:31.720'
    original: ここでご参加くださった国民の皆様へ冥界からのお土産のご紹介です。
    english: Here, we would like to introduce the souvenirs from the underworld for
      all the citizens who participated!
  - start: '03:32.020'
    end: '03:41.020'
    original: お土産品は全4種類！フルセットでご購入いただいた皆様には特典もございます。ご一緒に詳しく見ていきましょう。
    english: There are 4 types of souvenirs in total! For everyone who purchased the
      full set, there are also special bonuses. Let's take a closer look together.
  - start: '03:42.020'
    end: '04:09.520'
    original: まず1つ目！今回の冥界ハロウィンナイトをイメージしたワイドラバーマットです。国王様の横には冥界の女王の姿が！なお、ナイラというそうです。冥界のハロウィンを存分に楽しんでほしいという気持ちを込めた彼女のイメージソングもこの後お披露目予定なので、お楽しみに！素敵なイラストはマッチャ様に描いていただきました！
    english: First one! This is a wide rubber mat imagining this Underworld Halloween
      Night. Next to the King is the figure of the Queen of the Underworld! Apparently,
      her name is Naira. Her image song, filled with the desire for you to fully enjoy
      the underworld Halloween, is scheduled to be unveiled after this, so please
      look forward to it! The wonderful illustration was drawn by Matcha-sama!
