  - start: '03:32.020'
    end: '03:41.020'
    original: お土産品は全4種類！フルセットでご購入いただいた皆様には特典もございます。ご一緒に詳しく見ていきましょう。
    english: There are 4 types of souvenirs in total! For everyone who purchased the
