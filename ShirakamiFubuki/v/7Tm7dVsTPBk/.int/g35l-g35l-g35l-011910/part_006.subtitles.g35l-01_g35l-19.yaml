global_summary:
  overall_summary: 【#冥ハロ2025】白上フブキ生誕３DLIVE「冥界Halloween Night!」 is a birthday 3D live
    stream hosted by Hololive's Shirakami Fubuki on October 5, 2025. Set within the
    magical fantasy universe of FBKINGDOM, specifically its deep underworld library
    and party hall, the live stream weaves a theatrical dark-fantasy storybook narrative
    narrated through paper-theater interludes and spooky Halloween music performances.
    Fubuki is joined by multiple Hololive guest stars—Sakura Miko, Omaru Polka, Amane
    Kanata, Nekomata Okayu, Ookami Mio, Takane Lui, and the twin demons Fuwawa & Mococo
    Abyssgard—performing a rich setlist of atmospheric, eerie, and energetic songs
    including her new original track '冥界Halloween Night!'.
