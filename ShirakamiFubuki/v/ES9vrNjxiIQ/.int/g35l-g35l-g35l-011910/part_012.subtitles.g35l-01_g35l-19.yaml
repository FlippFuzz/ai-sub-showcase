    Hololive 1st Generation virtual idol Shirakami Fubuki hosts a grand musical festival
    set within her fictional realm, ''FBKINGDOM''. The broadcast features stellar
    musical performances of her iconic songs and new releases, interspersed with comedy
    sketches and a 3D card battle game segment involving guest stars Sakura Miko and
    Hoshimachi Suisei. The stream culminates in major milestone announcements, including
    the reveal of her new national anthem ''Bokura no Seiza'' (composed by Revo),
    the official album ''FBKINGDOM "Blessing"'', and the historic announcement of
    her 1st solo live concert ''FBKINGDOM “ANTHEM”'' at Pia Arena MM in February 2025.'
