  original: のっくのっく心をあけて
  english: '...knock, knock, open your heart...'
- start: '00:56.553'
  end: '01:00.223'
  original: もええぶりしんぐすこのふねにのって
  english: Burn everything, board this ship...
- start: '01:00.223'
  end: '01:03.963'
  original: もう一回こんこんこん
  english: Once more, Kon-kon-kon!
- start: '01:05.873'
  end: '01:09.113'
  original: いえそんなキツネにばかされて
  english: Yeah, being fooled by that fox...
- start: '01:09.113'
  end: '01:12.443'
  original: のっくのっく心をあけて
  english: '...knock, knock, open your heart...'
- start: '01:12.783'
  end: '01:16.403'
  original: うええとんすミュージックほらあそこまでいくよ
  english: Way up to the top, to the music, hey, we're going all the way over there!
- start: '01:16.593'
  end: '01:19.893'
  original: いまきゅうのまんなかちゅーにんぐ
  english: Tuning right to the center of the earth now!
- start: '01:19.983'
  end: '01:23.713'
  original: もうこんこんこんまほうをかけて
  english: Once more, cast a magic spell...
- start: '01:23.713'
  end: '01:27.103'
  original: うえうえきるとまできゃっち
  english: Catch it until it reaches the very top!
- start: '01:51.056'
  end: '01:55.796'
  original: ふう、ここんみっつ楽しかったけど この身体大変だよ！
  english: Phew, KONKON Beats was so much fun, but this body is so tough!
- start: '01:57.906'
  end: '02:03.956'
  original: いやでもさ、スコブなかなかやりるやん。白上の体を使いこなしておる。
  english: But you know, Sconbu is doing pretty well. You're handling Shirakami's
    body pretty adeptly.
- start: '02:03.956'
  end: '02:06.666'
  original: でもさ、やっぱねこの身体が恋しいよね？
  english: But still, you miss this body, right?
- start: '02:07.036'
  end: '02:09.586'
  original: ああ、やっぱりそうだよね。スコブはこの身体じゃなきゃね。
  english: Ah, of course. Sconbu's gotta be in this body, after all.
- start: '02:09.916'
  end: '02:15.826'
  original: でもまあ白上もねこんな経験なかなか無いからさ、最後にちょっと記念撮影しようや。ねっ！
  english: But hey, Shirakami rarely gets an experience like this, so let's take a
    commemorative photo at the end. Right!
- start: '02:16.826'
  end: '02:20.006'
  original: よしじゃあちょっと持ち上げてもらおうかな。持ち上げてくれ！
  english: Alright, then please pick me up. Lift me up!
- start: '02:20.126'
  end: '02:22.566'
  original: よいしょ、よいしょ。
  english: Heave-ho, heave-ho...
- start: '02:22.616'
  end: '02:27.426'
  original: おっ、しょ！うわ、浮いたーー！ははは！お写真撮ってー！
  english: Whoa! Wow, I'm floating! Haha! Take a picture!
- start: '02:32.406'
  end: '02:35.886'
  original: よいしょ、ありがとうロスティくり。よいしょ、はっしゃあ！
  english: There, thank you Rusticuri. Yo-heave-ho! There we go!
- start: '02:36.956'
  end: '02:40.806'
  original: じゃあそろそろね、元の身体にお互い戻りましょう！
  english: Alright, let's get back to our original bodies soon!
- start: '02:41.226'
  end: '02:46.366'
  original: よいしょ！多分ねこのへんに来れば魔法人が出てくるはずだから。では行きますよ！
  english: Heave-ho! If we come around here, the magic circle should appear. Here
    we go!
- start: '02:47.056'
  end: '02:49.036'
  original: いでよ、魔法陣！
  english: Appear, magic circle!
- start: '02:51.506'
  end: '02:59.216'
  original: うわっ！きたぁー！戻れるのかぁ！？うわぁー！
  english: Whoa! It's here! Can we go back?! Whoa!
- start: '03:00.676'
  end: '03:01.326'
  original: うわっ、戻れたー！
  english: Whoa, we're back!
- start: '03:02.136'
  end: '03:04.916'
  original: やったー！よかった！よかった！スコブちゃんとうスコブ？
  english: Yay! Thank goodness! Are you okay, Sconbu?
- start: '03:07.136'
  end: '03:08.576'
  original: ああ、スコブっ！
  english: Ah, Sconbu!
- start: '03:08.836'
  end: '03:11.856'
  original: やっぱその身体が一番いいね。ねえ、ありがとう！
  english: That body really suits you best. Hey, thank you!
- start: '03:12.756'
  end: '03:20.766'
  original: よし、じゃあスコブ、このまま一緒に歌いたいけども、次の曲はちょっと白上頑張るから、またねあのステージの前で応援しててくれ！気をつけてー！
  english: Alright, Sconbu, I'd love to keep singing together like this, but for the
    next song Shirakami's gonna do her best, so cheer me on in front of the stage
    again! Take care!
- start: '03:22.956'
  end: '03:31.056'
  original: かわいい。もうさりげなくかわいいねスコブね。え、見てくれてるスコブの民もかわいいぞ！
  english: So cute... Sconbu is so casually cute. Hey, all you Sconbu citizens watching
    are cute too!
- start: '03:32.066'
  end: '03:37.406'
  original: ではではでは、まだまだ応援してくれますよね？ねえ、ありがとう！
  english: Well then, you'll keep cheering us on, right? Hey, thank you!
- start: '03:37.956'
  end: '03:41.676'
  original: よし！では、次の曲いきましょう！次の曲は、「LETTER☆彡」！
  english: Alright! Now, let's move on to the next song! The next song is "LETTER☆彡"!
- start: '03:47.168'
  end: '03:51.988'
  original: Dear my friend ありがとうを込めて 君の名をかけがえのない光
  english: Dear my friend, wrapping up my gratitude, your name is an irreplaceable
    light.
- start: '04:06.708'
  end: '04:15.088'
  original: 見失ったって頑張れるだって 言葉一つでも願いを奪う げかいと呼ばれたって 生きる理由は何です
  english: Even if we lose sight of things, even if we do our best, even a single
    word can steal away our wishes. Even if it's called a lower world, what is the
    reason to live?
- start: '04:15.908'
  end: '04:20.218'
  original: 凹んだって見失ったって また私を照らしてくれる
  english: Even if we feel down, even if we lose our way, you light me up once again.
- start: '04:20.218'
  end: '04:25.568'
  original: 心は静かにさみされて 気絶しちゃいそうです
  english: My heart is quietly loneliness-stricken, I feel like I'm going to faint.
- start: '04:26.028'
  end: '04:34.508'
  original: 一生懸命な姿に何度も勇気をもらったから 今度は私が出会える人になりたい
  english: Because your earnest figure gave me courage time and time again, this time
    I want to become someone who can meet you.
- start: '04:39.908'
  end: '04:42.138'
  original: 舞台千年の夜の坂
  english: The slope of the thousand-year stage night...
- start: '04:42.828'
  end: '04:47.028'
  original: Dear my friend 大好きがあふれた この想い手紙に書いて送ります
  english: Dear my friend, overflowing with love, I'll write these feelings in a letter
    and send it to you.
- start: '04:52.348'
  end: '04:59.698'
  original: 夢描いて 夢を叶えて 君の笑顔が私のエール
  english: Drawing dreams, making dreams come true, your smile is my cheer!
