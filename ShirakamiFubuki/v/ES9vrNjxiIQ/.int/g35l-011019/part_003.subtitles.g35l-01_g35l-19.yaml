    english: If you want to use it, just shout "Shuffle Chance!" during the game,
      and I'll go "Bububububu!" and do it.
  - start: '03:22.804'
    end: '03:34.544'
    original: そっちスコンブだから！あぶさんね、ちゃんと覚えてね。
    english: You're Sconbu over there! Abu-san, remember properly.
  - start: '03:34.804'
    end: '03:41.044'
    original: ただし、残りの手札が1枚の時にシャッフルチャンスは使えないものとします。
    english: However, Shuffle Chance cannot be used when your remaining hand is 1
      card.
  - start: '03:41.204'
    end: '03:54.544'
    original: このシャッフルチャンスはゲーム始める前にじゃんけんをして勝った方に与えられます。逆に負けた方は先にカードを引く権利が与えられますというルールになっております。
    english: This Shuffle Chance is given to the winner of rock-paper-scissors played
      before the game starts. Conversely, the loser is given the right to draw cards
      first.
  - start: '03:55.004'
    end: '04:13.544'
    original: はい、まあ簡単なババ抜きと神経衰弱がなんかこう混ざったようなやつね。じゃあちょっとやっていきますか？そうですね。じゃあ、シャッフルチャンス忘れないようにしなきゃいけないね。絶対忘れないでくださいね。
    english: Yes, well, it's like a mix of simple Old Maid and Concentration. So shall
      we try doing it? Exactly. Then we mustn't forget Shuffle Chance. Please absolutely
      don't forget it.
  - start: '04:13.804'
    end: '04:22.544'
    original: そういうことね。あのスコムブのふぶき、ふぶふぶきのスコムブ。
    english: That's right. Sconbu's Fubuki, Fubu-fubuki's Sconbu.
  - start: '04:23.004'
    end: '04:36.544'
    original: じゃあちょっとね、ふぶさんっていうかスコムブこそぐさい。え？みこさんとチーム組むってこと？いや、それではないよ。
    english: Well then, Fubu-san, or rather Sconbu is ticklish. Eh? Team up with Miko-san?
      No, that's not it.
  - start: '04:37.004'
    end: '04:42.544'
    original: じゃあまず1回目は…スコムブかくふぶさんね。ふぶさんね。
    english: Well then, first time is... Sconbu-style Fubu-san. Fubu-san.
  - start: '04:42.804'
    end: '04:50.544'
    original: ふぶさん、文句スイッチー！こんにちはスコムブさん。白コムだよ。
    english: Fubu-san, complaint switch! Hello Sconbu-san. It's white combu.
  - start: '04:50.804'
    end: '04:59.544'
    original: じゃあまず、まあ真剣勝負ということでじゃんけんからやっていきますかね。じゃんけん！準備です。
    english: Well then first, as a serious match, let's start with rock-paper-scissors.
      Rock-paper-scissors! Get ready.
