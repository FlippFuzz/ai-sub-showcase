global_summary:
  overall_summary: This video is the 2026 Birthday 3D Live stream of Hololive 1st
    Gen and Gamers VTuber Shirakami Fubuki, titled 'Fox Room!!' (#ふぉっくするーむ), streamed
    on October 5, 2026. Set within her fictional kingdom 'FBKINGDOM' (フブキングダム), the
    live adopts a 'Full Idol' (全力アイドル) theme blended with an eerie, surreal Backrooms-esque
    narrative progression. Fubuki performs a vibrant setlist of idol tracks, energetic
    pop songs, and atmospheric ballads both solo and alongside guest idols including
    Natsuiro Matsuri, Kazama Iroha, Amane Kanata, Shirogane Noel, Houshou Marine,
    Ookami Mio, Sakura Miko, and Hoshimachi Suisei. The stream culminates in the debut
    of her original song 'FOXXXROOM' and concludes with major promotional announcements
    for her birthday merchandise, the 'Fubuki Kingdom no Sato' theme park collaboration
    at Miroku no Sato, and a tie-up with the hololive OFFICIAL CARD GAME.
