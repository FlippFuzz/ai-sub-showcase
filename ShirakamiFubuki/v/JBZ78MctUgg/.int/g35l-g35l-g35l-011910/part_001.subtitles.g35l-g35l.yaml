        },
        {
          "start": "00:07.710",
          "end": "00:11.230",
          "original_text": "パトラさんに連絡しますねって言われて、おちょ、やったー！",
          "english_translation": "And told me, \"I'll contact Patra-san,\" and I was like, \"Oh, yay!\""
        },
        {
          "start": "00:11.530",
          "end": "00:18.990",
          "original_text": "そうなんですよ。なんか急にさ、あの、そうマネちゃんさんから連絡来て、パトラ、え、なんかやっちゃった！と思って、",
          "english_translation": "That's right. Suddenly, you know, I got a message from the manager, and I thought, \"Patra, wait, did I do something wrong?!\""
        },
        {
          "start": "00:18.990",
          "end": "00:22.090",
          "original_text": "怒られる！と思ったら、つ、違ったね。",
