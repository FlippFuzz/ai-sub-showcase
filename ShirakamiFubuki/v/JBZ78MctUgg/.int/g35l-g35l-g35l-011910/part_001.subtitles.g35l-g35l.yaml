          "original_text": "なんかね、その配信聞いてたらしくて、",
          "english_translation": "Apparently, they were listening to that stream,"
        },
        {
          "start": "00:02.450",
          "end": "00:04.670",
          "original_text": "いや違ったか。『やりましょう！』みたいなのを",
