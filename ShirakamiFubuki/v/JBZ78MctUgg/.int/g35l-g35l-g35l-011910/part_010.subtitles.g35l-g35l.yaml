global_summary:
  overall_summary: This YouTube 3D collaboration video features Hololive virtual fox
    Shirakami Fubuki and independent virtual creator Suou Patra celebrating the release
    of Fubuki's ASMR voice pack 'Comfy Fox Inn' (白狐のおもてなし宿), which Patra fully produced.
    The video opens with humorous banter about the chaotic ear-themed 3D studio, followed
    by a profile introduction of Patra, a surreal tasting segment of Patra's homemade
    'kanikama pudding', and behind-the-scenes stories of recording the ASMR voice
    pack. Afterwards, they host the 'ASMR Omimikuji Championship', where drawing fortune
    slips with eccentric themes leads to ASMR voice acting designed to pop giant ears
    scattered around the studio. The stream concludes with a high-energy live performance
    of 'Mikan no Uta' by SEX MACHINEGUNS with Patra playing electric guitar, followed
    by reading hilarious ASMR reviews from fellow Hololive members like FUWAMOCO and
    Yuzuki Choco.
