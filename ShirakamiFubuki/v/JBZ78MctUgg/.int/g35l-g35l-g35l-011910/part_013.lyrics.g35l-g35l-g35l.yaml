- start: '04:20.470'
  end: '04:36.570'
  original: ボイスを作らせていただきました！いっこからでも購入できるというね！そうなんですよ！ね、気になるシチュエーション聞くもよし、もちろん全部聞くもよしなんですけども、こちら全部聞くとなんと約45分弱ぐらいある！本当にながいASMRとなっております！
