  original: 耳かき音鑑賞ですね、もうもうパトちゃんがもう本当に全て担当してくれております！収録もねパトちゃんのあのスタジオの超本当にいいマイクといい設備でね、経由100で撮っておりますので、もう本当にハイクオリティなものとなっております！
