- start: '04:38.070'
  end: '04:52.790'
  original: あの30分ぐらいて言われて、作ったらね結構なっちゃった！そう！めちゃめちゃオーバーしてるけど、代わりにもう本当に大満足！大満足サービス！大満足サービスでございます！え、そしてですね、フルセットご購入いただきますと特典がございます！
  english: They told us around 30 minutes, but once we made it, it got pretty long!
