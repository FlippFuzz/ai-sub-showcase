  - start: '00:01.000'
    end: '00:03.500'
    original: このメンバーとか結構指定いるから...
    english: With members like this, we've got specified roles...
  - start: '00:03.500'
    end: '00:05.500'
    original: いける気がする！ 今なら！
    english: I feel like we can do it! Right now!
  - start: '00:05.500'
    end: '00:07.500'
    original: いける？ マジか！
    english: Can we? Really?!
  - start: '00:07.500'
    end: '00:09.500'
    original: わかんないけど、頑張りまーす！
    english: I don't know, but I'll do my best!
  - start: '00:09.500'
    end: '00:12.500'
    original: イエーイ！ 頑張っていきましょう！
    english: Yay! Let's do our best!
  - start: '00:12.500'
    end: '00:18.500'
    original: そうしてですね、今回なんですけども、遊ぶゲームが『絵とコトババトル』というゲームでございます！
    english: So then, the game we're playing this time is called "Picture and Word
      Battle"!
  - start: '00:18.500'
    end: '00:21.500'
    original: 絵とコトババトル？
    english: '"Picture and Word Battle"?'
  - start: '00:21.500'
    end: '00:28.500'
    original: ルール説明画像はこちらですね。絵とコトバからしりとりをひらめきましょう！
    english: Here is the rule explanation slide. Let's come up with a Shiritori chain
      from pictures and words!
  - start: '00:28.500'
    end: '00:35.000'
    original: 場のカードが示す言葉でしりとりを3つつなげるカードゲームです。
    english: It's a card game where you connect 3 words in a Shiritori chain using
      what the cards show.
  - start: '00:35.000'
    end: '00:43.000'
    original: 絵に書かれているものと言葉に当てはまるものをうまくつなげて素早くしりとりを完成させます。
    english: You connect what's drawn on the pictures and what fits the prompt word
      to quickly complete a Shiritori.
  - start: '00:43.000'
    end: '00:45.000'
    original: 素早く！？
    english: Quickly?!
  - start: '00:45.000'
    end: '00:55.000'
    original: どの絵から使っても良し、どんな言葉で表しても良し、絵の一部に注目しても良し。自由な発想でしりとりを作ることを楽しむひらめきカードゲームでございます！
    english: You can start from any picture, express it with any word, or focus on
      a part of a picture. It's an inspiration card game where you enjoy creating
      Shiritori with free-form ideas!
  - start: '00:55.000'
    end: '01:00.000'
    original: へえ〜！ 3つも考えるの大変じゃない？
    english: Whoa~! Isn't it hard to think of 3 words?
  - start: '01:00.000'
    end: '01:04.000'
    original: ねー！ 確かに！ ひらめきゲームだ！
    english: Right?! Definitely! It's an inspiration game!
  - start: '01:04.000'
    end: '01:08.500'
    original: そう、ひらめいてほしいんですけど、ちょっとじゃあテストで1回やってみましょうか！
    english: Yeah, I want you to be inspired. So let's try a practice round first!
  - start: '01:08.500'
    end: '01:12.000'
    original: おー！ テスト問題！ やってみよう！
    english: Ooh! Practice question! Let's try it!
  - start: '01:12.000'
    end: '01:18.000'
    original: ではまずですね、絵を4つ出します。
    english: First, I'm going to put out 4 pictures.
  - start: '01:18.000'
    end: '01:25.500'
    original: お！ なるほどね！ おお〜！
    english: Ooh! I see! Ooh~!
  - start: '01:25.500'
    end: '01:31.000'
    original: で、言葉を出した瞬間に皆さん考えてくださいね。
    english: And the moment I show the prompt word, everyone start thinking.
  - start: '01:31.000'
    end: '01:36.000'
    original: わかった人から「わかった！」って手を挙げて立ち上がってください。
    english: Whoever gets it, please raise your hand, say "I got it!", and stand up.
  - start: '01:36.000'
    end: '01:42.000'
    original: ではまずテスト問題1問目。「おそいもの」。
    english: 'First practice question: "Something slow".'
  - start: '01:42.000'
    end: '01:48.500'
    original: 絵と言葉と絵を組み合わせてしりとりをしてください。
    english: Combine picture + prompt word + picture to make a Shiritori chain.
  - start: '01:48.500'
    end: '01:53.000'
    original: えー！？
    english: Ehh?!
  - start: '01:53.000'
    end: '01:56.000'
    original: はい！
    english: Yes!
  - start: '01:56.000'
    end: '02:05.500'
    original: 早い！ おかゆどうぞ！ / アフロ！ ロバ！ バナナ色の夜！
    english: So fast! Go ahead, Okayu! / Afro! Donkey! Banana-colored night!
  - start: '02:05.500'
    end: '02:11.500'
    original: これ夜じゃない！ 夕方でしょこれ！ バナナ色の夜！？
    english: That's not night! This is evening! "Banana-colored night"?!
  - start: '02:11.500'
    end: '02:20.000'
    original: だいぶあれだね、芸術家のセンスだねー！ / ありがとう、褒められた〜
    english: You really have an artist's sensibility! / Thank you, I'm flattered~
  - start: '02:20.000'
    end: '02:27.500'
    original: これ、皆さん的にはアリですか？ / ナシ！ ナシナシ！
    english: Is this acceptable to everyone? / No way! Nope nope!
  - start: '02:27.500'
    end: '02:37.000'
    original: 他になんか思いついた方いますか？ / 地味に難重そうになる、このゲーム...！
    english: Does anyone else have an idea? / This game actually seems kinda tough...!
  - start: '02:37.000'
    end: '02:40.500'
    original: はい！ / 早い！ はい、もう一度おかゆどうぞ！
    english: Yes! / Fast! Go ahead again, Okayu!
  - start: '02:40.500'
    end: '02:47.000'
    original: アフロ！ ロバ！ バサキの賄い！
    english: Afro! Donkey! Makanai (staff meal) at part-time job!
  - start: '02:47.000'
    end: '02:56.000'
    original: バイト先ってこと？ ああ、なるほど！ これを「賄い」と解釈したんですね！
    english: You mean place of part-time job? Ah, I see! So you interpreted this picture
