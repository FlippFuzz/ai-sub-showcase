  - start: '02:56.000'
    end: '03:02.000'
    original: 皆さん的にはアリですかね？ / アリ！
    english: Is this acceptable to everyone? / Acceptable!
  - start: '03:02.000'
    end: '03:11.000'
    original: ってなったら、おかゆに1ポイントが入りまして。で本番ではおかゆ、どちらかのカードを1個撤去することができます。
    english: If so, Okayu gets 1 point. And in the real game, Okayu can remove one
      of the cards.
  - start: '03:11.000'
    end: '03:20.000'
    original: で、もし「アフロ」ってなったら、新しいカードがまたここに来まして...あ、ごめんなさい、新しいカードがこれですね。
    english: And if "Afro" was removed, a new card comes here... Ah, sorry, the new
      card is this one.
  - start: '03:20.000'
    end: '03:27.500'
    original: ここから新しいカードになって、新しく言葉があって、この4つから考えるという形になります。
    english: It becomes a new card from here, with a new word prompt, and you think
      from these four.
  - start: '03:27.500'
    end: '03:31.000'
    original: なるほどねー！ やりたい！
    english: I see! I wanna play!
  - start: '03:31.000'
    end: '03:35.000'
    original: はい、とっても自由な発想で皆さんよろしくお願いします！
    english: So please use very free-form ideas, everyone!
  - start: '03:35.000'
    end: '03:41.500'
    original: これさ、フブちゃん！ おかゆだけ圧勝ってなったらフブちゃんこっちおいでよ！
    english: Hey, Fubu-chan! If Okayu completely crushes us, you come join us over
      here!
  - start: '03:41.500'
    end: '03:50.000'
    original: ふざけんな！ / おかゆみたいに自由な発想で皆さんも頑張ってください！
    english: Don't mess with me! / Everyone, please do your best with free thinking
      like Okayu!
  - start: '03:50.000'
    end: '03:59.000'
    original: なるほどね！ そしてですね、今回は先に5ポイント取った人が勝ちです！
    english: I see! And this time, the person who gets 5 points first wins!
  - start: '03:59.000'
    end: '04:06.000'
    original: え、でも楽しいね！ ヤバい！ だっておかゆが3連勝したらさ、すごく分かれちゃうよ！
    english: But it sounds fun! Oh no, if Okayu gets 3 wins in a row, the scores will
      be totally split!
  - start: '04:06.000'
    end: '04:11.000'
    original: そうだね！ 一番ヤバいのは5-0-0-0とかだよね！
    english: That's true! The worst would be 5-0-0-0!
  - start: '04:11.000'
    end: '04:18.000'
    original: まあでもそうなってしまったら、罰ゲームは1人でいいかなと思ってるので！
    english: Well, if that happens, I think having just 1 person do the punishment
      game is fine!
  - start: '04:18.000'
    end: '04:23.000'
    original: 罰ゲーム！？ 違いますよ！ 皆さんの目の前にありますでしょう、こちらです！ ドダン！
    english: Punishment game?! / No, it's not! Right in front of you all, look! Ta-da!
  - start: '04:23.000'
    end: '04:30.000'
    original: キャー！ 嫌だー！ 足つぼマッサージ！？
    english: Eeek! Nooo! A foot reflexology mat?!
  - start: '04:30.000'
    end: '04:38.000'
    original: 足つぼマッサージの上で、可愛くアイドルステップを踏んでもらおうと思います！
    english: I'll have you step cutely in an idol step on top of the foot reflexology
      mat!
  - start: '04:38.000'
    end: '04:46.000'
    original: えー！ フブちゃんもやんなきゃ！ やるわけねえだろ！
    english: Ehh! Fubu-chan should do it too! As if I would do it!
  - start: '04:46.000'
    end: '04:59.000'
    original: 恐ろしいやつだ、こいつ...！ なんか楽しくボドゲで吊られたんだ、俺たちはー！
