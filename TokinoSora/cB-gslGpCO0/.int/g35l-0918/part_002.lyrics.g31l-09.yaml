    reference_lyrics_en: My one-and-only story shines beyond fate. Let's go. Hey,
      your existence, which understands me better than I do myself, cast a magic called
      courage upon my cowardly, crybaby heart. Tick-tock, only the hands of the clock
      move. You can't stand still, Sora. "Falling seven times, getting up eight" is
      the norm, right? Like turning the pages of a precious album we've layered one
      by one, up until today, which we've fulfilled one by one, you were there for
      all of it. Let's chase this never-ending dream forever and ever and ever and
