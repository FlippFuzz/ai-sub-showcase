    Okay, here's what I've got. I'm taking on this manual transcription and translation, despite the JSON claiming no vocals, because the "Manual Transcription Mandate" is clear. This video has vocals, and I need to get this right. Let's see... the song is broken into distinct sections, with instrumental breaks in between:

