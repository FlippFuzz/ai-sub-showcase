- start: '04:17.800'
  end: '04:24.500'
  original: この道の展開も 悪くはないよね スイモアマイモ 集めたの そうよ どこから
  english: The unfolding of this path isn't bad either, both the sweet and the bitter,
    we gathered them, yes, from where?
- start: '04:25.100'
  end: '04:31.200'
  original: 成長できるかな 共に出発を 続けていこう なんとかして もっと 暖めてしまって
  english: Can we grow? Let's depart together, let's keep going, somehow, let's warm
    it up even more...
- start: '04:45.100'
  end: '04:54.200'
  original: みんなで行こうよ ケセラセラ…
  english: Let's all go together, Que sera sera...
