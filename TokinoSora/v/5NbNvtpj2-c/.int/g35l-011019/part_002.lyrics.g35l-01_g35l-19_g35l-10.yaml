  end: '00:16.700'
  original: 空へ 教えて ほら全部
  english: Tell the sky, show me everything...
- start: '00:17.200'
  end: '00:24.000'
  original: 何度時計の針 ぐるまっても 話を聞くよ
  english: '...no matter how many times the clock hands spin round, I''ll listen to
    your story.'
- start: '00:24.300'
  end: '00:30.150'
  original: あなたからの 笑えない この夢がきっと
  english: This earnest dream from you...
- start: '00:30.700'
  end: '00:39.100'
  original: ずっと 永遠に 焦ることのない時を 君にくれる
  english: '...will surely give you a timeless moment that never rushes.'
- start: '01:12.100'
  end: '01:21.800'
  original: ラ・ラ・ラ…
  english: La la la...
- start: '01:22.000'
  end: '01:28.100'
  original: みんな声を聞かせ合ってさぁ行こう
  english: Everyone, let's share our voices and go!
- start: '01:32.900'
  end: '01:42.200'
  original: どんなに詰め込んでも ゆらりしゃくしゃくで 雪が降るけど
  english: No matter how much we pack in, it sways clumsily as the snow falls...
- start: '01:42.500'
  end: '01:47.500'
  original: 君にだけ話してよ こらえ切れず一緒にいけたら
  english: '...talk only to me, if we can go together without holding it back.'
- start: '01:48.100'
  end: '01:55.600'
  original: 秘密の街も 私達のもの 新呼吸 落としては 分かってたこと そっけないで 笑っちゃおう
  english: The secret town is ours too, taking a deep breath and realizing what we
    knew, so don't be aloof, let's just laugh it off!
- start: '02:02.300'
  end: '02:08.500'
  original: 好きなんて最後に見つめを うまくいかないよだって 東京の夜よりも 家族して
  english: Finding love at the very last moment, it doesn't go well because even more
    than the nights in Tokyo, we gather as a family...
- start: '02:08.800'
  end: '02:16.300'
  original: ちゃんと繋いでて 硬いだけのホームの掛け声は いつも君が明るく鳴って 讃えてくれる
  english: Hold on properly, the shouting on the rigid platform, you always make it
    sound bright and praise me...
- start: '02:16.800'
  end: '02:22.100'
  original: ずっと 刻まれてるんだ この道の展開も 悪くはないよね スイモアマイモ
  english: It's engraved forever, the unfolding of this path isn't bad either, both
    the sweet and the bitter...
- start: '02:24.300'
  end: '02:30.900'
  original: 集めたの そうよ どこから 成長できるかな 共に出発を
  english: We gathered them, yes, from where? Can we grow? Let's depart together!
- start: '02:31.200'
  end: '02:37.400'
  original: 続けていこう なんとかして もっと 暖めてしまって
  english: Let's keep going, somehow, let's warm it up even more...
- start: '02:40.100'
  end: '02:46.800'
  original: 道の展開も 悪くはないよね スイモアマイモ 集めたの そうよ どこから 成長できるかな 共に出発を
  english: The unfolding of this path isn't bad either, both the sweet and the bitter,
    we gathered them, yes, from where? Can we grow? Let's depart together!
- start: '02:50.100'
  end: '02:56.300'
  original: 続けていこう なんとかして もっと 暖めてしまって
  english: Let's keep going, somehow, let's warm it up even more...
- start: '02:58.200'
  end: '03:04.900'
  original: ずっと 大好きは単純なまま行こう この仕方ない日を ほら 一瞬で動くの
  english: Let's keep going with our simple love, this unavoidable day, look, moving
    in a flash...
- start: '03:05.400'
  end: '03:12.100'
  original: 昨夜よりも 加速して ちゃんと繋いでて 硬いだけのホームの掛け声は
  english: Accelerating even more than last night, holding on properly, the shouting
    on the rigid platform...
- start: '03:13.100'
  end: '03:20.100'
  original: いつも君が明るく鳴って 讃えてくれる ずっと 刻まれてるんだ この道の展開も
  english: You always make it sound bright and praise me, it's engraved forever, the
    unfolding of this path...
- start: '03:20.800'
  end: '03:26.500'
  original: 悪くはないよね スイモアマイモ 集めたの そうよ どこから 成長できるかな
  english: Isn't bad either, both the sweet and the bitter, we gathered them, yes,
    from where? Can we grow?
- start: '03:29.100'
  end: '03:34.200'
  original: 共に出発を 続けていこう なんとかして もっと 暖めてしまって
  english: Let's depart together, let's keep going, somehow, let's warm it up even
    more...
- start: '03:51.200'
  end: '03:59.200'
  original: ラ・ラ・ラ…
  english: La la la...
- start: '04:02.100'
  end: '04:09.100'
  original: うまく行かないよだって 東京の夜よりも 家族して ちゃんと繋いでて
  english: It doesn't go well because even more than the nights in Tokyo, we gather
    as a family, holding on properly...
- start: '04:09.800'
  end: '04:17.100'
  original: 硬いだけのホームの掛け声は いつも君が明るく鳴って 讃えてくれる ずっと 刻まれてるんだ
  english: The shouting on the rigid platform, you always make it sound bright and
