  original: まだ　光はなく
  english: Still without light...
- start: '00:04.500'
  end: '00:15.000'
  original: 右と左の　翼は　傷つき揺れてる
  english: My right and left wings are wounded and trembling...
- start: '00:16.000'
  end: '00:29.000'
  original: おだやかな日々　信じながら　愛していると　伝えたくて　伝えたいのは
  english: Believing in peaceful days, wanting to say I love you, what I want to convey
    is...
- start: '00:30.000'
  end: '00:37.000'
  original: 忘れてほしい　明日を生きてるための
  english: I want you to forget, in order to live for tomorrow...
- start: '00:37.500'
  end: '00:46.000'
  original: 芽に生まれ変わった　桜の下で　また会おうね
  english: Underneath the cherry blossoms reborn as buds, let's meet again.
- start: '00:46.000'
  end: '00:52.000'
  original: まち焦がれた季節の中で　共に歩こう
  english: Let's walk together in the long-awaited season.
- start: '00:52.500'
  end: '01:00.000'
  original: この心を染め抜いた花よ　あなたに届け
  english: Oh flower that dyed this heart, reach you!
- start: '01:00.500'
  end: '01:04.500'
  original: 誇り高き鳥と歌う　名もなき風に
  english: Singing with the proud bird, to the nameless wind...
- start: '01:27.000'
  end: '01:36.000'
  original: 大切なものは　いつの時代も　変わらないこと
  english: What is precious remains unchanged in every era.
- start: '01:37.000'
  end: '01:46.000'
  original: 人は知りながら　過ちを　なぜ繰り返す
  english: Knowing this, why do people repeat their mistakes?
- start: '01:46.500'
  end: '01:51.000'
  original: 生まれて
  english: Born...
- start: '01:51.000'
  end: '01:57.000'
  original: 桜の下で　また会おうね
  english: '...under the cherry blossoms, let''s meet again.'
- start: '01:57.500'
  end: '02:04.000'
  original: きっとその時には　笑って　平穏を誓おう
  english: Surely at that time, let's smile and pledge peace.
- start: '02:04.500'
  end: '02:14.500'
  original: 愛し愛されてこの命は　芽吹いて咲いて
  english: Loved and loving, this life buds and blooms...
- start: '02:15.000'
  end: '02:22.000'
  original: 色褪せないまなざしを胸に　舞い散る願い
  english: With an unfading gaze in my heart, my scattering wish...
- start: '02:23.000'
  end: '02:40.000'
  original: あなたに　あなたに　あなたに　誰かいて
  english: To you... To you... To you... Let someone be there...
- start: '03:23.000'
  end: '03:31.000'
  original: '[Title: 命に嫌われている。]'
  english: '[Title: Hated by Life Itself.]'
- start: '03:42.500'
  end: '03:50.000'
  original: 死たいなんて言うなよ。あきらめないで生きろよ。
  english: Don't say you want to die. Don't give up, live on.
- start: '03:50.500'
  end: '03:55.500'
  original: そんな歌が正しいなんて馬鹿げてるよな。
  english: The idea that songs like that are right is just absurd.
- start: '03:56.000'
  end: '04:01.000'
  original: 実際自分は死んでもよくて
  english: Honestly, it'd be fine if I died,
- start: '04:01.500'
  end: '04:10.000'
  original: 周りが死んだら悲しくてそれが嫌だからっていうエゴなんです。
  english: but if those around me died I'd be sad, and I hate that—it's just pure
    ego.
- start: '04:10.500'
  end: '04:17.500'
  original: 他人が生きてもどうでもよくて　誰かを憎むこともファッションで
  english: I couldn't care less if strangers live, hating someone is just a fashion
    statement,
- start: '04:18.000'
  end: '04:22.500'
  original: それでも平穏に生きようなんて素敵なことでしょう。
  english: yet wishing to live in peace is such a wonderful thing, right?
- start: '04:23.000'
  end: '04:30.000'
  original: 画面の先では誰かが死んで　それを嘆いて誰かが歌って
  english: Beyond the screen someone dies, someone mourns it and sings about it,
- start: '04:30.500'
  end: '04:40.000'
  original: それに感化された少年がナイフを持って走った
  english: and a boy influenced by that ran off holding a knife.
- start: '04:40.500'
  end: '04:49.000'
  original: 僕らは命に嫌われている。コンプレックスを押し付けて
  english: We are hated by life itself. Imposing our complexes,
- start: '04:49.500'
  end: '05:00.000'
  original: いつも誰かを殺したい歌を簡単に電波で流した
  english: always broadcasting songs wishing someone dead easily across the airwaves.
