global_summary:
  overall_summary: This video features Tokino Sora's 2025 birthday live celebration
    stream titled 『【#ときのそらお披露目誕生日2025】うれしい告知あり！ゲストあり！理想のライブはここにある』. Throughout the
    concert, Tokino Sora delivers stellar musical performances of iconic tracks such
    as 'スタースタースタート', 'さくらびと', '命に嫌われている。', '限りなく灰色へ', 'コンプレックス・イマージュ', 'エレクトリカル・サーフィン',
    'アンデッド', and 'Swallow Tail'. She is joined by special guest VTubers and singers
    including 緋月ゆい, 富士葵, 彩音, 轟はじめ, and 儒烏風亭らでん for emotional duets and entertaining
    banter. Mid-stream, she reveals her stunning new short-hair monochrome outfit
    ('モノトーン絶対領域パンツ'), introduces her tiered 'Ankimo' and 'Nun-nun' stage decorations,
    announces birthday merchandise and a new digital single/MV ('Swallow Tail'), and
    concludes with a heartfelt celebration with her fans (Soratomo).
