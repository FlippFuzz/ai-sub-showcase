      to make it cherry blossoms, but also...
  - start: '04:42.100'
    end: '04:56.250'
    original: あとここにある星があったりとか、ここね、とか、なぜかぬんぬんが増えてるだとか、ちょっとね、いろんなねバージョンアップがあるんですよ。
    english: And there are stars over here, and right here, and somehow nunnun are
      multiplying, and there are various version upgrades, you know?
  - start: '04:56.250'
    end: '04:59.850'
    original: ぜひぜひそちらのね、ステージも楽しみながら見てもらえたら嬉しいな。
    english: I'd be so happy if you could enjoy watching that stage as well!
