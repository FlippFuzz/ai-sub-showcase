  english: Crossing an ocean bluer than the sound of waves,
- start: '00:14.980'
  end: '00:18.720'
  original: いつだってそう、それでいいよ
  english: It's always been that way, and that's fine.
- start: '00:18.960'
  end: '00:22.880'
  original: 自由な青の空へ
  english: Toward the free blue sky.
- start: '00:27.180'
  end: '00:31.420'
  original: ならば呼ぶのは…
  english: If so, what calls out is...
- start: '00:33.220'
  end: '00:39.920'
  original: ステップ、ステップ、ステップ…
  english: Step, step, step...
- start: '01:20.100'
  end: '01:25.400'
  original: 確かに緑色を乗せて
  english: Carrying a sure green color within,
- start: '01:25.800'
  end: '01:28.900'
  original: 祝い祝うな夢を描く
  english: Drawing dreams of celebration...
- start: '01:29.200'
  end: '01:31.800'
  original: 現実（リアル）はそのまま
  english: Reality remains as it is,
- start: '01:32.400'
  end: '01:39.800'
  original: 終われなくて
  english: Unable to end...
- start: '01:40.900'
  end: '01:49.800'
  original: 言葉を永遠と探し続けて
  english: Continuously searching for words eternally,
- start: '01:50.000'
  end: '01:53.100'
  original: 何もかも足りたりなくて
  english: Feeling like nothing is ever enough,
- start: '01:53.300'
  end: '01:56.800'
  original: サンサンと降る夕立を
  english: The sudden evening shower pouring down brightly,
- start: '01:57.100'
  end: '02:00.100'
  original: 体中感じて
  english: Feeling it all over my body.
- start: '02:00.600'
  end: '02:03.900'
  original: 優しく寄り添って
  english: Nuzzling up gently,
- start: '02:04.200'
  end: '02:07.100'
  original: 心が晴れるのなら
  english: If it clears up the heart.
- start: '02:11.800'
  end: '02:17.800'
  original: 翼が生えたような
