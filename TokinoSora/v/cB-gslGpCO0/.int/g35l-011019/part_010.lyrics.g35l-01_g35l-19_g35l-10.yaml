- start: '02:42.500'
  end: '02:51.500'
  original: 名前を持たないならさ…君の側で
  english: If it has no name... right by your side...
- start: '02:52.000'
  end: '03:02.500'
  original: 涙がこぼれたなら
  english: If tears happen to fall,
- start: '03:04.200'
  end: '03:08.500'
  original: 触れ合うことのできない距離も
  english: Even the distance where we cannot touch,
- start: '03:15.200'
  end: '03:20.200'
  original: 信じてるよ
  english: I still believe in it.
- start: '03:22.000'
  end: '03:28.000'
  original: どうか歌うように聞いて
  english: Please listen as if singing...
- start: '03:35.000'
  end: '03:45.000'
  original: 木の下り坂　足がすくんで立てないよ
  english: On the downhill path under the trees, my legs freeze and I can't stand.
- start: '03:46.800'
  end: '04:00.500'
  original: 言葉紡いで歌うことがすべてだった
