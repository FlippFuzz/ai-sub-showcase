global_summary:
  overall_summary: This YouTube livestream event titled '【#ときのそらお披露目誕生日2026】１０年目に向けた最高のパフォーマンスを！～告知もあるよ～【ホロライブ/ときのそら】'
    celebrates Hololive 0th-generation virtual idol Tokino Sora's birthday and milestones
    leading to her 10th anniversary. Hosted in a stunning digital pulse and celestial-themed
    3D stage, Sora showcases new hairstyles, a jellyfish-themed room, and several
    high-energy solo and duet performances with guest stars including Dennou Shoujo
    Siro, Hizuki Yui, Isaki Riona, and Kazama Iroha. The stream also features major
    announcements such as her upcoming Pia Arena MM solo concert, birthday merchandise,
    trading card game tie-ins, and the premiere of her new original single '決意のソラへ'.
