  - start: '00:51.495'
    end: '00:56.395'
    original: その時の私は嬉しい気持ちと、驚きが混ざった心境でした。
    english: At that time, my feelings were a mix of joy and surprise.
  - start: '01:05.695'
    end: '01:08.275'
    original: 今ではホロライブのアイドルとして、走り続けて止まらないそらちゃんですが、デザイン当時は名前すらなく、「バーチャルJK」というキーワードがあるだけでした。
    english: Now Sora-chan is an unstoppable idol running onward as part of Hololive,
      but back when she was designed, she didn't even have a name—just the keyword
      "Virtual JK."
  - start: '01:09.195'
    end: '01:23.755'
    original: デザインから3Dモデルの完成まで1ヶ月弱という期間でしたが、私の中には「爽やかな学園アニメのような」「清で穏やかな」「よく晴れた早朝の空」というキーワードが固まっていました。
    english: From design to completed 3D model took less than a month, but in my mind,
      keywords like "like a refreshing school anime," "pure and gentle," and "a bright,
      clear early morning sky" had solidified.
  - start: '01:24.455'
    end: '01:28.695'
    original: どうでしょう、今のそらちゃんにもピッタリだと思いませんか？
    english: What do you think? Don't you think it fits the current Sora-chan perfectly?
  - start: '01:29.335'
    end: '01:39.115'
    original: これらのキーワードに合わせてデザインしていたので、「デザインから読み取っていただけたのかな…？」と思えるほどぴたりの印象だったんです。天才ですね笑
    english: I designed her around these keywords, so the impression was so spot-on
      that I thought, "Did they pick up on that from the design...?" She's a genius,
      haha.
  - start: '01:43.355'
    end: '01:51.715'
    original: さて、配信活動が始まってからしばらく経ったあとのお話、一時期、私には自信をなくしていた頃がありました。
    english: Now, moving on to a story from some time after streaming began, there
      was a period when I was losing confidence.
  - start: '01:52.335'
    end: '02:06.135'
    original: 先ほどお話しした初期の衣装デザインには、もう一つだけ盛り込んだキーワードがあります。それは…「無個性で、未完成な」今のそらちゃんからは思いつかないイメージですね。
    english: The early costume design I mentioned earlier has just one more keyword
      packed into it. That is... "devoid of personality, unfinished." It's an image
      you wouldn't associate with today's Sora-chan at all.
  - start: '02:06.915'
    end: '02:21.075'
    original: 当初、地味で華やかさの少ないデザインだったかと思います。当時の私はそらちゃんの個性を演出したい！という未来にかける希望よりも、持たせたい印象を優先してしまったのです。
    english: Back then, I think her design was plain and lacking in flashiness. At
      the time, rather than hope for the future—wanting to bring out Sora-chan's individuality—I
      prioritized the impression I wanted to give her.
  - start: '02:21.935'
    end: '02:30.335'
    original: 少し視点は違うかもしれませんが、ご自分を「水」と例えていたそらちゃんの苦悩は自分に通ずるところがありました。
    english: Though our perspectives might be slightly different, Sora-chan once compared
      herself to "water," and her struggles resonated with me.
  - start: '02:30.935'
    end: '02:40.495'
    original: ふと目に入ってしまった心無いコメントで傷ついたことがあれば、完璧なモデルに仕上げることができなかったことも、
    english: If I was hurt by unfeeling comments that caught my eye, and couldn't
