  - start: '00:34.555'
    end: '00:42.595'
    original: 活動を始めてからの年を数えるにも、もうすぐ片手では足りなくなってしまうんですね。感慨深いです。
    english: Counting the years since activities began, one hand will soon no longer
      be enough. It's deeply emotional.
  - start: '00:44.055'
    end: '00:50.855'
    original: 実は初めて名前を知ったのは、デビュー直前にふとTwitterで目にした告知ツイートでした。
    english: Actually, the first time I learned your name was right before your debut,
