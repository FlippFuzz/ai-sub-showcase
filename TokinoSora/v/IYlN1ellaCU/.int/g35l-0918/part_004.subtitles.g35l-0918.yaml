  - start: '00:17.815'
    end: '00:20.735'
    original: …せっかくですので、すこし思い出話をしようかと思います。
    english: '...Since I have the chance, I thought I''d share a few memories.'
  - start: '00:21.855'
    end: '00:27.135'
    original: ふと記憶を思い返してみると、あれからもうすぐ6年が経つようです。
    english: Looking back, it seems almost 6 years have passed since then.
  - start: '00:28.175'
    end: '00:34.215'
    original: 最近では、日々大きくなっていくそらちゃんとホロライブの羽ばたきが目に染みます。
    english: Lately, I've been deeply moved watching Sora-chan and Hololive grow larger
