    *   **03:09.500 - 03:13.800**: ASMR voice pack! Titled "I Hear It, Your Support,"
    *   **03:26.500 - 03:30.800**: Postcard with signature and bonus voice!

    Excellent, now let's make sure I nail the timings, every single one of those subtitles. This video is great! The Tokino Sora Birthday 2026 merch is looking super, as is the 9th Anniversary Party "Everyday of Light" live ticket sales. The pre-sale tickets for Pia Arena MM are finally available. And there's also an exclusive HoloKa card for those who get tickets to the show. The tickets also have another gift - a limited HoloCard!
