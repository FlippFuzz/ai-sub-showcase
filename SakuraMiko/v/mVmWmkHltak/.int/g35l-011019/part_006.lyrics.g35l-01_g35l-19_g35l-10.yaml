- start: '04:27.288'
  end: '04:30.338'
  original: ぼくらが育てた 大きな木は
  english: The big tree we grew...
- start: '04:32.418'
  end: '04:39.068'
  original: ほら こんなにも揺りかごのような場所になるのさ
  english: Look, it's become a cradle-like place, just like this!
