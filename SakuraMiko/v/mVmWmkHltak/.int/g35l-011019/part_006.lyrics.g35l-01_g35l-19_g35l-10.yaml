- start: '00:00.350'
  end: '00:05.570'
  original: 生まれたばかりの世界を豊かにするため 神の使いを創造しました。
  english: To enrich the newly born world, a messenger of the gods was created.
- start: '00:06.900'
  end: '00:08.530'
  original: 名を さくらみこ
  english: Her name is Sakura Miko.
- start: '00:09.900'
  end: '00:14.600'
  original: 神様のお使いはそっちのけで アイドルに出会いあこがれました
  english: Neglecting her duties as a divine messenger, she discovered idols and longed
    to be one.
- start: '00:15.600'
  end: '00:18.500'
  original: でも最初はうまくいきませんでした
  english: But at first, things didn't go well.
- start: '00:19.000'
  end: '00:23.200'
  original: そこにみこを支えようとみこぴーが集まってきました
  english: Then MikoPies gathered to support Miko.
- start: '00:24.000'
  end: '00:28.900'
  original: それからたくさんの仲間に出会い、努力し、頑張り続け、
  english: After that, she met many companions, worked hard, and kept doing her best,
- start: '00:29.800'
  end: '00:32.400'
  original: そして、みこは……
  english: and Miko...
- start: '01:02.000'
  end: '01:05.800'
  original: そんな私の夢はアイドルになることです
  english: My dream is to become an idol.
- start: '01:47.388'
  end: '01:51.688'
  original: ねえ 思い出したんだ そっと涙した日を
  english: Hey, I remembered the day I quietly shed tears.
- start: '01:52.928'
  end: '01:55.788'
  original: さあ 数えてみよう わがままこれまでおかした奇跡は
  english: Come on, let's count the miracles we've brought about this far...
- start: '01:58.378'
  end: '02:01.468'
  original: 一つ止まらない足で 二つ越えていく夢を
  english: With steps that never stop, and dreams we go beyond,
- start: '02:03.588'
  end: '02:09.918'
  original: 三つ繋がる絆は 君とひろげて紡いだよ
  english: the three intertwined bonds are what we spread and wove together with you!
- start: '02:10.438'
  end: '02:13.528'
  original: 何度でも咲くように 続いてくこの物語
  english: Like blooming over and over again, this story goes on...
- start: '02:14.628'
  end: '02:19.718'
  original: まだ見たことのない景色を 探しに行こう
  english: Let's go search for scenery we've never seen before!
- start: '02:21.018'
  end: '02:26.438'
  original: 花ひとつずつが小さくても ほら 支え合えたら 桜になれるよ
  english: Even if each flower is small, see, if we support each other, we can become
    cherry blossoms!
- start: '02:32.428'
  end: '02:35.858'
  original: ぼくらが繋いだ 大きな木はまだ
  english: The big tree we connected...
- start: '02:40.068'
  end: '02:46.408'
  original: これからも遥か風に乗って 伸びてくんだよ
  english: will continue to catch the distant wind and grow even further from now
    on!
- start: '02:56.288'
  end: '03:01.358'
  original: 一つ涙こぼれたら 二つ両手合わせいて
  english: If a single tear spills, put both hands together,
- start: '03:02.148'
  end: '03:05.908'
  original: 三つ数えてはじめよう 君となら大丈夫
  english: count to three and begin—it'll be okay if I'm with you.
- start: '03:06.668'
  end: '03:12.358'
  original: 弱音と本音で泣いたり 諦めかけたりルートも
  english: Even the routes where we cried with doubts and true feelings, or almost
    gave up,
- start: '03:13.258'
  end: '03:17.508'
  original: 振り返ってはにかみにつた 強く慣れたんだ
  english: looking back, we smiled through it and became stronger!
- start: '03:18.578'
  end: '03:22.958'
  original: さあ 枝ひとつずつじゃ脆くても ほら
  english: Now, even if each branch is fragile by itself, see...
- start: '03:23.978'
  end: '03:29.628'
  original: 支え合えたら 大切になれるよ
  english: if we support each other, we can become something precious!
- start: '03:33.278'
  end: '03:38.298'
  original: 枝たては あああ咲いた 形は花びら
  english: '...'
- start: '03:39.118'
  end: '03:44.200'
  original: この気持ち言葉すら越えて届けるのさ
  english: Delivering this feeling beyond mere words!
- start: '03:53.300'
  end: '03:59.818'
  original: さえない私は 好きになってくれたこと
  english: The dull me... the fact that you grew to like me...
- start: '04:00.678'
  end: '04:04.478'
  original: これからもバカになんてさせないよ 見ててね
  english: I won't let anyone make a fool of you from now on either, so please watch
    over me!
- start: '04:07.728'
  end: '04:14.938'
  original: 意地を張ったところも強くは大きくなったでしょ? ほら
  english: Even the times I stubbornly put up a front, I've grown strong and big,
    right? See,
- start: '04:15.938'
  end: '04:19.988'
  original: 今日は 寄り添う側になりたいから
  english: today, I want to be the one who leans on you, so...
- start: '04:20.000'
  end: '04:26.158'
  original: 空に願う星 涙を預けて そろそろ幕もいっぱい踏み込もう
  english: entrust your tears to the stars wishing upon the sky, and let's step fully
