      of everyone!
  - start: '03:07.497'
    end: '03:14.257'
    original: あのね、やっぱりKアリーナって大きいですから、まああのレベルセブンとかまでありますけどね、そんなみんなにも見てもらいたいので、みこたくさんできる限り近くに行って手振るから、みんなたくさん手振ってね。
    english: You know, K-Arena is really huge, and there are seats all the way up
      to Level 7, but I want everyone up there to see me too, so Miko will go as close
      as possible and wave, everyone wave back lots!
  - start: '03:28.977'
    end: '03:36.577'
    original: そして、マーチングバンドさんも一緒にパレードしてくれたり、みこだにゃんもね、いましたよね？
    english: And the marching band paraded with us too, and Miko-danyan was there
      as well, right?
  - start: '03:38.217'
    end: '03:44.477'
    original: いやあ、あいつ昼からすごい暴れてたらしいぞ。すごかったんだぞ。
    english: Man, apparently that guy was going wild since afternoon. It was something
      else.
  - start: '03:46.037'
    end: '03:48.337'
    original: 最高！
    english: Awesome!
  - start: '03:49.257'
    end: '03:55.057'
    original: ま、このあとももししかしたら、まだ仲間がいるかもしれない。
    english: Well, who knows, maybe there are even more friends waiting after this.
  - start: '03:56.097'
    end: '03:59.797'
    original: おー、楽しみにしていてください！
    english: Ooh, please look forward to it!
  - start: '04:01.997'
    end: '04:06.597'
    original: 配信で楽しんでる通し席のみんなも、コメントでたくさん盛り上げてくれてありがとう！
