  - start: '04:18.277'
    end: '04:29.077'
    original: ちょっと気になってるなって人も、ぜひぜひ、このあとも見てくれると嬉しいです！見てね！
    english: For those who are just getting curious, I'd be so happy if you keep watching
      after this too! Please check it out!
  - start: '04:30.517'
    end: '04:38.257'
    original: さあ、なんとここでこの豪華の無料パートは終わってしまいます！
    english: Now, amazingly, this gorgeous free portion is coming to an end!
  - start: '04:40.157'
    end: '04:47.797'
    original: YouTubeやTikTokで楽しんでいるみんなは、配信チケットで最後まで楽しんでほしいので、配信チケット買ってね！
