      the staging, songs, and performances that I'll be showing you all, so definitely
      don't miss a second!
  - start: '02:53.157'
    end: '03:04.197'
    original: そして、さっきね、トロッコもやりましたが、パレードなのでね、ずーっとやってみたかったトロッコ、みんなのね、前に来ましたよー！
