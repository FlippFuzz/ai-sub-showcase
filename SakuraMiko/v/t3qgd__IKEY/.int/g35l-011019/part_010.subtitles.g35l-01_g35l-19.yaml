  - start: '02:35.157'
    end: '02:46.337'
    original: まだまだ、まだまだまだまだこれから、たくさんみこがこだわってこだわってこだわった演出とか、歌とか、パフォーマンス、たくさんみんなに見せていくから、絶対に見逃すなよ！
