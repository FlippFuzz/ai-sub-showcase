global_summary:
  overall_summary: This video is the 3D birthday live concert of Hololive 0th generation
    talent Sakura Miko, titled 'Re:member colors', streamed on March 5, 2025. The
    live features a fairy-tale princess aesthetic with a grand castle stage, showcasing
    a medley of her original songs and energetic duet/group performances with guest
    VTubers including Fuwawa Abyssgard, Mococo Abyssgard, AZKi, Nakiri Ayame, Murasaki
    Shion, Oozora Subaru, Houshou Marine, and Shirakami Fubuki. The stream concludes
    with major product announcements, including her birthday merchandise collection,
    a Blu-ray release of her 1st solo live 'flower fantasista!', and upcoming collaborations.
