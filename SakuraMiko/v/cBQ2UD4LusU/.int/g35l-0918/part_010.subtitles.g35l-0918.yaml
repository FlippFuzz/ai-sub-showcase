  - start: '00:29.042'
    end: '00:30.342'
    original: お次はこちら！
    english: Next up is this!
  - start: '00:30.932'
    end: '00:40.482'
    original: 7月29日から秋葉原にあるステラマップカフェさんにて、
    english: From July 29th at Stellamap Cafe in Akihabara,
  - start: '00:36.562'
    end: '00:48.522'
    original: コラボカフェ「さくらみこ 3rd anniversary さくらみこのえりーとカフェ」は8月15日まで期間限定で開催中です！
