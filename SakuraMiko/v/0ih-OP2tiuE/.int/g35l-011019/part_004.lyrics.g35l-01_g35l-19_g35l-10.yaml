global_summary:
  overall_summary: This video is the 3D live concert 'Twinkle Idol Christmas' hosted
    by Hololive 0th Generation virtual idol Sakura Miko to celebrate her 2.0 million
    YouTube subscribers and unveil her new loungewear 3D costume. Broadcasted on December
    25, 2025, the live features a festive Christmas theme, solo performances, original
    songs, and special guest appearances by fellow Hololive members (AZKi, Roboco-san,
    Shirakami Fubuki, and Tokino Sora). The setlist includes beloved cover songs and
    original tracks, culminating in the announcement of merchandise, the digital release
    of her new single 'Sakihokore Idol' (written by HoneyWorks), and a continued collaboration
    with Naruto Taiyaki Honpo.
