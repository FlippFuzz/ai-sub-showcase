    english: '[Sakura Miko Birthday Voice - Released March 5]'
  thoughts: |+
    **A Reflection on Connection and Growth**

    Okay, so the task is to capture Sakura Miko's thoughts, and I'm diving in! First, that overwhelming feeling... it's a mix of gratitude and something deeper. It's truly amazing that so many celebrated my birthday!

    I've been reflecting on the comments and tweets, the videos MikoP made—all over Japan, even the world! Normally, I'm streaming, and I'm looking at myself, unable to see all the faces, I'm grateful seeing so many comments, knowing that each one is a real person watching, and it supports me deeply.

    Seeing everyone's faces and expressions again in those videos was deeply moving. It made me realize that everyone is alive and supporting me, and it made me so happy. Turning 18, and receiving so much support makes me want to grow and become an even more wonderful Miko. I'm still clumsy, the preparations are still a little hectic.

    I want to grow, and for all those fans who support Miko and MikoP the most, I want to hold an event where we can all gather! I'm going to work toward that. I'm not sure if it's possible, if the adults will let us, but I'll do my best to make it happen! Now, for an announcement! I hope everyone will be happy.



