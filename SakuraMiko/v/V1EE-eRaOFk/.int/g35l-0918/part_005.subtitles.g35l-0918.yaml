    I've listened to the back and forth now. I see this person, they are calling Miko a "loli". "Don't call me a brat!" is the response. And, the person says Happy Birthday, followed by Miko's thanks.

    We have a bit where Miko gets praise, then they seem to have an argument. The timing must be perfect to not overlap, and to capture the fast-paced banter. "You're making fun of me, the way you talk! Whenever you talk to Miko, you make fun of her, this guy!" The timing is a bit quicker here.

