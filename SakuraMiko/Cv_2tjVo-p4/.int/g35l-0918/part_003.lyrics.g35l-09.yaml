    reference_lyrics_en: |-
      (At god's mercy)
      So many things don't go the way I want, I feel hopelessly self-loathing,
      And I'm searching for a place to escape from countless pains and sorrows.
      I might as well be pulled into a crevice in the rocks and sleep, ignoring the moon and the sun.
      I don't know, I don't understand the meaning of being born.
      But the fact that you can think that way tells me that you have the power to become even more wonderful.

      That's right, just go with the flow, be bold, everyone loves the earth,
      Drink, sing, and have a good party, that's nice once in a while.
      That's right, north and south, right and left, we all love the earth in our own way,
      Even though we're muddy, we can keep walking, and we still have a long way to go.

      It all goes wrong every time I try and do something right,
      And now I can't help but hate myself for falling behind.
      I wanna run away from eight million of these aching pains,
      Looking far and away for just some way to escape.
      Like they all say, found a rock to just crawl under and hide,
      And never think about the moon or sun that roll in the sky.
      Why was I born, why did I even have to endure?
      In the end, I'm just not sure.
      But wait, though it might all seem like it's just a waste of time,
      Keep in mind, you've got a shot at making something out of
      Nothing, getting stronger through the darkest times.
      Listen close, 'cause here is why:

      That's right, just leave it to the deities, our responsibilities rule a world
      That loves us just the same as you love me.
      Raise a glass and sing it fast, we command you have a blast,
      Can't be bad to just sit back occasionally.
      That's right, from northern to the southern skies, reaching out to left and right,
      We all love this planet just the same as you love me.
      Though the road is traveled less, we can always move ahead,
      Keep in mind we're only just beginning.

      All I desire is to be a fair person,
      And there's no doubt in my mind that everyone else does too.
      But with the eight million imperfections that make up me,
      The thought of it torments me eternally.
      Every day I ask myself "why was I born?"
      "It's a miracle" I guess just that's one way to say -
      A nicer way of calling me a coincidence,
      So I guess I just happen to be...
      And as for the people who bully you so - forgive me.
      I had no other way of showing you how awesome of a person you were...
      It's the truth, really!
      Cause you see -
      It is just as us gods say, you and they at our commands;
      Truth is everyone one of us - we all love the world!

      I begin to laugh with you, and you begin to laugh too,
      In the end my mistakes are forgiven.
      Yes it's true for boys and girls, and everyone in between!
      And it's because of all this the love world keep on spinning!
      Though the path may be muddy, together we shall all brave through,
      But still we've got a ways to go from here...
      And as for those truly unexpected things -
      The diamond we find beneath all the rubble.
      Together let's laugh and just fool around!
      Without a care; let's laugh so loudly.
      Cause you see -
      It is just as us gods say, you and they at our commands;
      And because of everyone, i can love myself some more!
      Staring at your reflection; have you begun to understand?
      It is you, the light who helps us all shine bright!
      Yes, that's right -
      It is just as us gods say, everybody; thank you so!
      You will never understand how much I love this earth!
      Together, let the whole world bloom, let them grow oh so tall!
      Tall enough that one day they may yet reach us!
      Na na na na na na na na na na na na na na na na na nana nana
