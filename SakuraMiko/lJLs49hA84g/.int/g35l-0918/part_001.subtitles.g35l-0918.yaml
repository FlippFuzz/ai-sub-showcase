    The core of the project was the "Chijou no Hoshi" song. Getting the timing right here was crucial. I matched the audio with the burnt-in lyrics, line by line, to get it perfect. I painstakingly checked and re-checked frames to be accurate.

    The studio dialogue section required close listening and transcription. I captured the back-and-forth between Fubuki, Suisei, and Miko with precision. I even noted their reactions to the timeline banner and their recollections of Miko's past.
