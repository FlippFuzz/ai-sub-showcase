  overall_summary: 'This video is the 3D Birthday Live concert of Hololive 4th Generation
    VTuber Amane Kanata, titled ''Amane Kanata AnimeSong 3DLIVE / #天音かなた爆誕2024''.
    Broadcast on May 8, 2024, the concert features a high-energy setlist of iconic
    anime theme song covers performed solo and in collaboration with various Hololive
    guests (AZKi, Takane Lui, Nakiri Ayame, Usada Pekora, Houshou Marine, and Yukihana
    Lamy). It also showcases Kanata''s original songs such as ''Oracle'' and ''Shiranai
    Hana'', concluding with an announcement of her birthday commemorative merchandise
    and upcoming animated music video.'
