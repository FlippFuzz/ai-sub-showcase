    reset button, I'd be so happy if everyone watched while thinking about all these
    things!
- start: '02:29.500'
  end: '02:39.000'
  original: ストーリーに依ってるんでね。ということで、説明役の僕はここで、おさらばしたいと思います。次の世界に行ってらっしゃいませ！ それではみんな楽しんでね！
  english: It's tied to the story. So, as the explainer, I'll take my leave here.
    Have a safe trip to the next world! Everyone, have fun!
- start: '02:56.500'
  end: '02:59.500'
  original: "[Title: 初音ミクの消失 \n 作詞・作曲:cosMo@暴走P]"
