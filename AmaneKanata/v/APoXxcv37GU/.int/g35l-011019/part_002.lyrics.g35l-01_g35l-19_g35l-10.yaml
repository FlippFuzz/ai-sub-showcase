- start: '02:11.000'
  end: '02:29.500'
  original: で、この曲はどういったところにタイムリープしているのか、かなたはどのタイミングでリープしたのか、どんな結末が待っているのか、どんな世界で生きていくんだろうなどなど、いろんなことをね、人生リセットボタンをポチッとしたので、ぜひぜひみんなも考えながら見ていただけるととっても嬉しいです！
  english: And so, where did this song time-leap to? When did Kanata leap? What kind
