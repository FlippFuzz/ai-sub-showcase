- start: '00:42.200'
  end: '00:46.400'
  original: ダメダメ こんな人生 素計これまで何年だ？
  english: No way, no way, this kind of life... just how many years is this in total?
- start: '00:47.020'
  end: '00:51.340'
  original: 寒い寒い 近寄らないで 答えが喉まで来ているんだ
  english: Cold, cold, don't come near me... the answer is right at my throat!
- start: '00:52.020'
  end: '00:56.240'
  original: カイバ先生カイバ先生 書き殴った手の中に
