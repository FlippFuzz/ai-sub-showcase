  english: '"...Because I''ll live your life much better than you ever did!"'
- start: '00:04.100'
  end: '00:06.000'
  original: 「君も次の誰かちゃんとしなくちゃ」
  english: '"You''ve gotta take good care of whoever comes next, too!"'
- start: '00:07.100'
  end: '00:09.500'
  original: 「もう分かってんだろ 何をすればいいかさあ」
  english: '"You already know what you need to do, right? Come on!"'
- start: '00:10.100'
  end: '00:13.850'
  original: 「どうか誰か僕に奇跡をくれよ」
  english: '"Please, someone, give me a miracle!"'
- start: '01:12.500'
  end: '01:14.500'
  original: 背景ドッペルゲンガー 君は誰？
  english: Haikei Doppelganger, who are you?
- start: '01:14.800'
  end: '01:17.000'
  original: あぁ こんな遠くまで来て そして僕は誰？
  english: Ah, coming this far... And who am I?
- start: '01:17.500'
  end: '01:19.000'
  original: 戻れない
  english: Can't go back
- start: '01:19.500'
  end: '01:22.500'
  original: どうもこんにちは 君の分身です
  english: '"Hello there, I am your doppelganger."'
- start: '01:23.000'
  end: '01:25.500'
  original: 背景ドッペルゲンガー それは僕
  english: Haikei Doppelganger, that's me.
- start: '01:26.000'
  end: '01:28.500'
  original: 虫が満たした巣箱に 世界が気付こうとも
  english: Even if the world notices the hive filled with insects,
- start: '01:28.800'
  end: '01:30.500'
  original: 鳴り止まない 奇跡の輪廻が
  english: the endless cycle of miracles...
- start: '01:30.800'
  end: '01:35.500'
  original: 狂った正解を染め上げて ランパパ
  english: dyes the crazy correct answer, lampapa!
- start: '01:56.500'
  end: '01:59.000'
  original: 「どうもこんにちは 君の分身です」
  english: '"Hello there, I am your doppelganger."'
- start: '02:21.210'
  end: '02:26.500'
  original: '[Title: ココロ 作詞・作曲：トラボルタ]'
  english: '[Title: Kokoro Lyrics/Music: Travolta]'
- start: '02:56.200'
  end: '03:04.000'
  original: 孤独な科学者に作られたロボット 出来栄えを言うなら「奇跡」
  english: A robot created by a lonely scientist. If I had to describe my craftsmanship,
    it's a "miracle."
- start: '03:09.500'
  end: '03:17.500'
  original: だけどまだ足りない 一つだけ出来ない それは「心」と言うプログラム
  english: 'But something''s still missing, there''s just one thing I can''t do: a
    program called a "heart."'
- start: '03:22.500'
  end: '03:30.000'
  original: 幾百年が過ぎ 独りで残された 奇跡のロボットは願う
  english: Hundreds of years pass, and left all alone, the miraculous robot wishes...
- start: '03:36.500'
  end: '03:44.000'
  original: 知りたい あの人が命の終わりまで 私に作ってくれた「ココロ」
  english: I want to know the "heart" that person created for me until the end of
    their life.
- start: '03:55.200'
  end: '04:03.000'
  original: 今動き始めた 加速する奇跡 なぜかナミダが止まらない…
  english: Now the accelerating miracle has begun to move. For some reason, the tears
    won't stop...
- start: '04:09.500'
  end: '04:17.500'
  original: なぜ私 震える？ 加速する鼓動 これが私の望んだ「ココロ」？
  english: Why am I trembling? My heartbeat is accelerating. Is this the "heart" I
    wished for?
- start: '04:36.800'
  end: '04:43.500'
  original: フシギ ココロ ココロ フシギ 私は知った 喜ぶ事を
  english: Mysterious heart, heart, mysterious. I have learned how to feel joy.
- start: '04:44.000'
  end: '04:50.500'
  original: フシギ ココロ ココロ フシギ 私は知った 悲しむ事を
  english: Mysterious heart, heart, mysterious. I have learned how to feel sadness.
- start: '04:51.000'
  end: '04:59.500'
  original: フシギ ココロ ココロ ムゲン なんて深く切ない…
  english: Mysterious heart, heart, infinite... How deeply painful and bittersweet
    it is...
