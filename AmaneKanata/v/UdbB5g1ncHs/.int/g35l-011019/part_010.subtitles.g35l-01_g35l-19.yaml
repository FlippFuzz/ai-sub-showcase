  - start: '02:12.829'
    end: '02:42.829'
    original: そしてホロカのPRカードもついてくるよ！タレントプレミアムグッズのフルセット特典として、2024年9月から発売されたホロライブオフィシャルカードゲームで使用できるカードが1枚付きます。同梱するカードはホロライブプロダクションオフィシャルショップでご購入されたお客様のみ対象となります。特典につくのはゲームで1枚だけ使用できアピールできるキーカード、推しホロメンカードです。カードの詳細や遊び方についてはホロライブオフィシャルカードゲームの公式ホームページにてご確認ください。同梱するカードは日本語版のみとなりますのでご承知くださいということでね、さすがのかなたそももう口が回らなくなってきていますが、皆さんついてこれていましたでしょうか？
    english: 'And a Holoca PR card is included too! As a full-set bonus for the Talent
      Premium Goods, you get one card usable in the Hololove Official Card Game released
      starting September 2024. The included card is only for customers who purchased
      from the Hololive Production Official Shop. The bonus is a key card that can
      be used and gives appeal in the game just once: the Oshi Holomember card. Please
      check the official Hololive Official Card Game homepage for card details and
      how to play. Please note that the included card is Japanese version only. So
      yeah, even Kanata is getting tongue-tied at this point, but were you all able
      to keep up?'
  - start: '02:43.089'
