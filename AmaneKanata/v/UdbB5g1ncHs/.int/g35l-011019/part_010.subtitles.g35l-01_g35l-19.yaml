    original: ぜひぜひね、たくさん重大告知ありましたが、いろいろ整理して皆さん、ぜひすべてチェックしてもらえたら嬉しいなと思います！それではまた明日お会いしましょう！バイバーイ！
    english: There were lots of major announcements, so I hope you all take some time
