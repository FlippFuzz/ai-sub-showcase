  - start: '03:27.703'
    end: '03:36.563'
    original: そうなんですよ。4期生がホロライブに入って、ARKとかね、あさココとかも毎日胸がドキドキするような時期だったし、
    english: (Lamy) That's right. When the 4th generation joined Hololive, with things
      like ARK and Asacoco, it was a time when our hearts throbbed every single day.
  - start: '03:37.403'
    end: '03:44.223'
    original: 毎日の朝のライブ配信とか、そのほかのホロメンの情報をまとめてニュースでやっっていうのがすごく斬新で、
    english: And her morning live streams every weekday, summarizing news about other
      Hololive members into a news format, was so innovative.
  - start: '03:44.423'
    end: '03:46.473'
    original: 天才だったなって。
    english: She was an absolute genius.
  - start: '03:48.863'
    end: '03:57.493'
    original: 準備とかも大変な中、そういうこともやって、まぁその箱のためになったらいいとすごく考える人でしたね。
    english: (Kanata) Even amidst all the tough preparation, she did all that, and
      she was someone who thought a lot about doing what would benefit the agency
      as a whole.
  - start: '03:57.773'
    end: '04:05.413'
    original: そんなふうに仲が良かったからこそ、卒業が完全に決まった時は、まぁやっぱり悲しい気持ちはもちろんありました。
    english: Because we were so close, when her graduation was completely decided,
      of course I felt sad.
  - start: '04:06.333'
    end: '04:12.793'
    original: で、その時にね、ココの卒業を聞いた僕は、この時最後にやりたかったことがありました。
    english: And at that time, when I heard about Coco's graduation, there was something
      I wanted to do at the very end.
  - start: '04:13.833'
    end: '04:17.533'
    original: '[Title: 4期生としてのオリジナル楽曲]'
    english: '[Title: Original Song as 4th Generation]'
  - start: '04:20.663'
    end: '04:24.403'
    original: せっかくなら5人のオリジナル曲欲しいよなって思ったんですよね。
    english: I thought, since we have the chance, I'd really want an original song
      for all 5 of us.
  - start: '04:24.813'
    end: '04:29.413'
    original: そこできちんと運営さんに4期生の曲作りたいと言うと、こう言われます。
    english: 'So when I earnestly asked management that I wanted to make a 4th-generation
      song, they told me this:'
  - start: '04:30.983'
    end: '04:32.743'
    original: '[Text: 間に合いません]'
    english: '[Text: We won''t make it in time]'
  - start: '04:33.253'
    end: '04:37.383'
    original: 間に合いません。時間がね、そう、そうだよね。
    english: '"We won''t make it in time. There''s just... yeah, time..."'
  - start: '04:37.893'
    end: '04:45.743'
    original: 曲の制作には時間かかりますし、卒業が決まった時にはもう今からの楽曲制作は間に合わないとはっきり言われました。
    english: Producing a song takes time, and they clearly told me that once the graduation
      was decided, producing a new song starting from now wouldn't make it in time.
  - start: '04:46.403'
    end: '04:49.073'
    original: そしてこれを言われた僕はこう思います。
    english: And upon being told this, here is what I thought.
  - start: '04:50.043'
    end: '04:52.543'
    original: '[Text: だったら自分で作っちゃおう]'
    english: '[Text: Then I''ll just make it myself!]'
  - start: '04:52.883'
    end: '04:56.963'
    original: だったら自分で作っちゃおう。うわ、すごい！よくそうなった。すごい！
    english: (Others) "Then I'll just make it myself!" Wow, amazing! How did you come
      to that? Amazing!
  - start: '04:57.253'
    end: '04:59.043'
    original: 発注すると間に合わないなら、
    english: (Kanata) If ordering it through channels wouldn't make it in time...
