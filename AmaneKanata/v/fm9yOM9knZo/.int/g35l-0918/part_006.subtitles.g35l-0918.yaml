    *   I note the friendship with Kiryu Coco, the 4th gen member. The person they are talking about is now a graduate, but the two lived together, sharing their lives.

    Finally, I reach the major moment:
    *   I recognize that Coco's graduation was a big event. Coco left an enormous impression.
    *   The speaker then talks about how Coco was not only loved but also remembered as a genius, and the importance of things like AsaCoco.
    *   When Coco's graduation was fully decided, sadness was felt.
