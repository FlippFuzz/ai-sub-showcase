    **Hololive 4th Gen Reflections**

    Okay, here's the deal. I need to make some subtitles for this Kanata 3D stream, focusing on her talking about the 4th gen.  Gotta be super accurate with timecodes and phrasing, following all the rules!

    First, I heard "I think so" at the start. Let's get the exact timing: "I think so" at 00:00.283.  She then said, "Hey, stop being emotional. Don't make me cry, okay?" at 00:01.083. She added "Will I cry?" at 00:04.943.

    The slide says "Hololive 4th Gen" with names. I heard her say, "Since we first went out to eat together, more than half a year has already passed" (00:08.063).

    She continued, saying, "You've become so three-dimensional, and your chest is..." (00:17.783), but then she quickly moved on.

    I also transcribed her saying, "It's nothing. But having spent half a year together as generation mates like this, every day has been so endlessly fun" (00:26.883). Then, "and since we got our 3D models, the things we can do have expanded more and more, so let's keep having fun doing various things in 3D too, yeah!" (00:35.543).

    She got a bit cheeky, talking about Coco's lack of 3D chest but then said, "Hololive's tech team will probably do something about it. Or rather, they'll make it bounce even flat. It's not flat! If it's bouncing" (00:59.443).

    She was surprised and said, "What are you talking about, seriously? I thought someone emotional and tear-jerking would come, but there was no need to worry at all" (01:06.523). Then "Your chest is, magnificently, look, isn't it kind of crazy? It's become 3D. It's become a D, D-cup" (01:18.103).

    Moving to Watame, "Hololive 4th gen generation mate, Tsunomaki Watame... Watame did nothing wrong, right?" (01:38.283).

    "Whenever I read Watame's messages, people always say I sound a bit like Coco-senpai, but Watame is like a singing big sister, super pure with a truly beautiful voice, and I'm always begging her because her voice is so lovely, but with this pure and beautiful voice, she drops massive vulgarity like 'poop' and stuff—" (01:50.323).

    She then says, "Is this okay? 3D... even I said 'poop' at my debut." and adds, "I'm so glad we could become 4th gen together! Let's continue working hard together without overworking ourselves, okay?" (02:22.563).

    After hearing Watame's message, I got emotional again "I mean, truly, I always get energy from Watame... Really, when I first talked with Watame, like, you know, I felt like in front of Watame I could become a bit more honest, what was it? How embarrassing! I said things like that when we talked. Watame is such a reliable, kind, and cute big sister. I look up to Watame so much, so let's keep getting along well! I'm truly, truly glad Watame is my generation mate." (03:22.903).

    Then it's Luna, "Himemori Luna-nana-na! Naaah! Right, Luna is a sadistic baby" (04:16.843). "Sadistic baby saying 'naa,' and her retorts are sharp" (04:28.023) and she added that "Lately, I think this a lot—Luna, in collabs and stuff, without hesitating towards seniors, pushing back against their pressure, or rather pressure? I'll get yelled at! No, I won't get yelled at. Without hesitating or bowing to seniors, she drops solid retorts, and I respect that so much" (04:31.223).



