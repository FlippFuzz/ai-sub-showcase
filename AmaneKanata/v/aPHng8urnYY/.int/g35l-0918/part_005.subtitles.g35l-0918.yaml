- subtitles:
  - start: '01:24.000'
    end: '01:28.450'
    original: あの日見渡した渚を 今も思い出すんだ
    english: I still find myself remembering the beach we looked over that day,
  - start: '01:28.450'
    end: '01:33.100'
    original: 砂の上に刻んだ言葉 君の後ろ姿
    english: the words carved in the sand, and your back as you walked away.
  - start: '01:33.850'
    end: '01:37.950'
    original: 寄り添う波が足元を よぎり何かをさらう
    english: The lapping waves wash over my feet, washing something away.
  - start: '01:38.250'
    end: '01:42.950'
    original: 夕凪の中 日暮れだけが通り過ぎていく
    english: In the twilight, only the end of the day passes by.
  - start: '01:44.200'
    end: '01:47.300'
    original: パッと光って咲いた 花火を見ていた
    english: We watched the fireworks flash and bloom.
  - start: '01:47.450'
    end: '01:52.550'
    original: きっとまだ終わらない夏が
    english: Surely, summer isn't over yet.
  - start: '01:52.950'
    end: '01:57.650'
    original: 曖昧な心を透過して繋いだ
    english: We connected through our uncertain hearts,
  - start: '01:57.650'
    end: '02:02.350'
    original: この夜が続いて欲しかった
    english: hoping this night would go on.
  - start: '02:04.100'
    end: '02:07.950'
    original: あと何度君と同じ 花火を見られるかなって
    english: Just how many times will I get to see fireworks with you?
  - start: '02:08.200'
    end: '02:12.700'
    original: 笑う顔に何ができるだろうか
    english: You ask with a smile on your face.
  - start: '02:13.600'
    end: '02:17.850'
    original: 傷付くこと喜ぶこと 繰り返す波と情動焦燥
    english: Getting hurt, feeling happy, repeating waves and surging emotions,
