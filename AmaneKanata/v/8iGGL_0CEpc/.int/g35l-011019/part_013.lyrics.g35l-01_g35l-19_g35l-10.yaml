  english: Thank you so much for this dreamlike time. My childhood dream of becoming
    an idol and my dream of writing and composing songs came true here. And as for
    the final song... I'm still going to sing!
- start: '00:53.302'
  end: '01:10.502'
  original: 僕が初めて作詞作曲した楽曲があります。今はいない同期、ここの卒業に合わせて4期生の、とはルータのために捧げた楽曲です。前を向いて笑顔でこの楽曲で活動を最後にしたいと思います。それでは聞いてください、「キセキ結び」！
  english: There is a song that I wrote and composed for the very first time. It's
    a song dedicated to our missing generation-mate, and for Luna, tailored around
    her graduation. I want to conclude my activities with a smile, looking forward,
    with this song. So please listen... "Kiseki Musubi"!
- start: '01:20.100'
  end: '01:23.800'
  original: '[Title: キセキ結び 作詞・作曲:天音かなた 編曲:ハム]'
  english: '[Title: Kiseki Musubi Lyrics & Composition: Amane Kanata Arrangement:
    Ham]'
- start: '01:24.220'
  end: '01:34.920'
  original: 約束しようよ 僕ら出会えた奇跡 忘れないように
  english: Let's make a promise so we'll never forget the miracle of how we met.
- start: '01:44.820'
  end: '01:54.320'
  original: 夢抱いて集う 青春アニメみたいな ハッピーエンドになる あなたへ飛ぶよ
  english: Gathering with dreams, like a youth anime... flying toward you for a happy
    ending!
- start: '01:55.320'
  end: '02:04.320'
  original: ねえ ボケて眠気あくびして 今日は何をしようか 永遠に続く海を駆け抜ける
  english: Hey, joking, dozing off and yawning, what shall we do today? Racing across
    an endless sea.
- start: '02:04.920'
  end: '02:14.920'
  original: 今は溜息より勇気を 諦めるなんてないの ここで歌う 僕の声は聴こえてますか
  english: Now, courage rather than sighs—there's no giving up! Can you hear my voice
    singing here?
- start: '02:16.820'
  end: '02:27.520'
  original: 君に届け学校の友達じゃ きっとない出会いだった
  english: Reaching out to you—it was an encounter I'd surely never find with school
    friends.
- start: '02:28.020'
  end: '02:37.820'
  original: 何年も先の遥か遠くまで ささくれた言葉も 誰かの笑顔になる
  english: Far off into the years ahead, even prickly words will turn into someone's
    smile.
- start: '02:38.220'
  end: '02:49.220'
  original: それぞれの色で 星結ぶ奇跡 キラキラ輝くステージに 連れてくよ
  english: With our respective colors, the miracle of connecting stars will lead you
    to a sparkling stage!
- start: '02:57.820'
  end: '03:07.420'
  original: 泣いて 笑って はしゃいで 毎日チャットコースター たまには寝転んでお昼寝しよう
  english: Crying, laughing, having fun—a daily chat coaster! Sometimes let's lie
    down and take a nap.
- start: '03:07.820'
  end: '03:17.620'
  original: ちょっと自信ない時 ことに取ってウェットして 今日だけは泣いちゃうこと許してね
  english: When you're feeling a bit unconfident... forgive me for crying just for
    today.
- start: '03:18.020'
  end: '03:28.920'
  original: 未来の僕がアルバム開く 傷ついた写真だって たたのものだ 僕の愛が見えてますか
  english: The future me opens the album—even wounded photos are treasures. Can you
    see my love?
- start: '03:33.820'
  end: '03:45.320'
  original: 君に届け過去も個性も 正解も違うけれど 弱気なときは殴った ぎゅっとつむり
  english: Reaching out to you—our pasts, individualities, and correct answers differ,
    but when you felt weak...
- start: '03:46.020'
  end: '03:59.820'
  original: もう1回 もう1回 絶対に諦めない 前の背中追う 下手っぴな僕でも 君の隣にいたくて 走るよ
  english: One more time, one more time, I'll never give up! Chasing the back ahead,
    even as clumsy as I am, I want to be by your side and run.
- start: '04:02.020'
  end: '04:23.020'
  original: 誰にも言えずに 描いた夢が叶わなくても ボロボロの靴でも かっこよくなくても ああ 幼い あの日の僕ならなんて言う 止まらないで
  english: Even if the dream I drew without telling anyone doesn't come true, even
    with tattered shoes, even if I'm not cool... Ah, what would my young self from
    back then say? Don't stop!
- start: '04:24.020'
  end: '04:38.820'
  original: 初めて僕ら出会った日 まるで昨日みたいに思い出すけど もう行こうか 最後に今 重なる
  english: The day we first met—I remember it as if it were yesterday, but let's go
    now, finally overlapping right now.
- start: '04:44.220'
  end: '04:56.820'
  original: 僕の声は聴こえてますか 君に届け黒板のメッセージ さくらのカーテンくぐって 僕らの声を聴いて ずっとずっと
  english: Can you hear my voice? Reaching out to you, a message on the chalkboard,
    passing through a curtain of cherry blossoms—listen to our voices, forever and
    ever.
