      you to a sparkling stage!
  - start: '02:57.820'
    end: '03:07.420'
    original: 泣いて笑ってはしゃいで 毎日ジェットコースター たまには寝転んでおひるねしよう
    english: Crying, laughing, having fun—a daily rollercoaster! Sometimes let's lie
      down and take a nap.
  - start: '03:07.820'
    end: '03:17.620'
    original: ちょっと自信ないとき 小鳥とデュエットして 今日だけは泣いちゃうこと許してね
    english: When you're feeling a bit unconfident, duet with a little bird—forgive
      me for crying just for today.
  - start: '03:18.020'
    end: '03:28.920'
    original: 未来の僕がアルバム開く 傷ついた写真だって宝物だ 僕の愛が見えていますか
    english: The future me opens the album—even wounded photos are treasures. Can
      you see my love?
  - start: '03:33.820'
    end: '03:45.320'
    original: きみにとどけ 過去も個性も性格も違うけれど 弱気なときはまぶたぎゅっと瞑り
    english: Reaching out to you—our pasts, individualities, and personalities differ,
      but when you feel weak, close your eyelids tight.
  - start: '03:46.020'
    end: '03:59.820'
    original: もう一回 もう一回 絶対に諦めない 前の背中追う へたっぴな僕でも きみの隣に行きたくて 走るの
    english: One more time, one more time, I'll never give up! Chasing the back ahead,
      even as clumsy as I am, I want to go to your side and run.
  - start: '04:02.020'
    end: '04:23.020'
    original: 誰にも言えずに描いた夢が たとえ叶わないとしても ぼろぼろの靴でも かっこよくなくても 幼いあの日の僕ならなんて言う 止まらないで
    english: Even if the dream I drew without telling anyone doesn't come true, even
