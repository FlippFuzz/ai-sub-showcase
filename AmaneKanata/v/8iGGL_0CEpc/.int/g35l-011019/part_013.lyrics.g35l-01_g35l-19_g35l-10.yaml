  - start: '00:53.302'
    end: '01:10.502'
    original: 僕が初めて作詞作曲した楽曲があります。今はいない同期、ココの卒業に合わせて4期生の、とわ、ルナのために捧げた楽曲です。前を向いて笑顔でこの楽曲で活動を最後にしたいと思います。それでは聞いてください、「キセキ結び」！
