      then say? Don't stop!
  - start: '04:24.020'
    end: '04:38.820'
    original: 初めて僕ら出会った日 まるで昨日みたいに思い出すけど もう行こうか 最後にいま 重なる5人のキセキ
    english: The day we first met—I remember it as if it were yesterday, but let's
      go now, as the miracle of the five of us finally overlaps right now.
  - start: '04:44.220'
    end: '04:56.820'
    original: 僕の声は聞こえてますか きみにとどけ 黒板のメッセージ 桜のカーテンくぐって 僕らの声を聞いて ずっとずっと
    english: Can you hear my voice? Reaching out to you, a message on the chalkboard,
      passing through a curtain of cherry blossoms—listen to our voices, forever and
      ever.
