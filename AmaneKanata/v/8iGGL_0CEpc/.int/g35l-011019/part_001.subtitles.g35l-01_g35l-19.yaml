  overall_summary: This video captures the graduation live concert 'THE ABSOLUTE IDOL'
    of Amane Kanata, a prominent member of Hololive 4th Generation, streamed on her
    official YouTube channel on December 27, 2025. The concert features a powerful
    setlist of cover songs and original tracks, showcasing her vocal range from emotional
    ballads to energetic rock numbers. Throughout the stream, Kanata interacts warmly
    with her fans ('Heimin'), introduces her graduation merchandise, receives a surprise
    guest appearance and flower bouquet from fellow Hololive members (Inugami Korone
    and AZKi), and delivers an emotional final speech and performance of her self-composed
    songs, concluding her six-year journey as a virtual idol.
