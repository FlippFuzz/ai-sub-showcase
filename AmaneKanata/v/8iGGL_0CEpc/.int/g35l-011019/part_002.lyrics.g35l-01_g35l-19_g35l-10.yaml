  english: 'Someone inside me sings: Go further away once more, go further away.'
- start: '01:18.791'
  end: '01:23.351'
  original: 歳を取るのも忘れるほど熱烈に　いつだって目を離した君が二度と悲しまないように
  english: So passionately that we forget to grow old, so that you, who looked away,
    will never be sad again...
- start: '01:23.351'
  end: '01:27.501'
  original: さらば掲げろピースサイン　転がっていくストーリーを
  english: Farewell, hold up your peace sign, as the story rolls on.
- start: '01:33.201'
  end: '01:38.161'
  original: 守りたいんだなんて言えるほど　君が弱くないのは分かってた
  english: I knew you weren't so weak that you needed someone to protect you.
- start: '01:38.251'
  end: '01:42.821'
  original: それ以上に僕らは弱くてさ　君が大事だったんだ
  english: But more than that, we were weak, and you were precious to us.
- start: '01:42.821'
  end: '01:47.741'
  original: 一人で生きていくんだなんてさ　口をついて叫んだあの日から
  english: Ever since that day when you shouted that you would live all alone,
- start: '01:47.741'
  end: '01:52.411'
  original: 変わっていく僕を笑えばいい　一人格好つけのナイトを
  english: You can laugh at me changing, acting like a lone, pretentious knight.
- start: '01:52.541'
  end: '02:01.381'
  original: 傷ついて噛みついて息もできなくて　騒ぐ頭と腹の奥がぐちゃぐちゃになって
  english: Hurt and biting back, unable to even breathe, my churning head and stomach
    becoming a complete mess...
- start: '02:01.541'
  end: '02:06.151'
  original: 泥臭い今日も　いずれ消えてしまうくらいに
  english: Even if today, covered in mud, will eventually fade away,
- start: '02:06.151'
  end: '02:12.181'
  original: 今は触って痛いんだ　君の心に
  english: Right now it hurts to touch your heart.
- start: '02:12.751'
  end: '02:22.581'
  original: 僕たちはきっとずいぶん遠く離れた　太陽にすら届いて　余計な笑い声を手にいれたんだ
  english: We surely reached far away, even reaching the sun, and obtained unnecessary
    laughter.
- start: '02:22.581'
  end: '02:32.421'
  original: そうやって青く燃える色に染まり　おぼろげな街の向こうへ　繋いで確信に帰るはずだ
  english: Dyeing ourselves in the color of burning blue, heading beyond the hazy
    town, we are bound to return to certainty.
- start: '02:32.611'
  end: '02:38.281'
  original: 君と未来を結びあがく　君にのらないストーリーを
  english: Struggling to weave the future with you, a story unlike any other for you.
- start: '02:47.981'
  end: '02:53.051'
  original: 悴んだだらけあくれた日々が　削り削られ擦り切れた今が
  english: The days of numbed clumsiness, the now worn out and scraped away...
- start: '02:53.151'
  end: '02:57.251'
  original: 君の言葉で蘇る　鮮やかにも現る時
  english: Revived by your words, vividly appearing once again.
- start: '02:57.441'
  end: '03:05.101'
  original: 裸のままで眠る魂を　剥き出しのまま捨てたあの夢を　もう一度取り戻そうぜ
  english: The soul sleeping in its bareness, the dream cast aside raw—let's take
    them back once more.
- start: '03:24.000'
  end: '03:26.500'
  original: もう一度
  english: Once more...
- start: '03:26.500'
  end: '03:30.500'
  original: 遠くへ行け　遠くへ行けと　僕の中で誰かが歌う
  english: Go further away, go further away, someone inside me sings.
- start: '03:30.500'
  end: '03:35.000'
  original: どうしようもないほど熱烈に
  english: So passionately, so intensely...
- start: '03:35.000'
  end: '03:40.000'
  original: いつだって目を離した君が二度と悲しまないように　そんなヒーローになるための歌
  english: So that you, who looked away, will never be sad again—a song to become
    that kind of hero.
- start: '03:40.000'
  end: '03:50.000'
  original: さらば掲げろピースサイン　転がっていくストーリーを
  english: Farewell, hold up your peace sign, as the story rolls on.
- start: '03:50.000'
  end: '03:58.000'
  original: 君と未来を結びあがく　君にのらないストーリーを
  english: Struggling to weave the future with you, a story unlike any other for you.
- start: '04:06.821'
  end: '04:10.511'
  original: 考えたって分からないし　青空の下君を待った
  english: Thinking it over gets me nowhere, so I waited for you under the blue sky.
- start: '04:10.511'
  end: '04:15.011'
  original: 風が吹いた正午　昼下がりを抜け出す想像をねぇ
  english: At noon when the wind blew, imagining slipping away from the lazy afternoon,
    hey...
- start: '04:15.011'
  end: '04:18.911'
  original: これからどうなるんだろうね　進め方を忘れないんだよ
  english: I wonder what will happen from here on out? I haven't forgotten how to
    move forward.
- start: '04:18.911'
  end: '04:22.411'
  original: 君の目を見た　何にも言えず僕は歩いた
  english: I looked into your eyes and walked away without saying a word.
- start: '04:22.411'
  end: '04:25.500'
  original: '[Title: だから僕は音楽を辞めた]'
  english: '[Title: Then I Hated Music]'
- start: '04:37.551'
  end: '04:41.421'
  original: 考えたって分からないし　セッションなんてつまらないし
  english: Thinking it over gets me nowhere, and sessions are so boring.
- start: '04:41.421'
  end: '04:44.821'
  original: 辞めたはずのピアノ　机を弾く癖が抜けなくてねぇ
  english: The piano I should have quit—I still catch myself tapping on the desk,
    hey.
- start: '04:44.821'
  end: '04:48.511'
  original: 将来何してるんだろうね　音楽はしてないといいな
  english: I wonder what I'll be doing in the future? I hope I'm not making music
    anymore.
- start: '04:48.511'
  end: '04:51.321'
  original: 困らないでよ心の中で
  english: Please don't trouble me inside my heart.
