  original: ということでね、えーと 何かに挑んでいく曲みたいなのは好きなのでもともと、えー劣等上等と僕らの16bit戦争をお届けさせていただきました！ね、すごい大好きなかっこいい楽曲たちなのでぜひぜひ原曲もチェックしてみてください！
