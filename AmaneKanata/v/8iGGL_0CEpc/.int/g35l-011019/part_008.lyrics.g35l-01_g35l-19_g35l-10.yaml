    know, Kanata?
- start: '04:32.000'
  end: '05:02.500'
  original: え！？かなた知ってる！？知るわけないでしょ！びっくりした！え、待って、ゲスト、いなくって、え、い、い、い、い、一人の嫁せないよ！嘘、一人でやるなんて、寂しすぎるよ！あ、たち来て、あ、で、で、で、で、出てる！来ると思ってなかったじゃんか。こんなサプライズじゃん。かなた来てくれました。歌うまくなったね！え、う、う、う、う、嬉しい！ありがとう！
  english: Huh?! Kanata knew?! There's no way I knew! I was so shocked! Wait, there
    are no guests—wait, wait, wait, wait, I can't do this alone! No way, doing this
    alone is way too lonely! Ah, Tachi came—ah, de-de-de-de-showing up! I didn't think
