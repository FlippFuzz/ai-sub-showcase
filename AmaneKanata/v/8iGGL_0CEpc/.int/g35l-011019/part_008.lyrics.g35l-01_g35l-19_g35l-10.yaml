  original: わあー！こちらのジャケット、おしおママに頼りにして探してくださいね、と頼みを。いや、この曲、あまりにも卒業ソングすぎるって思ったでしょ？これ実は卒業決める前に作られていた曲で、卒業決める前に、MVは明日ね、あの、明日の20時、もうかなたそがいなくなっても予約投稿というものがある、ネットには。ということで、明日の20時に投稿されるんですが、内容も実は卒業を誰も知らずに作っているということで、なんかこんな偶然の一致でそれっぽくなってしまいました。それを踏まえてまたなんてやねんと思いながら聞いてください、ひぐちあいさんにね作詞作曲していただいて、あの悪魔の子ねいっぱい歌ったりしたんで、超嬉しかったです。ありがとうございます！
  english: Wow! This jacket illustration—please rely on Mama Oshio to find it, I asked
    her. Well, you must think this song is way too much like a graduation song, right?
    Actually, this song was made before I decided to graduate, and before that decision,
    the MV is scheduled for tomorrow at 20:00—even if Kanataso is gone, scheduling
    posts exists on the internet. So it gets posted tomorrow at 20:00, but the content
    was actually made without anyone knowing about my graduation, so by such a coincidence
    it ended up feeling fitting. Keeping that in mind while thinking "What is this
    timing?!" please listen to it. Higuchi Ai wrote the lyrics and music for me, and
    since I sang "Child of Evil" a lot, I was super happy. Thank you so much!
- start: '01:44.000'
  end: '01:53.000'
  original: '[Title: 天音かなた 卒業グッズ] 卒業グッズがもう出てます！なんと出てる！ということで、それでは一つずつ見ていきましょう！まずは、こちら！'
  english: '[Title: Amane Kanata Graduation Goods] The graduation goods are already
    out! They''re actually out! So, let''s take a look at them one by one! First up,
    this!'
- start: '01:54.000'
  end: '02:23.500'
  original: はい！アクリルパネルです！可愛いでしょう！じゃん！こちらね、おしおママに想いをお伝えした上で、描き下ろししていただいたイラストになっております！もう本当にね、みんなに対して最後は「まあ、笑顔かな」とか「青い薔薇」というものを、あの当初からちょっとモチーフ的に入れたりすることがあったので、あのこちらでまた入れていただきました。可愛いでしょう？笑顔にしてもらいました。じゃお次は、こちら！
  english: Yes! It's an acrylic panel! Isn't it cute? Ta-da! This illustration was
    drawn specially for us after I shared my feelings with Mama Oshio! She incorporated
    motifs like "Well, let's keep smiling" and "blue roses" that we've had since the
    beginning, so she added them in here again. Isn't it cute? She gave me a smiling
    face. Now, next is this!
- start: '02:24.500'
  end: '02:47.500'
  original: じやーん！じゃん！この、これすごい。かなた＆こなたのアクリルスタンドです！これね、僕がね、本当にね、こなたという妹というものをぜひこの姿に残して、生きてよ、ということで、僕が欲しいがために生まれたグッズでございます！可愛いでしょう？えらいよな。ということで、次は、こちら！
  english: Ta-da! Look at this, this is amazing. It's the Kanata & Konata acrylic
    stand! This... I really wanted to leave my little sister Konata in this form to
    live on, so it's merch born because I wanted it! Isn't it cute? That's great,
    right? So, next is this!
- start: '02:48.500'
  end: '03:11.500'
  original: じゃーん！すっ！ボイスキーホルダーです！ボイスのね、6種は僕がオリジナル考えました。オリジナル中身もね、へい！このかなたとかだけのさ、じゃーん！で、このイラストもですね、僕原案をかいて、プロがすごいよくしてくれましたね。でも分かるでしょ、かなたその絵柄って。皆さんありがとうございますと。収録ボイス届いててのお楽しみです！いっぱいぽちぽちしてください。そして最後のグッズは、こちら！
  english: Ta-da! Whew! It's a voice keychain! I came up with all six original voice
    lines myself. For the original contents too, like "Hey! It's just Konata," ta-da!
    And for this illustration, I drew the draft, and a professional made it look amazing.
    But you can tell it's Kanata's art style, right? Thank you everyone. Look forward
    to when the voice recordings arrive! Please tap away. And the final goods are,
    this!
- start: '03:15.000'
  end: '03:47.000'
  original: じゃじゃーん！アルティメットへ民認定証！これは、最後まで応援してくれた究極のへ民、アルティメットへ民の認定証です！シリアルナンバーが入っていて世界で1枚です！ちなみにちょっと、あの、お買い得じゃねえや、手が届きやすいので、これだけでもね、ぜひね皆さん、あの思い出によろしくお願いします！いままでへ民じゃなかったけど、かなたって思った人もね、アルティメットへ民だからあんたは！ということでですね、ええ、お次は、
  english: Ta-da! Ultimate Heimin Certificate! This is the certificate for the ultimate
    heimin who supported me until the very end, the Ultimate Heimin! It has a serial
    number and there's only one in the world! By the way, well, it's not a bargain,
    but it's easy to get your hands on, so even just for this, everyone, please treasure
    it as a memory! Even if you weren't a heimin until now, but thought "Kanata!",
    you're an Ultimate Heimin! So, uh, next,
- start: '03:47.800'
  end: '04:17.500'
  original: こちら特典ですね！はい、特典はポストカードになっております！数量限定が直筆サイン入りだったんですが、こちらはですね12月24日の8時から販売開始しており、もう品切れる、ごめんなさい、完売しているんですけど、フルセットの方はまだありますので、複製サイン入ってますのでよろしくお願いします！ちょっとね、このフルセット特典の方は、寂しいよっていう気持ちがちょっと溢れて、だ、だ、だ、だ、るーって感じになっております！はい、ぜひよろしくお願いします！
  english: here is the bonus! Yes, the bonus is a postcard! The limited quantity version
    came with a handwritten signature, but this went on sale from December 24th at
    8:00, and it's already sold out—sorry, it's sold out, but the full set is still
