  thoughts: |+
    **A Retrospective on Growth and Gratitude**

    As I reflect, it's incredible to see where I am now compared to where I began. It started with a clip, actually, a long-tone performance from a live stream that took off, people were really talking. I remember thinking how it felt like an "escape," a long tone substitute for the original song's death growl, a challenge I took on. Now, people were saying how amazing it was! This long tone became a pivotal moment, and the positive feedback was something I wouldn't take for granted, pushing me to pursue singing.

    This reception spurred me forward, leading to so many milestones. From a sold-out first album, "Unknown DIVA," to the upcoming release of my second album, "Trigger," and my solo live. I poured my all into the production of this album, the artwork, and even composing a song called "Juman-okudo," which I challenged myself to include a rap! "I've been working on writing another song called 'Sekai de Ichiban no Idol' (The World's Number One Idol), which reflects my honest feelings. I hope it reaches the Heimin.

    The journey continues to be an upward climb, the progress is clear. I see how far I've come, and I'm deeply grateful to my close friends, Okayu, Lamy, and Flare. It’s hard to believe how far I've come. I remember back to my debut stream, what I said. Back then, I talked about how the listeners, the Heimin, and making those wild dreams come true. I’ve realized my vision of doing my best from start to finish, and making myself and everyone happier than we are now. It’s been an incredible ride, and I’m so excited to see what the future holds.


