    **My Deep Dive into Vocal Technique and Performance**

    Okay, here's how I'm thinking about this whole vocal thing. First, I'm analyzing Kanata's journey – it's been a real process of refining my singing style. I started by examining my vocal habits – those quirks that make my voice *me*. Some might say those quirks are what make me stand out, but others prefer a cleaner sound for easier listening. I've realized that my own habits are quite strong, so I had to make some conscious choices about what to keep and what to shed.

    Initially, I went for a radical approach, trying to eliminate every habit, almost aiming to sound like a Vocaloid, zeroing in on a "vocal" effect. I remember when I was singing "Meltdown" for some of my covers, I wanted to remove all the quirks I had. That led me to focus on perfecting what I considered "good" habits, and minimizing the less desirable ones – a kind of vocal "polish".

    Then, I started noticing changes in how Kanatan sings and I reflected on my own journey. In the early days, with Okayu-senpai, I was still filtering out a certain sound, it's fair to say there were moments where my voice wasn't quite refined. It's been a long and painful journey, but it took an entire year of vocal "filtering" to reach the current standard.

    I studied contemporary artists like YOASOBI – the trendy techniques, the nuances. What I'm doing is analyzing the current trends in music with how to apply those techniques. I listen to their vocals and analyze how they use their habits. I also think about how I can weave these trends into my style – a question of whether or not to lean into them. I'm researching past trends as well - the rock eras, the ballad eras, the "emo" styles, looking at how singing evolves with music styles.

    It makes me wonder if I'm even trying to improve my singing style enough. I'm a real hard worker. I'm so grateful for those who appreciate my efforts! I've had to make some big changes. I realized I needed to rethink how I approach everything to change how I sing. I had to start from the ground up, because of all the habits and quirks I had developed. It was the only way to evolve my singing style.

    The process has paid off – recording used to take me hours, now I can record in just 20 minutes! That's how well I can make those refined habits work and still keep the emotions in my vocal style. Now I can instantly add those habits. It's now very easy to satisfy my own style when recording. Do others approach recording with a similar level of commitment?

    At the moment, I'm struggling with my own vocal habits. I'm taking this a little bit more seriously now because I'm starting to have more opportunities to sing with Hololive, so my own unique quirks are starting to "appear". I'm trying to decide if I should embrace these new vocal habits. Should I leave it in, or should I go with a "cleaner" approach? I am currently trying to figure this out with Kanatan.

    I'm waiting for Kanatan to finish giving advice because there's more to come with my consultations. I wonder what others think – Lamy, sometimes I have trouble discerning Lamy's emotions when she sings. What?! Her emotions aren't dead. I try my best to imagine the scenes to put more emotion into my music. That being said, I have no emotions, it may be because I am a monster! No! That can't be true!

    Okayu-senpai has a really strong emotional delivery with her singing. Back when Kanatan and I were studying mixing techniques, emotion tends to get lost in the pitch correction. It's a balance! I have to prioritize pitch or expression. Pitch is important. When you worry too much about pitch, it decreases your expression.

    Sometimes you need to focus on one line in your song to be able to deliver your style. It's super helpful. I'm still learning! My efforts paid off! As a result of this dedication, my 3rd-anniversary live "Bessekai" at the end of 2022 resulted in a big success! The next page is the result. My 21-second long-tone singing became a major sensation! Amazing!



