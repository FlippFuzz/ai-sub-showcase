responses:
- subtitles:
  - start: '00:00.300'
    end: '00:02.100'
    original: リスナーさんのね、反応がこちら！
    english: Here is the listeners' reaction!
  - start: '00:03.100'
    end: '00:07.400'
    original: 全部ダサいってすごい ここまで悩むアンケートは初めて
    english: '"They''re all so lame," "I''ve never struggled this much with a poll,"'
  - start: '00:07.400'
    end: '00:09.600'
    original: センスが息をしていない
    english: '"It has zero sense left."'
  - start: '00:09.100'
    end: '00:09.900'
    original: ボロクソやん！
    english: Absolute trash!
  - start: '00:10.200'
    end: '00:10.800'
    original: 厳しいな。
    english: That's harsh.
  - start: '00:11.100'
    end: '00:13.100'
    original: 悩んでアンケート入れられないと。
    english: '"I can''t even vote because I''m so torn."'
  - start: '00:13.300'
    end: '00:13.600'
    original: なるほどね。
    english: I see.
  - start: '00:14.000'
    end: '00:19.900'
    original: ネーミングセンスがダサすぎたということで、この時「#かなたやめろ」のハッシュタグがつけられ、なんと日本のトレンドに入ります。
    english: 'Because her naming sense was too lame, the hashtag "#KanataStop" was
      created and actually trended at #2 in Japan!'
  - start: '00:20.100'
    end: '00:22.300'
    original: すごい！
    english: Amazing!
  - start: '00:22.500'
    end: '00:24.400'
    original: 恥ずかしいな。
    english: That's so embarrassing!
  - start: '00:24.700'
    end: '00:30.300'
    original: おかしいでしょ。でも、どの名前がいいかって当時のTwitterで投票してもらったんですけど、その結果がこうなります。
    english: Right? But here are the results from the Twitter poll back then to see
      which name was best.
  - start: '00:31.900'
    end: '00:34.000'
    original: 「THE かなた」が選ばれたと。
    english: '"THE Kanata" was chosen!'
  - start: '00:34.500'
    end: '00:37.700'
    original: でもなんか全部ほぼ一緒で、みんな悩んでるから。
    english: They're basically all the same, everyone was struggling!
  - start: '00:38.200'
    end: '00:43.700'
    original: ちょっとね、きみさなの。大接戦の末「THE かなた」に決定したんですよね。
    english: With a very slight difference after a fierce battle, it was decided to
      be "THE Kanata," right?
  - start: '00:44.200'
    end: '00:45.300'
    original: 悩んだだろうな、これみんな。
    english: They must have struggled a lot, everyone.
  - start: '00:46.300'
    end: '00:47.300'
    original: みんな悩みましね。
    english: Everyone really struggled, huh?
  - start: '00:49.300'
    end: '00:54.800'
    original: 結局時を経て、去年あたりですかね、「★THE かなた★」がダサいことに私は気づきました。
    english: And eventually, around last year or so, I realized that "THE Kanata"
      was actually pretty lame.
  - start: '00:55.700'
    end: '00:56.900'
    original: 気づきを得た！
    english: She finally realized it!
  - start: '01:00.000'
    end: '01:06.900'
    original: いろんなみんながおしゃれな名前だったりとか、ストレートにファンネームをつけているみんなのメンバーシップを見て、「★THE かなた★」ってダサかったんだと思いまして、
    english: Seeing everyone else with stylish names or straightforward fan names
      for their memberships made me realize how lame "THE Kanata" really was.
  - start: '01:08.000'
    end: '01:10.900'
    original: 現在のメンバーシップの名前は「へい民」になっております。
    english: So now, the membership name is "Heimin" (Commoners).
  - start: '01:11.200'
    end: '01:13.600'
    original: よかった〜！拍手すんだよよかったじゃない！拍手すんだ！
    english: That's great! You finally managed to clap back!
  - start: '01:17.200'
    end: '01:17.700'
    original: 残念だろ。
    english: What a pity.
  - start: '01:20.000'
    end: '01:22.400'
    original: でも他にもちょっとかなた先輩といえばで気になってることがあって、
    english: Also, people often talk about Kanata-senpai having certain character
      traits.
  - start: '01:23.000'
    end: '01:29.600'
    original: かなた先輩握力キャラというか、力がめちゃあるみたいな感じで、自己紹介とかでも言ってると思うんですけど、
    english: Kanata-senpai is known as a grip-strength gorilla with a lot of physical
      power, and she talks about it in self-introductions.
  - start: '01:30.100'
    end: '01:31.200'
    original: あれは最初からではなかったんですか？
    english: Wasn't that a thing from the very beginning?
  - start: '01:32.900'
    end: '01:35.300'
    original: そうだね、自己紹介で言うようになったのは途中からでね。
    english: That's right, I started mentioning it in my self-introductions midway
      through.
  - start: '01:36.200'
    end: '01:44.400'
    original: 昔から、本当中学校とかの頃かな、握力が強くて、雑談の中でね握力50kgあったんだよねみたいなことを言ったりとか、
    english: Back in middle school or so, my grip strength was really strong, and
      I used to casually mention in chats that my grip was 50kg, or things like that.
  - start: '01:45.000'
    end: '01:52.500'
    original: もうあの、力が強くて物が壊れちゃうって話をよくしてたら、なんかだんだんだんだん、なんかかんないけど「握力ゴリラキャラ」が定着していて。
    english: And as I kept talking about how my strong grip kept breaking things,
      the "grip-strength gorilla" character somehow naturally stuck.
  - start: '01:54.000'
    end: '01:56.500'
    original: そんな僕がね、今までうっかり握りつぶしたものは、こちらで。
    english: So, here are the things I've accidentally crushed so far.
  - start: '01:58.500'
    end: '01:59.300'
    original: 多いなあ！
    english: That's a lot!
  - start: '01:59.600'
    end: '02:05.700'
    original: お寿司、マカロン、蒸したジャガイモ、お弁当のスプーン、コーヒーメーカー、キーボード、Switchのコントローラー、などなどですね。
    english: Sushi, macarons, steamed potatoes, bento spoons, coffee makers, keyboards,
      Switch controllers, and so on.
  - start: '02:07.100'
    end: '02:15.500'
    original: お寿司とかマカロンは、マカロン初めて食べた時に、優しく持とうと思ったんだけど、優しく持ったのに、も、ボロボロになって…
    english: For sushi and macarons—when I ate a macaron for the first time, I tried
      to hold it gently, but even though I tried, it completely crumbled...
  - start: '02:16.100'
    end: '02:17.300'
    original: そのエピソード大好き！
    english: I love that story!
  - start: '02:17.700'
    end: '02:18.400'
    original: 怖いなあ。
    english: That's terrifying!
  - start: '02:20.100'
    end: '02:22.500'
    original: あの、この中にあるお弁当のスプーンってやつなんですけど、
    english: As for the bento spoon on that list,
  - start: '02:23.500'
    end: '02:36.100'
    original: これラミィの企画に前にかなたほうが出してくれた時に、あの楽屋で出るお弁当がカレーだったんだけど、その時のスプーンをバキッて壊しちゃって、普通に食べてるだけでスプーン壊してて。
    english: when Kanata-tan appeared on Lamy's stream before, the bento in the green
      room happened to be curry, and she snapped the spoon in half just by eating
      normally!
  - start: '02:39.700'
    end: '02:39.900'
    original: そうなんです。
    english: Yeah, seriously.
  - start: '02:40.400'
    end: '02:41.800'
    original: そう、びっくりしましたね。
    english: I was so surprised, seriously!
  - start: '02:42.500'
    end: '02:44.200'
    original: 家ではあれですか、石のすぷーんとか使ってるの？
    english: Do you use stone spoons at home or something?
  - start: '02:44.700'
    end: '02:46.400'
    original: 石のスプーン違いますよ。
    english: No, stone spoons? That's not it!
  - start: '02:48.000'
    end: '02:48.800'
    original: 鉄すら壊す。
    english: I even break metal!
  - start: '02:49.300'
    end: '02:54.600'
    original: まあ、あのちゃんと割り箸とか使いますけど、たまに割り箸も割れるけど。
    english: I mean, I use disposable chopsticks and stuff, though sometimes those
      break too.
  - start: '02:55.300'
    end: '02:58.700'
    original: そうですね、スプーンまっぷたつ事件は楽屋でこれやったのは2回ありますね。
    english: Anyway, that "snapping a spoon in half" incident has happened twice in
      the green room.
  - start: '02:59.000'
    end: '03:00.600'
    original: やば〜い！2回もあったんだ！
    english: No way, twice?!
  - start: '03:00.700'
    end: '03:01.300'
    original: 怖い。
    english: That's terrifying.
  - start: '03:02.100'
    end: '03:13.300'
    original: そしてちょっと前配信の流れで握力を計測した結果がこちらでございます。握力55.9kgですね。ゴリラやん！
    english: 'And the result of my grip strength test from a recent stream is right
      here: 55.9kg!'
  - start: '03:13.700'
    end: '03:14.300'
    original: やば！
    english: That's insane!
  - start: '03:14.900'
    end: '03:19.400'
    original: 配信でお酒をね、珍しく飲んだ時に、酔ってリミッター外れてんじゃない？みたいなノリで、
    english: I drank alcohol on stream for once, and feeling a bit tipsy, I thought,
      "Maybe my limiter is off right now?"
  - start: '03:19.900'
    end: '03:25.300'
    original: 握力計が僕のお家にあるので測ってみたんですけど、55.9kgの新記録が出て、
    english: So I measured it with the grip strength meter I have at home, and I got
      a new record of 55.9kg.
  - start: '03:26.500'
    end: '03:32.400'
    original: これはですね、レスリングの霊長類最強女子吉田沙保里さんが、あるテレビ番組で計測したのが55kgだったの
    english: That actually beats Saori Yoshida, the strongest woman in human history,
      who measured 55kg on a TV show!
  - start: '03:33.200'
    end: '03:35.300'
    original: おいおいおいおい、それ超えてます！
    english: You beat her?!
  - start: '03:36.300'
    end: '03:37.400'
    original: ちょっと握手してみますか？
    english: Want to try a handshake?
  - start: '03:37.800'
    end: '03:38.200'
    original: やだやだ、怖い怖い。
    english: Scary, scary, scary.
  - start: '03:40.300'
    end: '03:42.500'
    original: ラミィ、ラミィとかね、ラミィとか前に握手したことあるんで、
    english: Lamy, Lamy, you've shaken hands with me before, right?
  - start: '03:43.700'
    end: '03:45.300'
    original: あ、ね。新人ちゃん。
    english: Ah, right. Ah, newcomer-chan.
  - start: '03:46.300'
    end: '03:48.800'
    original: え、ていうか、握力7kgだったんですけど…
    english: Wait, your grip strength was 7kg...
  - start: '03:49.600'
    end: '03:51.300'
    original: じゃあ、1回僕を壊す気で来てください。
    english: Then come at me with the intent to break my hand!
  - start: '03:51.600'
    end: '03:53.300'
    original: 8倍！え、行きますよ。8倍！
    english: 8x! Let's go!
  - start: '03:54.100'
    end: '03:55.700'
    original: オラァ！もっと本気で来い！
    english: Come at me with more spirit!
  - start: '03:56.500'
    end: '03:58.200'
    original: オラァ！くそっ！あーーーっ！！
    english: Aaaaaah!
  - start: '04:00.000'
    end: '04:02.100'
    original: う、腕がぁぁぁ！
    english: My arm!
  - start: '04:03.500'
    end: '04:05.100'
    original: 力の入れ方ってものを教えてやる。
    english: I'll teach you how to put strength into it!
  - start: '04:05.900'
    end: '04:07.100'
    original: 怖い怖い、やめてください！
    english: Scary, please stop!
  - start: '04:08.800'
    end: '04:11.300'
    original: 莉々華、大丈夫？動く？大丈夫です、動けました。
    english: Ririka, you okay? Can you move? I'm fine, I shook it off.
  - start: '04:12.700'
    end: '04:14.300'
    original: よかった、もうちょっとで壊すところでしたね。
    english: Good, I was close to breaking you.
  - start: '04:15.900'
    end: '04:22.400'
    original: 本当にホロメンは、あの力の弱い子が多いので、僕がね、おかしいような雰囲気がよく漂いますが、
    english: Truly, most Hololive members are physically weak, which is why I might
      seem a bit unusual.
  - start: '04:24.000'
    end: '04:28.100'
    original: まあそしてそんなね、あのキャラとツッコミキャラ、大きなターニングポイントとなりました。
    english: And so, that character and my "tsukkomi" role became a huge turning point
      for me.
  - start: '04:29.600'
    end: '04:35.400'
    original: で、このツッコミキャラなんですけど、当時マインクラフトのホロライブサーバー内に、かなた城をお城をね、建設していた僕なんですが、
    english: Regarding my tsukkomi role, back when I was building "Kanata Castle"
      on the Minecraft Hololive server,
  - start: '04:36.000'
    end: '04:41.200'
    original: それを見たフレア先輩が、「かなた学校建設予定地」とね、看板を書きまして、学校に見えたんですよね。
    english: Flare-senpai saw it and put up a sign that said "Kanata School Construction
      Site," making it look like a school.
  - start: '04:41.800'
    end: '04:43.300'
    original: 「学校じゃねーからこれ！」と、思わず言ったと。
    english: '"This isn''t a school!!" I instinctively retorted.'
  - start: '04:44.800'
    end: '04:48.300'
    original: そしてみこ先輩も来て、「AO入学可能」と。
    english: Then Miko-senpai showed up and added, "AO admissions available!"
  - start: '04:48.600'
    end: '04:51.300'
    original: で、学校いじりのボケが続いたので「学校じゃねーよ」とね、ツッコミ続けたと。
    english: And since the school joke kept going, I kept shouting, "This isn't a
      school!!"
  - start: '04:52.400'
    end: '04:53.100'
    original: いいよいいよ。
    english: That's fine, whatever!
  - start: '04:54.000'
    end: '04:57.900'
    original: で、リスナーも喜んでくれまして、この時に気づいたことがあります。
    english: And the listeners loved it too, which made me realize something right
      then.
  - start: '04:58.500'
    end: '05:02.100'
    original: 次のページ。ホロライブにはボケが多い！
    english: Hololive has way too many bokes!
  thoughts: null
