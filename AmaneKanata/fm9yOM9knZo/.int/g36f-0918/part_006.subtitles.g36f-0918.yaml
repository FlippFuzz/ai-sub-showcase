    Okay, now for my thoughts. It started when the listeners' words of encouragement, like, "We still love your singing," gave me the feeling that it was okay to continue. Even when I knew it must be difficult to listen to my voice currently, I was motivated to do my best for them. Those warm words from the listeners... they resonate deeply, and it makes me happy. Everyone has experienced that kind of thing, right?

    I definitely have! When I'm feeling down, I check the vanity searches and see comments like "She was cute today," or "She's working so hard." Those kind comments fill my heart with gratitude, and they push me to do my best again. Really, thank you all.

    There was a time when I had to take a break from streaming due to a health issue. But during that break, the listeners kept saying, "We'll wait for you forever," and "Rest properly to get better." They were always there, and when I came back, they welcomed me so warmly. That really touched me. Yukimin, I always love you! So emotional!

    It's similar to how Okayu-senpai, though she's been okay, still shows such compassion. When I'm playing a game and a sad scene comes along, and I start crying and sniffling, she'll say things like, "Take your time," or "Blow your nose slowly." I feel their kindness. I also received support from the Holo-members, too. For instance, Flare-senpai said, "Even with ear illness and other handicaps, you're still a great singer, so you're amazing!" which was very encouraging.

    And then there was my Gen-mate Kiryu Coco...Though she graduated. At the time, we were living together, so when I was down, she wouldn't say anything specific but just ask, "Ah, wanna eat?" and we'd end up having miso soup together or eating snacks at 3 AM. It really helped me.

    But then, a major event came: Coco's graduation. We were Gen 4, originally five of us, and Coco, who was incredibly funny, decided to graduate. Because we lived together, I heard all kinds of stories, and we were the closest. We were so similar in our goals and daily life. So, her graduation was a significant event for me.

    For us who were with her from the start, she really left a legendary mark. When Gen 4 came into Hololive, with ARK, and AsaCoco, it was exciting every morning. Her daily live streams that summarized news from other Holomembers were so innovative. She was a genius. Even with the work she did, she always thought of the agency. When her graduation was decided, I was sad. But, I had one thing that I wanted to do: Create an original song as Gen 4.

    I wanted us to have an original song as five. But when I asked the staff, they said, "We won't make it in time." Song production takes time, and when her graduation was decided, they said that making a song at this stage wasn't possible. And so, I thought, "Then, I'll just make it myself!"


