  thoughts: |+
    **My Debut Mishap: A Retrospective**

    It seems like things really did "drop sharply" back then, didn't they? Thinking back, it's quite a story. Back in December 2019, nearly five years ago, I debuted. Beforehand, I was brimming with anticipation for this "fun Hololive life" I was sure I was about to have. Apparently, my excitement was a bit, shall we say, *exaggerated*.

    Before that debut, I remember carefully crafting personalized messages to each of my admired seniors. Even Okayu-chan got one! I was also putting in serious effort into the debut stream itself. Now I am curious how everyone else felt leading up to their debut? Thinking back Lirika's was really recent! I know Lirika spent months, like three or four, researching and preparing, taking a lot of notes. Amazing! And Lamy also put in months of prep time. Okayu-san's era was different, though; there wasn't so much intense preparation, though she did have some clever tweaks to make an hour pass. The difference in quality between those early streams and the ones today is just astounding. Debut streams are just getting higher and higher in quality. Nowadays, they often have original songs, animated openings, the works.

    And that's where I made my crucial mistake. It was a blunder. In my *important* debut stream, my big "introduction" was... a PowerPoint presentation. And the viewer's reaction? Utterly tacky! I spent over a month meticulously crafting this PowerPoint, pouring my heart into it, only for it to be utterly roasted. They actually have the footage of it: It's all quite tacky! The star graphics are intense! The presentation itself? Hard to read! The dreams, the goals… I remember aiming for 50,000 subscribers, thinking that would be my ticket to getting a 3D model. I also had this dream of performing live, doing call-and-response with the audience. I really dedicated a whole month to that PowerPoint. My fellow gen-mates ribbed me, saying I could have done so many other things with that time! But, when I look back, was it stylish? Lirika thought it was "super tacky". Okayu said "That's Kanatan's charm". Lamy thought it had "a bit of character." But, looking back, it's hard to disagree.

    And the fans, they still call me "PP Angel." I even have a T-shirt! On top of that, I played a Soran Bushi that I made entirely from my own vocals. I was trying to make my debut to be really edgy. And... well, here's the video of that. You can even see that I used the *Irasutoya* graphics. The chant parts are even yellow! And, you can hear both high and low pitched voices in the chorus. It's got a big echo. You can see everyone saying "Dokkoisho!" at the top right. Such an entrance for me. And, to think, I was initially planning on a cool character...
