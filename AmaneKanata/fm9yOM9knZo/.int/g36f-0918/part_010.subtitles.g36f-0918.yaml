name: part_010
total_attempts: 1
video_duration_ms: 300677
subtitles_prompt_version: 18
responses:
- subtitles:
  - start: '00:01.000'
    end: '00:03.700'
    original: ということで いろんなしくじりや事件があって 紆余曲折しましたが
    english: So, while there were various blunders and incidents, and many twists
      and turns...
  - start: '00:03.700'
    end: '00:08.800'
    original: 今こうして天音かなたという僕 出来上がりました！ ありがとうございます！
    english: '...now, here I am, fully formed as Amane Kanata! Thank you so much!'
  - start: '00:08.800'
    end: '00:11.800'
    original: 皆さん、今日の授業いかがだったでしょうか？
    english: Everyone, how was today's lesson?
  - start: '00:11.800'
    end: '00:14.900'
    original: めっちゃ良かったよ！ 超勉強になった！
    english: It was really great! I learned so much!
  - start: '00:14.900'
    end: '00:20.000'
    original: かなたんが努力の人っていうのが この時間でものすごい分かったと思う
    english: I think this lesson really showed us how hard-working Kanatan is.
  - start: '00:20.000'
    end: '00:22.500'
    original: 本当だよね！ 本当ありがとう！
    english: That's so true! Thank you so much!
  - start: '00:22.500'
    end: '00:26.100'
    original: いろんな苦労もあっただろうに それを感じさせず...
    english: You must have gone through so many hardships, but you never let it show...
  - start: '00:26.100'
    end: '00:32.600'
    original: いやいやいや... 本当にね 僕正直 この授業 ホロメン全員分見たいぐらいあります！
    english: No, no, no... Honestly, I'd love to see a lesson like this for every
      single Holo-member!
  - start: '00:32.600'
    end: '00:37.000'
    original: みんなの人生を教えてくれ！
    english: '"Tell me about all your lives!" I''d say.'
  - start: '00:37.000'
    end: '00:43.900'
    original: ということでね 歌の話もしーの ちょっと実はね はっきり言ってこれはね 収録なんです！
    english: So, after talking about singing... to be totally honest with you all,
      this is actually pre-recorded!
  - start: '00:43.900'
    end: '00:48.800'
    original: はっきり言って 収録だから 僕たち今 過去から来ています！
    english: Exactly! Because it's pre-recorded, we're currently speaking to you from
      the past!
  - start: '00:48.800'
    end: '00:54.800'
    original: 未来の僕 今ここから 生で続きの配信してくるので！
    english: So, the future me will now take over and continue the stream live from
      here!
  - start: '00:54.800'
    end: '00:57.200'
    original: じゃあ 未来に行ってくる！
    english: Well then, I'm heading off to the future!
  - start: '00:57.200'
    end: '01:01.300'
    original: あれ？ 置いていかれる感じ？ 僕たちはこの後どうしたら？
    english: Wait! Are we being left behind? What are we supposed to do after this?
  - start: '01:01.300'
    end: '01:05.100'
    original: カニ行こうな！！
    english: Let's go get crab!!
  - start: '01:05.100'
    end: '01:08.500'
    original: いえ〜い！！ カニ〜〜〜！
    english: Yay!! Crab~~~!
  - start: '01:08.500'
    end: '01:12.300'
    original: 行ってくる〜！ 未来に！
    english: Off I go~! To the future!
  - start: '01:35.800'
    end: '01:40.800'
    original: 手詰まりな現状の行き場が とめどなかった感情と交差する
    english: The dead-end reality crosses paths with my unstoppable emotions.
  - start: '01:40.800'
    end: '01:45.600'
    original: どうしたってもう変えられない それはきっと個人の過護じゃない
    english: Nothing can be changed anymore. Surely it's not just an individual's
      flaw.
  - start: '01:45.600'
    end: '01:50.000'
    original: セーブの手が効くのは 限られた範囲の話で
    english: Relief works only within a limited range,
  - start: '01:50.000'
    end: '01:55.200'
    original: そこから外れちゃっちゃあ不干渉 どうせ何を言ったって勝機がないんだって
    english: Outside of which lies indifference—say what you will, there's no chance
      of winning.
  - start: '01:55.200'
    end: '02:00.000'
    original: 自分の塔は高すぎて びくともしない机上の仮説
    english: My tower is too high—a mere theoretical hypothesis that won't budge.
  - start: '02:00.000'
    end: '02:04.000'
    original: それならこれからの方法も 知らないからね
    english: In that case, I don't know what methods to take from now on anyway.
  - start: '02:04.000'
    end: '02:09.100'
    original: 変わらない後悔があったって 今できることなんて何もないんだ
    english: Even if there's unchanging regret, there's nothing that can be done right
      now.
  - start: '02:09.100'
    end: '02:13.900'
    original: どこいこうと苦戦はさけられない 決まり切った事実 擦り寄りそうもない
    english: Wherever I go, a hard struggle is unavoidable; a fixed reality that won't
      compromise.
  - start: '02:13.900'
    end: '02:18.000'
    original: 停滞していても最前提 嫌気がさすんだ
    english: Even in stagnation, it's the premise—I'm getting disgusted by it.
  - start: '02:18.000'
    end: '02:22.900'
    original: 今のままじゃあ滑落するだろう そして生真面目に心が軽くなってしまう
    english: As things stand, I'll probably fall; and seriously, my heart ends up
      feeling lighter.
  - start: '02:30.900'
    end: '02:36.000'
    original: 認めきれない言葉の連鎖で きっと僕らは無力であって
    english: Through a chain of unacknowledgeable words, surely we are powerless,
  - start: '02:36.000'
    end: '02:40.800'
    original: 思慮の行方が定まらないなら いっそ何もわからないままで
    english: And if the destination of our thoughts remains unclear, I'd rather stay
      knowing nothing at all.
  - start: '02:40.800'
    end: '02:45.300'
    original: 収まりきれない常識の尺度は 絶対的に正しくないが
    english: The scale of common sense that can't fit in is by no means absolutely
      correct,
  - start: '02:45.300'
    end: '02:50.000'
    original: 僕の手におえない君の理はどうやったって救い様がない
    english: But your logic beyond my control is beyond salvation no matter what.
  - start: '03:09.000'
    end: '03:13.900'
    original: 君らが慈愛を請うたって 正直役目の管轄外
    english: Even if you beg for mercy, honestly it's outside my jurisdiction.
  - start: '03:13.900'
    end: '03:18.100'
    original: 結局未来の想定も セルフとなってます
    english: In the end, assumptions of the future are up to self-service as well.
  - start: '03:18.100'
    end: '03:22.800'
    original: しょうもない救済を待っていても 神様も救いはやってこないし
    english: Even if you wait for some silly salvation, God's help won't come either,
  - start: '03:22.800'
    end: '03:27.700'
    original: 時間が超過しすぎるだけ 止め処ない思考 事象を知らず
    english: And time will just pass by too much—unending thoughts, ignorant of facts.
  - start: '03:27.700'
    end: '03:32.400'
    original: 変わらない後悔があったって 今できることなんて何もないんだ
    english: Even if there's unchanging regret, there's nothing that can be done right
      now.
  - start: '03:32.400'
    end: '03:37.200'
    original: どこいこうと苦戦はさけられない 決まり切った事実 擦り寄りそうもない
    english: Wherever I go, a hard struggle is unavoidable; a fixed reality that won't
      compromise.
  - start: '03:37.200'
    end: '03:41.800'
    original: 十人十色関係なく 自分のことで精一杯なんだ
    english: Regardless of individual traits, everyone's full with their own affairs.
  - start: '03:41.800'
    end: '03:46.500'
    original: 空を飛ぶための羽も買い 自分の足で歩くしかないのだろう
    english: Buying wings to fly through the sky, there's no choice but to walk on
      our own feet.
  - start: '04:07.500'
    end: '04:12.800'
    original: みんな！ 見ましたか？ みんなー！
    english: Everyone! Did you watch it? Everyone~!
  - start: '04:12.800'
    end: '04:17.300'
    original: 帰ってきたよ！ ちょっと... この教室で...
    english: I'm back! Man... back in this classroom...
  - start: '04:17.300'
    end: '04:20.600'
    original: ちょっと一回生きて... 誰もいない！
    english: Wait a second, let me catch my breath... Nobody's here!
  - start: '04:20.600'
    end: '04:25.000'
    original: おい！ 勝手に帰ったー！
    english: Hey! They went home on their own!
  - start: '04:25.000'
    end: '04:28.000'
    original: いやー、ありがとうございました！
    english: Well, thank you so much!
  - start: '04:28.000'
    end: '04:32.000'
    original: ということで、すごい楽しかったよね！
    english: So, that was really fun, wasn't it!
  - start: '04:32.000'
    end: '04:36.700'
    original: パチパチありがとう！ 今歌った曲なんですが、新曲になります！
    english: Thank you for the applause! The song I just sang is actually a new song!
  - start: '04:36.700'
    end: '04:47.300'
    original: こちら！ 7月23日水曜日に発売予定の僕の2ndアルバム『Trigger』から、サツキさんに制作いただいた『セルフサービス』を初披露させていただきました！
    english: Here it is! I just premiered "Self Service," produced by Satsuki, from
      my 2nd album "Trigger," set to release on Wednesday, July 23rd!
  - start: '04:47.300'
    end: '04:54.800'
    original: 本日この後21時からMVを公開！ そして24時から各配信サービスにて音源リリース予定です！
    english: Today, the music video will be released at 21:00! And the audio track
      will be released on streaming services at 24:00!
  - start: '04:54.800'
    end: '05:01.000'
    original: そして！ アルバム追加情報として『Trigger』に収録されている全9曲もの情報を...
    english: And! As additional album info, here is the track list for all 9 songs
      included in "Trigger"...
