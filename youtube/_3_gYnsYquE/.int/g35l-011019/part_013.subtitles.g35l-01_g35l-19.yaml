      a vertical tower and cannot change jump direction once airborne.
  - term: '#holorace2026'
    meaning: The official hashtag and title of the Hololive Jump King novice tournament
      event hosted by Mori Calliope.
  - term: アソビ☆まわり隊！
    meaning: Hololive's play-supremacy unit consisting of Hyakudo Kyoko, Netosen Mera,
      Suzuna Tsuzuri, and Sorashina Sopia.
  - term: ドパル (Doparu)
    meaning: Streamer slang coined by Netosen Mera meaning to achieve a successful
      high jump or get a rush of dopamine.
  - term: サラマンダー (Salamander)
