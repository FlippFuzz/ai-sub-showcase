global_summary:
  overall_summary: 'In this YouTube livestream, Hololive VTuber Netosen Mera participates
    in the #holorace2026 Jump King novice tournament hosted by Mori Calliope and co-hosted
    by Isaki Riona. Facing unexpected stream setup and ad hurdles, Mera dives into
    the notorious 2D platformer with high energy and her signature salamander persona
    (''~noja''). Despite being a beginner who only started practicing days prior,
    she demonstrates surprising focus and calmness during the 1-hour race, ultimately
    securing 2nd place (runner-up) and winning prizes including a massage gift card
    and Hololive diamonds.'
