      季節は流れて 夏の終わりを告げる鈴虫が リン、と鳴く
      「綺麗な指だね」と 傷だらけの手を握る、その手が あまりにも冷たくて...
      「いつか綺麗な指がなくなっても、 それでも私を愛してくれますか?」
      「当たり前だよ」って 咳き込みながら
      痛む指を 大きな手が包んだ
      昼も夜も 機を織り続けて
      早く早く、薬を買わなければ...
      もう少し、あと少し、紅葉が散る前に
      この指が止まるまで... この羽が、尽きるまで...
      ――嗚呼 落日の風――
      ――無情に朽ちていく実の――
      ――灯火を揺らし 落とす――
      「いつか、私がヒトじゃなくなっても、 あなたは、私を愛してくれますか?」
      怖くて真実は告げられぬまま
      そっと ひとり、最後の羽を折り...
      "当たり前だよ"って 僕は笑い
      翼を失くした君を抱きしめた
      舞い落ちる粉雪が 山の背を白く染める
