      舞い落ちる粉雪が 山の背を白く染める
      寂れた村の あばら家で 二人、身を寄せ合う 冬の夜
      「出会った日も、雪だった」 あなたが 微笑みつぶやく
      囲炉裏火に火照った顔を 大きな袖の影に隠した
