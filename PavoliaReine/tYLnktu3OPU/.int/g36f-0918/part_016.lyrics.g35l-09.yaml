      「綺麗な声だね」と あなたが言った
      ただそれが、その言葉が、嬉しくて
      「いつか、綺麗な声が出なくなっても、 それでも、私を愛してくれますか?」
      「当たり前だよ」って 優しく笑い
      そっと 大きな手が頬を撫だ

