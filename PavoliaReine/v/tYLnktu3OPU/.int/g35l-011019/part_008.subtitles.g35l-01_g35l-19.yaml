  overall_summary: 'In this special 3D birthday stream titled ''Reine B''Day Classroom
    -Field Trip: Food & Games-'', Pavolia Reine celebrates her birthday with hololive
    colleagues Mori Calliope, Takanashi Kiara, and Vestia Zeta. The stream is styled
    as a classroom field trip exploring Indonesian culinary culture and fun games.
    It features pre-recorded location shoots in BSD City, Indonesia (visiting Jalarasa
    Indonesian Cuisine) and Tokyo, Japan (visiting Wayang Bali with Akai Haato), interspersed
    with studio mini-games like the Kerupuk eating contest and the Bolla hopping challenge.
    The stream concludes with the premiere performance of Reine''s brand new original
    song ''Endless Blue''.'
