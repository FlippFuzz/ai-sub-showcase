  overall_summary: 'This is the 3D birthday live stream of Pavolia Reine from hololive
    Indonesia (Generation 2), titled ''《Peafowl of The Blue Flame》 Pavolia Reine 3D
    Birthday Live 2025 #ReineMEPtember2025'', held on September 9, 2025. The concert
    features a vibrant ''Blue Flame'' theme symbolizing burning passion and strength.
    Reine performs various songs including ''KiLLKiSS'' by Ave Mujica, ''CR詠ZY'' by
    Vivid BAD SQUAD, ''Love Me Love Me'', ''Bunny Girl'', ''Yummy Yum Yummy'', ''Haik
    Yorokonde'', ''Ice Cream'', and debuts her new original song ''Figure It Out''.
    Special guest appearance includes her illustrator and creator Pochi-mama (Iida
    Pochi), featuring playful ojou-sama roleplay, banter, massage interaction, and
    merchandise showcases.'
