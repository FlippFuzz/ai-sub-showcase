    The provided `<scene_and_lyrics_reference_json>` was my initial resource, especially for the "CRaZY" lyrics. However, I immediately recognized the need to *actually listen* to the audio. Reference lyrics are just that - a reference. The performance could differ. So, I switched to an iterative approach: listen, transcribe or adjust the timing from the raw audio. It was also important to note what the on-screen text said, and how that dictated things as supreme fallback.

    I meticulously went through the audio segment by segment. For the song, I started at the beginning, noting the exact start and end times of each phrase, and matching it to the provided lyrics or adjusting it. I had to pay extra attention to timing that was not perfectly matched.

