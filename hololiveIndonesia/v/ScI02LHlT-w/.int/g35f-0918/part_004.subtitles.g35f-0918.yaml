  thoughts: |+
    **A Deep Dive into Hololive Indonesia's Energetic Banter**

    Okay, here's the deal: I'm meticulously transcribing and translating this clip of Kobo Kanaeru, Vestia Zeta, and Kaela Kovalskia from Hololive Indonesia. This Indonesian is flowing fast, but I'm on it!

    00:00.000 - 00:02.000 Kaela kicks things off with a little trepidation. She's worried about sharing the computer, I'm guessing. "I'm scared. Okay, fine." I get that.
    00:02.000 - 00:07.500 Kobo's already thinking about the audience's reaction, she suggests they mess with Zeta, if they are not allowed to use the computer together. "If we can't fight over the computer with Zeta, hmm... how annoying!" I can relate to the struggles of sharing tech!
    00:07.500 - 00:19.500 They've decided to engage with the audience by yelling and screaming. Kobo wants to start it off. "Let's just play with the audience instead. Kobo wants us to try screaming at the audience, because they screamed at us earlier. I mean, we scream together with the audience, dear audience!"
    00:19.500 - 00:41.500 Zeta jumps in to solidify the idea. Screaming WITH the audience, not AT them, is the vibe. "Right! Scream together with the audience, not screaming at the audience." Kaela is game! "Well, if you want to scream, I don't mind. I'll join." And then, they're gearing up, getting the audience ready for their next performance.
    00:41.500 - 01:07.500 Everyone's ready! They agree to have some screaming fun with the audience. The "Baka!" chant is going strong. "How is it, everyone? Are you ready yet?! Looks like they're ready. Okay! Kobo first. I want us to scream together... Stupid, stupid, stupid! Okay, ready? One, two, three! Stupid, stupid, stupid!"
    01:07.500 - 01:29.500 Kobo's loving the energy. Now it's Zeta's turn, with some kind of "Mission Start" call-and-response. "Love it, love it, love it! Zeta's turn, Zeta's turn. Me, me, okay, okay, okay. When I say 'Mission', you scream 'Start' together, okay? Ready? A-a-a... Mission... Start! Yay! Okay, next is Kaela." I like Zeta's catchphrase!
    01:29.500 - 01:53.000 Kaela has a similar call-and-response prepared for her fans, involving "Holo Hero". Kaela's energy is on point! "Okay, okay, okay. Now, this is for all the audience and also holoHero, if I say 'Holo Hero', you say 'Hoo-Haa!'. Easy, right? Right away, right away, right away! Okay. Ready? Holo Hero! Hoo-Haa! Awesome, awesome! Awesome, awesome, awesome! Cool, cool, cool. Finally, we are in sync." The unity is palpable.
    01:53.000 - 02:28.000 The conversation shifts to their past performances. The energy from their earlier set, especially their rendition of "100%", is still hitting hard. "Did you guys expect our first song would be '100%'? Pfft, who would have expected it? Even I myself didn't expect it. Starting right away with Hoshinova-mode like that. So cool, right? It was so cool. Especially when Zeta sang... Zeta and Kaela singing '100%', it felt like a real 100%, right?"
    02:28.000 - 03:08.500 They're reminiscing about the performances and songs. Kaela had a rap, which I'm still trying to transcribe (more ta-ta-ta-ta!). The vibe is all positive. "Wait, can you? It wasn't as cool as when I was accompanied like... Ugh, ugh! Like, have you guys ever sung a song as cool as that? Aura farming? Aura farming, aura farming. No, the song is really cool, it is Moona's song indeed

