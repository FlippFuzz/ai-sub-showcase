    'NEW[zom]BIE!!', and Kaela Kovalskia's 'dahlah.', interspersed with an entertaining
    MC banter session featuring Gen 3 members Vestia Zeta, Kaela Kovalskia, and Kobo
    Kanaeru. The stream concludes with an ensemble performance of the concert theme
    song 'Show Them (Who You Are)' featuring all nine hololive Indonesia talents,
    followed by an official anniversary merchandise showcase.
