    traditional Indonesian folk song medleys, an entertaining Emoji Dance Battle game
    corner, high-energy group performances and subunit songs (including 'Mau Tapi
    Malu'), special merchandise and multilingual voice drama announcements, and the
    grand premiere of their new original group song 'Senandung Jiwa'.
