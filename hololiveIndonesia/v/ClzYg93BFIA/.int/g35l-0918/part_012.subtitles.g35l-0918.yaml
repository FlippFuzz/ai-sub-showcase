  thoughts: |+
    **My Thoughts on Kobo Kanaeru's Merchandise Presentation**

    Okay, here's the rundown... first, the merch: There are pins, featuring Kaela, Kobo, and Zeta... I'm thinking of... these are cute! They're like, 30x31 in size... the user can measure for sure. These can go anywhere, on bags, clothes, even a sofa, whatever you like.

    The quality is definitely top-notch, as shown in the original photos. It's gold, bling-y, cat-themed, totally cool, and very solid. Buy all the pins, don't just get one, get nine. I have more things to show.

    Next is the *Pentas Seni Voice Drama*... I can't wait to release it...The illustration is new this time. It tells the backstage story of one day before a performance. It's available in three languages: Japanese, English, and Indonesian. It is so cool. I hope everyone will purchase this... and listen. Onegaishimasu!

    Oh, and there's one more thing... a small spoiler... coming in September... there will be acrylic stands, new 3D outfits, and original shirts. That's all for now.

    We also have a new song for all of us nine members... "Senandung Jiwa." The jacket cover is very beautiful. I think everyone will be impatient to hear this song and cry! The song was made by Sik... S-E-E-K, and the lyrics are by Budi Tanzania. Thank you to them. Sik has made songs for big Indonesian musicians before... so definitely listen. Get ready for our last song... it's "Senandung Jiwa."


