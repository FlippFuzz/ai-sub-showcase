    Okay, so I've got this: "Lifetime Showtime," right? The song itself is the debut track from FUWAMOCO (that's Fuwawa and Mococo) and Patra Suou. The prompt specifies to use the original artist/composer, so it's "FUWAMOCO / Patra Suou" for the original artist. Even though FUWAMOCO are *also* the VTubers performing it in the video, and the prompt wants me to avoid performer names, in this instance they are the original artist.

