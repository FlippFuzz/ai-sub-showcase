    Advent, titled 'BAU BAU and BEYOND'. Broadcasted live, the stream features a delightful
    blend of 3D studio banter, musical performances of their original and cover songs,
    a guided tour of their homeland in Makai (Northwest Passage), comedic pro-wrestling
    sketches with their mascot Peroro and guest appearances by hololive Gamers members
    Inugami Korone and Nekomata Okayu, and heartfelt letters expressing deep gratitude
    to their fans, the Ruffians.
