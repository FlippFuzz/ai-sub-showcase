    birthday party night 🎂🐾' (#FWMCbday25) hosted by hololive English VTuber duo FUWAMOCO
    (Fuwawa Abyssgard and Mococo Abyssgard) on February 2, 2025. The concert features
    dazzling solo and duets performances, special guest appearances by fellow hololive
    members (Shirakami Fubuki, Ookami Mio, Houshou Marine, Omaru Polka, Hakui Koyori,
    Shiori Novella, Koseki Bijou, and Nerissa Ravencroft), merchandise announcements,
    and touching fan interactions celebrating their first official 3D birthday live.
