global_summary:
  overall_summary: This video captures FUWAMOCO's 3rd Anniversary 3D Live Concert
    titled 'thanks to hololive', streamed on their official hololive English channel.
    The concert features high-energy musical performances, guest appearances by hololive
    talents including Mori Calliope, Sakura Miko, Inugami Korone, and Tsunomaki Watame,
    and heartfelt MC segments expressing gratitude to senpais and fans (Woofians).
    The highlight of the event is a major announcement revealing FUWAMOCO's 1st album
    'ふわもこアラモード', featuring cover art by Akio Watanabe and a brand-new original song
    '一途ってトレンド♡' composed by Ryuji Kiyoshi.
