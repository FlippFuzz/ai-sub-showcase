    song_title: ちゅ、夒様性。
    song_artist: ano
  - start: '59:50'
    end: '65:50'
    title: New Original Song Announcement & 'DEMON'S RESiDENCE'
    description: FUWAMOCO announces and performs their brand-new original song 'DEMON'S
      RESiDENCE', composed by Kenta Matsukuma, showcasing their demon dog pride and
      rock energy.
