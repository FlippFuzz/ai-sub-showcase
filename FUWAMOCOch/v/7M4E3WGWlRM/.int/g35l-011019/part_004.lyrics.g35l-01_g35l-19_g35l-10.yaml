global_summary:
  overall_summary: This video is the 3D Live Concert portion of FUWAMOCO's 2nd day
    birthday festival titled 'FUWAMOCO wacha wacha birthday festival' (#FWMCbday26),
    streamed on the official FUWAMOCO Ch. hololive channel. The concert features dazzling
    3D performances, guest appearances by hololive talents Mori Calliope, AZKi, and
    Aki Rosenthal, a surprise appearance and duet with Japanese comedian Kuro-chan,
    merchandise showcases, the debut of a brand-new original song titled 'DEMON'S
    RESiDENCE', and emotionally resonant performances that celebrate FUWAMOCO's third
    anniversary and bond with their fans, the Ruffians.
  chapters:
  - start: 00:00
    end: 08:30
    title: Opening & 'Lifetime Showtime' Performance
    description: The concert kicks off with energetic opening animations, followed
      by FUWAMOCO's high-energy performance of their theme song 'Lifetime Showtime',
      welcoming Ruffians to their birthday festival.
    song_title: Lifetime Showtime
    song_artist: FUWAMOCO
  - start: 08:30
    end: '10:25'
    title: Opening MC & Birthday Greetings
    description: 'Fuwawa and Mococo celebrate their third anniversary in hololive,
      introduce the birthday hashtag #FWMCbday26, and tease the upcoming guest performances
      and membership encore.'
    song_title: null
    song_artist: null
  - start: '10:25'
    end: '18:15'
    title: Guest Mori Calliope Collaboration & 'Like! Like! Like!'
    description: Mori Calliope joins FUWAMOCO on stage for humorous banter, a splits
      challenge, and an energetic joint performance of 'Like! Like! Like!'.
    song_title: Like! Like! Like!
    song_artist: FUWAMOCO & Mori Calliope
  - start: '18:15'
    end: '24:00'
    title: Solo Song Performance 'je t'aime ★ je t'aime'
    description: FUWAMOCO performs a nostalgic, city-pop-vibed solo cover of Tommy
      february6's 'je t'aime ★ je t'aime' against a sunset backdrop.
    song_title: je t'aime ★ je t'aime
    song_artist: Tommy february6
  - start: '24:00'
    end: '43:35'
    title: Guest AZKi & Aki Rosenthal Collaboration & Performances
    description: AZKi and Aki Rosenthal join FUWAMOCO for sexy warm-up banter and
      energetic performances of Nana Mizuki's 'DISCOTHEQUE' and 'TRI-DIVER'.
    song_title: DISCOTHEQUE
    song_artist: 水樹奈々
  - start: '43:35'
    end: '47:15'
    title: Birthday Merchandise Showcase
