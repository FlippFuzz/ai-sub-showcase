    description: Fuwawa and Mococo Abyssgard perform choreography and sing 'あすいろClearSky'
      on a virtual stage with a blue and white checkered floor and a large screen
      displaying graphics.
    contains_vocal_music: true
    song_title: あすいろClearSky
    original_artist: hololive IDOL PROJECT
    performer_in_video: Fuwawa Abyssgard & Mococo Abyssgard (FUWAMOCO)
    original_language: Japanese
    reference_lyrics_og: |-
      いつの間にか見つけてた遠い夢
      一人じゃ見えなかった景色
      波打つ風の音と 加速していく想いに
      戸惑いを覚えた
      ずっと追いかけた理想の姿は
      まだ届かなくて遠いけど
      きっとこの瞬間を かけがえのないみんなで
      共に 行く よ！
      手を繋いで
      3・2・1！
      輝き宿して
      夢の場所へ！
      駆け抜けていく 僕たちの青春の光は
      誰にも止められないよ！
      笑い合う分 だけ 優しく
      零れる 涙 さえ 今
      ほら 輝かせ
      明日へ 運ぶ から 君 の 隣 へ
      僕たち は 世界 を 超え て 行く
      迎え に 行く よ まだ 見えない 明日も
      キラメキ に 変え て きっと
       僕たち が 未来へ と
      連れ て 行く から ！

      背伸びしては手を伸ばす憧れの
      行き先示す星になろう
      つまずくその度に 手を差し伸べ合えたら
      すぐに届くはずさ
      そっと踏み出した小さな勇気が
      もう消えないように繋げよう
      不安も愛しさも大切に抱きしめて
      共に 行く よ！
      目を合わせて
      3・2・1！
      晴れ渡る希望へ 飛び出せるよ！
      突き抜け ていく
      僕たちの 透き通る 決意 は
      まだまだ 止め られ ないよ ！
      ありきたりな 今日 こそ
      トキメキ に 変え て もっと
      僕たち が いつまでも
      背中 押す から ！

      ずっと一人で描いてたキャンバスが
      いつからかコライトになって
      また少しずつ芽生える大好きを紡ぎ
      どこまでも高く
      あすいろの空へ
      駆け抜け ていく
      僕たちの 青春 の 光 は
      誰 に も 止め られ ないよ ！
      笑い 合う 分 だけ 優しく
      零れる 涙 さえ 今
      ほら 輝かせ
      明日へ 運ぶ から 君 の 隣 へ
      僕たち は 世界 を 超え て 行く
      迎 え に 行く よ まだ 見えない 明日も
      キラメキ に 変え て きっと
       僕たち が 未来へ と …
      果て の ない 未来へ と
      連れ て 行く から ！
    reference_lyrics_en: |-
      A distant dream I found before I knew it
      Scenery that could not be seen alone
      To the sound of the rippling wind and the feeling of accelerating
      I was confused
      The ideal figure that I chased all the time
      I haven’t received it yet
      I’m sure she’s irreplaceable at this moment
      I’ll go with you!
      Hold hands
      3・2・1!
      Shine in
      To the dream place!
      The light of our youth running through
      No one can stop it!
      As much as you laugh (gentle)
      Even spilling tears (now)
      Look, let it shine
      I’ll carry it to tomorrow
      Next to you, we go beyond the world
      I’ll pick you up
      Tomorrow I can’t see yet
      I’m sure it will change to glitter
      We are in the future
      I’ll take you!

      Reaching up on tiptoe, yearning
      Let's become a star showing the destination
      Every time you stumble
      If we can reach out to each other
      It should reach you soon
      The small courage I took a step forward gently
      Let's connect so that it doesn't disappear anymore
      Embrace anxiety and loveliness with care
      I’ll go with you!
      Look into each other's eyes
      3・2・1!
      To clear hope, you can jump out!
      Breaking through
      Our transparent determination
      Still can't be stopped!
      An ordinary day
      Change it to tokimeki and more
      We will always
      Push your back!

      The canvas I used to draw all alone
      Has somehow become a co-write
      Spinning our growing love bit by bit
      Higher and higher
      To tomorrow's clear sky
      Running through
      The light of our youth
      No one can stop it!
      As much as you laugh (gentle)
      Even spilling tears (now)
      Look, let it shine
      I’ll carry it to tomorrow
      Next to you, we go beyond the world
      I’ll pick you up
      Tomorrow I can’t see yet
      I’m sure it will change to glitter
      To the future...
      To the endless future
      I’ll take you!
