global_summary:
  overall_summary: 'In this 3D birthday live stream titled ''Let''s party and sing
    with good friends! 🎂🎉 #RissaHatchDay25'' (also themed around ''Bedroom Break-In''),
    hololive English -Advent-''s Devilish Diva Nerissa Ravencroft celebrates her birthday
    in her newly revealed 3D bedroom. Joined by special guests from holoAdvent (Shiori
    Novella, Koseki Bijou, FUWAMOCO) and holoJustice (Elizabeth Rose Bloodflame, Gigi
    Murin, Cecelia Immergreen, Raora Panthera), Nerissa hosts hilarious interactive
    segments including a blindfolded ''rizz'' and marriage proposal game (''Soulmates
    in Love''), a balance-challenging ''Posing Twister'' game, an energetic live musical
    concert featuring covers of popular VOCALOID and hololive songs, and a showcase
    of her birthday merchandise before concluding with heartfelt thank-yous to her
    fans, known as ''Jailbirds''.'
