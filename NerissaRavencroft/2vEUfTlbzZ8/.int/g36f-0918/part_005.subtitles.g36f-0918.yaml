    Then there's the chorus:

    *   "Unraveling the days of repeated mistakes, as if to rebind them once more, even if I lose my way, I'll go meet you. Wiping away these sorrowful tears, I had forgotten before I realized it, searching for that gentle voice. If we could hold hands once again, I would make a promise with you one more time."
