    *   **01:09.950 - 01:12.750:** Coming up next is the ReGLOSS 2nd Anniversary stream!
    *   **01:13.150 - 01:15.900:** What on earth is going to happen!? I'm so excited!
    *   **01:16.480 - 01:22.500:** But before the stream, let's look back together at all the announcements regarding ReGLOSS's 2nd anniversary!
    *   **01:25.850 - 01:28.000:** First up, anniversary merchandise!
