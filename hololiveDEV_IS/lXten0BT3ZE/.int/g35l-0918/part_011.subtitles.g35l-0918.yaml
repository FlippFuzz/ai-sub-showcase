    **My Thoughts on the ReGLOSS VTuber Conversation**

    It's happening... a real live concert! But honestly, I'm still not feeling the reality of it. We've been dreaming of this venue concert for so long and now that it's actually happening, I feel so surreal. 00:01.768 - 00:09.188

