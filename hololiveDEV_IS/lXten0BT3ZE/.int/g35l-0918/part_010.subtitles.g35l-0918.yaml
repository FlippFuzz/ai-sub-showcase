  thoughts: |+
    **Hololive ReGLOSS 2nd Anniversary & 1st Live Announcement Thoughts**

    Okay, so I'm on it. Did everyone see?  Did you all see?! December 16th, Ariake Arena! No way, it's an arena live! Such an amazing place! It’s the 1st ReGLOSS Live, "Flash point!"

    Yes! Yay! Wait, does it mean an in-person live?  That's right! It's such a huge venue. Isn't that amazing! This is huge! Does this mean a dream come true?  We are so very happy.  Thank you everyone, we are so very happy! It's thanks to all!

    Our first dream might come true! Let’s do it! Let’s do our best! Yes!  This live relates to the 2nd album’s worldview. The theme: to sear our "now" into your memories. It's a culmination of who we are!

    Yay!  We are also unveiling the live key visual! Here it is! Wow! So cool, right?! The design captures a live performance, matching the theme. It's so amazing!

    Different vibes than usual?  The atmosphere, too. The hashtag is #ReGLOSS1stLive! Please post, get hyped! Okay, we'll begin ticket information.

    Ticket info, ta-da! Three types: S, A, and B seats. Primary lottery begins at 21:00! It’s a lottery. Please apply calmly. For those who cannot attend, we have streaming tickets! These go on sale at 21:00!

    The venue map, ta-da! Check it to see where the seating is! The map is on the Hololive X account. Also, trending #1 for cheers! Yay!  We're so happy!  We're so happy you celebrated our 2nd anniversary with us.

    Regarding merch, it's October 1st on the ReGLOSS YouTube channel! We're so excited! So many wonderful goods! Don't miss out! Live info and merch details will be posted on the special website!

    We saw it already! You saw it, right? We might've mentioned the site. Yes, it's a cool site! Please check it out. It is called ReGLOSS's first live!

    We’ll update with more info; bookmark and check! In-person they say! Crazy! What do you think? Lilika has been saying ever since day one... even with her lack of confidence in both dancing and singing, she's grown to love each.

    She wants you all to see her grown-up self.  Thinking that dream may come true! Makes us very happy! Thank you so much!


