    original: '[Text: さらに、ホロライブプロダクションオフィシャルショップにて通常盤の販売が決定いたしました！こちらは特典でアナザージャケットが、本日の21時より販売開始となりますので、詳細は販売ページをご確認ください。]'
    english: '[Text: Furthermore, it has been decided that the standard edition will
      be sold at the hololive production official shop! This comes with an alternate
      jacket as a bonus and sales begin today at 21:00, so please check the sales
      page for details.]'
  - start: '02:54.671'
    end: '03:05.151'
    original: '[Text: そして！僕たちの3Dアクリルスタンドが出まーす！ぜひね、5人並べて飾ってください。こんな感じでポコポコポコンつってね。]'
    english: '[Text: And! Our 3D acrylic stands are coming out! Please line up all
      5 of them and display them. Like pop-pop-pop-pop!]'
  - start: '03:06.631'
    end: '03:12.111'
    original: '[Text: さらに今回の3Dライブを記念してグッズが販売されます！まずは、こちら！僕たち5人の手書きのコメントがプリントされたリボンタイプのストラップです。]'
    english: '[Text: Furthermore, to commemorate this 3D live, merchandise will be
      sold! First is this! Ribbon-type straps printed with handwritten comments from
      all 5 of us.]'
  - start: '03:13.191'
    end: '03:22.951'
    original: '[Text: そして、こちら！アクリルフォトフレームと5人の複製箔押しサイン入りのブロマイドです。以上！すげえたまらなかった！]'
    english: '[Text: And this! An acrylic photo frame and a bromide with replica foil-stamped
      signatures of all 5 members. That''s all! It''s so amazing!]'
  - start: '03:26.571'
    end: '03:39.951'
    original: 公式オンラインショップで21時からお求めいただけます！でもですね、皆さん、今回は数量限定などではないので、皆さん焦らずに最後までこのライブを見てから買ってくださいね。よろしくプリンセス。
    english: You can get them at the official online shop starting at 21:00! However,
      everyone, this time there are no quantity limits, so please don't rush and watch
      the live all the way to the end before buying. Best regards, princess.
  - start: '03:40.091'
    end: '03:59.371'
    original: '[Text: そして、9月27日よりリグロス活動1周年記念ボイスが絶賛発売中です！結成当時の要素を描いたボイスドラマとボイスメッセージ風シチュエーションボイスをぜひぜひお楽しみください！]'
    english: '[Text: And, starting September 27th, the ReGLOSS 1st Anniversary Voice
      is now on sale! Please thoroughly enjoy the voice drama depicting elements from
      our formation days and the voice-message-style situation voices!]'
  - start: '04:01.351'
    end: '04:18.451'
    original: そして、10月10日に3Dライブ振り返りの3D配信を実施します！やったー！次の3D配信10月10日にお会いいたしましょう！お楽しみに！ってわけでね、告知もりだくちゃんだったんですけど、え、まだね、皆さん最後の曲聴いてないですよね？
    english: And on October 10th, we will hold a 3D stream looking back on the 3D
      live! Yay! Let's meet on the next 3D stream on October 10th! Look forward to
      it! So, we had lots of announcements, but everyone, you haven't heard the last
      song yet, right?
  - start: '04:22.011'
    end: '04:30.011'
    original: この前リリースした新曲聴きたいよね？聴きたい！よっしゃ、じゃあみんなで1日いて、最後の曲行こう！
    english: You want to hear the new song we released recently, right? We want to!
      All right, then let's all spend the day together and head to the final song!
  - start: '04:30.011'
    end: '04:36.571'
    original: おー！
    english: Ooh!
