    Okay, let's dissect this. First, I need to check Hiodoshi Ao's statement around the 01:30 mark. The original Japanese has a few variations: "読者とプロデューサーがいてくれたから," "読者とみんながいてくれたから," or variations of "読者とプロデューサー" / "読者とリスナーがいてくれたから". Ah, right. I remember hololive DEV_IS fans are often referred to as "プロデューサー" (Producers) by the DEV_IS members themselves because of the whole "developer/producer" concept baked into the group's identity. And Ao is a manga artist, so "読者" (readers) fits perfectly. That's it! "読者とプロデューサーがいてくれたから" is absolutely spot on. The original Japanese, "この景色を見られたのは 読者とプロデューサーがいてくれたから", and the English translation, "Being able to see this scenery is thanks to the readers and producers being here", both work perfectly.

