    and 'Symmetry', individual solo performances by each member (Hiodoshi Ao, Juufuutei
    Raden, Ichijou Ririka, Otonose Kanade, and Todoroki Hajime), a comedic VTR game
    segment, and announcements regarding their upcoming debut album and merchandise.
