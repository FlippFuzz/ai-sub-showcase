    reference_lyrics_en: |-
      No longer will I be loved by you,
      nor will I ever be needed again.
      And so I am left here all alone.
      What was it that you said back then?
      Words that cannot reach drift aimlessly through the sky.
      Even though I know it's useless, I still make
      the same unfulfillable wish today.
      Don't let go, hold my hand tightly,
      and tell me that the two of us will go on together.
      The hand we held was so warm,
      so gentle.
      You would always tease me like that,
      making me angry until I ended up crying.
      Yet afterwards, the face you made when you said "I'm sorry"—
      I loved it so much.
      Don't let go, hold me tight, with all your might,
      I want to stay inside your arms.
      Pressing our foreheads together,
      falling asleep side by side.
      Did you know that we would never meet again?
      Don't let go, hold me tight, I love you.
      Can't you smile for me just one more time?
      Before your warmth fades away,
      hold me close.
