- subtitles:
  - start: '03:07.820'
    end: '03:09.110'
    original: みんな、速報だよ！！
    english: Everyone, breaking news!
  - start: '03:12.750'
    end: '03:17.330'
    original: なんと、一番くじ hololive DEV_IS ReGLOSSの発売が決定したんだって！！
    english: The Ichiban Kuji Hololive DEV_IS ReGLOSS release has been decided!!
  - start: '03:20.610'
    end: '03:22.060'
    original: ReGLOSSが一番くじ！？これドッキリか何か？
    english: ReGLOSS in an Ichiban Kuji? Is this a prank?
  - start: '03:23.240'
    end: '03:25.070'
    original: どんなラインナップなんだろ？
    english: I wonder what kind of lineup it'll be!
  - start: '03:25.170'
    end: '03:27.420'
    original: みんな、運試ししてみてね！
    english: Everyone, try your luck!
  - start: '03:28.180'
    end: '03:36.190'
    original: なんと、11月13日木曜日より順次発売予定なんだって！ぜひみんなチャレンジしてみてね！
    english: It'll be available sequentially from Thursday, November 13th! Please
      give it a try!
  - start: '03:37.380'
    end: '03:42.500'
    original: 出来立てホヤホヤのサンプルをスタジオへ用意いただいたます！
    english: We got fresh samples brought right to the studio!
  - start: '03:43.910'
    end: '03:47.370'
    original: でも、おまえらにはまだ見せられないよ〜
    english: But we can't show you guys yet~
  - start: '03:48.330'
    end: '03:53.110'
    original: ま、でも、ちょっとだけ教えちゃおっかな〜
    english: Well, maybe I'll let you in on a little secret~
  - start: '03:53.640'
    end: '03:59.080'
    original: まずは描きおろしイラストを使ったビジュアルボードがあったよね！
    english: First off, there's the visual boards using brand-new illustrations!
  - start: '04:01.030'
    end: '04:06.010'
    original: しかもイラストの背景にそれぞれにマッチしたモチーフがいろいろ入ってたよね〜
    english: And the backgrounds even have motifs matching each of us!
  - start: '04:07.130'
    end: '04:11.830'
    original: はじめ「押忍！」って書いてあった！ちょこのっこフィギュア！ホロライブ一番くじではおなじみのやつもあったね
    english: Hajime's says "Oshinin!" Chokonokko figures! The classic Ichiban Kuji
      item is back!
  - start: '04:16.140'
    end: '04:18.520'
    original: 表情がとっても可愛かった！
    english: The expressions were so cute!
  - start: '04:19.300'
    end: '04:24.490'
    original: おでかけする時とかにさバッグに忍ばせて一緒に連れて行ってほしくない？
    english: I want people to slip them into their bags when going out and take them
      along!
  - start: '04:25.460'
    end: '04:31.950'
    original: この髪の毛のね塗り分けとかグラデーションとかもねすごい小さいのにね綺麗なんだよ〜
    english: Even the hair coloring and gradients are so tiny and pretty!
  - start: '04:33.000'
    end: '04:36.430'
    original: あとラストワン賞っぽいやつは…デカかったね！
    english: And the Last One prize... was huge!
  - start: '04:38.250'
    end: '04:43.430'
    original: 抱きしめて…眠れる…
    english: You can fall asleep hugging it...
  - start: '04:44.300'
    end: '04:47.010'
    original: ヒントは以上です！詳細は9月16日一番くじホームページで公開予定！
    english: That's all for the hints! Details will be on the Ichiban Kuji website
      on September 16th!
  - start: '04:51.620'
    end: '04:54.000'
    original: お知らせはこれだけじゃない！
    english: That's not all the news!
  - start: '04:56.030'
    end: '05:03.010'
    original: ReGLOSSの楽曲がミニCDコレクションになりました！
    english: ReGLOSS songs are coming to a mini CD collection!
  thoughts: null
