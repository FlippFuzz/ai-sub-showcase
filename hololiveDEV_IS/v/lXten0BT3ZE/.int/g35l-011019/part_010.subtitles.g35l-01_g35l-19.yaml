    announcements (Ichiban Kuji, Gashapon, HMV fair, and voice packs), an escape room
    puzzle-solving skit, the announcement of their 2nd studio album 'Snapshot' and
    1st Live 'Flashpoint' at Ariake Arena, a KONAMI BEMANI rhythm game collaboration,
    and live musical performances of songs including 'SUPER DUPER', 'Easy Breezy',
    'Our Time Yellow' (アワータイムイエロー), and 'Midsummer Citrus' (ミッドサマーシトラス).
