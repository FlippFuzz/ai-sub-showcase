global_summary:
  overall_summary: This video is a special broadcast titled 'Album Deep-Dive SP' celebrating
    the 1st album release of hololive DEV_IS group ReGLOSS, featuring all five members
    (Hiodoshi Ao, Otonose Kanade, Ichijou Ririka, Juufuutei Raden, and Todoroki Hajime).
    The members break down each of the eight tracks on their 1st album 'ReGLOSS',
    sharing behind-the-scenes recording stories, fan survey results, and exclusive
    comments from the album's lyricist and composer OHTORA. The broadcast culminates
    in a 3D mini-live medley performance of their album songs, followed by merchandise
    and event announcements.
