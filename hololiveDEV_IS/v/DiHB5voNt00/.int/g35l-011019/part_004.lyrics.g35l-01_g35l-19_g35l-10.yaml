  end: '01:01.000'
  original: 九月のスタート 告げるチャイム 次の標的に置かれた花瓶
  english: The chime announcing the start of September, a vase placed on the next
    target—
- start: '01:01.000'
  end: '01:09.500'
  original: 仕掛けたのは 僕だった そう 君が悪いんだよ
  english: It was me who set it up. Yeah, it's your fault,
- start: '01:09.500'
  end: '01:19.000'
  original: 僕だけを見ててよ そう 君の苦しみ 助けが欲しいだろ
  english: Look only at me. Yes, you want help for your suffering, don't you?
- start: '01:19.000'
  end: '01:23.000'
  original: 溺れてく 其の手に向かってキスをしたー。
  english: I gave a gentle kiss to your sinking hand...
- start: '01:23.000'
  end: '01:33.000'
  original: 薄笑いの獣たち その心晴れるまで 爪を突き立てる
  english: The smirking beasts sink their claws in until their hearts are cleared.
- start: '01:33.000'
  end: '01:50.000'
  original: 不揃いのスカート 夏の静寂を切り裂くような悲鳴が木霊する 教室の窓には青空
  english: Mismatched skirts. Screams that pierce the silence of summer echo—outside
    the classroom window is a blue sky.
- start: '02:13.500'
  end: '02:17.500'
  original: そう 君は友達
  english: Yes, you are my friend.
- start: '02:17.500'
  end: '02:23.000'
  original: 僕の手を掴めよ
  english: Grab my hand.
- start: '02:23.000'
  end: '02:30.000'
  original: そう 君が居なくちゃ 居場所なんて無いんだよ
  english: Yes, if you aren't here, I have nowhere to belong.
- start: '02:30.000'
  end: '02:37.000'
  original: 透き通った世界で 愛し合えたらー。
  english: If we could love each other in a transparent world...
- start: '02:37.000'
  end: '02:45.500'
  original: 繰り戻す フラッシュバック・蝉の声。二度とは帰らぬ君
  english: Replaying the flashback, the cicadas' cries. You who will never return—
- start: '02:45.500'
  end: '02:53.000'
  original: 永遠に千切れてく お揃いのキーホルダー
  english: Our matching keychains are tearing apart forever.
- start: '02:53.000'
  end: '03:00.000'
  original: 夏が消し去った 白い肌の少女に
  english: On the pale-skinned girl whom summer erased,
- start: '03:00.000'
  end: '03:08.500'
  original: 哀しい程 とり憑かれて仕舞いたい
  english: I want to be possessed by her to the point of sorrow.
- start: '03:08.500'
  end: '03:13.000'
  original: 透明な君は 僕を指差してたー。
  english: The transparent you was pointing at me...
- start: '04:08.000'
  end: '04:12.000'
  original: 少女レイでしたー！
  english: That was "Shoujo Rei"!
- start: '04:12.000'
  end: '04:15.500'
  original: いやー、エモい気持ちになったり
  english: Man, it got so emotional and—
- start: '04:15.500'
  end: '04:19.000'
  original: 綺麗なさ、透き通るような声にめちゃくちゃ合ってた
  english: It fit so well with that beautiful, crystal-clear voice!
- start: '04:19.000'
  end: '04:22.000'
  original: アンケートでもね、カネデにぜひカネデに歌ってほしいっていうのもあったみたいだよ
  english: It looks like in the survey too, people really wanted Kanade to sing it.
- start: '04:22.000'
  end: '04:26.500'
  original: センス良い！上手すぎ！最高！そのコメントした人
  english: Such great taste! So good! Amazing! To the person who left that comment—
- start: '04:26.500'
  end: '04:29.000'
  original: うん、コメントした人
  english: Yeah, the person who commented.
- start: '04:30.000'
  end: '04:35.000'
  original: カネデの後もカネデの後で相当なハードルなんですけれども
  english: After Kanade, the hurdle after Kanade is pretty high though!
- start: '04:35.500'
  end: '04:38.000'
  original: じゃあ、帰りますね！
  english: Well then, I'm heading home!
- start: '04:38.000'
  end: '04:42.000'
  original: まだ帰らないで！まだ帰らないで！
  english: Don't go home yet! Don't go home yet!
- start: '04:42.000'
  end: '04:52.000'
  original: 次は選ばれた方の歌じゃないですか？じゃあ頑張って歌います
  english: Isn't the next one the song for the person who was chosen? Alright, I'll
    do my best to sing it!
- start: '04:52.000'
  end: '04:59.000'
  original: おおー！いけー！楽しく歌おう！
  english: Ooh! Go for it! Let's sing happily!
