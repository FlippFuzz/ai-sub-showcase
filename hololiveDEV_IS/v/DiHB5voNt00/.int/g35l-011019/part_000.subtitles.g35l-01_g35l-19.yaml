    stream begins with the virtual live debut performance of their new summer digital
    single 'ミッドサマーシトラス' on a beach stage, followed by behind-the-scenes banter and
    MV impressions. The members then transition to a virtual karaoke room where they
    perform a setlist of classic summer hits and viewer-requested songs, including
    solo and duet performances, concluding with a group rendition of 'ウィーアー!' and
    closing announcements.
