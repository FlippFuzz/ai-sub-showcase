    Then, there's the musical performance. That is pretty straightforward, and I've got the start and end times, the artist (いきものがかり), and the song title "HANABI".

    Now, I'm carefully compiling the data. I'm taking the lyrics and dialogue lines and putting them into subtitle blocks, with precise start and end times. I'm verifying that the strings are all single-line and contain no control characters. I've double-checked my timecodes, making sure they're in the correct format.

