    music unit ReGLOSS titled 'Sakura Mirage / 新曲サクラミラージュ披露！'. The stream features
    dynamic 3D performances of popular tracks including 'Shunkan Heartbeat', 'Utakata
    Maybe', and 'Symmetry', alongside enthusiastic MC segments and the grand premiere
    of their new original song 'Sakura Mirage'. Despite minor humorous stage hiccups
    and weather themes, members Otonose Kanade, Ichijou Ririka, Juufuutei Raden, and
    Todoroki Hajime deliver a vibrant and energetic showcase (with Hiodoshi Ao on
    hiatus).
