    original: エージェポップメドレーは こちらで終わりたいと思います！
    english: That concludes the APEX Medley.
  - start: '00:03.207'
    end: '00:05.107'
    original: はい、そしてここからは
    english: And from here...
  - start: '00:05.327'
    end: '00:06.667'
    original: えー、おなじみ
    english: Um, our usual...
  - start: '00:07.137'
    end: '00:11.837'
    original: 告知メドレー、え、告知メドレーだ！じゃあ告知メドレー！
    english: Announcement Medley— ah, the Announcement Medley! Okay, Announcement
      Medley!
  - start: '00:13.627'
    end: '00:17.397'
    original: はい、おなじみのグッズの告知です。デリリリリ、ボンッ！
    english: Yes, it's time for our familiar merchandise announcement. Deriliriliri,
      boom!
  - start: '00:19.475'
    end: '00:25.535'
    original: 特典いよいよ4周年記念グッズ発売決定！
    english: And finally, the 4th anniversary goods release is confirmed!
  - start: '00:26.115'
    end: '00:28.895'
    original: グッズの種類が3種類となっております。
    english: The merchandise consists of three different items.
  - start: '00:30.585'
    end: '00:38.385'
    original: はい、B2タペストリー、巻物ロングTシャツ、ビビぬいぐるみキーホルダー、そして特典にポストカードがついてきます。
    english: 'Yes: B2 Tapestry, Scroll Long T-Shirt, Bibi Plush Keychain, and a bonus
      postcard.'
  - start: '00:39.905'
    end: '00:44.785'
    original: えー、こちらの特典ですね、数量限定で直筆サイン入りポストカードがついていきます。
    english: These bonuses come with a quantity-limited postcard featuring an autograph.
  - start: '00:45.325'
    end: '00:52.485'
    original: えー、直筆のサインはね、本当に久しぶりに書くので、ぜひね、ゲットしていただきたいなと思います。
    english: Since I haven't written autographs by hand in a really long time, I hope
      you'll all get one.
  - start: '00:53.305'
    end: '00:55.335'
    original: はい、ではね、各グッズのご紹介。
    english: Now, let's introduce each item.
  - start: '00:56.245'
    end: '01:01.815'
    original: まず1つ目はB2タペストリーです。イラストは秋音さんに描いていただきました。
    english: First up is the B2 Tapestry, illustrated by Akine-san.
  - start: '01:02.505'
    end: '01:17.205'
    original: 昔からね、本当に大好きなイラストレーター様で、もう歌も上手いし、もうずっと尊敬する人にね、描いていただいたので本当に嬉しかったので、みんなもね、ぜひ手に入れてください。
    english: As someone I've truly loved and deeply respected for a long time as an
      illustrator, I was so happy she drew this for me, so I hope everyone will get
      one.
  - start: '01:18.505'
    end: '01:23.005'
    original: そして2つ目は、巻物ロングTシャツ。
    english: And second is the Scroll Long T-Shirt.
  - start: '01:23.865'
    end: '01:33.405'
    original: 前にね、結構昔かな、あの、ロングTシャツをね、黒色で出したので、今回は白にしてみました。そのときにもね、好評だったので、
    english: A while back, quite some time ago, I released a long T-shirt in black,
      so this time I tried white. It was well-received back then, too.
  - start: '01:34.225'
    end: '01:42.505'
    original: え、しかもね、トワもね、めっっちゃ使いやすいじゃんと思って購入して、もう一回ね、いいなと思ったので今回作ることにしました。
    english: And also, I thought 'this is super easy to use!' and bought it myself,
      and thought it'd be great to make again.
  - start: '01:43.085'
    end: '01:49.005'
    original: 腕の部分にはトワの名前が入っておりまして、なんと胸のところにはイラストも入っております。
    english: The sleeves have my name on them, and the chest area features an illustration.
  - start: '01:50.085'
    end: '02:00.185'
    original: いや、カラーじゃなくてね、モノトーンっぽい感じにしたんですけれども、このね、理由としては普段の服にも使えそうかなって思ってこのようなデザインにしました。
    english: Instead of full color, I went with a monotone vibe. The reason is I wanted
      something you could easily wear in daily life.
  - start: '02:00.735'
    end: '02:21.845'
    original: 実際ね、トワもこういう服を使ってるんですけども、そのジャージっぽくない感じ、このカラーをやめることによってすごいジャージっぽくなくて普段使いしやすいような感じだったので、本当に自分も結構使ってるからほしいなと思って作ったっていうのもあります。
    english: Actually, I wear clothes like this too, and by dropping the bright colors,
      it doesn't look like athletic wear and is easy to wear daily. Since I use stuff
      like this myself, part of why I made it was because I wanted one.
  - start: '02:22.615'
    end: '02:26.545'
    original: そしてグッズ最後、ビビぬいぐるみキーホルダー。
    english: 'And the final item: the Bibi Plush Keychain.'
  - start: '02:27.505'
    end: '02:41.385'
    original: え、以前ね、ビビのぬいぐるみを出したときに、ホロメンからもね、大好評「かわいい！」って言ってもらったりとか、ぬいぐるみ欲しいて言ってお渡しした子もいて、
    english: When I released the Bibi plushie before, fellow holomembers praised it,
      saying 'So cute!' and some even asked for one when I handed them out.
  - start: '02:41.775'
    end: '02:54.895'
    original: 自分の中でもね、「え、めちゃかわいいじゃん！」って思っていたので、そのね、あの、でっかい抱っこできるぐらいの大きさだったビビをぎゅっと小さくしてキーホルダーにしてもらえました！めっっちゃかわいいのでぜひ購入してみてください。
    english: I thought it was super cute myself, so I had that big huggable-sized
      Bibi shrunk down into a keychain! It's super cute, so please check it out.
  - start: '02:55.515'
    end: '03:06.015'
    original: ということでグッズのご紹介でした。各グッズセットもあるし、単品販売もあるので、ぜひこのあと概要欄をチェックしてみてください。よろしくお願いします。
    english: That concludes the merchandise introduction. There are sets and individual
      items available, so please check the description box afterward. Thank you!
  - start: '03:09.916'
    end: '03:13.196'
    original: というわけでグッズ告知でしたーー！
    english: And that was the merchandise announcement!
  - start: '03:13.916'
    end: '03:22.066'
    original: はい、はい、概要欄にね、URLを載せておきますので配信後 にご購入をお願いいたします！
    english: Yes, yes, I'll put the URL in the description box, so please purchase
      after the stream!
  - start: '03:22.696'
    end: '03:31.066'
    original: はい、そして初めて、なんとこのあとメンバーシップ限定のライブをやろうと思います！
    english: And first— surprisingly, we'll be having a members-only live stream right
      after this!
  - start: '03:31.436'
    end: '03:40.366'
    original: 打ち上げみたいな感じだね、メンバーシップのそのライブでは盛り上がる曲を歌おうかなと思っております。
    english: It's like an afterparty vibe, where I'm planning to sing upbeat songs
      to hype things up.
  - start: '03:40.456'
    end: '03:44.756'
    original: ので、ぜひメンバーシップ登録をよろしくお願いいたします！
    english: So please consider registering for membership!
  - start: '03:44.826'
    end: '03:56.596'
    original: マジでさ、みんながやっててさ、あ、いいなと思いつつもやってこなかったメンバーシップ限定ライブ、今回初めてやりますのでよろしくお願いします！
    english: Seriously, seeing everyone else do members-only lives and thinking 'that
      looks nice,' yet never doing one myself... I'm doing it for the first time,
      so please look forward to it!
  - start: '03:57.446'
    end: '04:02.046'
    original: はい、そして最後、告知、まだあります！これ最後！
    english: And finally— there's still one more announcement! This is the last one!
  - start: '04:03.076'
    end: '04:07.126'
    original: 「なんだってーは」というコメントがいっぱい流れています。
    english: The chat is flooded with 'What?!' comments.
  - start: '04:07.786'
    end: '04:08.576'
    original: ジーーーン。
    english: '*Teary-eyed*'
  - start: '04:10.536'
    end: '04:20.916'
    original: はい。いやこれね、ちょっと分かってるかな？分かってる？あ、いや、分かってないよね？うん、分かってない、と。分か、うん、分かってないね、うん、分かってないよね、はいはい。
    english: Yeah. Do you guys get it? Do you? Ah, wait, you don't get it, do you?
      Yeah, you don't get it.
  - start: '04:21.846'
    end: '04:26.546'
    original: はい、そうです！なんとびっくりでしょ？新曲、あります！
    english: Yes, that's right! Surprised? There's a new song!
  - start: '04:27.426'
    end: '04:36.576'
    original: イェーーーイ！ライブにもね、手掛けてくださったバズジーさんにまた書き下ろししていただきましたーー！
    english: Yay! Written once again by BuzzG-san, who also worked on my live!
  - start: '04:37.386'
    end: '04:40.406'
    original: はい、爽やかなね、爽やかなね、と
    english: Yes, a refreshing— refreshing, and—
  - start: '04:41.366'
    end: '04:42.366'
    original: どうなってんだ？
    english: What's going on?
  - start: '04:42.706'
    end: '04:51.366'
    original: 爽やかなね、爽やかなロック調のね、どんだけか。え、爽やかなロック調の楽曲になっております。
    english: A refreshing, rock-style track— how many times do I say it? It's a refreshing
      rock-style song.
  - start: '04:51.726'
    end: '04:55.706'
    original: タイトルは、STYというタイトルになっております。
    english: The title is 'S.T.V'.
  - start: '04:55.976'
    end: '04:59.086'
    original: ジャケットはこんな感じ、ひゃーん。
    english: The jacket looks like this, ta-da.
  - start: '04:59.876'
    end: '05:06.016'
    original: こちらもね、え、なんとグッズとして、あの、CDとしてシングルとして発売するので
    english: This will also be released as a single CD as merchandise...
  thoughts: "**My Thoughts on Transcribing Towa-sama's Announcement**\n\nOkay, here's\
    \ the deal. I need to get this right. Towa-sama deserves precise subtitles, so\
    \ I'm hyper-focused on this audio. I'm breaking this down meticulously. First,\
    \ the merchandise introduction – that's the initial chunk. I'm going to start\
    \ by transcribing and timestamping from the beginning. \n\nI need to nail these\
    \ timecodes down, and make sure that this is super accurate for the community.\
    \ The APEX Medley is done, she has said it, now we begin. Ah yes, announcement\
    \ medley! Right. And now, time for the goods, a familiar announcement! *Deriliriliri,\
    \ boom!* The 4th Anniversary merchandise is here! And, the merch consists of three\
    \ different items, each and every one needs to be perfect!\n\n*B2 Tapestry, Scroll\
    \ Long T-Shirt, Bibi Plush Keychain, and a bonus postcard.* And those bonus postcards?\
    \ They're limited, with a handwritten autograph! I haven't written by hand in\
    \ ages, it's nice, really.\n\nEach item needs a spotlight. First, the B2 Tapestry.\
    \ Akine-san did the illustration. She's been a longtime favorite illustrator,\
    \ she is so good at singing too, I really look up to her!\n\nThen there's the\
    \ Scroll Long T-Shirt. I made a black one before, so I went for white this time.\
    \ The fans liked it before! I thought, 'this is super easy to use!' So I bought\
    \ one myself! The sleeves have my name, and the chest has an illustration. It's\
    \ not full-color, but this gives it a more everyday look! I have clothes like\
    \ this! And by dropping the colors, it gives a relaxed feel. I wear clothes like\
    \ this all the time, so I wanted it.\n\nThe last thing is the Bibi Plush Keychain.\
    \ When the Bibi plushie came out, the girls loved it, and some asked for one!\
    \ I thought it was super cute so, I had the big one shrunken down into a keychain!\
    \ And it's super cute. So please, buy it! And now the merchandise introduction\
    \ is done, check the description for sets and individual items!\n\nOkay, that\
    \ was the merch announcement! The URL is in the description box, so everyone can\
    \ go ahead and buy them! And now for the big news! The first ever members-only\
    \ live stream right after this! This is like an afterparty, but with hype songs!\
    \ So please consider registering for membership! And seriously, I've seen them,\
    \ and been thinking *that's nice*, and now I am doing it for the first time!\n\
    \nAnd lastly, more news. This is it! Everyone is wondering *what!* Yeah, you guys\
    \ don't get it, huh? Yes! There's a new song! YAY! BuzzG-san, who also worked\
    \ on my live show is working with me! It's a refreshing— what's going on— a refreshing\
    \ rock-style track, so refreshing! The title is \"S.T.V\"! The jacket looks like\
    \ this, and it will be released as a single CD as merchandise!\n\n\n"
