  - start: '01:02.000'
    end: '01:17.760'
    original: 昔からね、本当に大好きなイラストレーター様で、もう歌も上手いし、もうずっと尊敬する人にね、描いていただいたので、もう本当に嬉しかったので、もうみんなもね、ぜひ手に入れてください。
    english: She's an illustrator I've truly loved since long ago, and she sings so
      well, and she's someone I've respected forever, so having her draw this made
      me genuinely happy, so everyone please make sure to get one.
  - start: '01:19.860'
    end: '01:23.760'
    original: そして、2つ目は眷属ロングTシャツ。
    english: And second is the Kenzoku long T-shirt.
  - start: '01:24.000'
    end: '01:42.500'
    original: えー、前にね、結構昔かな、あのロングTシャツをね、黒色で出したので、今回は白にしてみました。その時にもね、えー好評だったので、えーしかもね、トワもね、うわめっちゃ使いやすいじゃんと思って購入して、もう1回ね、いいなと思ったので今回作ることにしました。
    english: Um, previously, quite a while ago, I released a long T-shirt in black,
      so this time I tried making it white. It was well-received back then, and besides,
      Towa thought, 'Oh, this is super easy to use,' and purchased it, and thinking
      again that it was great, I decided to make it this new one.
  - start: '01:43.000'
    end: '01:59.900'
    original: 袖の部分にはトワの名前が入っておりまして、なんと胸のところにはイラストも入っております。カラーじゃなくてね、モノトーンっぽい感じにしたんですけれども、ここのね、理由としては普段の服にも使えそうかなって思ってこのようなデザインにしました。
    english: The sleeve has Towa's name on it, and what's more, the chest area has
      an illustration as well. Instead of full color, I went with a monotone-ish feel,
      and the reason for that was I thought it might be usable for everyday clothes,
      so I made it with this design.
  - start: '02:00.100'
    end: '02:22.020'
    original: 実際ね、トワもこういう服を着てるんですけども、そのジャージっぽくない感じ、このカラーを辞めることによってすごいジャージっぽくなくて普段使いしやすいような感じだったるので、本当になんか自分も結構使ってるから、欲しいなと思って作ったっていうのもあります。
    english: And actually, Towa wears clothes like this too, but by omitting the colors,
      it doesn't look like a jersey and is easy to use for everyday wear, so since
      I actually use it quite a bit myself, part of the reason I made it was because
      I thought, 'I want one.'
  - start: '02:22.400'
    end: '02:25.400'
    original: そして、グッズ最後、ビビぬいぐるみキーホルダー。
    english: And the final piece of merchandise, the Vivi plushie keychain.
  - start: '02:27.100'
    end: '02:51.000'
    original: 以前ね、ビビのぬいぐるみを出した時に、ホロメンからもね、大好評、「可愛い」って言ってもらったりとか、「ぬいぐるみ欲しい」って言って、お渡しした子もいて、で自分の中でもね、「え、めっちゃ可愛いじゃん」って思っていたので、そのね、えの、でっかい抱っこできるぐらいの大きさだったビビをぎゅっと小さくして、キーホルダーにしてもらいました！
    english: Previously when I released the Vivi plushie, I got rave reviews from
