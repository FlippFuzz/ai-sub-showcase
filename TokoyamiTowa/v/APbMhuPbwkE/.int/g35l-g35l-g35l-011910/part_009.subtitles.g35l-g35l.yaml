  overall_summary: This video is Tokoyami Towa's 4th Anniversary 3D Live stream titled
    'Special Thank U!! J Medley', broadcasted on January 3, 2024. The stream features
    a continuous, high-energy J-Pop cover song medley spanning 10 tracks, followed
    by an MC talk session, merchandise announcements, and the premiere performance
    of her new 1st single 'S.T.Y.' produced by buzzG. The live showcases Towa's powerful
    vocals, rock-oriented aesthetic, and deep appreciation for her fans, known as
    'Kenzoku'.
