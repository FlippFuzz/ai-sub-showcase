- start: '02:11.840'
  end: '02:16.840'
  original: チックタック 追い越して いつもどっか空いた焦燥感
  english: Overtaking tick-tock, a sense of impatience always empty somewhere
- start: '02:17.180'
  end: '02:22.560'
  original: 隣で走る君と紡ぎ出すブレイブストーリー
  english: Spinning a brave story with you running right beside me
- start: '02:25.100'
  end: '02:28.480'
  original: Non-fiction
  english: Non-fiction
- start: '02:32.480'
  end: '02:41.420'
  original: 君の色が私を塗り替えて 壊れかけの音で響くから
  english: Your colors repaint me, resonating with a breaking sound
- start: '02:42.140'
  end: '02:47.780'
  original: おとぎ話の続きをもっと描きたいんだよ
  english: I want to draw more of the fairytale's continuation
- start: '02:48.860'
  end: '02:53.100'
  original: Palette Palette 連れて行くよ
  english: Palette, Palette, I'll take you along
- start: '02:54.920'
  end: '03:03.140'
  original: きっと 何千回 何万回…
  english: Surely, thousands, tens of thousands of times...
- start: '03:04.140'
  end: '03:15.540'
  original: Always going 何千回 何万回 迷い込んでも 最大級 I love youで君がいるから
  english: Always going, thousands, tens of thousands of times, even if I get lost,
    because you're here with a maximum-grade "I love you"
- start: '03:16.640'
  end: '03:25.720'
  original: おちび スーパースターなサンキュー それでもってラッキーも運命も手繰り寄せて
  english: A little superstar thank you, pulling in both luck and destiny
- start: '03:26.540'
  end: '03:31.240'
  original: もうバイバイも涙も忘れないよ
  english: I won't forget the goodbyes or the tears anymore
- start: '03:32.180'
  end: '03:42.060'
  original: 飛べなかった私の背中には君という羽
  english: On the back of me, who couldn't fly, are wings called you
- start: '04:01.200'
  end: '04:12.180'
  original: バイバイ！ありがとう！5周年もよろしくね！またね！
  english: Bye-bye! Thank you! Please look forward to our 5th year too! See you later!
