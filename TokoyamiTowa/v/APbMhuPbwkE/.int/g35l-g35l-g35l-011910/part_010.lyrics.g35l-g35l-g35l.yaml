  english: 'Well then, please listen to this: S.T.Y.!'
- start: '00:32.800'
  end: '00:37.740'
  original: そっと振り返った軌跡 どうしたって光って
  english: The trace I left looking back softly somehow shines bright no matter what
- start: '00:37.840'
  end: '00:43.100'
  original: ありふれた君がいつだってスーパーヒーロー
  english: You, so ordinary, are always my superhero
- start: '00:51.240'
  end: '00:55.940'
  original: いつもポンコツだった私 飛べなくて未完成
  english: I was always clumsy, unable to fly and incomplete
- start: '00:56.100'
  end: '01:00.940'
  original: 諦めないドア 開けるのママかもなんてさ
  english: Thinking maybe Mom's the one opening the door of never giving up...
- start: '01:01.380'
  end: '01:06.140'
  original: 明日なんて放っといて 君となんかちょっと似していて
  english: Leaving tomorrow behind, feeling a bit like you
- start: '01:06.560'
  end: '01:11.780'
  original: デコボコだからジャストに噛み合うパズルピース
  english: Because we're bumpy, we fit together just like puzzle pieces
- start: '01:12.160'
  end: '01:17.000'
  original: 繋ぎたい 繋ぎたい 届かない言葉も
  english: I want to connect, I want to connect, even words that can't reach
- start: '01:17.380'
  end: '01:21.560'
  original: いつかは誰かの何かに成りたいから
  english: Because someday I want to become something to someone
- start: '01:22.020'
  end: '01:30.220'
  original: crazy No lazy 夢の中 夢を見せて
  english: Crazy, no lazy, inside a dream, show me a dream
- start: '01:31.220'
  end: '01:41.220'
  original: Always going 何千回 何万回 膝をついても 最大級 I love youで立ち上がれるから
  english: Always going, thousands, tens of thousands of times, even if I fall to
    my knees, because I can stand back up with a maximum-grade "I love you"
- start: '01:42.500'
  end: '01:52.200'
  original: 飛びきり 飛ばなサンキュー 消えそうなハッピーも勇気も振り絞っちゃって
  english: A super-sized thank you, squeezing out even the fading happiness and courage
- start: '01:53.080'
  end: '02:03.580'
  original: 大失敗も後悔さえ愛せるなら 背中には君という羽
  english: If I can love even my biggest failures and regrets, on my back are wings
