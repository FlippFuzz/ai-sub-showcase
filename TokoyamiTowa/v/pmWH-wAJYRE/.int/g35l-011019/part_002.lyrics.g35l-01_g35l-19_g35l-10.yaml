global_summary:
  overall_summary: This video features Tokoyami Towa's 6th Anniversary 3D Live titled
    'ROCK Festa !!!', broadcasted on January 3, 2026. The concert embraces a powerful
    rock festival theme, showcasing high-energy performances, rock covers, and collaborative
    duets with multiple guest VTubers from Hololive and VSinger projects (including
    Himemori Luna, AZKi, Otonose Kanade, Natsuiro Matsuri, Takane Lui, Nekota Tsuna,
    IRyS, and Mori Calliope). Alongside electrifying musical stages, Towa announces
    her major tie-in single 'Shirube' (opening theme for the anime 'The Ossan Newbie
    Adventurer, Trained to Death by the Most Deadly Party of All' / 'Yusha Party o
    Oidasareru Kiyou Binbou') and unveils her 6th anniversary merchandise line.
