    reference_lyrics_en: |-
      Make a circle with one end,
      Hold it tightly,
      And with the other end, wrap it around
      The back of that circle,
      Enter the pocket made in between,
      And wait for it to come out.
      Come meet it where it comes out,
      And pull it together on the count of "one, two."
      Even if at first
      It's a rather pathetic shape,
      Put the same amount of strength into it,
      So that the wings are large and the knot is firm.
      I want you to tie it tightly like that.
      Keep your arms here and your memories far away,
      I want you to leave them there.
      If you pull on just one end,
      It will come undone,
      Though destroying something you've made
      Is far easier.
      But even when untying it,
      Do it just the same way.
      I know, but if you can,
      Pull it on the count of "one, two."
      Wishing it won't come undone,
      As I put strength into it,
      I'm bewildered by the wings I spread too wide.
      I want you to tie it tightly
      So that the wings are large and the knot is firm.
      Your dreams here and your memories far away,
      It's good enough if they're right there when you notice.
      Don't just pull silently,
      Don't turn it into an awkward butterfly.
      Thinking you tied it when you untied it,
      Thinking you loosened it when you tightened it.
      From among the countless threads scattered
      In this blue and wide world,
      We each chose our own thread
      And pulled them closer to each other.
      We didn't just get tied, we tied it ourselves,
      The two of us pulled it on the count of "one, two."
      We put our strength into it
      So it wouldn't become too big or too small.
