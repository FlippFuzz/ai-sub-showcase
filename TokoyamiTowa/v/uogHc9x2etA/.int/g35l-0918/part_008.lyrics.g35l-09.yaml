      深く寝静まった街の中へ
      降り注ぐのは誰の悲しみだろう

      星はまた弧を描いて飛んだ
      もやのかかった思考を晴らして
      「いつかまた会える」
      なんて言えなかった
      星が降ったあとの街、僕はまだ
      僕はおもずっと
      君の行方を
