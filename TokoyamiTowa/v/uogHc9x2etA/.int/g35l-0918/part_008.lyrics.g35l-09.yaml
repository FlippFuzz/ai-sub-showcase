    reference_lyrics_en: |-
      A single light turned on, turned on
      The tacks that adorned the sky are so beautiful
      If only I could erase it, like the white breath I exhaled

      Suppressing and sinking deep
      Even the crying voice can be heard
      The anxiety and pain that pierced you,
      With my blue color
      Paint it all over
      It all became tears
      Flowing into the sea of stars
      Into the endless darkness
      If you gently add blue,
      Look

      A comet flew over my head
      Dyeing the empty night sky
      Into the deeply sleeping city
      Whose sorrow is it that pours down?

      A star flew in an arc again
      Clearing up the hazy thoughts
      "We can meet again someday"
      I couldn't say something like that
      The city after the stars fell, I am still
      I have always been
      Searching for your whereabouts
