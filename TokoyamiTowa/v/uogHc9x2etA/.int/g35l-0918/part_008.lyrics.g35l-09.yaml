    reference_lyrics_en: |-
      At 2 o'clock in the morning, I carried a telescope to the railroad crossing
      The radio tied to my belt said it wouldn't rain
      Two minutes later, you came carrying an exaggerated amount of luggage
      Shall we begin astronomical observation, searching for a shooting star?
      We did our best not to be swallowed by the deep darkness
      That day when I tried to hold your trembling hand
      Trying to see things that couldn't be seen, I peered into the telescope
      Slicing through the silence, many voices were born
      Even when tomorrow called out to us, we barely replied
