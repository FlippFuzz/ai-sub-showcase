    performances of her solo songs ''Sakigake'' and ''FACT'', followed by an energetic
    MC segment. She is joined by Hololive 5th Generation''s Momosuzu Nene as a guest
    for a dance-focused duet of their 4th anniversary song ''#Uchira Shika Katan''.
    Towa then unveils her stunning new 2026 streetwear-inspired 3D outfit with customizable
    black and white jacket, cap, and clothing variations. The broadcast concludes
    with birthday merchandise announcements, the reveal of her new digital single
    ''SM4SH IT UP'', and a final performance of the new song.'
