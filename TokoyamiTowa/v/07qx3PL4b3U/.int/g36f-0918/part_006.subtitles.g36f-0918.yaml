responses:
- subtitles:
  - start: '00:00.000'
    end: '00:02.300'
    original: アイテムを呼び出していきたいと思います
    english: I'd like to introduce the items!
  - start: '00:02.300'
    end: '00:05.100'
    original: まずはこちら！どうぞ！ドン！
    english: First up is this! Here you go! Bam!
  - start: '00:05.100'
    end: '00:11.800'
    original: ブン！「願いを込めて。LEDアートパネル」！イェーイ！
    english: 'Boom! "Wish Upon a Star: LED Art Panel"! Yay!'
  - start: '00:11.800'
    end: '00:18.900'
    original: このね、MY描先生に描き下ろしてもらったイラストを使って
    english: Using this illustration drawn by MYAO-sensei,
  - start: '00:18.900'
    end: '00:23.000'
    original: えー、アートパネルを作っちゃいました！
    english: um, we made an art panel!
  - start: '00:23.000'
    end: '00:28.000'
    original: なんとこのアートパネル、LEDが入っておりますので
    english: And guess what! This art panel has LEDs built into it,
  - start: '00:28.000'
    end: '00:32.000'
    original: ふんわり光っちゃいまーす！
    english: so it glows softly!
  - start: '00:32.000'
    end: '00:33.300'
    original: ちょっと美しい感じでしょ？
    english: Looks pretty classy, right?
  - start: '00:33.300'
    end: '00:35.000'
    original: ぜひこの機会に手に入れてくださいね！
    english: Please be sure to get your hands on one during this opportunity!
  - start: '00:35.000'
    end: '00:37.000'
    original: はい！そして2つ目はこちら！ボーン！
    english: Alright! And the second item is this! Bam!
  - start: '00:37.000'
    end: '00:44.800'
    original: 「どっちのトワにする？リバーシブル アクリルスタンド」！
    english: '"Which Towa Will You Choose? Reversible Acrylic Stand"!'
  - start: '00:44.800'
    end: '00:50.000'
    original: はい！こちらもですね、この新衣装の撮り下ろしとなっておりまして
    english: Yes! This one is also a newly taken illustration of my new outfit,
  - start: '00:50.000'
    end: '00:58.200'
    original: さっき色々帽子付けたりとか、上が黒、下が黒、上白、下白みたいな色違いを見せたと思うんですけども
    english: earlier I showed various color variations like putting on the cap, or
      black top/black bottom, white top/white bottom,
  - start: '00:58.200'
    end: '01:03.500'
    original: それをね、ちゃんと表現してるアクリルスタンドになっております！
    english: and this acrylic stand properly recreates all of those!
  - start: '01:03.500'
    end: '01:08.500'
    original: 表のトワちゃん！裏のトワちゃん！どっちのトワにする？
    english: Front Towa-chan! Back Towa-chan! Which Towa will you choose?
  - start: '01:08.500'
    end: '01:11.100'
    original: ということで、こちらも楽しんでみてくださいね！
    english: So please look forward to this one as well!
  - start: '01:11.100'
    end: '01:14.300'
    original: はい！そして続いてはこちら！
    english: Alright, moving on to the next item!
  - start: '01:14.300'
    end: '01:18.900'
    original: はい！「新衣装モチーフ キーホルダー」！イェーイ！
    english: Yes! "New Outfit Motif Keychain"! Yay!
  - start: '01:18.900'
    end: '01:21.000'
    original: 見てください！これです、これ！
    english: Take a look! It's this, right here!
  - start: '01:21.000'
    end: '01:31.000'
    original: このトワのビビと、ほら！ほら！「TOWA」と書いたこのキーホルダーが、
    english: This Bibi of Towa's, and look! Look! This keychain that says "TOWA"...
  - start: '01:31.000'
    end: '01:37.500'
    original: このキーホルダーが… 本来ここにあったアクセサリーがキーホルダーになっちゃいまーす！イェーイ！
    english: This keychain... the accessory that was originally right here became
      a keychain! Yay!
  - start: '01:37.500'
    end: '01:44.300'
    original: はい！このモチーフにしてますので、ぜひお揃いで手に入れてみてください！
    english: Yes! Since it's modeled after this motif, please get one to match with
      me!
  - start: '01:44.300'
    end: '01:48.800'
    original: パーツはね、それぞれ取り外し可能となっております。よろしくお願いいたします！
    english: Each of the parts can be detached. Please check it out!
  - start: '01:48.800'
    end: '01:52.500'
    original: はい！そして最後はこちら！ボーン！
    english: Okay, and the final item is this! Bam!
  - start: '01:52.500'
    end: '01:58.000'
    original: 「トワ様とお揃いキャップ」！イェーイ！
    english: '"Matching Cap with Towa-sama"! Yay!'
  - start: '01:58.000'
    end: '02:03.800'
    original: このね、帽子とお揃いのキャップを発売することになりましたー！
    english: We're releasing a cap that matches this hat of mine!
  - start: '02:03.800'
    end: '02:07.500'
    original: 普段使いしやすいデザインにもなってますので
    english: It's designed to be easy to wear for everyday use as well,
  - start: '02:07.500'
    end: '02:13.200'
    original: ぜひ「今日トワとお揃いの帽子を付けたいな」って方は購入してみてください！お願いします！
    english: so if you feel like "I want to wear a matching hat with Towa today!",
      please consider buying one! Thank you!
  - start: '02:13.200'
    end: '02:18.000'
    original: はい！ということで、そんな感じかな？紹介は。
    english: Alright! So I guess that's about it for the merchandise showcase.
  - start: '02:18.000'
    end: '02:22.000'
    original: あ！そうだった！戻る前に！
    english: Oh! That's right! Before we move on!
  - start: '02:22.000'
    end: '02:32.000'
    original: この全部を買った「フルセット特典」…あ、「フルセット購入特典」もあります！忘れておりました！
    english: There's also a "Full Set Purchase Bonus" for buying all of these! I almost
      forgot!
  - start: '02:32.000'
    end: '02:41.000'
    original: フルセットをご購入していただいた皆さんには、箔押し複製サインと、あと今回はメッセージ入りポストカードをプレゼントしたいと思います！
    english: For everyone who purchases the full set, we'll be including a postcard
      with a foil-stamped replica autograph and a special message!
  - start: '02:41.000'
    end: '02:45.000'
    original: ぜひフルセットで購入してみてください！
    english: Please consider getting the full set!
  - start: '02:45.000'
    end: '02:48.000'
    original: はい！よろしくお願いいたします！
    english: Yes! Thank you so much!
  - start: '02:48.000'
    end: '02:51.000'
    original: はい、で、こっから…あ、そうだ！
    english: Alright, and from here... Oh, that's right!
  - start: '02:51.000'
    end: '02:56.500'
    original: ここもまだここにいて… なんとこれだけじゃないんですよ！グッズだけじゃなくて…
    english: I'm still staying right here, because that's not all! It's not just the
      merch...
  - start: '02:56.500'
    end: '03:00.800'
    original: あ、グッズは概要欄もチェックしてほしいのと、あと…
    english: Oh, please check the description section for details on the merch! And
      also...
  - start: '03:00.800'
    end: '03:06.000'
    original: そうなんです！最初のね、配信の最初に言ったと思うんですけれども、
    english: That's right! As I mentioned at the very beginning of the stream,
  - start: '03:06.000'
    end: '03:11.000'
    original: お知らせが、まだ1個あるんですよ！
    english: there's still one more announcement!
  - start: '03:11.000'
    end: '03:15.000'
    original: はい！そのお知らせとは…こちら！ボーン！
    english: Yes! And that announcement is... this! Bam!
  - start: '03:15.000'
    end: '03:26.500'
    original: 新曲「SMASH IT UP」が、この後24時から、0時になった瞬間からデジタルリリースされます！
    english: My new song "SMASH IT UP" will be released digitally starting tonight
      at 24:00, right as the clock strikes midnight!
  - start: '03:26.500'
    end: '03:28.000'
    original: イェーイ！
    english: Yay!
  - start: '03:28.000'
    end: '03:37.000'
    original: いつもね、トワの楽曲とかつくる時にすごくお世話になってる磯野さんっていう方がいらっしゃるんですけど、磯野さんにね、書き下ろしていただきました！
    english: I've been working with Isono-san, who always helps me out when making
      Towa's songs, and he composed this brand-new track for me!
  - start: '03:37.000'
    end: '03:43.000'
    original: なんかその結構ざっくり「トワっぽい曲でお願いします」って…
    english: I gave a pretty rough request like, "Please make a very Towa-like song,"
  - start: '03:43.000'
    end: '03:55.800'
    original: 結構お世話になってるんですよ。だからトワの音域とか、どういうのが得意かっていうのを知ってくださってるので、じゃあそれを最大級に活かしたようなトワの曲を作ってくださいって言って出来た曲が「SMASH
      IT UP」なんですよね！
    english: because he's been working with me so much. Since he knows my vocal range
      and what style suits me best, I asked him to make a Towa song that brings out
      my full potential, and "SMASH IT UP" was born!
  - start: '03:55.800'
    end: '03:58.500'
    original: うん！
    english: Mm-hmm!
  - start: '03:58.500'
    end: '04:12.800'
    original: 結構ね、でも来た時は、「トワ歌えるかな？トワっぽいかな？あ、でもこういうイメージ抱いてるんだな」っていう風な感じで、すごい面白かったです！
    english: When I first received it, I was like, "Can Towa really sing this? Is
      this really Towa-like? Oh, so this is how he envisions me!" It was super interesting!
  - start: '04:12.800'
    end: '04:23.800'
    original: でもね、取るまでは不安だったんですよ、最初取るまでは。でも取ってみたらすごい自分に合っててかっこいい曲になったので、ぜひ購入して聴いていただければなと思います！ダウンロードしてみてください！
    english: I was actually feeling anxious until I recorded it. But once I recorded
      it, it fit me so well and turned out to be such a cool song, so I really hope
      you buy it and listen to it! Please download it!
  - start: '04:23.800'
    end: '04:25.000'
    original: はい！
    english: Yes!
  - start: '04:25.000'
    end: '04:28.000'
    original: はい！じゃあね…
    english: Alright! Well then...
  - start: '04:28.000'
    end: '04:36.500'
    original: 「じゃあどんな曲なんだよ」って、「そんなのゼロでダウンロードなんて出来ないよ」って思うじゃないですか！
    english: You might be thinking, "Well, what kind of song is it?" or "I can't just
      download it blindly!" right?
  - start: '04:36.500'
    end: '04:44.000'
    original: いやいや！今日はその…この発表した新曲で、本日のライブを締めくくりたいと…
    english: No, no! Today, I'd like to close out today's live stream with this newly
      announced track...
  - start: '04:44.000'
    end: '04:47.800'
    original: えっと、ここカットして…
    english: Um, please cut this part out...
  - start: '04:47.800'
    end: '04:51.000'
    original: 「ここカットして」って言ってたけどカットしなくていいですからね！
    english: I said "cut this part out," but you don't actually have to cut it, okay?
  - start: '04:51.000'
    end: '04:56.000'
    original: はい！では、そんな新曲で本日のライブを締めくくりたいと思います！
    english: Alright! With that said, I'd like to conclude today's live stream with
      my new song!
  - start: '04:56.000'
    end: '04:57.200'
    original: いいですか？
    english: Are you ready?
  - start: '04:57.200'
    end: '05:00.000'
    original: では、本日最後の曲です！
    english: Now then, here is the final song of the day!
