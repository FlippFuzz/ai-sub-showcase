  thoughts: |+
    **My Thoughts on Towa's "SHINier" Live**

    Okay, so I'm really diving into this. The VTuber, Tokoyami Towa, is putting on her second live concert, "SHINier," at Ariake Arena on October 29, 2025. It's a huge step up from her first live!

    I've been meticulously transcribing and translating the video, making sure to capture every detail.

    The concert title "SHINier" connects to the core, the essence. This album features various cores and the live title follows. "SHINier" will be a brighter, cooler, and more evolved performance. My aim is to deliver infinite possibilities to everyone! I hope people will come and see it.

    The key visual is awesome! Hanasa-san, who did the album art, also created this piece. It's cool, with light, representing progress. The concert will be cool and edgy! The outfit is great and I am so looking forward to the day.

    The hashtag is #SharpTokoyami, though Tokoyami's name is a mouthful! It is the second one. Starting today, I will be Tokoyami. Please post about this! Ticket info is next.

    Ariake Arena is the venue, a much larger space. It's like 3 times bigger, maybe 2.5 times? I was nervous before, but the stream is starting to make it real and I am excited, but also want to deliver to everyone.

    There are SS, S, A, and B seats. SS is "SHINier Supporter." SS ticket holders get a bracelet light with a custom design. The bracelet is detachable. The light is white, making the whole place glow! I'm putting a lot of work into the lights and hope all the fans like it!

    SS seats are right in the stage center! After that are the S, A, and B seats. Physical ticket applications start at 9 PM tonight, so everyone should apply! Overseas fans can buy too - Let's go! Streaming tickets are available starting at 9 PM too. Check the special site, and I think it is in the description. Even if you search, the site will show up. Bookmark it, just in case.

    Whether watching it in person or streaming, I want to give a performance that everyone will love!


