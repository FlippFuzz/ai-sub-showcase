  thoughts: "```json\n{\n  \"summary\": \"**My Thoughts on the Upcoming Live and Album**\n\
    \nOkay, so the live is called 'SHINier,' which, you know, links to the album 'SHIN'\
    \ – pretty straightforward, right? I'm aiming for something even brighter and\
    \ cooler than my first live, with this concept of 'SHIN' really driving the direction.\
    \ It's about delivering those infinite possibilities to the audience, and I really\
    \ hope everyone can be there! \n\nI'm so excited about this key visual! Hanazawa-san\
    \ did an amazing job with both the album cover and this, and I feel like it really\
    \ captures the vibe – that sense of moving forward with a 'light' feel. It's supposed\
    \ to be cool but also... well, you'll see. The outfit, too, is a favorite. \n\n\
    Right, and the hashtag! I got a little tongue-tied there, I blurted 'Tokoyama'\
    \ instead of 'Tokoyami' (laughs)! So embarrassing... The staff were having a great\
    \ laugh at my expense! From today, call me 'Tokoyama'! Don't forget that! And\
    \ definitely use the hashtag. \n\nTicket info is what everyone has been waiting\
    \ for, yes? Ariake Arena is the venue, and compared to last time, it's massive.\
    \ I was so nervous last time. So much so that I was trembling at the start, I\
    \ still worry a little bit, but right now I am feeling so excited and nervous\
    \ at the same time! I'll do my best to overcome this! There are SS, S, A, and\
    \ B seats. The SS seats are special. 'SHINier Supporter' – I love that! SS tickets\
    \ get a bracelet light! I really wanted to make those bracelet lights, and the\
    \ venue will look so amazing with these lights. The SS seats are front and center,\
    \ right by the stage. I've heard the tickets might be a little pricey, but you\
    \ will hear the sound nice and loud. Those lights will really make the live experience\
    \ something else. The first round of the lottery for local tickets starts today\
    \ at 9 PM! Overseas folks can grab tickets, too. If you can't make it in person,\
