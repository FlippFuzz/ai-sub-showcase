  - start: '03:08.380'
    end: '03:13.120'
    original: はい、フルセット、買うとついてくるんだよ、これが。
    english: Yep, if you buy the full set, this comes with it.
  - start: '03:13.200'
    end: '03:18.720'
    original: でもね、そしてね、しかもね、なんともう一個ついてきちゃうの、こちら。
    english: 'But wait, and what''s more, another thing comes with it right here!
      [Sign: Birthday Commemoration Full Set / Bonus Perks]'
  - start: '03:20.100'
    end: '03:32.300'
    original: 戻ってって、あ、これだった、あ、ごめん。あ、あれ、これか、フルセットはこれ。はい、これ、12345。これで、これがついてきて、で、これ、これがついてくる。次。
    english: 'Let''s go back... ah, it was this. Oh, sorry. Ah, wait, this is it,
      the full set is this. Yes, this: 1, 2, 3, 4, 5. With this, this comes included,
      and then this, this comes too. Next.'
  - start: '03:33.240'
    end: '03:38.220'
    original: これこれこれこれ！もう、オートモシしながら。これ、これがついてきます。
    english: This, this, this, this! Without missing a beat... this, this comes with
      it.
  - start: '03:38.640'
    end: '03:59.880'
    original: え、カードがね、ついてきますよ。ホロライブオフィシャルカードゲームで使用できるカードがPRカード「常闇トワ」。え、カードはねホロライブプロダクションオフィシャルショップでご購入された方のみ対象となっております。特典につくのは推しアピールできるキーカード、推しほろめんカードです。カードの詳細や遊び方についてはホームページで確認してちょ！
    english: Um, a card comes with it! The PR card 'Tokoyami Towa' usable in the Hololive
      Official Card Game. Note that the card is only available to those who purchase
      from the Hololive Production Official Shop. The bonus includes a key card to
      show off your oshi and an oshi holomem card. Please check the website for details
      on the cards and how to play!
  - start: '04:00.600'
    end: '04:13.000'
    original: ということで以上、常闇トワ誕生日記念グッズの情報でした！みんな買ってね！これですてきなMV作るんだから買ってくれないといいの作れないから（笑）よろしくね！（笑）
    english: And that wraps up the info on Tokoyami Towa's birthday commemoration
      goods! Everyone, please buy them! We're making a wonderful MV with this, so
      if you don't buy it, we can't make a good one! Haha. Please do!
  - start: '04:13.400'
    end: '04:22.500'
    original: はい、そして、そして、先ほどお伝えしたセカンドアルバム『SYIN』がホロライブプロダクションオフィシャルショップでの発売が先行して開始しております！
    english: 'Yes, and also, as I mentioned earlier, pre-sales for my second album
      ''SHIN'' have started on the Hololive Production Official Shop! [Title: 2nd
      Album SHIN]'
  - start: '04:23.500'
    end: '04:38.000'
    original: はい、たぶん配信画面の下に入れてきた購入ボタンから発売ページに飛べるようになっていると思うんですけども、みなさん押せるようになりました？もしなかったら更新でお願いいたします、更新してください。
    english: Yes, I think you should be able to jump to the sales page from the purchase
      button added below the stream screen. Were you all able to click it? If you
      can't find it, please refresh the page.
  - start: '04:38.900'
    end: '04:55.300'
    original: はい、ご購入ボタンをクリックする前にご注意事項なのですが、セカンドアルバムとそれ以外のものを同じカートで購入していただいた場合に発売日の10月8日までに発送が行えない可能性があるので気をつけてください。セカンドアルバム単体での購入なら大丈夫です！
    english: Yes, before clicking the purchase button, please note that if you purchase
      the second album and other items in the same cart, shipping may not be completed
      by the release date of October 8th, so please be careful. Purchasing the second
      album by itself is totally fine!
  - start: '04:55.300'
    end: '05:00.000'
    original: ありがとう、買ったよ、ありがとう！
    english: Thank you, you bought it? Thank you!
