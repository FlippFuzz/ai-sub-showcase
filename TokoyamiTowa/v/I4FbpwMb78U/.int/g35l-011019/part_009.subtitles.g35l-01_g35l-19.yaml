global_summary:
  overall_summary: 'This video is the 3D birthday live broadcast of Hololive 4th Generation
    VTuber Tokoyami Towa, titled ''【 #常闇トワ生誕祭2025 】超重大発表あり！Sincerely,Towa【 3DLIVE
    】''. Throughout the 51-minute stream, Towa performs a stellar setlist of songs
    including covers like Wacum''s ''Yowane Haki'' and Ai Higuchi''s ''Akuma no Ko'',
    alongside original tracks such as ''Present Day'', ''My Abyss'', ''Buzzbivazav'',
    and her newly debuted track ''ChewyChewy'' produced by nqrse. Alongside the powerful
    musical performances, Towa delivers major announcements: the release of her 2nd
    solo album ''SHIN'' on October 8, 2025, her upcoming 2nd solo live ''Tokoyami
    Towa 2nd Live "SHINier"'' at Ariake Arena on October 29, 2025, and her 2025 birthday
    merchandise line.'
