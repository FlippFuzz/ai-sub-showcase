  thoughts: |+
    **My Analysis of Towa's Announcements**

    Okay, here's the breakdown, starting with the new music. I've been involved in the discussions, and *Towa herself* had the initial idea. She put it together, essentially saying, "I'm doing this, and *I'm* going to make it great!". It's been an interesting process. We're going to put out the lyrics and music video too, those are set.

    The music video will be available to the public tonight at 9:00 PM (JST) on her channel. We poured our hearts into it and it turned out great. I want you all to check it out. Seriously, I put a lot of work into this.

    Also, the song drops on streaming platforms at midnight, I hope you don't sleep! Please, please don’t sleep. This is important stuff. I know she said "we’re going to be together forever" and all that but seriously, make the sacrifice!

    Now, the surprise: it's not just a single! Towa is doing a solo live! She’s doing her own concert! "Towa-sama solo live" is the new vibe. I’ve heard those comments so many times!

    I’m really excited, it's finally happening! The "Tokoyami Towa 1st solo live 'Break your xxx'" show is scheduled for October 13, 2023 at Tachikawa Stage Garden! And by the way, the "xxx" in the title is not an "X," it's a cross, or "batsu." What it means is up to you. You can think of it as something that you want to overcome, breaking your barriers, things to work hard for, and you're going to do it.

    The main focus will be the *Aster* album. I'm excited because the live performance will be with a live band! A real, live band! Both the live and the album are important. The album's hashtag is “#TokoyamiTowa1stSoloLive," so please use it.

    Regarding the batsu (xxx): it's not a real kiss... We’re not *that* close.

    Now about the live tickets: the Hololive Fan Club's official advance sales start tonight at 9:00 PM (JST) and I suggest everyone signs up now, or I'll be disappointed. There's standing room on the first floor, and reserved seats on the second and third. You've got until August 6th to enter the lottery.

    Also, for those who can't attend, there's paid streaming on the Z-aN platform. Tickets go on sale at 9:00 PM. You can re-watch the archive until November 13th! See the description or Hololive Production's Twitter for details. I need this to be perfect.

    And what's a live without merchandise? The classic items are a set! The support set is a fantastic option and if you buy the support set you will receive a free wristband. The wristband is really cute! You can use it to bundle your towel. I can't wait. You can buy individual items from the support set, if you wish.

    Now, we have individual items that look cooler. There's a T-shirt, a penlight, and a muffler towel. I think you need these items to support the live.

    Pay attention—the items I've just mentioned ship in advance. Next up, it's our made-to-order goods! These will be delivered after the live, so mark the date.

    We have logo keyholders, key cases, and tote bags. The logo keyholder features the key visual. The key case is a cool, leather-style. I think you can use the tote bag on a daily basis.

    There are more items! There's a can badge & sticker set, an acrylic stand, and a tapestry. These goods will include a fan illustration that Rime-sensei drew for Towa's debut.


