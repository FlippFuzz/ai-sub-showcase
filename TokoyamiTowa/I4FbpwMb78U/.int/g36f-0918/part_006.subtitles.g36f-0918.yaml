  thoughts: |+
    **My Thoughts on "SHIN" and "chewy chewy"!**

    Alright, let's break this down. First, the main event: my second album, "SHIN"! This limited edition box is looking *sharp*! Each alternate jacket card comes with a potential handwritten signature from yours truly, a nice personal touch! Plus, we have a whole lineup of merch for the giveaway: T-shirts, posters, badges...all featuring that main visual, the *album* jacket photo, you know? It's all so cool! And don't worry, even *I* want one, but there's plenty for everyone!

    Now, the standard edition... It has a nice up-close face shot! *wink* You know you are glued to my face, it's so cool. And, get this, it comes with a phone-sized jacket illustration sticker! Stick it everywhere! PC, phone, arcade stick? I'd be so happy.

    But it's not just about the visuals; the music is the core! I'm so thrilled with the writers who penned songs for this album! Both Wanuka and Ai Higuchi wrote songs *for me*! It's like those songs I sang before were actually foreshadowing! *laughs* And then there are other amazing surprises as well, like "My Abyss" and "Buzzy Buzzy" are included! Every track is fantastic, and I really can't wait for you all to enjoy it!

    And, speaking of enjoying, have you seen the store-exclusive bonuses? There are so many kinds of bonus items! I'd love to introduce them all but, well, it would take me about 5 years to go through them all, so check them out yourself! Remember, grab either the limited or standard edition, ok? And starting tonight at 9 PM JST!

    Oh! AND the Hololive EC, during *this* stream, might be allowing you to buy the CD! Keep an eye out. Something might pop up, so click it!

    But what I am really excited about is that, after this, I'm going to debut a brand-new song from "SHIN"! I got my big bro, Nqrse-san, to write a song for me: "chewy chewy"! I worked hard with the director to come up with some fresh choreography for the MV. It might look a bit different, but I really put my all into it! The MV will premiere after the stream at 8:50 PM JST, with an advance release at midnight! Nqrse is amazing when it comes to rap, but now I get to sing! Do you think there is rap in it?

    So let's calm down, and give a listen to "chewy chewy"!


