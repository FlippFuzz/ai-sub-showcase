  - start: '02:53.000'
    end: '02:58.000'
    original: はい。そしてね、SS席には特典で、ブレスレットライトがついてきます！
    english: Yes, and as a special benefit, the SS seat comes with a Bracelet Light!
  - start: '02:58.000'
