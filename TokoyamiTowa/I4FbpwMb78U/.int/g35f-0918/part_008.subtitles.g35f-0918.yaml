  - start: '00:00.000'
    end: '00:01.400'
    original: 「SHINier」です。
    english: It's "SHINier".
  - start: '00:01.400'
    end: '00:08.500'
    original: え、こちらなんですが、さっき発表したアルバムのね、タイトル「しん」に繋がっているんですよね。
    english: This actually connects to the title of the album I just announced, "SHIN".
  - start: '00:08.500'
    end: '00:14.300'
    original: このね、え、アルバムなんですけれども、色々な「しん」が入っているアルバムとなってまして、
    english: This album contains various "SHIN" (scenes/beliefs/aspects)...
  - start: '00:14.300'
    end: '00:23.000'
    original: その、えー、「しん」に沿って今回の、えー、ライブタイトルも、えー、「SHINier」という風に、えー、つけさせていただきました。
    english: '...so following those "SHIN", I decided to name this concert "SHINier".'
  - start: '00:23.000'
    end: '00:30.300'
    original: えー、ファーストライブのね、えー、「Screaming」よりも、えー、もっと輝いて、かっこいい、
    english: Even more than my first live, "Screaming," I want to shine brighter,
      be cooler...
  - start: '00:30.300'
    end: '00:37.000'
    original: えー、無限大の可能性を皆さんにお届けするので、えー、ぜひ見に来てくれればなと思います。
    english: '...and deliver infinite possibilities to all of you, so please come
      and see it!'
  - start: '00:37.000'
    end: '00:41.000'
    original: はい、え、そしてキービジュアル見てみましょう！
    english: Alright, now let's take a look at the key visual!
  - start: '00:43.000'
    end: '00:52.100'
    original: はい、どうですか？こちらね、えー、アルバムのジャケット写真描いていただいた花邑まいさんにね、えー、キービジュアルも一緒に描いていただきました。めっちゃかっこいいよね！
    english: Yes! How do you like it? This key visual was illustrated by Mai Hanamura,
      who also drew my album cover! It's so cool, right?
  - start: '00:52.100'
    end: '00:58.200'
    original: さっきのはちょっと黒い、暗い感じだったんだけど、こっちはね、光がね、見えるような感じで、
    english: The previous one had a darker feel, but this one shows the light coming
      through.
  - start: '00:58.200'
    end: '01:05.100'
    original: えー、進んでいくような、えー、前に行けるような明るさを、えー、演出してもらいましたね。
    english: She created a brightness that makes you feel like you're moving forward.
  - start: '01:05.100'
    end: '01:12.100'
    original: すごいもう、クールでかっこいいけど、みたいな感じを出せれば、と思っております。衣装もお気に入りです。
    english: I wanted to convey a feeling of "cool and stylish, but also..." The outfit
      is also one of my favorites!
  - start: '01:12.100'
    end: '01:16.100'
    original: えー、当日楽しみです。
    english: I'm really looking forward to the day of the live!
  - start: '01:16.100'
    end: '01:25.500'
    original: えー、そして、えー、今回のハッシュタグは、ライブ、アルバムどちらも共通で、えー、ハッシュタグ「#常山」…あ、「常山」だって、常闇…
    english: 'And the hashtag for this event, both for the live and the album, is
      #Tokoyama... Ah, I said Tokoyama! Tokoyami...'
  - start: '01:25.500'
    end: '01:28.500'
    original: 自分お名前噛むって凄くない？
    english: Isn't it crazy to stumble over my own name?
  - start: '01:28.500'
    end: '01:32.400'
    original: いや、なんかスタッフさんにめっちゃ見られて、笑ってんだけど。恥ずかしいんだけど！
    english: The staff are all staring and laughing at me. This is so embarrassing!
  - start: '01:32.400'
    end: '01:35.300'
    original: えー、#常闇トワ2nd です。
    english: 'The hashtag is #常闇トワ2nd.'
  - start: '01:35.300'
    end: '01:39.000'
    original: もう帰りたい！ねえ、笑いすぎだから！
    english: I wanna go home! Hey, you guys are laughing way too much!
  - start: '01:39.000'
    end: '01:45.300'
    original: えー、じゃあ、今日から改名して「常山」になります。よろしくお願いいたします。
    english: Okay, I'm renaming myself to "Tokoyama" starting today. Pleased to meet
      you.
  - start: '01:45.300'
    end: '01:50.000'
    original: えー、皆さん、いっぱいね、ポストしてくれればなと思います。
    english: Everyone, please post a lot using the hashtag!
  - start: '01:50.000'
    end: '01:54.000'
    original: そして、えー、皆さん、お待ちかね、チケット情報です！
    english: And now, here is the ticket information you've all been waiting for!
  - start: '01:54.000'
    end: '01:56.500'
    original: 本当に耳赤くなるんだけど。
    english: My ears are seriously turning red.
  - start: '01:56.500'
    end: '01:58.500'
    original: えー、会場はなんと！
    english: The venue is...
  - start: '01:58.500'
    end: '02:03.200'
    original: えー、有明アリーナです！
    english: Ariake Arena!
  - start: '02:03.200'
    end: '02:08.200'
    original: はい。えー、前回よりもね、もうすごい、何倍？3倍？2.5倍？
    english: Yes! Compared to last time, it's like... how many times bigger? 3 times?
      2.5 times?
  - start: '02:08.200'
    end: '02:15.500'
    original: くらいね、えー、会場も広くなって、前回あんなに緊張して、最初震えてたのに、
    english: The venue has gotten so much bigger. Even though I was so nervous and
      shaking at the start last time...
  - start: '02:15.500'
    end: '02:24.000'
    original: あの、だ、だい、大丈夫かなっていう心配で。
    english: '...I''m worried like, "will I... will I be okay?"'
  - start: '02:24.000'
    end: '02:34.000'
    original: でも、あの、全然実感沸かなかったんですけど、この、今この配信してちょっと実感が沸いてきて、ぷるぷるしてきました。ドキドキします。でも、頑張ります。
    english: Honestly, it didn't feel real at all, but doing this stream is making
      it sink in, and I'm starting to shake. My heart is pounding. But I'll do my
      best!
  - start: '02:34.000'
    end: '02:38.200'
    original: えー、チケットは、SS席、S席、A席、B席の4種類です。
    english: 'There are four ticket tiers: SS seat, S seat, A seat, and B seat.'
  - start: '02:38.200'
    end: '02:44.000'
    original: えー、こちらのね、SS席が気になってると思うんですけれども、
    english: I'm sure you're all curious about the SS seat.
  - start: '02:44.000'
    end: '02:53.000'
    original: SS席というのは、SHINier Supporterの略で、SHINierはトワのことで、そのサポーターは皆様のことなんですよね。
    english: SS seat stands for "SHINier Supporter". "SHINier" refers to Towa, and
