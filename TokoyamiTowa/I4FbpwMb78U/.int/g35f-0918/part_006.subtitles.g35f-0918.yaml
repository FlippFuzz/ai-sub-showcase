  thoughts: |+
    **A Deep Dive into Towa's "SHIN" Album and "chewy chewy" Debut**

    Okay, so here's the deal. I was just analyzing this Tokoyami Towa YouTube video, and I need to document the heck out of it for some detailed subtitles. First, she's on stage promoting her second album, "SHIN," going over the limited edition box and all the goodies. I had to pay close attention to the details of the merch – the sleeve box, keyholder, handwritten signature cards... it's all so exciting! There's also this giveaway campaign she's hyping, showcasing the merch – T-shirts, posters, all using the album art. I can't wait to get my hands on it, honestly.

    Then, there's the regular edition, which features a cool close-up of her face (which is stunning, of course). She's also showing off the smartphone-sized sticker. I always love how she’s thinking of us, recommending where we can stick it.

    And then comes the best part: the writers! I was so delighted to realize that the songwriters for this album are so amazing, like Wanuka-san and Higuchi Ai-san. I had to look up the tracklist: "My Abyss" is included, and "Bazubibazabu". I had to make sure I got that one right. She mentioned how every single song on this album turned out amazing, and I believe her. She then highlights the store-specific bonuses. There are so many options; it's practically a treasure hunt! But she tells us to just check it out.

    Then, there's this Hololive EC release; there's even a chance we can buy the CD during the livestream. Fingers crossed!

    And now for the main event: the new song! She's performing "chewy chewy," a track written by nqrse-san. It is written by nqrse-aniki! And the music video is coming up right after this stream at 8:50 PM, and digital pre-release is at midnight! I really am wondering if there will be rap in the song because nqrse-san always has the best raps. She talks about the MV, and how she was pushed out of her comfort zone with the director. It’s going to be a must-see!

    And finally, "chewy chewy" begins. The lyrics are important:

    *   Sugar and cocoa boy,
    *   a sharp-witted boy.
    *   Hiding my ears, flying coast to coast, this is Towa.
    *   Flowing with the colors, following my passionate nature.
    *   Drop the needle, dispersing questions and intents simultaneously. Let's go!
    *   Binding them with the praise and freedom that await.

    This song is going to be amazing, and I can't wait to subtitle the entire performance!


