global_summary:
  overall_summary: This 3D debut stream features Raora Panthera from hololive English
    -Justice-, exploring 'Chattini Land' to collect three tickets for a jetpack. Along
    the way, she encounters various special guest hololive members across different
    themed areas, participating in hilarious minigames such as a posing competition,
    a limbo dance, and an obstacle avoidance running game. The stream culminates in
    stunning 3D musical performances—including group covers and the debut of her first
    original song 'Gacha×Gacha ADVENTURE!'—showcasing her energetic personality, artistic
    flair, and charm.
