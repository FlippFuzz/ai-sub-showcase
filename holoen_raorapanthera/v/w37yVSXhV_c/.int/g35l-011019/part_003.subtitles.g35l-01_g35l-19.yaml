  overall_summary: This video captures the first-ever 3D birthday live concert of
    Raora Panthera from hololive English -Justice-, titled 'Where Emotions Bloom'
    (#RaoraBday2026). The concert features a surreal dreamlike narrative where Raora
    wakes up in a white canvas room with her mascot Tatino and transitions into a
    vibrant stage. Throughout the 69-minute concert, Raora performs emotional and
    powerful covers and original songs, joined by special guest stars Ouro Kronii,
    Tokoyami Towa, Elizabeth Rose Bloodflame, Ookami Mio, and Nekomata Okayu. The
    stream blends musical performances, comedy, banter about color symbolism and taxes,
    a merchandise showcase, and concludes with the premiere of her new original song
    'Draw.'
