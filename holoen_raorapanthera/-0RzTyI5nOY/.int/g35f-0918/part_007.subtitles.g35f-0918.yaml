    I went through the video frame by frame, meticulously mapping the singers to their lines: Raora with pink hair, Shiori with black/blue, and Moona with purple hair. Then, each line needed to be transcribed. I noted down every line of Japanese lyrics and carefully aligned them with the corresponding time codes in the video. I also paid attention to the parts where the singers overlapped each other, and the instrumental portions too.

    After mapping the song, I transcribed each line, ensuring accurate timing. I cross-referenced with the video to make sure the lip-sync was spot-on. I made sure to note the various overlapping lines and even broke lines apart for readability and perfect alignment with the video segments.

    Then, there was the post-song English chatter. I carefully transcribed what the VTubers were saying at the end, paying close attention to words like "Velvet," Raora's mascot. I made sure to note who was saying what, and I even went back and listened again to confirm.

    As the final step, I refined the timings and text, making sure each subtitle was perfectly synchronized and readable, while adhering to the specified 50 character limit per line. It's crucial, to not overlap subtitles. I made absolutely certain that all the timestamps were precisely in the right format. No unnecessary tags or music notations, only the essential information needed to generate synchronized subtitles. It is also important to maintain the original Japanese text and provide a solid English translation for it.


