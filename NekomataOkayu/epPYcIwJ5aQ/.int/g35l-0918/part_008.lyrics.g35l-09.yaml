    reference_lyrics_en: |-
      To whom it may concern,
      My wish is to no longer regret the future.
      8 degrees and 5 minutes, the sensational dream has fallen apart.

      Re-disclosed,
      Your feelings turn to sorrow in a sentimental argument,
      Trapped inside a world with a radius of 85 centimeters.

      I took your real intention and cracked it,
      Overflowing with everything.
      I’ll burn the firewood and put it in the wind
      To color the rusted sky.
      The flowers carefully decorating the smoked days
      Withered away so quickly.
      Stupidly, I woke up from a dream
      With no meaning clinging to it.

      On barren days,
      I carefully drew a flower on a piece of paper.
      Our unfortunate selves were defeated by the dreams,
      And we even made it as if the vows we swore never happened.

      In the sunbeams,
      The flowers bloom so softly.
      Above the clouds, on a different star,
      Swaying beyond the dream.

      The flowers carefully decorating the smoked days
      Withered away so quickly.
      Stupidly, I woke up from a dream
      With no meaning clinging to it.

      On barren days,
      I carefully drew a piece of paper with a flower.
      Our unfortunate selves were defeated by the dreams,
      And we even made it as if the vows we swore never happened.
