  thoughts: |+
    **A Deep Dive into Okayu's Live and Album: My Thoughts**

    Okay, here's the breakdown of what's been running through my mind as I prep for the live and album. First, I'm thinking about the merch. I wanted to make sure everything was carefully selected, so I put a lot of thought into each item. I worked closely with management to create super cute items.

    I spent ages discussing and deciding on the must-have items for the live: the acrylic plate light, T-shirt, and face towel, which are all part of a set. There's a special ticket case and a sticker as a bonus. Then, thinking about the merch, and how everything is coming together, the "Poisonya Syndrome" merch includes the acrylic plate light, a T-shirt, and a face towel, which I'm very excited about.

    I agonized over the face towel design and the T-shirt. I had a whole thing about where to put a yellowish-green cat point on the T-shirt! I'm proud of all the detail in the design, and I hope everyone is. Next, there are individual items: a T-shirt, acrylic plate light, and a face towel that can be purchased separately.

    Then there's the other merch, the logo rubber keychain, the big can badge stand, and the acrylic stand. They're all super cute! I want people to display the stands and wear the keychain! You can put the stand anywhere! Please make sure to read the notes on each website before purchasing anything. Remember, you can only buy merchandise online; it won't be sold at the venue.

    Also, I've been thinking about the special collaboration with Bushiroad Inc. they are giving away a Reバース PR card designed with the live's key visual. Be sure to grab it! And finally, let's talk about my first album, "Poisonya Syndrome!"

    The album title is the same as the live. I thought about naming them differently, but I chose the same name because I wanted it to leave a stronger impression. The album jacket and tracklist are now public. Kamioka Chirol Mama did the illustration, and Fujinome Ai-sensei did the logo. There are 12 tracks, including previously announced songs.

    I love all the songs, and I asked people I love to create them, so I want you all to hear them soon! I'm planning to go through all of the songs, so I hope you can screenshot the information. The album hashtag is #PoisonyaSyndrome. Please tweet along with the solo live!

    Phew! I've said everything! There's a lot of information, I am so happy, and I am happy that I can announce it today! I wanted to say it so long, I've been waiting for July 24th! Thank you, everyone. For live details like the solo live, key visuals, merch, and venue info, please check the website! We're about two months away from the live, and I am excited!


