  overall_summary: This video is the official 2024 birthday 3D live stream of Hololive
    Gamers VTuber Nekomata Okayu, titled 'Cat♥Hoodie'. The broadcast features high-energy
    musical performances of covers and original tracks, comedic skits and roleplay
    with special guests including Hololive Gamers (Shirakami Fubuki, Ookami Mio, Inugami
    Korone), Nijisanji's Shiina Yuika and Amamiya Kokoro, and the Doroken group. Highlights
    include trap-floor variety quiz games, the surprise 3D model debut of her feline
    alter-ego 'Okaniyan', the premiere performance of her new original song 'Neko
    Kaburi-Na' produced by PinocchioP, and major announcements regarding merchandise,
    Sound Voltex collaboration, and digital music releases.
