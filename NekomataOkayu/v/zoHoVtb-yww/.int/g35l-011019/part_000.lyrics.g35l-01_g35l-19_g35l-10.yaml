    with special guests including Hololive Gamers (Shirakami Fubuki, Ookami Mio, Inugami
    Korone), Nijisanji's Shiina Yuika and Amamiya Kokoro, and the Doroken group. Highlights
    include trap-floor variety quiz games, the surprise 3D model debut of her feline
    alter-ego 'Okaniyan', the premiere performance of her new original song 'Neko
