name: part_009
total_attempts: 1
video_duration_ms: 300008
subtitles_prompt_version: 18
responses:
- subtitles:
  - start: '00:00.000'
    end: '00:02.300'
    original: はい、です、かー！
    english: Hi, everyone!
  - start: '00:02.800'
    end: '00:08.200'
    original: えー、まずはみんなに見ても頂きたいCMがございます！
    english: First off, we have a commercial that I'd like you all to watch!
  - start: '00:08.800'
    end: '00:14.000'
    original: あ、やばい！みんな、心して...どうぞ！
    english: Oh my! Everyone, brace yourselves... Here it is!
  - start: '00:14.656'
    end: '00:23.000'
    original: ここからは檜山修之が猫又おかゆ誕生日記念グッズ2026のグッズをご紹介するぞ！まずはこれだ！
    english: From here on, Nobuyuki Hiyama will introduce the Nekomata Okayu Birthday
      Celebration 2026 Goods! First, we have this!
  - start: '00:23.800'
    end: '00:26.500'
    original: はっぴ〜おかゆはっぴ〜
    english: Happi~ Okayu Happi~
  - start: '00:27.000'
    end: '00:31.500'
    original: 神岡ちろる先生の描き下ろしイラストが描かれた法被がグッズになったぞ！
    english: A happi coat featuring a newly drawn illustration by Kamioka Chiroru-sensei
      is now merch!
  - start: '00:32.000'
    end: '00:34.500'
    original: きょとん顔のおかゆんがとてもキュート！
    english: Okayu with a bewildered face is super cute!
  - start: '00:35.000'
    end: '00:41.200'
    original: イベントやライブに着ていけば一目でおにぎりゃーアピールできるスーパーハッピーなグッズだ！
    english: If you wear this to events or live shows, it's a super happy item that
      lets you show off as an Onigirya at a glance!
  - start: '00:41.800'
    end: '00:45.500'
    original: お出かけに連れてってアクリルスタンド！
    english: Take Me Out Acrylic Stand!
  - start: '00:45.800'
    end: '00:52.000'
    original: アクスタはもう家に飾るだけの時代じゃない！日々のお出かけを彩る、推し活マストアイテム！
    english: Acrylic stands aren't just for displaying at home anymore! It's a must-have
      fan item to brighten up your daily outings!
  - start: '00:52.500'
    end: '00:58.500'
    original: ポーチに入れて外に持ち運んで、おかゆんに世界を沢山見せてあげてくれよな！
    english: Put it in your pouch, carry it outside, and show Okayun the world!
  - start: '00:59.000'
    end: '01:03.000'
    original: ごくごく！BIGたんぶら〜
    english: Gulp-Gulp! BIG Tumbler~
  - start: '01:03.200'
    end: '01:07.500'
    original: 甘城なつき先生描き下ろしのミニキャラが描かれた大容量のタンブラー！
    english: A large-capacity tumbler featuring a mini-character drawn by Amagi Natsuki-sensei!
  - start: '01:08.000'
    end: '01:15.800'
    original: 持ち手やストローもついているので、外出時はもちろん、勉強中や仕事中、様々なシチュエーションで大活躍間違いなし！
    english: It comes with a handle and straw, so it's guaranteed to be a huge hit
      when going out, studying, working, or in any situation!
  - start: '01:16.000'
    end: '01:19.500'
    original: おかゆんの配信を見る時にも使ってくれ！！
    english: Use it when watching Okayun's streams too!!
  - start: '01:20.000'
    end: '01:23.500'
    original: おでかけおにぎり型ショルダーポーチ！
    english: Outing Onigiri Shoulder Pouch!
  - start: '01:24.000'
    end: '01:28.000'
    original: アクスタやhololive friends to Goなどちょっとした小物が入る優れたショルダーポーチだぜ！
    english: An excellent shoulder pouch that can hold small items like acrylic stands
      or hololive friends to Go!
  - start: '01:28.500'
    end: '01:33.000'
    original: 透明素材なので日々の推し活に使える一品となっているぞ！
    english: Since it's made of transparent material, it's a great item for your daily
      fan activities!
  - start: '01:33.200'
    end: '01:36.000'
    original: そして... フルセット購入特典はこちら！
    english: And... here is the full set purchase bonus!
  - start: '01:36.200'
    end: '01:44.500'
    original: なんとフルセットを購入した全員に猫又おかゆ直筆サイン＆複製メッセージ入りポストカードがついてくる！
    english: Surprisingly, everyone who buys the full set gets a postcard with Nekomata
      Okayu's hand-written signature & duplicated message!
  - start: '01:45.000'
    end: '01:48.800'
    original: おにぎりゃーのみんな！絶対ゲットしてくれよな！
    english: All you Onigirya out there! Be sure to get it!
  - start: '01:49.000'
    end: '01:53.200'
    original: やばーい！
    english: That was amazing!
  - start: '01:54.000'
    end: '02:04.500'
    original: ということで、あの...檜山修之さんに生誕グッズのCMを撮っていただきました！やばい！
    english: So, um... Nobuyuki Hiyama-san recorded the commercial for my birthday
      merch! That's insane!
  - start: '02:05.200'
    end: '02:20.000'
    original: もう檜山修之さんというね、レジェンドの声優さんがいらっしゃいまして、猫又おかゆ、ホロライブデビュー時からの世界で一番大好きな声優さんとなっております！
    english: Nobuyuki Hiyama-san is a legendary voice actor, and ever since my Hololive
      debut, he's been my absolute favorite voice actor in the entire world!
  - start: '02:20.500'
    end: '02:26.500'
    original: あの、この場をお借りして、あの、檜山修之さん、本当にありがとうございました！
    english: I'd like to take this opportunity to say... Nobuyuki Hiyama-san, thank
      you so very much!
  - start: '02:27.000'
    end: '02:33.000'
    original: 興奮冷めやらぬなんですが...
    english: I'm still so excited, but...
  - start: '02:33.500'
    end: '02:47.000'
    original: あの、CMにあった通り、猫又おかゆ生誕グッズ2026を発売させていただきますので、皆さん是非ご予約お待ちしてます！
    english: As seen in the commercial, Nekomata Okayu Birthday Goods 2026 are now
      available, so everyone, please make your pre-orders!
  - start: '02:47.500'
    end: '02:51.500'
    original: そして、告知は一つだけじゃないんですね。
    english: And that's not the only announcement.
  - start: '02:52.000'
    end: '02:56.000'
    original: 続きまして、こちら！ドンドン！
    english: Next up, this! Ta-da!
  - start: '02:56.500'
    end: '03:03.500'
    original: いよいよお待ちかね！来月3月26日木曜日に「おかゆにゅ〜む！」...
    english: Finally, what you've been waiting for! Next month on Thursday, March
      26th, 'Okaunyum! Part 1'
  - start: '03:04.000'
    end: '03:12.000'
    original: 「R」...
    english: '...''R''...'
  - start: '03:13.000'
    end: '03:17.500'
    original: 「おかゆにゅ〜む！R」がリリース！
    english: '...''Okaunyum! R'' is releasing!'
  - start: '03:18.000'
    end: '03:26.000'
    original: 青森を舞台に君と2人で商品開発という名の恋人旅行がスタート！
    english: Set in Aomori, a romantic trip with you disguised as product development
      begins!
  - start: '03:26.500'
    end: '03:32.000'
    original: 笑いあり、デートあり、野球拳もあり...
    english: Laughter, dates, and even strip-poker...
  - start: '03:32.500'
    end: '03:36.000'
    original: 盛りだくさんの作品となっております！
    english: It's a feature-packed game!
  - start: '03:36.200'
    end: '03:41.500'
    original: 自分で...自分で「野球拳あり」って何言ってんだと思っちゃったね。
    english: I just thought to myself, 'Why did I say strip-poker included?'
  - start: '03:42.000'
    end: '03:48.500'
    original: うん、自分で言ったくせにね。僕が野球拳やりたいって言ったくせにね。
    english: Yeah, even though I'm the one who said it. Even though I was the one
      who said I wanted strip-poker.
  - start: '03:49.000'
    end: '03:57.000'
    original: そして、野球拳あるのに「CERO審査大丈夫なのかよ」というお声、あの、度々いただいておりますが...
    english: And even with strip-poker, we've often received comments asking, 'Will
      it pass CERO rating?'...
  - start: '03:57.500'
    end: '04:05.500'
    original: なんと、心配していたCERO審査も無事に「C」で決まりました！
    english: And believe it or not, the CERO rating we were worried about safely came
      out as 'C'!
  - start: '04:06.000'
    end: '04:08.500'
    original: ふぅー、良かった良かった！
    english: Phew, what a relief!
  - start: '04:09.000'
    end: '04:14.500'
    original: うん！そしてみんな体験版ももう既に遊んでくれたかな？
    english: Yep! And has everyone played the demo version already?
  - start: '04:15.000'
    end: '04:20.500'
    original: あのドキドキの続きは是非君の目で確かめてほしいな！
    english: I hope you'll check out what happens after that heart-throbbing part
      with your own eyes!
  - start: '04:21.000'
    end: '04:29.500'
    original: まだまだたくさんの未公開情報もあるとのことなので、「おかゆにゅ〜む！R」から目が離せないよ！
    english: There's still plenty of unrevealed info coming, so keep your eyes glued
      to 'Okaunyum! R'!
  - start: '04:30.000'
    end: '04:33.500'
    original: 是非お楽しみに！
    english: Please look forward to it!
  - start: '04:34.000'
    end: '04:38.500'
    original: そして、こちら最後の告知となります！
    english: And here is the final announcement!
  - start: '04:39.000'
    end: '04:44.500'
    original: 毎年発表させていただいているんですが、今日もライブの最後に...
    english: We announce this every year, but today, at the end of the live stream...
  - start: '04:45.000'
    end: '04:50.000'
    original: 新曲を発表させていただきます！
    english: I'll be announcing a new song!
  - start: '04:50.500'
    end: '04:52.500'
    original: はぁ〜、やっと言えた！
    english: Phew, I finally got to say it!
  - start: '04:52.800'
    end: '04:59.800'
    original: 今回はですね、てにをはさんに作詞作曲をしていただきました！ありがとうございます、てにをはさん！
    english: This time, Ten'iwoha-san wrote the lyrics and composed the music for
      me! Thank you so much, Ten'iwoha-san!
