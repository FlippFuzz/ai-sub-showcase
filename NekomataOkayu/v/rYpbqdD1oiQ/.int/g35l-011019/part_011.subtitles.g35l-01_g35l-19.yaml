    2026. The concert features solo performances and duet/group collaborations with
    numerous Hololive guests (including Nakiri Ayame, Rindo Chihaya, Himemori Luna,
    Momosuzu Nene, Tsunomaki Watame, Ninomae Ina''nis, Laplus Darknesss, Oozora Subaru,
    Shirakami Fubuki, Ookami Mio, and Inugami Korone). Major highlights include energetic
    choreography, a special birthday goods commercial narrated by legendary voice
    actor Nobuyuki Hiyama, announcements for her upcoming visual novel game ''Okayunyumu!
    R'', and the premiere of her brand-new original song ''Non Delicious'' written
    and composed by Teniwoha.'
