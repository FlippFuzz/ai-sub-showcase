  - start: '03:11.165'
    end: '03:17.385'
    original: 映えを意識してオーロラ加工をしていただいております。
    english: We went with an aurora finish to emphasize how photogenic it is.
  - start: '03:27.425'
    end: '03:30.405'
    original: フルセット購入特典〜！
    english: Full-Set Purchase Bonus~!
  - start: '03:31.285'
    end: '03:44.385'
    original: 今回もございます、フルセット特典！直筆サイン入りチェキ風ブロマイドカードと特典ボイス「おおかゆぬいぐるみとおでかけ編」がついてきまーす！
    english: We have it this time too, the full-set bonus! It comes with a hand-signed
      cheki-style bromide card and a bonus voice track titled 'Going Out with Okayu
      Plushie'!
  - start: '03:44.965'
    end: '03:56.225'
    original: 今回もね、無制限でやらせていただきますから、みんな急がなくて大丈夫です。ゆっくり買ってくれれば大丈夫なんです。
    english: This time too, you know, we're doing it with no purchase limits, so everyone
      doesn't need to rush. It's totally fine if you buy it leisurely.
  - start: '03:57.385'
    end: '04:10.205'
    original: 特典ボイスタイトルは「おかゆぬいぐるみとおでかけ編」ぬいぐるみ視点の珍しいシチュエーションとなっております。
    english: The bonus voice title is 'Going Out with Okayu Plushie,' featuring an
      unusual situation from the plushie's perspective.
  - start: '04:10.965'
    end: '04:28.985'
    original: さっきのリュックにね、あのふたつ入るよって言ったんで、そのぬいぐるみがリュックの中にいるときは、どういう景色を楽しんでいて、どういう気持ちなのかなっていうのをイメージしたボイスとなっております。
    english: I mentioned earlier that two can fit in that backpack, so this voice
      imagines what kind of scenery they're enjoying and what kind of feelings they
      have while inside the backpack.
  - start: '04:29.625'
    end: '04:36.685'
    original: ぜひ、おかゆリュックに入れて聴くと臨場感があって楽しめるボイスとなっておりまーす！
    english: By all means, if you put it in the Okayu backpack and listen, it's a
      voice where you can enjoy a sense of realism!
  - start: '04:37.805'
    end: '04:40.365'
    original: 続いては、こちら！
    english: Next up is this!
  - start: '04:40.365'
    end: '04:54.685'
    original: プロモカード！タレントプレミアムグッズのフルセット特典として、去年の9月から発売されたホロライブ公式カードゲームで使用できるカードが1枚ついてきまーす！
    english: Promo card! As a full-set bonus for talent premium goods, you'll get
      one card usable in the Hololive Official Card Game released starting last September!
  - start: '04:55.325'
    end: '04:59.265'
    original: カードはホロライブプロダクション公式ショップでご購入された
    english: The card was purchased at the Hololive Production Official Shop...
