  - start: '02:42.505'
    end: '02:47.885'
    original: イラストはね、あの僕がデザインさせていただきました。
    english: The illustration, you know, I was allowed to design it myself.
  - start: '02:49.205'
    end: '02:56.245'
    original: こちらはま、よく出したりするチェキが入られるサイズとなっております。
    english: This is sized so that chekis you often take out can fit right inside.
  - start: '02:56.745'
    end: '03:01.905'
    original: ま、それこそね、さっき発表があったリュックにつけていくもよしだし、
    english: Well, you could attach it to the backpack announced earlier, of course,
  - start: '03:02.325'
    end: '03:10.585'
    original: ま、飾るために、チェキを入れるためのチェキホルダーとしてお部屋に飾ったりなんかしても絶対可愛いよね。
    english: or even if you display it in your room as a cheki holder to put your
