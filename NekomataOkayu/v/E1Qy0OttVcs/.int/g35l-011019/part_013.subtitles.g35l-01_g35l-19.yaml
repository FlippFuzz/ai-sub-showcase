  overall_summary: 'This video is the 3D Birthday Live stream of Hololive GAMERS virtual
    YouTuber Nekomata Okayu, titled ''【 3D LIVE 】ゲスト盛りだくさん！重大告知アリアリ🎂😸【 #猫又おかゆ生誕祭2025
    】''. The stream features a nostalgic narrative and skit segments intertwined with
    incredible musical performances alongside guest stars Inugami Korone, Oozora Subaru,
    Shirakami Fubuki, Ookami Mio, and Yokohama DeNA BayStars mascot DB.Starman. Additionally,
    Okayu delivers major announcements regarding her 2nd full album ''ぺるそにゃ～りすぺくと'',
    her upcoming 2nd live tour, her original visual novel game ''Okayu Nyum'', and
    exclusive birthday merchandise.'
