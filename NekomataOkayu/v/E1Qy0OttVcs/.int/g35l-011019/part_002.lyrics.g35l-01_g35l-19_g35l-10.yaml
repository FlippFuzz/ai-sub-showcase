  original: でもおかゆとだったらいいかも…うん！
  english: But if it's with Okayu, it might be good... Yeah!
- start: '02:39.900'
  end: '02:42.100'
  original: ほんと？
  english: Really?
- start: '02:42.200'
  end: '02:46.500'
  original: よ～し！ そうと決まれば…善は急げだぁぁ！
  english: Alright! If that's settled... no time to waste!
- start: '03:06.000'
  end: '03:08.500'
  original: ねぇ まだまだまだ？ 急いで！
  english: Hey, still not ready? Hurry up!
- start: '03:08.900'
  end: '03:11.500'
  original: 出かける準備はできたかい？
  english: Are you ready to head out?
- start: '03:11.600'
  end: '03:15.500'
  original: キミに見せたい不思議の世界 見送りならいらない
  english: I want to show you a mysterious world. No need to see me off.
- start: '03:16.800'
  end: '03:18.900'
  original: たとえ火の中 水の中
  english: Through fire, through water,
- start: '03:19.000'
  end: '03:22.000'
  original: 手さぐりでみえない今日の中
  english: Through today where we grope in the unseen,
- start: '03:22.100'
  end: '03:25.500'
  original: 1秒先だって まだ知らないけど
  english: Even a second ahead is still unknown,
- start: '03:26.500'
  end: '03:31.500'
  original: いつも思い出はどれも 全部 ボールの中に
  english: All our memories are always inside the ball.
- start: '03:37.000'
  end: '03:41.000'
  original: 1・2・3で飛び込め いつか描いた未来が
  english: Dive in on 1, 2, 3! The future we once pictured
- start: '03:42.000'
  end: '03:45.500'
  original: ボクのポケットにあるから
  english: Is right in my pocket.
- start: '03:47.800'
  end: '03:52.500'
  original: はじめましては いつだって初めてさ ためらうことなどない
  english: Hello is always for the very first time, there's nothing to hesitate about.
- start: '03:56.500'
  end: '04:00.800'
  original: トライ！ レッツラファイト！ 1バトルをしたなら
  english: Try! Let's ra fight! If we had a battle,
- start: '04:01.000'
  end: '04:03.900'
  original: 笑うか泣いたって3で
  english: Whether laughing or crying, on 3,
- start: '04:04.000'
  end: '04:07.000'
  original: 仲間になろうよ
  english: Let's become friends.
- start: '04:08.500'
  end: '04:13.000'
  original: あの日だって この日だって いつだってそうしていた
  english: That day, this day, we've always been like that.
- start: '04:13.900'
  end: '04:18.500'
  original: 先も見えない果ても知らない 世界がそこにあるけど レッツゴー
  english: A world where we can't see ahead or know the bounds is right there, let's
    go!
- start: '04:20.000'
  end: '04:22.000'
  original: 転んですりむいて レッツゴー
  english: Falling and scraping our knees, let's go!
- start: '04:22.200'
  end: '04:25.500'
  original: 何度も歩き出す隣
  english: Walking side by side again and again,
- start: '04:26.000'
  end: '04:26.950'
  original: キミにきめた！
  english: I choose you!
- start: '04:33.000'
  end: '04:37.000'
  original: 隣の街から 景色はため息つくほど
  english: From the next town, the scenery makes me sigh so much
- start: '04:37.800'
  end: '04:42.500'
  original: 世界はめまぐるしく回り変わる ボクを置き去りにする
  english: The world spins and changes so fast, leaving me behind.
- start: '04:43.900'
  end: '04:48.800'
  original: 子供の頃には夢中でくぐり抜けた 穴ぼこでもしばらくぶりだな
  english: Even a pothole we eagerly crawled through as kids... it's been a while.
- start: '04:49.000'
  end: '04:52.500'
  original: 見落としていたの？ でもね忘れた景色も
  english: Did I overlook it? But even the scenery I forgot...
