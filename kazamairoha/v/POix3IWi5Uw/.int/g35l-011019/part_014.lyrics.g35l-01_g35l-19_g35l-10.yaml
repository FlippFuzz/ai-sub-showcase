- start: '00:49.035'
  end: '00:54.615'
  original: 風真いろは3周年ミニライブにお越しいただきましてありがとうございます！
  english: Thank you very much for coming to Kazama Iroha's 3rd Anniversary Mini LIVE!
- start: '00:56.815'
  end: '01:04.495'
  original: 今年は、周年3Dライブじゃなかったんじゃナイノ？って思っているそこのあなた。
  english: To those of you thinking, "Wait, isn't this year's anniversary supposed
    to be a regular 3D live?"
- start: '01:04.495'
  end: '01:15.115'
  original: 実はですね、こちらは今年の誕生日のリソースをお願いして使わせていただいて特別に収録しております。
  english: actually, this was specially recorded using the resources requested for
    my birthday earlier this year.
- start: '01:16.115'
  end: '01:24.495'
  original: なので、今なんと収録しているのは風真の誕生日 だいぶ前になるんですけども。
  english: So, right now, what's being recorded is actually quite a long time before
    Kazama's birthday, you see.
- start: '01:24.495'
  end: '01:32.495'
  original: 未来の大神さん、そして未来の風真いろは見ている…という種明かしでございました。
  english: So the truth is, future Ookami-san and future Kazama Iroha are watching...
    that was the big reveal.
- start: '01:33.255'
  end: '01:38.255'
  original: はい、もしかしてないかな？嬉しいって言ってくれてる大士さんもきっとコメント欄にいるんじゃないかなって思うと。
  english: Yes, wondering if maybe there are any Daiset-san out there saying "I'm
    so happy" and probably hanging out in the comment section.
- start: '01:38.855'
  end: '01:46.675'
  original: 今ちょっと想像して嬉しい気持ちになっています。今日は3周年の記念配信見てくださり本当にありがとうございます！
  english: Imagining that right now makes me feel so happy. Thank you so much for
    watching today's 3rd anniversary commemorative stream!
- start: '01:49.915'
  end: '02:08.575'
  original: きっとね、今から比べたら11月の30日でしょ？今よりもうた絶対上手くなってるし、今よりもう絶対におどり上手くなっているはずなんですけれども。
  english: Surely, compared to now—since it's November 30th, right?—my singing must
    be definitely better than now, and my dancing must definitely be better too.
- start: '02:08.575'
  end: '02:17.835'
  original: 今の全力精一杯をね、今回このミニライブに詰めさせていただいております！あぁ、この後見せるのがドキドキするぜ！
  english: But I've packed my absolute best effort right now into this mini LIVE!
    Ah, my heart is pounding just thinking about showing this next!
- start: '02:18.995'
  end: '02:27.435'
  original: そして、今回ですね、どうしてミニライブをやったかっていうのがもう一つ理由がありまして。
  english: And, another reason why we did this mini LIVE this time is...
- start: '02:27.435'
  end: '02:31.955'
  original: なんとですね、みなさんのこの度、風真いろは新しいオリジナル曲を発表させていただくこととなりました！わー！
  english: we are pleased to announce that Kazama Iroha is releasing a brand-new original
    song! Yay!
- start: '02:31.955'
  end: '02:37.955'
  original: そうなんです。このタイミングで今日新オリジナル曲を公開させていただきます！はい。
  english: That's right. At this timing today, we are releasing a brand-new original
    song! Yes.
- start: '02:38.955'
  end: '02:53.955'
  original: 今回は今までオリジナル曲があったと思うんですけど、いろはステップは可愛い感じ、あとはまじかるござるは結構ね、なんかポップなキャッチな感じ。
  english: Up until now, we've had various original songs, like "Iroha Step" which
    has a cute vibe, and "Magical Gozaru" which is quite pop and catchy.
- start: '02:53.955'
  end: '03:00.955'
  original: で、夢見る深海もそんな可愛い感じ魔法少女な感じですね。そして風邪を合致でようなかっこいい感じでした。
  english: And "Yumemiru Shinkai" has that cute magical girl vibe, and Kazama Watte
    was cool.
- start: '03:00.955'
  end: '03:10.955'
  original: 結構いろんなオリジナル曲を作ってきたんですけども、今回の曲はなんと風真いろはの性格的なところを全面に出した曲となっております。
  english: We've made quite a variety of original songs, but this time's song is one
    that fully brings out Kazama Iroha's personality.
- start: '03:11.235'
  end: '03:32.435'
  original: はい。みなとの3年も風真いろはにお付き合いいただきましたら、風真いろはがとってもちょっと恥ずかしいのが苦手とかね、そういった内面があるのはもちろん大士さんはもうご存知の方も多いかと思うんですけども。
  english: Yes. If you've spent 3 years accompanying Kazama Iroha, many of you already
    know that Kazama Iroha struggles with being shy and has that kind of inner side.
- start: '03:32.435'
  end: '03:42.435'
  original: その内面と今回は恋愛感をマッチさせた恋愛ソングを作らせていただきました！
  english: So we created a romance song that matches that inner self with a sense
    of romance!
- start: '03:42.675'
  end: '03:52.675'
  original: 恥ずかしくて発作が起きそうです。けどね、自分のやっぱ内面とかそういうの表現したい。今年は1年オリジナル曲をいっぱい作りたいということで活動してまいりました。
  english: It's so embarrassing I feel like I'm going to have a seizure. But you know,
    I wanted to express my inner self. I've been active this year with the goal of
    creating lots of original songs.
- start: '03:52.675'
  end: '04:05.675'
  original: そのため今回もですね、周年で1個公開させていただき、新たな一面を出せればと思っております！
  english: Because of that, this time as well, I wanted to release one for the anniversary
    and show a new side of myself!
- start: '04:05.675'
  end: '04:22.675'
  original: はい、ちょっと今発表する前にドキドキしてしょうがないので、この後歌うんですけども、そう、このミニライブで初披露になるんですが、その前に1回お水飲んできますね。
  english: Yes, my heart is pounding before the announcement so I can't help it, I'll
    be singing after this, but yes, this is the first performance in this mini LIVE,
    but before that, I'll go drink some water.
- start: '04:22.675'
  end: '04:47.015'
  original: それでは改めて風真いろはのちょっと内面的な性格を含んだ新オリ曲、そして初めての恋愛ソングとなります。それではみなさん聞いてください！
  english: So once again, this is a new original song incorporating Kazama Iroha's
    inner personality, and it's her very first romance song. Everyone, please listen!
- start: '04:41.295'
  end: '04:47.015'
  original: ポリスピカデリーさん作詞作曲 風真いろは新オリジナル曲 ハードモード
  english: 'Lyrics and composition by Police Piccadilly, Kazama Iroha''s new original
    song: Hard Mode'
- start: '04:49.872'
  end: '04:52.332'
  original: ダメだ 果てしない
  english: No good, it's endless.
