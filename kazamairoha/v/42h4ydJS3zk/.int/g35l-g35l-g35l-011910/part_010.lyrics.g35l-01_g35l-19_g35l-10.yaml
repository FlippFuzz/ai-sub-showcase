global_summary:
  overall_summary: This video features Kazama Iroha's birthday 3D live stream titled
    '#風真いろは生誕LIVE2025 告知&ゲストあり🎈これが風真いろはです！~Reversible~' on her official YouTube channel.
    Following a hiatus due to psychogenic aphonia, Iroha returns with a vibrant and
    emotionally resonant concert themed 'Reversible,' showcasing both her signature
    adorable charm and a newly revealed cool/dance-oriented side. The stream features
    multiple vocal performances—including solo covers, original tracks like her 7th
    original song 'ホントノワタシ' and '君にしか読めない手紙,' and guest collaborations with Ookami
    Mio, Todoroki Hajime, and Hakos Baelz on songs like 'ブラック★ロックシューター' and 'Beyond
    the way.' In addition to electrifying musical acts, Iroha announces her 1-million
    subscriber commemorative merchandise and her 2025 birthday merchandise collection,
    culminating in an emotional reflection on her recovery and gratitude toward her
    fans and staff.
