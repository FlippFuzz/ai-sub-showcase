global_summary:
  overall_summary: This video is Kazama Iroha's 2nd Anniversary 3D Live broadcasted
    on her YouTube channel on November 30, 2023. Titled 'Kazama's Story from the Beginning',
    the live features a theatrical narrative theme where Kazama Iroha journeys as
    a lone wandering samurai searching for her place in the world, eventually reuniting
    with her companion Pokobe and her holoX members (Laplus Darknesss, Takane Lui,
    Hakui Koyori, and Sakamata Chloe). The performance includes numerous cover songs
    and duets with guest members, heartfelt letters to each member, major merchandise
    announcements, and the premiere/reveal of her second original song 'Kaze o Aogishi
    Reiyō na'.
