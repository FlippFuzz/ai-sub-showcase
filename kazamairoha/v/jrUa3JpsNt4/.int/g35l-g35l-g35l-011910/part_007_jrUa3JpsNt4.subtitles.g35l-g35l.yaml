  - start: '02:15.156'
    end: '02:22.396'
    original: キミと見たいセカイへ
    english: To the world I want to see with you
  - start: '02:23.156'
    end: '02:40.406'
    original: キミと見たいセカイへ
    english: To the world I want to see with you
  - start: '02:44.256'
    end: '02:53.306'
    original: はい！みなののこんばんはでござる！ここまでの風真いろは物語、いかがだったでしょうか？
    english: Hello, Minano-no, good evening de gozaru! How did you like the Kazama
      Iroha Story so far?
  - start: '02:53.946'
    end: '03:04.146'
    original: ただの侍から、いろんな大切な顔に出会い、ホロライブという世界にやってきて、ホロXの風真いろはになりました！わあー！ござる！
    english: From just a lone samurai, meeting so many precious faces, coming to the
      world of Hololive, and becoming Kazama Iroha of holoX! Yay! Gozaru!
  - start: '03:07.496'
    end: '03:22.426'
    original: しまらないけど、でもですね、ここまでいろんな道を歩んできましたけど、風真いろはがホロライブに入る前の、異フストーリーということで、やらせていただきました！ありがとうございます！
    english: It might not be very tight, but you know, having walked so many paths
      up to now, we did this as an 'if' story of before Kazama Iroha joined Hololive!
      Thank you very much!
  - start: '03:23.236'
    end: '03:36.196'
    original: そして、嬉しいことに、今Xのトレンドで、この風真いろはに生え、これ1、2になってるみたいです！本当にかざありがとうございます！大変気をつけて！
    english: 'And happily, it looks like Kazama Iroha is trending #1 and #2 on X right
      now! Thank you all so much! Truly appreciated!'
  - start: '03:39.116'
    end: '03:54.116'
    original: はい、ということでですね、色々あるんですけど、今回はその物語に沿って、今回ステージも作っていただきました！かっこいい！演劇っぽいこのステージになっております。
    english: Right, so, there's various things, but this time, following that story,
      they even made this stage for us! So cool! It's become a theatrical-style stage.
  - start: '03:54.116'
    end: '04:03.116'
    original: また詳しい話はですね、まあ別日であふたーとーくさせていただければなと、思います。
    english: I think we can talk about the details more on another day in an after-talk
      stream.
  - start: '04:03.116'
    end: '04:10.116'
    original: そしてそして、ここまでですね、まあちょっと不慣れなんですけど、ホロックスに対しての手紙と一緒に歌って踊るやらせていただきました。
    english: And also, up to this point, though I'm a bit unaccustomed to it, I read
      a letter to holoX and got to sing and dance together.
  - start: '04:10.116'
    end: '04:20.116'
    original: なんとこちらのホロックスとのコラボ、後ろでMVが流れていましたね！そう、そういうことなんです！現在こちらの曲たち4曲ですね、鋭意制作中です！でき次第投稿するので、みなのの楽しみにしていてください！
    english: And amazingly, for this collaboration with holoX, an MV was playing in
      the background! Yes, exactly that! Right now, these four songs are currently
      in eager production! We'll post them as soon as they're done, so please look
      forward to it, everyone!
  - start: '04:20.116'
    end: '04:33.116'
    original: はあ、はあ、ちょっとね、お水きゅっきゅして、まだまだダンスするから、ちょっとあとチャキ丸と羽織を置いてくるわ。暑すぎるでござる！暑っ！本当になつ！暑いて。
    english: Phew, phew, just going to hydrate a bit, since we'll be dancing more.
      I'm going to go set down Chakimaru and my haori. It's way too hot de gozaru!
      So hot! Really hot! So hot.
