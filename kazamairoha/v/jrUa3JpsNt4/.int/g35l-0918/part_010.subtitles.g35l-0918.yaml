    **Kazama Iroha Merchandise and Music Announcement**

    Okay, so here's the deal: I'm meticulously breaking down this audio, analyzing every syllable. First, I want to transcribe and translate this speech about Iroha's 2nd-anniversary merch and the announcement of her 2nd original song. I'm focusing on the details – the exact wording, the timing, everything has to be right.

    I hear that you can acquire this merchandise to become a Kazama squad member, it's an invitation, so buy one and carry it around with you! Now, next!

    Yes, random tin badges! That's right, we had these made this time. One random out of four types will be delivered! The regular outfit, New Year's outfit, um, new outfit, and Pokobet's regular clothes, four types in total. To be honest, it's the first time the New Year's outfit has been made into merchandise! So you can aim to collect them all, or get excited about what will arrive when you buy them, so please check them out! The illustrations were drawn by Mochibiko-sensei! Thank you very much! And next!

    Yes, last is the shoulder bag! You there asking, "Why a shoulder bag?" Well, we had opinions saying it'd be nice to have apparel like this, and amazingly this time, it has a zipper here, and the front side is made of vinyl, meaning that it's a shoulder bag that lets you make an ita-bag! You can make an ita-bag! For those of you who think, "I'd love to try making an ita-bag, but not yet...", please buy this shoulder bag and put your badges and certificates in it to create your own Kazama Iroha ita-bag! And next!

    Yes, um, here is information about the commemorative voice pack. Entitled "The World I Want to See with You," it's a voice pack themed around this live concert. I won't say too much—you'll only understand if you listen to it! I worked hard on this, so please check it out! Next!

    Um, and the full set is right here! It looks like this—isn't it gorgeous? It is gorgeous! And thinking people might ask "Is there one this time too?", we have a limited-quantity hand-signed version! Yes, there are two versions: the limited-quantity full set which comes with a stamped message and limited voice, and the regular version. It starts at 21:00 shortly, so please watch the stream and grab the limited edition! I'm sorry, please do!

    I have an announcement to make! Starting around 21:10 tonight, um, it might shift a little bit by about 5 minutes, but I will be premiering the music video for my first original song, "Iroha Step!"! Here it is for real! I'm sorry I kept you waiting! I'm so sorry, everyone! I made you wait. Due to various circumstances it got a bit late, but I'm so glad I could release it on this 2nd-anniversary timing. Thank you truly from the bottom of my heart! It's scheduled for premiere at 21:10, so please listen to it a lot!

    And now, for the final announcement. It's a bit unusual to announce it right in this flow, but Kazama Iroha's second original song... has been completed! Gazing at the wind, so graceful and fair, How cool! What a dashing look! Compared to Iroha Step, in a good sense, it's an original song that makes you go, "Who on earth are you?", capturing Kazama's inner conflicts and her desire to grow stronger into the lyrics. This time, the music and arrangement were done by Yunosuke-san! Thank you so much! This song will be released at 24:00 tonight, and I'll be premiering it in full during the next part, so please check it out along with the dance! Thank you! Let's swallow again! So with that, I have just introduced "Gazing at the Wind, So Graceful and Fair," and I will be premiering it with a dance! Please listen.


