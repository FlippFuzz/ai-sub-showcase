    Now, the instructions!  I'm reading the instructions very carefully. The first important part is the rule for `detected_musical_performances`. This field lists all vocal musical performances or singing. Okay, if there is *no* singing or vocal music in the *segment* (that means the full 5 minutes), I leave it empty. But what does background BGM with vocals mean?  Specifically, the instructions give the following example: "(e.g. pure gaming, talk, or background BGM only)" and the instruction: "list all vocal musical performances or singing detected in this segment"

