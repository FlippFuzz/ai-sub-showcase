global_summary:
  overall_summary: This YouTube offline collaboration stream features Hololive's Kazama
    Iroha and AZKi hosting the popular 'Holodoufuuken Cookie Battle' (Hololive Prefectural
    Cookie Quiz Battle), with participants Achichi Mera and Suzunagi Tsuzuri from
    the unit Asobi Mawaritai! competing against each other. The contestants must correctly
    answer general geography questions and identify Japanese prefectures from deformed
    handmade cookie silhouettes baked by Iroha in order to win and eat the cookies.
    Throughout the intense and humorous battle, both participants showcase their geographical
    knowledge (and occasional humorous blunders) while being treated to homemade karaage
    by the hosts.
