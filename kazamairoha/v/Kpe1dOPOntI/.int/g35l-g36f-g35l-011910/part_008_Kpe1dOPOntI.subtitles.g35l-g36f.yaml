  overall_summary: This is an offline collaboration stream hosted by Kazama Iroha
    and AZKi featuring Hololive newcomers Atachi Mela and Suzunami Tsuzuri from the
    unit 'Asobi Mawari-tai'. The participants compete in '#Holo Prefecture Cookie
    Battle', where they answer general knowledge prefecture questions and identify
    prefectures from handmade cookie silhouettes in order to win and eat delicious
    cookies. Throughout the playful rivalry, comedic mishaps and wholesome food presentations
    (Azuiro Shokudo's handmade fried chicken and cookies) highlight the cheerful and
    warm atmosphere.
