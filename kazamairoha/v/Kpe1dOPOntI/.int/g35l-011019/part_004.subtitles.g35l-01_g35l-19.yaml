  overall_summary: In this off-collab stream hosted by Hololive's Kazama Iroha, members
    of the unit 'Asobi Mawari-tai!'—Atechi Mera and Suzuna Tsuzuri—compete in the
    '#Hololive Prefecture Cookie Battle'. The contestants test their knowledge of
    Japanese prefectures through both general trivia questions and silhouette shape-matching
    challenges using custom handmade prefecture-shaped cookies. Amidst amusing comedic
    mishaps, friendly banter, and delicious snack time rewards, Atechi Mera and Suzuna
    Tsuzuri battle it out for cookie supremacy, concluding with a special hospitality
    treat prepared by host Kazama Iroha.
