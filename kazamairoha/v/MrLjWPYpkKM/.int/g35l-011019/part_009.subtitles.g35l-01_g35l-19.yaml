    original: こちら次のなりたい自分、ヒーローということで、ヒーローテーマでやらせていただきました！ピースサインをかなた先輩と、そして、のらず…あ、トナズ…ブレイザーですね、
    english: for our next ideal self, "Hero", we did a hero-themed segment! We performed
      "Peace Sign" with Kanata-senpai, and Norazu... Ah, Tonazu... Blazer, right?
  - start: '03:46.406'
    end: '03:51.106'
    original: かなた先輩とあずきっちと3人で、やらせていただきました！
    english: with Kanata-senpai and Azukitch, the three of us did it!
  - start: '03:51.326'
    end: '04:05.156'
    original: いかがだったでしょうか？めちゃくちゃ格好良かった、格好良かったヒーロー！要望だよ、風真いろはかっこいいんだよってこと、みんなに知ってもらえて嬉しいです！ありがとうございます！
    english: How was it? Super cool, a really cool hero! I'm so glad everyone got
      to know how cool Kazama Iroha is! Thank you so much!
  - start: '04:05.906'
    end: '04:25.866'
    original: はい、実はですね、あの、今回みんなとの気付きかと思うんですけども、3Dの、あの、一番最初、えっと、1周年の時ぶりにですね、あの、お呼びした、あの、あずきっちと、フォックス以外にお呼びしたあずきっちと、あとかなた先輩に今回はそれぞれまた1曲ずつをお願いして、で、最後は3人でやりたいなっていうことでお願いさせていただきました。
    english: Yes, actually, as you might have noticed this time, for the very first
      time since our 1st anniversary 3D stream, I invited Azukitch—well, aside from
      Fox—and Kanata-senpai, and I asked each of them for one more song, and finally
      asked if we could do one together as three.
  - start: '04:25.866'
    end: '04:31.906'
    original: 本当にありがとうございました、先輩方本当にありがとうございました！めちゃくちゃ楽しかったです！
    english: Thank you so much, seniors, thank you truly! It was super fun!
  - start: '04:32.486'
    end: '04:46.046'
    original: はい！やっぱりですね、なりたい自分、今回そしてヒーローで、あのコラボパートから始まったんですけども、やっぱり道を歩いていこうということで、憧れるヒーロー、やはり勇者が一番合いますね！めっっちゃ難しかったんですけど、
    english: Yes! As expected, for "ideal self", we started the collab part with "Hero",
      and since we walk our paths, the hero we admire most is definitely the hero!
      It was super difficult, but...
  - start: '04:46.046'
    end: '05:00.449'
    original: 死ぬほど練習して、あの歌えるようになったり、行き継ぎとかね、めっちゃ大変だったんですけど、細かくね、そうやってボイストレーンの先生に教えていただいたりとかして歌えるようになって...
    english: I practiced to death and became able to sing it! Breath control and all
      that was insanely tough, but getting detailed guidance from my vocal trainer
      allowed me to sing...
