global_summary:
  overall_summary: 'This video is the 3D Birthday Live 2024 of Kazama Iroha, a VTuber
    from Hololive Production''s secret society holoX, titled ''#風真いろは生誕ライブ2024 可能性大❣いろんな『なりたい自分』''.
    The concert explores various ''ideal selves'' through distinct thematic parts:
    Magical Girl, Princess, and Hero. Joined by guest performers including AZKi, Amane
    Kanata, Tokoyami Towa, Houshou Marine, Sakura Miko, and Momosuzu Nene, Kazama
    Iroha delivers energetic vocal and dance performances, showcases her birthday
    merchandise line, and premieres her 4th original song ''Dreamy Sky'', concluding
    with a heartfelt closing message.'
