    Okay, here's the deal. I'm tasked with polishing draft subtitles for a Hololive 3D live stream segment, specifically for the song "白い雪のプリンセスは." My goal is precision and fidelity. I need to uphold the FROZEN TIMESTAMPS mandate – the timings are absolutely untouchable. I'm focused on phonetic accuracy, using the official lyrics as the gold standard, but I have to carefully consider the "live spoken callouts" mandate. Meaning I need to be careful of ad-libbed lyrics or changes the singer makes.

