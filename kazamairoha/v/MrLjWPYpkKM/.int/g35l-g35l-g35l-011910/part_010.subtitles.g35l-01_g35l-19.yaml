    original: はい、今年も出ます！風真いろは誕生日記念グッズ2024販売決定しまーす！イェーイ！
    english: Yes, they're coming out this year too! The Kazama Iroha Birthday Commemoration
      Goods 2024 sales have been decided! Yay!
  - start: '00:49.539'
    end: '00:57.079'
    original: ああ、めちゃくちゃ可愛いラスですね。今回はまじかるござるなんとグッズになりますので、みなさん最後までラインナップ見てってってくださいね。
    english: Ah, they're super cute! Since this time they're magical Gozaru goods,
      everyone, please check out the lineup all the way to the end.
  - start: '00:59.439'
    end: '01:11.399'
    original: はい、まじかる☆ござるTシャツ！なんとみんな大好きござるさんを胸元にあしらった素敵なTシャツでございます、こちら、あの、書かせていただきました。
    english: Yes, the Magical Gozaru T-shirt! It's a wonderful T-shirt featuring everyone's
      favorite Gozaru right on the chest, which I got to draw.
  - start: '01:11.399'
    end: '01:27.799'
    original: そして背中には、えっと、コンセプトのイラストになっている、こちらまじかる☆ござるのイラストを存分に背中へにお願いいたしました。ありがとうございます！本当にめちゃくちゃ可愛い！ありがとうございます！ぜひみなさんに来てもらえたら嬉しいなと思っております。
    english: And on the back, we proudly featured the magical Gozaru concept illustration
      across the whole back. Thank you so much! It's super cute! Thank you! I hope
      everyone will come and wear it.
  - start: '01:27.799'
    end: '01:41.659'
    original: そして、あの、今後ね、あの風真いろはの生誕祭とかやる時のスタッフさんはね、みんなこれ着用が義務付けられてますので、見る側の皆さんもこれ着用義務なんでよろしくお願いします！全員来てくださいね！よろしくお願いします！
    english: And also, for staff members working at Kazama Iroha's upcoming birthday
      festivals and events, wearing this is mandatory, so viewers, wearing this is
      also mandatory, please! Everyone come! Thank you!
  - start: '01:41.799'
    end: '01:43.919'
    original: はい、天井をいただきました。じゃあそれでは次こちら！
    english: Right, approval received. Well then, next is this!
  - start: '01:44.379'
    end: '01:56.919'
    original: はい、まじかる☆ござるフォントタブ！テストで話したときにみんな知らなかったって言われるのがすごくて、へえ、意外って思ったんですけど、はい、こちらフォントタブでございます。
    english: Yes, the Magical Gozaru phone tab! When I talked about it on stream,
      so many people said they didn't know what it was, which surprised me, but yes,
      this is the phone tab.
  - start: '01:56.919'
    end: '02:15.539'
    original: クリアケースに挟んで、あの、充電ケーブル挿すところから出して、で、ストラップをつけて首から下げる、みなさんの、え、スマホをお守りします！安全第一のフォントタブとなっております！ぜひね、みなさんのイベントとかね、スマホパッて出せたほうが便利だと思うので、ぜひね使ってもらえたら嬉しいです！
    english: Sandwich it in a clear case, pull it out from the charging cable slot,
      attach the strap and hang it around your neck to protect your smartphone! It's
      a safety-first phone tab! I think it'll be convenient to quickly pull out your
      phone at events, so I'd be happy if you use it!
  - start: '02:16.039'
