    original: いやあ、言ってたねみんな。ぽこべぇの、ね、なんかいろいろなったファンアートとか見ていて思いついていたんですけど、これはぽこべぇがいろはになっているのか、いろはがぽこべぇになっているのか、正直よく分かりません。
