      see more of my singing and dancing, I'd be so happy if you joined membership.
      Thank you!
  - start: '00:50.000'
    end: '01:07.500'
    original: そして、などの重要な告知がもう一つあるんですけど風は合致でいいような、そしてマジカルござる来るまでに1/3、2/3と刻んでまいりました。それでは3/3を告知させていただきます。それがこちら、どどん！
