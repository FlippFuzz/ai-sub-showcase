    original: この後22時15分からメンバーシップ限定でアンコールライブを開催いたします！今までみんなの前でやったことなかったぼっちなんちゃらとかぼっちなんちゃらとかぼっちなんちゃらをなんと今回ですね、あの音楽ライブでやらせていただきますので、ぜひまだまだござるの歌やダンスが聴きたい見たいぞって方はメンバーシップ入ってもらえると嬉しいです！よろしくお願いします！
