      不器用で つよがりで 泣き虫で 頼れなくて
      でも それも これも 全部受け止めてゆくんだ
      何千回 私が生まれ変わったとしても
      きっと もう二度と 私にはなれやしないから
      本当の 私が偽りのない この色が
      誰かの心に届く日を信じて

      何千回 何万回 冷たい雨が降っても
