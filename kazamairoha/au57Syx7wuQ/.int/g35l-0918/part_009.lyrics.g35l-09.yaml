      私の色で
    reference_lyrics_en: |-
      Wearing the colors given to me by somebody else, I’ve pretended to be someone else.
      Putting my hands to my chest as I sway and start to sing, “This here is me,” I try to say.
      When I am lost too far away from what I had longed for, and every day I met with the same discontent,
      Closing my eyes as I hide from the pain, a droplet forms, and slowly my tears start to fall.

      Even if I was reborn and given a new life a thousand times,
      I know that I wouldn’t be able to be the “me” that I am today.
      Discarding all of the lies, and wearing the colours that all come from my heart,
      The voice singing my song and the monochrome world that started to blur, I’ll dye it my color.

      Trying to find the colors someone wanted me to have, I’ve been walking, a solo search for the unknown.
      I realised I had no path, not knowing my own goals, and that I had become completely lost and alone.
      Forcing a smile, for all but my own sake, lying to myself and smudging all of my hues.
      From the blue sky, shining clear as the day, a droplet forms, and slowly the tears start to fall.

      Even if light from above showered down upon me a thousand times,
      I know that with fake colors dyeing my smile I won't be able to shine.
      Discarding all of the lies, and holding the colors that all come from my heart tightly,
      I hug them and I bring them with me as I tread after the rain to look for the rainbow.

      I’m clumsy and I pretend to be strong, I’m sensitive and I’m unreliable,
      Yet I embrace every flaw that I have so that I can dye them freely.
      Even if I was reborn and given a new life a thousand times,
      I know that I wouldn’t be able to be the “me” that I am today.
      Discarding all of the lies, and wearing the colours that all come from my heart,
      I believe that someday they’ll reach out to someone who’s been greyed out too.

      A thousand times, a million times, even when cold raindrops start to fall,
      The voice singing my song and the monochrome world that started to blur,
      Vividly, I’ll dye it all my colors, all with my true colors.
