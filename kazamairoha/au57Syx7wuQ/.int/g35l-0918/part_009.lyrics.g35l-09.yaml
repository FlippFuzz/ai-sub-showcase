    reference_lyrics_og: |-
      誰かに与えられた色をまとって 違う誰かを演じてきた
      胸に手を当てて歌う 「これが私だ」 って言い聞かせるように
      憧れにはほど遠く 落ち込むばかりの毎日で
      閉ざされた瞳から 雫がこぼれ落ちてゆく

      何千回 私が生まれ変わったとしても
      きっと もう二度と 私にはなれやしないから
      本当の 私を偽りのない この色を
      歌声にのせて モノクロの世界を彩るよ

      誰かにのぞまれた色を探し 見つけるために歩いてきた
      気づけば現在地もゴールも 見失って迷子になっていた
      無理やり笑顔を作って 自分をだますことばかり
      青く澄んだ空から 雫がこぼれ落ちてきた

      何千回 私が光を浴びたとしても
      嘘を重ねた色じゃ輝けないから
      本当の 私を偽りのない この色を
