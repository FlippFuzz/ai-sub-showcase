    english: I remember so vividly for no apparent reason.
  - start: '00:55.958'
    end: '00:57.758'
    original: 意味もないのに なぜか
    english: Even though it means nothing, somehow...
  - start: '00:58.118'
    end: '01:02.358'
    original: 不甲斐なくて泣いた日の夜に ただ強くなりたいと願っていた
    english: On nights when I cried out of sheer uselessness, I just wished to be
      strong.
  - start: '01:03.018'
    end: '01:07.418'
    original: そのために必要な勇気を 探し求めていた
    english: I was searching and longing for the courage needed for that.
  - start: '01:08.018'
    end: '01:12.758'
