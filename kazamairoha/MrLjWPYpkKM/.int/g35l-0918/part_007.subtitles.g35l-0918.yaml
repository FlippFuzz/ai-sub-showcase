    english: Even if a cruel fate is set, and it appears before me one day,
  - start: '01:12.758'
    end: '01:17.358'
    original: ただ一瞬 この一瞬 息ができるなら どうでもいいと思えた その心を
    english: If I can breathe for just a moment, this very moment, my heart felt that
      anything was fine.
  - start: '01:17.818'
    end: '01:21.558'
    original: もう一度 遠くへ行け 遠くへ行けと 僕の中で誰かが歌う
    english: Once more, someone inside me sings to go further away.
  - start: '01:21.858'
