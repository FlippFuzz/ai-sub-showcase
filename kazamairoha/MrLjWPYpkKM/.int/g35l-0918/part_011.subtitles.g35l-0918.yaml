- subtitles:
  - start: '00:00.080'
    end: '00:02.040'
    original: シチュエーションをとった気がする。
    english: I feel like I've got the situation down.
  - start: '00:02.160'
    end: '00:05.100'
    original: あ、今日緊張っていう言葉を捨ててきたんでね、
    english: Ah, I left the word "nervous" behind today, so
  - start: '00:05.100'
    end: '00:10.000'
    original: あのこれ以上は行けないということでぜひ興味のある方はフルセットを購入して聞いてみてください。
    english: well, since we can't go any further, please purchase the full set if
      you're interested and give it a listen.
  - start: '00:11.240'
    end: '00:15.940'
    original: はい、そして、えっと変わらずこのあとですね、ライブが長引く可能性ありますが、
    english: Yes, and as always, after this, there's a chance the live might run long,
      but
  - start: '00:15.940'
    end: '00:22.000'
    original: カートオープンは22時まで。みんなちょっとライブ見ながら、あの戦ってもらえると嬉しいです。すみません、よろしくお願いします。
    english: the cart will be open until 22:00. I'd be glad if everyone could watch
      the live while managing. Sorry, and thank you!
  - start: '00:22.420'
    end: '00:25.040'
    original: そして、次の告知です。
    english: And here is the next announcement.
  - start: '00:25.860'
    end: '00:32.480'
    original: この後22時15分からメンバーシップ限定でアンコールライブを開催いたします。
    english: Starting at 22:15 after this, we will hold an encore live exclusive to
      members.
  - start: '00:32.740'
    end: '00:43.080'
    original: 今までみんなの前でやったことなかったぼっちなんちゃらとかぼっちなんちゃらとかぼっちなんちゃらをなんと今回ですね、あの音楽ライブです、やらせていただきますので、
    english: Songs like "Bocchi" that we've never performed in front of everyone before,
      we will actually perform as a music live this time,
  - start: '00:43.080'
    end: '00:51.240'
    original: ぜひまだまだござるの歌やダンスが聴きたい見たいぞって方はねメンバーシップ入ってみてもらえると嬉しいです。よろしくお願いします！
    english: so if you still want to hear and see Gosaru's singing and dancing, I'd
      be happy if you joined membership. Thank you!
  - start: '00:51.980'
    end: '00:57.940'
    original: そして、みんなのと、大切な告知があともう1つあるんですけど、
    english: And, there's one more important announcement for everyone, but...
  - start: '01:05.080'
    end: '01:05.120'
    original: 風は凪いでようだな。そして和が来る、ござる来るまでに、1/3、2/3と刻んでまいりました。
    english: The wind has calmed down. And until harmony/Gosaru arrives, we've ticked
      off 1/3 and 2/3.
  - start: '01:05.520'
    end: '01:10.000'
    original: それでは、3/3を告知させていただきます。それがこちら、ドドン！
    english: Now, let's announce 3/3. That is this, ta-da!
  - start: '01:11.800'
    end: '01:21.840'
    original: この後24時からリリース、ええと風真いろは4曲目のオリジナル曲「Dreamy Sky」をリリースさせていただくことになりました！やったー！
    english: Starting at 24:00 tonight, Kazama Iroha's 4th original song "Dreamy Sky"
      will be released! Yay!
  - start: '01:22.060'
    end: '01:34.000'
    original: そして22時5分からライブが終わったあと、5分10分かちょっとあのライブの終了時間にもよるんですけども、プレミア公開がええと、お待ち受けておりますのでぜひみんなあのね、このあとプレミア公開見に行ってください！
    english: And after the live ends at 22:05, depending slightly on the end time,
      around 5 to 10 minutes later, a premiere screening awaits us, so please everyone
      go check out the premiere!
  - start: '01:34.200'
    end: '01:41.240'
    original: 素敵な曲はpiccoさんが作ってくださいました。キラキラ、ふわふわな可愛い曲です。よろしくお願いします！
    english: picco-san kindly created this wonderful song. It's a sparkling, fluffy,
      cute song. Please check it out!
  - start: '01:41.800'
    end: '01:54.000'
    original: そしてこちらなんですけども、この後のパートで、ええダンスをですね、初披露させていただきまして、歌も初披露させていただきまして、えっと、何て言ったらいいんだろな、N分の後ろでちょっとね流しちゃったりなんかするんですけども、
    english: And as for this part, in the following part, we will perform the dance
      and vocals for the very first time... um, how should I put it, we might play
      it in the background or something, but-
  - start: '01:54.000'
    end: '02:06.000'
    original: あのダンスをですね、今日実はあの近くにいつもダンス、お世話になってる先生が来てくださってるんですけど、なんと結構共作で、共同制作でですね、一生懸命作らせていただいた振り付けなので、ぜひいろんな方に踊っていただけると嬉しいなと思っておりますので、
    english: actually, the dance teacher who always takes care of us came nearby today,
      and we worked really hard on this choreography together as a co-production,
      so I'd be so happy if lots of people could dance to it.
  - start: '02:06.000'
    end: '02:16.880'
    original: よろしくお願いします！ダンスもよかったら注目してみてください。最後まで応援よろしくお願いします！
    english: Please look forward to it! If you'd like, please pay attention to the
      dance as well. Thank you for your support until the end!
  - start: '02:17.380'
    end: '02:21.560'
    original: その前に、お水を飲んできてよろしいでしょうか？お水飲ませてください、本当に！お水、お水！
    english: Before that, may I go drink some water? Please let me drink some water,
      really! Water, water!
  - start: '02:26.500'
    end: '02:29.000'
    original: お水飲まないと死んじゃうよ。
    english: If I don't drink water, I'll die.
  - start: '02:35.000'
    end: '02:41.500'
    original: ああ、それにしてもお水が、お水が、お水が、お水が、お水が。ちょっと待って、みんなちょっと1杯飲まないと死ぬかもしれない。
    english: Ah, still, water, water, water, water, water. Wait a minute, everyone,
      if I don't drink a glass I might die.
  - start: '02:49.000'
    end: '02:56.000'
    original: はい、お待たせしました。すいません、皆さんあのちょっと一応ね、スタッフさんに「もう一度いっとけ」って言われたんで、ほぼ確定で22時ちょっと押しちゃうそうなので、申し訳ないです本当に。
    english: Yes, sorry to keep you waiting. The staff told me "say it one more time",
      so it's almost certain it will push past 22:00 a bit, so I'm really sorry.
  - start: '02:56.000'
    end: '03:04.200'
    original: あのカート、皆さんちょっと準備万端にしといてください。よろしくお願いします。グッズのカート準備万端にしといてください。よろしくお願いします。
    english: Everyone, please make sure your cart is fully prepared. Thank you. Please
      have your merch cart fully ready. Thank you.
  - start: '03:04.700'
    end: '03:19.400'
    original: はい、それではお待たせいたしました！ええ、ここで新しいオリジナル曲「Dreamy Sky」を初披露させていただきます。それでは聞いてください。風真いろは4曲目オリジナルソング、「Dreamy
      Sky」！
    english: Yes, thank you for waiting! Um, here we will premiere our new original
      song "Dreamy Sky". Please listen. Kazama Iroha's 4th original song, "Dreamy
      Sky"!
