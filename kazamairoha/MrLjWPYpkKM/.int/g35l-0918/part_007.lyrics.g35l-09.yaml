    reference_lyrics_en: |-
      It's strange how I remember
      The airplane that flew just above us
      So vividly, for no reason at all.
      On the night I cried out of sheer uselessness,
      I simply wished to become stronger,
      And searched for the courage required for that.
      Even if a cruel fate is predetermined,
      Even if it appears before me one day,
      If I can breathe for just a moment, just this moment,
      My heart felt that nothing else mattered.
      Someone inside me sings,
      "Go further away, go further away,"
      With an uncontrollable, passionate fervor.
      So that you, with your eyes always swollen from crying,
      Will never have to be sad again and can smile—
      This is a song to become a hero like that.
      Farewell, raise your peace sign,
      To the rolling story.
      I knew you weren't weak enough
      For me to say "I want to protect you."
      If anything, I was the weak one,
      And you were so precious to me.
      Since that day I shouted out loud,
      "I'm going to live on my own,"
      You can laugh at me as I change.
      Kick me, bite me, when I'm so afraid of being alone
      That I can't even breathe,
      And the inside of my buzzing head and stomach becomes a mess—
      To the point where all pretension and affectation vanish,
      Right now, I want to touch your heart.
      Someday, we will surely reach even the distant sun,
      Get our hands on the dawn, and laugh.
      Dyed in a blue-burning color,
      We should be able to run hand in hand
      Toward the hazy other side of the town,
      Stealing and drawing the future with you
      In a straightforward story.
      The rough days covered in scabs,
      The present worn down and frayed,
      Revive through your words,
      Vividly appearing before us.
      The soul sleeping as a chrysalis,
      That dream abandoned half-eaten—
      Retrieve them once more.
      Someone inside me sings,
      "Go further away, go further away,"
      Once more,
      With an uncontrollable, passionate fervor.
      So that you, with your eyes always swollen from crying,
      Will never have to be sad again and can smile—
      This is a song to become a hero like that.
      Farewell, raise your peace sign,
      To the rolling story.
