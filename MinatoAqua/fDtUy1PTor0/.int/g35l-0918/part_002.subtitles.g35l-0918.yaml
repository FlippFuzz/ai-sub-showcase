  - start: '00:17.920'
    end: '00:23.940'
    original: あんまり？あんまり緊張するタイプではないかなという風に思いますかね。
    english: Not really? I don't really get nervous, I suppose.
  - start: '00:24.460'
    end: '00:25.740'
    original: 本当ですか？
    english: Really?
  - start: '00:26.160'
    end: '00:33.280'
    original: はい。ただまあ、基本日々、いろいろ課題を抱えているので、
    english: Yes. But basically every day, I'm dealing with various challenges,
  - start: '00:33.720'
    end: '00:38.740'
    original: “これを今日やらなきゃ”って感じで朝早く起きちゃうことはありますね。
    english: so I sometimes wake up early thinking, "I have to do this today."
  - start: '00:39.462'
    end: '00:43.762'
    original: あ、じゃあちょっと、なんかホロライブについて聞こうと思います。
    english: Ah, then let's talk a bit about Hololive.
  - start: '00:44.202'
    end: '00:51.342'
    original: はい。え、まずは、どうしてホロライブを作ろうと思ったんですか？
    english: Yes. First of all, why did you decide to create Hololive?
  - start: '00:51.922'
    end: '01:07.822'
    original: そうですね、なんというか、元々その初音ミクさんみたいな、あいうキャラクターで、海外の人も含めてその楽しませような、そういうコンテンツっていいなと思っていましたと。
    english: Well, how should I put it? Originally, I thought it would be great to
      have content like Hatsune Miku, featuring characters that could entertain people
      overseas as well.
  - start: '01:09.522'
    end: '01:21.802'
    original: でも、まあ初音ミクさんって初音ミクさん以外の人がいるわけではないので、たくさんの人が人気になれるわけではないなっていうふうに思っている中で、
    english: However, since Hatsune Miku is just Hatsune Miku and there aren't others,
      not everyone can become popular.
  - start: '01:22.422'
    end: '01:33.362'
    original: なんかVTuber的なシステムっていうのを自分たちで開発して、そういう、いろんな配信者さんだったりとか、そういうクリエーターの方が
    english: So, thinking about that, we developed a VTuber-like system ourselves
      so that various streamers and creators
  - start: '01:33.742'
    end: '01:44.022'
    original: 初音ミクさんのような、バーチャルタレントとして活動できるとすごく、あの、世界中のファンの方を喜ばせることができるかもしれないと思って、
    english: could act as virtual talents like Hatsune Miku, which might make fans
      all over the world happy.
  - start: '01:44.522'
    end: '01:50.142'
    original: あの、ホロライブのシステムを開発して、こういう、あのサービスを始めようと思いました。
    english: So we developed the Hololive system and decided to start this service.
  - start: '01:50.817'
    end: '01:57.657'
    original: ああ、え、じゃあその、まさかこんな大所帯になるとは思っていなかったって感じなんですかね、最初は。
    english: Ah, so you didn't expect it to become such a massive group at first,
      right?
  - start: '01:58.737'
    end: '02:11.757'
    original: 最初はそうですね、あの、こんなに大所帯になるとは、まあ、ある程度やっぱり海外の方に、あの、すごくたくさんの方のファンの方に届けていきたいと思っていたので、
    english: At first, well... we did want to reach a lot of fans overseas to some
      extent,
  - start: '02:12.157'
    end: '02:23.237'
    original: もちろんその、規模として大きいものを目指してましたけれど、あの、まあ予想よりも、あの、順調に成長しているのかなとは思います。
    english: so of course we aimed for something large in scale, but I think it has
      grown even smoother than expected.
  - start: '02:24.086'
    end: '02:32.466'
    original: おお、なんか、ちゃんと社長ですね？ちゃんとし、これ失礼なのかな？ちゃんと社長ですね！すごい！
    english: Oh! You're really acting like a CEO, aren't you? Is it rude to say that?
      You're properly a CEO! Amazing!
  - start: '02:34.201'
    end: '02:39.721'
    original: じゃあ続いて、ここまでホロライブのお話を聞かせていただいたんですけど、次は
    english: Now moving on, we've talked about Hololive so far, but next...
  - start: '02:40.061'
    end: '02:47.381'
    original: 私、湊あくあについて聞いていこうと思います。ちょっとここが一番大事です！よろしくお願いします！
    english: I'd like to ask about me, Minato Aqua. This part is the most important!
      Please!
  - start: '02:48.341'
    end: '02:50.041'
    original: それでは行きます。
    english: Let's go.
  - start: '02:50.181'
    end: '02:58.521'
    original: え、私、湊あくあは、ホロライブプロダクションに貢献できていましたか？ズバリ！教えてください！
    english: Um, did I, Minato Aqua, contribute to Hololive Production? Tell me directly!
  - start: '02:59.789'
    end: '03:02.869'
    original: 貢献できていたと思いますね。
    english: I think you definitely contributed.
  - start: '03:02.869'
    end: '03:21.089'
    original: まあ、あの、ホロライブプロダクションというよりもやっぱり湊あくあさんっていうタレントさんがやっぱり、まあ、TikTokとかでも流行るような楽曲みたいなものを提供、提供というか、あの、まあ、なんていうかそういった活動を実現することができて、
    english: Well, rather than Hololive Production as a whole, Minato Aqua as a talent
      provided songs that would trend on TikTok and similar platforms, making such
      activities possible,
  - start: '03:21.849'
    end: '03:29.629'
    original: まあ、いろんなその、若い人にとっての、なんか憧れの存在とかになれたんじゃないかなっていうふうには思っています。
    english: and I think she became an existence of admiration for many young people.
  - start: '03:30.342'
    end: '03:37.382'
    original: そう思いますか？え、ちょっとどんな印象を持たれているんですか？湊あくあに対して。
    english: You think so? What kind of impression do you have of Minato Aqua?
  - start: '03:38.162'
    end: '03:43.702'
    original: まあ、基本的にはすごく芯の強い方だなというふうには思っています。
    english: Well, basically, I think she has a very strong core.
  - start: '03:44.242'
    end: '03:50.000'
    original: はい。ただ、ま活動としてはやっぱり、
    english: Yes. But as for her activities,
  - start: '03:50.000'
    end: '04:05.742'
    original: なんだろうね、そのアイドル的な側面もあると思うんですけど、やっぱり配信の、まあ、なんだろう、ゲームがうまいっていうところがやっぱり、あの、もっとも、はい、こう、なんていうか、ギャップ的、ギャップっていうとあれですけどね。はい。になる部分なのかなと思いました。
    english: while she has an idol-like aspect, the fact that she's really good at
      streaming and games is probably what creates the biggest gap.
  - start: '04:05.903'
    end: '04:12.723'
    original: わかりました。はい。それでは最後に、ちょっとここまでの質問ばかりだったんだけれども
    english: I see. Yes. Now finally, up until now it's been mostly my questions,
  - start: '04:12.983'
    end: '04:20.083'
    original: 社長から、え、私への、なんか伝えたいことなどあったりしますでしょうか？
    english: but is there anything you, the CEO, would like to convey to me?
  - start: '04:20.720'
    end: '04:35.320'
    original: そうですね、やっぱり、6年という長い期間、あの、活動していただいて本当にありがとうございましたというところと、本当にお疲れ様でしたという。
    english: Well, first of all, thank you very much for being active for such a long
      period of 6 years, and truly, thank you for your hard work.
  - start: '04:35.320'
    end: '04:45.320'
    original: あ、ありがとうございます！っていう形ですね。はい。僕としてもまだまだ心残りの部分もあるんだけれど、
    english: Ah, thank you! That's how it is. Yes. As for me, I still have some lingering
      regrets, but
  - start: '04:45.540'
    end: '04:49.780'
    original: 本当にこの6年ご一緒できたことがすごく良かったと思っております。
    english: I am truly glad we were able to spend these 6 years together.
  - start: '04:49.900'
    end: '04:54.680'
    original: ありがとうございます本当にホロライブに入れていただいてありがとうございました！
    english: Thank you so much! Thank you for letting me join Hololive!
  - start: '04:50.301'
