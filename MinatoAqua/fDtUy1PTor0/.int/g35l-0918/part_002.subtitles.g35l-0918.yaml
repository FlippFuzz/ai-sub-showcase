  - start: '00:02.356'
    end: '00:02.536'
    original: はい。
    english: Yes.
  - start: '00:03.536'
    end: '00:06.676'
    original: え、まず、えっと、簡単なものから
    english: Um, first of all, starting with something simple...
  - start: '00:07.416'
    end: '00:16.156'
    original: え、責任感で、社長としての責任感で 胃が痛くなったりとか、うわぁってなったりすることはありますか?
    english: Um, out of a sense of responsibility as CEO, have you ever had your stomach
