    original: えー、この曲は、私のだいすきな40mPさんに書き下ろしをしていただきました。
    english: This song was written and composed especially for me by 40mP, whom I
      love so much.
  - start: '01:06.075'
    end: '01:38.255'
    original: すごいね、やっぱ3周年ということで、こう今までの景色とか、今見えている場所とか、こう、このライブがあって、そしてみんながいてくれて、私がいて、なんか、そういう、なんだろう、すごい、最初はすっごく寂しかったけど、今はこんなにたくさんの人がいて、こう、すごい、多くの人に祝っていただける3周年になったなって思ってて、そんなね、えー、4年目を迎えることができたのもみんなのおかげだと思っております。
    english: You know, with it being the 3rd anniversary, I thought about the scenery
      until now, the places I see now, this live concert, everyone being here, and
      me being here. At first it was so lonely, but now with so many people here celebrating
      my 3rd anniversary and reaching the 4th year, I feel like it's all thanks to
      everyone.
  - start: '01:38.795'
    end: '01:50.855'
    original: これからもね、みんなとずっと一緒にいたいっていう、そんな私の気持ちが詰まっている1曲になっているので、よかったら最後まで聴いてください。
    english: This song is packed with my feelings of wanting to stay together with
      everyone forever, so I hope you'll listen to it until the end.
  - start: '01:51.375'
    end: '02:08.535'
    original: それでは、えー、このあとね、えーと、プレミアム公開で、えー動画が投稿されると思うので、ライブの後もぜひチェックしてみてください！えー、素敵なね、すっごく手のこんだPVも、えー、あるので、よかったら最後まで聴いてくれると嬉しいです。
    english: Well then, a video will be posted shortly as a premiere after this, so
