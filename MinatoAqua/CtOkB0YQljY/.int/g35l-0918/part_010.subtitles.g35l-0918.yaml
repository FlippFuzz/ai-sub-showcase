    english: For the very last one, I want everyone to listen to a brand new song.
  - start: '00:54.215'
    end: '00:58.215'
    original: えー、3周年の、えー、オリジナルの曲の新曲です。
    english: It's a new original song for my 3rd anniversary.
  - start: '01:00.855'
