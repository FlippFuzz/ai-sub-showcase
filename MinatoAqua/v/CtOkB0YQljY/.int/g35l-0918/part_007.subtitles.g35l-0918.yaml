  thoughts: |+
    **Alright, let's get this done. I need to make some perfect subtitles for Aqua-chan's announcement video.**

    It starts with the goods announcement; a hand-signed postcard comes with the goods. I will write a handwritten signature!

    Then, it's the 3rd Anniversary announcement! This time, it's about the Minato Aqua 3rd Anniversary reproduction art.

    The original art was drawn by Tomose Shunsuke-sensei! I have worked with him previously, and he has created my 3rd anniversary live key visual; it's super gorgeous, so please buy it!

    We also have some Aqua Cat T-shirts—Dot T-shirts! There was an illustration of me riding a cat flying through space, right? That has become a dot T-shirt and is going to be released! It's super cute, seriously! Everyone check it out. You should wear them daily when you go out; you will get a lot of attention.

    Aqua Cat keyholders will also be released. I'd be happy if you bought about 100 keyholders and made an itaba bag! Then let's update it together like 'Nyan nyan nyan!'

    I'm shy, so I don't usually release voice packs, but everyone kept asking for it. For our 3rd anniversary, I'm finally releasing a voice pack! Seriously, it's so embarrassing, please don't listen to it!

    For those who pre-order the full set, a limited-quantity hand-signed postcard by Minato Aqua will be included!

    I've been saying in streams for a long time that I wanted to do this, but I was so busy I couldn't make it happen, so I'd love to take this opportunity! I'll be signing a lot of them, so please look forward to it!

    And there is another announcement! Announcement number two!

    Minato Aqua's Big Plushie has somehow made a comeback! Yay!

    The Minato Aqua Big Plushie that was released and became popular at my solo one-man live last summer will be re-released. People asked if there were no Aqua plushies, so to make sure even those who didn't know me yet last year could get one, we prepared this!

    This might be your last chance, so please don't miss out! Everyone, hug it a lot. Give the big plushie a big squeeze... hey, don't punch it or anything, please don't do that. Give it a gentle squeeze and cherish it.

    Alright, is that everything? We're good, right? Check the video description for full details, and I'll also post updates on Twitter later, so please check it out! Thank you!

    And with that, we're going to invite our guest right here! Yay!

    So, who could the guest be? This is actually the very first guest for my 3D stream, so I figured the very first guest should be this person. Now then, let's call my partner connected by the red string of fate.

    Neko-chan, welcome back!


