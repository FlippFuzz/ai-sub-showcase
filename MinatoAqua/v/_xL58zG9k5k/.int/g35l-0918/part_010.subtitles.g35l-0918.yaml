    First, I need to figure out what to subtitle. Initially, I thought it was just the song, but the instructions say "Subtitle 100% of the audible vocals," and "The vocal audio waveform is your absolute ground truth for spoken dialogue." I also noted, "NEVER output dialogue text if there is no vocal audio driving it." So, seems like I need to pay close attention to the presence of vocals, period.

