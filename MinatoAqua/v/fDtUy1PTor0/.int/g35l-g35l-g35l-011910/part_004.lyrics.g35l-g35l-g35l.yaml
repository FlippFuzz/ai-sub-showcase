    as a virtual idol. The broadcast blends emotional documentary segments—featuring
    a candid interview with Cover Corp CEO Motoaki Tanigo (Yagoo) and a heartfelt
    letter reading to her manager—with spectacular 3D concert performances alongside
    Hololive 2nd Generation and guest talents, culminating in her iconic original
    songs and a tearful farewell to her fans.
