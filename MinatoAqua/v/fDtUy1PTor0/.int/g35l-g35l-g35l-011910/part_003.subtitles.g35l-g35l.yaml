    end: '00:46.478'
    original: ちゃんといました。ちゃんと存在してました。良かったです、はい。
    english: He was really there. He actually existed. I'm so glad, yes.
  - start: '00:48.338'
    end: '00:52.918'
    original: では続いての質問です。今一番感謝を伝えたい人はいますか？
    english: Now for the next question. Is there someone you want to express your
      gratitude to the most right now?
  - start: '00:54.678'
    end: '00:59.818'
    original: いっぱいいますけど、一番はマネージャーさんです。
    english: There are a lot of people, but above all, it's my manager.
  - start: '01:00.278'
    end: '01:01.378'
    original: あ、マネージャーさん。
    english: Ah, your manager.
  - start: '01:04.298'
    end: '01:08.578'
    original: 手紙を書いてきたので読みます。ありがとうございました。
    english: I wrote a letter, so I'm going to read it. Thank you very much.
  - start: '01:10.458'
    end: '01:13.258'
    original: では、手紙よろしくお願いします。
    english: Now, please go ahead with the letter.
  - start: '01:16.038'
    end: '01:17.478'
    original: マネージャーさんへ。
    english: To my manager,
  - start: '01:18.598'
    end: '01:20.978'
    original: マネージャーさん、お元気ですか？
    english: Manager, how are you doing?
  - start: '01:21.878'
    end: '01:32.738'
    original: マネージャーさんのことは配信でもちょくちょく話が出てくるユニコーンのアイコンだった有能マネージャーさんです。
    english: You're the capable manager with the unicorn icon whom I often talk about
      on my streams.
  - start: '01:33.278'
    end: '01:39.378'
    original: 2020年頃から約4年間お世話になりました。
    english: Thank you for taking care of me for about 4 years since around 2020.
  - start: '01:40.438'
    end: '01:54.078'
    original: ホロライブでは担当マネージャーさんが変わることがよくある中で、ここまで変わることなくこれたこと、ものすごく奇跡だと思ってます。
    english: In Hololive, it's common for assigned managers to change, so I consider
      it an absolute miracle that we've been able to work together without any changes
      all this time.
  - start: '01:54.678'
    end: '02:06.918'
    original: 担当した当時の私は、まだめっちゃガキで尖っていてマネージャーさんに何度もご迷惑をおかけしたと思います。
    english: When you first became my manager, I was still such a brat with an attitude,
      and I'm sure I caused you trouble many times.
  - start: '02:07.498'
    end: '02:19.878'
    original: 今でも、私が配信ばかりして返事返すの遅かったり、時々通じない日本語を使ってしまったりしてご迷惑をおかけしました。
    english: Even now, I've caused you trouble by focusing only on streaming and being
      slow to reply, or sometimes using Japanese that doesn't make sense.
  - start: '02:20.358'
    end: '02:28.178'
    original: それでも、ここまで見捨てず担当して下さりありがとうございました。
    english: Even so, thank you so much for not abandoning me and continuing to manage
      me until the very end.
  - start: '02:29.818'
    end: '02:39.438'
    original: いつも現場に行くとジュースとお菓子を用意してくださったり、旅行のお土産をくれました。
    english: Whenever I went to the studio, you always prepared juice and snacks for
      me, and brought me souvenirs from your trips.
  - start: '02:39.818'
    end: '02:48.718'
    original: 外の仕事が苦手でいつもご飯を食べこなくても仕事が頑張れたのはマネージャーさんのおかげです。
    english: Because I'm bad at working outside and often couldn't even eat meals
      properly, being able to push through my work is all thanks to you, Manager.
  - start: '02:49.498'
    end: '03:01.818'
    original: 私が人間関係や社会との向き合い方で悩んでいた時も、たくさんアドバイスや元気づけて下さる言葉をくれました。
    english: Whenever I struggled with human relationships or how to face society,
      you always gave me plenty of advice and encouraging words.
  - start: '03:03.118'
    end: '03:19.418'
    original: 田舎から上京して何も分からなくて、親元を離れ頼る人もいなかった時も、第3の母として支えて下さりました。
    english: When I moved to Tokyo from the countryside not knowing anything, away
      from my parents with no one to rely on, you supported me like a third mother.
  - start: '03:19.898'
    end: '03:22.598'
    original: 第1の母はくみこ、
    english: My first mother is Kumiko,
  - start: '03:23.018'
    end: '03:26.378'
    original: 第2の母はマリン、
    english: My second mother is Marine,
  - start: '03:26.858'
    end: '03:29.778'
    original: 第3の母はマネージャーさんです。
    english: My third mother is my manager.
  - start: '03:30.378'
    end: '03:38.838'
    original: この4年間、たくさん愛情を込めて湊あくあをサポートして下さり本当にありがとうございました。
    english: Thank you so much for supporting Minato Aqua with so much love over these
      past 4 years.
  - start: '03:39.118'
    end: '03:44.258'
    original: 私の担当でいてくれて本当によかったです！
    english: I'm so, so glad you were my manager!
  - start: '03:44.258'
    end: '03:46.338'
    original: 湊あくあより
    english: From Minato Aqua
  - start: '03:49.196'
    end: '03:53.636'
    original: 素敵ななお手紙ありがとうございました。マネージャーさん感動してましたね。
    english: Thank you for that wonderful letter. The manager looked really moved.
  - start: '03:53.816'
    end: '03:59.336'
    original: 本当は感動してんのかな？あくあさん自身もなんかすごい、なんか涙涙な感じになってましたけど。
    english: Is he actually moved? You yourself, Aqua, were also getting all teary-eyed.
  - start: '03:59.536'
    end: '04:02.936'
    original: 私が泣くわこれ！やだ！泣いて
    english: I'm the one who's gonna cry over this! No way! Crying...
  - start: '04:05.476'
    end: '04:08.576'
    original: あくあさんにとって第3のお母さんです。
    english: To Aqua, she's her third mother.
  - start: '04:08.776'
    end: '04:18.036'
    original: 第2のマリンで引っ込んだけど涙、ちょっと第2のマリンでちょっとくすって笑っちゃったんですけども、いや本当に感謝してます。
    english: I held back the tears with the second mother Marine part, but then I
      chuckled a bit at the second mother Marine line, but really, I'm so grateful.
  - start: '04:21.876'
    end: '04:28.916'
    original: それでは、最後の質問です。あくあさんご自身において変わらないものは何ですか？
    english: Now for the final question. What is something about yourself, Aqua, that
      never changes?
  - start: '04:29.596'
    end: '04:30.856'
    original: 変わらないもの…
    english: Something that never changes...
  thoughts: []
