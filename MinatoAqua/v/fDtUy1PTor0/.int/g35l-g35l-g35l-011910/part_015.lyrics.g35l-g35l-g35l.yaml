- start: '03:04.888'
  end: '03:12.188'
  original: ホロライブ最高！
  english: Hololive is the best!
- start: '03:13.188'
  end: '03:17.488'
  original: 愛しちゃうもっと、ありがとう！
  english: I love you even more, thank you!
