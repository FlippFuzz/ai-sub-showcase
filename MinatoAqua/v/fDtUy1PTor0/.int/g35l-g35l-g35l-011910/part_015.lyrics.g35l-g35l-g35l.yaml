- start: '01:27.248'
  end: '01:33.728'
  original: キミがいるから歩いてこれた
  english: Because you were here, I could walk this far.
- start: '01:33.928'
  end: '01:39.848'
  original: キミがいなくちゃ前も見えない
  english: Without you, I can't even see ahead.
- start: '01:40.168'
  end: '01:45.318'
  original: 辛いこととか苦しいこともあったって
  english: Even when there were painful and hard times...
- start: '01:45.318'
  end: '01:51.688'
  original: キミの力でここまで笑ってこれたんだ、こんな私をずっと引っ張って連れて行くんだ
  english: Thanks to you, I was able to laugh and make it this far. You always pulled
    me along and led the way.
- start: '01:52.548'
  end: '02:04.148'
  original: キミがいるから私がいるの、こんな私を愛してくれる？
  english: Because you are here, I am here. Will you love someone like me?
- start: '02:04.888'
  end: '02:12.148'
  original: ねぇもっと、ねぇもっと、まだもっと受け止めてね！ねぇいい？
  english: Hey, even more, hey, even more, even more, please accept all of me! Hey,
