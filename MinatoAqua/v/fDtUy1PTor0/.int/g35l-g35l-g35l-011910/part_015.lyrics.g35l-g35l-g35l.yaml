- start: '02:13.388'
  end: '02:16.148'
  original: さぁ声を上げて！
  english: Now, raise your voices!
- start: '02:17.388'
  end: '02:22.098'
  original: ねぇもっと、ねぇもっと好きになってもらいたいの
  english: Hey, I want you to love me even more!
- start: '02:22.438'
  end: '02:27.818'
  original: 私ばっかみたいにそっけないで怒らせないでね、ほら夢中にしちゃうわ
  english: Don't act all aloof like it's only me, don't make me mad. Look, I'll make
    you fall totally in love with me!
- start: '02:28.948'
  end: '02:34.528'
  original: あぁずっとずっと好きがいいの、心の奥までトキメイちゃうくらいに
  english: Ah, I always, always want to be your favorite, enough to make my heart
    flutter deep down.
- start: '02:34.908'
  end: '02:40.118'
  original: こっち向いててよねダリン？あぁもう離さないから
  english: Look this way, won't you, darling? Ah, I'm never letting go...
- start: '02:44.208'
  end: '02:49.708'
  original: 絶対に、絶対にね！絶対よ！約束だよ！
  english: Absolutely, absolutely! Absolutely! It's a promise!
- start: '02:50.568'
  end: '03:04.288'
  original: Love you, love you... ここまで応援してくれたみんな、仲良くしてくれたみんな、支えてくれたスタッフのみんな、本当にありがとう！
  english: Love you, love you... To everyone who cheered for me up to here, everyone
