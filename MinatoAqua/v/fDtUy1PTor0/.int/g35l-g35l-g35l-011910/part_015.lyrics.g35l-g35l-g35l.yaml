- start: '00:57.188'
  end: '01:04.288'
  original: 落ち込んで悲しくたってキミがいるから…！
  english: Even when I'm down and sad, because you're here...!
- start: '01:06.188'
  end: '01:16.128'
  original: 今日が本当に最高の形になりました！この景色を見せてくれて、本当本当にありがとう！世界中あくあ色に染まれー！
  english: Today truly became the greatest day possible! Thank you so much, so, so
