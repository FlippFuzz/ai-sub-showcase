  original: これであなただけのブラッドフレイム王国の力強いロザリアンを飼えるわね 私はあなたの剣 あなたは私の盾 私たちは一緒なら最強よ！
  english: Now you can have your very own Rosarian Bloodflame Kingdom powerful pooch!
    I am your sword and you are my shield. We are powerful together!
- start: '02:09.425'
  end: '02:10.505'
  original: That's right!
  english: That's right!
- start: '02:10.845'
  end: '02:21.085'
  original: 次は激アツピンバッジ4個セットよ！私がピンバッジ集めが大好きなのは知ってるわね 新しいコレクションに加えてね
  english: Next, we have a set of four pin badges! Y'all know I love collecting pin
    badges, and here's some new ones for you to collect.
- start: '02:21.365'
  end: '02:33.245'
  original: ERB TVロゴ シールド肉球 そしてBFKヘッドバンドをしたロザリアンよ レペゼン Blood Flame Kingdom
  english: We have the ERB TV logo badge, shield badge, Rosarian paw, and a Rosarian
    with a headband on saying BFK, Blood Flame Kingdom represent!
- start: '02:33.565'
  end: '02:37.765'
  original: 80年代風のヘッドバンドすごく似合ってるわよ I must say!
  english: You all look amazing with an 80s headband on, I must say!
- start: '02:38.745'
  end: '02:44.245'
  original: 最後に英語と日本語の両方で新しいボイスパックを収録したわ
  english: Lastly, I recorded another voice pack in both English and Japanese.
- start: '02:44.525'
  end: '02:49.445'
  original: ボイスパックのタイトルは「エリザベスと体操」 一緒に運動して私たちの修行に加わってね
  english: The voice pack is called "Exercise with Elizabeth". So join me on our training
    arc as we exercise together...
- start: '02:49.765'
  end: '02:55.245'
  original: さらなる高みを目指すために...！
  english: '...onwards and upwards!'
- start: '02:55.565'
  end: '03:06.585'
  original: フルセットを購入してくれた方にはフルセット購入特典があるわ！キービジュアルのポストカードがもらえるんだけどそれだけじゃないの
  english: Then, if you purchase the full set, the full shbang, there's a full set
    purchase bonus! You get a postcard with the key visual on it, but that's not all.
- start: '03:06.845'
  end: '03:19.465'
  original: 数量限定版には私の直筆サイン入りポストカードが入っているわ 限定版がなくなっても複製サイン入りのポストカードはもらえるからね
  english: The limited quantity includes a postcard with a handwritten signature by
    yours truly! Please do not worry, even when those run out, you still get the postcard
    with my replica signature.
- start: '03:19.745'
  end: '03:32.445'
  original: 以上が生誕グッズのフルセットでした！どうだったかしら？グッズには愛を込めたわ 特にロザリアンを抱っこするのが待ちれない！
  english: And that is the full set of my birthday merch! What do you think? There's
    been a lot of love put into this merch, and I especially can't wait to cuddle
    my own Rosarian plushie!
- start: '03:33.325'
  end: '03:37.945'
  original: ライブが終わる前にゲストのみんなに特別な感謝を伝えたいわ
  english: Before we wrap up, I'd like to give a special thanks to the guests.
- start: '03:38.185'
  end: '03:42.505'
  original: みんなと一緒にパフォーマンスできて光栄だったわ この素敵な思い出をずっと大切にするわ
  english: It is an honor performing with you all. I'll treasure these sweet memories
    forever.
- start: '03:42.745'
  end: '03:46.405'
  original: スタッフのみんなも素晴らしい仕事をありがとう
  english: Thank you to the crew, amazing job everyone!
- start: '03:46.685'
  end: '03:54.045'
  original: 振り付けを考えてくれたダンスの先生たちもありがとう 私のダンスでみんなを誇らしい気持ちにさせたら嬉しいな
  english: Thank you to my dance teachers who made the choreos! I hope I made you
    proud with my moving and grooving.
- start: '03:54.405'
  end: '04:04.345'
  original: そして何よりもロザリアンのみんな 私の最初の誕生日ライブを見てくれて本当にありがとう 初めてのERB TV放送！
  english: Most of all, thank you my beautiful kingdom, my Rosarians, for checking
    out my first birthday live! First ERB TV show!
- start: '04:04.605'
  end: '04:07.005'
  original: 最高の曲ばかりだったわよね？
  english: Those were some bops and a half, right?
- start: '04:07.445'
  end: '04:16.145'
  original: 美味しいものを食べて水分補給してしっかり寝るの 私たちの王国を強く保ちたいからね
  english: Okay, make sure to eat good noms, hydrate, get good sleeps because we want
    our kingdom to be good and strong.
- start: '04:16.425'
  end: '04:25.765'
  original: みんなのことが大好き そして何より私の声がみんなの力になりますように Bye Bye～
  english: I love you all very much. And most of all, let my voice be your strength!
    Bye bye~
- start: '04:28.165'
  end: '04:32.025'
  original: You're watching ERB TV...
  english: You're watching ERB TV...
