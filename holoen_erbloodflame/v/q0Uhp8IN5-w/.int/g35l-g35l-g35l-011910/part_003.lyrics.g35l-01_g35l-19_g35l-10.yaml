global_summary:
  overall_summary: 'This video is the official 3D showcase of Elizabeth Rose Bloodflame
    from hololive English -Justice-, titled ''I''ll Be Your Hero Too! ~ #ERB3D''.
    The stream follows a theatrical narrative where Elizabeth travels through various
    cinematic locations—from the Queen Mother Theater and a monster-infested street
    to a karaoke room and jazz club—battling obstacles, taking advice from senior
    and peer guests like Kureiji Ollie, Holostars English ARMIS, and Zentreya, and
    performing a dynamic setlist of 7 songs including covers of ''Odo'', ''Fallen
    Angel'', ''Kawaikutte Gomen'', ''GIRI GIRI'', ''Ichiban no Takaramono'', ''Watashi
    no Koi wa Hotchkiss'', and her original song ''Hero Too''. The showcase highlights
    her 3D model, vocal versatility, physical performance, and engaging interaction
    with her fans, the Rosarians.'
