  thoughts: |+
    **Birthday Merch and Rosarian Love!**

    Okay, here's the deal! I'm so thrilled, Rosarians! This segment is all about that birthday merch drop and just how much I love you all. From 00:00 to 00:21, there's a little intro, and the Japanese subs translate some English speech. From 00:21 to 00:30, it's a huge "Hello sweethearts!", with a question to my audience about how they liked the first show on ERB TV. Then (00:30-00:40) I asked did you enjoy and what do you think of the song choices! From (00:40-00:52) I exclaim "Huzzah!" and ask the Rosarians if they are ready for the surprise. It's time to show off the merch!

    At 00:52 to 01:02, I have a birthday merch! Here we go, first up is a tapestry (01:02-01:18) with a key visual art, retro-style, and would love it if you display it! 01:21-01:29: The merch includes a ERB TV mug that is great for hydrating while watching the show! Then (01:32-01:44), there's a reference to Queen Mother and a plushie! A Rosarian plushie! (01:44-02:08) I'm so happy and so excited I could literally squeal, since my adventures are nothing without the Rosarians.

    And as I said, I'm your sword and you are my shield. Together we are powerful! At 02:10 to 02:29 I introduce a set of 4 pin badges - the ERB TV logo badge, shield badge, Rosarian paw and BFK with headband, Bloodflame Kingdom represent! And (02:33-02:55) there's another voice pack called "Exercise with Elizabeth"! Then from 02:55 to 03:20, if you purchase the whole set, there's a postcard with the key visual and a handwritten signature!

    I put a lot of love (03:20-03:43) into this merch and I look forward to cuddle with the Rosarian plushie. Before we go, special thanks (03:33-04:02) to the guests, crew, dance teachers, and above all, the Rosarians. I'm loving the first ERB TV show! Make sure to eat good noms, hydrate, get good sleep, because we want our kingdom to be good and strong! Remember, I love you all very much and let my voice be your strength! Mwah! Bye-bye~


