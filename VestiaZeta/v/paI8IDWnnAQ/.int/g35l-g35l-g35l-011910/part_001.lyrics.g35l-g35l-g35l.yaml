  overall_summary: This video features Vestia Zeta's 2024 birthday 3D live concert
    titled 'Zeta's 3D Jazzeta Show!' streamed on her channel under the Hololive Indonesia
    banner. The concert adopts a sophisticated retro jazz club and spy-themed aesthetic,
    featuring solo performances and special guest collaborations with Ninomae Ina'nis,
    Tokoyami Towa, Ayunda Risu, Kureiji Ollie, Kaela Kovalskia, and Kobo Kanaeru.
    The stream also includes an elaborate merchandise commercial break showcasing
    apparel, plushies, and voice packs.
