global_summary:
  overall_summary: This video captures Vestia Zeta's 3D Birthday Live concert titled
    'Dance The Night Away! ♪' held in 2026 (#ZETA3DLIVE2026). The stream features
    high-energy musical performances of original tracks including 'Zero Gravity',
    'CLOSE(R)', 'LOVE MISSION♡', and 'RADIO:ON', as well as dynamic guest collaborations
    with hololive members Shirakami Fubuki, Oozora Subaru, Tsunomaki Watame, Kaela
    Kovalskia, and Kobo Kanaeru. Alongside dazzling futuristic stages and dance numbers,
    Zeta shares major announcements regarding her birthday merchandise and her 1st
    EP titled 'V/Z'.
