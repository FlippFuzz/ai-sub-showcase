  overall_summary: 'This video is the 3D birthday live concert of hololive Indonesia''s
    Vestia Zeta, titled ''Dance The Night Away! ♪'' under the hashtag #ZETA3DLIVE2026.
    The stream features high-energy dance and music performances of her original songs—including
    ''Zero Gravity'', ''CLOSE(R)'', ''LOVE MISSION♡'', the premiere of her new summer
    track ''RADIO:ON'', and ''You''re Mine''—alongside cover songs and guest collaborations
    such as with Kaela Kovalskia. Between performances, Zeta hosts MC segments, interacts
    with fans, showcases official 3D live merchandise, and makes a major announcement
    regarding the release of her 1st EP titled ''V/Z''.'
