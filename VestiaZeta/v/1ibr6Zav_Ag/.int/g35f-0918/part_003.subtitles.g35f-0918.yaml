    \ Ookami Mio, and AZKi. \n\n**Here's what I've got so far:**\n\nI hear Lamy laughing...\
    \ \"Aaah!\" Okay, Miko is talking now, \"Shote, shote... shote odoroku yone?\"\
    \ (First time? You get surprised the first time, right?) Mio agrees, \"Sou, saisho\
    \ wa odoroku yone, kore\" (Yes, you get surprised at first with this). Lamy's\
    \ back, \"Eeh?\" and then \"Aaah!\" She mentions something is \"yawarakai, yawarakai\"\
    \ (soft, soft). Mio asks \"Yawarakai?\" (Soft?). AZKi chimes in, \"Yasashii\"\
    \ (Gentle). Mio responds with a surprised \"Yasashii!?\" (Gentle!?) Lamy, repeating\
    \ \"Yasashii, yawarakai\" (Gentle, soft). Mio says \"Regarding this, maybe Zeta's\
    \ senses are a bit messed up...\" Wait, is it Zeta? Oh, right, the grey-haired\
    \ girl! It *is* Vestia Zeta from Hololive ID. Let me note that down. So, it's:\n\
    \n*   0:00 - Zeta: (Laughter, scream) \"Ah! Ah!\"\n*   0:02 - Miko: \"Hote, hote\
    \ odoroku yone\" (You get surprised on the first touch, right?)\n*   0:04 - Mio/AZKi:\
    \ \"Sou, saisho wa odoroku yone, kore\" (Yeah, at first you get surprised by this.)\n\
    *   0:06 - Zeta: \"Eeeh?\"\n*   0:09 - Zeta: \"Ahhhh!\"\n*   0:11 - Zeta: \"Demo,\
    \ yawarakai. Yawarakai.\" (But it's soft. Soft.)\n*   0:13 - Mio/AZKi: \"Yawarakai?\"\
    \ (Soft?)\n*   0:15 - Zeta: \"Yasashii\" (Gentle.)\n*   0:16 - Mio/AZKi: \"Yasashii!?\"\
    \ (Gentle!?)\n*   0:17 - Zeta: \"Yasashii, yawarakai\" (Gentle, soft.)\n*   0:19\
    \ - Mio/AZKi: \"Regarding this, maybe Zeta's senses are a bit messed up...\"\n\
