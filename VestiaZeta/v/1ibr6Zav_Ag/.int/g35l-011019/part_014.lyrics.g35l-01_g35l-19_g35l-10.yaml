    a 'Secret Agent Test' to prove her elite agent capabilities. Hosted in a futuristic
    agent training facility, Zeta undergoes multiple tests alongside various hololive
    guests, including Ookami Mio, Sakura Miko, AZKi, Amelia Watson, Koseki Bijou,
    IRyS, Mori Calliope, Natsuiro Matsuri, Himemori Luna, Tokoyami Towa, and Kobo
    Kanaeru, with Kureiji Ollie providing narration. The stream features sensory mystery
    box challenges, physical strength tests on bumpy mats, water gun aiming competitions,
    a birthday merchandise showcase, and a high-energy live performance of her 2nd
    original song, 'Break It Down'.
