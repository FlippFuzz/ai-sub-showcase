    *   **00:35-00:54:** Gigi, the "Good Cop," admits her lack of confidence due to her "pure heart" and her "fat ass," and states that she isn't a "gaslighter like Cecilia Immergreen". Despite this, she decides to do her best. She prepares to start an interrogation to force a confession.
    *   **00:56-01:17:** The interrogation begins with Elizabeth being falsely accused of identity fraud and unlawful acquisition of Nerissa Ravencroft's personal belongings. However, Elizabeth claims that she is innocent and does not know who Nerissa Ravencroft is.
    *   **01:17-01:38:** Despite Elizabeth's innocence, the other two members start to act suspicious and accuse Elizabeth of knowing Nerissa Ravencroft. The members start accusing her. She states that "If I ever saw such a maiden, I would call her witchery. She sounds like one."
