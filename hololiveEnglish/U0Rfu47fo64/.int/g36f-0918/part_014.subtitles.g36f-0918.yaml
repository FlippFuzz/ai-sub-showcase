    **Merch Announcement & Live Performance: A Recap**

    Alright, let's break this down. First, we're talking about new merch! The stream started with a presentation, detailing various items like a handy storage item, perfect for button badges, keychains, small acrylic stands, and postcards [00:00.000 - 00:09.900].  "Yay!" [00:09.900 - 00:13.200]. A hook was also added to the product [00:13.200 - 00:16.000]. We were then hoping that people would show off these products at events [00:16.000 - 00:20.500] and of course, a lot of "Yay!" [00:20.500 - 00:23.000]. Raora was up next [00:23.000 - 00:24.700]. We also had a large-size 3D Acrylic Stand [00:30.500 - 00:33.900] and then some discussion about life-size representations [00:33.900 - 00:49.000]. There was a great deal of enthusiasm around the Justice acrylic stands [00:54.400 - 01:03.200], suggesting everyone needs to grab them, "Get them all!" [01:03.200 - 01:14.300].

    Then Liz got up next [01:14.300 - 01:21.000]. We each have our own merch, too [01:21.000 - 01:25.500]! I kicked things off with the Paper Knife & Acrylic Stand set [01:32.400 - 01:37.400], inspired by my sword, Thorn [01:37.400 - 01:48.000]. It was exciting to show how the paper knife could be displayed using the stand [01:48.000 - 01:54.000]. Then Gigi showed off the Hand In Cushion for Gramps [02:07.400 - 02:14.000], emphasizing its fluffiness and squishiness [02:19.400 - 02:26.500]. And a Gramps was mentioned [02:26.500 - 02:38.000]! CC unveiled an Otomo Pouch & Socks set [02:40.400 - 02:43.000], seven pairs of socks [02:43.000 - 02:47.800] with a pouch [02:47.800 - 02:53.300]. Finally, there was Raora with a Pencil Case & Keychain set featuring a Chatino costume [03:10.400 - 03:25.000], hoping people will fill it with stationery [03:25.000 - 03:40.400].

    Everything is super cute [03:40.400 - 03:50.000]. The merch will be available right after the stream, so don't miss it [03:50.000 - 04:06.500]. Now, here's the BIG announcement: Justice will be performing live for the first time [04:12.300 - 04:19.400] at the hololive English 3rd Concert! It will take place at the Radio City Music Hall in New York [04:19.400 - 04:27.100] on August 23rd and 24th PDT [04:27.100 - 04:34.500].  Immediately after this stream, we're being redirected to the music video for 'ALL FOR ONE' [04:38.200 - 04:44.200], and Justice will be in it [04:44.200 - 04:59.000]. Stay

