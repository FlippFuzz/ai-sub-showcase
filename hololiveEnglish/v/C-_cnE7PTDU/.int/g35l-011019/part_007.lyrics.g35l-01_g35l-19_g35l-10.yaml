    broadcast begins with a pre-stream waiting room placeholder before opening into
    live 3D concert performances. Featured segments include a high-energy Myth Medley
    by Mori Calliope, Takanashi Kiara, and Ninomae Ina'nis, solo performances by IRyS
    and Takanashi Kiara, a dynamic unit performance and interactive MC banter by Cecilia
    Immergreen and Gigi Murin (Autofister), and concluding end-screen promos for full
    concert streaming tickets.
