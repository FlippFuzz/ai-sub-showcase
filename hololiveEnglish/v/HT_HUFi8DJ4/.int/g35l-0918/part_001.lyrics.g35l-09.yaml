    reference_lyrics_og: |-
      [Connect the World]
      We’re ready to greet the world!
      We’re voyaging forward with courage
      To run toward a brand-new start
      Let’s go live!
      Bridging the distance across the sea endlessly
      Cheerfully meeting heart to heart!

      Waking from a dream, swept up into a stream
      I make a wish and wait for my cue—
      How will we connect in this
      New frontier we’re journeying through?
      Thriving in a scene where no one’s ever been
      With vibrant colors bursting like stars—
      Radiant and warm; charged with energy
      That’s carried us this far

      Each new debut brings a miracle to life
      Surely
      We''ve gotta take that chance
      We’re running nonstop; straight to the top
      That’s right!

      We’re ready to change the game
      A shimmering showcase
      Creating a new place where we can shine!
      Day by day, sparkling stories will intertwine
      Get ready to cross the waves
      We’re voyaging forward with courage
      To run toward a brand-new stage
      Let’s go live!
      Bridging the distance across the sea endlessly
      Follow me and we’ll turn the page!

      Breaking through the doubt, we know
      We’ll figure out a way to clear each towering trial;
      Sharing all our hopes,
      We can conquer any challenge with a smile!
      We’ll link our hearts as we search across the globe
      Knowing
      No matter where we are, no matter how far
      We can be stars
      Let’s go!

      I wanna chase a wish unwaveringly,
      Playing out a grand story
      Share the futures that we can see
      Making them reality!
      Take my hand and reach for the screen
      All we need are glittering dreams
      Our hearts and souls,
      All fulfilled in the world we build!

      We’re ready to seize the day
      Traversing the pathways,
      Discovering highways to everywhere!
      Step by step, gathering stories that we can share!
      Get ready to lead the way
      With each generation, a shining sensation;
      A dream unfurls—
      Let’s make friends,
      Making a moment of history joyfully!
      Follow me; we’ll connect the world!

      They’ll hear our song ringing out over hills and oceans
      Our legend grows and continues!
      We’ll carry on starting now; setting hearts in motion—
      Connecting all of the world!

      [Breaking Dimensions]
      Look up at the horizon together as one
      A star is on the rise and it's only begun
      The pivotal moment we're clamoring for
      An infinite future's at our door
      Yeah
      It's a timeless story with a new feel
      Not just allegory, it's real
      Wake up, big dreams about to come true
      That means it's time to break through
      Never knew we could make it so far,
      But we're striving, thriving, here we are
      Achieving the impossible
      We're virtually unstoppable
      We can't sit still, we just keep moving
      Now everybody sing!

      We're making our way to the next dimension,
      We'll reinvent the world that we live in
      We'll greet every day with new intentions
      Break conventions, run right through! (This is it!)
      Been smashing barriers left and right
      (That's our myth!)
      Strong as we ever were, scaling heights
      (It's endless!)
      So get together, let's reunite!
      Reach up, reach out, the future's bright.

      We've been together for what feels like an eternity,
      The times are changing, but we're ready for infinity, yeah
      Our stories align, we're gonna go far when we combine
      So look at the horizon and then look beyond,
      We'll marvel at the skies and the strength of our bond,
      We're making a vow to the smiling stars,
      A powerful moment that's all ours~
      The seasons change, but we keep shining
      Now everybody sing
      (Keep it going!)

      We're making our way to the next dimension,
      A million thrills in every direction
      We'll give every mile our full attention,
      Breaking tension, breaking through (We won't miss!)
      With endless energy, stronger ties (We got this!)
      A perfect harmony we devise (We promise!)
      So clap along with me (Time to rise!)
      The future's right before our eyes.

      A new dimension of freedom that we've found, (Yeah, we've made it)
      We're breaking out of the mold, no longer bound (We're unlimited)
      We're gonna spring to life and break the chains
      Turn up the hype, can't be contained
      We're shaking up the status quo,
      No time to stop, we're good to go!
      The whole wide world is listening,
      So everybody sing!

      We're making our way to the next dimension,
      We're living out the dreams we believe in,
      Excitement beyond our comprehension,
      There's no question, we'll break through!
      (Don't relent!)
      We'll keep aspiring to excel
      (It's advent!)
      It's awe-inspiring, going well
      (Represent!)
      So light the fire and let's rebel!
      The future's brighter, we can tell!
