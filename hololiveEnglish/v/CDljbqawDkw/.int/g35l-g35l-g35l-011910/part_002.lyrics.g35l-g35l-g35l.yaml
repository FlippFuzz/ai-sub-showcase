  overall_summary: This video is the 4th Anniversary 3D live concert of hololive English
    -Myth-, titled 'The Show Goes On!'. Hosted by Mori Calliope, Takanashi Kiara,
    Ninomae Ina'nis, Gawr Gura, and Watson Amelia, the concert features a dazzling
    Broadway and red carpet theme. The members perform a high-energy medley of group
    songs, shuffle covers of each other's solo tracks, duets, and the premiere of
    their new 4th anniversary group single 'The Show Goes On!'. Interspersed with
    charming MC banter, reflective moments, and humorous interactions, the concert
    concludes with an encore performance of 'Connect the World' and official merchandise
    announcements.
