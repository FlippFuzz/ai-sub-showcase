  overall_summary: 【#TheBrokenPromise】 is a 1st anniversary musical special by hololive
    English -Promise-, featuring IRyS, Ceres Fauna, Ouro Kronii, Nanashi Mumei, and
    Hakos Baelz. The story follows five flawed adventurers—IRYSSA, FAELYN, KORA, NAMU,
    and HEXA—who embark on a quest led by the celestial guide Areza to defeat a malevolent
    Dark Lord in exchange for having their deepest desires granted. Throughout their
    journey through eerie forests, towns, and churches, their hidden insecurities,
    obsessions, and inner darkness surface. Ultimately, upon reaching the Dark Lord's
    lair, they discover the realm is empty, realizing that the true darkness was within
    themselves all along as they succumb to their own twisted ambitions.
