    **Subtitle Project Deep Dive**

    Okay, so I've got this Hololive EN -Promise- segment with Ceres Fauna, Ouro Kronii, Nanashi Mumei, Hakos Baelz, and IRyS. The goal is to get subtitles done, obviously. First up, it's a video that's five minutes and three seconds long. We've got a song at the beginning, from zero to two minutes twelve seconds, and then spoken dialogue after that. Thankfully, they’ve got Japanese lyrics hardcoded on screen during the song portion!

    The hardcoded text wins, so I'm meticulously transcribing those Japanese lyrics, line by line, timing them as accurately as possible. For the dialogue part (2:12 onwards), it's straightforward - just transcribing the English spoken by the Vtubers. The system prompt specifies that if the original is English, then `og` and `en` are both English. So there will be no translation from my end. And I will add timestamp to each word or phrase. Let's start!


