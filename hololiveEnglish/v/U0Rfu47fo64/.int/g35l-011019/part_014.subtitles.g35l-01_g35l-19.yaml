  overall_summary: This YouTube video features the special 3D debut collaboration
    of hololive English -Justice-, titled '#Justice3D'. The members—Elizabeth Rose
    Bloodflame, Gigi Murin, Cecilia Immergreen, and Raora Panthera—gather in a 3D
    studio guided by their bird mascot Smokey to undertake a series of chaotic training
    challenges, including brain/typing trivia, blindfolded sword duels, bomb defusal
    block stacking, and whack-a-gnome. Between the hilarity and friendly banter, they
    deliver stunning live musical performances of their original songs 'ABOVE BELOW'
    and 'RENEGADE', as well as a cover of 'BLUE CLAPPER'. The stream concludes with
    exciting official merchandise announcements and news regarding upcoming live concerts.
