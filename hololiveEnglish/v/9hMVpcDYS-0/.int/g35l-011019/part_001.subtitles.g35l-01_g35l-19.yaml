global_summary:
  overall_summary: 'This video is the official ''hololive English -Promise- 2nd Anniversary
    Concert: Promise 2 You'' (#Promise2U), celebrating two years of the hololive English
    unit -Promise-. Featuring stellar virtual 3D performances by IRyS, Ouro Kronii,
    and Hakos Baelz, the concert blends high-energy J-pop/rock covers and original
    songs (including ''Get Wild'', ''Steppin'' out'', ''Life Will Change'', ''X-encounter'',
    and more) with an entertaining variety segment—the ''Promise Foot Massage Karaoke
    Battle''. In this segment, the members sing while enduring painful foot reflexology
    mats and professional foot massage by Naoko Takita, culminating in a sour juice
    punishment game for the runner-ups. The stream also features official 2nd anniversary
    merchandise introductions and concludes with the major reveal and live performance
    of their brand-new original song, ''Run Back Round''.'
