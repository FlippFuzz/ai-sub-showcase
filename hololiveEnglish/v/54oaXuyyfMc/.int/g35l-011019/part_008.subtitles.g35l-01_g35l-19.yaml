global_summary:
  overall_summary: This video is the official 3rd Anniversary 3D Live stream of hololive
    English -Advent- titled 'Bound by Fate' (#AdventBoundbyFate), streamed on August
    8/9, 2026. The full 3D live concert features dynamic group performances of original
    songs like 'What Goes Around', 'Breakout', 'Unchained', and 'Spotlight', as well
    as collaborative and solo cover medleys such as 'Kami-iro Awase', 'Doki Doki Morning',
    'Bad Apple!!', and 'Oyome Holic'. Interspersed between high-energy musical segments
    are interactive MC banter, a shadow silhouette body-art challenge with Pokey,
    and individual anniversary merchandise and project announcements.
