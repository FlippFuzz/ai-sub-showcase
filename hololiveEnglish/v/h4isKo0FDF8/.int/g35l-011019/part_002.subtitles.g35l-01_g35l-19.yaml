global_summary:
  overall_summary: This video is the free YouTube preview of Day 2 of the hololive
    English 3rd Concert -All for One-, held at the legendary Radio City Music Hall
    in New York City. The broadcast begins with pre-show merchandise displays, fan
    art messages, and a special AmiAmi anniversary sponsor message presented by Ninomae
    Ina'nis. After the venue intro and audience atmosphere shots, the stream showcases
    live 3D musical performances including 'START AGAIN' by Mori Calliope, IRyS, Nerissa
    Ravencroft, and Elizabeth Rose Bloodflame, 'Dead Ma'am's Chest' by Koseki Bijou,
    and 'HOT DUCK!' by Gigi Murin. The preview concludes with an MC banter segment
    between Takanashi Kiara and IRyS, followed by information on purchasing streaming
    tickets for the full event.
