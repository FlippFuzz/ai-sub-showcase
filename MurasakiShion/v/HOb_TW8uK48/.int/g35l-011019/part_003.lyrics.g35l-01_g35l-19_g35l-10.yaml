global_summary:
  overall_summary: This video is the 3D Birthday Anisong Live stream hosted by Hololive
    2nd Generation VTuber Shion Murasaki, titled '【3D LIVE】重大告知あり！紫咲シオンBirthdayアニソンライブ！！✨【#紫咲シオン生誕LIVE2024】'.
    Broadcast on December 8, 2024, the stream features a high-energy setlist of iconic
    anime theme songs (anisongs) ranging from Dragon Ball and Pokémon to Naruto, One-Punch
    Man, Tokyo Ghoul, and Psycho-Pass. A major highlight includes a special guest
    duet of 'Hi-Touch!' with legendary voice actress and singer Rica Matsumoto. The
    stream concludes with a costume change into a Halloween witch outfit, the premiere
    of her new original song 'Gomen ne Medicine' written by PinocchioP, and an extensive
    showcase of her 2024 birthday merchandise lineup.
