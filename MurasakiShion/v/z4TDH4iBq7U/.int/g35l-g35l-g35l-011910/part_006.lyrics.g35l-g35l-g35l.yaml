  original: 「世界で一番おひさま…」じゃなくて！
  english: The number one princess in the world... no, wait!
- start: '00:02.048'
  end: '00:04.148'
  original: 無口で無愛想な王女様
  english: A taciturn, unsociable princess
- start: '00:04.148'
  end: '00:09.948'
  original: もうどうして？気がついてよ早く！
  english: Why won't you notice already?! Hurry up!
- start: '00:14.648'
  end: '00:25.848'
  original: ぜったいキミはわかってない！わかってないわ……
  english: You definitely don't get it at all! You really don't get it...
- start: '00:30.948'
  end: '00:36.948'
  original: いちごの乗ったショートケーキ　こだわりたまごのとろけるプリン
  english: A shortcake topped with a strawberry, a melting pudding made with special
