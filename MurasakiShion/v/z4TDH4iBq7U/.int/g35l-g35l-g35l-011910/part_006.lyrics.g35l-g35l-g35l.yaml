- start: '00:36.948'
  end: '00:42.548'
  original: みんなみんな我慢します　わがままだと思わないで
  english: Everyone puts up with it all, don't think I'm just being selfish!
- start: '00:42.548'
  end: '00:48.848'
  original: わたしだってやればできるの　あとで後悔するわよ
  english: I can do it if I try, you'll regret it later!
- start: '00:51.548'
  end: '01:02.548'
  original: 当然です！だってわたしは　世界で一番おひさま……じゃなくて！ちゃんと見ててよね！
  english: Naturally! Because I am the number one princess in the world... no, wait!
    Make sure you're watching properly!
- start: '01:03.048'
  end: '01:05.948'
  original: どこかに行っちゃうよ？
  english: Or else I might go somewhere else, you know?
- start: '01:06.648'
  end: '01:10.548'
  original: ふいに抱きしめられた　急にそんなの……
  english: Suddenly I was pulled into an embrace... I wasn't expecting that...
- start: '01:10.848'
  end: '01:14.848'
  original: 「逃げられるわけないよ」そう言ってそっぽ向くキミ
  english: '"There''s no way you can escape," you say, looking away.'
- start: '01:17.848'
  end: '01:21.048'
  original: こっちのが危ないわよ！
  english: You're the one who's in danger here!
- start: '01:55.256'
  end: '02:01.856'
