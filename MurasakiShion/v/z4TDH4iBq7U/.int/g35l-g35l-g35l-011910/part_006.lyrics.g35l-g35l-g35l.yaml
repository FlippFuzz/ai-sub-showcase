  english: '[Title: Tenshi ni Fureta yo! Lyrics: Emi Inaba Music: Susumu Kawaguchi]'
- start: '02:03.156'
  end: '02:14.056'
  original: ねぇ　思い出のカケラに　名前をつけて保存するなら
  english: Hey, if we're going to save the fragments of our memories and name them
- start: '02:14.056'
  end: '02:19.456'
  original: 宝物がぴったりだね
  english: '"Treasure" fits them best.'
- start: '02:19.856'
  end: '02:31.456'
  original: そう　ココロの容量がいっぱいになるくらいに過ごしたね
  english: Yes, we spent so much time together that our hearts are completely full.
- start: '02:31.956'
  end: '02:43.356'
  original: ときめき色の毎日　なじんだ制服と上履き　ホワイトボードの落書き
  english: Every day was colored with excitement, our familiar uniforms and indoor
    shoes, the doodles on the whiteboard
- start: '02:43.756'
  end: '02:52.456'
  original: 明日の入り口に　置いて行かなくちゃいけないのかな
  english: Do we have to leave them behind at tomorrow's doorway?
- start: '02:53.056'
  end: '03:00.156'
  original: でもね、会えたよ！すてきな天使に
  english: But you know what? We met them! A wonderful angel...
- start: '03:00.556'
  end: '03:08.956'
  original: 卒業は終わりじゃない　これからの仲間だから
  english: Graduation isn't the end, because we'll still be friends from now on!
- start: '03:09.356'
  end: '03:16.856'
  original: 一緒の写真たち　おそろのキーホルダー
  english: Photos we took together, matching keychains
- start: '03:17.156'
  end: '03:29.856'
  original: いつまでも輝いてる　ずっとその笑顔　ありがとう
  english: They'll shine forever, and that smile will stay forever. Thank you!
- start: '03:33.856'
  end: '03:42.156'
  original: ねぇ　桜の木もちょっと　背が伸びたみたい
  english: Hey, it looks like the cherry blossom trees have grown a bit taller, too.
- start: '03:42.556'
  end: '03:55.056'
  original: 見えないゆっくりなスピードでも　きっとあの空は見てたね
  english: Even at an invisible, slow pace, I'm sure that sky was watching over us.
- start: '03:55.756'
  end: '04:04.956'
  original: 何度もつまずいたこと　それでも最後まで歩けたこと
  english: All the times we tripped up, and yet how we walked all the way to the end
- start: '04:05.156'
  end: '04:22.556'
  original: 帰り道課外の廊下に　こぼれた音符の羽根　ふかふか積もるまで　このままでいれたらいいのにな
  english: In the hallway after class, until the fallen feathers of melody pile up
    soft and deep, I wish we could stay just like this forever.
- start: '04:22.956'
  end: '04:30.456'
  original: でもね、ふれたよ！愛すべき天使に
  english: But you know what? We touched it! A lovable angel...
- start: '04:30.956'
  end: '04:39.156'
  original: ただいまって言いたくなる　この場所は変わらないよ
  english: Whenever you want to say "I'm home," this place will never change.
- start: '04:39.756'
  end: '04:46.856'
  original: メールの受信箱　マルしたカレンダー
  english: Our email inbox, the circled calendar
- start: '04:47.156'
  end: '04:58.256'
  original: とびきりの夢と出会い　くれた音楽に　ありがとう
  english: Thank you for the wonderful dreams and encounters, and the music you gave
    us.
