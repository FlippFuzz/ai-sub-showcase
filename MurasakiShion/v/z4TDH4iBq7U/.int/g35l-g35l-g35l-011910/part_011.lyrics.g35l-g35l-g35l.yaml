  original: '[Text: ふわもふあったかブランケット]'
  english: '[Text: Fluffy Warm Blanket]'
- start: '00:00.628'
  end: '00:14.588'
  original: フェルト生地とかではなくて、あのちゃんとふわふわしてる、あったかいふわふわモフモフした感じの生地になっています。あのちゃんとね、肌ざわりがね、いい感じになってるので、いやぜひこれマジメに使ってほしいです。ほんとにいいので、おすすめ！
  english: It's not made of felt or anything like that. It has a fluffy, warm, and
    cozy fleece-like texture. It feels really nice on the skin, so I seriously want
    you all to use this. It's truly great, highly recommended!
- start: '00:14.988'
  end: '00:26.548'
  original: '[Text: ぐっすりアイマスク]'
  english: '[Text: Sleepy Eye Mask]'
- start: '00:15.828'
  end: '00:27.428'
  original: いやーね、塩っこになってますね。これ塩っこになれますからね、これみんな付けたらね、あの目にね、目が顔が塩っこになれるのでね。
  english: It makes you look like a Shiokko. You can become a Shiokko with this! If
    everyone wears it, your face can become a Shiokko's face.
- start: '00:27.608'
  end: '00:52.408'
  original: これねリボンがついているんですが、リボンもちゃんと立体感でちょっとふっくらした感じのね、あの立体感のあるデザインで、あの目とかがね、刺繍になっております。めちゃくちゃ可愛いし、あのほかもか、ちゃんと付け心地めちゃいいのにしたので、ちょっとちゃんとね、目、目にね、あの痛くないふわっとした感じの質感になっているのでこれを使って、みんな寝てください毎晩。これめちゃいいよ。
  english: It has a ribbon attached, and the ribbon has a nice, plump 3D design, with
    embroidered eyes and other details. It's super cute, and we made sure the fit
    is extremely comfortable, with a soft texture that doesn't hurt your eyes at all.
    Please use this to sleep every single night. It's really great!
- start: '00:52.888'
  end: '01:24.068'
  original: '[Text: もちもち塩っ子ぬいぐるみ]'
  english: '[Text: Mochi-Mochi Shiokko Plushie]'
