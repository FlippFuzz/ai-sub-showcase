- start: '02:29.868'
  end: '03:00.088'
  original: '[Text: フルセット購入特典]'
  english: '[Text: Full Set Purchase Bonus]'
- start: '03:00.088'
  end: '03:24.088'
  original: というわけで、いかがだったでしょうか？個人的にはあのめちゃくちゃこだわったグッズなので、みんなの手元に渡ったらとても嬉しいなと思っております。よろしくお願いします！このあともまだもう少しだけ続くので、最後まで目を離さずに告知もありますので、よろしくお願いします！それではこのあとも楽しんでてね！
  english: So, what did you think? Personally, I put a lot of care into these goods,
    so I'd be super happy if they reach everyone's hands. Thank you for your support!
    There's still a little bit left after this, so please keep your eyes on it until
    the very end since there are also announcements! Alright, enjoy the rest as well!
