- start: '03:44.835'
  end: '03:50.535'
  original: かけた言葉で 割れた日々を直そうとして
  english: Trying to fix the fractured days with the words I uttered,
- start: '03:51.375'
  end: '03:58.735'
  original: 足しすぎた熱量で 引かれてしまったカーテン
  english: a curtain was drawn shut by too much fervor.
- start: '03:59.395'
  end: '04:13.335'
  original: そんな失敗作を 重ねて重ねて重ねて見つけたいんだいつか 最高の一句を
  english: Stacking up such botched attempts over and over, I want to find it someday—the
