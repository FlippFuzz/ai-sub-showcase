  end: '00:22.012'
  original: またたきを許さない あなたたちならば
  english: Showing no mercy for a single blink, if it is you.
- start: '00:36.435'
  end: '00:43.035'
  original: 凍りついた心には太陽を そして僕が君にとってそのポジションを
  english: For a frozen heart, the sun. And for you, I want to be that position.
- start: '00:44.215'
  end: '00:50.055'
  original: そんなだいぶ傲慢な思い込みをこじらせてたんだよ ごめんね
  english: I let such arrogant presumptions twist me all up. I'm sorry.
- start: '00:51.355'
  end: '00:57.455'
  original: ごめんね 笑って 笑ってやって
  english: I'm sorry. Please... just laugh it off.
- start: '00:59.055'
  end: '01:05.155'
  original: 火傷しそうなほどのポジティブの 冷たさとう残酷さに気付いたんだよ
  english: I realized the coldness and cruelty of a positivity so intense it could
