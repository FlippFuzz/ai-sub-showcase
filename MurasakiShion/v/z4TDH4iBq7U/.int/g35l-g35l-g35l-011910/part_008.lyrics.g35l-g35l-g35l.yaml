- start: '02:36.575'
  end: '02:42.335'
  original: どうしたって生ぬるくて 君を傷つけてしまうのだろう
  english: Why is it that I'm always lukewarm and end up hurting you?
- start: '02:44.155'
  end: '02:47.755'
  original: 手のひらが熱いほど 心は冷たいんでしょ
  english: The warmer my palms are, the colder my heart must be, right?
- start: '02:48.455'
  end: '02:50.815'
  original: 冗談でもそんな残酷なこと言わないでよ
  english: Don't say such cruel things, even as a joke.
- start: '02:51.655'
  end: '02:59.615'
  original: 別に冷えればいいけど 全人生を賭けても ちゃんと覆すさしてよ 救いたい 救われたい このイコールが今
  english: It's fine if I freeze, but even if I bet my whole life, let me properly
