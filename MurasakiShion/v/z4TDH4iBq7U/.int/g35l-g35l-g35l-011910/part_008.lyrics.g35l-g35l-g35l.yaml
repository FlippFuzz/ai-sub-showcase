- start: '04:14.995'
  end: '04:30.335'
  original: 言葉はまるで雪の結晶 君にプレゼントしたとしても 時間が経ってしまえば大抵 記憶から流れ落ちて溶けていって 消えてしまう でも
  english: Words are just like snowflakes. Even if I present them to you, as time
