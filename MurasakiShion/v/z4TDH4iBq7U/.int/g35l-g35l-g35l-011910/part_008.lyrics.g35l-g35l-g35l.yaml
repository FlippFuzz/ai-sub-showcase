  end: '04:36.575'
  original: 絶えず僕らのストーリーに 添えられた字幕のように
  english: like subtitles accompanying our unending story...
- start: '04:37.315'
  end: '04:44.475'
  original: 思い返した時 不意に目をやる時に
  english: When looking back, when suddenly casting my eyes upon it...
- start: '04:45.335'
  end: '05:00.000'
