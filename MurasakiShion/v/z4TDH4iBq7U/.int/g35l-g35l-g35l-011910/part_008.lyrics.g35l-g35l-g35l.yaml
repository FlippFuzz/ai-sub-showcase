- start: '02:20.035'
  end: '02:26.375'
  original: もう少しだけ待ってて
  english: Please wait just a little longer.
- start: '02:29.035'
  end: '02:35.335'
  original: 薄着でただそばに立っていても 不必要に汗をかいてしまう僕なんかもう
