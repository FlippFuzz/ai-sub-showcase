- start: '01:52.555'
  end: '01:58.715'
  original: 形は崩れ落ちて溶けていって 消えてしまうけど
  english: Their shape crumbles, melts away, and disappears.
- start: '01:59.215'
  end: '02:05.775'
  original: でも僕が選ぶ言葉が そこに託された想いが
  english: But the words I choose, the feelings entrusted within them...
- start: '02:06.015'
  end: '02:16.275'
  original: 君の胸を震わすのを 諦められない 愛してるよりも愛が届くまで
  english: I cannot give up on making your heart tremble. Until my love reaches you,
