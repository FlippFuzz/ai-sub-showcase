  end: '03:06.035'
  original: 優しく剥がしていくんだよ
  english: is gently peeling away.
- start: '03:06.875'
  end: '03:13.515'
  original: 堅い理論武装 プライドの過剰包装
  english: Stiff theoretical armor, over-packaging of pride.
- start: '03:14.775'
  end: '03:20.935'
  original: 正しさよりも優しさが欲しい そしてそれを受け取れるのは
  english: I want kindness more than correctness. And the one who can receive that...
- start: '03:21.535'
  end: '03:31.095'
  original: イルミネーションみたいな 不特定多数じゃなくて ただ1人 君であってほしい
