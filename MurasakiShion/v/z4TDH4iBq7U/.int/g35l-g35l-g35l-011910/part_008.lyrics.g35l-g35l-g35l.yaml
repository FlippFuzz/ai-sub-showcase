- start: '01:21.055'
  end: '01:26.555'
  original: 理想だけはあるけど 心のどこを探しても まるで見つからないんだよ
  english: I have ideals, but no matter where I search in my heart, I just can't seem
    to find them.
- start: '01:27.115'
  end: '01:33.455'
  original: 伝えたい 伝わらない その不条理が今 キツく縛り付けるんだよ
  english: What I want to convey, what won't get across—that absurdity is binding
    me tightly right now.
- start: '01:35.795'
  end: '01:43.055'
  original: 臆病な僕の この一挙手一投足を
  english: My cowardly every gesture and movement...
- start: '01:44.255'
  end: '01:51.155'
  original: 言葉はまるで雪の結晶 君にプレゼントしたくても 夢中になればなるほどに
  english: Words are just like snowflakes. Even if I want to present them to you,
