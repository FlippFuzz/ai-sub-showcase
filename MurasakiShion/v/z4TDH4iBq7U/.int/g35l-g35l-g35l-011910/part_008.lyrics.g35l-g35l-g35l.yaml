- start: '01:06.135'
  end: '01:12.375'
  original: きっと君に渡したいものは もっとひんやり熱いもの
  english: Surely, what I want to hand to you is something much more cool yet burning.
- start: '01:13.795'
  end: '01:20.735'
  original: 綺麗事じゃないけど 綺麗で揺るぎないもの うわべよりも胸の奥の奥を温めるもの
