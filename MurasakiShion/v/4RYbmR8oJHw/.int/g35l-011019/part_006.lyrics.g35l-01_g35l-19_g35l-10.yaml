  english: Of course you'd think that. After all, I'm still hesitating like this.
- start: '00:13.900'
  end: '00:15.540'
  original: ラララ ラララ
  english: Lalala... Lalala...
- start: '00:15.820'
  end: '00:18.280'
  original: 手を繋いでくれないか ラララ ラララ
  english: Won't you hold my hand? Lalala... Lalala...
- start: '00:19.460'
  end: '00:21.840'
  original: きっとテイク３ ラララ ラララ
  english: Must be Take 3. Lalala... Lalala...
- start: '00:22.680'
  end: '00:26.440'
  original: 君が僕のヒーローなんだよ 何章じゃない
  english: You are my hero, no matter what chapter it is!
- start: '00:27.720'
  end: '00:30.400'
  original: メラメラ 燃え上がる こんな僕にも潜む正義が
  english: Blazing up bright and strong, even inside a guy like me hides a sense of
    justice!
- start: '00:31.060'
  end: '00:40.540'
  original: どうしようもない 衝動に駆られて ほら 気付けば手を握っている 一体全体 そんな荷物も背負い込んでどこへ行くの
  english: Driven by an unstoppable impulse, look... before I knew it, I was holding
    your hand. Where on earth are you going carrying all that baggage?
- start: '00:47.400'
  end: '00:54.000'
  original: ねぇで待って 僕にちょっと預けてみては
  english: Hey, wait! Why don't you entrust a little of it to me...?
- start: '01:09.160'
  end: '01:15.580'
  original: 信じてばかりの僕と 信じることが怖い君と どちらが正しいのかななんて
  english: Between me, who believes in everything, and you, who are afraid to believe—which
    of us is right?
- start: '01:20.120'
  end: '01:23.000'
  original: 誰にもわからないさ
  english: Nobody knows for sure.
- start: '01:24.760'
  end: '01:28.160'
  original: 僕らだけの世界 きっとテイク３
  english: A world just for us. It must be Take 3.
- start: '01:32.600'
  end: '01:40.240'
  original: 補い合えたなら 蓋月にだって同じ夢を見たい
  english: If we can make up for each other, I want to dream the same dream even under
    a crescent moon.
- start: '01:52.320'
  end: '02:05.180'
  original: 君はかっこいいと 苦しめて ひとりぼっちにさせたのは少し僕のせいなんだよな ごめんね
  english: You're so cool, you suffered and felt all alone—is that partly my fault?
    I'm sorry.
- start: '02:06.400'
  end: '02:13.000'
  original: だけど信るべきはリアるだ 今こそ僕が助けるんだ
  english: But what we should believe in is reality! Right now is when I will save
    you!
- start: '02:13.920'
  end: '02:19.460'
  original: 抱え込んで 信じてだよって 欲しいんだ
  english: Don't bottle it up, believe in me—that's what I want!
- start: '02:23.540'
  end: '02:30.340'
  original: 今なんじゃない メラメラ燃え上がる こんな僕にも潜む正義が
  english: Isn't it right now? Blazing up bright and strong, even inside a guy like
    me hides a sense of justice!
- start: '02:31.280'
  end: '02:36.700'
  original: どうしようもない 衝動に駆られて ほら 気付けば手を握っている
  english: Driven by an unstoppable impulse, look, before I knew it, I was holding
    your hand.
- start: '02:37.380'
  end: '02:44.800'
  original: 仏けない そんな荷物も 背負い込んでどこへ行くの ほんのちょっと
  english: You can't let go of that baggage either, where are you heading? Just a
    tiny bit...
- start: '02:46.040'
  end: '02:50.120'
  original: 僕にちょっと 預けてみては
  english: Why don't you entrust a little of it to me?
- start: '02:51.340'
  end: '02:57.900'
  original: こんな僕も 君のヒーローになりたいのさ
  english: Even a guy like me... wants to be your hero!
- start: '03:49.000'
  end: '03:55.000'
  original: '[Title: 星座になれたら]'
  english: '[Title: If I Could Be a Constellation]'
- start: '04:00.100'
  end: '04:03.240'
  original: 真っ直ぐ時計は６時
  english: The clock hands point straight to 6 o'clock.
- start: '04:03.740'
  end: '04:07.120'
  original: まさかに一番星 影を踏んで
  english: Stepping on my shadow, of all things the first star.
- start: '04:07.380'
  end: '04:14.360'
  original: 夜に紛れたくなる帰り道
  english: On my way home, wanting to get lost in the night.
- start: '04:16.140'
  end: '04:22.420'
  original: どんなに探してみても 一つしかない星
  english: No matter how much I search, there's only one star.
- start: '04:23.240'
  end: '04:31.900'
  original: ラフをこね離れたところから あんなに輝くヒーロー
  english: Twisting the rough notes from a far-off place, shining so brightly like
    a hero.
- start: '04:33.440'
  end: '04:41.220'
  original: 君はみんなから愛されていいな
  english: You are loved by everyone, must be nice.
- start: '04:42.200'
  end: '04:47.600'
  original: 僕はーずっと一人きりさ
  english: I've always been all alone.
- start: '04:48.420'
  end: '04:55.800'
  original: 君と集まってそばになれたら 星振る夜の一瞬の願いごと
  english: If I could gather close by your side and become a constellation... a fleeting
    wish on a starry night.
- start: '04:56.840'
  end: '04:59.800'
  original: きらめいて 揺らめいて
  english: Sparkling, swaying...
