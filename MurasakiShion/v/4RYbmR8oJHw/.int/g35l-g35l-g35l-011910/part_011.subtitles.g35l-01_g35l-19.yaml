  overall_summary: This video captures the emotional graduation live stream of Murasaki
    Shion, a prominent virtual YouTuber from Hololive's 2nd Generation, titled '【#紫咲シオン卒業LIVE】最大の感謝を込めて。'.
    Spanning over 90 minutes, the stream features multiple solo vocal performances,
    heartfelt guest collaborations with fellow Hololive members (including Nekomata
    Okayu, Inugami Korone, Shirakami Fubuki, Hoshimachi Suisei, Houshou Marine, Usada
    Pekora, and Sakamata Chloe), a surprise graduation certificate presentation from
    Cover Corp CEO Yagoo, emotional letter readings to her fans ('Shiokko'), and powerful
    final musical numbers including her newly released self-titled song 'Shion'.
