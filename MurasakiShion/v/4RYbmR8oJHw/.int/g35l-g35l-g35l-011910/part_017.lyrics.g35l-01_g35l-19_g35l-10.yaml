  original: 今日は最後になると思うから、おてがみを書いてきました。
  english: Thinking today would be my last, I wrote a letter.
- start: '00:04.102'
  end: '00:10.902'
  original: では、読みます。
  english: I will now read it.
- start: '00:13.602'
  end: '00:18.402'
  original: 塩っこのみんなへ。 いよいよ今日は卒業ライブ当日だね。
  english: To all the Shiokko, today is finally the day of my graduation live.
- start: '00:18.922'
  end: '00:28.152'
  original: ギリギリの新曲聞きたくて伝えたくて今日で言うきの卒業ライブ前日に書いてやばぼう泣きしちゃってさまだ全然話して大丈夫に
  english: I wanted you to hear my new song right up until the end, and I wanted to
    tell you... I wrote this the day before the graduation live, and I was crying
    so much... I'm still barely able to talk properly.
- start: '00:28.802'
  end: '00:31.202'
  original: 正直今でもちょっぴりフワフワしてはな不思議な気持ちです。
  english: To be honest, even now I still have this strange, floaty feeling.
- start: '00:32.902'
  end: '00:46.402'
  original: 今日卒業ライブを終えてスタジオを出たら実感するのかな？ 家に帰ったら実感するのかな？ 卒業したんだって思うのかな？ 今は悔いのないようにやり切りたいという気持ちでいっぱいです。
  english: Will it sink in once the graduation live is over and I leave the studio?
    Will it sink in when I get home? Will it hit me that I've graduated? Right now,
    my heart is just filled with the desire to give it my all without any regrets.
- start: '00:47.302'
  end: '01:04.202'
  original: 7年目、活動期間は6年半。こんなにも長い期間をずっと一緒に歩いてくれてこと、本当にありがとう。 休止したりしてたくさん待たせてしまったりして、本当にごめんなさい。辛い思いをさせてしまったなってちょっと心残りです。
  english: 7th year, with an activity period of 6 and a half years. Thank you so much
    for walking alongside me for such a long time. I'm truly sorry for making you
    wait so much when I had to take breaks. I still have a bit of regret knowing I
    put you through some painful times.
- start: '01:05.102'
  end: '01:19.902'
  original: 塩っこのみんなに見てほしいからいろんなこと頑張りたいなって思う中で体調を崩してしまったり、会社は大きくなってそれに対応していくのもなかなか難しくて精神面や体調は悪くなる一方で悔しかったです。
  english: Wanting you, my Shiokko, to see me do my best, I pushed myself in various
    ways, but my health suffered, the company grew larger, and adapting to all of
    that was quite difficult. My mental and physical health deteriorated on one hand,
    while I felt so frustrated on the other.
- start: '01:20.402'
  end: '01:43.002'
  original: 自分のことなんてどうでもいいし、こうあれたらそれでいいと思ってた私ですが、長い期間を経てみんなのおかげで少しでも自分を大切にしてあげたいと思うことができるようになりました。これは普通の人にとっては当たり前ことかもしれないけど、私にとって本当にすごいことなんだよ。
  english: I used to think my own well-being didn't matter as long as things turned
    out that way, but after such a long time and thanks to everyone, I've come to
    be able to cherish myself just a little bit. This might be something totally natural
    for ordinary people, but for me, it's truly an amazing thing.
- start: '01:43.902'
  end: '01:52.802'
  original: みんなのおかげです。いつもたくさん愛を伝えてくれてありがとう。形として届けてくれてありがとう。
  english: It's all thanks to everyone. Thank you for always showering me with so
    much love. Thank you for expressing it in tangible ways.
- start: '01:52.902'
  end: '02:11.802'
  original: 出会ってくれてありがとう。見つけてくれてありがとう。心から感謝でいっぱいです。ホロライブで過ごした思い出はずっと忘れません。この面を支えてくれる運営さん、そして塩っこのみんなと出会えて本当に幸せでした。ずっと大好きです。
  english: Thank you for meeting me. Thank you for finding me. My heart is overflowing
    with gratitude. I will never forget the memories I spent in Hololive. I was truly
    happy to meet the management staff who supported me behind the scenes, and all
    of you, my Shiokko. I love you forever.
- start: '02:12.302'
  end: '02:20.702'
  original: 紫咲シオンは死ぬわけではありません。私という存在がいたこと覚えてくれたら嬉しいなって思います。
  english: Murasaki Shion isn't going to die. I'd be happy if you just remembered
    that someone like me existed.
- start: '02:21.002'
  end: '02:26.502'
  original: 私もみんなのこと絶対に忘れないからね。6年半、本当にありがとうございました。
  english: I will never forget you all, either. Thank you so much for these past 6
    and a half years.
- start: '02:27.102'
  end: '02:34.502'
  original: 最強の魔法使い、紫咲シオンより！
  english: From the strongest mage, Murasaki Shion!
- start: '02:36.402'
  end: '02:57.402'
  original: というわけで、昨日、昨日おてがみを書きました。本当はもっと早く書こうかなって思ったんだけど、どんな気持ちになってるかなと思ってギリギリで書いた方がみんなに伝わるのかなって思ってギリギリに書きました。いや、ちゃんと伝わってると嬉しいです。
  english: And so, yesterday... I wrote this letter yesterday. I actually thought
    about writing it a bit earlier, but wondering what kind of mindset I'd be in,
    I thought writing it at the very last minute would convey my feelings better to
    everyone, so I wrote it right at the wire. Well, I hope my feelings came across
    properly.
- start: '02:57.802'
  end: '03:03.402'
  original: みんなが幸せになってくれることを願ってます。泣いちゃったよ、くそー！
  english: I pray that everyone finds happiness. I ended up crying, dammit!
- start: '03:04.202'
  end: '03:33.802'
  original: それでは、次が最後の曲になりますが、ちょっとそのお水を飲んできます。いや、ちょっと思った通りにいかないな……。はい！というわけで、聞いてください、シオン。
  english: Now, the next song will be the final one, but I'm going to go drink some
    water first. Man, things really don't go the way you think they will... Yes! And
    with that, please listen to "Shion".
- start: '04:07.402'
  end: '04:14.902'
  original: 真っ赤な夜空 青くなる星 心臓を焦がして 冷めない温度
