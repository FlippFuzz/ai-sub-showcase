  - start: '00:18.922'
    end: '00:28.152'
    original: ギリギリの心境を聞きたくて、伝えたくて、今日で言う昨日、卒業ライブ前日に書いて、やばい、もう泣いちゃったよ、まだ全然話してないのに。
    english: I wanted you to know my feelings right down to the wire, and I wanted
