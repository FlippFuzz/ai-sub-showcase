    *   First, the opening exchange, a casual "What is it?" followed by a "The two of us, yeah." Then, the crux of it all, "Do you know how long it's been since we streamed together?". I'm going to carefully double-check the timing of those first lines. Okay, Shion's "あのさ" is at the start, at the same time, Aqua starts with her line "What is it?" Alright, let's keep going.
    *   "Stream... I mean, how long... has it been since we talked like this?" It seems they are as surprised as I am. "How long has it been?" Apparently, a whole year. "Eeh?! I-I-It's been a year!" Well, that's a genuine surprise. "That's surprising." "E-Y-Yeah, that's crazy. Seriously surprising." It's truly been a while. AquaShion, "AquaShion, you know!" It's quite nostalgic "That legendary AquaShion scene."
