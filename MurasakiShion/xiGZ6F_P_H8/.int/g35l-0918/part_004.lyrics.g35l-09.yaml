    reference_lyrics_en: |-
      Hey, hey, what if—what if this happened?
      If I were attacked by a grizzly bear on my way home,
      What would you do?
      (If—what would you do?)
      What if on my way home, I met a grizzly bear,
      If our eyes met in the dark, I wouldn't be able to move from fear,
      With trembling lips, if I called for help,
      Would you come running right away?
      Hey, don't brush it off as a lie,
      It's the truth, please,
      Yeah!
      Even in your pajamas, come running, we're fighting over every single second,
      While you change into your dress shirt, I'll be eaten down to the bones (yes help me!)
      Even barefoot, come running, before doubting me,
      I'm so worried, I want you to start running,
      That kind of person makes me happy,
      Yeah!
      What if at the street corner, I bumped into a grizzly bear,
      If we faced each other in the shadows, I wouldn't be able to scream from fear,
      With a frightened left hand, if I texted for help,
      Would you look at it right away?
      Hey, don't dismiss it as bragging,
      It's real, believe me,
      Yeah!
      Even from work, come running, leaving everything behind,
      Before your overtime ends, look, I'll be swallowed whole (yes help me!)
      Come running from anywhere, before doubting me,
      I want you to be so restless you can't stay still, lose your composure,
      That kind of person is dear to me,
      Yeah!
      "Hey, hello, it's terrible, terrible, there's a grizzly bear on my way home!"
      "Help me, I'm so scared I can't move a single step!"
      "Come right now, help me, kya~ it's coming this way~"
      "It's looking at me, no~"
      "Help me~ ah~ there~"
      Hey, don't brush it off as a lie,
      It's the truth, please,
      Yeah!
      Even in your pajamas, come running, we're fighting over every single second,
      While you change into your dress shirt, I'll be eaten down to the bones (yes help me!)
      Even barefoot, come running, before doubting me,
      I'm so worried, I want you to start running,
      That kind of person makes me happy,
      Yeah!
      There is only you,
      Thank you.
