global_summary:
  overall_summary: This video is AZKi's 6th Anniversary 3D Live titled '百花繚乱' (Hyakka
    Rouran), streamed live on the AZKi Channel. The concert celebrates six years of
    AZKi's music career as a virtual singer in Hololive Production. The first half
    features heartfelt solo performances and energetic collaborations with Hololive
    guests Nekomata Okayu and Usada Pekora, including popular cover songs like 'Kamippoi
    na' and 'Nekokaburina'. The centerpiece of the concert is the stunning live reveal
    of AZKi's brand-new 3D New Year kimono costume, followed by a themed Japanese/Wa-style
    set featuring solo songs and collaborative performances with Shirakami Fubuki
    and Houshou Marine on 'Maware! Setsugetsuka'. The concert concludes with announcements
    for upcoming merchandise, an exclusive membership-only encore live, and the upcoming
    release of her new original single 'Kagerou no Shirabe'.
