    that I can bring joy to everyone and make sure you all have fun.
- start: '00:17.319'
  end: '00:33.279'
  original: みんなが、元気になっ、元気にして、そして、癒し、癒しをもたえられる存在になりたいなって、今後もそうなりたいなって思っていますので、これからも応援よろしくお願いします！
  english: I want to become someone who can give you energy, and provide healing so
    you can find comfort—I want to be that kind of presence moving forward, so thank
    you for your continued support!
- start: '00:34.459'
  end: '00:39.199'
  original: はい！それでは、本当に本当に今日最後の曲です！聞いてください！
  english: Yes! And now, this truly is the very last song of today! Please listen!
- start: '01:11.458'
  end: '01:15.938'
  original: 寄り添うふたりに 君がオーバーラップ
  english: You overlap with the two of us standing close together...
- start: '01:16.358'
  end: '01:23.238'
  original: 色なき風に 想い馳せて 触れた手のぬくもり 今も
  english: Letting my thoughts ride the colorless wind, the warmth of the hands we
    touched is still...
- start: '01:25.978'
  end: '01:27.758'
  original: ストップ 時間を止めて
  english: Stop, time, please freeze right here...
- start: '01:31.478'
  end: '01:35.338'
  original: そう いつ日だって 君の言葉忘れないの
  english: Yes, no matter what day it is, I will never forget your words.
- start: '01:41.258'
  end: '01:52.058'
  original: 会いたい時に会えない 会いたい時に会えない 切なくてもどかしくって
  english: When I want to see you, I can't... When I want to see you, I can't... It's
    so painful and frustrating, yet...
- start: '01:53.698'
  end: '02:02.518'
  original: かなしくれない に染まる渡月橋 導かれる姫があって 川の流れに祈りを込めて
  english: Togetsukyo Bridge dyed in sorrow... Guided by a princess, I put my prayers
    into the flowing river.
- start: '02:09.958'
  end: '02:14.398'
  original: I've been thinking about you
  english: I've been thinking about you
- start: '02:14.898'
  end: '02:19.498'
  original: いつも 心 君のそば
  english: Always, my heart is right by your side.
- start: '02:30.558'
  end: '02:35.318'
  original: 古えの景色変わりなく 今この瞳に映し出す
  english: The scenery of ancient times remains unchanged, reflecting in my eyes right
    now.
- start: '02:41.258'
  end: '02:49.258'
  original: 色取り行く季節越えて ストップ 覚えていますか ねぇ いつになったんだろ
  english: Crossing through changing seasons, stop—do you remember? Hey, when will
    it be...
- start: '02:55.158'
  end: '02:59.458'
  original: また巡り会えるのかな
  english: That we'll be able to meet again?
- start: '03:00.038'
  end: '03:09.378'
  original: 会いたい時に会えない 会いたい時に会えない この胸を焦がすの
  english: When I want to see you, I can't... When I want to see you, I can't... It
    scorches this heart of mine.
- start: '03:12.398'
  end: '03:21.918'
  original: かなしくれない に水くくる時 君との想い繋げて 川の流れに祈りを込めて
  english: At the moment water binds us in sorrow, connecting my thoughts of you,
    I put my prayers into the flowing river.
- start: '03:28.878'
  end: '03:33.738'
  original: I've been thinking about you
  english: I've been thinking about you
- start: '03:34.098'
  end: '03:39.118'
  original: いつも 君を探してる
  english: Always, I am searching for you.
- start: '03:39.758'
  end: '03:47.818'
  original: 君となら 不安さえどんな時も消えていくよ
  english: With you, even anxiety would fade away no matter when.
- start: '03:48.878'
  end: '03:57.998'
  original: いつになったら 優しく 抱きしめられるのかな
  english: When will the day come when I can be gently held in your arms?
- start: '04:01.378'
  end: '04:06.638'
  original: かなしくれない の紅葉みちさえ 熱い想いを告げては
  english: Even the autumn foliage paths dyed in crimson convey my burning feelings,
- start: '04:10.878'
  end: '04:16.838'
  original: ゆらり揺れて歌っています
  english: swaying gently as I sing.
- start: '04:17.398'
  end: '04:26.518'
  original: I've been thinking about you いつも いつも 君を想う
  english: I've been thinking about you, always, always thinking of you.
- start: '04:27.278'
  end: '04:31.958'
  original: いつも いつも 君を想う
  english: Always, always thinking of you.
