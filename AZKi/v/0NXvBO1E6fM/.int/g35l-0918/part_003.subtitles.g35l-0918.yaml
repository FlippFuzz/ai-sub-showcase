    english: The distant stars of the night bleed through.
  - start: '00:22.526'
    end: '00:28.406'
    original: したいことが見つけられないから
    english: Since I can't find what I really want to do,
  - start: '00:41.527'
    end: '00:47.387'
    original: 急いだふり 俯くまま
    english: Hurrying along with my head down,
  - start: '00:47.387'
    end: '00:53.307'
    original: 転んだ後に笑われてるのも気づかないふりをするのだ
    english: pretending not to notice people laughing after I trip.
  - start: '00:54.347'
    end: '01:00.127'
    original: 形のない歌で朝を描いたままで
    english: Just drawing the morning with a formless song,
  - start: '01:00.127'
    end: '01:06.127'
    original: 浅い浅い夏の向こうに
    english: far beyond the shallow, shallow summer—
  - start: '01:07.127'
    end: '01:12.307'
    original: 冷たくない君の手のひらが見えた
    english: I saw the palm of your hand, not even cold.
  - start: '01:13.207'
    end: '01:19.307'
    original: 淡い空明けの蛍 自分がただの染みに見えるほど
    english: A pale firefly at daybreak, to the point where I seem like nothing more
      than a stain—
  - start: '01:19.307'
    end: '01:25.500'
    original: 嫌いなものが増えたので 地球の裏側へ飛びたいのだ
    english: I've grown to hate so many things, I want to fly to the other side of
      the Earth.
  - start: '01:26.300'
    end: '01:31.500'
    original: 無人の駅に届くまで 昨日の僕に出会うまで
    english: Until I reach an unmanned station, until I meet yesterday's me,
  - start: '01:31.800'
    end: '01:38.200'
    original: 胸が痛いから下を向くたびに 君がまた遠くを征くんだ
    english: every time my heart aches and I look down, you journey far away once
      more.
  - start: '02:02.327'
    end: '02:09.127'
    original: 夢を見た僕らを汚し さらば 昨夜に咲く火の花
    english: Tainting us who dreamed, farewell, fireworks blooming in the night of
      yesterday.
  - start: '02:10.100'
    end: '02:14.500'
    original: 水に映る花を花を見ていた
    english: I was watching the flowers mirrored in the water,
  - start: '02:15.100'
    end: '02:22.500'
    original: 水に揺るむ月を月を見ていたから
    english: and the moon shimmering in the water, so I watched it.
  - start: '02:22.800'
    end: '02:29.800'
    original: 夏が来ないままの空を描いたなら
    english: If I were to paint a sky where summer never comes,
  - start: '02:30.100'
    end: '02:36.100'
    original: 君は僕を笑うだろうか
    english: would you laugh at me?
  - start: '02:36.500'
    end: '02:42.500'
    original: 明け方の夢 浮かぶ月が見えた空
    english: A dawn dream, a sky where the floating moon was visible—
  - start: '02:42.800'
    end: '02:49.100'
    original: 朝が来ないままで 息ができたなら
    english: if I could still breathe without morning ever coming,
  - start: '02:49.400'
    end: '02:56.200'
    original: 遠い遠い夏の向こうへ 冷たくない 君の手のひらが見えた
    english: far beyond the distant summer, I saw the palm of your hand, not even
      cold.
  - start: '02:56.800'
    end: '03:03.200'
    original: 淡い朝焼けの夜空
    english: A night sky of pale morning glow.
  - start: '03:03.200'
    end: '03:15.000'
    original: 夏が来ないままの街を今 ああ 藍の色 夜明けと蛍
    english: Now in this town where summer never comes... Ah, the indigo hue of daybreak
      and fireflies.
  - start: '03:57.730'
    end: '04:06.130'
    original: もう忘れてしまったかな 夏の木陰に座ったまま アイスを口に放り込んで 風を待っていた
    english: Have I already forgotten? Sitting in the shade of summer, popping an
      ice pop into my mouth, waiting for the breeze.
  - start: '04:08.130'
    end: '04:17.130'
    original: もう忘れてしまったかな 世の中の全部嘘だらけ 本当の価値を二人で探しに行こうと話したこと
    english: Have I already forgotten? Talking about how everything in this world
      is full of lies, and how the two of us would go search for true value together.
  - start: '04:23.000'
    end: '04:29.000'
    original: 忘れないように 色褪せないように 形に残るものが全てじゃないように
    english: So that I won't forget, so that it won't fade, so that material things
      aren't all that remains—
  - start: '04:36.500'
    end: '04:48.500'
    original: 言葉をもっと教えて 夏が来るって教えて 僕は描いてる 目に映ったのは夏の亡霊だ
    english: Teach me more words, tell me summer is coming. I am painting; what was
      reflected in my eyes was summer's ghost.
  - start: '04:49.100'
    end: '04:59.500'
    original: 風にスカートが揺れて 思い出なんて忘れて 浅い呼吸をする
    english: My skirt sways in the breeze, forgetting all memories, taking shallow
      breaths.
