  - start: '00:47.331'
    end: '00:51.811'
    original: 傷ついた感情も進んでいくから
    english: Even wounded emotions will keep moving forward,
  - start: '00:52.021'
    end: '00:55.761'
    original: そっと響く頑張れが新しい未来を感じる
    english: softly echoing words of encouragement make me feel a new future.
  - start: '00:55.931'
    end: '01:02.391'
    original: 怖くだって進むしかないでしょ、どこまで
    english: Even if it's scary, we have no choice but to press on—just how far?
  - start: '01:03.201'
    end: '01:06.851'
    original: 届くこの祈りを光ととなれもっともっと
    english: May these prayers reach us, becoming light, more and more,
  - start: '01:10.121'
    end: '01:14.611'
    original: 少しずつでもいい優しいという答えを
    english: even if it's little by little, the gentle answer.
  - start: '01:15.931'
    end: '01:22.511'
    original: もっと、もっと、もっと、もっと
