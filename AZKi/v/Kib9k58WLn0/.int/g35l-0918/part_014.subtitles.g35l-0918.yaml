  - start: '01:46.264'
    end: '01:54.674'
    original: 開拓者のみんなと紡いだあのステージが何度でも見返せます。本日より受注受付が開始です。
    english: You can rewatch that stage woven with the Pioneers as many times as you
      like. Pre-orders start today.
  - start: '01:55.304'
    end: '02:04.594'
    original: 続いて告知2つ目！AZKiの歴史を彩るEP2作品の再販が本日7月1日より全国流通スタート！
    english: 'Next, announcement #2! The nationwide distribution for the reissue of
      two EP works coloring AZKi''s history starts today, July 1st!'
  - start: '02:05.154'
    end: '02:10.164'
    original: 対象タイトルは「Without U」と「Re:Creating world」です。
    english: The target titles are "Without U" and "Re:Creating world".
  - start: '02:11.134'
    end: '02:18.064'
    original: 最後、告知3つ目！AZKi誕生日記念2026グッズ情報！
    english: 'Finally, announcement #3! AZKi Birthday Commemoration 2026 merchandise
      information!'
  - start: '02:18.424'
    end: '02:27.794'
    original: 今回は、お披露目された小悪魔衣装にちなんだグッズがもりだくさんです。イラストはのぶ澤おさむ先生に描いていただきました。ありがとうございます！
    english: This time, there's plenty of merchandise themed around the newly unveiled
      little devil outfit. The illustrations were drawn by Osamu Nobusawa. Thank you
      very much!
  - start: '02:29.044'
    end: '02:32.484'
    original: それでは詳細を見ていきましょう。まずはこちら。
    english: Now let's look at the details. First is this.
  - start: '02:32.884'
    end: '02:38.214'
    original: 2層アクリルパネル。小悪魔衣装のキービジュアルをアクリルパネルにしました。
    english: 2-layer acrylic panel. We made the key visual of the little devil outfit
      into an acrylic panel.
  - start: '02:38.744'
    end: '02:47.454'
    original: 2層になっているので立体的に見えます。スタンドガラスの神秘的な美しさと小悪魔衣装が見せるギャップをお楽しみください。
    english: Since it has two layers, it looks three-dimensional. Please enjoy the
      mysterious beauty of the stained glass and the gap shown by the little devil
      outfit.
  - start: '02:49.204'
    end: '03:01.874'
    original: 続いてはこちら、ランダムラバーキーホルダー。このあとの面会でも詳しく見せちゃうんですけど、今回の新衣装、実はバリエーションがいっぱいあるのでラバーキーホルダーにしてもらいました。
    english: Next is this, random rubber keychain. I'll show it in detail during the
      meeting later, but since this new outfit actually has lots of variations, we
      had them made into rubber keychains.
  - start: '03:02.164'
    end: '03:08.774'
    original: キミのお気に入りはどのアズキかな？イラストはニャドラ先生に描いていただきました。
    english: Which AZKi is your favorite? The illustrations were drawn by Nyadora-sensei.
  - start: '03:09.734'
    end: '03:22.464'
    original: 続いてはこちら、ぬいぐるみキーホルダー小悪魔衣装ver.。こちらも小悪魔衣装バージョンとなってます。ずきまみたいなチャメッ気のある表情になっているので、ぜひ相棒として連れ歩いてください。
    english: Next is this, plush keychain (Little Devil Outfit ver.). This is also
      the little devil outfit version. It has a mischievous expression like Zukima,
      so please take it around as your buddy.
  - start: '03:23.704'
    end: '03:41.224'
    original: 続いてはこちら、おそろいブレスレット。小悪魔衣装をモチーフにしたデザインのブレスレットです。日常の中でさりげなく押しをお手におまとうのはもちろん、普段アクセサリーをつけない方には新衣装の再現コレクションとしてもおすすめのグッズです。
    english: Next is this, matching bracelet. It's a bracelet designed with the little
      devil outfit motif. Of course, it's great for subtly wearing your oshi in daily
      life, and recommended as a recreation collection of the new outfit even for
      those who don't usually wear accessories.
  - start: '03:42.544'
    end: '03:54.914'
    original: 続いてはこちら、ASMRボイス。ボイスタイトルは「小悪魔チャーミング」。AZKiが小悪魔っぽく魔法をかけちゃうそんなもしものお話のASMRボイスです。
    english: Next is this, ASMR voice. The voice title is "Little Devil Charming".
      It's an ASMR voice of a "what if" story where AZKi casts a spell like a little
      devil.
  - start: '03:55.334'
    end: '04:15.174'
    original: そしてフルセット購入特典もございます。のぶ澤おさむ先生イラストのAZKiのタロット風カードと特典ASMRボイスです。数量限定バージョンは直筆サイン&箔押し複製メッセージ入り、通常バージョンは箔押し複製サイン&メッセージ入りです。
    english: And there are also full set purchase bonuses. An AZKi tarot-style card
      illustrated by Osamu Nobusawa and bonus ASMR voice. The limited quantity version
      includes a handwritten signature & foil-stamped duplicate message, and the regular
      version includes a foil-stamped duplicate signature & message.
  - start: '04:15.934'
    end: '04:18.964'
    original: ということで以上嬉しいお知らせでした！
    english: So that was all the happy announcements!
  - start: '04:19.354'
    end: '04:27.754'
    original: このあとはメンゲンでアンコールライブ！まだメンゲンに入っていない方もまだ間に合うのでぜひ入ってみてください。
    english: After this is the encore live for members! For those who haven't joined
      membership yet, you still have time, so please check it out.
  - start: '04:28.184'
    end: '04:37.494'
    original: 実は今回の新衣装みんなにまだ見せていないあんな姿やこんな姿があるので見に来てくれたら嬉しいです。
    english: Actually, there are sides of this new outfit I haven't shown everyone
      yet, so I'd be happy if you came to see them.
  - start: '04:37.894'
    end: '04:47.374'
    original: 誕生日たくさんお祝いしてくれてありがとう！ライブも見てくれてありがとう！それではこのあとメンゲンで会おうね。バイバーイ！
    english: Thank you so much for celebrating my birthday! Thank you for watching
      the live too! Well then, let's meet in the member stream afterwards. Bye-bye!
