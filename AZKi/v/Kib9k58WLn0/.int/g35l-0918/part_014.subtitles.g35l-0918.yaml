  - start: '01:39.264'
    end: '01:45.694'
    original: お待たせしました！AZKiソロライブ2025 デパーチャー ブルーレイ発売決定！
    english: Thank you for waiting! AZKi Solo Live 2025 "Departure" Blu-ray release
