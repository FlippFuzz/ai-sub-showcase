    ~Heisei vs Reiwa Anison Song Battle~ held on July 1, 2026. The stream features
    a musical showdown between Heisei and Reiwa anime songs performed with guest artists
    from Hololive (IRyS, Tokoyami Towa, Roboco-san, Otonose Kanade, Isaki Riona, and
    Mizumiya Su). During the live, AZKi debuts her new 3D devil ('Koakuma') costume,
    welcomes special guest anime song singer Konomi Suzuki to perform 'Redo' and premiere
    their new original collaboration single 'Saikyou Mirai Shoudo', and announces
    major updates including her 2025 solo live Blu-ray, EP re-releases, and 2026 birthday
    merchandise.
