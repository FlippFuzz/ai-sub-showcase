    end: 02:40
    title: Introduction and Stream Kickoff
    description: AZKi and Nechimera kick off their first-ever off-collab stream together,
      greeting viewers and announcing the formation of their new geography gaming
      duo, the GeoGuessr Club.
    song_title: null
    song_artist: null
  - start: 02:40
