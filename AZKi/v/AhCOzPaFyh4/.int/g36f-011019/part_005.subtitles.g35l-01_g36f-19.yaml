global_summary:
  overall_summary: This video features the very first off-collab stream between Hololive's
    AZKi and ASOBI★MAWARI-TAI member Nechimera, affectionately dubbed '#Azumera' (#あずめら).
    The duo forms an impromptu 'GeoGuessr Club' and unboxes Zenrin's newly released
    'Map Design GALLERY CARD / General National Highway' trading cards. Throughout
    the stream, they examine various national highway routes across Japan, discuss
    geography trivia, share surprise care packages and messages left by fellow Hololive
    member Kazama Iroha, and marvel at rare cards such as the 4-way 'Onigiri' intersection
    sign.
  chapters:
  - start: 00:00
    end: 02:40
    title: Introduction and Stream Kickoff
    description: AZKi and Nechimera kick off their first-ever off-collab stream together,
      greeting viewers and announcing the formation of their new geography gaming
      duo, the GeoGuessr Club.
    song_title: null
    song_artist: null
  - start: 02:40
    end: 08:30
    title: Gifts and Surprises
    description: The duo reads surprise notes and snack gifts left behind in the studio
      by Kazama Iroha for Pocky Day, and Nechimera presents a special 5-yen coin badge
      souvenir to AZKi.
    song_title: null
    song_artist: null
  - start: 08:30
    end: '12:40'
    title: National Highway Trading Card Introduction
    description: AZKi explains Zenrin's national highway trading cards ('Kokudo Toreka'),
      detailing rarity tiers based on route length (Common, Uncommon, Rare) and sharing
      geographical trivia.
    song_title: null
    song_artist: null
  - start: '12:40'
    end: '46:40'
    title: Opening Highway Series 1 Packs
    description: AZKi and Nechimera open packs from Highway Series 1, reacting to
      notable routes like Route 416 (Mela's birthday), Route 1, Route 439 ('Yosaku'),
      and pulling a super rare 4-way rice ball sign card.
    song_title: null
    song_artist: null
  - start: '46:40'
    end: '71:00'
    title: Opening Highway Series 2 Packs and Wrap-up
    description: The unboxing continues with Highway Series 2 packs featuring routes
      in Awaji Island, Shikoku, and maritime sections, followed by closing thoughts
      on their geography exploration and closing greetings.
    song_title: null
    song_artist: null
