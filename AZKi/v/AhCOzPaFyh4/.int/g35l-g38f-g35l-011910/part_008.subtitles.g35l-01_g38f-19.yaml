global_summary:
  overall_summary: In this off-collab stream on the AZKi Channel, Hololive virtual
    diva AZKi and Hololive newcomer Necchi Mera meet in person for the very first
    time. To bond over their shared love for GeoGuessr and geography, they unbox and
    explore Zenrin's 'National Highway Trading Cards' (国道トレカ). Throughout the stream,
    they examine various national highways across Japan, marvel at coastal, mountainous
    ('Kukudō'), and marine sections, discuss trivia and rarities such as the '4-ren
    onigiri' super rare card, read surprise gifts left by fellow Hololiver Kazama
    Iroha, and share excitement over their future geography-themed projects before
    heading out for dinner together.
