global_summary:
  overall_summary: In this offline collaboration stream on AZKi Channel, Hololive
    0th Generation member AZKi and Hololive newcomer Nessen Mera team up for their
    very first face-to-face collab, nicknamed '#あずめら'. The duo reviews and unboxes
    Zenrin's 'Map Design GALLERY CARD / General National Highway' trading cards. As
    they open multiple packs from Series 1 and Series 2, they examine various national
    highways across Japan, discussing geographical trivia, mountain passes, coastal
    routes, and highway rarities—including pulling a Super Rare '4-ren Onigiri' card.
    The stream also features surprise snacks and notes left behind by senior member
    Kazama Iroha.
