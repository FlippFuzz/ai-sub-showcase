global_summary:
  overall_summary: In this offline collaboration stream on AZKi Channel, Hololive
    0th Generation member AZKi and Hololive newcomer Nessen Mera team up for their
    very first face-to-face collab, nicknamed '#あずめら'. The duo reviews and unboxes
    Zenrin's 'Map Design GALLERY CARD / General National Highway' trading cards. As
    they open multiple packs from Series 1 and Series 2, they examine various national
    highways across Japan, discussing geographical trivia, mountain passes, coastal
    routes, and highway rarities—including pulling a Super Rare '4-ren Onigiri' card.
    The stream also features surprise snacks and notes left behind by senior member
    Kazama Iroha.
  chapters:
  - start: 00:00
    end: 02:40
    title: Introduction and Greetings
    description: AZKi and Nessen Mera welcome viewers to their first-ever offline
      collaboration stream ('#あずめら'), introducing themselves and expressing excitement
      about meeting in person.
    song_title: null
    song_artist: null
  - start: 02:40
    end: 07:40
    title: Studio Gifts and Pocky Day Surprises
    description: The duo discovers snacks, Pocky boxes, and welcome notes left in
      the studio by senior Hololive member Kazama Iroha, and Nessen Mera presents
      AZKi with a special 5K pin badge.
    song_title: null
    song_artist: null
  - start: 07:40
    end: '12:35'
    title: Introduction to Zenrin Highway Trading Cards
    description: AZKi and Nessen Mera explain the Zenrin 'Map Design GALLERY CARD
      / General National Highway' trading card product, outlining the rarity system
      based on road length (common, uncommon, rare, super rare).
    song_title: null
    song_artist: null
  - start: '12:35'
    end: '47:00'
    title: Opening Highway Series 1 Packs
    description: The hosts open multiple packs of Highway Series 1, discussing regional
      topography, mountain crossings, coastal routes, and discovering a Super Rare
      '4-ren Onigiri' (four-consecutive highway sign) card.
    song_title: null
    song_artist: null
  - start: '47:00'
    end: '64:10'
    title: Opening Highway Series 2 Packs
    description: The hosts open packs of Highway Series 2, exploring unique routes
      across Awaji Island, Lake Biwa Bridge, scenic coastal lines, and short urban/airport
      stretches.
    song_title: null
    song_artist: null
  - start: '64:10'
    end: '71:15'
    title: Reflections and Closing
    description: AZKi and Nessen Mera review their pulled rare cards, share thoughts
      on geography and road trivia, express a desire to study maps more deeply, and
      sign off with their signature closing.
    song_title: null
    song_artist: null
