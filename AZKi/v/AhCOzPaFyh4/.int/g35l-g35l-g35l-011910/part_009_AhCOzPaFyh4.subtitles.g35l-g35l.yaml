    title: Introduction to Zenrin Highway Trading Cards
    description: AZKi and Nessen Mera explain the Zenrin 'Map Design GALLERY CARD
      / General National Highway' trading card product, outlining the rarity system
      based on road length (common, uncommon, rare, super rare).
    song_title: null
    song_artist: null
  - start: '12:35'
    end: '47:00'
    title: Opening Highway Series 1 Packs
    description: The hosts open multiple packs of Highway Series 1, discussing regional
      topography, mountain crossings, coastal routes, and discovering a Super Rare
      '4-ren Onigiri' (four-consecutive highway sign) card.
