  domain_glossary:
  - term: 国道トレカ
    meaning: Trading cards produced by map company Zenrin featuring Japanese national
      highways with geographic and trivia details.
  - term: ジオゲッサー
    meaning: GeoGuessr, a popular geography browser game where players guess their
      location on a map based on street view imagery.
  - term: おにぎり
    meaning: Nickname for the triangular shield sign designating national highways
      in Japan.
  - term: 4連おにぎり
    meaning: A rare intersection sign and Super Rare card depicting four national
      highway route shields converging at a single intersection.
  - term: 海上区間
    meaning: Sections of national highways that traverse water via ferries or bridges
      where there is no continuous land road.
  - term: 酷道
    meaning: A Japanese pun on 国道 (kokudō, national highway) meaning 'cruel road',
      referring to extremely narrow, rugged, or impassable mountain passes.
  - term: アソビ★まわり隊！
    meaning: A Hololive unit/group that Necchi Mera belongs to.
