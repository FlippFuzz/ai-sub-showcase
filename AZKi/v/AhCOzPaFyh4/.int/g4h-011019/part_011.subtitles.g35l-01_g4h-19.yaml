    title: Opening Pack Series 2
    description: Switching to Zenrin National Highway Series 2 packs, they open cards
      featuring routes in Hokkaido, Shikoku, Niigata, and Okinawa, marveling at sea-crossing
      highway sections (kaijo kukan).
    song_title: null
    song_artist: null
