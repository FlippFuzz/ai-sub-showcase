global_summary:
  overall_summary: This video features an off-collab stream on the AZKi Channel titled
    '#あずめら 国道トレカ開封！？～推し国道を見つけよう～', starring Hololive 0th Generation virtual singer
    AZKi and newcomer Hololive talent Netsuchi Mera. It marks their first-ever in-person
    offline collaboration. The duo opens packs of Zenrin's popular 'Map Design GALLERY
    CARD / General National Highway' trading cards, exploring unique geographic features,
    national highway routes across Japan, steep mountain passes ('kokudo' / bad roads),
    maritime highway sections, and rare collector cards like the 4-consecutive onigiri
    sign while sharing humorous commentary and geographical trivia.
  chapters:
  - start: 00:00
    end: 02:40
    title: Opening & First Offline Collab Greeting
    description: AZKi and Netsuchi Mera welcome viewers to their first-ever offline
      collaboration stream (#あずめら) and read surprise messages and snacks left behind
      by Kazama Iroha.
    song_title: null
    song_artist: null
  - start: 02:40
    end: 09:50
    title: Souvenir Exchange & Highway Card Explanation
    description: Mera presents AZKi with a 5K pin badge as an impromptu souvenir,
      and AZKi introduces Zenrin's National Highway Trading Cards ('国道トレカ'), explaining
      rarities and categories.
    song_title: null
    song_artist: null
  - start: 09:50
    end: '22:30'
    title: Opening Pack Series 1 (Part 1)
    description: The duo opens the first series of Zenrin National Highway card packs,
      discovering various routes across Kyushu, Shikoku, Shizuoka, and pulling a sparkly
      rare card for Route 467.
    song_title: null
    song_artist: null
  - start: '22:30'
    end: '47:00'
    title: Opening Pack Series 1 (Part 2)
    description: Continuing with Series 1 packs, they encounter treacherous mountain
      passes ('kokudo'), historic routes, and pull the ultimate Super Rare card featuring
      the 4-consecutive onigiri intersection sign.
    song_title: null
    song_artist: null
  - start: '47:00'
    end: '64:10'
    title: Opening Pack Series 2
    description: Switching to Zenrin National Highway Series 2 packs, they open cards
      featuring routes in Hokkaido, Shikoku, Niigata, and Okinawa, marveling at sea-crossing
      highway sections (kaijo kukan).
    song_title: null
    song_artist: null
  - start: '64:10'
    end: '71:28'
    title: Reflections, Favorite Highways & Outro
    description: The duo reviews their favorite highways discovered during the stream
