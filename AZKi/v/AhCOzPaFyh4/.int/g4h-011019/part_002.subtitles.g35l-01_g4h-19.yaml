  domain_glossary:
  - term: 国道トレカ
    meaning: Official nickname for 'Map Design GALLERY CARD / 一般国道', a trading card
      series created by mapping company Zenrin featuring Japan's national highways.
  - term: 酷道
    meaning: A pun on '国道' (national highway) meaning 'harsh/bad road', referring
      to extremely narrow, unpaved, or mountainous national highway sections that
      are extremely difficult to drive through.
  - term: ジオゲッサー
    meaning: GeoGuessr, a geography browser game where players are placed in random
      Google Street View locations and must guess their position on a world or Japan
      map.
  - term: あずめら
    meaning: The official collab duo name and hashtag for AZKi and Netsuchi Mera.
  - term: 開拓者
    meaning: Kaitakusha (Pioneers), the official fandom name for AZKi's supporters.
  - term: 海上区間
    meaning: Kaijo kukan, sections of national highways that traverse oceans or lakes
      via ferries or marine bridges.
  - term: おにぎりマーク
    meaning: Onigiri mark, the triangular road sign shape used for national highways
      in Japan.
  - term: 下克上
    meaning: Gekokujou, enthusiast slang within highway fan communities for rare sign
      alignments where lower-numbered route signs appear above higher-numbered ones.
