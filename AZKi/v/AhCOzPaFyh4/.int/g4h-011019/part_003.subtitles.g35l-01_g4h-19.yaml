global_summary:
  overall_summary: This video features an off-collab stream on the AZKi Channel titled
    '#あずめら 国道トレカ開封！？～推し国道を見つけよう～', starring Hololive 0th Generation virtual singer
    AZKi and newcomer Hololive talent Netsuchi Mera. It marks their first-ever in-person
    offline collaboration. The duo opens packs of Zenrin's popular 'Map Design GALLERY
    CARD / General National Highway' trading cards, exploring unique geographic features,
    national highway routes across Japan, steep mountain passes ('kokudo' / bad roads),
    maritime highway sections, and rare collector cards like the 4-consecutive onigiri
    sign while sharing humorous commentary and geographical trivia.
