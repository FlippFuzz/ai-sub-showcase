    outfit debut (ゆるふわ私服衣装), guest duet performances with various Hololive talents
    (Kazama Iroha, Yukihana Lamy, Shirogane Noel, Tsunomaki Watame, Inugami Korone,
    Sakura Miko, and FUWAMOCO), major announcements regarding her dual EPs 'Re:Start'
    and 'Re:Birth', the digital release of her new song 'Mirai Campanella', and a
    post-show romantic umbrella/Glico date storyline concluding with a surprise birthday
    celebration.
