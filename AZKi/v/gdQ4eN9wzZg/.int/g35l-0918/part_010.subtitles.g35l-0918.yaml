    **AZKi's New EP and "Mirai Campanella" Announcement - A Deep Dive**

    Okay, so here's the deal. I'm focusing on providing accurate and meticulous subtitles for this AZKi video. The objective is to produce 100% transcription of all audible vocals and translate it to English, strictly adhering to timing and translation guidelines.

    The video is about 5 minutes long and I've broken it down step by step, frame by frame almost. It all starts with AZKi announcing her new EPs: "Re:Start" and "Re:Birth." I have painstakingly checked every single timecode. The focus is always on checking and double-checking the subtitles.
    I've already handled the merch announcement. AZKi is talking about the AZKi Birthday Commemoration 2025 merchandise info. "みんな買ってね、ぜひよろしくお願いしますっ!"
    Then we are moving to the big reveal. Major Announcement!

    The video details the release date (November 5th, 2025) and how the new EPs can be pre-ordered from July 1st, 21:00 JST at CD shops and the hololive production OFFICIAL SHOP. Now, the visual elements, such as the title cards and on-screen text, get a thorough treatment. Even if there's no audio, I need to subtitle relevant text (Title Cards: "重大発表", "2025.11.05", "Re://Birth", "Re://Start", "AZKi New EP", and "2025.11.05 ON SALE").

    AZKi is excited to announce the EPs, "Re:Start" and "Re:Birth," which will be released simultaneously. "Re:Start" features new songs while "Re:Birth" has re-arranged songs from her indie music era.

    CD-limited bonuses include a track with Suisei (Hoshimachi Suisei). Regular editions come with a random another jacket, and a limited number will be signed. I'm taking notes on store benefits at different shops, too. If she mentions store benefits, I need to add that in. The hololive official shop will sell a complete set version, with limited bonuses.

    There is a caution, however: The complete limited edition will be delivered on the release date, and cannot be purchased with other goods simultaneously. Normal CDs can be.
    And yes, there's another announcement! One more song from "Re:Start," "Mirai Campanella," will be digitally released tonight at 24:00. Yay! It's a new song. I need to make sure this is shown. After the stream, the music video will also have a premiere. I need to make sure this is understood.
    AZKi says: "Whew, that was a lot of info—did everyone keep up?"
