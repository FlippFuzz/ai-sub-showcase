- start: '03:27.000'
  end: '03:32.000'
  original: そろそろ泣いてもいいですか？
  english: Can I finally start crying now?
- start: '03:33.000'
  end: '03:39.000'
  original: 繰り返す脈の 行き着く先まで
  english: Until the destination of my repeating pulse,
- start: '03:39.500'
  end: '03:45.000'
  original: 私の全部に 君がいた
  english: You were in every part of me.
- start: '03:46.000'
  end: '03:53.000'
  original: もう二度と 君に触れられない こんな身体なら意味はなくて
