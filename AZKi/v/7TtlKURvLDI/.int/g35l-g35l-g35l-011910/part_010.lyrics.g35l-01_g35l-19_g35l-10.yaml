  original: AZKi活動5周年記念グッズ、発売しまーす！
  english: AZKi's 5th anniversary merchandise is now on sale!
- start: '00:07.820'
  end: '00:11.080'
  original: それでは内容を紹介していきたいと思います！
  english: Now, let's introduce the items!
- start: '00:11.080'
  end: '00:14.380'
  original: まずアクリルパネル！こちら！
  english: First, the acrylic panel! Here it is!
- start: '00:14.380'
  end: '00:22.480'
  original: イラストはびすけ先生に描いていただきました！
  english: The illustration was drawn by Piisuke-sensei!
- start: '00:22.480'
  end: '00:28.180'
  original: 自然の中で歌っているAZKiを明るく透明感のあるイメージで描いていただきました！
  english: She drew AZKi singing in nature with a bright and transparent feel!
- start: '00:28.180'
  end: '00:32.220'
  original: 新しい衣装のAZKiをぜひお家で飾ってください！
  english: Please decorate your home with this new outfit AZKi!
- start: '00:32.220'
  end: '00:35.380'
  original: そして次、開拓者証明書！
  english: And next, the Pioneer Certificate!
- start: '00:35.380'
  end: '00:44.080'
  original: こちらもイラストはびすけ先生、あなたが開拓者であることを証明するカードになっております！
  english: The illustration is also by Piisuke-sensei. It's a card proving that you
    are a pioneer!
- start: '00:44.080'
  end: '00:49.120'
  original: シリアルナンバーと裏面にはですね、AZKiのメッセージが入っています！
  english: It features a serial number and a message from AZKi on the back!
- start: '00:49.120'
  end: '00:54.180'
  original: そして次、ランダムアクリルキーホルダー！
  english: And next, the random acrylic keychains!
- start: '00:54.180'
  end: '01:00.080'
  original: こちらの可愛いミニキャラのイラストは夢ノ内先生に描いていただきました！
  english: The cute chibi illustrations were drawn by Yumeno Uchi-sensei!
- start: '01:00.080'
  end: '01:10.000'
  original: いろんな今回の新衣装と普段の衣装のバージョンが4パターンあります！
  english: There are four different versions featuring the new and everyday outfits!
- start: '01:10.000'
  end: '01:15.000'
  original: こちらのAZKiのアクリルキーホルダー、飾ったりバッグにつけたりお出かけしてください！
  english: Please display these AZKi acrylic keychains or attach them to your bag
    when you go out!
- start: '01:15.000'
  end: '01:17.000'
  original: そして次！
  english: And next!
- start: '01:17.000'
  end: '01:21.000'
  original: 開拓者ぬいぐるみ！
  english: The Pioneer Plushie!
- start: '01:21.000'
  end: '01:26.000'
  original: 開拓者3D化記念して開拓者がいよいよぬいぐるみになりました！
  english: To commemorate the pioneers getting 3D models, the pioneer has finally
    become a plushie!
- start: '01:26.000'
  end: '01:29.000'
  original: とっても可愛くできております！
  english: It turned out super cute!
- start: '01:29.000'
  end: '01:36.000'
  original: ホロライブフレンズのAZあずぬいと一緒に並べたりして、楽しんでお出かけしてほしいなと思います！
  english: I hope you'll display it alongside the Hololive Friends AZnui and take
    them out with you!
- start: '01:36.000'
  end: '01:38.000'
  original: そして次！
  english: And next!
- start: '01:38.000'
  end: '01:46.000'
  original: 記念ボイス！新しいこちらの衣装に合わせた内容のシチュエーションボイスとなっております！
  english: Commemorative voice packs! These are situation voice tracks tailored to
    this new outfit!
- start: '01:46.000'
  end: '01:50.000'
  original: 気持ちを込めて収録したのでぜひ聞いてください！
  english: I recorded them with all my heart, so please listen to them!
- start: '01:50.000'
  end: '01:53.000'
  original: そして、なんと！
  english: And what's more!
- start: '01:53.000'
  end: '02:00.000'
  original: フルセットご入手いただけたら、こちら！直筆サイン入りのポストカードをなんと全員に書きます！
  english: If you get the full set, look at this! I will personally write hand-signed
    postcards for everyone!
- start: '02:00.000'
  end: '02:05.000'
  original: AZKi頑張ります！
  english: AZKi will do her best!
- start: '02:05.000'
  end: '02:09.000'
  original: メッセージは箱推して届いてからのお楽しみです！
  english: The message will be a surprise when it arrives!
- start: '02:09.000'
  end: '02:18.000'
  original: そして、特製ボイスもついてきます！5周年ありがたのメッセージ、感謝の気持ちを皆さんにお届けできればと思っています！
  english: Plus, a special bonus voice pack is included! I hope to deliver my 5th-anniversary
    message of gratitude to everyone!
- start: '02:18.000'
  end: '02:22.000'
  original: 受付はこの後21時からです！よろしくお願いします！
  english: Orders start tonight at 21:00! Thank you for your support!
- start: '02:22.000'
  end: '02:24.000'
  original: そして、まだあります！
  english: And there's more!
- start: '02:24.000'
  end: '02:26.000'
  original: 嬉しいお知らせその2！
  english: Happy announcement part two!
- start: '02:26.000'
  end: '02:35.000'
  original: LINEスタンプ、ホロライブ公式スタンプ「AZKi」が本日より販売開始いたします！
  english: The official Hololive LINE stamp, 'AZKi', goes on sale starting today!
- start: '02:35.000'
  end: '02:44.000'
  original: おはAZKiから親AZKiまで普段使いしやすい全24種類、ぜひゲットしてたくさん使ってください！
  english: There are 24 designs ranging from 'Oha-AZKi' to 'Oya-AZKi' for everyday
    use. Please get them and use them a lot!
- start: '02:44.000'
  end: '02:48.000'
  original: ということで、お知らせまだあります！
  english: And so, there are still more announcements!
- start: '02:48.000'
  end: '02:51.000'
  original: こちらは、告知のおさらいになります！
  english: This is a recap of the announcements!
- start: '02:51.000'
  end: '03:00.000'
  original: ソラAZメジャーデビューライブ「First Gravity」2024年1月27日土曜日、クラブチッタにて開催いたします！
  english: The SorAZ Major Debut Live 'First Gravity' will be held on Saturday, January
    27, 2024, at CLUB CITTA'!
- start: '03:00.000'
  end: '03:07.000'
  original: こちらですね、現地チケットの1次先行が11月19日23時59分まで！
  english: Advance ticket sales for the venue are open until November 19 at 23:59!
- start: '03:07.000'
  end: '03:22.000'
  original: そして、公式グッズもございます！11月26日23時59分まで販売となります！ライブ当日までにお届けいたしますので、詳しくは概要欄をご覧ください！ソラAZのリアルライブよろしくお願いします！
  english: Official merchandise is also available until November 26 at 23:59! They
    will be delivered by the day of the live, so please check the description box
    for details! We look forward to seeing you at SorAZ's live!
- start: '03:22.000'
  end: '03:32.000'
  original: ということで、えー怒涛の告知でしたけれども、次の曲で最後になります！
  english: And with that, those were a whirlwind of announcements, but our next song
    will be the last!
- start: '03:32.000'
  end: '03:40.000'
  original: 改めて5周年を迎えられたことに感謝してます！このルートにたどり着いたことは間違いじゃなかった！
  english: Once again, I'm so grateful to have reached our 5th anniversary! Arriving
    at this path was not a mistake!
- start: '03:40.000'
  end: '03:43.000'
  original: 開拓者のみんなが連れてきてくれました！
  english: All of you pioneers brought me here!
- start: '03:43.000'
  end: '03:51.000'
  original: だから、えー今日は最後にこの曲を届けます！この曲からAZKiは始まりました！
  english: That's why I'll perform this song for you today as our final piece! AZKi
    started with this song!
- start: '03:51.000'
  end: '04:02.000'
  original: 今日この日をAZKiと一緒に過ごしてくれてありがとう！みんなと一緒にこれからも聞いてください！
  english: Thank you for spending this special day with AZKi! Please keep listening
    together with everyone from now on!
- start: '04:02.000'
  end: '04:05.000'
  original: Creating world！
  english: Creating world!
detected_performances:
- title: Creating world
  artist: AZKi
  start: 04:02
  end: 05:00
