    tracks and covers, guest appearances by Amane Kanata, Sakamata Chloe, and Kazama
    Iroha, the debut of AZKi's elegant new concert dress 3D costume, and announcements
    regarding her 5th-anniversary merchandise, LINE stickers, and upcoming major debut
    live tour 'First Gravity'.
