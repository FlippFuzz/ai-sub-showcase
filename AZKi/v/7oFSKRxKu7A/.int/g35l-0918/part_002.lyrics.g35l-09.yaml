name: part_002
total_attempts: 1
video_duration_ms: 300008
lyrics_prompt_version: 9
response:
  global_summary: The video features a supporter roll and promotional slideshow for
    VTubers AZKi and Tokino Sora (SorAZ), accompanied continuously by AZKi's song
    'エントロピー' (Entropy).
  scenes:
  - start: '00:00.000'
    end: '00:13.800'
    description: Supporter list screen displaying participant names for the bento
      sponsorship project, with AZKi's song 'エントロピー' playing.
    contains_vocal_music: true
    song_title: エントロピー
    original_artist: null
    performer_in_video: AZKi
    original_language: Japanese
    reference_lyrics_og: |-
      青くて澄んだ空をぎゅっと抱きしめて
      今日も快晴だ
      「知らない」はきっと怖くて
      「わかる」はきっと安心できる
      でも私が選ぶのは「ありえない」の向こう側
      青くて澄んだ空を胸いっぱい吸い込んで
      透明になるまで 声を鳴らせ
      私が誰かを照らせるなら
      誰かの救いになったら
      奇跡の一つでも起こせるような気がするよ
      歌声は溶けて朝になる
      悲しみごと抱いて微熱を帯びる
      そうだ、この気持ちに名を付けるなら
      「アツい」はきっと端から冷めて
      「定番」になれば御の字
      せっかくならみんなでさ 笑った顔見せ合っていこうぜ
      青くて春な夢を胸いっぱい背負い込んで
      熟れたその分だけ 思い出となれ
      私がただ幸せだったら
      悔やむことさえなかったら
      心に眠った衝動に気付くこともないから
      歌声は涙に寄り添う
      ときめきごと抱いて微熱を帯びる
      そうだ、この気持ちに名を付けるなら
      花が咲けば枯れていく
      種を蒔けば宿っていく
      運命に意味なんて元から無いんじゃない?
      咲き誇れ 散り笑え
      私が誰かを照らせるなら
      誰かの救いになったら
      奇跡の一つでも起こせるような気がするよ
      歌声は溶けて朝になる
      悲しみごと抱いて微熱を帯びる
      空が温かくてきれいだ
      私はなんだか小粋な
      この気持ちが愛おしくて大好きだったんだ
      名前のないこの気持ちを
    reference_lyrics_en: null
