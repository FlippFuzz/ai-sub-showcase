  global_summary: The video is a promotional crossfade and information trailer for
    SorAZ (Tokino Sora and AZKi), featuring continuous background music of AZKi's
    song 'Entropy' (エントロピー) while displaying various album releases, cover song announcements,
    live event merchandise bonuses, and supporter donor lists across recurring visual
    cycles.
  scenes:
  - start: '00:00.000'
    end: '00:22.000'
    description: Promotional screen showing Major Debut Live First Gravity CD purchase
      bonus information and initial participant donor list, with AZKi singing 'Entropy'.
    contains_vocal_music: true
    song_title: エントロピー
    original_artist: 瀬名航
    performer_in_video: AZKi
    original_language: Japanese
    reference_lyrics_og: |-
      青くて澄んだ空をぎゅっと抱きしめて 今日も快晴だ
      「知らない」はきっと怖くて 「わかる」はきっと安心できる
      でも私が選ぶのは「ありえない」の向こう側
      青くて澄んだ空を胸いっぱい吸い込んで 透明になるまで 声を鳴らせ
      私が誰かを照らせるなら 誰かの救いになったら
      奇跡の一つでも起こせるような気がするよ
      歌声は溶けて朝になる 悲しみごと抱いて微熱を帯びる
      そうだ、この気持ちに名を付けるなら
      「アツい」はきっと端から冷めて 「定番」になれば御の字
      せっかくならみんなでさ 笑った顔見せ合っていこうぜ
      青くて春な夢を胸いっぱい背負い込んで 熟れたその分だけ 思い出となれ
      私がただ幸せだったら 悔やむことさえなかったら
      心に眠った衝動に気付くこともないから
      歌声は涙に寄り添う ときめきごと抱いて微熱を帯びる
      そうだ、この気持ちに名を付けるなら
      花が咲けば枯れていく 種を蒔けば宿っていく
      運命に意味なんて元から無いんじゃない?
      咲き誇れ 散り笑え
      私が誰かを照らせるなら 誰かの救いになったら
      奇跡の一つでも起こせるような気がするよ
      歌声は溶けて朝になる 悲しみごと抱いて微熱を帯びる
      空が温かくてきれいだ 私はなんだか小粋な
      この気持ちが愛おしくて大好きだったんだ
      名前のないこの気持ちを
    reference_lyrics_en: null
