  global_summary: The video is a promotional montage and sponsor acknowledgment reel
    for SorAZ (Tokino Sora and AZKi), featuring various album releases, merchandise,
    and participant lists, accompanied by T.M.Revolution's song 'Albireo -アルビレオ-'
