    reference_lyrics_og: |-
      電波テンポアップして絶賛感電中!
      あなたにもわすれたいことかなしいことあるのかしらね
      識らない映画なのに涙をながすのはドラマチックが足りていないからよ
      そんな愚にも付かないことくだらないこと考えてばかりね
      雨が上がれば愛もその横顔も誰かのものになるのでしょう
      嘘っぱちのファンデーションも全部今夜のためよ
      なのに一体全体如何して何故?
      不安定なカンテラ何処まで行くの
      あなた一切合切放り去ってもう
      冗談じゃあないわ
      トウキョウ・シャンディ・ランデヴ
      その時が 来たって如何にもならないぜ
      曖昧な本当なんてメランコリ化するだけ
      あたしをさあ掻攫って今テイクオンミー
    reference_lyrics_en: |-
      up the tempo of the frequency for shocking electricity !
      i wonder if you also have some sad memories that you want to forget ?
      even unrelatable movies make me cry due to the lack of dramatic moments between us
      all i ever think about is absurd and silly things like that
      once the rain stops , love and this side view will belong to someone else
      this foundation of total lies was built just for tonight
      but what in the world , how on earth , why the hell ?
      how far can we go with this flickering lantern ?
      you just threw away the whole kit and caboodle
      you've got to be kidding me !
      tokyo shandy rendezvous
      nothing can be done when that moment arrives
      this unclear reality only makes me more melancholy
      come snatch me up and right now , take on me
      tokyo shandy rendezvous
      nothing can be done when that moment arrives
      this unclear reality only makes me more melancholy
      come snatch me up and right now , take on me , yes
