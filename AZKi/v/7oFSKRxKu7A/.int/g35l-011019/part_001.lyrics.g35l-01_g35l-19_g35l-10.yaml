  english: An extraordinary, super self-confident self, only once a year!
- start: '01:58.336'
  end: '02:02.936'
  original: いっしゅーいっしゅー跳んでいくぞ 胸の高鳴り消えはもうすぐ
  english: Leap by leap, we soar away! The pounding in our chests will soon fade.
- start: '02:03.206'
  end: '02:08.016'
  original: この一歩一歩を楽しんでいくぞ それじゃみんなで大一歩！
  english: Enjoying every single step forward, let's take a giant leap together!
- start: '02:08.886'
  end: '02:13.066'
  original: 「可愛くてごめん」仕草と見といてくださんな 転んだり迷ったり不意足のせ
  english: '"So sorry for being so cute," just bear with it and watch me! Stumbling,
    getting lost, that''s all just clumsiness.'
- start: '02:13.916'
  end: '02:18.846'
  original: もうちょっと付き合ってくださいませ 全力疾走なとき逃げ足なんてのは僕はないぜ
  english: Please stay with me a little longer! When going all out, running away is
    not an option for me.
- start: '02:19.466'
  end: '02:24.016'
  original: ずっと見ていてくださんな 貰ってる外してる未来だませ
  english: Keep watching over me! Looking ahead at the future we've unlocked...
- start: '02:24.716'
  end: '02:29.216'
  original: よーぜふぉーをご覧くださんな とめどきのころに退屈なんてのはこっからいっせーのせ
  english: Check out the Josepho... when boredom hits us, right from here, ready,
    set, go!
- start: '02:30.346'
  end: '02:34.026'
  original: とびきりな めちゃジスン 年一回でしょ
  english: An extraordinary, super self-confident self, only once a year!
- start: '02:35.536'
  end: '02:38.016'
  original: スーパーアソビバイェ！
  english: Super play bye-bye!
- start: '03:18.016'
  end: '03:22.016'
  original: こんな真っ暗闇の中 外のプライベートむくるくる回って
  english: Inside this pitch-black darkness, spinning around in the private outside
    world...
- start: '03:23.016'
  end: '03:27.516'
  original: とぼけた風に敬意を込めて 傷つかずに中折ってく
  english: With feigned innocence and respect, breaking through without getting hurt...
- start: '03:29.016'
  end: '03:33.016'
  original: そんな体で君を見れば 君の僕の時間は
  english: Looking at you with such a body, the time of you and me...
- start: '03:34.016'
  end: '03:38.516'
  original: 違ってなんか僕だけ合わせてた
  english: Something felt different, and only I was adjusting to it.
- start: '03:40.016'
  end: '03:44.016'
  original: うわうわうわ... 気を抜くとすぐに 歪んだ重力は
  english: Whoa, whoa, whoa... If I let my guard down, the distorted gravity...
- start: '03:45.016'
  end: '03:49.016'
  original: 何気なくものに飲み込まれてよ
  english: Will swallow things up so casually.
- start: '03:52.016'
  end: '03:55.016'
  original: へいへいれんこんそろそろ常識がもうもっとたくってんだ
  english: Hey hey... soon common sense will pile up even more.
- start: '04:01.016'
  end: '04:05.016'
  original: 果てのない地図... 一歩一歩壊して君のインプットで
  english: An endless map... breaking it step by step with your input.
- start: '04:06.016'
  end: '04:10.016'
  original: ハイパーテクノロジーで 地の果てさらに超えて無限に ああ
  english: With hyper-technology, going beyond the ends of the earth infinitely, ah...
- start: '04:11.016'
  end: '04:15.016'
  original: 愛し合えていただけだわわわわ...
  english: We were just loving each other, wa-wa-wa...
- start: '04:28.016'
  end: '04:31.516'
  original: ゆっくり髪をかきあげる
  english: Slowly brushing back my hair...
- start: '04:33.016'
  end: '04:37.016'
  original: 君を見ては孤独 早くなる
  english: Whenever I look at you, my loneliness accelerates.
- start: '04:38.016'
  end: '04:42.016'
  original: ずっと昔からの続く最大の謎
  english: The greatest mystery continuing from long ago...
- start: '04:44.016'
  end: '04:48.016'
  original: みんなほおずして愛し合ってさ
  english: Everyone holding each other's cheeks and loving one another...
- start: '04:50.016'
  end: '04:53.016'
  original: まったくのゼロから 生まれたこの感情
  english: This emotion born from absolute zero...
- start: '04:55.016'
  end: '04:59.016'
  original: 対称性を壊したんだよ
  english: Has shattered the symmetry.
