    reference_lyrics_og: |-
      あっ 光った流れ星願いそびれ もう一回を待った
      あっ という間に夜が明け もういいやこのまんま散歩しよ
      あっ 横切ったノラネコ 色は黒?でも可愛いから優勝
      パン屋さんがひらくのは7時あと10分なにしよっかな 遠回り
      もーしもし 亀さんよ 今だけは君になりたい
      ぴょん って飛んだうさぎさん ひょんなこと 雹がふる 豹に出会う
      理屈だってあってないようなもんで ファンタジー浮かべ今日もニヒる
      そこの街灯すらも意外と 僕がイヤフォン外したら歌い出す
      冬にだけ可視化される声の温度が
      春や夏や秋はどこへと消えてしまうのか
      きっとそこにある
      触れる 揺らぐ 気づいて 気づいて って
      まるで心の中みたい
      冬にだけ可視化される声の温度が
      春や夏や秋は誰かに届いてるのかな
      だってここにない
      消える 消える 暑さも 寒さも
      全部「ちょうどいい」の前触れ
      「わっ」 瞬間、風が吹いた
      どこかの桶屋が儲かったのだろう
      彼女が大事に認めた特大級のラブレター
      空を舞って、伝って、僕が拾う
      そんな運命待ちを途中下車
      僕は僕の呼吸を重ねる
      長い長い旅ゆっくりと進んでこ
      何でも解決してくれる「時間」ってやつが相棒だから
      息を吸って
      長い長い旅おなかへった
      そろそろ......
      焼きたてのパンの香りに
      思わず、亀もうさぎに乗る
      街灯も瞬いて眠った
      入れ替わり目を覚ました 鳥たち
      もしもし 思し召し
      どきどきは きせき
      帽子召し はじまり はじまり
      おーしかし はじまり はじまり
      おーしかし
      「おいしそ」
    reference_lyrics_en: null
