  thoughts: |+
    **AZKi's Birthday Stream - EP Release & Song Announcement**

    Okay, so here's the deal: I'm really excited about this. First, a quick note about the merch from my 2025 birthday celebration – be sure to check it out and grab some!

    I have a major announcement: "Re://Start" and "Re://Birth" are the new EPs coming out on November 5, 2025! "Re://Start" features all new songs showcasing my evolving style and the second, "Re://Birth," is a collection of re-arranged versions of my INNK Music-era songs. We're launching them simultaneously for the first time. Pre-orders start on July 1st at 21:00 on the Hololive Production Official Shop and at CD stores nationwide.

    "Re://Start" is focused on new songs and "Re://Birth" features revamped tracks from my INNK Music days. Both EPs will have exclusive CD bonus tracks: each includes a different version of "The Last Frontier" that I recorded with Suisei. And, if you buy the standard edition of the CD, you could get a random alternate jacket. What's more, a limited number of these might have my signature!

    There are CD bonuses from different shops, but the designs will come later. We also have a complete edition set on the Hololive Official Shop! It contains lots of exclusive bonuses that you can only find there, but they're limited, so don't delay!

    There's one important note about purchasing from the Hololive Official Shop: if you order the limited edition Complete Edition, it will ship on release day, and cannot be combined with other merchandise. Standard editions can be bought with other items, but they might arrive after the release date. Details on the website.

    And finally, I have another announcement! The digital release of "Mirai Campanella," a song from my "Re://Start" EP is coming out today at 24:00. Also, after the stream, there's going to be a premiere of the music video! So please look out for that!

    Thanks for hanging in there with all the information. And now, the live is about to end. I am going to end with a performance of "Mirai Campanella". Please enjoy!

    *(Song: Mirai Campanella lyrics with more emphasis, until the end)*



