  - start: '01:17.915'
    end: '01:21.575'
    original: 楽しげなひとつ隣の君
    english: You enjoyed yourself right by my side,
  - start: '01:22.015'
    end: '01:27.325'
    original: 私は何も言えなくて
    english: while I couldn't say a single thing.
  - start: '01:27.675'
    end: '01:31.065'
    original: 本当はずっと君のことをどこかでわかっていた
