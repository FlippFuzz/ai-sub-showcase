    english: '"You always say such nice things sometimes."'
  - start: '00:17.395'
    end: '00:20.315'
    original: なんてみんなして言って笑った
    english: Everyone laughed while saying that.
  - start: '00:20.315'
    end: '00:26.545'
    original: 明かりもない道をバカみたいにシャシャイて歩いた
    english: We walked foolishly down a path with no light.
  - start: '00:27.705'
    end: '00:30.295'
    original: 抱え込んだ孤独や不安に
    english: Hugging all our loneliness and anxiety,
  - start: '00:30.295'
    end: '00:35.335'
    original: 押し潰されないように真っ暗な世界から見上げた
    english: so they wouldn't crush us down.
  - start: '00:35.795'
    end: '00:38.935'
    original: 夜空は星が降るようで
    english: The night sky was like falling stars.
  - start: '00:39.125'
    end: '00:41.875'
    original: いつからだろう 君のことを
    english: I wonder when it started...
  - start: '00:42.505'
    end: '00:48.335'
    original: 追いかける私がいた
    english: I was the one chasing after you.
  - start: '00:49.005'
    end: '00:54.675'
    original: どうかがおねがい 驚かないで聞いてよ 私のこの想いを
    english: Please don't be shocked when you hear my feelings.
  - start: '00:55.335'
    end: '00:57.175'
    original: 「あれがデネブ、アルタイル、ベガ」
    english: '"That''s Deneb, Altair, Vega..."'
  - start: '00:57.295'
    end: '01:02.135'
    original: 君は指さす夏の大三角
    english: You pointed out the Summer Triangle.
  - start: '01:02.325'
    end: '01:05.415'
    original: 覚えて空を見る
    english: I remember and look up at the sky.
  - start: '01:06.185'
    end: '01:12.785'
