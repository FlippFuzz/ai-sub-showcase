    reference_lyrics_og: |-
      名もなきこの場所で 開いた衝動の花
      静かな始まりを告げる
      幼きあこがれが 確かな熱を求めて
      この空にシグナルを放つよ
      繰り返していく日々を背に
      はばたく瞬間を探してる
      孤独な願いだとしても
      まだ見ぬ世界へ 限界を超えて行きたい
      体中でこの夢が あふれ出すまま
      新しい時代を映す 鮮やかな朝日のように
      強い輝きで咲いた 想いを胸に
    reference_lyrics_en: |-
      In this nameless place, flowers of impulse bloomed
      Announcing a quiet beginning
      My childish longing sought a definite warmth
      Releasing a signal into this sky
      Leaving behind days that repeat themselves
      I'm searching for the moment to take flight
      Even if it's a lonely wish
      I want to go beyond limits into a world yet unseen
      While this dream overflows throughout my body
      Like a vibrant sunrise reflecting a new era
      With feelings blooming in strong brilliance in my chest
