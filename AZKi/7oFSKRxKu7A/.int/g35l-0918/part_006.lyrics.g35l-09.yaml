    **Analyzing the Sora/AZKi Video Medley**

    Okay, so the task is to break down this video, which appears to be a promotional piece or crossfade of Tokino Sora, SorAZ, and AZKi music. I need to identify each song playing and locate the official lyrics. First, let's establish the content. I can see various album covers and promotional images flashing on the screen, like the "STAR Start!" mini album, the "Futurity Step" album, "Kawaikute Gomen" cover art, and AZKi's "3枚目の地図". The audio is the key here.

    It sounds like a continuous medley, which means I have to segment it. I need to pinpoint the timestamps for each song. Let's start with the first segment: from 0:00 to 0:04, the "STAR Start!" album is on screen. Is it "STAR Start!" itself, or something else? I hear lyrics: "いつもなにかを伝えるように歌ってる...", meaning that could be useful to find this track. I will also check the screen for lyrics to identify the songs.

    Now, let's carefully go through the video to identify each track:
    *   0:00-0:04: Song A. The lyrics sound like “いつも 何かを伝えるように 歌ってる”
    *   0:04-0:10: Song B. The lyric sound like “飲み込んだ思い 青い空に飛ばせ...” is featured, could be a Sora cover, maybe "可愛くてごめん".
    *   0:10-0:21: Song C. Lyrics like “繋がるメロディ 流れる星に変わってく...” This could be a SorAZ song.
