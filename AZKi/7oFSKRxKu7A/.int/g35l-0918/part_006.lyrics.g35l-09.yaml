  global_summary: The video is a promotional medley and music preview featuring various
    songs and releases by Hololive virtual talents Tokino Sora, SorAZ, and AZKi. It
    cycles through multiple preview segments of album releases, cover songs, merchandise
    announcements, and participant credits accompanied by continuous background music
    tracks.
  scenes:
  - start: '00:00.000'
    end: '00:04.380'
    description: Promotional display for Tokino Sora's mini album 'STAR Start!' while
      the song 'Hajimari wa Icchokusen' plays.
    contains_vocal_music: true
    song_title: はじまりは一直線
    original_artist: 眞塩楓
    performer_in_video: ときのそら
    original_language: Japanese
    reference_lyrics_og: |-
      生まれて初めて書いたのはなんて字だったかな
      初めて描いた似顔絵は誰の顔だっただろう
      不思議だねもうずいぶん書き留めてきたけど
      最初の一筆は緊張しちゃうな
      夢中になって歩いてまるまった芯の先
      気づけばもう持てないくらい短くなってたね
      知りたいこと、やりたいこと、叶えたい夢さえ
      いつだって一緒に形にしてきたんだ
      裏表紙までいっぱいの思い出とたくさんの愛を
      新たなページへと書き記していくよ
      はじまりは一直線に思い切り
      空まで伸ばしていこう
      はみ出しても寄り道してもいい
      風吹くままに
      おわりまで一直線に描いたら
      きっと見えてくる
    reference_lyrics_en: null
  - start: '00:04.380'
    end: '00:10.150'
    description: Promotional display for Tokino Sora's cover song 'Kawaikute Gomen'.
    contains_vocal_music: true
    song_title: 可愛くてごめん
    original_artist: shito
    performer_in_video: ときのそら
    original_language: Japanese
    reference_lyrics_og: |-
      りが私が私の事を愛して 何が悪いの?嫉妬でしょうか?
      痛いだとか変わってるとか 届きませんね。そのリプライ
      大好きなお洋服 大好きなお化粧で
      お決まりのハーフツイン巻いて お出かけしよ 日傘持って ぼっちだって 幸せだもん!
      Chu! 可愛くてごめん 生まれてきちゃってごめん
      Chu! あざとくてごめん 気になっちゃうよね?ごめん
      Chu! 可愛くてごめん 努力しちゃっててごめん
      Chu! 尊くてごめん 女子力高くてごめん
      ムカついちゃうよね?ざまあw
      貴女は貴女の事だけどうぞ 私に干渉しないでください
      類は友を呼ぶと言うけど... 届きませんね。その陰口
      重い厚底ブーツ お気に入りのリュックで
      崩せない前髪 くしでといて お出かけしよ
      軽い女?ふざけんな 重すぎるっつーの!
      Chu! 可愛くてごめん この時代生きてごめん
      Chu! 目立っててごめん 意識しちゃうよね?ごめん
      Chu! 可愛くてごめん 自分磨きしてごめん
      Chu! ぶりっ子でごめん 虜にしちゃってごめん
      ムカついちゃうでしょ?ざまあw
      趣味の違い 変わり者と バカにされても
      曲げたくない 怖くもない あんたらごとき
      自分の味方は自分でありたい 一番大切にしてあげたい
      理不尽な我慢はさせたくない “それが私”
      Chu! 可愛くてごめん 生まれてきちゃってごめん
      Chu! あざとくてごめん 人生楽しんでごめん
      Chu! 可愛くてごめん 努力しちゃっててごめん
      Chu! 尊くてごめん 女子力高くてごめん
      ムカついちゃうよね?ざまあw
    reference_lyrics_en: |-
      i love myself
      what 's wrong with that ? you just jealous ?
      they say i 'm cringey and odd
      but i 'm not listening to those comments
      with my favorite clothes and favorite makeup on
      and my iconic half - twintails curled
      i 'll go out with my parasol
      i 'm alone , but i 'm happy !
      smooch ! sorry for being so cute
      sorry that i was born
      smooch ! sorry that i 'm calculatingly cute
      sorry that you can't ignore me
      smooch ! sorry for being so cute
      sorry for working hard on myself
      smooch ! sorry for being precious
      smooch ! sorry for being a girly girl
      it annoys you , right ? you deserve it !
      having different tastes ,
      they say i 'm weird and make fun of me
      but i won't change , i 'm not scared of you people
      my greatest ally is myself
      gotta take care of myself
      never accept unreasonableness
      this is me !
      smooch ! sorry for being so cute
      sorry that i was born
      smooch ! sorry that i 'm calculatingly cute
      smooch ! sorry for living my best life
      smooch ! sorry for being so cute
      smooch ! sorry for working hard on myself
      smooch ! sorry for being precious
      smooch ! sorry for being a girly girl
      it annoys you , right ? you deserve it !
