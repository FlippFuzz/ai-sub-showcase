    contains_vocal_music: true
    song_title: MAG-NET
    original_artist: 眞塩楓
    performer_in_video: SorAZ
    original_language: Japanese
    reference_lyrics_og: |-
      ひびく ふれる ひかる
      君 の 声 が
      まっさら な ノート 何 億 なん おく 光年 こう ねん も 彼方 かな た の 宇宙 うちゅう
      無 む 重力 じゅうりょく の 星 ほし じゃ 描 え が け なかっ た よう な
      物語 ものがたり が 生 うまれ てる
      方程式 ほう ていしき に 導 み ちび かれて この 音 おと が 聴 きこえ た 時 とき
      今 いま 、 君 きみ が 感 かん じ てる 心拍 しんぱく 数 すう
      共鳴 きょうめい していく
      感情 かんじょう を 友情 ゆうじょう を 愛情 あいじょう を
      当 あたり前 まえ に 抱い だ ける 奇跡 きせき
      同 おなじ 世界 せ かい で 巡 めぐ りあった の は
      必然 ひつ ぜん の 未来 みらい
      mag-net またね と 手 て を 振 ふれ ば ほら
      繋 つながっ てる から 星座 せい ざ の ように
      mag-net また きっと どんな 場所 ばしょ でも
      惹 ひかれ あう 運命 さだめ の まま
    reference_lyrics_en: null
