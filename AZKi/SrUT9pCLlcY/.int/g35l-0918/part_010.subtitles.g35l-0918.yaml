  thoughts: |+
    **AZKi's 4th Anniversary Merchandise and EP "Pages" Announcement**

    Okay, here's the rundown, as I understand it: Tonight, at 9:00 PM, the 4th-anniversary merchandise goes on sale. I'm really excited about this! The line-up includes the AZKi EP "Pages," a rubber mat, a logo acrylic key holder, a T-shirt, and some voice packs – both commemorative and bonus scenarios. It's a comprehensive set, five items in all, with voice content.

    For the full set, there's an extra special addition: a replicated message postcard, newly illustrated by Chee-sensei! The message itself will be a surprise. And here’s a cool perk, for a limited time, the full set will include my handwritten signature. Since it's around my July birthday, I'll be sure to work hard on each one, and I'd be thrilled if you would grab one!

    Now, for those of you curious about the EP "Pages," as it's the title of today's live show, and also represents a turning of my history into pages. The EP features 4 songs released this year: "afterglow," "petrichor," "canopus," and "equal," plus the bonus track "Creating World (Acoustic Arrange)," making a total of five tracks.

    The EP includes a CD with these songs, a booklet, and the lyric card. What is special about the booklet? It holds a cipher explanation for the "equal" symbol. So if you are interested, please check it out! There are of course, individual items available as well. The rubber mat, like the EP and postcard, is newly illustrated by Chee-sensei, and it looks amazing! It includes designs from my past outfits as well.

    The T-shirt is a comfortable free size, which I selected myself; the AZKi logo is set against a black background. And, there's also a logo acrylic key holder. The AZKi logo has been updated and styled to match this outfit. It’s about 10 cm in size – a convenient size! I really hope you find it useful.

    Remember, all of this goes on sale tonight at 9:00 PM! The link is in the description. So please check it out! Now that I've shared the news, time has flown by, and the next song will be the last. I started on November 15, 2018, and today marks four whole years of activity. I'm extremely grateful to you all for celebrating my 4th anniversary with me. All of your support has brought me to this stage today, plus I get to debut these wonderful outfits. Honestly, I’ve had tough times when I felt like giving up, but you all welcomed me to Hololive warmly, and I can continue singing songs and making music! So, starting tomorrow, it's my 5th year! Thank you truly so much!


