    reference_lyrics_og: |-
      青くて澄んだ空をぎゅっと抱きしめて
      今日も快晴だ
      「知らない」はきっと怖くて
      「わかる」はきっと安心できる
      でも私が選ぶのは「ありえない」の向こう側
      青くて澄んだ空を胸いっぱい吸い込んで
      透明になるまで声を鳴らせ
      私が誰かを照らせるなら
      誰かの救いになったら
      奇跡の一つでも起こせるような気がするよ
      歌声は溶けて朝になる
      悲しみごと抱いて微熱を帯びる
      そうだ、この気持ちに名を付けるなら
      「アツい」はきっと端から冷めて
      「定番」になれば御の字
      せっかくならみんなでさ
      笑った顔見せ合っていこうぜ
      青くて春な夢を胸いっぱい背負い込んで
      熟れたその分だけ思い出となれ
      私がただ幸せだったら
      悔やむことさえなかったら
      心に眠った衝動に気付くこともないから
      歌声は涙に寄り添う
      ときめきごと抱いて微熱を帯びる
      そうだ、この気持ちに名を付けるなら
      花が咲けば枯れていく
      種を蒔けば宿っていく
      運命に意味なんて元から無いんじゃない?
      咲き誇れ 散り笑え
      私が誰かを照らせるなら
      誰かの救いになったら
      奇跡の一つでも起こせるような気がするよ
      歌声は溶けて朝になる
      悲しみごと抱いて微熱を帯びる
      空が温かくてきれいだ
      私はなんだか小粋な
      この気持ちが愛おしくて大好きだったんだ
      名前のないこの気持ちを
    reference_lyrics_en: |-
      紧紧怀抱蔚蓝澄澈的晴空
      今天亦是万里无云
      「未知」想必令人害怕
      「理解」想必带来安心
      但 我 选择 的 是 「 不 可能 」 的 彼方
      深深 吸入 蔚蓝 澄澈 的 晴空
      直至 变为 透明 一刻 让 声音 回响 起来
      倘若 我 可以 照亮 某人
      成为 某人 的 救赎
      感觉 自己 好像 能 创造 出 奇迹 一般
      歌声 渐渐 消融 化为 清晨
      拥抱 悲伤 怀惴 微热
      对了 ， 如果 要 为 这份 心情 命名 的话
      「 炽热 」 想必 从 最初 便 注定 冷却
      若 能 变成 「 经典 」 则 是 再好 不过
      既然 难得 聚首 一堂 不如 大家 齐来 尽 展 开怀 的 笑容 吧
      心中 满怀 青涩 初春 的 梦想
      随着 成熟 化作 回忆
      倘若 我 纯粹 身 在 福中
      甚或是 不 曾 有 过 后悔
      我就不会意识到沉睡心底的冲动
      歌声与泪水相依相随
      拥抱心动怀惴微热
      对了，如果要为这份心情命名的话
      花开终有花落时
      栽苗寄愿生息
      命运本来就不存在什么意义吧？
      灿烂盛开吧笑中凋零吧
      倘若我可以照亮某人
      成为某人的救赎
      感觉自己好像能创造出奇迹一般
      歌声渐渐消融化为清晨
      拥抱悲伤怀惴微热
      晴空暖洋洋的很美丽呢
      我莫名觉得略显雅致的
      这份心情不由令人怜爱让我深爱不已
      这难以具名无名心情
