    **ARK Adventures with Ina, Koyori, and Anya!**

    Okay, here's the deal: I'm watching this clip of Ina playing ARK (looks like Scorched Earth – maybe The Center or modded, with Hololive friends). I'm getting these subtitles down precisely, line by line, so let's get this right. It's a five-minute clip.

    (00:00-00:05): Ina starts with some sound effects and a mumbled "yoshi" (alright!), she seems to be running.
    (00:08-00:13): She's spotted something and says, "Are ka? / Is that it?" Then she grumbles about "bikkuri shite / it got startled..." I think she's trying to take down a Lymantria. And then, at 00:10.8 to 00:12.8, she says: "bikkuri shite... / it got startled..."

    (00:17-00:22): Oof, my body is... and then Koyori's voice! She's craving hydration in the game (Koyori's voice is: "Karada ga suibun motometeru yon / My body is craving water~"), sounds like she's playing too. At 00:22 to 00:24, Ina says: "Etto / Let's see..."
    (00:24-00:28): Ina is fiddling with her inventory, she mutters "e-e-e-e" and finally shouts "Bari bari bari... yoshi!" (Alright!).
    (00:30-00:40): "Hm?" a few crossbow shots.
    (00:41.8-00:43.8): "Sui totta... Yoshi / Extracted water. Alright!" I think she's sucking the water from the moth.
    (00:45-00:50): More crossbow shots, the moth is down!
    (00:52-00:55): Koyori: "Ei, ho, ei, ho" - sounds like she's fighting too, or building. Ina's humming.
    (00:58-01:03): Koyori asks about taming, "Teimu ato san-tai nani ga iru ndaa? / What other three do we need to tame?". Ina doesn't know.
    (01:04-01:06): Anya pipes in! She has a really soft and gentle voice, she says, "Mou, mou hitotsu desu yo, ippiki / There's only one left, just one."
    (01:06-01:10): Koyori and Ina: "A, ato ichi? E, sugoi! / Ah, just one left? Wow, awesome!" and "Ato ichi nani... / What's the last one..." and then "Eetto, tonderuuu! / Umm, it's flying!"
    (01:12-01:16): Koyori gets excited! "Tonderuuu! Sugoi, Ina-senpai ga meccha yatte kureteruuu! / It's flying! Awesome, Ina-senpai is doing so much for us!"
    (01:20): Koyori: "Gozaru no are ga nai aida ni... / While Gozaru's (Iroha) thing isn't..."
    (01:31-01:42): Disaster! Koyori cries: "Yaba, katamatta. ARK ochita... / Oh no, it froze. ARK crashed..." Ina says: "Oh my god," Koyori continues: "ARK ochimachita... / ARK crashed," with an "Ah, nooo..." from Ina and an "Oh my god..." from Koyori.
    (01:50): Ina's trying something, she exclaims "Hora / Take that!"
    (02:05): Clearing throat. Koyori goes on about crashing: "Ochite shimai... modori taikiii / It crashed... waiting to get back in~."
    (02:18-02:20): Ina has some comment, "Ah, nanka... / Ah, it's kind of..."
    (02:23-02:26): Koyori: "A, mata tonjatta / Ah, it crashed again!" (Meaning, the game is still bugging out.)
