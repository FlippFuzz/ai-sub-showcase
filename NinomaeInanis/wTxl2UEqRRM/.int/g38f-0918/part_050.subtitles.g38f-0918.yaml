  thoughts: |+
    **ARK Adventures with the Takodachi**

    Alright, let's break this down. First, I'm watching this clip of Ina playing ARK with the Hololive crew, and I'm immediately thinking, "Subtitles, please!" I need to keep up with the in-game chatter and the Discord call. So, I start piecing together the voices and what's happening.

    Okay, at the beginning, I hear some Japanese and try to identify the speakers. We've got "TONDERU," "Gozaru," "BiBi," Towa, "Raora," and "Biboo" (or Bijou/Bibi) in the game. It sounds like Botan or maybe Subaru is speaking first. I'm noting the Japanese phrases, like "渡って行かなきゃいけないんだよね" ("We have to cross over, right?").

    Then, Ina jumps in, and she's struggling. She's stuck, no water, and it sounds like Bibi is having a rough time, too. I'm listening to Ina carefully, and she's commenting on the grinding, the chat ("Hello"), and the in-game tasks. Towa seems to be having issues as well.

    There's some discussion about a Lightning Wyvern, Bibi getting to borrow it, and something about a Bronto Dossier. I can hear people are talking about Towa retiring. I'm taking the mic, then Ina starts troubleshooting her mic, and checking if the mic is working. The voices are overlapping a bit.

    Then, there's some confusion about the big dinosaurs – Brontosauruses. I catch Raora, being all "Thank you!" as she runs by. Ina's mic is still spotty, and she's trying to figure out if she has push-to-talk on or if she's simply not talking. I'm keeping track of everything: the in-game chat status, the running issues, and the Japanese phrases.

    I'm thinking about the fact that Ina's never used in-game chat, and I'm hearing someone yell into the mic next to me.

    There's a bunch of chatter, the Brontosaurus disappears, and someone's having trouble climbing. I'm thinking, "Well, whatever." Then, Ina mentions she didn't save, and I think that's hilarious.

    The character with Gozaru is difficult to handle. Meanwhile, someone is flying. Raora, I hear, is cat-like. Ina asks if the mic is working.

    Finally, she gets it working, and I hear Ina say "End." We're not able to talk. I think that the point of view in the game is not so helpful. I set up the input output properly. I am having a tough time with this game.

    I'm checking the controls, and it is confusing. Then I test the microphone, and I can hear it working.

    It turns out Ina was too quiet, and she had to pump up the gain.


