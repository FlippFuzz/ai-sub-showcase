  thoughts: "**ARK Adventures: A Chronicle of Tranq Arrows and Troubles**\n\nAlright,\
    \ let's break this down. First, I'm watching Ina play *ARK: Survival Ascended*.\
    \ She's teaming up with Towa, and I can hear both of them chatting over Discord\
    \ while Ina's on-screen. I need to make some quality subtitles, so I'm paying\
    \ close attention to who is saying what. That's Towa, I can tell - it's a very\
    \ distinctive voice! And I think the third voice is either Lamy, Aki, or maybe\
    \ even Botan, I'm pretty sure! So, I'm chronologically transcribing the audio\
    \ while translating so it's all accurate and well-timed. \n\nSo it begins:\n\n\
    *   **00:00:** Towa is just saying \"Let's check it out for now.\" Seems like\
    \ the beginning of an adventure.\n*   **00:03:** Towa thinks this thing looks\
    \ familiar, but not quite.\n*   **00:06:** Towa wants meat, of course.\n*   **00:08:**\
    \ Ina responds and confirms she can get her some meat.\n*   **00:10:** Towa tells\
    \ her where to find all the meat - cooked in the fridge, and the rest in the feeder.\n\
    *   **00:15:** Ina confirms she got some.\n*   **00:17:** Standard replies.\n\
    *   **00:21:** Towa wants to build boat traps. This is going to be good.\n*  \
    \ **00:26:** Ina needs narcotic berries and spoiled meat.\n*   **00:28:** Ina\
    \ needs spoiled meat, so, I'll need some.\n*   **00:34:** She doesn't have any\
    \ spoiled meat. Ugh, always the problem, right?\n*   **00:36:** I think it's Lamy\
    \ or Matsuri, telling her to give up!\n*   **00:39:** Ina's a bit confused.\n\
    *   **00:41:** They were taming something, but it disappeared... or ran away.\n\
    *   **00:47:** Ina responds.\n*   **00:50:** The creature ran off and can't be\
    \ found. Classic *ARK*!\n*   **00:53:** Towa is annoyed at wolves.\n*   **00:58:**\
    \ \"It flew so far.\"\n*   **01:00:** Ina is wondering if something happened.\n\
    *   **01:03:** \"Should I try that bug?\" \"Wyvern-kun?\" Ina. Let's see!\n* \
    \  **01:06:** Ina wants her Wyvern to land. She is very persistent.\n*   **01:11:**\
    \ Ina is trying to get it to land so she can ride it!\n*   **01:16:** Still trying!\n\
    *   **01:21:** The Wyvern is the focus, she just wants to ride it.\n*   **01:24:**\
    \ She keeps trying!\n*   **01:27:** Still trying!\n*   **01:30:** Come on, just\
    \ land already!\n*   **01:33:** Towa thinks the Wyvern is a problem child.\n*\
    \   **01:36:** Ina wants to get a lot of berries. What gathers tons of berries?\n\
    *   **01:40:** Towa is trying to help, but can't remember.\n*   **01:44:** Ina\
    \ is getting frustrated that the Wyvern won't land.\n*   **01:48:** Towa is going\
    \ to let it be.\n*   **01:51:** Ina asks again, what gathers a lot of berries?\n\
    *   **01:54:** Towa thinks it's Anky, but can't be sure...\n*   **01:58:** Ina\
    \ double-checks: \"Mammoth and Anky?\"\n*   **02:02:** Ina is looking for mammoths.\n\
    *   **02:05:** Found one!\n*   **02:06:** Oh, that's a terror bird.\n*   **02:09:**\
    \ It really is a mammoth.\n*   **02:13:** Ina has never used these before.\n*\
    \   **02:18:** She's just been gathering them by hand.\n*   **02:22:** Towa says\
    \ the animal won't sleep.\n*   **02:25:** Ina is\n\n"
