  thoughts: |+
    **ARK: Survival Evolved - A Hololive Gaming Session**

    Right, let me pull up the relevant files for this clip. Okay, so we've got Ina and the gang – Roboco, Subaru, Luna, and others – playing ARK. They're tackling some challenges, and I need to transcribe and translate all the Japanese for optimal subtitling. Let's see...

    I'm thinking about how the swapping strategy could have worked better, the need for better jumps at this spot, and I see now that it was that final triangle area I was getting stuck on. It was pretty strict in its timing. We had to pause to use the restroom, and I was wondering whether the in-game voice chat was working properly or if we had to go with the external option instead. I also noticed that the screen merge was good so we all were able to see and have easier time. I was just glad that we were all enjoying it.

    A bit of back-and-forth about whether something was tough or not. And then, we had the issue with the boss respawning. We had to get the admins to help spawn the boss in. Glad that worked, because the obstacle course was the highlight. I can understand how tight we were to make the mission and I was proud of what we achieved. Also, Rexes were gone, sold out, and the unicorn. I was even there with carrots! I still feel bad for that unicorn just waiting and waiting... It probably really did want those carrots. And maybe it's just out there somewhere, crying. Everyone wants to see it, a total myth on this server! We just didn't have time to go hunt for it.

    Then, there's a lot of gameplay happening here. The snow owl, a teleport to the snow owl, and getting stuck on the terrain. Some general commenting about rare spawns. Everyone started joking about pooping everywhere and I just was able to laugh. But then I couldn't get back up, hit a wrong key. I was losing food and water! We were all trying to hang in there, and the water was gone... I have to go, I have no more water!


...
