  thoughts: |+
    **Ark: Survival Evolved - A Tame Plan**

    Okay, here's what's running through my mind as I watch this stream: I need to get those subtitles done for this Japanese gameplay! It looks like there's a stream involving Ninomae Ina'nis and others in Ark: Survival Evolved, so let's get this done and make sure everyone can follow along.

    Right now, Botan has just said something about the team wanting to re-challenge in another stream slot, and I'm totally on board. It seems like Botan had to leave, which I assume is because of scheduling, so I need to make sure to note that in case that's important later. Ina has just asked if she can get on, and after some chaotic back and forth, Towa starts driving the zeppelin, and Ina's character is in the ghillie suit on the zeppelin deck!

    So, we had a near-death experience, an Ice Wyvern in the vicinity, which means we have to clear the area. Now, it seems like we're discussing finding a Yuty for taming, since they're fluffy and useful. We need water and we also spot an Ice Wyvern nest. We also had that funny moment where we're teasing Ina about the indirect kiss with her canteen, haha.

    We are hunting for a Yuty! It seems there is a spot where the Yuty is, but it is in a spot that is crowded with other creatures. We talked about how to tackle this - we can't lure it down because it's too vast, perhaps we will try to fence it in... or we can try to lead the Yuty. I'm worried it might die since it is wounded, but let's go on a search, and see what the best route is.


...
