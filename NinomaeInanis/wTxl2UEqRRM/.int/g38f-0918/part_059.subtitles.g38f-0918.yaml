  thoughts: |+
    **Hololive ARK Award Ceremony - A Deep Dive**

    Okay, so Ina'nis' #TAKOTIME stream of the Hololive ARK clip... Let me break this down. First, this is a Hololive ARK stream, so there's the usual chaos, right? It's Fubuki MC-ing - or is it? Okay, it *is* Fubuki! Right. Now, the clip starts with an award announcement: "みんなに愛されすぎたで賞" ("Most Loved by Everyone Award"). Three people are getting this, according to Fubuki. The crowd goes wild.

    Here's where it gets interesting, as this is how the brains of an expert in their field thinks. Fubuki announces the winners: "Bae-chan, soshite Hajime, soshite Subaru." Alright, Bae, Subaru... and Hajime. Who is she? Now, there is a pause, it's not "mizumia," it's "Hajime" and not "Mizumia" but **Hajime**. She's referring to Todoroki Hajime, *ReGLOSS* member! I can see it now, "Bae, Su, Todoroki!" Right, "Red Powers." Ok, and the "Most Loved" award: it's a kill-related prize!

    Okay, so it's a "most deaths" award! Bae and Subaru both get it...and it makes sense, when Todoroki Hajime is called on and shouts with a happy shout because she's happy at getting points for dying a lot, it is Todoroki Hajime's voice!

    Now the award announcement is broken down for each point in time.

    *   **00:00 - 00:03:** Fubuki introduces the award.
    *   **00:03 - 00:09:** The award is for "Most Loved by Everyone."
    *   **00:09 - 00:13:** Crowd reacts to the three recipients.
    *   **00:13 - 00:20:** Fubuki announces: Bae, Hajime, and Subaru.
    *   **00:20 - 00:33:** People are confused and commenting on in-game deaths.
    *   **00:33 - 00:44:** Fubuki asks the three winners to come forward and the crowd cheers.
    *   **00:44 - 00:51:** The crowd cheers and makes random comments.
    *   **00:51 - 01:00:** Fubuki asks winners to speak. Hajime's name is called and then Todoroki Hajime responds.
    *   **01:00 - 01:06:** Hajime says she got points for dying and is happy.
    *   **01:06 - 01:09:** Crowd reaction.
    *   **01:09 - 01:12:** Fubuki calls for Subaru.
    *   **01:12 - 01:17:** Subaru thanks everyone for killing her and explains that she died a lot.
    *   **01:17 - 01:21:** Fubuki calls for Bae.
    *   **01:21 - 01:26:** Bae is glad for all the love and the killing, too.
    *   **01:26 - 01:32:** Crowd cheers, and Subaru thanks everyone.
    *   **01:32 - 01:41:** AkiRose announces a VR gift.
    *   **01:41 - 01:45:** Subaru thanks everyone for the kills and is ready to enjoy a feast.
