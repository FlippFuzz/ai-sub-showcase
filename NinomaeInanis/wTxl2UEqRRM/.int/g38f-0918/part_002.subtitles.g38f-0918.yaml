    **ARK: Survival Ascended with Hololive Subtitles - A Detailed Breakdown**

    Alright, let's get down to it. I'm seeing a video, Ina'nis is on screen, and we need those subs. This is likely ARK, and from the sounds of it, this is Pyromane. Okay, let's rewind and get this right. First, Ina speaks. That's clear. Now, who's the second voice? Deep-ish, maybe gruff, or energetic. Hmm, could be a few folks, but the initial hunch is Hajime, Kaela, or perhaps Botan. "すまねえ" is a clue, though it could be Okayu. It's a Hololive member for sure. Then there's a third voice, soft and junior-sounding, using "先輩". Anya? Or maybe Zeta or Iofi? No, the JP is clear: Anya Melfissa. Now, let's nail this down.

    Re-listening... it's like a puzzle. Okay, it's Fubuki, Ina, and someone else. I hear Ina (Ninomae Ina'nis), but the voice saying "すまねえ" ("sorry") is Fubuki. She also says “～だな” and “～だよね”, which is very characteristic of her. The third speaker is likely someone from a younger generation, maybe Anya Melfissa. Let's start transcribing:

