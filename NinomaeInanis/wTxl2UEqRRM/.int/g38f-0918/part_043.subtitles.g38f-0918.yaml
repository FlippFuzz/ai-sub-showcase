    **ARK: Survival Evolved - Hololive Discord Shenanigans**

    Alright, let's break this down. Seems like I'm tasked with providing subtitles for a fun clip of Ina'nis, Towa, Kanata, and maybe Iroha playing *ARK: Survival Evolved*. I recognize Towa's voice right away. Initially, Towa's not present, so Ina laughs. Then, I need to focus on who's talking on Discord and translate accurately.

    First, Kanata's on about some insanely long obstacle course next door - "Am I going to die? I'm going to die." Then Towa's giggling, and Kanata wonders, "An hour?" Towa, ever the optimist, replies "But you can do it!" A little horse-themed banter emerges - apparently, Towa's mastered horses! Kanata and Ina pick up on this, with Ina even joking, "Aren't you a horse handler, Towa-sama?" There's a Gurren Lagann meme quote - "Believe in the us that believes in you," and Towa, seems to be a bit embarrassed. Kanata then apologies for not having any narcotics. Ina quickly makes some, and Kanata is thankful.

    Next, Towa seems to be wondering if she can take on some creature (maybe a high-level dino?). She isn't sure if the torpor has recovered. Ina is going to go attempt a challenge. The girls then have a conversation about a Tyrannosaurus Rex that's nearby. Towa is shocked, and Kanata takes out her aggressions on what appears to be a smaller Pteranodon. Ina asks if they can handle it.

    Kanata mentions she protected the neighbors from it, and says it's a bit of a time loss. Towa is hurt, and then Kanata has the bright idea to bring her over to her and they are very happy. At this point, Ina has tamed a Paraceratherium. Kanata and Ina discuss the creature's face and how it should be named. Kanata gets stuck momentarily, and seems very grateful that Ina helped her get unstuck.

    Then a Wyvern flies by, and Kanata, Ina, and Towa discuss whether they can tame it. Ina reads out loud the message, "Can we tame the moth?" Kanata: "You're alive, huh?!" Someone suggests using a bola (net). Ina will give it a try with her flyer, who is named "TONDERU_7" and is flying away! Ina says "Tonderu, come back... Tonderu! Where are you going?".


