    **ARK Adventures with the Hololive Crew**

    Okay, so I'm watching this video clip, and I need to transcribe the Japanese audio, and then translate to English. The speaker is the VTuber Ninomae Ina'nis, who is playing ARK. It sounds like she's in a Discord voice chat with other Hololive members, like Korone and Iroha, and perhaps others like Botan or Choco, and they're all playing together.

    At the beginning, I hear Korone, Iroha, and Ina trying to figure out what they're supposed to do. They can't find the T-Rex, and are looking for it. They're all so casual and funny, and I realize it would take forever to transcribe by ear alone. Korone's distinctive dialect is so clear, and I can identify Iroha, too. I’m thinking, “Is Ina handling this T-Rex, or should I jump in?"

    Then it hits me! I need to note down all the timecodes. I have to create a detailed map! I see that Korone is very distinct in saying: "わかんない、もうなんか適当に... 適当に行くしかなくなっている" and "もうリスナーさんに任せてる、もうこれ。これみんなの見て、どれが..."

    There's some confusion about whether the group needs to kill T-Rexes for a mission. I realize that Ina is coordinating, talking with the others, and making sure everyone's on the same page. So there's a lot of Korone asking if Ina can handle the T-Rexes.

    Suddenly, someone cries out "Paraceratherium", and it gets confusing; Ina thinks they're being tricked. Then, Korone starts getting really worked up, because of her experience with a "顔つきティラノすぎる" (a dino that looks way too much like a T-Rex). I see it’s not really a T-Rex. She is being very Korone. I’m starting to chuckle. It's funny because she gets angry so quickly.

    Someone says, "There's a lot of arrows... hmm" and then Korone’s even more mad! Now Ina joins in, trying to shoot the Paraceratherium. Korone is yelling at the dino, calling it a "テラバード" (Terror Bird), and that makes me laugh again.

    Suddenly, Korone is really angry. I think, "This is too funny!", when I check the comments. I'm laughing that someone was killed in the game because of a mistaken identity! Ina is trying to coordinate, calling for help.

    Then I am thinking, "Alright, let's keep track."

    I need to transcribe every detail. It sounds like Korone is requesting to kill a T-Rex. Ina keeps saying, "本当に、お願いしますー," meaning she's serious. I am paying close attention, and I will check what Ina is really requesting. I think, “Oh, maybe she is talking about a Gathering Hub."

    But wait! Now Korone's saying something about a volcano area, and I am still tracking what she’s saying. Now, I am confused by what's being said. Korone then mentions a name. I realized I need to be more precise about my timing to confirm what she is saying.

    There's confusion again; Korone is saying something really weird about “お前あっちゃーやないか、くそー！” which is probably her reaction to another dino misidentification, and I now need to rewind to confirm. And I listen and I think, "Oh, it's hilarious," and I'm really getting into this conversation. I am thinking, "I have to capture this exactly."

    Then I am back to focus, and I’m thinking about the team missions, about coordinating the wyverns. I see a little message about a server restart, and I realized I should re-listen. "There are some things in English!" That's what I am thinking. I'm trying to track everything, all the dinosaurs and missions. I am focused!

    I need to re-listen to what Ina's saying at the end there. I'm thinking, "Is she talking in English? And wow, there’s a timer!". Then I hear her saying, "Kill you and then..." and I am focused on the timing because Korone said, "バイリンガル喋ってるのすごいね、イナちゃんは。" and I get it! Ina is speaking in English in the middle of Japanese. Then, I am thinking that Korone is saying "Koro-senpai". Then Ina says "5分で...", which is a red flag: Server restart! "Oh right, time!" This is all so good! I am totally absorbed and totally focused, and I realize: "We have

