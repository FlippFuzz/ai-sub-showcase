  thoughts: "**ARK Adventure: Navigating with Ina**\n\nRight, let me pull up this\
    \ ARK video clip. Okay, so we're looking at a 5-minute collaboration with Ina,\
    \ and her team is trying to figure out this icy map. It sounds like they're off\
    \ to grab a few crates... should be a simple route, just stick to the right, sounds\
    \ like Fubuki has it right. Okay, we got it, straight ahead for now.\n\nWait,\
    \ break time for stamina... phew. Oh! A yellow crate! Nice, let's see what's inside.\
    \ Leather gear? Maybe a Tyrannosaurus saddle? Or did someone say Therizino? Okay,\
    \ a T-Rex saddle, cool. Are there any bears around here? Nah, all good. Ina's\
    \ leading the way... okay, sounds like we stick to the right, feeling it... right.\
    \ \n\nThis seems a bit narrow, Ina mentions that we might have to detour to get\
    \ through here. Okay, super tight ahead. Okay, this is it, right? Dismount here\
    \ to get through. Oh wait, this can't be right... is this the place we're looking\
    \ for? \"Apparently not\"... the left, they say. \n\nI'm getting stuck... ah,\
    \ got it! It's because I was carrying stuff! Did she say left? Hmm, maybe there's\
    \ a crate over here? Oh, look! A crate! Seems like we're heading upper left now.\
    \ Okay, let's follow our buddy, Fubuki. Another crate! Megatherium saddle, sweet.\
    \ Hmm, nothing special here. Wait, I think I've seen something like this in a\
    \ video. It's ahead, right? That way? Nah, not here.\n\nNo, this way, I think.\
    \ This section up ahead... can't fly, I think. Oh! Ice Queen... Chitin bubble,\
    \ yes! Seems like we need to do the Chitin bubble, so it's this way. Right. Okay,\
    \ looks like we have to dismount right here, that looks like the end of the line.\
    \ Okay. I guess we switch over to Yuty now.\n\nRight, and an information prompt.\
    \ Some other team is fighting. We have to wait before we go in there and start\
    \ something. Yep, going, going. Ina is very heavy! Wait, the BGM just changed...\
    \ something's up... what's up? Oof! She's heavy! Okay, just wait a sec. Not passable...\
    \ here either! We will not have to get on the dino. \n\nOkay, all set, let's keep\
    \ moving. Therizino eggs... I have all this weight on me? Rocks, maybe? Right.\
    \ Seems like the path gets smaller, and it's looking like we'll have to crouch.\
    \ Yep, that's what we have to do. First-person view might help. Made it!\n\nOkay,\
    \ let's go prone. Wait, how do we get through this? Control. Crouching, okay.\
    \ It's so narrow! Coming! Okay, watch out for the uncrouch! This place? Towa-sama's...\
    \ Yes, can we get through here? Okay, by crouching. Towa's dog... maybe it's stuck?\
    \ Oh, it's fine. Ah, did I just accidentally unequip everything? Oops! Pretty...\
    \ yes! So pretty... okay! And... what's next? Still a ways to go. Scary! It's\
    \ scary! Is it?\n\n\n"
