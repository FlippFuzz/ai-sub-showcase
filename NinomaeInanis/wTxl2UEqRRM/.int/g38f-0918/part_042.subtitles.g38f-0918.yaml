  thoughts: |+
    **ARK Adventures with Ina**

    Okay, so here's the deal, I'm trying to follow this clip of Ina, Ninomae Ina'nis from Hololive, playing ARK with her collaborators, and I need to transcribe and subtitle everything. This is going to require some real attention to detail, so let's get started.

    Right off the bat, Ina's saying there are no Rexes around. The other members are discussing how hard it is to get ten rex's in an hour. We're thinking that we should switch things up and start taming stuff instead. Three more tames is the number, apparently. We don’t want to go to the taming mission without knowing what we should be taming. I am wondering what we haven't tamed yet, actually. One of the other collaborators, I think it might be Hajime, I went after a massive one, but I am fresh out of arrows and I'm crafting more. There's another hunting task for Argentavis. I need to make some decisions, maybe Brontos is going to be easier because they are huge, and there is only five of them, unlike the Argents which require fifteen. And they fly!

    The collaborator seems to be stuck, they can't remember where the teleport is. I know, teleporters are super mysterious. We're getting lost again. Yesterday we worked hard to reach it, so maybe if we can get to the teleporter, then we can take it, hopefully. There is also one of the EN members in the VC too, I can hear it!

    Oh, right, the taming theme, did anyone end up finding a Dodo for the task? Nice, someone finally tamed a Dodo! It’s just the tutorial mission, but I couldn’t find the Dodo! Where is the bird?! Other creatures got tamed, but I can't remember all their names. The chat, help me out! Wait, there is a Griffin.

    Then things get a bit chaotic with a misheard word! "Ochikko?" Wait, did somebody just say "pee-pee" or "butt"? Ears, must be acting up! You are so tired. I know, the teleporters are still mysterious to me too.

    Then we're singing to pass the time. Yesterday we got to the end, can we get back? One of the collaborators, Koharu, thinks they have figured out a way! Awesome! I lost the path, though, and I am also losing myself. Giganotosaurus! Oh no! The obstacle course is next. They have to tell us where the way out is, to the gathering hall. Ah, the exit, in the middle is one? Okay, thanks! Wait, it said 'Under Maintenance' yesterday!

    Is this it? Ah, this is it! If I follow this, I can head back. Are we done? Is there any more? I'm calling out to see if anyone is here. Are there really no Rexes? It wouldn't hurt to just show up. No one is here. And then there were none.


...
