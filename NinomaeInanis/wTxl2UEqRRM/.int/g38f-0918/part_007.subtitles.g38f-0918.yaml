  thoughts: |+
    **ARK Leveling and Ice Worm Prep**

    Okay, here's the deal. I was playing some ARK: Survival Evolved with Ina and Botan, maybe Towa later. We're in the middle of a clip, so let's pick up where we left off, shall we? It seems I was encumbered, I'm at 526 weight, which is annoying. I was riding a Pteranodon with the cat, and it was causing some weight issues. Botan suggested leveling up the Ptera's weight capacity, which makes sense. I had to ditch some metal gear to free up some space, so I tossed some of that.

    The mammoth team was out looking for a mammoth, and I was curious to know if they got a baby one. As it turns out, there was a baby mammoth, a "baby akachan" even. I do want to level up my shoulder mount at some point, maybe by taking down a Bronto. I had to hop into voice chat for a minute to report in, and catch up with what's happening.

    While I was out of voice chat, Botan told me about a plan to get a Yuty (Yutyrannus), then go in the ice worm cave with the Direwolves/Baryonyx/other mounts. I was going to use my flyer and bring the cat to do some leveling. I wanted to level up a nearby Bronto, so I went to look for it, but there was a huge T-Rex. I was looking for a long-necked dinosaur, and found a Bronto, so I told it to stay. I needed to move it, so I gave it some directions, and set it to follow me to stay in one place. I was talking to Towa, and she wanted the Yuty from Botan. So I'll go help my friend out, and go to beat up some ice worms.


...
