  thoughts: |+
    **ARK Obstacle Course - A Stream of Thoughts**

    Okay, so I'm watching this clip of Ina'nis playing ARK, and I'm immediately thinking, "Subtitles, please!" I need to figure out who's talking in the stream – I see Ina's avatar, so she's the focus, but who's in the Discord call? I recognize Fubuki, Botan, and Polka, maybe some others. I’m starting to mentally identify the audio by segment to be able to follow along fully.

    At the beginning, I'm trying to place the conversation, which sounds like Botan asking about the obstacle course. Then, Ina’s asking where the course is, and then the others in the call seem to be trying to find the place, and I think, “okay, so there's an obstacle course at the meeting place, or maybe not?” Then, Ina finds the entrance, and someone's excited about the jumping course. The voice is really cute, I think. I wonder who that is? Fubuki and whoever that high-pitched voice belongs to are really into this. I'm taking notes on what's going on.

    Listening to the conversation, they're clearly having fun. Someone mentions that it's above the Raptors, and Ina wonders if she can bring a dinosaur. That's a funny thought! Then, there is a back-and-forth about whether they get scolded. I'm wondering what's happening. I’m making mental notes of all the points. There's a lot of chatter about the course and some people are struggling, but they're still searching.

    I'm making a mental list of things to keep track of as they make progress. "Okay, hydration's low, gotta remember that." I can tell the group is having a blast. "Wait, someone is saying it's hard!" There's talk about the difficulty of the course and getting stuck. "Okay, they seem to be making progress." Someone's looking for the obstacle. "I wonder what they'll find?" I'm mentally parsing everything. I hear someone in the voice chat giving directions.

    It sounds like there's some kind of glitch. There's talk about the unicorn, and Ina's saying, “Oh, didn’t want a direwolf” in English. I can pick up on the English comments. It’s hard to tell whether the speaker is confused or if a glitch caused them to go in reverse. Someone’s in first-person mode. They're trying to figure out if it's best to be in FPS or TPS mode. Oh, they don’t think they will make it. I understand, the course is hard. I feel as if they might not make it!

    Then, I see Ina trying the obstacle course. There's talk about being cheered. I'm following it all closely. It's intense! "She made it!" I'm trying to follow along, with timing, in order to get a sense of the pace of everything. I know there's a ladder. I also see that there's not a lot of time left for the team to make it! There's cheering and frustration, and then Ina wants to find a unicorn! I'm trying to follow the pace of the voices in the chat!

    It sounds like everyone's encouraging everyone else. Someone’s frustrated and wants a unicorn, but isn't going to get it. Oh! They didn’t land a direwolf! There’s laughter! The race will be over! The timer runs out. People are still going. The person in VC is making comments on the difficulty of the obstacles, and there's a lot of teasing going on, so the team is getting distracted. They don’t want to give up. So the stream ends with people still trying the obstacle course! I need to subtitle this properly!


