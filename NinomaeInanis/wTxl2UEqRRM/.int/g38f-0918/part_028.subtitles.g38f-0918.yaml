  thoughts: |+
    **ARK Adventures with the Hololive Crew**

    Okay, here we go. Subtitles are a must for this ARK session with Ina and the Hololive gang – sounds like Kobo, Zeta, Anya, and Kaela are on board. Gotta make sure the Japanese is spot-on, so I'm listening closely. Looks like we're diving into the Hololive ARK server, and it's Ina and some others, maybe Botan, playing the game.

    First, that initial exchange… she's trying to figure out if she can cryo-pod something, and then, yeah, "Let's go!" There’s the Yutyrannus timer... "Can it not be put into a Cryopod?"

