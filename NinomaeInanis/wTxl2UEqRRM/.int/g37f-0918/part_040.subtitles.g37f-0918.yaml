  thoughts: |+
    **A Stream of Consciousness: ARK and Chiikawa**

    Alright, let's see, I'm watching this clip... I need to get some subtitles going for this. It sounds like they're playing ARK: Survival Ascended, and it's probably Ina's stream with her friends. Gotta listen carefully, it's a bit chaotic, but interesting. Hmm, early on they're messing with each other – something about being "thin-skinned," and someone's screaming. That screams feels somewhat desperate... maybe from an Ark encounter. Then, things shift to talking about Chiikawa. Seems Ina mentioned she likes it. Oh, so she likes Chiikawa and Hachiware, good choices for a duo! I've been getting into Chiikawa again recently; it's unexpectedly cute. It's warming my heart.

    Oh, she's actually re-watching it? I tried to watch it, but I gave up halfway through. Maybe I wasn't in the right mindset when I tried... that’s probably the key. You gotta be in a place where you're just enjoying the cute aspect to appreciate it. Someone mentioned that if you're annoyed by Chiikawa, you're probably stressed! I get that. I used to be annoyed by Chiikawa, it's true. I remember thinking, "What's with this 'Wah!' thing?" It's like, just a simple little character, and maybe that's where my stress came out, but now, after watching that movie and reading the theories, I get it now. He’s actually a pretty good thinker. Now I can see it that way, and I can watch in a calm state. It’s comforting! I was worried for a bit there, if I couldn't be calm then that would not be good at all. I guess I was just tired before.

    Later, they're back in the game and looking for horses and dealing with a few dino spawns. "Abandon dino". I thought there were no horses, and then found a few. There's a black horse, but that’s not what I'm looking for. What if I color a horse white and name it a unicorn? "Starting today, you're a unicorn!" I'll try to imprint that onto this horse. "You are a unicorn!" Maybe that will help. Oh, there's just way too many sheep around here... Hmm, guess I'll head back.

    Wait, there are more spawns in this area. Just a few more to go! Yeah, get him, SCARY!



