  thoughts: |+
    **ARK: Survival Evolved - Ina's Gameplay Musings**

    Okay, here's the breakdown of what's going through my mind as I watch this ARK clip with Ina and the Hololive crew.  First, this is a mess, right? Trying to get subtitles for this, but I am an expert! The initial setup: there were plans, like the 23:00 timeline, then everything got booked up, rapid-fire joins.  So we're adjusting, right? Gotta get accurate.

    We're going to have to adjust the timings and break this down. The audio is really not helping me. Okay, got it - initial focus on taming, especially multiple species.  We're looking at Lava Elementals and the obstacle course. Getting stone is always a priority, and trying to wrangle this. "It won't go in." - ah yes, that Doedicurus.

    Manually moving stone, the woes of weight limits... and then suddenly dehydration!  These locations... Always gotta gather resources and manage things, just a little bit at a time. The knees! The spinning is too relatable when getting materials.  Where should I place the collected stones? The Fabricator. The hunt for that elusive Terror Bird! Missions are being checked. Found the Terror Bird, oh, it's gone!

    Then the stone... Yes! We're moving forward. Team Lava's going to VC 2.  There are no seats! But we're seeing all the resources there, stones. Okay. Wait - Why? "Three More!" Yay! Water, oh boy. We're getting the game down.  We're drinking the water. The Argentavis... It's all about persistence. The persistence is crazy!

    We're collecting and collecting.  Okay. Now for the obstacle course!  We're making sure Ina's got what's needed for voice chat. I'm focusing on easier tames, meanwhile, Towa's getting some too, and we're getting close. Oh no, now the weakness is starting to hit... Not a good time.  Heatstroke. Corpse.

    I don't get this game anymore! The taming of this is so elusive. The cacti from behind! Oh, the knees... The game is being played.  Alright! We can do this! We still have resources and other things.


