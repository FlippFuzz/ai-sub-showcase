  thoughts: "**A Gamer's Musings on Leveling, Dino-Hunting, and Voice Chat**\n\nAlright,\
    \ let's break this down. First, gotta figure out what to level up. Melee damage\
    \ seems like a solid choice. Fubuki's reaction is understandable; it's always\
    \ good to check.  Aki, are you there? Double-tapping \"F\" to use the ability\
    \ – that should be right, and then holding \"E\" should trigger the next command.\
    \ \"Let's go!\"\n\nAh, a Bronto? Or wait... a Diplodocus. Oops, wrong dino. I'm\
    \ carrying way too much stuff. Fubuki should just put the items in the Ptera's\
    \ inventory for now; managing tribe stuff can come later.  Why am I carrying so\
    \ much anyway? Okay, alright, this should be fine. \"Take that!\" Gotta keep hitting\
    \ it like this! Hmm, I wonder where that always-on voice chat setting is. Wait,\
    \ is it this setting? Nice, this voice chat toggle is just what I was looking\
    \ for. Now that I have that out of the way, nice.\n\nI'm thinking, \"Wonder if\
    \ it leveled up from that?\" Fubuki's right, now it's in the finishing blow stage.\
    \  And now it can bite off the meat!  Okay, it's leveling up so fast! Thinking\
    \ about putting points in Health maybe?  Nah, go with Melee damage. Alright, time\
    \ to go looking for more dinos! I will just go into Kitty-on-shoulder form for\
    \ now... Okay. Let's find another big one! \n\nOh, right, where was that setting\
    \ again? Wasn't it in Discord settings? Yeah, I'm looking for it... Ah, here it\
    \ is, found it! Advanced Voice Chat Toggle. Stone? I don't think I'll need stone\
    \ right now. Oh, here it is. Meat, I'll take the meat. Okay, let's go! I wonder\
    \ if there are any big ones around.  One with the really long neck... Ah! Kind\
    \ of scary. Don't you hear that sound of trees? It's like something invisible.\
    \ There's an invisible enemy! What is that? I don't understand, it's right in\
    \ the grass... Hm? What? Something was there. There it is! Yeah, wonder what that\
    \ was. Can't tell if it's a Rex or a Giganoto over there. That's scary, though.\
    \ We can take it! Let's go! I wonder if there are any big ones around here. Yeah,\
    \ there was one up here yesterday. Maybe that one got eaten by a carnivore...\n\
    \nAlright, time to do some leveling... Where are you two? Okay. Heave-ho. Wait,\
    \ that's something big. There's something, Oh, there's something big. \"Is this\
    \ one dangerous? This bear-looking thing. There's an anteater-looking one too.\"\
    \ What is this guy? \"Theri-Therizino-something, was it?\" Bear... I wonder if\
    \ we should go after the bear too. But those birds over there might work too.\
    \  Maybe we should put some meat in Pyromane's inventory. Yeah. Wait, how do I\
    \ put it back? Um, E. For Pyromane, holding \"E\" should have a \"Change\" option.\
    \ Maybe transform? Huh? Wait... Hold E... Yeah, and bring up the menu. Huh?\n\n\
    \n"
