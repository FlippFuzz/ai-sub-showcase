  thoughts: |+
    **ARK: Survival Evolved - A VTuber Adventure**

    Okay, so the goal is clear: subtitles for this ARK session from 00:00 to 05:00. This is Ina'nis, with Biboo and the others – sounds like a fun collab. Time to put on my linguistic hat and get those timestamps and transcriptions accurate.

    Here's the rundown of my thoughts as I work through it:

    I started with "Nightmare," the dino's name, as the first timestamp, naturally. Then there's some casual conversation between players. Someone's asking what Ina-senpai's taming. Haha, she gave up already! Then there's an observation, "Looking for it..." It seems like the dino fell asleep, and then got eaten?! *chuckles*. Can't be helped, it happens. Then... what's this? A broken structure! Time to try and fix it. Mortar and pestle won't open...wait, I got it. "Sometimes there are times when you can't open it." - a bug? Yeah, maybe.

    "What, ah, that? Is it a bug?" I'm spotting things and wondering. "No Dodos"...hmm indeed. What to tame now? I'm considering. "Right, maybe a different area..." I remember the heatstroke in the desert; a plains area sounds better. That gathering place, I recall that we started there... I think there were some things...yes! Then a request to Ina-senpai on how many tranq arrows she has. 88! Nice. Then a strategy to head near the gathering place and get arrows. Vivi's got a problem, can't open anything, the mortar, nothing. Someone suggests switching to third person. Oh, it doesn't open. I will suggest a relog. Ah, okay, she will exit and rejoin.

    "Then I'll head to the gathering place" says someone. Then it hit me: "Wait a sec! Mammoths haven't been counted, so a mammoth!" Aha! They didn't count because it was raised. Good catch. Let's get that mammoth! "Shoot arrows at the mammoth's..." Now, riding it? Okay! I'll tell Ina-senpai "come on, let's go." Gotta get water, lots of it! "Because of our mistakes..." Here's a problem: the game now says I need a Mod. "Mod Storage is full"... Oh no! Vivi can't log in! What?! Seriously?! *laughter*. What's happening? Why? *exasperated sigh*. Mod Storage, that is Vivi's problem. Is that the PC? Probably the PC. Oh, 30 minutes!

    "Alright, Ina-senpai, let's go!" And then, some observations, "Shall we ride the mammoth to do it?" Probably better. Then "riding the mammoth and shooting the arrow. She's carrying a Yutyrannus!


