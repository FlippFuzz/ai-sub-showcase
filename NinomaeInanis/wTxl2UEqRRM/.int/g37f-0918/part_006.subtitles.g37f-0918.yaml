  thoughts: |+
    **ARK: Survival Ascended with Ina'nis - A Play-by-Play**

    Okay, so I'm watching this clip of Ina playing ARK: Survival Ascended, and I'm instantly thinking, "Subtitles! We need subtitles!" It sounds like she's playing with other Hololive members, maybe Korone and Okayu, or someone similar. Let's see... First, I'll transcribe everything as precisely as possible, making sure to hit those timestamps, the original Japanese/English, and then natural translations.

    Right, here we go, looking at the time codes.

    0:00 to 0:01, she's like, *“Ah, I might want that.”* And it clicks... she's going to base. *“To return to base...”* Then she is bringing out her Yuty. *“Then let's take out Yuty...”* Sounds like this is going to be good. *“Up we go, here's Yuty.”* A creature spawns. *“Fibers are from here...”* Nope. *“Ah, that's not Yuty!”* I get what she means, now... she's got help here. *“Here. / Yes, thank you.”* She's moving on. *“Yuty is this way.”* But where is Yuty? *“Is Yuty here?”* Hmm... The boss is coming. *“Um, boss is coming out here.”* Alrighty then. *“Alright~ / It's out~”* Needs a lot of meat. *“We needed a ton of raw meat, huh.”* Yeah, of course it does, these things eat. *“Yeah, for sure. Since it eats a lot. / Eats a lot, yeah.”* Hmm, I wonder if there are any bugs around here? *“Um, could there be bugs nearby maybe?”* Let's see… *“Let's see...”* Huh, nothing? *“Huh? There's, like, none at all...”* Ah, her cat! *“Ah! Cat! Where are you~? / Ouch.”* Yuty needs a heal. *“Yeah, Yuty does need a heal. It's okay.”* Putting it in the Cryopod... *“Put it back in the Cryopod... / Yuty will rise from the dead...”* If need be, she says. *“...if need be.”* She's moving. *“Oop. / Oh, kitty cat~”* Where's the cat? *“Meow meow, where are you~? / Meow meow, where meow meow. / Where meow meow? Pspsps...”* Is it there? *“Are you there~? / Okay. / Pspsps...”* Found it! It's right there! *“There it is! I thought about a different color, but let's go with this one. / Come on, meow meow, come here. / Over here.”* Follow me. *“Follow me. / And...”* Bugs... *“The bugs are...”* Not nice today, huh? *“Not very nice today. / Small fry~ / Yeah.”* May have to run. *“We might have to run around a bit, huh. / Sorry about that~ / Yes, bringing it over now~!”* Here it comes! *“Okaay! / Waaah! / Well, I'll drop it somehow now. / Whoa~! Waaah! Let's go~! / Dedicate your heart~!”* Singing that Attack on Titan theme! *“Dedicate it~! / Strike! Take this~! / Waa! / Take that~! / Ah, I messed up. / There we go, Yuty. / Okay. / Right here, yes, I'll wait. / In a slightly better position... / Yes. / It's level 55. / Ah, that one's weak. Looks like you can mount it soon. / Ah, can I do it now? It stopped for a moment. / Wait, one more time... / Not yet. / How is it? / You can ride it. / Okay, okay, okay. / And... / Bugs~!”* Bugs, where are you? *“Are there bugs somewhere? / There are no bugs at all... Ah, there! In front, right in front! / Right in front, yeah. / Another one... There's probably another one... right?”* Finally! *“Ah, done! Got it, got it, got it! / So fast! / Yay~!”* Let's name it... *“Then, dog... dog... let's name it Inugami Korone.”* OkaK

...
