    **ARK Adventures: A Hololive POV**

    Alright, let's dive in. I need perfect synchronization for Japanese and English subtitles for this ARK gameplay with Ina. First, some Holo-chat, "Huh? Everyone's gone. Nobody's here." Seems like someone's complaining about a one-hour obstacle course... "I'm dying". Towa, or maybe Matsuri, and friends are up to something. "Ch-Character co...", "O-One hour?!", "But you can do it!", Towa conquered the horse! "Yeah. Conquered a horse? Horse... horse race. Race." Isn't that Bakatare? Exactly. "If it's Towa-sama who conquered the horse, you can do it."

    "Believe in Towa-sama. Please believe in us." That's right.  "Believe in the us that believes in you", here it is! Awesome! To think Ina-senpai's using that meme! "Believe in the us that believes in you." Time for tranq arrows.  "I don't have any tranq arrows at all..." "I'm crafting them now~! Okay! Thank you very much!" I wonder if 100 will do the trick?  "Phew~ Alright, let's challenge it once more... Here I go! Good luck!" Will it walk again, I wonder...

    Wait, is that a Rex?  "Wait, is that a Rex... coming?" It's there? "Wait, isn't that a Rex outside?" Oh crap, it's the Rex! "R-Rex, Rex, Rex! Isn't it coming? Oh crap, we made eye contact. I'm just gonna kill it, it's annoying me." That's just venting your anger! It fits, the BGM fits. "Wait, is this a Rex? No, isn't its face plain? Isn't your face plain?" Rex? Wait, gyagyagyagyagya! Whoa whoa whoa whoa whoa!

    Could you stop bullying the Pteranodon I casually tamed? Your face is plain as hell! I can't even ignore it around the base, you... Can you h-handle the Rex? Ah, I think I can, probably. This Pteranodon, you know, um... Pteraaa~~! Hey, you! Go somewhere else! We don't have any business with you! I've got no business with you! Yep. Man~~ I killed a different one somehow. What was that? Maybe I should go for that one from yesterday, the black whatchamacallit. This looks like it'll cause damage to the neighbors too, so let's take this guy down. Ah, can't mount! That's a bit of time lost, but...

    The neighbors... let's protect the neighbors, guess there's no helping it. Ah, ah, ah... TONDERU? Did it go down? Did it? Did it? Come on you, come over here. Wait, come over here... YAAAY! That one also has a thick face... What! It's not thick, it's not thick! This one's plain. Why are there only thin-skinned plain-faced ones around... It got stuck, but could you not? Wait a second, it got stuck, stop it? Ah~ thank goodness~~~! Wait...

    Um... it's stuck, but... Ah, good, good, this angle is nice. Hop, this angle is nice, this angle. My body's starting to hurt somehow~. What is that? Looks like a bug. Will stamina hold again? Looked sketchy, I wanna go retrieve it. Did it go where it's flying? Ah, it's flying, over there? Eh, what is it? Looks like a bug. Oh crap, since I can't fly, might die, Wyvern... Ah, it's alive~~~. Can we tame the moth? You WERE alive?!

    How do we tame it? Okay! Kill? Yeah, right right. "Bola and tase fast"? I see, I see. Let's try doing that. Ah, TONDERU, come back TONDERU, go somewh- Eat, you! TONDERU, come on... With a bola...


