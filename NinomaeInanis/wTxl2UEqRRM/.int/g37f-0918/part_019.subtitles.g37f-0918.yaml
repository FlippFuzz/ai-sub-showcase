    **ARK Ice Cave Run - A Play-by-Play**

    Okay, here's the deal: we're in the Ice Cave, fighting the Ice Worm Queen – Ina's leading the charge, and Fubuki, Towa, and others are in the mix, too. First thought? Where'd that Yuty go? Wait, wait, gotta save the Yuty! Oh, the Yuty's running, run Yuty! Burn it! Everyone, hang in there! Nice, leave the Yuty alone! Nooo, don't kill it! Alright, here we go! It's almost sucking us in! You can do it! Alright! *howl* Where is it? It's taking aggro, but Yuty's still the main target. Bad, bad! Oh no, the Yuty's gonna go down! Is it bad? No! Whittle it down, fast!

    Okay, should we bring out the Therizino? Yeah, let's bring it out soon! This is pretty tough, though. It's going down! Therizino, get in there! Take that! Alright. Swapping, swapping. Oh no, Yuty might not make it! Ah! Nice! So much keratin, we're getting so much! Oh, thank goodness. Nice! Okay. Whoa, way too heavy! Heavy! Hold on, gotta dump some stuff, dump it. There's so much in here! This is crazy! We've got a ton!

    Can we bring out an Argent here? Probably not needed... but here, have it! Umm... Look at that, the Ice. Where'd the items go? Did Fubu-chan or someone get them? Hm? Ah, is that what dropped? Nope. Probably in these crates. Yeah, that's what's up... There's around four of them? Yeah, let's collect them. Ah, Ascendant rifle... Here, oh, over there?

    I'll stash some things in the Argent, like pump shotguns. Yeah. Huh? Where's the Argent? It's right here! Over there, okay. Heading this way. Okay. Open inventory. Saddle, cooked meat, semi-auto... Guess we can just take everything. Yeah. Crates, ah... Ascendant rifle, so good! Nice. Wait, I'm putting items in, putting items in. Are there any more crates? Four, right? Doesn't look like any more. Yeah! Nice! Nice! Nice! Spawns are scary, so let's get out of here. Dump and run. Yeah, let's head out.

    Aren't you heavy? Are you okay? I'm good. Okay. Is this the right way? For the exit? Ah, probably... It was a bit heavy. What is making me heavy? Raw meat is heavy? Yeah, looks like raw meat was still weighing me down. Uh-huh. Just follow the path? Nah, stuff to drop so we are fine. Okay. Alright, Ahh~ Well, for now, take the meat, and dump the rest here. Oh, there's an egg!

    Okey-dokey. And now, waiting for everyone. Okay, heading out! Okay. Right or left? Isn't it right? Looks like we can't slip through the top. Gross. Too gross. Can we even go through that in the first place? Artifact retrieval... where's the artifact? I think this is it here, but it hasn't spawned yet. Didn't they say to just take a photo? Ah, yeah, I think someone mentioned that. Artifact. I'll snap a pic. Okay. Done. Got it. Uh-huh. Uh-huh. Right, through here? Maybe? There? Alright.

    Thanks for the screenshot! Right? This way? If we keep going like this, will we get out? Time to check.


