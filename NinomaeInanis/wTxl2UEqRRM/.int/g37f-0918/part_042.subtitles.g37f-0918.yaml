    First, I heard Ina say, "There's no Tyrannosaurus at all~" (00:02-00:06). Hmm. Then a VC member, it *sounds* like Matsuri, but I'll double-check this, chimes in, "Plus, finding 10 within an hour might be tough. Maybe we should change the goal?" (00:07-00:13). So, a time crunch and a hunt objective. Next, Ina suggests, "Should we switch to taming? How many left to tame?" (00:13-00:15). Another VC member (Matsuri?), says, "We have about 3 left to tame, so..." (00:16-00:18). Then, Ina muses, "3, huh. What HAVEN'T we tamed yet, then?" (00:18-00:22).

