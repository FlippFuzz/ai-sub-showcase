    original: はい。上で、アイスワームクイーンを倒しました。
    english: Yes. Up there, we defeated the Iceworm Queen.
  - start: '03:19.500'
    end: '03:22.500'
    original: これ、トワ様の犬、しまえないの？
    english: Wait, Towa-sama, can't you put away your dog?
  - start: '03:22.500'
    end: '03:25.500'
    original: 多分、ワープしてくるから、大丈夫。
    english: It'll probably warp, so it should be fine.
  - start: '03:25.500'
    end: '03:29.200'
    original: |
      コンパニオンだったら大丈夫。あ、コンパニオンか。おっけー。
    english: If it's a companion, it's fine. Ah, companion. Okay.
  - start: '03:29.500'
    end: '03:33.800'
    original: 一応、情報だけ共有しといたよ。
    english: For now, I shared the info.
  - start: '03:33.800'
    end: '03:36.000'
    original: |
      助かる。
    english: Thank you.
  - start: '03:36.000'
    end: '03:39.200'
    original: |
      ヒットポイント足りるかな、私のやつ。
    english: Will my HP be enough?
  - start: '03:39.200'
    end: '03:43.800'
    original: |
      最悪だめだったら、あれ出すわ、テリジノ。
    english: Worst case scenario, I'll bring out the Therizinosaurus.
  - start: '03:46.500'
    end: '03:51.200'
    original: |
      あ、誰かさ、ロケラン作ってくれてたじゃん。
    english: Oh, what was it... someone crafted rocket launchers for us, right?
  - start: '03:51.200'
    end: '03:57.500'
    original: |
      ロケラン3本にして、あとロケランの弾もちょっと作っといたから。
    english: I made three rocket launchers and crafted some ammo too.
  - start: '03:57.500'
    end: '04:02.500'
    original: |
      助かる。ラヴァさんをやるためにね。
    english: That helps! To deal with the Lava Golem.
  - start: '04:02.500'
    end: '04:05.500'
    original: |
      まぁ、3人ぐらいだったら、いけんのかな？
    english: Well, can we do it with just three people?
  - start: '04:05.500'
    end: '04:09.500'
    original: |
      道中で死ななければ、って感じかな。
    english: As long as we don't die on the way, I think.
  - start: '04:09.500'
    end: '04:14.200'
    original: |
      あの、フックショット使ってもらわなきゃいけないから。
    english: Because we'll have to use grappling hooks.
  - start: '04:14.200'
    end: '04:16.800'
    original: |
      そうそうそう。
    english: Right, right, right.
  - start: '04:16.800'
    end: '04:19.500'
    original: |
      なんか湖ビリビリになってるけど、これ。
    english: The lake seems to be buzzing with electricity, though.
  - start: '04:19.500'
    end: '04:22.500'
    original: |
      あ、もう湧いた？
    english: Ah, did it spawn already?
  - start: '04:22.500'
    end: '04:25.500'
    original: |
      湧いてる？
    english: Is it spawning?
  - start: '04:25.500'
    end: '04:28.000'
    original: |
      3分経った？
    english: Has it been 3 minutes?
  - start: '04:33.500'
    end: '04:38.000'
    original: |
      ユーティの体力増やしとこうかな。でかい！
    english: Maybe I'll increase Yuty's health. Woah, it's huge!
  - start: '04:38.000'
    end: '04:41.500'
    original: |
      でかい、でかい。そろそろいけそう。
    english: It's huge, it's huge. We should be able to go soon.
  - start: '04:41.500'
    end: '04:44.200'
    original: |
      およ。ほんだら、くぐるかい？
    english: Oh. Shall we go through then?
  - start: '04:44.200'
    end: '04:48.200'
    original: |
      くぐる？
    english: Go through?
  - start: '04:48.200'
    end: '04:54.000'
    original: |
      おっけー。びちゃ、溺れる、溺れる！
    english: Okay. Splash... Ah, I'm drowning, I'm drowning!
  - start: '04:54.000'
    end: '04:57.000'
    original: |
      陸に上がればいいのかな？
    english: Should we just get on land?
  - start: '04:57.000'
    end: '05:00.000'
    original: |
      ちょっと遅れてます。
    english: I'm lagging a bit behind.
