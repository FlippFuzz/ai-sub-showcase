  thoughts: |+
    **ARK: Survival Evolved - A VTuber's Stone-Cold (and Heat-Stroked) Adventure**

    Okay, so the plan is pretty straightforward: get subtitles going for this Ina'nis ARK session. We've got the audio, now let's break it down – timecodes, Japanese (og), English (en), all that jazz.

    Right, so we're diving into this ARK session, and right off the bat, I'm already a bit flustered, trying to figure out how to, "え、どうやって入れるんですか？" (Wait, how do I put it in?) - you know how it is. And then, "乗れる？" (Can I ride it?). "表..." (Outside...), and getting out to the base, "拠点、拠点に出た。" (I got out to the base, the base.) – but oh no, stamina issues! "スタミナ切れてるくせに下に降りれなかった。" (Even though I was out of stamina, I couldn't drop down below.) Stone gathering, but even then, "石で...でも言ってもそんなだな。" (Even with stones... though it's not that much.)

    Bibi helped, "ビビも手で掘ったから" (Bibi mined by hand too). Big success! "あ、大成功、ここで！" (Oh, big success here!). Then, a debuff. "あ、このデバフ何なんだ？何だこのデバフ..." (Ah, what is this debuff? What's with this debuff...). "あー、なるほど。" (Ah, I see.) – Ah, it's really messing with my vision. "視界不良すぎて前にまっすぐ行けない。" (My vision is so poor I can't walk straight forward.) – I was thinking dehydration? "脱水症状とかになってない、それ？" (Aren't you dehydrated or something?), but water's full.

    Back to the stone situation. "これ石まだ必要ですか？" (Do you still need stone?) "石あると嬉しいかな..." (I'd be happy if there's stone...) – Bibi...taming might be the better play. "テイムの方が嬉しいかも。" (taming might make me happier.) Oviraptor? "え、何がいい？オヴィラプトル？" (Eh, what's good? Oviraptor?)  Uh, I should ask someone... But Bibi has the Doedicurus, so that should be good! "ドエディテイムしてるから大丈夫そうね。" (Looks like she's taming a Doedicurus, so we should be fine.) Now just, "石取ってきてほしい。" (I want you to gather stone with this.) – my vision is bad though.  It's just the nearby stone.  I need stone, "I just want to bring stone back home... Please, please, don't kill me..."  Also, ingots, "インゴットが足りないから..." (Because there aren't enough ingots...), oh no! Then the game throws spawning shenanigans with the elevator!

    And there it is, a moment of joy, followed by a fall. "え、面、死んでしまった...石持って帰れないかも。" (Eh, face... I died... I might not be able to bring the stone back.) Possible Argentavis loss is too much "アルゲンロストするかも...もう無理..." (I might lose the Argentavis... I can't anymore...) It's just a lot.  So, I died because of the weight! Then, my vision has problems, and I see heatstroke or something "視界悪いな...熱中症の可能性ある。モヤモヤって右下になんか出てない？" (Bad vision, huh... Might be heatstroke. Isn't there something blurry/glowing on the bottom right?)

    Water it is! "一定時間川の水の中にいないと解消されないから" (Ah, that won't go away unless you stay in river water for a while, so prioritizing that might be better.)  But I'm running low on ingots, "インゴットが足りないのか..." (So we're short on ingots...).

    It seems that the Doedicurus, "ドエディ..." (Doedicurus...) – Is this like that?  It does look like it! "わ、すごい！世界変わる！これ、ドエディ..." (Whoa, incredible! The world changes! This Doedicurus...) -  This thing smashes for so much. "めっちゃ、もう一発で1000とかよ。" (So much, like 1000 in a single hit.) Wait... It can even be as good as the Ankylo that Gozar uses

...
