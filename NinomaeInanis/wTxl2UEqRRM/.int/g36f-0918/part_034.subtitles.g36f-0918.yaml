    \ more stone!\" Alright, the plan is to switch.\n\nThe player realizes how hot\
    \ it is! The player is saying they put in the cementing paste and asks if they\
    \ can craft this. There is a lot of frantic energy. 39?! What happened? Are people\
    \ taming a bunch? It sounds like they are going to see what they can tame and\
    \ get more stone. Can the dino break the stone? No! Maybe tame something else...\
    \ Yes, I'll give it a try! There's something in the way. It sounds like they can't\
    \ get to the teleporter. The player is having trouble seeing! It sounds like the\
    \ dinos are a problem. Did they remove clothing?\n\nOh no! It sounds like they\
    \ should gather dinos! Too hard to see! Can we tame this guy? Why is it so hot?!\
    \ The player is stressed and having problems. The player is tired in a bad spot!\
    \ Nooo! Stop! We are waiting for stone! Who lit the fireplace? The room is too\
    \ hot! Oh no, calm down! The player is stuck! The player's on their way back!\
    \ It's so hot! And the player is struggling to move. The player can't dismount!\
