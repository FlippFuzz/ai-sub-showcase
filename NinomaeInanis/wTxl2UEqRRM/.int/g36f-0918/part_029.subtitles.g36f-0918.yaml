    **ARK: Survival Ascended – Ina's Tactical Stream of Consciousness**

    Okay, here's the deal: I'm diving into this ARK: Survival Ascended clip featuring Ina'nis ("Ina") and her squad, and the primary objective is to get a handle on what's being said, down to the millisecond. We need those subtitles, and it's all about vocal audio.

    First, the goal is to go after an Ice Wyvern. Let’s see what's what. Bibi-chan on the Lightning Wyvern is a good option. I wonder where it is though. Oh, it’s in the fridge! Now, should we move it? Wataame-senpai is here, oh, that's fine, I will deal with the bears. Right, let's take off. This was an Argentavis... it got separated. Bibi, are you okay? Should Bibi use a Griffin? Oka~y, wow this is slippery! Okay Griffin, a Griffin or Lightning Wyvern will work!

    What is this? It's really heavy, maybe some fur? Ah no, it was a glitch! It flew! Okay, it flew. Right, let’s go. I can see the Wyverns. If you could defeat the ones around here, that would be great. Alright. Hey, Wataame-senpai, is that you flying a Wyvern? Alright, senpai~! Are you on a quest looking for a Yutyrannus? Alright. Ah, shoot, voice range isn’t reaching. I need help dealing with the wolves. Wataame-senpai is fighting bears. Okay, are you okay? Oh, you’re fighting wolves! Riding a Griffin and heading over! The Yuty is getting beat up by the Rhino... Can’t we do something about this Rhino...?

    This is a different team! Yeah, and I don't know what they are trying to do! Here it comes. Let me try talking to them. Can I take this Yuty? Ah, it's reserved for a mission... Ah, what? What? The Yuty is scheduled for the 9:30 mission... Ah, roger! We’ll do another one! Sorry! Sorry! Okay, okay. Ah, it's Koyori-san! Alright. Gozaru-san! She’s riding, okay. Fighting a Mammoth. Um, that’s it. Crossbow! Wait a second, I can’t shoot while driving. Um, Gozaru can't shoot, so it’s fine if you hold it. Should’ve repaired before coming here. Can we go? Um... Okay, let's craft something. The wolves are strong.

    Aki Rosenthal is here, how are the preparations? I think it’s fine. Can we go? Oh, yeah, I can see Gozaru. The wolves... I want help dealing with them. Shall we kill them? Right, the mission starts in a moment! Okay, I will start the countdown. Are you ready? Mission start! Okay, have them land... We need to kill the wolves. And, we need to kill the wolves. I’ll bring them closer first. Hey, wolf, stop tail-swiping! I have tranq arrows! Sorry, this Ptera and zebra are not mine. Where's the Yuty?

    The surrounding mobs, need to be cleared so the Yuty won't get KO'd. The Griffin should handle this. I want Bibi to hunt the mammoths. Okay, I understand. Can I shoot tranquilizer arrows now? Yes, you can. I’ll get the mammoth. Just be careful not to hit the Yuty. Alright, moving away a bit. Ah, yeah, better to do this after the Yuty falls asleep. Bibi is in the way, I lost sight of Yuty!


