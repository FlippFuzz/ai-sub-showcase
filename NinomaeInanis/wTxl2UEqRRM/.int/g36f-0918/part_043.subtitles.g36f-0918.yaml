  thoughts: |+
    **ARK Adventures with Ina-chan and the Hololive Crew**

    Okay, so here's the deal. I'm diving into this ARK video, right? Gotta get those subs down, and I'm treating this like it's my own thought process. It's time to meticulously transcribe the Japanese and give it a crisp English translation.

    First off, "Nobody's here anymore. There's no one." Wait, is everyone AFK?

    Then there's the chatter about this insane obstacle course taking an hour, and someone is convinced they are gonna die, or maybe they *are* dead.

    The "One hour?" remark - this has my full attention.

    And the chat, "We can do it! Towa-sama, who conquered the horse yesterday, can do it!"... Conquered the... horse? Oh, wait, "Umamusume"? That makes more sense. Still, Towa is on fire.

    "Trust in Towa-sama! Please trust us!" Huh, they are really fired up!

    "Trust in the me who trusts you..." What?! Did I just say that out loud? That's kinda cringey...

    Okay, time to check narcotics: barely have any. Only 50. Ah, but that's what teammates are for. "I'm making them right now! Here!" Excellent!

    If I get 100 narcotics, can I do the obstacle course? I guess I should give it another shot! Good luck everyone! Wait, is that a Rex?

    "Wait, outside... isn't that a Rex?" Rex? Get out!

    "Rex! Rex! Rex!" Oh no, I'm getting sleepy! "Let me just kill it because it's annoying." Yikes! That's a bit harsh! Well, it's just ARK after all. And the BGM's winning!

    That doesn't look like a Rex, it looks like it has a thin face... wait, is its face thin?

    "Can you stop bullying the Pteranodon I randomly caught?" I can't catch bugs!

    "I think so, probably. This Pteranodon... please hang in there..." Okay!

    I'm getting serious here. "Pteranodon! Hey, you! Go away! I have no business with you!"

    Man, did I just kill the wrong dino? Ah, it's time to be a good neighbor, and take care of the nearby pests. Okay, time to deal with the thin-faced dinos. Ah, here it is, "Come on, you! Come over here! Hey, come over here!"

    "That one too... its face is thick... Not thick! This guy is thin!" I am surrounded by thin faced dinos! I can't be interrupted by them!

    Wait a second, I'm stuck... AAH, thank goodness! Now, time to clear them out!

    "What's that...? Looks like a bug..."

    That wyvern! It's alive!

    I gotta ask... "Is it alive?" Okay! Ready to try the obstacle course.

    I see... I see... Bolas...

    Now, let's try this. "And then, go back... Eat it, you! It's flying... Whatever... Ah, it's fine."

    These Bolas... are quite something.


