      悲しみに濡れた翼 かさなりあう純白へ
      渡し合った未来へのやさしい勇気
      誰も知らない世界の夜明けを待っている鼓動
      光を連れ て旅立つわたし にはじまる 明日

      舞う雪は星の欠片 天体に手 を伸ばして
