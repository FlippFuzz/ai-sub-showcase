      舞う雪は星の欠片 天体に手を伸ばして
      行き交う願い感じているね
      すべては今モノクロームの中

      そっとこぼれた白い息 伝えきたかった言葉のかたち
      きっと温もりのぶん だけ空はほんのり明るくなった
