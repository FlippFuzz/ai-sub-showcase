    **ARK: Survival Ascended – VTuber Subtitle Transcription & Translation**

    Alright, let's break this down. First, I'm setting the stage: Ninomae Ina'nis and Shiro (maybe) are playing *ARK: Survival Ascended*. My task? Accurate subtitles. So, I need to nail down the Japanese transcription, context-sensitive English translation, and precise time alignment. Okay, initial thoughts – I see Ina fiddling with the radial menu. "ちょっとお辞儀させたらオッケーかな？" – that first bit is key. “Ojigi”... it’s “bow” right? No, I think she wants to make something passive or sit. Hmm. Then the other person says “Ikeru kana?” – will it work?

    Then it’s time to transcribe and translate: “えっと、とま、とま、止まって...” (stop, Ina!) "止まって、止まるやつが、オッケーオッケー、それでオッケーかな、うん" (Stop the stopping!) - and it is all about stopping and whistling to get the beast under control. “大丈夫ですか？オッケー” – are you okay? Ok. Then something about the Yuty... “じゃあ、ユティに乗…” – Oh no, mantis attacks! “やばい、カマキリが！” – Ina says "Yes!" and goes! "おっしゃ、はやーい" - "Here we go! Alright, so fast!"

    They hit the water. More mounting and dismounting, which leads to "乗れる、乗れる！" (you can, you can!) and "Ah, too far." Aha, Pyromane taming! And Mantises. "あ、ヒョウが死んだ" or "あ、ひょうが死んだ" - "Ah, the leopard died!" The Pyromane's dead! It's difficult and it's their first time playing! They’re having a tough time with these mantises.

    Okay, more moments where they fight, go for a dip. The other person says they want to come and collect them (is it dino or another player? It looks like "シロ” (Shiro), the dino). But no, they are going to "pick up" Shiro. More actions... "They suddenly flew in. I'm going to go pick up Shiro."

    It's all about precision in *ARK*. I'm picking up on the Japanese and the context here is critical, it's not a direct translation, it’s a *game*. A lot of action. And the water... the mantises in the water... Shiro's first time! So then, more meat. More "heave-ho". "Should we place a bed?" Oh right, respawning, and a dino "やべ,なんかでかい恐竜がいる" - big dinosaur! I must transcribe correctly, then it goes from there. "待ってまーす" - "I'm waiting!"
    Oh, the other person wants help "イナ、カマキリ助けて！" (Ina, help me with the mantis!)
    And finally, "また同じ…" (the same one again...) They are back to taming the same beast!


