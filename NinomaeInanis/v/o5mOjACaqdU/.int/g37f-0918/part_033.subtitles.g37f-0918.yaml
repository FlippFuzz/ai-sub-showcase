  thoughts: |+
    **ARK: Genesis Part 2 - Crate Quest Troubleshooting**

    Okay, here's the breakdown of my thought process while trying to locate that elusive cave. Initially, I'm just getting into the swing of this Hololive ARK stream, casually helping out with the crate hunting. I hear the others chatting on Discord. I hear someone mentioning crates, and I offer to take one. I grab one, but it seems there's no way to open it at this point? What's going on with these missions?

    Then, the quest for a cave begins. We're looking for an entrance; I’m pretty sure it's near the river. I suggest checking the nearby river for openings. I'm thinking, "Maybe there's a cave opening, let's explore this area. I believe I see a waterfall, I ask the others for their help and try to dive into the waterfalls, hoping there is a secret entrance. No luck. Nope, nothing. This doesn't seem right. There's supposed to be something here! I am following a reference. I suggest the entrance may be in the swamp near what we think is the castle.

    Then the puzzle deepens. Somebody told me there's a castle to use as a landmark. Where's the castle in this game? Do buildings even exist? Perhaps that glowing green thing on the horizon is the building? I start questioning my sanity: is there even such a thing as a castle in this world? Is this world even accurate? I see another yellow crate spawn, and I get distracted. I notice there are other streamers online. Is this entrance even in this area? This isn’t a cave...and I become more confused.

    I think the coordinates on the shared reference are wrong. I do a web search and I'm sure of it. This cave should be in the top left, but that reference doesn't seem to make any sense. We're going to use the online source. Alright, let's go based on the new information and try again to find this place. Time to follow the online information instead.


...
