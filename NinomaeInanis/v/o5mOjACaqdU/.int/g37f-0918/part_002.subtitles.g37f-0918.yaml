    **ARK: Survival Evolved - Building and Braving the Elements**

    Okay, here we go. Time to get to work on this breeding facility. First thing's first, gotta make a simple, but functional setup to take care of these eggs. I'm thinking stone walls, stone foundation... Yeah, Ina-senpai gathered a ton of materials yesterday, so we should be good on that front, at least for now. Wait, she's actually offering to go get more if we need it? That's a huge help! Right, time to craft that campfire, or... is it a torch? Campfire, that's it. Wait, did she just pass out because she didn't drink enough water? Humans are so fragile. I need to make a lot of waterskins.

    Okay, let's get back to it. First, I need to make sure we're covered on food and water. I should split up this food stack for today's meals. Wait, is that food already spoiled? Haha, maybe! I'll go get some water and wood, and Ina-senpai, I'm counting on you to fetch that water skin.

    Right, then. So I'll be working on this breeding facility in the meantime. Alright, ceiling, ceiling... first... Hmm, humans are just too frail. They're so weak! We can only rely on waterskins and have to rely on waterskins... it's a bit of a problem.

    Ah, there are some dinos, though? Someone placed them in there... Okay, I'll bring our "Attack ZERO" to you... I think it turned out to be a bit... "prison-like" design. Is that okay? "Is it really bad after all? As expected, is this no good...?"

    "Like, a little..." *...the design isn't that important.*

    "A bit..." *...a bit cramped.*

    "That's right! Looks don't matter! It's about performance!"

    It's not about looks, Ina-senpai! Oh thank goodness! She is so open-minded, what a lifesaver. Alright, with this, the campfire...


