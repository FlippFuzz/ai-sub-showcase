    (00:00.000) Okay, she's asking if she can take something, then she has to go somewhere to get it? Oh no! Sounds like trouble. (00:04.200) Uh oh, everything's a mess. Is underwater travel not an option? (00:08.800) Oh, they're saying no, not yet. (00:10.800) And she drew aggro! I need to be exact here, make sure every translation is perfect. Does this mount run out if you're not riding it? (00:16.200) Ouch! (00:17.300) Oh dear... (00:18.800) Wait, my mount is gone! Oh no, maybe I have to borrow one. (00:27.500) I gotta make sure this next dino survives. Going with the mindset of definitely not letting it die... I'm going to borrow a Ptera... (00:33.500) Wait, it doesn't have a saddle? (00:37.000) Is there a saddle? That is not good. (00:38.500) Ah, this might be the end for me. I need to be more precise about this. (00:46.000) Are you okay? Did I lose my mount? My Ptera! (00:53.000) Wait a sec. (00:56.000) My Ptera... I should have put a sleeping bag down.

