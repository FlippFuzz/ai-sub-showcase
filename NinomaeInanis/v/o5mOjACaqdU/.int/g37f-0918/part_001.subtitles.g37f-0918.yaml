    **ARK Planning with Hololive Crew**

    Alright, let's dive into this clip of Ina'nis streaming ARK with Hololive members. I'm focusing on providing accurate subtitles in both Japanese and English.

    *   00:00 - 00:30: Botan-chan and I are on the move. Iroha-senpai mentions Towa-senpai's plans for pearls and oil pumping. Iroha wants to take advantage of Usa-chan's carrying capacity. We're all set to go!
    *   00:30 - 01:00: Iroha wants me to come with her. Towa-senpai also wants to join. Iroha mentions the fear of losing gear in case of death, which makes us a bit uneasy.
    *   01:00 - 02:00: I'm a bit nervous but Iroha starts talking about yesterday, and a mission involving our Argentavis. It turns out we have to breed and kill them.
    *   02:00 - 03:00: I'm trying to figure out where we left the Ptera, Iroha thinks the Argentavis might be gone. We end up moving the Ankylo.
    *   03:00 - 05:00: We decide I will use the Ankylo (Attack ZERO). We also need to get materials for stone bases, and I need to organize my Ghillie suit. Our objective is to capture more Argentavis and start breeding them. I will run to keep up.


