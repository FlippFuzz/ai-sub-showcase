  thoughts: |+
    **Hololive ARK Stream: A Linguistic Excursion**

    Okay, so here's the situation. I'm diving into this Hololive stream of *Ark: Survival Evolved*. Ninomae Ina'nis is streaming, with Subaru, Towa, Botan, Fubuki, and Koyori. Right, subtitles are the order of the day. Gotta transcribe that spoken Japanese dialogue, translate it into English, and make sure those timestamps are spot-on.

    At the outset, we're doing a quick transcription. "Warp kana?" and the response, "Un, waapu ka, okkee." Let's warp. Base is the destination initially. We get straight to the action, there's combat! "Ikiro ga meccha kougeki sareteru!" - I'm thinking, "he can't survive!" Got to make a note of this. And watch out! Then Argent gets involved. "Fuzakeyagatte," I note, with the typical humorous banter. After a bit of banter, "Honnara jaa terepootaa ikiyashou," - let's go teleporter.

    Now comes the "Teleba!" call, everyone's doing the "yabai" thing. We are all trusting the Argent! Now we're dealing with space constraints, "Viira semai." "Acchi ike!" – a typical call. Oh no, legs are short! "Ikkai tonjatte kara hairu ze." Fly first, then in. There's some dismounting troubles, "Orirarenai." – can't get off. We're thinking to ourselves, what is going on. We are trying to find where we are.

    "Since it's top left, um, here, maybe this one?" We're in the jungle. "Ah, I got left behind!" Note the "Carnivore Cave" destination. We wonder where to look, it is raining, there is poor visibility. Bitera's gone. Then confusion, "Where's Bibi?" Bitera's here, or maybe she isn't. The teleporter is used. This is not the right jungle.

    Then we're off to the teleporter again, finally we reach. This is the goal – the artifact is here, right? We have to fly in and there's the cave. "Uwaa, omoshiroi! Ao, meccha aoi na." It's so blue. We're getting the Artifact of the Clever. "Right, right, if we go all the way to the deepest part it should be there." I wonder, what way to go. "Left seems the best". We consider splitting up but then, "Bibi is scared alone." Oh, this may be the wrong way. A different team? What to do with the other team? Then the last realization, "Is this a cave?"


...
