  thoughts: |+
    **A Stream of Consciousness (ARK: Survival Ascended/Evolved)**

    Okay, here's the deal: I'm watching this stream, right? Ina's playing *ARK* – it's probably *Survival Ascended* or *Evolved*. First thought? Is someone building next door? Wait, maybe a neighbor? Free Wind? *Is* there a neighbor? Yeah, close by, right by the river. It's actually good to have some space. This Chira... she comes over a lot. I'm grateful for that!

    Hmm, what's this "primitive companion camp equipment"? Looks like dog gear. Let's get Armadoggo suited up! Companion mode... it's supposed to give unique abilities. But what about this dog that *already* has it? Is it useless? Should I put it away? What does "companion" even *mean* in this game? Coordinates... 54, 52... kinda close. Should I head over there?

    Can I make it to the hunting base? From now? Hunting base, yeah. If you could meet me there. Okay, got it. Let's go together, pill-pill. Day 2! Huh, how was the 9 PM event? The door... Yes! We won, right? It wasn't Ina? Nice, nice! Where did I put my clothes? I don't remember! I want to stand up. Ah, wait. I can't find my own clothes. Clothes, um... What happened? Maybe it's at the game venue? The Team C chest?

    Ina-senpai's obligation... let's hit the hunting base, right at the last minute. Okay, it's fine if I lose it. Movement... I'm hungry. I haven't even made clothes. Should I? Especially if I'm making river gear and things? Naked as a jaybird! Heave-ho! Uh, hunting base... where was that again? Ah, lost! Crystal and, what was it called... the teleporter's. Metal crystal?

    A dog is following me. The dog is in the way and I can't get out! One chance? Sure! Why is the dog wandering around? Wait, did I catch that dog? Oh, right, I got it as a participation prize! That's right! Do! Do! Sorry, sorry! I did something... Front, what is this? Uh oh... Get away, get away, get away! The weather is bad... Alright, this way. Whoa! Wait a sec... Everyone stop. I got the dog, but... I don't know how to use it! True. It's tough. There's one... There's something huge over there!

    Hey! It's the elder leader! Yes. Hello. Congratulations. That's amazing! This, okay... Oh? Victory? Out! Out, Zeppelin? I'm curious. What is it? What's that? Huh? Does it come out? What, what? Might as well go. Ah.


