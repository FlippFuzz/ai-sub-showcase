    **Navigating the Labyrinthine Depths: A VTuber's ARK Adventure**

    Okay, so I'm diving into this ARK cave exploration, and, *first thought*, "Is there any way out of here? Where are we?" This is quite... exquisite in terms of the game's hitboxes, though, it's not the correct way. I'm already lost.  It's like I'm a lost child... but I'll manage, I'll go that way, though, this is so hard.  Whoa, is this another dead end? It's all full of gas here, but it should be super purple. I think it'll be super easy to spot. Like it's a huge treasure or something.  True, the way it's placed and all.  Is this a dungeon? Wait, is this even a dungeon to begin with? Oh, wait, I saw some pink moss. I thought if it's not a pink dungeon, maybe it's fine, but...

    Blue— oh, this is a mushroom. Oh, blue mushroom! Blue mushrooms are here! This pink thing... it's organic polymer. Hold on. Oh right, can I take it? The ones that are given to you. Ah, right, right, right. Wait, can I take— huh? What is this? Wow, oh— Did I find it? Yay, there it is! Oh, nice. This is that thing. If I go up, that's the exit. Is this it? Looks like there are two of them, though. Is this the target? Ah, ah, ah, this is the Artifact of the Immune, though. Ah, then it's not Strong. There should be more elsewhere. Still, you can take it with you. Ah, I'll take it back, I'll take it back. Well, let's go this way. Whoa, lost, I'm lost! So lost, so lost! Ah, right, right. Got out, thank goodness. This was the exit for the Artifact of the Immune, right? Since Fubuki-senpai and Fuuka were right here. Ah, I see. That's probably what it means. Should I try going this way? Let's search.

    It's quite a maze. True. It's gotten pretty crazy. Sigh. Oh crap. Lost. I'm completely lost. Totally lost. Oh. I'm totally lost. Oh my god. I'm separated from everyone already. Man, it's huge. And wide. Huge, wide, this is bad. This is wide and crazy. Blue bamboo shoots. Huge and wide. Oh man, blue bamboo shoots, huge, wide, this is crazy. But since I can't see anyone else, maybe we're not overlapping? Right? Nobody's here. They had something like a Therizinosaurus out. Well, an amazing Argen— I found the yellow place, but... What is this? What's this? Beats me. Huh? Stamina. Stamina recovery. Left, left. Wandering. Oh, it's heavy, heavy. Heavy, heavy. Wait a second. Oh, oh—

    Heading out. Ah, Ino-senpai, let's go. Ah, this is— Ice cave? This way or something? True. Ah, something came out. Sorry, Towa's kind of spaced out for a second. Sorry, you two. Are you guys following? Tell me if you can't see. Okay! I ended up right by the castle place. I'm still like, searching all sorts of different paths. There are little spots where you can squeeze out on top. True, right? There are places you can exit. The Therizino's stamina— watch out for it. Rest here for a second, stamina's running out. Oh boy. That is— Crystal? Or is it not? Like, really, in pink color, there should be items with a fuzzy glowing aura. Someone is here, but whether this place actually counts as a cave is what I don't know. Ah, I think it probably counts as a cave. So does that mean we have to wait again? But in the end, I have no idea what they're doing. Even if I go there. Are they searching? Ah, is that the portal? Ah, is that wrong? Not a portal. Someone's house, maybe? Ah, it's that team's house, right here. Oh.

    Wait, we need Strong for this, right? Right, right, Strong. And we found Immune earlier. Okay. Immune? Ah. Like, around the light blue area, was there Immune? Deep in the light blue. It seems like we should head toward the purple areas.


