    original: 嗚呼 手を伸ばせば 伸ばすほどに 遠くへゆく
    english: Ah, the more I reach out my hand, the further away it goes;
  - start: '02:59.788'
    end: '03:06.318'
    original: 思うようにいかない今日も また慌ただしくもがいてる
    english: today nothing goes as I want, and I'm struggling frantically once again.
  - start: '03:06.848'
    end: '03:12.728'
    original: 悔しい気持ちも ただ情けなくて 涙が出る
    english: The frustrating feelings are just so pathetic, tears start to fall,
  - start: '03:12.728'
    end: '03:19.468'
    original: 踏み込むほど 苦しくなる 痛くもなる
    english: the more I step forward, the more painful and aching it becomes.
  - start: '03:21.088'
    end: '03:30.298'
    original: 嗚呼 感じたままに進む 自分で選んだこの道を
    english: Ah, moving forward just as I feel, down this path I chose for myself,
  - start: '03:30.298'
    end: '03:35.308'
    original: 重いまぶた擦る夜に しがみついた青い誓い
    english: clinging to a blue vow on a night rubbing heavy eyelids,
  - start: '03:35.798'
    end: '03:43.768'
    original: 好きなことを続けること それは楽しいだけじゃない
    english: Continuing to do what you love isn't just fun,
  - start: '03:43.768'
    end: '03:49.798'
    original: 本当にできる 不安になるけど
    english: can I really do it? It makes me anxious, but—
  - start: '03:49.798'
    end: '03:59.838'
    original: 嗚呼 何枚でも ほら何枚でも 自信がないから描いてきたんだよ 嗚呼 何回でも ほら何回でも 積み上げてきたことが武器になる
    english: Ah, no matter how many times, look, no matter how many, I've drawn because
      I lacked confidence. Ah, no matter how many times, everything I've piled up
      becomes my weapon.
  - start: '03:59.838'
    end: '04:12.288'
    original: 周りを見たって 誰と比べたって 僕にしかできないことはなんだ 今でも自信なんかない それでも
    english: No matter how much I look around or compare myself, what is something
      only I can do? Even now I lack confidence, but even so—
  - start: '04:13.258'
    end: '04:26.548'
    original: 感じたことない気持ち 知らずにいた想い あの日踏み出して 初めて感じたこの痛みも全部 好きなものと向き合うことで 触れたまだ小さな光
    english: Feelings I'd never felt, thoughts I hadn't known, stepping out that day
      and feeling this pain for the first time—everything touched by facing what I
      love, a still-small light.
  - start: '04:33.248'
    end: '04:40.408'
    original: 大丈夫 行こう あとは楽しむだけだ
    english: It's going to be fine, let's go, all that's left is to enjoy it!
  - start: '04:41.138'
    end: '04:50.018'
    original: 嗚呼 全てを賭けて描く 自分にしか出せない色で 朝も夜も走り続け 見つけ出した青い光
    english: Ah, risking everything to paint with colors only I can produce, running
      continuously through morning and night, I found that blue light.
  - start: '04:55.278'
    end: '05:00.000'
    original: 好きなものと向き合うこと 今だって怖いことだけど
    english: Facing what I love, even now it's terrifying, but...
