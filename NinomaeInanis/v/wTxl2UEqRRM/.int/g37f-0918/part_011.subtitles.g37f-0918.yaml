  thoughts: |+
    **Hololive ARK Adventure: A Summary from Ina's Perspective**

    Okay, so I'm watching this clip of me and the others – Botan, Okayu, Towa, it's a Hololive ARK session, I think we're going into the underwater biome of the Genesis map and I know there's some interesting stuff down there. I'm focusing on the gameplay, but also the chatter going on. Okayu's trying to figure out how to keep item names constantly displayed, and I remember something about that setting. I offer some guidance on where to find the options, pretty sure it was under "Controls" > "Left" > and then a menu selection that's fourth from the top.

    Okayu gets it, and then she's struggling with the HUD. She's got her settings all customized. I can relate. I also remember there was a way to toggle stats, but I'm not entirely clear on what she's aiming for. She was definitely looking for a way to always show those stat details. I think I did a decent job helping her out with the menu settings. I seem to recall it being related to the "HUD" or "Show HUD" options somewhere, though I'm not totally sure. She's got it sorted now, she's happy. It's a team effort, you know?

    Then we're moving on, and we're trying to figure out where to go next. Botan and Towa are coordinating on where to find the Yutyrannus, and the teleporter locations. I'm trying to direct everyone to Number 10. Okayu is stuck with a dino who is on the other side of the wall. I guess it needs to be opened, so I keep my eye out for that, and I make sure to clear the area as best as I can for any drops. I'm trying to stay focused, even though they are joking around, so it's not a big deal.

    We had some trouble getting organized, and then there's some fun with Okayu being tiny. Then we have to figure out this area that's a bit hidden. I know where the entrance is, I'm trying to help everyone get to the right spot. Botan is making a good point that the Pteranodon can't go the whole way. I'm thinking we can fly some of the way, and then have to go the rest of the way on foot, apparently. Botan had posted the map too.

