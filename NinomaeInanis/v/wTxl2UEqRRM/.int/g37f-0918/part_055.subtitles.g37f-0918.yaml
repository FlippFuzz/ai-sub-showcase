    I need to transcribe this quickly, this HoloServer ARK game chat has many nuances! Okay, so the closing ceremony... in-game voice chat is probably not working, right? Ah, they can just share their screens, nice idea! Super helpful! Nice! Yoisho! I'm hearing someone is talking about getting the timing right for a specific jump... if they could just nail the timing... Maybe they could've made it. Gah.

