  thoughts: |+
    **ARK: Survival Ascended - A Doedicurus Dilemma**

    Okay, so I'm diving into this ARK: Survival Ascended session with Ina and the Hololive crew. First thought: Do we have a Doedicurus? Apparently, yes, and I can even ride it, which is news to me! Right, I'm just outside the base. Even though I ran out of stamina, it couldn't land, so I guess I'm off to mine some stone and metal. Bibi's getting stone too, even though there's not much. Around 1500, dropping the stuff here.

    Oh, what's this debuff? Blueprint? Ah, I see. What the heck? It's fine. Wait, this is bad, my vision is so bad, I can't walk straight! Are we sure I'm not dehydrated? Water's full though. Do we still need stone? Stone would be nice, I think. Wait a sec, Bibi, maybe taming's better?

    Taming? Sure, sure, what's the plan? We are going together right? Oviraptor? Ouch, ouch! Oh no! Bibi's nearby and the Doedicurus is being tamed near the door, so I'm fine. Use this and go for it! I want you to get stone with this. My vision is so bad... Understood. Okay, this one, I'll use this. Even this one right in front of me is fine. My vision is bad... With the Doedicurus... I'm being chased from behind... I just want to bring back stone.

    Please, please, don't kill it. Um, there's not enough ingots, so in... Wait, it's flat! Don't spawn next to the rainbow elevator, stop! Up we go. What is this? Ah... I can't believe anything. Irohaaaa! Helmet died. I might not be able to bring stone back. I might lose the Argentavis. It's over. You loaded too much! Definitely loaded too much! Eh, I can't move smoothly though... It's going to fly. If you don't get off, you'll be blown away. My vision... is deathly bad, I can't find anything at all. Why is it like this...

    Huh, bad vision could be heatstroke. Isn't there a hazy icon on the bottom right? Yeah, there's some white round thing showing... Ah, that won't go away unless you stay in river water for a while, so you should prioritize that. I see, inside water. Wait, it fills up right away. Um, water... There are not enough ingots, huh. Get my body soaking wet... Once... and take it out with 7... With this... Oh, this one, is it this one? Does this count as being in the water? Which is it? Oh no, it went down a bit.

    Whoa, amazing! This changes the world. Doedicurus. Doedicurus? What's this? Yeah, super... like 1,000 in one hit. Huh? Wait. Then Gozaru's Ankylosaurus might be pointless now. Even to the level where we could just leave it behind... Hup. No good. Can't get out. Ah, if I go to the forge, now it's... too hot? Hup. A ton of stone comes out in the ditch, this! That was a bit of an exaggeration, Bibi. Your exaggeration habit. Nice. Is it faster to roll? It wasn't a sickle. Even in shallow water... Ah, apparently rolling is faster, Bibi. Oh. I'll roll.

    How do you roll in this? Shallow water pond... Died. Eh, you died? Ah, no no no, wait... Ah, roll roll roll. This is... either way... Wait, what should I do? I can't crouch, what should I do about this? Is Mr. Doedicurus an herbivore too? Oops, I hit wood. Doedicurus is an herbivore. To knock it down, this is it, right? Using a bola... and put it to sleep. Doedicurus, berries... Herbivore is correct, right? Is it the fast running one? Take that! It's flying! Oh no, I can't crouch. What should I do?

    And with that, it's actually 10 PM, isn't it? Somebody help meee! Seriously? Eh, no way! I hate this, what is this! Huh? No, I can't crouch, and even if I get in the water it doesn't get fixed. The river next to the house should work

...
