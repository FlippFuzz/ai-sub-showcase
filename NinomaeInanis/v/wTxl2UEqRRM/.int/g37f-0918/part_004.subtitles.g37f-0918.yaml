    **ARK Adventures with Hololive Crew**

    Alright, let's dive into this ARK clip. Seems Okayu and Chloe were fiddling with some key configurations; I bet they accidentally messed something up and are now waiting. Five minutes, huh? Maybe Fubu-chan can lead the charge. Or, maybe it would be faster to go for a new one. Yep, let's take down this one and get it going.

    Hmm... graphics are still fine. Did I screw up the seconds setting?  Keys changed - ugh!  Can we make it? It's hot! Is it stuck right now? Maybe it's not working, is this one a level 130? No, it's 135! It's so tempting, but it'll be tough to endure. If it's three minutes, maybe we'll wait it out. Let's lure this over here, okay? I'm going to grab it with the Ptera... Ah! I fell off again! Jibukka (laughs). If you just wing it, it will probably be fine. Okay, go! It's not coming. Maybe the Yuty can use that item I got today. Should Yuty use it? If it can use it, it can use it, let's give it to Yuty. Stay way back, Yuty. Is it not really getting stuck? Phew... Let's wait here for a bit, okay Neko-chan? Sigh...

    Ina's just mentioned we didn't bring enough food. Hmm... Daily mission complete! Fur gear, maybe? Time for a costume change? Alright, there's another Ptera, so I'll head out. Okay. Oh, but the bed should be up soon, right? Oh, really? Yeah. Should we split up? Alright! Whew.

    Hmm... Neko-chan is moving away. Ina's saying we need raw meat. Do we have any? Hunt the bugs around there, it should work. Ah, okay. If they eat the bugs... melee weapon or mouse click? It's spinning around. Alright! Oh bugs! You bugs... Speaking of teleporting... How many minutes is the bed cooldown? Was it five or ten minutes, I think? Still no bed. Should I go pick you up? Did we split on the map? On the map, probably... Still nothing. No, that's there, so it's fine. We have another Ptera. Really? Wait a sec, I'll split some. Single-use sleeping bags? Oh yeah! Ahhh. Then I'm heading over. Okay. Heave-ho. How many minutes left, I wonder? Up we go.

    I feel like there was a bed somewhere. How many minutes left from before? No hide, huh. Alright.


