    **ARK Adventures with Friends: A Hololive Encounter**

    Alright, let's break this down. First, I'm watching a clip of a Hololive ARK: Survival Ascended session. The avatar is definitely Ninomae Ina'nis, or Ina for short, and she's speaking Japanese! It's #TAKOTIME, and I hear Fubuki in the voice chat. And wait a second, that other voice is... is that Laplus?

    So, this clip starts with Ina figuring out the Pyromane's diet, apparently with Fubuki helping out on the other side. "Holding R" to interact? Okay. After some general ARK gameplay, we hit a Megatherium, and it's looking pretty touch and go for Ina, which makes me think of all the strategies I would use at that level. A bit of panicked screaming and dino fighting, and then a call out... to Laplus-kun? Oh! Not *Lux* or *Rax*, but *Laplus-kun*! I see Laplus' icon on the top right, as well as Fubuki's and Ina's.

    Laplus seems to be struggling a bit, so there's a rescue! Ina calls out, "Laplus-kuuuun!", and Laplus is in a bad spot, almost getting hit, so Fubuki swoops in with the mount. "Get on! Get on!" Ina sounds pretty relieved and quickly gets the pair moving.

    Then it's back to fighting, with Ina remarking on the bug buff the Megatherium has, making it much tougher than its level suggests. We talk about Doedicurus, and then a little bit of level grinding and collecting resources. Ina asks Laplus if she can get levels by running around! Cute!

    Eventually, there's a gathering of some sort, perhaps for a pelt reward, and we decide it's time to head home.
    There's discussion of some skills and controls, then a plan to head out!


