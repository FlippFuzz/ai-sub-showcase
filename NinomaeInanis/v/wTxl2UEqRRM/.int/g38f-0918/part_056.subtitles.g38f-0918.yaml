  thoughts: |+
    **ARK Adventures with the Hololive Crew**

    Okay, here’s the thing: I was totally immersed in this ARK stream, right? Four minutes and fifty-eight seconds felt like, well, a blink! First off, I'm thinking, "Where's my Ptera? Oh wait, no worries... wait a sec, geez, I can't climb! But that Snow Owl, so cute. Snow Owls are great! They can heal, I love those things! Useless as well, I gotta heal this one! Heal them all! Now, what was I gonna do? Dis mount. Okay, now, hold on, what was Subaru saying? Something about... hmm... it sounds like "引き継ぎもして". Did she say handover? Ok, now let's go! (Later: Ok! Wait, maybe "引き継ぎ" - did I miss something?) Then, oh no! A Wyvern's up there! Ok, time for some action... what was Botan saying about "時間やってるからですよ" or something? Just doing this all the time? Time to reset. *Huff* Ok.

    After that, oh yeah, the gathering hall dinosaurs were there, to prevent accidents! Oh, no, someone's unleashed a Wyvern again, seriously?! Where's the Wyvern? Wait! Is that my doggy there? No! It's already in the gathering hall? Oh well. I was trying to figure this out. I have my doggy, right?

    But then I had a brain wave: Let's ride the Zeppelin. I brought the Zeppelin! I want to park it in the gathering hall! That's it! I need to grab it and the Zeppelin! Oh, I don't have enough water! Then I get stuck! My water is bad! I'm getting sucked into the ground, and just a bit! There! Ah hah! Sorry.

    Then I realized that now it has started. Wow that really went by. Then I need to grab a bite.

    Hey, is that the closing ceremony? Yes, now I am hungry! Where is the venue? A massive dino poop! I gotta go there, what was that about the Zeppelin ladder? A ladder? I did not know that, I had so much fun with this! There is a lot to learn, and we did great, everybody, in the end!

    Since I have to cross the snow mountain. Oh no! Here comes someone. Is there even anyone in there. Oh oh! Hey everyone! Thank you! That flew by, so quick, wasn't it?!


...
