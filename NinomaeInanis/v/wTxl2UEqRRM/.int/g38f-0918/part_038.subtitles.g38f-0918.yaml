    Oh, it's *definitely* Iroha! The "イナ先輩 (Ina-senpai)" shoutout, the "ござる (gozaru)" ending, the whole Kazama Iroha vibe, it's all there. And we've got a third voice, that "像はビール了解 (Elephant is beer, Roger)" one... I'm leaning toward Shiranui Flare or maybe Roboco-san or Matsuri? Those voices can be a bit tricky! Not Roboco. No, it's Shiranui Flare.

