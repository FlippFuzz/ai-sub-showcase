  thoughts: "**ARK Adventures with Hololive Crew**\n\nAlright, let's dive into this\
    \ ARK session. Initially, I was helping Towa out, offering to feed Ina's creature.\
    \ Then, Botan chimed in about item name displays, and, while I was pretty sure\
    \ it was in the settings, it took us a bit to pinpoint it. Finally, Towa nailed\
    \ it: \"Controls,\" then to the far left, and it's the 4th option from the top.\
    \ We got it!\n\nAfter sorting that, I realized I couldn't pick up the cat because\
    \ it was set to follow someone. Botan, needing the restroom, took a short break.\
    \ After Botan fixed the setting, I was exploring, but then Botan brought up the\
    \ always-on item display. It turns out she was very particular with her custom\
    \ settings. We eventually got it - the \"HUD\" or \"Display HUD\" setting. That's\
    \ a huge quality-of-life feature, and I made a note to use that more often.\n\n\
    After some quick setting changes, Botan grabbed her Yuty. Then Okayu popped up\
    \ as Tiny-Okayu! Cute! Towa offered meat, we headed off on our journey, and got\
    \ side-tracked! I also noticed it didn't seem to have enough meat. Ina was also\
    \ helping and told me to head down to look for resources. \n\nSo then there was\
    \ a whiteout moment, and a discussion of teleport locations with Towa and Fubuki.\
    \ I think Towa's a bit disoriented. Ended up finding our way through the narrow\
    \ path we needed to head towards. Botan posted the map as we prepared to move\
    \ forward. Left, I thought? Yeah, left, let's get going! Apparently, we can fly\
    \ until the boss, which is good to know. Hmm, it looks like this path might be\
    \ a little off... ah, so this must be the exit Towa went in.\n\n\n"
