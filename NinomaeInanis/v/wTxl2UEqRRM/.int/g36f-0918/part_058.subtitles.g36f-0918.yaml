responses:
- subtitles:
  - start: '00:05.100'
    end: '00:09.300'
    original: 設定でね、落とせる設定は低めにしておくと安心かもしれない。
    english: It might be safer to keep the lowering settings on low.
  - start: '00:10.500'
    end: '00:12.100'
    original: あ、戻ったっぽい。
    english: Oh, looks like we're back.
  - start: '00:20.100'
    end: '00:22.500'
    original: あ、OKってきた。
    english: Oh, they said OK.
  - start: '00:28.900'
    end: '00:32.900'
    original: OK、OK。復帰しましたかね？
    english: OK, OK. Are we back up?
  - start: '00:33.100'
    end: '00:38.200'
    original: じゃあ、もし見れてない、音声聞こえてないようでしたら、画面共有などでお願いいたします。
    english: So if you can't see or hear the audio, please try screen sharing or something.
  - start: '00:44.200'
    end: '00:48.300'
    original: はい。それでは、少しずつ発表させていただきます。
    english: All right then, I'll start announcing them one by one.
  - start: '00:49.200'
    end: '00:53.600'
    original: まず、マル秘ミッションがどういった内容だったかを発表していきます。
    english: First, I'll announce what the secret missions actually were.
  - start: '00:59.800'
    end: '01:05.700'
    original: ミッション1は、ラヴァエレメンタルの討伐でした。
    english: Mission 1 was to defeat the Lava Elemental.
  - start: '01:09.100'
    end: '01:10.600'
    original: 合ってる！
    english: We got it right!
  - start: '01:10.700'
    end: '01:20.500'
    original: 達成できたチームは、お片付けできるもん、1電タク、ディノパーティー、そしてエリートファミリアの4チームになります。
    english: 'The four teams that completed it were: Okataduke Dekiru Mon, 1-Den Taku,
      Dino Party, and Elite Familia.'
  - start: '01:26.300'
    end: '01:31.200'
    original: 続いて、マル秘ミッション2の正解は、太鼓をクラフトする。
    english: Next, Secret Mission 2 was to craft a drum.
  - start: '01:33.600'
    end: '01:36.100'
    original: こちらは全チームクリアいたしました。
    english: Every team cleared this one!
  - start: '01:40.800'
    end: '01:45.000'
    original: マル秘ミッション3、2枚以上の日記を書く。
    english: 'Secret Mission 3: Write two or more pages of diary entries.'
  - start: '01:47.300'
    end: '01:51.200'
    original: こちらは概ね、ほとんどのメンバーが達成いたしました。
    english: Pretty much almost every member cleared this one.
  - start: '01:56.200'
    end: '02:06.100'
    original: マル秘ミッション4、正解は開会式ステージでマンモスに2人で乗りながら太鼓を叩く。
    english: 'Secret Mission 4: The answer was to ride a mammoth with two people on
      the opening ceremony stage and beat the drum.'
  - start: '02:08.500'
    end: '02:11.200'
    original: こちらも全チームクリアとなります。
    english: This one was also cleared by all teams.
  - start: '02:21.800'
    end: '02:28.400'
    original: 今回発表していなかった、ムキロゼ・シークレット賞を発表いたします！
    english: I will now announce the Mukiroze Secret Award that wasn't announced before!
  - start: '02:30.000'
    end: '02:32.400'
    original: 何それ何それ！
    english: What's that? What's that?!
  - start: '02:34.200'
    end: '02:42.100'
    original: こちらはですね、公表しておらず、シークレットであらかじめ用意していた賞になります。
    english: This is an award that was kept secret and prepared in advance.
  - start: '02:42.300'
    end: '02:44.200'
    original: シークレットあったんだ！
    english: There was a secret award!
  - start: '02:46.300'
    end: '02:54.000'
    original: こちらのムキロゼ・シークレット賞は、賞品およびポイントの追加がございます。
    english: For this Mukiroze Secret Award, there are prizes and additional points!
  - start: '02:58.200'
    end: '03:01.300'
    original: それでは、まず1つ目のシークレット賞から発表いたします。
    english: So first, let me announce the first secret award.
  - start: '03:02.000'
    end: '03:05.100'
    original: 1つ目？複数あるの？
    english: The first one? There are multiple?
  - start: '03:05.200'
    end: '03:09.100'
    original: 最も死んだ回数が多いプレイヤー賞！
    english: The award for the player who died the most times!
  - start: '03:15.100'
    end: '03:21.500'
    original: ワンチャンあるんじゃない？ワンチャンある、ワンチャンある！
    english: Don't we have a chance? Maybe, maybe!
  - start: '03:22.100'
    end: '03:27.700'
    original: ベッドを一番愛したでしょう！ということで、ノエルさんが受賞！
    english: The "Loved Beds the Most" Award goes to... Noel-san!
  - start: '03:32.800'
    end: '03:34.200'
    original: 28回！
    english: 28 times!
  - start: '03:35.000'
    end: '03:40.400'
    original: 授与を行いたいと思いますので、そちらのステージまでお越しをお願いいたします。
    english: We would like to present the award, so please come over to the stage.
  - start: '03:47.300'
    end: '03:55.600'
    original: 死んだ回数が最も多いプレイヤーということで、ベッドを一番愛した賞を受賞されたお気持ちを一言お願いいたします。
    english: As the player who died the most and won the "Loved Beds the Most" Award,
      please say a few words about how you feel.
  - start: '03:56.600'
    end: '04:08.000'
    original: 団長はARK結構経験者で予習もしたんですけど、こういう結果になって複雑ですが、チームに貢献できたんですよね！ポイントがあって嬉しいです！
    english: I'm actually pretty experienced with ARK and even prepared beforehand,
      so this result is bittersweet, but at least I contributed to the team! I'm glad
      there are points!
  - start: '04:14.200'
    end: '04:21.200'
    original: 受賞されたノエルさんにはですね、リアルの景品をムキロゼのポケットマネーから高級...
    english: For Noel-san who won the award, a real-life prize will be bought out
      of Mukiroze's pocket money—a high-class...
  - start: '04:21.400'
    end: '04:27.200'
    original: リアルの！？やったー！嬉しい！
    english: A real-life prize?! Yay! I'm so happy!
  - start: '04:28.100'
    end: '04:35.100'
    original: さらにですね、エリートファミリアのチームにプラス10ポイント進呈！
    english: Furthermore, an additional 10 points will be awarded to team Elite Familia!
  - start: '04:35.300'
    end: '04:38.200'
    original: でっか！10ポイント？！
    english: That's huge! 10 points?!
  - start: '04:41.200'
    end: '04:46.800'
    original: それでは続いての賞を発表してまいります。団長ありがとうございました。
    english: Now then, let's announce the next award. Thank you very much, Danchou.
  - start: '04:48.300'
    end: '04:55.200'
    original: 続きましての賞は、最もプレイヤーにキルされた回数が多い...
    english: The next award is... the one killed by players the most times...
