  thoughts: |+
    **ARK: Survival Ascended - A VTuber's Expedition**

    Alright, let's get down to brass tacks. I've got this video snippet featuring Ninomae Ina'nis playing *ARK: Survival Ascended*, and I need subtitles. Seems like she's playing with another streamer, and there's a good mix of Japanese and English. Time to dive into the audio and map the dialogue to get this done.

    First, I'm noting the initial exchange about wanting something, likely a resource or item. Sounds like we're heading back to a Yutyrannus. Oh, it seems like there might be a confusion about the cost or something, but that Yuty is important. There's a quick exchange confirming its presence, and then the need for raw meat is emphasized, makes sense. We're on the hunt for insects, and, it seems like the cat is hiding! Seems like a Yutyrannus is near, and we cryopodded it for safety. It seems Ina'nis is looking for a pet. "Meow meow" – cute! The hunt continues, now with the new pet. The lack of bugs might mean that we have to run a little to get the bugs. "Shinzou wo sasageyo" - seems to be fighting something. The percentage of tamed creature is at 55%. A successful capture! We named our new friend after *Inugami Korone*, good choice!

    Now, the focus shifts to leveling and making the new pet a shoulder companion. We're encumbered, so a trip back to base is in order. Alright, Yuty did a great job! The shoulder pet mechanic is interesting, it seems it gets smaller when on your shoulder. Overall, it went well, a good session. But hold on, the keybindings... they're messed up! Gotta fix those. A quick trip back to base is required to sort this out. Tab for inventory? I feel this! It looks like there's a pet encumbrance situation. Oh, Cryopods are missing! Wondering why there were no Cryopods. This should be interesting... time to get this done.


