    The conversation turns to ammo and whether they need to ask Fubuki for rockets.

    The discussion continues, talking about the game. Towa suggests that the person get a strong dinosaur in this case. After this, Towa asks for some help with the hunt, suggesting taming some easy creatures to get the most. Towa has a plan to go hunt some Rexes.

