    **ARK: Survival Ascended – Subtitle Transcription and Translation**

    Right, let's get down to it. I need to get subtitles running for this Japanese gaming video, specifically *ARK: Survival Ascended*. First, let's break down these segments and transcribe everything spoken, then get those English translations going. There are some VTubers involved, Bibian (BiBi), Ina-senpai, and the one I think is called Tokami, (using the #TAKOTIME hashtag). No wait, it's Tokami (十神)!

    Alright, here’s how this goes.

    *   **0:00-0:34:** It's intense! "Shoot, shoot, shoot!" There's a warp point, and we're getting hammered with damage. My bow broke! Anyone got another one? Crap, my weapon is broken. Do you have a weapon? "Crossbow." Time to back up. A regular bow will do. Let's get up there. Bibi, I've got this. Find it? Can’t reach, darn it!

    *   **0:34-1:07:** Ina-senpai, did you get it? Oh, wait, behind us. Go straight! No, left! Too much cliff on the right, better back up. Is it that guy? Running! Okay, if it's running... Is it behind us?! Uh oh, wrong dinosaur! Bibi's the focus! Bibi, hang in there! Was there another one? Scary! I missed the shot, crap! Bibi has the aggro! Let's get up there!

    *   **1:07-2:00:** Where did it go? Two of them! Aim for the head. Got it! It's the bluish one, right? Okay, this one coming from the front. Oh no! Backing up, backing up. Good feeling, this is good. Can you shoot this? Not yet. Wait, Bibi got taken out! What is this guy?! Oh, I'm pulling back.

    *   **2:00-2:51:** Running... wait, broken? Drop down, some materials. I'm flying! Can I hitch a ride? RUN! I have a Pteranodon. It's coming at me! I'm fine, I'm fine... Are you ok? Huh, where did it go? I'm not ok... Where's Ina-senpai? Run, Ina! Run far! This is bad, this is bad! Piggyback action... what’s the key?

    *   **2:51-3:34:** Where's Ina-senpai? Here I go! Wait, is that Ina? Come here! Sorry, Bibi died. No, it’s fine! Get on, get on! Are you ok? Bibi! Ina-senpai, are you getting on? Then, I’ll do it like that. Wait, alone takes time! It’s chaos! Shoot it! Sorry, please, shoot it! I'll shoot, shoot, shoot. Should I go? Which way? Body is blue, it's the blue one! Okay, going for blue!

    *   **3:34-4:04:** Here, it’s a bit far, is it this way? Ah, we can do this! Here, red...or white? I shot it! Up we go, circling...too much cliff. Okay, this is helping. Wait, it's flying. This is so hard!

    *   **4:04-5:00:** What are you doing now? Taming a large dinosaur. How do you do that? Right now, we’re shooting tranq arrows at a T-Rex from a Zeppelin! Why do you shoot? There are two of them, please stop, I'm begging you! Tranq darts, in front of the Zeppelin. Okay! Too much pain! Up we go! So painful! Wait, I'm running low on tranq arrows. Okay. I’ll be there soon. Up we go! Sorry, ran onto it a bit, how about this? Okay. Distance won't reach from here. This? I’ll back up a bit. Ah! Broke the crossbow! Wait, maybe a bit more. I am useless now. I have a bow! No, it's tough. Ah, crap, let me borrow Dexen and head back once. Dexen, get down! Okay. Huh? Wait, another one is attacking...


