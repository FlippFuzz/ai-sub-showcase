    Then, there’s a discussion about the game mechanics, the heatstroke effect, and how to get rid of it. The solution seems to be submerging in water. This segues into a discussion about the efficiency of the Doedi for collecting stone. This then turns to an exploration of more gameplay, including whether it's faster to roll with the Doedi than walk. The conversation culminates in another, possibly unexpected, death.

    They discuss a lot of mechanics within the ARK game: heatstroke, stamina, vision blur, debuffs, ingots, river water, stone gathering and efficiency, rolling, and the Doedicurus. It's a scramble to manage resources, deal with in-game challenges, and figure out the best course of action while playing with a friend. It seems the main goal is to get the Stone. It looks like it's 10pm in-game. Then the conversation ends in the search of a Giganotosaurus.

