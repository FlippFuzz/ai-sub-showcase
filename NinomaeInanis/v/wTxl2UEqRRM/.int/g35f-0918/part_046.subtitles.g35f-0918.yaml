  thoughts: |+
    **A Day in the Life of a (Virtual) Survivor**

    Okay, so I'm watching this clip – it's Towa, right? Or is it? Her avatar is Towa, but the voice...well, whatever, it's Hololive, so the details don't *really* matter. I need to get this transcribed and translated for the team, so let's start with this Ark clip. Okay, let's see, what's happening.

    Right, so we're starting a new game, "Let's try" the translation is. Wait...what was I even doing? This is similar, but different from what I want. They want meat, got it, cooked ones are in the fridge, the rest are in the feeding trough. "Okay", "Heave-ho". I'm thinking about "boat trapping," maybe later, but narcoberries and spoiled meat are needed. Spoiled meat is the thing to tame some dinos...oh dear, there is no spoiled meat and maybe we should give up. "Huh? What's wrong?" Lost sight of something we're taming. Ugh, wolves are a pain. Time to make sure I am hydrating...

    Wait, is there something there? Oh, ah! They're riding on Wyvern-kun! I wish I could ride him right now. "Land, land, land." Narcoberries are not enough. "Please land for me". I'm getting distracted again. "Wyvern-kun! I really want to ride you." Is "Mondaiji" not here? I really want to ride it. What was the dino that gathers berries? Mammoth, right? Ah, Mammoth. Wait, what was that Mammoth? This is getting difficult, "why won't you land?". "Mammoth, after all."

    Once it stops for a second, right? They're never using the ability to collect it! You have to use your own body, or skills. Oh, this guy won't go to sleep. "You're in the way, Lucky-ki." And it's gotten so big. "You're too much in the way, Lucky-ki." I'm short on tranq arrows. Yo, you! Now what? Oh my goodness. That's been added to the inventory. Let me see what's in here... "Heave-ho". Please knock out! Wait, these are stone arrows. Crap, I'm out of tranq arrows. The 'nothing is going right' turn has arrived. Seriously, nothing is going right. Seriously, totally out of tranq arrows. I wonder how many I have. Bibi is dead, that's not helping. Wait, I see 10 of them. Mmm... I'm hungry and thirsty. I want to tame something, but it is impossible? The easy to tame dinos, looks like everyone has tamed them. True. A creepy bug is fighting. What is this? Is it someone else's? I need water. I seriously need water. I am almost dead from lack of water! Water. This might be a desert. Huh? Oh... Bibi, did you... What should we do once we make tranq arrows? Just tame something. Any small bird or bug nearby. I'm desperate to tame something. Only one more left? Ah, I see.


...
