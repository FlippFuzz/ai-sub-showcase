  thoughts: |+
    **ARK: Survival Ascended - A Quick Recap**

    Alright, let's get this stream clip subtitled. It looks like Ina'nis is playing ARK: Survival Ascended with Biboo, Towa, and Koyori. I'm focusing on the first five minutes.

    First off, we've got some stone gate frame crafting. A quick search. "Stone gateway..." Okay, frame, is it this? Reinforced gate. That's it! I think I passed out from hunger for a sec there. No time for food when there are gates to be built.

    Back in the game, it seems like someone got hit. So, I need to focus. Oh, Bibi! Where did she go? Thanks for the save. Nothing, nothing happened, haha. Wait, did I just become a phoenix? No big deal, it's nothing to worry about. So, Ina-senpai is mining stone, and it is a ton of work! We have to find wood as well... Oh, there's a dino.

    I need some clothing, because it is getting cold. Definitely need to close the door. I'm going for the hide. Got to upgrade to hide. Found the shirt, and I'll work on everything else now.

    I wonder how many we need. A rabbit? I want one. Maybe I should look for rabbits? There should be some. But wait, no headgear. There's a big dinosaur and the door is open. There's two of them. Deer? Oh, a deer! Nothing to be concerned about now. It's deer. Lag.

    Oh, there's a burrow, yes! Here we go! We need to tame! I think Ina's looking for rabbits, it seems. And get some stones!


