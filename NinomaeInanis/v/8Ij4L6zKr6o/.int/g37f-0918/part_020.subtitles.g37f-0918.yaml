  thoughts: |+
    **My Thoughts on the ARK: Survival Ascended Session**

    Alright, let's dive into this gameplay. First, subtitles. Absolutely need those, especially given Ina's presence. I'm already mentally transcribing and timing the Japanese dialogue, focusing on accuracy and quick translation.

    We're in the middle of a mission it seems. "Split it in half," and "Thank goodness! Nice!" The goal is to clear a mission. Tough one. Gotta keep track of what Towa's been up to with her Ptera, and... where *did* it go? Dead possibly. Yeah, since I left it alone!  We need to confirm what Pteras are about.  I need a lot of Tintoberries, and also we need to locate Crude Oil spots for the team mission. Found something. An egg. Okay. Pick it up and let it hatch. Looks like it's hatching.

    We have a fertilized egg! Warm it up. Need to get a Ptera if possible. Nice. We're getting somewhere. Wow, that was rough. Campfire doesn't seem to be craftable at the moment. This egg, I can't take it. Hmmm...simple bed maybe? Now, this fertilized egg. Can it just sit? Do we have to warm it up? Putting campfires around should work. If it is "Too Cold", you might have to wait. Now, let's check. That should be a good spot.

    Okay, more to work with. Ah, this one says "Too Cold." Not enough. Need more heat. Can't put the egg here. Can't do it out here. This is a maintenance setup. Breeding may be possible? Bibi is a female, and the other one is male. Ah, torches! Need to get this right.  Time to expand things here.

    Time to extract. If the Ptera is here, that'll be good. "That's True!" Need to move somewhere safe.  I just bred Fubu-san's Ptera and Bibi.  Where the heck did that happen? One word. "Hey" maybe. Can it warm up in the fireplace? Auto-craft, how do I turn this off? Maybe the settings? Nope, egg won't fit. Near a campfire should be good.  Auto... Auto... Auto-craft...

    Can the Ptera be let out? Is it dicey? One minute is all it takes!  Have to try once, so let's check again. Got a club from Gozaru, probably. Is the Ankylo an option? It was in the campfire screen. I can borrow it. Let me pick up a recipe...Is it okay for a baby or not? Is this actually on? For now... gotta go to the restroom for a minute.

    Hatch is about to happen. There's a Ptera following Gozaru, so land it. Towa-sama, the baby's born.  Towa is on the way.


...
