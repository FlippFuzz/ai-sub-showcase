  thoughts: |+
    **ARK: Survival Evolved - A Day in the Life of a VTuber's Base**

    Alright, let's break down this ARK session. First, I'm trying to figure out the timing of things; I have a lot going on in the background, but I’m here and working on things! I’m getting settled in, and figuring out the lay of the land, it looks like there's an Ankylosaurus nearby!

    The team's chatting, we need to get everyone taken care of, and some quick food. I mention that I have meat cooking at the base. One of the others, needs some spoiled meat. A brilliant plan emerges: the toilet! Put raw meat in the toilet, uh, and "poop." Perfect. We’ve got this.

    I'm trying to craft something and need help with the crafting table. It dawns on me, it is under consumables! We're running low on Narcoberries, so I'll need to sort that out. Okay, the first tame is in the bag! Now, it's back to basics. Someone needs 50 spoiled meats, and it triggers a thought: there's a quest for 500 raw meat. Let's do that! So I get sidetracked a bit, and there are Pteranodons!

    We have a bit of a crisis, someone needs help! We're working on the meat, getting the Ankylo to help! Gotta figure out how to harvest this thing! Harvesting time!

    We're discussing the base, now, it's cold, and raw meat is in the mortar and pestle. That means we have raw meat! Then, it dawns on me, I need to craft!

    Ankylo doing great! We need food, I’ll take some for the team. We got some raw meat! And back to the base we go. A new base! Let's poop! The raw meat goes into the toilet, and it should get done right away! We can start by making some narcotics.

    Let's make some, and we'll put them away for later! Everyone is refreshed! Now, we just need spoiled meat for the base. Let's solve the food problem, and then turn the rest into spoiled meat. I roast it all.

    We have a bunch of meat to roast! I can have some meat, the other members just picked up 500! We can cook that, but let's do a relay! We will get it to the toilet! Spoiled meat, for the win! We load it up, and we will get this done. The team, we poop and get 500 meat!

    Got the meat, time to submit, submit, yes! Let’s head back to the base! A situation erupts! Someone needs help, the team will spoil meat. Oh no, it’s not with them! I have wood! The team is getting set up. I have a lot, so thank you! Now, all this meat can get to the base, and we can submit, submit, and yes! Now the team has to be safe. We'll head to the meeting area. And now I am hungry again.


...
