  thoughts: |+
    **ARK: Survival Evolved - A Chaotic Dive**

    Alright, let's break this down. First, this Japanese gaming clip with Ninomae Ina'nis playing ARK. Gotta get the subs right, and I need to nail the timestamps to make it sync.

    So, it's ARK. We're talking about crystals. Gotta get the lay of the land, yeah, and there are crystals here. Now I'm lost. Where's the portal? Ah, wait, there's the meat. Okay, the portal... which way to it again?

    Should I get some stone? What's this? Can't pick it up? Not sure what to do, this level seems tough. What to do, what to do... Can't take this? Lost again.

    Hmm, feels like it should be this way, maybe. Let's just put down a temp base around here. Yeah, since there's a forge at the meeting point, we'll smelt iron there for some crafting maybe. That's a solid strategy to build up some materials.

    Yeah, no armor, the enemies might be tough. Okay, let's explore. I want Dodos. They sound good. Hmm, can we find them on the beach? Oh, the beach... speaking of the beach... I wonder if they're right below the base. Oh, no. Is that okay? Are we grilling meat by hand? I am grilling it, yes, but over here.

    Ah, Aki-senpai, here! "So tiny" (Ina chuckles). I am a tree. That was close. I got the "I am a tree" buff. Oh, no, I'm starving. Those guys are strong. Can we take it down? It's strong... I can't see the dino names, so I can't tell. I probably need a spyglass.

    Right. Still don't get anything. Tow is also not getting it. Geez, I don't understand either! You have to learn by dying! Yep, that's what survival is all about. Dying and learning is the way! It's totally normal to learn by dying. Exactly.

    Fine with dying in this game. You get stronger every time you die! No death penalty because there isn't one. Dying is actually more beneficial, honestly. We get free healing, because we can become meat.

    Wait, I need to head back to the meeting point. I might have crafted the wrong thing. I made a storage box. Either way, it's the meeting point. Okay. No, indiscriminately— Whoa! No, no! There it is! No no no no! Are you okay? What happened? Help! Bibi is getting beat up!

    Maybe we can hunt wild creatures near the meeting point to gather meat. I'm thinking of heading back near the meeting point right now. Yeah, I just got back too. Wait, with 50 raw meat... Because I was able to get one Blowback. Aah!

    Yeah, me too. My haul is... Also, the one Bibi brought over maybe... There is! I have a dino I got from a quest. What is this thing?! I got taken out! Aki-senpai, stay there... It hurts, stop it! What is this? Yeah, okay, that's why it wasn't working. Ah, I ran out of meat. That hurt. It's tough, isn't it? Can I do this? Okay, okay. Guess I'll go look for meat. Only as much spoiled meat as I put in... Dog barking? It's all wrecked. But the mission is progressing... It's fine, Bibi. That's true. Have fun, Aqua. I will! Have fun. I, I want to teach this guy a lesson!

    Is there something there? No, I'm gonna die here! Hold on! Sh-sh-sh-sh... Are you okay? Go! Eeh! Teach him a lesson! That thing is seriously... too scary! That guy is way too strong... You should bring one dino along, Gozaru. Take that! True. Seriously... stop! That isn't a safe spot, is it? Well, I got a saddle so I put the saddle in the base chest, go, and apparently you can claim the reward from the meeting point. How many times did I d- There's like a dino reward claim station at the meeting point. I think that's where you get it. That iron... the one with 100 iron? Whose? Since I turned it in. I need to get a weapon.


...
