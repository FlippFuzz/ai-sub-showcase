  thoughts: |+
    **ARK ASA with Ina and Iroha: A Stone-Gathering Odyssey**

    Okay, so I'm watching this video clip, and it's Ina's ARK: Survival Ascended stream, but something's...off. I mean, the player character is "Bijou," and the chat is Takotime, but the voice sounds like a native Japanese speaker, *specifically*, Murasaki Shion! And she's calling Ina "Ina-senpai"! So, it looks like Shion, in a casual cosplay stream of Ina! At the beginning of the stream Shion, who is playing as Bijou, and the real Ina (streaming and voice acting) teamed up with Kazama Iroha to gather stone to make a trap to catch the Argentavis! I am a VTuber expert so I know Shion calls herself "Shion-chan" or "Shion-sama," so the person calling Ina-senpai is likely a member junior to Ina! I am a pro, so I know this is a Shion-Ina collab. And I'm looking for a specific name, dinosaur gateway...it's not coming to me!
    I can't wait to generate the video transcription, it's so exciting to analyze who's talking! I know it's gonna be Shion and Ina!


