  thoughts: |+
    **Ark: Survival Evolved - Ina & Iroha's Adventure**

    Okay, here's what's going on in my head as I'm watching this. It seems like Iroha and I, Ina'nis, are playing *Ark: Survival Evolved*. I need to get subtitles done for the video, so I am going to run through all the timings and such.

    At the very beginning, I'm trying to figure out if Iroha is flying on something. I asked "Is it flying?", and then I also said "Come back..." to Iroha, who then yells "Stop!". Iroha is concerned and asking me, since she is playing with me in the game, if she can fly back or has to ride a flying creature. She's asking if she needs to ride something to get back and I'm yelling "It's flying, it's flying!".

    Then, Bibi is mentioned. I respond with "Yes." Iroha is being careful, but is asking if she could borrow my Ptera to fly back for just a moment. I'm okay with that. She also wants to know if I could grab her items from her corpse. I agree and ask where she died. She is telling me it was in front of a trap, near the exit. I confirm, and she says it's okay if her stuff isn't there, she will go herself. Iroha is also saying she may just respawn anyway. So I ask "Is this it?". Then, she asks if I can confirm that her items have dropped. "It's flying!" I'm excited! I'm grabbing everything, and exclaiming that there's a ton. Low-temperature cryopod... Iroha says, "Yeah, just leave it there." She will go get it.

    I'm checking to make sure she didn't lose everything and if Iroha will get her lost stuff. She says she's glad everything is okay, and I also say "That's good." I say, "That's good, that's good." And then she got her items! Then I say, "Whew". Iroha is saying she forgot about her stuff. And I'm also asking if she can get her bird "TONDERU". She says she did, and I'm happy and confirm it.

    I think, "Hmm... ah, follow..." Is everyone following, like...? I'm a bit confused, but say "Are they following?" and Iroha says they are. I'm excited and happy! "Yay!" Now, let's head back to base since Fubuki-senpai is also back. I say, "Okaay."

    Iroha wants to gather some wood, expand the foundation of our base and pen in our Argents. It's dangerous, or they might die. But then I exclaim "Th- There's a super huge dinosaur!". Iroha is saying, "Oh no! Bi-completely steer clear of it and come back." I ask what that guy is and say "Okay" to not engage. "Whoa, it's huge!" and "Scary!". And Iroha is saying "Yeah, scary. Wonder if it's friendly?" I say that wasn't there earlier! And I see them multiplying. Iroha says it might be server-side, and that it may still be there. I see Fubuki-san!

    There we go. Iroha is laughing and saying "It's on the wall!". Wow, and then I see all the Argents, "Nice, so many Argents". Then, "Glad we got so many Argents, though". "Look".

    I'm laughing, and saying, "Ooh, they're crying so much. Hoot hoot." Oh, Iroha forgot to eat, and passed out. I'm saying that Bibi has to eat too. But this is bad. We must find some wood. I'm figuring out how to expand the base. We need to expand the base and... expand it. I ask, "Excuse me?" Iroha offers to lure away a scary dinosaur. "The dangerous guy? Yeah." I ask if it is the big one.

    She agrees and says, "It's a bit, yeah... It's too close... I think." Iroha asks me to wait a moment. "That guy..." I ask, "For now, should I gather wood?" Iroha asks me to, and to make lots of foundations and walls. "Okay!".

