  thoughts: |+
    **ARK Adventures with Hololive!**

    Okay, here's the deal. I've got this Hololive ARK: Survival Evolved clip, and I need to generate some subtitles. I'm focusing on Ninomae Ina'nis, but it sounds like Subaru and others (Subaru, Matsuri, Botan, Miko) are in the Discord call. I'm going through the audio frame-by-frame, and it's a bit of a chaotic ARK adventure.

    I'm starting at the beginning, around 00:00 - 00:10. I hear Subaru: "行きますね" (Here I go.), then messing with something. There's a bit of a background song ("...just didn't want to go without saying..."), but it's not clear where it comes from. Then, it's Subaru again, recognizing Ina-senpai.  We move on to:

    *   **00:10-00:20:** Ina says "あっ、おはよー" (Ah, morning!), Subaru replies with "おはようございます！" (Good morning!), and Ina asks "今何やってるんですか？" (What are you doing right now?).

    *   **00:20-00:30:** Subaru exclaims "死んでます！" (I'm dead!), and Matsuri jumps in with "あ、ござるの... ござるのあれがある" (Ah, Gozaru's... Gozaru's thing is there.).

    *   **00:30-01:00:** Subaru has some dino-taming plans, but it's apparently not going well, she's calling for help and yelling "助けて！" (Help!), and then Matsuri says "タゲ受けるんだ、タゲを" (Take the aggro, the aggro!).

    *   **01:00-01:20:** I get the feeling Subaru is lost, and it sounds like she's near the base - there is some confusion and shouting. Botan says "Looks like she's at the meeting place." There's some general confusion.

    *   **01:20-02:00:** The confusion turns to a new dino being tamed automatically, Subaru calls the dino by a misread: ペゴマスタ... クス？ (Pego-masta... x?) and everyone is amused that it's a Pegomastax that was "pickpocketing" them.

    *   **02:00-02:30:** There is some resource management, and Subaru is going to teleport and Ina asks "おかえりなさい" (Welcome back.)

    *   **02:30-03:00:** Subaru is teleporting and gets lost! She's yelling.

    *   **03:00-03:40:** Some more Holomems are on the call. Miko is on the call somewhere, and Matsuri is helping find the crystal - there is an M map!

    *   **03:40-04:00:** Ina is joining the game for the first time! Everyone is saying they are "fighting."

    *   **04:00-04:54:** Subaru has a "mission" to get wood for Ina. An Ankylosaurus is gifted! There is a Bronto blocking the entrance!

    It's clear that it's a fun collab, and I'm ready to accurately subtitle this chaos.


