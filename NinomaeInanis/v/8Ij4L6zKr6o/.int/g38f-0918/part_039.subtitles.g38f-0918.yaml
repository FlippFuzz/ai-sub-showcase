    **ARK Adventures with Ina**

    Okay, here's what's going through my mind as I navigate this ARK: Survival Ascended session with Ina. First off, I'm just getting started, hitting up those trees, you know? "Eeto…" It's all about gathering resources, and then I'm like, "Oh, hm?" Time to open that inventory – gotta keep track of this stuff! "Koushite…" I'm trying to be methodical. Walking back to base, and I'm asking myself, "Huh? What am I missing?" Then, I hear Aki Rosenthal... or someone, "Huh? What?" It's super creepy right now, the sky is red. "Scary..." But Ina notices it too, asking, "The sky?" Someone else says, "The weather…"

    So, I'm heading inside, it's all about getting things organized. "Got it, got it…" Then, time to access the storage box. I'm thinking, "Whoa, I have to remember what goes where in each of these..." Gotta get someone to put up some signs, for sure. Someone is talking about expanding a bit, maybe expand this foundation, even.

    "Up we go!" I'm also checking inventory. "Wow, that's fast!" It's night already. "Whoa, and night has already fallen!" We have a meeting to get to by midnight, so we have to go, but there's still work to do here. "Let's see, should I make a torch? It's way too dark, I can't see anything."

    If I put this here, is that going to work? "Hot!" I gotta watch out. Then, I run into someone. I say, "Was I too small for you to see me?" Then, "Ah, I was just like, 'Ow-w-w!'"... so, "I messed up"... and she's saying, "Oh dear!" Haha. "Not that I regret it though," I can feel the regret from the other person. They're all, "Amazing..."

    "It's dark, you know... 'cause it's dark," of course. I can see the frustration. "Hup. The wooden sign was bigger than I expected." Where should I equip this again? I try, "Like this... equip..." Someone's talking, and I'm saying "With this, for now..." "Eh, couldn't I attach it to my hip?" Just write a name on it for now.

    "All right." Thinking about making a "Canvas board... Oh yeah, there's a canvas board. Can I make that?" "Was it canpas? Ah, canvas, here it is." I'm also thinking "Will we make it in time?" It's a brush, that's what we need. "Oh, shoot." The inventory is full. "I can't hold anything." No idea how to make paint. "Was it paint? What was it?" Oh! Right... I realize what is happening. "Ah, to show what goes where?" We're thinking, "Yeah, I thought I'd do that." "Ah, right, right, right."

    But I feel like we needed a cooking pot or something. "Wasn't there a pot around here?" "The pot at our place is gone!" "Huh?" We have to put up walls for now, it seems. "The time-police geezers are starting to get irritated, so I'll put up walls first. Shoot." Time to "Let's protect the base for now, everyone!" "Okay!" "Ah, watch out!" "This is bad, this is bad!" I'm also thinking of this, "Let me just put this in here for a sec..."

    The impatient, anxious geezer inside is saying "The time-anxiety geezer in my heart is starting to act up now, saying, 'This is bad, this is bad!'" How should we expand, though? "Um, how should we expand this?" The floor… First, for the floor, if possible, over on this side, where only two tiles have been extended, what should we do?

    "Right, right, right," I'm understanding. "I think it'd be good to expand it out horizontally in the direction of the main house?" "Like this..." Ah, it's getting brighter. "Yeah, yeah. And then maybe if we take these three tiles, this extended area, and make it a home for the dinosaurs..." "Mm-hmm." "For now..."


