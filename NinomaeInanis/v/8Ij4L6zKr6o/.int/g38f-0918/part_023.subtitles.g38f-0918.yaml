    **ARK: Survival Evolved - A Hololive ARKventure**

    Okay, here's the deal: I'm diving into this ARK: Survival Evolved clip featuring Ina'nis and a few other Hololive members. It's time to get a good transcript and translation going with the timestamps nailed down.

    So, here's what's going through my mind as I parse through the audio. At first, there's a quick discussion about the immediate danger a bear poses. Towa and I share concern. Then, there's a quick inquiry about resource gathering, specifically, whether an iron pickaxe can get crude oil, of which, I offer a quick, *probably*. There's some banter about a bear and item collecting. It’s off to the races, and then a whale's potential for oil extraction gets brought up. I'm thinking, "Yeah, whales are a source of oil, I seem to remember that, but what was said first? Did we consider the fact that we can't get oil from a living whale or did Towa? Let's check the base! Wait, I think our base is toast." But, Towa's like, "Yeah, the base is bad, but the bear got stuck." Nice. We got a good reaction to the bear being killed, but then, "Where did the hide and fur go?!?" It's like, "Let me find Bibi-san's Ptera."

    On we go! I’m looking at these clothes and thinking that they are super crazy, and I'm like "Where are we even going?" Botan's coming along. I'm thinking, "Let's check out the base's meeting spot, because that's where we are putting our things, right?" Towa agrees. Someone is crafting metal tools and I feel a pang of, "Should I be doing this?" Well, I should! There’s material gathering. The others are gathering and bringing things back to the smithy, so that's the plan. Everyone is depositing, and this is where it all goes down. "We'll get the stuff!" "Let's harvest the corpse for hide and fur." I'm looking at the situation, as Botan’s restroom break is happening.

    We're going to use the smithy. I wonder what Towa has in store for us, and Iroha says the Pteras are scary. It’s a good time, but the Pteras aren't going to be the objective. Towa's getting the things set up. There's a bird, and I want to investigate it. Towa is going to put the metal pickaxes and axes in the smithy, so everyone can grab one. "Grab one each!" I want one of my own. I like my stuff! Things are good! The weather is clearing, and I'm thinking, "Where's the bird?" And, all of a sudden, "Oh no! There's a bear!" "Bears are not good." And, "We've got to watch out for this bear!" Towa says. I agree.

    Then, there's a little chat about birds being scary, so I'm thinking, "Wait! Where is that Ptera?" Towa says the Ptera is flying, but I'm thinking there may not be any around. Then, someone mentions the need for a Doedicurus. I remember that the doed was needed, and then there's Argentavis mention, so there’s some talk about Argen-gen. I'm thinking, "Yeah! Argentavis are good, so the teams are going to be split.” I'm thinking, "Splitting into teams sounds great." I like that idea. I get a little excited and say, "That's good, too." And so, I'm thinking about how the Argen is close by and that's perfect. Maybe we can get some stones and tame the Argentavis! Iroha proposes that we divide into two groups of three. "What team is where?" I'm thinking about who is where, with who. I ask, "Who's over here?" Towa, Botan, Shirakami, Fubuki are mentioned!

    I propose that they handle oil! Perfect! Towa and the others head out! I agree to send them. Towa's is trying to get some experience and training, or something like that! They're off to the oil. Iroha is asking how to get oil. I'm thinking about oil, and the details get fuzzy. I recall it's mined somehow. I've only seen oil in pipelines from the past. And then, wait! Where's Bib-san's Ptera!? What!? I'm asking "Where is it!?" Botan says, "Pack Zero, can you stop moving for a sec?" and I

...
