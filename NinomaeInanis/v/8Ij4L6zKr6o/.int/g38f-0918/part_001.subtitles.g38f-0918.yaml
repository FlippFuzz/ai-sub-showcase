    **ARK Adventure with Ina'nis: A Summary**

    Okay, so here's the deal: I'm diving into a video clip of Ninomae Ina'nis playing ARK, and I'm tasked with crafting subtitles. The clip is about 5 minutes long, and I need to accurately capture her audio, including any Japanese phrases. I'm noting everything down, timestamp by timestamp.

    Right off the bat, she's a bit lost, wondering where to spawn and if there are instructions (00:00-00:06). Classic Ina, I guess. She then admits she wasn't able to keep track of anything (00:07-00:13). She's already confused about a dino icon (00:16), asking "Here?" in both English and Japanese (00:18-00:23). Finally, she finds "Jungle 1," and she's off (00:27-00:29; 00:32-00:39), maybe.

    There's some background chatter from the Hololive members (Polka, Fuwawa, Mococo, Moona) in the game proximity chat (00:44-00:50, 00:54, 01:00-01:07, 02:54-03:00, 04:20). Ina's focus is on the gameplay, which is red and burning. She's cold, so she gets to the inventory (01:13-01:22). She asks for recommendations and discusses stats (01:26-01:49). She gets a sleeping bag (02:00-02:02). She's curious about an item (02:06), and then grabs a slingshot (02:19-02:27) before seeking free items from a vault (02:28-02:31).

    She's unsure if this is her home (02:35-02:43). She wonders if her mic is working (02:51), but is quickly interrupted by the Fuwamoco duo (02:54-03:00)! I realize, watching her again, that she thought they were speaking to her, but her mic was off (04:36-04:48).  She finally realizes she might need Discord (03:43-03:48). She's a bit anxious about socializing (03:52). She checks to see if her mic is on (04:43-04:46) and that's it!


