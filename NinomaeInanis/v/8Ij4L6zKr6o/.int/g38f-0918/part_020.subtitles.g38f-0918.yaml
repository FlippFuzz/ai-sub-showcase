  thoughts: |+
    **ARK Gameplay – A Moment-by-Moment Stream of Consciousness**

    Okay, so I'm watching this clip – it's definitely Japanese VTubers playing ARK.  At first, it looked like Ina, but now I'm hearing Towa, Subaru, and... is that Laplus?  Oh, right, it's a streamer playing with Hololive members.  Let's see what's happening. The video starts off with a quick conversation about cooking, someone saying "I split it in half and cooked it" and "Ah, it's done!", which is quickly followed by people saying "Thank goodness!" and "Nice!" That feels like a mission's been completed, but someone says "That was the most exhausting one..."

    Then Towa is in it, asking where her Ptera went, as it's lost and likely dead.  The conversation then shifts to team missions; we need medical brew and especially tintoberries.  We need crude oil, which means finding an oil spot. Someone asks if the egg is alright to pick up, and it seems everyone else agrees. "Ah, it's in! Thank goodness!"... The egg is hatching! "Berrys are good!" Then I realize my water level is dropping and say "Ah, a fertilized egg is ready!"  I need to put it somewhere warm. I'm hoping to get one Ptera, or rather, everyone is, and, "We managed somehow!"  "I really thought my spirit was going to break."  Oh, we didn't craft it yet.  I can't pick this egg up, oh well.  I made a simple bed. So, the question is, can I leave the fertilized egg here? Does it need warmth?  Maybe we need to light a campfire or something? It's too cold.  So, should I leave it here? Then Towa said, 'Towa-sama, right now I'm warming up a fertilized Ptera egg.' Oh, it is this one!  It says it's cold.  Is it not enough?  Maybe it needs more heat.  We can't do it here... we should move outside. Why is this queueing things this way?

    We could try to breed with Subaru's Kireiyanen... So, with Subaru's Kireiyanen and Bitero, we just had a baby! Wait... someone got surprised as if it happened randomly, which is strange!  But it seems like the baby happened after the greeting, so it's a "greeting baby". Can we put it in the fireplace?  How do I turn off auto-craft? Oh, lol... maybe it's in the settings.  Can't put the egg in the fireplace, which is expected. Maybe fire would work... If a Ptera spawns there, can we get it out? One minute to hatch... I guess we have to try it! That one's probably a high level one.  Where are the cryopods?  Gozaru has them probably.  Then perhaps, if we pull out an Ankylo, we could get it out... If we can borrow one for a sec... Ah, is this it? Is it okay if it is a baby? Maybe it's not bad if it is a baby. Isn't this actually toggling it on? I need to go to the restroom... I want to see the egg hatch!  There's a Ptera following Gozaru, can we get it to land. "Ah, it hatched, Towa-sama!"  Ah, she went to the bathroom.


...
