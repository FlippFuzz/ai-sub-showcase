  thoughts: |+
    **ARK: Pteranodon Taming Mishap**

    Right, let's break this down. We're in ARK, and the goal is those blasted Pteranodon missions. I hear "Taming a Pteranodon is listed," so it should be doable. I need to make a note, check to see how the turn-in actually works.

    I'm thinking, "Won't holding down the turn-in button work?" In my experience, it should. Then, "I'm heading over to join you!" Someone's coming to help! "Nice Ptera!" We're in business. "Taming a Ptera right now!" Good, good!

    It seems like we can have our own Pteras! One per person, maybe. Alright, "It's a solo mission, so we're trying to do a second one." I see one here! "There's one here too. Deliver once... Ptera." Ah, great, it's landing. Wait, "Does it say you don't have the item to deliver?" What the heck? It's not landing! "I'll go back to the spot from earlier and check the Ptera again..."

    I'll check the Towa-san base. "If you can come to our base, the 2nd Ptera is knocked out, so could you bring raw meat?" Great! "Oh, I've got raw meat!" We're on it! "Thank you!" "Ah, I think there's some in there." "Dakisun, hand it over!" "Yoisho!" Awesome! This Pteranodon is fast. "For real, the Pteranodon is already... That was fast! So fast!"

    "Should I put meat in this one?" I wonder, so, "Ah, this one, and also, on the other side, there's another one over here, so could you maybe keep an eye on that one?" Right, it landed! "For now, I'll just put this in." Ok. "Yeah, and then ahead of here... Over there!" "That one is knocked out too." "Nice!" "That was quick!" Huh? "Wait, but there's meat in it, raw meat." Oh, right, I get it. "Oh, right, you put it in that one, so that's why it didn't start. I'm an idiot!" "Thanks for this one, though!" Nice!

    "So how many now? Three?" Yeah, three of them. "So that means we need three more, right?" Definitely. Alright, "Seriously, where is that guy even going?" I'll re-check that temporary base. "I'll go check that temporary base place from earlier one more time." "There are three campfires there right now." I see. There is still meat cooking. I'll collect it. "Thank you, that really helps!"

    Ok, let's see. "Wait, with E... You take it off with E?" "Should we drop it or make a new one?" Ok Bibi and Ina. "In that case, Bibi, are Bibi and Ina okay? Coming together over here?" Excellent! I can help you, "I can help out! Want me to help with something?" "Then to the, um, temporary base from earlier...". It's a "temp-temp-temp temporary base." Going, going, going! It’s dangerous. But whatever, Ptera.

    "Huh? Where were today's missions posted again?" That's a good question! "Under the "Strategy Info Unlocked Progressively" section..." The team mission... Ah, maybe, the pad. "Daily mission: write in a journal..." I can't deliver it. Hmm, need to ask Akuta. Wait, "Oh, I see, Ptera? How do you do the Ptera one?"

    "Ptera? Yeah." "Hey, can we really not turn it in?" Wait, what about cryopods? Ok, I recall. "Apparently the moment you tame it, a saddle goes into your inventory." Aha! It’s done then. But I don’t have one! Is it because I didn't get to tame it, or "Isn't it whoever tamed it? It should go to whoever was nearby at the end." Oh, "That was me, I named it and everything." "Hmm."

