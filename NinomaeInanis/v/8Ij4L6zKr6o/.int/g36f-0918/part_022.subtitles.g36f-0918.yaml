  thoughts: |+
    **ARK: Survival Evolved - A VTuber's Tech Journey**

    Okay, here's the deal: I'm diving into this ARK session with Ina and the others, and it's a bit of a scramble. We're on this mission, right, solo first, then team, and already my mind is racing. Initially, the plan was simple: get some metal ore, check the missions... Then came the *crude oil* requirement for the team mission, and my brain went "ping!" I know this game, but sometimes you just blank. So, oil pump - gotta figure that out. Is it the smithy, or where?

    Ah, fabricator. Classic. It's so funny how these games bring up long-forgotten mechanics that require a bit of thinking. I got to make a fabricator. Okay, but how? Where?

    The team decides we need to search for crates. It will be helpful to gather crates for resources.

    Wait, did the baby die? That's unfortunate. Now there's an aggressive attack zero.

    The others asked, "Was there a warp point that said crude oil?" It seems we need a fabricator. Oh! Fabricator. I'm taking a trip down memory lane. I need to make one. My level isn't high enough, I think. Then the others bring up that we want the metal pickaxe, too. I think I'm making progress, though! Did I turn that mission in? It's not increasing. And after breeding...

    Ah, then it hits me. Fabricator needs crude oil, and cement. Cement? Beaver dam time, I think. *Sigh*.

    But no, let's address the bear.

    Oh god! There is a bear! No bear.

    Combat? It's on. Ptera's down, and I'm screaming. It's a bit hectic, you know? But this fabricator situation... 10 crude oil is a start!

    Okay, so ocean diving it is. And maybe some trilobites? And that bear... it's a mess.


...
