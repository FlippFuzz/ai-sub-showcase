    Then it's onto base building and strategizing: "Hey, so, for this base, should we make this spot by the river our main base? What should we do? I haven't really decided on that yet... Since around here is dangerous for now, just somewhere we can enclose for now. Mm-hmm. I'm just enclosing it with wood for now, but... Except... there are too many... so I can't get them to land." I've got to watch the timing and make sure I understand the context.

