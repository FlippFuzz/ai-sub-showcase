  thoughts: |+
    **ARK: Survival Evolved Shenanigans with Raden and Subaru**

    Okay, here's what's happening. I'm watching a clip, or *was* watching a clip, of Raden, who is playing ARK. The prompt said it was Ina'nis, but that's not right. It’s Raden, I'm sure of it. She's playing with Subaru, who's being *dramatic*. Seriously, the amount of *suffering* emanating from Subaru is incredible.

    So, Raden starts off by crafting something, and Subaru’s helping, which is good. They're talking about setting it up – maybe a table is needed? Wait, they're starting in a place. They are looking at inventory. Right, they need to craft some tranq arrows. Raden is making some arrows, with Narcoberries. Subaru's handling the crafting and explaining how to combine the narcotics and arrows in the inventory, which is apparently something you can do.

    Raden’s a little confused and can't find the tranquilizer arrow, which is understandable. It turns out she hasn't unlocked the Engram yet, and then the level is the problem! It's so far down the list. Haha. I love this. They are having such a *normal* ARK experience.

    Now, Subaru is crafting a whole bunch of them, but she gets this look in her eyes...oh boy, here it comes. She then complains about not having enough space. Oh, that's what that face means: Subaru's organizing the storage chest and freaking out about its apparent messiness! “It's a crime against humanity!” Oh, now this is the real game. Raden thinks it's perfectly fine, though. This is amazing. Subaru’s so dramatic.

    Wait, Raden wants me to repeat after her. This is *gold*. "Is this chest clean?" "Clean…?" "What’s wrong with this?!" The whole exchange is classic. Subaru really can’t deal with a messy chest, though. Subaru gets more and more ridiculous. "My body was crying out!", Subaru yells. Now, Raden is saying, "No, it's fine," ha!

    So, the real “battle” is about to start, apparently. Oh, and of course, Raden calls out "Ina-senpai" for some arrows! I mean, it's such a familiar scene. "It's super clean, really!" Yeah, okay, Raden! I cannot. Ha!


