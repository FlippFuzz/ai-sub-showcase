  thoughts: |+
    **ARK: Survival Ascended/Evolved – A Vtuber's Gameplay Stream Analysis**

    Alright, let's break down this ARK session. First off, spotted some iron – gotta remember that. Then, planning some strategic team warps for a potential buy. Hmm, someone's here, or maybe that rabbit-like creature? Where is it? Gotta be careful with the surroundings. It seems Towa's base has had a tough go. We'll join up with the others, it might be the right play.

    Okay, this part's done, but... the HoloARK Pad might need a rebuild to keep things moving. A rabbit! Thankfully, it flew with us. Next, a simple bed. Time to meet up, yeah, up top seems good. Can someone let everyone know the mission's done? Great. Flying! Saved by Towa-sama!

    Right, onto the whistle strategy. Got to remember how to use this correctly, the English is a bit hard. Using whistles for individual commands or group commands? Got it. Seems we're making a simple bed next. Everyone, is this thing... like that? Using the pickaxe for metal ore is the way to go, right? Hmm, indeed, "whistle". I can't even remember simple English.

    It's sad, this creature can't sit! Ah, finally! Alright, so it's that way. Everyone, it's been the same since Y. So they can't sit! Argen... Argen! Kaname, I'll grab a saddle! Thanks! Oh, an egg! Now, which one's best? Not Pteranodon, but uh... Bronto? Hmm, the saddle... Huh? Which one is it? Burrowbuck, Smithy, Ingot, Fiber, Cement... Cement?! Not bad. It seems impressive.

    Baga-ban, Baga-ban, what is this?! It's not metal?! I will not have my face fooled by you! Damn it! Hmm, someone's Ptera... Oh crap. Kaname is here! Where is the Pteranodon? Why is it here? Oh, maybe someone moved it? That must be it. Watch out. Okay, okay. That was close.


