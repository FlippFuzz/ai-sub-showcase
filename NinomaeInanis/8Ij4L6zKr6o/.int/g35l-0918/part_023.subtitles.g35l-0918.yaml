    **ARK: Survival Evolved - A Quick Breakdown**

    Okay, here's the deal. I need to get this video subtitled, and I'm on it. Starting the transcription and translation.

    Initial thoughts? I'm hearing the gameplay with commentary in Japanese. Bears are crazy in this game!  And what was that? *Tsup*... is that a typo, maybe for Ptera? Need to confirm. The player is asking about crude oil mining with a pickaxe, which I'll translate. Alright, moving on, they're considering whales and base situations. "Is the base finished?" The base is causing trouble and there is a bear stuck in a bad place. Almost dead? I'll check.

    Let's get the hide and fur from the almost dead bear! Oh, no hide, okay. Bibi's Ptera is out looking for something, I think.  Going to find the Ptera first.  Wait, not Ptera, inside the base, the gathering place, what was it, make some metal axes and pickaxes.  "Please make them." Ah, we poke here, okay then. And you need the raw materials. Carry. Okay, I'll put it in. Going to make it for the Ptera too, and also deposit wood. Something's here. I'll put everything in. I can get hide and fur, so I will dig up the corpse and run to the restroom really quick. I'll ask about the river. I can do it.  Bring hide to the gathering place. Okay, putting it in. Put it in the workshop. Pteras are scary!  Yeah, the Ptera is not the one to be scared of.

    It's a bird! Let's get the inventory, workbench, and the iron pickaxe, and iron axes. Take one each. Wait crap. Oh, thanks! It cleared up. Wait! The bear! Crap! The bear is no good. Crap.

    The Argent isn't flying right now. Are we using Doedicurus? It’s for stone. Argent! It's better than Doedicurus, Argen! Do we go for cooked meat? Argent is good.  Maybe split up. Argent birds and the crude oil hunting group, etc. True. Near the base, Argents are as usual. But baby. Need to mine a lot of stone with Argent and get it. Iroha-chan, divide it into 3 and 3.  Ptera, who is doing it? Botan? Fubu-chan? So you can just assign. Do what you want. Okay, then, have the members there do crude oil since I need this side for Argent. The gathering place group gets crude oil, and Ptera. The bird Ptera goes and comes back.  Ah, wait, it's growing!  Fubu-chan, Botan, and Towa go downstairs once and go look for crude oil locations. Okay. Crude oil! How do you get it?

    You can dig and so on, but how do we get it connected? I don't see it so let me get this, okay? Bibi-san is here with this. Oh, Ptera! Little monkey's Pu… wait! Ptera is here! Where? Bag zero, can you stay stopped? So let's go this way. Sit down… Oh no, this is the front. Eh, I'm going. Want to get just that guy. Eh, is Ina-senpai here?



