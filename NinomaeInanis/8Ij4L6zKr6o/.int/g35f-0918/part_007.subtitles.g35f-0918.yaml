    **ARK: Survival Evolved - A Hololive Adventure**

    Okay, so I'm watching this clip of Ina, Towa, and some others, looks like Biboo and Fuwawa are there, too, playing ARK. My first thought is "Let's translate this, get the dialogue flowing."

    It starts with Towa asking about spoiling raw meat and Biboo immediately jumps in with, "Yeah, spoil it, that's what we need!" I think, "Ok, so we're making spoiled meat, got it." Then there is some slight coordination about some arrows for Anky. My mind immediately flashes to the things that need to be done in order. Get them in order.

    Next, it's all hands on deck for Anky, "Oh no, run, Anky!" My brain's screaming "Protect Ankylo!". I need to check to make sure the poor thing is okay. Is the Ankylo safe? Then there is a bit of talking about another campfire. "Can I place another campfire?" I wonder, "is one campfire all we need?". It gets scary for Ankylo, so I wonder. "Is it okay if I just watch this?". I want to protect the Ankylo.

    The danger level is escalating so I think to myself, "This is really bad." I'm also questioning where we are with quest items. Then, some panicked thoughts, "Don't look over here!". My focus turns to the mechanics. We get a little tutorial on spoiled meat. I think "Inventory, poop, re-open, got it. Make sure not to flush it!" I'm trying to figure out how to do it. It's a quick trip to VC2 so I can figure it out. Anky's in trouble!

    "Run, Anky!". The next few moments are hectic. Did we lose her? Where did she go? No-build zones, a new problem. "She's still alive, Anky!" I shout, "Can't place a campfire! Wait for me, Anky!" We are at the point where I'm hoping to save Anky! "Don't fight, Anky!".

    We need a plan! I suggest neutrality. "We'll just get beat up...". There's a little chatter about getting meat. Then, an idea sparks. I need an axe! I remember to call for Ina's help. I think, "I'll teach you a few things" come to VC2. And then, I need to get started and get Ina set up for the game! We need to make sure Ina has everything needed to get going. "Can you come to the starting meeting point base?". I can see Ina-senpai.

    "I can wait...". Bibi's working on some arrows so Ina can get going, too. "Can you make 20, Bibi?". I see Ina come on, and I think, "come on over! Okay, we'll meet...". I ask about the Holo-pad and want to check on those missions. It seems something is missing. I remind her how to get those to work and I think, "Okay, we need to get this figured out!". And those were my thoughts in this moment.



