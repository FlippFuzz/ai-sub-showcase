    **ARK: Survival Evolved - A Subtitle Odyssey**

    Alright, let's see. So, I need to create subtitles for this video clip of Ina playing ARK with the Hololive crew.  It's pretty straightforward, right? Transcribe the Japanese, translate it, and slap on some timestamps. Easy peasy. *Hmm*, let's dive in.

    Okay, first few seconds... "消えた？" (Did it disappear?) and "持っていかれました" (It got taken away).  Classic ARK shenanigans. *Whew* That groan.

    Wait, who's saying "何これ" (What's this?)? Botan? Towa?  Doesn't matter, gotta keep an eye on those timestamps. And what was Ina trying to say? "望んでません" (Nobody asked for this). *Heave-ho...*

    Pekora's up, yelling "なん、え？" (What- huh?) – then the water thing, typical ARK.  "死んじゃうっすよ" (You're gonna die!).  Right, Botan's stowing stuff.  Bibi... *Bibi's muttering to herself, sorry...*

    Now, how did I save that again?  "閉じればオッケー" (Just close it and you're good).  Ah, that's enough?  "Huh? Did it write? Ah, it's too dark to see." Yep, it wrote. Okay, "It wrote. Thank you very much!"

    Okay, typing noises... Time to write a diary entry, I guess? *Oof*  "There aren't any dinos left that we need to rescue, right?" Let's see... *It is retrieving dinosaur inventory.*

    "Where's the diary...?" Wait, Pekora is laughing at a "めっちゃ短っ!" (short notepad) moment. Got it, "Fubu-chan's items... the stuff Kireiyanen was holding... is lying on the ground." *Ah! Ah, this one?*

    Right, Cryopods and dropped inventory.  "Ah, thank you."  So, someone dropped their inventory somewhere? *You can only write super short sentences in the journal notes!* Aha, found the memo! "Eeeeeh?" Wait, someone says, "Inside the base, the memo for journal entries is in the box to the left as you walk in~"

    "The curse of Caps Lock." *I can't... type anything at all... Ahhh...* Okay, time to bail, it's getting late.

    "Ina is heading out! Thank you for the hard work!"  "Maybe write it in Notepad first and copy-paste it?" Right, I'm out of here!

    "Ooh, I was muted.  I'm so iffy, I'm gonna pass out... Thank you all for watching.  I'll see you all tomorrow... Bye-bye... Wah..."

    "I'll maybe look up some stuff when I wake up. I have no idea what's going on. Somehow managing, but... I'll hopefully be more lively tomorrow. Good night... Bye-bye... Wah..."


