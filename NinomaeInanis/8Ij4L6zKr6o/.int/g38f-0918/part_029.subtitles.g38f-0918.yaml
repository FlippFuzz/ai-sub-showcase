    **ARK Adventures: A Hololive Collaboration**

    Okay, here’s the breakdown of my ARK: Survival Evolved session with Ina, Towa, and Anya. From the start, I'm trying to figure out what's going on, who is saying what, and what everyone's goal is in this ARK session. Towa starts by asking about meat; I'm like "guest house?"

    *   **(00:00.000 - 00:02.200)** The opening: Towa asks if there's any meat.
    *   **(00:02.700 - 00:06.800)** Anya excitedly yells about an egg, and Ina just asks back, "egg?" Anya says "yeah!" I'm already seeing Anya's enthusiasm.
    *   **(00:08.700 - 00:11.200)** Ina wants to know if there are more eggs? Towa is wondering which creature laid the egg.
    *   **(00:11.800 - 00:13.800)** I start singing, "Tonderuu~"
    *   **(00:16.000 - 00:21.000)** Anya calls for the egg, but Ina's like, "egg?"
    *   **(00:21.500 - 00:30.000)** Towa is like, hold on; Anya wants the egg badly but says she can't get it and keeps wanting it.
    *   **(00:32.600 - 00:34.000)** Anya is like, "Urrrgh..."
    *   **(00:34.000 - 00:36.000)** Towa is confused about cryopods.
    *   **(00:36.000 - 00:41.000)** I'm scared about a Rex coming, saying it's scary. Anya keeps asking for eggs.
    *   **(00:41.000 - 00:44.500)** Anya asks for the egg! Towa's like "That's right" and Anya is like "Aah..."
    *   **(00:44.500 - 00:54.000)** Towa wonders if we have waterskins. Ina threw hers away and it's awkward because no one is prepared for the adventure.
    *   **(00:54.000 - 01:06.500)** I suggest water as a cup holder. Towa explains that we can make waterskins, so we should.
    *   **(01:08.000 - 01:09.500)** Anya is ok with that.
    *   **(01:10.000 - 01:16.500)** Anya realizes the egg is not coming out.
    *   **(01:17.000 - 01:23.000)** Towa says she can take it. Then she is out because of the starvation.
    *   **(01:23.000 - 01:27.500)** I ask if Towa is ok. Towa is saying, she is dying
    *   **(01:27.500 - 01:33.200)** Anya is like, "I'm blocking the way." and I shout "Off I go!"
    *   **(01:35.500 - 01:46.200)** Anya is looking for oil, with a beaver dam and all the base set up, there is no oil
    *   **(01:46.200 - 01:54.400)** Towa says "Got it!" and I said, "Okay!"
    *   **(01:54.400 - 02:05.500)** Anya explains about the base materials: cement, pearls.
    *   **(02:05.500 - 02:13.000)** I say it's done, I did that before.
    *   **(02:13.000 - 02:15.200)** Anya's like, "Go ahead!" Towa asks, "Really?"
    *   **(02:15.200 - 02:19.500)** Anya just says, that is for you to

