  thoughts: |+
    **ARK: Survival Ascended - A VTuber's Gameplay**

    Okay, so I need to get this right. I'm watching this Japanese video clip, and I want to provide precise subtitles. It's Ninomae Ina'nis playing *ARK: Survival Ascended* with some Hololive friends. Let's see... first, I have to accurately transcribe and translate everything.

    Starting from the beginning, I hear myself saying something about having one too, at 00:00.000. Then Towa says something, sounding like she wants to go over personal mission, and I realize there are various players, like Matsuri and Aki/Luna perhaps, and one is calling their Ptera, at 00:04.700. We agree to check the team missions at 00:07.500.

    I'm gathering from listening that we need 500 metal ore, and I believe I have it. The next objective seems to be crude oil. Then Bibi says something about oil pumps, starting at 00:16.000, and I’m wondering if we need an oil pump, and where we could find it, at 00:27.500. At 00:31.500, I ask if it's crafted at the smithy, or maybe the egg hut. Towa will check that.

    Okay, at 00:43.200, we decide to finish the egg hatching personal mission first, and then go searching for crates together. Okay, okay! At 00:56.500, I selected the wrong thing, so I switch to a Ptera. Then, at 01:00.800, I start wondering how to check the individual missions again. And uh oh, the baby dino has died at 01:03.000. And someone shouts at another!

    There's a warp point with crude oil, and I get that we need a fabricator at 01:13.800. I remember that from the game. I wonder if we make the fabricator at a smithy. We need the fabricator, but I can't put it down right now, it looks like it is already there. Someone, maybe me, wants a metal pickaxe at 01:30.800.

    I'm wondering if I completed the delivery, at 01:33.200, and the missions didn't update. Ah, dinosaur breeding! At 01:43.500, did the egg hatch? Now, we need crude oil and cement! And I need to get cement from the beaver dams at 01:50.500.

    Ah, at 01:57.800, a bear shows up! A bear! Then, I wonder who to breed with Bibi, but how do I even know which dino is male or female, at 02:05.500? I am now returning to the base. It looks like it takes 10 minutes, at 02:22.000. And I'm looking at the oil pump and thinking about breeding at 02:26.500, while someone says we need Duskin.

    I am checking if I can breed with a female dino at 02:41.500, and Bibi's dino probably isn't ready. Then I messed up, I need to breed the one in back. Still not ready, but I can see a couple Pteras waiting! At 03:05.500, I hear Duskin, and finally at 03:09.000, I understand the name. Okay, it's Duxon, up there.

    I'm talking about breeding, now the dino can't do it for another five minutes at 03:15.500. Okay, now it says ready to mate! At 03:26.000, I sigh; Bibi and I are in the same situation. We might want to look for crude oil while waiting. Okay, the fabricator uses 10 oil at 03:49.800. So we need to head to the beaver dam to make a fabricator.

    How do we actually get the oil at 03:58.500? I explain, at 04:01.500, to dive into the ocean and hit oil nodes. Or there are locations on hills where it wells up, and we can put an oil pump. Wait, they're at it again at 04:26.

...
