  thoughts: |+
    Here's my summary, distilled from the clip:

    **ARK: Survival Evolved - A Hololive Gameplay Session**

    Okay, so I'm watching this Hololive ARK stream clip, and it's Ina, playing on a Japanese server. We're on the hunt for crystals at first, but I quickly get lost. "Oh no, crystals, I'm lost", and then I'm wondering if Spoiled meat is anywhere.  The portal, where was that blasted portal? Okay, all right, should I hunt? This... wait, can't I do this? If being bound is a bit too tough, then this...I'm trying to gather something and I can't.  "Ah! Can't I gather this?" Yep, I'm definitely lost. No good. Okay, somehow, it feels like this way...maybe this is it, we could set up a temporary base around here for now. Yeah, there's a forge at the meeting place, so we can smelt iron and get materials and we can do a lot more once we get a base going. We need iron, the creatures are too strong without that. Whoa! Okay. I want a dodo, Dodos are nice. I should head for the beach, maybe I can find one? The beach... maybe it's just down below the base?  Wait, is this okay? It won't become a spawn kill, will it? I see the others are cooking some meat. Can I get some of the meat that they are cooking? Aki-senpai gave me some! It's so small! Oh! I am a tree. That was close. Then I realized "I am a tree" is now an iconic phrase, oh no, I am hungry. These guys are strong. Can't we take that guy down? He's too strong... The name of the dinosaur is impossible to see, so I don't know the level of any of them. Unless we can make a spyglass, it seems impossible. I still don't understand anything at all... Towa says, "You're fine. Towa doesn't understand either." Jeez, I don't get it either. "You just have to learn by dying," right? It's the whole point in survival games, totally normal to learn by dying. It's fine to die in this game. You get stronger every time you die, since there's no death penalty. Dying is almost better. We can become meat... Wait a minute, I want to head to the meeting area.  I made a storage box... So this is a gathering spot too. Okay. Wait, I'm blindly going, ouch, no no no! Bibi needs help! Then maybe I should hunt wildlife near the meeting area to collect meat?  I'm thinking of heading back near the meeting area right now. I brought one Bronto with 50 raw meat. My harvest is gone! Maybe because I brought it. It's there and there's a dinosaur from the quest. These are strong! I got killed! Towa-senpai, could you stay there! It hurts, stop it! What's this? Meat is pretty tough to get. It hurts! Okay, okay. Where were the items again? Let me look for meat. Just as much as the meat you used... It's wrecked, but now the missions will progress properly. You're doing fine, Bibi. Just enjoy ARK. I will! Enjoy it. Let's teach this guy a lesson! What are we missing? Wait, I'm gonna die here! I'm thirsty... I'm dying! Zoom, zoom, zoom, zoom... Okay! I'm safe. Ouch! No way! Let me teach him a lesson! That guy is too scary. He's way too strong. Why not take a dinosaur with you? Right? Wait, seriously... No way, that's such a pain! It's not like you can't get over it, right? I got a saddle, I left it in the chest, and it seems you can pick up rewards at the meeting area. Huh? How many times did I die?  There's like a reward pickup counter at the meeting area for dinosaurs. I think that's where you get it. Who's that with the 500 iron? Because I turned it in. Please hold on a sec. Umm... Something about Swamp...


...
