  thoughts: |+
    **ARK Adventures with Ina, Towa, and the Gang**

    Right, here's how things are looking from my perspective, analyzing this ARK gameplay. Towa kicks things off, suggesting we sync up with the team, since she's made progress. We get the go-ahead, and after some pleasantries, the crew gets to work. There's a shout from someone in the distance – it sounds like there's some good-natured ribbing going on. Towa reports they've hit narcotic-level in the game! They were close to a Ptera near a gathering area and were going to start with a taming test.

    Questions arise around narcotic production. Did we make them? Check. Did we turn them in? Check. Looks like some are here already. We've got to resupply, so we head back down. More people want to get in, get them in! We make sure to check, for taming; it looks like only people physically present can do the taming, so we can't get sloppy with it. We decide, that the best thing is to do Gozaru's, and someone is fine with it. I wonder how long the taming takes? It's said to be fast, but that sounds like it has to be confirmed.

    We debate who's responsible for the taming process, and when that is complete. Raw meat's needed! I can see that the Ptera's been spotted, and its taming will begin. Time to watch! I'm on the lookout for the Ptera, getting a good view. Tranq arrows should speed things up - they're quick! Burnt! Hmm, I wonder if there's two of them. "Are they in the inventory?" Yeah, they're in, and someone's taking them out. Once it wakes up, we'll name it, and it's tamed! Now, is it down there? It seems to be the king of the lower levels. Okay, better get that raw meat! I will watch over it! Yes, Ina, to VC2! Someone's been tasked with doing the turn-in.

    Okay, let's see where those missions are. Narcotics. Pteranodon. Tame, then! Looks like someone is on mission 4. We check whether Ina has food. I have raw meat, but Towa has some cooked meat, too! I'll eat that. The narcotics - we're waiting for them... ten! Is it ten? Where are they? Oh, someone's already turned them in. Okay, they're going to turn them in now, while I join the VC. Bibi's joined, as well. Four? Yep, it's four! Great, let's connect! I'll try to listen. Can't hear anything... Finally, I catch up to where Towa explained. The goal: get the Ptera!

    There it is! But maybe I'm looking in the wrong place? Get that Ptera! We need the arrows! It's coming down! Wait, it's not coming down... Super far! System: "You don't have the items to turn in." Hmm? Ah, Gozaru's not holding anything. What? No bow? It's not working, and the system confirms it, by displaying the error message. Hey, wait a sec! Gozaru hasn't done the individual missions; it's by hand! No way!


...
