    **ARK: Survival Ascended – A Quick Run-Through**

    Alright, let's get this set up. I need to make sure I've got subtitles running for this video. Okay, I'm streaming ARK: Survival Ascended, and I'm on a call with Kazama Iroha and Himemori Luna. Ina is the host, and Kazama is being energetic with her samurai speech, and Luna has her babyish voice. Now, let's identify the speakers. Okay, got it!

    At 00:02, Ina, “よし” (Alright). Then at 00:06, Luna "えーー" (Ehh?) / Ina: "この..." (This...). Wait... how do I set this up? "自由" or "利用"? (Free or use?) "利用" (use)! Why can’t I use it? Gotta listen closely… Ah, at 00:13 Ina opens inventory. Ok, now I have it. Luna is saying "キーボードで..." (On the keyboard...) Ok, I can see how it works. Okay, I have it set up. And here we go, Ptera! Good!

    Here, let's get the Ptera to come over here! It seems like I've hit the wrong key. I gotta switch over to bare hands. I'm hitting the wrong key, since my hand can't reach! I've assigned the Q key to something else right now, and now there’s a rabbit nearby. Oh no, is this going to be a rerun too? There's a bear as well! Dangerous! Alright, it's set to unassigned! Let’s set it to below here. Wait, what about this green... I’m getting this right? Nice. There are so many Pteranodons!

    Oh, what should I do? Is there anything I can help with? Okay, let's get the gateway setup! Kazama mentioned that the gateway might have snapped to a grid, and it won't reset to normal. Ah, now I'm remembering this. Wait, what was that again? I can't seem to... I need to line up these gates. Ah, I see. What was I carrying again? Ah, I have my bow. Okay, let's see, it's set and long-press! Got it! Oh, is that right?

    Alright, let's get this Ptera flying and test if the gaps work between the gates. Okay, Ptera is flying now! Okay, now I can see where it is. I'm going to see if this works. Ok, the rock is in the way a bit! It's too narrow for this! I see. So it's not possible to pass through there, it seems like. Wait, an Argentavis wouldn't fit through here! How does it look?

    This makes me really wonder! I'm able to pass through here, but it’s a bit tricky... I haven't placed the doors yet. That’s why. How about this? Those gaps, how do they look? Ah, these haven't been placed. Wait, why? Okay, what's with this planning mode? Planning mode, planning mode...


