    **ARK: Survival Ascended – A Quick Recap of My Thoughts**

    Okay, so I'm watching this clip of Ina playing ARK. I'm thinking, "But you know, I might not have the leisure to watch unless someone else is playing." I remember, "Well, that's true, though I watched and did it that way." I was also thinking, "With that telescope, apparently..." Wait, "Searching for Spyglass yields nothing in the engrams." Apparently, "Apparently it's something called a Spyglass."

    "But if Spyglass isn't even in the engrams to begin with, what gives? Did the engram fli..." I was like, "Maybe I should make a sound." After some pondering, I thought, "Spyg-, um, let's see, what crafting engram level was the telescope?" Finally, "Spy, S-P-Y, S-P-Y, ah, is this it? Spyglass. Ah, this is it! Do I need the one called a Spyglass?" I then remembered, "Apparently the Spyglass lets you see things' HP even from far away. Ah, yeah, yeah, yeah."

    I shouted, "No, come over here!" Now I'm focused, "Ina, can you make it to the teleporter? Ah, then are you heading back— are you heading back? Yeah, I want you to come back." I was thinking, "Teleporter is lo... Um, the teleporter is, uh, where was it? It's 26, 62." Then, "26, wait, where did my wyvern go?"

    "Ah, so it has to be the Spyglass." I asked myself, "Elite Boar? What, what, what?" Oh man, "Wait, I got killed." "H-Hawa, hawawa, eh, waah! I can't respawn for another bit, and..." "Waah!" "Wait, I can't go back for 20 seconds! Respo-, I can't!" "Eeeh!? Eeeh!?" I yelled, "Let me go back quickly!"

    "Um, water, water everywhere... ow, I can finally go back. Gah, thank goodness! Eh, where, where? Eh, wait, I ended up somewhere I totally don't know. Ah, I came to Gozaru-san's place. It's this way. Not there... um, are everyone still at the volcano? Is Ina still there? Ah, still at the teleport... Okay. Then I'm going. I'll be going, probably. It's the volcano, right? It's the volcano. Okay. Ow. Ow. Um, this way. Over here."

    After a while, "That hurt, that hurt. Hyperthermia. Towards the ocean, huh? Ah, yeah, yeah, yeah. Ah, waah, whoa! They went away. Hm, which ocean are they at? This way? Alright, heading to the volcano. Alright, have I arrived? Oh, ote, sorry sorry, Ina, it's Ina town right now. It's right here. Um, 26, 67. Ah, getting too close to 26 snow mountain... Haven't received it yet. I'll get it later. The snow mountain side, maybe? 26, 62. Yeah, Bibi's place? Ah, right, right, Bibi's place maybe. Why am I not showing up myself?"


