    Analyzing these dialogue segments, first I'm noticing Ina'nis has joined up with Senpai, that is a good start. There's a response to an inquiry that is read. Also, there's confirmation of the point related to the judgment of touching, naming a child. There's also clarification on imprinting after birth is the crucial period.

