    **ARK Adventure with Hololive Friends**

    Okay, so I need to generate subtitles for this ARK video clip. It starts at 00:00.000 and goes until 04:59.000. It's Ninomae Ina'nis playing with other Hololive members. I'm hearing a mix of Japanese and English, a lot of Japanese collaboration, but I need to identify voices.

    Alright, let's break this down.

    *   **00:00 - 00:03:** First up, Ina speaks in English: "I forgot what we're doing to be honest." Perfect, easy start.
    *   **00:03 - 00:07:** There's a Japanese voice. It sounds like Botan or Mococo, or someone else? They say: あそこで行けるよ... 教えて、どこだ？ (You can go there... tell me, where is it?). Need to make sure I get that translation right.
    *   **00:11 - 00:16:** Ina or another Japanese speaker: 今ね、べーちゃんと一緒に行こうとしてるのかな？ (Are we going with Bae-chan now?).
    *   **00:17 - 00:20:** I hear Ame, Ina, or someone else, back to English: "going to the dino place..."
    *   **00:25 - 00:28:** Is that Kanade? I hear "かなで、かなでいる？" (Kanade, are you there?) then "いいジャン" (That's good), then "やったー！" (Yay!), and then "戻りましたー" (I'm back!) and "おかえりー" (Welcome back!).
    *   **00:34 - 00:44:** Some more Japanese: "でもマジでさー、ボタンの途中のさー、ジャンプすると体力減るぞーみたいな..." (But seriously, when you jump during Botan's [stream], your stamina goes down...), and then "あ、あれめっちゃナイスアシストだったわ" (Oh, that was a really nice assist).
    *   **00:45 - 00:54:** More commentary: "でしょう？あの平地でジャンプしないとアレ、高所でジャンプすると着地ダメージ... 着地ダメージがね、意外と入っちゃって。" (Right? You have to jump on that flat ground, otherwise, if you jump from a high place, you'll take landing damage... Landing damage, it's unexpectedly a lot).
    *   **00:54 - 01:03:** Japanese continues: "ねー、気がついてなかったわ、それ" (I didn't realize that), "あぶねー" (That was close), "あぶね、あぶね" (Close, close), "ねー、洞窟行こうかなーって" (Hey, I wonder if we should go to the cave), "そう、攻略..." (Yeah, strategy...).
    *   **01:06 - 01:16:** More Japanese, discussing something: "何の... あの服、服切るというか、服じゃなくて... 距離？" (What... that clothing, to cut clothing, or rather, it's not clothing... distance?), "距離？" (Distance?), "何がいいかーって" (What's good).
