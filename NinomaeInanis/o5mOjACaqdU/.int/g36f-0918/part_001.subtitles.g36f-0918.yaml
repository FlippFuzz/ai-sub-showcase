    **My Thoughts on the Day's Objectives**

    Okay, here's the plan. I'm going to follow the voice chat and keep everyone organized. Towa-senpai mentioned something yesterday – crude oil, was it? No, Tokoyami is on pearls and oil pumps. Pekora-chan is known for carrying a lot of items so, she will be helping. We are heading to voice chat 2. Ina-senpai, let's go together. If Towa-senpai gives the okay, then we will start.

    Ah, Gozaru, fresh looks frighten her, and she leaves her ghillie suit behind. I understand, it's pretty scary. I should find a safe place. Okay, yesterday's plan... I need to find Argent, right? Did Ina-senpai catch an Argent yesterday? It seems there's a mission to kill five Argents while breeding. I wonder... can we just breed and kill our Argent? Why not do it at our place since we only need one? That was the idea, so, for today...

    We will first tame Argents over there, like yesterday and breed them over there at the same time. That sounds good! Wait, do you still have the Pteranodon on hand? Oh wait, it should be in the left place. Are there Argents in this house? Nope. Then this is the Ankylo. Ina-senpai, could you ride Attack ZERO? Then we'll breed over there too. We might need some wood to build stone foundations. Let me organize this.

    I'll put the ghillie suit here; it's a bit scary. Let's get dressed. Ina's ghillie suit is here. Um, split the stack in half. Okay! Then, let's make this and go. Could you ride Attack ZERO? Great! Today our senpai will probably catch Argents for us, we will need the chitin and keratin for Argent saddles. Okay, okay.

    I can run. I know where Gozaru is... but watch out for bears. Oh, there it is! Wait, what's that big thing nearby? Oh, is it a herbivore? Yes. It's huge. Looks kind of like a fish. Yep, flat, flat shaped.


