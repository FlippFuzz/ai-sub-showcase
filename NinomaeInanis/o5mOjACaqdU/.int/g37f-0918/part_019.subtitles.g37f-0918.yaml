    **ARK Adventures: A Stream of Consciousness**

    Alright, let's break this down. First, I'm thinking, "Subtitles! I need to get this VTuber clip properly subtitled!" It's Ina, playing ARK with the usual crew – I recognize Fubuki's voice and maybe Matsuri and Roboco? I'll need to listen carefully to transcribe everything accurately.

    Right, so we're starting with gathering. Five creatures? Okay, we're talking about breeding, so if we've got a female from the breeding, we can breed her with the offsping. Sounds like a good plan. Oh, gotta remember to whip up that Medical Brew. Need healing potions, and those things are essential in the moments that follow. Okay, time to make Medical Brew. It's Tintoberries and Narcotics. Cooking Pot, got it. Wasn't I sure I had a Cooking Pot somewhere? Need to find it. Ah, here it is. Perfect. Now, I should make sure we've got a good supply of that.

    Someone mentions a need to mass-produce it... I'm a little short on Tintoberries, so I should let someone else go gather them. Oh, wait, 400? Okay, use them all, sounds good. They're the red ones, right? Yeah, I'm pretty sure I have a bunch too.

    Okay, let's see. Relay base? I need to fast travel. Oh no, bugs.

    Whoa, wait a second. Is that a Pyromane?! Crap, this is bad! Okay, it's really bad! This is impossible! Can we defeat it? Can we defeat it?

    Oh, is everybody alright? Okay, someone should get away from the aggro for a moment, let's focus. Who is it targeting? Who's it trying to get? I recognize Febreze! Okay, it's on Febreze. Someone's burning! Febreze! Alright, come on everyone, land. And get over here! We have a saddle on Febreze, but... this is not good.

    Okay, let's try to distance it and get rid of it. Whoa, there are so many of them flying over! No, Febreze is down! Get over here! Get away from the base for a second... Oh no, hardcore base... oh man, this is bad! Are you dying? You're going to die! No way, hardcore base. Ugh...

    Where did I put the water bottle? I know I put it away somewhere. Maybe putting it in the Cryopod and teleporting is better. There are two of them, so it might be tough. This is going to be really tough. Should someone just go become the decoy? The creature is coming down to be the decoy. Here it comes, but this is the right move. This is a crazy base! Okay, okay, okay. We are here for only one more day though. True. Metal is plentiful here, and we don't even have to travel far for it. Okay, gotta remember to look for metal.

    Wait, where did I put that canteen? Ah, I forgot! Hey it's you! it's on you! Oh, the thing is going to chase Gozaru! I'm already dead! Please, lure them away from the base! Get away, okay? Okay, with this...

    You are so pretty! You have nice burn... Wait! Shoot! Get on, I can fast travel now! Can't you see, I can not get away!

    Shoot, I'll teleport right now. Okay, okay, it's dangerous, so I'll teleport and get away. Thank goodness! Hey, come over here! It's flying! Alright, I teleported. It's dangerous though. Thanks everyone. Next, I need to go get the Pteranodon saddle. Gozaru put it on that one, right? What should I do about that? Flying! All right.


