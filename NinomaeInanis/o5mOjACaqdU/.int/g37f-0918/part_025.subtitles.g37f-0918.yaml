  thoughts: |+
    **ARK: Survival Evolved - Horse Race Analysis**

    Alright, let's break this down. First, the question pops up: "What if the horse dies?"  Seems Aki's handling this, clarifying the respawn mechanic, explaining how they'll replenish horses from the vault behind.  We got the okay from the team, up to two respawns are allowed. Good to know. Aki mentions the blood effect is just for visual max HP, not to worry. Ina's okay with it.

    Then, race prep. Doors open, the race begins. It's a go!  Fastest expected time: around 8 minutes. Whoa, that's long! But the excitement is there, the cheers are loud. Now we're racing! We're off!  Oh, the pink gate! Huh? Not this way? People are everywhere! It's chaotic. We're getting stuck, lag is real! Ina's comments about the time as she makes her way through the course.

    The horse has incredible jump, and it's too fast! Then, the giganto shows up, Senpai?! Instant death, and I'm staring at the death screen. I wonder where should I go. The gathering point? Wait, should I go back to camp?  I'm back. Is this the right place? Someone is here. Time to heal and take HP. Level up, again!

    I'm thinking, is there a way to access the tame inventory without dismounting? F?  Okay, I see.


...
