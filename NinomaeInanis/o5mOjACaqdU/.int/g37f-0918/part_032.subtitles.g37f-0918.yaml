  thoughts: |+
    **ARK: Survival Ascended Cave Raid - A Hololive POV**

    Alright, let's get this cave run planned out. First, it looks like we're diving into an ARK: Survival Ascended cave with the Hololive crew (Ina, Matsuri, Botan, Towa, and others), so I need to make sure my dino game is on point.

    It looks like the initial plan is to bring a flying dino like a Pteranodon or Argentavis. I'm thinking a Megatherium (Bibi-chan!) will be useful for combat in the cave, I *think* it will do better than nothing, so I need to grab that from the cryofridge. Oh, no! Honmaya got raided, Bibi-chan (the Megatherium) was lost in the raid because it wasn't stashed! Well, Bibi is getting prepped with the mummy. Ina can ride her Yutyrannus, I guess I can let her have it. I need to get some meat ready for the journey, and I realize I've misplaced my canteen. I had to craft another Pteranodon; that was a surprise! I think Ina's ready to go. I need to make sure I'm following the right dino on the ride. I need to find the Argentavis!

    We're going to coordinates 54, 52. Following the group since I can't read the map. Alright, getting the hang of this. Wait, are we even allowed to fly in here? And... heavy! I'm carrying too much weight, as usual! Gotta drop some of the extra hides. Okay, team, let's enter the cave from above. Hopefully, we can fly in.


