  thoughts: |+
    **ARK: Survival Evolved - Hololive EN ARK Session Summary**

    Right, let me see... Okay, so we're looking at this ARK session, and the immediate thought is: "Is this a cave?" or "Is this a dungeon?" I have to focus, zone detection is always a subtle beast. It's tough to tell where to go at the start. "Where should I go?" I wonder if we should just wait, but that's not exactly productive. Lost, lost... oh yeah, the lost kitten feeling. It is hard to judge at first, so let's try going this way. Is that gas swirling around? Gassy gas everywhere.

    But then, I was thinking about it, I was pretty sure it's supposed to be purple and thus easier to see. Like a treasure chest. Right, it's glowing, makes sense. But is this a dungeon? Is this even *considered* a dungeon? Ah, wait, pink moss. The pink moss! Well, maybe it's not a dungeon then. Then it was like, blue mushrooms! Blue mushrooms! The mushrooms are here!

    "What is this?" This pink stuff is organic polymer. Hang on a second... "Can I take it?" Oh, it's the stuff you sent. Ah, yeah, yeah. But no, I can't harvest it! "What is this?" But maybe, "I think I found it!" "Nice!" This is it. If we go up, it's the exit! Is *this* it? I had a feeling there were two, I was sure. "Isn't it this?" Ah! Found it! This is the Artifact of the Immune! Well, not the Clever, it's the Immune. There *should* be the Clever somewhere. But we can take this one. Alright. I'll bring it back. Let's go this way. Lost, lost, lost... going up here, it looks like we can get out. Yeah! Oh, great, the log popped up!

    So, the exit for the Artifact of the Immune. Fubuki-senpai and Kazama were just there, yeah. Ah, that's what that was. I see. Maybe we will go this way, "Let's search here." Total maze, it's a huge maze. This is a maze! What a total situation. Crap, lost. Totally lost now. Super lost! Oh my god. I'm already separated from everyone! Not to worry, it's huge, this place! It's so vast. I think this place is huge, vast, oh man, then I have to think about this: if I'm thinking like this, and I can't see anyone, maybe we're not overlapping. Yeah, I think I was also thinking about that Therizino earlier.

    Amazing! I found an insanely yellow place, but what is *this*? "What is this?" No idea, no idea. Now, what does this stuff do? Right, this is for stamina recovery. Left, left. Lost... Oh? Ah, it's heavy, heavy. Obelisk... "What is this place?" Following you! Ina-senpai, let's go! Okay. Ah, this is Polymer? This way? Indeed! Ah, so came out somewhere. Sorry, I'm charging ahead! You two, I'm sorry. I am okay! Okay. Tell me if you lose sight of me, okay?

    I ended up coming out by the castle! Well, I'm still searching various paths below but, there are places here and there where you can pop out upwards... Right, there are places where you can exit! Watch your Ptera's stamina, okay? Okay. Rest here for a moment. Running out of stamina, okay? Oh! "That's tough". Is this crystal? "No."

    There should really be an item with a billowing pink aura. Yeah, someone is here, but I don't know if this counts as a cave or not. I think it counts as a cave. Then we have to wait... but we don't know what they're doing! Even if they're there. Wonder if they're searching? Ah, is that the portal? No, it's not a portal... Is this someone's house? Ah, it's a team base here. "Oh, huh..." Right, we need the Clever, right? Yeah, the Clever! We found the Immune earlier! The Immune. Was the Immune near the light-blue area? Past the light-blue area.

    Then if you follow the purple area, it's a single path, but since I went inside, I'm not sure. Maybe I'll follow the purple-ish area. Since light-blue is Immune and not Clever...

...
