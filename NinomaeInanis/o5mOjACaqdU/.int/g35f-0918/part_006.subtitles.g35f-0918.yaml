  thoughts: "**A Day in the Life of a Hololive Ark Player**\n\nOkay, so the stream\
    \ starts, and I'm immediately thinking, \"Obsidian and cementing paste... right,\
    \ we need those for the base.\" Partner and I are discussing game strategy and\
    \ then, \"Alright, they're here! Let's go, junior!\".  We're working together,\
    \ of course. Suddenly, an egg! \"Oh! An egg!\".  Gotta collect it; it's glowing.\
    \ \"Ina-senpai, pick this up,\" Partner says. \"Yes,\" I reply. \n\nWe find ourselves\
    \ in a somewhat precarious situation, \"this place is a bit too likely to cause\
    \ carbon monoxide poisoning.\" I'm asking, \"Is this good?\" Partner's checking\
    \ the situation, \"Eh, is it tight? Is it maybe too tight?\" We're trying to figure\
    \ out the best spot.  \"If we just plop it down somewhere in here... won't it\
    \ get warm?\" I ask, \"Do I drop it here?\". \"Did Fu-chan make this?\",  \"Ah,\
    \ drop.\"\n\n\"Oh! Oh!\" Partner exclaims, \"The egg is on fire, visually!\" \
    \ We're laughing, \"It smells delicious...\" but then, \"Eh, it says it's too\
    \ hot!\" I get burned and say, \"Hot!\".  Partner reassures me, \"It says it's\
    \ too hot. Hold on.\" So we try putting it back. \"Maybe just being inside here\
    \ is enough? Perhaps,\" I think. \"This is the fertilized egg, let's... drop it\"\
    .  \"How is it?\" I ask.\n\nThen, a dangerous creature nearby. \"Uh, I think something\
    \ dangerous might have come?\" Partner asks, \"It's a dangerous one. Should we\
    \ lure it away?\" \"Shall we? Just a bit... to that place over there\"  I say,\
    \ and we watch the battle.  \"They're fighting. We can probably just run away,\"\
    \ I think.  \"Right\" I respond to Partner. \"Let's retrieve Vilgen too,\"Partner\
    \ says, which is my bird.\n\n\"Hurry up and finish taming, you,\" I say to the\
    \ bird. \"If it goes back to the base, though, that might be dangerous,\" I realize.\
    \ \"Scary...\" I say, Partner: \"Yeah\".  \"It came back? Let's hide a bit,\"\
    \ I say. \"Ina-senpai, can you make a simple bed?\" Partner says, and I respond,\
    \ \"Ah, okay.\" \"Looks like it's tamed. What should we name it?\". Partner: \"\
    Ah, you can decide the name\". \"Argen 1,\" I say. Then, \"Ah, shoot.\"\n\nPartner\
    \ picks it up and asks, \"Eh, what should we do? What should we do? How is it\
    \ looking?\" \"Its health seems fine, but it's a bit close again, the dangerous\
    \ one...\"  Partner adds, \"Wait, there's a baby Argen, lol.\" \"This way,\" Partner\
    \ says, \"Yeah, okay, okay. I brought it over, I brought it over.\" I say, \"\
    Thank goodness,\" and then, \"Phew.\"\n\n\n"
