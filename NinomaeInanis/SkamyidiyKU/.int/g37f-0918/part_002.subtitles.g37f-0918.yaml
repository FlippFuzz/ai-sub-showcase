    The group decides that Ina is going to become the "mute monkey". I'm thinking, this means, Ina has more of a passive role and FBK will drive the next phase. They are going into a code module and the group has to figure out whether this is going to be code.

    The next segment is about the module, what is the code? There are "cords" and "cables" and it's time to figure out what color we are looking at. We're getting closer... The light is blue, we need to locate the corresponding cord. I'm noting the color-coding system and the need for precision in color identification. There's a breakthrough! We've identified the correct wire (green) and it has to be the wire on the left, and success! The relief and joy are palpable.

    The discussion then takes a turn towards how to use the "emotes" to communicate. It sounds like there's an issue with the emotes, as they might be confusing or difficult to understand. The idea is, the most useful way to communicate is likely to communicate through an object.

    The next segment is about levers. The color yellow is causing some confusion. We have to be meticulous about the color descriptions. It seems like the "colors" are a very important thing here.

    The final segment involves the need to up and down the colors. Again, we are running into problems with the "yellow". The idea is to make the colors work. Communication gets a little heated, but eventually, we seem to be getting to the final piece. The team is trying to figure out which lever to change. It looks like "yellow" is the final lever to change. There is some confusion, and eventually, we identify the correct yellow lever. The next module is on the agenda.


