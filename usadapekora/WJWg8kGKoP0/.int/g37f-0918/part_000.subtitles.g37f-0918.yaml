    Here's the breakdown of the initial dialog: 4:06.800: "さあ、いらっしゃいませ！いらっしゃいませ！いらっしゃいませー！" which is "Welcome, welcome, welcome, one and all!". And then at 4:10.400: "ありがとうございます！ありがとうございます！" is "Thank you so much! Thank you!" and then again at 4:13.200: "さあ、いらっしゃいませ！いらっしゃいませー！" and the translation is "Welcome! Welcome!".

