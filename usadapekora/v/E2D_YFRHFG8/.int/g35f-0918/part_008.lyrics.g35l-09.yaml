      「願わくば、忘れて」と...... 其れが最初で最後の嘘
      今手の中に包まれたら 温かくて瞳を閉じる
      空を覆った雪の華は 寂しそうに流れた雫
      ヤサシイキモチオオシエテクレタ
      セツナイキモチオオシエテクレタ
      ソレハナニヨリモダイジナコトデ
      忘れはしないよ
      いつかどこかでまた会えたら きっと側で羽を広げて......
      雪は次第に雨となって 云が千切れて虹を架ける
      私の羽と同じような とても綺麗な色に変わる
    reference_lyrics_en: |-
      On a night when soft clouds lightly hid the moon
      I somehow wandered into a small, dusty room
      Candle light... growing closer, farther, then closer again
      My burning heart... that heart is the same in its clumsiness
      Gently fluttering down, I spread my wings by your side
      "I want to see the same world," such a sentiment was shown through a gaze
      When I touched the tip of that finger, inexplicably, I became very warm
      I don't know how long we spent together in the cold room
      With a tearful face, you looked at me, who could not fly
      "If I could, I would wish to forget..." That is both the first and last lie
      Warmly wrapped in your hands, I close my eyes
      The flowers of snow that cover the sky are lonely flowing drops
      You taught me kind feelings
      You taught me sad feelings
      That is more important than anything, and I won't forget
      Someday, if we meet again, surely, I'll spread my wings by your side
      The snow gradually turns into rain, the clouds tear apart and bridge a rainbow
      Changing into a very beautiful color just like my wings
