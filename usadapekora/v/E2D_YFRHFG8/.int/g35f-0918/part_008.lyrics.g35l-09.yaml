      星空をひらりふわり 云に隠れた月の夜
      なんとなく迷い込んだ 埃まみれの小さな部屋
      蝋燭の灯り......アカリ 近く遠くまた近く
      灼熱の心......ココロ そんな不器用さに似て
      ゆるやかに舞い降りて あなたの側で羽広げた
