    music and slot machine game mechanics, featuring high-energy performances, guest
    appearances from various Hololive members (including Oomaru Polka, Shishiro Botan,
    Oozora Subaru, Houshou Marine, Nekomata Okayu, Shiranui Flare, Inugami Korone,
    IRyS, Nerissa Ravencroft, Himemori Luna, and Tsunomaki Watame), merchandise announcements
    with Pekomama, and an encore performance.
