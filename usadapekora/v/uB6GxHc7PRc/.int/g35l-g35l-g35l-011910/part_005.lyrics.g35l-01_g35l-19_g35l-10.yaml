global_summary:
  overall_summary: This video is the 2025 birthday 3D live concert stream of Hololive
    3rd Generation VTuber Usada Pekora, titled 'Usada Pekora Birthday 3D Live! FEVER!!!!!!!
    Peko!'. Broadcast on January 12, 2025, the concert revolves around a high-energy
    pachinko and arcade 'FEVER' theme with slot-machine motifs, visual effects, and
    sound cues. Pekora performs an electrifying setlist of iconic anime, game, and
    pachislot tie-in songs, joined by special guest appearances from Hololive talents
    including Nakiri Ayame, Fuwawa & Mococo Abyssgard, Omaru Polka, Ookami Mio, Inugami
    Korone, AZKi, Mori Calliope, and Hakos Baelz. The stream includes vibrant MC banter,
    birthday merchandise introductions, and an exclusive membership-only encore performance.
