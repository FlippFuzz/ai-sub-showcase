    and slot machine theme for the third consecutive year, Pekora presents a high-energy
    concert featuring various guest appearances from Hololive JP and Hololive English
    members, elaborate virtual stage演出 (productions), song performances with slot-style
    jackpot interludes, and the grand unveiling of her brand new 3D outfit.
