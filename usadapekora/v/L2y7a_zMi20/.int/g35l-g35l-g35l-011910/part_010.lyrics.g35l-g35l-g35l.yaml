  english: I can't put it into words.
- start: '00:22.104'
  end: '00:32.004'
  original: 君のくれた日が積み重ね 過ぎ去った日々を二人歩いた『軌跡』
  english: The days you gave me piled up, our "miracle" of walking through those bygone
    days together.
- start: '00:32.804'
  end: '00:43.004'
  original: 僕らの出逢いがもし偶然ならば? 運命ならば? 君に巡り逢えた それって奇跡
  english: If our meeting was a coincidence? If it was fate? Meeting you was a miracle.
- start: '00:43.804'
  end: '00:54.004'
  original: 2人寄り添って歩いて 永遠の愛を形にして いつまでも君の横で笑っていたくて
