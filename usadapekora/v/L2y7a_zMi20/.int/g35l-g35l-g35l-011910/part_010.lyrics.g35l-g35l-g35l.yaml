  original: 明日 今日より笑顔になれる
  english: Tomorrow, I'll be able to smile even more than today,
- start: '00:05.104'
  end: '00:10.504'
  original: 溢れる想いが止まらない
  english: and my overflowing feelings won't stop.
- start: '00:11.104'
  end: '00:16.204'
  original: 今でもこんなに好きなのに
  english: Even though I love you so much right now,
- start: '00:16.204'
  end: '00:21.204'
