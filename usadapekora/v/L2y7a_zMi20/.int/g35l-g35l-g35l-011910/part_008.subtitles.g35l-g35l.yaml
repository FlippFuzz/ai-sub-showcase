  overall_summary: This video is Usada Pekora's birthday 3D live concert titled '【3D
    LIVE】みんなありがとう！ぺこーらありがとうLIVE！', streamed on March 3, 2024. The live features a
    school/academy theme ('UP Academy') where Pekora performs a variety of cover songs
    and original tracks, joined by numerous Hololive guest stars including Oogami
    Mio, Tokoyami Towa, Momosuzu Nene, Kazama Iroha, Hakui Koyori, Shirakami Fubuki,
    Inugami Korone, Amane Kanata, and Omaru Polka. The stream concludes with the announcement
    of her birthday merchandise line and an exclusive encore for fan club members.
