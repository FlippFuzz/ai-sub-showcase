  thoughts: |+
    **My Thoughts on Pekora's Birthday Merchandise and After-Party**

    Okay, so first, the hook: "Everyone, are you finally graduating?"  Nice way to grab attention, especially with the U.P. Academy theme.  Graduating in *one day*?  That's a fun concept, and it immediately sets the tone for the merchandise.  Thinking about those graduation certificates – yeah, they're not the usual merch, and they're rare, which makes them intriguing. I'm loving the Hagure-mama artwork! It’s beautiful, cute, perfect. The graduation certificate needs to be displayed! It’s on a shelf or somewhere, peko!

    Then comes the "Pekora's Study Notebook."  Clever – you can definitely get people to use that for studying and doodling. The Okuni-sensei illustration is a good choice for the front, and the poem on the back?  That’s a nice little bonus to add to it. I submitted a few works for this. "Nan sakuhin ka", it's what I intended to do! "Please look forward to it!" I want people to use the notebook everywhere, at school, at work or at home.

    The next is the white rabbit kigurumi keychain! "Cute!"  It’s an outing plush keychain. Attaching it to a bag would be perfect. And since I don't go out much, it’d be cute. This expression is irresistible!

    Fourth is the U.P. Academy tote bag.  Simple shape, making it very user-friendly. Attach that keychain! Perfect!  And that U.P. Academy logo? That's really stylish. The design really gives the students vibe.  Perfect for everyday use.

    And a big plus, the full set gives you a foil-stamped postcard with a message! The expression on the Peko-chan is adorable and cute. So it’s worth the full set.  Also, you can buy these individually, which is good.

    The sales start right after this live at 10:00! And we're looking forward to enrolling in U.P. Academy!

    But here's the best part:  After the live, a member-limited encore live! Wonder what song to sing? What am I going to dance to? The members will get something extra to look forward to!

    Thank you to everyone for watching the "Thank You Live"!  It means a lot. See you on the next stream. Bye-bye!


