    The key is that none of us know what the others chose. It's meant to be a surprise, which adds to the suspense and anticipation. The guests acknowledge Vegemite is tasty, so it seems like an interesting combination. Then, the tasting begins.

    Roberu, with a dramatic flair, selects beef tongue ("Gyutan") as his ingredient, a "God tier" pairing in his view. He is thinking this should be a good match for Vegemite. He thought the saltiness of Vegemite will enhance the meat. A professional chef crafted the beef tongue into a "Beef Tongue Tortilla".

    The moment of truth arrives. It's a "Beef Tongue Tortilla"! This is a combination of flavours. As it's being presented, I immediately notice the Vegemite is not obvious. We're intrigued, as we take the first bite, it's delicious, but... where is the Vegemite? The taste is delicious, and the beef tongue is well paired to the other flavours.

    Everyone's reactions are great, the dish is truly tasty. It's then confirmed that we can't taste the Vegemite, but it's delicious nonetheless. We get a comment from the food coordinator, explaining how they made it: they took the idea of eating beef tongue with a salt lemon sauce and used Vegemite instead of salt.


