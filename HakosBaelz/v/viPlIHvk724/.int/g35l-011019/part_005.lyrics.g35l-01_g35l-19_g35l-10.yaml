  original: ネットはさながら風呂場の延長 データの洪水日日炎上 石川みたいに身を入り洗浄
  english: The internet is like an extension of the bathhouse, a flood of data catching
    fire daily, purifying ourselves like Ishikawa...
- start: '04:19.492'
  end: '04:22.092'
  original: 一生戦場
  english: A battlefield for life!
- start: '04:22.092'
  end: '04:28.172'
  original: この名前言うごと どんな麻痺も全部かっこよくだって見せるぜ
  english: Every time you say this name, I'll make even the numbness look cool.
- start: '04:28.872'
  end: '04:35.372'
  original: この名前言うごと 残念不愉快も不意に見舞われても 錆びた鎖じゃ意味はなさず
  english: Every time you say this name, no matter what sudden unpleasantness hits,
    rusted chains hold no meaning.
- start: '04:40.852'
  end: '04:46.852'
  original: 飛び本としからせ きらきらにありのまま行く
  english: Taking flight and roaring, going as we are, shining brilliantly!
- start: '04:54.492'
  end: '04:59.972'
  original: 演奏俺は魅せるだけ 畳み込む目を得る風邪って金食らうほどに気品に縁を
  english: I only show my performance, folding up eyes... catching colds, gaining
    enough elegance to eat up money.
