  overall_summary: This YouTube video features the '≪ReCOLOR 3D LIVE≫ Hakos Baelz
    Birthday Live 2026 + NEW 3D OUTFIT!', streamed by Hakos Baelz of Hololive English
    -Promise-. Celebrating her annual 'not-birthday' live, Bae unveils her stunning
    new 3D outfit designed by Mika Pikazo, alongside upgraded outfits for her backup
    dancers. The high-energy concert features a diverse setlist of solo performances
    and guest collaborations with Hololive members IRyS, Mori Calliope, Takanashi
    Kiara, Kureiji Ollie, Kobo Kanaeru, Aragami Oga, and Kishido Temma. Highlights
    include the premiere of her new original song and 3D music video 'Snake Eyes',
    a merchandise showcase featuring rubber mats, plushie keychains, pouches, and
    ASMR voice packs, culminating in an emotional encore performance.
