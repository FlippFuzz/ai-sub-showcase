  original: ここはオーゾラ警察。数々の難事件を解決してきた優秀な警察から、今回の事件に関するさらなる情報を得るべく、探偵は警察署を訪れていた。
  english: And so, here she visits the Oozora Police. With their stellar track record
    of solving mysterious cases like this one easily, she hopes they can give her
    some leads.
- start: '04:17.137'
  end: '04:25.437'
  original: はーら、事件の捜査は我々プローにまかせとけばいいんだよ。
  english: I mean, you should leave the investigating to the professionals.
- start: '04:26.037'
  end: '04:31.417'
  original: なに? 被害者の服に魔力の痕跡があったって?
  english: What? Magical residue on the victim's clothing?
- start: '04:31.957'
  end: '04:34.557'
  original: そうた、そんなバカな話があるか。
  english: Yes! That is very silly!
- start: '04:35.037'
  end: '04:42.317'
  original: こいつめ、次、自分自身が凶器かもしれないとか言うんだ、証拠。
  english: Next, she's going to tell you that SHE'S actually involved and might be
    the murder weapon.
- start: '04:52.557'
  end: '04:53.677'
  original: それだ!
  english: Wait, that's it!
- start: '04:53.957'
  end: '04:54.677'
  original: はぁ?
  english: Huh?
- start: '04:55.617'
  end: '04:58.757'
  original: こいつ今、自分が凶器だって自白した?
  english: Did she just confess to being the murder weapon?
