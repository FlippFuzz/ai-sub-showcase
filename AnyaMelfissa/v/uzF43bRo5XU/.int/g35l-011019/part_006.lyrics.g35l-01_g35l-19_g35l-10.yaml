- start: '00:16.200'
  end: '00:20.400'
  original: 超的な力が殺人事件に関わっている？
  english: A supernatural occurrence, happening in a murder case?
- start: '00:20.800'
  end: '00:24.400'
  original: いやいやそんな、ねえ？
  english: That's just unbelievable, right?
- start: '00:25.100'
  end: '00:31.400'
  original: にわかには信じがたいが、今の手がかりから推理するとそういうことになる。
  english: She had a hard time believing it, but all the hints said otherwise.
- start: '00:32.000'
  end: '00:37.700'
  original: まだパズルのピースがピタリとはまらないこの不思議で奇妙な事件。
  english: Still, there were pieces of this puzzle that refused to fit.
- start: '00:37.800'
  end: '00:42.500'
  original: 探偵は信頼できる情報源に頼ることにした。
  english: So the detective turned to a reliable source for help.
- start: '00:44.200'
  end: '00:45.800'
  original: あっ、来てくれたー
  english: Hey, I'm glad you're here...
- start: '00:46.800'
  end: '00:49.000'
  original: なんで君達まで？
  english: '...And why are you guys also here?'
- start: '00:49.800'
  end: '00:53.000'
  original: ゼータが来ると聞いたから、アーニャにちょっかいかけてやろうと思って！
  english: We heard Zeta was coming over, and decided to bug ya!
- start: '00:53.100'
  end: '00:54.600'
  original: はいはい。
  english: Yes, yes, I see.
- start: '00:54.900'
  end: '00:56.500'
  original: もー！つれないなぁ。
  english: Aww, come on! You're no fun.
- start: '00:57.100'
  end: '00:59.400'
  original: それはそうと、ゼータ、何か掴めた？
  english: Anyway, Zeta, did you find anything?
- start: '00:59.900'
  end: '01:03.800'
  original: もちろん！優秀なシークレットエージェントなので！
  english: Of course! I'm not an elite secret agent for nothing.
- start: '01:04.200'
  end: '01:11.400'
  original: イナの描いた似顔絵と大空警察の資料から、被害者の身元を特定できたよ。
  english: Between the portrait from Ina and the files from the Oozora Police, I've
    been able to positively ID the murder victim.
- start: '01:11.500'
  end: '01:14.200'
  original: でも…ちょっと変なんだよね。
  english: But... what I found is weird.
- start: '01:14.300'
  end: '01:15.100'
  original: どうして？
  english: How so?
- start: '01:15.200'
  end: '01:25.500'
  original: 被害者の履歴を調べたところ、その人物は 何百年も前の時代の人だったんだ。でもその人物が、数日前 に死体で発見された… 話がつながらないよ。
  english: Well, when I investigated their history, I found that they actually lived
    centuries ago. So how they were also somehow murdered just days ago... it doesn't
    make any sense.
- start: '01:26.100'
  end: '01:29.800'
  original: アーニャからもらった情報に間違いがあったとか？
  english: Did you perhaps confuse your information or something?
- start: '01:30.200'
  end: '01:33.800'
  original: なるほど、やっとつながってきた。
  english: Actually, things are finally starting to make sense.
- start: '01:34.000'
  end: '01:34.900'
  original: ああ。
  english: Oh.
- start: '01:35.000'
  end: '01:40.800'
  original: 一人の被害者が、過去と現在で二度死んだことになる。誰かが時間と次元をねじ曲げて、そんな状況を作り出した。
  english: A victim caught between two times. One who died in two different ways.
    Someone warped time and dimensions to create that situation.
- start: '01:41.000'
  end: '01:46.900'
  original: なかなかできることじゃない…でも君なら可能でしょ。
  english: Not many exist who can cause time and dimensions to warp in a way to make
    that possible... but you're one of them.
- start: '01:51.100'
  end: '01:52.500'
  original: さすがは名探偵。
  english: Well done, detective.
- start: '01:52.800'
  end: '01:53.900'
  original: ありがとう。
  english: Thank you.
- start: '01:54.000'
  end: '01:56.800'
  original: ちょっと時間がかかりすぎかな。危うくネタばらしするとこだった。
  english: Took you long enough. I was this close to telling ya the whole thing.
- start: '01:57.000'
  end: '01:59.900'
  original: レイネが書いてくれた、この匿名の手紙もいいヒントになったよ。
  english: You helped enough with this anonymous letter about the murder.
- start: '02:00.100'
  end: '02:02.500'
  original: えっ、バレてた？
  english: O-oh, you figured out that was me?
- start: '02:02.800'
  end: '02:04.800'
  original: 書き方のクセで分かる。
  english: I recognized your writing style.
- start: '02:05.100'
  end: '02:09.500'
  original: 待って、どういうこと？ムーナと被害者にはどんな関係があるの？
  english: W-wait, I don't get it. What does Moona have to do with the victim?
- start: '02:09.900'
  end: '02:18.900'
  original: ムーナは、別の時空で殺された遺体を我々が居るこの時空へ移動させたんだ。ゼータが特定した人物は、この世界線における同一人物ってこと。
  english: She took a murder victim from another space and time, and moved them into
    our dimension. The one you IDed was this universe's version of the same person.
- start: '02:19.100'
  end: '02:22.900'
  original: なるほど…？でもどうしてそんなことを？
  english: Uh... okay. But then why?
- start: '02:23.900'
  end: '02:29.900'
  original: 理由も気になるけど、それより確かめたいことがある。
  english: That is an important question, but there's one I want answered even more.
- start: '02:30.500'
  end: '02:33.500'
  original: ムーナが…私にあの夢を見せたの？
  english: Are you... responsible for my dreams?
- start: '02:33.900'
  end: '02:35.000'
  original: それは違う。
  english: No.
- start: '02:35.900'
  end: '02:44.800'
  original: あなたがあの夢を見ていることを知って、私はあの夢が生まれる根源を調べてみた。そして見つけたのが、次元の向こう側から声を届けようとする魂。
  english: After I learned about your dreams, I used my powers to search for the source
    of them. I found a spirit reaching out from time and dimensions.
- start: '02:45.000'
  end: '02:48.800'
  original: 私はその魂のために橋渡しをしてあげただけ…。
  english: All I've done is try to help them by making the bridge a little easier...
- start: '02:49.100'
  end: '02:52.800'
  original: 私も手伝ったよ！というか、私のアイデア。
  english: With my help! I mean, it was my idea...
- start: '02:53.000'
  end: '02:54.200'
  original: そう。
  english: True.
- start: '02:55.200'
  end: '03:04.500'
  original: ただやり方が悪かったのか、アーニャの見たものが他の人にも見えちゃったみたい。巻き込んだKFPの従業員には後でお詫びしなきゃ…。
  english: Though doing it this way has caused some of what you've been experiencing
    to leak to other people. We're going to have to apologize to the KFP workers...
- start: '03:05.100'
  end: '03:08.200'
  original: でもその魂が、どうして私に声を届けようとしてるの？
  english: But why is the spirit reaching out to me of all people?
- start: '03:08.900'
  end: '03:13.800'
  original: それは私に訊くことじゃない。私が話すべきことじゃない。
  english: It wouldn't be right for me to answer those questions. It's not my story
    to tell.
- start: '03:14.000'
  end: '03:17.500'
  original: あの魂に心を開いてあげて。それだけでいい。
  english: Open yourself up to the spirits, and they'll do the rest.
- start: '03:18.000'
  end: '03:20.500'
  original: 心をもっと開く方法なら知ってるよ！
  english: I got a way to make yourself more open to spirits!
- start: '03:21.000'
  end: '03:22.500'
  original: それって歌？
  english: Is it through song?
- start: '03:22.800'
  end: '03:24.200'
  original: え？なんで分かったの？
  english: Huh? How'd you know?
- start: '03:24.800'
  end: '03:26.500'
  original: まあ、勘かな…。
  english: Lucky guess...
- start: '03:55.300'
  end: '03:59.800'
  original: 思い出していた 思い出せなくて泣いていた
  english: I was remembering... crying because I couldn't remember.
- start: '04:00.100'
  end: '04:05.100'
  original: 不確かな夢と孤独を抱えて笑ってた
  english: Smiling while holding onto uncertain dreams and loneliness.
- start: '04:05.800'
  end: '04:10.500'
  original: この痛みも気付けぬまま 出逢えないドミノを見返しにしてしまいような
  english: Without noticing this pain, like turning back an unreachable domino...
- start: '04:11.000'
  end: '04:15.500'
  original: 焦りと不安がにじんで 涙にまれてしまう
  english: Anxiety and unease bleed through, getting swallowed in tears.
- start: '04:16.000'
  end: '04:20.500'
  original: 誰も一人欠けることはない チューインガム剥がして
  english: Peeling off the chewing gum, with not a single person missing...
- start: '04:21.000'
  end: '04:25.500'
  original: 僕らの想いが 大人になっていく
  english: Our feelings grow up.
- start: '04:26.000'
  end: '04:31.200'
  original: 忘れないよ どんな時も
  english: I won't forget, no matter what.
- start: '04:31.500'
  end: '04:36.500'
  original: あの日僕らは間違えていなかったと知る
  english: Knowing that we weren't wrong that day.
- start: '04:37.000'
  end: '04:42.500'
  original: 伸ばしてしまい込んだ一線は 光を探して
  english: The line we reached out and put away is searching for light.
- start: '04:43.000'
  end: '04:47.800'
  original: 君の声を響かせ合って ここにいるって叫んでくれよ
  english: Let your voices echo together, and scream out that you're right here!
- start: '04:49.000'
  end: '04:53.500'
  original: その手を離さないで
  english: Don't let go of that hand.
- start: '04:57.000'
  end: '05:00.117'
  original: 世界に僕だけが取り残されてしまっても
  english: Even if I'm the only one left behind in this world...
