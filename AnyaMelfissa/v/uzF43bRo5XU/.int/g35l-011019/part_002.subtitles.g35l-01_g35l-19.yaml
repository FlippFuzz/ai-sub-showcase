  - start: '03:48.813'
    end: '03:53.613'
    original: 「人の形をした影が見えた」って報告が、うちの従業員からちょくちょく出てるの。
    english: Some of my employees have been complaining about seeing a shadowy figure.
  - start: '03:53.973'
    end: '03:58.733'
    original: 話によれば、最初は夢の中にそれが現れたんだけど、今は起きる時も見えてる——
