  - start: '04:36.933'
    end: '04:37.753'
    original: ちょっと待った！
    english: Wait!
  - start: '04:37.953'
    end: '04:40.593'
    original: それだけ？私の時間を奪っておいてタダで帰るつもり？
    english: That's it? You're not even gonna compensate me for my time?
  - start: '04:40.993'
    end: '04:44.333'
    original: 従業員のためかと思いきや、結局カネかい。
    english: I thought you were doing this to help your employees.
  - start: '04:44.333'
    end: '04:51.353'
    original: タダ働きはしない主義なの。いま持ち合わせがないんだけど、代わりに歌で支払うっていうのはどう？
    english: I'm still a businesswoman. Well, I don't have any cash on me, but I can
      pay you in song.
  - start: '04:51.653'
    end: '04:55.733'
    original: ウソでしょ？歌うの？アンタと？
    english: Seriously? You think I'd want to sing? With you?
  - start: '04:56.093'
    end: '04:59.853'
    original: イナは歌で喜んでくれたけどなー。ただ、イナと歌うのは楽しいけど、
