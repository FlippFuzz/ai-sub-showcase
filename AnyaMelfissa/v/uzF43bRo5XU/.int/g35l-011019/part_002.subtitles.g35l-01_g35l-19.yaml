  - start: '04:18.153'
    end: '04:23.013'
    original: まったくもう、アンタはいつも大げさすぎ…ん？
    english: Hmph. Course. You're just always being overly dramatic... huh?
  - start: '04:23.853'
    end: '04:28.453'
    original: おかしいな。現場の証拠品は警察が全部回収したはずなのに。
    english: Weird. I figured the cops would have already collected all the evidence.
  - start: '04:29.353'
    end: '04:33.253'
    original: この近くに住んでるKFPの従業員で、被害者のことを知ってる者は？
    english: Did any of your employees who live nearby know the victim?
  - start: '04:33.453'
    end: '04:33.853'
    original: いない。
    english: Nope.
  - start: '04:34.253'
    end: '04:36.453'
    original: 分かった。新しい情報が入ったら教えて。
