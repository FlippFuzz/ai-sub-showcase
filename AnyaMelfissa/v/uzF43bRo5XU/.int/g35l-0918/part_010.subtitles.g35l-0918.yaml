    english: |-
      Oh my god, with Arein-san also narration
      story part narration Arein-san ga yatte kuremashita!
  - start: '00:58.974'
    end: '01:06.124'
    original: Arigatou gozaimasu! Miku-chan tomo utatta shi yama mori dakusan deshita
      ne, kotoshi!
    english: |-
      Arigatou gozaimasu! Miku-chan tomo utatta shi
      mori dakusan deshita ne, kotoshi!
  - start: '01:06.844'
    end: '01:14.224'
    original: Oh my god, lots of wild things happening on this year's birthday live!
      How did you guys like it?
    english: |-
      Oh my god, lots of wild things happening
      on this year's birthday live! How did you like it?
  - start: '01:15.004'
    end: '01:18.794'
    original: How did you guys like it? Oh my gosh!
    english: How did you guys like it? Oh my gosh!
  - start: '01:19.014'
    end: '01:28.164'
    original: Yeah, I had a lot of fun! But... I would like to make an announcement
      this year.
    english: |-
      Yeah, I had a lot of fun! But...
      I would like to make an announcement this year.
  - start: '01:28.164'
    end: '01:35.814'
    original: It's the usual! Koko de kokuchi ga arimasu! I have an announcement to
      make! Let me make an announcement!
    english: |-
      It's the usual! Koko de kokuchi ga arimasu!
      I have an announcement to make!
  - start: '01:35.814'
    end: '01:36.564'
    original: はい！
    english: Hai!
  - start: '01:36.564'
    end: '01:37.364'
    original: こちら！
    english: Kochira!
  - start: '01:37.693'
    end: '01:42.593'
    original: Oh my god! What is that? Who is that? Is that me? Yes, it is!
    english: |-
      Oh my god! What is that? Who is that?
      Is that me? Yes, it is!
  - start: '01:42.593'
    end: '01:47.343'
    original: We're releasing some new merchandise to this year!
    english: |-
      We're releasing some new merchandise
      to this year!
  - start: '01:47.883'
    end: '01:51.653'
    original: What do we have? Let's take a look at them, shall we?
    english: |-
      What do we have?
      Let's take a look at them, shall we?
  - start: '01:51.843'
    end: '01:56.543'
    original: Sostte... hitotsu zutsu mite ikimashou! Mazu wa kochira desu!
    english: |-
      Soshite... hitotsu zutsu mite ikimashou!
      Mazu wa kochira desu!
  - start: '02:00.000'
    end: '02:03.223'
    original: Wah! It's a canvas art! Study Time with Anya the Canvas Art!
    english: |-
      Wah! It's a canvas art!
      Study Time with Anya the Canvas Art!
  - start: '02:03.493'
    end: '02:13.913'
    original: Oh my god, this illustration is so cute! It's illustrated by Lunar-sensei!
      Lunar-sensei ni irasuto wo kaite itadakimashita! Kawaii!
    english: |-
      Oh my god, this illustration is so cute!
      It's illustrated by Lunar-sensei! Kawaii!
  - start: '02:14.283'
    end: '02:26.563'
    original: The theme is, you know, literary girl! Oh my god, so smart, so intelligent!
      Bungaku shoujo to iu teima ni natte orimasu!
    english: |-
      The theme is, you know, literary girl!
      Oh my god, so smart, so intelligent!
  - start: '02:27.563'
    end: '02:37.893'
    original: Tsugi wa kochira! Study Time with Anya the Notebook! This is... I think
      this is my first notebook! I've never had a notebook as a merchandise before!
    english: |-
      Tsugi wa kochira! Study Time with Anya!
      The Notebook! I've never had one before!
  - start: '02:38.113'
    end: '02:48.883'
    original: Oh my goodness! Please use this lots for all your notes for anything!
      Iroiro memo shite ne! Orijinaru nouto desu! Demasu!
    english: |-
      Oh my goodness! Please use this lots for
      all your notes! Orijinaru nouto desu!
  - start: '02:49.333'
    end: '02:57.193'
    original: To tsugi wa kochira! Wah! It's a pencil case! How cute is that! Pen
      pouch desu!
    english: |-
      To tsugi wa kochira! Wah!
      It's a pencil case! How cute is that!
  - start: '02:57.343'
    end: '03:09.113'
    original: Pen pouch mo hatsu kana? Nouto mo hatsu rashii, pen pouch mo nanto...
      eh, hatsu desu! Zehi isshoni ne, ano... nouto to tsukatte kudasai!
    english: |-
      Pen pouch mo hatsu kana? Nouto mo hatsu rashii,
      pen pouch mo nanto... eh, hatsu desu!
  - start: '03:09.683'
    end: '03:18.063'
    original: Um, use this along with the note, I think they would go really well
      together, okay?
    english: |-
      Use this along with the note,
      I think they would go really well together!
  - start: '03:19.463'
    end: '03:28.983'
    original: Tsugi wa kochira! Kotoshi mo voice ga arimasu! Soshite kotoshi mo, eh,
      Anya ga daihon wo kakasete itadaite orimasu!
    english: |-
      Tsugi wa kochira! Kotoshi mo voice ga arimasu!
      Anya wrote the script as usual!
  - start: '03:29.213'
    end: '03:40.833'
    original: I wrote the script as usual, as usual for every year! I wrote the script
      for this situational voice, so please get it! Please get it!
    english: |-
      I wrote the script for this situational voice,
      so please get it! Please get it!
  - start: '03:41.053'
    end: '03:47.393'
    original: Oh yeah, the voice will be in Japanese, but there will be scripts in
      Bahasa Indonesia, English, and Japanese!
    english: |-
      The voice will be in Japanese,
      with scripts in ID, EN, and JP!
  - start: '03:47.783'
    end: '04:02.163'
    original: Chinamini boisu jitai wa nihongo ni narimasu kedo... etto, daihon mo
      tsuite, tsuite kimasu! Indonesiago to eigo to nihongo no daihon ga arimasu!
      Zehi kiite kudasai!
    english: |-
      Chinamini boisu jitai wa nihongo desu kedo,
      daihon mo tsuite kimasu! Zehi kiite kudasai!
  - start: '04:02.663'
    end: '04:06.113'
    original: Soshite furusetto kounyuu tokuten wa kochira!
    english: Soshite furusetto kounyuu tokuten wa kochira!
  - start: '04:06.313'
    end: '04:14.633'
    original: Oh my god! Limited edition has... what is that? A hand-signed autograph!
      Oh my god, it's the first for me!
    english: |-
      Oh my god! Limited edition has...
      A hand-signed autograph! It's a first for me!
  - start: '04:15.543'
    end: '04:23.773'
    original: Anya's first ever hand-signed autograph for limited edition! Please
      get them!
    english: |-
      Anya's first ever hand-signed autograph
      for limited edition! Please get them!
  - start: '04:23.943'
    end: '04:29.353'
    original: Nanto kotoshi wa sain-iri desu! Kotoshi wa sain-iri desu! Nanto nanto
      nanto...
    english: |-
      Nanto kotoshi wa sain-iri desu!
      Kotoshi wa sain-iri desu! Nanto nanto...
  - start: '04:29.853'
    end: '04:40.403'
    original: Hatsu... hatsu desu ne, Anya ga mizukara sain wo shite ne... ne, hatsu
      nanode zehi minasan kono kikai de getto shite kudasai!
    english: |-
      Hatsu desu ne! Please get it in this opportunity!
      (First time Anya signs herself!)
  - start: '04:41.093'
    end: '04:54.673'
    original: Yeah, please get the limited edition! And for the standard edition,
      it includes a foil-stamped replica autograph, so don't worry if you miss out
      on the limited edition! Yay!
    english: |-
      And for the standard edition, it includes a foil
      replica autograph, so don't worry! Yay!
  - start: '04:55.333'
    end: '05:00.000'
    original: To iu koto de guchtsu shoukai wa ijou desu! That's all for the merch!
    english: |-
      To iu koto de, guuttsu shoukai wa ijou desu!
      That's all for the merch!
