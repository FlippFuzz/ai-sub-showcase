    tracks, dynamic stage performances, and special guest appearances by numerous
    Hololive talents from ID, EN, and JP branches. Highlights include energetic group
    numbers, humorous MC segments involving guest interactions and magical transformations,
    announcements for official 2025 birthday merchandise, and the live premiere of
    Anya's new original song 'CHRONIC'.
