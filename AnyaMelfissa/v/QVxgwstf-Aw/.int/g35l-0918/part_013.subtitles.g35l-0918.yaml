    *   00:02.424 - 00:03.504 | og: メガネかけ歩き天真爛漫 | en: Walking with glasses, naive and innocent,
    *   00:03.504 - 00:04.744 | og: 本当の自分わからない？ | en: don't you know your true self?
    *   00:04.744 - 00:06.104 | og: マスクを着けて隠している | en: Hiding it by wearing a mask,
    *   00:06.104 - 00:07.614 | og: 泣きそうな顔全部隠している | en: hiding every tearful face completely.
    *   00:07.614 - 00:09.154 | og: 夜が来るたびに思い出している | en: Remembering every time night comes,
    *   00:09.154 - 00:10.654 | og: 空かける秀麗で隠してく | en: hiding it with a soaring beauty.
    *   00:10.654 - 00:12.354 | og: もううんざりかい？ | en: Are you already fed up?
    *   00:12.354 - 00:15.354 | og: アンリアル絡まって叫びおこうぜ | en: Entangled in unreality, let's shout it out,
    *   00:15.354 - 00:17.354 | og: 隠してた本当の自分を | en: our true selves that we've been hiding!
    *   00:17.354 - 00:18.954 | og: ある観客になんないで | en: Don't just become a mere spectator,
    *   00:18.954 - 00:20.354 | og: 甘い嘘も本当にしよう | en: let's make sweet lies true as well.
    *   00:20.354 - 00:21.554 | og: (本当のヴェール) 可愛く笑って | en: (True veil) Smiling cutely,
    *   00:21.554 - 00:22.954 | og: (嘘つきヴェール) 楽しく笑って | en: (Liar's veil) Smiling happily,
    *   00:22.954 - 00:26.554 | og: (本当のヴェール) きみが笑っている アンリアルな今日を | en: (True veil) You are smiling, through this unreal day,
    *   00:26.554 - 00:29.554 | og: 戦うんだ | en: fighting on!
    *   00:29.554 - 00:31.954 | og: コードの上を伝っていくんだ | en: Tracing along the code,
    *   00:31.954 - 00:33.954 | og: 一つの眉も揺らさずに | en: without shaking even a single eyebrow.
