    english: Well then...
  - start: '00:15.500'
    end: '00:20.500'
    original: 超常的な力が殺人事件に関わっている？
    english: A supernatural occurrence, happening in a murder case?
  - start: '00:20.500'
    end: '00:24.500'
    original: いやいやそんな、ねえ？
    english: That's just unbelievable, right?
  - start: '00:24.500'
    end: '00:31.000'
    original: にわかには信じがたいが、今の手がかりから推理するとそういうことになる。
    english: She had a hard time believing it, but all the hints said otherwise.
  - start: '00:31.000'
    end: '00:37.000'
    original: まだパズルのピースがピタリとはまらないこの不思議で奇妙な事件。
    english: Still, there were pieces of this puzzle that refused to fit, this strange
      and bizarre case.
  - start: '00:37.000'
    end: '00:43.000'
    original: 探偵は信頼できる情報源に頼ることにした。
    english: So the detective turned to a reliable source for help.
  - start: '00:43.200'
    end: '00:45.300'
    original: あっ、来てくれたー
    english: Ah, you came-
  - start: '00:45.300'
    end: '00:49.000'
    original: '...なんで君達まで？'
    english: '...And why are you guys also here?'
  - start: '00:49.500'
    end: '00:53.000'
    original: ゼータが来るって聞いたから、アーニャにちょっかいかけてやろうと思って！
    english: We heard Zeta was coming over, and decided to bug ya!
  - start: '00:53.000'
    end: '00:54.800'
    original: はいはい。
    english: Yes, yes, I see.
  - start: '00:54.800'
    end: '00:56.800'
    original: もー！つれないなぁ。
    english: Aww, come on!
  - start: '00:56.800'
    end: '00:59.000'
    original: それはそうと...ゼータ、何か掴めた？
    english: Anyway, Zeta, did you find anything?
  - start: '00:59.000'
    end: '01:03.500'
    original: もちろん！優秀なシークレットエージェントなので！
    english: Of course! I'm not an elite secret agent for nothing!
  - start: '01:03.500'
    end: '01:11.000'
    original: イナの描いた似顔絵と大空警察の資料から、被害者の身元を特定できたよ。
    english: Between the portrait from Ina and the files from the Oozora Police, I've
      been able to positively ID the murder victim.
  - start: '01:11.000'
    end: '01:14.000'
    original: でも...ちょっと変なんだよね。
    english: But... what I found is weird.
  - start: '01:14.000'
    end: '01:15.000'
    original: 変？
    english: How so?
  - start: '01:15.000'
    end: '01:20.000'
    original: 被害者の履歴を調べたところ、その人物は何百年も前の時代の人だったんだ。
    english: Well, when I investigated their history, I found that they actually lived
      centuries ago.
  - start: '01:20.000'
    end: '01:25.800'
    original: でもその人物が、数日前に死体で発見された...話がつながらないよ。
    english: So how they were also somehow murdered just days ago... it doesn't make
      any sense.
  - start: '01:25.800'
    end: '01:29.800'
    original: アーニャからもらった情報に間違いがあったとか？
    english: Did you perhaps confuse your information? Or...
  - start: '01:29.800'
    end: '01:34.500'
    original: なるほど、やっとつながってきた。
    english: Actually, things are finally starting to make sense.
  - start: '01:34.500'
    end: '01:37.500'
    original: 一人の被害者が、過去と現在で二度死んだことになる。
    english: A victim caught between two times.
  - start: '01:37.500'
    end: '01:40.500'
    original: 誰かが時間と次元をねじ曲げて、そんな状況を作り出した。
    english: One who died in two different ways.
  - start: '01:40.500'
    end: '01:46.500'
    original: なかなかできることじゃない...
    english: Not many exist who can cause time and dimensions to warp in a way to
      make that possible...
  - start: '01:46.500'
    end: '01:49.000'
    original: でも君なら可能でしょ。
    english: '...but you''re one of them.'
  - start: '01:49.000'
    end: '01:52.500'
    original: さすがは名探偵。
    english: Well done, detective.
  - start: '01:52.500'
    end: '01:57.000'
    original: ちょっと時間がかかりすぎかな。危うくネタばらしするとこだった。
    english: Took you long enough. I was this close to telling ya the whole thing.
  - start: '01:57.000'
    end: '02:00.000'
    original: レイネが書いてくれた、この匿名の手紙もいいヒントになったよ。
    english: You helped enough with this "anonymous" letter about the murder.
  - start: '02:00.000'
    end: '02:02.500'
    original: えっ、バレてた？
    english: O-oh, you figured out that was me?
  - start: '02:02.500'
    end: '02:04.500'
    original: 書き方のクセで分かる。
    english: I recognized your writing style.
  - start: '02:04.500'
    end: '02:09.500'
    original: 待って、どういうこと？ムーナと被害者にどんな関係があるの？
    english: W-wait, I don't get it. What does Moona have to do with the victim?
  - start: '02:09.500'
    end: '02:14.800'
    original: ムーナは、別の時空で殺された遺体を我々がいるこの時空へ移動させたんだ。
    english: She took a murder victim from another space and time, and moved them
      into our dimension.
  - start: '02:14.800'
    end: '02:18.800'
    original: ゼータが特定した人物は、この世界線における同じ人物ってこと。
    english: The one you ID'ed was this universe's version of the same person.
  - start: '02:18.800'
    end: '02:23.800'
    original: なるほど...？でもどうしてそんなことを？
    english: Uh... okay. But then why?
  - start: '02:23.800'
    end: '02:30.000'
    original: 理由も気になるけど、それより確かめたいことがある。
    english: That is an important question, but there's one I want answered even more.
  - start: '02:30.000'
    end: '02:33.800'
    original: ムーナが...私にあの夢を見せたの？
    english: Are you... responsible for my dreams?
  - start: '02:33.800'
    end: '02:35.200'
    original: それは違う。
    english: No.
  - start: '02:35.200'
    end: '02:41.000'
    original: あなたがあの夢を見ていることを知って、私はあの夢が生まれる根源を調べてみた。
    english: After I learned about your dreams, I used my powers to search for the
      source of them.
  - start: '02:41.000'
    end: '02:45.000'
    original: そして見つけたのが、次元の向こう側から声を届けようとする魂。
    english: I found a spirit reaching out from time and dimensions.
  - start: '02:45.000'
    end: '02:49.000'
    original: 私はその魂のために橋渡しをしてあげただけ...
    english: All I've done is try to help them by making the bridge a little easier...
  - start: '02:49.000'
    end: '02:52.500'
    original: 私も手伝ったよ！というか、私のアイデア。
    english: With my help! I mean, it was my idea...
  - start: '02:52.500'
    end: '02:55.000'
    original: そう。
    english: True.
  - start: '02:55.000'
    end: '03:00.500'
    original: ただやり方が悪かったのか、アーニャの見たものが他の人にも見えちゃったみたい。
    english: Though doing it this way has caused some of what you've been experiencing
      to leak to other people.
  - start: '03:00.500'
    end: '03:04.500'
    original: 巻き込んだKFPの従業員には後でお詫びしなきゃ...
    english: We're going to have to apologize to the KFP workers...
  - start: '03:04.500'
    end: '03:08.500'
    original: でもその魂が、どうして私に声を届けようとしてるの？
    english: But why is the spirit reaching out to me of all people?
  - start: '03:08.500'
    end: '03:13.500'
    original: それは私に訊くことじゃないね。私が話すべきことじゃない。
    english: It wouldn't be right for me to answer those questions. It's not my story
      to tell.
  - start: '03:13.500'
    end: '03:17.800'
    original: あの魂に心を開いてあげて。それだけでいい。
    english: Open yourself up to the spirits, and they'll do the rest.
  - start: '03:17.800'
    end: '03:20.500'
    original: 心をもっと開く方法なら知ってるよ！
    english: I got a way to make yourself more open to spirits!
  - start: '03:20.500'
    end: '03:22.800'
    original: それって歌？
    english: Is it through song?
  - start: '03:22.800'
    end: '03:24.500'
    original: え？なんで分かったの？
    english: Huh? How'd you know?
  - start: '03:24.500'
    end: '03:27.500'
    original: まあ、勘かな...
    english: Lucky guess...
  - start: '03:55.000'
    end: '03:59.500'
    original: 思い返していた 思い出の中で泣いていた
    english: I was looking back, crying inside my memories.
  - start: '03:59.500'
    end: '04:05.000'
    original: 不確かな夢と語録を掛け合って笑った
    english: We laughed, multiplying our uncertain dreams and quotes.
  - start: '04:05.000'
    end: '04:10.500'
    original: この旅路も奇数も絶えないと 瞳を見返してスマイル仕様な
    english: Hoping this journey and these odd moments won't end, I look back into
      your eyes and put on a smile.
  - start: '04:10.500'
    end: '04:16.000'
    original: 焦りと不安が滲んで涙に呑まれてしまう
    english: Impatience and anxiety seep in, and I end up swallowed by tears.
  - start: '04:16.000'
    end: '04:21.000'
    original: 誰一人 欠けることはないチームはぐなっつ
    english: Not a single person will be missing, Team Hagnuts.
  - start: '04:21.000'
    end: '04:26.500'
    original: 僕らの思いが音になって繋ぐ
    english: Our feelings turn into sound and connect us.
  - start: '04:26.500'
    end: '04:32.500'
    original: こだまして 忘れないよ 隠した秘密を
    english: Echoing, I won't forget the secrets we hid.
  - start: '04:32.500'
    end: '04:36.500'
    original: あの日僕らは間違っていなかったんだと知る
    english: Knowing that on that day, we weren't wrong.
  - start: '04:36.500'
    end: '04:42.500'
    original: 閉ざして しまい込んだ 一線の光探して
    english: Searching for a beam of light shut away and locked inside.
  - start: '04:42.500'
    end: '04:45.500'
    original: 君の声を聞かせて
    english: Let me hear your voice.
  - start: '04:45.500'
    end: '04:48.800'
    original: ここにいるって叫んでくれよ
    english: Shout out that you are here!
  - start: '04:48.800'
    end: '04:54.000'
    original: その手を離さないで
    english: Don't let go of that hand.
  - start: '04:54.000'
    end: '05:00.000'
    original: 世界に僕だけ取り残されてしまう
    english: Or I'll end up left behind all alone in this world.
