  original: 「奇跡を運ぶ風のね 時を閉じ込めて」
  english: Trapping time in the wind that carries miracles.
- start: '01:07.750'
  end: '01:14.250'
  original: 「サイリング スタートすれば 夢に眠るまぼろしが」
  english: When the sailing starts, the illusions sleeping in dreams...
- start: '01:14.250'
  end: '01:21.000'
  original: 「手のひらにふりそそぐ 新たな世界へ」
  english: Pour down onto my palms, toward a brand new world.
- start: '01:21.000'
  end: '01:27.800'
  original: I believe my sensation
  english: I believe my sensation
- start: '01:27.800'
  end: '01:34.900'
  original: 「果てしない未知の向こうで まぶたの裏に映る」
  english: Beyond the endless unknown, reflected behind my eyelids...
- start: '01:34.900'
  end: '01:42.200'
  original: 「ひと雫の光 ときめきを感じて」
  english: Feeling a single drop of light and excitement.
- start: '02:00.100'
  end: '02:06.100'
  original: 「あなたが触れるすべて 幸せであるように」
  english: May everything you touch be filled with happiness.
- start: '02:06.100'
  end: '02:12.850'
  original: 「今生きる喜びを 忘れてしまわないよう」
  english: So that we never forget the joy of living right now.
- start: '02:12.850'
  end: '02:19.150'
  original: 「月の光 隠す雲は揺らぎ」
  english: The clouds hiding the moonlight sway gently.
- start: '02:19.150'
  end: '02:26.100'
  original: 「自由の翼は今も 大空をかける」
