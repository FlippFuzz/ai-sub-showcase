global_summary:
  overall_summary: This video is the 2026 Birthday 3D Live stream titled '#ラプさま大解放2026'
    hosted by Laplus Darknesss from Hololive's secret society holoX. The broadcast
    combines humorous narrative skits with high-energy musical performances featuring
    various Hololive guests—including Shirogane Noel, Kazama Iroha, and Hakui Koyori—as
    well as a surprise special guest appearance by Himesaki Rinami from Gakuen Idolmaster.
    Alongside merchandise showcases, Laplus announces her brand-new original song
    'Onesama Love Call' and her very first solo artist album, delivering an entertaining
    and memorable birthday celebration.
