    **A La+ Darknesss Deep Dive: My Thoughts**

    Alright, let's get this straight in my mind. The first step is to synchronize the subtitles for this video segment with the Japanese audio, La+ Darknesss and AZKi. I need to nail the timing down perfectly.

    Okay, so the stream starts, I begin by announcing my new song, "Onee-sama ♡ Love Code"! The important part is that the heart comes *after* "Onee-sama." It was written for me by P-Maru-sama and Mano. They said it was fun to write lately, because of how I've been. They told me this song would be "unbelievable!"

    Also during recording, it will be released, even during recording I was told to make it creepier! And to sing with more of my inner feelings for my Onee-sama. That's a first for me, but it worked. The music video is premiering on my channel directly after this. The song will be released tomorrow, the 26th!

    And now for the big announcement, as clickbaity as it may be. I'm finally releasing my first solo album, yay! I'm genuinely moved, as I used to only release one original song a year, and now I'm releasing them like crazy! There are two versions, one will be the expensive one and the other will be the cheap one. The expensive one is for "big friends". And the cheap one is priced as to say: "Mom, please buy this for me!".

    Honestly, it might be the cheapest Hololive album ever! Pre-orders start on the Hololive official shop after this stream, so everyone needs to pre-order. Check the website for all the details. Of course, the new song is also on the album! The new song audition is over. I just need to wait for the results. Bye!

    Good job! They said there would be a reward if I won the audition. I wonder what it will be. Lessons were a bit rushed but I'm absolutely exhausted!

    Oh, and then the producer comes by to tell me that I won and that we are going to a big collaboration venue. Where are we going?

    [Transition to AZKi's concert stage]

    AZKi is here welcoming the audience, so I must be here for something special. It's a short time, but we will make the most of it together. Now to the special guest announcement: Hololive's La+ Darknesss-san!


