    IN: GAME START #ROCKINBiboo'', broadcasted on her hololive English channel. The
    concert features a rich video game-inspired narrative where Bijou gets sucked
    into a virtual arcade world and must battle various ''Game Masters'' and guests
    across stages through energetic musical performances, culminating in a showdown
    with her shadow self and the premiere of her new original song ''ROCK IN!''.'
