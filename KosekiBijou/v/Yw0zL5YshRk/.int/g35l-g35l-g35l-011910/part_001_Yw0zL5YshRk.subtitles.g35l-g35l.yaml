global_summary:
  overall_summary: 'This video is the 3D showcase debut of Koseki Bijou from hololive
    English -Advent-, titled ''【3D SHOWCASE】Kira Kira...KOSEKI! #Biboo3D''. The broadcast
    begins with a comedic Moai statue gag before Bijou transforms into her full 3D
    form in a grand cathedral setting. Throughout the showcase, she performs original
    and cover songs, explores magical environments, engages in an RPG-style dungeon
    adventure and boss battle featuring guest Kaela Kovalskia, catches ''Pebblemon''
    in a garden, and performs group songs with Hololive guests Mori Calliope, Hakos
    Baelz, and Tokoyami Towa. The showcase concludes with merchandise announcements,
    a heartfelt letter to her fans (Pebbles), and a final musical performance.'
