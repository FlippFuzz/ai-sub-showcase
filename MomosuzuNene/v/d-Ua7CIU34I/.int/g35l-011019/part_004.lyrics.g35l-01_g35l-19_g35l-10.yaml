global_summary:
  overall_summary: This YouTube video is the official 2025 birthday celebration live
    stream of hololive 5th generation vtuber Momosuzu Nene, titled 'Nene Rhythm Birthday
    Live!'. Styled as an interactive rhythm game where Nene selects songs, costumes,
    and stage segments, the stream features vibrant solo performances, new 3D costume
    debuts (including Colorize and Fairy variants), and special guest appearances
    by fellow hololive members including Usada Pekora, Sakura Miko, Natsuiro Matsuri,
    Akai Haato, Yukihana Lamy, and Shishiro Botan. The live highlights Nene's energetic
    idol persona, original songs, merchandise announcements, and a joyous finale.
