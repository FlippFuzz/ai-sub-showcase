      display it somewhere as a keychain or do things like that.
  - start: '03:00.000'
    end: '03:14.000'
    original: スポッと取れてね、あの、磁石になってるんだっけな？これたしか、ピタッとどっかにくっつけることができる...冷蔵庫とかね！だから色んなところにねっこと一緒にねねを旅に連れて行ってください！可愛い！
    english: It pops right off, and, um, it has a magnet in it, right? I think it
      can snap and stick somewhere... like a refrigerator! So please take Nene along
      on trips to various places with Nekko! So cute!
  - start: '03:18.000'
    end: '03:25.000'
    original: ボイス！ねねのボイスも出ます！どんなボイスなんだい？「きみと二人で誕生日パーティー！」
    english: Voice! Nene's voice pack is also coming out! What kind of voice is it?
      "A Birthday Party Just for Two with You!"
  - start: '03:26.000'
    end: '03:29.500'
    original: おー！二人で迎えたんですね、マジで。
    english: Oh! We're welcoming it together, seriously.
  - start: '03:31.500'
    end: '03:45.000'
    original: こんなね、あ、すびたびにね、紹介するもんじゃないんだけど、ねねとねっ子ふたりきりのね、ラブラブいちゃいちゃバースデーボイスが出まーす！まあ誕生日だしな、紹介してください！
    english: I mean, it's not something you introduce every single time, but a super
      lovey-dovey, love-infatuated birthday voice pack just for Nene and Nekko is
      coming out! Well, it's a birthday, so please check it out!
  - start: '03:49.500'
    end: '03:59.000'
    original: フルセットがこちら！ドン！キャンバスアート、ねっ子証明書、タンブラー、カレンダー、ボイス、そしてチェキ風ブロマイドカード特製ボイス！
    english: The full set is right here! Bam! Canvas art, Nekko Certificate, tumbler,
      calendar, voice pack, and the Polaroid-style bromide card special voice!
  - start: '04:00.000'
    end: '04:05.500'
    original: ぴったり入ります、ねっ子のカレンダーの中とかもね！入れなきゃね、これ。
    english: It fits perfectly inside the Nekko calendar and stuff! We gotta put it
      in, right?
  - start: '04:06.000'
    end: '04:13.500'
    original: そして今回は、えっと、ちょっと申し訳ないのですが、数量限定バージョンがあります！
    english: And this time, um, I'm terribly sorry, but there is a quantity-limited
      version!
  - start: '04:14.000'
    end: '04:24.000'
    original: 数量限定バージョンを買っていただくと、ねねの直筆サイン＋メッセージ入りのブロマイド風チェキカードがきます！
    english: If you purchase the quantity-limited version, you'll get a Polaroid-style
      bromide card featuring Nene's handwritten signature and a message!
  - start: '04:25.000'
    end: '04:30.500'
    original: そしてフルセットには、箱押しサイン、複製サイン付きのもの付きます！
    english: And the full set comes with items featuring foil-stamped signatures and
      duplicated signatures!
  - start: '04:31.000'
    end: '04:44.000'
    original: そしてフルセットをご購入してくれたみなさんには、こちら！ねねの大本無しフリートークボイス！なんだこれ！聞いたことない！聞いたことない今まで！大本無し？
    english: And to everyone who purchases the full set, here is this! Nene's unscripted
      free-talk voice! What is this?! I've never heard of this before! Unscripted?
  - start: '04:45.000'
    end: '04:54.000'
    original: そのねねが、練習とかね、大詰めになってる時にみんなへのね、頑張りたいう思いを
