    original: そして、真中のこの鏡みたいになっているところが、ブロマイド...あ、違う、えっと、チェキ風のブロマイドのあれがぴったり中に入るようになっておりまーす！お気に入りのはるめんとかなねねのブロマイドのカードを入れてください！入れてください！入れてください！
    english: And the part in the middle that looks like a mirror is made so that a
      Polaroid-style bromide card fits right inside! Please insert your favorite Holomen's
      or Nene's bromide card! Please insert it! Please insert it!
  - start: '02:45.000'
    end: '02:58.000'
    original: そして、上のねっ子の部分なんだけど、これな、なんと取り外しができます！おお！ぬいぐるみの一部！そう、ねっ子のぬいぐるみとして使えるので、みんなどっかにキーホルダーとして飾ったりとか、そういうこともできちゃいます！
    english: And as for the Nekko part at the top, guess what—it's detachable! Oh!
