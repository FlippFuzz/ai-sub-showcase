  thoughts: |+
    **A VTuber Adventure: From Beetle Balloons to Mushiking Mayhem**

    Alright, let's break this down. First, I'm watching this video and right away, it's hilarious! I'm seeing Momosuzu Nene, Natsuiro Matsuri, and Kazama Iroha on this beetle-shaped hot air balloon. The initial chaos has us screaming and laughing, worried we're going to fall. The conversation turns to the balloon's "mouth" - they're calling it cod roe lips, it's cute, human-like. Then, someone proposes a kiss... which gets a bit silly. There's a quick change of clothes - only Nene is changing because she has to do something else. The focus shifts and the balloon starts descending, and Nene has to go off to the forest to play Mushiking!

    Then, there's Nene, running towards the Mushiking arcade cabinet. I'm so excited! SEGA was kind enough to let us borrow this thing. We're going to recreate the feeling of the arcade days, so I'm playing it live! I'm so pumped up! I've brought Nene's card - and there's a story mode that's different from the anime. Okay, here we go... in Mushiking you have beetle cards and skill cards. You pick skills and battle with rock-paper-scissors, the winner wins. It's not as simple as it looks; the skills have all sorts of interesting connections. So, I choose my beetle, and I remember picking the first cabinet. The sound! It's super nostalgic! "Raise a newborn beetle!" And oh my god, I'm drooling with excitement! I need to win and pick the correct skill.

    The opponent's super move is scissors so I need rock. I choose a new Elephas Elephant Beetle, but it's newborn and its wings are not colored yet. This is Nene's strongest deck. Battle! Let's go!


