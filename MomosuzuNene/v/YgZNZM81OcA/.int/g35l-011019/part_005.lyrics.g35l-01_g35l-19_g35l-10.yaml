  original: いつも 走ってた Oh friends
  english: Always running, oh friends...
- start: '00:57.971'
  end: '01:06.651'
  original: あの瞳が 愛しい
  english: Those eyes are so dear.
- start: '01:48.736'
  end: '01:50.846'
  original: ちゅうちゅうえい！
  english: Chu-Chu-Yeah!
- start: '01:51.016'
  end: '01:55.236'
  original: '[Title: 青空のラプソディ]'
  english: '[Title: Aozora no Rhapsody]'
- start: '01:51.526'
  end: '01:53.056'
  original: Give me!
  english: Give me!
- start: '01:53.056'
  end: '01:56.126'
  original: ちゅうちゅうえい！
  english: Chu-Chu-Yeah!
- start: '01:56.126'
  end: '01:59.036'
  original: 見つめて
  english: Gaze at me!
- start: '01:59.036'
  end: '02:02.136'
  original: ちゅうちゅうえい！
  english: Chu-Chu-Yeah!
- start: '02:05.116'
  end: '02:11.836'
  original: あんなことだったっけな 勘違い 自分勝手なことにからから立てて行く
  english: Was it really like that? Such a misunderstanding, making a fuss over selfish
    things...
- start: '02:12.186'
  end: '02:18.916'
  original: どうして続々 逃げ出しているでしょ? だからなんだか 気まぐれ戻りになり そんな気分になっちゃって
  english: Why is everyone running away one after another? That's why I somehow ended
    up in a fickle mood, feeling just like that!
- start: '02:21.146'
  end: '02:27.766'
  original: 始まりはそんな風で つまり笑えなくないよね でも今扉開けてほら 声が聞こえるよ さあ行こう
  english: It started out like that, meaning we can't help but smile, right? But now
    open the door, look, you can hear voices, so let's go!
- start: '02:32.116'
  end: '02:38.256'
  original: どこへでも 僕は君のつばさに流れる勇気があるよ
  english: Wherever you go, there is courage flowing on your wings!
- start: '02:39.116'
  end: '02:44.756'
  original: その迷いも怖くない その魔法があるから
  english: That hesitation isn't scary either, because we have that magic.
- start: '02:45.116'
  end: '02:51.646'
  original: どんな知らんも怖くない その魔法があるから 初めて出会う世界に 温もりを送ろう
  english: None of the unknowns are scary, because we have that magic. Let's send
    warmth to this world we meet for the first time.
- start: '02:52.486'
  end: '02:59.726'
  original: こんなこの瞬間巡り出るよ 自分なりのコミュニケション でも別に構わない 明日からの平穏なら
  english: Encounters in this very moment... communication in our own way, but it
    doesn't really matter if peace starts from tomorrow onwards.
- start: '03:03.026'
  end: '03:07.016'
  original: 小さな秘密のこと
  english: A little secret thing...
- start: '03:07.016'
  end: '03:10.036'
  original: でも別に構わない 明日からの平穏なら
  english: But it doesn't really matter if peace starts from tomorrow onwards.
- start: '03:11.116'
  end: '03:17.026'
  original: ちゅうちゅうえい！ Give me! ちゅうちゅうえい！ 見つめて
  english: Chu-Chu-Yeah! Give me! Chu-Chu-Yeah! Look at me!
- start: '03:19.466'
  end: '03:26.546'
  original: どうしてまた 素直になれなくて 自分なりのことて ジュルジュルジュル衣服 ギアはそのまま スピード上げていこう
  english: Why can't I be honest again? Doing things my own way, clothes going juru-juru,
    let's keep the gear as is and boost our speed!
- start: '03:30.466'
  end: '03:36.526'
  original: だけどなんだか どこから戻りになり いつか思い出ちゃって ひとり出てもやんない
  english: But somehow, returning from somewhere, remembering it someday, even going
    out alone won't work...
- start: '03:36.656'
  end: '03:42.546'
  original: 独りでいててもやんない 誰にも頼らなくてもいい でも扉の向こう騒がしい 声が聴きたいよ 今行こう
  english: Staying alone doesn't work either. It's fine not to rely on anyone, but
    I want to hear that bustling voice beyond the door, let's go now!
- start: '03:51.016'
  end: '03:59.226'
  original: どこへでも 僕は君を背中に乗せて空を舞うよ
  english: Wherever you go, I'll carry you on my back and soar through the sky!
- start: '04:00.616'
  end: '04:07.126'
  original: たとえ心が離れても このときは笑ってね 守りたいこの世界に 青空のラプソディ
  english: Even if our hearts drift apart, please smile at this moment. A rhapsody
    of the blue sky dedicated to this world we want to protect.
- start: '04:14.616'
  end: '04:21.036'
  original: 手を繋いでよ でも別に構わない 明日からは平和な
  english: Hold my hand. But it doesn't matter, peace starts tomorrow...
- start: '04:24.016'
  end: '04:30.126'
  original: ほんの小さな傷を 太陽にさらして
  english: Exposing even the tiniest wounds to the sun...
- start: '04:31.016'
  end: '04:40.026'
  original: 分け合ったよ キミと 痛みは温かさの中に溶けてく
  english: We shared it, you and I, and the pain melts into the warmth.
- start: '04:41.016'
  end: '04:46.026'
  original: ちゅうちゅうえい！ 息のビート弾く僕ら
  english: Chu-Chu-Yeah! We bounce to the beat of our breath!
- start: '04:46.026'
  end: '04:54.026'
  original: 手を叩いて ナギナリズムではしゃぐ二人 飛び跳ね
  english: Clapping our hands, the two of us frolicking to nagi-rhythm, jumping up
    and down!
