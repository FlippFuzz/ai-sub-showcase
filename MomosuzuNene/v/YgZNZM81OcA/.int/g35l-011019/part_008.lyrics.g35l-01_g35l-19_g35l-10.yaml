    The third block needed the most work. *Draft*: "Surely it's safe, the usual crushing..." The Japanese had a few errors here. The official lyrics should have *安定だね (そうだね！) / お決まりのツーショット* while the draft had *安心だね お決まりの潰しを*. The 'stable' and 'two-shot' (likely a picture) are much closer to the lyrics in that order; crushing seems completely off, so I will have to correct and separate the phrases. The Japanese will be separated to match the lyrics better and the English polished to mirror the Kanji. *Revised*: "Surely it's stable, the usual two-shot..."

    Fourth block: The Japanese draft is almost correct! *Draft*: "A space just for the two of us, three cups okay?" It appears to have missed a beat from the actual lyrics. *Revised*: "A space just for the two of us, standby okay?"

    Fifth block: This one is straightforward. *Draft*: "Soaring high, having a debriefing later."  The Japanese is correct.  I only have to polish the English. *Revised*: "Getting carried away, then a debriefing later."

