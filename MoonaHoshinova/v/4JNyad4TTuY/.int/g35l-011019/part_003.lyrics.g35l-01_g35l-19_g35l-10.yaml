global_summary:
  overall_summary: This YouTube video features 'Eclipse Breaker', the 3D birthday
    live stream concert of Moona Hoshinova from hololive Indonesia, held on February
    15, 2025. The concert features a rock and band-inspired musical setlist with dazzling
    3D stage effects, special guest performances by Nerissa Ravencroft and Takanashi
    Kiara, and a group performance with her AREA15 gen-mates (Ayunda Risu, Airani
    Iofifteen, Kureiji Ollie, and Pavolia Reine). Alongside electrifying performances
    of original hits like 'High Tide', 'Who's Toxic? It's You!', 'Deja Vu', 'Perisai
    Jitu', 'Taut Hati', '100%', 'Maze Town', 'Multiverse', and 'Nightmare', Moona
    announces her upcoming 1st full music album titled 'Pandora' and showcases exclusive
    birthday merchandise.
