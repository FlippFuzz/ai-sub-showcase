    english: This is the "Wipe-Wipe Bath Towel"!
  - start: '04:12.000'
    end: '04:30.500'
    original: こちらはね、かんざきひろパパかきおろしのふきふきバスタオルなのだな！ルナイトとコンパパとシバノドックといしょにね、お風呂に入っている可愛いイラストなのだな！ちょっとセクシーだけど、可愛くパパにかいてもらったのだな！
