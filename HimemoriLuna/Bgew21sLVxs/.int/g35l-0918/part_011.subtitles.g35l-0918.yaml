    english: I hope you all had a fun time with Horakemon and Karaoke too!
  - start: '03:47.500'
    end: '03:53.000'
    original: さいきんホラケモンとも大親友になったと思うならね、みんな！
    english: I think Horakemon and I became really good friends, what do you think?
  - start: '03:54.000'
    end: '03:59.500'
    original: ということで、ここでグッズ紹介なのだな！こちらです！
    english: And with that, it's time to introduce our merchandise right here!
