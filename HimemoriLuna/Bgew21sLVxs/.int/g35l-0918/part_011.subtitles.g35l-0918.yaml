    english: Tada! The "Luxury Club Luna Glass"!
  - start: '04:39.500'
    end: '04:55.000'
    original: ルナたんといえば、やっぱり大富豪ということで、可愛い丸いフォルムを大人にしたお酒のグラスをグッズにしたのだな！みんなこのね、グラスを使って一緒にルナたんととお酒飲むのだな！
    english: When you think of Luna-tan, you think of being a rich adult! So we made
