    member Himemori Luna celebrating her birthday with a nostalgic rock anime song
    ranking concert titled 'Count Night TV Evolution !!'. Hosted by honorary Lu-Knights
    Fuburu-Knight (Shirakami Fubuki) and Poru-Knight (Omaru Polka), Luna performs
    a top-10 countdown medley of classic anime rock theme songs ranging from the late
    90s to 2000s, followed by the debut performance of her new original song 'Puri-Puri
    Princess' and an encore cover. The broadcast also features birthday merchandise
    announcements and celebratory messages from her fanbase.
