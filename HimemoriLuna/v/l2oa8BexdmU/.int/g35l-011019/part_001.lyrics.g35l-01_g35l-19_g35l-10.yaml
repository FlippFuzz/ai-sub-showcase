  original: Wow Wow
  english: Wow Wow
- start: '01:07.090'
  end: '01:13.290'
  original: そばかすの数を かぞえてみる
  english: I try counting my freckles.
- start: '01:13.870'
  end: '01:18.490'
  original: 汚れたぬいぐるみだいて
  english: Hugging a stained stuffed animal...
- start: '01:19.010'
  end: '01:24.450'
  original: 胸をさす トゲは 消えないけど
  english: The thorn piercing my chest won't go away, but...
- start: '01:25.130'
  end: '01:30.290'
  original: カエルちゃんも ウサギちゃんも
  english: Both the little frog and the little rabbit...
- start: '01:31.090'
  end: '01:36.430'
  original: 笑ってくれるの
  english: Will laugh along with me.
- start: '01:39.990'
  end: '01:45.310'
  original: 想い出は いつも キレイだけど
  english: Memories are always beautiful, but...
- start: '01:46.010'
  end: '01:50.450'
  original: それだけじゃ おなかが すくの
  english: Just that isn't enough to fill my stomach.
- start: '01:51.130'
  end: '01:57.070'
  original: 本当は せつない夜なのに
  english: Even though it's actually a heartbreaking night...
- start: '01:57.690'
  end: '02:07.130'
  original: どうしてかしら？ あの人の涙も思い出せないの
  english: Why can't I even remember his tears?
- start: '02:08.530'
  end: '02:13.890'
  original: 思い出せないの
  english: I can't remember them...
- start: '02:14.250'
  end: '02:24.690'
  original: Wow wow La la la...
  english: Wow wow La la la...
- start: '02:25.150'
  end: '02:30.330'
  original: どうしてなの？
  english: Why is that?
- start: '03:00.870'
  end: '03:02.830'
  original: Don't say "You are lazy"
  english: Please don't say "You are lazy"
- start: '03:02.830'
  end: '03:06.010'
  original: だって 本当は crazy
  english: '''Cause I''m actually crazy.'
- start: '03:06.010'
  end: '03:08.030'
  original: 白鳥たちは そう
  english: Swans, you see...
- start: '03:08.030'
  end: '03:11.830'
  original: 見えないとこでバタ足すんです
  english: Are paddling furiously where you can't see.
- start: '03:11.830'
  end: '03:14.650'
  original: 本能に従順 忠実 翻弄も重々承知
  english: Obedient and faithful to instinct, fully aware of being toyed with.
- start: '03:14.650'
  end: '03:21.950'
  original: 前途洋々だし… だからたまに休憩しちゃうんです
  english: The future is bright... so I take a break once in a while.
- start: '03:32.330'
  end: '03:37.330'
  original: この目でしっかり見定めて 行き先地図上マークして
  english: Spotting it clearly with these eyes, marking the destination on the map...
- start: '03:38.290'
  end: '03:48.330'
  original: 近道あればそれが王道 はしょれる翼があれば上等
  english: If there's a shortcut, that's the royal road; if there are wings to skip
    ahead, that's even better!
- start: '03:53.330'
  end: '03:58.730'
  original: ヤバ爪剥れた グルーで補修した
  english: Oh no, a chipped nail, I repaired it with glue.
- start: '03:59.030'
  end: '04:03.530'
  original: それだけでなんか達成感
  english: Just that gives me a sense of accomplishment.
- start: '04:03.950'
  end: '04:09.110'
  original: 大事なのは自分 かわいがること
  english: The most important thing is cherishing yourself.
- start: '04:09.530'
  end: '04:14.490'
  original: 自分を愛さなきゃ 他人も愛せない
  english: If you don't love yourself, you can't love others either.
- start: '04:14.890'
  end: '04:16.890'
  original: Please don't say "You are lazy"
  english: Please don't say "You are lazy"
- start: '04:16.890'
  end: '04:20.130'
  original: だって 本当は crazy
  english: '''Cause I''m actually crazy.'
- start: '04:20.130'
  end: '04:22.090'
  original: 能ある鷹は そう
  english: A wise hawk, you see...
- start: '04:22.090'
  end: '04:26.130'
  original: 見えないとこにピック隠すんです
  english: Hides its pick where you can't see.
- start: '04:26.130'
  end: '04:30.930'
  original: 想像に一生懸命 現実は絶体絶命
  english: Doing its best in imagination, but in reality it's desperate.
- start: '04:31.130'
  end: '04:36.530'
  original: 発展途中だし… だから不意にピッチ外れるんです
  english: Still work in progress... that's why my pitch suddenly goes off!
- start: '04:46.850'
  end: '04:48.850'
  original: その目に映らないだけだって
  english: It's just that it doesn't reflect in those eyes.
- start: '04:49.030'
  end: '04:55.730'
  original: やる気はメーター振り切って
  english: My motivation pegs the meter to the max!
