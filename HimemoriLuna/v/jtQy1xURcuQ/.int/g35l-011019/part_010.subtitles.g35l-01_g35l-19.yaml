global_summary:
  overall_summary: This video is the 3D birthday live stream of Hololive 4th Generation
    VTuber Himemori Luna, titled 'Luna RebirthDay !! 💗 BIRTHDAY 3D LIVE', streamed
    on October 10, 2025. Set in a magical candy kingdom castle and a grand Budokan-style
    stage, the stream celebrates Luna's birthday and 5th anniversary, featuring her
    new 1-million-subscriber 3D model update and multiple costume/hairstyle transformations.
    Accompanied by her loyal butler/producer character Polnight and special guest
    Omaru Polka (who joins for a duet of 'Sayonara Jinrui'), Luna performs an energetic
    setlist of original songs and popular covers, presents her 2025 birthday merchandise,
    and closes with her signature original song 'Nasshoi Passion'.
