  - start: '02:00.311'
    end: '02:08.771'
    original: えー、ちょっと待って！事務所が違うのにもうこんなに仲良くなれるなんて、もうめっちゃ嬉しいし、いつも水宮枢に元気もらって支えてもらってます！
    english: Wait! Being able to get this close even though we're from different agencies
