      nature world!
  - start: '04:23.221'
    end: '04:27.421'
    original: ほらほら煽ってやろうぜスタイルで　大安売り
    english: Come on, let's provoke them in our style with bargain sales!
  - start: '04:27.681'
    end: '04:31.941'
    original: ちゃっかりライトでありがとうで　君の負け！いぇあ！
    english: Cleverly using the lights, with a 'thank you', it's your loss! Yeah!
  - start: '04:38.001'
    end: '04:42.521'
    original: 擦り付け合いと青い愛の駆け引きで決める
    english: Deciding it with blame-shifting and the maneuvering of naive love
  - start: '04:42.521'
    end: '04:46.361'
    original: 兄の威厳見せるため　荒木乱れ散る散るで
    english: To show an older brother's dignity, scattering wildly...
  - start: '04:46.521'
    end: '04:49.081'
    original: お前は誰だと思ってるくらい　俺様がルールブック
    english: Just who do you think I am? I am the rulebook!
  - start: '04:49.081'
    end: '04:54.061'
