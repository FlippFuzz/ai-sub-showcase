  - start: '03:59.081'
    end: '04:02.501'
    original: おい！待て待てってそんな見劣るような
    english: Hey! Wait, wait, don't give me that lackluster look
  - start: '04:02.501'
    end: '04:05.101'
    original: 働きかまして　はーいはいはいはいはい
    english: Working hard, yes, yes, yes, yes, yes
  - start: '04:05.101'
    end: '04:09.121'
    original: お兄様の仰せのままに(笑)
