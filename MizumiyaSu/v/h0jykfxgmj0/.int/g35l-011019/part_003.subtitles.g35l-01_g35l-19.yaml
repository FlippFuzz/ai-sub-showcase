  - start: '02:08.971'
    end: '02:16.891'
    original: これからもずっと友達！いっぱい遊んでいっぱい楽しいことしていこうね！大好きだよ！
    english: We'll be friends forever! Let's hang out a lot, do lots of fun things,
      and I love you!
  - start: '02:16.891'
    end: '02:24.471'
    original: それではしがりこでした！このあともライブ楽しんでね、がんばれ！ありがとう！
    english: That was Shigariko! Enjoy the rest of the live, do your best! Thank you!
  - start: '02:27.428'
    end: '02:36.428'
    original: ということで、しがりこからメッセージが来ました！ありがとう、しがりこ！こっちにいるかな？ありがとう、しがりこ！
