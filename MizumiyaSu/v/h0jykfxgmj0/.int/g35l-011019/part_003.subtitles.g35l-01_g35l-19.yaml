  - start: '02:46.068'
    end: '02:55.708'
    original: ちょっと次のライブでは今回は踊れなかったけど、いつか一緒にまた踊ろうね！ありがとうねりこ！水宮枢がんばるよ！
    english: and though we couldn't dance together for this live, let's dance together
      again someday! Thank you so much, Riko! Su will do her best!
  - start: '02:55.708'
    end: '03:03.248'
    original: 応援してもらったし、ちょっと次の曲にいこうかな？ちょっと次はゲストパートだから、誰が来るのかな？
    english: She cheered me on, so shall we move on to the next song? Next is the
      guest portion, so who could be coming?
  - start: '03:03.488'
    end: '03:13.268'
    original: このあともまだまだ続きます！そしてなんか告知もあるかもしれないので、最後まで楽しんでね！
