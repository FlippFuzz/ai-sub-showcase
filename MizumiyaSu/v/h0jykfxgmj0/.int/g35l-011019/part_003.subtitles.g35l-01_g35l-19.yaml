  - start: '04:13.341'
    end: '04:16.201'
    original: 兄に対して生意気な態度と　気の効くソングを鳴らせ
    english: With an insolent attitude toward my older sibling, play a considerate
      song!
  - start: '04:18.241'
    end: '04:22.681'
    original: 喧嘩勃発で宣戦布告　いたずら自然ワールドにして
