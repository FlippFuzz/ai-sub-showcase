global_summary:
  overall_summary: This video captures Roboco-san's spectacular 3D birthday live concert
    for 2026, themed around the legendary sunken deep-sea city of Atropolis (#ロボ子海底3Dライブ).
    Featuring immersive underwater visuals and interactive fan art displays, Roboco
    performs an extensive setlist of covers and original songs, joined by special
    guest performers from Hololive across multiple branches (including Usada Pekora,
    Omaru Polka, Hakos Baelz, Koseki Bijou, Rindo Chihaya, and Mizumiya Su). The concert
    includes a transition to a digital ocean depths theme, an interactive camera-finding
    mini-game, a major announcement for her 1st album 'Jewel Memory', and the premiere
    of her new original song 'Utsushiyo Alice'.
