  overall_summary: This is a 3DLIVE birthday celebration stream titled 'はろーぼ飯店へようこそ'
    (Welcome to Harobo Hanten) by Hololive 0th Generation virtual idol Roboco-san,
    celebrating her 2025 birthday (#ロボ子爆誕2025). Featuring an oriental Chinese restaurant
    theme, Roboco debuts a stunning new cyberpunk-inspired Chinese outfit complete
    with hair buns and round glasses. Throughout the concert, she delivers powerhouse
    solo and guest performances alongside Mori Calliope, Elizabeth Rose Bloodflame,
    Ryushen, and Harutya, singing popular tracks like 'Nainai', 'Iiinazukkyun', 'G4L',
    'Shanti', 'Ii-aru Fanclub', 'China Advice', and 'DAN DAN Kokoro Hikareteku'. The
    stream also showcases her birthday merchandise lineup and Hololive Official Card
    Game promotional items, concluding with an enthusiastic announcement for her member-only
    afterparty stream.
