    **Subtitles for "許婚っきゅん" by ano**

    Okay, let's break this down. First, the instrumental intro, no problem. Now, the song starts, I've got to nail these lyrics and timestamps. "Everyone seems so brainless/carefree after all," and "In these bun hairdos, surely there are worries too," are spot on. Then, it flows into a stream of consciousness, a messy head full of half-baked gloom. There's this image of no spine, a legal standstill. And then: There's no such thing as something you can't do. I hear the music, the rock-paper-scissors, getting summoned to a paid hell.

    Now it's time to translate the main sections. "You are already at high speed. Get out of the way, wrap it up. Such a flashy and chaotic drama. Make your wish come true properly." And the core lyric, a plea and declaration: "Betrothed darling, I love you! Give me love 24/7!" and "I love you, give me love 24/7!" Then "One millimeter of electromagnetic waves, I might get a nosebleed. Give me your own opinion or whatever!" and a few words from the person speaking about how they are so happy about having other people with them. Then there are mentions of birthday goods, including a B2 tapestry with a cool illustration of a dragon by SYAGAMU, and a "Eat Your Fill Gyoza Plate!" drawn by Roboco-sensei!


