    Okay, first up is transcribing that song, "いーあるふぁんくらぶ" ("Yi Ar Fanclub").  I've got the singers identified as Roboco, and Ryusen's here as a guest. The lyrics, they are tricky - I need to double-check against the standard lyrics. I'm focusing on the millisecond level, the first line is where it begins – "...も ここはとにかく羞恥心に勝つぞ" but it has to be "ここはとにかく羞恥心に勝つぞ" - "I'll conquer my shyness anyway!". I'm listening closely to Ryusen, and Roboco. It’s a multi-layered approach:  listen, transcribe, confirm the canonical lyrics, listen again, and adjust.  Also, I need to distinguish when Roboco sings, when Ryusen sings and if they are singing at the same time. The goal is pinpoint accuracy for each syllable and speaker.

