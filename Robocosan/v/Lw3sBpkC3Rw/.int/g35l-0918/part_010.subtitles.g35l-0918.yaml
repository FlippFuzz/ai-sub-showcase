    **My Thoughts on the 4th Anniversary Merchandise!**

    Alright, let's see. First, I need to convey this properly. Okay, here we go! It's my 4th-anniversary merch! *Ta-da!*

    First, we have this B2 tapestry by teffish-sensei. Isn't she a super cool big sister? It's awesome, right? Even though I'm only five years old! But right now, I'm eating pudding and children's omurice that I can finally enjoy. How about that for a gap? A five-year-old big sister! *So cute, right?* I bet you want one, don't you?

    Wait a minute, the fork and spoon... hey! Did anyone notice they're shaped like Roboco's motifs? Okay, okay, let's move on. Next! Ah, this is exciting. I drew this one myself! *How is it?* I made a "Ribbon Version" and a "Horn Pigtail Version."

    And, this is the first-ever cutlery set! It was on the tapestry, too! No one say I said "cutlery" wrong. I didn't say "pon"! I am not! I didn't say "pon"! *But please buy it!* Eating with these makes meals super precise! Get some, okay?

    I eat my meals with these! Buying two is recommended, so you can wash them at once. Yeah, yeah, yeah. And now, there's more!

    *Boom!* Now, we have a lunch plate! How's this? I like this type of plate, and I use them every day, but I wanted an original version, so I made this selfishly. But everyone wants to cook rice, right? And you want to eat with Roboco, right? Let's make the plate, the fork, and the spoon Roboco-themed! *This will be perfect!* We can cook the same dishes as Roboco! Now for the illustration... This illustration appears on the lunch plate.

    Here's an acrylic keychain! There are four varieties! Pon-pon, slightly pon, and then cute! *How about this?*

    We also have a random keychain by Akababa-sensei! They're so cute! But I like Born! Isn't this Afro super cute? Afros are the best. It's random, so try to get all of them! I think it's cute even if I get duplicates.

    Okay, this time, the 4th Anniversary Full Set, a limited edition, has everything I mentioned, AND... teffish-sensei's postcard of Roboco big-sister style eating kids' lunch from that tapestry, with a handwritten signature and a duplicated sigh message included is... available for purchase...


