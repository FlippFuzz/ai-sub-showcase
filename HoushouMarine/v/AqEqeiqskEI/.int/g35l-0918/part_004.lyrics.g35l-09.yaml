    reference_lyrics_en: |-
      our love story
      it was as expected
      once it began, it was a one-man show
      even though i was always by your side
      in the end, i was just a spectator
      an emotionless “i’m sorry”
      it was business as usual
      once you get used to it, it’s not so bad
      but i knew that our romance
      wouldn’t last forever
      if only i could choose a different setting, a different relationship
      a different timeline where we could meet
      if only i could have a different personality, different values
      and convey my love
      but wishing for that is pointless.
      goodbye.
      i’m not the one destined for you.
      it’s painful, but i can’t deny it. still, it’s hard to let go.
      just touching your hair hurts. no, but…
      it’s sweet. no, no.
      goodbye.
      so what am i to you?
      i don’t know the answer, and i don’t want to know.
      if there’s one thing i’m certain of,
      it’s that you’re beautiful.
      someone pretentiously
      talks about the logic of love.
      nothing resonates with me.
      it’s like looking down from an airplane window
      at the night view of an unfamiliar city.
      if only i could choose a different setting, a different relationship,
      a different timeline where we could meet.
      with a pure heart, holding onto a love that came true,
      i wish i could say “i love you” without responsibility.
      but wishing for that is futile.
      goodbye.
      beyond the hands we held, there’s an end line.
      every time i stretch it out, the future throbs.
      you’re not there. crying over that fact…
      of course it’s painful.
      goodbye.
      i’m not the person destined for you.
      it’s painful, but i can’t deny it. still, it’s hard to let go.
      just touching your hair hurts. no, but…
      it’s sweet. no, no.
      goodbye.
      so what am i to you?
      i don’t know the answer, and i don’t want to know.
      if there’s one thing i’m certain of,
      it’s that you’re beautiful.
      if that’s the fate of romance, it’s not so bad.
      there’s no promise of eternity,
      but “you’re very beautiful.”
