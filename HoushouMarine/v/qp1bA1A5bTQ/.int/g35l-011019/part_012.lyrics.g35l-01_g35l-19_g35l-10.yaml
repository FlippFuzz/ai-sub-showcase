- start: '03:07.131'
  end: '03:27.791'
  original: 続いて船長描き下ろしのランダムラバーキーホルダー! デフォルメの絵柄を模索して、これだと思えるデフォルメにたどり着いたので、こんな感じで描いてみました。新衣装とまだラバーキーホルダー描いてないなっていう衣装でまとめてみました。かなり可愛いバランスになったかなって自信作なので、絶対ゲットしてくださいね。
  english: Next is the random rubber keychain drawn by the captain herself! I searched
    around for a deformed art style and finally found one that felt right, so I drew
    them like this. I put together the new outfit and outfits where I hadn't made
    rubber keychains yet. It turned out with a pretty cute balance, and I'm really
    proud of it, so make sure to get your hands on one!
- start: '03:28.181'
  end: '03:44.201'
  original: 続いてはこちら! ぬいぐるみキーホルダーくらげ風水着衣装ver. 今回の新衣装のデザインでちっちゃくて可愛いぬいぐるみです。お写真を撮った時に楽しげに見えるように、めちゃテンション高い顔に船長が描き下ろししました。楽しいした時のお供にしてね。
  english: Next is this! The plush keychain jellyfish-style swimsuit outfit ver. It's
    a small, cute plushie featuring the design of the new swimsuit outfit. The captain
    drew a super high-tension face so it looks lively when you take pictures with
    it. Take it along with you when you're having fun!
- start: '03:44.471'
  end: '04:03.181'
  original: 続いてこちら! 2way推し事バッグ! 船長の衣装の太ももにつけているポーチのデザインとお揃いです。普段使いしやすく推し活の時には推し活仕様にできるというところを意識しました。シックなデザインなので、これなら日常使いできますよね?
  english: Next is this! The 2-way oshi-gotsu bag! The design matches the pouch attached
    to the captain's thigh in her outfit. I kept in mind making it easy for everyday
    use while also convertible for oshi-katsu (idol-supporting) occasions. It's a
    chic design, so you can definitely use it everyday, right?
- start: '04:03.711'
  end: '04:12.721'
  original: そして、マリンとドキドキ♡海水浴っていうちょっとゲロ甘なASMRボイスもあります。ちょっとグイグイかしてもらうんで覚悟の準備をしておいてください!
