- start: '02:52.881'
  end: '03:06.561'
  original: まずはB2タペストリー! こちらは今回の新衣装の水着姿をあかさあい先生に描き下ろししていただきました! 超美しい! 肉感がすごっ! 絶対飾ってくださいね。
