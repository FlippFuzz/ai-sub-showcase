- start: '04:13.171'
  end: '04:33.481'
  original: そしてそして、フルセット購入特典はチケット風カード! 昨日ね、夏の野外フェスに出演したところなので、ちょっと意識してサマーフェスチケット風です。通常限定バージョンは直筆メッセージ入り、通常バージョンは複製直筆メッセージ入りです。記念にぜひぜひゲットしてください!
  english: And lastly, the full-set purchase bonus is a ticket-style card! Since I
    performed at a summer outdoor festival yesterday, I designed it with that summer
    festival ticket vibe in mind. The limited version comes with a handwritten message,
    and the regular version comes with a printed copy of the handwritten message.
    Definitely be sure to get it as a keepsake!
- start: '04:34.781'
  end: '04:51.621'
