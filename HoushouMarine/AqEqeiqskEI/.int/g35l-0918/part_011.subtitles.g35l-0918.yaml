    original: めっちゃほしいものしかないですよ！まずはこちら！
    english: There are only things you'll definitely want! First is this!
  - start: '02:07.660'
    end: '02:22.200'
    original: あかさあい先生描きおろしのラバーマットです！机に敷いたりカードゲームしたり飾ったり…まあ好きにしてください！海賊の宝の地図風デザインなので机に置いてあるだけで船長気分を味わえますよ！キミも陸海賊にならないか！？
