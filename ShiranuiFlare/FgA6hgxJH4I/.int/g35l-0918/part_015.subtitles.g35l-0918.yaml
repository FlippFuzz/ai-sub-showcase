responses:
- subtitles:
  - start: '00:00.000'
    end: '00:01.445'
    original: この後詳細お知らせ！まだ帰らないでね！
    english: More details coming up next! Don't go away yet!
  - start: '00:01.445'
    end: '00:03.965'
    original: 新しい情報発表していくよ！
    english: I'll be making a new announcement!
  - start: '00:02.115'
    end: '00:09.615'
    original: 改めて今回コラボするゲームは、ポップンミュージック、DanceDanceRevolution、SOUND VOLTEXの3機種です！
    english: The featured BEMANI games this time are Pop'n Music, DanceDanceRevolution,
      and SOUND VOLTEX!
  - start: '00:10.015'
    end: '00:15.005'
    original: この3機種に先ほど披露した「Silent Flame, Never Fade」が収録されます。
    english: '"Silent Flame, Never Fade," the original song I showcased earlier, will
      be included in these games.'
  - start: '00:15.005'
    end: '00:18.995'
    original: ご覧の日付からプレイすることができますので、お楽しみに！
    english: You'll be able to play it starting April 3rd at 10 AM, so look forward
      to it!
  - start: '00:19.465'
    end: '00:25.215'
    original: さらにさらに、不知火フレアが歌うBEMANIシリーズのカバー楽曲の収録も決定しました！
    english: Furthermore, we've decided to include BEMANI series cover songs performed
      by Shiranui Flare!
  - start: '00:25.215'
    end: '00:30.345'
    original: 収録楽曲、収録機種、収録日時についてはご覧の通りです。
    english: Check the screen for details on the songs, playable versions, and release
      dates.
  - start: '00:30.565'
    end: '00:33.425'
    original: そして！
    english: And...
  - start: '00:31.255'
    end: '00:37.375'
    original: まだまだ終わりません！BEMANIアーティストとのコラボ新曲の制作が決定しました！
    english: There's still more! We've decided to collaborate on a brand-new song
      with a BEMANI artist!
  - start: '00:37.375'
    end: '00:43.085'
    original: 速報はポップンミュージック公式Xで発信予定ですので、ぜひチェックしてみてください！
    english: Breaking news will be posted on the Pop'n Music official X account, so
      be sure to check it out!
  - start: '00:43.685'
    end: '00:48.335'
    original: さあ、ここからは各機種ごとのコラボ内容をまとめてご紹介していきます。
    english: Now, let's go over the collaboration details for each game.
  - start: '00:48.335'
    end: '00:52.795'
    original: ポップンミュージックでは、なんと不知火フレアがポップキャラとして登場しちゃいます！
    english: In Pop'n Music, Shiranui Flare is making her debut as an in-game character!
  - start: '00:53.305'
    end: '01:02.935'
    original: 詳細は追って公式Xにて発表予定なので、お見逃しなく！
    english: Details will be announced later on the official X account, so don't miss
      it!
  - start: '01:03.495'
    end: '01:11.455'
    original: DanceDanceRevolutionでは、ゲーム画面の見た目を自分好みに変更できるプレミアムカスタマイザーとして、コラボアイテムが登場予定です。
    english: In DanceDanceRevolution, collaboration items will be available as premium
      customizers.
  - start: '01:11.755'
    end: '01:18.665'
    original: SOUND VOLTEXでは、これまで登場してきたネメシスクルーに不知火フレアも参戦します。
    english: In SOUND VOLTEX, Shiranui Flare will join the Nemesis Crew, who have
      appeared in past titles.
  - start: '01:19.125'
    end: '01:27.425'
    original: こちらも詳細は追って公式Xにて発表していくので、忘れずにチェックしてね！
    english: Details for this will also be announced on the official X account, so
      be sure to check it out!
  - start: '01:28.185'
    end: '01:45.925'
    original: ということで、今回はフレアがずっと愛してやまないBEMANIシリーズのオリジナルソング縛りのライブがしたい、というね、あの完全にフレアのやりたい放題ライブの企画だったわけなんですが、そこからこんなにたくさんゲームに実装されてしまうなんて、いまだにちょっと現実味がありませんが、
    english: So, this was originally planned as a variety live of BEMANI songs that
      Flare loves, but I can't believe it's actually happening in the games now—it
      still feels surreal!
  - start: '01:46.065'
    end: '01:55.805'
    original: 長く愛しているBEMANIユーザーさんも、え、末永く今後ともBEMANIシリーズのことよろしくお願いします。
    english: I truly appreciate the BEMANI users who have supported me for so long,
      and I hope you'll continue to support the BEMANI series!
  - start: '01:53.035'
    end: '02:05.515'
    original: あ、不知火フレアもよければよろしくお願いしますということで、あの音ゲーマー独自の誰目線ですが、え、すでに遊んでいるエルフレはもちろん、まだ始めてないエルフレもこれを機に遊んでもらえたら嬉しいです。
    english: And of course, for those who already play Elfrein and those who haven't
      yet, I'd be so happy if you started playing through this!
  - start: '02:06.025'
    end: '02:14.395'
    original: そして新曲もね、このあとMVが公開されるのと、0時にはリリースもされるので、たくさん聴いて、見てくれると嬉しいです。
    english: And the new song's music video will be released soon, with the release
      at midnight, so I hope you'll listen to it a lot!
  - start: '02:14.655'
    end: '02:21.055'
    original: あとグッズ。え、今回ですね、少し早めにお知らせさせていただいたので、さらっと振り返るね。
    english: Also, the merch! Since we announced it a bit early, let's do a quick
      recap.
  - start: '02:20.915'
    end: '02:28.915'
    original: マフラータオル、タンブラー、ぬいぐるみ付きスマホショルダー、キャップ、シチュエーションボイスフルセット。
    english: Muffler towel, tumbler, plushie shoulder strap, cap, and situation voice
      full set!
  - start: '02:29.075'
    end: '02:38.865'
    original: どれも可愛くて使いやすいと思うので、ぜひお仕事だったり、お出かけとか、スポーツとか、ゲームセンターとか行ったりとか、え、何でも使ってみてください。
    english: They're all super cute and easy to use, so definitely use them for work,
      going out, sports, or at the arcade!
  - start: '02:39.115'
    end: '02:45.315'
    original: グッズの販売はこのあと21時からなので、数量限定もたくさん用意しているので、逃さずにね！
    english: Merch sales start at 9 PM today, and we have plenty of quantity-limited
      items, so don't miss out!
  - start: '02:45.315'
    end: '02:49.115'
    original: グッズの話なんかはまた改めてお話しさせてください。
    english: I'll talk about the merch-free talk in more detail another time!
  - start: '02:49.495'
    end: '02:59.885'
    original: 今回は思いもよらないことが本当にたくさん起きて、運営さんもコナミさんもエルフレのみんなも感謝の気持ちでいっぱいです。本当にありがとうございます。
    english: Today, so many unexpected things happened, and I'm just so grateful to
      management, Konami, and all the Elfrein. Thank you so much!
  - start: '03:00.325'
    end: '03:05.785'
    original: さあ、明日はゲームセンターに、いっちゃん？いっちゃん？ね、一緒に行こ？
    english: So, shall we go to the game center tomorrow? Shall we go together?
  thoughts: null
