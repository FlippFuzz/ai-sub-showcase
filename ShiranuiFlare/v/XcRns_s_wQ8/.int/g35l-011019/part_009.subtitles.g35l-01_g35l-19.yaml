global_summary:
  overall_summary: This YouTube livestream features Shiranui Flare's 2025 3D Birthday
    Live celebration ('#不知火フレア生誕祭2025'), hosted on her official Hololive channel.
    Set against an outdoor theme-park and castle-inspired stage, Flare performs a
    vibrant setlist of original songs ('マーブル冴える', 'Funfair', and her new single '薄明光線')
    and emotional covers. She is joined by guest IRyS for a playful chat and by fellow
    Hololive 3rd Generation members (Usada Pekora, Shirogane Noel, and Houshou Marine)
    for banter and the grand reveal of her new sacred choir-inspired 3D birthday outfit
    with interactive layers. The stream concludes with merchandise announcements and
    the premiere of her new original song.
