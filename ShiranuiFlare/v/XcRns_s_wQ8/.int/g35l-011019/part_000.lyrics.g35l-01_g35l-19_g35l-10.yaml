  original: 世界を歩く
  english: walking through the world.
- start: '02:07.823'
  end: '02:10.503'
  original: どこへでもゆけたけど
  english: I could go anywhere, but
- start: '02:10.743'
  end: '02:13.343'
  original: どこだって同じさ
  english: everywhere is the same.
- start: '02:13.483'
  end: '02:17.303'
  original: 濁ったキャンバスで君だけが映いていた
  english: On a muddy canvas, only you were shining bright.
- start: '02:27.163'
  end: '02:29.843'
  original: 自分のためだけに描いた
  english: Painted just for myself,
- start: '02:30.343'
  end: '02:35.483'
  original: 僕は僕以外を愛せなかった
  english: I couldn't love anyone other than myself.
- start: '02:37.043'
  end: '02:39.923'
  original: 息を吸い込み吐き出す
  english: Inhaling and exhaling,
- start: '02:40.163'
  end: '02:46.463'
  original: それだけの毎日に君が、君だけが映いていた
  english: in those mere everyday routines, you, only you were shining bright.
- start: '02:47.383'
  end: '02:51.103'
  original: 優しい嘘より傷つく真実が良いの
  english: I'd rather have a hurting truth than a gentle lie.
- start: '02:51.343'
  end: '02:57.443'
  original: 孤独な自由より君といる不自由が良いよ
  english: I prefer the inconvenience of being with you over lonely freedom.
- start: '02:58.123'
  end: '03:07.443'
  original: 夢中になって夢中になって瞬間五里霧中になった 宇宙・未来・週末が晴れるより君を分かりたい
  english: Lost in passion, lost in passion, momentarily lost in a fog. I want to
    understand you more than hoping the universe, future, or weekend clears up.
- start: '03:08.183'
  end: '03:17.183'
  original: 夢中になって夢中になって瞬間筆は宙に舞った 僕ら一つになれないし混ざらないし濁らないよ
  english: Lost in passion, lost in passion, momentarily my brush danced through the
    air. We can't become one, we don't mix, and we won't get muddy.
- start: '03:18.063'
  end: '03:19.463'
  original: ふたり、マーブル冴える
  english: The two of us, our marbles clear bright.
- start: '03:29.863'
  end: '03:32.403'
  original: 小さな境界と許しと
  english: With small boundaries and forgiveness,
- start: '03:32.663'
  end: '03:38.003'
  original: 罰と分け合って世界は回る
  english: sharing penalties, the world turns.
- start: '03:39.543'
  end: '03:42.223'
  original: みんな器用に笑うような
  english: Everyone smiles so adeptly—
- start: '03:42.443'
  end: '03:48.563'
  original: そういうところ嫌い君が、君だけが本当だ
  english: I hate those kinds of traits. You, only you are real.
- start: '03:49.783'
  end: '03:53.643'
  original: 優しく奪うより傷つけても与えたいよ
  english: Instead of taking gently, I want to give even if it hurts.
- start: '03:53.863'
  end: '04:00.643'
  original: 孤独で満ちるより君といて満たされずにいたいよ
  english: Rather than being filled with loneliness, I want to be with you and stay
    unsatisfied.
- start: '04:01.063'
  end: '04:10.143'
  original: 夢中になって夢中になって瞬間空間色彩爆ぜた 見失ってもすぐわかるのさ君は美しい
  english: Lost in passion, lost in passion, momentarily space and colors burst. Even
    if I lose sight of you, I'll know right away—you are beautiful.
- start: '04:10.823'
  end: '04:21.063'
  original: 夢中になって夢中になって呼んだ言葉宙に舞った 僕ら一つになれないしだから君に触れたかった
  english: Lost in passion, lost in passion, the words I called out danced in the
    air. We can't become one, and that's why I wanted to touch you.
- start: '04:29.083'
  end: '04:33.703'
  original: 覧こんなに饒舌になったのに
  english: Look, even though I've become so talkative,
- start: '04:33.903'
  end: '04:38.323'
  original: 言いそびれたことなら山ほどあるさ
  english: there are still countless things I failed to say.
- start: '04:38.903'
  end: '04:43.703'
  original: 路地裏で猫を見たとか雨上がりの夕映えが綺麗だとか
  english: Like seeing a cat in a back alley, or the after-rain sunset being so beautiful...
- start: '04:44.243'
  end: '04:50.003'
  original: 君といる不自由が心地いいとか
  english: Like how the inconvenience of being with you feels so comforting.
- start: '04:51.043'
  end: '05:00.008'
  original: 夢中になって夢中になって瞬間五里霧中になった 御大層な未来予想図より
  english: Lost in passion, lost in passion, momentarily lost in a fog. Rather than
    a grandiose vision of the future...
