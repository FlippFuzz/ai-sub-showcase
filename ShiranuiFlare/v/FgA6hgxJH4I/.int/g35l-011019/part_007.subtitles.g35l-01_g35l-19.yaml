      like beatmania IIDX, pop'n music, SOUND VOLTEX, and DanceDanceRevolution.
  - term: Pop'n Music
    meaning: An iconic Konami rhythm arcade game featuring a large 9-button controller
      and colorful characters.
  - term: MZD
    meaning: A recurring deity/mascot character in the pop'n music series with numerous
      incarnations across different versions.
  - term: e-amusement pass
    meaning: Konami's arcade user card and cloud save system used to track scores,
