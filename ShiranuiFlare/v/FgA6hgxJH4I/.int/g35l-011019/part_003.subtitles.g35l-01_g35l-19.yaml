  overall_summary: This is a 3D birthday live stream by Hololive 3rd Generation member
    Shiranui Flare titled 'BEMANI Music 3D LIVE!', celebrating her lifelong dream
    collaboration with Konami's BEMANI rhythm game franchise. The stream includes
    spectacular performances of iconic BEMANI tracks with guest appearances by Aki
    Rosenthal, Ichijou Ririka, and legendary Konami composer Wac. Flare showcases
    arcade gameplay on the latest 'Pikapika Pop'n Model' machine, announces a three-game
    official BEMANI collaboration (pop'n music, DanceDanceRevolution, SOUND VOLTEX),
    and debuts her new original single 'Silent Flame,Never Fade' written by Satoshi
    Yaginuma.
