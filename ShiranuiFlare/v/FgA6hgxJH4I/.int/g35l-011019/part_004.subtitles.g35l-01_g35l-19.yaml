  domain_glossary:
  - term: BEMANI
    meaning: Konami's music video game division and franchise, encompassing titles
      like beatmania IIDX, pop'n music, SOUND VOLTEX, and DanceDanceRevolution.
  - term: Pop'n Music
    meaning: An iconic Konami rhythm arcade game featuring a large 9-button controller
      and colorful characters.
  - term: MZD
    meaning: A recurring deity/mascot character in the pop'n music series with numerous
      incarnations across different versions.
  - term: e-amusement pass
    meaning: Konami's arcade user card and cloud save system used to track scores,
      unlockables, and player profiles across BEMANI games.
  - term: 3倍アイスクリーム (3-bai Ice Cream)
    meaning: A legendary meme and vocal callout from the song 'Second Heaven' by Ryu☆
      that players shout during chorus parts.
  - term: Pikapika Pop'n Model
    meaning: The newly released arcade cabinet model for pop'n music featuring a brighter
      widescreen LCD and updated design.
