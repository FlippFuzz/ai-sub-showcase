    original: 曲とかって、あの、なんか作られ、曲作ってからキャラとか決まるんですか？それともキャラクターに合わせて曲作ったりするんですか？
    english: When songs are made, are the characters decided after the song is made?
      Or do you make songs to match the characters?
  - start: '02:17.060'
    end: '02:25.260'
    original: ああ、なるほど。結構、あの、ケースバイケースっていうか、時もMZ Dとかは本当に、でもMZ Dって決まってること多いですよね、やっぱり。
    english: Ah, I see. It's quite case-by-case, but for MZD, things are pretty much
      set in stone.
  - start: '02:54.480'
    end: '03:09.580'
    original: はい、なんかストーリーどうなんですかね？あの、ポップンをお好きな方って、そういうストーリー的な、なんだろう、このキャラこんなだったんだみたいなのが分かるのが嬉しいのか。
    english: Yeah, I wonder about the story? People who love Pop'n, are they happy
      to understand the story aspects, like finding out what a character's background
      was like?
  - start: '03:09.840'
    end: '03:13.200'
    original: めっちゃ嬉しいです！本で出してほしいまである。
    english: I'm super happy! I even want it published as a book.
  - start: '03:13.440'
    end: '03:14.300'
    original: ああ、なるほど。
    english: Ah, I see.
  - start: '03:14.500'
    end: '03:19.860'
    original: なんか、あの、推しの情報を常に募集しているので、
    english: Since we're always collecting information on favorite characters...
  - start: '03:20.100'
    end: '03:20.640'
    original: お願いします！
    english: Please do!
  - start: '03:20.760'
    end: '03:21.840'
    original: マジですか？
    english: Seriously?!
  - start: '03:21.840'
    end: '03:22.560'
    original: 頼むちゃいました。
    english: You asked him just like that?!
  - start: '03:22.560'
    end: '03:25.320'
    original: 大先輩のお願いだってはね。 推し様に お願い。
    english: Well, when it's a request from a great senior... A request to the favorite
      deity.
  - start: '03:25.560'
    end: '03:30.340'
    original: いいですね、欲張らない人大事ですよ、はい。私今日実は誕生日なんです。
    english: That's good, people who aren't greedy are important. Yes. Actually, today
      is my birthday.
  - start: '03:30.560'
    end: '03:31.220'
    original: え、マジですか？
    english: Eh, seriously?!
  - start: '03:31.320'
    end: '03:32.400'
    original: そうなんです。
    english: That's right.
  - start: '03:32.400'
    end: '03:33.100'
    original: おめでとう！
    english: Happy birthday!
  - start: '03:33.100'
    end: '03:36.780'
    original: お誕生日お、お誕生日。
    english: Happy, happy birthday...
  - start: '03:41.400'
    end: '03:46.540'
    original: あの、誕生日なんで、あの、もしよろしければ、あの、サインとかいただき、サイン？
    english: Well, since it's my birthday, if possible, I'd love an autograph... An
      autograph?
  - start: '03:46.540'
    end: '03:51.320'
    original: 嬉しいな。そんなの何ぼでもしますよ、あの、初級書とかじゃなければ全然、全然書きます書きます。
    english: I'd be so happy! I can do as many of those as you want, as long as it's
      not Shokyuu-sho or something, I'll totally sign it!
  - start: '03:51.520'
    end: '03:55.320'
    original: あの、今日、あの2枚ちょっとサイン、あのカードを用意したんで、あの好きな方、
    english: Well, today, I prepared two signed cards, so whichever one you like...
  - start: '03:55.320'
    end: '03:58.340'
    original: 好きな方、あの、やっぱりあの音ゲーマーっていうカードなんだよね。初球書じゃないんです。
    english: Whichever you like. Oh right, these are cards for rhythm gamers. Not
      Shokyuu-sho.
  - start: '03:58.980'
    end: '04:09.120'
    original: プレアミューズメントパスを ちょっと2枚用意しました。あの普通のオースドナックスなやつと、あの猫、仕事猫の、あのカードちょっと用意したので、あの、猫なだけに。
    english: I prepared two e-amusement passes. One is the normal orthodox one, and
      the other is the Work Cat (Neko Shigotoneko) card, since it's cat-themed.
  - start: '04:09.300'
    end: '04:14.620'
    original: なるほど、猫だけに。ぜひあの、どちらでもどちらにもあの、サインしてもらえたら嬉しい。
    english: I see, just because of the cat. I'd be so happy if you could sign either
      or both of them!
  - start: '04:14.620'
    end: '04:23.240'
    original: ここら辺にきっと、あの、後で出していただくかと思うので、大事、書きます書きます。わかりました。サインもう書き尽くします。書き尽くします。
    english: I'll probably pull them out around here later, so... I'll sign them,
      I'll sign them. Understood. I'll sign everything! I'll write 'em all!
  - start: '04:23.540'
    end: '04:25.540'
    original: 全てを消したら急いで書き尽くします。
    english: Once I erase everything, I'll frantically finish writing them!
  - start: '04:25.800'
    end: '04:45.360'
    original: あまり欲ば 、なんかやっぱりあの、私あのBEMANIの楽曲が大好きなので、あの、なんかもし、いつか、いつかでいいんですけど、あの、本当にあの、いつかカバーとか入ったら嬉しいなと思って。
    english: Don't be too greedy... Well, since I really love BEMANI music, if ever—even
      if it's way in the future—I'd be so happy if I ever got to do a cover or something.
  - start: '04:45.360'
    end: '04:46.000'
    original: おや？
    english: Oh?
  - start: '04:46.120'
    end: '04:48.240'
    original: いや、フレアさん、お待たせしました。 案件です！
    english: Well, Flare-san, thanks for waiting. It's a tie-up project!
  - start: '04:48.780'
    end: '04:53.640'
    original: ありがとうございます！ ここまで貯めて、ためにためて案件ですよ。はい。
    english: Thank you very much! Saving it up and building it up, it's a tie-up project!
      Yes.
  - start: '04:54.080'
    end: '05:01.320'
    original: この配信をする時にあの案件なんだなとか思ってる君たち本当にいなかったでしょ！
    english: None of you guys really thought it was a tie-up project when streaming
      this, did you?!
