  thoughts: |+
    **My Thoughts on the Stream**

    Okay, so the stream's starting, and I'm really excited. First off, I *got* to sing "Sakimuri Renka" solo! Thinking back on the song choices, it was a mix. I wanted songs that I felt suited me, but also things that my audience would recognize as classic Pop'n Music, which is an important aspect for a birthday stream! Though, "Pink Rose" is a Keyboardmania track, but it fits so well! Everyone's tastes are diverse, so the selection ended up a bit of a mixed bag. I feel like "Sakimuri Renka" is a classic too, but it's tough when you have all these memories flooding in, but it was just a song I loved, so I had to go for it!

    Today, I get to change into this outfit and I'm so hyped! And now, thanks to my request, I'm playing Pop'n Music High Cheer! I was wondering where the arcade cabinet was, and finally found it! It's amazing! This technology is just incredible! Most VTubers don't get the chance to play on a real arcade cabinet, which is super rare, and I'm so grateful to Konami and the management team. I feel like this is a special treat, and I get to play on this adorable cabinet.

    Did everyone notice the stage setup? Konami really went above and beyond, matching the stage assets with the cabinet. I mean, they gave us the stage assets! This is awesome! I feel bad for being so reliant on Konami, but I requested so many things, thinking "no harm in asking" and they said "yes"! I can't thank them enough, so I'm just gonna jump right into playing!

    I'll start with the "Happy Birthday" area, tap, tap, tap... and see! Crackers pop up on the screen, and I'm so happy! This time I can play using my own e-amusement card! I'm not gonna show the PIN code, obviously! But I typed it in, and now I'm in!

    Whoa, it's Pop'n Music! I always play this! Thank you as always for everything! I can use my favorite character today. Since this is a vocal live, I wanted to stick with a vocal theme for three songs.

    I decided on "oto," my absolute favorite Pop'n Music song, to be the first! Because I love it so much! I'll play on HYPER mode. Honestly, out of the three songs, this one is the hardest, but I had to pick it, because it is my favorite song. I'm not sure if it fits a vocal theme!

    This quiet beginning... and the vertical spams at the end, are really tough, but I'm gonna give it my best shot. I wonder if I can get a Full Combo with stream luck? Probably impossible! I was going to try and focus but I kept breaking the combo! My favorite character's on my right hand, and the other on my left hand. I'm so happy! Ah! I'm so bad at vertical spams! Forgive me!


