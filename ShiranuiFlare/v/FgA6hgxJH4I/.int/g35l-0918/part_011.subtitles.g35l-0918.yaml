    **My Thoughts on the Pika Pika Pop-kun Stream**

    Okay, so I'm watching this video, and I'm totally immersed. First off, I'm thinking about how much work went into the Pika Pika Pop-kun model. So many people contributed to it! It's amazing. I'm so grateful to everyone who helped bring it to life. I mean, from Doss-low-sensei and DJ Shaka-san to Gekidan Record-san and everyone else involved, it's just a huge team effort.

    I'm feeling so appreciative! Truly, it's all thanks to everyone that I'm able to be here today. It's really the team's combined efforts that made this possible, and they have my sincere thanks. This whole thing makes me wonder if there's any new Pop'n Music info we can get?

    Can I? Oh, wait, can't say anything? No, no, I'll tell, I'll tell. What new info would be good? As an individual, I'd really love to know about MZD, personally.

    MZD is the ultimate god. I think Wac-san is about half of MZD. Half? No, half is actually Pawn-san. Really, it's like M for me, Z is Pawn-san, and D is everyone else... something like that.

    So, ideally, I'd be thrilled to hear anything about MZD in whatever capacity is okay. Like, character settings, I guess? Or like the whole Amazon river blue text thing? I don't know, it's a mystery. But didn't he used to have a spear like Amazon? Maybe the shadow was Amazon? Or maybe not. It's the point.

    Does he still live in blue text? Probably. It's, like, talking to official staff stuff. Pop'n has so many things the official side doesn't know about. Yes, since it's from everyone's thoughts, even the official side doesn't know some things. Do you create the song first and then the character, or tailor the song to the character?

    It depends on the case, really. Especially with MZD, there are many things decided from the start. Since he's often in the final song of a version, we have to keep MZD in mind when creating songs. Fans of a specific character can also want a song tailored to them.

    Oh, new, Flare is hoping MZD appears in HaRiA's too! It'd be great. Will there be stories with complex plots in the future, like in Usa-Neko? For the people who love Pop'n, are they happy to find out details on a character and what they were like? It makes me super happy.

    I am always collecting info on Oshi, so please share. Seriously, please. I beg you. Having that greed is important.

    Today is actually my birthday. Really? Yes! Happy birthday, and are we having a birthday celebration time? Do you want me to sing? Happy Birthday... and is this proven today? Yes? If you wouldn't mind signing for me...I would be so happy.

    I prepared two cards for autographs! One is a rhythm game card, the other isn't 100-kichi! I prepared a Pianism and Pass card. One is regular, the other is a cat-themed one, because it's a cat. Either would make me really happy. I'm sure you'll show them off around here later, right? Sure, I'll write! It's alright, I'll write. And I will write until all is gone.

    I really love BEMANI songs, and I wish if someday, even someday is fine, I would love it if a cover or something comes into being. Oh, I got greedy. Sorry, sorry.

    Flare-san, thanks for waiting. It's a project. Thank you very much. I don't think you thought this was a paid stream, did you?



