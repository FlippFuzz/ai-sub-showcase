  original: 皆さんこんぬいー！ホロライブ3期生の不知火フレアです！今日は私の生誕祭ライブ2024にお越し下さり、皆さんありがとうございます！
  english: Konnuī, everyone! I'm Shiranui Flare from Hololive 3rd Generation! Thank
    you all so much for coming to my Birthday Live 2024 today!
- start: '01:33.720'
  end: '01:47.340'
  original: そんでもって見てください、このステージ！すっごく可愛いでしょう！この日のために、ウエダさんに作ってもらいました！本当にありがとうございます！
  english: And look at this stage! Isn't it super cute? Ueda-san made it specially
    for this day! Thank you so much!
- start: '01:48.400'
  end: '02:02.000'
  original: 今日はこのステージでたくさん盛り上がっていくから、一緒にみんなで盛り上がろうね！そして今日はゲストもたくさんいるので、ゲストのみんなともたくさん歌っちゃうよ！
  english: Today we're going to get super hyped on this stage, so let's all get excited
    together! And since we have lots of guests today, I'm going to sing a lot with
    all the guests too!
- start: '02:02.500'
  end: '02:08.500'
  original: ハッシュタグはこちら！「不知火フレア生誕祭2024」でたくさんポストしてね！
  english: 'The hashtag is right here! Please post a lot using #ShiranuiFlareBirthday2024!'
- start: '02:09.000'
  end: '02:14.340'
  original: それでは今日はみんなでたくさん盛り上がっていきましょう！いくぞー！
  english: Well then, let's all get super hyped up today! Here we go!
- start: '02:23.700'
  end: '02:30.340'
  original: ドクドクシテルコトバッカリ サッパリシタイアジワミライ
  english: It's all thumping and pounding, I want a refreshing-tasting future.
- start: '02:37.940'
  end: '02:44.780'
  original: 痛んだ小競り合いは 伸び切った舌戦なんか 飽きて匙を投げる そりゃ遠くに
  english: Worn-out bickering and drawn-out verbal battles... I'm tired of it and
    throw in the towel, far away.
- start: '02:45.080'
  end: '02:52.400'
  original: 巡り巡ってあなたのためにすくう ああ スプーンにでもなれたらいいな
  english: It goes round and round, scooping it up for your sake. Ah, I wish I could
    even become a spoon.
- start: '02:53.140'
  end: '03:00.100'
  original: 絵に描いたご馳走じゃないのに フォンから作るソースじゃないのに ちょっとばかなんでしょう 吸い底の年
  english: Even though it's not a picture-drawn feast, even though it's not sauce
    made from fond... Why is it a bit silly? The leftover years at the bottom.
- start: '03:00.100'
  end: '03:06.320'
  original: 色鮮やかなサラダボウルに 好き嫌いも笑って試して 案外好きになってるじゃん
  english: In a colorful salad bowl, laughing and trying likes and dislikes, you end
    up liking it more than you'd think.
- start: '03:06.840'
  end: '03:15.960'
  original: 鈍色の天気の日には 厚い雲を裂いていくような 風を見てみたい 魔法を見てみたい
  english: On dull-weather days, I want to see a wind that tears through thick clouds,
    I want to see magic.
- start: '03:16.580'
  end: '03:23.860'
  original: 思い付くだけのレシピを眺めて 振る舞おうぜ何回だって できたての料理を
  english: Glancing at whatever recipes come to mind, let's serve freshly made dishes
    no matter how many times.
- start: '03:24.080'
  end: '03:30.220'
  original: 満面の笑みが見られたのならば 創造の手間もどうだっていい
  english: If I can see your full smiles, the trouble of creation doesn't matter at
    all.
- start: '03:31.020'
  end: '03:38.280'
  original: 知らない巡り合いは とんでもない未来 分け合えると知るんだ 不揃いな皿でも
  english: An unfamiliar encounter leads to an unimaginable future; we learn we can
    share it, even on mismatched plates.
- start: '03:38.560'
  end: '03:45.020'
  original: 運命こさじ一杯 朝まで目一杯 話そう大小希望のプランを
  english: A tablespoon of destiny, a full morning of talking about big and small
    plans of hope.
- start: '03:45.340'
  end: '03:47.880'
  original: そうやって贅沢な匙を探していこう
  english: That's how we'll keep searching for luxurious spoons.
- start: '03:51.360'
  end: '03:58.500'
  original: ぬくもりも まどろみも 今日の最速で飛んでいく
  english: Warmth and slumber will fly off at today's fastest speed.
- start: '03:59.020'
  end: '04:06.120'
  original: 準備するから 連れてって欲しいのさ 朝日が良く見えるあの丘に
