- start: '04:27.980'
  end: '04:34.900'
  original: どうやったってダメな日もあるけど その失敗もスパイスなんだろう
  english: There are days when nothing works out no matter what, but even those failures
    must be the spices.
- start: '04:35.180'
  end: '04:42.500'
  original: 始めての料理がどんな苦くても 誇らしく思うんだ 傷テープ貼った手で
  english: No matter how bitter my very first dish is, I'll think of it proudly with
