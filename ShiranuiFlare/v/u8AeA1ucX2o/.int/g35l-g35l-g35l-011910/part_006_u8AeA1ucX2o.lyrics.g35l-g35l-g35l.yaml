  end: '00:12.302'
  original: 当り前の連絡も
  english: And the usual messages,
- start: '00:13.352'
  end: '00:18.152'
  original: 突然無くなるかもしれない
  english: Might suddenly disappear...
- start: '00:19.452'
  end: '00:24.782'
  original: そっと心に手を当てて聞けばいい
  english: Just gently place a hand on your heart and listen,
- start: '00:26.032'
  end: '00:32.322'
  original: きっと答えは一つだから
  english: And surely the answer is one, so...
- start: '00:36.952'
  end: '00:43.322'
  original: ねえ気付いて大事な人は誰
  english: Hey, notice who the precious person is.
- start: '00:44.202'
  end: '00:50.452'
  original: 嘘をついてごまかしたって心まではだませない
  english: Even if you lie and brush it aside, you can't fool your heart.
- start: '00:51.152'
  end: '01:05.152'
  original: 眩しすぎるその光の中に二人が見えるよ素直になって見つめ合えば今までの曇り空は青空へ
  english: I can see the two of us inside that dazzling light; if we become honest
    and gaze at each other, the cloudy skies until now turn into a blue sky.
- start: '01:06.332'
  end: '01:11.452'
  original: 心と心結んだ虹がかかる
  english: A rainbow connecting our hearts will span across.
- start: '01:11.852'
  end: '01:17.152'
  original: 二人を包み込んで輝くよ
  english: Wrapping us both in its shine.
- start: '01:21.852'
  end: '01:24.152'
  original: 輝くよ
  english: Shining bright...
- start: '02:54.800'
  end: '02:59.000'
  original: '[Title: 春泥棒]'
  english: '[Title: 春泥棒]'
- start: '02:55.200'
  end: '02:59.000'
  original: '[Text: 作詞作曲:n-buna]'
  english: '[Text: Lyrics & Music: n-buna]'
- start: '03:07.126'
  end: '03:13.576'
  original: 高架橋を抜けたら 雲の隙間に青が覗いた
  english: Passing through the overpass, blue peeked through a gap in the clouds.
- start: '03:14.216'
  end: '03:20.576'
  original: 最近どうも暑いから ただ風が吹くのを待ってた
  english: Lately it's been rather hot, so I was just waiting for the wind to blow.
- start: '03:22.256'
  end: '03:28.916'
  original: 木陰に座る 何かに気付く 見上げれば頭上に咲いて散る
  english: Sitting in the shade of a tree, noticing something, looking up to see them
    blooming and scattering overhead.
- start: '03:36.956'
  end: '03:45.396'
  original: はらり、僕らも息も忘れて 瞬きさえおく
  english: Softly, we too forget to breathe, leaving even our blinks behind.
- start: '03:45.396'
  end: '03:51.496'
  original: さあ、今日さえ明日 過去に変わる ただ風を待つ
  english: Come now, even today turns into tomorrow's past, as we just wait for the
    wind.
- start: '03:52.336'
  end: '03:59.976'
  original: だから僕らも声も忘れて さよならさえおく
  english: So we too forget our voices, leaving even our farewells behind.
- start: '04:00.676'
  end: '04:03.496'
  original: ただ花が降るだけ
  english: As flowers simply fall down.
- start: '04:04.136'
  end: '04:07.396'
  original: 晴れ 今春吹雪
  english: It's clear, now a spring snowstorm.
- start: '04:24.036'
  end: '04:30.336'
  original: 次の日も待ち合わせ 花見の客も少なくなった
  english: Meeting up again the next day, the cherry blossom viewers had grown fewer.
- start: '04:31.296'
  end: '04:38.296'
  original: 春の匂いはもう止む 今年も夏が来るのか
  english: The scent of spring is already fading; will summer arrive again this year
    too?
- start: '04:39.116'
  end: '04:46.476'
  original: 高架橋を抜けたら 道の先に君が覗いた
  english: Passing through the overpass, you peeked out ahead on the path.
- start: '04:47.116'
  end: '04:53.336'
  original: 残りはどれだけかな どれだけ春に会えるだろう
  english: How much time is left, I wonder? How many more springs will I get to see
    you?
- start: '04:54.516'
  end: '04:59.000'
  original: 川沿いの丘 木陰に座る
  english: Sitting in the shade on the hill along the river.
