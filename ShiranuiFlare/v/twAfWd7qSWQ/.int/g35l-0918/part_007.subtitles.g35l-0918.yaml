    end: '02:06.500'
    original: もえもえキュン！
    english: Moemoe-kyun!
  - start: '02:08.000'
    end: '02:11.000'
    original: 出会って5秒で即出航～！
    english: Meet and five seconds for immediate departure!
  - start: '02:13.000'
    end: '02:15.000'
    original: あー、もう！船長は君たちをそんな子に育てた覚えはありません！
    english: Oh, no, Captain, I don't remember raising you to be like that.
  - start: '02:17.000'
    end: '02:18.000'
    original: 本当にか？ねぇ、だぞ！
    english: Really? Did you?
  - start: '02:19.000'
    end: '02:22.000'
    original: 「座れば地獄、座れば昭和。歩く姿は戦士風」
    english: '"If you sit on the ground, history will walk."'
  - start: '02:25.000'
    end: '02:28.000'
    original: 夢を見よう この船で 後悔なんてさせない
    english: Let's see our dreams on this ship, we'll never let you regret it!
  - start: '02:30.000'
    end: '02:36.000'
    original: キミたちのおかげで私は船長になれるから ミラクル船長だな！撃てーーーっ！
    english: Thanks to you guys, I can be a captain! Miracle Captain! Shoot!
  - start: '02:42.000'
    end: '02:44.000'
    original: 声を上げて最終出航だ
    english: Raise your voice and make it a final voyage!
  - start: '02:45.000'
    end: '02:50.000'
    original: われら保証 最高のコンパス片手に旗を上げ この海をジャックしよっ
    english: Raise the flag in one hand with our guaranteed, ultimate compass, and
      conquer this sea!
  - start: '02:53.500'
    end: '02:57.000'
    original: よぉからついておいで共によぉほよぉ叫ぼう
    english: Come on, follow us, let's shout together, hoy hoy!
  - start: '03:00.000'
    end: '03:07.000'
    original: あぁ最高の日にようこそ我が船へ この昭和の海賊だー！
    english: Welcome to the best days on the pirate ship! This is the pirate's song!
  - start: '03:13.000'
    end: '03:14.000'
    original: それでは行きますよ！ つっこ！やぁそろ！
    english: Here we go! Tsukko! Yorosoro!
  - start: '03:29.000'
    end: '03:32.000'
    original: あぁ、気持ちよかったー！ あ、ちょっとさ、船長のセリフでしょ、最後のは。
    english: Ah, that felt good! Ah, wait a second, Captain's speech at the very end
      was...
  - start: '03:35.000'
    end: '03:37.000'
    original: なんか、やっぱさ、私の船かなって気がしちゃって。 お前、船なんて持ってないんです！
    english: You know, I kinda felt like it was my ship. What? You don't even have
      a ship!
  - start: '03:41.000'
    end: '03:43.000'
    original: ちょっと勘違いしちゃったとは気持ち良くなかった。 それでは行きますよ、しゅっこうー！
    english: You misunderstood, it didn't feel good. Well then, let's go, shukko!
  - start: '03:46.800'
    end: '03:48.000'
    original: しゅっこうー！ 声でけえな、ちょっと。
    english: Shukko! I can't even say it right!
  - start: '03:49.000'
    end: '03:53.000'
    original: いやぁ、船長、おめでとう3周年！ ありがとうございます！ふーっ！うぇーい！
    english: Yeah, congratulations on your third anniversary! Thank you! Whoo!
  - start: '03:54.000'
    end: '03:57.000'
    original: マリンももうすぐじゃん。 あ、そうなんだよね。 すぐそこだからね。
    english: Marine is almost there too. Ah, that's right, yeah. It's right around
      the corner, so...
  - start: '03:57.800'
    end: '04:02.000'
    original: 私たち3期生はみんなね、デビューが近いからね。 3年経ってみて思うけどさ、
    english: We three-period students all have debuts close to each other. Even after
      three years, though, Flare...
  - start: '04:03.500'
    end: '04:09.000'
    original: なんかフレアと最近遠いって感じる。 でも遠くしたのはお前やろ！
    english: It feels like I've drifted far from Flare recently. Well, you're the
      one who made distance, idiot!
  - start: '04:09.500'
    end: '04:11.500'
    original: たしかに。 うるさいし、そんなことないよねえ！
    english: True. Shut up, there's no such thing!
  - start: '04:12.500'
    end: '04:16.500'
    original: 最近ねなんかラミィと仲がいいとかさ、なんか。 なんかいつも声かけてんのって船長ばっかりな気がする。
    english: Lately, it feels like Ramy and the others are closer... You always call
      out to them while it feels like you only ever call out to the captain.
  - start: '04:17.500'
    end: '04:20.000'
    original: え？そんなことないよ！ なんか船長ばっかり声かけてる気がするなぁ。
    english: Eh? No way! It feels like you only ever call out to the captain!
  - start: '04:21.000'
    end: '04:27.000'
    original: でもね、なんかマリンは都合のいい女にしか話しかけないからね。 なにその、やめろやめろ！どういう意味や！
    english: Well, you know, Marine only talks to women who suit her convenience.
      What kind of... stop it, stop it! What's that supposed to mean?
  - start: '04:28.000'
    end: '04:30.500'
    original: 船長、それは本当だ。 それは本当でもいいと。
    english: Captain, well, that's the truth. That's true? Well, that's fine too.
  - start: '04:31.000'
    end: '04:34.000'
    original: 時間がないからね。 あ、はいはい。 そう、あの、ほら、お泊まりの時にさ、
    english: Because you don't have time, right? Yeah, yeah, yeah. So, you know, when
      we went on the tour,
  - start: '04:35.000'
    end: '04:40.000'
    original: あの、アホイをさ、歌ったことがあるんだけどさ、 実は、こんなちゃんと歌ったの初めてだったんだよ。
    english: we sang "Ahoy," and I've sung it before, but actually, this is the first
      time I've sung it this properly.
  - start: '04:40.500'
    end: '04:46.000'
    original: ちゃんとこうやってパートを分けてしっかり。 そうそうそう。で、しかもね、絶対シマバトを真面目に歌わないっていうね。
    english: Yeah, singing it properly with parts separated like this. Yeah, yeah,
      and besides, I never seriously sing Shima-bato.
  - start: '04:47.000'
    end: '04:52.000'
    original: なんか、あの、なんか、あのさ、暇にならないんだよね、どっちも。 座れば地獄のパートの、あの声何ですか、突然。
    english: It's just that neither of us can take it seriously! Flare, the part about
      "Sit on the ground," what is that voice?
  - start: '04:52.500'
    end: '04:59.000'
    original: あの声何やねん！ え、だって、そういうふうに歌ってって、マリンが。 あそこも森戻れよだからねって言ってて。 そう、座れば。
    english: What is that voice?! Well, because I sang it like that, Marine got...
      Ah, that's because I told you to go back to the forest. Yeah, sit on the ground.
  thoughts: null
