    Kronii gives up and says "please", as IRyS clearly wants to be entertained. IRyS gives in and is happy that Kronii gives in. After some more banter about the cage door, IRyS decides to release Kronii and struggles to open the door, claiming she's an angel. Kronii is free and happy to be free.

