  overall_summary: 'This video is Ouro Kronii’s 3D Birthday Live and new outfit reveal
    stream on her hololive channel, titled ''【3D Birthday Live + New Outfit】The Goddess
    Descends #krorigin''. The stream features a theatrical lore-driven storyline where
    Kronii, a celestial time warden and goddess, finds herself trapped in a cage/gazebo
    after breaking heavenly rules out of curiosity for the human world. Throughout
    the concert, Kronii performs striking musical covers and original songs, including
    ''あなぐらぐらし'' (Hole-Dwelling by Kikuo), ''残響散歌'' (Zankyosanka by Aimer), ''ビターチョコデコレーション''
    (Bitter Choco Decoration with IRyS by syudou), ''アイデンティティ'' (Identity by Kanaria),
    her new original song ''Way 2 U'', and duets/appearances with guest artists including
    Tokino Sora and her character illustrator/mama Wada Arco, culminating in a powerful
    duet of ''ギラギラ'' (Gira Gira by Ado) with Wada Arco. The broadcast also includes
    exciting merch and EP announcements.'
