    Kronii, a celestial time warden and goddess, finds herself trapped in a cage/gazebo
    after breaking heavenly rules out of curiosity for the human world. Throughout
    the concert, Kronii performs striking musical covers and original songs, including
    ''あなぐらぐらし'' (Hole-Dwelling by Kikuo), ''残響散歌'' (Zankyosanka by Aimer), ''ビターチョコデコレーション''
