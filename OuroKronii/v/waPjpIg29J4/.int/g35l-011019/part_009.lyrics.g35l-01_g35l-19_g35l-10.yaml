global_summary:
  overall_summary: 'In this 5th Anniversary 3D Live stream titled ''【3D Anniversary
    Live】I Reincarnated As A Villainess?! #kroniisekai'', Ouro Kronii from hololive
    English celebrates her anniversary with a theatrical isekai narrative. Kronii
    is struck by a truck and reincarnated in a gothic castle as a ''villainess'' final
    boss. Throughout the live, she encounters and ''battles'' fellow hololive members
    Gigi Murin, Cecilia Immergreen, Kaela Kovalskia, and Oozora Subaru, while performing
    a diverse setlist of popular vocaloid and J-pop covers including MARETU''s ''Mind
    Brand'', Kikuo''s ''Anagura Gurashi'', Ado''s ''Shou'', Kenshi Yonezu''s ''IRIS
    OUT'', jon-YAKITORY''s ''Konton Boogie'', Eve''s ''Dramaturgy'', Natori''s ''Serenade'',
    and Hoshino Gen''s ''Koi''. Between musical performances, dramatic skit segments
    explore her yearning to be pampered, status screens, and commemorative merchandise
    before she ultimately wakes up from her dream.'
