    english: You, disappearing... I pray this serenade, wishing we could share our
      misery rather than be lonely.
  - start: '00:08.576'
    end: '00:15.016'
    original: 世界よりずっと 何を手放しても これが願いだって これが祈ってって こんな悲しい結末でごめんね
    english: No matter what I let go of, more than the world itself... This is my
