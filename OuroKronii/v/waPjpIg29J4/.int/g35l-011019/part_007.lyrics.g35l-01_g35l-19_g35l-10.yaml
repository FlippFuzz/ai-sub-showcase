  - start: '02:40.000'
    end: '02:45.900'
    original: 裏切りや秘密が漂って ここから動けない
    english: Betrayal and secrets drift about, and I can't move from here.
  - start: '02:46.400'
    end: '02:52.850'
    original: 生まれてしまった あるいは壊れてしまった あの日あの場所で ずっと 止まったままでいた未来
    english: Born, or perhaps broken, at that place on that day—a future that remained
