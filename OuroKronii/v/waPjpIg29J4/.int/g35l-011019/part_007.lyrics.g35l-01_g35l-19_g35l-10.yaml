      love.
  - start: '04:19.300'
    end: '04:25.500'
    original: これだけ願って、これだけ祈って こんな、悲しい結末でごめんね
    english: Wishing this much, praying this much—I'm sorry for such a sad ending.
  - start: '04:26.500'
    end: '04:35.000'
    original: すべて失って、すべて消え去っても ただ、君がずっと生きていた 痛みが欲しい
