  - start: '04:05.500'
    end: '04:16.800'
    original: 希望も不幸も身勝手だ 僕らは、全員共犯者だった 疑う余地もないほど 運命が定まった、あの夜から 僕は愛し方を忘れた
    english: Both hope and misfortune are selfish. We were all accomplices. With no
