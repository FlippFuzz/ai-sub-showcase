  - start: '00:03.550'
    end: '00:07.720'
    original: 僕ら全員無垢でありました いつのまにやら怪物になったんだ
    english: We were all innocent before we knew it, we became monsters.
  - start: '00:07.720'
    end: '00:13.250'
    original: その全てを肯定しないと前に進めないかい
    english: Can we not move forward unless we affirm all of that?
  - start: '00:14.300'
    end: '00:20.950'
    original: 『まあ君にはきっと無理なんだ』 「だから君にはきっと無理なんだ」 いつのまにやら外野にいたんだ
    english: '"Well, it''s bound to be impossible for you." "That''s why it''s bound
      to be impossible for you." Before we knew it, we were on the sidelines.'
  - start: '00:20.950'
    end: '00:26.550'
    original: そんなガヤばっかり飛ばしてきたんだ 皆必死に自分を守って救いの手を待ってるのさ
    english: Throwing around all that jeering chatter, everyone is desperately protecting
      themselves, waiting for a helping hand.
  - start: '00:26.850'
    end: '00:30.350'
    original: 考えたくはないよ 馬鹿になっていたいもん
    english: I don't want to think about it, I just want to be an idiot.
  - start: '00:30.350'
    end: '00:35.550'
    original: ずっと僕は 何者にもなれないで
    english: Forever unable to become anyone at all...
  - start: '00:36.000'
