      serenade.
  - start: '03:47.000'
    end: '03:52.000'
    original: 願い疲れても歌うよ、セレナーデ
    english: Even if I'm tired of wishing, I'll sing a serenade.
  - start: '03:52.700'
    end: '04:04.500'
    original: シナリオ通りのコメディ 不幸自慢はハウメニー？ エゴイスティックに光った瞳の中に映っている 「あなた」は「誰？」 暗闇が光らせた舞台の上で
