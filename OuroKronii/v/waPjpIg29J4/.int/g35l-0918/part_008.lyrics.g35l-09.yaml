    reference_lyrics_og: |-
      光に包まれ 永い時を過ごし
      思い出す事も 多くなったかな
      このミライ あのミライも全て
      奮い起こされて 今が動き出す
      新たなミライへと
      躓けば手を取った
      まだ先は長いんだと
      願ってくれた
      歩み続ける事
      もう何回も もう何回も
      重ね合った音は
      読み込まずとも 深く焼き付いて
      記憶の片隅 既視感(デジャブ)
      想いのシンクロニシティ
      どのミライも離さないで
      今、始めよう
      慈しむ声が 優しいあの歌が
      巡り巡って 愛は伝ってゆく
      感情詞は走り出す
      追いついていくから 追いつかせるから
      熱を帯びて 時を駆けて 君に届け
      交わる今想いのMemory
      覚えてる?
      出逢ってから いつも君が隣に
      ずっと情熱は冷めない 鮮明なまま
      好きな事好きな様に そんな場所だから
      物語は紡ぎ繋がれた
      君とのキセキをLoading
      泣いて笑ったミライ
      手を繋いで歩もう
      これからも
      彩る生命が 創り上げた今が
      不可能を可能に 可能を実現に
      木漏れ日生い茂る青の葉
      君と眺めていた 愛の砂時計
      熱を帯びて 時を駆けて 君に届け
      交わる今キセキのMemory
      ほら 君もさ共に奏でよう
      愛を込めても込めきれないくらい
      麗しい想い 狂おしい程ギュっと
      もっと あと もう ちょっと
      きっと 君のミライになるから
      ヒカリに包まれ 永い時を過ごし
      手に入れた物は 掛け替えの無いmemory
      叫んだ世界(あなた)が 大好きだ
      両手一杯のミライは重なる
      熱を帯びて 時を駆けて 君に届け
      運命は今 ここで
      鳴り響け 願いを 込めて 世界に 届け
      輝く今 ミライのmemory
    reference_lyrics_en: |-
      Wrapped in light, spending a long time,
      I wonder if I've come to remember more things.
      This future, that future, all of them
      Roused up, now things begin to move.
      Toward a new future.
      If I stumbled, you took my hand,
      Wishing that the road ahead was still long,
      Continuing to walk.
      Many times, many times,
      The sounds we layered together
      Are deeply burned in without needing to be loaded.
      A corner of memory, déjà vu,
      Synchronicity of feelings,
      Don't let go of any future,
      Now, let's begin.
      The affectionate voice, the gentle song,
      Revolving and revolving, love is transmitted.
      Emotional words start to run,
      Because I'll catch up, because I'll make you catch up,
      Taking on heat, running through time, reach you.
      Intersecting now, the memory of feelings.
      Do you remember?
      Ever since we met, you've always been by my side,
      Passion never cools down, remaining vivid.
      Doing what you like, the way you like, because it's such a place,
      The story was spun and connected.
      Loading the miracle with you,
      A future of crying and laughing,
      Let's walk holding hands,
      From now on as well.
      The now created by coloring life,
      Making the impossible possible, making the possible a reality,
      Green leaves where sunlight through the trees thrives,
      The hourglass of love we gazed at together,
      Taking on heat, running through time, reach you.
      Intersecting now, the memory of miracles.
      Come on, you too, let's play together,
      To the extent that even with love poured in, it can't be poured enough,
      Beautiful feelings, tightly hugging to the point of madness.
      More, after, just a little more,
      Because it will surely become your future.
      Wrapped in light, spending a long time,
      What I obtained is an irreplaceable memory.
      I shouted, "I love the world (you)!"
      A future filling both hands overlaps,
      Taking on heat, running through time, reach you.
      Destiny is right here now,
      Ring out, put your wish into it, reach the world,
      The shining now, the memory of the future.
