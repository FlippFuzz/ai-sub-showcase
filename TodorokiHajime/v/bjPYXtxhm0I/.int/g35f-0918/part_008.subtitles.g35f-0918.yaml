    It's about the timing, about the nuance, it's about the accurate interpretation of the Japanese and matching them to the timestamps. The whole point is to keep the integrity, and the beauty, of the song. Each line is carefully considered, the timing is precise, the meaning is preserved. Each phrase is carefully dissected, each word is analyzed.

