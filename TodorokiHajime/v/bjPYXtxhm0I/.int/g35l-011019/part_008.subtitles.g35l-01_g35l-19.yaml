  overall_summary: This video is the first birthday 3D live concert of Todo Hajime,
    titled 'First Starring Role' (#轟はじめ生誕祭2025), broadcast on June 7, 2025, from her
    official YouTube channel 'Hajime Ch. 轟はじめ ‐ ReGLOSS'. As the self-proclaimed 'Bancho'
    (gang leader) of hololive DEV_IS's ReGLOSS unit, Hajime delivers an energetic
    performance featuring high-energy dance numbers, vocal covers, and original songs
    like 'Count Up' and 'Deep Dive'. The concert features numerous guest appearances
    and collaborations with fellow VTubers such as Hakos Baelz, Debidebi Debiru, Usada
    Pekora, Koseki Bijou, Fuwawa Abyssgard, Mococo Abyssgard, and Shirogane Noel,
    culminating in a special Odamayo-produced medley, merchandise announcements, and
    celebration of her birthday.
