  overall_summary: This YouTube livestream video features the 3D birthday live concert
    'Rise In Motion' by Hajime Todoroki from Hololive DEV_IS / ReGLOSS, celebrating
    her birthday and 1 million subscriber milestone in 2026. The concert combines
    theatrical sketches, energetic dance performances, and musical collaborations
    with special guests including Hoshimachi Suisei, Hakos Baelz, Riona Isaki, and
    Su Mizumiya. Highlights include the debut of her new 'Budaku Oda' stage costume,
    performances of covers and original tracks like 'BANZAI' and the new single 'Deep
    Dive', and announcements regarding merchandise and a FILA apparel collaboration.
