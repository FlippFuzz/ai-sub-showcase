  original: 最低の技は どうにかちまっちゃってるけど
  english: The lowest tricks somehow got sorted out, but...
- start: '03:11.586'
  end: '03:16.146'
  original: 完成はなの だっての oh oh oh
  english: Perfection? No way, because of that, oh oh oh!
- start: '03:16.146'
  end: '03:20.176'
  original: 愛に持たれた言葉の心拍数
  english: The heartbeat of words carried by love—
- start: '03:20.176'
  end: '03:23.776'
  original: 生きてく春胸は沈んでいく
  english: Living through spring, my chest sinks down...
- start: '03:23.776'
  end: '03:27.506'
  original: かいつまんでもしょうがねえ
  english: Summarizing it won't do any good anyway!
- start: '03:27.506'
  end: '03:30.436'
  original: 浅く浅くお金はどんだけ？
  english: Shallow, shallow, how much money is it?
- start: '03:30.436'
  end: '03:34.226'
  original: ああ孤独だ そんなもんか うるせえ笑え
  english: Ah, so lonely. Is that all? Shut up and laugh!
- start: '03:34.226'
  end: '03:37.796'
  original: 万歳 胸の中の命に 絡まってくのを満たしてくれ
  english: Banzai! Fill the tangling life within my chest...
- start: '03:37.796'
  end: '03:41.526'
  original: 未来を想像 なんかかけない
  english: I can't even picture a future like that!
- start: '03:41.526'
  end: '03:45.346'
  original: くだらないよ魔界物だって
  english: Even if it's some trivial demon thing...
- start: '03:49.726'
  end: '03:53.306'
  original: 半端ものならやれない
  english: If you're half-baked, you can't do it!
- start: '03:57.286'
  end: '04:01.406'
  original: 若い頃になって僕は思い出に
  english: Becoming young, I turn into memories—
- start: '04:09.136'
  end: '04:12.726'
  original: 太陽系です また針底のインベーダー
  english: It's the solar system, another invader at the bottom of the needle...
- start: '04:12.726'
  end: '04:16.596'
  original: 足が止まってる週刊雑誌にそうでも切れてるすか？
  english: My feet are stopped in weekly magazines...
- start: '04:16.596'
  end: '04:20.356'
  original: 野良り暮らり交わすわ 初めましてで神様
  english: Straying and idling by, nice to meet you, God—
- start: '04:20.356'
  end: '04:24.476'
  original: もし救われるのなら晴れ切るは今から
  english: If I'm going to be saved, it clears up starting now!
- start: '04:24.476'
  end: '04:28.166'
  original: 散々 散々 揺らめく
  english: Messy, messy, swaying...
- start: '04:28.166'
  end: '04:31.756'
  original: 織り込んだセーターが 君を狂わせてんだ
  english: The sweater you wove in is driving you mad!
- start: '04:31.756'
  end: '04:35.886'
  original: ああ メトロノーム調子狂うぜ 好き勝手生きて最後もあっぱれ
  english: Ah, the metronome's throwing off its rhythm, living as I please...
- start: '04:35.886'
  end: '04:39.576'
  original: どんだけかんだ そんなもんさ 虚しい笑い
  english: No matter how much I bite, that's just empty laughter...
- start: '04:57.086'
  end: '05:01.348'
  original: 万歳 胸の中の命に 絡まってくのを
  english: Banzai! The tangling life within my chest...
