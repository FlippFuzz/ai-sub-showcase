  thoughts: |+
    **My Thoughts on the Stream**

    Okay, here's what I've got from Todoroki Hajime's live stream. The intro was a bit tough - mostly hype vocals. Let's start with the important details:

    At 00:44.204, I express gratitude, a typical reaction. Then, at 00:45.544, I introduce everyone who made the live possible. It's important to give credit where it's due, you know?

    From 00:51.984, I begin to list the dancers: Yumenyan, Shion Ria, and Umimiyanya. Sora and Miyuki-sensei is our choreographer. Then there is Tappu's Ayaka-sensei, Poppi's Todo-sensei, Dantsu Kantsu's Yuka-sensei, and Pokeru Kantsu's Maria-sensei. And let's not forget our guest performers, Kochimaji's Tsuizen-chan, Hakosuberuzu-chan, Izaki Riona-chan, and Jojimiyazu-chan! Thank you, all.

    At 01:31.474, I show gratitude to the staff working behind the scenes and the audience. And, from 01:44.804, I announce "Deep Dive". This is an important moment, so I want to make sure everyone is aware.

    The MV is releasing right away! That's at 01:53.604. And the audio drops at midnight! At 02:07.414, I want to say "Major Announcement!" Here, have a look! The screen shows "Collaboration Confirmed!! (02:24.500)" and then "Coming Soon!! (02:29.000)".

    At 02:33.431, I'm genuinely thrilled about my collaboration with FILA. I'm really happy, at 02:39.931, to be able to share this. Then, I produced apparel including a tunic, at 02:44.411, and had fun with a casual style. I designed it to be for everyone, at 02:52.561! At 02:58.491, each piece is packed with my personal touches.

    From 03:06.311, I also produced jerseys, T-shirts, and caps! I made a logo with FILA. At 03:23.231, this logo is super cute. We had a great meeting. We hand-drew it and experimented. I thought a Mini Bancho silhouette, at 03:42.691, would be recognizable at a glance.

    The logo will be on the merchandise at 03:51.101. At 03:59.201, other items are coming. At 04:08.011, there's a member encore live at 21:15. At 04:14.371, I'd also like to delve into the new song. Please subscribe, at 04:19.461, to the channel so you can stay in the loop!

    Just a recap, the new MV is right after, at 04:31.111, goods at 21:00, encore live at 21:15, and the audio at 24:00. At 04:46.611, I give my thanks. Finally, at 04:48.741, I say goodbye and give a final goodbye at 04:53.071.


