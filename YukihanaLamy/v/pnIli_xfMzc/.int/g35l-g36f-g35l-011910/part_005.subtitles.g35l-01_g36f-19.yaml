global_summary:
  overall_summary: This YouTube live stream features Hololive 5th Generation VTuber
    Yukihana Lamy's birthday 3D live concert titled '【#雪花ラミィ生誕3ⅮLIVE2026】『 BE BRAVER—
    軌跡の先、光輝の彼方へ —』' held on November 15, 2026. Lamy performs an energetic setlist
    of original and fan-favorite songs including 'Yoppara Music!', 'Lamy's Baribari
    Workout', 'Muteki Honki da Survivor', 'Fleur', 'Baby Don't Stop' with Takane Lui,
    'Ano Hi no Bokura e' with guest performers, 'Bravely Dance' with virtual collaborator
    Aglio Olio e Peperoncino, 'Ashita e no Kyoukaisen' with NePoLaBo, and her new
    single 'Braver'. The stream also features stage tours showcasing her Yukimi-san
    and Daifuku mascots, birthday merchandise announcements, and the major announcement
    of her upcoming 1st album 'Fleur de neige'.
