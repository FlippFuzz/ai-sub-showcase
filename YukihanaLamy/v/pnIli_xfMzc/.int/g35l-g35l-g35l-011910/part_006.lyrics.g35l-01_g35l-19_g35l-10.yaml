global_summary:
  overall_summary: This is the official 3D Birthday Live stream of Hololive 5th Generation
    VTuber Yukihana Lamy titled 'BE BRAVER— 軌跡の先、光輝の彼方へ —' held on November 15, 2026.
    The stream features high-energy musical performances of her original songs and
    covers, including 'よっぱらみゅ～じっく！', 'ラミィズ・バリバリワークアウト', '無敵☆本気だサバイバー！', 'Fleur', 'Baby
    Don't Stop' (with Takane Lui), 'あの日の僕らへ' (with Shirogane Noel and Oozora Subaru),
    'ブレイブリーダンス' (with a VTR message from Aglio Olio e Peperoncino), '明日への境界線', and
    the world premiere of her new original song 'Braver'. Special guest appearances
    by NePoLaBo members (Momosuzu Nene, Omaru Polka, Shishiro Botan) highlight the
    birthday celebration, cake cutting, and major announcements regarding her 1st
    album 'Fleur de neige' and birthday merchandise.
