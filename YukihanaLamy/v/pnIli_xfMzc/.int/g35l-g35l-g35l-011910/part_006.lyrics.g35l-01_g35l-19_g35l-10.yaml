- start: '00:21.811'
  end: '00:26.711'
  original: 気づけないまま救われてた　僕の側にいてくれてた
  english: Before I realized it, I was saved; you were right there by my side.
- start: '00:27.211'
  end: '00:30.011'
  original: 明日はきっと笑えるかな
  english: I wonder if I'll be able to smile tomorrow...
- start: '00:30.411'
  end: '00:37.411'
  original: 手を取り合ってみんなと　きっと色づく未来のこと　空の下で描いてみよう
  english: Holding hands with everyone, let's paint a colorful future beneath the
    open sky.
- start: '00:37.911'
  end: '00:42.511'
  original: 星は今日も綺麗で　君は今日も笑って
  english: The stars are beautiful again today, and you are smiling again today.
- start: '00:43.011'
  end: '00:48.011'
  original: 僕は今日も……
  english: As for me, today too...
- start: '02:02.500'
  end: '02:15.500'
  original: はーい！というわけで、え、ここまで無敵☆本気だサバイバー、Fleur、Baby Don't Stop、あの日の僕らへをお届けいたしました！ありがとうございます！
  english: Ha-i! And with that, um, up to here we've performed "Muteki Honki da Survivor",
    "Fleur", "Baby Don't Stop", and "Ano Hi no Bokura e"! Thank you very much!
- start: '02:16.852'
  end: '02:29.972'
  original: そして皆さん、気付きましたか？無敵☆本気だサバイバーの時に、さっきで、あのMCで言ってたの上の部分がどうなったかちょっと見ていきましょうか！
  english: And everyone, did you notice? During "Muteki Honki da Survivor", what happened
    to the top part that was mentioned in the MC earlier? Let's go take a look!
- start: '02:30.000'
  end: '02:33.000'
  original: お願いします！
  english: Please!
- start: '02:37.432'
  end: '02:44.272'
  original: おーー！祝福のドッキリが出てきた！というねギミックもございました！
  english: Whoaaa! A blessing surprise appeared! There was that gimmick too!
- start: '02:45.372'
  end: '02:46.512'
  original: ありがとうございます、戻してください。
  english: Thank you, please put it back.
- start: '02:54.000'
  end: '03:03.500'
  original: すごいんでしょ、これ。すごくないでしょ？そしてね、去年もいたあいつらと一緒に踊りました！よかった！
  english: Amazing right? Isn't it amazing? And you know, last year those guys were
    here too, we danced together! I'm so glad!
- start: '03:04.000'
  end: '03:16.000'
  original: そしてね、フルールはゴンドラに乗りましたね！ゴンドラすごいね、かわいいでしょ？ゴンドラも。ラミィもかわいいけど、ゴンドラもかわいいでしょ？
  english: And you know, for "Fleur", I rode in a gondola! Gondolas are amazing, aren't
    they cute? The gondola too. Lamy is cute, but the gondola is cute too, right?
- start: '03:17.000'
  end: '03:29.000'
  original: そして、Baby Don't Stop、ルイ姉と久しぶりに歌わせていただきましたよ！いやもうめちゃくちゃ久しぶりだったんだけど、本当に嬉しい！ルイ姉ありがとう！
  english: And, "Baby Don't Stop", I got to sing with Lui-nee for the first time in
    a while! Man, it had been so long, I'm really happy! Thank you, Lui-nee!
- start: '03:33.000'
  end: '03:54.000'
  original: そして、あの日の僕らへ。これね、あの、歌ってたのがラミィとアータンとカナタンの3人でね、あの歌わせていただいてた歌なんですけど、今回はスバちゃんとノエたんが参加して下さいました！ありがとう！
  english: And then, "Ano Hi no Bokura e". This one, um, was originally sung by the
    three of us—Lamy, Botan, and Nene—, but this time Subaru-tan and Noel-tan participated!
    Thank you!
- start: '03:54.500'
  end: '04:08.000'
  original: そして後ろに映っていた映像はブルージャーニーのライブ映像になっておりまして、みんなね、ちょっと懐かしい映像だったんじゃないかなって思います。どの曲もね、ラミィがっつ、もう思い出深い思い出のある曲ばかりなので、こうやってね、みんなにまたお披露目することができてすごくすごく嬉しいです！
  english: And the footage showing in the background was from Blue Journey's live
    concert, so I think it brought back some nostalgic memories for everyone. All
    of these songs hold such deep, memorable feelings for Lamy, so being able to share
    them with everyone once again makes me so, so happy!
- start: '04:23.000'
  end: '04:37.000'
  original: そして、次の曲もラミィがめちゃくちゃ思い出ある曲なんです。みんなにね、ちょっとこれから見せようと思います。みんなちょっと楽しみでしょ？何の曲が来ると思う？
  english: And the next song is also one that holds a huge amount of memories for
    Lamy. I'm going to show it to everyone in just a moment. You're all looking forward
    to it, right? What song do you think is coming?
- start: '04:40.000'
  end: '04:52.000'
  original: うん、うん。あー、違う！あー、違う違う違うよ。な、何の曲が来ると思う？うん。うんうんうんうん。あー、正解！
  english: Yeah, yeah. Ah, wrong! Ah, no no no. W-what song do you think is coming?
    Mhm. Mhm mhm mhm. Ah, correct!
- start: '04:52.500'
  end: '04:59.000'
  original: ということで、その曲をやりに行きましょうか！では、行ってきまーす！
  english: With that said, let's go perform that song! Well then, I'm off!
