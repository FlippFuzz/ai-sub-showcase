global_summary:
  overall_summary: This video is the 3D Birthday Live 2026 stream of Hololive 5th
    Generation VTuber Yukihana Lamy, titled 'BE BRAVER— 軌跡の先、光輝の彼方へ —'. The concert
    features dazzling solo performances of her iconic songs such as 'ラミィズバリバリワークアウト',
    '無敵☆本気だサバイバー！', 'Fleur', and '明日への境界線', as well as powerful collaborative performances
    with guest artists Takane Lui, Oozora Subaru, and Shirogane Noel. It also includes
    a VTR message from Aglio Olio e Peperoncino for 'ブレイブリーダンス', guest MC segments
    with Momosuzu Nene and Shishiro Botan, major announcements regarding her 1st album
    'Fleur de neige' and merchandise, and the world premiere of her brand-new original
    song 'Braver'.
