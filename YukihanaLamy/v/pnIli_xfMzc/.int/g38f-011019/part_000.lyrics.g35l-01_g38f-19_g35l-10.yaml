global_summary:
  overall_summary: This video is the 3D birthday live stream of Hololive 5th Generation
    VTuber Yukihana Lamy, titled 'BE BRAVER — 軌跡の先、光輝の彼方へ —'. Held on November 15,
    2026, the live features energetic musical performances of her original and cover
    songs including 'Yoppara Music', 'Lamy's Baribari Workout', 'Muteki Honki da Survivor',
    'Fleur', 'Baby Don't Stop' (with Takane Lui), 'Ano Hi no Bokura e', 'Bravely Dance'
    (with Ario Olio Peperoncino), 'Ashita e no Kyoukaisen', and her new original song
    'Braver'. Special guest appearances by 5th Generation members Momosuzu Nene, Shishiro
    Botan, and Omaru Polka highlight the stage, alongside major announcements regarding
    her upcoming 1st album 'Fleur de neige', digital single releases, and birthday
    merchandise.
