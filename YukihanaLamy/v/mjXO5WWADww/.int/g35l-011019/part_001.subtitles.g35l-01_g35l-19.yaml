user_context: This is a YouTube video from Lamy Ch. 雪花ラミィ channel. The video title
  is '【#ラミィ生誕3Dヒーローショー】雪花ラミィ生誕３DLIVE『 ホロレンジャー』ゲスト＆告知あり！【 雪花ラミィ /ホロライブ】'.
