global_summary:
  overall_summary: This YouTube livestream features Hololive 5th Generation member
    Yukihana Lamy's 2025 3D Birthday Live, themed around a retro tokusatsu hero show
    titled 'Holoranger'. Lamy embarks on a hero-seeking journey across multiple acts,
    joined by guest performers including Inugami Korone, Kazama Iroha, La+ Darknesss,
    and Hakui Koyori, as well as her NePoLaBo unitmates Momosuzu Nene, Omaru Polka,
    and Shishiro Botan, and 4th Gen's Amane Kanata. The setlist includes classic hero
    and anime opening songs such as Gatchaman, Kinnikuman, Magiranger, and Precure.
    Following a humorous narrative plot where her pet Daifuku undergoes a dark corruption
    due to lack of attention, Lamy and friends purify him with viewer appreciation
    messages. The stream concludes with birthday merchandise announcements and the
    premiere of her new original song and first full-animation music video, 'Muteki
    Honki da Survivor!'.
