  thoughts: |+
    **Merch Announcement & New Song Thoughts**

    Okay, here’s the breakdown of my current thought process for this merch drop and upcoming song. First, the merch: I'm really excited about this stuff. Starting with the poster – it’s a bit smaller to help with shipping costs. You guys know I love posters, and this one is a concert-themed one from the Underworld Live Show, which Yuki-san mama created to be super fun and energetic, so it's a nostalgic item.

    Next, we've got a killer t-shirt designed by Crisalys. It's a high-quality, subtle design of me in Grimoire attire, playing the bass in an antique shop. You'll get knowing looks from fellow quirky folks with this one. I am getting five shirts from Crisalys and I am about to get my sixth.

    Then there’s a Grimoire plushie; you can take her everywhere or do whatever you want. If you squeeze her, she says something. I’m not sure what yet, but you'll know more than me. She's got a cute, huggable design.

    And finally, a wristband! This is a concert and live show staple, meant for my everyday life or shows (even if I’m not playing). I can't wait to see you all wearing them! There's also a voice pack called "Mori Takes a Break" which has Japanese and English versions. Grab the full set because it comes with a foil duplicated stamp on a special postcard.

    If you are fast, you'll get a handwritten autograph, and it might be signed with a pink pen if they let me. The merch is limited so grab it quick. I think the sales period runs for about a month.

    Next up, a new song is coming! The shop opens up in about six minutes. It's gonna be a members-only encore after this too! Please look forward to it. There's a new song coming out that's actually simpler than people are expecting. It feels like an older song in a way but it is also a newer song. I hope you guys like it. The MV is cute too.


...
