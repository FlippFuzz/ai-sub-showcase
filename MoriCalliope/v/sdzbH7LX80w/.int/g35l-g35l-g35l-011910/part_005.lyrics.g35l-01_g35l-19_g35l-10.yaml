global_summary:
  overall_summary: 'This video captures the 3D Birthday Live 2024 of Hololive English
    member Mori Calliope, titled ''【NO DOWN TIME!!】Mori Calliope 3D Birthday Live
    2024 #NODOWNTIME2024'', streamed on April 4, 2024. Staged in a spectacular virtual
    underworld dome, the concert strictly adheres to its ''no downtime'' theme by
    maintaining a relentless, high-energy pace with zero slow interludes. Mori delivers
    powerful solo performances of her original tracks like ''Overkill'' and ''MERA
    MERA'', alongside high-octane covers of hit songs including ''unravel'', ''KICK
    BACK'', ''Zanki'', and ''Roki''. She is joined by special guest performers from
    Hololive English and ID—Ninomae Ina''nis, Ouro Kronii, Hakos Baelz, Kobo Kanaeru,
    and her Myth bandmates—for thrilling duets and group numbers. The event also features
    announcements for her 2024 birthday merchandise collection and her role singing
    the ending theme for the anime ''Suicide Squad Isekai''.'
