    titled 'ARCANA', streamed on the Mori Calliope Ch. hololive channel. Set inside
    a mystical crystal ball stage themed around tarot cards (Arcana), Calli performs
    an energetic setlist of her original songs alongside 12 special guest talents
    from Hololive and beyond, including Houshou Marine, AI, Ookami Mio, Kobo Kanaeru,
    IRyS, Ouro Kronii, and Tomari Mari. The concert blends powerful rap and vocal
    performances with unique tarot-card summoning gimmicks, witty MC segments, and
    exclusive birthday merchandise announcements.
