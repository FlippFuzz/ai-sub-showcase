    reference_lyrics_og: |-
      [Intro: Mori Calliope]
      Oh it’s a fine day to die, ain’t it? Ya deadbeats!
      We interrupt today’s usual broadcast to deliver an exceptionally dire piece of news, that Mori Calliope, underworldian rapper and first apprentice of the grim reaper himself, is on the hunt. Beware! Zombies, humans, and otherwise undead, word on the street is, once she gets hooked on the chase, this reaper can’t be stopped

      [Verse 1: Mori Calliope & Fra]
      It’s always been “Life vs. Me” since the earth stood still
      Cryin’ “Mercy, mercy” as they run for the hills
      Gotcha in my sights and that’s all that it takes
      Watch ya bend to the scythe but call it nature’s mistake
      Fate’s your friend for today, but lock your doors for tonight
      Play pretend that you escaped me ’til I jump you like sike
      In spite of freaks like you, the mood could use a lift
      Was working easily until I felt a graveyard shift
      Hello 死神！「生命なんてチリ紙」ってか？
      Calli is 狩る側なら俺らジェリー
      Even Mr. Saitama never kill us
      そのアブラギッシュな鎌でできるかな？
      腐ってたって鯛 BOOGEY VOXX freshでtight
      Walking deadみたいに詰め寄ってbite (wow)
      テーブルで眠る未払いのbill
      利子までたっぷりいただきに来たってワケさ

      [Pre-Chorus: Ci]
      「お迎え」は NO THANK YOU
      生き返って Let’s go crazy

      [Chorus: Ci & Mori Calliope]
      これは WARNING! WARNING! WARNING!
      アブナイ んじゃない？
      生と死を壊すのアタシたち
      誰もマネできないコトしましょ
      Dead line 飛び越えて笑い歌っちゃう
      Say 橿屍, zombie, 死神, the party killers have arrived
      Can find us hanging by the mausoleum doors living our best lives
      Alright, it’s fine, ’cause all in due time, this scythe’s designed to reach your head
      For now, party down like 気楽に行こう ’til I bury you dead

      [Verse 2: Mori Calliope & Fra]
      (What, you got somethin’ to say?)
      生まれつきの才能が孤独を生むのはご承知の通りだが
      あまりに強い孤独には引力のようなパワー
      さながらたった２本だけの花束の薔薇
      俺らならラクショーで稼ぐ a million dollar
      輪廻すら俺らを中心に据える
      だからいつも自由に生きて自由に死ねる
      四十九日目の judgement
      鼻に脱脂綿
      詰めた undead
      キミの背後でピース
      Cranking tunes in the night? Giving humans a fright?
      Am I losing it? Are un-alivers actually alright?
      Wish ya told me earlier, so tell ya what we should do
      Death is lonelier than hell, so might as well be a crew
      A violent spell to debut, the silent killer plus two
      I got a friend in the undead and suddenly it’s all new
      No more “bones to pick” or skeletons in the closet
      Hunter hanging with the prey, you know she’s finally lost it

      [Pre-Chorus: Ci]
      ひっくり返したら
      死神も UNDEAD!?

      [Chorus: Ci & Mori Calliope]
      これは WARNING! WARNING! WARNING!
      アブナイ んじゃない？
      生と死を壊すのアタシたち
      誰もマネできないコトしましょ
      Dead line 飛び越えて笑い歌っちゃう
      Say 橿屍, zombie, 死神, the party killers have arrived
      Can find us hanging by the mausoleum doors living our best lives
      Alright, it’s fine, ’cause all in due time, this scythe’s designed to reach your head
      For now, party down like 気楽に行こう ’til I bury you dead

      [Bridge: Ci]
      二十一グラムは
      まだ消えちゃいない
      これは
      やっぱり

      [Chorus: Ci & Mori Calliope]
      これは WARNING! WARNING! WARNING!
      アブナイ んじゃない？
      生と死を壊すのアタシたち
      誰もマネできないコトしましょ
      Dead line 飛び越えて笑い歌っちゃう
      Say 橿屍, zombie, 死神, the party killers have arrived
      Can find us hanging by the mausoleum doors living our best lives
      Alright, it’s fine, ’cause all in due time, this scythe’s designed to reach your head
      For now, party down like 気楽に行こう ’til we bury you dead

      [Outro: Mori Calliope]
      Well, I guess exceptions can be made
      (Maybe)
