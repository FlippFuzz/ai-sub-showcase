global_summary:
  overall_summary: In this 5-year anniversary VRChat stream titled 'The Story Thus
    Far', Mori Calliope celebrates five years as a hololive English -Myth- VTuber
    and Reaper apprentice. Wearing a custom 3D outfit designed by Nanoless and modeled
    by Yuli, Calli explores a sprawling, nostalgic custom VRChat world created by
    Seafoam Boy and Maylin. Throughout the journey, she revisits iconic locations
    from her streaming history—including a resort, Bar Mori, a hell temple, a dilapidated
    city, Atlantis, and the original HoloMyth 1st-anniversary bus stop and rooms.
    Along the way, she interacts with fellow HoloEN members (such as Gigi Murin and
    Elizabeth Rose Bloodflame), triggers powerful musical 'flashbacks' to perform
    major songs like 'Flashback', 'Kamouflage', 'Cult Following', 'LET'S JUST CRASH',
    'Live Again', and 'Orpheus', and presents her 5th anniversary merchandise line.
