    detailing her journey as a reaper finding belonging through music, electrifying
    performances of iconic J-Rap covers and original tracks, guest appearances by
    fellow hololive talents (FUWAMOCO, Hakos Baelz) and legendary Japanese rappers
    (Lotus Juice, Pes), and the grand reveal of her brand-new 3D model at a castle
    setting. The stream concludes with merchandise announcements and the premiere
    of her new single 'FLASHBANG' in collaboration with RIP SLYME's Pes.
