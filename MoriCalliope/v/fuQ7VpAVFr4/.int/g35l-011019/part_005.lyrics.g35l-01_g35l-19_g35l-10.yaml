global_summary:
  overall_summary: This is a 3D live concert and mini show by Hololive English virtual
    YouTuber Mori Calliope, celebrating the release of her 3rd major studio album,
    'DISASTERPIECE'. The broadcast features high-energy performances of hit tracks
    from the album including 'Orpheus', 'LET'S JUST CRASH', 'Rivals and Equals', 'Gold
    Unbalance', 'Die For You', 'INSOMNIAC BLACK', 'Shuuden', 'Memento', and 'FLASH
    BANG'. Interspersed between musical sets are engaging MC segments where Mori interacts
    with chat, discusses the album's creation, shares personal stories about her family
    and music career, and showcases cutting-edge 3D stage production and camera work.
