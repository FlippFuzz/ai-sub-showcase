    original: 'Secondly, whilst on thy noble journey, thou mayst come to need a spark
      of aid. If it be so, take one of these amulets: the emblem of a knight to boost
      your strength, the emblem of a samurai to grant you additional dexterity, the
      emblem of a priestess to bestow additional health to thy weary body, and lastly,
      the emblem of a necromancer to grant the additional intelligence. Alas, as fortune
      be a fickle mistress, thou mayst only receive one in a set. I pray thee be granted
      the boon most favorable to thy quest. Or, or you could just purchase them all
      separately if you''re looking to speedrun the experience, I suppose.'
