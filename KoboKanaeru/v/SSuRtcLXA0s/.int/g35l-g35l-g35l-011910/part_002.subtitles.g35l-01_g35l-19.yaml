global_summary:
  overall_summary: This video is Kobo Kanaeru's 3rd Anniversary 3D Live stream on
    the hololive Indonesia channel, titled 'KOBO BABY PARTY !!!! GUGU GAGA BABU BABU
    ???!!!'. The broadcast features a whimsical, baby-themed nursery narrative where
    Kobo is struck by lightning and turned into a baby, leading to a chaotic 'baby
    daycare' hosted by Takanashi Kiara with guest appearances from Himemori Luna,
    Airani Iofifteen, Mori Calliope, and Koseki Bijou. The stream includes acoustic
    guitar performances, group song and dance numbers, a bathroom-themed original
    song solo, merchandise promotion for the 'Cilus' plushie, and a special guest
    musical duet with Indonesian singer Arsy Widianto.
