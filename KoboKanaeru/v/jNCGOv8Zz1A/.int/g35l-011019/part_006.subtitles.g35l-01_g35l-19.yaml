global_summary:
  overall_summary: 'This video is the 3D Birthday Live stream of Kobo Kanaeru from
    Hololive Indonesia, titled ''【3D Live】Let My Voice Enchant You Tonight! #3DKobornDay2025'',
    streamed on December 12, 2025. The stream features Kobo performing a diverse setlist
    of songs—ranging from acoustic guitar tracks and upbeat idol pop to electronic
    dance tunes and emotional ballads—interspersed with comedic skits and guest appearances
    by fellow Hololive talents such as Tokoyami Towa, Himemori Luna, Otonose Kanade,
    Todoroki Hajime, and Houshou Marine. The concert culminates in merchandise announcements
    for her ''Jellyfish Princess'' line and encore performances.'
