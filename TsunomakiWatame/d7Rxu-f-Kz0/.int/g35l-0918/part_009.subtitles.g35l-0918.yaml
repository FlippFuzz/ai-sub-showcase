  thoughts: "**A Year of Reflection and Forward Momentum**\n\nThis past year, it just\
    \ *flew* by, didn't it? I recall appearing on live concerts, inviting Holomem\
    \ for my anniversary stream—truly fun and fulfilling. It was a \"Barely Not Bad\"\
    \ year and full of challenges. There were projects like \"Have a Nice Day.\" I've\
    \ streamed often this year. It felt like a year spent running full speed, and\
    \ I was with all the Watamates, so it was truly fun. I am grateful for the \"\
    Watamates.\" The comments and hearts, they make me happy. It *was* so quick, this\
    \ year!\n\nThough I made fewer original songs this year, the songs are still there.\
    \ \"Yumemiru Hitsuji,\" \"Kimiiro Hanabizuki,\" and that rap version with Calli.\
    \ Four, maybe five songs. Truly, everyone's support has helped me. I worked so\
    \ hard on that English rap, even though I was saying \"No! No way!\" I got to\
    \ write lyrics for many songs. I feel like this was a year of challenges, and\
    \ it made me stronger. I am inspired. \n\nEven after these past three years, I\
    \ still have many dreams to reach. So I will continue. Here's a song I hope to\
    \ inspire you: \"My song.\"\n\n(My mind's eye fills with images from the song):\
    \ Everything that was outside of what I held seemed beautiful. \"That's just how\
    \ it is\" I told myself. A hollow smile that I wore. Yet my pride got in the way,\
    \ right? All my efforts were for nothing. I had enough of it. I heard my voice,\
    \ \"I don't want to run away.\" Even if I stumble, I'll challenge again. Still\
    \ not enough, in the ceaseless rain. \n\nI'll think until I have my own compass,\
    \ and I want to prove it, right? I won't lie to my racing heart. I don't need\
    \ a shield when I'm calm. So I replace it today. A hurdle I must face is in sight.\
    \ Can I find a un-rusting life? I would have given up if I could not. I can sing,\
    \ but I'm not sure if it reaches you. Our reality is cruel. I sing again and I\
    \ give up. Even though it's an example, I loved it so much. Every time I stop,\
    \ I must keep moving forward toward the stars. Let's keep going.\n\n\n\n**Subtitle\
