    original: 皆さんこんばんは！ここで角巻にゅーすのお時間です。
    english: Good evening, everyone! It's time for Tsunomaki News.
  - start: '00:16.749'
    end: '00:23.639'
    original: なんと、この後10時、角巻わためさん活動3周年グッズが販売となります！イェーヘイ！
    english: And guess what? At 10 PM today, Tsunomaki Watame's 3rd Anniversary goods
      go on sale! Yeah-hey!
  - start: '00:24.049'
    end: '00:33.159'
    original: 内容は、アクリルスタンド、グラス、わためいとぬいぐるみ、そしてわためのおうたボリューム2.5の4点セットです。
    english: 'The set includes 4 items: an acrylic stand, a glass, a Watamate plushie,
      and Watame no Uta Vol. 2.5.'
  - start: '00:33.159'
    end: '00:36.569'
    original: まずは、こちらの商品の、アクリルスタンドです。
    english: 'First up is this item: the acrylic stand.'
  - start: '00:36.569'
    end: '01:05.519'
    original: 実は幅野みたいに、わためと一緒におでかけするように作ってあります。イラストは佐倉おりこ先生に書いていただきました！みんなで旅行に行こー！
    english: Actually, it's designed so you can go out together with Watame, like
      on a trip. The illustration was drawn by Orico Sakura-sensei! Let's all go on
      a trip!
  - start: '01:05.519'
    end: '01:13.000'
    original: 続いての商品は、グラスです。たぶん届くのが春以降になると思うんですが、その時にみんながごくごく飲めるように、素敵なちょっと大きめのグラスにしました。
    english: The next item is the glass. It will probably arrive around spring, so
      I made it a nice, slightly larger glass so everyone can drink heartily then.
  - start: '01:13.000'
    end: '01:19.469'
    original: そして3点目！わためいとぬいぐるみ！これ実はわためが欲しかったんだよね（笑）。あれ、画像まだかな？
    english: And the 3rd item! The Watamate plushie! Actually, Watame wanted this
      one. Wait, is the image not up yet?
  - start: '01:20.089'
    end: '01:28.169'
    original: 画像、あ、きたー！めっちゃ可愛い！今日のステージにもいたわためいとそっくりです。めちゃくちゃいーい！
    english: The image, ah, it's here! So cute! It looks just like the Watamates on
      stage today. It's super good!
  - start: '01:28.619'
    end: '01:52.339'
    original: そしてそして、最後にわためのおうたボリューム2.5です。今回はシングルくらいの曲数なので、2.5とさせていただきました！ママいつも本当にありがとー！
    english: And finally, Watame no Uta Vol. 2.5. Since it's about the number of songs
      on a single, we called it 2.5! Mama, thank you so much always!
  - start: '01:52.339'
    end: '01:59.889'
    original: 本日24時から各種音楽サイトでも公開されますので、こちらもチェックをよろしくお願いします！
    english: It will also be released on various music sites starting at midnight
      today, so please check that out too!
  - start: '02:00.679'
    end: '02:18.919'
    original: そして、フルセットをご購入いただいたお客さまにはなんと！角巻わため箔押し複製サイン入りチェキ風ブロマイドカード＋特典ボイスがついてきます！これは買うしかありません！
    english: And for customers who purchase the full set, you get a cheki-style bromide
      card with Tsunomaki Watame's signature + bonus voice! You simply have to buy
      this!
  - start: '02:20.109'
    end: '02:37.039'
    original: ということで、以上が3周年グッズになります。わためいとのことを考えて、少しでも喜んでもらえるように、スタッフさんとかと念入りに打ち合わせをしていいものにしました。ぜひチェックしてください！
    english: So, those are the 3rd anniversary goods. We had thorough meetings with
      the staff to make it into something good so it would make you happy. Please
      check it out!
  - start: '02:37.039'
    end: '02:41.529'
    original: まだ本篇は続きます！そのあとアフターライブもあるから遊びに来てね！
    english: The main show continues! There's also an after-live afterwards, so come
      play!
  - start: '02:41.529'
    end: '02:43.769'
    original: 以上、角巻にゅーすでした！
    english: That's all for Tsunomaki News!
