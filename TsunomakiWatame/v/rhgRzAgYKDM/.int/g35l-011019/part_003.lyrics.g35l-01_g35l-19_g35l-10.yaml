  overall_summary: This video is Tsunomaki Watame's 2025 Birthday 3D Live stream titled
    'Anisong Night Fever!!' hosted on her official YouTube channel 'Watame Ch. 角巻わため'.
    The concert features an energetic setlist of iconic anime songs (anisongs) ranging
    from classics to modern hits, performed solo and in collaboration with fellow
    Hololive VTuber guests including Himemori Luna, Sakura Miko, Tokoyami Towa, Houshou
    Marine, Shirakami Fubuki, Oozora Subaru, Shiranui Flare, Omaru Polka, and Todoroki
    Hajime. Alongside electrifying live performances, band-style numbers, and robot-themed
    dance segments, Watame announces her brand-new original song 'BIRI' (ビリ), showcases
    birthday merchandise, and sets up a post-show members-only encore stream.
