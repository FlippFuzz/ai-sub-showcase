    Okay, so I've got both the Japanese lyrics and a solid English translation for "空色デイズ" (Sorairo Days). I'm treating meg rock as the composer here, even though Shoko Nakagawa performed it originally. This particular version is by 角巻わため (Tsunomaki Watame).

    The lyrics themselves are really speaking to me. I'm feeling that struggle, that initial feeling of being lost in the darkness, of wondering if your voice even matters. It's that feeling of being crushed by aspiration, but then… a turning point. The realization that even those "pointless" feelings are important because they are an experience.

    I'm definitely relating to this idea of almost giving up, never really knowing the true potential. That line about not even knowing "what color the boundless sky was" really resonates. That longing to find your path. The lyrics powerfully express that drive, that internal force that keeps pushing you forward, even when you're uncertain.

