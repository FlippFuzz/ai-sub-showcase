responses:
- subtitles:
  - start: '00:01.320'
    end: '00:03.410'
    original: 本日は
    english: Today,
  - start: '00:03.410'
    end: '00:13.910'
    original: 角巻わためファーストライブ「わためぇ Night Fever!! in Zepp Tokyo」サポートドロードにご来場いただきまして、誠に
    english: thanks to all the wonderful flower stands provided by Bushiroad for Tsunomaki
      Watame's 1st Live "Watame Night Fever!!" in Zepp Tokyo,
  - start: '00:13.910'
    end: '00:16.480'
    original: ありがとうございます！
    english: thank you so much!
  - start: '00:17.390'
    end: '00:29.620'
    original: 記念すべき角巻わためファーストソロライブを楽しみにしてくださっているわためいとの皆さん、本日はどうぞよろしくお願いいたします！
    english: We hope you all enjoy Tsunomaki Watame's long-awaited 1st solo live!
  - start: '00:35.340'
    end: '00:39.110'
    original: さて、公演を最後まで楽しんでいただくために、皆さまへいくつかご案内をさせていただきます。
    english: Now then, to ensure everyone enjoys the concert all the way to the end,
  - start: '00:39.110'
    end: '00:44.200'
    original: させていただきます。
    english: we have a few announcements for you.
  - start: '00:45.190'
    end: '00:54.670'
    original: まず初めに、会場のロビー、客席内ではマスクの着用が必須となります。
    english: First, wearing a mask is mandatory inside the lobby and guest seating
      areas.
  - start: '00:55.750'
    end: '01:03.950'
    original: 公演中の掛け声などは、新型コロナウイルス感染予防の観点からご遠慮ください。
    english: To prevent COVID-19 infection, please refrain from cheering or shouting
      loudly during the performance.
  - start: '01:04.470'
    end: '01:11.450'
    original: ぜひさっきみたいなね、拍手やペンライトなどでの応援をお願いします。
    english: We kindly ask for your support through applause and penlights, as mentioned
      earlier!
  - start: '01:12.430'
    end: '01:23.510'
    original: また、会場内では立って応援していただいても問題ございませんが、周りのお客さまにご迷惑にならないようご配慮お願いいたします。
    english: Also, while standing to cheer inside the venue is permitted, please be
      considerate and avoid causing any inconvenience to surrounding guests.
  - start: '01:24.320'
    end: '01:33.450'
    original: 会場内ではスタッフの方の指示に従ってください。
    english: Please follow the staff's instructions at all times inside the venue.
  - start: '01:29.850'
    end: '01:43.900'
    original: 客席内では周りのお客さまに迷惑をかけるような危険行為はご遠慮ください。会場内では携帯電話、スマートフォンをマナーモードにしていただきますようお願いいたします。
    english: And please ensure cell phones and smartphones are kept in manner mode
      while inside the venue.
  - start: '01:46.470'
    end: '01:53.640'
    original: 本公演は映像配信及び写真撮影用のカメラが会場内に入るため、客席の
    english: Since video recording and photography equipment will be operating inside
      the venue during the performance,
  - start: '01:54.490'
    end: '02:00.670'
    original: お客さまの様子がわためとみんなの様子が映り込む場合がございます。
    english: there may be times when audience members and Watame appear on camera.
  - start: '02:01.380'
    end: '02:10.970'
    original: これらの映像や写真はプロモーションや今後の活動に使用する可能性がありますので、あらかじめご容赦ください。
    english: Please understand in advance that this footage and these photos may be
      used for promotions and future activities.
  - start: '02:11.230'
    end: '02:11.750'
    original: いいよね？
    english: Sound good?
  - start: '02:14.070'
    end: '02:14.650'
    original: いいよね？
    english: Sound good!
  - start: '02:15.010'
    end: '02:18.060'
    original: いいってことだよね？
    english: That means yes!
  - start: '02:18.730'
    end: '02:19.460'
    original: ありがとう！
    english: Thank you!
  - start: '02:20.570'
    end: '02:25.130'
    original: 公演中ライブの様子を撮影することは演出の都合上禁止とさせていただきます。
    english: Please note that photographing the live performance itself is prohibited
      for production reasons.
  - start: '02:28.090'
    end: '02:34.230'
    original: ペンライトは周りのお客さまのご迷惑にならないようご配慮をお願いします。頭の上にだしたり、大きく左右に振り回されますと、後ろのお客さまや周りのお客さまのご迷惑となる場合がございます。
    english: Again, please be careful not to hold penlights too high or wave them
      wildly so as not to disturb those around you.
  - start: '02:45.380'
    end: '02:47.380'
    original: スタッフさんが注意させていただく場合がございますのでご容赦ください。
    english: Please understand that staff may need to caution you if this happens.
  - start: '02:52.260'
    end: '03:04.280'
    original: 以上のことが守られない場合いないと思うんだけど、安全確保のため公演を一時中断もしくは中止させていただくこともございます。
    english: In the event these rules cannot be followed, we may temporarily suspend
      or even cancel the performance to ensure everyone's safety.
  - start: '03:05.470'
    end: '03:14.670'
    original: 最後にご気分の優れない場合など、何かございましたらお早めにお近くのスタッフにお申し付けください。
    english: Lastly, if you are feeling unwell, please notify a nearby staff member
      right away.
  - start: '03:15.070'
    end: '03:17.070'
    original: また、地震などの緊急時にはスタッフが誘導いたします。
    english: In case of emergencies like earthquakes, please follow staff guidance.
  - start: '03:18.000'
    end: '03:22.040'
    original: スタッフの指示があるまでお。
    english: Please follow staff instructions until—
  - start: '03:22.840'
    end: '03:31.980'
    original: あっ、間違えたね！お席にて応援ありがとう！お席にてお待ちください。
    english: Oops, I messed up! Please wait in your seats, and thank you for your
      support!
  - start: '03:33.270'
    end: '03:37.360'
    original: 続いて、配信でご覧のわためいとのみんなへの注意点をお伝えします。
    english: 'Next, important notices for everyone watching the stream:'
  - start: '03:39.990'
    end: '03:46.880'
    original: 本ライブの録音、録画、ミラー配信や違法アップロードは固くお断りいたします。
    english: Recording, filming, mirror broadcasting, or unauthorized uploading of
      this live stream is strictly prohibited.
  - start: '03:48.510'
    end: '03:56.510'
    original: スクリーンショットを撮影して画像とともにSNSに投稿していただくことは大歓迎です！
    english: Taking screenshots and posting them with images on social media is very
      welcome!
  - start: '03:56.510'
    end: '03:58.330'
    original: ぜひお願いします！
    english: Please do!
  - start: '03:59.210'
    end: '04:03.950'
    original: 本公演のハッシュタグは#わためソロライブです。
    english: 'The official hashtag for today''s concert is #わためソロライブ.'
  - start: '04:04.090'
    end: '04:06.660'
    original: ぜひハッシュタグを使ってライブを一緒に盛り上げてください。
    english: Please use the hashtag to hype up the live together!
  - start: '04:08.570'
    end: '04:26.500'
    original: また、ライブ配信についてデータの通信量が多くなることが想定されるため、スマートフォンでご覧になる場合にはWi-Fiでのご利用を推奨いたします。インターネット回線の接続が不安定な場合は配信動画のクオリティを保証できません。
    english: Also, since network traffic for the livestream may be high, we recommend
      using Wi-Fi if you are watching on a smartphone, as unstable internet connections
      can affect stream quality.
  - start: '04:31.780'
    end: '04:47.380'
    original: 万全の準備を行いライブ配信を実施いたしますが、生配信の特性上、不慮の障害で映像の乱れや一時停止等が発生する可能性が御座います。あらかじめご了解ください。
    english: We are preparing as best as we can to deliver a great live stream, but
      due to the nature of live streaming, unforeseen technical difficulties may cause
      stream disruptions or temporary freezes, so we appreciate your understanding.
  - start: '04:48.330'
    end: '04:54.600'
    original: さて、わためからのご案内は、私からのご案内は以上となります。
    english: Well, that's all the announcements from me!
  - start: '04:54.600'
    end: '04:58.230'
    original: 開演まであと少し。私はステージに出る準備をしてきます！
    english: We're almost ready to open! I'll go get ready to take the stage!
  thoughts: null
