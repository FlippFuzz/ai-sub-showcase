global_summary:
  overall_summary: 'This video is the delayed 3D birthday celebration live stream
    of Hololive 4th Generation VTuber Tsunomaki Watame, titled ''【 3DLIVE 】"Anison
    Night Fever 2" / Major Announcements Included! 【 #TsunomakiWatameBirthday2026
    】''. Due to technical difficulties on her actual birthday (June 6, 2026), the
    pre-recorded performances and live MC segments were broadcast on June 24, 2026.
    The concert features a high-energy anime song (anison) setlist spanning iconic
    tracks from Dandadan, Sword Art Online, Yu Yu Hakusho, Oshi no Ko, Kemono Friends,
    and more, performed alongside numerous guest Holomembers. The stream also showcases
    the premiere of her new original song ''Haiiro no Shoumei'' (composed by Kishida
    Kyoudan & The Akeboshi Rockets) and major announcements including her upcoming
    book publication with Poplar-sha and birthday merchandise.'
