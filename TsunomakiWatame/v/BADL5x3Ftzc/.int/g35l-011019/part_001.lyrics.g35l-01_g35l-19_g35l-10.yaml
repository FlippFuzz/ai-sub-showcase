- start: '04:06.020'
  end: '04:13.100'
  original: 一個幸せを数えるたびに 変わっていく未来に怯えて
  english: Every time I count a piece of happiness, growing frightened of the changing
    future.
- start: '04:14.020'
  end: '04:21.020'
  original: しまうけど 愛情の種を大切に育てよう
  english: Yet, let's carefully nurture the seed of love.
- start: '04:22.020'
  end: '04:29.020'
  original: 分厚い雲もやがて突き破るかな
  english: Will it eventually pierce through the thick clouds?
- start: '04:30.020'
  end: '04:35.020'
  original: キミの声が響いた 僕の全身を通って
  english: Your voice echoed, passing through my entire body—
- start: '04:35.100'
  end: '04:40.500'
  original: 心臓のドアをノックしてる
  english: Knocking on the door of my heart.
- start: '04:41.020'
  end: '04:45.500'
  original: 「臆病」でも開けちゃうんだよ
  english: Even if I'm "cowardly", I'll open it anyway.
- start: '04:46.020'
  end: '04:49.500'
  original: 信じたいから 何にもないと思った
  english: Because I want to believe, even when I thought there was nothing.
- start: '04:53.020'
  end: '04:58.500'
  original: はずの足元にいた深く確か...
  english: At my feet where there should've been nothing, reaching deep and certain...
