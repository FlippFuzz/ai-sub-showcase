  original: そして、どどどどどどどどどどん！わため＆わたメイト温感マグカップ！こちらはモタ先生に描きおろしていただきまして、最初は夜の風景なんですけど、あったかいものを入れていただくとその熱を感づいて朝の景色に柄が変わるような仕様になっております！
  english: And next, Watame & Watamate Thermal Mug! This was illustrated by Mota-sensei.
