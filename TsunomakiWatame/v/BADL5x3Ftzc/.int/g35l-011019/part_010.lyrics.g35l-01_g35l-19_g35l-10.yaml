    to the heat and the pattern changes to a morning scenery!
- start: '04:34.349'
  end: '04:47.349'
  original: わための配信を意識してデザインしてもらったので、配信を見ながらぜひあったかい飲み物を飲んでくださいね！そして、まだあります！どどどどどどどどどん！
  english: It was designed with Watame's streams in mind, so please drink a warm drink
