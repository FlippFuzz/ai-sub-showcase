    available for order! Let me introduce the lineup once again! Ta-da-da-da-da-da-da-da!
- start: '03:51.139'
  end: '04:00.329'
  original: ふみママ描きおろしのわためのあったかブランケット、なんとセクシーです！
  english: First is Watame's warm blanket illustrated by Fumi-mama—it's so sexy!
- start: '04:00.329'
  end: '04:14.369'
  original: そして裏面にはわたメイトがいます！丸めるとね、わたメイトの形になりますので2wayでも使えます！ぜひぬくもりを感じてください！
  english: And on the back, there's Watamates! When you roll it up, it turns into
