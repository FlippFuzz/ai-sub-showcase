    **My Thoughts on the "Proof of Grey" Video Segment**

    Okay, here's the rundown, as it all swirls in my mind. First things first: subtitles. Gotta make sure those are precise, following the flow of the song and the announcements.

    This whole thing starts with a performance of "Proof of Grey" by Tsunomaki Watame, with music by Kishida Kyoudan & THE Akeboshi Rockets.  The timecodes are key here, so here's how I see it all. I can't expect some idealized victory, nor do I want flashy success; it's about being true to myself. I know history's written by the victors, but it's the memories that count. The raw emotion of that moment – diving into it, letting my feelings paint the grey sky.

    The song's lyrics reflect a feeling of overcoming pain, burning with no regrets, as if driving my very being forward, and what started small, doesn't matter now. I can feel the push, to stretch out, to go. Reality is indeed cruel, but giving up wasn't an option. I'll ignite that grey sky, to prove I was here. I'm taking the whole performance in and then it's time for the talking.

    The song ends, the crowd roars and it's time to speak. I feel such relief and joy! To finally reveal “Proof of Grey”... and to have *finally* proven myself! Thank you to everyone for listening! I worked with Kishida Kyoudan & THE Akeboshi Rockets on this track, aiming for a cheer song, and wanting something that could help motivate everyone in any scenario, and the feeling, the passion, the coolness just all came together! It's about getting back up after setbacks.

    This track is now special to me. I hope you feel the same way, too! I hope my audience will check out the music video and purchase the song too, of course! My goal, is a 3rd solo live concert!

    Oh, and there's another announcement! "Tsunomaki Watame's Have a nice day" is becoming a book, yay! The book will be published by Poplar Publishing, famous for "Kaiketsu Zorori" and "Butt Detective". It's set to come out in December with original merch, that will be so exciting to share!

    Also, it's that time of year! The birthday merch is open for pre-orders! Let me share the lineup! I've got this cozy blanket, illustrated by Fumi-mama. Look how sexy! It has a Watamate on the back, and when it's rolled up, it's in the shape of a Watamate!

    There's also a thermal mug, illustrated by Mota-sensei. The design changes from a night scene to a morning scene when you pour in something warm! The design had my streaming in mind. Please be sure to enjoy a hot drink while watching the streams!

    Then we have the Watamate cushion! It's cute enough to use as a cushion or to display as a decoration.


