    english: '[Title: BIG Glasses Stand Acrylic Stand]! Isn''t this just way too cute?
      You can even put Watame''s cosplay sunglasses on it. Of course, you can also
      put regular glasses on it, so how about getting one, two, or three for your
      household? This illustration was newly drawn by Fuumi-sensei! Fuumi-mama, thank
      you as always! The illustration is so adorable that just having it there looks
      like it would heal your soul.'
  - start: '02:54.671'
    end: '03:30.411'
    original: '[Title: ノート＆ペン]！小田沙耶佳先生描き下ろしのA6サイズノートです！いやこれも可愛いな。小田先生がキャラクターデザインを担当されているゲームがわため大好きでして過去にもわためのグッズで描いていただいたことがあるんですが今回も心良く4種類のわためを描いて下さいました！ペンの方はクリックをするたびにわためのセリフやわためいとの表情が変わる仕様になっているのでその時の気分に合わせてクリックしてみてください！いっぱい使ってね！'
    english: '[Title: Notebook & Pen]! An A6-size notebook newly illustrated by Sayaka
      Oda! Oh, this is cute too. Watame loves the game for which Oda-sensei is in
      charge of character design, and she has drawn goods for Watame in the past as
      well, but this time too, she cheerfully drew four different kinds of Watame!
      The pen is designed so that every time you click it, Watame''s lines or Watamate''s
      facial expressions change, so try clicking it to match your mood at the time!
      Use it a lot, okay?'
  - start: '03:30.821'
    end: '03:52.871'
    original: '[Title: わためナンバーワンタンブラー]！おしゃれなデザインそして温かいのも冷たいのもいけちゃいます！もちろん蓋もついています！つまり最強ということです！みんなこのタンブラーでわためとおそろっちしましょう！'
    english: '[Title: Watame Number One Tumbler]! A stylish design, and it keeps things
      hot or cold! Of course, a lid is included too! That means it''s the ultimate
      item! Everyone, let''s match with Watame using this tumbler!'
  - start: '03:53.941'
    end: '04:07.131'
    original: そしてフルセットをご購入いただいた方には角巻わため直筆複製サイン＆メッセージ入りのハート型ダイカットポストカードと特典ボイスがついてきます！ぜひフルセットで手に入れてください！
    english: And for those who purchase the full set, a heart-shaped die-cut postcard
      with Watame's replicated handwritten autograph and message, along with bonus
      voice content, will be included! Please be sure to get the full set!
  - start: '04:07.641'
    end: '04:39.111'
    original: 'いやここまで堂々っどと告知をさせていただきましたが、えまとめるとこのあとの[Title: Now on step]のMVが上がります。そして角巻わため4周年記念グッズ販売開始します。そしてそのあとえメン限ライブがあります。さらに24時からは[Title:
      Now on step]の楽曲配信があります。こんな感じかな？見落としてないかな？あとライブも来年あります！という感じです。'
    english: 'Whew, I''ve made all these announcements proudly and boldly. To summarize:
      right after this, the MV for [Title: Now on step] will be released. Then, Tsunomaki
      Watame 4th anniversary merchandise sales will begin. After that, um, there''s
      a members-only live stream. Furthermore, starting at midnight, the song release
      for [Title: Now on step] will be available. Is that about it? Did I miss anything?
      Also, the live concert is coming up next year! That''s about it.'
  - start: '04:39.691'
    end: '05:00.019'
    original: いやこれからもね嬉しいこととかみんなも喜んでくれるようなことをたくさん共有していけるように頑張っていきたいと思っているので5年目も一緒に歩いてくれると嬉しいです。これからもよろしく！楽しいことはまだまだ終わらねぇ！
    english: I want to keep doing my best to share many happy things and things that
      make you all happy from now on, so I'd be so glad if you'd walk alongside me
      into our 5th year. Thank you for your continued support! The fun is far from
      over!
