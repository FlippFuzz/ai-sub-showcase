    a series of vibrant solo tracks and spectacular duet/group collaborations with
    Hololive guests including Bakatare Circus (Shirakami Fubuki, Shiranui Flare, Omaru
    Polka), Shishiro Botan, Ceres Fauna, Roboco, Houshou Marine, and Oozora Subaru.
    The stream includes the unveiling of Watame's new 3D sporty stage costume with
    transformable jackets and high ponytails, the debut performances of new original
    songs like 'WataMeister' and 'Now on step', and major announcements regarding
    her 2nd solo live at Tokyo Garden Theater, bookstore collaboration campaigns,
    and 4th anniversary merchandise.
