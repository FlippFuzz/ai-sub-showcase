  original: もう ちょっとだけの自分も一歩が踏み出せない
  english: You can't even take a single step as your usual small self.
- start: '02:14.800'
  end: '02:20.400'
  original: そういえばおっけーだった 逃げていられた
  english: Come to think of it, it was fine just running away.
- start: '02:20.900'
  end: '02:27.700'
  original: でも 君が笑って それでもいいとう言うんだったら
  english: But if you smile and tell me even that is okay,
- start: '02:27.900'
  end: '02:34.400'
  original: 恥ずかしいところとか ダメダメなところとか 見せたくなくなっちゃうでしょ
  english: Then you wouldn't want to show your embarrassing or pathetic sides anymore,
    right?
- start: '02:34.800'
  end: '02:42.500'
  original: どんな時も前を向いて歌っていたい ほら凹んで泣いて辛い時も 強がってるけど平気だよ
  english: No matter what, I want to keep facing forward and singing. Even when I'm
    feeling down, crying, and struggling, and putting up a brave front saying I'm
    fine,
- start: '02:46.000'
  end: '02:52.500'
  original: きっと君のためならできること 涙も大嫌いにばらまいて 弱くたって虹は呼び出せるよ
  english: I know I can do it for your sake. Scattering my tears away even though
    I hate them, even if I'm weak, I can summon a rainbow!
- start: '02:56.000'
  end: '03:02.500'
  original: 明日も多分僕次第で 今日よりも輝いてく
  english: Tomorrow too, probably depending on me, will shine even brighter than today.
- start: '03:16.500'
  end: '03:22.200'
  original: ねえ おはようの後なんだか気分がいい
  english: Hey, somehow I'm in a good mood after morning.
- start: '03:22.800'
  end: '03:29.000'
  original: もう 繰り返しとかないそう思えるよ
  english: I feel like I won't just repeat the same things anymore.
- start: '03:29.800'
  end: '03:36.200'
  original: 意外と怖くないね あくまで個人の感想です
  english: It's surprisingly not that scary, right? That's just my personal opinion.
- start: '03:36.500'
  end: '03:43.800'
  original: 褒められた力とか 見たことない奇跡とか そんなのもっとしちゃってもかも
  english: Praise you received, unprecedented miracles... wouldn't it be great to
    have even more of those?
- start: '03:45.000'
  end: '03:50.500'
  original: 酔いで僕らは変わる 合図は君に出してほしい
  english: We change in an instant, I want you to give me the signal.
- start: '03:51.000'
  end: '03:57.000'
  original: 大冒険する準備なら ちゃんと君の分まで空いたよ
  english: If you're getting ready for a grand adventure, I've saved a spot just for
    you.
