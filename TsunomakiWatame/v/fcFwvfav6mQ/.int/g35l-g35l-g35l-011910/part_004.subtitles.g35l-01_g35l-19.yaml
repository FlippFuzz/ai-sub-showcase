  overall_summary: This YouTube 3D birthday live stream titled 'Revival' features
    Hololive 4th-generation virtual singer Tsunomaki Watame celebrating her 8th birthday
    (in sheep lore). Accompanied by multiple guest stars—including Shigure Ui, Yuzuki
    Choco, Himemori Luna, Nanashi Mumei, Shishiro Botan, Hakos Baelz, and Moona Hoshinova—Watame
    delivers a diverse 12-song setlist ranging from dark atmospheric rock and anime
    covers to dynamic duets. The stream concludes with major announcements for her
    new heavy metal-inspired original single 'Revival' and the companion track 'mayday,
    mayday feat. Mori Calliope,' alongside an introduction of her 2024 birthday merchandise
    lineup.
