  original: 確かに感じる今君がそこにいること
  english: I can truly feel that you are right there now.
- start: '01:59.040'
  end: '02:08.760'
  original: 名前も顔も分からない君さようならしてしまえば終わりだ
  english: If we were to say goodbye to someone whose name and face we don't know,
    it would all be over.
- start: '02:09.180'
  end: '02:18.420'
  original: 君がいなきゃ穴は大きくなる構わないさすぐ埋まる
  english: Without you, the emptiness grows larger... but that's fine, it will soon
    be filled.
- start: '02:21.840'
  end: '02:31.960'
  original: 世界中 ああ 愛のどこかにいる君はどこ？
  english: Where are you, who are somewhere in this world... ah, within love's embrace?
- start: '02:32.220'
  end: '02:41.760'
  original: 今 ああ ここにいるよ 私
  english: Right now... ah, I am right here, myself.
- start: '02:42.360'
  end: '02:51.640'
  original: 当たり前一面真っ黒な世界真っ逆さまに落ちていく
  english: Falling headfirst into a world that is pitch black by default...
- start: '02:51.860'
  end: '03:02.160'
  original: 無意味だからこの世界には忘れられ記憶の辻褄を今の君の元手行く
  english: Because it's meaningless, this world... I trace back forgotten memories,
    heading towards you right now.
- start: '03:12.100'
  end: '03:22.040'
  original: 世界中 ああ 愛のどこかにいる君のため
  english: For you, who are somewhere in this world... ah, within love's embrace,
- start: '03:22.180'
  end: '03:32.480'
  original: 今 ああ 生きていくよ 私 無意味のまま
  english: right now... ah, I will keep living... just as I am, meaningless.
