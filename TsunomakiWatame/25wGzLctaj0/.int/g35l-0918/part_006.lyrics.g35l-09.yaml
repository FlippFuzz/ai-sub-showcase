    reference_lyrics_og: |-
      ダメダメよ
      右から左へと言葉が流れる
      退屈そうな顔 画面見つめる君
      次元の壁越えていつでも逢いに行く
      心の準備をちゃんとしておいてね
      君のこと誰よりも分かってる
      だから私に任せて
      怖がらないで二人で踊りましょう
      ルカルカナイトフィーバー
      はじけるリズムに合わせて
      嫌なこと何もかも全部忘れて
      ルカルカナイトフィーバー
      私はここに居るから
      少しでも視線を逸らしちゃダメダメよ

      重くて見れない日 兄貴に釣られた日
      心で呼んでみて すぐに飛んで行くわ
      授業では教わらないことを
      君に教えてあげるわ
      夜の扉を二人で開きましょう
      ルカルカナイトフィーバー
      あふれる想いはFor you
      限りあるこの時を胸に刻んで
      ルカルカナイトフィーバー
      日が昇ればサヨナラ
      寂しそうなそんな目されてもダメだから

      君のこと誰よりも分かってる
      だから全てを晒して
      生まれた意味を二人で見つけましょう
      ルカルカナイトフィーバー
      高まる鼓動を感じて
      さあ覚悟できたらこの手をとって
      ルカルカナイトフィーバー
      輝く君が好きなのか
      全力で飛び出そう 用意はいいかしら？
      ルカルカナイトフィーバー
      はじけるリズムに合わせて
      嫌なこと何もかも全部忘れて
      ルカルカナイトフィーバー
      私はここに居るから
      少しでも視線を逸らしちゃダメダメよ
      ダメダメよ
    reference_lyrics_en: |-
      No no no
      Words flow from right to left
      You, staring at the screen with a bored expression
      I'll cross the dimensional wall to see you anytime
      Be sure to prepare your heart for it
      I know you better than anyone else
      So leave it to me
      Don't be afraid, let's dance together
      Luka Luka Night Fever
      Match the popping rhythm
      Forget all the bad things completely
      Luka Luka Night Fever
      Because I'm right here
      Don't look away even for a second, no no no

      When it's too heavy to watch, when you get hooked by Aniki
      Call me in your heart, I'll fly right to you
      Things you won't learn in class
      I will teach you
      Let's open the door to the night together
      Luka Luka Night Fever
      Overflowing feelings are For you
      Engrave this limited time in your heart
      Luka Luka Night Fever
      When the sun rises, it's goodbye
      Even if you make such a lonely expression, I can't do that

      I know you better than anyone else
      So expose everything
      Let's find the meaning of being born together
      Luka Luka Night Fever
      Feel the rising heartbeat
      Now, if you're prepared, take this hand
      Luka Luka Night Fever
      I love you shining bright
      Let's jump out with all our might, are you ready?
      Luka Luka Night Fever
      Match the popping rhythm
      Forget all the bad things completely
      Luka Luka Night Fever
      Because I'm right here
      Don't look away even for a second, no no no
      No no no
