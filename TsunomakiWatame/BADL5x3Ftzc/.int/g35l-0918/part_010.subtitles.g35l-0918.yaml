    english: but memory isn't bound by that.
  - start: '00:18.528'
    end: '00:26.548'
    original: 今この時だけは決断的な刹那性に飛び込んでけ
    english: Right now, in this moment, dive into decisive ephemerality!
  - start: '00:26.868'
    end: '00:30.948'
    original: 灰色なしで描く“私”の思いが
    english: The feelings of "me" painted without gray
  - start: '00:31.968'
    end: '00:36.148'
    original: 美しき痛みをも乗り越えてかき換えてく
    english: surpass even the beautiful pain and rewrite it.
  - start: '00:36.468'
    end: '00:40.488'
    original: 後悔は1ミリもないあるのは灼熱だけ
    english: There is not a millimeter of regret, only burning heat.
  - start: '00:41.048'
    end: '00:45.328'
    original: ただ自分の生命を蹴り上げるように
    english: As if kicking up my own life.
  - start: '00:46.688'
    end: '00:50.088'
    original: 始まりは些細 最早どうだっていい
    english: The beginning was trivial; it doesn't matter anymore.
  - start: '00:50.568'
    end: '00:54.348'
    original: 突き動かされた指先を伸ばす
    english: I extend my driven fingertips.
  - start: '01:04.388'
    end: '01:08.528'
    original: 現実とは残酷だと気付いていないわけじゃない
    english: It's not that I don't realize reality is cruel,
  - start: '01:08.808'
    end: '01:12.728'
    original: 諦めるその時は今ではなかったらしい
    english: it seems the time to give up wasn't now.
  - start: '01:13.248'
    end: '01:16.508'
    original: 灰色の空描くもう一度点火して
    english: Paint the gray sky, ignite once more,
  - start: '01:18.068'
    end: '01:21.848'
    original: ただ自分の生命を証明しよう
    english: just to prove my own life
  - start: '01:22.068'
    end: '01:25.568'
    original: そこにいた事を刻むように
    english: as if carving the fact that I was there.
  - start: '01:55.704'
    end: '01:57.244'
    original: はーい！
    english: Hi!
  - start: '01:57.544'
    end: '02:00.644'
    original: ってことで、新曲『灰色の証明』
    english: So, my new song, "Haiiro no Shoumei,"
  - start: '02:00.864'
    end: '02:06.184'
    original: やっと！披露できた！やっと初披露できた！
    english: was finally performed! Finally performed for the first time!
  - start: '02:06.424'
    end: '02:09.524'
    original: 聞いてくれてありがとうございます！
    english: Thank you so much for listening!
  - start: '02:10.024'
    end: '02:15.944'
    original: この楽曲は岸田教団&THE明星ロケッツのみなさんに制作していただきまして、
    english: This song was produced by Kishida Kyoudan & THE Akeboshi Rockets,
  - start: '02:15.944'
    end: '02:29.344'
    original: スポーツだったりみんなが頑張りたい時に力になれるような応援ソングを作りたいと思い色々語ったらかなり熱くてかっこいい楽曲に仕上がりました！
    english: and when I talked about wanting to make an uplifting song for sports
      or when everyone wants to do their best, it turned out to be a really passionate
      and cool track!
  - start: '02:29.844'
    end: '02:39.984'
    original: うまくいかないことがあってもまた立ち上がって前に進む私にとっても背中を押してくれるそんな特別な楽曲になりました！
    english: Even when things don't go well, standing back up and moving forward—it
      became such a special song that pushes my back too!
  - start: '02:40.000'
    end: '02:45.300'
    original: みんなにとってもそうだったら嬉しいです。
    english: I'd be so happy if it's the same for all of you.
  - start: '02:45.720'
    end: '02:55.300'
    original: こちらの新曲MVいっぱい見て、楽曲もぜひ購入して、わための音楽を応援していただけたらとっても嬉しいです！
    english: I'd be so happy if you watch the new music video a lot, purchase the
      song, and support Watame's music!
  - start: '02:55.520'
    end: '02:58.740'
    original: 目指せ3rdライブ！
    english: Aim for the 3rd live!
  - start: '02:58.740'
    end: '03:00.120'
