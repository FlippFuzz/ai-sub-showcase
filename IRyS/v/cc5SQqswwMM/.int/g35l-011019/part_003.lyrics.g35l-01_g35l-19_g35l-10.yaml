- start: '01:49.880'
  end: '02:10.120'
  original: 神話は続く 真の 世界を
  english: The myth continues... into the true world...
- start: '02:31.000'
  end: '02:37.520'
  original: 暗い灰少しの中で 私は生まれてきたんだ
  english: Born within a little dark ash...
- start: '02:37.820'
  end: '02:42.800'
  original: 偶然の代償 払い報いよう なお泣き 怪物
  english: Paying the price of coincidence, crying out in retribution, monster.
- start: '02:53.660'
  end: '03:00.600'
  original: 黒い雨降らせこの空 私は望まれないもの
  english: Let black rain fall upon this sky, I am something unwanted.
- start: '03:00.820'
  end: '03:08.520'
  original: ひび割れたレンズで愛す どうせお仕置きをさあ今
  english: Loving through a cracked lens, now is the time for a fitting punishment!
- start: '03:08.820'
  end: '03:16.480'
  original: 震える世紀を消せない 傷跡抱き締めてこの体を受け入れ 共に行こう
  english: Embracing scars of a trembling century that cannot be erased, let's accept
    this body and go together.
- start: '03:16.820'
  end: '03:20.120'
  original: 名前のない怪物
  english: Monster without a name...
- start: '03:55.000'
  end: '03:57.800'
  original: 太陽曰く燃えよカオス
  english: Crawling Chaos!
- start: '04:05.100'
  end: '04:11.360'
  original: カッタルンルンルン 一狂の神々 私もあなたも怖がりな物好き
  english: Slacking off, a gathering of mad gods. You and I are both scaredy-cats
    who love thrills.
- start: '04:12.160'
  end: '04:18.300'
  original: 形ムルムル 一京都逃げれば 私とあなたは炎天下で逢瀬だ
  english: If we slip away together, you and I will have a tryst under the blazing
    sun!
- start: '04:19.080'
  end: '04:24.460'
  original: 楽しいね焼けるぞ溶けるぞ 生き物じゃない
  english: It's fun, we're burning, we're melting, we're not living creatures!
- start: '04:24.960'
  end: '04:29.000'
  original: 無垢のヒヤヒヤ それでも好きです 私がいちばん
  english: Innocent and nervous, yet I still love it most.
- start: '04:29.620'
  end: '04:35.320'
  original: 欲しいのは内緒よ 十番パヤパヤ それで行きましょう
  english: What I want is a secret. Yay yay, let's go with that!
- start: '04:35.740'
  end: '04:41.400'
  original: 私にいちばん 似合わない不条理 鏡には
  english: The absurdity that least suits me... in the mirror...
- start: '04:42.100'
  end: '04:43.620'
  original: 誰なの?
  english: Who is that?
- start: '04:43.900'
  end: '04:45.360'
  original: うつらない
  english: It doesn't show!
- start: '04:45.480'
  end: '04:46.400'
  original: 誰なんだ
  english: Who on earth is it?
- start: '04:46.400'
  end: '04:49.080'
  original: 嫌だ嫌だ 欲望は言葉にしなくちゃ
  english: No way, no way! Desires must be put into words!
- start: '04:49.520'
  end: '04:52.480'
  original: ほら消えちゃうでしょ
  english: Look, they'll disappear, won't they?
- start: '04:52.620'
  end: '05:00.000'
  original: 太陽なんかまぶしくって 闇のほうが無限で
  english: The sun is too dazzling, the darkness is infinite!
