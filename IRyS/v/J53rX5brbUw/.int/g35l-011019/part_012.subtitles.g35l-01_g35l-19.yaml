    celebrating her 2026 birthday with a high-energy 3D live concert titled 'Racing
    Towards Hope'. The stream showcases her new race queen 3D outfit, guest performances
    with fellow Hololive members (Nekomata Okayu, Fuwawa Abyssgard, Mococo Abyssgard,
    Aki Rosenthal, Hakos Baelz, and Ouro Kronii), multiple vocal tracks spanning eurobeat
    and pop genres, major merchandise announcements, her very first full album 'DANGERyS',
    and the announcement of her first solo live concert in Tokyo at SGC Hall Ariake.
