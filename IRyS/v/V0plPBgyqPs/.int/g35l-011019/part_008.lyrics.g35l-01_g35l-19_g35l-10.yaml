global_summary:
  overall_summary: This is IRyS' 2025 3D Birthday Live concert titled 'HOPE UPON A
    STAR' hosted on her official YouTube channel under hololive English. The concert
    embraces a retro dance and Eurobeat musical theme, featuring dynamic solo performances,
    special duet and group collaborations with various hololive talents (Ninomae Ina'nis,
    Shiranui Flare, Takanashi Kiara, Himemori Luna, Inugami Korone, Momosuzu Nene,
    Shishiro Botan, Ouro Kronii, and Koseki Bijou), and legendary rapper MOTSU. Alongside
    electrifying musical stages, IRyS showcases her new 6fes concert outfit, announces
    official birthday merchandise including posters, T-shirts, backpacks, and plushie
    keychains, and reveals her upcoming Eurobeat and dance EP titled 'YaBAI' releasing
    in July.
