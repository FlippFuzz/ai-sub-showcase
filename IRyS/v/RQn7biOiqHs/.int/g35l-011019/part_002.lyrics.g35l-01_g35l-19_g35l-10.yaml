global_summary:
  overall_summary: This YouTube video features IRyS from hololive English celebrating
    her 3rd anniversary with a spectacular 3D live concert titled 'The Devil Wears
    Hope'. Spanning dual angelic and demonic stages, IRyS performs an eclectic setlist
    of solos and duets/group songs with guest talents from hololive and holohololive
    EN including Tsunomaki Watame, Mori Calliope, Shiranui Flare, Tokoyami Towa, Usada
    Pekora, Hakos Baelz, Ouro Kronii, Nanashi Mumei, and Ceres Fauna. The concert
    concludes with a major announcement for her new original song 'Twilight' and a
    live performance of the track.
