  - start: '01:06.000'
    end: '01:08.800'
    original: ごまかすな！/ ごまかせないですよ！
    english: Don't play it off! / You can't fool us!
  - start: '01:10.200'
    end: '01:13.000'
    original: いいじゃん素直に「メンバー大好き」って言ったって！
    english: Why not just honestly say "I love the members"?
  - start: '01:13.500'
    end: '01:17.500'
    original: やめてよ！恥ずかしい！
    english: Stop it! It's embarrassing!
  - start: '01:18.000'
    end: '01:21.000'
    original: それをさ、みんなでこういじってたのに...
    english: And we were all teasing her about it...
  - start: '01:21.500'
    end: '01:26.200'
    original: ここ来てみんなの笑顔を見たらさ、ちょっとみんなうるっと来ちゃって...
    english: But coming out here and seeing everyone's smiles, we all got a bit teary-eyed...
  - start: '01:26.500'
    end: '01:29.800'
    original: 始まる前はさ、みんななんかもうこんなんで待ってたのに...
    english: Before it started, everyone was waiting like this...
  - start: '01:30.000'
    end: '01:35.800'
    original: 自己紹介始まった瞬間、めっちゃ笑顔になって...
    english: The moment introductions started, everyone had huge smiles...
  - start: '01:36.000'
    end: '01:41.800'
    original: みんなのね、なんか声とか音とかがすごくて、みんな泣いてた！
    english: Everyone's cheers and noise were so amazing, everyone was crying!
  - start: '01:42.000'
    end: '01:46.000'
    original: そう！うるっと来て、でも「やらなきゃ！」ってやったんだよね！
    english: Yeah! We got teary-eyed, but were like "We gotta do this!" and did it!
  - start: '01:46.500'
    end: '01:48.500'
    original: やらないといけないよね！
    english: We have to do this!
  - start: '01:49.000'
    end: '01:51.000'
    original: もう今日はかまさないといけないよね！
    english: We gotta crush it today!
  - start: '01:51.500'
    end: '01:56.000'
    original: でも1曲目はかませたんじゃないか？かませてたー？
    english: But didn't we crush the first song? Did we crush it?
  - start: '01:59.500'
    end: '02:03.200'
    original: ちょっとさ、最初の曲のメドレーのさ、タイトル言っといてよ！
    english: Hey, say the title of that first medley!
  - start: '02:03.500'
    end: '02:07.500'
    original: ちょっと待って！これ読める？かっこよく言えるよ！
    english: Wait a sec! Can you read this? I can say it coolly!
  - start: '02:08.000'
    end: '02:10.000'
    original: 頼むわ！代表して！お願いします！
    english: Please! On our behalf! Please!
  - start: '02:10.500'
    end: '02:14.800'
    original: みんな、場内X（旧Twitter）でみんな知ってるよね！
    english: Everyone knows from X (formerly Twitter) in the venue, right?
  - start: '02:16.500'
    end: '02:19.800'
    original: 今日のための特別タイトルあんだから！
    english: There's a special title for today!
  - start: '02:20.000'
    end: '02:22.000'
    original: そうなのよ！件名だから！
    english: That's right! Because it's a subject line!
  - start: '02:22.500'
    end: '02:24.500'
    original: いくぜ！
    english: Here I go!
  - start: '02:25.000'
    end: '02:31.500'
    original: 場内X（旧Twitter） Extended Remix みんなの必殺技詰め込んでみましたバージョン！
    english: 'Venue X (formerly Twitter) Extended Remix: Packed with Everyone''s Special
      Moves Version!'
  - start: '02:35.000'
    end: '02:37.500'
    original: そのまんまなのよ！無理やりじゃない？
    english: It's so literal! Isn't that forced?
  - start: '02:39.000'
    end: '02:41.800'
    original: かっけー！決まったぜ！
    english: So cool! Nailed it!
  - start: '02:42.500'
    end: '02:44.200'
    original: 配信組も盛り上がってますかー？
    english: Is the streaming audience hyped up too?
  - start: '02:44.500'
    end: '02:48.500'
    original: 配信カメラあるよー！
    english: There's the streaming camera!
  - start: '02:49.000'
    end: '02:51.000'
    original: 前おいでよ、前！
    english: Come to the front!
  - start: '02:51.500'
    end: '02:54.800'
    original: コメントも見えてるからね！「イエーイ」「ウオー」しか言ってない！
    english: We can see the comments too! They're only saying "Yay" and "Woah"!
  - start: '02:55.500'
    end: '02:58.500'
    original: 「タイトル長い」って言われた！
    english: They said "The title is too long"!
  - start: '02:59.500'
    end: '03:02.000'
    original: 長くない！そのまんまなの！
    english: It's not long! It's just as it is!
  - start: '03:03.000'
    end: '03:05.500'
    original: 吾輩の名前より短いやん！
    english: It's shorter than my name!
  - start: '03:08.000'
    end: '03:10.000'
    original: 開演前から気づいたと思うけど...
    english: As you might have noticed before the show started...
  - start: '03:10.200'
    end: '03:12.000'
    original: DJ！
    english: DJ!
  - start: '03:12.500'
    end: '03:14.800'
    original: 最高！
    english: Awesome!
  - start: '03:15.200'
    end: '03:18.000'
    original: 落ちないようにね！本当だよ！
    english: Don't fall! Seriously!
  - start: '03:18.500'
    end: '03:20.000'
    original: 怖そう！絶対！
    english: Looks scary! Definitely!
  - start: '03:20.200'
    end: '03:22.000'
    original: あそこ超高いぜ！
    english: It's super high up there!
  - start: '03:22.500'
    end: '03:28.000'
    original: というわけで、ここから先は本当の任務に入っていくぞー！
    english: So then, from here on, we're going into our real mission!
  - start: '03:32.000'
    end: '03:36.200'
    original: なんですけど... ここで... 「嫌だー！」
    english: However... right here... "No way!"
  - start: '03:36.500'
    end: '03:39.500'
    original: それは聞かないと... 悲しい...
    english: We have to listen to that... Sad...
  - start: '03:40.000'
    end: '03:46.000'
    original: ちょっと私から言うのもあれなんで、こよさん！「おいおいおい！」人の口を借りるな！
    english: It's a bit awkward coming from me, so Koyo-san! "Hey hey hey!" Don't
      use someone else's voice!
  - start: '03:47.000'
    end: '03:48.800'
    original: はい、ではちょっと大事なお知らせです！
    english: Alright, here is an important announcement!
  - start: '03:49.000'
    end: '03:53.500'
    original: YouTube、TikTok Liveでご覧になっている方！
    english: Those watching on YouTube and TikTok Live!
  - start: '03:54.000'
    end: '03:58.000'
    original: 無料チラ見せはここまでとなります！
    english: The free preview ends here!
  - start: '04:01.000'
    end: '04:03.800'
    original: 関係ないのに「えー」って言ってくれてる！見れるのにね！
    english: People who aren't even affected are saying "Eh~"! Even though they can
      still watch!
  - start: '04:06.500'
    end: '04:10.800'
    original: ですが！この後も生パフォーマンスやゴージャスな楽曲など！
    english: However! After this, there will be live performances and gorgeous songs!
  - start: '04:11.000'
    end: '04:17.800'
    original: 今からでも間に合いますので、この辺！概要欄から、この辺！配信チケットを購入してください！
    english: It's not too late, so around here! From the description box, around here!
      Please purchase the streaming ticket!
  - start: '04:18.000'
    end: '04:21.500'
    original: ここ！ここ！ここです！
    english: Here! Here! Right here!
  - start: '04:24.000'
    end: '04:28.000'
    original: お前ら、絶対買えよな！買った音した！買わないとヤバいよ！
    english: You guys better buy it! I heard the purchase sound! You gotta buy it!
  - start: '04:32.000'
    end: '04:40.800'
    original: 'そしてこのライブの感想などはですね、ハッシュタグ #SsoholoX世界リペイント計画 でポストしてくださいね！'
