    english: Right! In a normal live, you can't move around or walk around to look.
  - start: '00:28.500'
    end: '00:32.200'
    original: ねえねえ、みんなの最高の写真期待してるぞ！
    english: Hey hey, we're looking forward to everyone's best photos!
