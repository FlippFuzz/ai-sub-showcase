    original: 雪民さんたちがどんな姿で会いに来てくれるか楽しみ！
    english: I can't wait to see what kind of outfits Yukimin will wear to meet us!
  - start: '00:14.900'
    end: '00:19.400'
    original: ホロアースのライブだから、好きな服装でライブ見れるのもいいよね。
    english: Since it's a Holoearth live, it's nice we can watch in our favorite outfits.
  - start: '00:19.800'
    end: '00:24.300'
