    reference_lyrics_en: |-
      [Intro]
      hyper jumpin’ now
      hyper jumpin’ now

      [Chorus]
      hyper jumpin’, let's jump out
      come on baby, shine bright, make my heart go pump it up
      hyper jumpin’, all the way beyond dreams
      i want more and more excitement

      [Drop]
      hyper jumpin’ now
      hyper jumpin’

      [Verse 1]
      it's more profitable to play around like a child
      tension rising up from low pressure
      replying frantically while getting drunk with mentions
      driving the shopping cart and advancing the mission

      [Pre-Chorus]
      accelerating speed just like this
      I wonder what is waiting at the destination
      with feelings that won't stop, take a running start
      let's go beyond dimensions (come on)

      [Chorus]
      hyper jumpin’, let's jump up
      dancing shake it up until we get high and turn to ashes
      hyper jumpin’, all the way beyond the sky
      i want to get closer and closer
      (woah~ oh, woah, woah~ oh~ oh~ oh)
      i want my heart to race, gimme, gimme, gimme love
      (woah~ oh, woah, woah~ oh~ oh~ oh)
      i want to fly higher and higher

      [Drop]
      hyper jumpin’ now
      hyper jumpin’

      [Verse 2]
      attacking from an angle to solve questions
      a chainsaw that tears through negativity
      streaming comments and interactive sessions
      training my aim and landing a flick shot

      [Verse 3]
      dis is no, no
      if you like it more, more, more
      noise that gets in the way
      shoot it down, bang, bang, bang
      i just want to play
      ignore the antis
      laugh it off and kick them away
      kick it, jump around, jump around

      [Pre-Chorus]
      we will journey on just like this
      I wonder what is waiting at the destination
      linking with the future we believed in
      let's go beyond dimensions (come on)

      [Chorus]
      hyper jumpin’, let's jump over
      dancing shake it up until we get high and turn to ashes
      hyper jumpin’, all the way beyond the sea
      i want to get closer and closer
      (woah~ oh~ oh, woah~ oh~ oh~ oh)
      i want my heart to race, gimme, gimme, gimme love
      (woah~ oh~ oh, woah~ oh~ oh~ oh)
      i want to fly higher and higher

      [Drop]
      hyper jumpin’ now
      hyper jumpin’ now
