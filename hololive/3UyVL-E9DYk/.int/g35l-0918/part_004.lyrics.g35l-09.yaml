      ( woah~ oh, woah, woah~ oh~ oh~ oh )
      ドキドキ したい gimme, gimme, gimme 愛
      ( woah~ oh, woah, woah~ oh~ oh~ oh )
      もっと もっと 高く 飛び たい の

