  thoughts: |+
    **Hololive Super Expo 2022 Venue Rules Summary**

    Okay, here's what I've got so far, distilled down to the key points for this Hololive Super Expo 2022 audio:

    *   **Initial Greeting and Request:** The message starts with a warm greeting and thanks to everyone present. They are making a request to all visitors as the doors open and the performance begins.

    *   **COVID-19 Precautions:** They remind everyone about ongoing COVID-19 safety measures: wear masks, sanitize hands, and maintain social distancing. I need to emphasize cooperation with these measures, both during the show and in the lobby.

    *   **Audience Conduct:** They stress that attendees should maintain distance from each other, whether watching the show or in the lobby. Also, no shouting or cheering to prevent droplet transmission is allowed. Temperature checks are done at the entrance; however, if someone feels unwell, they should notify a staff member.

    *   **Mobile Device Policy:** Usage of mobile phones and smartphones is prohibited in the seating area. However, smartphones should be turned to manner mode, but they should be kept on to use the "COCOA" (COVID-19 Contact Confirmation) app. No turning the phone off.

    *   **Recording Restrictions:** The use of cameras (photos/video) on phones/smartphones is completely prohibited. If anyone is found doing this, they will be made to delete any data found and may be asked to leave.

    *   **Prohibited Actions:** No mosh pits, diving, jumping, or using unauthorized concert lights in the seating area.

    *   **Consequences of Non-Compliance:** If any of these rules are not followed, the performance may be temporarily suspended or canceled.

    *   **Seating and Evacuation:** The audience can stand in front of their seats for this performance. Lights will be turned off for evacuation guidance, and if evacuation is needed, emergency lights will turn on immediately. Follow staff instructions if that happens.

    *   **Post-Show Procedures:** After the show, follow staggered exit rules to maintain social distancing. Wait in your seats until instructed by staff.

    *   **Media Notice:** Be aware that cameras will be recording the event for streaming and photography purposes. By attending, you are consenting to potentially appearing in promotional materials.

    *   **Final Statement:** Please wait a little longer until the show begins.

    *   **Merchandise** During the merchandise catalog, only instrumental music plays.


