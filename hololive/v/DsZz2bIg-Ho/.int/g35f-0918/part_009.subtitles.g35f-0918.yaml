  - start: '04:48.000'
    end: '04:51.000'
    original: 召喚しましょう！
    english: Let's summon it!
  - start: '04:51.000'
    end: '04:59.000'
    original: これでちょっと、会場の皆さんも一緒に、「出でよ、巨大コントローラー」とね、叫んでくれると嬉しいです。
    english: I'd love for everyone in the venue to shout along with us, "Appear, Giant
      Controller!"
