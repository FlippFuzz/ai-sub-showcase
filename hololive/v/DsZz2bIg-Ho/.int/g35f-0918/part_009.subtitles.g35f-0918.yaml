  - start: '01:55.000'
    end: '01:58.000'
    original: 可愛い！
    english: How cute!
  - start: '01:58.000'
    end: '02:01.000'
    original: やっぱりね、白上とミオも欲しいなという、そう思った、
    english: And for those of you who also want Shirakami and Mio's figures,
  - start: '02:01.000'
