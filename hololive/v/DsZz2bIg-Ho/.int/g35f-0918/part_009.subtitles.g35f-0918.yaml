      Chicken"!
  - start: '02:34.000'
    end: '02:39.000'
    original: 今回のイベントのキービジュアルが前面に出たデザインとなっているとのことです。
    english: They feature a design showcasing the event's key visual on the front.
  - start: '02:39.000'
    end: '02:44.500'
    original: ポップコーンは税込み1000円で、チキンは税込み1500円での販売でございます。
    english: The popcorn is 1,000 yen (tax incl.), and the chicken is 1,500 yen (tax
      incl.).
  - start: '02:44.500'
    end: '02:50.000'
    original: ポップコーンは塩キャラメル味、チキンはグリルチキン味になってます。
    english: The popcorn is salted caramel flavor, and the chicken is grilled chicken
      flavor.
