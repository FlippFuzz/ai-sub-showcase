    end: '03:50.000'
    original: ビビッター！
    english: Bibitter!
  - start: '03:54.000'
    end: '03:58.000'
    original: こちらルールは超簡単！
    english: The rules for this are super simple!
  - start: '03:58.000'
    end: '04:04.000'
    original: ミニゲームに対し、タイミングよくボタンを押して、ギリギリで止めるだけ！
    english: Just press the button with the right timing during the minigame and stop
      it right at the limit!
  - start: '04:04.000'
    end: '04:05.500'
    original: なるほど。
    english: I see.
  - start: '04:05.500'
    end: '04:11.000'
    original: 我々のですね、度胸を試す、究極のビビリチェッカーゲームとなっております！
    english: It's the ultimate test of courage to check how easily we get scared!
  - start: '04:11.000'
    end: '04:17.000'
    original: よりギリギリを攻めると、クールの評価がもらえるそうです。
    english: If you stop closer to the limit, you'll receive a "Cool" rating.
  - start: '04:17.000'
    end: '04:22.000'
    original: 今回ですね、我々、個人戦でございます。
    english: We will be competing individually today!
  - start: '04:22.000'
    end: '04:26.000'
    original: １つのミニゲームに対し、２人がそれぞれ挑戦します。
    english: For each minigame, two of us will take turns challenging it.
  - start: '04:26.000'
    end: '04:31.000'
    original: 様々な組み合わせで、合計６ゲーム楽しんでいただきたいと思います。
    english: We will play a total of six games with various combinations.
  - start: '04:31.000'
    end: '04:38.000'
    original: こちらですね、我々のクールの合計数で、１位を決めたいと思いますので、よろしくお願いします。
    english: We'll decide the winner based on the total number of "Cool" ratings,
      so wish us luck.
  - start: '04:40.000'
    end: '04:43.000'
    original: ではですね、ゲームを始める前に、
    english: So, before we start the game...
  - start: '04:43.000'
    end: '04:48.000'
    original: なんと今回ですね、巨大コントローラーを用意してくれたということで、
