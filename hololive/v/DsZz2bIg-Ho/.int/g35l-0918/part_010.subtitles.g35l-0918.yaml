    Then it's time to set up how the game is played, and discuss who will go first. (00:37.071 - 00:40.731). Then "Now, in what order will we take on the challenges?" It seems Mio-sha will start. Then there is an issue with the order! After everyone agrees to the order (01:18.275 - 01:23.235), it's: "Okayu is second! Flow-wise, sorry!" And it's also decide who will be third. (01:24.475 - 01:28.165). There is also a bit of comedy. Then Mio-sha will start the first round, (01:36.005 - 01:42.525).

    The game is about to start! (01:43.785 - 01:50.055) So Mio-sha is the first, because the order has been decided. A lot of teasing (01:50.365 - 01:58.305), there is also a bit of trash talk, because Okayu is pretty good. Also there is some joking! (02:02.165 - 02:05.745), she's very strong. The group is in a good mood for the game. But this is the first time they are trying a minigame (02:06.015 - 02:11.835) that's difficult.

