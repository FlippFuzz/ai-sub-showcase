  thoughts: |+
    **Hololive GAMERS Merchandise and Event Summary**

    Okay, here's the breakdown of what I'm thinking about:

    First, for anyone who missed out, the post-event online mail-order is still open for those merchandise items, so I hope people grab those. And then, there's a collaboration with NTT docomo's "home 5G" campaign – that's something to watch out for.

    Oh, and the giant towel and the entrance fan. Did people grab those? I'm curious who did. Thanks for the folks I've seen. Let's make the best of this order period, and enjoy it!

    I almost forgot, there's a post-event-limited acrylic panel! Did everyone know about that? It's available now, so anyone who thought of it just now, go get it! Don't miss out!

    Alright, moving on. We've got more to cover.

    Many people are expressing that they wanted to support us Gamers, so we're collaborating with "CheerSPOT"! Yay! Anyone can put up our cheering ads easily at CheerSPOT locations nearby. I think I use this regularly. It's really convenient.

    Speaking of, you probably saw it displayed on the screen. It allows for really clean advertising, so you should check it out. We also premiered satellite projection in the Super Arena venue today, following "Fubumio" projection, we've also got "Okakoro" figures announced. Did people see them?

    Also, the new figures have been available for order since yesterday! Did everyone pre-order? They are so cute.

    Oh, and to commemorate the event, anyone who pre-orders Coco Studio by August 7th gets a sticker! I want that! Even better, additional reservations for "Fubumio" are available.

    This is the strongest, best thing, please! If you can, get the whole Gamers crew!

    And finally, there are co-sponsored corporate goods by Kandaful! Super-super popcorn, and super-super grilled chicken! The design features visuals from the event. Popcorn is 1000 yen, and canned goods are 1500 yen. The popcorn is salted caramel, and the canned goods are grilled chicken. Yay!

    Oh no! At the Cyber Goods Store, these have already sold out! However, there is good news, additional sales will be available starting at 22:00 today. Unlike other goods, these are limited quantity, so don't miss out. Besides the Cyber Goods Store, they are also sold at Kandaful's official online store. They are sold on Kandaful's official online store besides Cyber Goods Store, so please check it out. Including the group acrylic panel, these are goods you can't buy later on, so please make sure to check them out!

    Oh yeah, let's also show the listeners, the Gamers listeners! Quickly, quickly! Final stop, final stop. Huh, is it over? Oh, following yesterday, there's also a live viewing in South Korea today! Everyone in Korea, are you watching? Countdown! Let's do it! Everyone in Korea! They've been taking group photos and we checked out their poses too! Thanks again today!

    Now, let's quickly announce the first game title!


