    Then comes the rap section. Each line needs precise timing. The first voice, Isaki Riona, hits with "搭載V8エンジン" (Equipped with a V8 engine) at 02:19.800 and continues through to "この5人でゲームをチェンジ" (Changing the game with these 5) at 02:26.500.

