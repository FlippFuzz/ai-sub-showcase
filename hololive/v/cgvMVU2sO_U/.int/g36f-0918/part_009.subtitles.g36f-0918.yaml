    original: マリン、まあ恒例なんですけど、先に予習しましょうか。
    english: Well, as is tradition, shall we practice first?
  - start: '00:03.400'
    end: '00:07.400'
    original: マリンが「マリンは」って言ったら、返しは「船長！」で。
    english: When I say "Marine is...", you respond with "Captain!"
  - start: '00:07.400'
    end: '00:09.300'
    original: マリン「船長！」で。
    english: I'll say Marine, you say "Captain!"
  - start: '00:09.300'
    end: '00:12.000'
    original: 「君たちは？」「一味！」
    english: '"And you are?" "Ichimi!"'
  - start: '00:12.000'
    end: '00:15.100'
    original: 「我ら無敵の」「海賊団！」
    english: '"Our invincible..." "Pirate crew!"'
  - start: '00:15.100'
    end: '00:21.800'
    original: で、最後に「宝鐘海賊団船長、宝鐘マリンです」って言うから、そしたら問答無用で「カワイイ！」って言う。
    english: And at the end, I'll say "Captain of the Houshou Pirates, Houshou Marine
      here!", so then without question, you say "Cute!"
  - start: '00:21.800'
    end: '00:23.200'
    original: 分かりましたね？
