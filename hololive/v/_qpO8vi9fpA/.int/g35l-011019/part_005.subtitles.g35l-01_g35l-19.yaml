    Girl holoWitches! THE STAGE ~TRICK or MAGIC!~' from the hololive channel. The
    narrative follows the Magical Girl holoWitches unit—consisting of Kanata, Miko,
    Luna, Marine, Fubuki, and Lamy—as they prepare for and perform at a special Halloween
    live event on the fictional HoloCast streaming app alongside guest singer Kanon.
    During the event, a 'Colapsar' monster emerges due to Mio's deep-seated childhood
    trauma and fear of Halloween pumpkins. The magical girls transform, battle the
    manifestation of fear and despair, support each other through their vulnerabilities,
    and successfully purify the darkness with song and magic, culminating in a triumphant
    concert experience and a heartwarming epilogue.
