  original: 長く伸ばした 季節色の影の上を 騒がしい足跡つけて飾って
  english: Decorating the shadow of seasonal colors we stretched out long with noisy
    footprints...
- start: '03:08.553'
  end: '03:13.333'
  original: ワクワクする ほら 笑顔だって 決められた未来と
  english: Excited, look, even our smiles try to break past...
- start: '03:14.073'
  end: '03:18.493'
  original: 逆の答えばっかりいこうとしてる
  english: the predetermined future into opposite answers.
- start: '03:19.293'
  end: '03:23.773'
  original: 間違ってないか がっかりしないか
  english: Wondering if we're wrong, feeling disappointed...
- start: '03:24.073'
  end: '03:29.533'
  original: さんざん迷ってまた今日に立っていた
  english: wandering through it all, and standing here again today.
- start: '03:30.073'
  end: '03:39.493'
  original: 誰も歩かない道の先で かすんだ声がする
  english: Further down a path no one walks, a faint voice echoes...
- start: '03:40.073'
  end: '03:49.253'
  original: 誰も気づけない予想外の明日が今
  english: An unexpected tomorrow that no one noticed is right now...
- start: '03:49.633'
  end: '03:55.793'
  original: きらめいちゃったんだ ときめこう もっともっと音をかぞえてゆく
  english: It started sparkling! Let's get excited and count even more sounds!
- start: '03:56.233'
  end: '04:04.133'
  original: みんなが代わってる 笑った毎日が 突然とびきりなだから
  english: Every smiling day where everyone takes turns becomes suddenly extraordinary.
- start: '04:04.593'
  end: '04:14.333'
  original: 今この世界に愛しいが 真っ直ぐ登ったまま 消えない太陽に 手をかわして
  english: In this world right now, affection climbs straight up, waving to the unvanishing
    sun.
- start: '04:18.913'
  end: '04:27.753'
  original: 覚えているんだ 初めは隠してた癖も 恥ずかしくて語れない夢も
  english: I remember them—the habits I hid at first, the dreams too embarrassing
    to talk about.
- start: '04:33.233'
  end: '04:44.333'
  original: 一つ一つは 特別に見えなくても 重なり合ってほら 今色めいた
  english: Even if each one doesn't seem special, they overlap and color the present
    right now.
- start: '04:45.913'
  end: '04:57.173'
  original: 祭りでーす！祭りにいばしょがいて 本人にありがとう この場は祭りの過去の歌で これからも祭りは祭らしく 突き進んでいこう！
  english: It's a festival! Having a place at the festival, thank you so much! This
    place is with past festival songs, and from now on, let's keep charging forward
    like a true festival!
