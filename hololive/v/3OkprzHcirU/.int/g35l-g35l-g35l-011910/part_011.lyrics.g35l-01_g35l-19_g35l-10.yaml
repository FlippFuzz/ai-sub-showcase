    english: Like a star shining in the sky, wishing to sparkle on this night, wanting
      to prove my existence in this vast world
  - start: '01:02.140'
    end: '01:10.580'
    original: 出来ないことばっか数えても 胸が苦しくなるだけでしょう 私だって絶対あの日の夢のようになれるはず
    english: Even if I just count all the things I can't do, it'll only make my chest
      ache. I'm sure I can become like that dream of that day, too.
  - start: '01:18.520'
    end: '01:21.020'
    original: 響く音色の中ほら 見知らぬ景色と
    english: Listen, amid the echoing tones, with unfamiliar scenery
  - start: '01:25.420'
    end: '01:30.340'
    original: 感じてたのに 近くですれ違ってたんだ
    english: even though I felt it, we were passing right by each other close up.
  - start: '01:38.220'
    end: '01:45.060'
    original: きっと見つける 私の色 ずっとずっとずっと 追いかけるの
    english: I will surely find my color, chasing after it on and on and on.
  - start: '01:51.780'
    end: '02:04.920'
    original: 限りなく透明だった 瞳に映るすべて 変わりゆく世界の リズムに乗って モノクロを染めてゆく
    english: Everything reflecting in eyes that were infinitely transparent, riding
      the rhythm of a changing world, dyeing the monochrome.
  - start: '02:19.420'
    end: '02:29.340'
    original: 閉じ込めなくてもいいの 不安感じても 私だけの色で描こう
    english: You don't have to lock it away. Even if you feel anxious, let's paint
      with your very own color.
  - start: '02:33.420'
    end: '02:42.500'
    original: きっと未来は色彩にあふれ まだ見ぬ世界をカラフルに染める もっと自由に羽ばたくから
    english: Surely the future overflows with color, dyeing unseen worlds in vibrant
      hues, fluttering more freely...
  - start: '02:43.760'
    end: '02:47.380'
    original: あの日感じたままに
    english: '...just as I felt that day.'
  - start: '02:55.320'
    end: '03:04.080'
    original: やっと見つけた 私の色 ずっとずっとずっと 描き続けてくの
    english: I finally found my color, keeping on painting it on and on and on.
  - start: '03:37.380'
    end: '03:39.880'
    original: '[Title: 白上フブキ / Shirakami Fubuki]'
    english: '[Title: 白上フブキ / Shirakami Fubuki]'
  - start: '03:40.160'
    end: '03:42.920'
    original: '[Title: 百鬼あやめ / Nakiri Ayame]'
    english: '[Title: 百鬼あやめ / Nakiri Ayame]'
  - start: '03:43.880'
    end: '03:46.420'
    original: '[Title: 大神ミオ / Ookami Mio]'
    english: '[Title: 大神ミオ / Ookami Mio]'
  - start: '03:47.280'
    end: '03:49.880'
    original: '[Title: 白上フブキ / 百鬼あやめ / 大神ミオ]'
    english: '[Title: 白上フブキ / 百鬼あやめ / 大神ミオ]'
  - start: '04:02.160'
    end: '04:06.180'
    original: 歌え騒げ 兎也是続く 前鬼に怪獣
    english: Sing and make noise, the rabbit's banquet continues, leading into ogres
      and monsters!
  - start: '04:07.160'
    end: '04:10.880'
    original: いざ跳ねろ 舞い踏みが来たぞ たくさん殺してね 行くよ
    english: Now bounce and leap, the dance step has come! Kill plenty of them, let's
      go!
  - start: '04:16.840'
    end: '04:21.060'
    original: 気分満点 七変化 今宵も集えインターネット
    english: Mood is 100%, shape-shifting into seven forms, gather on the internet
      tonight too!
  - start: '04:21.680'
    end: '04:25.860'
    original: お仕事に勤しめ ここはまるで桃源郷
    english: Diligently working away, this place is just like Utopia!
  - start: '04:26.540'
    end: '04:31.060'
    original: 一せので よいよいよい 一人より隠れ家光る
    english: On the count of three, yoi-yoi-yoi, shining brighter in a hideout than
      alone!
  - start: '04:31.940'
    end: '04:35.880'
    original: どこでも よいよいよい 我が道をゆけ
    english: Anywhere, yoi-yoi-yoi, walk your own path!
  - start: '04:36.600'
    end: '04:44.380'
    original: ゆらゆらに 恋に焦がれ 切なさも緩くこの想いは
    english: Swaying softly, pining with love, even this bittersweetness relaxes,
      this feeling is...
  - start: '04:46.040'
    end: '04:50.060'
    original: まだ分からないけど みのりなせせて
    english: Still not sure, but make it bear fruit!
  - start: '04:57.160'
    end: '05:01.000'
    original: さあ乱れよ 鬼も手も名の通りうねれ
    english: Now, let it get chaotic, demons and all, rolling just as the name says!
