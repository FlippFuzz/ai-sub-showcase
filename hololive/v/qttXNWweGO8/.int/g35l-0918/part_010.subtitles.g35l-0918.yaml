    I began by dissecting the first segment, FUWAMOCO, meticulously identifying the start and end of each vocal phrase. I listened to the audio, cross-referencing with any available lyrics to pinpoint the exact timestamps. I focused on translating the lyrics naturally while ensuring they fit within the line length restriction. I had to ensure the timestamps align with the audio.

    Then, I moved on to Usada Pekora's "Peko Peko!! Chicken Fever☆." This is a bit more involved, with a more complex structure, repeating phrases, and a lot of Peko-specific slang. I went through the entire segment, noting every lyric, and identifying timestamps and the correct translation. I checked the video to ensure that the lyrics fit and made sense in each context. I listened closely and reviewed the Japanese to make sure my translations were spot-on.

