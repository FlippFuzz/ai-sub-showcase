    original: '[Title: 4周年ライブプロマイド] なんと、なんと！ころライブの新サービス？新しいサービス...。ライブの感動最速ですのりに！'
    english: '[Title: 4th Anniversary Live Bromide] What, what! A new service for
      Koro-Live? A new service... Delivering the emotional high of the live concert
      instantly to convenience stores!'
  - start: '02:35.806'
    end: '02:42.276'
    original: すごい！秘密結社holoX4周年のライブプロマイドが...
    english: Amazing! The 4th Anniversary live bromides of Secret Society holoX...
  - start: '02:42.486'
    end: '03:02.146'
    original: なんと！今日のね、ライブの写真が明日からコンビニでプリントアウトできるようになるんだ！すごい！すぐに手に入るんだ！そうなんだよ！最初のチップはファミリーマート、ローソンでミニストップになります！ありがとうございます！いっぱいある！ありがとうございます！ありがとうございます！
    english: What! Tomorrow, photos from today's live concert will be available to
      print out at convenience stores! Amazing! You can get them right away! That's
      right! The first batch will be at FamilyMart, Lawson, and Ministop! Thank you
      so much! There are so many! Thank you! Thank you!
  - start: '03:02.936'
    end: '03:07.036'
    original: そして、今からネットで事前購入ができるらしいです！
    english: And, it seems you can pre-order online starting now!
  - start: '03:07.136'
    end: '03:16.896'
    original: マジ？そなんだ！ただね、明日からコンビニでも写真を選びながら購入することもできるみたいなので、詳しくは左下のリンクから確認してみてください！
    english: Seriously? Is that so! But starting tomorrow, you'll also be able to
      choose and purchase photos at convenience stores, so please check the link at
      the bottom left for details!
  - start: '03:17.386'
    end: '03:22.516'
    original: さらにですね、今回はそちらのお写真にですね、プロマイドに私たちメッセージを付けることができるみたいなんですけれど...
    english: Furthermore, this time, it seems we can attach our messages to those
      photos, to the bromides...
  - start: '03:22.516'
    end: '03:32.406'
    original: ちょっと待って！嘘！聞いてないよ！え、今から書くの？
    english: Wait a minute! No way! I didn't hear about this! Eh, we're writing them
      right now?
  - start: '03:33.316'
    end: '03:40.356'
    original: ちょっと、ここで書くの！？無理じゃないか！
    english: Wait, we're writing them here?! Isn't that impossible!
  - start: '03:40.406'
    end: '03:44.756'
    original: 何にどうなの、考えて...え、考えて書いてください！
    english: What and how, think about it... Um, please think and write!
  - start: '03:45.326'
    end: '03:52.556'
    original: はい！ちょっと待って！でもね、私たちもね、待ってますからね！早くいそいで！
    english: Yes! Wait a moment! But you know, we'll be waiting too, so hurry up!
  - start: '03:52.956'
    end: '03:58.216'
    original: でも、意外と集中力ちゃう！繋げ！オッケー！完敗！完敗で...よくできた！
    english: But surprisingly, our concentration... Connect! Okay! Defeated! Defeated...
      Well done!
  - start: '03:59.956'
    end: '04:02.736'
    original: 早い！早いね！見せて！
    english: Fast! You're fast! Show us!
  - start: '04:03.116'
    end: '04:05.786'
    original: これ、あ、かわいい。まあ、こういう、こういうのですね。
    english: This, ah, cute. Well, something like this, like this.
  - start: '04:06.126'
    end: '04:09.916'
    original: あ、いいじゃん！コヨーテっぽい！いや、一まで書いとるねん！
    english: Ah, nice! Kind of Koyote-ish! No, you wrote all the way up to "ichi"!
  - start: '04:10.026'
    end: '04:15.536'
    original: はい！じゃあみんな終わった？はい、じゃあみんな！お渡しして、皆さん！はい、お願いしますね！
    english: Yes! So everyone finished? Yes, so everyone! Hand them over, everyone!
      Yes, please!
  - start: '04:16.126'
    end: '04:20.376'
    original: といことで、これでお願いします！まあ、みんなね何書いたかすっごく気になると思うんですが...
    english: So please do this! Well, I'm sure everyone is very curious about what
      we wrote...
  - start: '04:20.486'
    end: '04:31.956'
    original: こちらのメッセージの内容はみんなが、えっとね、私が書いた...やめて！やめて！ダメですよ！ダメですよ！ダメに決まってんだろ！
    english: The content of this message here is what everyone... um, what I wrote...
      Stop it! Stop it! No way! No way! Of course it's no way!
  - start: '04:33.686'
    end: '04:36.566'
    original: はい、すみません！ごめんなさい！はい！
    english: Yes, sorry! I'm sorry! Yes!
  - start: '04:37.816'
    end: '04:39.116'
    original: よし、よし、よし。
    english: Okay, okay, okay.
  - start: '04:39.196'
    end: '04:42.506'
    original: まだ2枚もあるんで、お次はこ・ち・ら！
    english: There are still 2 more, so next is h-e-r-e!
  - start: '04:42.796'
    end: '04:46.396'
    original: '[Title: 告知⑤ 「あの作品とコラボ！？」] こちら！オープン！なんと！あの作品とコラボ！？え！？え！？あ、何々？'
    english: '[Title: Notice 5 "Collaboration with That Work!?"] Here! Open! What?!
      A collaboration with that work?! Eh?! Eh?! Ah, what, what?'
  - start: '04:47.386'
    end: '04:55.776'
    original: あの作品？どれだ？ちょっと待って、これマジ知らない！どの作品？あの作品って何なんですか？何なんですか？どういうこと？こちらのほうどうぞ！こちらのほうどうぞ！
    english: That work? Which one? Wait a minute, I really don't know this! Which
      work? What is "that work"? What is it? What do you mean? Over here, please!
      Over here, please!
