global_summary:
  overall_summary: This YouTube video is the 4th Anniversary 3D LIVE stream ('秘密結社holoX4周年
    3DLIVE') by Secret Society holoX (秘密結社holoX), the 6th generation VTuber unit of
    hololive. The stream features comical skit openings, solo and group musical performances
    remixing their original songs arranged by DJ fu_mou, major announcements including
    their 1st album 'Secret Order', Lawson/FamilyMart/Ministop bromides, Tower Records
    collaboration, and their highly anticipated 1st live concert 'First MISSION' at
    Pia Arena MM on April 29th.
