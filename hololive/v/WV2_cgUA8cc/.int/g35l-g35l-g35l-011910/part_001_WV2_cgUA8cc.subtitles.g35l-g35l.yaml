  overall_summary: This video is the 3D live performance and animated stage production
    titled '【3D LIVE】魔法少女ホロウィッチ！THE STAGE【#ホロウィッチ】' presented by Hololive's multimedia
    magical girl project 'Magical Girl holoWitches'. The production weaves an immersive
    narrative where six Hololive talents transformed as magical girls—Amane Kanata,
    Sakura Miko, Himemori Luna, Houshou Marine, Murasaki Shion, and Sakamata Chloe—fight
    against 'Colupser' entities spawned from the despair and unfulfilled dreams of
    humans trapped in the 'HoloCast' world. Featuring dynamic musical performances
    including original tracks like 'はじまりの魔法-charm-' and 'On your side', as well as
    covers like 'スイートマジック', 'ベテルギウス', and '愛して愛して愛して', the live blends high-energy
    choreography with theatrical storytelling to ultimately reaffirm the power of
    hope, community support, and everyday heroism.
