responses:
- subtitles:
  - start: '00:00.000'
    end: '00:03.589'
    original: なんとなんか明るくなっていくような色合いになってるんです。
    english: Everything is becoming brighter and more colorful.
  - start: '00:05.419'
    end: '00:09.919'
    original: 髪飾りね、とっても可愛くて。
    english: The hair accessories are really cute!
  - start: '00:10.039'
    end: '00:15.919'
    original: なんだかこんなね、振り袖で1月1日を迎えられてとても嬉しく思っています。
    english: I'm so happy to be able to welcome January 1st with such wide sleeves!
  - start: '00:19.469'
    end: '00:23.959'
    original: そしてホロライブは今年5周年をむかえています。
    english: And Hololive is celebrating its 5th anniversary this year.
  - start: '00:24.499'
    end: '00:36.639'
    original: 5年前はね、まさか振り袖を着れるようになるとは思わず、来たことあるんですけど、袖がなかったみたいな。
    english: 5 years ago, I never thought I'd be able to wear sleeves like this, but
      I didn't have sleeves!
  - start: '00:36.199'
    end: '00:43.089'
    original: 袖のない振り袖だったのかなね、5年たってちゃんと振り袖をこうやって切れるようになったり、
    english: It's been 5 years, and I've finally learned to properly wear sleeves!
  - start: '00:42.069'
    end: '00:51.309'
    original: そしてね、仲間がたくさん増えてこんなにね、素敵なスタッフさんたちと素敵な番組を作れるようになりました。
    english: And we've got so many new friends, wonderful staff, and wonderful programs!
  - start: '00:51.339'
    end: '00:55.339'
    original: 本当にそれはみなさんの応援があるからだなと思います。
    english: I really think that's thanks to everyone's support.
  - start: '00:55.609'
    end: '01:03.189'
    original: これからも私たちは頑張っていくので今年もホロライブをよろしくお願いします。
    english: We're going to keep doing our best, so please continue to support Hololive
      this year!
  - start: '01:04.499'
    end: '01:06.019'
    original: さてさて、
    english: Now, now!
  - start: '01:06.669'
    end: '01:13.259'
    original: 新年ということで嬉しいお知らせもいっぱいしていけたらいいなと思いますよ！
    english: I hope we can share lots of happy New Year news with you!
  - start: '01:14.079'
    end: '01:15.549'
    original: では、いきますね。
    english: So, let's get started!
  - start: '01:16.489'
    end: '01:18.069'
    original: まずは、こちら！
    english: First is this one!
  - start: '01:20.109'
    end: '01:27.799'
    original: 今年はうさぎ年ということで、ぺこらちゃんが何やらよからぬことを考えているみたい。
    english: This year is the Year of the Rabbit, and Pekora-chan seems to be planning
      something unexpected...
  - start: '01:28.439'
    end: '01:33.409'
    original: その名も、#全人類うさぎ化計画！
    english: 'Its name is the #AllHumanityRabbitizationProject!'
  - start: '01:33.729'
    end: '01:35.809'
    original: いったい何がね、始まるんだろう。
    english: What on earth is going to happen?
  - start: '01:36.569'
    end: '01:45.319'
    original: こちらは本日1月1日夜19時からホロライブ公式チャンネルにて配信予定です。
    english: This will be broadcasted today, January 1st, starting at 7:00 PM on the
      official Hololive channel!
  - start: '01:45.429'
    end: '01:49.719'
    original: みんな、19時の予定はあけといてねよ！
    english: Everyone, make sure to clear your schedule for 7:00 PM!
  - start: '01:50.849'
    end: '01:52.489'
    original: 続いては、こちら！
    english: Next is this!
  - start: '01:54.109'
    end: '02:02.939'
    original: 1月13日金曜日、ピクシブ様とホロライブクリエイターコンテスト2023を開催します！
    english: The "Hololive Creator Contest 2023" hosted by Pixiv will be held starting
      January 13th, Friday!
  - start: '02:03.209'
    end: '02:13.239'
    original: ホロライブをテーマにしたイラスト、水着衣装デザイン、シナリオの3点をクリエイターの皆様に約1ヶ月募集させていただきます。
    english: We're looking for illustrations, swimsuit designs, and scenario scripts
      from creators for about a month!
  - start: '02:13.359'
    end: '02:18.339'
    original: 詳細は1月13日の公式ツイートをご確認ください。
    english: For details, please check the official tweet on January 13th!
  - start: '02:18.999'
    end: '02:20.319'
    original: 続いては、こちら！
    english: Next is this!
  - start: '02:21.849'
    end: '02:31.919'
    original: 過去ホロライブメンバーが出演したホロライブアイドルプロジェクトファーストライブブルームが現在アベマで配信中です。
    english: The 1st live concert of the Hololive Idol Project, "Bloom,", featuring
      past Hololive members, is currently streaming on ABEMA!
  - start: '02:32.429'
    end: '02:39.119'
    original: ブルームを見てくれた人も見たことがない人もこの機会にぜひチェックしてみてください。
    english: Whether you've watched Bloom before or never have, please take this opportunity
      to check it out!
  - start: '02:39.819'
    end: '02:43.769'
    original: 詳細はアベマのホームページで検索してみてね。
    english: Details can be found on the ABEMA homepage!
  - start: '02:44.759'
    end: '02:46.479'
    original: 続いては、こちら！
    english: Next is this!
  - start: '02:49.029'
    end: '02:54.269'
    original: 明日1月2日にみこちのお正月衣装お披露目もあるよ！
    english: Tomorrow, January 2nd, at 20:00, Miko-chi's New Year outfit reveal is
      coming up!
  - start: '02:55.339'
    end: '03:00.679'
    original: どうやら色んな企画を用意してるみたいだから、みんなチェックしてみてね！
    english: It looks like she's got all sorts of plans in store, so everyone be sure
      to check it out!
  - start: '03:01.819'
    end: '03:04.599'
    original: そしてそして、続いては、こちら！
    english: And then, next is this!
  - start: '03:06.639'
    end: '03:14.659'
    original: 星街すいせいセカンドアルバムSPECTER1月25日水曜日発売決定！おめでとう！
    english: Hoshimachi Suisei's 2nd album, "SPECTER", will be released on Wednesday,
      January 25th! Congratulations!
  - start: '03:17.439'
    end: '03:34.409'
    original: セカンドアルバムとなる今作では、Ayase、じん、キタニタツヤやナナホシ管弦楽団だ豪華クリエイター陣が書き下ろした全11曲を収録した作品となっています。現在予約受付中！
    english: This second album features all 11 tracks written by gorgeous creators
      like Ayase, Jin, Tatsuya Kitani, and Nano.Hoshi Gangdan! Reservations are open
      now!
  - start: '03:35.809'
    end: '03:46.689'
    original: さらに星街すいせいセカンドソロライブSHOUTiNCRISIS2023年1月28日土曜日に東京ガーデンシアターにて開催！
    english: Furthermore, Hoshimachi Suisei's 2nd Solo Live "Shout in Crisis" will
      be held on Saturday, January 28, 2023, at Tokyo Garden Theater!
  - start: '03:47.369'
    end: '03:50.849'
    original: 現在SPWNにて配信チケット発売中！
    english: Ticket sales on SPWN are live right now!
  - start: '03:51.489'
    end: '03:54.919'
    original: 詳しくは各種公式サイトをご確認ください。
    english: Check the official website for more details!
  - start: '03:56.559'
    end: '03:58.329'
    original: そして、続いては、こちら！
    english: And then, next is...
  - start: '04:00.679'
    end: '04:08.579'
    original: 今年も常闇トワさん主催のホロお正月カップを開催します！
    english: This year, we are holding the "Holo New Year Cup 2023" hosted by Tokoyami
      Towa-san!
  - start: '04:09.139'
    end: '04:14.289'
    original: 今年の最強は誰の手に！みんな楽しみだね！
    english: Whose hands will the strongest title go to this year? Everyone, get excited!
  - start: '04:15.909'
    end: '04:18.969'
    original: そして雑魚杯の優勝者は！
    english: And the winner of the losers' bracket...
  - start: '04:20.179'
    end: '04:23.769'
    original: ぜひ皆さんチェックしてくださいね！
    english: Please make sure to check it out, everyone!
  - start: '04:24.479'
    end: '04:27.709'
    original: そしてそしてたくさんの告知もいよいよ最後です。
    english: And with that, we're finally at our last announcement!
  - start: '04:28.449'
    end: '04:30.939'
    original: 最後は、こちら！
    english: The last one is this!
  - start: '04:31.969'
    end: '04:42.929'
    original: 1月5日お昼頃から友人Aちゃんと春先のどかちゃんのホロライブスタッフコンビで年末年始の振り返り配信を実施します。
    english: On January 5th around noon, A-chan and Nodoka Harusaki will host a look-back
      stream on the Hololive staff channel covering the tumultuous New Year period!
  - start: '04:43.799'
    end: '04:50.779'
    original: ゆくホロくるホロやカウントダウンライブなどなどスタッフ視点での裏話も
    english: We'll be sharing behind-the-scenes staff stories about the countdown
      live, the count-up live, and more!
  - start: '04:51.109'
    end: '04:55.709'
    original: 年末年始の情報はこの放送でばっちりおさえちゃいましょう！
    english: Let's wrap up all the info from the New Year right here!
  - start: '04:57.489'
    end: '04:59.399'
    original: 詳細は2人のTwitterを見てね！
    english: Check both of their Twitter accounts for details!
  thoughts: null
