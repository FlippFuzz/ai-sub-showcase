    portion of 'hololive 6th fes. Color Rise Harmony CREATORS' STAGE', held on March
    9, 2025, at Makuhari Messe. The video includes opening attention announcements,
    penlight color guides, sponsor merchandise trailers (Bandai, Ichiban Kuji, Furyu
    figures, Groove Coaster, PalVerse), fan message illustration scrolls, and concert
    footage from the CREATORS' STAGE featuring hololive 0th generation members and
    various collaboration units performing popular songs such as 'Our Bright Parade',
    'Iiwake Bunny', and 'Bishoujo Muzai Pirates', followed by an MC segment and fan
    interaction battle.
