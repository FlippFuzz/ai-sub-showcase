  end: '03:41.176'
  original: 錆でふりこめ！めっちゃふりこめ！
  english: Swing during the chorus! Swing like crazy!
- start: '03:41.366'
  end: '03:44.206'
  original: 急に静かになりもくもくおどるオタク！
  english: Suddenly quiet, us otaku dancing silently!
- start: '03:44.406'
  end: '03:48.336'
  original: 一通り住んだら叫ぶオイウリャオイ！
  english: Once everything calms down, we shout "Oi, urya, oi!"
- start: '03:48.516'
  end: '03:51.986'
  original: せーのでたとべ！超えるうたで！
  english: Jump on the count of three! With a voice that surpasses all!
- start: '03:52.186'
  end: '03:55.336'
  original: 出来飯食べるお酒は二十歳になってからです！
  english: Drinking alcohol is for after you turn twenty!
- start: '03:55.536'
  end: '03:59.276'
  original: これこそが生きがい姉妹に歌います！
  english: This is what we call our reason for living, singing as sisters!
- start: '03:59.456'
  end: '04:03.496'
  original: オイエーイ！ロッキー僕らと君の愛ソルルラララライ！
  english: Oh yeah! Roki, our and your love, sol-la-la-la-la-lai!
- start: '04:03.656'
  end: '04:08.576'
  original: もう湧き湧き止まないんだ！胸気のラララライ！
  english: It just keeps bubbling up! Our fluttering hearts sing la-la-la-lai!
- start: '04:09.116'
  end: '04:15.526'
  original: うりゃおい！虎！火！繊維！人造！器用！トウスケ！ペッセ！スセイスー！
  english: Urya oi! Tora! Hi! Sen'i! Jinzou! Kiyo! Tousuke! Pesse! Suseisū!
- start: '04:24.493'
  end: '04:27.353'
  original: ありがとうございました！
  english: Thank you very much!
