  original: 年寄りもなくにくらしくて 部屋の隅で膝を抱えて 震えていた 太陽なんかいらないから
  english: Living without aging or mercy, hugging my knees in the corner of the room,
    trembling... I don't need a sun like that.
- start: '03:36.500'
  end: '03:43.200'
  original: あけかないで 手を伸ばして 誰かに届くように
  english: Open it wide, reach out your hand so it reaches someone!
- start: '03:50.100'
  end: '04:05.100'
  original: ぼくだって君と同じ特別なんかじゃないから 泣いたっていいんだよ
  english: I'm not someone special, just like you, so it's okay to cry.
- start: '04:05.600'
  end: '04:12.100'
  original: そっとぼくは夜を耐え合って 輝いて、今宵音楽をずっとずっと止まらない
  english: Gently, I'll endure the night together with you, shining brightly, never
    letting tonight's music stop.
- start: '04:15.500'
  end: '04:24.000'
  original: そうだぼくはずっと泣きたかったのは まだ信じてるからじゃないと
  english: Yes, the reason I always wanted to cry was because I still believe in it...
- start: '04:29.500'
  end: '04:35.000'
  original: だってぼくは星だから
  english: Because I am a star...
- start: '04:44.100'
  end: '04:56.500'
  original: なんてありふれた話なんだ 理想だけが描き連ねていた ノートの隅に眠る本能を信じた きっとあの星も...
  english: How cliché of a story... ideals piled up one after another, trusting the
    instincts sleeping in the corner of my notebook. Surely, that star too...
