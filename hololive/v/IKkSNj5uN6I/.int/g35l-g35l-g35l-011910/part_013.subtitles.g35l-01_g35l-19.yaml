    messages, followed by live solo performances from Hoshimachi Suisei ("Stellar
    Stellar"), the STAGE1 group theme song ("Color Rise Harmony"), solo performances
    from Hakui Koyori and Kureiji Ollie, a unit song performance by Natsuiro Matsuri,
    Laplus Darknesss, and Momosuzu Nene, and concludes with the first MC chat segment
    introducing the talents and audience call-and-response before closing the free
    viewing portion.
