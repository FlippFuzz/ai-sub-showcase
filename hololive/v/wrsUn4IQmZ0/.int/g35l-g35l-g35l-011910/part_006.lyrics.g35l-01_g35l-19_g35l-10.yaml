global_summary:
  overall_summary: This video is the 7th Anniversary 3D Live stream of Hololive 1st
    Generation ('hololive 1st generation 7th anniversary♪♪' titled '#電脳ぴゅあ推し大宣言'),
    broadcasted on June 1, 2025. Featuring all four active 1st generation members—Shirakami
    Fubuki, Natsuiro Matsuri, Aki Rosenthal, and Akai Haato—the concert features spectacular
    group numbers, individual solo vocal performances, and unit cover songs. Highlights
    include solo tracks, specially produced group covers, and the world premiere of
    their brand-new 7th anniversary original unit song 'Cyber Pure Love Declaration'
    (電脳ぴゅあ推し大宣言). The stream concludes with exciting anniversary merchandise announcements
    and personal updates from each member, celebrating seven years of shared virtual
    idol history.
