  original: 最近ね、最近だいつき落ち着きを、落ち着きを取り戻し...
  english: Lately, you know, recently I've regained my composure and calmness...
- start: '00:54.070'
  end: '01:03.210'
  original: はい、ということでね、1曲目、シークレットガーデンだったんですが、去年のね、周年で発表したおり曲ということで、あれから1年経ちました！
  english: Right, so for our 1st song, it was "Secret Garden," an original song we
    announced at last year's anniversary, and a whole year has passed since then!
- start: '01:03.730'
  end: '01:13.650'
  original: いやー！早い！あのガーデンからもう1年。いやー早いね！あっという間でも秒秒秒だよね...本当秒過ぎるよ。
  english: Wow! That was fast! A whole year since that garden. Man, time flies! It
    went by in seconds... truly in the blink of an eye.
- start: '01:13.890'
  end: '01:19.990'
  original: 本当秒すぎるよ。うん、本当秒すぎるよ！今回はね、オープニングとして、あの歌わせていただきましたけど...
