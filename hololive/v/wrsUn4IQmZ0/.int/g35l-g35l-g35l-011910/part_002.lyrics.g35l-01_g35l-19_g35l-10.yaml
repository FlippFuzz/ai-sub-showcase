- start: '01:20.150'
  end: '01:22.950'
  original: 今年はおり曲どうなんですか？はーちゃま。
  english: How about this year's original songs, Haachama?
- start: '01:22.950'
  end: '01:26.510'
  original: えーと、どう、どうなんだろう？どうなんだろう？
