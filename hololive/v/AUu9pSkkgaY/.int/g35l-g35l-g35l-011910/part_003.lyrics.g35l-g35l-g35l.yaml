global_summary:
  overall_summary: This video is the 7th anniversary 3D live concert of Hololive's
    0th Generation titled 'Ray of Jewelry', streamed on September 7, 2024. Featuring
    all five pioneer members—Tokino Sora, Roboco-san, Sakura Miko, Hoshimachi Suisei,
    and AZKi—the concert showcases a dazzling array of solo performances, iconic duets
    like SorAZ and miComet, and full-group ensemble numbers. Against a majestic crystal-themed
    stage, the members celebrate seven years of history with energetic choreography,
    emotional vocals, MC segments, and major announcements regarding upcoming singles,
    albums, and live tours.
