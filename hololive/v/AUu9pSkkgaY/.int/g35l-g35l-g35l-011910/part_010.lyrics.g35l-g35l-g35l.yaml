      Sakura Miko, Hoshimachi Suisei, AZKi) who debuted before formal generation groups
      were established.
  - term: SorAZ
    meaning: The musical duo unit formed by Tokino Sora and AZKi.
  - term: miComet
    meaning: The popular duo unit formed by Sakura Miko and Hoshimachi Suisei.
  - term: ホロライブ
    meaning: Hololive; the female VTuber production agency managed by Cover Corp.
  - term: 開拓者
    meaning: Kaitakusha (Pioneers); the official fan demonym for AZKi's community.
  - term: エリート
    meaning: Elite; Sakura Miko's self-proclaimed status as an elite miko, often used
      playfully by fans when she makes funny mistakes.
  - term: 3D LIVE
    meaning: A virtual 3D concert stream where VTuber talents perform songs and dances
      on a 3D stage.
