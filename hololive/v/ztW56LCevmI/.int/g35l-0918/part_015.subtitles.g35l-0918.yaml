- subtitles:
  - start: '00:03.494'
    end: '00:06.024'
    original: 可愛い　可愛いでしょう？
    english: Kawaii... Kawaii, right?
  - start: '00:05.154'
    end: '00:06.924'
    original: ラプラス員聖。
    english: Laplus-sensei.
  - start: '00:06.924'
    end: '00:07.414'
    original: ほんとだ、可愛い。
    english: So cute.
  - start: '00:08.774'
    end: '00:10.964'
    original: まずは、ホロックスのみんなへ。
    english: First of all, to all the holoX members,
  - start: '00:11.774'
    end: '00:17.654'
    original: えー、今日私たちのためにこの配信を見てくださり本当にありがとうございます。
    english: thank you so much for watching this stream for us today.
  - start: '00:19.464'
    end: '00:25.754'
    original: ホロックスのみんながいるから私たちはこうやって3周年を迎えることができました。
    english: Because all of holoX is here, we're able to celebrate our 3rd anniversary
      like this.
  - start: '00:27.024'
    end: '00:33.274'
    original: 3年の間ホロックスでも個人個人の活動でも色々なことがありました。
    english: Over these past 3 years, whether in holoX or in our individual activities,
  - start: '00:34.204'
    end: '00:39.924'
    original: 1周年の時はまだ不安定で心配もかけましたね。
    english: things were still unstable and we had our worries at the 1st anniversary.
  - start: '00:40.484'
    end: '00:49.714'
    original: 私たち自身もこれからどう進むのか未来が霞んでいたとき道を照らしてくれたのはホロックスのみんななんだと思います。
    english: When our future seemed hazy and we wondered how we ourselves would progress,
      I think it was all of holoX that illuminated our path.
  - start: '00:51.274'
    end: '00:56.894'
    original: ホロックスにとってホロックスは太陽的な存在だと思っています。
    english: To holoX, holoX is a solar-like existence.
  - start: '00:57.104'
    end: '01:03.414'
    original: これから鷹嶺はホロライブでの活動は終了しちゃってホロックスは4人で活動していきますが
    english: From here on, Sakamata's activities on HoloLive will end, and holoX will
      continue as four members,
  - start: '01:06.124'
    end: '01:11.454'
    original: ホロックスはこれからも5人そしてプラスホロックスで永久不滅だと思っております。
    english: but we believe that holoX will forever remain as five, plus holoX.
  - start: '01:14.654'
    end: '01:15.544'
    original: 手が震えてる。
    english: My hands are shaking.
  - start: '01:16.424'
    end: '01:18.424'
    original: 手が震えとる。
    english: They're shaking.
  - start: '01:23.234'
    end: '01:25.324'
    original: 4年目の新たなステージに向かって頑張っていくので、これからも見守ってくれると嬉しいです。
    english: I'll do my best heading toward the 4th year's new stage, so I'd be happy
      if you continue to watch over us.
  - start: '01:29.844'
    end: '01:31.024'
    original: これからもよろしくお願いします。そして、ホロックスのみんな。
    english: Thank you for everything, and to all of holoX.
  - start: '01:34.724'
    end: '01:35.344'
    original: まずはラプ。
    english: First is Lap.
  - start: '01:37.764'
    end: '01:45.344'
    original: 自由奔放で勘違いされがちな総帥ですが、誰よりもホロックスを愛しメンバーを愛しているのは私達ホロックスに伝わってます。
    english: Though her wild and reckless nature often leads to misunderstandings,
      her immense love for holoX and the members is something that is truly conveyed
      to us.
  - start: '01:51.274'
    end: '01:54.674'
    original: ラプが総帥しかありえないなと思ってます。
    english: Lap being our general is something that couldn't possibly be any other
      way.
  - start: '02:00.084'
    end: '02:01.374'
    original: 自信を持ってこれからも私たちを導いてください。
    english: Please continue to guide us with confidence.
  - start: '02:01.764'
    end: '02:02.304'
    original: 自信を持ってください。
    english: Please have confidence.
  - start: '02:02.634'
    end: '02:04.224'
    original: あなたは総帥です。
    english: You're our general!
  - start: '02:07.724'
    end: '02:08.574'
    original: よろしくお願いします。
    english: Thank you so much.
  - start: '02:09.774'
    end: '02:09.914'
    original: そしてこよ。
    english: And Koyo.
  - start: '02:12.594'
    end: '02:18.994'
    original: 最初からこよはやる気満々まんで私たちを引っ張ってくれて、私もすごく心の支えにしてました。あ、今もです。
    english: Right from the start, Koyo's overflowing enthusiasm pulled us along,
      and she was a huge emotional support for me—ah, she still is.
  - start: '02:22.094'
    end: '02:22.444'
    original: 今もしてます。
    english: She still is!
  - start: '02:25.294'
    end: '02:29.564'
    original: 2人でデビュー直後不安なことを語り歩道を歩いたの覚えてますか？
    english: Do you remember walking the path of anxiety right after our debut, just
      the two of us?
  - start: '02:30.344'
    end: '02:30.564'
    original: 歩いた。
    english: I walked.
  - start: '02:33.104'
    end: '02:33.474'
    original: 歩いたね。
    english: We walked, didn't we?
  - start: '02:33.914'
    end: '02:49.234'
    original: その時の相談事とかこよあったと思うんですけど、今はみんなに愛される素敵なアイドルそして配信者になってるから、これからも先陣を切って色んな道を切り拓いていってください。いつでも頼ってね。
    english: We had various discussions back then, but now that you're a wonderful
      idol and broadcaster loved by everyone, please continue to forge ahead and pioneer
      new paths, and you can always rely on me.
  - start: '02:50.314'
    end: '02:50.564'
    original: うん。
    english: Yes.
  - start: '02:53.794'
    end: '02:55.774'
    original: いろは。
    english: Iroha.
  - start: '02:55.774'
    end: '02:56.034'
    original: はい。
    english: Yes.
  - start: '02:57.484'
    end: '03:11.834'
    original: 言いたいことなかなか言い出せない癖がまだ抜けてなくて心配になりますけど今まで通り手を携えてたまに道に迷いながらお互いマイペースに活動を楽しんでいきましょう。
    english: She still has trouble voicing the things she wants to say, which always
      makes me worry, but just like before, let's hold hands and occasionally wander
      off on detours as we enjoy our activities at our own respective paces.
  - start: '03:17.394'
    end: '03:19.464'
    original: またかまぼこ食べに行こうね。
    english: Let's go eat kamaboko again!
  - start: '03:20.014'
    end: '03:20.254'
    original: 食べる！
    english: I'll eat!
  - start: '03:22.564'
    end: '03:23.234'
    original: 食べよう！
    english: Let's eat!
  - start: '03:25.104'
    end: '03:25.684'
    original: ありがとう。
    english: Thank you.
  - start: '03:26.964'
    end: '03:28.474'
    original: そして、クロヱ。
    english: And Chloe.
  - start: '03:30.344'
    end: '03:36.564'
    original: えー、もうクロヱには言いたいことを個別に言ったのでわざわざというか感じではないんですけど。
    english: Well, I actually had things I wanted to say to Chloe individually, so
      I went out of my way to—well, not that there's much.
  - start: '03:37.074'
    end: '03:38.214'
    original: また、またですね。
    english: Not much, huh?
  - start: '03:39.114'
    end: '03:49.034'
    original: まあ、あの、お泊まりをしたこともあったし、喧嘩をしたこともあったし、色々あったけどデビュー前から最初に仲良くなったメンバーがクロヱでよかったなって思います。
    english: Well, we went on dates together, we fought too, we had all kinds of things
      happen, but ever since before our debut, I've always felt so glad that Chloe
      was the one I became close with first.
  - start: '03:59.854'
    end: '04:01.374'
    original: それはこれからも変わらないです。これからのホロックスを楽しみながら見ててくだいさい。
    english: That's something that will never change, so please keep enjoying holoX
      from here on out.
  - start: '04:07.724'
    end: '04:08.574'
    original: 絶対引きずり出すから。
    english: I'll definitely drag you along!
  - start: '04:10.964'
    end: '04:12.724'
    original: いや、それ怖いよ！
    english: Hey, that's terrifying!
  - start: '04:13.914'
    end: '04:18.574'
    original: クロヱの健康を願ってます。ゆっくり休め、クロヱ。
    english: I'm praying for Chloe's health. Please get plenty of rest, Chloe.
  - start: '04:18.894'
    end: '04:19.464'
    original: ありがとう。
    english: Thank you.
  - start: '04:20.124'
    end: '04:20.474'
    original: ありがとう。
    english: Thank you.
  - start: '04:21.844'
    end: '04:23.954'
    original: 本当にありがとうございます。
    english: Really, thank you.
  - start: '04:25.754'
    end: '04:32.484'
    original: えー、4年目も頼り甲斐のない、ええと、頼り甲斐のないアホな女幹部ですけど
    english: I'm just a foolish woman leader with zero dependability for this 4th
