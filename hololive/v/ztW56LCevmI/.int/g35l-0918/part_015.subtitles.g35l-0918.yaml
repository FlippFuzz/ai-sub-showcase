  - start: '04:41.004'
    end: '04:41.344'
    original: じゃあ最後に総帥。
    english: And finally, Laplus.
  - start: '04:42.594'
    end: '04:44.204'
    original: お願いします。
    english: Thank you.
  - start: '04:44.404'
    end: '04:44.754'
    original: なんで最後なんだろうって
    english: Why is it me last?
  - start: '04:46.404'
    end: '04:49.034'
    original: 総帥だからだよ！なぜなら総帥だからだよ！
    english: Because you're the general, duh!
  - start: '04:50.074'
    end: '04:55.074'
