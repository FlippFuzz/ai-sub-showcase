name: part_013
total_attempts: 1
video_duration_ms: 302727
subtitles_prompt_version: 18
responses:
- subtitles:
  - start: '00:00.089'
    end: '00:01.219'
    original: 皆殿に
    english: To you all,
  - start: '00:01.419'
    end: '00:07.119'
    original: 少しでも元気をお届けできたでしょうか、
    english: I wonder if we were able to bring you even a little bit of energy.
  - start: '00:08.579'
    end: '00:15.939'
    original: 少しでも皆殿が元気になっていてくれてたらとても嬉しいです。
    english: If it made you all even a little more energetic, I'd be so happy.
  - start: '00:17.379'
    end: '00:29.439'
    original: 今日5人でホロックス3周年記念ライブは最後だけれどちゃんとやり遂げられて本当に良かったです。
    english: Today's Holox 3rd anniversary live with the five of us was only at the
      end, but we managed to pull it off properly and I'm really glad.
  - start: '00:30.279'
    end: '00:40.409'
    original: 皆さん声が戻るまで待っていてくださり本当にありがとうございました。
    english: Thank you so much for waiting until my voice came back.
  - start: '00:41.879'
    end: '00:51.529'
    original: 3周年をこの5人とホロックスの皆さんと一緒に迎えられて本当に良かったです。
    english: I'm so glad we could celebrate our 3rd anniversary together with these
      five and all of you Holox members.
  - start: '00:53.079'
    end: '01:07.509'
    original: そしてホロックスの皆へ、デビューから今日までずっと一緒にいてくれて、頑張ってくれて本当にありがとうございます。
    english: And to everyone in Holox, thank you so much for being with me and working
      hard from our debut until today.
  - start: '01:09.119'
    end: '01:25.139'
    original: 今回風邪のことでライブが元気になっちゃった時も心強く承諾してくれて励ましてくれて、本当に感謝しかないです。
    english: Even when the live got energetic because of a cold this time, you strongly
      accepted it and encouraged me, and I can't thank you enough.
  - start: '01:27.029'
    end: '01:37.059'
    original: ラプラスへ、何びっくりしてんの？一緒にバカやってたくさん笑わせてくれて本当にありがとう。
    english: To Laplus, what are you surprised about? Thank you so much for acting
      foolish with me and making me laugh a lot.
  - start: '01:37.479'
    end: '01:48.339'
    original: 時刻があるかわかりませんが、そのおかげさんと優しさにとても救われています。
    english: I don't know if there's time, but thanks to that and your kindness, I've
      been saved so much.
  - start: '01:49.029'
    end: '02:07.139'
    original: ルイねえ、いつもたくさん話を聞いてくれてありがとう。声が出ない時ずっと連絡してくれてありがとう。いつも自信がない風も自信つけてくれて本当にありがとう。
    english: Lui-nee, thank you always for listening to me so much. Thank you for
      keeping in touch the whole time my voice wouldn't come out. Thank you so much
      for giving confidence to someone who always lacks it.
  - start: '02:08.579'
    end: '02:27.249'
    original: こよちゃんへ、いつも頑張る元気をくれて本当にありがとう。いつも一生懸命な姿を見てエネルギーたくさんもらっています。声が出なくて不安な時も声かけてくれてありがとう。
    english: Koyo-chan, thank you so much for always giving me the energy to try hard.
      Seeing your hard-working figure gives me so much energy. Thank you for speaking
      to me even when I was worried about losing my voice.
  - start: '02:29.809'
    end: '02:45.319'
    original: 黒へ、ちょっとしたことも気にかけてくれて、声をかけてくれて本当にありがとう。さりげない優しさにたくさん救われました。
    english: Chloe, thank you so much for caring about the little things and reaching
      out to me. I was saved so much by your casual kindness.
  - start: '02:47.379'
    end: '03:02.169'
    original: 本当は卒業すごく寂しいけれど、寂しいよ！バカヤロー！だよ。
    english: Honestly, graduation is super lonely, but it's lonely! You idiot!
  - start: '03:04.229'
    end: '03:09.119'
    original: ずっとこれからの暗いの未来も応援しています。
    english: I will continue to support your dark future ahead as well.
  - start: '03:09.700'
    end: '03:15.000'
    original: 困った時は頼ってくれたら嬉しいです。
    english: I'd be happy if you rely on me when you're in trouble.
  - start: '03:16.279'
    end: '03:34.200'
    original: そして最後にこの5人がホロックスで本当に良かったです。みんなのことがずっと大好きです。本当にありがとうございます。風真いろはより。
    english: And lastly, I'm so glad these five are in Holox. I'll always love everyone.
      Thank you very much. From Kazama Iroha.
  - start: '03:36.129'
    end: '03:44.200'
    original: よく読めました。
    english: I read it well.
  - start: '03:51.359'
    end: '03:55.359'
    original: えーまずはホロックス3周年ありがとうございます。
    english: Um, first of all, thank you very much for Holox's 3rd anniversary.
  - start: '03:56.129'
    end: '04:04.309'
    original: そこまでの都合で5人揃ってのライブは最後になってしまうんですが
    english: Due to circumstances, this will be the last live with all five of us
      together, but...
  - start: '04:05.429'
    end: '04:25.109'
    original: ホロックスの皆さんがたくさんの応援と愛を届けてくれたので最高のライブになったと思っています。本当にありがとうございます。
    english: Everyone in Holox has sent us so much support and love, so I think it
      became the best live. Thank you so much.
  - start: '04:33.129'
    end: '04:39.109'
    original: 最高のライブになったと思っています。本当にありがとうございました。
    english: I think it became the ultimate live. Thank you very much.
  - start: '04:44.200'
    end: '05:02.100'
    original: 賑やかでカオスで自由だけど、ここぞという時に一丸できるホロックスとの絆思い出は大切にして歩んでいきたいと思います。
    english: Lively, chaotic, and free, but I want to cherish the bonds and memories
      with Holox, who can unite when it counts, and walk forward.
