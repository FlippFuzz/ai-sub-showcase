    First, the audio and visual inspection. The video starts with promotional material for the 3rd Anniversary release. I need to make a judgment call: *do* I subtitle those opening promo slides? While the prompt provides clear guidance, standard practice with VTuber teasers is often to skip them. The "Handling Silent On-Screen Text Before Dialogue" section of the document, the example given, focuses on silent text *before* dialogue – this is two minutes of commercial fluff before the song itself. I decide to hold off, but I'll make sure there are no other prominent text overlays during the actual song starting at 01:54.

    So, 01:54 is the vocal start. The lyrics are meticulously transcribed, each phrase gets its own block and timing. Every line must be perfect, especially given the rapid-fire nature of the song. The spoken intro, then Chorus 1, Verse 1, Chorus 2, Verse 2, more choruses, bridge, and finally the big finish: Every millisecond is noted, and the translations aim for both natural flow and capturing the song's energy. I'm checking for background ad-libs, spoken lines (like "(Deござる!)"), but if they are ad-libs, they don't get subtitles unless otherwise explicitly instructed.

    After the transcription and translation, I do a rigorous review of those subtitle blocks, verifying the start and end times, the original Japanese lyrics, and the final English translation. Line breaks are all proper – adhering to the 50-character limit. The "no ghost subtitles" rule is absolutely critical, but easy to accomplish given that the promo section gets no subs.

