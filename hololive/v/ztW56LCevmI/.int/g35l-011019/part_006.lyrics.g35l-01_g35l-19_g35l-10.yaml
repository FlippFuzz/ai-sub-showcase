  original: ん？ 何って……実験？
  english: Huh? What do you mean... an experiment?
- start: '03:40.050'
  end: '03:44.950'
  original: それぜっっっったいだめだよ！ なんかめちゃくちゃ嫌な濁り方してるって！
  english: That's abso-lutely no good! It's turning into some super gross, murky mixture!
- start: '03:45.050'
  end: '03:46.950'
  original: え？ それがいいんじゃん
  english: Eh? But that's what makes it good.
- start: '03:47.050'
  end: '03:51.850'
  original: やめようよ！ それ掃除するの沙花叉の仕事になるんだからさぁ！！
  english: Stop it! Cleaning that up is going to be my job!!
- start: '03:52.000'
  end: '03:58.500'
  original: ふふふふ……知ってる？ 奇跡も！ 魔法も！ あるらしいよ！
  english: Hehehehe... did you know? Miracles! Magic! Apparently they exist!
- start: '03:59.000'
  end: '04:03.500'
  original: もうすでにおかしくなってんじゃん！ もーーーーーっ！
  english: You've already gone crazy! Jeez──────!
- start: '04:28.000'
  end: '04:38.500'
  original: 伝えあった こころの温度を そっと大事そうに抱え歩いていた
  english: We gently cradled and walked with the temperature of the hearts we shared.
- start: '04:39.000'
  end: '04:47.500'
  original: 答えのない 願いの中で 言葉は未来へ変えて
  english: Within a wish with no answer, turning words into the future...
- start: '04:48.500'
  end: '04:59.500'
  original: 幼い頃 ずっと夢に見ていた 私にはまだ遠いけど 君がいれば
  english: Ever since I was little, I've always dreamed of it. It's still far off
    for me, but as long as you are here...
