global_summary:
  overall_summary: This video is the 3rd-anniversary 3D live stream of Hololive's
    6th generation VTuber unit, Secret Society holoX, titled '【3D LIVE】秘密結社holoX3周年
    3DLIVE【#SSholoX3周年】'. The broadcast features all five members—La+ Darknesss, Takane
    Lui, Hakui Koyori, Sakamata Chloe, and Kazama Iroha—performing unit songs, duets,
    and a special medley. It also includes comedic merchandise introductions, heartfelt
    personal letters exchanged between the members reflecting on their three-year
    journey, and emotional farewells as Sakamata Chloe concludes her activities in
    Hololive.
