global_summary:
  overall_summary: This video is the 6th-anniversary 3D live stream of Hololive Gamers
    titled '【3D LIVE】げまずえでぃしょん!!!!' held on December 14, 2024. The stream features
    all four members—Shirakami Fubuki, Ookami Mio, Nekomata Okayu, and Inugami Korone—performing
    a dynamic setlist consisting of group numbers, self-produced solo songs where
    members picked tracks for one another via an omikuji lottery, duet performances,
    merchandise announcements, and event updates. The stream concludes with their
    signature group anthem and warm celebratory remarks commemorating six years of
    Hololive Gamers.
