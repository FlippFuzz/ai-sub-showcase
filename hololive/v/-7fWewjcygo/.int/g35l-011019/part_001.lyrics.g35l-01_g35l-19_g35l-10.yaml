  end: '02:54.616'
  original: 手と手りあたるから怖くないよね 夢の計測メーターは振り切れそうだよ
  english: Touching hands means we aren't scared anymore! The dream's measurement
    meter is about to max out!
- start: '02:55.216'
  end: '03:04.476'
  original: 地球からやってきたボクらは 本日も Go ahead! 怒られても止まれないのです 騒々しくてもごめんなさーい！
  english: We came from Earth, today too, Go ahead! Even if we get scolded, we can't
    stop—sorry for being so noisy!
- start: '03:04.916'
  end: '03:09.336'
  original: 先陣誰だい？ボクらだい！いわゆる前人未踏の秘境だとなあ そいやっ！
  english: Who's taking the lead? We are! It's what you call an uncharted frontier,
    soiya!
- start: '03:19.976'
  end: '03:24.716'
  original: 譲らないないない100歩目も 百歩譲るなんて負けだよ駄目だよ
  english: We won't yield even a single step! Yielding a hundred steps means losing,
    no way!
- start: '03:24.976'
  end: '03:29.616'
  original: ゴールへのロードはジャリと岩だらけで 泣いても顔はに・や・り
  english: The road to the goal is full of gravel and rocks, but even when crying,
    our faces are grinning!
- start: '03:29.976'
  end: '03:37.456'
  original: そんな時あきらめ悪く進め だってほらあきらめたくない夢が 進化してみんないて果ての果ての空へ
  english: At times like that, press forward stubbornly! Because look, there are dreams
    we don't want to give up on, evolving together towards the edge of the sky!
- start: '03:37.776'
  end: '03:39.856'
  original: 連れ去るボクら地球女子
  english: We earth girls are taking you away!
- start: '03:39.856'
  end: '03:43.796'
  original: 憧れたんだ星の光は消えないときめき
  english: We longed for it, starlight is an unfading excitement!
- start: '03:44.256'
  end: '03:48.876'
  original: 心拍数上がりまくり暴れちゃお MONSTERS 痛快で不敵 PIKA STARS!
  english: Heart rate skyrocketing, let's go wild MONSTERS, thrilling and fearless
    PIKA STARS!
- start: '03:49.276'
  end: '03:52.296'
  original: 瞬きらめき上昇中 つまり好調中
  english: Blinking sparkle rising, meaning we're in top form!
- start: '03:52.476'
  end: '03:54.676'
  original: 多分勝利は、キマっちゃってる！
  english: Victory is probably already secured!
- start: '03:54.916'
  end: '03:59.956'
  original: バンドじゃないからせせっせっかっこつけなければ バンドじゃないからよいよいよいかっこがつくものだよ
  english: It's not a band, so if we don't put on airs... It's not a band, so it actually
    looks cool!
- start: '04:00.356'
  end: '04:04.796'
  original: ばか騒ぎやんちゃ騒ぎやったもん勝ち狙っちゃえ未来！ チェスト！
  english: Foolish ruckus, mischievous ruckus, winners take all—aim for the future!
    Chest!
- start: '04:05.156'
  end: '04:09.976'
  original: 銀河のどっかの頂点に旗を立てるまで ニューなレコードの更新は続くんだってば
  english: Until we plant our flag at the peak somewhere in the galaxy, breaking new
    records will just keep going!
- start: '04:10.376'
  end: '04:13.436'
  original: 地球からやってきたボクらよやりまくれ Go ahead!
  english: Us coming from Earth, go wild, Go ahead!
- start: '04:14.376'
  end: '04:18.176'
  original: さあ次の星へ！
  english: Now, to the next star!
- start: '04:22.956'
  end: '04:27.416'
  original: 一歩が百歩の始まりだから行こうよすぐに行こうよ
  english: A single step is the beginning of a hundred steps, so let's go, let's go
    right now!
- start: '04:27.756'
  end: '04:32.416'
  original: 無理は道理よりも強引だから瞬間をキミと一緒にね
  english: Forcing things is bolder than reason, so let's share this moment together
    with you!
- start: '04:33.336'
  end: '04:37.896'
  original: 真っ暗な空かもしれないけど僕らは輝きたい お目々を開いてお目々を離すなよー？
  english: The sky might be pitch black, but we want to shine—open your eyes, don't
    look away, okay?
- start: '04:38.256'
  end: '04:44.476'
  original: モンスター！モンスター！モンスター！前人未踏の宇宙に全速の全力でGOだYeah！！
  english: Monster! Monster! Monster! Into the uncharted universe at full speed and
    full power, GO yeah!!
- start: '04:49.776'
  end: '05:00.023'
  original: 楽観だいそうだどうだっ
  english: Optimism is right, isn't it?!
