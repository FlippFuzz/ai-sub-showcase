    original: '[獅白ぼたん] ひとつ……声……あっ！！！'
    english: '[Shishiro Botan] One... voice... Ah!!!'
  - start: '04:49.089'
    end: '04:51.689'
    original: '[獅白ぼたん] 私たち、新曲作ってたじゃん！！！'
    english: '[Shishiro Botan] We were making a new song, weren''t we?!'
  - start: '04:53.049'
    end: '04:53.869'
    original: '[全員] あっ…'
    english: '[All] Ah...'
  - start: '04:55.269'
    end: '04:57.909'
    original: '[尾丸ポルカ] わすれてたーーー！！！'
    english: '[Omaru Polka] We forgot itーーー!!!'
