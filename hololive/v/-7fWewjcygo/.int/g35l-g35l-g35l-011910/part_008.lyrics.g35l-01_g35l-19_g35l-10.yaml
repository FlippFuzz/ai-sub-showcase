  overall_summary: This video is a special 3D live stream titled '【3D LIVE】ねぽらぼ学園
    ☆5周年記念！！輝く学寮祭☆' celebrating the 5th anniversary of Hololive 5th Generation (Nepolabo),
    consisting of Momosuzu Nene, Yukihana Lamy, Shishiro Botan, and Omaru Polka. Framed
    as a school dormitory festival ('Gakuryōsai') drama at 'Nepolabo Gakuen', the
    members scramble to plan their festival booths and performances, leading into
    an eclectic and high-energy setlist of original songs, band covers, pop covers,
    and a special anniversary merchandise showcase. The concert highlights their deep
    friendship, comedic banter, and musical evolution over five years, culminating
    in the debut of their new original single 'Hitotsu ni Naru Koe'.
