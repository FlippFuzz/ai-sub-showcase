global_summary:
  overall_summary: This video is the 6th anniversary 3D live concert of Hololive 1st
    Generation, titled '1st generation Princess Party♪♪', streamed on June 1, 2024.
    Featuring Shirakami Fubuki, Natsuiro Matsuri, Aki Rosenthal, and Akai Haato, the
    concert adopts a royal princess theme with castle stages and elegant costumes.
    The setlist includes group performances, solo tracks, and duos covering popular
    idol and vocaloid songs, interspersed with MC chat segments and photo shoots.
    The members also announce their 6th anniversary merchandise, individual anniversary
    streaming schedules, and unveil the brand-new 2nd original group song 'Secret
    Garden'.
