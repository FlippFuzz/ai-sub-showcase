      fine! She's cute so I'll forgive her!
  - start: '02:57.060'
    end: '03:11.060'
    original: ねえ、まあそしてね、本当にもう6周年、7年、いや頑張った、我々は本当に！ね、7年目またラッキーセブンで、なんかね、いいこといっぱいあるといいなと、思っておりますね！
    english: Right, well and truly 6 years, 7 years, man we've worked hard, really!
      We hope there will be lots of good things in our 7th year with lucky seven!
  - start: '03:11.060'
    end: '03:45.060'
    original: ああ、そうだ！それもこれもね、今日来てくれているあの、王子様の皆様、今日王子様のね、皆様たちのおかげなので、王子様が今日は王子、みんなが王子様か！王子様か！王子様じゃないよ！王子様か！王子様じゃないの！
    english: Ah, that's right! All of this is thanks to all the princes who came to
