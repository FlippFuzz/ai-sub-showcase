    original: ちょっと1曲目をねお姫様にしてよから歌わせていただきました！
    english: We had them sing "Make Me a Princess!" for our very first song!
  - start: '00:19.860'
    end: '00:23.760'
    original: ちょっとね今回なんとステージも1期生のライブ仕様になりました！
    english: And you know what, this time even the stage has become a 1st Gen-exclusive
      live setup!
  - start: '00:24.060'
    end: '00:36.760'
    original: かわいい！すごい！めちゃくちゃ豪華じゃん！ね！みんなで建てた白いお城！
    english: Cute! Amazing! It's so luxurious! Right?! A white castle we all built
      together!
  - start: '00:36.760'
    end: '00:52.760'
    original: そして上のほう実を言うと時計があるんですが、この時計12時と見せかけて実は23時59分で止まってる！1分前！魔法溶けないね！魔法溶けないです！
    english: And actually, up top there's a clock, but while it looks like 12 o'clock,
      it's actually stopped at 11:59 PM! One minute before! The magic won't wear off!
      The magic won't wear off!
  - start: '00:52.760'
    end: '01:13.260'
    original: そうなんです！そしてなんと今回ね、ステージ、今日来てくれている皆さんがのステージ、ステージ観客席がなんと参加席まであるの！本当だ！みんな！参加席めちゃくちゃ楽しんでいってね！
    english: That's right! And what's more, this time the stage—everyone here today—the
      audience seats even include participatory seats! Really! Everyone! Enjoy the
      participatory seats to the fullest!
  - start: '01:13.260'
    end: '01:21.060'
    original: いやすごい、すごい人ですよ、これね！ねえ、みんなの声が聞こえる気がする！
    english: Man, that's amazing, such a huge crowd, you guys! Hey, I feel like I
      can hear everyone's voices!
  - start: '01:21.060'
    end: '01:45.060'
    original: はい、ということでちょっと我々ね、6周年を迎えましたのでちょっと改めて、なんかね、ちょっと振り返ってとか、ま、これからね、我々7年目に向けてでもいいんですけど、このライブの意気込みでも全然いいですし、もうヤバい、ヤバい、毎年周年来てるけどもうそんなに経ったっていう、本当にそれだよ！
    english: Right, so since we've reached our 6th anniversary, let's take a look
      back at things, or talk about heading into our 7th year, or even our enthusiasm
      for this live—man, it's crazy, every year we reach another anniversary, but
      I can't believe it's been this long, seriously!
  - start: '01:45.060'
    end: '01:59.060'
    original: じゃあちょっと、はーちゃんもある？なんで、はーちゃんも聞かせてよ！いや、長いですね、何年目もね、にゃにゃにゃにゃ、やっぱりアイドルらしく、アプデされたアイドルとしてこれからも頑張っていきたいと思います！
    english: So Haato, do you have some? Come on, let us hear from Haato too! Man,
      it's been so long, year after year, Nya-nya-nya-nya, as an updated idol, I want
      to keep doing my best as an idol moving forward!
  - start: '01:59.060'
    end: '02:20.060'
    original: ではあきちゃん！早い！まあまあまあ、まさかね、やっぱ7年も続けてこられるっていうのを、もう想像もしてなかったけど、でも今こうやってね、みんなと一緒に、まあライブできるのはめちゃくちゃ嬉しい！嬉しい！
    english: And now Aki-chan! That was fast! Well, I never imagined we'd be able
      to keep going for 7 years, but right now being able to do a live together with
      everyone like this makes me so happy! So happy!
  - start: '02:20.060'
    end: '02:35.060'
    original: まあ、あーてんに、まあね、足を引っ換えないぞということで、7年目もラッキーセブンにあやかっていっぱい頑張っていきたいと思います！
    english: Well, so we don't fall behind, for our 7th year we want to make the most
      of lucky seven and work hard!
  - start: '02:35.060'
    end: '02:50.060'
    original: ではね、みんな王子様だからね！そうそうそうそう、そうだよ！祭りのも、あの、7年目もね7年目に向けて頑張るのでね、あの、今年こそは王子様を見つけたいと思います！祭りの中にいるかな？
    english: Well, everyone's a prince, right? That's right, exactly! Matsuri will
      also work hard toward our 7th year, so I want to find a prince this year! Is
      one of them in here?
  - start: '02:50.060'
    end: '02:57.060'
    original: やめて、やめてください！やめてください！可愛いだろ！可愛いからいいよ！可愛いから許すよ！
