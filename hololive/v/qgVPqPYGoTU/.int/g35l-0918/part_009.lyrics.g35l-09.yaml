    reference_lyrics_og: |-
      通りすがりの猫につけた へんてこな名前覚えてる? 僕は未だにあの鳴き声さえ 夢に見る日だってある

      そのまま語って歩いたよな コンビニエンスな時代にさ でかい夢ほど燃えてくるんだぜ 馬鹿なまま笑ってたい

      エラー出くわしたって、さあ トテチテタ どこかできっと マルスも 笑ってるさ 行こう

      遊び尽くせ merry-go-round 一か八か乗り込んだら 手招きしたヴィーナスに ほらピースサイン向けて 止まらないで merry-go-round 手綱握り締めたら お気に召すままに その世を 回せ 回せ 回せ

      そうだ別れ際に行ったよな どうせ産み落とされたなら トンチでもきかせながら 花咲かせ生きよう

      ドラマにしようぜ、さあ トテチテタ それもいいねと マルスも笑ってるさ 変わらずにあの声で鳴いてくれ

      でかすぎると笑うやつらに とびきりクールなデコピンを 夢はいつでもそう アトラクション 捨てたもんじゃないぜ どんな日々もおもちゃに変えて チャチャチャと鳴らせ合いの手を 必ず誰かが見てくれる 照らされる時はすぐそこに

      愛してるよ merry-go-round 一度きりが輝いてる 金色に光るその世を 回せ 回せ 回せ

      遊び尽くせ merry-go-round 一か八か乗り込んだら 手招きしたヴィーナスに ほらピースサイン向けて 止まらないで merry-go-round 手綱握り締めたら お気に召すままに その世を 回せ 回せ 回せ
      一度きりを回せ
