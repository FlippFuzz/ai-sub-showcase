    The clip kicks off with Lui presenting holoX merchandise. I see it's merch for all the members, and I take note of the initial excitement from the group. She moves on to keychains, rubber mats (a slick design, I must say), an attaché case (secret society vibes, naturally), and 2nd Anniversary pin badges. I'm taking into account the expressions and reactions of the others, and the need to include that context in the subtitling.

    I see that Lui highlights the merchandise, and the others are engaged. There's a playful energy as she moves through each item. A promotional video for a drama mystery event is played, which is interesting. Koyori explains a holoX-themed riddle-solving event set in Shibuya, featuring a "Labyrinthine Labyrinth" theme. The video includes a short video which includes our original music. Then Koyori emphasizes the event tickets going on sale at a specific time.

