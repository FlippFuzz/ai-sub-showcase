global_summary:
  overall_summary: This YouTube livestream celebrates the 2nd anniversary of Hololive's
    5-member VTuber unit 'Secret Society holoX' (秘密結社holoX), featuring members Laplace
    Darknesss, Takane Lui, Hakui Koyori, Sakamata Chloe, and Kazama Iroha. The stream
    introduces a grand conceptual theme park called 'Virtual Eden holoX Land' and
    invites guest VTubers Shirogane Noel, Roboco, and Aki Rosenthal to test-run hilarious,
    chaotic theme park attractions ('Wheel Shooter X' quiz ride and 'Bomb Rage Wire
    Maze'). Interspersed with major announcements regarding 2nd anniversary merchandise,
    a real-world Shibuya escape room puzzle event, a TV short anime, and HoloPlus
    campaigns, the stream culminates in high-energy musical performances of holoX's
    iconic songs 'Joya Repaint' and their anniversary single 'Kyouen Solidarity ~SHAKE★NABE~'.
