  - start: '03:25.700'
    end: '03:32.000'
    original: うおおおおお！すごい！実際に持ってみてどうですか？
    english: Uoooooh! Amazing! How does it feel to actually hold it?
  - start: '03:32.200'
    end: '03:36.500'
    original: 持ってみてなんて言えない！重いなんて言えない！
