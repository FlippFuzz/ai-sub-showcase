  thoughts: |+
    **My Thoughts on the Event**

    Okay, here's what I'm thinking about this event: First, If you couldn't get the merch, it's available for preorder! Second, the Docomo home 5G collab is done. Did you all grab the giant towel and fan? Awesome!

    Safety first, everyone! As a reminder there is a post-event exclusive acrylic panel! Did everyone know? Get one if you're thinking "oh wait!". More fun is coming!

    We have a CheerSPOT collab! You can put up ads to support Gamers! I use it a lot, so that's awesome. I saw the ads at the venue and they look great. We have life-sized figures now! They showed FubuMio at EXPO, and now OkaKoro too!

    The figures are available for pre-order, and they're so cute! The bonus sticker offer is so cool! Pre-order FubuMio too, it’s back for a limited time! Get the four Gamers together!

    Lastly: there are sponsored items from Candaful! We have super popcorn and super grilled chicken! It has the event key visual! It's ¥1000 for popcorn and ¥1500 for the canned chicken! The popcorn is salted caramel, and the canned chicken is grilled! There is a trading card!

    The items sold out at Cyber Goods Store! But don't worry, a second sale starts at 10 PM tonight! These are limited quantities, so act fast! It is also on Candaful's site! Also, check all post-event items! Deja vu? Alright, let's depart. FubuMio station is next!

    Goodbye everyone! It’s over! We also have a live viewing in Korea today! Everyone in Korea, can you see us? Annyeonghaseyo! Kamsahamnida! I checked the posts with photos! Please enjoy! Saranghaeyo!


