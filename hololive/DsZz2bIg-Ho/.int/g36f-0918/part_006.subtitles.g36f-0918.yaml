    The tricky part comes in those bonus challenge sections; that is where I had to really listen and make sure every line was captured from the bonus challenge, from "Say!! こーん こんっ！" (Kon kon!) to the audience responses. I'm double-checking the timings, particularly in the rapid-fire bonus challenge section at 03:43.000, and making sure the "PERFECT!!" callout is properly tagged.

