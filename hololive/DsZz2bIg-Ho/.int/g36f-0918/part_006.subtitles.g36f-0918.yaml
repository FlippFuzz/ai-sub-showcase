    First, I identified the key segment, which runs from the countdown at the start, and then I needed to zero in on the exact vocal start at 00:22.000.  The first lyric: "ホロライブ ゲーマー ズ！" ("Hololive Gamers!"). From there, I meticulously transcribed the lyrics, matching them to precise timestamps. I listened very carefully, making sure every syllable was accounted for, especially during those dynamic moments when the girls are riffing off each other.

