name: part_007
total_attempts: 1
video_duration_ms: 300008
lyrics_prompt_version: 9
response:
  global_summary: The video features a digital scrapbook collage of fan art, messages,
    and congratulatory notes dedicated to hololive 5th fes. 'Capture the Moment',
    accompanied continuously by the official event theme song 'Capture the Moment'
    by hololive IDOL PROJECT playing in the background across 20 chronological visual
    slides.
  scenes:
  - start: '00:00.000'
    end: '00:15.900'
    description: First slide of fan art and messages for hololive 5th fes with 'Capture
      the Moment' written in cursive in the center, accompanied by the opening of
      the theme song.
    contains_vocal_music: true
    song_title: Capture the Moment
    original_artist: hololive IDOL PROJECT
    performer_in_video: hololive IDOL PROJECT
    original_language: Japanese
    reference_lyrics_og: |-
      あの涙が今の僕らをつなげて
      この心に君のカケラがいるから一人じゃないから
      いつか描いた文字の中
      目をとじた先に色づく景色が揺れた
      少し戸惑う風の中 (響く)
      重なる花びら私たちの声
      一瞬 (一瞬) 一瞬 (一瞬) 捕まえるみたいに
      もっと (もっと) もっと踏み出せたら 【we are one】
      あの涙が今の僕らをつなげて (繋げて)
      この心に君のカケラがいるから
      強くなくてもいい (なくてもいい) 今の光を
      僕と (君と) 集め (すべて) 空に放つ
      この奇跡を僕らでそっと輝かせるから (その手で) 力が湧くから
      新たな種を握りしめ
      遠い未来へと強く願い込め撒いた
      希望の風を吹かせては (泳ぐ)
      理想の花びら祈る明日の空
      何百 (何百) 億も (億も) 光る星みたいに
      ずっと (ずっと) ずっと終わらないから
      この笑顔が過去を強く抱きしめて (抱きしめ)
      今未来にこの手伸ばしてゆくから
      時に転んでも (それでいい) 空を見上げよう
      笑い (泣いた) 日々を (すべて) 刻んでゆく
      次の夢を掴み取るって約束するから (この手で) 踏み出そうここから
      (we are with you we are with you)
      同じ未来を見ていたい あの夢手ニしたい
      (we are with you capture the moment) 触れた奇跡の中で
      その先 まで 続く空にまぎれ たら
      君の場所と今をつなげたくて
      あの涙が今の僕らをつなげて (繋げて)
      この心に君のカケラがいるから
      強くなくてもいい (なくてもいい) 今の光を
      僕と (君と) 集め (すべて) 空に放つ
      この奇跡を僕らでそっと輝かせるから (その手で)
      咲かせようここから (一緒に)
      一人じゃないから 【we are one】
    reference_lyrics_en: null
