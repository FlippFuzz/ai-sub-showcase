    reference_lyrics_en: |-
      Has your pulse passed through the rouge?
      Here we go!
      No fault, no fault! The queen of beauty is not guilty!
      Marine, marine! Marine is not guilty!
      So bright-bright, tide so-so!
      Hey, didn't you say it? That age is nothing more than a number
      So you'll overlook all those explosive mines and love me unconditionally?
      Hey, hey, didn't you say it, did you not? Huh, so you're going to act like that
      Ah, and just so you know, on this ship, beautiful girls are free from blame
      No matter what we do!
      I got it, magic will make me young again!
      And I'll show you my hidden colors only to you
      Because you're special!
      Ah, I'll be a mess
      Ah, no port can excite me
      Recently, I've been feeling
      Like it must be the power of a treasure island! (Set sail!)
      Cuteness makes the right, this beautiful girl is not guilty
      Aiming to be your number 1, hold your ground!
      I lack confidence, but I'll do my best to achieve it! (Ahoy!)
      Kyu kyu kyu run, kyu kyu kyururun
      So in love, sweet 17
      The clock will strike midnight, adult time!
      (So bright-bright, tide so-so)
      Has your pulse passed through the rouge?
      Not yet, it's too early
      Is-is-is this wrong?
      If I wear a dress with ruffles (No, it's fine)
      Does-does-does it have anything wrong with wanting to be a magical girl sometimes? (Guilty, guilty? Just a little!)
      The course is decided to be by the southwest! Do you lack initiative, crew?
      Do you prefer younger girls too?
      I'll do anything, so please don't leave me, crew!
      (I want to see you at your best)
      Ah, sometimes I get discouraged
      Ah, is that okay?
      I'm at that age, so I must take it seriously
      Even in stormy seas
      Shall we go together?
      (Set sail!)
      Conquering your heart, this beautiful girl is not guilty
      Huh, what's wrong? You call me a nuisance, but still
      You give me attention, and that's what I like (Ahoy!)
      Kyu kyu kyu run, kyu kyu kyururun
      Be nice to this sweet 17-year-old
      Give me your sweet experience and enjoy, chu
      (So bright-bright, tide so-so)
      Has your pulse passed through the rouge?
      Ah~ please have mercy!
      Forgive Marine, for being
      Charming, seductive, irresistible!
      Quite a sinful woman, aren't you?
      Hold me tight, and don't let me go
      I'll show you how big this world is!
      (Set sail!)
      Cuteness makes the right, this beautiful girl is not guilty
      Aiming to be your number 1, hold your ground!
      I love jokes, but I can also be serious (Ahoy!)
      Kyu kyu kyu run, kyu kyu kyururun
      So in love, sweet 17
      The clock will strike midnight, adult time!
      (So bright-bright, tide so-so)
      Has your pulse passed through the rouge?
      Not yet, it's too early
      No fault, no fault! The queen of beauty is not guilty!
      Marine, marine! Marine is not guilty!
      So bright-bright, tide so-so!
      You don't call me Marine, it's Captain Marine to you, understand?
