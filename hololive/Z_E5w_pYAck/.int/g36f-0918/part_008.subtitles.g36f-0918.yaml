    original: なるよね
    english: It really does.
  - start: '00:01.380'
    end: '00:03.500'
    original: でもこれで知ってくれた人もいるよね、たぶん
    english: But maybe there are people who learned about us from this too.
  - start: '00:03.500'
    end: '00:05.500'
    original: ねー、絶対そう！ うれしい！
    english: Right? Absolutely! I'm so glad!
  - start: '00:05.500'
    end: '00:07.000'
    original: もう1枚あります！ ドン！
    english: There's one more! Bam!
  - start: '00:07.000'
    end: '00:09.500'
    original: おー！ え、新宿？ あ、後ろにも映ってる！
    english: Oh! Wait, Shinjuku? Ah, it's showing in the back too!
  - start: '00:09.500'
    end: '00:15.000'
    original: あれ？ あれ？ 消えた？ 嘘でしょ？！ 聞いてないよ！
    english: Wait, what? Did it vanish? You've got to be kidding! Nobody told us!
  - start: '00:15.000'
    end: '00:19.500'
    original: 待って、今日の21時前に流れていたあの良く分からないやつ？
    english: Wait, was that that weird mystery clip that aired before 21:00 today?
  - start: '00:19.500'
    end: '00:23.000'
    original: おい！ 流れてたのかよ！ 大丈夫か？
    english: Hey! So it was playing?! Is this okay?
  - start: '00:23.000'
    end: '00:30.500'
    original: もっとさ、なんかかっこいいMVとか、ライブ映像とか流したら...
    english: If you were gonna show something, why not cool MVs or live footage?
  - start: '00:30.500'
    end: '00:36.000'
    original: ほんとだよ！ でもありがとう！ やったー！
    english: Seriously! But thank you! Yay!
  - start: '00:36.000'
    end: '00:41.000'
    original: と言うことでこちら、応募どれぐらい来たと思う？
    english: So, for this... how many applications do you think we got?
  - start: '00:41.000'
    end: '00:46.000'
    original: でも平日の昼間だからね、100人とか来てくれたら...
    english: But it was a weekday daytime, right? If even 100 people showed up...
  - start: '00:46.000'
    end: '00:50.000'
    original: 平日の真っ昼間だからね。なんと！
    english: Right in the middle of a weekday. And the result is...
  - start: '00:50.000'
    end: '00:54.000'
    original: 数千人の応募が来たということです！
    english: We received applications from several thousand people!
  - start: '00:54.000'
    end: '00:58.000'
    original: すごすぎる！ ありがとう！ 恐ろしいよ！
    english: That's amazing! Thank you so much! That's insane!
  - start: '00:58.000'
    end: '01:03.000'
    original: そんなに？！ ちょっと給料もらったせいだ！
    english: That many?! Is it because they paid salaries?!
  - start: '01:03.000'
    end: '01:07.000'
    original: 給料もらったせい？ もらってるに決まってるでしょ！
    english: Because they got paid? Of course they get paid!
  - start: '01:07.000'
    end: '01:12.000'
    original: いろはより多めに渡してます。やめて！
    english: I paid them more than I pay Iroha. Stop that!
  - start: '01:12.000'
    end: '01:20.000'
    original: ありがとうございます！ 参加してくれた皆さんもありがとう！
    english: Thank you so much! Thanks to everyone who participated too!
  - start: '01:20.000'
    end: '01:25.000'
    original: そして、次はなんだ？ オープン！
    english: And what's next? Open!
  - start: '01:25.000'
    end: '01:30.000'
    original: 来ました！ じゃじゃーん！ タワーコラボだー！
    english: Here it comes! Ta-da! It's a Tower Collaboration!
  - start: '01:30.000'
    end: '01:38.000'
    original: タワーコラボ、もう情報公開されていますが、こちら！
    english: Information for the tower collab has already been released, but here
      it is!
  - start: '01:38.000'
    end: '01:46.000'
    original: 全国4箇所で行われる『秘密結社holoX Tower Invasion』！
    english: '"Secret Society holoX Tower Invasion", taking place at 4 locations nationwide!'
  - start: '01:46.000'
    end: '01:56.000'
    original: さっぽろテレビ塔、東京タワー、中部電力 MIRAI TOWER、梅田スカイビルで開催されます！
    english: It'll be held at Sapporo TV Tower, Tokyo Tower, Chubu Electric Power
      MIRAI TOWER, and Umeda Sky Building!
  - start: '01:56.000'
    end: '02:00.000'
    original: 俺たちがタワーだ！ おい、待て待て！
    english: We are the towers! Hey, wait, wait!
  - start: '02:00.000'
    end: '02:08.000'
    original: 今回大事なことがあるんですけど、ちゃんと予約しないと入れないんで事前予約必須です！
    english: 'There''s an important detail this time: you can''t get in without a
      reservation, so advance booking is required!'
  - start: '02:08.000'
    end: '02:14.000'
    original: そう、事前予約を忘れてる人もいると思うので。その場で行っても入れないらしいんで。
    english: Right, some people might forget to book in advance. Apparently you can't
      enter on the spot.
  - start: '02:14.000'
    end: '02:20.000'
    original: ちゃんと予約忘れないように！ よろしくお願いしますよ！
    english: Make sure not to forget your reservation! Please keep that in mind!
  - start: '02:20.000'
    end: '02:27.000'
    original: よろしくね！ 次！ 次！
    english: Please do! Next! Next!
  - start: '02:27.000'
    end: '02:30.000'
    original: オープン！ はい！
    english: Open! Yes!
  - start: '02:30.000'
    end: '02:36.000'
    original: なんと！ ホロライブの新しいサービス！ ライブの感動を最速で手元に！
    english: What?! A new Hololive service! Bring the live excitement to your hands
      faster than ever!
  - start: '02:36.000'
    end: '02:42.000'
    original: おー、すごい！ どういうことだ？
    english: Oh, awesome! What does that mean?
  - start: '02:42.000'
    end: '02:51.000'
    original: 秘密結社holoX 4周年のライブブロマイドが！ 今日のライブの写真が明日からコンビニでプリントアウトできるんだって！
    english: Secret Society holoX 4th Anniversary Live Bromides! Photos from today's
      live can be printed out at convenience stores starting tomorrow!
  - start: '02:51.000'
    end: '02:56.000'
    original: 手に入るんだ！ 対象店舗はファミリーマート、ローソン、ミニストップになります！
    english: You can get them! Target stores are FamilyMart, Lawson, and MiniStop!
  - start: '02:56.000'
    end: '03:03.000'
    original: イェーイ！ いっぱいある！ ありがとうございます！
    english: Yay! There are so many! Thank you so much!
  - start: '03:03.000'
    end: '03:08.000'
    original: そして、今からネットで事前購入ができるらしいです！ マジで？
    english: And apparently you can pre-purchase them online starting right now! Seriously?
  - start: '03:08.000'
    end: '03:17.000'
    original: 明日からコンビニでも写真を選びながら購入することもできるみたいなので、詳しくは左下のリンクから確認してみてください！
    english: Starting tomorrow you can also choose and buy photos at convenience stores,
      so check the link on the bottom left for details!
  - start: '03:17.000'
    end: '03:23.000'
    original: こっちこっち！ さらにですね、今回はそちらのお写真に、ブロマイドに...
    english: Over here! Furthermore, this time, on those photos, on the bromides...
  - start: '03:23.000'
    end: '03:32.000'
    original: 私たちのメッセージをつけることができるみたいなんですけれども... 今から書くんです！
    english: It seems we can attach our own handwritten messages... and we're going
      to write them right now!
  - start: '03:32.000'
    end: '03:40.000'
    original: ここで？！ 尺足りなくない？ 何も考えてないけど...
    english: Right here?! Won't we run out of time? I haven't thought of anything
      though...
  - start: '03:40.000'
    end: '03:45.000'
    original: 何に... どうなるの？ 考えて書いてください！
    english: What... what's gonna happen? Think of something and write it!
  - start: '03:45.000'
    end: '03:50.000'
    original: え、書いて... なにこれ...
    english: Wait, writing... what is this...
  - start: '03:50.000'
    end: '03:58.000'
    original: 時間も迫ってますからね、早く書きましょう。意外と集中力... つなげ！
    english: Time is running out, so let's write quickly. They're surprisingly focused...
      Someone stall!
  - start: '03:58.000'
    end: '04:03.000'
    original: 安牌で！ 出来たー！ 早くない？
    english: Play it safe! Done! Isn't that too fast?
  - start: '04:03.000'
    end: '04:10.000'
    original: 見せて。こよっぽいね。いつまで書いてんの？
    english: Show me. That's very Koyo-like. How long are you gonna take writing?
  - start: '04:10.000'
    end: '04:15.000'
    original: みんな終わった？ これでみんな渡して！
    english: Is everyone done? Pass them over, everyone!
  - start: '04:15.000'
    end: '04:21.000'
    original: ということで、みんなが何を書いたかすごく気になると思うんですが...
    english: So, I'm sure everyone is really curious about what everyone wrote, but...
  - start: '04:21.000'
    end: '04:25.000'
    original: メッセージの内容は... みんなが買ってからのお楽しみ！
    english: The content of the messages... is a surprise for after you buy them!
  - start: '04:25.000'
    end: '04:33.000'
    original: 言わないで！ ダメに決まってんだろ！ あ、ごめんなさい！
    english: Don't say it! Of course you can't! Ah, sorry!
  - start: '04:33.000'
    end: '04:38.000'
    original: はい！ そして... まだ2枚あるんで、お次はこちら！
    english: Yes! And... we still have two cards left, so next is this!
  - start: '04:38.000'
    end: '04:43.000'
    original: オープン！ 告知⑤『あの作品とコラボ！？』
    english: 'Open! Announcement #5: "A collaboration with THAT series?!"'
  - start: '04:43.000'
    end: '04:47.000'
    original: なんと、あの作品とコラボ？！ え？ 何々？
    english: What?! A collaboration with THAT series?! Eh? What's this?
  - start: '04:47.000'
    end: '04:56.000'
    original: ちょっと待って、これはマジで知らない... あの作品って何ですか？ こちらをどうぞ！
