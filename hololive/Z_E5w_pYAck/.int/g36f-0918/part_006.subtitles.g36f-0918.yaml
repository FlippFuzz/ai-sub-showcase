    From there, I move onto the song's themes. I'm keeping track of the themes and intent of this song, which seem to be exploring the complicated nature of affection and desire, the dance between liking, loving, and the unique, ever-evolving distance between two people. I am paying close attention to every single detail. I am taking note and marking every single thing I hear.

    And then comes the transition at 03:23, I pause, and then the second segment: "Private EyeZ" by Sakamata Chloe and Kazama Iroha, which runs from 03:33 to the end. I do the same thing here. I listen very carefully and I begin again, meticulously verifying the lyrics, checking the timestamps, and making the translations. "超現象フェノメノン," around 03:41.500, becomes "Supernatural phenomenon", and "ネオ・レッドガー ほら最強ジャン" at 03:46.800 translates to "Neo Red Guard, look, it's the strongest!".

