    **Analyzing "On your side" by Ryuji Yokoi (Magical Girl holoWitches!)**

    Okay, so I've got this song "On Your Side," and I'm really digging into it. The lyrics, both in Japanese and the English translation, are right here. Seems like a concert video with a talk segment and then the performance. The song starts at 1:57 and ends the video. Ryuji Yokoi is the composer, and it was performed by Magical Girl holoWitches! Let's get into the heart of this.

    This is all about finding the gleam in the dreams, even when it's easy to lose sight of it. It's like a jewel shining, our most cherished thing, right? The Japanese lyrics really capture that idea of a "crystallization of dreams, everyone's treasure," and the translation hits that same core. It is the glow that calls out to you when you might lose that sight of the dream. "For sure we will be fine, and still, marching on can be tough at times".

    It's not all sunshine and rainbows. The lyrics are honest about the tough stuff, the times when you feel hopeless or in pain. But it's also about not hiding those feelings. "Don't need to be hidden, free your mind". That resonates, right? It's about opening up. The lyrics say we should "sing of our dreams, place a spell on them".

    It's a call to action. To get up again and again and keep moving forward together. "We will rise again and again and keep marching together," the English version puts it. "Our dreams will not be crushed yet; Reclaim our possibilities," it says. The key to everything: we'll "laugh it off and one more time, start walking again". That's what I love about the song - it's about pushing forward and laughing along the way. That's the essence of it: "Holo witches on your side, toward and beyond the wildest dreams." It's about the future, the dreams.

    And this is not just about the dreams. It's also about the now. Recalling the "halcyon days," "we chant our spells". It's a reminder that every day can sparkle. It mentions that we sow the "seeds of hope for tomorrow" and that they "will bloom into the most dazzling flowers".

    "Hard work doesn’t always pay off like it should". It's about remembering to not bottle up anxieties and sorrows. Know that "you're not alone". It's about taking that hope, and moving forward, no matter what. The music is a perfect illustration of pushing through. It's time to find that dream.


