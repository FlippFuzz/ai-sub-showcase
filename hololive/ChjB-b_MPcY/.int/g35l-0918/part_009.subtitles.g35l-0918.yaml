- subtitles:
  - start: '00:00.000'
    end: '00:00.671'
    original: 待ってちょっと聞いて聞いて。チケットだよ。
    english: Wait, wait, listen, listen, tickets are...
  - start: '00:02.121'
    end: '00:02.131'
    original: はい、これ大事な情報なのでみんなよく聞いてください。
    english: Ah, this is important info, everybody listen up!
  - start: '00:05.000'
    end: '00:05.151'
    original: はい、てことで、
    english: So,
  - start: '00:06.000'
    end: '00:10.591'
    original: 現地会場チケットは本日このあと21時から、
    english: In-person venue tickets go on sale today starting at 21:00!
  - start: '00:10.591'
    end: '00:11.451'
    original: 早いこのあと？
    english: Wait, this early?
  - start: '00:11.451'
    end: '00:14.541'
    original: そうです。1次先行受付が開始されます。
    english: That's right, the first-round advance ticket sales start!
  - start: '00:14.541'
    end: '00:16.891'
    original: わあ！いぇーい！
    english: Yay!
  - start: '00:16.891'
    end: '00:18.591'
    original: え、ちなみにこれ大事なことなんですが、
    english: Now, this is an important detail.
  - start: '00:18.591'
    end: '00:24.471'
    original: はい、1次先行はホロライブ公式ファンクラブ会員の方のみが応募可能なので、
    english: The first-round advance tickets are only available to Hololive Official
      Fan Club members!
  - start: '00:24.471'
    end: '00:27.761'
    original: この機会にぜひぜひ登録をお願いします。
    english: So make sure to sign up for membership!
  - start: '00:27.761'
    end: '00:28.911'
    original: お願いします！
    english: Please!
  - start: '00:30.151'
    end: '00:36.561'
    original: 同じく21時から配信チケットも受付開始なので、現地に行くのが難しいよっていう方もね、
    english: Also starting at 21:00 today, streaming tickets will also go on sale.
  - start: '00:36.561'
    end: '00:38.831'
    original: こちら要チェックとなっております。
    english: These are also available to check out.
  - start: '00:39.000'
    end: '00:41.221'
    original: おうちから応援してくれたら嬉しい！
    english: We'd love for you to support us!
  - start: '00:41.691'
    end: '00:48.331'
    original: 詳しくは概要欄から公演の特設サイト、各種チケット販売ページを確認お願いします！
    english: For details, please check the concert's special website and ticket sales
      pages.
  - start: '00:49.331'
    end: '00:49.691'
    original: あ、いまコメントの固定にもなったんじゃない？
    english: Oh, right, they're pinned in the chat now, aren't they?
  - start: '00:51.271'
    end: '00:53.301'
    original: あ、スタッフさんがおてしてもらって。
    english: Oh, the mods pinned them for us!
  - start: '00:53.301'
    end: '00:55.741'
    original: ありがとうございます。まだまだここで終わるわけじゃないので、
    english: Thank you! But we're not done yet,
  - start: '00:56.571'
    end: '00:58.541'
    original: まだあるんですよ。お願いします！
    english: There's more, please!
  - start: '00:59.000'
    end: '01:03.951'
    original: キービジュアルも公開されたので、なんと、え、ライブグッズも発売でーす！
    english: And 3D visuals were just released, so guess what? Live merch is also
      available now!
  - start: '01:05.101'
    end: '01:05.801'
    original: はい、じゃあちょっと順番に行きましょう。
    english: So let's go through them in order.
  - start: '01:06.771'
    end: '01:09.111'
    original: はい、まず最初こちら応援セット！
    english: First up is the Support Set!
  - start: '01:11.121'
    end: '01:17.391'
    original: Tシャツ、うちわライト、推しタオルがセットになったライブには欠かせない応援セットとなっております。
    english: It includes a T-shirt, uchiwa light, and face towel—an absolute must-have
      set for the live!
  - start: '01:17.651'
    end: '01:22.091'
    original: ご購入特典にはオリジナルの缶バッジがついてくるのでぜひゲットしてください。
    english: And buying this set comes with an original can badge, so make sure to
      get yours!
  - start: '01:22.501'
    end: '01:25.791'
    original: この缶バッジめちゃんこ大きいんですよ。このぐらい？
    english: And this can badge is huge! Look at this!
  - start: '01:25.791'
    end: '01:28.161'
    original: ねえ、この、このぐらい。おにぎりぐらい？
    english: Like a giant rice ball!
  - start: '01:28.781'
    end: '01:32.481'
    original: ちなみにちょっと左上に先行発送って書いてあるんですが、これちょっとあとで説明するので、
    english: By the way, it says "advance shipping" in the top left, but I'll explain
      that later.
  - start: '01:32.481'
    end: '01:36.571'
    original: とりあえずこれ応援セットということで今はね、頭に置いてください。
    english: For now, just remember this as the Support Set!
  - start: '01:38.291'
    end: '01:45.361'
    original: はい、そして応援セットに入っているアイテムは、なんと単品でも販売いたします！
    english: Next up, Nene-chan, please! And items in the support set can also be
      purchased individually!
  - start: '01:46.061'
    end: '01:47.381'
    original: まずはうちわライト！
    english: Starting with the uchiwa light.
  - start: '01:47.881'
    end: '01:49.881'
    original: これめっっちゃいいの！可愛い！
    english: This is so cute!
  - start: '01:49.881'
    end: '01:52.541'
    original: これめっちゃいいよ、本当にこれめっちゃいい。
    english: It really is super good!
  - start: '01:52.541'
    end: '01:54.671'
    original: ちゃんとね、青げたよね。青く光る。
    english: It glows blue properly, right?
  - start: '01:55.221'
    end: '01:59.771'
    original: でしかも推しも推せるライブ特製のうちわライトになります。
    english: And you can also push the light colors! It's a live-specific uchiwa light.
  - start: '02:00.671'
    end: '02:13.201'
    original: ちなみにあの点灯時の色これ今青だけど、ちゃんとうねねの色はネポラボカラーと全色っていうかそのテーマカラーからテーマカラーからね。
    english: By the way, the light color is just blue here, but it actually has colors
      for all 5th gen members based on the theme colors.
  - start: '02:13.801'
    end: '02:20.191'
    original: 当日会でも配信でもこのね、うちわライトつけて応援してくれたらなと思います。
    english: We hope you'll bring this uchiwa light to cheer us on at the venue or
      during the stream!
  - start: '02:21.841'
    end: '02:38.481'
    original: そしてライブTシャツ、おもてにはライブのロゴドーンっていう感じにして、裏はねねたち5期のメンバーの名前がプリントされていて、ライブの日付まで入っているのでね、アイテムにぴったりでございます。
    english: And for the live T-shirt, the front features the live logo, and the back
      has the names of all 5 members of 5th Gen and the live date printed on it, making
      it the perfect item for the live!
  - start: '02:38.831'
    end: '02:40.801'
    original: 記念になります。じゃあ次おまるちゃん、スライドジャーン。
    english: Alright, next up, Polka! Let's slide!
  - start: '02:44.201'
    end: '02:50.811'
    original: はい、こちらですね、次マフラータオル。こちらネポラボたちのお名前が大きくデザインされている推しタオルとなっております。
    english: Next up is the muffler towel, featuring a big design of Nepolabo's name
      and the oshi towel!
  - start: '02:51.361'
    end: '03:02.101'
    original: 会場でね掲げちゃってね、もうみんなのお店もう五期生推しの人の全分頭まで、全部。
    english: If you wave this at the venue, all the oshi-oshi people will have their
      heads covered in sweat!
  - start: '03:03.951'
    end: '03:05.151'
    original: すごいネポラボ推しやってね。
    english: It really shows you're a true Nepolabo fan!
  - start: '03:06.021'
    end: '03:09.111'
    original: これねはっきり分かるからね、マジで嬉しい。
    english: It's super clear so you can really tell, which is awesome!
  - start: '03:09.111'
    end: '03:12.781'
    original: あのこれいいと思います。本当汗、なんかさ、汗が出るからさこれどうしようね、最初ラミーにして次ネネにしてみたいな。
    english: Sweat comes out, so how should we do it? Start with Lamy, then Nene?
  - start: '03:15.541'
    end: '03:16.891'
    original: 曲によって変えたりね、それいいですね。
    english: Depending on the song? That's nice!
  - start: '03:19.461'
    end: '03:22.011'
    original: あ、ねねさんお顔変えてますね。いいですね、はい。
    english: Nene-chan changed her face!
  - start: '03:22.251'
    end: '03:36.561'
    original: はい、次はこちら右ですね、みんなのはランダムだんたくふうアクリルキーホルダー。こちらは私たちで願いね、叶えたい願い、そしてみんなと叶えたい願いをメンバーそれぞれ書き下ろしました。
    english: And next is the right side, the random acrylic keyholder! These are packed
      with wishes we want to come true with everyone, so we each designed our own!
  - start: '03:36.251'
    end: '03:42.541'
    original: まあランダムになっていますけど、中身はねゲットしてのお楽しみなんでみんなと交換したりとかしてぜひ全種類コンプリートしてください。
    english: They are random, but collecting them all lets you exchange them with
      others, so we hope you get the whole set!
  - start: '03:43.081'
    end: '03:45.391'
    original: ね、もと、はい。
    english: Yes, absolutely!
  - start: '03:46.061'
    end: '03:54.671'
    original: ということでここまで紹介した応援セットうちわライト、Tシャツ、マフラータオル、ランダム短冊風キーホルダー、これが先行発送アイテムです。
    english: 'So those are the support set items: the uchiwa light, T-shirt, muffler
      towel, and random acrylic keyholder.'
  - start: '03:54.671'
    end: '03:58.201'
    original: ライブ当日までに届きます。大切、これ大切。
    english: They arrive by the live, so please get them!
  - start: '03:58.541'
    end: '04:10.151'
    original: あのこっちをね、あの入れてください。あのそれ以外は、えっとこれはあ、そうそうそそう、とりあえずこれが先行いらっしゃいますので。会場配信で身につけてください。
    english: Make sure to include those in your cart! And except for those, wait,
      ah, those—well, anyway, those are the advance items delivered in time for the
      live!
  - start: '04:13.241'
    end: '04:13.251'
    original: はい、ここからは受注販売の商品となります。
    english: And now, onto made-to-order goods!
  - start: '04:17.371'
    end: '04:22.451'
    original: まずは、こちらさっきねラミーとこ最初に持ってたちんちゃく。今ねちょっと持ってないんですけど。
    english: First, the pouch we showed earlier, the drawstring pouch!
  - start: '04:24.471'
    end: '04:30.931'
    original: これがね、あの同じデザインで作られておりまして、おしとお皿にして色んなところに持ち歩いてください。
    english: This drawstring pouch is made with the same design, perfect for carrying
      around your oshi goods!
  - start: '04:35.451'
    end: '04:47.381'
    original: そして、次はトートバッグ。これいいよね。普段使いのトートバッグになっておりまして、肩からかけてもよし、手で持つもよしということで、新しい枠が欲しいなと思っているそこあなた！
    english: Next is the tote bag, which is super cute! You can carry it over your
      shoulder or by hand, perfect for when you need a little extra bag!
  - start: '04:47.781'
    end: '04:59.000'
    original: 結構、もの怪しそうだった。わかる、分かってるね、めっちゃある。学生さんお喜びのやつ。はい、この機会を、お見、お見、お見逃しなく！
    english: Wait, did someone drop something? Well, anyway, please check them out!
