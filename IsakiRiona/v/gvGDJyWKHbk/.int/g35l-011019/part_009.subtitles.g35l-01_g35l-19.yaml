    original: '[Sign: リオナのぬいを入れるポーチ] リオポサ全開のぬいポーチになってます！ぜひまーりおなをね、まーりおなのぬいを入れてくれたら嬉しいなと思います！ぬい以外に使ってもらうのも大丈夫だよ、ポーチになるよ。そしてそして、最後は…こちら！'
    english: '[Sign: Pouch for Riona''s Plushie] It''s a plushie pouch packed with
      Rioposa! I''d be so happy if you put your Riona plushie in it! It''s totally
      fine to use it for other things too, it works as a pouch. And last but not least...
      this!'
  - start: '02:16.000'
    end: '02:37.000'
    original: '[Sign: くしゃみ連発ぬいキーホルダー] 今回描きおろしイラストの衣装のぬいぐるみキーホルダーになってます！なんとね、この手の部分をねポチッて押すと、「はやくしょーん！」て言うので、ぜひいっぱい押してね、いっぱい浴びてもらえればと思います！そして改めてね、フルセットの方全部見ていきましょう！こちら！'
    english: '[Sign: Sneezing Consecutive Plushie Keychain] It''s a plushie keychain
      in the outfit from the newly drawn illustration! And you know, if you press
      this part of the hand, it says "Hurry up and sneeze!", so I hope you press it
      a lot and soak it all in! And let''s take a look at the full set again. Here!'
  - start: '02:38.000'
    end: '02:43.500'
    original: '[Sign: 誕生記念フルセット] もちろんフルセット購入特典もあります！こちら！'
    english: '[Sign: Birthday Commemorative Full Set] Of course, there''s also a special
      bonus for purchasing the full set! Here!'
  - start: '02:44.000'
    end: '03:05.000'
    original: '[Sign: フルセット購入特典] フルセット購入特典の1つ目は、直筆サインと直筆メッセージ入りバックステージパス風カードです！こちらも鳴海先生のイラストにすべて私手書きで、1つひとつ「おにゃにゃにゃにゃにゃにゃー」ってサインさせていただきますので、よかったらぜひ買ってみてください！'
    english: '[Sign: Full Set Purchase Bonus] The first full set purchase bonus is
      a backstage pass-style card with a handwritten signature and handwritten message!
      For this one too, I will hand-write everything on Narumi-sensei''s illustration,
      signing each one with "Onyanyanyanyanyaー", so please consider buying it!'
  - start: '03:06.000'
    end: '03:20.000'
    original: '[Sign: 特典ボイス「ライブ前に君と。」] ふたつ目は、特典ボイス「ライブ前に君と。」です！ライブ前にね、こう緊張してね「へへへへっ」てなっているリオナを励ますシチュエーションとなっております！ぜひね、ボイスの方も聞いてくれると嬉しいです！'
    english: '[Sign: Bonus Voice "With You Before the Live"] The second is the bonus
      voice "With You Before the Live"! It''s a situation where Riona is getting all
      nervous before the live going "hehehehe" and you cheer her up! I''d be so happy
      if you listen to the voice too.'
  - start: '03:21.000'
    end: '03:33.000'
    original: こちらのグッズは21時9分からカートオープンです！みんなよかったらぜーんぜーんぜーんぜんゲットしてください！そして大事なお知らせがふたつ目あります！聞いてください！
    english: These goods will be available in the cart starting at 21:09! Everyone,
      please go ahead and get all of them! And there is a second important announcement!
      Listen up!
  - start: '03:34.000'
    end: '03:44.000'
    original: どんっ！いさきりおなの初ソロの新曲がでます！やったー！タイトルは「Ring my name」です！
    english: Ta-da! Isaki Riona's first solo new song is coming out! Yay! The title
      is "Ring my name"!
  - start: '03:45.000'
    end: '04:02.000'
    original: '[Title: Ring my name] こちら私の思い出だったり、これから先どうやってこう進んでいくか、私は進んでいくぞ！というのがおしゃれで妖艶に、エガントに表現された楽曲となっております！こちらセクシーな振り付けもついているのでよかったら服に注目もしてくださると嬉しいです！'
    english: '[Title: Ring my name] This song stylishly, seductively, and elegantly
      expresses my memories, how I''m going to move forward from here on, and that
      I will keep moving forward! It also has sexy choreography, so I''d be happy
      if you pay attention to the outfit as well!'
  - start: '04:03.000'
    end: '04:13.000'
    original: この後このライブが終わった後すぐにMVも公開されますし、このあと24時からデジタルリリースもあるので、ぜひいっぱい聴いてくれると嬉しいです！
    english: Right after this live ends, the music video will be released, and there's
      also a digital release starting at 24:00, so I'd be super happy if you listen
      to it a lot!
  - start: '04:14.000'
    end: '04:20.000'
    original: やっぱりこのあとは新曲ヤッチャいますよね！というわけでね、まあやっていくんですけど、まあその前のちょっと語らせてくださいよ。
    english: Of course, after this we're doing the new song, right?! So yeah, we're
      going to do it, but let me talk a bit before that.
  - start: '04:21.000'
    end: '04:44.000'
    original: まあね、リオナはねまだまだなことがいっぱいで、叶えたい夢もいっぱいあります。なので、まだまだ何も手にしてない私かもしれませんが、一緒に付いてきてくれたあなたと一緒にいろんな夢だったり思い出を作っていきたいです。絶対後悔はさせないので、これからも私についてきてくれると嬉しいです！よろしくお願いします！
    english: You know, Riona still has so many things to achieve and so many dreams
      she wants to fulfill. So, I might still be someone who hasn't achieved much
      yet, but I want to create various dreams and memories together with you who
      have followed along with me. I definitely won't make you regret it, so I'd be
      happy if you keep following me! Thank you so much!
  - start: '04:45.000'
    end: '04:55.036'
    original: そしてこのあとは、新曲の披露の前に、ホロライブの先輩方の折り曲を使ったダンスメドレーをお届けします！こちらたくさんのジャンルのダンスを踊る…
    english: And after this, before revealing the new song, we'll deliver a dance
      medley using choreography from hololive seniors! Here, dancing many genres of
      dance...
