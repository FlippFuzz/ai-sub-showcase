global_summary:
  overall_summary: This video is the 1st 3D Birthday Live stream of Isaki Riona (響咲リオナ),
    the leader of the hololive DEV_IS unit FLOW GLOW, titled 'THE ONE & ONLY' (#響咲リオナ生誕祭2026).
    Streamed on May 29, 2026, the concert showcases Riona's exceptional vocal prowess,
    intricate choreography, and high-energy stage performance across multiple genres.
    Featuring guest collaborations with Usada Pekora, Mori Calliope, and other hololive
    talents, as well as appearances by her FLOW GLOW unit members, the live highlights
    a diverse setlist of covers, a multi-genre dance medley, and the grand premiere
    of her new original solo song 'Ring My Name' produced by TeddyLoid.
