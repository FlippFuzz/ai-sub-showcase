global_summary:
  overall_summary: This video features the 1st 3D Birthday Live concert of Koganei
    Niko, a member of the VTuber musical artist group FLOW GLOW under hololive DEV_IS,
    titled '【生誕３Ｄライブ】星炎-Fierstra Diva- ＃ニコたん生たん2026'. Throughout the 71-minute concert,
    Niko showcases her exceptional vocal range and emotional expression through a
    diverse setlist ranging from energetic and dark tracks to emotional ballads. She
    is joined by special guests Rindo Chihaya and surprise guest artist miwa, with
    whom she performs duets and announces her first original song '星炎', composed and
    written by miwa.
