    original: そんなの後光が綺麗でしょう？
    english: That halo in the back looks pretty, right?
  - start: '00:01.800'
    end: '00:04.100'
    original: 綺麗だねー 似合うよ、ちまちゃん
    english: It's pretty! It suits you, Chima-chan.
  - start: '00:04.100'
    end: '00:04.900'
    original: ありがとう
    english: Thank you.
  - start: '00:05.100'
    end: '00:08.500'
    original: いや、今日はね、ちまちゃんと「火炎」を歌わせていただいたんだけど
    english: Today, Chima-chan and I got to sing "Kaen,"
