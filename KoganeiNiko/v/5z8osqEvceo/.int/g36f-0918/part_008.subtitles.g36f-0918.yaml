    end: '00:14.300'
    original: かっこよさも好きなのよ
    english: I also love how cool you can sound!
  - start: '00:14.300'
    end: '00:15.100'
    original: おー、ありがとう
    english: Oh, thank you.
  - start: '00:15.100'
    end: '00:18.100'
    original: なんかそんなふたつを混ぜられたらいいなと思って今回選びました
    english: I chose this song hoping we could blend those two together.
