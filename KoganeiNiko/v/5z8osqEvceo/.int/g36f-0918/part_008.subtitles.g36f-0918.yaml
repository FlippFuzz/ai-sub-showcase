    end: '00:20.900'
    original: ありがとう 一緒に歌えて嬉しかったー
    english: Thank you! I was so happy to sing together!
  - start: '00:20.900'
    end: '00:22.500'
    original: えー！良かったー！
    english: Yay, I'm so glad!
  - start: '00:22.500'
