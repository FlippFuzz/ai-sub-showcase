    original: 続いて、本日のライブテーマ、ヒストリック・ルート5。
    english: Next up is today's live theme, "Historic Route 5."
  - start: '00:09.115'
    end: '00:12.725'
    original: こちらのロゴアクリルキーホルダー！
    english: This logo acrylic keychain!
  - start: '00:13.255'
    end: '00:17.395'
    original: めちゃくちゃおしゃれなデザインだと思います。
    english: I think it has a super stylish design.
  - start: '00:17.495'
    end: '00:22.755'
    original: 超おしゃれグッズとしてね、ぜひジャラジャラと見せびらかしてほしいなと思います。
    english: As a super stylish item, I hope you'll proudly dangle and show it off!
  - start: '00:22.955'
    end: '00:33.405'
    original: ちなみに、アキロゼ4周年記念グッズで出したときのロゴのキーホルダーも、実は同じテイストで揃えさせていただいてます。
    english: By the way, the logo keychain from my 4th-anniversary goods actually
      matches the same taste and style!
  - start: '00:33.725'
    end: '00:41.975'
    original: ごセットの合わせ技なんかもね、めちゃくちゃいいなんじゃないかな。エモさもマシマシだと思うのね、ぜひチェックしてみてください。
    english: Doing a combo set like that is also super nice. The emotional factor
      is doubled, so please be sure to check it out.
  - start: '00:43.085'
    end: '00:50.055'
    original: そして、そして！続いてのグッズはこちら！マーチングバンド帽コインケースキーホルダー！
    english: And, and! The next item is here! The marching band hat coin case keychain!
  - start: '00:50.605'
    end: '01:02.105'
    original: めちゃくちゃかわいいの！今回のねライブロゴがバシッと入り、ふわふわのね、羽もついたようなマーチングバンドの帽子のデザインのキーホルダー！
    english: It's super cute! Featuring the live logo crisply embedded, with fluffy
      feathers attached, it's a marching band hat-designed keychain!
  - start: '01:02.215'
    end: '01:15.005'
    original: かつ、ファスナーを開けるとコインケースになっているので、ご日常生活からお出かけから、もう超万能に使えるスーパーグッズです！めちゃかわいいです！ぜひね、いっぱいゲットしてください。
    english: Plus, when you open the zipper, it becomes a coin case, making it a super
      versatile item for everyday life and outings! It's super cute! Please get lots
      of them!
  - start: '01:15.985'
    end: '01:31.755'
    original: そして、そして！今回のライブでもアキロゼも頑張って練習した、スネアドラムをモチーフした収納ケースが出ちゃいます！めちゃかわいい！
    english: And, and! For this live, Aki Rosenthal also practiced hard for, a storage
      case modeled after the snare drum is coming out! Super cute!
  - start: '01:31.755'
    end: '01:45.335'
    original: 特別なアキロゼ仕様のスネアドラムになっているんですけども、これ、サイズもしっかりと大きくてね、小物入れとしては優秀なんじゃないかなと思います。
    english: It's a special Aki Rosenthal-spec snare drum, and it's nicely sized and
      quite large, making it excellent as a small storage container.
  - start: '01:45.335'
    end: '01:51.525'
    original: お家で使うもよし、お店に飾るもよし、お見せびらかすもよし！
    english: Great for use at home, displaying in a shop, or showing off!
  - start: '01:51.985'
    end: '02:07.735'
    original: そして、こちらの活動5周年記念フルセットをご購入の方、なんと！アキロゼ直筆サイン入り＆箔押し複製メッセージ入りポストカード！
    english: And, for those who purchase the 5th Anniversary Full Set, what's more!
      A postcard with Aki Rosenthal's handwritten signature and foil-stamped duplicate
      message!
  - start: '02:07.735'
    end: '02:16.895'
    original: さらに特典ボイスがついてまいります！特典はあったほうがいいよな！
    english: Plus, bonus voice tracks are included! Bonuses are always better to have,
      right?
  - start: '02:17.395'
    end: '02:25.135'
    original: ただ直筆サインの方が今回ちょっと数量限定でお届けになります。
    english: However, the handwritten signature version will be available in limited
      quantities this time.
  - start: '02:25.435'
    end: '02:44.835'
    original: ただ、数量限定じゃない方のフルセットにも特典ボイスそして箔押しのサインとメッセージはついてまいりますので、ぜひぜひたくさんね、あの記念にゲットしていただけるとすごく嬉しいです！よろしくお願いします！
    english: But the full set without quantity limits will also come with bonus voices,
      foil-stamped signature, and message, so I'd be super happy if you can get plenty
      as a keepsake! Thank you!
  - start: '02:45.895'
    end: '03:02.135'
    original: ぜひ必要情報などまだチェックしてない人はぽちぽちっと今のうちに準備しておいてください。記念グッズということでいっぱい考えて悩んで愛情を込めて用意したグッズなのでぜひよろしくお願いします！
    english: If you haven't checked the necessary info yet, please get ready by clicking
      now. Since these are anniversary goods prepared with lots of thought, worry,
      and love, please look forward to them!
  - start: '03:03.119'
    end: '03:14.399'
    original: はい！ということで記念ライブもすごく可愛いグッズなので絶対絶対絶対絶対絶対ゲットしてください！概要欄をチェックチェック！
    english: Yes! So the commemorative live also features super cute goods, so definitely,
      definitely, definitely get them! Check out the description box!
  - start: '03:15.549'
    end: '03:46.429'
    original: はい、そして今日はね、5周年というスペシャルな日なので、ちょっと恥ずかしいんですが、いつもの本音を言うの苦手だから、今日は手紙にまとめて書いてきたので、ロゼ隊に向けてちょっと読ませてもらってもいいですか？恥ずかしいな。
    english: Yes, and today is a special day being the 5th anniversary, so I'm a little
      embarrassed because I'm not good at speaking my true feelings normally, but
      since I wrote it down in a letter for today, would it be okay if I read it to
      the Rosetai? How embarrassing.
  - start: '03:48.339'
    end: '03:50.599'
    original: じゃ、聞いてください。
    english: Now, please listen.
  - start: '03:51.196'
    end: '03:55.106'
    original: ロゼ隊へ、今日はホロライブでデビューしてまるっと5年。
    english: To Rosetai, Today marks exactly 5 years since my debut in Hololive.
  - start: '03:55.576'
    end: '03:59.886'
    original: いつもよりちょっとだけ特別な日なので、手紙を書きました。
    english: Since it's a slightly more special day than usual, I wrote a letter.
  - start: '04:00.326'
    end: '04:06.116'
    original: うまく言葉にして伝えられるか分からないけど、聞いてくれると嬉しいです。
    english: I don't know if I can put my feelings into words well, but I'd be happy
      if you listen.
  - start: '04:06.666'
    end: '04:13.236'
    original: もう5年、そんなに経つんだとびっくりしちゃうね。アキロゼ少しは成長できたかな？
    english: Already 5 years—it's surprising how much time has passed. I wonder if
      Aki Rosenthal has grown even a little bit?
  - start: '04:14.076'
    end: '04:25.596'
    original: 日々活動してると、ふとした瞬間悲しくなったり苦しくなったりすることがあります。そんな時いつも勇気を奮い起こしてくれるのはロゼ隊のおかげです。
    english: As I go about my daily activities, there are moments when I suddenly
      feel sad or distressed. Whenever that happens, it's thanks to Rosetai that I
      can muster up my courage.
  - start: '04:25.966'
    end: '04:44.596'
    original: あの日出会った時からずっとそばにいてくれるキミも、今初めてアキロゼを見つけてくれたキミも、アキロゼと出会ってくれてありがとう！
    english: Whether it's you who has stayed by my side ever since the day we met,
      or you who discovered Aki Rosenthal for the very first time today, thank you
      for meeting Aki Rosenthal!
