  original: アキロゼ生誕祭2026をご覧の皆さん、いかがでしたでしょうかー！
  english: To everyone watching Aki Rosenthal's Birthday Live 2026, how did you like
    it?!
- start: '00:56.654'
  end: '01:02.834'
  original: さて、ここからは大事なお知らせがあるので、最後までしっかり聞いていってね！
  english: Now, we have some very important announcements, so please listen closely
    until the very end!
- start: '01:03.554'
  end: '01:10.594'
  original: まずはお知らせ1つ目！アキロゼ生誕祭2026誕生日グッズ発売です！
  english: First up, announcement number one! The Aki Rosenthal Birthday Live 2026
    merchandise is now on sale!
- start: '01:11.234'
  end: '01:16.894'
  original: 今回はライブの世界観をぎゅっと楽しんでもらえるグッズを頑張って制作いたしました。
  english: We worked hard to create goods that let you fully immerse yourselves in
    the world of this live show.
- start: '01:17.074'
  end: '01:24.494'
  original: なので、今回のライブが良かったなーって思った方はぜひ応援で購入していただけるのもすごく嬉しいです！
  english: So if you enjoyed the concert, I'd be so happy if you showed your support
    by purchasing them!
- start: '01:25.034'
  end: '01:29.834'
  original: それではまず1つ目のグッズ、「Life is GAME ラバーマット」。
  english: 'Let''s start with the first item: the "Life is GAME Rubber Mat".'
- start: '01:30.154'
  end: '01:34.974'
  original: 今回のイラストはLAM先生に描き下ろしていただきました！素敵なイラストありがとうございます！
  english: The illustration for this was drawn specially by LAM-sensei! Thank you
    so much for this wonderful artwork!
- start: '01:35.434'
  end: '01:48.334'
  original: 今回のライブの世界観をイメージしたイラストになっています！めちゃくちゃセクシーで色っぽいけどかっこいいようなアキロゼになっています！ラバーマットで思う存分楽しんでください！
  english: It captures the exact atmosphere of the concert! It features an Aki Rosenthal
    who is super sexy, alluring, and yet cool! Please enjoy it to the fullest with
    this rubber mat!
- start: '01:48.814'
  end: '01:54.634'
  original: ちなみにサイズはカードゲームにぴったり。この意味、わかるよね？
  english: By the way, the size is just right for card games. You know what that means,
    right?
- start: '01:55.334'
  end: '02:00.654'
  original: 2つ目のグッズが「運命の5枚 タロット風アクリルスタンドセット」。
  english: The second item is the "Five Cards of Fate Tarot-Style Acrylic Stand Set".
- start: '02:01.354'
  end: '02:04.974'
  original: アキロゼがあなたのことを占って背中を押してあげます。
  english: Aki Rosenthal will read your fortune and give you a push forward.
- start: '02:05.414'
  end: '02:17.474'
  original: 1日の始まりや何か運命を隠したい！みたいなそんな時に使って楽しむ。そして5枚バーンって飾っておけるので見ても楽しめるようになっております。
  english: You can use them at the start of your day or whenever you want to test
    your fate! Plus, you can display all five cards together to enjoy just by looking
    at them.
- start: '02:17.754'
  end: '02:29.934'
  original: 占い方法は、この後紹介するアキロゼのASMRボイスと連動しております！飾っても楽しい、使っても楽しい！そのような連動グッズになっているのでぜひゲットしてください！
  english: The fortune-telling method is linked with the ASMR voice tracks I'll introduce
    next! Fun to display, fun to use! It's a linked set of goods, so please be sure
    to get yours!
- start: '02:31.054'
  end: '02:49.854'
  original: 続いてのグッズは、「アキロゼのトランプ」作っちゃいましたー！こちら実際に遊んでいただけるトランプなので、たくさん予備も買ったほうがいいんじゃないかなーと思います！ぜひトランプでもアキロゼをたくさん楽しんでアピールもしてくださいね！
  english: Next up, we made the "Aki Rosenthal Playing Cards"! You can actually play
    games with these, so you might even want to buy a few extra spares! Enjoy playing
    with Aki Rosenthal on the cards and show them off!
- start: '02:50.814'
  end: '03:02.134'
  original: 続いては、こちら「アキロゼのカードケース」！この革はもちろんトランプなど小物を入れても大丈夫です！ぜひおうちや持ち歩きに使ってね！
  english: Next is the "Aki Rosenthal Card Case"! Naturally, you can use this leather
    case to store your playing cards or other small items. Please use it at home or
    when you're on the go!
- start: '03:03.034'
  end: '03:19.454'
  original: そして、ボイスの紹介です！今回もASMRボイスを特別に発売！アキとロゼがそれぞれ左右からあなたのことを誘惑しちゃうかも？台本も頑張って書いたのでぜひぜひたっぷり楽しんでもらえたら嬉しいです！
  english: And now, introducing the voice packs! We're releasing special ASMR voices
    once again! Aki and Rosé might just tempt you from both the left and right channels.
    I worked hard on the scripts, so I'd be thrilled if you thoroughly enjoy them!
- start: '03:20.534'
  end: '03:44.274'
  original: こちらボイスは「Life is GAME アキとロゼの晩餐」、こちらをメインとし、ASMRショートボイスとして先ほどの「運命の5枚 タロット風アクリルカード」と連動したショートボイスが入っております！ショートボイスのシャッフルランダム再生をして選ばれたボイスがあなたの運命の1枚になります！ぜひいろいろ楽しんでね！
  english: 'The main voice track is titled "Life is GAME: Aki & Rosé''s Dinner," accompanied
    by ASMR short voice tracks linked with the previously mentioned tarot acrylic
    cards! Shuffle and randomly play the short voices to find which one becomes your
    card of fate! Please enjoy all the various options!'
- start: '03:44.834'
  end: '04:02.934'
  original: これらのグッズ全てが詰まったフルセット購入には、なんと特典も付いております！今回のキービジュアルのイラストを使ったチケット風カードになっております！あなたはどのゲームに参加する？参加しない？こちらもライブの世界観を高めるアイテムになっているのでぜひゲットしてください！
  english: Purchasing the full set containing all of these goods comes with a special
    bonus! It's a ticket-style card featuring the key visual illustration of this
    live! Which game will you join, or will you pass? This item further enhances the
    concert's world, so definitely grab yours!
- start: '04:04.134'
  end: '04:22.594'
  original: そして、数量限定あります！直筆サイン＆箔押し複製メッセージが入ったものになっております！頑張って書きます！そして、数量限定が終わり次第、箔押しでの複製サインとメッセージが入ったチケット風カードになります！ぜひフルセット購入特典ゲットしてね！
  english: And there is a limited quantity version available! It comes with an authentic
    handwritten signature and a foil-stamped duplicate message! I'll write them with
    all my heart! Once the limited quantity runs out, it switches to a ticket-style
    card with a foil-stamped duplicate signature and message. Make sure to get the
    full-set bonus!
