  overall_summary: This video is the 3D Birthday Live concert of Hololive 1st Generation
    VTuber Aki Rosenthal, titled '#アキロゼ生誕祭2026 ーLife is GAMEー', streamed on February
    17, 2026. Centered around a casino and board game aesthetic with dice, roulette,
    and playing cards, Aki Rosenthal delivers an electrifying musical performance
    featuring diverse cover songs and originals, including her 6th original song 'モノポリー'
    (Monopoly). She is joined by various guest performers and friends such as AZKi,
    Ookami Mio, Amaki Pururun, Akami Karubi, Zuzu, and Ritsuki, blending dance, storytelling,
    and celebratory talk segments.
