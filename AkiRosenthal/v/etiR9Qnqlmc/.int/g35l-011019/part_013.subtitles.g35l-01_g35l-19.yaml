    original: ねえねえそこの君、チャンネル登録ってもうした？うん、まだだよね？じゃあチャンネル登録ポチ、高評価もポチ、ついでに通知もオンポチ！ということで、まだの人よろしくお願いします！
    english: Hey, hey, you right there, have you subscribed to the channel yet? Nope,
      not yet, right? Then hit that subscribe button, hit the like button too, and
      turn on notifications with a click! With that said, if you haven't yet, I'd
      appreciate your support!
  - start: '03:11.234'
    end: '03:24.234'
    original: ちなみに、このあと22時30分からメンバー限定アフターライブもやっちゃうので、メンバーシップの登録をしてくれた方、忘れないでぜひこのままレッツゴーしましょー！待っててね！
    english: By the way, starting at 10:30 PM tonight, I'll also be holding a member-only
      after-live, so for those of you who registered for membership, don't forget
      and let's go straight into it! Wait for me!
  - start: '03:24.524'
    end: '03:36.654'
    original: からの！アキロゼ生誕祭2025記念グッズ発売いたしまーす！待ってたよね？ということで早速紹介していきましょう！ラインナップはこちら！
    english: And now! The Aki Rosenthal Birthday 2025 commemorative merchandise is
      now on sale! You've been waiting for it, right? So let's introduce them right
      away! Here is the lineup!
  - start: '03:38.244'
    end: '03:56.574'
    original: 今回のライブコンセプト「ユアートルカラス」を題材に、雪子先生に描いていただきました！異世界の上ファンタジー感のあるお花屋さんのような女の子をイメージしております。可愛さと色気をかね備えたアキロゼにぴったりのイラストになっています！
    english: Based on our live concept "Your True Colors," Snow-sensei drew this for
      us! It portrays a girl like a flower shop owner in a fantasy-like another world.
      It's an illustration that perfectly matches Aki Rosenthal, combining cuteness
      and allure!
  - start: '03:56.884'
    end: '04:13.884'
    original: こちら！キービジュアルが大きくプリントされたワイドラバーマット！大きくて使いやすいラバーマット、飾るもよし、使うもよし、あなたのパソコン周りにぜひ彩りを添えてください！
    english: Next is this! A wide rubber mat with the key visual printed in large
      size! It's a large, easy-to-use rubber mat—great for displaying or using. Please
      add some color to your PC setup!
  - start: '04:14.474'
    end: '04:36.874'
    original: 次は、こちら！なんとついにでた、アキロゼとおそろいフルグラフィックTシャツ！アキロゼのゲーミング衣装のインナーとおそろいのTシャツになっています。ゲーミングパーカーを買ってくれた方はこれとこれセットにしちゃうとメンズいい感じなんじゃないの？もちろんTシャツだけでもね、めちゃんこ目立つし可愛いので、イベントなどなど色々なところに着たり楽しんじゃってください！
    english: Next is this! Finally, the Aki Rosenthal matching full-graphic T-shirt!
      It's a T-shirt that matches the inner wear of Aki Rosenthal's gaming outfit.
      If you bought the gaming hoodie, pairing it with this would look really cool,
      right? Of course, the T-shirt alone stands out and is super cute, so please
      wear it and enjoy it at events and all sorts of places!
  - start: '04:38.214'
    end: '04:59.954'
    original: 次は、こちら！アキロゼのヘッドセンサーヘアクリップ！ありそうでなかったアキロゼの身につけているグッズ、はいあなたのお手元に届いちはいます！アキロゼのヘッドセンサーを再現したヘアクリップになってるんだけど、髪を止めるのに使ってもよし、いろんなものに挟んでもよし、身につけてもよし、置いといてもよし！アキロゼがねそこにいた
    english: Next is this! Aki Rosenthal's head sensor hair clip! This is a piece
      of merchandise of Aki Rosenthal that we never had before, and yes, it will arrive
      right in your hands! It's a hair clip replicating Aki Rosenthal's head sensor—you
      can use it to pin your hair, clip it onto various things, wear it, or just display
      it! It's like Aki Rosenthal is right there...
