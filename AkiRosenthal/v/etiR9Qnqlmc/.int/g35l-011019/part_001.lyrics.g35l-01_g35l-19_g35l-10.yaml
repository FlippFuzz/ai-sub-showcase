  - start: '02:09.658'
    end: '02:11.778'
    original: ありがとうね！おしまい！ありがとありがと！
    english: Thank you so much! That's it! Thank you, thank you!
  - start: '02:15.658'
    end: '02:18.498'
    original: お待たせーん！みんな！見えてる？
    english: Sorry to keep you waiting! Everyone! Can you see me?
  - start: '02:19.018'
    end: '02:22.318'
    original: 聞こえてる？
    english: Can you hear me?
  - start: '02:22.798'
    end: '02:26.518'
    original: ホロライブ所属の癒し系ハーフエルフ、
    english: Hololive's healing-type half-elf,
  - start: '02:26.658'
    end: '02:29.418'
    original: アキ・ローゼンタールこと…アキロゼ…（笑）
    english: Aki Rosenthal, aka Aki Ro... (laughs)
  - start: '02:30.138'
    end: '02:32.498'
    original: 噛んじゃったけど、もう一回ね！
    english: I tripped over my words, let's do it again!
  - start: '02:32.958'
    end: '02:36.658'
    original: アキ・ローゼンタールこと、アキロゼンダールです！
    english: Aki Rosenthal, aka Aki Rozendal!
  - start: '02:36.658'
    end: '02:38.838'
    original: はろはろはろー！あろーなー！
    english: Hallo hallo hallo! Alona!
  - start: '02:39.958'
    end: '02:47.318'
    original: はい！アキロゼ生誕祭2025へようこそー！
    english: Yes! Welcome to Aki Rosenthal's Birthday Festival 2025!
  - start: '02:47.798'
    end: '02:53.698'
    original: え、今年のテーマは「Your true colors」とさせていただきまして、
    english: Um, this year's theme is "Your True Colors,"
  - start: '02:54.018'
    end: '03:12.438'
    original: まあ、アキロゼがね、今まで生誕祭でよくやっていたミュージカル形式とは、ちょっと趣向を変えて、まあ違う感じの生誕祭を今年はやってみようかなと思って、いる、ちょっと変わった、また去年と変わったライブにしたいなと思っております！
    english: and as for that, rather than the musical format I usually do for my birthday
      festivals, I thought I'd try a slightly different kind of festival this year—a
      somewhat unusual live show, different from last year, that's what I've been
      thinking!
  - start: '03:13.118'
    end: '03:26.538'
    original: なんと今年は色んなね、ゲストの方がなんと森だくさん登場してくれるということなので、ぜひ色んな人を楽しみにしててね！
    english: And this year, we have tons of various guests appearing, so please look
      forward to all kinds of people!
  - start: '03:32.118'
    end: '03:41.838'
    original: 「アキロゼ生誕祭2025」こちらのハッシュタグをつけて、ポストなどでじゃんじゃんつぶやいてください！
    english: Please add the hashtag "#AkiRosenthalBirthday2025" and tweet away on
      posts and such!
  - start: '03:43.058'
    end: '03:49.258'
    original: え？何？アキロゼが可愛すぎてスクショが止まらない？
    english: Huh? What? Aki Rosenthal is too cute and your screenshots won't stop?
  - start: '03:49.558'
    end: '03:52.338'
    original: そうだよね！そうだよね！なんと気付いた人いるかな？
    english: That's right! That's right! I wonder if anyone noticed?
  - start: '03:52.638'
    end: '03:59.738'
    original: アキロゼ少し、なんか…ちょっと可愛くなってない？
    english: Aki Rosenthal got a little... somehow... a bit cuter?
  - start: '03:59.978'
    end: '04:09.958'
    original: そう、ちょっとね、メイクを、今風にしてみたというか、の髪の毛とかもちょっとオイルとかつけて、ツヤッツヤにしてみたんだけど、どう？
    english: Yeah, I tried doing my makeup in a more modern style, and put some oil
      and stuff in my hair to make it super glossy, how is it?
  - start: '04:10.518'
    end: '04:19.498'
    original: どう？よく見て、よく見て！アップで、アップでよ、ちょっと、可愛い顔をぜひ！
    english: How is it? Look closely, look closely! Up close, up close, please check
      out my cute face!
  - start: '04:20.118'
    end: '04:24.318'
    original: そう、ちょっと可愛くなってるでしょ？
    english: That's right, I'm a bit cuter, right?
  - start: '04:27.238'
    end: '04:39.378'
    original: ま、元から可愛いのは知ってるんだけどね！だからこういうね、スクショとかいっぱいいっぱい撮って、ポストでつぶやいてね、ぜひ盛り上げてくれると嬉しいです！よろしくね！
    english: Well, I know I was cute to begin with! So please take lots and lots of
      screenshots like this, tweet them on posts, and hype it up, I'd be so happy!
      Nice to meet you!
  - start: '04:40.418'
    end: '04:59.838'
    original: そして、まだまだ！気を抜くなよ！この配信の後メンバー限定でアフターライブもやる予定なので、そちらもお楽しみに！メンバー登録するなら今だ今だ！今だ今だ今だ今だ！
    english: And still! Don't let your guard down! After this stream, we're planning
      to do a member-only after-live, so please look forward to that as well! If you're
      going to join as a member, now's the time! Right now, right now, right now!
