  original: そうだよね！そうだよね！なんと気付いた人いるかな？
  english: That's right! That's right! I wonder if anyone noticed?
- start: '03:52.638'
  end: '03:59.738'
  original: アキロゼ少し、なんか…ちょっと可愛くなってない？
  english: Aki Rosenthal got a little... somehow... a bit cuter?
- start: '03:59.978'
  end: '04:09.958'
  original: そう、ちょっとね、メイクを、今風にしてみたというか、の髪の毛とかもちょっとオイルとかつけて、ツヤッツヤにしてみたんだけど、どう？
  english: Yeah, I tried doing my makeup in a more modern style, and put some oil
    and stuff in my hair to make it super glossy, how is it?
- start: '04:10.518'
  end: '04:19.498'
  original: どう？よく見て、よく見て！アップで、アップでよ、ちょっと、可愛い顔をぜひ！
  english: How is it? Look closely, look closely! Up close, up close, please check
