- start: '04:20.118'
  end: '04:24.318'
  original: そう、ちょっと可愛くなってるでしょ？
  english: That's right, I'm a bit cuter, right?
- start: '04:27.238'
  end: '04:39.378'
  original: ま、元から可愛いのは知ってるんだけどね！だからこういうね、スクショとかいっぱいいっぱい撮って、ポストでつぶやいてね、ぜひ盛り上げてくれると嬉しいです！よろしくね！
  english: Well, I know I was cute to begin with! So please take lots and lots of
    screenshots like this, tweet them on posts, and hype it up, I'd be so happy! Nice
    to meet you!
- start: '04:40.418'
  end: '04:59.838'
  original: そして、まだまだ！気を抜くなよ！この配信の後メンバー限定でアフターライブもやる予定なので、そちらもお楽しみに！メンバー登録するなら今だ今だ！今だ今だ今だ今だ！
  english: And still! Don't let your guard down! After this stream, we're planning
