- start: '02:56.234'
  end: '02:57.654'
  original: ほらな。そうなんだよ。
  english: See? That's right.
- start: '02:57.874'
  end: '03:02.194'
  original: ま、そんな感じでね、まぁそういうきっけにしてさ、もっともっと今年は
  english: Well, with that as a catalyst, let's do even more this year,
- start: '03:02.434'
  end: '03:06.134'
  original: いっぱい食べたら嬉しいの、撮ってのいで、よろしくお願いします！
  english: and if you eat a lot I'll be happy, so please take care of us!
- start: '03:06.134'
  end: '03:07.754'
  original: よろしくお願いします！
  english: Please take care of us!
- start: '03:07.754'
  end: '03:08.834'
  original: ありがとね！
  english: Thank you!
- start: '03:09.134'
  end: '03:10.454'
  original: でもみんなも誘ってよ。
  english: But invite everyone else too.
- start: '03:10.594'
  end: '03:11.874'
  original: 誘おうよ！
  english: Let's invite them!
- start: '03:11.874'
  end: '03:13.254'
  original: 誘おうよ、ねえ！
  english: Let's invite them, hey!
- start: '03:13.354'
  end: '03:16.894'
  original: 本当？フジ急の、あの、お化け屋敷行こうよ。
  english: Really? Let's go to the Fuji-Q haunted house.
- start: '03:17.074'
  end: '03:18.034'
  original: いや、やだ。
  english: No, I don't want to.
- start: '03:18.174'
  end: '03:19.454'
  original: え、なんで？
  english: Eh, why?
- start: '03:19.534'
  end: '03:21.094'
  original: やだ、だって。
  english: No, because...
- start: '03:21.094'
  end: '03:22.374'
  original: 流されないから、こいつ。
  english: She won't get swept away by it.
- start: '03:22.554'
  end: '03:26.554'
  original: お化け屋敷は、だって、だってなんで、なんで？あの、
  english: Haunted houses are, because, why, why? Um,
- start: '03:26.554'
  end: '03:28.054'
  original: でも、フジ急限定なんだよ。
  english: But it's limited to Fuji-Q, you know.
- start: '03:28.174'
  end: '03:29.874'
  original: なんか、一番怖いって聞くじゃん。
  english: I hear it's supposed to be the scariest.
- start: '03:29.874'
  end: '03:31.954'
  original: そうなの？こういうメデタイ場でしれっと
  english: Is that right? Sneaking it in on such a celebratory occasion—
- start: '03:31.954'
  end: '03:34.054'
  original: 聞いたら行けるかなって思ったんだけど。
  english: I thought maybe we could go if we asked.
- start: '03:34.054'
  end: '03:36.434'
  original: 怖かったな。ご飯から始めて
  english: It was scary. Starting from meals,
- start: '03:36.754'
  end: '03:38.974'
  original: 謎解きとかだよね。
  english: and then puzzle solving and stuff.
- start: '03:39.094'
  end: '03:41.294'
  original: ああ、なるほどね、なるほどね。
  english: Ah, I see, I see.
- start: '03:41.474'
  end: '03:46.734'
  original: はい、ということで、もっと本当に喋ってたいのに時間が過ぎ去っていくよ！
  english: Yes, so even though I really wanted to chat more, time is flying by!
- start: '03:46.994'
  end: '03:48.334'
  original: やばい！やばい！
  english: Yabai! Yabai!
- start: '03:48.434'
  end: '03:50.054'
  original: じゃあ、はーちゃん、今年もよろしくお願いします！
  english: Well, Ha-chan, please take care of us this year too!
- start: '03:50.114'
  end: '03:51.355'
  original: お願いします！
  english: Please take care of us!
- start: '03:51.355'
  end: '03:53.074'
  original: しばちゃん、お願いします！
  english: Shiba-chan, please take care of us!
- start: '03:53.074'
  end: '03:56.514'
  original: 本当に、おめでとう！ありがとう！またね！
  english: Congratulations truly! Thank you! See you later!
