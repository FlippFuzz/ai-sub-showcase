global_summary:
  overall_summary: This video is the 3D Birthday Live event of Hololive 1st Generation
    VTuber Aki Rosenthal, titled 'Your True Colors', streamed on February 17, 2025.
    The live features a narrative theme about a flower shop where a girl searches
    for her true colors, interwoven with musical performances and talk segments featuring
    a diverse lineup of guest VTubers and streamers from Hololive, Holostars, Neo-Porte,
    VSPO, Nijisanji, and ReJECT. The concert includes multiple duet and group song
    covers, concluding with the premiere of her new original song '茨' (Ibara) and
    closing merchandise and after-live announcements.
