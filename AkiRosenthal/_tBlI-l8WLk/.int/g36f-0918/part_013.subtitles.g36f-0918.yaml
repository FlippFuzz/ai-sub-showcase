    \ behind-the-scenes stories.\n\nI really have to encourage people to subscribe\
    \ to the channel, like the video, and turn on notifications. I really want them\
    \ to come and see me again!\n\nAnd, finally, the message to think about: Life\
    \ can be cruel, but your life is always yours, and it’s up to you how you enjoy\
