    original: スタート ユーアー ジャーニー あなたの旅を始めよう
    english: '"Start Your Journey"—let your journey begin!'
  - start: '00:03.933'
    end: '00:08.533'
    original: そんなふうに背中を押してくれるような曲になってます
    english: It's a song that feels like it's pushing you forward from behind.
  - start: '00:08.533'
    end: '00:16.893'
    original: 元気付きたいとき、テンション上げたいときとかに、いっぱい聞いてもらって、勇気をだしてくれたら嬉しいなと思います。
    english: Whenever you need energy or want to boost your mood, I hope you listen
      to it a lot and find courage.
  - start: '00:17.383'
    end: '00:21.573'
    original: あ!Twitterでさきにお知らせするって言ったんだけど、
    english: Oh! I said on Twitter I'd announce it earlier, but...
  - start: '00:21.573'
    end: '00:26.543'
    original: もう、Twitterフォローしてるよね?
    english: You're already following me on Twitter, right?
  - start: '00:26.543'
    end: '00:29.893'
    original: チャンネル登録したやつ、いいよねお姉。
    english: Channel subscription alerts are great, right?
  - start: '00:29.993'
    end: '00:38.213'
    original: 今！今！今！チャンネル登録したやつ、いいよねお姉！
    english: Right now! Channel subscription alerts are great!
  - start: '00:39.113'
    end: '00:41.873'
    original: 今までの人いるよ！
    english: There are people who've been here for a while too!
  - start: '00:44.203'
    end: '00:54.673'
    original: 曲の感想とかも、Twitterでね、ハッシュタグをつけて聞かせてもらえるとあきちゃんも見やすいので、よろしくお願いします！
    english: If you share your impressions of the song on Twitter with a hashtag,
      I'd love to read them, so please do!
  - start: '00:55.203'
    end: '01:00.673'
    original: そしてお待たせのグッズ紹介の！
    english: And now, introducing the much-awaited merchandise!
  - start: '01:01.813'
    end: '01:08.573'
    original: アキ・ローゼンタール誕生日記念2023グッズが発売になります！
    english: Aki Rosenthal's Birthday Commemoration 2023 merchandise is now on sale!
  - start: '01:08.973'
    end: '01:19.463'
    original: ライブテーマの「Start your journey あなたの旅を始めよう」という思いをぎゅっと込めた、オズの魔法使いをイメージしたグッズになっています。
    english: It's filled with the thoughts of the live theme, "Start your journey,"
      themed around The Wizard of Oz.
  - start: '01:20.193'
    end: '01:40.853'
    original: 内容は、「Start your journey ポップアップアクリルスタンド」こちらじゅん先生の描き下ろしになっています！めちゃめちゃ可愛くて、ロゼ隊もジョーブズも嫉妬するペンギンもちゃっかり...旅の仲間と加わってるので、ぜひね飾って楽しんでもらえたらと思います。
    english: The contents include the "Start your journey Pop-up Acrylic Stand," beautifully
      illustrated by Jun-sensei! It's super cute, featuring Rose-tai, Jobuzu, and
      even a jealous penguin joining as travel companions, so I hope you'll display
      and enjoy it.
  - start: '01:41.523'
    end: '01:46.853'
    original: そして、持って出かけそのまま旅に出れちゃう！ブック型ポーチ！
    english: And a book-shaped pouch you can take right out on your travels!
  - start: '01:47.383'
    end: '02:00.673'
    original: そして普段使いから、ご褒美使いまでできるりんご型プレートとカトラリーセットも一緒になっています。ぜひね、おうちでもお外でも楽しんでください。
    english: Plus an apple-shaped plate and cutlery set for everyday or special treats.
      Please enjoy them at home or out!
  - start: '02:00.673'
    end: '02:20.103'
    original: そして今回はシチュエーションボイス「もしもアキロゼと温泉デートに行ったら」、ASMRボイス「夢の中で起きたことと…」そしてASMRボイスもあります！こちらのみんなのことを持ってね、ドキドキできるようなシチュエーションボイスドラマになっているので、ぜひそちらも楽しみにしてください。
    english: And this time, we have a situation voice "If I went on a hot spring date
      with Akirose," ASMR voice "What happened in a dream...", and ASMR voice drama!
      It's packed with heart-pounding situations, so please look forward to those
      too.
  - start: '02:20.893'
    end: '02:37.073'
    original: そしてこちら、なんとフルセット購入の方は、アキロゼ直筆のサインが...ブロマイドチェキにかかれて届いちゃうえええええええ！
    english: And what's more, those who purchase the full set will receive a Polaroid-style
      bromaide with Akirose's handwritten signature! Whaaaat?!
  - start: '02:37.523'
    end: '02:48.333'
    original: はい、アキロゼ書きます！サイン直筆でめちゃ書きたいの！だからフルセット買ってね！
    english: Yes, Akirose will write them! I really want to handwrite your signatures!
      So please buy the full set!
  - start: '02:49.003'
    end: '03:05.533'
    original: ちなみに、特典ボイスも付いてくるよ！やったー！そんな感じの盛りだくさんな内容なのでぜひぜひゲットしてください！はい！
    english: By the way, bonus voice tracks are included too! Yay! It's packed with
      content like this, so please definitely grab it! Yay!
  - start: '03:06.023'
    end: '03:10.983'
    original: 絶対買ってね！今がチャンスだよ！そしてもう一つお知らせがあります！
    english: Definitely buy it! Now's your chance! And I have one more announcement!
  - start: '03:11.393'
    end: '03:24.723'
    original: なんと、本日この配信の後22時15分から、メンバー限定でぷちアンコールライブやっちゃいます！イエーイ！
    english: Today, right after this stream at 22:15, we're holding a member-limited
      mini encore live! Yay!
  - start: '03:25.263'
    end: '03:46.333'
    original: メンバー限定配信では、なんとアンコール曲と今回のステージをもっとね、近い距離で紹介していけたらなと思います！可愛いスクショとかちょっとイチャイチャしたりとか楽しんでもらえたらいいなと思っているので、ぜひぜひメンバー登録のまだの人は忘れずにね！
    english: In the member-limited stream, we'll introduce encore songs and today's
      stage from a closer distance! I hope you'll enjoy cute screenshots and sweet
      moments, so if you haven't registered as a member yet, don't forget!
  - start: '03:47.013'
    end: '03:59.333'
    original: 今だよ！ピース！ピース！はい！ということで、それでは...
    english: Right now! Peace! Peace! Yes! And so, now...
  - start: '04:00.003'
    end: '04:13.333'
    original: アキロゼ生誕祭2023！ありがとうございました！みんなのおかげで最高の誕生日になりました！ありがとう！
    english: Aki Rosenthal Birthday Festival 2023! Thank you so much! Thanks to everyone,
      it was the best birthday ever! Thank you!
  - start: '04:14.343'
    end: '04:31.003'
    original: それでは...またね！メンバーの人...限定配信の準備だ！まだの人...今だぞ！バイバーイ！
    english: Well then... see you later! Members... get ready for the limited stream!
      For those who aren't, now's the time! Bye-bye!
