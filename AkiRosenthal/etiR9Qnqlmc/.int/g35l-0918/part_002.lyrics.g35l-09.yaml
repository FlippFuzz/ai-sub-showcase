    reference_lyrics_og: |-
      どこまでも続くような青の季節は
      四つ並ぶ眼の前を遮るものは何もない
      アスファルト、蝉時雨を反射して
      きみという沈黙が聞こえなくなる
      この日々が色褪せる
      僕と違うきみの匂いを知ってしまっても
      置き忘れてきた永遠の底に
      今でも青が棲んでいる
      今でも青は澄んでいる
      どんな祈りも言葉も
