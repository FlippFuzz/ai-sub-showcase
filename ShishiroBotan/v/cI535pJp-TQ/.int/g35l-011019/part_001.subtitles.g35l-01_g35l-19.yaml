global_summary:
  overall_summary: This YouTube video features the complete 3D birthday live concert
    of Hololive 5th Generation member Shishiro Botan, titled 'Stray & Stay', held
    in September 2026. The concert showcases high-energy cyber-themed performances,
    guest duets and group numbers with fellow Hololive talents across branches (including
    Tokino Sora, Vestia Zeta, Pavolia Reine, Nerissa Ravencroft, Tsunomaki Watame,
    Isaki Riona, Usada Pekora, Himemori Luna, and her NePoLaBo unit members Momosuzu
    Nene, Omaru Polka, and Yukihana Lamy). Interspersed between electrifying song
    covers and original tracks are talk segments announcing new merchandise, her 1st
    solo album 'BOTAN.EXE', the digital release of her new original song 'Stray &
    Stay', and a special upcoming offline event.
