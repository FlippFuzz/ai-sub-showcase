      On a day like every other day, You suddenly stood up and said, “Tonight let’s go see the stars”
      “You say good things once in a while” Said everyone as they laughed On a street with no light We walked while having fun like idiots. In order to crush, The loneliness and uncertainty we were carrying.

      I looked up from a pitch black world The night sky seemed as if it was raining stars I wonder when, I started to Chase after you. Please, somehow Don’t be surprised and listen To these feelings of mine.

      “That’s Deneb, Altair, and Vega”, Your finger pointed at the Summer Triangle. I remembered and looked at the sky. I finally found Vega, But where are you, Altair? If it’s like this, you’re all alone.

      The cheerful you who was one next to me, I couldn’t say a word to you. Truthfully, I understood my feelings for you, Somewhere a long time ago. I found it, but I won’t tell you. “That’s no good, don’t cry” Please let me hear that from you.

      I was a coward and put on a tough face, I pretended to be uninterested.

      But...

      The pain piercing my chest increased Ah, I see. To like someone, Is something like this.

      What’s the matter? Try saying it? My heart is beating I’m fine by your side The truth is cruel.

      I didn’t say it, I couldn’t say it. We can never return.

      To that summer day, To those shining stars. Even now, I still remember. Your laughing face, Your angry face. I loved you.

      It’s strange, isn’t it? Even though I know that. Something you don’t know, A secret for me alone. Across the night, From a distant memory, You pointed with your finger, And in an innocent voice...
