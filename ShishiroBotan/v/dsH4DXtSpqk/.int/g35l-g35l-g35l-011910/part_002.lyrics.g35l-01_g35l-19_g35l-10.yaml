    Addict' hosted by Hololive 5th Generation VTuber Shishiro Botan. The concert features
    solo performances, high-energy covers of cool rock and electronic tracks, guest
    appearances by fellow Hololive talents (including AZKi, Hoshimachi Suisei, Houshou
    Marine, Tsunomaki Watame, and her NePoLaBo unit members Yukihana Lamy, Momosuzu
    Nene, and Omaru Polka), comedic MC segments, and the debut performance of her
    original single 'Connect:Addict'.
