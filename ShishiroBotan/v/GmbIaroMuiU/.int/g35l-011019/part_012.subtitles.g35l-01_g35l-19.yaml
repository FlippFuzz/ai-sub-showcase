global_summary:
  overall_summary: This is Botan Ch. Shishiro Botan's 2025 birthday 3D live concert
    titled 'MUST RELIVE', held on September 8, 2025. The concert features a post-apocalyptic
    narrative where Shishiro Botan travels through a ruined world in search of lost
    music, encountering various Hololive guests (AZKi, Ookami Mio, Tsunomaki Watame,
    Raora Panthera, Aki Rosenthal, Hibisaki Riona, Amane Kanata) and performing a
    setlist composed almost entirely of iconic visual novel and eroge songs, culminating
    in her new original song 'Gaotte Ko!'.
