- start: '03:06.300'
  end: '03:22.000'
  original: '獅白ぼたん: ブランケットなのに袋に収納すればクッションになるから、これがあればどこでもひっそり寝できて、旅のおトムにぴったりかも。コンパクトなのにふかふかで、寝心地もよさそう。収納袋の絵もいい感じ。'
  english: 'Shishiro Botan: It''s a blanket that turns into a cushion when stored
    in its bag, so having this means you can take a quiet nap anywhere—might be the
    perfect companion for a journey. It''s compact yet fluffy, and looks comfortable
    to sleep on. The drawing on the storage bag is nice, too.'
- start: '03:24.500'
  end: '03:42.500'
  original: '獅白ぼたん: こっちは何だろう？「SSRBミニウォレット」か……買い物したり小物を収納するのに財布は必需品なんだよね。小銭もお札も入れられるっていうのも嬉しいな。今使ってるのも古くなってきたし、そろそろ買い替えてもいいかも。'
  english: 'Shishiro Botan: What''s this? An "SSRB Mini Wallet"... A wallet is a must-have
    for shopping and storing small items. It''s also great that it can hold both coins
    and bills. The one I''m using is getting old, so it might be about time to replace
    it.'
- start: '03:43.000'
  end: '03:59.000'
  original: '獅白ぼたん: お、この「ブレスレット」、かっこいい。デザインが馴染みやすいから普段使いしやすそうだし、ライオンの加護もついてるんだー。これを付けてたらキミもライオンになれるかも……なーんて。'
  english: 'Shishiro Botan: Oh, this "Bracelet" looks cool. The design is easy to
    get used to so it seems good for everyday wear, and it even comes with a lion''s
    protection. Wearing this might even turn you into a lion... Just kidding.'
- start: '04:00.000'
  end: '04:21.000'
  original: '獅白ぼたん: ふふ、これかわいいな。ヘルメット被ってる。「SSRBぬいぐるみキーホルダー」……付けてるだけですっごく楽しい気分になれそう。手のひらサイズの間口良い大きさだからバックパックにぶら下げてもいいし、ベルトに付けるのもありかな。これも買っとこっと。'
  english: 'Shishiro Botan: Hehe, this is cute. It''s wearing a helmet. An "SSRB Plush
    Keychain"... Just attaching it seems like it would put you in a super fun mood.
    It''s a good palm-sized dimension so you can hang it on a backpack, or maybe attach
    it to your belt. I''ll buy this too.'
- start: '04:21.850'
  end: '04:50.000'
  original: '獅白ぼたん: どうしよう、全部欲しい……どれにするか迷う……え、これを全部まとめたセットもあるんだ？しかもそれだと、収納袋の絵を描いてるトマリ先生の書き下ろしのポストカードと、直筆サイン、白押メッセージが特典でついてくるのか……うーん……セットでください。'
  english: 'Shishiro Botan: What should I do, I want all of them... I can''t decide
