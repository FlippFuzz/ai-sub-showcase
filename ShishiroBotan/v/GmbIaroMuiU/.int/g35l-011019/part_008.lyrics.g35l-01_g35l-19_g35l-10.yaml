  original: たとえばアキロゼのこの格好が、芸術的に見えるかセクシーに見えるかはあなたたち次第みたいなね♪ふふ
  english: For instance, whether Aki Rosenthal's outfit looks artistic or sexy is
    entirely up to you guys... Fufu~
- start: '01:16.200'
  end: '01:18.140'
  original: え、あー、うん。
  english: Eh, ah... yeah.
- start: '01:18.960'
  end: '01:26.540'
  original: そうだ！せっかくこうして出会えたんだから、いっしょに踊ろっか？あなたとアキロゼの二人で。
  english: That's right! Since we finally met like this, how about we dance together?
    Just you and Aki Rosenthal.
- start: '01:27.160'
  end: '01:31.760'
  original: え、でも私、踊ったことなんてないんだけど。
  english: Eh, but I've never danced before...
- start: '01:32.740'
  end: '01:41.040'
  original: 大丈夫大丈夫！これはあなたの為だけに考えた、踊りっ子アキロゼの「振り付け」だからね？
  english: It's okay, it's okay! This is a choreography I thought up just for you,
    courtesy of dancing Aki Rosenthal, okay?
- start: '01:42.540'
  end: '01:44.200'
  original: ね？ふふ
  english: Right? Fufu~
- start: '02:15.300'
  end: '02:22.500'
  original: 音の鳴らない大地に 恋の歌響けば
  english: If a song of love echoes across the silent earth...
- start: '02:22.900'
  end: '02:31.500'
  original: 黒い歯車 運命が弾けた
  english: The black gears of fate snap and shatter.
- start: '02:34.900'
  end: '02:39.500'
  original: 蘇る 遥かいにしえより
  english: Reviving from the distant past,
- start: '02:39.500'
  end: '02:45.300'
  original: 寂漠の 恋目覚めた
  english: A desolate love awakens.
- start: '02:45.300'
  end: '02:53.300'
  original: 絆を求めて 炎は走り出す
  english: Seeking bonds, the flames start to race.
- start: '02:57.900'
  end: '03:02.100'
  original: 儚いと 再生誓った
  english: Vowing ephemeral rebirth,
- start: '03:02.100'
  end: '03:13.500'
  original: 気高き君の呪縛を
  english: Breaking free from your noble curse...
- start: '03:37.300'
  end: '03:44.300'
  original: 褪せた青い魂 嘘もなげだして
  english: Cast aside even the lies of a faded blue soul,
- start: '03:44.300'
  end: '03:55.700'
  original: 現代も抱えて 歪な恋も愚かさも
  english: Embracing the present era, distorted love, and foolishness alike—
- start: '03:57.100'
  end: '04:05.100'
  original: 突き破り 今二人照らす
  english: Breaking through to illuminate the two of us now.
- start: '04:06.100'
  end: '04:14.900'
