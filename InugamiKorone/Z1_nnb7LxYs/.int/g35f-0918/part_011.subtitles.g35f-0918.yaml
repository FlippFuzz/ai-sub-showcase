  - start: '00:19.800'
    end: '00:23.000'
    original: このね、パンツっていう曲めちゃめちゃ好きで、
    english: and I really love this song called "Pants."
  - start: '00:23.000'
    end: '00:27.500'
    original: あの、ずっと暇な時めちゃめちゃ聴いてたので、今回歌えて嬉しいのと、
    english: I used to listen to it all the time, so I'm happy to sing it,
  - start: '00:27.500'
    end: '00:33.200'
    original: ころねすきーにね、ピンクのパンツを穿いて踊ってもらえたのが、凄く楽しかったので、
    english: and it was so much fun seeing Koronesuki wearing pink pants and dancing!
  - start: '00:33.200'
    end: '00:36.400'
    original: みんな踊ってくれてありがとう！
    english: Thank you everyone for dancing!
  - start: '00:37.000'
    end: '00:41.300'
    original: はい、でね、今回、マフィオーサのライブ初お披露目をしたくて、
    english: Yes, and this time, I wanted to debut MafiOSA live,
  - start: '00:41.300'
    end: '00:46.400'
    original: 全部ね、ラップ曲でまとめてみたんですけど、
    english: so I put together a set of all rap songs.
  - start: '00:46.400'
    end: '00:48.000'
    original: どうだったかな？
    english: How was it?
  - start: '00:48.000'
    end: '00:52.000'
    original: ちょっと初めての試みだったから、すごいね、
    english: It was a first-time attempt,
  - start: '00:52.000'
    end: '00:56.400'
    original: あの、準備段階から今日に至るまで、めっちゃドキドキで、
    english: so I was really nervous from the preparation stage until today.
  - start: '00:56.400'
    end: '00:58.200'
    original: なんか、みんな楽しんでくれるかな、とか思ってたんだけど、
    english: I was wondering if everyone would enjoy it...
  - start: '00:58.200'
    end: '01:02.500'
    original: だからね、みんなが楽しんで、ノリノリになってくれてたら嬉しいなと思います。
    english: So, I hope you all enjoyed it and got into the groove!
  - start: '01:03.000'
    end: '01:08.500'
    original: でね、原曲知らないよって方がね、結構いると思うんですけど、結構はいないか。いると思うんですけど、
    english: I think there are probably some who don't know the original songs,
  - start: '01:08.500'
    end: '01:15.000'
    original: もしね、そういう方はぜひ、めちゃめちゃカッコいいのでね、全部の曲。原曲ぜひ聞いてみてください。
    english: but if so, please check them out, because all of the original songs are
      super cool!
  - start: '01:15.000'
    end: '01:22.500'
    original: あ、最後に歌ったマフィオーサもですね、めちゃめちゃ原曲カッコいいので、ぜひみんな聞いてね！
    english: Ah, the last song "MafiOSA" is also super cool in its original version,
      so please listen to it!
  - start: '01:23.000'
    end: '01:27.500'
    original: はい、ということで、今回もあります！周年グッズです！こちら！
    english: Yes! So, we have them again this time! Anniversary goods! Here they are!
  - start: '01:27.500'
    end: '01:29.800'
    original: 急に来る。
    english: That came out of nowhere!
  - start: '01:30.000'
    end: '01:36.500'
    original: はい。え、今回はですね、なんと、うすた京介先生に描き下ろしていただきました！ありがとうございます！
    english: This time, incredibly, Usuta Kyosuke-sensei drew them for us! Thank you
      so much!
  - start: '01:37.000'
    end: '01:39.000'
    original: 1つずつ見ていきますかね。
    english: Let's look at them one by one.
  - start: '01:39.000'
    end: '01:45.000'
    original: え、最初はですね、YB-2、久しぶりに見ました。え、うちのブランドYB-2です。
    english: First up is YB-2, it's been a while since I saw it. Yes, my brand is
      YB-2.
  - start: '01:45.000'
    end: '01:49.200'
    original: YB-2の、え、うすた先生バージョンのね、パーカーです。
    english: It's the Usuta-sensei version of the YB-2 hoodie.
  - start: '01:49.200'
    end: '01:54.800'
    original: 裏面に、イラストが来る感じですね。で、胸元にYB-2って入ってて、
    english: The illustration is on the back. And it has "YB-2" on the chest,
  - start: '01:54.800'
    end: '01:59.000'
    original: 腕にね、あの、ころねのモチーフの骨が入っております。
    english: and my motif, bones, on the sleeves.
  - start: '01:59.000'
    end: '02:02.000'
    original: これめちゃめちゃカッコいいと思うのでね、お楽しみに！
    english: I think this is super cool, so please look forward to it!
  - start: '02:03.000'
    end: '02:05.000'
    original: はい、続いてこちら。
    english: Next is this.
  - start: '02:05.000'
    end: '02:08.500'
    original: こちらはですね、あの、パーカーと同じイラストのサコッシュです。
    english: This is a sacoche with the same illustration as the hoodie.
  - start: '02:08.500'
    end: '02:15.000'
    original: 結構ね、なんか、エキスポとかフェスとか、なんかみんなのイベントとかに来るときに、サコッシュ使ってる人結構いたなと思って、
    english: I noticed quite a few people using sacoches when they come to Expos,
      festivals, or other events,
  - start: '02:15.000'
    end: '02:20.500'
    original: ころねもサコッシュ出したい！っていうことでサコッシュも出しました。皆さんぜひ使ってください！
    english: so I wanted to make one too! So we made a sacoche. Everyone, please use
      it!
  - start: '02:21.000'
    end: '02:23.000'
    original: 続いてこちら！
    english: Next up is this!
  - start: '02:23.000'
    end: '02:27.500'
    original: こちらはですね、えっと、ごめんなさいね。
    english: This is... sorry about that.
  - start: '02:27.500'
    end: '02:35.000'
    original: |
      え、ラップドッグキャップ！こちらはですね、え、ひこさん先生のデザインで出させていただきました。ありがとうございます。
    english: The Rap Dog Cap! This was designed by Hikosan-sensei. Thank you so much!
  - start: '02:35.000'
    end: '02:40.000'
    original: え、ここにね、ころねの骨がクロスしてて、横にまたこれYB-2です。これもYB-2なのでね、
