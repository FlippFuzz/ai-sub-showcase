  - start: '00:10.200'
    end: '00:16.100'
    original: みんな、マフィオーサ、ライブ初お披露目、どうだった？
    english: Everyone! How was the live debut of MafiOSA?
  - start: '00:16.100'
    end: '00:19.800'
    original: ちょっと、パンツとマフィオーサで、2曲続けてだったんですけど、
