      Korone rapping.
  - start: '03:11.000'
    end: '03:15.000'
    original: ぜひ皆さん全種類目指してよかったら買ってみてください。
    english: So if you'd like, try to get all types! Please check them out.
  - start: '03:15.000'
    end: '03:22.500'
    original: |
      通常衣装と、え、YB-2のジャンプスーツと、グッドドック衣装と、ラップ衣装ですね。よかったら、はい、こちらもご検討ください。
    english: We have the usual outfit, the YB-2 jumpsuit, the Good Dog outfit, and
      the rap outfit. Please consider getting these!
  - start: '03:25.000'
    end: '03:31.000'
    original: |
      そして、フルセットの購入特典は、え、うすた先生描き下ろしのポストカード。
    english: And the full set purchase bonus is a postcard drawn by Usuta-sensei!
  - start: '03:31.000'
    end: '03:37.000'
    original: |
      え、数量限定版もありますけれども、めちゃめちゃ、あの、用意しておりますので、
    english: We also have a limited quantity version, but we have prepared a lot,
  - start: '03:37.000'
    end: '03:42.500'
    original: あの、急がないで大丈夫です。あの、マジで、結構用意したので、あの、ゆっくりご購入ください。
    english: so no need to rush. Seriously, we prepared plenty, so please take your
      time with your purchase.
  - start: '03:42.500'
    end: '03:47.000'
    original: |
      はい、で、通常バージョンはね、箔押しの複製サイン入りとなっております。
    english: Yes, and the regular version comes with a foil-stamped duplicated signature.
  - start: '03:47.500'
    end: '03:53.000'
    original: |
      はい、ということで、今回のライブもみんなたくさん見てくれてありがとうございました！
    english: So, thank you so much everyone for watching this live show!
  - start: '03:54.000'
    end: '03:59.000'
    original: |
      以上、Lazy Dog Nightでした！みんな本当いつもありがとうね！
    english: That was Lazy Dog Night! Thank you all so much as always!
  - start: '03:59.000'
    end: '04:03.000'
    original: また会おう！またねー！
    english: Let's meet again! See ya!
