  - start: '02:40.000'
    end: '02:45.000'
    original: サコッシュと、サコッシュは、サコッシュもYB-2か。
    english: so the sacoche... wait, the sacoche is also YB-2, right?
  - start: '02:45.000'
    end: '02:50.000'
    original: パーカーとサコッシュと帽子、え、全部YB-2のブランドでございます。よろしくお願いします。
    english: The hoodie, sacoche, and cap are all under the YB-2 brand. Thank you!
  - start: '02:53.000'
    end: '02:54.500'
    original: はい、次！
    english: Okay, next!
  - start: '02:54.500'
    end: '03:02.000'
    original: これはYB-2じゃない、ころねのランダムラバーストラップ！こちらはフカヒレママに描き下ろしてもらいました！ママありがとう！
    english: This is not YB-2! Korone's Random Rubber Strap! This was drawn by Fukahire-mama!
      Thank you, Mama!
  - start: '03:03.000'
    end: '03:05.000'
    original: こちらね、4種類ランダムで。
    english: These are random among 4 types.
  - start: '03:05.000'
    end: '03:11.000'
    original: で、今回ね、ラップの曲が多かったということで、あの、ラップをしてるね、ころねのイラストもありますので、
