name: part_010
total_attempts: 1
video_duration_ms: 300008
subtitles_prompt_version: 18
responses:
- subtitles:
  - start: '00:00.300'
    end: '00:01.300'
    original: なんと今年はあのキャラからも…？
    english: Could it be... even from that character this year?
  - start: '00:02.100'
    end: '00:05.100'
    original: それではVTRどうぞ！
    english: Now, roll the VTR!
  - start: '00:07.100'
    end: '00:09.100'
    original: Happy Birthday ころね！
    english: Happy Birthday, Korone!
  - start: '00:09.800'
    end: '00:11.400'
    original: 元気にやってるか？
    english: How's it going?
  - start: '00:12.300'
    end: '00:14.500'
    original: 俺はソニック、ソニック・ザ・ヘッジホッグだ！
    english: I'm Sonic, Sonic the Hedgehog!
  - start: '00:16.100'
    end: '00:19.400'
    original: で、一緒に来てくれたこいつが…ナックルズ！
    english: And the guy who came with me is... Knuckles!
  - start: '00:20.500'
    end: '00:22.500'
    original: ナックルズ・ザ・エキドゥナだ！
    english: Knuckles the Echidna!
  - start: '00:23.500'
    end: '00:29.800'
    original: まぁ、お前はゲームプレイで俺をかっこよく見せてくれたらしいし、ソニステの借りもあるしな。
    english: Well, you made me look cool in your gameplay, and we've got the Sonic
      Station debt to settle too.
  - start: '00:31.100'
    end: '00:33.400'
    original: だから、まぁ、おめでとさん！
    english: So, uh, congratulations!
  - start: '00:35.800'
    end: '00:40.800'
    original: タク、普通にお祝いを言えばいいのに、ナックルズはまわりくどいぜ。
    english: Geez, he could just say happy birthday normally. Knuckles is so roundabout.
  - start: '00:41.800'
    end: '00:47.800'
    original: 相変わらずすごい人気だな！今も長い時間配信頑張ってるのか？
    english: You're as popular as ever! Still working hard on those long streams?
  - start: '00:49.000'
    end: '00:55.200'
    original: 俺なんか同じ場所に１０分と居られないから、お前って、ほんとにすごいと思うぜ！
    english: I can't stay in one place for even 10 minutes, so I really think you're
      amazing!
  - start: '01:00.000'
    end: '01:04.900'
    original: でもあんまり無理はするなよ。気合と根性にしたって、それはよく寝た頭からわいてくるもんだからな。
    english: But don't push yourself too hard. Even drive and grit come from a well-rested
      brain, you know.
  - start: '01:05.200'
    end: '01:09.500'
    original: 今度会ったとき、青い顔してやがったらぶっとばすぞ！
    english: Next time we meet, if you're looking pale, I'll beat you up!
  - start: '01:10.000'
    end: '01:15.900'
    original: Hey Knuckles! 素直に体に気を付けて頑張ってって言えばよくな。
    english: Hey Knuckles! You could just honestly say "take care of yourself and
      do your best."
  - start: '01:18.000'
    end: '01:22.500'
    original: ってなわけで、俺たちからお前に誕生日のお祝いメッセージだ☆
    english: That being said, this is our birthday congratulatory message to you☆
  - start: '01:23.000'
    end: '01:28.500'
    original: これからも応援よろしくな！See You～ またな！
    english: Keep supporting us from now on! See you~ Later!
  - start: '01:30.500'
    end: '01:36.500'
    original: えーーー！うそ、うそ、うそ！
    english: Eeeh?! No way, no way, no way!
  - start: '01:37.000'
    end: '01:43.000'
    original: え、ソニック、ソニックチームの皆さん、とソニックとナックルズだって、ありがとうございます！
    english: Eh, Sonic, everyone on the Sonic Team, Sonic and Knuckles too?! Thank
      you so much!
  - start: '01:43.100'
    end: '01:51.500'
    original: あのね、ソニックチームのみなさんみんな優しくってね、本当大好きです！あのこれからも、あの、お世話になり、なると思うので、え、めっちゃ嬉しい！え、めっちゃ嬉しい！
    english: You know, everyone on the Sonic Team is so kind, I really love them!
      Um, I think I'll be in their care from now on too, so... ah, I'm so happy! Ah,
      I'm so happy!
  - start: '01:54.000'
    end: '01:58.000'
    original: え、ちゃんと歌えるかな？ありがとうございました！
    english: Eh, can I even sing properly now? Thank you very much!
  - start: '01:59.000'
    end: '02:06.800'
    original: え、なんかもう1本あるらしい。え、誰？あ、じゃあもう1本あるみたいなので、おねがいします、どうぞ！
    english: Eh, it seems there's another one. Eh, who? Ah, well, it looks like there's
      another, please go ahead!
  - start: '02:08.500'
    end: '02:15.500'
    original: レベルファイブの日野です。え、ころねさん、10月1日は誕生日ということでおめでとうございます！
    english: I'm Hino from Level-5. Uh, Korone-san, since October 1st is your birthday,
      congratulations!
  - start: '02:16.200'
    end: '02:24.500'
    original: え、こないだやらせてもらったコラボもですね、僕ら大変あの、いい結果を出しておりまして、え、喜んでおります。スタッフ一同。
    english: The collaboration we did recently also produced some great results for
      us, and, uh, all the staff are delighted.
  - start: '02:25.000'
    end: '02:34.000'
    original: これからもですね、あの、もう、あの、仲良くさせていただきたいと思いますので、レベルファイブ共々よろしくお願いします！本当におめでとうございます！
    english: We hope to continue getting along well with you, so please support Level-5
      as well! Huge congratulations!
  - start: '02:38.000'
    end: '02:46.000'
    original: 日野社長！え、本物？うれしすぎ！ありがとうございます！
    english: President Hino! Eh, the real one? I'm so happy! Thank you so much!
  - start: '02:46.500'
    end: '02:51.500'
    original: えーと、妖怪ウォッチ大好きです。あ、妖怪ウォッチ以外も大好きです。ありがとうございます！
    english: Um, I love Yo-kai Watch. Ah, I love things other than Yo-kai Watch too.
      Thank you so much!
  - start: '02:52.000'
    end: '02:57.500'
    original: あーうれしい、ちょっともう言葉が出てきません。あの、もう歌えないかもしれない。
    english: Ah, I'm so happy, I'm out of words. Um, I might not even be able to sing
      anymore.
  - start: '02:58.500'
    end: '03:11.800'
    original: ということで、じゃあ、え、待って？え、え、もう1本ある、もう1本あるみたいです。ちょっと待って、まだ、ちょっと紹介しきれてないそのソニックチームと日野社長と、え、じゃあ、あの、お願いします、どうぞ！
    english: So, well, eh, wait? Eh, eh, there's another one, it seems there's another
      one. Wait, I haven't quite finished introducing the Sonic Team, President Hino,
      and... um, well, please go ahead, go ahead!
  - start: '03:12.500'
    end: '03:16.800'
    original: はじめまして。ドラゴンクエストゲームデザイナーの堀井雄二です。
    english: Nice to meet you. I'm Yuji Horii, game designer for Dragon Quest.
  - start: '03:17.500'
    end: '03:24.500'
    original: 犬神ころねさん、お誕生日おめでとうございます！
    english: Inugami Korone-san, happy birthday!
  - start: '03:25.000'
    end: '03:29.500'
    original: ころねさんはDQが好きとのことで、プレイしていただきとても嬉しく思っています。
    english: I heard you like DQ, Korone-san, and we're very happy you've been playing
      it.
  - start: '03:30.000'
    end: '03:35.800'
    original: ころねさんのDQⅢのゲーム配信は見させていただきましたよ。
    english: I watched your DQIII game streams, you know.
  - start: '03:36.000'
    end: '03:55.800'
    original: ゲーム内の性格診断テストで、「西に進むべし」と看板に書かれているところで、西は右側だと思って右に行ったら、落とし穴に落ちてしまいましたね。（西は右側が正解）その結果、勇者ころねの性格診断が「わがまま」になってしまいました。その節は大大変失礼いたしました。（もしかして当たっていました？）
    english: In the in-game personality test, where a sign said "Proceed West," you
      thought west was on the right and went right, falling into a pit trap. (West
      was actually on the left). As a result, Hero Korone's personality diagnosis
      became "Selfish." I offer my sincere apologies for that incident. (Was it perhaps
      spot on?)
  - start: '03:56.000'
    end: '04:06.000'
    original: 他にも洞窟の宝箱でミミックの罠にハマったり、モンスター格闘場で高倍率を当てたりととても楽しい配信をありがとうございます。
    english: Also getting caught in Mimic traps in cave chests, hitting high odds
      at the monster arena, thank you for such entertaining streams.
  - start: '04:07.000'
    end: '04:13.500'
    original: DQシリーズはこれまでたくさん出ておりますので、また別のシリーズも遊んでいただきたいですし、
    english: There are many DQ series games out so far, so we'd love for you to play
      other titles as well,
  - start: '04:13.800'
    end: '04:23.000'
    original: DQXオフラインや、12月に発売するDQトレジャーズ、その先にも色々開発していますので是非遊んでくださいね！
    english: and please play DQX Offline, DQ Treasures releasing in December, and
      we have various things in development beyond that too!
  - start: '04:24.000'
    end: '04:36.900'
    original: ところで、ころねさんが初めて遊んだDQはⅥと聞きました。なんとここに1995年に発売されたスーパーファミコン版のDQⅥの新品ゲームがあります。
    english: By the way, I heard the first DQ you ever played was VI. Well, here I
      have a brand-new copy of the Super Famicom version of DQVI released in 1995.
  - start: '04:37.000'
    end: '04:40.500'
    original: これをプレゼントしたいと思います。
    english: I'd like to present this to you.
  - start: '04:41.000'
    end: '04:47.500'
    original: 堀井さん、それに堀井さんのサインをころねさんあてに書いていただくことってできますかね？
    english: Horii-san, would it be possible to have you write your autograph addressed
      to Korone-san on it?
  - start: '04:48.000'
    end: '04:50.000'
    original: いいですよ。じゃあ書きましょうか。はい。
    english: Sure thing. Shall I write it? Okay.
  - start: '04:50.100'
    end: '05:00.000'
    original: やった！ころねさん、やりましたよ！じゃあこれ、はいはい。緊張しますね。
    english: Yay! Korone-san, we did it! Then here, right here. This is nerve-wracking.
