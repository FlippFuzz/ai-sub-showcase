- start: '04:41.500'
  end: '04:43.300'
  original: ダブルコロネだよ。
  english: It's double Korone.
- start: '04:43.600'
  end: '04:46.300'
  original: マルチバースの幕開けだ！
  english: It's the dawn of the multiverse!
- start: '04:47.100'
  end: '04:49.200'
  original: え、二人でこれ喋れんのこれ？
  english: Wait, can the two of you talk like this?
- start: '04:49.300'
  end: '04:52.500'
  original: そうだよ。ええ、ゴージャスさん、うわ、喋ってる！
  english: That's right. Eh, Gorgeous-san—whoa, you're talking!
- start: '04:54.000'
  end: '05:00.000'
  original: え？ちょっと待って、ちょっとちょっと、二人にしてちょっと、あの、僕のちょっと、あの、手を上げ下げゲームちょっとやってもらっていい？
  english: Huh? Wait a second, hold on, could you two do my little hand raise-and-lower
