- start: '04:12.300'
  end: '04:14.500'
  original: まあね、そう、まあね、そうね。
  english: Well yeah, right, exactly, yeah.
- start: '04:14.500'
  end: '04:18.500'
  original: 全部かわいいんだよ！五等分見てたらかわいいんだよね。
  english: Everything is cute! Watching Gotoubun makes her so cute.
- start: '04:19.300'
  end: '04:23.200'
  original: え、でしょ？このね、かわいく踊れるように頑張ったんだ。
  english: Right? She worked hard so she could dance so cutely.
- start: '04:23.200'
  end: '04:25.500'
  original: そうだよね、いいこと言うね、うんうん。
  english: That's right, you're saying good things, yeah, yeah.
- start: '04:25.800'
  end: '04:27.500'
  original: あれ？
