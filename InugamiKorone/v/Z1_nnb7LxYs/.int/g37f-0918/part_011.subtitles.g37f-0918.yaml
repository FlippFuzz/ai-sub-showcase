  thoughts: |+
    **A Korone's Thoughts on a Night of Rap and Merchandise**

    Alright, let's break this down. That was "LAZY DOG NIGHT!", a blast! Just finished that performance, and my mind's still racing a little. That first reveal of the *Mafiosa* live performance...how did that go? I was so excited to do "PUNCH" and "Mafiosa" back-to-back. "PUNCH", that song... I love it. I've listened to it so much in my free time, so it was fantastic to get to sing it this time. And it was so much fun seeing the Koronesukis dancing in their pink boxers! Thank you all so much for dancing along!

    This time, I really wanted to debut "Mafiosa" live, and I decided to put together a full setlist of rap songs. I was a bit nervous about this, you know? It was the first time I've tried something like this. From the preparation stage right up until today, my heart was just pounding. I was wondering, would everyone have fun? But I hope you all enjoyed it and got into the groove!

    For those who aren't familiar with the original songs, they're super cool. If you don't know the originals, please check them out! And that "Mafiosa" I did at the end... that original version is also super cool. Give it a listen!

    Okay, time for the goods! Time for the anniversary merchandise! This came fast! And this year, Kyosuke Usuta-sensei drew the illustrations! Thank you so much! Let's take a look. First, YB-2 makes a return! Yes, my brand YB-2! We have the YB-2 hoodie, Usuta-sensei version! The illustration is on the back, and "YB-2" is on the chest with Korone's signature bone motif on the sleeves. I think this looks super cool, so look forward to it!

    Next up, we have a sacoche featuring the same illustration as the hoodie! I've been seeing more people using sacoches at expos and events, so I wanted to make one too! Please be sure to use it! And next, the "RAP DOG Cap"! This was designed by Hikosan-sensei! Thank you so much! Korone's bones crossed, and "YB-2" is on the side again! The hoodie, sacoche, and cap are all part of the YB-2 brand! Please check them out!

    Oh, and there's the "Not-YB-2 Korone Random Rubber Strap"! These were specially drawn by Fukahire-mama! Thank you, Mama! There are four random designs, and since there were a lot of rap songs this time, there's even an illustration of me rapping! Try to collect them all! And there is the default outfit, the YB-2 jumpsuit, the GOOD DOG outfit, and the rapper outfit! Please consider getting these too!

    The bonus for purchasing the full set is a postcard drawn by Usuta-sensei! There is a limited-quantity version, but we've prepared plenty of them. No need to rush; take your time! And the standard version comes with a foil-stamped duplicate signature. Thank you all so much for watching today's live stream!

    That was "LAZY DOG NIGHT!" Thank you so much, as always! Let's meet again! See ya!


