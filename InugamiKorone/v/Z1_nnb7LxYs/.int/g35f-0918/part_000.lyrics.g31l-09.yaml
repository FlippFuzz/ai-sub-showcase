      Turn up the radio, yes, I can hear it again today,
      The stereo flowing, swayed by the wind,
      The rhythmic beat carved by my shoulders,
      I'll put my feelings into this rhyme and deliver it,
      Right under the clear, sunny sky,
      We aimed for a distant future,
      Grip the master key and depart,
      Kick down once in the middle of the crowd,
      Thinking about the days of struggle now,
      Mercy overflows every time I feel gratitude,
      That defensive battle where we sharpened our skills,
      This is still the front line,
      The unwavering pride I got from my father,
      The great compassion my mother gave me,
      The warm tenderness I receive from you,
      To live and survive as food for tomorrow,
      I got sound. I got feel.
      I got beautiful days
      I got song. I got love.
      I got grateful days
      I got it
      You make me happy, when sky's gray
      Darling, my darling
      Thank you father, mother, and my friend
      I was born in Tokyo, raised on hip hop,
      Most of the guys who look bad are my friends,
      I'm mostly the same as the guys who look bad,
      I've walked the back streets and seen this town,
      Shibuya, Roppongi, yes, early in adolescence,
      I fell for this,
      I left my bag at high school,
      I really caused trouble for my parents,
      But time passed, and now I'm on a magazine cover,
      A 'don dada' who throws weight around everywhere,
      Once I grab the mic, I'm truly No. 1,
      I'm a top ranker representing Tokyo,
      Yes, I was given life in this land, in this country,
      Given an invincible mic by Jah,
      To my friends, parents, and fans,
      I'm grateful again today as I advance on the rough off-road,
      I got sound. I got feel.
      I got beautiful days
      I got song. I got love.
      I got grateful days
      I got it
      You make me happy, when sky's gray
      Darling, my darling
      Thank you father, mother, and my friend
      We were born and raised in the land of the rising sun,
      Now we step on the earth like this,
      Always opening a new page,
      Let's go on a journey, to each of our stages,
      Writing down the joy and gratitude here,
      A true companion to perform with,
      Depicting the era without hiding anything,
      Shaking off the pressure, scattering reflections,
      Let's pour in the overflowing emotions,
      Affection that never runs dry no matter what day it is,
      Diving into the battlefield without flinching,
      The lily emblem that blooms without withering,
      In the late afternoon when the gentle wind passes through,
