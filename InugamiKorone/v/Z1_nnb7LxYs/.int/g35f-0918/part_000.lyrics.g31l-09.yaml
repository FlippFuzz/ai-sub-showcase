      Puddles reflecting the sunlight,
      Praising the joy of the days here,
      Putting the throbbing of this chest into a song,
      Feeling what's here in my hands every day,
      I got sound. I got feel.
      I got beautiful days
      I got song. I got love.
      I got grateful days
      I got it
      You make me happy, when sky's gray
