  overall_summary: This YouTube video features Inugami Korone's 7th Anniversary 3D
    Live titled 'Lazy DOOG Night!'. Centered around a rap-heavy setlist and energetic
    dance performances, the live stream includes special guest appearances by Hololive
    members AZKi, Shirogane Noel, Houshou Marine, and Usada Pekora. Korone performs
    covers and original rap tracks, debuts her new rap song 'Mafioso', showcases collaboration
    outfits, and presents her 7th-anniversary merchandise line designed by Usada Kyosuke
    and Fukahire.
