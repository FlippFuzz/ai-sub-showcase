    english: Yes, next is this! This is a sacoche with the same illustration as the
      hoodie. I noticed quite a few people using sacoches when coming to events like
      Expos and festivals, so I wanted to release one too, and we released a sacoche!
      Everyone, please use it a lot!
  - start: '02:16.814'
    end: '02:30.294'
    original: 続いてこちら！こちらはですね、ええと、ごめん なさいね。え、ラップドッグキャップ！こちらをですね、え、ひこさん先生のデザインで、あの出ささせていただきました！ありがとうございます！
    english: Next is this! This is, um, sorry about that. Um, the Rap Dog Cap! We
      had Hikosan-sensei design this one! Thank you very much!
  - start: '02:30.934'
    end: '02:47.384'
    original: え、ここにね、こねの骨がクロスしてて、横にまたこれYB-2です。これもYB-2なのでね、サコッシュと、あ、サコッシュも、あ、サコッシュもYB-2か。パーカーとサコッシュと帽子、え、全部YB-2のブランドでございます。よろしくお願いします！
    english: Um, Korone's bones are crossed here, and on the side, it's YB-2 again.
      This is also YB-2, so... wait, is the sacoche YB-2 too? The hoodie, sacoche,
      and hat are all from the YB-2 brand. Please look forward to them!
  - start: '02:48.334'
    end: '03:00.084'
    original: はい、次！これはYB-2じゃない、こねのランダムラバーストラップ！こちらね、フカヒレママに描き下ろしてもらえました！ママありがとう！
    english: Next! This one is not YB-2, Korone's random rubber strap! We had Fukahire
      Mama draw this one! Mama, thank you!
  - start: '03:00.084'
    end: '03:20.184'
    original: こちらね、4種類ランダムで、で、今回ね、ラップの曲が多かったということで、あの、ラップをしてるね、こねのイラストもありますので、ぜひ皆さん全種類目指してよかったら買ってみてください！通常衣装と、YB-2のジャンプスーツと、ドッグ、え、グッドドッグ衣装と、ラップ衣装ですね。よかったらはい、こちらもご検討ください。
    english: There are 4 random types, and since there were a lot of rap songs this
      time, there are also illustrations of Korone rapping, so please try to collect
      all types and buy them if you like! There's the default outfit, the YB-2 jumpsuit,
      the Good Dog outfit, and the rap outfit. Please consider these as well!
  - start: '03:20.354'
    end: '03:43.764'
    original: そして、フルセットの購入特典は、え、うすた先生描き下ろしのですね、ポストカード！数量限定版もありますけれども、めちゃめちゃ、あの、用意しておりますので、あの、急がないで大丈夫です。あの、マジで、結構用意したので、あの、ゆっくりご購入ください！で、通常バージョンはね、箔押しの複製サイン入りとなっております。
    english: And the full set purchase bonus is a postcard newly drawn by Usada-sensei!
      There's also a limited quantity version, but we've prepared plenty of them,
      so you don't need to rush. Seriously, we prepared quite a lot, so please purchase
      at your leisure! And the regular version comes with a foil-stamped replica signature.
  - start: '03:43.854'
    end: '03:56.884'
    original: はい、ということで、今回のライブもみんなたくさん見てくれてありがとうございました！以上、レイジードッグナイトでした！みんな本当いつもありがとね！また会おう！またね！
    english: Yes, and so thank you all so much for watching my live performance today!
      That concludes "Lazy DOOG Night"! Thank you all so much as always! See you again!
      Bye-bye!
