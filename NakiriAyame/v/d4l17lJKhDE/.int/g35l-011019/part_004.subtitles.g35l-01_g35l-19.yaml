    'Dream Festival‼ ～Nakiriayame 7th BirthDay～', broadcasted on her official YouTube
    channel on December 13, 2024. Featuring a total of 15 guest talents from Hololive
    across various generational groups, the stream showcases elaborate circus and
    amusement park-themed stage stages, dynamic camera work with staircase lifts,
    and a diverse setlist of 10 musical performances ranging from solo songs to duets
    and group numbers. Additionally, Ayame announces her 2024 birthday commemorative
    merchandise collection and concludes with celebratory closing remarks and credits.
