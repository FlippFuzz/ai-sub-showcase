global_summary:
  overall_summary: This video is Nakiri Ayame's 7th anniversary 3D live stream titled
    'Tenshō Ryōka' (~天女繚華~), broadcast on her YouTube channel on September 3, 2025.
    The live stream features a traditional Japanese theme centered around a newly
    revealed celestial maiden ('Tennyo') 3D costume and shrine stage. Throughout the
    concert, Nakiri Ayame performs a series of cover songs and original tracks, joined
    by guest hololive talents including AZKi, Usada Pekora, Shirakami Fubuki, Ookami
    Mio, Sakura Miko, Shiranui Flare, Amane Kanata, and Houshou Marine. The stream
    also includes merchandise announcements, a showcase of her new custom microphone,
    and the premiere announcement of her brand-new original song 'Hanafubuki'.
