  domain_glossary:
  - term: hololive
    meaning: A virtual YouTuber (VTuber) agency owned by COVER Corp featuring virtual
      idols and entertainers.
  - term: 2nd Generation
    meaning: The second batch of hololive talents debuting in 2018, consisting of
      Nakiri Ayame, Yuzuki Choco, Shion, Aqua, and Subaru.
  - term: 3D Live
    meaning: A live concert stream where talents perform using 3D avatars on a virtual
      stage.
  - term: Tennyo
    meaning: Celestial maiden or goddess in traditional Japanese folklore, serving
      as the central motif for this 7th anniversary live stream.
  - term: Hanafubuki
    meaning: A snowstorm of cherry blossom petals, also the title of Nakiri Ayame's
      original song premiered in this live.
